<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Consensus, Scaling & Partitioning</title>
<style>
  :root{ --gold:#c9a15b; }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;font-family:'Helvetica Neue',Arial,sans-serif;}
  #stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}
  #canvasWrap{position:relative;width:100%;max-width:calc(100vh * 16 / 9);aspect-ratio:16/9;background:#000;box-shadow:0 0 60px rgba(0,0,0,.8);}
  svg{width:100%;height:100%;display:block;cursor:pointer;}
  .ui{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:7px;z-index:10;flex-wrap:wrap;padding:0 20px;}
  .dot{width:6px;height:6px;border-radius:50%;background:#2a2a2a;cursor:pointer;transition:background .2s, transform .2s;}
  .dot.active{background:var(--gold);transform:scale(1.4);}
  .navhint{position:absolute;bottom:34px;right:22px;color:#4a4a4a;font-size:11px;letter-spacing:.5px;z-index:5;}
  .counter{position:absolute;top:14px;right:22px;color:#4a4a4a;font-size:12px;z-index:5;}
  .arrows{position:absolute;top:50%;transform:translateY(-50%);width:100%;display:flex;justify-content:space-between;pointer-events:none;padding:0 6px;z-index:5;}
  .arrows span{pointer-events:auto;color:#3a3a3a;font-size:22px;cursor:pointer;padding:10px;user-select:none;}
  .arrows span:hover{color:var(--gold);}
</style>
</head>
<body>
<div id="stage"><div id="canvasWrap">
  <svg id="svg" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="counter" id="counter"></div>
  <div class="navhint">&larr; &rarr; navigate &middot; space advance &middot; r replay</div>
  <div class="arrows"><span id="prevBtn">&#10094;</span><span id="nextBtn">&#10095;</span></div>
</div></div>
<div class="ui" id="dots"></div>

<script>
/* ============================= ENGINE ============================= */
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
const C={blue:'#5c8fc9',orange:'#cf9a5c',green:'#5ec98a',red:'#d16565',gold:'#c9a15b',
         gray:'#6b6b6b',dim:'#262626',dim2:'#3a3a3a',white:'#e9e9e9',dimtext:'#8f8f8f',bg:'#050505'};

function elm(tag,attrs={},parent=svg){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs) if(attrs[k]!==undefined) e.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function clearSvg(){ while(svg.firstChild) svg.removeChild(svg.firstChild); }
function group(parent=svg){ return elm('g',{},parent); }
function txt(x,y,str,opt={}){
  const {size=24,color=C.white,anchor='middle',weight=400,parent=svg,italic=false,opacity=1,family}=opt;
  const t=elm('text',{x,y,fill:color,'font-size':size,'text-anchor':anchor,
      'font-family':family||"'Helvetica Neue',Arial,sans-serif",'font-weight':weight,
      'font-style':italic?'italic':'normal',opacity},parent);
  t.textContent=str;
  return t;
}
function mathTxt(x,y,str,opt={}){
  return txt(x,y,str,Object.assign({family:"Georgia,'Cambria Math',serif"},opt));
}
function multi(x,y,lines,opt={}){
  const {size=22,color=C.white,anchor='middle',lh=1.4,parent=svg,weight=400}=opt;
  const g=group(parent);
  lines.forEach((ln,i)=>txt(x,y+i*size*lh,ln,{size,color,anchor,parent:g,weight}));
  return g;
}
function circle(cx,cy,r,opt={}){
  const {fill='none',stroke=C.white,sw=2,parent=svg,opacity=1,dash}=opt;
  const a={cx,cy,r,fill,stroke,'stroke-width':sw,opacity}; if(dash)a['stroke-dasharray']=dash;
  return elm('circle',a,parent);
}
function line(x1,y1,x2,y2,opt={}){
  const {stroke=C.white,sw=2,parent=svg,opacity=1,dash}=opt;
  const a={x1,y1,x2,y2,stroke,'stroke-width':sw,opacity}; if(dash)a['stroke-dasharray']=dash;
  return elm('line',a,parent);
}
function rect(x,y,w,h,opt={}){
  const {fill='none',stroke=C.white,sw=2,parent=svg,rx=8,opacity=1}=opt;
  return elm('rect',{x,y,width:w,height:h,fill,stroke,'stroke-width':sw,rx,opacity},parent);
}
function pathEl(d,opt={}){
  const {stroke=C.white,sw=2,fill='none',parent=svg,opacity=1,dash}=opt;
  const a={d,stroke,'stroke-width':sw,fill,opacity}; if(dash)a['stroke-dasharray']=dash;
  return elm('path',a,parent);
}
function drawBG(){ rect(0,0,1600,900,{fill:C.bg,stroke:'none',rx:0}); }
function frame(section,titleStr,sub){
  drawBG();
  txt(60,42,section.toUpperCase(),{size:12,color:C.gray,anchor:'start',weight:700});
  txt(800,78,titleStr,{size:36,color:C.white,weight:600});
  if(sub) txt(800,109,sub,{size:17,color:C.dimtext,weight:400});
}
function cap(kind,str){
  const colors={recap:C.gray,gap:C.orange,fill:C.green};
  const label=kind.toUpperCase();
  const t=elm('text',{x:800,y:830,'text-anchor':'middle','font-family':"'Helvetica Neue',Arial,sans-serif",'font-size':19});
  const s1=elm('tspan',{fill:colors[kind],'font-weight':700},t); s1.textContent=label+'   \u00b7   ';
  const s2=elm('tspan',{fill:C.white,'font-weight':400,'font-style':kind==='gap'?'italic':'normal'},t); s2.textContent=str;
  return t;
}
function note(str,color=C.dimtext){ return txt(800,830,str,{size:17,color}); }

/* positions */
function circlePositions(n,cx,cy,rad,startAngle=-90){
  const pts=[];
  for(let i=0;i<n;i++){ const a=(startAngle+i*360/n)*Math.PI/180; pts.push({x:cx+rad*Math.cos(a),y:cy+rad*Math.sin(a)}); }
  return pts;
}
function rowPositions(n,cy,spacing,cx=800){
  const totalW=(n-1)*spacing, startX=cx-totalW/2, pts=[];
  for(let i=0;i<n;i++) pts.push({x:startX+i*spacing,y:cy});
  return pts;
}

/* tween / timing */
function tween(duration,onFrame,isCurrent,easing=t=>t<0.5?2*t*t:-1+(4-2*t)*t){
  return new Promise(resolve=>{
    let start=null;
    function frame(now){
      if(isCurrent && !isCurrent()){ resolve(); return; }
      if(start===null) start=now;
      const t=Math.min(1,(now-start)/duration);
      onFrame(easing(t));
      if(t<1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });
}
function wait(ms,isCurrent){ return new Promise(res=>{ setTimeout(()=>res(), ms); }); }

/* node component */
function makeNode(cx,cy,label,opt={}){
  const {r=34,color=C.blue,parent=svg,labelSize=17,labelColor,fill='#000'}=opt;
  const g=group(parent);
  const c=circle(cx,cy,r,{fill,stroke:color,sw:2.5,parent:g});
  const t=label!==undefined?txt(cx,cy+6,label,{size:labelSize,color:labelColor||color,parent:g,weight:600}):null;
  return {g,c,t,cx,cy,r,
    setColor(col){c.setAttribute('stroke',col); if(t)t.setAttribute('fill',col);},
    setFill(col){c.setAttribute('fill',col);}
  };
}
async function flash(node,color,isCurrent,duration=460){
  await tween(duration,t=>{
    const w=2.5+7*Math.sin(Math.PI*t);
    node.c.setAttribute('stroke-width',w); node.c.setAttribute('stroke',color);
  },isCurrent);
  node.c.setAttribute('stroke-width',2.5);
}
async function fadeIn(elOrGroup,isCurrent,duration=420){
  elOrGroup.setAttribute('opacity',0);
  await tween(duration,t=>elOrGroup.setAttribute('opacity',t),isCurrent);
}
async function fadeOut(elOrGroup,isCurrent,duration=420){
  await tween(duration,t=>elOrGroup.setAttribute('opacity',1-t),isCurrent);
}
async function sendMsg(from,to,opt={},isCurrent){
  const {color=C.orange,r=6,duration=650,label,parent=svg}=opt;
  const g=group(parent);
  const dot=circle(from.cx,from.cy,r,{fill:color,stroke:'none',parent:g});
  let lab; if(label){ lab=txt((from.cx+to.cx)/2,(from.cy+to.cy)/2-16,label,{size:13,color,parent:g}); }
  await tween(duration,t=>{
    const x=from.cx+(to.cx-from.cx)*t, y=from.cy+(to.cy-from.cy)*t;
    dot.setAttribute('cx',x); dot.setAttribute('cy',y);
    if(lab){ lab.setAttribute('x',x); lab.setAttribute('y',y-16); }
  },isCurrent);
  g.remove();
  return true;
}
function sendMsgAll(from,tos,opt,isCurrent){ return Promise.all(tos.map(to=>sendMsg(from,to,opt,isCurrent))); }

/* ring diagram for consistent hashing */
function ringPoint(cx,cy,R,frac){ const a=(-90+frac*360)*Math.PI/180; return {x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)}; }
function ringArc(cx,cy,R,f0,f1,opt={}){
  let span=f1-f0; if(span<0) span+=1;
  const p0=ringPoint(cx,cy,R,f0), p1=ringPoint(cx,cy,R,f1);
  const large=span>0.5?1:0;
  return pathEl(`M ${p0.x} ${p0.y} A ${R} ${R} 0 ${large} 1 ${p1.x} ${p1.y}`,opt);
}

/* ============================= NAV / SHELL ============================= */
const slides=[];
let current=0, sceneId=0, clickHandler=null;
const dotsEl=document.getElementById('dots');
function buildDots(){
  dotsEl.innerHTML='';
  slides.forEach((s,i)=>{ const d=document.createElement('div'); d.className='dot'; d.onclick=()=>goTo(i); dotsEl.appendChild(d); });
}
function updateDots(){ [...dotsEl.children].forEach((d,i)=>d.classList.toggle('active',i===current)); }
function updateCounter(){ document.getElementById('counter').textContent=(current+1)+' / '+slides.length; }
async function goTo(idx){
  if(idx<0||idx>=slides.length) return;
  sceneId++; const myId=sceneId; current=idx; clickHandler=null;
  clearSvg(); updateDots(); updateCounter();
  const isCurrent=()=>myId===sceneId;
  try{ await slides[idx].render(isCurrent); }catch(e){ console.error(e); }
}
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); goTo(current+1); }
  else if(e.key==='ArrowLeft'){ goTo(current-1); }
  else if(e.key.toLowerCase()==='r'){ goTo(current); }
});
svg.addEventListener('click',()=>{ if(clickHandler) clickHandler(); else goTo(current+1); });
document.getElementById('nextBtn').onclick=()=>goTo(current+1);
document.getElementById('prevBtn').onclick=()=>goTo(current-1);

function S(renderFn){ slides.push({render:renderFn}); }

/* ============================= SLIDE HELPERS ============================= */
function legendDot(x,y,color,label,anchor='start'){
  circle(x,y-5,5,{fill:color,stroke:'none'});
  txt(anchor==='start'?x+14:x-14,y,label,{size:14,color:C.dimtext,anchor});
}
function bracketQuorum(nodes,idxs,color){
  // draw thin translucent connecting lines between quorum members
  const g=group();
  for(let i=0;i<idxs.length;i++) for(let j=i+1;j<idxs.length;j++){
    line(nodes[idxs[i]].cx,nodes[idxs[i]].cy,nodes[idxs[j]].cx,nodes[idxs[j]].cy,{stroke:color,sw:1,opacity:0.25,parent:g});
  }
  return g;
}

/* ====================================================================== */
/* ============================== SLIDES ================================ */
/* ====================================================================== */

/* ---------- 1. TITLE ---------- */
S(async (isCurrent)=>{
  drawBG();
  const t=txt(800,380,'Consensus, Scaling',{size:52,color:C.white,weight:700,opacity:0});
  const t2=txt(800,450,'& Partitioning',{size:52,color:C.gold,weight:700,opacity:0});
  const s=txt(800,510,'How machines agree, grow, and split the work — without falling apart.',{size:20,color:C.dimtext,opacity:0});
  const hint=txt(800,760,'click / press \u2192 to begin',{size:15,color:C.dim2,opacity:0});
  await fadeIn(t,isCurrent,600);
  await fadeIn(t2,isCurrent,600);
  await fadeIn(s,isCurrent,600);
  await fadeIn(hint,isCurrent,600);
});

/* ---------- 2. The problem: single node ---------- */
S(async (isCurrent)=>{
  frame('Foundations','One machine, one truth');
  const n=makeNode(800,420,'DB',{r:46,color:C.blue,labelSize:20});
  const clients=circlePositions(4,800,420,260,-150).slice(0,4);
  // draw clients around
  const cpos=[{x:420,y:300},{x:420,y:540},{x:1180,y:300},{x:1180,y:540}];
  const cnodes=cpos.map(p=>makeNode(p.x,p.y,'C',{r:26,color:C.gray,labelSize:14}));
  for(const c of cnodes){ line(c.cx,c.cy,n.cx,n.cy,{stroke:C.dim2,sw:1.5}); }
  note('A single server answers every request. Simple, fast — and fragile.');
  await wait(600);
  // crash it
  await flash(n,C.red,isCurrent,500);
  n.setFill('#1a0808'); n.setColor(C.red);
  const x1=line(n.cx-18,n.cy-18,n.cx+18,n.cy+18,{stroke:C.red,sw:4});
  const x2=line(n.cx-18,n.cy+18,n.cx+18,n.cy-18,{stroke:C.red,sw:4});
  await fadeIn(x1,isCurrent,250); await fadeIn(x2,isCurrent,250);
  for(const c of cnodes) c.setColor(C.red);
  cap('gap','It dies (crash, disk, network) — every client is stuck. What now?');
});

/* ---------- 3. Naive replication diverges ---------- */
S(async (isCurrent)=>{
  frame('Foundations','Just make copies?');
  const pos=rowPositions(3,420,340);
  const nodes=pos.map(p=>makeNode(p.x,p.y,'x=5',{r:44,color:C.blue,labelSize:18}));
  note('Three independent copies of the same data.');
  await wait(500);
  cap('gap','Two clients write at the same time, to different copies — now what?');
  await wait(900);
  // diverge
  nodes[0].t.textContent='x=7'; nodes[0].setColor(C.orange);
  nodes[2].t.textContent='x=9'; nodes[2].setColor(C.red);
  await Promise.all([flash(nodes[0],C.orange,isCurrent),flash(nodes[2],C.red,isCurrent)]);
  multi(800,620,['Copy 1 says 7. Copy 3 says 9. Copy 2 still says 5.','Which one is "the" value?'],{size:18,color:C.dimtext,lh:1.5});
});

/* ---------- 4. FILL: what is consensus ---------- */
S(async (isCurrent)=>{
  frame('Foundations','Consensus: forcing agreement');
  cap('fill','a protocol so all correct nodes settle on ONE same value, despite failures');
  const items=[
    ['Agreement','no two correct nodes decide differently'],
    ['Validity','the agreed value was actually proposed by someone'],
    ['Termination','every correct node eventually decides — no hanging forever']
  ];
  const pos=rowPositions(3,430,470);
  for(let i=0;i<3;i++){
    const g=group();
    const r=rect(pos[i].x-190,pos[i].y-90,380,200,{stroke:C.dim2,sw:1.5,parent:g});
    txt(pos[i].x,pos[i].y-40,items[i][0],{size:24,color:C.gold,weight:700,parent:g});
    multi(pos[i].x,pos[i].y+0,wrapText(items[i][1],26),{size:16,color:C.dimtext,parent:g,lh:1.5});
    g.setAttribute('opacity',0);
    await fadeIn(g,isCurrent,420);
  }
});
function wrapText(str,maxLen){
  const words=str.split(' '); const lines=[]; let cur='';
  for(const w of words){ if((cur+' '+w).trim().length>maxLen){ lines.push(cur.trim()); cur=w; } else cur+=' '+w; }
  if(cur.trim()) lines.push(cur.trim());
  return lines;
}

/* ---------- 5. Majority Quorum ---------- */
S(async (isCurrent)=>{
  frame('Foundations','Majority quorum');
  const N=5;
  const pos=circlePositions(N,800,440,230);
  const nodes=pos.map((p,i)=>makeNode(p.x,p.y,String(i+1),{r:32,color:C.blue}));
  mathTxt(800,440,'N = 5',{size:22,color:C.dimtext});
  note('A quorum is the smallest group whose "yes" is enough to decide.');
  await wait(500);
  mathTxt(800,760,'quorum = \u230aN/2\u230b + 1  =  3',{size:30,color:C.gold});
  await wait(300);
  for(const i of [0,1,2]){ await flash(nodes[i],C.green,isCurrent,350); nodes[i].setColor(C.green); }
  bracketQuorum(nodes,[0,1,2],C.green);
});

/* ---------- 6. Predict-pause: quorum overlap ---------- */
S(async (isCurrent)=>{
  frame('Foundations','Predict before you see it');
  const N=5; const pos=circlePositions(N,800,420,220);
  const nodes=pos.map((p,i)=>makeNode(p.x,p.y,String(i+1),{r:30,color:C.blue}));
  multi(800,700,['Group A = {1,2,3} and Group B = {3,4,5} both claim majority.','Can A and B ever agree on DIFFERENT values for the same decision?'],{size:18,color:C.dimtext,lh:1.6});
  note('click to reveal',C.dim2);
  clickHandler=async ()=>{
    clickHandler=null;
    bracketQuorum(nodes,[0,1,2],C.blue);
    bracketQuorum(nodes,[2,3,4],C.orange);
    await flash(nodes[2],C.green,isCurrent,600);
    nodes[2].setColor(C.green);
    clearBottomCaption();
    cap('fill','No — any two majorities of N share \u2265 1 node. That shared node prevents contradictory decisions.');
    clickHandler=()=>goTo(current+1);
  };
});
function clearBottomCaption(){
  // remove any text elements near caption band (approx) before redrawing
  [...svg.querySelectorAll('text')].forEach(t=>{ if(+t.getAttribute('y')>=690 && +t.getAttribute('y')<=770) t.remove(); });
}

/* ---------- 7. Paxos roles + Phase 1 ---------- */
S(async (isCurrent)=>{
  frame('Consensus Algorithms','Paxos \u2014 Phase 1: Prepare / Promise');
  const proposer=makeNode(280,440,'Proposer',{r:44,color:C.orange,labelSize:14});
  const accPos=rowPositions(3,440,190,1020);
  const accs=accPos.map((p,i)=>makeNode(p.x,p.y,'Acceptor',{r:40,color:C.blue,labelSize:12}));
  txt(280,540,'proposes number n',{size:14,color:C.dimtext});
  note('Proposer picks a round number n, asks acceptors to promise not to accept anything older.');
  await wait(500);
  await sendMsgAll(proposer,accs,{color:C.orange,label:'prepare(n)'},isCurrent);
  await wait(150);
  for(const a of accs) flash(a,C.green,isCurrent,300);
  await sendMsgAll(accs[0],[proposer],{color:C.green,label:'promise'},isCurrent);
  await Promise.all([
    sendMsg(accs[1],proposer,{color:C.green,label:'promise'},isCurrent),
    sendMsg(accs[2],proposer,{color:C.green,label:'promise'},isCurrent)
  ]);
  cap('note'==='note'?'recap':'recap','majority promised \u2014 no one has accepted a higher-numbered proposal yet');
});

/* ---------- 8. Paxos Phase 2 ---------- */
S(async (isCurrent)=>{
  frame('Consensus Algorithms','Paxos \u2014 Phase 2: Accept / Accepted');
  const proposer=makeNode(280,440,'Proposer',{r:44,color:C.orange,labelSize:14});
  const accPos=rowPositions(3,440,190,1020);
  const accs=accPos.map((p,i)=>makeNode(p.x,p.y,'Acceptor',{r:40,color:C.blue,labelSize:12}));
  note('Since a majority promised, proposer sends accept(n, v) \u2014 the actual value.');
  await wait(400);
  await sendMsgAll(proposer,accs,{color:C.orange,label:'accept(n,v)'},isCurrent);
  for(const a of accs){ a.setColor(C.green); a.setFill('#08160f'); }
  await Promise.all(accs.map(a=>flash(a,C.green,isCurrent,350)));
  await sendMsgAll(accs[0],[proposer],{color:C.green,label:'accepted'},isCurrent);
  cap('fill','majority accepted \u2192 value v is CHOSEN. It can never change again.');
});

/* ---------- 9. GAP: dueling proposers ---------- */
S(async (isCurrent)=>{
  frame('Consensus Algorithms','Two proposers at once');
  const pA=makeNode(500,300,'P1',{r:36,color:C.orange});
  const pB=makeNode(1100,300,'P2',{r:36,color:C.red});
  const accPos=rowPositions(3,560,220);
  const accs=accPos.map(p=>makeNode(p.x,p.y,'A',{r:34,color:C.blue}));
  note('P1 sends prepare(5). Before it finishes, P2 sends prepare(6) \u2014 higher \u2014 and acceptors switch allegiance.');
  await wait(400);
  await sendMsgAll(pA,accs,{color:C.orange,label:'prepare(5)'},isCurrent);
  await sendMsgAll(pB,accs,{color:C.red,label:'prepare(6)'},isCurrent);
  await wait(200);
  cap('gap','Each keeps out-bidding the other before either finishes phase 2 \u2014 could this repeat forever?');
});

/* ---------- 10. FILL: Multi-Paxos ---------- */
S(async (isCurrent)=>{
  frame('Consensus Algorithms','Multi-Paxos \u2014 elect once, replicate fast');
  cap('fill','pick a stable leader; skip phase 1 for every future slot');
  const leader=makeNode(800,300,'Leader',{r:44,color:C.gold,labelSize:16});
  const accPos=rowPositions(3,560,240);
  const accs=accPos.map(p=>makeNode(p.x,p.y,'A',{r:34,color:C.blue}));
  note('One prepare, elected as leader \u2014 then only accept-rounds stream for log slot 1, 2, 3...');
  await wait(400);
  for(let slot=1;slot<=3;slot++){
    await sendMsgAll(leader,accs,{color:C.gold,label:'accept(slot '+slot+')',duration:420},isCurrent);
    accs.forEach(a=>flash(a,C.green,isCurrent,250));
    await wait(120);
  }
  note('No repeated "prepare" per entry \u2014 this is how real logs replicate fast.',C.dimtext);
});

/* ---------- 11. Raft intro: roles + term ---------- */
S(async (isCurrent)=>{
  frame('Consensus Algorithms','Raft \u2014 built to be understandable');
  note('Same goal as Multi-Paxos. Explicit roles: Leader, Follower, Candidate.');
  const l=makeNode(800,280,'Leader',{r:40,color:C.gold});
  const fpos=rowPositions(4,470,260);
  const fs=fpos.map(p=>makeNode(p.x,p.y,'Follower',{r:34,color:C.blue,labelSize:12}));
  await wait(500);
  mathTxt(800,650,'term = 1',{size:26,color:C.dimtext});
  note2:{}
  await wait(400);
  cap('fill','a "term" is a ticking counter \u2014 every new election bumps it, and stale leaders lose instantly');
});

/* ---------- 12. Leader election mechanism ---------- */
S(async (isCurrent)=>{
  frame('Consensus Algorithms','Leader election');
  const pos=rowPositions(5,430,220);
  const nodes=pos.map((p,i)=>makeNode(p.x,p.y,'F',{r:32,color:C.blue}));
  note('Followers wait for heartbeats. One times out first (randomized timer) \u2192 becomes Candidate.');
  await wait(600);
  const cIdx=2;
  nodes[cIdx].setColor(C.orange); nodes[cIdx].t.textContent='C';
  mathTxt(nodes[cIdx].cx,nodes[cIdx].cy-60,'term: 1\u21922',{size:16,color:C.orange});

  multi(800,620,['Horizontal spreads ROWS (scale for more records).','Vertical spreads COLUMNS (isolate hot / rarely-used fields).'],{size:16,color:C.dimtext,lh:1.6});
});

/* ---------- 33. Range/Hash/List/Directory ---------- */
S(async (isCurrent)=>{
  frame('Partitioning & Sharding','Four ways to pick a shard');
  const pos=[]; for(let r=0;r<2;r++) for(let c=0;c<2;c++) pos.push({x:430+c*740,y:290+r*310});
  const titles=['Range','Hash','List','Directory-based'];
  const bodies=[
    'A\u2013M \u2192 shard 1, N\u2013Z \u2192 shard 2. Simple, but skewed keys create hot spots.',
    'hash(key) mod N \u2192 shard. Even spread, but range scans hit every shard.',
    'region=US \u2192 shard 1, region=EU \u2192 shard 2. Explicit control, manual upkeep.',
    'lookup service maps key \u2192 shard. Flexible remapping, but the directory is a new dependency.'
  ];
  for(let i=0;i<4;i++){
    const g=group();
    rect(pos[i].x-330,pos[i].y-110,660,210,{stroke:C.dim2,sw:1.5,parent:g});
    txt(pos[i].x,pos[i].y-60,titles[i],{size:22,color:C.gold,weight:700,parent:g});
    multi(pos[i].x,pos[i].y-10,wrapText(bodies[i],46),{size:15,color:C.dimtext,parent:g,lh:1.6});
    g.setAttribute('opacity',0);
    await fadeIn(g,isCurrent,300);
  }
});

/* ---------- 34. GAP: naive hash mod N remap chaos ---------- */
S(async (isCurrent)=>{
  frame('Partitioning & Sharding','Adding a node with plain hash % N');
  const before=rowPositions(4,300,300);
  before.forEach((p,i)=>{ makeNode(p.x,p.y,'S'+i,{r:34,color:C.blue}); });
  txt(800,220,'N = 4  \u2192  key\u2019s shard = hash(key) % 4',{size:16,color:C.dimtext});
  await wait(500);
  const after=rowPositions(5,520,220);
  const anodes=after.map((p,i)=>makeNode(p.x,p.y,'S'+i,{r:34,color:C.red}));
  txt(800,440,'N = 5  \u2192  hash(key) % 5   (almost every key gets a NEW answer)',{size:16,color:C.red});
  await Promise.all(anodes.map(n=>flash(n,C.red,isCurrent,350)));
  cap('gap','one node joins \u2014 nearly ALL keys remap. Every cache & shard reshuffles at once. Is there a better way?');
});

/* ---------- 35. FILL: consistent hashing ring ---------- */
S(async (isCurrent)=>{
  frame('Partitioning & Sharding','Consistent hashing');
  cap('fill','place nodes AND keys on a ring; a key belongs to the next node clockwise');
  const cx=800,cy=460,R=260;
  circle(cx,cy,R,{stroke:C.dim2,sw:2});
  const nodeFracs=[0.05,0.3,0.55,0.8];
  const colors=[C.blue,C.orange,C.green,C.gold];
  const nodePts=nodeFracs.map(f=>ringPoint(cx,cy,R,f));
  const arcs=[]; for(let i=0;i<4;i++) arcs.push(ringArc(cx,cy,R,nodeFracs[i],nodeFracs[(i+1)%4],{stroke:colors[i],sw:5,opacity:0.5}));
  const nodes=nodePts.map((p,i)=>makeNode(p.x,p.y,'N'+i,{r:26,color:colors[i]}));
  const keyFracs=[0.15,0.42,0.68,0.92];
  const keyPts=keyFracs.map(f=>ringPoint(cx,cy,R,f));
  keyPts.forEach(p=>circle(p.x,p.y,7,{fill:C.dimtext,stroke:'none'}));
  await wait(500);
  note('Each key\u2019s color = the next node clockwise that owns it.');
  await wait(300);
  // introduce new node between frac 0.55 and 0.8
  const newFrac=0.68;
  const np=ringPoint(cx,cy,R,newFrac);
  const newNode=makeNode(np.x,np.y,'N4',{r:26,color:C.red});
  await fadeIn(newNode.g,isCurrent,400);
  arcs[2].remove();
  ringArc(cx,cy,R,0.55,newFrac,{stroke:colors[2],sw:5,opacity:0.5});
  ringArc(cx,cy,R,newFrac,0.8,{stroke:C.red,sw:5,opacity:0.6});
  // only the key at 0.68 shifts ownership
  const shiftedKey=keyPts[2];
  await flash({c:circle(shiftedKey.x,shiftedKey.y,10,{fill:'none',stroke:C.red,sw:3})},C.red,isCurrent,500);
  mathTxt(800,800,'on average, only K/N keys remap when a node joins or leaves',{size:18,color:C.gold});
});

/* ---------- 36. Virtual nodes ---------- */
S(async (isCurrent)=>{
  frame('Partitioning & Sharding','Virtual nodes');
  const cx=800,cy=460,R=260;
  circle(cx,cy,R,{stroke:C.dim2,sw:2});
  note('With few physical nodes, arcs (load) are wildly uneven.');
  const fracs=[0.05,0.4,0.5];
  const colors=[C.blue,C.orange,C.green];
  fracs.forEach((f,i)=>ringArc(cx,cy,R,f,fracs[(i+1)%3],{stroke:colors[i],sw:5,opacity:0.5}));
  fracs.forEach((f,i)=>{ const p=ringPoint(cx,cy,R,f); makeNode(p.x,p.y,'N'+i,{r:24,color:colors[i]}); });
  await wait(700);
  cap('gap','node 0 owns a tiny sliver, node 2 owns almost half \u2014 how do we even this out?');
  await wait(900);
  clearSvg();
  frame('Partitioning & Sharding','Virtual nodes \u2014 the fix');
  cap('fill','give each physical node MANY points on the ring \u2192 averages out to even load');
  circle(cx,cy,R,{stroke:C.dim2,sw:2});
  const vfracs=[]; for(let i=0;i<24;i++) vfracs.push(i/24 + (Math.sin(i*7)*0.006));
  const owner=i=>colors[i%3];
  for(let i=0;i<24;i++) ringArc(cx,cy,R,vfracs[i],vfracs[(i+1)%24],{stroke:owner(i),sw:5,opacity:0.5});
  for(let i=0;i<24;i++){ const p=ringPoint(cx,cy,R,vfracs[i]); circle(p.x,p.y,7,{fill:owner(i),stroke:'none'}); }
  txt(800,780,'each color (physical node) now owns many small, scattered arcs',{size:16,color:C.dimtext});
});

/* ---------- 37. Hot partitions + shard keys ---------- */
S(async (isCurrent)=>{
  frame('Partitioning & Sharding','Hot partitions');
  const pos=rowPositions(4,420,280);
  const shards=pos.map((p,i)=>makeNode(p.x,p.y,'S'+i,{r:36,color:i===1?C.red:C.blue}));
  note('One shard\u2019s key (a viral post, "today\u2019s date") gets disproportionate traffic.');
  await wait(400);
  for(let i=0;i<6;i++){ sendMsg({cx:800,cy:180},shards[1],{color:C.red,duration:260},isCurrent); await wait(90); }
  await flash(shards[1],C.red,isCurrent,400);
  txt(shards[1].cx,shards[1].cy+70,'bottleneck',{size:14,color:C.red});
  cap('gap','the shard KEY decided this. Choose a different key, or split the hot shard further, or add caching.');
});

/* ---------- 38. Predict: shard key trade-off ---------- */
S(async (isCurrent)=>{
  frame('Partitioning & Sharding','Predict before you see it');
  multi(800,300,['You need ALL of a user\u2019s orders fast (shard by user_id).','You also need writes spread evenly across shards.'],{size:18,color:C.dimtext,lh:1.6});
  txt(800,420,'Plain user_id  vs.  hash(user_id)  \u2014 what\u2019s the trade-off?',{size:19,color:C.white,weight:600});
  note('click to reveal',C.dim2);
  clickHandler=async ()=>{
    clickHandler=null;
    clearBottomCaption2();
    const pos=rowPositions(2,560,500);
    txt(pos[0].x,pos[0].y-70,'plain user_id',{size:20,color:C.blue,weight:700});
    multi(pos[0].x,pos[0].y,wrapText('data co-located, fast range/per-user queries \u2014 but a "whale" user creates a hot shard',30),{size:15,color:C.dimtext,lh:1.6});
    txt(pos[1].x,pos[1].y-70,'hash(user_id)',{size:20,color:C.orange,weight:700});
    multi(pos[1].x,pos[1].y,wrapText('even write spread across all shards \u2014 but range/adjacency locality is lost',30),{size:15,color:C.dimtext,lh:1.6});
    cap('fill','the shard key is the single biggest lever for hot spots AND query patterns \u2014 choose it deliberately');
    clickHandler=()=>goTo(current+1);
  };
});
function clearBottomCaption2(){ [...svg.querySelectorAll('text')].forEach(t=>{ const y=+t.getAttribute('y'); if(y>380 && y<460) t.remove(); }); }

/* ---------- 39. Cross-shard queries ---------- */
S(async (isCurrent)=>{
  frame('Partitioning & Sharding','Cross-shard queries');
  const client=makeNode(800,180,'Query',{r:34,color:C.gray});
  const pos=rowPositions(4,460,280);
  const shards=pos.map((p,i)=>makeNode(p.x,p.y,'Shard '+i,{r:38,color:C.blue,labelSize:13}));
  note('"Find all orders over $100" \u2014 no single shard has the full answer.');
  await wait(400);
  await sendMsgAll(client,shards,{color:C.gray,label:'scatter'},isCurrent);
  shards.forEach(s=>flash(s,C.orange,isCurrent,300));
  await wait(150);
  await sendMsgAll(shards[0],[client],{color:C.green,label:'gather'},isCurrent);
  await Promise.all([1,2,3].map(i=>sendMsg(shards[i],client,{color:C.green,label:'gather'},isCurrent)));
  cap('fill','scatter-gather: fan out to every relevant shard, then merge results at the caller');
});

/* ---------- 40. Cross-shard transactions ---------- */
S(async (isCurrent)=>{
  frame('Partitioning & Sharding','Cross-shard transactions');
  txt(430,190,'Two-Phase Commit (2PC)',{size:19,color:C.blue,weight:700});
  txt(1170,190,'Saga (compensating)',{size:19,color:C.orange,weight:700});
  const coord=makeNode(430,280,'Coord',{r:32,color:C.blue});
  const s1=makeNode(300,460,'Shard A',{r:34,color:C.blue,labelSize:12});
  const s2=makeNode(560,460,'Shard B',{r:34,color:C.blue,labelSize:12});
  await sendMsgAll(coord,[s1,s2],{color:C.blue,label:'prepare?'},isCurrent);
  await Promise.all([sendMsg(s1,coord,{color:C.green,label:'yes'},isCurrent),sendMsg(s2,coord,{color:C.green,label:'yes'},isCurrent)]);
  await sendMsgAll(coord,[s1,s2],{color:C.green,label:'commit'},isCurrent);
  [s1,s2].forEach(s=>flash(s,C.green,isCurrent,250));
  // saga
  const t1=makeNode(1050,300,'Step 1',{r:32,color:C.orange});
  const t2=makeNode(1290,300,'Step 2',{r:32,color:C.orange});
  const t3=makeNode(1170,460,'Step 3 (fails)',{r:34,color:C.red,labelSize:11});
  await sendMsg(t1,t2,{color:C.orange,duration:400},isCurrent);
  await sendMsg(t2,t3,{color:C.orange,duration:400},isCurrent);
  await flash(t3,C.red,isCurrent,400);
  await sendMsg(t3,t2,{color:C.red,label:'compensate',duration:400},isCurrent);
  await sendMsg(t2,t1,{color:C.red,label:'compensate',duration:400},isCurrent);
  cap('fill','2PC = strict but blocking; Sagas = each step undoes itself on failure, no locks held across shards');
});

/* ---------- 41. Grand recap: Raft-per-shard ---------- */
S(async (isCurrent)=>{
  frame('Bringing it together','A sharded, replicated database');
  note('Split the data into shards. Replicate EACH shard with its own consensus group.');
  const groups=[{cx:420,color:C.blue},{cx:800,color:C.orange},{cx:1180,color:C.green}];
  for(const grp of groups){
    const pos=circlePositions(3,grp.cx,470,90);
    const nodes=pos.map(p=>makeNode(p.x,p.y,'',{r:24,color:grp.color}));
    bracketQuorum(nodes,[0,1,2],grp.color);
    txt(grp.cx,610,'shard',{size:14,color:C.dimtext});
  }
  await wait(600);
  cap('fill','each shard IS its own Raft (or Paxos) group \u2014 consensus and sharding compose, not compete');
});
