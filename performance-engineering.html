<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Performance Engineering — A Feynman Walkthrough</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#07070a;
  --bg2:#0d0d13;
  --panel:#101018;
  --grid:#1b1b24;
  --text:#eaeaf0;
  --muted:#8d8d9a;
  --teal:#4fd1c5;
  --teal-dim:#2f6b66;
  --amber:#e0a458;
  --amber-dim:#7a5a34;
  --purple:#a48cf0;
  --purple-dim:#5a4d8a;
  --red:#d97878;
  --green:#7ec98f;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;font-family:var(--sans);}
#viewport{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;}
#stage{
  position:absolute;top:50%;left:50%;width:1280px;height:720px;
  background:radial-gradient(ellipse at 50% 0%, #0c0c14 0%, var(--bg) 55%, #050507 100%);
  transform-origin:center center;
  overflow:hidden;
  border-radius:4px;
  box-shadow:0 0 0 1px #1a1a22, 0 40px 120px rgba(0,0,0,0.8);
}
.bg-grid{position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:64px 64px;opacity:0.35;pointer-events:none;}
.bg-vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0,0,0,0.55) 100%);}

.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:56px 72px;color:var(--text);}
.slide.active{display:flex;}

.eyebrow{font-family:var(--mono);font-size:14px;letter-spacing:3px;color:var(--teal);text-transform:uppercase;opacity:0.85;}
.title{font-size:44px;font-weight:700;margin:6px 0 4px 0;letter-spacing:0.3px;}
.subtitle{font-size:19px;color:var(--muted);font-weight:400;max-width:900px;line-height:1.5;}
.section-num{font-family:var(--mono);font-size:120px;color:var(--panel);position:absolute;right:60px;top:24px;font-weight:700;-webkit-text-stroke:1px #23232e;color:transparent;}

.reveal{opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1);}
.reveal.show{opacity:1;transform:translateY(0);}
.reveal.fade{transform:none;}
.reveal.pop{transform:scale(0.92);}
.reveal.pop.show{transform:scale(1);}

.center-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;position:relative;}
.row{display:flex;align-items:center;justify-content:center;gap:28px;width:100%;}
.chip{font-family:var(--mono);font-size:14px;padding:6px 14px;border-radius:20px;border:1px solid var(--grid);color:var(--muted);background:rgba(255,255,255,0.02);}
.chip.teal{color:var(--teal);border-color:var(--teal-dim);}
.chip.amber{color:var(--amber);border-color:var(--amber-dim);}
.chip.purple{color:var(--purple);border-color:var(--purple-dim);}

.formula-box{font-family:var(--mono);font-size:26px;background:var(--panel);border:1px solid var(--grid);border-radius:10px;padding:20px 32px;color:var(--text);display:inline-flex;gap:10px;align-items:center;box-shadow:0 0 40px rgba(79,209,197,0.05) inset;}
.formula-box .v{color:var(--teal);}
.formula-box .v2{color:var(--amber);}
.formula-box .v3{color:var(--purple);}
.formula-note{font-size:14px;color:var(--muted);margin-top:8px;text-align:center;max-width:700px;}

.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;}
.foot .tag{font-family:var(--mono);font-size:12px;color:#4a4a56;letter-spacing:1px;}

svg text{font-family:var(--sans);}
.draw{transition:stroke-dashoffset 1.4s cubic-bezier(.2,.7,.1,1);}
.grow{transition:height 0.9s cubic-bezier(.2,.8,.2,1), width 0.9s cubic-bezier(.2,.8,.2,1), transform 0.9s cubic-bezier(.2,.8,.2,1), opacity 0.6s ease;}
.fadein{transition:opacity 0.7s ease, transform 0.7s cubic-bezier(.2,.8,.2,1);}

/* bridge slide */
.bridge{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;}
.bridge .qmark{font-size:120px;font-weight:800;color:#1c1c26;font-family:var(--mono);line-height:1;}
.bridge-block{max-width:840px;text-align:center;}
.bridge-label{font-family:var(--mono);font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px;}
.bridge-recap .bridge-label{color:var(--muted);}
.bridge-gap .bridge-label{color:var(--amber);}
.bridge-fill .bridge-label{color:var(--teal);}
.bridge-text{font-size:22px;line-height:1.5;}
.bridge-gap .bridge-text{color:#f0d2ac;font-weight:500;}
.bridge-fill .bridge-text{color:var(--teal);font-weight:700;font-size:28px;}
.arrow-down{width:2px;height:34px;background:linear-gradient(var(--grid),var(--muted));}

/* nav */
#ui{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:center;align-items:center;gap:14px;z-index:50;font-family:var(--mono);}
#dots{display:flex;gap:5px;flex-wrap:wrap;max-width:60vw;justify-content:center;}
.dot{width:6px;height:6px;border-radius:50%;background:#2a2a34;cursor:pointer;transition:background .2s, transform .2s;}
.dot.active{background:var(--teal);transform:scale(1.6);}
.navbtn{background:#101018;border:1px solid #22222c;color:#aaa;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.navbtn:hover{border-color:var(--teal);color:var(--teal);}
#counter{color:#666;font-size:12px;min-width:52px;text-align:center;}
.clickzone{position:absolute;top:0;bottom:0;width:50%;z-index:5;cursor:pointer;}
#zoneL{left:0;}#zoneR{right:0;}
.hint{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:12px;color:#555;letter-spacing:1px;z-index:40;transition:opacity 1s;}

/* two column */
.twocol{display:flex;gap:50px;align-items:center;justify-content:center;width:100%;}
.col{flex:1;max-width:520px;}
.card{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:20px 24px;}
.card h4{margin:0 0 8px 0;font-size:16px;color:var(--teal);}
.card p{margin:0;font-size:14px;color:var(--muted);line-height:1.5;}

ul.plain{list-style:none;padding:0;margin:0;}
ul.plain li{font-size:16px;color:#cfcfd8;margin:9px 0;padding-left:22px;position:relative;}
ul.plain li:before{content:'▸';position:absolute;left:0;color:var(--teal);}

.legend{display:flex;gap:18px;font-family:var(--mono);font-size:12px;color:var(--muted);}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle;}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div class="bg-grid"></div>
    <div id="deck"></div>
    <div class="bg-vignette"></div>
    <div id="zoneL" class="clickzone"></div>
    <div id="zoneR" class="clickzone"></div>
  </div>
</div>
<div class="hint" id="hint">← → or click sides to navigate · space = next</div>
<div id="ui">
  <button class="navbtn" id="prevBtn">‹</button>
  <div id="dots"></div>
  <button class="navbtn" id="nextBtn">›</button>
  <div id="counter"></div>
</div>

<script>
/* ============================= UTILITIES ============================= */
const NS='http://www.w3.org/2000/svg';
function svg(w,h,extra=''){return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="overflow:visible;${extra}">`;}
function esc(s){return s;}
function reveal(root,selector,startDelay=80,step=110){
  const items=root.querySelectorAll(selector);
  items.forEach((it,i)=>{ setTimeout(()=>it.classList.add('show'), startDelay+i*step); });
}
function drawPaths(root,selector,startDelay=200,step=140,dur=1200){
  const items=root.querySelectorAll(selector);
  items.forEach((p,i)=>{
    const len=p.getTotalLength();
    p.style.strokeDasharray=len;
    p.style.strokeDashoffset=len;
    p.style.transition='none';
    setTimeout(()=>{
      p.style.transition=`stroke-dashoffset ${dur}ms cubic-bezier(.2,.7,.1,1)`;
      p.style.strokeDashoffset=0;
    },startDelay+i*step);
  });
}
function growBars(root,selector,startDelay=200,step=90){
  const items=root.querySelectorAll(selector);
  items.forEach((el,i)=>{
    const target = el.getAttribute('data-h') || el.getAttribute('data-w');
    setTimeout(()=>{ el.classList.add('grown'); },startDelay+i*step);
  });
}
function countUp(el,to,dur=1000,decimals=0,suffix=''){
  const start=performance.now();
  function step(t){
    const p=Math.min(1,(t-start)/dur);
    const eased=1-Math.pow(1-p,3);
    el.textContent = (to*eased).toFixed(decimals)+suffix;
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function bridge(recap,gap,fill,num){
  return `
  <div class="section-num">${num}</div>
  <div class="bridge">
    <div class="bridge-block bridge-recap reveal">
      <div class="bridge-label">Recap</div>
      <div class="bridge-text">${recap}</div>
    </div>
    <div class="arrow-down reveal"></div>
    <div class="bridge-block bridge-gap reveal">
      <div class="bridge-label">Still Missing</div>
      <div class="bridge-text">${gap}</div>
    </div>
    <div class="arrow-down reveal"></div>
    <div class="bridge-block bridge-fill reveal pop">
      <div class="bridge-label">Up Next</div>
      <div class="bridge-text">${fill}</div>
    </div>
  </div>`;
}
function sectionHeader(kicker,title,sub,num){
  return `
  <div class="section-num">${num}</div>
  <div class="center-stage">
    <div class="eyebrow reveal">${kicker}</div>
    <div class="title reveal" style="font-size:56px;text-align:center;">${title}</div>
    <div class="subtitle reveal" style="text-align:center;">${sub}</div>
  </div>`;
}
function head(eyebrow,title,sub){
  return `<div class="eyebrow reveal">${eyebrow}</div>
  <div class="title reveal">${title}</div>
  ${sub? `<div class="subtitle reveal">${sub}</div>`:''}`;
}

/* ============================= SLIDE DATA ============================= */
const slides=[];

/* 0 — TITLE */
slides.push({html:`
  <div class="center-stage">
    <div class="eyebrow reveal">A Feynman-style Deep Dive</div>
    <div class="reveal pop" style="font-size:58px;font-weight:800;text-align:center;letter-spacing:0.5px;">Performance<br>Engineering</div>
    <div class="subtitle reveal" style="text-align:center;">Why systems get slow, how to measure them honestly,<br>and the math that predicts it before it happens.</div>
    <div class="row reveal" style="margin-top:18px;">
      <span class="chip teal">profiling</span><span class="chip amber">benchmarking</span><span class="chip purple">queueing theory</span><span class="chip">tail latency</span>
    </div>
  </div>`,
  init(root){ reveal(root,'.reveal',200,220); }
});

/* 1 — HOOK */
slides.push({html:`
  ${head('The Problem','Your dashboard says 100ms. Your user says it hung.')}
  <div class="center-stage">
    <div style="width:900px;">
      ${svg(900,260)}
        <line x1="60" y1="220" x2="860" y2="220" stroke="#2a2a34" stroke-width="2"/>
        <line x1="60" y1="220" x2="60" y2="30" stroke="#2a2a34" stroke-width="2"/>
        <text x="30" y="30" fill="#666" font-size="12" font-family="monospace">req/s</text>
        <text x="820" y="240" fill="#666" font-size="12" font-family="monospace">time</text>
        <path id="avgline" d="M60,190 L860,190" fill="none" stroke="#4fd1c5" stroke-width="3"/>
        <text x="700" y="180" fill="#4fd1c5" font-size="13" font-family="monospace">average = 100ms ✓</text>
        <path id="realline" d="M60,195 C 150,190 220,192 300,150 C 360,120 400,60 430,40 C 460,60 480,150 520,190 C 600,196 650,193 720,60 C 750,30 770,150 860,192" fill="none" stroke="#d97878" stroke-width="3"/>
        <text x="430" y="30" fill="#d97878" font-size="13" font-family="monospace" text-anchor="middle">real users, real spikes</text>
      </svg>
    </div>
    <div class="subtitle reveal" style="text-align:center;max-width:820px;">
      The average hides the story. One user in a hundred waits <b style="color:#e0a458">8 seconds</b> — and they're the one who tweets about it.
      Performance engineering is the discipline of finding <i>that</i> user before they find you.
    </div>
  </div>`,
  init(root){
    drawPaths(root,'#avgline',200,0,900);
    drawPaths(root,'#realline',400,0,1600);
    reveal(root,'.eyebrow,.title,.subtitle',900,150);
  }
});

/* 2 — ROADMAP */
slides.push({html:`
  ${head('The Map','Four moves, in order')}
  <div class="center-stage">
    <div class="row" style="align-items:stretch;gap:22px;">
      <div class="card reveal" style="width:250px;"><h4>01 · Profile</h4><p>Find out where time and memory actually go — CPU, heap, flame graphs.</p></div>
      <div class="card reveal" style="width:250px;"><h4>02 · Benchmark</h4><p>Prove a fix works, without fooling yourself with noise.</p></div>
      <div class="card reveal" style="width:250px;"><h4>03 · Analyze</h4><p>Latency, throughput, bottlenecks — Amdahl, Little, Queueing theory.</p></div>
      <div class="card reveal" style="width:250px;"><h4>04 · Guarantee</h4><p>Tail latency: p50 through p99.9 — what your worst user feels.</p></div>
    </div>
    <div class="subtitle reveal" style="text-align:center;margin-top:10px;">Each one answers a question the last one couldn't.</div>
  </div>`,
  init(root){ reveal(root,'.reveal',150,140); }
});

/* 3 — SECTION: PROFILING */
slides.push({html:sectionHeader('Part One','Profiling','You cannot optimize what you have not measured. Profiling tells you where the program actually spends its life.','01'),
  init(root){ reveal(root,'.reveal',150,180);} });

/* 4 — CPU PROFILING CONCEPT */
slides.push({html:`
  ${head('CPU Profiling','Two ways to catch a program in the act')}
  <div class="center-stage">
    <div class="twocol">
      <div class="col card reveal">
        <h4>Sampling</h4>
        <p>Every few milliseconds, interrupt the program and ask: "what's on the call stack <i>right now</i>?" Cheap, statistical, safe for production.</p>
      </div>
      <div class="col card reveal">
        <h4>Instrumentation</h4>
        <p>Insert a timer at the start and end of every function. Exact counts, but the timers themselves slow the program down — the "observer effect."</p>
      </div>
    </div>
    <div style="width:760px;margin-top:6px;">
      ${svg(760,120)}
        <line x1="20" y1="60" x2="740" y2="60" stroke="#2a2a34" stroke-width="2"/>
        <g id="ticks"></g>
      </svg>
    </div>
    <div class="subtitle reveal" style="text-align:center;">Sampling profilers take a snapshot at each tick — enough snapshots, and a pattern (the flame graph) emerges.</div>
  </div>`,
  init(root){
    reveal(root,'.reveal',150,150);
    const g=root.querySelector('#ticks');
    let x=60;
    for(let i=0;i<12;i++){
      const line=document.createElementNS(NS,'line');
      line.setAttribute('x1',x);line.setAttribute('x2',x);
      line.setAttribute('y1',50);line.setAttribute('y2',70);
      line.setAttribute('stroke','#4fd1c5');line.setAttribute('stroke-width','2');
      line.style.opacity=0; line.style.transition='opacity .3s';
      g.appendChild(line);
      setTimeout(()=>line.style.opacity=1, 900+i*140);
      x+=58;
    }
  }
});

/* 5 — FLAME GRAPH BUILD */
slides.push({html:`
  ${head('Flame Graphs','Thousands of samples become one picture')}
  <div class="center-stage">
    <div id="fgwrap" style="width:1000px;">${svg(1000,300)}<g id="fg"></g></svg></div>
    <div class="subtitle reveal" style="text-align:center;">Each sampled stack stacks a column. Merge identical stacks — width grows where the program spends the most samples.</div>
  </div>`,
  init(root){
    reveal(root,'.subtitle,.eyebrow,.title',2400,150);
    const g=root.querySelector('#fg');
    // synthetic call stack samples
    const data=[
      {name:'main',x:0,w:1000,depth:0,color:'#3a3a46'},
      {name:'handleRequest',x:0,w:1000,depth:1,color:'#4a4a58'},
      {name:'parseJSON',x:0,w:120,depth:2,color:'#9d8df1'},
      {name:'authCheck',x:120,w:80,depth:2,color:'#9d8df1'},
      {name:'dbQuery',x:200,w:620,depth:2,color:'#e0a458'},
      {name:'executeSQL',x:200,w:520,depth:3,color:'#e0a458'},
      {name:'waitForLock',x:250,w:420,depth:4,color:'#d97878'},
      {name:'serialize',x:820,w:180,depth:2,color:'#4fd1c5'},
    ];
    const H=42, baseY=300;
    data.forEach((d,i)=>{
      const r=document.createElementNS(NS,'rect');
      const y=baseY-(d.depth+1)*H;
      r.setAttribute('x',d.x); r.setAttribute('y',y);
      r.setAttribute('width',0); r.setAttribute('height',H-3);
      r.setAttribute('fill',d.color); r.setAttribute('rx','2');
      r.style.transition='width .8s cubic-bezier(.2,.8,.2,1)';
      g.appendChild(r);
      const t=document.createElementNS(NS,'text');
      t.setAttribute('x',d.x+8); t.setAttribute('y',y+H/2+4);
      t.setAttribute('fill','#0a0a0d'); t.setAttribute('font-size','13'); t.setAttribute('font-family','monospace');
      t.style.opacity=0; t.style.transition='opacity .4s';
      t.textContent = d.w>90? d.name : '';
      g.appendChild(t);
      setTimeout(()=>{ r.setAttribute('width',d.w); t.style.opacity=1; }, 300+i*230);
    });
    setTimeout(()=>{
      const cb=document.createElementNS(NS,'rect');
      cb.setAttribute('x',250);cb.setAttribute('y',300-5*H);cb.setAttribute('width',420);cb.setAttribute('height',H-3);
      cb.setAttribute('fill','none');cb.setAttribute('stroke','#d97878');cb.setAttribute('stroke-width','2');cb.setAttribute('rx','2');
      cb.style.opacity=0; cb.style.transition='opacity .5s';
      g.appendChild(cb);
      const lbl=document.createElementNS(NS,'text');
      lbl.setAttribute('x',460);lbl.setAttribute('y',300-6*H-8);lbl.setAttribute('fill','#d97878');lbl.setAttribute('font-size','13');lbl.setAttribute('font-family','monospace');lbl.setAttribute('text-anchor','middle');
      lbl.textContent='42% of all samples — the hot path';
      lbl.style.opacity=0; lbl.style.transition='opacity .5s';
      g.appendChild(lbl);
      setTimeout(()=>{cb.style.opacity=1; lbl.style.opacity=1;},50);
    },300+data.length*230+200);
  }
});

/* 6 — FLAME GRAPH ANATOMY */
slides.push({html:`
  ${head('Reading a Flame Graph','Three rules, nothing more')}
  <div class="center-stage">
    <div class="row" style="align-items:stretch;">
      <div class="card reveal" style="width:230px;"><h4>Width = time</h4><p>Wider bar → more samples landed there → more total time spent.</p></div>
      <div class="card reveal" style="width:230px;"><h4>Height = stack depth</h4><p>Each layer up is a function called by the layer below it.</p></div>
      <div class="card reveal" style="width:230px;"><h4>Color = identity</h4><p>Not meaning — just tells adjacent functions apart. (Some tools color by module.)</p></div>
    </div>
    <div class="formula-box reveal" style="margin-top:10px;font-size:18px;">look for the <span class="v2">widest plateau</span> near the <span class="v">top</span> of the stack</div>
    <div class="subtitle reveal" style="text-align:center;">That plateau is a leaf function burning real time — not just relaying work downward. Fix that one first.</div>
  </div>`,
  init(root){ reveal(root,'.reveal',150,160); }
});

/* 7 — MEMORY PROFILING */
slides.push({html:`
  ${head('Memory Profiling','CPU tells you what runs. Memory tells you what stays.')}
  <div class="center-stage">
    <div class="twocol">
      <div class="col card reveal"><h4>Shallow size</h4><p>Memory held by the object itself — its own fields, nothing it points to.</p></div>
      <div class="col card reveal"><h4>Retained size</h4><p>Memory freed <i>if this object were deleted</i> — itself plus everything only it keeps alive.</p></div>
    </div>
    <div class="subtitle reveal" style="text-align:center;max-width:760px;">A 40-byte cache object retaining a 2GB map is a 40-byte shallow size — and a 2GB problem. Always sort a heap snapshot by retained size, never shallow.</div>
  </div>`,
  init(root){ reveal(root,'.reveal',150,170); }
});

/* 8 — MEMORY LEAK PATTERN */
slides.push({html:`
  ${head('Spotting a Leak','Healthy memory breathes. A leak only inhales.')}
  <div class="center-stage">
    <div class="twocol">
      <div class="col">
        <div style="width:420px;">${svg(420,220)}
          <line x1="30" y1="190" x2="400" y2="190" stroke="#2a2a34" stroke-width="2"/>
          <path id="healthy" d="M30,150 C70,90 90,180 130,140 C170,90 190,180 230,140 C270,90 290,180 330,140 C360,100 380,175 400,150" fill="none" stroke="#7ec98f" stroke-width="3"/>
        </svg></div>
        <div class="chip" style="border-color:#3f6b4a;color:#7ec98f;display:block;text-align:center;margin-top:6px;">healthy: GC reclaims each cycle</div>
      </div>
      <div class="col">
        <div style="width:420px;">${svg(420,220)}
          <line x1="30" y1="190" x2="400" y2="190" stroke="#2a2a34" stroke-width="2"/>
          <path id="leak" d="M30,180 L90,150 L90,180 L150,120 L150,175 L210,90 L210,168 L270,55 L270,160 L330,25 L330,150 L390,5" fill="none" stroke="#d97878" stroke-width="3"/>
        </svg></div>
        <div class="chip" style="border-color:#6b3f3f;color:#d97878;display:block;text-align:center;margin-top:6px;">leak: floor rises every cycle</div>
      </div>
    </div>
    <div class="subtitle reveal" style="text-align:center;">Take two heap snapshots minutes apart and diff them. Whatever grew and never shrank is your leak.</div>
  </div>`,
  init(root){
    reveal(root,'.eyebrow,.title,.subtitle,.chip',300,180);

slides.push({html:`

    function curve(p,maxN,H,W,x0,y0){

/* 26 — TAIL AT SCALE / FAN-OUT */
slides.push({html:`
  ${head('The Tail at Scale','Fan-out turns rare slowness into common slowness')}
  <div class="center-stage">
    <div class="formula-box reveal" style="font-size:20px;">P(max of N ≤ t) = P(one ≤ t) <span class="v">^N</span></div>

    </svg></div>
    <div class="subtitle reveal" style="text-align:center;max-width:820px;">If each backend has a 1% chance of a slow (p99) response, and your request fans out to <b style="color:#e0a458">100</b> of them in parallel, the chance <i>at least one</i> is slow is 1&minus;0.99<sup>100</sup> ≈ <b style="color:#d97878">63%</b>. The rare tail becomes the typical outcome.</div>
  </div>`,
  init(root){
    reveal(root,'.eyebrow,.title,.formula-box,.subtitle',150,190);
    const g=root.querySelector('#fanout');
    const rows=[{n:1,y:30,p:0.01},{n:10,y:90,p:0.096},{n:100,y:150,p:0.63}];
    rows.forEach((row,ri)=>{
      const label=document.createElementNS(NS,'text');
      label.setAttribute('x',10);label.setAttribute('y',row.y+5);label.setAttribute('fill','#8d8d9a');label.setAttribute('font-size','12');label.setAttribute('font-family','monospace');
      label.textContent='N='+row.n;
      g.appendChild(label);
      const trackW=600;
      const bg=document.createElementNS(NS,'rect');
      bg.setAttribute('x',70);bg.setAttribute('y',row.y-10);bg.setAttribute('width',trackW);bg.setAttribute('height',20);bg.setAttribute('rx',10);

      g.appendChild(bg);
      const fg=document.createElementNS(NS,'rect');
      fg.setAttribute('x',70);fg.setAttribute('y',row.y-10);fg.setAttribute('width',0);fg.setAttribute('height',20);fg.setAttribute('rx',10);
      fg.setAttribute('fill', row.p>0.3? '#d97878':(row.p>0.05?'#e0a458':'#4fd1c5'));
      fg.style.transition='width 1.2s cubic-bezier(.2,.8,.2,1)';
      g.appendChild(fg);
      const pct=document.createElementNS(NS,'text');
      pct.setAttribute('x',70+trackW+14);pct.setAttribute('y',row.y+5);pct.setAttribute('fill','#cfcfd8');pct.setAttribute('font-size','13');pct.setAttribute('font-family','monospace');
      g.appendChild(pct);
      setTimeout(()=>{
        fg.setAttribute('width', trackW*row.p);
        countUpText(pct, row.p*100);
      }, 700+ri*450);
    });
    function countUpText(el,to){
      const start=performance.now();
      function step(t){
        const p=Math.min(1,(t-start)/1000);

/* ============================= RENDER / NAV ============================= */
const deck=document.getElementById('deck');
slides.forEach((s,i)=>{
  const div=document.createElement('div');
  div.className='slide';
  div.dataset.index=i;
  div.innerHTML=s.html;
  deck.appendChild(div);
});
const dotsWrap=document.getElementById('dots');
slides.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='dot';
  d.addEventListener('click',()=>goTo(i));
  dotsWrap.appendChild(d);
});
let current=0;
function goTo(i){
  if(i<0||i>=slides.length) return;
  document.querySelectorAll('.slide').forEach(el=>el.classList.remove('active'));
  const el=deck.children[i];
  el.classList.add('active');
  current=i;
  document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('active',idx===i));
  document.getElementById('counter').textContent=(i+1)+' / '+slides.length;
  const hint=document.getElementById('hint');
  if(i>0){ hint.style.opacity=0; }
  if(slides[i].init){ try{ slides[i].init(el); }catch(e){ console.error(e); } }
}
document.getElementById('nextBtn').addEventListener('click',()=>goTo(current+1));
document.getElementById('prevBtn').addEventListener('click',()=>goTo(current-1));
document.getElementById('zoneR').addEventListener('click',()=>goTo(current+1));
document.getElementById('zoneL').addEventListener('click',()=>goTo(current-1));
window.addEventListener('keydown',(e)=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); goTo(current+1);}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); goTo(current-1);}
  if(e.key==='Home') goTo(0);
  if(e.key==='End') goTo(slides.length-1);
});
function fitStage(){
  const stage=document.getElementById('stage');
  const scale=Math.min(window.innerWidth/1280, window.innerHeight/720)*0.94;
  stage.style.transform=`translate(-50%,-50%) scale(${scale})`;
}
window.addEventListener('resize',fitStage);
fitStage();
goTo(0);
setTimeout(()=>{ document.getElementById('hint').style.opacity=1; },400);
</script>
