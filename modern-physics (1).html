<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Physics — A Visual Lecture</title>
<style>
  :root{
    --bg:#07070c; --ink:#e7e7ee; --dim:#8b8b98;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  #stage{position:relative;aspect-ratio:16/9;width:min(100vw,177.78vh);
    height:min(56.25vw,100vh);background:var(--bg);overflow:hidden;
    box-shadow:0 0 80px rgba(0,0,0,.8);}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  /* controls */
  #bar{position:absolute;left:0;right:0;bottom:0;height:6.2%;display:flex;
    align-items:center;gap:2%;padding:0 2.4%;z-index:5;
    background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0));}
  .btn{appearance:none;border:1px solid #2b2b38;background:#0e0e16;color:#cfcfd8;
    border-radius:7px;padding:.5em .9em;font-size:min(1.6vh,15px);cursor:pointer;
    font-family:inherit;transition:.15s;white-space:nowrap;}
  .btn:hover{background:#181824;border-color:#3a3a4a;color:#fff;}
  .btn:focus-visible{outline:2px solid #5c8bd6;outline-offset:2px;}
  #track{flex:1;height:4px;background:#1a1a24;border-radius:3px;position:relative;cursor:pointer;}
  #fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#5c8bd6;border-radius:3px;transition:width .3s;}
  #count{color:var(--dim);font-size:min(1.6vh,14px);min-width:5.4em;text-align:right;font-variant-numeric:tabular-nums;}
  #menuBtn{position:absolute;top:2.5%;right:2.4%;z-index:6;}
  #menu{position:absolute;inset:0;z-index:20;background:rgba(6,6,12,.97);
    display:none;flex-direction:column;padding:4% 6%;overflow-y:auto;}
  #menu.open{display:flex;}
  #menu h2{color:#e7e7ee;font-weight:600;font-size:min(3.4vh,30px);margin:0 0 .3em;}
  #menu p{color:var(--dim);margin:0 0 1.6em;font-size:min(1.9vh,16px);}
  .mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:.5em 2.4em;}
  .mitem{display:flex;gap:.7em;align-items:baseline;color:#c2c2ce;padding:.42em .3em;
    cursor:pointer;border-radius:6px;font-size:min(1.9vh,15px);border-bottom:1px solid #14141d;}
  .mitem:hover{background:#12121b;color:#fff;}
  .mitem b{color:#5c8bd6;font-variant-numeric:tabular-nums;min-width:1.8em;font-weight:600;}
  .mitem .sec{margin-left:auto;color:#6a6a78;font-size:.82em;}
  .hint{position:absolute;bottom:8.5%;right:2.6%;color:#4a4a58;font-size:min(1.5vh,12px);z-index:4;
    letter-spacing:.03em;pointer-events:none;}
  @media (max-width:640px){ .mgrid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <button class="btn" id="menuBtn">Contents</button>
  <div class="hint">← →  navigate &nbsp;·&nbsp; Space next</div>
  <div id="bar">
    <button class="btn" id="prev">← Prev</button>
    <div id="track"><div id="fill"></div></div>
    <button class="btn" id="next">Next →</button>
    <div id="count">1 / 1</div>
  </div>
  <div id="menu"></div>
</div></div>
<script>
"use strict";
/* ============================================================
   ENGINE  —  fixed 1280x720 logical canvas, DPR-scaled
   ============================================================ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1280, H = 720;
function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener('resize', resize);

/* palette — muted, low-glow */
const C = {
  bg:'#07070c', ink:'#e7e7ee', dim:'#8f8f9c', faint:'#5a5a68',
  blue:'#5c8bd6', teal:'#4fb0c6', gold:'#d4a94f', green:'#6cbf84',
  red:'#d47a6a', purple:'#9b7bd4', pink:'#c77bab', grid:'#191922',
  gridB:'#23232f', mirror:'#7d7d8c'
};
const SERIF = 'Georgia, "Cambria Math", "STIX Two Text", serif';
const SANS  = 'Inter, "Segoe UI", system-ui, sans-serif';

/* math helpers */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeIO =t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const easeOutBack=t=>{t=clamp(t,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
/* reveal alpha: 0..1 eased, given step-time t, delay, duration */
const rise=(t,delay=0,dur=.6)=>easeOut(clamp((t-delay)/dur,0,1));

/* drawing primitives ---------------------------------------- */
function text(str,x,y,o={}){
  ctx.save();
  ctx.font=`${o.weight||''} ${o.size||20}px ${o.font||SANS}`.trim();
  ctx.fillStyle=o.color||C.ink;
  ctx.globalAlpha=o.alpha==null?1:o.alpha;
  ctx.textAlign=o.align||'center';
  ctx.textBaseline=o.baseline||'alphabetic';
  if(o.spacing){ // letter spacing
    ctx.textAlign='left';
    let tot=0,ws=[];
    for(const ch of str){const w=ctx.measureText(ch).width+o.spacing;ws.push(w);tot+=w;}
    let sx = o.align==='center'? x-tot/2 : o.align==='right'? x-tot : x;
    let i=0; for(const ch of str){ctx.fillText(ch,sx,y);sx+=ws[i++];}
  } else ctx.fillText(str,x,y);
  ctx.restore();
}
function mtext(str,x,y,o={}){ o.font=SERIF; return text(str,x,y,o); }
function line(x1,y1,x2,y2,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.dim;ctx.lineWidth=o.w||2;
  ctx.globalAlpha=o.alpha==null?1:o.alpha;
  if(o.dash)ctx.setLineDash(o.dash);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function circle(x,y,r,o={}){
  ctx.save();ctx.globalAlpha=o.alpha==null?1:o.alpha;
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);
  if(o.glow){ctx.shadowColor=o.fill||o.stroke;ctx.shadowBlur=o.glow;}
  if(o.fill){ctx.fillStyle=o.fill;ctx.fill();}
  if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=o.w||2;ctx.stroke();}
  ctx.restore();
}
function rect(x,y,w,h,o={}){
  ctx.save();ctx.globalAlpha=o.alpha==null?1:o.alpha;
  if(o.r){roundPath(x,y,w,h,o.r);}else{ctx.beginPath();ctx.rect(x,y,w,h);}
  if(o.fill){ctx.fillStyle=o.fill;ctx.fill();}
  if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=o.w||2;if(o.dash)ctx.setLineDash(o.dash);ctx.stroke();}
  ctx.restore();
}
function roundPath(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function arrow(x1,y1,x2,y2,o={}){
  const col=o.color||C.ink,w=o.w||2.4,head=o.head||10;
  line(x1,y1,x2,y2,{color:col,w,alpha:o.alpha,dash:o.dash});
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.save();ctx.globalAlpha=o.alpha==null?1:o.alpha;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-head*Math.cos(a-.4),y2-head*Math.sin(a-.4));
  ctx.lineTo(x2-head*Math.cos(a+.4),y2-head*Math.sin(a+.4));
  ctx.closePath();ctx.fill();ctx.restore();
}
/* function plot on axes */
function plot(fn,x0,x1,mapX,mapY,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.blue;ctx.lineWidth=o.w||2.6;
  ctx.globalAlpha=o.alpha==null?1:o.alpha;ctx.lineJoin='round';
  if(o.dash)ctx.setLineDash(o.dash);
  ctx.beginPath();let first=true;
  const N=o.N||240;
  for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N;let y=fn(x);
    if(!isFinite(y))continue;const px=mapX(x),py=mapY(y);
    if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);}
  ctx.stroke();ctx.restore();
}
/* wave stroke sampled */
function wavePath(pts,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.blue;ctx.lineWidth=o.w||2.4;
  ctx.globalAlpha=o.alpha==null?1:o.alpha;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.stroke();ctx.restore();
}

/* section-tag + title + caption zones (fixed, non-overlapping) */
const TITLE_Y=66, SUB_Y=99, CAP_Y=632;
function header(tag,title,sub,a=1){
  if(tag) text(tag.toUpperCase(),44,46,{align:'left',size:13,color:C.faint,spacing:2.4,alpha:a,baseline:'middle'});
  if(title) text(title,W/2,TITLE_Y,{size:31,color:C.ink,weight:'600',alpha:a});
  if(sub) text(sub,W/2,SUB_Y,{size:16,color:C.dim,alpha:a});
  line(44,116,W-44,116,{color:'#15151e',w:1,alpha:a});
}
/* caption — supports plain string or {kind,text} for RECAP/GAP/FILL */
function caption(cap,a=1){
  if(!cap)return;
  if(typeof cap==='string'){
    wrapCap(cap,C.ink,a); return;
  }
  const map={recap:['RECAP',C.green],gap:['GAP',C.gold],fill:['FILL',C.blue],
             note:['',C.dim],key:['KEY IDEA',C.teal]};
  const m=map[cap.kind]||['',C.ink];
  let ty=CAP_Y;
  if(m[0]){
    text(m[0],W/2,ty-24,{size:12.5,color:m[1],spacing:3,weight:'700',alpha:a});
  }
  wrapCap(cap.text, cap.kind==='gap'?C.gold:C.ink, a, ty);
}
function wrapCap(str,color,a,baseY=CAP_Y){
  ctx.font=`19px ${SANS}`;
  const maxW=W-260, words=str.split(' ');let lines=[],cur='';
  for(const w of words){const t=cur?cur+' '+w:w;
    if(ctx.measureText(t).width>maxW){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);
  const lh=27, startY=baseY-(lines.length-1)*lh/2;
  lines.forEach((ln,i)=>text(ln,W/2,startY+i*lh,{size:19,color,alpha:a,baseline:'middle'}));
}
/* progress dots for steps of a slide (top-right under menu) */
function stepDots(step,total,a=1){
  const n=total, gap=15, x0=W-56-(n-1)*gap;
  for(let i=0;i<n;i++){
    circle(x0+i*gap, 96, 3.4, {fill:i<=step?C.blue:'#2a2a36', alpha:a});
  }
}

/* ============================================================
   SLIDE RUNTIME
   ============================================================ */
const SLIDES = [];               // populated below
let idx=0, step=0, slideT0=0, stepT0=0;
const nowS=()=>performance.now()/1000;

function curSteps(){ return Math.max(1,(SLIDES[idx].steps||['']).length); }
function enterSlide(i,keepStep){ idx=clamp(i,0,SLIDES.length-1);
  if(!keepStep) step=0; slideT0=nowS(); stepT0=nowS(); if(SLIDES[idx].onEnter)SLIDES[idx].onEnter(); syncUI(); }
function advance(){ if(step<curSteps()-1){step++;stepT0=nowS();syncUI();}
  else if(idx<SLIDES.length-1){enterSlide(idx+1);} }
function back(){ if(step>0){step--;stepT0=nowS();syncUI();}
  else if(idx>0){idx--;step=curSteps()-1;slideT0=nowS();stepT0=nowS();if(SLIDES[idx].onEnter)SLIDES[idx].onEnter();syncUI();} }

/* main loop */
function frame(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  const s=SLIDES[idx];
  const T=nowS()-slideT0, stepT=nowS()-stepT0;
  try{ s.draw({T,stepT,step,now:nowS()}); }catch(e){ text('render error: '+e.message,W/2,360,{color:C.red}); console.error(e); }
  requestAnimationFrame(frame);
}

/* UI sync */
const elCount=document.getElementById('count'),
      elFill=document.getElementById('fill');
function syncUI(){
  // global progress across all steps of all slides (approx by slide)
  const p=(idx + (step)/curSteps())/SLIDES.length;
  elFill.style.width=(p*100).toFixed(1)+'%';
  elCount.textContent=(idx+1)+' / '+SLIDES.length;
  [...document.querySelectorAll('.mitem')].forEach((m,i)=>m.style.color = i===idx?'#fff':'');
}

/* input */
document.getElementById('next').onclick=advance;
document.getElementById('prev').onclick=back;
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();advance();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();back();}
  else if(e.key==='Home'){enterSlide(0);}
  else if(e.key==='End'){enterSlide(SLIDES.length-1);}
  else if(e.key==='Escape'){document.getElementById('menu').classList.remove('open');}
});
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  if((e.clientX-r.left)/r.width < .32) back(); else advance();
});
document.getElementById('track').onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  const p=clamp((e.clientX-r.left)/r.width,0,1);
  enterSlide(Math.round(p*(SLIDES.length-1)));
};

/* menu */
const menu=document.getElementById('menu');
document.getElementById('menuBtn').onclick=()=>menu.classList.toggle('open');
function buildMenu(){
  let html='<h2>Modern Physics — Contents</h2><p>Special relativity through quantum statistics. Click any slide. Use ← → to move; each slide reveals in steps.</p><div class="mgrid">';
  SLIDES.forEach((s,i)=>{ html+=`<div class="mitem" data-i="${i}"><b>${String(i+1).padStart(2,'0')}</b><span>${s.title||'—'}</span><span class="sec">${s.sec||''}</span></div>`; });
  html+='</div>';
  menu.innerHTML=html;
  menu.querySelectorAll('.mitem').forEach(m=>m.onclick=()=>{enterSlide(+m.dataset.i);menu.classList.remove('open');});
}

/* ============================================================
   SHARED SCENE HELPERS
   ============================================================ */
function ship(cx,cy,scale,col,a=1){ // little rocket/car, nose right
  ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);ctx.globalAlpha=a;
  ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-30,-12);ctx.lineTo(18,-12);ctx.quadraticCurveTo(40,0,18,12);
  ctx.lineTo(-30,12);ctx.quadraticCurveTo(-36,0,-30,-12);ctx.closePath();
  ctx.globalAlpha=a*.22;ctx.fill();ctx.globalAlpha=a;ctx.stroke();
  circle(-6,0,5,{stroke:col,w:2,alpha:a});
  ctx.restore();
}
function speedo(x,y,label,val,frac,col,a=1){ // horizontal speed bar 0..c
  const w=150,h=9;
  text(label,x,y-14,{size:13,color:C.dim,align:'left',alpha:a});
  rect(x,y,w,h,{stroke:'#2c2c38',w:1.4,r:4,alpha:a});
  rect(x+1.5,y+1.5,(w-3)*clamp(frac,0,1),h-3,{fill:col,r:3,alpha:a});
  text(val,x+w+12,y+h-1,{size:14,color:col,align:'left',alpha:a,font:SERIF});
  text('0',x,y+h+14,{size:10,color:C.faint,align:'left',alpha:a});
  text('c',x+w,y+h+14,{size:10,color:C.faint,align:'right',alpha:a});
}
function axes(ox,oy,ax,ay,o={}){ // origin bottom-left; ax,ay axis pixel lengths
  const col=o.color||'#3a3a48';
  arrow(ox,oy,ox+ax,oy,{color:col,w:1.6,head:8});
  arrow(ox,oy,ox,oy-ay,{color:col,w:1.6,head:8});
  if(o.xl)text(o.xl,ox+ax,oy+22,{size:14,color:C.dim,align:'right'});
  if(o.yl)text(o.yl,ox-8,oy-ay-4,{size:14,color:C.dim,align:'right'});
}
function gauss(x,mu,s){ return Math.exp(-((x-mu)**2)/(2*s*s)); }

/* ============================================================
   SLIDE 01 — TITLE
   ============================================================ */
SLIDES.push({ sec:'Overture', title:'Two Revolutions', steps:['','',''],
 draw({T,step}){
  // travelling photon tracing a sine
  const a0=rise(T,.1,1);
  const y0=430, span=W-160, ph=(T*130)%(span+40);
  ctx.save();ctx.globalAlpha=.5*a0;
  ctx.strokeStyle=C.blue;ctx.lineWidth=2;ctx.beginPath();
  for(let x=0;x<=ph;x+=4){const px=80+x, py=y0-Math.sin(x/34)*16;
    x?ctx.lineTo(px,py):ctx.moveTo(px,py);}
  ctx.stroke();ctx.restore();
  circle(80+ph,y0-Math.sin(ph/34)*16,4,{fill:C.blue,glow:8,alpha:a0});

  mtext('MODERN PHYSICS',W/2,300,{size:62,color:C.ink,weight:'600',alpha:rise(T,.15,1),spacing:2});
  text('when space, time, and matter stopped behaving',W/2,346,{size:19,color:C.dim,alpha:rise(T,.5,1)});

  if(step>=1){const a=rise((step>=1?T:0),step===1?0:0,.8);
    text('SPECIAL  RELATIVITY',W/2-230,540,{size:16,color:C.teal,alpha:a,spacing:2,weight:'600'});
    text('the very fast',W/2-230,566,{size:13,color:C.faint,alpha:a});}
  if(step>=2){const a=rise(T,0,.8);
    text('QUANTUM  MECHANICS',W/2+230,540,{size:16,color:C.purple,alpha:a,spacing:2,weight:'600'});
    text('the very small',W/2+230,566,{size:13,color:C.faint,alpha:a});
    line(W/2,528,W/2,572,{color:'#22222e',w:1,alpha:a});}
  text('A guided, animated lecture — press  →  to begin',W/2,650,{size:15,color:C.faint,alpha:rise(T,1,1)});
 }});

/* ============================================================
   SLIDE 02 — THE PUZZLE (velocity addition breaks)
   ============================================================ */
SLIDES.push({ sec:'Special Relativity', title:'A Crack in Classical Physics',
 sub:'Speeds add — until you try it with light',
 steps:[
   'A ball thrown forward from a moving train: the ground sees the train speed plus the throw speed. Obvious.',
   {kind:'gap',text:'Now shine a flashlight instead. The ground should see c + v… but every experiment says it sees exactly c. Why won\'t light obey?'},
   {kind:'key',text:'Light\'s speed is the same for everyone, no matter how they move. Something about space and time must give way.'}
 ],
 draw({T,step}){
  header('P7.1 · The setup','A Crack in Classical Physics','Speeds add — until you try it with light');
  stepDots(step,3);
  const trainX=lerp(180,420,easeIO(clamp(T/2,0,1)));
  const ty=270;
  // rail
  line(120,ty+34,W-120,ty+34,{color:'#20202a',w:2});
  ship(trainX,ty,1.5,C.dim);
  arrow(trainX+70,ty,trainX+120,ty,{color:C.faint,w:2,head:8});
  mtext('v = 100,000 km/s',trainX+95,ty-24,{size:14,color:C.dim});

  if(step===0){
    const p=(T*0.6)%1;
    const bx=trainX+40+p*260, by=ty-2;
    circle(bx,by,7,{fill:C.gold});
    mtext('throw  70',trainX+40,ty+62,{size:13,color:C.gold});
    speedo(430,470,'In the train',' 70',70/300,C.gold);
    speedo(700,470,'On the ground',' 170',170/300,C.gold);
    mtext('100  +  70  =  170   ✓',W/2,540,{size:22,color:C.green,alpha:rise(T,.4,.8)});
  } else {
    // light pulse
    const p=(T*0.9)%1;
    const lx=trainX+40+p*300, ly=ty-2;
    for(let k=0;k<3;k++)circle(lx-k*16,ly,5-k,{fill:C.blue,alpha:1-k*.3,glow:k?0:6});
    line(trainX+40,ly,lx,ly,{color:C.blue,w:1.4,alpha:.4});
    mtext('flash  c',trainX+40,ty+62,{size:13,color:C.blue});
    speedo(430,470,'In the train',' c',1,C.blue);
    speedo(700,470,'On the ground',' c',1,C.blue,step>=1?1:1);
    if(step>=1)mtext('100  +  c   =   c   ??',W/2,540,{size:22,color:C.red,alpha:rise(T,.2,.7)});
  }
  caption(SLIDES[idx].steps[step]);
 }});

/* ============================================================
   SLIDE 03 — POSTULATES
   ============================================================ */
SLIDES.push({ sec:'Special Relativity', title:'Einstein\'s Two Postulates',
 sub:'Everything relativistic follows from just these',
 steps:[
   'First: the laws of physics are identical in every frame moving at constant velocity. No experiment can tell you if you\'re "really" moving.',
   'Second: the speed of light in vacuum is c for every observer — a built-in constant of the universe, not a relative speed.',
   {kind:'fill',text:'Accept both, and simultaneity, time, and length can no longer be absolute. The rest of relativity is bookkeeping.'}
 ],
 draw({T,step}){
  header('P7.1 · Postulates','Einstein\'s Two Postulates','Everything relativistic follows from just these');
  stepDots(step,3);
  const bx=[360,900], by=300;
  // card 1
  const a1=rise(T,0,.6);
  rect(bx[0]-230,by-90,460,180,{stroke:step>=0?C.teal:'#222',w:1.6,r:14,alpha:a1});
  text('I  ·  PRINCIPLE OF RELATIVITY',bx[0],by-52,{size:15,color:C.teal,weight:'600',alpha:a1,spacing:1});

function lightClock(cx,top,bot,phase,col,a=1,moving=false,prevX=null){
  // mirrors
  line(cx-40,top,cx+40,top,{color:C.mirror,w:4,alpha:a});
  line(cx-40,bot,cx+40,bot,{color:C.mirror,w:4,alpha:a});

  const py = p<.5 ? lerp(bot,top,p*2) : lerp(top,bot,(p-.5)*2);
  return {x:cx,y:py};
}

  const ex=ox+Math.cos(th)*R, ey=oy-Math.sin(th)*R;
  arrow(ox,oy,ex,ey,{color:C.blue,w:2.8,head:10});
  mtext('|ψ⟩',ex+ (ex>ox?18:-18),ey-6,{size:16,color:C.blue});
  if(step>=1){
    line(ex,ey,ex,oy,{color:C.gold,w:1,dash:[3,3],alpha:.6});
    line(ex,ey,ox,ey,{color:C.teal,w:1,dash:[3,3],alpha:.6});
    const al=Math.cos(th),be=Math.sin(th);
    mtext(`|ψ⟩ = ${al.toFixed(2)}|0⟩ + ${be.toFixed(2)}|1⟩`,W/2+250,300,{size:20,color:C.ink});
    text(`P(0)=|α|²=${(al*al).toFixed(2)}    P(1)=|β|²=${(be*be).toFixed(2)}`,W/2+250,338,{size:15,color:C.dim,font:SERIF});
  }
  if(step>=2){
    mtext('⟨φ|ψ⟩ = overlap (a number)',W/2+250,410,{size:17,color:C.teal,alpha:rise(T,0,.6)});
    mtext('operators → matrices that rotate |ψ⟩',W/2+250,446,{size:17,color:C.purple,alpha:rise(T,.2,.6)});
  }
  caption(SLIDES[idx].steps[step]);
 }});

 ],

        ctx.save();ctx.strokeStyle=C.purple;ctx.lineWidth=2.2;ctx.beginPath();
        for(let t=0;t<=6.28;t+=0.05){const y=300-Math.sin(t*t*0.6)*26;t===0?ctx.moveTo(x,y):ctx.lineTo(x+t*30,y);}

      arrow(tx+16*dx,ty+16*dy,tx+ (120+ (k%3)*30)*dx,ty+(120+(k%3)*30)*dy,{color:C.gold,w:1.4,head:6,alpha:.7});}
    text('fire particles → the deflection pattern reveals the target',W/2,510,{size:15,color:C.teal});
  }
  caption(SLIDES[idx].steps[step]);
 }});

 ],

      if(yy>EF-6){ // filled below E_F, fuzzy near top

        circle(fx-24,yy-8,6,{fill:C.teal,alpha:0.9}); circle(fx+24,yy-8,6,{fill:C.gold,alpha:0.9});

  caption(SLIDES[idx].steps[step]);
