<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>How LLMs Are Built — Tokenization to MoE</title>
<style>
:root{
  --bg:#08080c;
  --panel:#111117;
  --panel2:#15151d;
  --border:#25252f;
  --text:#d8d8e0;
  --text-dim:#8888a0;
  --teal:#4fd1c5;
  --amber:#e0a458;
  --blue:#63b3ed;
  --purple:#b794f4;
  --rose:#e08a8a;
  --green:#68d391;
  --red:#e57373;
  --gray:#9aa0b0;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  overflow:hidden;
  user-select:none;
}
#app{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;}

/* header */
#hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#0a0a10,#08080c);
  flex:0 0 auto;
}
#hdr .chap{color:var(--text-dim);font-size:12px;letter-spacing:2px;text-transform:uppercase;}
#hdr .ttl{font-size:19px;font-weight:600;color:#f0f0f5;margin-top:2px;}
#hdr .sub{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
#dots{display:flex;gap:5px;flex-wrap:wrap;max-width:320px;justify-content:flex-end;}
.dot{width:6px;height:6px;border-radius:50%;background:#2a2a35;transition:all .25s;}
.dot.active{background:var(--teal);width:16px;border-radius:3px;}
.dot.done{background:#454555;}

/* main split */
#main{flex:1 1 auto;display:flex;min-height:0;}
#canvasWrap{flex:0 0 58%;position:relative;border-right:1px solid var(--border);}
canvas{width:100%;height:100%;display:block;}
#panel{flex:1 1 42%;padding:22px 26px;overflow-y:auto;background:var(--panel);}
#panel::-webkit-scrollbar{width:8px;}
#panel::-webkit-scrollbar-thumb{background:#26262f;border-radius:4px;}

.p-lead{font-size:14.5px;line-height:1.6;color:#c8c8d4;margin-bottom:14px;}
.p-bullets{list-style:none;margin-bottom:16px;}
.p-bullets li{
  font-size:13.5px;line-height:1.55;color:var(--text-dim);
  padding-left:16px;position:relative;margin-bottom:8px;
}
.p-bullets li::before{content:"›";position:absolute;left:0;color:var(--accent,var(--teal));font-weight:700;}
.p-bullets b{color:#e2e2ea;font-weight:600;}

.formula-box{
  background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--accent,var(--teal));
  border-radius:6px;padding:14px 16px;margin:14px 0 10px 0;
}
.formula-box .flabel{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;}
.formula-box .feq{
  font-family:'Cambria Math',Cambria,'Times New Roman',serif;font-size:17px;color:#f0e8d0;
  text-align:center;padding:6px 0;letter-spacing:.3px;
}
.formula-box .fnote{font-size:11.5px;color:var(--text-dim);margin-top:8px;line-height:1.5;}

details.why{
  background:var(--panel2);border:1px solid var(--border);border-radius:6px;
  margin-bottom:10px;overflow:hidden;
}
details.why summary{
  padding:10px 14px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--accent,var(--teal));
  list-style:none;display:flex;align-items:center;gap:8px;
}
details.why summary::-webkit-details-marker{display:none;}
details.why summary::before{content:"+";display:inline-block;width:14px;color:var(--text-dim);font-weight:400;}
details.why[open] summary::before{content:"−";}
details.why .why-body{padding:0 16px 14px 16px;font-size:12.5px;line-height:1.6;color:var(--text-dim);}
details.why .why-body h4{color:#c8c8d4;font-size:11.5px;margin:10px 0 4px 0;text-transform:uppercase;letter-spacing:1px;}
details.why .why-body p{margin-bottom:6px;}

.tag-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.tag{font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);color:var(--text-dim);letter-spacing:.5px;}

/* footer nav */
#ftr{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:12px 28px;border-top:1px solid var(--border);background:#08080c;
}
.navbtn{
  background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:8px 18px;border-radius:6px;font-size:13px;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;gap:6px;
}
.navbtn:hover{border-color:var(--teal);color:var(--teal);}
.navbtn:disabled{opacity:.3;cursor:default;}
.navbtn:disabled:hover{border-color:var(--border);color:var(--text);}
#ftr .mid{font-size:11.5px;color:var(--text-dim);letter-spacing:1px;}
kbd{background:#1a1a22;border:1px solid #2a2a34;border-radius:3px;padding:1px 5px;font-size:10px;color:var(--text-dim);}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div>
      <div class="chap" id="chapLbl">CHAPTER</div>
      <div class="ttl" id="titleLbl">Title</div>
      <div class="sub" id="subLbl">Subtitle</div>
    </div>
    <div id="dots"></div>
  </div>
  <div id="main">
    <div id="canvasWrap"><canvas id="cv"></canvas></div>
    <div id="panel"></div>
  </div>
  <div id="ftr">
    <button class="navbtn" id="prevBtn">← Prev</button>
    <div class="mid"><span id="pos">1 / 1</span> &nbsp;·&nbsp; <kbd>←</kbd> <kbd>→</kbd> <kbd>space</kbd> to navigate</div>
    <button class="navbtn" id="nextBtn">Next →</button>
  </div>
</div>

<script>
/* ============================= UTIL ============================= */
const COLORS = {teal:'#4fd1c5',amber:'#e0a458',blue:'#63b3ed',purple:'#b794f4',rose:'#e08a8a',green:'#68d391',red:'#e57373',gray:'#9aa0b0',ink:'#f0f0f5',dim:'#55555f'};
function ease(t){t=Math.max(0,Math.min(1,t));return 1-Math.pow(1-t,3);}
function easeInOut(t){t=Math.max(0,Math.min(1,t));return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}

function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function box(ctx,x,y,w,h,opts){
  opts=opts||{};
  const r=opts.r!==undefined?opts.r:8;
  rrect(ctx,x,y,w,h,r);
  if(opts.fill){ctx.fillStyle=opts.fill;ctx.globalAlpha=opts.alpha!==undefined?opts.alpha:1;ctx.fill();ctx.globalAlpha=1;}
  if(opts.stroke){ctx.strokeStyle=opts.stroke;ctx.lineWidth=opts.lw||1.5;ctx.stroke();}
}
function txt(ctx,s,x,y,opts){
  opts=opts||{};
  ctx.font=(opts.weight||400)+' '+(opts.size||13)+'px -apple-system,Segoe UI,Arial';
  ctx.fillStyle=opts.color||COLORS.ink;
  ctx.textAlign=opts.align||'center';
  ctx.textBaseline=opts.baseline||'middle';
  ctx.globalAlpha=opts.alpha!==undefined?opts.alpha:1;
  ctx.fillText(s,x,y);
  ctx.globalAlpha=1;
}
function line(ctx,x1,y1,x2,y2,opts){
  opts=opts||{};
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
  ctx.strokeStyle=opts.color||COLORS.gray;ctx.lineWidth=opts.lw||1.5;
  if(opts.dash)ctx.setLineDash(opts.dash); else ctx.setLineDash([]);
  ctx.globalAlpha=opts.alpha!==undefined?opts.alpha:1;
  ctx.stroke();ctx.globalAlpha=1;ctx.setLineDash([]);
}
function arrow(ctx,x1,y1,x2,y2,opts){
  opts=opts||{};
  const p=opts.progress!==undefined?clamp(opts.progress,0,1):1;
  const ex=lerp(x1,x2,p), ey=lerp(y1,y2,p);
  line(ctx,x1,y1,ex,ey,opts);
  if(p>0.05){
    const ang=Math.atan2(ey-y1,ex-x1);
    const sz=opts.head||6;
    ctx.beginPath();
    ctx.moveTo(ex,ey);
    ctx.lineTo(ex-sz*Math.cos(ang-0.4),ey-sz*Math.sin(ang-0.4));
    ctx.lineTo(ex-sz*Math.cos(ang+0.4),ey-sz*Math.sin(ang+0.4));
    ctx.closePath();
    ctx.fillStyle=opts.color||COLORS.gray;ctx.globalAlpha=opts.alpha!==undefined?opts.alpha:1;
    ctx.fill();ctx.globalAlpha=1;
  }
}
function bg(ctx,W,H,t,seed){
  ctx.fillStyle='#08080c';ctx.fillRect(0,0,W,H);
  const n=26;seed=seed||0;
  for(let i=0;i<n;i++){
    const fx = (Math.sin(i*12.9898+seed)*43758.5453)%1;
    const fy = (Math.sin(i*78.233+seed)*12543.123)%1;
    const bx = ((fx<0?fx+1:fx))*W;
    const byBase = ((fy<0?fy+1:fy))*H;
    const by = ((byBase + t*10*(0.3+ (i%5)*0.1)) % (H+30))-15;
    const r = 0.6+ (i%4)*0.35;
    ctx.beginPath();ctx.arc(bx,by,r,0,7);
    ctx.fillStyle='rgba(150,160,190,'+(0.10+ (i%3)*0.05)+')';
    ctx.fill();
  }
}
function grid(W,H){return {W,H,cx:W/2,cy:H/2};}

/* token bubble */
function tokenBubble(ctx,x,y,label,color,alpha,scale){
  scale=scale||1;alpha=alpha===undefined?1:alpha;
  const w=Math.max(30,label.length*8.2+16)*scale, h=26*scale;
  ctx.save();ctx.translate(x,y);
  box(ctx,-w/2,-h/2,w,h,{fill:color+'22',stroke:color,lw:1.4,r:6,alpha:alpha});
  txt(ctx,label,0,1,{size:12.5*scale,color:color,weight:600,alpha:alpha});
  ctx.restore();
}

/* ============================= SLIDES ============================= */
const S=[];

/* ---- 0. TITLE ---- */
S.push({chap:'Chapter 9', title:'How Language Models Are Built', sub:'From raw text to an aligned, efficient model — Feynman-style', accent:COLORS.teal,
panel:`
<div class="p-lead">Big idea: a modern LLM is not built in one step. It is a <b>pipeline</b> — each stage takes a rough capability and sharpens it. We'll walk the whole pipeline, and at every stage ask: <i>what problem does this solve, and why does the math work?</i></div>
<ul class="p-bullets">
<li><b>Represent</b> — Tokenization, BPE, SentencePiece</li>
<li><b>Learn language</b> — Pretraining</li>
<li><b>Learn to follow instructions</b> — Instruction Tuning</li>
<li><b>Learn human preference</b> — RLHF, PPO, DPO</li>
<li><b>Adapt cheaply</b> — LoRA, QLoRA, PEFT</li>
<li><b>Shrink & speed up</b> — Quantization, Distillation, MoE</li>
</ul>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,1);
  const cx=W/2,cy=H*0.42;
  const e=ease(clamp(t/1.2,0,1));
  txt(ctx,'THE LLM PIPELINE',cx,cy-40,{size:13,color:COLORS.teal,weight:700,alpha:e});
  ctx.save();
  txt(ctx,'raw text  →  tokens  →  base model  →  helpful assistant',cx,cy,{size:15.5*Math.min(1,0.7+e*0.3),color:'#e8e8ee',weight:500,alpha:e});
  ctx.restore();
  // flowing chain of small boxes
  const stages=['Tokenize','Pretrain','SFT','RLHF/DPO','LoRA','Quantize'];
  const cols=[COLORS.teal,COLORS.blue,COLORS.purple,COLORS.rose,COLORS.green,COLORS.amber];
  const n=stages.length, gap=Math.min(126,(W-120)/n);
  const startX=cx-(gap*(n-1))/2;
  for(let i=0;i<n;i++){
    const appear=clamp((t-0.6-i*0.18)/0.5,0,1);
    const ea=ease(appear);
    const x=startX+i*gap, y=cy+70;
    if(ea<=0)continue;
    tokenBubble(ctx,x,y,stages[i],cols[i],ea,0.95+0.05*ea);
    if(i<n-1){
      const nextAppear=clamp((t-0.6-(i+1)*0.18)/0.5,0,1);
      arrow(ctx,x+58,y,x+gap-58,y,{color:'#3a3a45',progress:clamp((t-0.75-i*0.18)/0.4,0,1),head:5});
    }
  }
}});

/* ---- 1. ROADMAP ---- */
S.push({chap:'Roadmap', title:'The Journey in One Diagram', sub:'Six stages, each solving a different problem', accent:COLORS.gray,
panel:`
<div class="p-lead">Think of training an LLM like raising and then educating someone: first they learn to <b>read</b> (tokenize), then absorb the <b>world</b> (pretrain), then learn <b>manners</b> (instruction tuning), then learn <b>judgment</b> (RLHF/DPO). Afterward we teach them to specialize cheaply (LoRA) and speak efficiently (quantization, distillation, MoE).</div>
<ul class="p-bullets">
<li>Every stage changes <b>what the model optimizes for</b>, not just how it's trained.</li>
<li>Later stages assume earlier ones are already solved — order matters.</li>
<li>We'll open each box below across the next slides.</li>
</ul>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,2);
  const items=[
    {l:'Tokenization',c:COLORS.teal},{l:'Pretraining',c:COLORS.blue},
    {l:'Instruction\nTuning',c:COLORS.purple},{l:'RLHF / DPO',c:COLORS.rose},
    {l:'PEFT\n(LoRA/QLoRA)',c:COLORS.green},{l:'Quantize /\nDistill / MoE',c:COLORS.amber}
  ];
  const cols=3,rows=2;
  const mW=W*0.82,mH=H*0.7,ox=W*0.09,oy=H*0.16;
  const cw=mW/cols, ch=mH/rows;
  items.forEach((it,i)=>{
    const r=Math.floor(i/cols),c=i%cols;
    const x=ox+c*cw+cw/2, y=oy+r*ch+ch/2;
    const appear=ease(clamp((t-i*0.15)/0.5,0,1));
    if(appear<=0)return;
    const w=cw*0.78,h=ch*0.5;
    ctx.save();
    ctx.translate(x,y-(1-appear)*10);
    box(ctx,-w/2,-h/2,w,h,{fill:'#101018',stroke:it.c,lw:1.6,r:10,alpha:appear});
    it.l.split('\n').forEach((ln,li)=>{
      txt(ctx,ln,0,(li-(it.l.split('\n').length-1)/2)*16,{size:13,color:it.c,weight:600,alpha:appear});
    });
    ctx.restore();
    if(c<cols-1){
      const p=clamp((t-i*0.15-0.4)/0.4,0,1);
      arrow(ctx,ox+c*cw+cw-6,y,ox+(c+1)*cw+6,y,{color:'#3a3a45',progress:p});
    } else if(r<rows-1){
      const p=clamp((t-i*0.15-0.4)/0.4,0,1);
      arrow(ctx,ox+cw*0.39,oy+r*ch+ch-4,ox+cw*0.39,oy+(r+1)*ch+4,{color:'#3a3a45',progress:p});
    }
  });
}});

/* ---- 2. TOKENIZATION: WHY ---- */
S.push({chap:'1 · Tokenization', title:'Why Break Text Into Pieces?', sub:'Neural nets need numbers, not letters', accent:COLORS.teal,
panel:`
<div class="p-lead">A neural network only understands vectors of numbers. So before anything else, text must be chopped into a <b>fixed vocabulary of pieces</b> (tokens), each mapped to an integer ID, then to a learned vector.</div>
<ul class="p-bullets">
<li><b>Characters</b>: tiny vocab, but sequences get very long (slow, hard to learn long-range meaning).</li>
<li><b>Whole words</b>: short sequences, but vocab explodes and any unseen word becomes "unknown".</li>
<li><b>Subwords</b> (the compromise): common words stay whole, rare words split into meaningful chunks.</li>
</ul>
<div class="formula-box"><div class="flabel">Core idea</div>
<div class="feq">"unhappiness"  →  [un] [happi] [ness]</div>
<div class="fnote">Rare word, but built from pieces the model has seen thousands of times elsewhere.</div></div>
<details class="why"><summary>Why does this actually matter?</summary><div class="why-body">
<h4>Reasoning</h4><p>Sequence length drives compute cost (attention is roughly quadratic in length), and vocabulary size drives the size of the embedding table. Subword tokenization is the sweet spot that keeps both under control while still handling any word, even ones never seen in training.</p>
<h4>Real world</h4><p>This is why GPT-style models can handle typos, made-up words, and code identifiers like <i>getUserById</i> — they're built from familiar sub-pieces.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,3);
  const word='unhappiness';
  const cx=W/2, y0=H*0.28;
  txt(ctx,'"'+word+'"',cx,y0,{size:20,color:'#eee',weight:600});
  const rows=[
    {label:'Characters',pieces:word.split(''),color:COLORS.rose,y:H*0.45,note:'11 tokens — long, slow'},
    {label:'Whole word',pieces:[word],color:COLORS.amber,y:H*0.63,note:'1 token — but "unknown" if unseen'},
    {label:'Subwords (BPE)',pieces:['un','happi','ness'],color:COLORS.teal,y:H*0.81,note:'3 tokens — balanced'}
  ];
  rows.forEach((row,ri)=>{
    const appear=ease(clamp((t-1.0-ri*0.6)/0.6,0,1));
    if(appear<=0)return;
    txt(ctx,row.label,W*0.14,row.y,{size:11.5,color:row.color,align:'left',weight:600,alpha:appear});
    let x=W*0.36;
    row.pieces.forEach((p,pi)=>{
      const pAppear=ease(clamp((t-1.0-ri*0.6-pi*0.08)/0.4,0,1));
      if(pAppear<=0)return;
      const w=Math.max(24,p.length*9+14);
      tokenBubble(ctx,x+w/2,row.y,p,row.color,pAppear,1);
      x+=w+5;
    });
    txt(ctx,row.note,W*0.86,row.y,{size:10.5,color:'#666',align:'right',alpha:appear});
  });
}});

/* ---- 3. TOKENIZATION TRADEOFF ---- */
S.push({chap:'1 · Tokenization', title:'The Length ↔ Vocabulary Tradeoff', sub:'You cannot shrink both at once', accent:COLORS.teal,
panel:`
<div class="p-lead">Every tokenizer trades off two costs: how many tokens a sentence becomes (sequence length) and how many unique tokens exist (vocabulary size). Both cost memory and compute — just in different places.</div>
<ul class="p-bullets">
<li><b>Long sequences</b> → more attention computation, harder to model long-range dependencies.</li>
<li><b>Huge vocabulary</b> → a giant embedding table and output softmax layer.</li>
<li>Production tokenizers (GPT, LLaMA) pick vocab sizes around <b>30k–100k</b> as the practical sweet spot.</li>
</ul>
<div class="formula-box"><div class="flabel">Rough cost per sentence</div>
<div class="feq">Attention cost ∝ L²&nbsp;&nbsp;&nbsp;&nbsp;Embedding cost ∝ V·d</div>
<div class="fnote">L = sequence length (tokens), V = vocabulary size, d = embedding dimension.</div></div>
<details class="why"><summary>Why quadratic in L?</summary><div class="why-body">
<h4>Reasoning</h4><p>Self-attention compares every token to every other token, giving L×L comparisons. Double the sequence length and you roughly quadruple the compute — so shorter, well-chosen tokens save real money at scale.</p>
<h4>Real world</h4><p>This is exactly why subword tokenizers, not raw characters, power every major LLM in production today.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,4);
  const cx=W*0.5, cy=H*0.55, R=Math.min(W,H)*0.30;
  txt(ctx,'sequence length',cx,cy+R+34,{size:11.5,color:'#888'});
  ctx.save();ctx.translate(cx-R-40,cy);ctx.rotate(-Math.PI/2);
  txt(ctx,'vocabulary size',0,0,{size:11.5,color:'#888'});
  ctx.restore();
  // axes
  line(ctx,cx-R,cy+R,cx+R,cy+R,{color:'#333'});
  line(ctx,cx-R,cy+R,cx-R,cy-R,{color:'#333'});
  const pts=[
    {x:0.92,y:0.08,l:'Char-level',c:COLORS.rose},
    {x:0.5,y:0.5,l:'Subword (BPE)',c:COLORS.teal},
    {x:0.1,y:0.95,l:'Whole-word',c:COLORS.amber}
  ];
  // curve
  const e=ease(clamp((t-0.4)/0.8,0,1));
  ctx.beginPath();
  for(let i=0;i<=40;i++){
    const f=i/40;
    const xx=cx-R+ (f)*2*R;
    const yy=cy+R - Math.pow(f,0.55)*2*R;
    if(i===0)ctx.moveTo(xx,cy+R-( (1-e))*0); 
    if(i/40<=e) { if(i===0)ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); }
  }
  ctx.strokeStyle='#3a3a45';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([]);
  pts.forEach((p,i)=>{
    const appear=ease(clamp((t-1.2-i*0.35)/0.5,0,1));
    if(appear<=0)return;
    const x=cx-R+p.x*2*R, y=cy+R-p.y*2*R;
    ctx.beginPath();ctx.arc(x,y,6*appear,0,7);ctx.fillStyle=p.c;ctx.globalAlpha=appear;ctx.fill();ctx.globalAlpha=1;
    txt(ctx,p.l,x, y - (p.y>0.7?-18:18),{size:11.5,color:p.c,weight:600,alpha:appear});
  });
}});

/* ---- 4. BPE ALGORITHM ---- */
S.push({chap:'1 · Tokenization', title:'Byte Pair Encoding (BPE)', sub:'Learn the vocabulary by merging frequent pairs', accent:COLORS.amber,
panel:`
<div class="p-lead">BPE starts from individual characters and repeatedly merges the <b>most frequent adjacent pair</b> into a new token. Repeat thousands of times and common substrings (like "-ing" or "th") naturally become single tokens.</div>
<ul class="p-bullets">
<li>Start: every word = sequence of characters.</li>
<li>Count all adjacent pairs across the whole training corpus.</li>
<li>Merge the single most frequent pair → new token.</li>
<li>Repeat until vocabulary reaches the target size.</li>
</ul>
<div class="formula-box"><div class="flabel">Merge rule</div>
<div class="feq">merge = argmax<sub>(a,b)</sub> count(a, b)</div>
<div class="fnote">Pick the adjacent pair (a,b) that occurs most often, replace every occurrence with one new token.</div></div>
<details class="why"><summary>Why greedy frequency merging?</summary><div class="why-body">
<h4>Reasoning</h4><p>It's a greedy compression algorithm (from data compression, 1994) repurposed for language: merging the most common pattern first gives the biggest "bang per merge" — each merge shortens more of the corpus than any other choice would.</p>
<h4>Real world</h4><p>This is literally how GPT-2/GPT-3/GPT-4's tokenizer vocabularies were learned — run once on a huge corpus, then frozen and reused for every input.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,5);
  const cx=W/2;
  txt(ctx,'corpus: "low low lower lowest"',cx,H*0.13,{size:13,color:'#ccc'});
  // step animation: show 3 merge steps
  const steps=[
    {before:['l','o','w'],after:['lo','w'],pair:'l+o → lo',count:'count=7'},
    {before:['lo','w'],after:['low'],pair:'lo+w → low',count:'count=7'},
    {before:['low','e','s','t'],after:['low','est'],pair:'e+s → es, then es+t → est',count:'count=2'}
  ];
  const stepDur=1.7;
  const idx=Math.min(steps.length-1,Math.floor(t/stepDur));
  const localT=t-idx*stepDur;
  const s=steps[idx];
  const y=H*0.42;
  txt(ctx,'Step '+(idx+1)+' of '+steps.length,cx,H*0.26,{size:11,color:COLORS.amber,weight:700});
  // before tokens
  const bshow=ease(clamp(localT/0.5,0,1));
  let x=cx-((s.before.length)*54)/2;
  s.before.forEach((p)=>{tokenBubble(ctx,x+27,y,p,COLORS.gray,bshow,1);x+=58;});
  // arrow down
  const mergeShow=ease(clamp((localT-0.6)/0.5,0,1));
  arrow(ctx,cx,y+22,cx,y+58,{color:COLORS.amber,progress:mergeShow,head:6});
  txt(ctx,s.pair,cx,y+42,{size:10.5,color:COLORS.amber,alpha:mergeShow});
  // after tokens
  const ashow=ease(clamp((localT-1.1)/0.5,0,1));
  let x2=cx-((s.after.length)*60)/2;
  s.after.forEach((p)=>{tokenBubble(ctx,x2+30,y+90,p,COLORS.amber,ashow,1.05);x2+=64;});
  txt(ctx,s.count,cx,y+130,{size:10.5,color:'#666',alpha:ashow});
  txt(ctx,'…continues until vocab size target reached',cx,H*0.92,{size:10.5,color:'#555'});
}});

/* ---- 5. BPE MATH ---- */
S.push({chap:'1 · Tokenization', title:'BPE: Reading the Frequency Table', sub:'How the merge decision is actually made', accent:COLORS.amber,
panel:`
<div class="p-lead">Under the hood, BPE keeps a running count of every adjacent symbol pair in the corpus, then merges whichever pair wins — a bar chart popularity contest, repeated thousands of times.</div>
<ul class="p-bullets">
<li>Counting is over the <b>entire</b> training corpus, not one sentence.</li>
<li>After a merge, counts are updated locally (only pairs touching the merged token change).</li>
<li>The number of merges = vocabulary size − number of base characters.</li>
</ul>
<div class="formula-box"><div class="flabel">Vocabulary size after training</div>
<div class="feq">|V| = |base chars| + (number of merges)</div>
<div class="fnote">e.g. GPT-2 uses 256 base byte tokens + ~50,000 learned merges ≈ 50,257 vocab.</div></div>
<details class="why"><summary>Why is this efficient to compute?</summary><div class="why-body">
<h4>Reasoning</h4><p>A merge only changes pairs that touch the newly-created token, so pair counts don't need to be recomputed from scratch each round — implementations use a priority queue keyed by pair frequency for speed.</p>
<h4>Real world</h4><p>This lets tokenizer training finish in minutes on a large corpus, even though it looks like a huge combinatorial search.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,6);
  const pairs=[{p:'l,o',c:7},{p:'lo,w',c:7},{p:'e,r',c:3},{p:'e,s',c:2},{p:'s,t',c:2},{p:'w,e',c:2}];
  const maxC=8;
  const cx0=W*0.16, cw=(W*0.72)/pairs.length, baseY=H*0.75, maxH=H*0.42;
  txt(ctx,'pair frequency counts',W/2,H*0.14,{size:13,color:'#ccc'});
  pairs.forEach((pr,i)=>{
    const appear=ease(clamp((t-i*0.22)/0.5,0,1));
    if(appear<=0)return;
    const h=(pr.c/maxC)*maxH*appear;
    const x=cx0+i*cw;
    const isMax = pr.c===7;
    const flashPulse = isMax? (0.85+0.15*Math.sin(t*4)) : 1;
    box(ctx,x,baseY-h,cw*0.62,h,{fill:isMax?COLORS.amber+'33':'#1a1a22',stroke:isMax?COLORS.amber:'#444',lw:isMax?2*flashPulse:1,r:4});
    txt(ctx,pr.p,x+cw*0.31,baseY+14,{size:11,color:isMax?COLORS.amber:'#888',alpha:appear});
    txt(ctx,pr.c,x+cw*0.31,baseY-h-12,{size:11,color:isMax?COLORS.amber:'#888',weight:700,alpha:appear});
  });
  const winAppear=ease(clamp((t-1.6)/0.6,0,1));
  if(winAppear>0){
    txt(ctx,'↑ highest count → merge this pair first',W/2,H*0.9,{size:11.5,color:COLORS.amber,weight:600,alpha:winAppear});
  }
}});

/* ---- 6. SENTENCEPIECE ---- */
S.push({chap:'1 · Tokenization', title:'SentencePiece', sub:'Tokenizing without assuming spaces exist', accent:COLORS.teal,
panel:`
<div class="p-lead">BPE as described assumes words are separated by spaces. But Japanese, Chinese, and Thai don't use spaces that way. SentencePiece solves this by treating the raw input — spaces included — as just another stream of characters.</div>
<ul class="p-bullets">
<li>Spaces are encoded as a visible marker (often "▁") so detokenization is lossless and reversible.</li>
<li>Works identically across <b>any</b> language — no language-specific pre-splitting needed.</li>
<li>Can use BPE internally, or a <b>Unigram Language Model</b> to pick the vocabulary.</li>
</ul>
<div class="formula-box"><div class="flabel">Space handling</div>
<div class="feq">"AI is fun"  →  [▁AI] [▁is] [▁fun]</div>
<div class="fnote">The ▁ marks "start of word" — reversing tokenization is just string concatenation.</div></div>
<details class="why"><summary>Why is losslessness a big deal?</summary><div class="why-body">
<h4>Reasoning</h4><p>Traditional tokenizers first split on whitespace, throwing that information away — so reconstructing the exact original text (spacing, punctuation) isn't always guaranteed. SentencePiece treats the input as one raw byte stream, so encode → decode is a perfect round trip.</p>
<h4>Real world</h4><p>This is why models like LLaMA and T5 use SentencePiece — it works out-of-the-box for 100+ languages with the same code, no per-language rules.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,7);
  const cx=W/2;
  txt(ctx,'raw bytes (language-agnostic)',cx,H*0.16,{size:12,color:'#888'});
  const raw='AI▁is▁fun';
  const e0=ease(clamp(t/0.8,0,1));
  txt(ctx,raw,cx,H*0.28,{size:16,color:'#ddd',alpha:e0,weight:600});
  const toks=[{t:'▁AI',c:COLORS.teal},{t:'▁is',c:COLORS.teal},{t:'▁fun',c:COLORS.teal}];
  arrow(ctx,cx,H*0.34,cx,H*0.46,{color:'#555',progress:ease(clamp((t-0.9)/0.5,0,1))});
  let x=cx-((toks.length)*74)/2;
  toks.forEach((tk,i)=>{
    const a=ease(clamp((t-1.3-i*0.2)/0.5,0,1));
    tokenBubble(ctx,x+37,H*0.56,tk.t,tk.c,a,1);
    x+=80;
  });
  // language agnostic examples row
  const examples=[{s:'English: "AI is fun"',y:H*0.74},{s:'日本語: "AIは楽しい"',y:H*0.83},{s:'Same pipeline, no special-casing',y:H*0.92,dim:true}];
  examples.forEach((ex,i)=>{
    const a=ease(clamp((t-2.2-i*0.3)/0.5,0,1));
    txt(ctx,ex.s,cx,ex.y,{size:ex.dim?10.5:12,color:ex.dim?'#666':'#999',alpha:a});
  });
}});

/* ---- 7. SENTENCEPIECE MATH ---- */
S.push({chap:'1 · Tokenization', title:'Unigram Language Model Tokenization', sub:'Choosing the most probable segmentation', accent:COLORS.teal,
panel:`
<div class="p-lead">Instead of greedy merging, SentencePiece's Unigram mode treats tokenization as a probability question: <i>of all the ways to split this text, which one is most likely?</i> Each candidate vocabulary piece has a learned probability, and we pick the segmentation that maximizes the total.</div>
<ul class="p-bullets">
<li>Start with a large candidate vocabulary, then <b>prune</b> pieces that hurt corpus likelihood least.</li>
<li>At encoding time, use the Viterbi algorithm to find the highest-probability split.</li>
<li>Naturally handles ambiguity — the same word can tokenize differently depending on context probability.</li>
</ul>
<div class="formula-box"><div class="flabel">Segmentation likelihood</div>
<div class="feq">P(x) = Π<sub>i</sub> P(token<sub>i</sub>)</div>
<div class="fnote">Probability of a segmentation = product of each chosen piece's probability. Pick the split that maximizes this.</div></div>
<details class="why"><summary>Why probabilities instead of greedy merges?</summary><div class="why-body">
<h4>Reasoning</h4><p>Greedy BPE commits to merges early and never reconsiders. A probabilistic model can compare entire competing segmentations globally and pick the genuinely best one, which tends to produce more linguistically sensible pieces.</p>
<h4>Real world</h4><p>This is why Unigram-based tokenizers (used in T5, ALBERT, LLaMA's SentencePiece) often produce cleaner subword boundaries on morphologically rich languages.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,8);
  const cx=W/2;
  txt(ctx,'word: "lower"',cx,H*0.14,{size:14,color:'#ddd'});
  const cands=[
    {segs:['low','er'],p:0.6},
    {segs:['lo','wer'],p:0.25},
    {segs:['l','o','w','e','r'],p:0.05},
  ];
  cands.forEach((c,i)=>{
    const y=H*(0.32+i*0.22);
    const appear=ease(clamp((t-i*0.5)/0.6,0,1));
    if(appear<=0)return;
    let x=W*0.28;
    c.segs.forEach(seg=>{
      const w=Math.max(26,seg.length*9+14);
      tokenBubble(ctx,x+w/2,y,seg,i===0?COLORS.teal:'#666',appear,i===0?1.05:0.9);
      x+=w+5;
    });
    // probability bar
    const barMaxW=W*0.28, barX=W*0.66;
    box(ctx,barX,y-8,barMaxW*c.p*appear,16,{fill:i===0?COLORS.teal+'55':'#2a2a33',stroke:i===0?COLORS.teal:'#444',r:3});
    txt(ctx,'P='+c.p,barX+barMaxW+18,y,{size:11,color:i===0?COLORS.teal:'#777',alpha:appear});
  });
  const win=ease(clamp((t-2.0)/0.6,0,1));
  if(win>0)txt(ctx,'highest total probability wins',cx,H*0.92,{size:11.5,color:COLORS.teal,weight:600,alpha:win});
}});

/* ---- 8. PRETRAINING ---- */
S.push({chap:'2 · Pretraining', title:'Pretraining: Predict the Next Token', sub:"Where all of the model's raw knowledge comes from", accent:COLORS.blue,
panel:`
<div class="p-lead">Pretraining is deceptively simple: feed the model a huge amount of text and, at every position, ask it to <b>predict the next token</b>. No labels, no humans in the loop — the text itself is the supervision (self-supervised learning).</div>
<ul class="p-bullets">
<li>The model can only look <b>left</b> (causal/autoregressive) — it must not peek at the future token.</li>
<li>Repeated over trillions of tokens, this forces the model to internalize grammar, facts, and reasoning patterns.</li>
<li>This stage produces a <b>base model</b> — fluent, knowledgeable, but not yet obedient or safe.</li>
</ul>
<div class="formula-box"><div class="flabel">Training objective</div>
<div class="feq">L = − Σ<sub>i</sub> log P(x<sub>i</sub> | x<sub>1</sub>, …, x<sub>i−1</sub>)</div>
<div class="fnote">Cross-entropy loss: penalize the model when it assigns low probability to the actual next token.</div></div>
<details class="why"><summary>Why does predicting the next word teach so much?</summary><div class="why-body">
<h4>Reasoning</h4><p>To predict the next token accurately across billions of diverse sentences, the model is forced to implicitly learn syntax, facts, and even some reasoning — guessing correctly requires understanding, not memorizing.</p>
<h4>Real world</h4><p>This single objective, scaled up, is the reason GPT/LLaMA/Claude base models can write code, answer trivia, and hold coherent conversations, despite never being told any of those tasks explicitly.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,9);
  const seq=['The','cat','sat','on','the','?'];
  const cx=W/2, y=H*0.35;
  const gap=Math.min(90,(W*0.86)/seq.length);
  const startX=cx-(gap*(seq.length-1))/2;
  seq.forEach((tk,i)=>{
    const appear=ease(clamp((t-i*0.25)/0.5,0,1));
    if(appear<=0)return;
    const x=startX+i*gap;
    const known=i<seq.length-1;
    tokenBubble(ctx,x,y,tk,known?COLORS.blue:'#555',appear,1);
    if(i>0){
      // attention lines to all previous (causal)
      const attAppear=ease(clamp((t-i*0.25-0.3)/0.5,0,1));
      for(let j=0;j<i;j++){
        line(ctx,startX+j*gap,y+18,x,y+18,{color:COLORS.blue,alpha:0.12*attAppear,lw:1});
      }
    }
  });
  // prediction reveal
  const revealT=clamp((t-2.2)/0.8,0,1);
  const e=ease(revealT);
  if(e>0){
    const x=startX+(seq.length-1)*gap;
    txt(ctx,'"mat"',x,y-40,{size:13,color:COLORS.green,weight:700,alpha:e});
    arrow(ctx,x,y-30,x,y-20,{color:COLORS.green,progress:e,head:5});
    txt(ctx,'model predicts a probability over the whole vocabulary',cx,H*0.62,{size:11.5,color:'#888',alpha:e});
  }
  // bar chart of candidate probs
  if(revealT>0.3){
    const cands=[{w:'mat',p:0.62},{w:'floor',p:0.18},{w:'roof',p:0.08},{w:'moon',p:0.03}];
    const bAppear=ease(clamp((t-2.8)/0.7,0,1));
    const bx=cx-160, by=H*0.78, bw=320, bh=70;
    cands.forEach((c,i)=>{
      const cw=bw/cands.length;
      const h=c.p*bh*3.2*bAppear;
      box(ctx,bx+i*cw+6,by+bh-h,cw-12,h,{fill:i===0?COLORS.green+'55':'#22222c',stroke:i===0?COLORS.green:'#444',r:3});
      txt(ctx,c.w,bx+i*cw+cw/2-6,by+bh+14,{size:10.5,color:i===0?COLORS.green:'#777',alpha:bAppear});
    });
  }
}});

/* ---- 9. PRETRAINING MATH ---- */
S.push({chap:'2 · Pretraining', title:'Cross-Entropy: Why This Loss?', sub:'Turning "wrongness" into a number you can minimize', accent:COLORS.blue,
panel:`
<div class="p-lead">The model outputs a probability for every possible next token. Cross-entropy loss simply asks: <i>how much probability did you put on the token that actually appeared?</i> The less probability, the bigger the penalty.</div>
<ul class="p-bullets">
<li>If the model gives the correct token 90% probability → tiny loss.</li>
<li>If it gives the correct token 1% probability → huge loss (log grows sharply near 0).</li>
<li>Minimizing this loss over trillions of tokens = maximizing the likelihood of the entire training corpus.</li>
</ul>
<div class="formula-box"><div class="flabel">Per-token loss</div>
<div class="feq">loss<sub>i</sub> = − log P(x<sub>i</sub> | context)</div>
<div class="fnote">−log(0.9) ≈ 0.10  vs  −log(0.01) ≈ 4.6 — being confidently wrong is punished heavily.</div></div>
<details class="why"><summary>Why negative log, not just "1 − probability"?</summary><div class="why-body">
<h4>Reasoning</h4><p>−log(p) grows toward infinity as p→0, so confidently wrong predictions are punished far more harshly than a linear penalty would allow — this pushes the model to never assign near-zero probability to plausible tokens. It also conveniently turns products of probabilities (across a whole sequence) into sums, which are numerically stable to compute.</p>
<h4>Real world</h4><p>"Perplexity", the standard metric for comparing language models, is just this cross-entropy loss exponentiated — lower perplexity = better next-token prediction.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,10);
  const cx=W*0.5, cy=H*0.55, R=Math.min(W,H)*0.32;
  // plot -log(p) curve
  line(ctx,cx-R,cy+R,cx+R,cy+R,{color:'#333'});
  line(ctx,cx-R,cy+R,cx-R,cy-R,{color:'#333'});
  txt(ctx,'probability assigned to correct token →',cx,cy+R+28,{size:11,color:'#777'});
  ctx.save();ctx.translate(cx-R-30,cy);ctx.rotate(-Math.PI/2);txt(ctx,'loss = −log(p)',0,0,{size:11,color:'#777'});ctx.restore();
  const e=ease(clamp((t-0.3)/1.2,0,1));
  ctx.beginPath();
  for(let i=1;i<=200;i++){
    const p=i/200;
    const xx=cx-R+p*2*R;
    const lossVal=-Math.log(p);
    const yy=cy+R - Math.min(lossVal/5,1)*2*R;
    if(p<=0.02+e*0.98){
      if(i===1)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
    }
  }
  ctx.strokeStyle=COLORS.blue;ctx.lineWidth=2.2;ctx.stroke();
  // markers
  const markers=[{p:0.9,label:'p=0.9 (confident, correct)',c:COLORS.green},{p:0.1,label:'p=0.1 (unsure)',c:COLORS.amber},{p:0.01,label:'p=0.01 (confidently wrong)',c:COLORS.red}];
  markers.forEach((m,i)=>{
    const mAppear=ease(clamp((t-1.7-i*0.4)/0.5,0,1));
    if(mAppear<=0)return;
    const xx=cx-R+m.p*2*R;
    const lossVal=-Math.log(m.p);
    const yy=cy+R-Math.min(lossVal/5,1)*2*R;
    ctx.beginPath();ctx.arc(xx,yy,5,0,7);ctx.fillStyle=m.c;ctx.globalAlpha=mAppear;ctx.fill();ctx.globalAlpha=1;
    txt(ctx,m.label,xx, m.p>0.5? yy-16: (i%2? yy+18:yy-18),{size:10,color:m.c,alpha:mAppear,align:m.p>0.6?'right':'left'});
  });
}});

/* ---- 10. INSTRUCTION TUNING ---- */
S.push({chap:'3 · Instruction Tuning', title:'Instruction Tuning (SFT)', sub:'Teaching a base model to behave like an assistant', accent:COLORS.purple,
panel:`
<div class="p-lead">A pretrained base model just continues text — ask it a question and it might continue with more questions, since that's a common pattern online. Supervised Fine-Tuning (SFT) retrains it on curated <b>(instruction → ideal response)</b> pairs so it learns the assistant "shape" of a conversation.</div>
<ul class="p-bullets">
<li>Dataset: thousands of human-written (or curated) instruction/response examples.</li>
<li>Same next-token-prediction loss as pretraining — but only computed on the <b>response</b> tokens.</li>
<li>Vastly smaller dataset than pretraining — this stage reshapes behavior, not knowledge.</li>
</ul>
<div class="formula-box"><div class="flabel">Masked loss</div>
<div class="feq">L = − Σ<sub>i∈response</sub> log P(x<sub>i</sub> | prompt, x&lt;i)</div>
<div class="fnote">Loss is masked to 0 on prompt tokens — we don't want the model to "learn" to write the questions, only the answers.</div></div>
<details class="why"><summary>Why mask the prompt's loss?</summary><div class="why-body">
<h4>Reasoning</h4><p>If we trained on prompt tokens too, the model would spend capacity learning to imitate how humans phrase questions, diluting the training signal for what we actually care about: producing good responses.</p>
<h4>Real world</h4><p>This exact recipe (small, high-quality instruction sets + masked loss) is how base GPT-3 became "InstructGPT", and how raw LLaMA becomes an Alpaca/Vicuna-style chat model.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,11);
  const cx=W/2;
  // conversation box
  const e=ease(clamp(t/0.6,0,1));
  box(ctx,W*0.12,H*0.16,W*0.76,H*0.22,{fill:'#101018',stroke:COLORS.gray,alpha:e,r:8});
  txt(ctx,'PROMPT (loss masked)',W*0.16,H*0.20,{size:9.5,color:'#666',align:'left',alpha:e});
  txt(ctx,'"Explain gravity simply."',cx,H*0.30,{size:13,color:'#ccc',alpha:e});
  const e2=ease(clamp((t-0.7)/0.6,0,1));
  box(ctx,W*0.12,H*0.44,W*0.76,H*0.30,{fill:COLORS.purple+'14',stroke:COLORS.purple,alpha:e2,r:8});
  txt(ctx,'RESPONSE (loss computed here)',W*0.16,H*0.48,{size:9.5,color:COLORS.purple,align:'left',alpha:e2});
  const words=['"Gravity','pulls','things','toward','each','other','—',"it's",'why','you','fall','down."'];
  let wx=W*0.16, wy=H*0.58;
  words.forEach((w,i)=>{
    const wa=ease(clamp((t-1.2-i*0.08)/0.4,0,1));
    if(wa<=0)return;
    ctx.font='500 12px -apple-system';
    const ww=ctx.measureText(w+' ').width;
    if(wx+ww>W*0.84){wx=W*0.16;wy+=20;}
    txt(ctx,w,wx+ww/2-3,wy,{size:12,color:'#e8d8f8',alpha:wa,align:'left'});
    wx+=ww;
  });
  const e3=ease(clamp((t-2.6)/0.6,0,1));
  if(e3>0){
    txt(ctx,'gradient flows only from the purple region',cx,H*0.87,{size:11.5,color:COLORS.purple,weight:600,alpha:e3});
  }
}});

/* ---- 11. RLHF OVERVIEW ---- */
S.push({chap:'4 · Alignment', title:'RLHF: Learning What Humans Prefer', sub:'Three stages: SFT → Reward Model → Reinforcement Learning', accent:COLORS.rose,
panel:`
<div class="p-lead">SFT teaches the model <i>a</i> way to answer, but not necessarily the <i>best</i> way. RLHF (Reinforcement Learning from Human Feedback) adds a preference signal: humans compare two responses, and the model is optimized to produce whichever one people prefer.</div>
<ul class="p-bullets">
<li><b>Stage 1</b> — Start from the SFT model.</li>
<li><b>Stage 2</b> — Train a separate <b>Reward Model</b> to score responses, using human comparisons (A vs B, which is better?).</li>
<li><b>Stage 3</b> — Use reinforcement learning (PPO) to update the LLM so it produces responses that score higher on the reward model.</li>
</ul>
<div class="formula-box"><div class="flabel">Overall objective</div>
<div class="feq">maximize E[ Reward(response) ] − β·KL(policy ‖ SFT model)</div>
<div class="fnote">The KL term is a leash — it stops the model from drifting too far from sane, fluent SFT behavior while chasing reward.</div></div>
<details class="why"><summary>Why not just use human labels directly as a loss?</summary><div class="why-body">
<h4>Reasoning</h4><p>Humans are far better at <i>comparing</i> two responses than writing a perfect one from scratch or scoring it with a precise number — so RLHF collects cheap, reliable comparison data and lets a learned reward model generalize that judgment to millions of new responses.</p>
<h4>Real world</h4><p>This pipeline is how ChatGPT went from "fluent but sometimes unhelpful/unsafe" to "helpful, honest, and harmless" as a public product.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,12);
  const stages=[
    {l:'SFT Model',c:COLORS.purple},
    {l:'Reward Model\n(from human prefs)',c:COLORS.amber},
    {l:'PPO Update\n(RL loop)',c:COLORS.rose}
  ];
  const cx=W/2, y=H*0.32;
  const gap=W*0.30;
  const startX=cx-gap;
  stages.forEach((s,i)=>{
    const appear=ease(clamp((t-i*0.6)/0.6,0,1));
    if(appear<=0)return;
    const x=startX+i*gap;
    const w=gap*0.72,h=64;
    box(ctx,x-w/2,y-h/2,w,h,{fill:'#101018',stroke:s.c,lw:1.6,alpha:appear,r:8});
    s.l.split('\n').forEach((ln,li)=>{
      txt(ctx,ln,x,y+(li-(s.l.split('\n').length-1)/2)*15,{size:12,color:s.c,weight:600,alpha:appear});
    });
    if(i<stages.length-1){
      const ap=ease(clamp((t-i*0.6-0.5)/0.5,0,1));
      arrow(ctx,x+w/2+4,y,startX+(i+1)*gap-w/2-4,y,{color:'#555',progress:ap});
    }
  });
  // loop back arrow for PPO
  const loopAppear=ease(clamp((t-2.2)/0.6,0,1));
  if(loopAppear>0){
    ctx.save();
    ctx.strokeStyle=COLORS.rose;ctx.globalAlpha=loopAppear*0.8;ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(startX+2*gap+30,y+34);
    ctx.bezierCurveTo(startX+2*gap+90,y+95, startX+2*gap-90,y+95, startX+2*gap-30,y+34);
    ctx.stroke();
    ctx.restore();
    txt(ctx,'sample → score → update → repeat',cx,y+112,{size:11,color:COLORS.rose,alpha:loopAppear});
  }
  const kl=ease(clamp((t-2.9)/0.6,0,1));
  if(kl>0)txt(ctx,'KL penalty keeps it close to the SFT model',cx,H*0.85,{size:11,color:'#888',alpha:kl});
}});

/* ---- 12. REWARD MODEL MATH ---- */
S.push({chap:'4 · Alignment', title:'The Reward Model: Bradley-Terry Math', sub:'Turning "A is better than B" into a trainable score', accent:COLORS.amber,
panel:`
<div class="p-lead">Humans label pairs: "response A is better than response B". The reward model learns a scalar score r(x) for any response such that higher-preferred responses get higher scores — using the classic Bradley-Terry model of pairwise preference.</div>
<ul class="p-bullets">
<li>The reward model itself is usually the SFT model with its output head replaced by a single scalar.</li>
<li>Trained purely on which of two responses a human preferred — no absolute scale needed.</li>
<li>Once trained, it can score <b>any</b> new response instantly, at scale, without a human in the loop.</li>
</ul>
<div class="formula-box"><div class="flabel">Preference probability</div>
<div class="feq">P(A ≻ B) = σ( r(A) − r(B) )</div>
<div class="fnote">σ = sigmoid. Loss = −log P(A≻B) on the human-labeled winner — pushes r(winner) up, r(loser) down.</div></div>
<details class="why"><summary>Why sigmoid of a difference?</summary><div class="why-body">
<h4>Reasoning</h4><p>We only need relative scores, not absolute ones — sigmoid(r(A)−r(B)) elegantly converts "how much better A scores than B" into a probability between 0 and 1, matching exactly what a comparison label gives us.</p>
<h4>Real world</h4><p>This is the same Bradley-Terry model used to rank chess players (Elo) and sports teams from win/loss records — RLHF reuses a century-old ranking idea to align LLMs.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,13);
  const cx=W/2;
  const e=ease(clamp(t/0.6,0,1));
  txt(ctx,'Prompt: "Explain photosynthesis"',cx,H*0.14,{size:12.5,color:'#ccc',alpha:e});
  const respY=H*0.32;
  const rA={x:W*0.28,label:'Response A\n(clear, correct)',score:2.4,c:COLORS.green};
  const rB={x:W*0.72,label:'Response B\n(vague)',score:0.3,c:COLORS.rose};
  [rA,rB].forEach((r,i)=>{
    const a=ease(clamp((t-0.4-i*0.3)/0.5,0,1));
    box(ctx,r.x-70,respY-30,140,60,{fill:'#101018',stroke:r.c,alpha:a,r:8});
    r.label.split('\n').forEach((ln,li)=>{
      txt(ctx,ln,r.x,respY+(li-0.5)*15,{size:11,color:r.c,alpha:a});
    });
  });
  // human choice
  const humAppear=ease(clamp((t-1.3)/0.5,0,1));
  if(humAppear>0){
    txt(ctx,'human: "A is better"',cx,respY+56,{size:12,color:'#ddd',weight:600,alpha:humAppear});
  }
  // reward scores + sigmoid gap
  const scoreAppear=ease(clamp((t-1.9)/0.6,0,1));
  if(scoreAppear>0){
    txt(ctx,'r(A) = '+rA.score.toFixed(1),rA.x,respY+90,{size:12,color:rA.c,alpha:scoreAppear,weight:700});
    txt(ctx,'r(B) = '+rB.score.toFixed(1),rB.x,respY+90,{size:12,color:rB.c,alpha:scoreAppear,weight:700});
  }
  const sigAppear=ease(clamp((t-2.5)/0.6,0,1));
  if(sigAppear>0){
    const diff=rA.score-rB.score;
    const p=1/(1+Math.exp(-diff));
    txt(ctx,'P(A ≻ B) = σ('+diff.toFixed(1)+') = '+p.toFixed(2),cx,H*0.86,{size:13,color:COLORS.amber,weight:700,alpha:sigAppear});
  }
}});

/* ---- 13. PPO ---- */
S.push({chap:'4 · Alignment', title:'PPO: Updating the Policy Safely', sub:"Improve, but don't take a step so big you break things", accent:COLORS.rose,
panel:`
<div class="p-lead">Now the LLM (the "policy") generates a response, the reward model scores it, and PPO (Proximal Policy Optimization) nudges the model's weights to make high-reward responses more likely. The word "proximal" is the key idea: PPO refuses to let the model change too drastically in one update.</div>
<ul class="p-bullets">
<li><b>Ratio</b> r(θ) compares how likely the new model is to produce a response vs. the old model.</li>
<li>PPO <b>clips</b> this ratio so a single very-high-reward sample can't cause a huge, destabilizing jump.</li>
<li>This is what makes RL training on LLMs stable enough to actually converge.</li>
</ul>
<div class="formula-box"><div class="flabel">Clipped surrogate objective</div>
<div class="feq">L = min( r(θ)·A , clip(r(θ), 1−ε, 1+ε)·A )</div>
<div class="fnote">A = advantage (how much better this response was than average). ε is typically small (~0.2).</div></div>
<details class="why"><summary>Why clip instead of a bigger/smaller learning rate?</summary><div class="why-body">
<h4>Reasoning</h4><p>A single unusually high-reward sample could otherwise cause a massive gradient step and permanently break the model's fluency — clipping caps the influence of any one update, trading a bit of speed for a lot of stability, which matters enormously at LLM scale where restarting training is expensive.</p>
<h4>Real world</h4><p>PPO's stability is exactly why it (rather than more aggressive RL algorithms) became the default choice for the RL stage of RLHF at OpenAI, Anthropic, and others.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,14);
  const cx=W*0.5, cy=H*0.55, R=Math.min(W,H)*0.30;
  line(ctx,cx-R,cy+R,cx+R,cy+R,{color:'#333'});
  line(ctx,cx-R,cy+R,cx-R,cy-R,{color:'#333'});
  txt(ctx,'ratio r(θ) — how much the policy changed',cx,cy+R+26,{size:11,color:'#777'});
  ctx.save();ctx.translate(cx-R-26,cy);ctx.rotate(-Math.PI/2);txt(ctx,'objective value',0,0,{size:11,color:'#777'});ctx.restore();
  const eps=0.2;
  const e=ease(clamp((t-0.3)/1,0,1));
  // unclipped line (dashed)
  ctx.beginPath();
  for(let i=0;i<=100;i++){
    const rr=0.4+i/100*1.2; // 0.4 to 1.6
    const xx=cx-R + ((rr-0.4)/1.2)*2*R;
    const val=rr; // advantage=1 assumed positive
    const yy=cy+R - clamp(val/1.8,0,1)*2*R;
    if(i/100<=e){if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);}
  }
  ctx.strokeStyle='#555';ctx.lineWidth=1.3;ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([]);
  // clipped line (solid rose) drawn after delay
  const e2=ease(clamp((t-1.3)/1,0,1));
  ctx.beginPath();
  for(let i=0;i<=100;i++){
    const rr=0.4+i/100*1.2;
    const clippedR=clamp(rr,1-eps,1+eps);
    const xx=cx-R + ((rr-0.4)/1.2)*2*R;
    const yy=cy+R - clamp(clippedR/1.8,0,1)*2*R;
    if(i/100<=e2){if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);}
  }
  ctx.strokeStyle=COLORS.rose;ctx.lineWidth=2.4;ctx.stroke();
  const legendA=ease(clamp((t-2.4)/0.5,0,1));
  if(legendA>0){
    txt(ctx,'— unclipped (risky)',cx+R*0.1,cy-R-14,{size:10.5,color:'#777',align:'left',alpha:legendA});
    txt(ctx,'— clipped (PPO, safe)',cx+R*0.1,cy-R+2,{size:10.5,color:COLORS.rose,align:'left',alpha:legendA,weight:600});
  }
}});

/* ---- 14. PPO MATH DETAIL merged into DPO transition ---- */
S.push({chap:'4 · Alignment', title:'DPO: Skip the Reward Model Entirely', sub:'Direct Preference Optimization', accent:COLORS.blue,
panel:`
<div class="p-lead">RLHF's 3-stage pipeline (reward model + PPO) is powerful but complex and unstable to tune. DPO asks a clever question: can we derive, mathematically, what PPO would converge to — and optimize <b>directly</b> for that, using only the preference pairs, no separate reward model and no RL loop?</div>
<ul class="p-bullets">
<li>DPO shows the optimal RLHF policy has a closed form in terms of the reward.</li>
<li>Substituting that back in turns preference data directly into a <b>supervised</b> loss on the LLM's own token probabilities.</li>
<li>Result: same alignment goal, one training stage, far simpler and more stable than RLHF.</li>
</ul>
<div class="formula-box"><div class="flabel">DPO loss</div>
<div class="feq">L = − log σ( β·[ log π(y<sub>w</sub>|x)/π<sub>ref</sub>(y<sub>w</sub>|x) − log π(y<sub>l</sub>|x)/π<sub>ref</sub>(y<sub>l</sub>|x) ] )</div>
<div class="fnote">y_w = preferred (winning) response, y_l = rejected. π = current model, π_ref = frozen SFT model.</div></div>
<details class="why"><summary>Why does this replace an entire RL algorithm?</summary><div class="why-body">
<h4>Reasoning</h4><p>The reward model and PPO's job was ultimately just to increase the probability gap between preferred and rejected responses, relative to a reference model. DPO's derivation shows that gap can be computed directly from the policy's own log-probabilities — no separate reward network, no sampling, no clipping needed.</p>
<h4>Real world</h4><p>DPO is why many open-source aligned models (Zephyr, and various Mistral/LLaMA fine-tunes) skip RLHF's complexity entirely and still get strong preference alignment, with a fraction of the engineering effort.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,15);
  const cx=W/2;
  // two pipelines compared
  const rlhfY=H*0.32, dpoY=H*0.66;
  const e1=ease(clamp(t/0.6,0,1));
  txt(ctx,'RLHF',W*0.18,rlhfY-38,{size:12,color:COLORS.rose,weight:700,align:'left',alpha:e1});
  const rlSteps=['SFT','Reward\nModel','PPO\n(RL loop)'];
  let x=W*0.30;
  rlSteps.forEach((s,i)=>{
    const a=ease(clamp((t-i*0.3)/0.5,0,1));
    if(a<=0)return;
    box(ctx,x-46,rlhfY-24,92,48,{fill:'#101018',stroke:COLORS.rose,alpha:a,r:6});
    s.split('\n').forEach((ln,li)=>txt(ctx,ln,x,rlhfY+(li-(s.split('\n').length-1)/2)*13,{size:10.5,color:COLORS.rose,alpha:a}));
    if(i<rlSteps.length-1)arrow(ctx,x+50,rlhfY,x+150-50,rlhfY,{color:'#555',progress:ease(clamp((t-i*0.3-0.35)/0.4,0,1))});
    x+=150;

  const e2=ease(clamp((t-1.6)/0.6,0,1));
  txt(ctx,'DPO',W*0.18,dpoY-38,{size:12,color:COLORS.blue,weight:700,align:'left',alpha:e2});
  if(e2>0){
    const dx=W*0.42;
    box(ctx,dx-70,dpoY-24,140,48,{fill:COLORS.blue+'14',stroke:COLORS.blue,alpha:e2,r:6});
    txt(ctx,'SFT + preference pairs',dx,dpoY,{size:10.5,color:COLORS.blue,alpha:e2});
    arrow(ctx,dx+72,dpoY,dx+180,dpoY,{color:COLORS.blue,progress:ease(clamp((t-2.1)/0.5,0,1))});
    const a3=ease(clamp((t-2.4)/0.5,0,1));
    box(ctx,dx+184,dpoY-24,120,48,{fill:'#101018',stroke:COLORS.blue,alpha:a3,r:6});

  if(note>0)txt(ctx,'one supervised loss, no RL loop, no separate reward model',cx,H*0.9,{size:11,color:'#888',alpha:note});

/* ---- 15. PPO vs DPO comparison ---- */
S.push({chap:'4 · Alignment', title:'PPO vs. DPO — Choosing an Approach', sub:'Different tradeoffs, same end goal', accent:COLORS.gray,
panel:`
<div class="p-lead">Neither approach is strictly "better" — they trade engineering complexity for flexibility.</div>
<ul class="p-bullets">
<li><b>PPO/RLHF</b>: more moving parts (reward model + RL loop), but the reward model can be reused to score/rank responses at inference time too, and can incorporate live/online feedback.</li>
<li><b>DPO</b>: simpler, more stable, cheaper to train — but is inherently offline (fixed preference dataset), no reward model to reuse elsewhere.</li>
<li>In practice: many production systems now use DPO or a hybrid, reserving full RLHF for cases needing more nuanced or online reward signals.</li>
</ul>
<div class="formula-box"><div class="flabel">Same fixed point</div>
<div class="feq">π*<sub>PPO</sub>  ≈  π*<sub>DPO</sub></div>
<div class="fnote">Both aim to converge toward the same theoretically optimal preference-aligned policy — DPO just gets there via a more direct mathematical shortcut.</div></div>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,16);
  const cx=W/2;
  const rows=[

/* ---- 16. PEFT overview ---- */
S.push({chap:'5 · Efficient Adaptation', title:'PEFT: Why Not Fine-Tune Everything?', sub:'Parameter-Efficient Fine-Tuning', accent:COLORS.green,
panel:`
<div class="p-lead">Full fine-tuning updates every single weight in a multi-billion-parameter model for every new task — expensive to compute, and expensive to store (a full copy per task). PEFT methods freeze the base model and train only a small add-on, getting most of the benefit for a tiny fraction of the cost.</div>
<ul class="p-bullets">
<li><b>Full fine-tuning</b>: update 100% of weights; one huge checkpoint per task.</li>
<li><b>PEFT</b>: freeze the base model; train <1% of parameters (adapters).</li>
<li>Multiple tasks can share the same frozen base model with different small adapters swapped in.</li>
</ul>
<div class="formula-box"><div class="flabel">Trainable parameter fraction</div>
<div class="feq">PEFT params / Total params  ≈  0.1% – 1%</div>
<div class="fnote">e.g. a 7B parameter model might need only ~4–40M trainable parameters with LoRA.</div></div>
<details class="why"><summary>Why does training so few parameters still work well?</summary><div class="why-body">
<h4>Reasoning</h4><p>A pretrained model already encodes enormous general knowledge; adapting it to a new task is often a small "correction" in a low-dimensional subspace of its weight space, not a wholesale rewrite — so a small number of well-placed trainable parameters can capture that correction.</p>
<h4>Real world</h4><p>This is why companies can maintain hundreds of task-specific or customer-specific fine-tunes cheaply — store one base model plus many lightweight adapters, rather than hundreds of full model copies.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,17);
  const cx=W/2;
  const e=ease(clamp(t/0.6,0,1));
  // full fine-tune: big block all red
  const fx=W*0.28, fy=H*0.35, fw=W*0.28, fh=H*0.36;
  box(ctx,fx-fw/2,fy-fh/2,fw,fh,{fill:COLORS.red+'22',stroke:COLORS.red,alpha:e,r:8});
  txt(ctx,'Full Fine-Tuning',fx,fy-fh/2-16,{size:11.5,color:COLORS.red,weight:600,alpha:e});
  txt(ctx,'100% of weights\nupdated & stored',fx,fy,{size:11,color:COLORS.red,alpha:e});
  // fill pattern
  if(e>0.5){
    ctx.save();ctx.globalAlpha=(e-0.5)*2*0.5;
    for(let i=0;i<8;i++){for(let j=0;j<10;j++){
      ctx.fillStyle=COLORS.red;
      ctx.fillRect(fx-fw/2+6+i*(fw-12)/8, fy-fh/2+30+j*(fh-40)/10, (fw-12)/8-2,(fh-40)/10-2);

  const px=W*0.72, py=H*0.35, pw=W*0.28, ph=H*0.36;
  const e2=ease(clamp((t-0.8)/0.6,0,1));

  const e3=ease(clamp((t-1.6)/0.6,0,1));
  box(ctx,px-pw/2+8,py+ph/2-22,pw-16,14,{fill:COLORS.green+'55',stroke:COLORS.green,alpha:e3,r:3});

  const e4=ease(clamp((t-2.2)/0.5,0,1));
  if(e4>0)txt(ctx,'same task quality, a fraction of the compute & storage',cx,H*0.88,{size:11.5,color:'#888',alpha:e4});
}});

/* ---- 17. LoRA concept ---- */
S.push({chap:'5 · Efficient Adaptation', title:'LoRA: Low-Rank Adaptation', sub:'Learn a small correction, not a new model', accent:COLORS.green,
panel:`
<div class="p-lead">LoRA freezes the original weight matrix W and instead learns a much smaller "correction" ΔW, expressed as the product of two thin matrices. Since ΔW is constrained to be <b>low-rank</b>, it has far fewer parameters than W itself.</div>
<ul class="p-bullets">
<li>Original weight: W (size d × d), frozen — never updated.</li>
<li>Add: ΔW = B·A, where B is (d × r) and A is (r × d), with rank r ≪ d (e.g. r=8 vs d=4096).</li>
<li>At inference, effective weight = W + B·A — nearly free to merge back in.</li>
</ul>
<div class="formula-box"><div class="flabel">Adapted forward pass</div>
<div class="feq">h = W·x + (B·A)·x</div>
<div class="fnote">Only B and A are trained; W stays frozen throughout.</div></div>
<details class="why"><summary>Why does a low-rank matrix suffice?</summary><div class="why-body">
<h4>Reasoning</h4><p>Empirically, the weight change needed to adapt a pretrained model to a new task tends to have a low "intrinsic rank" — it lives in a small subspace of all possible directions, so a rank-8 or rank-16 correction captures nearly all the useful adaptation, at a fraction of the parameter count of a full d×d matrix.</p>
<h4>Real world</h4><p>LoRA adapters for a 7B model can be just a few megabytes (vs ~14GB for the full model), which is why the open-source community shares thousands of LoRA "style" and "skill" adapters that snap onto the same base model.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,18);
  const cx=W/2, cy=H*0.5;
  const e=ease(clamp(t/0.6,0,1));
  // big frozen matrix W
  const wx=W*0.24, wSize=Math.min(W,H)*0.32;
  box(ctx,wx-wSize/2,cy-wSize/2,wSize,wSize,{fill:'#1a1a22',stroke:'#555',alpha:e,r:6});
  txt(ctx,'W',wx,cy,{size:22,color:'#888',weight:700,alpha:e});
  txt(ctx,'frozen (d × d)',wx,cy+wSize/2+18,{size:10.5,color:'#666',alpha:e});
  txt(ctx,'❄',wx-wSize/2+16,cy-wSize/2+16,{size:14,color:'#7fb8e0',alpha:e});
  // plus sign
  const e2=ease(clamp((t-0.6)/0.4,0,1));
  txt(ctx,'+',cx-40,cy,{size:24,color:'#666',alpha:e2});
  // B and A thin matrices
  const e3=ease(clamp((t-1.0)/0.6,0,1));
  const bx=W*0.62, bh=wSize, bw=wSize*0.16;
  box(ctx,bx-bw/2,cy-bh/2,bw,bh,{fill:COLORS.green+'22',stroke:COLORS.green,alpha:e3,r:4});
  txt(ctx,'B',bx,cy,{size:15,color:COLORS.green,weight:700,alpha:e3});
  txt(ctx,'d×r',bx,cy-bh/2-12,{size:9.5,color:COLORS.green,alpha:e3});
  const e4=ease(clamp((t-1.4)/0.6,0,1));
  const ax=bx+bw/2+30, ah=wSize*0.16, aw=wSize;
  box(ctx,ax,cy-ah/2,aw*0.42,ah,{fill:COLORS.green+'22',stroke:COLORS.green,alpha:e4,r:4});
  txt(ctx,'A',ax+aw*0.21,cy,{size:15,color:COLORS.green,weight:700,alpha:e4});
  txt(ctx,'r×d',ax+aw*0.21,cy+ah/2+14,{size:9.5,color:COLORS.green,alpha:e4});
  txt(ctx,'r ≪ d  (e.g. r=8)',ax+aw*0.21,cy+ah/2+30,{size:9.5,color:'#666',alpha:e4});
  const e5=ease(clamp((t-2.1)/0.5,0,1));
  if(e5>0)txt(ctx,'only the tiny green matrices are trained',cx,H*0.88,{size:11.5,color:COLORS.green,weight:600,alpha:e5});
}});

/* ---- 18. LoRA math ---- */
S.push({chap:'5 · Efficient Adaptation', title:'LoRA: Counting the Savings', sub:'How much does low-rank actually save?', accent:COLORS.green,
panel:`
<div class="p-lead">Let's put real numbers on it. For a typical transformer weight matrix of size d=4096 × d=4096, compare full fine-tuning against LoRA with rank r=8.</div>
<ul class="p-bullets">
<li>Full matrix parameters: d × d.</li>
<li>LoRA parameters: d × r + r × d = 2·d·r.</li>
<li>The ratio shrinks dramatically as d grows — LoRA scales linearly in d, full fine-tuning scales quadratically.</li>
</ul>
<div class="formula-box"><div class="flabel">Parameter count</div>
<div class="feq">Full: d² = 16,777,216&nbsp;&nbsp;&nbsp;LoRA: 2dr = 65,536</div>
<div class="fnote">That's roughly a 256× reduction in trainable parameters for this one matrix, at r=8.</div></div>
<details class="why"><summary>Why does this translate to real speed/memory savings?</summary><div class="why-body">
<h4>Reasoning</h4><p>Optimizer states (like Adam's momentum and variance) are stored per trainable parameter — often 2-3x their size. Cutting trainable parameters by 256× cuts optimizer memory by roughly the same factor, which is often the actual bottleneck, not the forward pass itself.</p>
<h4>Real world</h4><p>This is why LoRA lets you fine-tune a 7B+ model on a single consumer GPU with 24GB of memory — something full fine-tuning simply cannot do without dozens of GB more.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,19);
  const cx=W/2;
  const dVals=[512,1024,2048,4096,8192];
  const r=8;
  const cx0=W*0.14,cy0=H*0.78,plotW=W*0.72,plotH=H*0.5;
  line(ctx,cx0,cy0,cx0+plotW,cy0,{color:'#333'});
  line(ctx,cx0,cy0,cx0,cy0-plotH,{color:'#333'});
  txt(ctx,'d (hidden dimension)',cx0+plotW/2,cy0+22,{size:11,color:'#777'});
  const e=ease(clamp(t/1,0,1));
  const maxVal=Math.pow(8192,1); // for scaling using log
  function yFor(v){ const lv=Math.log10(v+1); const maxLv=Math.log10(8192*8192+1); return cy0-(lv/maxLv)*plotH; }
  // full params curve d^2
  ctx.beginPath();
  dVals.forEach((d,i)=>{
    const x=cx0+ (i/(dVals.length-1))*plotW;
    const y=yFor(d*d);
    if(i===0)ctx.moveTo(x,cy0);else{}
  });
  dVals.forEach((d,i)=>{
    if(i/(dVals.length-1) > e) return;
    const x=cx0+ (i/(dVals.length-1))*plotW;
    const y=yFor(d*d);
    ctx.lineTo?ctx.lineTo(x,y):null;
  });
  // simpler: draw points+lines manually
  ctx.beginPath();
  let started=false;
  dVals.forEach((d,i)=>{
    const prog=i/(dVals.length-1);
    if(prog>e)return;
    const x=cx0+prog*plotW;
    const y=yFor(d*d);
    if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);
  });
  ctx.strokeStyle=COLORS.red;ctx.lineWidth=2.2;ctx.stroke();
  const e2=ease(clamp((t-1.2)/1,0,1));
  ctx.beginPath();started=false;
  dVals.forEach((d,i)=>{
    const prog=i/(dVals.length-1);
    if(prog>e2)return;
    const x=cx0+prog*plotW;
    const y=yFor(2*d*r);
    if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);
  });
  ctx.strokeStyle=COLORS.green;ctx.lineWidth=2.2;ctx.stroke();
  const legendA=ease(clamp((t-2.3)/0.5,0,1));
  if(legendA>0){
    txt(ctx,'— full fine-tune (d²)',cx0+plotW*0.55,cy0-plotH+10,{size:10.5,color:COLORS.red,align:'left',alpha:legendA});
    txt(ctx,'— LoRA (2dr, r=8)',cx0+plotW*0.55,cy0-plotH+28,{size:10.5,color:COLORS.green,align:'left',alpha:legendA,weight:600});
  }
  dVals.forEach((d,i)=>{
    const prog=i/(dVals.length-1);
    const a=ease(clamp((t-prog*1-0)/0.3,0,1));
    txt(ctx,d,cx0+prog*plotW,cy0+14,{size:9.5,color:'#666',alpha:a});
  });
}});

/* ---- 19. QLoRA ---- */
S.push({chap:'5 · Efficient Adaptation', title:'QLoRA: LoRA on a Quantized Base', sub:'Fine-tune huge models on a single GPU', accent:COLORS.green,
panel:`
<div class="p-lead">QLoRA pushes efficiency further: keep the frozen base model compressed to 4-bit precision (via quantization, next section) to save massive memory, while the small LoRA adapters (B, A) remain in higher precision so training stays accurate.</div>
<ul class="p-bullets">
<li>Base model weights: stored in <b>4-bit NF4</b> format (frozen, never updated).</li>
<li>LoRA adapters: kept in 16-bit precision (trained normally).</li>
<li>During the forward pass, 4-bit weights are "dequantized on the fly" just long enough to compute, then discarded.</li>
</ul>
<div class="formula-box"><div class="flabel">Memory footprint</div>
<div class="feq">Memory ≈ 0.5 byte/param (base, 4-bit) + tiny LoRA params (16-bit)</div>
<div class="fnote">A 65B parameter model that needed ~130GB in 16-bit can fit in under ~40GB with QLoRA.</div></div>
<details class="why"><summary>Why does mixing precisions work without hurting quality?</summary><div class="why-body">
<h4>Reasoning</h4><p>The frozen base weights are never updated, so a small quantization error in them barely affects the final task performance — but the small set of LoRA parameters that <i>are</i> being trained need full precision, since even tiny errors there would compound over many gradient updates.</p>
<h4>Real world</h4><p>QLoRA is why fine-tuning a 65B-parameter model became possible on a single high-end consumer/workstation GPU, instead of requiring a multi-GPU server cluster.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,20);
  const cx=W/2, cy=H*0.5;
  const e=ease(clamp(t/0.6,0,1));
  const wx=W*0.28, wSize=Math.min(W,H)*0.34;
  box(ctx,wx-wSize/2,cy-wSize/2,wSize,wSize,{fill:'#141420',stroke:COLORS.blue,alpha:e,r:6});
  txt(ctx,'W',wx,cy-10,{size:20,color:COLORS.blue,weight:700,alpha:e});
  txt(ctx,'4-bit (NF4)',wx,cy+16,{size:10.5,color:COLORS.blue,alpha:e});
  txt(ctx,'frozen base model',wx,cy+wSize/2+18,{size:10.5,color:'#666',alpha:e});
  const e2=ease(clamp((t-0.7)/0.4,0,1));
  txt(ctx,'+',cx-30,cy,{size:22,color:'#666',alpha:e2});
  const e3=ease(clamp((t-1.1)/0.6,0,1));
  const bx=W*0.66,bh=wSize*0.9,bw=wSize*0.16;
  box(ctx,bx-bw/2,cy-bh/2,bw,bh,{fill:COLORS.green+'22',stroke:COLORS.green,alpha:e3,r:4});
  txt(ctx,'B',bx,cy,{size:14,color:COLORS.green,weight:700,alpha:e3});
  const ax=bx+bw/2+26,ah=wSize*0.16,aw=wSize*0.42;
  const e4=ease(clamp((t-1.5)/0.6,0,1));
  box(ctx,ax,cy-ah/2,aw,ah,{fill:COLORS.green+'22',stroke:COLORS.green,alpha:e4,r:4});
  txt(ctx,'A',ax+aw/2,cy,{size:14,color:COLORS.green,weight:700,alpha:e4});
  txt(ctx,'16-bit LoRA adapters',bx,cy+bh/2+20,{size:10,color:COLORS.green,alpha:e4});
  const e5=ease(clamp((t-2.1)/0.5,0,1));
  if(e5>0)txt(ctx,'compressed base + precise adapters = full quality, tiny memory',cx,H*0.9,{size:11,color:'#888',alpha:e5});
}});

/* ---- 20. QLoRA math ---- */
S.push({chap:'5 · Efficient Adaptation', title:'NF4: A Quantization Format Built for Weights', sub:'Why not just round to plain integers?', accent:COLORS.green,
panel:`
<div class="p-lead">Neural network weights aren't spread uniformly — they cluster tightly around zero in roughly a bell curve (Normal distribution). NF4 (4-bit NormalFloat) places its 16 possible values so each one covers an <b>equal amount of probability mass</b> under that bell curve, not equal numeric spacing.</div>
<ul class="p-bullets">
<li>Plain int4: 16 evenly-spaced numeric levels — wastes precision where weights rarely occur.</li>
<li>NF4: 16 levels placed at the quantiles of a standard Normal distribution.</li>
<li>Result: lower quantization error for the values that actually occur most often.</li>
</ul>
<div class="formula-box"><div class="flabel">Quantile-based levels</div>
<div class="feq">level<sub>i</sub> = Φ<sup>−1</sup>( (i + 0.5) / 16 )</div>
<div class="fnote">Φ⁻¹ is the inverse Normal CDF — it spaces levels so each bucket holds equal probability.</div></div>
<details class="why"><summary>Why match the data's distribution instead of using uniform steps?</summary><div class="why-body">
<h4>Reasoning</h4><p>Quantization error is worst where data is dense and levels are sparse. Since most weight values sit near zero, uniform spacing wastes most of its resolution on rarely-occurring large values — quantile-based spacing puts more levels exactly where the data actually lives, minimizing total error.</p>
<h4>Real world</h4><p>This distribution-aware trick is why QLoRA's 4-bit models perform nearly identically to full 16-bit fine-tuning on benchmarks, despite using a quarter of the bits.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,21);
  const cx=W/2, cy=H*0.5, R=Math.min(W,H)*0.3;
  // bell curve
  const e=ease(clamp(t/1,0,1));
  ctx.beginPath();
  for(let i=0;i<=120;i++){
    const x=-3+i/120*6;
    const y=Math.exp(-x*x/2);
    const px=cx-R+ (i/120)*2*R;
    const py=cy+R*0.6 - y*R*1.2;
    if(i/120<=e){if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
  }
  ctx.strokeStyle='#777';ctx.lineWidth=1.8;ctx.stroke();
  txt(ctx,'distribution of real weight values',cx,cy+R*0.6+26,{size:11,color:'#777',alpha:e});
  // uniform int4 ticks (top row)
  const e2=ease(clamp((t-1.2)/0.7,0,1));
  if(e2>0){
    txt(ctx,'plain INT4 (uniform)',cx,cy-R*0.75,{size:10.5,color:COLORS.rose,alpha:e2});
    for(let i=0;i<16;i++){
      const x=cx-R + (i/15)*2*R;
      const a=ease(clamp((t-1.2-i*0.03)/0.4,0,1));
      line(ctx,x,cy-R*0.65,x,cy-R*0.55,{color:COLORS.rose,alpha:a*0.8});
    }
  }
  // NF4 ticks (quantile spaced, bottom, denser near center)
  const e3=ease(clamp((t-2.2)/0.8,0,1));
  if(e3>0){
    txt(ctx,'NF4 (quantile-spaced)',cx,cy+R*0.95,{size:10.5,color:COLORS.green,alpha:e3});
    // approximate quantile positions using inverse-erf-ish spacing (visually denser near center)
    const qs=[];
    for(let i=0;i<16;i++){
      const p=(i+0.5)/16;
      // approximate probit via simple formula (Beasley-Springer-Moro-ish rough)
      const sign=p<0.5?-1:1;
      const pp=p<0.5?p:1-p;
      const val=sign*Math.sqrt(-2*Math.log(pp+0.0001))*0.85;
      qs.push(val);
    }
    qs.forEach((v,i)=>{
      const x=cx + clamp(v/3,-1,1)*R;
      const a=ease(clamp((t-2.2-i*0.03)/0.4,0,1));
      line(ctx,x,cy+R*0.6-8,x,cy+R*0.6+8,{color:COLORS.green,alpha:a*0.85});
    });
  }
}});

/* ---- 21. Quantization general ---- */
S.push({chap:'6 · Efficiency', title:'Quantization: Fewer Bits Per Number', sub:'Trading a little precision for a lot of speed & memory', accent:COLORS.amber,
panel:`
<div class="p-lead">Model weights are normally stored as 32-bit or 16-bit floating point numbers. Quantization rounds them down to fewer bits (8-bit, 4-bit, even lower), shrinking the model's memory footprint and speeding up inference, in exchange for a small, usually tolerable, drop in accuracy.</div>
<ul class="p-bullets">
<li>FP32 (32-bit) → INT8 (8-bit): 4× smaller, minimal accuracy loss.</li>
<li>FP32 → INT4: 8× smaller, needs more care (this is what QLoRA/NF4 addresses).</li>
<li>Two flavors: <b>post-training quantization</b> (quantize after training) and <b>quantization-aware training</b> (simulate quantization during training for better accuracy).</li>
</ul>
<div class="formula-box"><div class="flabel">Linear quantization</div>
<div class="feq">q = round( (x − min) / scale ),&nbsp;&nbsp; scale = (max − min) / (2<sup>b</sup> − 1)</div>
<div class="fnote">x = original value, q = quantized integer, b = number of bits. Dequantize: x̂ = q·scale + min.</div></div>
<details class="why"><summary>Why does rounding weights barely hurt accuracy?</summary><div class="why-body">
<h4>Reasoning</h4><p>Neural networks are highly overparameterized and robust to small perturbations — the rounding error introduced by quantization behaves similarly to noise the network already tolerates during training (e.g. from dropout or floating-point nondeterminism), so predictions barely shift.</p>
<h4>Real world</h4><p>Quantization is why you can run a capable chatbot locally on a laptop or phone — an 8-bit or 4-bit model needs a quarter or an eighth of the RAM of the original.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,22);
  const cx=W/2;
  const formats=[{l:'FP32',bits:32,c:'#888'},{l:'FP16',bits:16,c:COLORS.blue},{l:'INT8',bits:8,c:COLORS.amber},{l:'INT4',bits:4,c:COLORS.green}];
  const baseY=H*0.65, maxW=W*0.62;
  formats.forEach((f,i)=>{
    const y=H*0.22+i*H*0.15;
    const appear=ease(clamp((t-i*0.35)/0.55,0,1));
    if(appear<=0)return;
    const w=(f.bits/32)*maxW*appear;
    box(ctx,W*0.18,y-12,w,24,{fill:f.c+'33',stroke:f.c,r:4});
    txt(ctx,f.l+'  ('+f.bits+'-bit)',W*0.18+w+10,y,{size:11.5,color:f.c,align:'left',alpha:appear,weight:600});
  });
  const e=ease(clamp((t-1.8)/0.6,0,1));
  if(e>0)txt(ctx,'shorter bar = less memory, faster math',cx,H*0.92,{size:11,color:'#888',alpha:e});
}});

/* ---- 22. Quantization math ---- */
S.push({chap:'6 · Efficiency', title:'Quantization: Rounding a Real Number', sub:'Walking through one weight, step by step', accent:COLORS.amber,
panel:`
<div class="p-lead">Take one real weight value and see exactly how it becomes an 8-bit integer, then gets reconstructed (dequantized) for computation — with a small, bounded error.</div>
<ul class="p-bullets">
<li>Compute a <b>scale</b> factor based on the value range you need to represent.</li>
<li><b>Quantize</b>: divide by scale, round to nearest integer.</li>
<li><b>Dequantize</b>: multiply back by scale to recover an approximation.</li>
</ul>
<div class="formula-box"><div class="flabel">Worked example</div>
<div class="feq">x = 0.734,&nbsp; range=[−1, 1],&nbsp; b=8 → scale ≈ 0.00784</div>
<div class="fnote">q = round(0.734 / 0.00784) = 187/255-ish integer → dequantized x̂ ≈ 0.7333 (error ≈ 0.0007)</div></div>
<details class="why"><summary>Why is the error this small?</summary><div class="why-body">
<h4>Reasoning</h4><p>The maximum possible rounding error is always half of one "step" (half of scale) — with 8 bits over a range of 2, that step is about 1/128, so error never exceeds roughly 0.008. Summed across millions of weights, these tiny independent errors mostly cancel rather than compound.</p>
<h4>Real world</h4><p>This bounded, predictable error is why engineers can confidently ship 8-bit (and often 4-bit) quantized models knowing benchmark accuracy will drop only marginally.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,23);
  const cx=W/2;
  const e=ease(clamp(t/0.6,0,1));
  txt(ctx,'x = 0.734   (range −1 to 1, 8-bit)',cx,H*0.16,{size:13,color:'#ddd',alpha:e});
  // number line
  const lx=W*0.14, rx=W*0.86, y=H*0.4;
  line(ctx,lx,y,rx,y,{color:'#444',alpha:e});
  txt(ctx,'-1',lx,y+18,{size:10,color:'#666',alpha:e});
  txt(ctx,'1',rx,y+18,{size:10,color:'#666',alpha:e});
  txt(ctx,'0',(lx+rx)/2,y+18,{size:10,color:'#666',alpha:e});
  // ticks for int8 levels (subset for visual)
  const e2=ease(clamp((t-0.6)/0.7,0,1));
  if(e2>0){
    for(let i=0;i<=16;i++){
      const xx=lx+(i/16)*(rx-lx);
      line(ctx,xx,y-6,xx,y+6,{color:COLORS.amber,alpha:0.3*e2});
    }
  }
  // mark x point
  const e3=ease(clamp((t-1.3)/0.5,0,1));
  if(e3>0){
    const xpos=lx+((0.734+1)/2)*(rx-lx);
    ctx.beginPath();ctx.arc(xpos,y,5,0,7);ctx.fillStyle=COLORS.blue;ctx.globalAlpha=e3;ctx.fill();ctx.globalAlpha=1;
    txt(ctx,'x=0.734',xpos,y-20,{size:11,color:COLORS.blue,alpha:e3,weight:600});
    // nearest tick
    const nearestI=Math.round(((0.734+1)/2)*16);
    const nxpos=lx+(nearestI/16)*(rx-lx);
    const e4=ease(clamp((t-1.9)/0.5,0,1));
    if(e4>0){
      ctx.beginPath();ctx.arc(nxpos,y,5,0,7);ctx.fillStyle=COLORS.amber;ctx.globalAlpha=e4;ctx.fill();ctx.globalAlpha=1;
      txt(ctx,'x̂ ≈ 0.733 (quantized)',nxpos,y+34,{size:11,color:COLORS.amber,alpha:e4,weight:600});
      line(ctx,xpos,y-10,nxpos,y-10,{color:'#555',alpha:e4,dash:[3,3]});
      txt(ctx,'tiny rounding error',(xpos+nxpos)/2,y-22,{size:9.5,color:'#666',alpha:e4});
    }
  }
}});

/* ---- 23. Knowledge Distillation ---- */
S.push({chap:'6 · Efficiency', title:'Knowledge Distillation', sub:'A big "teacher" model trains a small "student"', accent:COLORS.purple,
panel:`
<div class="p-lead">Instead of training a small model from scratch on hard labels only, distillation has a large, accurate teacher model generate <b>soft probability distributions</b> for each example — and the small student learns to mimic those distributions, absorbing the teacher's "reasoning nuance" along with the right answer.</div>
<ul class="p-bullets">
<li>Hard label: "cat" (100% cat, 0% everything else) — throws away useful information.</li>
<li>Soft label from teacher: "92% cat, 6% dog, 2% fox" — reveals which mistakes are "less wrong".</li>
<li>Student trains to match this richer signal, often reaching much higher accuracy than training on hard labels alone.</li>
</ul>
<div class="formula-box"><div class="flabel">Distillation loss</div>
<div class="feq">L = α·CE(y, student) + (1−α)·KL( teacher<sub>T</sub> ‖ student<sub>T</sub> )</div>
<div class="fnote">T = "temperature" — softens probability distributions so smaller signal differences become visible.</div></div>
<details class="why"><summary>Why does a softened distribution teach more?</summary><div class="why-body">
<h4>Reasoning</h4><p>Raising the softmax temperature spreads out probability mass across "runner-up" classes, revealing the teacher's implicit similarity structure (e.g. that a cat is more like a dog than a truck) — this "dark knowledge" is invisible in a one-hot hard label but very informative for the student.</p>
<h4>Real world</h4><p>DistilBERT and many efficient "mini" model variants are built this way — matching most of a larger model's capability at a fraction of the size and inference cost.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,24);
  const cx=W/2;
  const e=ease(clamp(t/0.6,0,1));
  // teacher box (big)
  const tx=W*0.28, ty=H*0.30, tw=W*0.28, th=H*0.24;
  box(ctx,tx-tw/2,ty-th/2,tw,th,{fill:COLORS.purple+'18',stroke:COLORS.purple,alpha:e,r:8});
  txt(ctx,'Teacher (large)',tx,ty,{size:12.5,color:COLORS.purple,weight:600,alpha:e});
  // student box (small)
  const e2=ease(clamp((t-0.4)/0.6,0,1));
  const sx=W*0.28, sy=H*0.72, sw=W*0.15, sh=H*0.13;
  box(ctx,sx-sw/2,sy-sh/2,sw,sh,{fill:COLORS.green+'18',stroke:COLORS.green,alpha:e2,r:6});
  txt(ctx,'Student (small)',sx,sy,{size:11,color:COLORS.green,weight:600,alpha:e2});
  // soft label bars from teacher
  const cands=['cat','dog','fox','car'];
  const probs=[0.72,0.18,0.07,0.03];
  const bx=W*0.62, by=H*0.24, bw=W*0.28, bh=H*0.16;
  cands.forEach((c,i)=>{
    const a=ease(clamp((t-1.0-i*0.2)/0.5,0,1));
    if(a<=0)return;
    const cw=bw/4;
    const h=probs[i]*bh*2.6*a;
    box(ctx,bx+i*cw+4,by+bh-h,cw-8,h,{fill:COLORS.purple+'55',stroke:COLORS.purple,r:3});
    txt(ctx,c,bx+i*cw+cw/2-4,by+bh+14,{size:10,color:'#999',alpha:a});
  });
  const e3=ease(clamp((t-2.0)/0.5,0,1));
  if(e3>0)txt(ctx,'"soft labels" (teacher output)',bx+bw/2-4,by-14,{size:10.5,color:COLORS.purple,alpha:e3});
  // arrow teacher -> soft labels -> student
  arrow(ctx,tx+tw/2+4,ty,bx-6,by+bh/2,{color:COLORS.purple,progress:ease(clamp((t-0.7)/0.5,0,1)),alpha:0.7});
  const e4=ease(clamp((t-2.4)/0.6,0,1));
  arrow(ctx,bx+bw*0.15,by+bh+30,sx+sw*0.3,sy-sh/2-4,{color:COLORS.green,progress:e4,alpha:0.7});
  if(e4>0.6)txt(ctx,'student learns to match this distribution',cx,H*0.9,{size:11,color:'#888',alpha:e4});
}});

/* ---- 24. KD math ---- */
S.push({chap:'6 · Efficiency', title:'Temperature: Making Soft Labels Softer', sub:'Why divide the logits before softmax?', accent:COLORS.purple,
panel:`
<div class="p-lead">A normal softmax at temperature 1 already produces "soft" probabilities, but for confident models these are often still very close to one-hot (e.g. 99% / 1%). Raising the temperature T spreads the distribution out, exaggerating the useful small differences between the "wrong" classes.</div>
<ul class="p-bullets">
<li>T=1: standard softmax (may look almost one-hot for a confident model).</li>
<li>T>1 (e.g. T=4): flattens the distribution, revealing relative similarities.</li>
<li>Both teacher and student use the <b>same</b> temperature during distillation training.</li>
</ul>
<div class="formula-box"><div class="flabel">Temperature-scaled softmax</div>
<div class="feq">p<sub>i</sub> = exp(z<sub>i</sub> / T) / Σ<sub>j</sub> exp(z<sub>j</sub> / T)</div>
<div class="fnote">z = raw logits (pre-softmax scores). Larger T → flatter, more informative distribution.</div></div>
<details class="why"><summary>Why not just train on raw logits directly?</summary><div class="why-body">
<h4>Reasoning</h4><p>Raw logits can have very different scales across examples and classes, making direct regression unstable. Temperature-scaled probabilities keep the training signal bounded between 0 and 1 and comparable in scale across examples, while still exposing the fine-grained relative confidence the teacher has learned.</p>
<h4>Real world</h4><p>Choosing the right temperature is one of the few hyperparameters distillation practitioners tune carefully — too low loses the "dark knowledge", too high makes the signal too noisy to be useful.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,25);
  const cx=W/2;
  const logits=[4.5,2.0,0.5,-1.0];
  const labels=['cat','dog','fox','car'];
  function softmax(zs,T){
    const ex=zs.map(z=>Math.exp(z/T));
    const s=ex.reduce((a,b)=>a+b,0);
    return ex.map(e=>e/s);
  }
  const Tcycle = 1 + 3*(0.5+0.5*Math.sin(t*0.6-1.6));
  const e=ease(clamp(t/0.8,0,1));
  const probs=softmax(logits,Math.max(1,Tcycle));
  txt(ctx,'T = '+Tcycle.toFixed(2),cx,H*0.16,{size:14,color:COLORS.purple,weight:700,alpha:e});
  const bx=W*0.2, by=H*0.3, bw=W*0.6, bh=H*0.44;
  labels.forEach((l,i)=>{
    const a=ease(clamp((t-0.3-i*0.1)/0.4,0,1));
    if(a<=0)return;
    const cw=bw/4;
    const h=probs[i]*bh*a;
    box(ctx,bx+i*cw+8,by+bh-h,cw-16,h,{fill:COLORS.purple+'55',stroke:COLORS.purple,r:3});
    txt(ctx,l,bx+i*cw+cw/2-8,by+bh+16,{size:11,color:'#999',alpha:a});
