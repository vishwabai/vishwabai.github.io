<ul class="p-bullets">
<li>Up-weighting code, even for a general text model, can improve reasoning ability, not just coding skill</li>
<li>Up-weighting high-quality sources (books, curated text) relative to their raw size often outperforms proportional sampling</li>
<li>Curriculum ordering is an active research area, though most large-scale training still shuffles within a fixed mixture</li>
</ul>
<div class="formula-box"><div class="flabel">Sampling ratio</div>
<div class="feq">P(source<sub>i</sub>) = weight<sub>i</sub>·size<sub>i</sub> / Σ<sub>j</sub> weight<sub>j</sub>·size<sub>j</sub></div>
<div class="fnote">weight_i lets a small but high-quality source be sampled far more often than its raw share of tokens would suggest.</div></div>
<details class="why"><summary>Why would non-proportional mixing outperform "use everything equally"?</summary><div class="why-body">
<h4>Reasoning</h4><p>Raw web text is enormous but often lower quality and repetitive, while smaller curated sources are information-dense — over-sampling the dense, high-value sources gets more high-quality learning signal per token seen.</p>
<h4>Real world</h4><p>Frontier labs devote significant research effort to tuning data mixtures — often a bigger lever on final model quality than many architecture tweaks.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,55);
  const cx=W/2;
  const before=[{l:'Web',v:0.82,c:'#888'},{l:'Books',v:0.06,c:COLORS.blue},{l:'Code',v:0.05,c:COLORS.green},{l:'Papers',v:0.04,c:COLORS.purple},{l:'Dialogue',v:0.03,c:COLORS.amber}];
  const after=[{l:'Web',v:0.5,c:'#888'},{l:'Books',v:0.15,c:COLORS.blue},{l:'Code',v:0.2,c:COLORS.green},{l:'Papers',v:0.1,c:COLORS.purple},{l:'Dialogue',v:0.05,c:COLORS.amber}];
  function drawBar(data,y,label,alpha){
    let x=W*0.16;
    const bw=W*0.68;
    txt(ctx,label,W*0.16,y-16,{size:10.5,color:'#888',align:'left',alpha});
    data.forEach(d=>{
      const w=d.v*bw;
      box(ctx,x,y,w,26,{fill:d.c+'55',stroke:d.c,alpha,r:2});
      if(d.v>0.06)txt(ctx,d.l,x+w/2,y+13,{size:9,color:d.c,alpha});
      x+=w;
    });
  }
  const e0=ease(clamp(t/0.6,0,1));
  drawBar(before,H*0.32,'raw proportional to size',e0);
  const e1=ease(clamp((t-1.0)/0.7,0,1));
  drawBar(after,H*0.62,'reweighted mixture (used in training)',e1);
  const e2=ease(clamp((t-2.0)/0.5,0,1));
  if(e2>0)txt(ctx,'code & books up-weighted despite being a smaller raw share',cx,H*0.84,{size:11,color:'#888',alpha:e2});
}});

S.push({chap:"12 \u00b7 Data & Training Stability", title:"Learning Rate Schedules", sub:"Starting slow, cruising, then cooling down", accent:COLORS.blue,
panel:`
<div class="p-lead">The learning rate controls how big a step the optimizer takes on each update. Too high early on destabilizes training before the model has found reasonable weights; too low throughout wastes compute. A schedule ramps the rate up, holds it, then decays it.</div>
<ul class="p-bullets">
<li><b>Warmup</b>: start the learning rate near zero and increase it gradually, avoiding early instability from large, poorly-informed steps</li>
<li><b>Peak/plateau</b>: train at the highest stable learning rate for the bulk of training, for fast progress</li>
<li><b>Decay</b> (often cosine-shaped): gradually reduce the rate toward the end, letting the model settle into a more precise minimum</li>
</ul>
<div class="formula-box"><div class="flabel">Cosine decay</div>
<div class="feq">lr(t) = lr<sub>min</sub> + 0.5·(lr<sub>max</sub>−lr<sub>min</sub>)·(1 + cos(π·t/T))</div>
<div class="fnote">t = current step, T = total training steps — smoothly glides from lr_max down to lr_min.</div></div>
<details class="why"><summary>Why not just pick one good learning rate and keep it fixed?</summary><div class="why-body">
<h4>Reasoning</h4><p>Early in training, weights are essentially random, so large early updates can cause the loss to diverge; late in training, large updates cause oscillation around a good solution rather than settling into it — ramping up then down avoids both failure modes.</p>
<h4>Real world</h4><p>Nearly every large model training run uses some form of warmup + cosine decay — one of the most consistently applied stability improvements in the field.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,56);
  const cx0=W*0.14, cy0=H*0.78, plotW=W*0.72, plotH=H*0.5;
  line(ctx,cx0,cy0,cx0+plotW,cy0,{color:'#333'});
  line(ctx,cx0,cy0,cx0,cy0-plotH,{color:'#333'});
  txt(ctx,'training step \u2192',cx0+plotW/2,cy0+22,{size:10.5,color:'#777'});
  ctx.save();ctx.translate(cx0-24,cy0-plotH/2);ctx.rotate(-Math.PI/2);txt(ctx,'learning rate',0,0,{size:10.5,color:'#777'});ctx.restore();
  const e=ease(clamp(t/1.4,0,1));
  ctx.beginPath();
  const N=100;
  for(let i=0;i<=N;i++){
    const f=i/N;
    if(f>e)break;
    let lrv;
    if(f<0.1) lrv = f/0.1;
    else { const ff=(f-0.1)/0.9; lrv = 0.5*(1+Math.cos(Math.PI*ff)); }
    const x=cx0+f*plotW, y=cy0-lrv*plotH;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.strokeStyle=COLORS.blue;ctx.lineWidth=2.4;ctx.stroke();
  const e2=ease(clamp((t-1.6)/0.5,0,1));
  if(e2>0){
    txt(ctx,'warmup',cx0+plotW*0.05,cy0-plotH-14,{size:10,color:COLORS.blue,alpha:e2,align:'left'});
    txt(ctx,'plateau',cx0+plotW*0.3,cy0-plotH-14,{size:10,color:COLORS.blue,alpha:e2});
    txt(ctx,'cosine decay',cx0+plotW*0.75,cy0-plotH-14,{size:10,color:COLORS.blue,alpha:e2});
  }
}});


S.push({chap:"12 \u00b7 Data & Training Stability", title:"Gradient Clipping: Capping the Step Size", sub:"A safety valve against destabilizing updates", accent:COLORS.rose,
panel:`
<div class="p-lead">Occasionally, a batch of data produces an unusually large gradient — perhaps from an outlier example or numerical instability — that would otherwise cause a huge, destabilizing weight update. Gradient clipping caps the magnitude of the gradient before it's applied.</div>
<ul class="p-bullets">
<li>Compute the overall gradient norm (how "big" the update would be) across all parameters</li>
<li>If that norm exceeds a threshold, rescale the entire gradient down to the threshold, preserving its direction</li>
<li>A cheap, simple safeguard applied on essentially every large model training run</li>
</ul>
<div class="formula-box"><div class="flabel">Norm clipping</div>
<div class="feq">if ‖g‖ &gt; c:  g ← g · (c / ‖g‖)</div>
<div class="fnote">g = gradient vector, ‖g‖ = its norm, c = the clipping threshold — direction is preserved, only magnitude is capped.</div></div>
<details class="why"><summary>Why not just use a smaller learning rate instead?</summary><div class="why-body">
<h4>Reasoning</h4><p>A smaller learning rate slows every update uniformly, including the vast majority that are perfectly reasonable. Clipping targets only the rare, outsized gradients, preserving fast learning most of the time while still protecting against occasional spikes.</p>
<h4>Real world</h4><p>Without gradient clipping, long training runs occasionally diverge (loss suddenly spikes and never recovers) — clipping is a standard defense against a single bad batch derailing weeks of training.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,57);
  const cx0=W*0.16, cy0=H*0.7, plotW=W*0.68, plotH=H*0.44;
  line(ctx,cx0,cy0,cx0+plotW,cy0,{color:'#333'});
  txt(ctx,'training steps \u2192',cx0+plotW/2,cy0+22,{size:10.5,color:'#777'});
  const grads=[0.3,0.4,0.25,0.35,0.9,0.3,0.28,0.32,0.85,0.3];
  const threshold=0.6;
  const barW=plotW/grads.length;
  const thY=cy0-threshold*plotH;
  const e0=ease(clamp(t/0.5,0,1));
  line(ctx,cx0,thY,cx0+plotW,thY,{color:COLORS.amber,dash:[4,4],alpha:0.7*e0});
  txt(ctx,'clip threshold c',cx0+plotW+8,thY,{size:9.5,color:COLORS.amber,align:'left',alpha:e0});
  grads.forEach((g,i)=>{
    const appear=ease(clamp((t-0.5-i*0.2)/0.4,0,1));
    if(appear<=0)return;
    const clipped=Math.min(g,threshold);
    const h=clipped*plotH*appear;
    const wasClipped=g>threshold;
    box(ctx,cx0+i*barW+6,cy0-h,barW-12,h,{fill:wasClipped?COLORS.rose+'55':COLORS.blue+'44',stroke:wasClipped?COLORS.rose:COLORS.blue,r:2});
    if(wasClipped){
      const flashA=ease(clamp((t-0.5-i*0.2-0.3)/0.3,0,1));
      txt(ctx,'clipped',cx0+i*barW+barW/2-6,cy0-h-10,{size:8,color:COLORS.rose,alpha:flashA});
    }
  });
}});

S.push({chap:"12 \u00b7 Data & Training Stability", title:"Adam: Adapting the Step Size Per Parameter", sub:"Why not all weights should move at the same rate", accent:COLORS.green,
panel:`
<div class="p-lead">Plain gradient descent moves every parameter by the same learning-rate-scaled amount. Adam instead tracks a running average of each parameter's recent gradient (momentum) and its recent squared gradient, adjusting each parameter's effective step size individually.</div>
<ul class="p-bullets">
<li>Momentum term: smooths out noisy gradients by averaging recent gradient directions</li>
<li>Adaptive scaling: parameters with consistently small gradients get relatively bigger steps; volatile ones get smaller, more cautious steps</li>
<li>AdamW variant: separates weight decay from the adaptive gradient update, fixing a subtle interaction that hurt generalization in the original Adam</li>
</ul>
<div class="formula-box"><div class="flabel">Adam update (simplified)</div>
<div class="feq">θ ← θ − lr · m̂ / (√v̂ + ε)</div>
<div class="fnote">m̂ = bias-corrected running average of gradients, v̂ = bias-corrected running average of squared gradients.</div></div>
<details class="why"><summary>Why does dividing by √v̂ help?</summary><div class="why-body">
<h4>Reasoning</h4><p>Dividing by the square root of the recent squared-gradient average automatically shrinks the step for parameters with large or noisy gradients, and grows it for parameters with small, stable gradients — giving each parameter an individually well-scaled step size without manual tuning.</p>
<h4>Real world</h4><p>AdamW is the near-universal default optimizer for training transformers, from small research models up to the largest frontier LLMs.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,58);
  const cx0=W*0.18, cy0=H*0.2, plotW=W*0.64, plotH=H*0.62;
  // contour-like ellipses representing a loss landscape
  const e0=ease(clamp(t/0.6,0,1));
  for(let i=4;i>=1;i--){
    ctx.beginPath();
    ctx.ellipse(cx0+plotW*0.5,cy0+plotH*0.55,plotW*0.12*i,plotH*0.07*i,0.3,0,7);
    ctx.strokeStyle='rgba(150,150,170,'+(0.12*e0)+')';ctx.lineWidth=1;ctx.stroke();
  }
  const target={x:cx0+plotW*0.5,y:cy0+plotH*0.55};
  function path(kind,color,jag){
    let x=cx0+plotW*0.08, y=cy0+plotH*0.08;
    const pts=[[x,y]];
    const steps=9;
    for(let i=1;i<=steps;i++){
      const f=i/steps;
      let nx=lerp(x,target.x,f)+ (jag? Math.sin(i*2.1)*14*(1-f):0);
      let ny=lerp(y,target.y,f)+ (jag? Math.cos(i*1.7)*10*(1-f):0);
      pts.push([nx,ny]);
    }
    return pts;
  }
  const sgdPath=path('sgd',COLORS.rose,true);
  const adamPath=path('adam',COLORS.green,false);
  function drawPath(pts,color,label,delay){
    const e=ease(clamp((t-delay)/1.2,0,1));
    ctx.beginPath();
    const n=Math.floor(pts.length*e);
    for(let i=0;i<Math.max(2,n);i++){
      const [x,y]=pts[i];
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
    if(e>0.1)txt(ctx,label,pts[0][0],pts[0][1]-14,{size:10,color,alpha:e,align:'left'});
  }
  drawPath(sgdPath,COLORS.rose,'plain SGD (noisy path)',0.3);
  drawPath(adamPath,COLORS.green,'Adam (adaptive, smoother)',1.2);
  const e2=ease(clamp((t-2.6)/0.5,0,1));
  if(e2>0)txt(ctx,'\u2605 minimum',target.x,target.y+20,{size:10,color:'#ccc',alpha:e2});
}});

S.push({chap:"13 \u00b7 Evaluation", title:"Measuring a Language Model", sub:"Perplexity and standardized benchmarks", accent:COLORS.amber,
panel:`
<div class="p-lead">How do you know if one model is actually better than another? Perplexity gives an intrinsic, task-free measure of next-token prediction quality; benchmarks like MMLU test specific knowledge and reasoning skills with standardized questions.</div>
<ul class="p-bullets">
<li>Perplexity: roughly "how surprised was the model, on average, by the real next token?" — lower is better</li>
<li>MMLU: thousands of multiple-choice questions across dozens of academic subjects, testing broad knowledge</li>
<li>Benchmarks are useful but imperfect proxies — a model can overfit to benchmark-style questions without truly generalizing</li>
</ul>
<div class="formula-box"><div class="flabel">Perplexity</div>
<div class="feq">Perplexity = exp( average cross-entropy loss per token )</div>
<div class="fnote">A perplexity of 1 means perfect prediction; higher numbers mean more average "surprise" per token.</div></div>
<details class="why"><summary>Why exponentiate the loss instead of reporting it directly?</summary><div class="why-body">
<h4>Reasoning</h4><p>Cross-entropy loss is in awkward, unintuitive units (nats or bits); exponentiating converts it into something interpretable as "the model was about as uncertain as choosing uniformly among this many options" — a more tangible comparison.</p>
<h4>Real world</h4><p>Perplexity comparisons are a quick, cheap sanity check used throughout training, while benchmarks like MMLU are reserved for final capability comparisons between finished models.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,59);
  const cx0=W*0.16, cy0=H*0.42, plotW=W*0.68, plotH=H*0.24;
  line(ctx,cx0,cy0,cx0+plotW,cy0,{color:'#333'});
  txt(ctx,'training progress \u2192',cx0+plotW/2,cy0+18,{size:10,color:'#777'});
  txt(ctx,'perplexity over training',cx0+plotW/2,cy0-plotH-14,{size:11.5,color:COLORS.amber});
  const e=ease(clamp(t/1.2,0,1));
  ctx.beginPath();
  for(let i=0;i<=60;i++){
    const f=i/60; if(f>e)break;
    const x=cx0+f*plotW;
    const y=cy0-plotH*(1-Math.pow(1-f,1.5))*0.95;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.strokeStyle=COLORS.amber;ctx.lineWidth=2.2;ctx.stroke();
  const e2=ease(clamp((t-1.5)/0.6,0,1));
  if(e2>0){
    txt(ctx,'MMLU question:',W*0.5,H*0.66,{size:11,color:'#ccc',alpha:e2});
    txt(ctx,'"What is the powerhouse of the cell?"',W*0.5,H*0.72,{size:11,color:'#ddd',alpha:e2});
    const opts=['A) Nucleus','B) Mitochondria \u2713','C) Ribosome','D) Golgi body'];
    opts.forEach((o,i)=>{
      const a=ease(clamp((t-1.9-i*0.15)/0.3,0,1));
      txt(ctx,o,W*0.5,H*0.8+i*18,{size:10,color:i===1?COLORS.green:'#888',alpha:a});
    });
  }
}});


S.push({chap:"13 \u00b7 Evaluation", title:"Human Preference Evaluation", sub:"When there is no single right answer", accent:COLORS.purple,
panel:`
<div class="p-lead">For open-ended tasks like conversation, there's no ground-truth "correct" response to grade against. Instead, models are compared head-to-head: raters see two responses and pick the better one, and an Elo-style rating system aggregates comparisons into a ranking.</div>
<ul class="p-bullets">
<li>Two models answer the same prompt anonymously; a rater picks the better response (or ties)</li>
<li>Wins/losses across thousands of comparisons update each model's Elo rating</li>
<li>This captures qualities (tone, helpfulness, creativity) that fixed-answer benchmarks can't measure</li>
</ul>
<div class="formula-box"><div class="flabel">Elo update (same as chess ratings)</div>
<div class="feq">R'<sub>A</sub> = R<sub>A</sub> + K·(S<sub>A</sub> − E<sub>A</sub>)</div>
<div class="fnote">S_A = actual result (1 win, 0.5 tie, 0 loss), E_A = expected result from current ratings, K = update sensitivity.</div></div>
<details class="why"><summary>Why use a ranking system built for chess?</summary><div class="why-body">
<h4>Reasoning</h4><p>Elo was designed to convert a stream of pairwise win/loss outcomes — exactly the format human preference comparisons produce — into a single consistent ranking, without ever needing an absolute quality score for any individual response.</p>
<h4>Real world</h4><p>Public leaderboards like Chatbot Arena use exactly this approach, and it has become one of the most trusted ways to compare frontier conversational models.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,60);
  const cx=W/2;
  const e0=ease(clamp(t/0.5,0,1));
  box(ctx,W*0.16,H*0.22,W*0.3,H*0.2,{fill:COLORS.blue+'14',stroke:COLORS.blue,alpha:e0,r:8});
  txt(ctx,'Model A response',W*0.31,H*0.32,{size:10.5,color:COLORS.blue,alpha:e0});
  box(ctx,W*0.54,H*0.22,W*0.3,H*0.2,{fill:COLORS.purple+'14',stroke:COLORS.purple,alpha:e0,r:8});
  txt(ctx,'Model B response',W*0.69,H*0.32,{size:10.5,color:COLORS.purple,alpha:e0});
  const e1=ease(clamp((t-0.8)/0.5,0,1));
  if(e1>0)txt(ctx,'human picks: B is better',cx,H*0.52,{size:12,color:'#ddd',weight:600,alpha:e1});
  const e2=ease(clamp((t-1.5)/0.7,0,1));
  if(e2>0){
    const ratingA0=1200, ratingA1=1185;
    const ratingB0=1150, ratingB1=1165;
    const ra=lerp(ratingA0,ratingA1,e2), rb=lerp(ratingB0,ratingB1,e2);
    txt(ctx,'A: '+Math.round(ra),W*0.31,H*0.7,{size:14,color:COLORS.blue,weight:700,alpha:e2});
    txt(ctx,'B: '+Math.round(rb),W*0.69,H*0.7,{size:14,color:COLORS.purple,weight:700,alpha:e2});
    txt(ctx,'Elo ratings update after each comparison',cx,H*0.84,{size:10.5,color:'#888',alpha:e2});
  }
}});

S.push({chap:"13 \u00b7 Evaluation", title:"Self-Consistency: Wisdom of (Many) Samples", sub:"Sample multiple reasoning paths, vote on the answer", accent:COLORS.blue,
panel:`
<div class="p-lead">A single chain-of-thought sample can go down a wrong reasoning path by chance. Self-consistency samples several independent reasoning attempts for the same question and takes the most common final answer as the result.</div>
<ul class="p-bullets">
<li>Generate k independent chain-of-thought completions for the same prompt, using sampling (not greedy)</li>
<li>Extract the final answer from each; take a majority vote</li>
<li>Different reasoning paths that make different small mistakes rarely agree on the same wrong answer</li>
</ul>
<div class="formula-box"><div class="flabel">Majority vote</div>
<div class="feq">final_answer = mode( answer<sub>1</sub>, answer<sub>2</sub>, …, answer<sub>k</sub> )</div>
<div class="fnote">mode = the most frequently occurring value among the k sampled answers.</div></div>
<details class="why"><summary>Why does voting across samples improve accuracy?</summary><div class="why-body">
<h4>Reasoning</h4><p>Independent reasoning paths' errors tend to be uncorrelated — one path might slip on arithmetic, another on misreading — but they rarely make the exact same mistake, so the correct answer tends to accumulate the plurality of votes even when many individual attempts fail.</p>
<h4>Real world</h4><p>Self-consistency reliably boosts accuracy on math and reasoning benchmarks over single-sample chain-of-thought, at the direct cost of needing k times more inference compute.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,61);
  const cx=W/2;
  const paths=[{a:'42',c:COLORS.green},{a:'42',c:COLORS.green},{a:'39',c:COLORS.rose},{a:'42',c:COLORS.green},{a:'44',c:COLORS.amber}];
  const gap=W*0.7/paths.length, startX=cx-(gap*(paths.length-1))/2;
  txt(ctx,'"What is 6 \u00d7 7?" \u2014 5 independent samples',cx,H*0.14,{size:11.5,color:'#ccc',alpha:ease(clamp(t/0.5,0,1))});
  paths.forEach((p,i)=>{
    const appear=ease(clamp((t-0.4-i*0.3)/0.5,0,1));
    if(appear<=0)return;
    const x=startX+i*gap;
    box(ctx,x-30,H*0.3,60,32,{fill:p.c+'22',stroke:p.c,alpha:appear,r:6});
    txt(ctx,p.a,x,H*0.3+16,{size:14,color:p.c,weight:700,alpha:appear});
  });
  const e2=ease(clamp((t-2.2)/0.6,0,1));
  if(e2>0){
    txt(ctx,'majority: "42" (3 of 5 votes)',cx,H*0.56,{size:13,color:COLORS.green,weight:700,alpha:e2});
  }
}});


S.push({chap:"13 \u00b7 Evaluation", title:"Test-Time Compute: Thinking Longer to Answer Better", sub:"Spending more compute at inference, not just training", accent:COLORS.rose,
panel:`
<div class="p-lead">Instead of always investing more compute in training a bigger model, a model can be given more compute at inference time — generating multiple candidate answers and using a verifier or scorer to pick the best one.</div>
<ul class="p-bullets">
<li>Best-of-N: generate N complete candidate answers, score each, keep the highest-scoring one</li>
<li>Longer reasoning traces: some models are explicitly trained to "think" longer on harder problems before answering</li>
<li>This adds a new scaling axis: model size × training compute × inference-time compute, each with its own tradeoffs</li>
</ul>
<div class="formula-box"><div class="flabel">Best-of-N selection</div>
<div class="feq">answer* = argmax<sub>i∈1..N</sub> score(candidate<sub>i</sub>)</div>
<div class="fnote">The scoring function can be a trained reward model, a verifier, or even the same LLM self-critiquing.</div></div>
<details class="why"><summary>Why is spending more compute at inference sometimes better than a bigger model?</summary><div class="why-body">
<h4>Reasoning</h4><p>A bigger model costs more for every future query, even easy ones. Extra inference-time compute can be spent selectively — only on the harder problems that actually need it — often achieving similar accuracy gains far more cheaply and flexibly.</p>
<h4>Real world</h4><p>This "test-time scaling" idea underlies reasoning-focused models that visibly spend more computation on harder prompts, trading response latency for higher accuracy.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,62);
  const cx=W/2;
  const n=5;
  const scores=[0.3,0.9,0.5,0.4,0.2];
  const gap=W*0.7/n, startX=cx-(gap*(n-1))/2;
  txt(ctx,'N candidate answers generated in parallel',cx,H*0.14,{size:11.5,color:'#ccc',alpha:ease(clamp(t/0.5,0,1))});
  scores.forEach((s,i)=>{
    const appear=ease(clamp((t-0.4-i*0.2)/0.4,0,1));
    if(appear<=0)return;
    const x=startX+i*gap;
    const isBest = s===Math.max(...scores);
    box(ctx,x-30,H*0.3,60,32,{fill:isBest?COLORS.green+'33':'#181820',stroke:isBest?COLORS.green:'#444',alpha:appear,r:6,lw:isBest?2:1});
    txt(ctx,'#'+(i+1),x,H*0.3+16,{size:11,color:isBest?COLORS.green:'#777',alpha:appear});
    const e2=ease(clamp((t-1.6-i*0.1)/0.4,0,1));
    if(e2>0)txt(ctx,'score '+s.toFixed(1),x,H*0.3+50,{size:9.5,color:isBest?COLORS.green:'#666',alpha:e2});
  });
  const e3=ease(clamp((t-2.5)/0.5,0,1));
  if(e3>0)txt(ctx,'highest-scoring candidate is returned',cx,H*0.62,{size:11.5,color:COLORS.green,weight:600,alpha:e3});
}});

S.push({chap:"13 \u00b7 Evaluation", title:"Calibration: Does Confidence Match Correctness?", sub:"A well-calibrated model knows what it doesn't know", accent:COLORS.gray,
panel:`
<div class="p-lead">Beyond just being right or wrong, a good model should be honest about how sure it is. Calibration measures whether a model's stated confidence actually matches its real accuracy — if it says "90% confident" a hundred times, it should be right about 90 of those times.</div>
<ul class="p-bullets">
<li>Overconfident model: claims high certainty even when frequently wrong — misleading for downstream decisions</li>
<li>Underconfident model: hedges even on things it reliably gets right — less useful, though safer</li>
<li>Techniques like temperature scaling, or explicit training to express uncertainty in words, can improve calibration</li>
</ul>
<div class="formula-box"><div class="flabel">Calibration error (informal)</div>
<div class="feq">ECE = average | confidence − actual accuracy | across confidence buckets</div>
<div class="fnote">Group predictions by stated confidence level, then compare each group's average confidence to its actual accuracy.</div></div>
<details class="why"><summary>Why is calibration separate from raw accuracy?</summary><div class="why-body">
<h4>Reasoning</h4><p>Two models can have identical accuracy yet very different usefulness — one that clearly signals uncertainty on questions it's likely to get wrong lets a user know when to double-check, while an equally accurate but overconfident model gives no such warning.</p>
<h4>Real world</h4><p>Calibration is a big part of why some hallucination-mitigation strategies focus on getting the model to say "I'm not sure" appropriately, not just on raw factual accuracy.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,63);
  const cx0=W*0.18, cy0=H*0.82, plotW=W*0.64, plotH=H*0.58;
  line(ctx,cx0,cy0,cx0+plotW,cy0,{color:'#333'});
  line(ctx,cx0,cy0,cx0,cy0-plotH,{color:'#333'});
  txt(ctx,'stated confidence \u2192',cx0+plotW/2,cy0+20,{size:10,color:'#777'});
  ctx.save();ctx.translate(cx0-22,cy0-plotH/2);ctx.rotate(-Math.PI/2);txt(ctx,'actual accuracy',0,0,{size:10,color:'#777'});ctx.restore();
  const e0=ease(clamp(t/0.6,0,1));
  line(ctx,cx0,cy0,cx0+plotW,cy0-plotH,{color:'#555',dash:[4,4],alpha:e0});
  txt(ctx,'ideal (perfectly calibrated)',cx0+plotW*0.55,cy0-plotH*0.68,{size:9.5,color:'#666',alpha:e0});
  const buckets=[{x:0.2,acc:0.35},{x:0.4,acc:0.5},{x:0.6,acc:0.55},{x:0.8,acc:0.62},{x:0.95,acc:0.7}];
  buckets.forEach((b,i)=>{
    const appear=ease(clamp((t-0.6-i*0.2)/0.4,0,1));
    if(appear<=0)return;
    const x=cx0+b.x*plotW;
    const y=cy0-b.acc*plotH*appear;
    box(ctx,x-14,y,28,cy0-y,{fill:COLORS.rose+'44',stroke:COLORS.rose,r:2});
    const idealY=cy0-b.x*plotH;
    if(appear>0.5){
      line(ctx,x,y,x,idealY,{color:COLORS.rose,alpha:0.4,dash:[2,2]});
    }
  });
  const e2=ease(clamp((t-2.0)/0.5,0,1));
  if(e2>0)txt(ctx,'gap below the diagonal = overconfidence',cx0+plotW/2,cy0-plotH-14,{size:11,color:COLORS.rose,alpha:e2});
}});

S.push({chap:"14 \u00b7 Tools, Agents & Safety", title:"Function Calling: Letting the Model Use Tools", sub:"Going beyond text generation to real actions", accent:COLORS.teal,
panel:`
<div class="p-lead">A language model alone can only produce text — it can't check today's weather or run code. Function calling lets the model output a structured request (a function name and arguments) that the surrounding system executes, feeding the result back for the model to use.</div>
<ul class="p-bullets">
<li>The model is given a list of available tools (name, description, expected arguments) in its context</li>
<li>Instead of directly answering, it can emit a structured call like get_weather(city="Chennai")</li>
<li>The tool runs outside the model; its result is inserted back into the conversation for the model to read and continue from</li>
</ul>
<div class="formula-box"><div class="flabel">The loop</div>
<div class="feq">prompt → model emits tool call → system executes → result appended → model continues</div>
<div class="fnote">The model never touches the real world directly — it only produces text, some of which the system interprets as an action request.</div></div>
<details class="why"><summary>Why not have the model try to compute or recall everything itself?</summary><div class="why-body">
<h4>Reasoning</h4><p>Some information (today's date, a live stock price, a large calculation) is either unknowable from training data or unreliable for a model to compute internally — delegating to a purpose-built, verifiable tool is more accurate and often faster.</p>
<h4>Real world</h4><p>Function calling is the foundation of nearly every practical LLM-powered product that checks calendars, searches the web, queries databases, or runs code.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,64);
  const cx=W/2;
  const e0=ease(clamp(t/0.5,0,1));
  box(ctx,W*0.14,H*0.22,W*0.3,H*0.16,{fill:COLORS.blue+'14',stroke:COLORS.blue,alpha:e0,r:6});
  txt(ctx,'model',W*0.29,H*0.3,{size:12,color:COLORS.blue,alpha:e0,weight:600});
  const e1=ease(clamp((t-0.6)/0.5,0,1));
  if(e1>0){
    box(ctx,W*0.14,H*0.44,W*0.42,H*0.14,{fill:'#141420',stroke:'#666',alpha:e1,r:5});
    txt(ctx,'get_weather(city="Chennai")',W*0.35,H*0.51,{size:10.5,color:'#ccc',alpha:e1});
  }
  const e2=ease(clamp((t-1.2)/0.5,0,1));
  if(e2>0){
    box(ctx,W*0.66,H*0.44,W*0.22,H*0.14,{fill:COLORS.teal+'22',stroke:COLORS.teal,alpha:e2,r:6});
    txt(ctx,'weather tool',W*0.77,H*0.51,{size:10.5,color:COLORS.teal,alpha:e2});
    arrow(ctx,W*0.56,H*0.51,W*0.66,H*0.51,{color:COLORS.teal,progress:e2});
  }
  const e3=ease(clamp((t-1.8)/0.5,0,1));
  if(e3>0){
    box(ctx,W*0.14,H*0.66,W*0.42,H*0.14,{fill:COLORS.green+'14',stroke:COLORS.green,alpha:e3,r:5});
    txt(ctx,'result: "31\u00b0C, humid"',W*0.35,H*0.73,{size:10.5,color:COLORS.green,alpha:e3});
    arrow(ctx,W*0.77,H*0.58,W*0.35,H*0.66,{color:COLORS.green,progress:e3,alpha:0.6});
  }
  const e4=ease(clamp((t-2.4)/0.5,0,1));
  if(e4>0)txt(ctx,'model reads the result and continues its answer',cx,H*0.88,{size:11,color:'#888',alpha:e4});
}});


S.push({chap:"14 \u00b7 Tools, Agents & Safety", title:"Agents: Plan, Act, Observe, Repeat", sub:"Chaining tool calls to accomplish multi-step goals", accent:COLORS.blue,
panel:`
<div class="p-lead">A single function call solves a single step. An "agent" repeats a loop — decide what to do next, take an action, observe the result, and decide again — continuing until the overall goal is accomplished or a stopping condition is met.</div>
<ul class="p-bullets">
<li><b>Plan</b>: given the goal and everything observed so far, decide the next single action</li>
<li><b>Act</b>: execute that action (a tool call, a search, writing a file)</li>
<li><b>Observe</b>: read back the result and update the running context</li>
<li>Repeat until done, or a maximum step count is reached — a critical safety limit</li>
</ul>
<div class="formula-box"><div class="flabel">The loop, formally</div>
<div class="feq">state<sub>t+1</sub> = Observe( Act( Plan(state<sub>t</sub>) ) )</div>
<div class="fnote">Each iteration's output becomes the next iteration's input, interleaved with real actions in the world.</div></div>
<details class="why"><summary>Why not just plan every step upfront?</summary><div class="why-body">
<h4>Reasoning</h4><p>Real-world tasks are unpredictable — a search might return unexpected results, a file might not exist — so a rigid upfront plan is brittle; re-planning after each observation lets the agent adapt to what actually happened.</p>
<h4>Real world</h4><p>This Plan-Act-Observe loop underlies coding agents, research assistants, and browser-automation tools that complete multi-step tasks without a human directing every step.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,65);
  const cx=W/2, cy=H*0.42, R=Math.min(W,H)*0.24;
  const nodes=[{l:'Plan',ang:-Math.PI/2,c:COLORS.blue},{l:'Act',ang:-Math.PI/2+2*Math.PI/3,c:COLORS.amber},{l:'Observe',ang:-Math.PI/2+4*Math.PI/3,c:COLORS.green}];
  nodes.forEach((n,i)=>{
    const appear=ease(clamp((t-i*0.3)/0.5,0,1));
    if(appear<=0)return;
    const x=cx+Math.cos(n.ang)*R, y=cy+Math.sin(n.ang)*R;
    box(ctx,x-42,y-20,84,40,{fill:n.c+'22',stroke:n.c,alpha:appear,r:8});
    txt(ctx,n.l,x,y,{size:12,color:n.c,alpha:appear,weight:600});
  });
  const e2=ease(clamp((t-1.2)/1.5,0,1));
  if(e2>0){
    const cycleT=(t-1.2)%1.5/1.5;
    const idx=Math.floor(cycleT*3);
    const nextIdx=(idx+1)%3;
    const a1=nodes[idx].ang, a2=nodes[nextIdx].ang;
    const x1=cx+Math.cos(a1)*R,y1=cy+Math.sin(a1)*R;
    const x2=cx+Math.cos(a2)*R,y2=cy+Math.sin(a2)*R;
    const localP = (cycleT*3)%1;
    arrow(ctx,x1,y1,lerp(x1,x2,localP),lerp(y1,y2,localP),{color:'#ddd',progress:1,head:6});
  }
  const e3=ease(clamp((t-3.0)/0.6,0,1));
  if(e3>0)txt(ctx,'loop continues until goal achieved or step limit hit',cx,cy+R+50,{size:11,color:'#888',alpha:e3});
}});

S.push({chap:"14 \u00b7 Tools, Agents & Safety", title:"Prompt Injection & Jailbreaks", sub:"When untrusted text tries to hijack instructions", accent:COLORS.rose,
panel:`
<div class="p-lead">A model reads its system instructions and any external content (a webpage, a document, a tool result) in the same text stream. Prompt injection exploits this by hiding instructions inside that external content, trying to trick the model into ignoring its original guidance.</div>
<ul class="p-bullets">
<li><b>Direct jailbreak</b>: a user directly asks the model to ignore its guidelines or roleplay as an unrestricted persona</li>
<li><b>Indirect (prompt) injection</b>: malicious instructions hidden inside a document or webpage the model later reads — the attacker never talks to the model directly</li>
<li><b>Defenses</b>: separating trusted instructions from untrusted content, training the model to resist embedded instructions, and limiting actions taken on untrusted input alone</li>
</ul>
<div class="formula-box"><div class="flabel">The core vulnerability (informal)</div>
<div class="feq">model input = trusted instructions + untrusted content, both as plain text</div>
<div class="fnote">Without special handling, a model has no built-in way to know which words came from a trusted developer vs. an attacker's webpage.</div></div>
<details class="why"><summary>Why can't the model just always tell the difference?</summary><div class="why-body">
<h4>Reasoning</h4><p>At the token level, an instruction embedded in a retrieved webpage looks identical to a genuine system instruction — there's no cryptographic signature separating them — so robustness requires deliberate training and system-level safeguards.</p>
<h4>Real world</h4><p>Agent systems that browse the web or read untrusted documents need careful sandboxing — an agent that can both read arbitrary content and take real actions (like sending emails) is a bigger injection risk than a plain chatbot.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,66);
  const cx=W/2;
  const e0=ease(clamp(t/0.5,0,1));
  box(ctx,W*0.14,H*0.18,W*0.32,H*0.14,{fill:COLORS.green+'14',stroke:COLORS.green,alpha:e0,r:6});
  txt(ctx,'trusted system instructions',W*0.3,H*0.25,{size:10,color:COLORS.green,alpha:e0});
  const e1=ease(clamp((t-0.5)/0.5,0,1));
  if(e1>0){
    box(ctx,W*0.14,H*0.4,W*0.32,H*0.2,{fill:COLORS.rose+'14',stroke:COLORS.rose,alpha:e1,r:6});
    txt(ctx,'untrusted webpage content',W*0.3,H*0.46,{size:10,color:COLORS.rose,alpha:e1});
    const flash=0.6+0.4*Math.sin(t*4);
    txt(ctx,'"ignore prior rules..."',W*0.3,H*0.54,{size:9,color:COLORS.rose,alpha:e1*flash});
  }
  const e2=ease(clamp((t-1.2)/0.5,0,1));
  if(e2>0){
    box(ctx,W*0.62,H*0.3,W*0.24,H*0.16,{fill:COLORS.blue+'14',stroke:COLORS.blue,alpha:e2,r:6});
    txt(ctx,'model',W*0.74,H*0.38,{size:11,color:COLORS.blue,alpha:e2});
    arrow(ctx,W*0.46,H*0.25,W*0.62,H*0.34,{color:COLORS.green,progress:e2,alpha:0.6});
    arrow(ctx,W*0.46,H*0.5,W*0.62,H*0.38,{color:COLORS.rose,progress:e2,alpha:0.6});
  }
  const e3=ease(clamp((t-1.9)/0.5,0,1));
  if(e3>0){
    txt(ctx,'\u26a0 defense: model trained to resist embedded instructions',cx,H*0.72,{size:11,color:COLORS.amber,alpha:e3});
  }
}});


S.push({chap:"14 \u00b7 Tools, Agents & Safety", title:"Guardrails: A Second Layer of Judgment", sub:"Classifiers watching the model's inputs and outputs", accent:COLORS.amber,
panel:`
<div class="p-lead">Relying on a single generative model to both do the task and police its own safety has limits. Production systems often add separate, smaller classifier models that screen inputs and outputs for policy violations — an independent check, rather than trusting the main model's judgment alone.</div>
<ul class="p-bullets">
<li><b>Input classifiers</b>: screen incoming prompts for clear policy violations before the main model responds</li>
<li><b>Output classifiers</b>: screen the model's generated response before it's shown to the user</li>
<li><b>Layered defense</b>: multiple independent checks catch a wider range of failure cases than one on its own</li>
</ul>
<div class="formula-box"><div class="flabel">Layered pipeline</div>
<div class="feq">user input → [input classifier] → main model → [output classifier] → response</div>
<div class="fnote">Each classifier is typically a small, fast, specialized model trained specifically to detect policy-relevant categories.</div></div>
<details class="why"><summary>Why not just make the main model good enough alone?</summary><div class="why-body">
<h4>Reasoning</h4><p>A single model juggling "be maximally helpful" and "reliably police itself" faces inherent tension, and any single system has blind spots — a separate, narrowly-scoped classifier provides an independent check that doesn't share the main model's failure modes.</p>
<h4>Real world</h4><p>Most production LLM deployments include an external moderation layer alongside the core model's own training-time safety work, since defense-in-depth catches more than either approach alone.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,67);
  const cx=W/2, y=H*0.4;
  const stages=[{l:'user\ninput',c:'#888'},{l:'input\nclassifier',c:COLORS.amber},{l:'main\nmodel',c:COLORS.blue},{l:'output\nclassifier',c:COLORS.amber},{l:'response',c:'#888'}];
  const gap=W*0.86/(stages.length-1), startX=cx-(gap*(stages.length-1))/2;
  stages.forEach((s,i)=>{
    const appear=ease(clamp((t-i*0.3)/0.5,0,1));
    if(appear<=0)return;
    const x=startX+i*gap;
    box(ctx,x-44,y-24,88,48,{fill:s.c+'18',stroke:s.c,alpha:appear,r:6});
    s.l.split('\n').forEach((ln,li)=>txt(ctx,ln,x,y+(li-(s.l.split('\n').length-1)/2)*12,{size:9.5,color:s.c,alpha:appear}));
    if(i>0){
      const ap=ease(clamp((t-i*0.3-0.15)/0.3,0,1));
      arrow(ctx,startX+(i-1)*gap+44,y,x-44,y,{color:'#555',progress:ap});
    }
  });
  const e2=ease(clamp((t-1.8)/0.6,0,1));
  if(e2>0){
    txt(ctx,'\u2717 blocked here',startX+gap,y-46,{size:10,color:COLORS.rose,alpha:e2});
  }
}});


S.push({chap:"14 \u00b7 Tools, Agents & Safety", title:"Watermarking Generated Text", sub:"A statistical signature invisible to readers", accent:COLORS.purple,
panel:`
<div class="p-lead">As AI-generated text becomes harder to distinguish from human writing, watermarking embeds a subtle statistical pattern into the model's word choices during generation — invisible to a human reader, but detectable by a matching statistical test.</div>
<ul class="p-bullets">
<li>Before each token, the vocabulary is pseudo-randomly split into a "green list" and a "red list", seeded by preceding tokens</li>
<li>The model is nudged to prefer green-list tokens whenever it's not confident it needs a specific red-list word</li>
<li>A detector, knowing the same seeding rule, checks what fraction of a text's tokens fall on the green list</li>
</ul>
<div class="formula-box"><div class="flabel">Detection statistic</div>
<div class="feq">z = (green_count − expected_under_random) / standard_deviation</div>
<div class="fnote">A high z-score indicates the text very likely came from a watermarked model rather than random human writing.</div></div>
<details class="why"><summary>Why doesn't biasing word choice ruin text quality?</summary><div class="why-body">
<h4>Reasoning</h4><p>At nearly every generation step there are several roughly-equally-good token choices; nudging toward the "green" half of those near-ties costs almost nothing in fluency, while still producing a statistically detectable skew across an entire document.</p>
<h4>Real world</h4><p>Watermarking helps distinguish AI-generated content from human writing, though it only works if the generating system applies it, and doesn't survive heavy editing or paraphrasing.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,68);
  const cx=W/2;
  const words=['The','quick','brown','fox','jumps','over','the','lazy'];
  const greenMask=[1,1,0,1,1,0,1,1];
  const gap=W*0.82/words.length, startX=cx-(gap*(words.length-1))/2;
  words.forEach((w,i)=>{
    const appear=ease(clamp((t-i*0.2)/0.4,0,1));
    if(appear<=0)return;
    const isGreen=greenMask[i];
    tokenBubble(ctx,startX+i*gap,H*0.32,w,isGreen?COLORS.green:'#666',appear,0.85);
  });
  const e2=ease(clamp((t-2.0)/0.6,0,1));
  if(e2>0){
    txt(ctx,'6 of 8 tokens landed on the "green list"',cx,H*0.52,{size:11.5,color:COLORS.green,alpha:e2,weight:600});
  }
  const e3=ease(clamp((t-2.6)/0.6,0,1));
  if(e3>0){
    txt(ctx,'z = 4.1  \u2192  very likely watermarked',cx,H*0.68,{size:12,color:COLORS.purple,weight:700,alpha:e3});
  }
}});

/* ---- 27. SUMMARY ---- */
S.push({chap:'Summary', title:'The Full Picture', sub:'From raw text to a fast, aligned, well-understood, well-behaved model', accent:COLORS.gray,
panel:`
<div class="p-lead">Zoom back out. Every technique we covered answers one question: <i>how do we get a useful, safe, efficient language model from raw text?</i></div>
<ul class="p-bullets">
<li><b>Represent</b> text efficiently — Tokenization, BPE, SentencePiece</li>
<li><b>Absorb</b> world knowledge — Pretraining (next-token prediction)</li>
<li><b>Shape behavior</b> — Instruction Tuning (SFT)</li>
<li><b>Align to preferences</b> — RLHF (Reward Model + PPO), or DPO directly</li>
<li><b>Adapt cheaply</b> — PEFT, LoRA, QLoRA</li>
<li><b>Run efficiently</b> — Quantization, Knowledge Distillation, Mixture of Experts</li>
<li><b>Understand internals</b> — Embeddings, Positional Encoding, Attention, Transformer blocks</li>
<li><b>Decode & prompt</b> — Sampling strategies, In-Context Learning, Chain-of-Thought, RAG</li>
<li><b>Scale the system</b> — Scaling Laws, KV Cache, FlashAttention, Distributed Training</li>
<li><b>Vary the architecture</b> — GQA, ALiBi, Sliding Window Attention, State Space Models</li>
<li><b>Train stably</b> — Data curation & mixture, LR schedules, gradient clipping, AdamW</li>
<li><b>Evaluate honestly</b> — Perplexity, Elo preference ranking, self-consistency, calibration</li>
<li><b>Act safely</b> — Function calling, agent loops, injection defense, guardrails, watermarking</li>
</ul>
<div class="formula-box"><div class="flabel">The throughline</div>
<div class="feq">data + compute + the right objective at each stage → capability</div>
<div class="fnote">No single trick does everything — capability is the sum of well-chosen objectives applied in the right order.</div></div>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,28);
  const cx=W/2, cy=H*0.52;
  const items=[
    {l:'Tokenize',c:COLORS.teal},{l:'Attention',c:COLORS.blue},{l:'Pretrain',c:COLORS.blue},{l:'SFT',c:COLORS.purple},
    {l:'RLHF/DPO',c:COLORS.rose},{l:'PEFT/LoRA',c:COLORS.green},{l:'Decode/\nPrompt',c:COLORS.amber},
    {l:'Quantize/\nDistill/MoE',c:COLORS.amber},{l:'Scale\nSystems',c:COLORS.gray},
    {l:'Architecture\nVariants',c:COLORS.purple},{l:'Train\nStability',c:COLORS.blue},
    {l:'Evaluation',c:COLORS.teal},{l:'Agents &\nSafety',c:COLORS.rose}
  ];
  const R=Math.min(W,H)*0.34;
  items.forEach((it,i)=>{
    const ang=-Math.PI/2 + i*(2*Math.PI/items.length);
    const appear=ease(clamp((t-i*0.2)/0.5,0,1));
    if(appear<=0)return;
    const x=cx+Math.cos(ang)*R*appear, y=cy+Math.sin(ang)*R*appear;
    tokenBubble(ctx,x,y,it.l.replace('\n',' '),it.c,appear,1);
    const lineA=ease(clamp((t-i*0.2-0.2)/0.4,0,1));
    line(ctx,cx,cy,x,y,{color:it.c,alpha:0.15*lineA});
  });
  const e=ease(clamp((t-1.8)/0.6,0,1));
  if(e>0){
    ctx.beginPath();ctx.arc(cx,cy,8,0,7);ctx.fillStyle='#ddd';ctx.globalAlpha=e;ctx.fill();ctx.globalAlpha=1;
    txt(ctx,'LLM',cx,cy+26,{size:12,color:'#ddd',weight:700,alpha:e});
  }
}});

/* ============================= ENGINE ============================= */
let cur=0;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let dpr=Math.max(1,window.devicePixelRatio||1);
let slideStart=performance.now();

function resize(){
  const wrap=document.getElementById('canvasWrap');
  const w=wrap.clientWidth, h=wrap.clientHeight;
  cv.width=w*dpr; cv.height=h*dpr;
  cv.style.width=w+'px'; cv.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);

function renderPanel(){
  const s=S[cur];
  document.getElementById('chapLbl').textContent=s.chap;
  document.getElementById('titleLbl').textContent=s.title;
  document.getElementById('subLbl').textContent=s.sub;
  document.getElementById('panel').innerHTML=s.panel;
  document.documentElement.style.setProperty('--accent-unused','');
  // set accent color for accordions/bullets dynamically
  const styleTag=document.getElementById('accentStyle')||(()=>{const t=document.createElement('style');t.id='accentStyle';document.head.appendChild(t);return t;})();
  styleTag.textContent=`.p-bullets li::before{color:${s.accent};} details.why summary{color:${s.accent};} .formula-box{border-left-color:${s.accent};}`;
  document.getElementById('panel').scrollTop=0;
}
function renderDots(){
  const dotsEl=document.getElementById('dots');
  dotsEl.innerHTML='';
  S.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===cur?' active':(i<cur?' done':''));
    d.title=s.title;
    d.addEventListener('click',()=>goTo(i));
    dotsEl.appendChild(d);
  });
  document.getElementById('pos').textContent=(cur+1)+' / '+S.length;
  document.getElementById('prevBtn').disabled = cur===0;
  document.getElementById('nextBtn').disabled = cur===S.length-1;
}
function goTo(i){
  if(i<0||i>=S.length||i===cur)return;
  cur=i;
  slideStart=performance.now();
  renderPanel();
  renderDots();
}
document.getElementById('prevBtn').addEventListener('click',()=>goTo(cur-1));
document.getElementById('nextBtn').addEventListener('click',()=>goTo(cur+1));
window.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight'||e.key===' ')goTo(cur+1);
  else if(e.key==='ArrowLeft')goTo(cur-1);
});
let touchX=null;
cv.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;});
cv.addEventListener('touchend',e=>{
  if(touchX===null)return;
  const dx=e.changedTouches[0].clientX-touchX;
  if(dx<-40)goTo(cur+1); else if(dx>40)goTo(cur-1);
  touchX=null;
});

function loop(now){
  const t=(now-slideStart)/1000;
  const wrap=document.getElementById('canvasWrap');
  const W=wrap.clientWidth, H=wrap.clientHeight;
  try{ S[cur].draw(ctx,W,H,t); }catch(err){ /* fail-safe: don't crash the loop */ }
  requestAnimationFrame(loop);
}

resize();
renderPanel();
renderDots();
requestAnimationFrame(loop);
</script>
</body>
</html>
