    txt(ctx,(probs[i]*100).toFixed(0)+'%',bx+i*cw+cw/2-8,by+bh-h-12,{size:10.5,color:COLORS.purple,alpha:a});
  });
  const e2=ease(clamp((t-2.0)/0.5,0,1));
  if(e2>0)txt(ctx,'watch the bars flatten as T rises',cx,H*0.86,{size:11,color:'#888',alpha:e2});
}});

/* ---- 25. MoE ---- */
S.push({chap:'6 · Efficiency', title:'Mixture of Experts (MoE)', sub:'A model that only wakes up the parts it needs', accent:COLORS.blue,
panel:`
<div class="p-lead">A dense model uses every parameter for every token — wasteful, since not all knowledge is relevant to every input. MoE replaces one big feed-forward layer with <b>many smaller "expert" networks</b> plus a lightweight router that picks just a few experts per token.</div>
<ul class="p-bullets">
<li>A <b>gating network</b> looks at each token and scores every expert.</li>
<li>Only the <b>top-k</b> highest-scoring experts (often k=1 or 2) actually process that token.</li>
<li>Result: a model can have huge total parameter count, but each token only touches a small, cheap subset of it (sparse compute).</li>
</ul>
<div class="formula-box"><div class="flabel">Routing</div>
<div class="feq">g = softmax(W<sub>gate</sub>·x),&nbsp;&nbsp; output = Σ<sub>i∈top-k</sub> g<sub>i</sub>·Expert<sub>i</sub>(x)</div>
<div class="fnote">Only the selected top-k experts are computed and weighted by their gate score; the rest are skipped entirely.</div></div>
<details class="why"><summary>Why route instead of using one big shared network?</summary><div class="why-body">
<h4>Reasoning</h4><p>Different experts can specialize (e.g. one on code syntax, another on multilingual grammar), and since only a few activate per token, you get the representational capacity of a much larger dense model while paying the compute cost of a much smaller one — capacity and compute are decoupled.</p>
<h4>Real world</h4><p>This is the architecture behind models like Mixtral and GPT-4-class systems — enormous total parameter counts with inference costs closer to a fraction of that size, because routing keeps most experts idle on any given token.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,26);
  const cx=W/2;
  const e=ease(clamp(t/0.5,0,1));
  const tokX=cx, tokY=H*0.16;
  tokenBubble(ctx,tokX,tokY,'token: "photosynthesis"',COLORS.blue,e,1);
  // gating network box
  const e2=ease(clamp((t-0.5)/0.5,0,1));
  const gy=H*0.34;
  box(ctx,cx-70,gy-16,140,32,{fill:'#141420',stroke:COLORS.amber,alpha:e2,r:6});
  txt(ctx,'gating network',cx,gy,{size:11,color:COLORS.amber,alpha:e2});
  arrow(ctx,tokX,tokY+16,cx,gy-16,{color:COLORS.blue,progress:ease(clamp((t-0.5)/0.4,0,1))});
  // experts row
  const experts=['Expert 1\n(biology)','Expert 2\n(math)','Expert 3\n(code)','Expert 4\n(chit-chat)','Expert 5\n(history)'];
  const scores=[0.62,0.05,0.03,0.02,0.28];
  const n=experts.length;
  const exY=H*0.62, gap=W*0.78/n, startX=cx-(gap*(n-1))/2;
  experts.forEach((ex,i)=>{
    const a=ease(clamp((t-1.1-i*0.15)/0.5,0,1));
    if(a<=0)return;
    const x=startX+i*gap;
    const active = scores[i]>0.2;
    box(ctx,x-48,exY-26,96,52,{fill:active?COLORS.green+'22':'#141420',stroke:active?COLORS.green:'#3a3a45',alpha:a,r:6,lw:active?2:1});
    ex.split('\n').forEach((ln,li)=>txt(ctx,ln,x,exY+(li-0.5)*13,{size:9.5,color:active?COLORS.green:'#666',alpha:a}));
    const routeA=ease(clamp((t-1.1-i*0.15-0.3)/0.4,0,1));
    if(active)arrow(ctx,cx,gy+16,x,exY-26,{color:COLORS.green,progress:routeA,alpha:0.6});
    else line(ctx,cx,gy+16,x,exY-26,{color:'#2a2a33',alpha:0.25*routeA});
    const scoreA=ease(clamp((t-2.0-i*0.1)/0.4,0,1));
    txt(ctx,'g='+scores[i].toFixed(2),x,exY+34,{size:9,color:active?COLORS.green:'#555',alpha:scoreA});
  });
  const e3=ease(clamp((t-2.8)/0.5,0,1));
  if(e3>0)txt(ctx,'only top-2 experts (green) compute — rest are skipped',cx,H*0.88,{size:11,color:'#888',alpha:e3});
}});

/* ---- 26. MoE math ---- */
S.push({chap:'6 · Efficiency', title:'MoE: The Load-Balancing Problem', sub:"Why routing alone isn't enough", accent:COLORS.blue,
panel:`
<div class="p-lead">Left unchecked, a gating network often collapses to always picking the same one or two "favorite" experts — they get all the training signal and become good, while the rest stay undertrained and useless. An auxiliary loss term nudges the router to spread load evenly.</div>
<ul class="p-bullets">
<li>Without balancing: a few experts do all the work, most sit idle and undertrained.</li>
<li>With balancing: an extra loss term penalizes uneven expert usage across a batch.</li>
<li>The goal: keep the benefit of specialization while ensuring every expert gets trained.</li>
</ul>
<div class="formula-box"><div class="flabel">Load-balancing auxiliary loss</div>
<div class="feq">L<sub>aux</sub> = N · Σ<sub>i</sub> f<sub>i</sub>·P<sub>i</sub></div>
<div class="fnote">N = number of experts, f_i = fraction of tokens routed to expert i, P_i = average gate probability for expert i. Minimized when usage is uniform.</div></div>
<details class="why"><summary>Why does an uneven distribution hurt the model?</summary><div class="why-body">
<h4>Reasoning</h4><p>Gradient-based training is a rich-get-richer process: an expert that's picked more often gets more gradient updates and becomes better, making the router even more likely to pick it again — without correction this spirals into using only a tiny fraction of the model's total capacity.</p>
<h4>Real world</h4><p>Every production MoE system (Mixtral, GShard, Switch Transformer) includes some form of this auxiliary loss — it's a small addition to the training objective that's essential for MoE to deliver its promised efficiency gains.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,27);
  const cx=W/2;
  const n=5;
  const labels=['E1','E2','E3','E4','E5'];
  const unbalanced=[0.65,0.05,0.05,0.20,0.05];
  const balanced=[0.22,0.18,0.21,0.19,0.20];
  const bx0=W*0.16, bw=W*0.68, byTop=H*0.28, byBot=H*0.62, bh=H*0.28;
  txt(ctx,'without load balancing',cx,byTop-16,{size:11.5,color:COLORS.rose,alpha:ease(clamp(t/0.5,0,1))});
  labels.forEach((l,i)=>{
    const a=ease(clamp((t-i*0.15)/0.5,0,1));
    if(a<=0)return;
    const cw=bw/n;
    const h=unbalanced[i]*bh*1.4*a;
    box(ctx,bx0+i*cw+8,byTop+bh-h,cw-16,h,{fill:COLORS.rose+'44',stroke:COLORS.rose,r:3});
    txt(ctx,l,bx0+i*cw+cw/2-8,byTop+bh+14,{size:10,color:'#888',alpha:a});
  });
  const e2=ease(clamp((t-1.4)/0.5,0,1));
  if(e2>0)txt(ctx,'with load-balancing loss',cx,byBot-16,{size:11.5,color:COLORS.green,alpha:e2});
  labels.forEach((l,i)=>{
    const a=ease(clamp((t-1.5-i*0.15)/0.5,0,1));
    if(a<=0)return;
    const cw=bw/n;
    const h=balanced[i]*bh*1.4*a;
    box(ctx,bx0+i*cw+8,byBot+bh-h,cw-16,h,{fill:COLORS.green+'44',stroke:COLORS.green,r:3});
    txt(ctx,l,bx0+i*cw+cw/2-8,byBot+bh+14,{size:10,color:'#888',alpha:a});
  });
}});


S.push({chap:"7 \u00b7 Transformer Internals", title:"Embeddings: From ID to Meaning", sub:"Turning a token index into a point in space", accent:COLORS.teal,
panel:`
<div class="p-lead">A token is just an integer ID — meaningless on its own. The embedding layer is a lookup table that maps each ID to a learned vector of hundreds of numbers. Nearby vectors end up representing related concepts.</div>
<ul class="p-bullets">
<li>Embedding table size: vocabulary size × embedding dimension (e.g. 50,000 × 4096)</li>
<li>These vectors are learned end-to-end — no one hand-designs what each dimension means</li>
<li>Similar words drift toward similar vectors purely because they're used in similar contexts</li>
</ul>
<div class="formula-box"><div class="flabel">Lookup</div>
<div class="feq">e<sub>token</sub> = EmbeddingTable[token_id]  ∈ ℝ<sup>d</sup></div>
<div class="fnote">d is typically 768–12,288 depending on model size — this vector is what the transformer actually computes on.</div></div>
<details class="why"><summary>Why not just use the raw token ID as a number?</summary><div class="why-body">
<h4>Reasoning</h4><p>ID 47 vs ID 48 being adjacent integers implies nothing about meaning — a learned vector space lets the model place "cat" and "dog" close together and "cat" and "car" far apart, purely based on how they're used in training data.</p>
<h4>Real world</h4><p>This is why word/token embeddings can be used for tasks like semantic search or clustering — the geometry itself encodes meaning.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,29);
  const cx=W/2;
  const e=ease(clamp(t/0.6,0,1));
  tokenBubble(ctx,W*0.2,H*0.18,'"cat"',COLORS.teal,e,1);
  const gx=W*0.2, gy=H*0.36, gw=W*0.4, gh=H*0.18;
  const e2=ease(clamp((t-0.5)/0.5,0,1));
  box(ctx,gx-gw/2,gy-gh/2,gw,gh,{fill:'#141420',stroke:'#444',alpha:e2,r:6});
  txt(ctx,'embedding table (50,000 × d)',gx,gy-gh/2-12,{size:10,color:'#777',alpha:e2});
  arrow(ctx,W*0.2,H*0.18+16,gx,gy-gh/2,{color:COLORS.teal,progress:ease(clamp((t-0.5)/0.4,0,1))});
  const e3=ease(clamp((t-1.1)/0.4,0,1));
  if(e3>0){ box(ctx,gx-gw/2+6,gy-4,gw-12,10,{fill:COLORS.teal+'55',stroke:COLORS.teal,r:2,alpha:e3}); }
  const e4=ease(clamp((t-1.6)/0.6,0,1));
  if(e4>0){
    const vx=W*0.2, vy=H*0.58, n=12;
    const vals=[0.8,-0.3,0.5,0.9,-0.6,0.2,0.4,-0.8,0.1,0.7,-0.2,0.6];
    txt(ctx,'e_"cat"  (d dimensions)',vx,vy-28,{size:10.5,color:COLORS.teal,alpha:e4});
    vals.forEach((v,i)=>{
      const bw=14; const x=vx-(n*bw)/2+i*bw; const h=Math.abs(v)*30*e4;
      box(ctx,x,v>0?vy-h:vy,bw-3,h,{fill:v>0?COLORS.teal+'77':COLORS.rose+'77',stroke:v>0?COLORS.teal:COLORS.rose,r:2});
    });
    line(ctx,vx-(n*14)/2,vy,vx+(n*14)/2,vy,{color:'#333',alpha:e4});
  }
  const e5=ease(clamp((t-2.4)/0.6,0,1));
  if(e5>0){
    const sx=W*0.72, sy=H*0.66, R=Math.min(W,H)*0.18;
    box(ctx,sx-R,sy-R,2*R,2*R,{fill:'#101018',stroke:'#333',r:8,alpha:e5});
    const pts=[{l:'cat',x:0.4,y:0.4,c:COLORS.teal},{l:'dog',x:0.5,y:0.3,c:COLORS.teal},{l:'car',x:-0.6,y:-0.5,c:COLORS.amber}];
    pts.forEach(p=>{
      const px=sx+p.x*R*0.8, py=sy+p.y*R*0.8;
      ctx.beginPath();ctx.arc(px,py,4,0,7);ctx.fillStyle=p.c;ctx.globalAlpha=e5;ctx.fill();ctx.globalAlpha=1;
      txt(ctx,p.l,px,py-14,{size:10,color:p.c,alpha:e5});
    });
    txt(ctx,'embedding space',sx,sy-R-12,{size:10,color:'#777',alpha:e5});
  }
}});


S.push({chap:"7 \u00b7 Transformer Internals", title:"Positional Encoding", sub:"Attention alone has no sense of sequence", accent:COLORS.teal,
panel:`
<div class="p-lead">Self-attention treats input as an unordered set — swap two tokens and, without help, attention computes the same thing. Positional encoding injects order by adding a unique pattern to each position's embedding.</div>
<ul class="p-bullets">
<li>Sinusoidal encoding (original Transformer): fixed sine/cosine waves at different frequencies per dimension</li>
<li>RoPE (used in LLaMA/GPT-NeoX-style models): rotates query/key vectors by an angle proportional to position</li>
<li>Either way, the same token now looks different depending on where it sits in the sequence</li>
</ul>
<div class="formula-box"><div class="flabel">Sinusoidal formula</div>
<div class="feq">PE(pos,2i) = sin(pos / 10000<sup>2i/d</sup>)</div>
<div class="fnote">Each dimension oscillates at a different frequency, giving every position a unique fingerprint pattern.</div></div>
<details class="why"><summary>Why sine/cosine instead of raw position numbers?</summary><div class="why-body">
<h4>Reasoning</h4><p>Raw integers grow unbounded and would dominate the embedding at long sequence lengths. Trigonometric functions also let PE(pos+k) be expressed as a linear function of PE(pos), giving the model an easy way to learn relative, not just absolute, positions.</p>
<h4>Real world</h4><p>RoPE's rotation-based relative positioning is a major reason modern models can be extended to much longer context windows than they were originally trained on.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,30);
  const cx=W/2;
  txt(ctx,'same token embedding, 4 different positions',cx,H*0.14,{size:12.5,color:'#ccc',alpha:ease(clamp(t/0.6,0,1))});
  const n=4;
  const gap=W*0.72/n, startX=cx-(gap*(n-1))/2;
  for(let i=0;i<n;i++){
    const appear=ease(clamp((t-i*0.4)/0.6,0,1));
    if(appear<=0)continue;
    const x=startX+i*gap, y=H*0.4;
    ctx.beginPath();
    for(let px=-40;px<=40;px+=2){
      const freq=0.15+i*0.1;
      const yy=y+Math.sin((px+t*20)*freq)*14*(i+1)/n;
      if(px===-40)ctx.moveTo(x+px,yy);else ctx.lineTo(x+px,yy);
    }
    ctx.strokeStyle=COLORS.teal;ctx.globalAlpha=appear*0.8;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;
    txt(ctx,'pos '+i,x,y+40,{size:10.5,color:COLORS.teal,alpha:appear});
  }
  const e2=ease(clamp((t-2.0)/0.6,0,1));
  if(e2>0)txt(ctx,'each position gets a unique added pattern',cx,H*0.72,{size:11.5,color:'#888',alpha:e2});
}});


S.push({chap:"7 \u00b7 Transformer Internals", title:"Self-Attention: Who Should I Listen To?", sub:"Every token looks at every other token", accent:COLORS.blue,
panel:`
<div class="p-lead">For each token, self-attention asks: which other tokens in this sequence are relevant to understanding me? It computes a weighted blend of all other tokens' information, where the weights reflect relevance.</div>
<ul class="p-bullets">
<li>Each token produces a Query (what am I looking for), a Key (what do I offer), and a Value (my actual content)</li>
<li>Relevance = similarity between one token's Query and another's Key</li>
<li>The final representation is a weighted sum of Values, weighted by these relevance scores</li>
</ul>
<div class="formula-box"><div class="flabel">Relevance score</div>
<div class="feq">relevance(i,j) = Query<sub>i</sub> · Key<sub>j</sub></div>
<div class="fnote">High dot product = high relevance = more attention weight.</div></div>
<details class="why"><summary>Why compare Query and Key instead of raw token vectors?</summary><div class="why-body">
<h4>Reasoning</h4><p>Splitting into Query/Key/Value lets the model learn separate transformations for "what I'm looking for" vs "what I contain" vs "what I contribute" — far more flexible than comparing raw content directly.</p>
<h4>Real world</h4><p>This split is why attention can learn distinct relationships like subject-verb agreement or pronoun resolution ("it" attending strongly to the noun it refers to).</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,31);
  const seq=['The','trophy','didn\u2019t','fit','because','it'];
  const cx=W/2, y=H*0.3;
  const gap=Math.min(80,(W*0.86)/seq.length);
  const startX=cx-(gap*(seq.length-1))/2;
  const queryIdx=seq.length-1;
  seq.forEach((tk,i)=>{
    const appear=ease(clamp((t-i*0.15)/0.4,0,1));
    if(appear<=0)return;
    const x=startX+i*gap;
    tokenBubble(ctx,x,y,tk,i===queryIdx?COLORS.rose:COLORS.blue,appear,i===queryIdx?1.1:1);
  });
  const weights=[0.05,0.55,0.05,0.05,0.05,0.25];
  const e2=ease(clamp((t-1.2)/0.8,0,1));
  if(e2>0){
    const qx=startX+queryIdx*gap;
    seq.forEach((tk,i)=>{
      if(i===queryIdx)return;
      const x=startX+i*gap;
      line(ctx,x,y+18,qx,y+18,{color:COLORS.rose,alpha:weights[i]*1.4*e2,lw:1+weights[i]*4});
    });
    txt(ctx,'"it" attends most strongly to "trophy"',cx,H*0.55,{size:11.5,color:COLORS.rose,alpha:e2,weight:600});
  }
}});


S.push({chap:"7 \u00b7 Transformer Internals", title:"The Scaled Dot-Product Formula", sub:"Why divide by \u221ad_k?", accent:COLORS.blue,
panel:`
<div class="p-lead">The full self-attention formula packages query-key comparison, normalization, and value blending into one compact expression.</div>
<ul class="p-bullets">
<li>QK<sup>T</sup> computes every pairwise relevance score at once (matrix multiply)</li>
<li>Divide by √d<sub>k</sub> to keep the scores in a reasonable range before softmax</li>
<li>softmax turns the scores into weights that sum to 1; multiply by V to get the blended output</li>
</ul>
<div class="formula-box"><div class="flabel">Full formula</div>
<div class="feq">Attention(Q,K,V) = softmax(QK<sup>T</sup> / √d<sub>k</sub>) · V</div>
<div class="fnote">d_k = dimension of the key vectors; without this scaling, softmax gradients vanish for large d_k.</div></div>
<details class="why"><summary>Why does d_k make scores too large?</summary><div class="why-body">
<h4>Reasoning</h4><p>A dot product of two random d_k-dimensional vectors has variance proportional to d_k — as dimension grows, raw scores grow too, pushing softmax into a near one-hot, saturated regime where gradients are nearly zero. Dividing by √d_k keeps variance roughly constant regardless of dimension.</p>
<h4>Real world</h4><p>This one-line scaling factor is why "Scaled" in "Scaled Dot-Product Attention" isn't cosmetic — omitting it makes transformer training unstable at scale.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,32);
  const cx=W/2;
  const n=5;
  const gx=W*0.28, gy=H*0.42, cell=34;
  const raw=[[8,2,1,0,3],[1,9,2,1,0],[0,2,7,1,1],[2,0,1,6,2],[1,1,2,3,8]];
  const e=ease(clamp(t/0.8,0,1));
  txt(ctx,'QK\u1d40 (raw scores)',gx,gy-n*cell/2-16,{size:11,color:'#888',alpha:e});
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const a=ease(clamp((t-(r*n+c)*0.03)/0.4,0,1));
    if(a<=0)continue;
    const v=raw[r][c]/9;
    box(ctx,gx-n*cell/2+c*cell,gy-n*cell/2+r*cell,cell-2,cell-2,{fill:'rgba(99,179,237,'+(v*0.7*a)+')',stroke:'#333',r:2});
  }
  const e2=ease(clamp((t-1.4)/0.6,0,1));
  if(e2>0) txt(ctx,'÷ √d_k',gx+n*cell/2+50,gy,{size:14,color:COLORS.amber,alpha:e2,weight:700});
  const e3=ease(clamp((t-2.0)/0.6,0,1));
  if(e3>0){
    const sx=W*0.78;
    txt(ctx,'softmax → weights sum to 1',sx,gy-n*cell/2-16,{size:10.5,color:COLORS.green,alpha:e3,align:'center'});
    const heights=[0.05,0.6,0.1,0.05,0.2];
    for(let c=0;c<n;c++){
      const a=ease(clamp((t-2.2-c*0.08)/0.4,0,1));
      const h=heights[c]*cell*n*0.9*a;
      box(ctx,sx-n*cell/2+c*cell,gy+n*cell/2-h,cell-4,h,{fill:COLORS.green+'66',stroke:COLORS.green,r:2});
    }
  }
  const e4=ease(clamp((t-2.9)/0.5,0,1));
  if(e4>0)txt(ctx,'these weights blend the Value vectors',cx,H*0.88,{size:11.5,color:'#888',alpha:e4});
}});


S.push({chap:"7 \u00b7 Transformer Internals", title:"Multi-Head Attention", sub:"Different heads learn different relationships", accent:COLORS.purple,
panel:`
<div class="p-lead">A single attention computation averages every kind of relationship into one set of weights. Multi-head attention runs several smaller attention computations in parallel, each free to specialize.</div>
<ul class="p-bullets">
<li>Split Q, K, V into h smaller chunks (heads), each of dimension d_k = d/h</li>
<li>Each head computes its own attention pattern — one might track syntax, another long-range coreference</li>
<li>Concatenate all heads' outputs and project back to dimension d</li>
</ul>
<div class="formula-box"><div class="flabel">Combining heads</div>
<div class="feq">MultiHead(Q,K,V) = Concat(head<sub>1</sub>, …, head<sub>h</sub>) · W<sup>O</sup></div>
<div class="fnote">h is typically 8–128 depending on model size — more heads means more parallel "perspectives" at the same total compute.</div></div>
<details class="why"><summary>Why not just use one big attention head?</summary><div class="why-body">
<h4>Reasoning</h4><p>A single attention pattern can only express one weighting scheme per token, but language has many simultaneous relevant relationships (grammar, reference, topic) that one softmax distribution can't represent well at once — splitting into subspaces lets each head specialize.</p>
<h4>Real world</h4><p>Visualizing attention heads in trained models shows some heads consistently track syntax and others track coreference — this specialization emerges purely from training, never explicitly programmed.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,33);
  const cx=W/2;
  const e=ease(clamp(t/0.5,0,1));
  txt(ctx,'input',cx,H*0.1,{size:11,color:'#888',alpha:e});
  const heads=[{c:COLORS.teal,l:'head 1\nsyntax'},{c:COLORS.amber,l:'head 2\nreference'},{c:COLORS.blue,l:'head 3\ntopic'},{c:COLORS.purple,l:'head 4\nposition'}];
  const gap=W*0.7/heads.length, startX=cx-(gap*(heads.length-1))/2;
  heads.forEach((h,i)=>{
    const appear=ease(clamp((t-0.4-i*0.25)/0.5,0,1));
    if(appear<=0)return;
    const x=startX+i*gap, y=H*0.36;
    box(ctx,x-46,y-26,92,52,{fill:h.c+'18',stroke:h.c,alpha:appear,r:6});
    h.l.split('\n').forEach((ln,li)=>txt(ctx,ln,x,y+(li-0.5)*13,{size:10,color:h.c,alpha:appear}));
    arrow(ctx,cx,H*0.14,x,y-26,{color:h.c,progress:ease(clamp((t-0.4-i*0.25)/0.4,0,1)),alpha:0.5});
  });
  const e2=ease(clamp((t-1.8)/0.6,0,1));
  if(e2>0){
    const cyy=H*0.68;
    box(ctx,cx-90,cyy-18,180,36,{fill:'#141420',stroke:'#888',alpha:e2,r:6});
    txt(ctx,'concat + linear projection',cx,cyy,{size:11,color:'#ccc',alpha:e2});
    heads.forEach((h,i)=>{
      const x=startX+i*gap;
      arrow(ctx,x,H*0.36+26,cx,cyy-18,{color:h.c,progress:e2,alpha:0.5});
    });
    const e3=ease(clamp((t-2.4)/0.5,0,1));
    if(e3>0) txt(ctx,'output (dimension d, same as input)',cx,cyy+40,{size:10.5,color:'#888',alpha:e3});
  }
}});


S.push({chap:"7 \u00b7 Transformer Internals", title:"Anatomy of a Transformer Block", sub:"Residuals and normalization make deep stacking possible", accent:COLORS.green,
panel:`
<div class="p-lead">A transformer isn't just attention — dozens of identical "blocks" are stacked, each combining attention with a feed-forward network, wrapped in residual connections and normalization that keep training stable even at extreme depth.</div>
<ul class="p-bullets">
<li>Residual connection: add the block's input back to its output so gradients have a direct path backward</li>
<li>LayerNorm: rescales activations to a stable range after each sublayer</li>
<li>Feed-forward network: a small per-token MLP that adds nonlinear processing capacity</li>
</ul>
<div class="formula-box"><div class="flabel">One block</div>
<div class="feq">x' = LayerNorm(x + Attention(x))<br>output = LayerNorm(x' + FFN(x'))</div>
<div class="fnote">This pattern (sublayer → residual add → normalize) repeats for both attention and feed-forward sublayers, in every block.</div></div>
<details class="why"><summary>Why are residual connections necessary for very deep networks?</summary><div class="why-body">
<h4>Reasoning</h4><p>Without a direct path, gradients have to pass through dozens of nonlinear transformations during backpropagation and tend to shrink toward zero — a residual connection guarantees gradients can flow straight through by addition, letting networks with 96+ layers train at all.</p>
<h4>Real world</h4><p>This design (borrowed from ResNets in computer vision) is a big part of why transformer depth could scale from a handful of layers to nearly 100, unlocking much greater model capacity.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,34);
  const cx=W*0.5;
  const stages=[{l:'input x',y:0.08,c:'#888'},{l:'Self-Attention',y:0.24,c:COLORS.blue},{l:'Add + Norm',y:0.40,c:'#888'},{l:'Feed-Forward',y:0.58,c:COLORS.green},{l:'Add + Norm',y:0.74,c:'#888'},{l:'output',y:0.90,c:'#888'}];
  stages.forEach((s,i)=>{
    const appear=ease(clamp((t-i*0.35)/0.5,0,1));
    if(appear<=0)return;
    const y=H*s.y;
    box(ctx,cx-110,y-16,220,32,{fill:'#141420',stroke:s.c,alpha:appear,r:6});
    txt(ctx,s.l,cx,y,{size:11.5,color:s.c,alpha:appear,weight:600});
    if(i>0){
      const ap=ease(clamp((t-i*0.35-0.15)/0.3,0,1));
      arrow(ctx,cx,H*stages[i-1].y+16,cx,y-16,{color:'#444',progress:ap});
    }
  });
  const e1=ease(clamp((t-1.9)/0.5,0,1));
  if(e1>0){
    ctx.save();ctx.strokeStyle=COLORS.blue;ctx.globalAlpha=0.6*e1;ctx.lineWidth=1.3;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(cx-114,H*0.08+10);ctx.bezierCurveTo(cx-170,H*0.2,cx-170,H*0.36,cx-114,H*0.40);ctx.stroke();
    ctx.restore();ctx.setLineDash([]);
    txt(ctx,'residual',cx-176,H*0.24,{size:9,color:COLORS.blue,alpha:e1});
  }
  const e2=ease(clamp((t-2.9)/0.5,0,1));
  if(e2>0){
    ctx.save();ctx.strokeStyle=COLORS.green;ctx.globalAlpha=0.6*e2;ctx.lineWidth=1.3;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(cx-114,H*0.40+10);ctx.bezierCurveTo(cx-170,H*0.54,cx-170,H*0.70,cx-114,H*0.74);ctx.stroke();
    ctx.restore();ctx.setLineDash([]);
    txt(ctx,'residual',cx-176,H*0.57,{size:9,color:COLORS.green,alpha:e2});
  }
}});

S.push({chap:"8 \u00b7 Decoding & Prompting", title:"Decoding: How the Model Actually Writes", sub:"Greedy, sampling, top-k, top-p", accent:COLORS.amber,
panel:`
<div class="p-lead">The model outputs a probability distribution over the next token — but how do we pick one word at a time to actually generate text? Different decoding strategies trade determinism for creativity.</div>
<ul class="p-bullets">
<li>Greedy: always pick the single highest-probability token — deterministic but repetitive</li>
<li>Temperature sampling: sample randomly, sharpened or flattened by temperature</li>
<li>Top-k: only sample from the k most likely tokens</li>
<li>Top-p (nucleus): sample from the smallest set of tokens whose probabilities sum past p (e.g. 0.9)</li>
</ul>
<div class="formula-box"><div class="flabel">Nucleus set</div>
<div class="feq">S = smallest set such that Σ<sub>token∈S</sub> P(token) ≥ p</div>
<div class="fnote">Top-p adapts the candidate pool size per step — few options when confident, many when uncertain.</div></div>
<details class="why"><summary>Why not just always take the most likely token?</summary><div class="why-body">
<h4>Reasoning</h4><p>Greedy decoding is myopic — it can lock the model into bland, repetitive completions and can't recover from an early suboptimal choice. Controlled randomness with a sensible candidate pool produces more natural text while avoiding the low-probability, nonsensical tail.</p>
<h4>Real world</h4><p>Nearly every production chat model uses top-p (often with temperature) rather than greedy decoding, precisely because greedy text reads as stilted and repetitive.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,35);
  const cands=[{w:'the',p:0.45},{w:'a',p:0.25},{w:'this',p:0.12},{w:'my',p:0.08},{w:'that',p:0.06},{w:'some',p:0.04}];
  const cx=W/2;
  const bx=W*0.16,by=H*0.32,bw=W*0.68,bh=H*0.34;
  cands.forEach((c,i)=>{
    const a=ease(clamp((t-i*0.15)/0.4,0,1));
    if(a<=0)return;
    const cw=bw/cands.length;
    const h=c.p*bh*2.1*a;
    let cum=0; for(let k=0;k<=i;k++)cum+=cands[k].p;
    const inTopP = cum<=0.92;
    box(ctx,bx+i*cw+6,by+bh-h,cw-12,h,{fill:inTopP?COLORS.amber+'55':'#22222c',stroke:inTopP?COLORS.amber:'#444',r:3});
    txt(ctx,c.w,bx+i*cw+cw/2-6,by+bh+14,{size:10,color:inTopP?COLORS.amber:'#666',alpha:a});
  });
  const e2=ease(clamp((t-1.3)/0.5,0,1));
  if(e2>0)txt(ctx,'greedy picks only "the"',cx,H*0.18,{size:11,color:'#888',alpha:e2});
  const e3=ease(clamp((t-1.9)/0.5,0,1));
  if(e3>0)txt(ctx,'top-p (0.9) samples from the highlighted set',cx,H*0.85,{size:11.5,color:COLORS.amber,weight:600,alpha:e3});
}});


S.push({chap:"8 \u00b7 Decoding & Prompting", title:"Nucleus Sampling: The Cumulative Cutoff", sub:"Where exactly does the candidate pool stop?", accent:COLORS.amber,
panel:`
<div class="p-lead">Top-p works by sorting tokens from most to least likely, then walking down the list adding tokens until their cumulative probability crosses the threshold p. Everything after that point is discarded before sampling.</div>
<ul class="p-bullets">
<li>Sort all candidate tokens by probability, descending</li>
<li>Accumulate probability mass until the running total ≥ p</li>
<li>Renormalize the remaining probabilities and sample from just that set</li>
</ul>
<div class="formula-box"><div class="flabel">Cutoff rule</div>
<div class="feq">S = argmin<sub>k</sub> such that Σ<sub>i=1..k</sub> P(token<sub>i</sub>) ≥ p</div>
<div class="fnote">p is usually 0.9–0.95 in practice — smaller p is safer and more focused, larger p is more diverse.</div></div>
<details class="why"><summary>Why not fix k (top-k) instead of a probability threshold?</summary><div class="why-body">
<h4>Reasoning</h4><p>A fixed k works fine when the model is uncertain but wastes candidates when confident. A probability-mass threshold automatically shrinks the pool when the model is sure and grows it when unsure, matching the model's actual confidence at each step.</p>
<h4>Real world</h4><p>This adaptivity is why top-p became the more common default over top-k in most modern generation APIs.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,36);
  const cands=[0.45,0.25,0.12,0.08,0.06,0.04];
  const cx0=W*0.16, cy0=H*0.78, plotW=W*0.7, plotH=H*0.52;
  line(ctx,cx0,cy0,cx0+plotW,cy0,{color:'#333'});
  line(ctx,cx0,cy0,cx0,cy0-plotH,{color:'#333'});
  txt(ctx,'tokens (sorted by probability)',cx0+plotW/2,cy0+22,{size:10.5,color:'#777'});
  ctx.save();ctx.translate(cx0-24,cy0-plotH/2);ctx.rotate(-Math.PI/2);txt(ctx,'cumulative probability',0,0,{size:10.5,color:'#777'});ctx.restore();
  const e0=ease(clamp(t/0.6,0,1));
  const py=cy0-0.9*plotH;
  line(ctx,cx0,py,cx0+plotW,py,{color:COLORS.rose,dash:[4,4],alpha:0.7*e0});
  txt(ctx,'p = 0.9',cx0+plotW+6,py,{size:10,color:COLORS.rose,align:'left',alpha:e0});
  let cum=0;
  const stepW=plotW/cands.length;
  cands.forEach((p,i)=>{
    const appear=ease(clamp((t-0.6-i*0.3)/0.5,0,1));
    if(appear<=0)return;
    const prevCum=cum; cum+=p;
    const x0=cx0+i*stepW, x1=cx0+(i+1)*stepW;
    const y0=cy0-prevCum*plotH, y1=cy0-cum*plotH;
    const included = prevCum<0.9;
    line(ctx,x0,y0,x0,lerp(y0,y1,appear),{color:included?COLORS.amber:'#555',lw:2});
    line(ctx,x0,lerp(y0,y1,appear),x1,lerp(y0,y1,appear),{color:included?COLORS.amber:'#555',lw:2});
  });
}});


S.push({chap:"8 \u00b7 Decoding & Prompting", title:"In-Context Learning", sub:"Teaching without training", accent:COLORS.purple,
panel:`
<div class="p-lead">A striking capability of large pretrained models: show a few input→output examples right in the prompt, and it picks up the pattern for the new input — no gradient update, no weight change at all.</div>
<ul class="p-bullets">
<li>Zero-shot: just ask directly, no examples</li>
<li>Few-shot: include 2–5 example (input, output) pairs before the real question</li>
<li>The model isn't "learning" in the training sense — it's pattern-matching within a single forward pass</li>
</ul>
<div class="formula-box"><div class="flabel">Conditioning, not training</div>
<div class="feq">P(output | examples, new_input) — weights stay frozen</div>
<div class="fnote">No parameter update happens; the "learning" signal lives entirely in attention over the provided examples.</div></div>
<details class="why"><summary>Why does showing examples work without updating any weights?</summary><div class="why-body">
<h4>Reasoning</h4><p>During pretraining, the model has seen countless sequences with a repeating pattern structure (FAQ lists, translated pairs, tables) and implicitly learned to recognize "continue this pattern" as a task — attention over the few-shot examples effectively simulates a tiny, temporary specialization.</p>
<h4>Real world</h4><p>In-context learning is why prompting alone (with good examples) can often get a general-purpose model to perform a niche task well, without collecting data and fine-tuning.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,37);
  const cx=W/2;
  const examples=['2 + 2 = 4','3 + 3 = 6','7 + 1 = 8'];
  examples.forEach((ex,i)=>{
    const a=ease(clamp((t-i*0.5)/0.5,0,1));
    if(a<=0)return;
    box(ctx,cx-120,H*0.14+i*44-14,240,30,{fill:'#141420',stroke:COLORS.purple,alpha:a,r:5});
    txt(ctx,ex,cx,H*0.14+i*44,{size:12,color:'#ddd',alpha:a});
  });
  const e2=ease(clamp((t-1.8)/0.5,0,1));
  if(e2>0){
    box(ctx,cx-120,H*0.14+3*44-14,240,30,{fill:COLORS.amber+'18',stroke:COLORS.amber,alpha:e2,r:5});
    txt(ctx,'5 + 5 = ?',cx,H*0.14+3*44,{size:12,color:COLORS.amber,alpha:e2,weight:600});
  }
  const e3=ease(clamp((t-2.4)/0.6,0,1));
  if(e3>0){
    txt(ctx,'model output: "10"',cx,H*0.14+4*44+20,{size:14,color:COLORS.green,weight:700,alpha:e3});
    txt(ctx,'no weights changed — just pattern recognition in-context',cx,H*0.14+4*44+48,{size:10.5,color:'#888',alpha:e3});
  }
}});


S.push({chap:"8 \u00b7 Decoding & Prompting", title:"Chain-of-Thought Reasoning", sub:"Asking the model to show its work improves accuracy", accent:COLORS.blue,
panel:`
<div class="p-lead">For multi-step problems, asking the model to generate intermediate reasoning steps before the final answer measurably improves accuracy — even though the model's weights haven't changed at all.</div>
<ul class="p-bullets">
<li>Direct prompting: ask for the answer immediately, often skips necessary steps</li>
<li>Chain-of-thought: prompt with "let's think step by step", or show worked examples</li>
<li>Each generated reasoning token becomes part of the context for the next token — the model conditions on its own intermediate work</li>
</ul>
<div class="formula-box"><div class="flabel">Why it helps (informal)</div>
<div class="feq">P(correct final answer) rises when conditioned on P(correct intermediate steps)</div>
<div class="fnote">Autoregressive generation means correct steps first make the final answer token far more likely to be correct too.</div></div>
<details class="why"><summary>Why does generating more text before the answer help?</summary><div class="why-body">
<h4>Reasoning</h4><p>The model computes a bounded amount of "work" per token — a direct answer forces all reasoning to happen invisibly in one pass, but generating intermediate steps spreads reasoning across many forward passes, giving the model more computation and a self-provided scratchpad.</p>
<h4>Real world</h4><p>Chain-of-thought prompting is why asking a model to "explain step by step" often fixes wrong answers to math or logic questions that a blunt one-line prompt gets wrong.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,38);
  const cx=W/2;
  const e0=ease(clamp(t/0.6,0,1));
  txt(ctx,'"17 × 24 = ?"',cx,H*0.12,{size:13,color:'#ddd',alpha:e0});
  const dx=W*0.28;
  const e1=ease(clamp((t-0.6)/0.5,0,1));
  if(e1>0){
    txt(ctx,'direct answer',dx,H*0.26,{size:11,color:COLORS.rose,alpha:e1,weight:600});
    box(ctx,dx-60,H*0.34,120,30,{fill:'#141420',stroke:COLORS.rose,alpha:e1,r:5});
    txt(ctx,'"396"  \u2717',dx,H*0.34+15,{size:12,color:COLORS.rose,alpha:e1});
    txt(ctx,'(wrong \u2014 17\u00d724=408)',dx,H*0.44,{size:9.5,color:'#777',alpha:e1});
  }
  const cxp=W*0.72;
  const steps=['17\u00d720 = 340','17\u00d74 = 68','340+68 = 408'];
  steps.forEach((s,i)=>{
    const a=ease(clamp((t-1.2-i*0.4)/0.5,0,1));
    if(a<=0)return;
    box(ctx,cxp-75,H*0.26+i*36,150,26,{fill:COLORS.blue+'18',stroke:COLORS.blue,alpha:a,r:4});
    txt(ctx,s,cxp,H*0.26+i*36+13,{size:10.5,color:COLORS.blue,alpha:a});
  });
  const e3=ease(clamp((t-2.7)/0.5,0,1));
  if(e3>0){
    box(ctx,cxp-60,H*0.26+3*36+8,120,30,{fill:COLORS.green+'18',stroke:COLORS.green,alpha:e3,r:5});
    txt(ctx,'"408"  \u2713',cxp,H*0.26+3*36+23,{size:12,color:COLORS.green,alpha:e3,weight:700});
  }
}});


S.push({chap:"8 \u00b7 Decoding & Prompting", title:"Retrieval-Augmented Generation (RAG)", sub:"Giving the model an open book instead of a closed one", accent:COLORS.teal,
panel:`
<div class="p-lead">A model's knowledge is frozen at training time and limited to what fit in its weights. RAG sidesteps both limits: before answering, retrieve relevant documents from an external source and insert them into the prompt as context.</div>
<ul class="p-bullets">
<li>Convert the query into an embedding vector; search a vector database for similar document chunks</li>
<li>Insert the top retrieved chunks into the prompt alongside the original question</li>
<li>The model generates an answer grounded in that retrieved text, not just its frozen memory</li>
</ul>
<div class="formula-box"><div class="flabel">Retrieval step</div>
<div class="feq">chunk* = argmax<sub>chunk</sub> cosine_similarity(embed(query), embed(chunk))</div>
<div class="fnote">Cosine similarity measures how aligned two vectors are in direction — a natural fit for comparing meaning.</div></div>
<details class="why"><summary>Why not just make the model bigger and store more facts?</summary><div class="why-body">
<h4>Reasoning</h4><p>Weight-stored knowledge is expensive to update, can't cite sources, and caps out at what fit during training — an external retrieval index can be updated instantly, scaled to any size, and provides a verifiable source for claims.</p>
<h4>Real world</h4><p>RAG is the standard architecture behind most "chat with your documents" and enterprise search assistants, since it lets a general model answer accurately about private or recent data it was never trained on.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,39);
  const e=ease(clamp(t/0.5,0,1));
  tokenBubble(ctx,W*0.18,H*0.14,'query',COLORS.teal,e,1);
  const docs=[{x:0.42,y:0.3},{x:0.58,y:0.22},{x:0.5,y:0.42},{x:0.66,y:0.36},{x:0.36,y:0.4}];
  docs.forEach((d,i)=>{
    const a=ease(clamp((t-0.3-i*0.12)/0.4,0,1));
    if(a<=0)return;
    const x=W*d.x, y=H*d.y;
    const relevant = i<2;
    box(ctx,x-18,y-12,36,24,{fill:relevant?COLORS.teal+'33':'#181820',stroke:relevant?COLORS.teal:'#3a3a45',alpha:a,r:3});
  });
  arrow(ctx,W*0.18,H*0.14+16,W*0.5,H*0.24,{color:COLORS.teal,progress:ease(clamp((t-0.3)/0.4,0,1)),alpha:0.5});
  const e2=ease(clamp((t-1.4)/0.5,0,1));
  if(e2>0)txt(ctx,'vector search over document store',W*0.5,H*0.52,{size:10.5,color:'#888',alpha:e2});
  const e3=ease(clamp((t-2.0)/0.6,0,1));
  if(e3>0){
    box(ctx,W*0.6,H*0.64,W*0.32,H*0.14,{fill:COLORS.teal+'14',stroke:COLORS.teal,alpha:e3,r:6});
    txt(ctx,'retrieved chunks + query \u2192 prompt',W*0.76,H*0.71,{size:10,color:COLORS.teal,alpha:e3});
  }
  const e4=ease(clamp((t-2.6)/0.6,0,1));
  if(e4>0){
    txt(ctx,'grounded answer, with sources',W*0.76,H*0.88,{size:11.5,color:COLORS.green,weight:600,alpha:e4});
  }
}});


S.push({chap:"8 \u00b7 Decoding & Prompting", title:"Hallucination: Confident but Wrong", sub:"Why fluent text isn't always true text", accent:COLORS.rose,
panel:`
<div class="p-lead">A language model is fundamentally a next-token predictor — it optimizes for plausible-sounding continuations, not verified truth. When it lacks real knowledge on a topic, it can still generate fluent, confident-sounding, but factually wrong text: a "hallucination".</div>
<ul class="p-bullets">
<li>The model has no built-in mechanism to say "I don't actually know this" unless explicitly trained to</li>
<li>Hallucination risk rises for rare facts, recent events, and very specific numeric details</li>
<li>Mitigations: RAG, citing sources, and training the model to express calibrated uncertainty</li>
</ul>
<div class="formula-box"><div class="flabel">Why it happens (informal)</div>
<div class="feq">model optimizes P(plausible text) ≠ P(true text)</div>
<div class="fnote">Fluency and factual accuracy are correlated but not the same objective — nothing in pretraining directly rewards truthfulness.</div></div>
<details class="why"><summary>Why doesn't more training just fix this?</summary><div class="why-body">
<h4>Reasoning</h4><p>Pretraining data itself contains errors and gaps, and the loss function has no notion of "verified fact" — a bigger model or more data reduces some hallucination but cannot eliminate it structurally.</p>
<h4>Real world</h4><p>This is exactly why production assistants pair a strong base model with retrieval, citations, or tool use for factual queries, rather than trusting the model's un-aided memory.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,40);
  const cx=W/2;
  const e0=ease(clamp(t/0.5,0,1));
  txt(ctx,'"When was the Xyzzy-9 satellite launched?"',cx,H*0.14,{size:12,color:'#ccc',alpha:e0});
  const e1=ease(clamp((t-0.6)/0.6,0,1));
  if(e1>0){
    box(ctx,W*0.15,H*0.32,W*0.32,H*0.28,{fill:COLORS.rose+'14',stroke:COLORS.rose,alpha:e1,r:8});
    txt(ctx,'no grounding',W*0.31,H*0.36,{size:10.5,color:COLORS.rose,alpha:e1});
    txt(ctx,'"It launched on\nMarch 3, 2019."',W*0.31,H*0.48,{size:11,color:'#ddd',alpha:e1});
    txt(ctx,'\u26a0 fabricated, sounds confident',W*0.31,H*0.56,{size:9,color:COLORS.rose,alpha:e1});
  }
  const e2=ease(clamp((t-1.4)/0.6,0,1));
  if(e2>0){
    box(ctx,W*0.53,H*0.32,W*0.32,H*0.28,{fill:COLORS.green+'14',stroke:COLORS.green,alpha:e2,r:8});
    txt(ctx,'grounded (RAG)',W*0.69,H*0.36,{size:10.5,color:COLORS.green,alpha:e2});
    txt(ctx,'"I don\u2019t find a\nverified record."',W*0.69,H*0.48,{size:11,color:'#ddd',alpha:e2});
    txt(ctx,'\u2713 honest about uncertainty',W*0.69,H*0.56,{size:9,color:COLORS.green,alpha:e2});
  }
  const e3=ease(clamp((t-2.2)/0.5,0,1));
  if(e3>0)txt(ctx,'same model, different information access',cx,H*0.78,{size:11,color:'#888',alpha:e3});
}});

S.push({chap:"9 \u00b7 Scaling & Systems", title:"Scaling Laws: Predicting Performance", sub:"How model size, data, and compute trade off", accent:COLORS.amber,
panel:`
<div class="p-lead">Empirically, model loss follows smooth, predictable power-law curves as you increase model size, dataset size, or compute — letting researchers forecast the payoff of a bigger training run before spending millions on it.</div>
<ul class="p-bullets">
<li>Loss decreases predictably as parameters, data, or compute increase, following a power law</li>
<li>Chinchilla finding (2022): most large models were undertrained — for a fixed compute budget, balance model size and data roughly equally, not just grow parameters</li>
<li>Scaling laws let teams choose the compute-optimal model size and data amount ahead of time</li>
</ul>
<div class="formula-box"><div class="flabel">Power-law fit</div>
<div class="feq">Loss(N) ≈ (N<sub>c</sub> / N)<sup>α</sup></div>
<div class="fnote">N = parameter count, N_c and α are empirically fit constants — a straight line on a log-log plot.</div></div>
<details class="why"><summary>Why is loss so predictable across many orders of magnitude?</summary><div class="why-body">
<h4>Reasoning</h4><p>Adding capacity or data reduces the model's remaining "surprise" about the training distribution in a smooth, diminishing-returns way — this regularity, first noticed empirically, has held remarkably well across model families and scales.</p>
<h4>Real world</h4><p>Scaling laws are why organizations can run small, cheap experiments and extrapolate to decide the size and data budget for a giant, expensive training run, rather than guessing.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,41);
  const cx0=W*0.16, cy0=H*0.82, plotW=W*0.7, plotH=H*0.56;
  line(ctx,cx0,cy0,cx0+plotW,cy0,{color:'#333'});
  line(ctx,cx0,cy0,cx0,cy0-plotH,{color:'#333'});
  txt(ctx,'model size / data / compute (log scale) \u2192',cx0+plotW/2,cy0+22,{size:10.5,color:'#777'});
  ctx.save();ctx.translate(cx0-24,cy0-plotH/2);ctx.rotate(-Math.PI/2);txt(ctx,'loss (log scale)',0,0,{size:10.5,color:'#777'});ctx.restore();
  const e=ease(clamp(t/1.2,0,1));
  ctx.beginPath();
  for(let i=0;i<=100;i++){
    const f=i/100;
    if(f>e)break;
    const x=cx0+f*plotW;
    const y=cy0-plotH*(1-Math.pow(1-f,0.6));
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.strokeStyle=COLORS.amber;ctx.lineWidth=2.4;ctx.stroke();
  const e2=ease(clamp((t-1.5)/0.6,0,1));
  if(e2>0)txt(ctx,'smooth, predictable power-law improvement',cx0+plotW/2,cy0-plotH-10,{size:11,color:COLORS.amber,alpha:e2});
}});


S.push({chap:"9 \u00b7 Scaling & Systems", title:"KV Cache: Not Recomputing the Past", sub:"The key trick behind fast chat responses", accent:COLORS.blue,
panel:`
<div class="p-lead">Generating text one token at a time naively would require recomputing attention over the entire growing sequence at every step. The KV cache stores each token's Key and Value vectors the moment they're computed, so future steps just reuse them.</div>
<ul class="p-bullets">
<li>Without caching: generating token 500 requires recomputing K, V for all 499 prior tokens</li>
<li>With caching: only the new token's K, V are computed each step; old ones are reused from memory</li>
<li>Tradeoff: KV cache uses significant GPU memory, growing linearly with sequence length and batch size</li>
</ul>
<div class="formula-box"><div class="flabel">Memory cost</div>
<div class="feq">KV cache size ≈ 2 · layers · heads · d<sub>head</sub> · seq_len · batch</div>
<div class="fnote">The factor of 2 is for storing both Keys and Values, across every layer of the model.</div></div>
<details class="why"><summary>Why is this optimization so important?</summary><div class="why-body">
<h4>Reasoning</h4><p>Attention is already the costly part of a transformer; recomputing it from scratch for every new token would make generation cost grow quadratically with output length instead of linearly.</p>
<h4>Real world</h4><p>KV cache memory is the main reason long conversations or long documents require far more GPU memory at inference time — often the actual bottleneck for serving chat applications at scale.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,42);
  const cx=W/2;
  txt(ctx,'generating token by token',cx,H*0.14,{size:12,color:'#ccc',alpha:ease(clamp(t/0.5,0,1))});
  const n=6;
  const gap=W*0.7/n, startX=cx-(gap*(n-1))/2;
  for(let i=0;i<n;i++){
    const appear=ease(clamp((t-i*0.4)/0.5,0,1));
    if(appear<=0)continue;
    const x=startX+i*gap, y=H*0.36;
    tokenBubble(ctx,x,y,'t'+(i+1),COLORS.blue,appear,0.9);
    box(ctx,x-20,H*0.56,40,18,{fill:COLORS.green+'44',stroke:COLORS.green,alpha:appear,r:3});
  }
  const e2=ease(clamp((t-n*0.4+0.4)/0.5,0,1));
  if(e2>0)txt(ctx,'K,V cached \u2014 reused, not recomputed',cx,H*0.66,{size:11,color:COLORS.green,alpha:e2});
  const e3=ease(clamp((t-n*0.4+1.1)/0.5,0,1));
  if(e3>0)txt(ctx,'only the newest token does fresh attention work',cx,H*0.8,{size:11,color:'#888',alpha:e3});
}});


S.push({chap:"9 \u00b7 Scaling & Systems", title:"FlashAttention", sub:"Same math, far less memory traffic", accent:COLORS.purple,
panel:`
<div class="p-lead">FlashAttention computes the exact same attention output as before — but restructures the computation to avoid ever writing the full attention score matrix to slow GPU memory, dramatically speeding up training and inference.</div>
<ul class="p-bullets">
<li>Standard attention materializes a full sequence-length × sequence-length score matrix in memory</li>
<li>FlashAttention processes the computation in small tiles/blocks, keeping intermediate results in fast on-chip memory</li>
<li>Mathematically identical output — this is purely an engineering optimization of how the formula is computed</li>
</ul>
<div class="formula-box"><div class="flabel">Memory savings</div>
<div class="feq">Standard: O(L²) memory&nbsp;&nbsp;&nbsp;FlashAttention: O(L) memory</div>
<div class="fnote">L = sequence length. Avoiding the L² intermediate matrix unlocks much longer context windows in practice.</div></div>
<details class="why"><summary>Why does avoiding memory writes matter so much for speed?</summary><div class="why-body">
<h4>Reasoning</h4><p>On modern GPUs, moving data between slow and fast memory is often the actual bottleneck, not the arithmetic itself. Keeping data in fast on-chip memory throughout avoids the expensive back-and-forth, achieving large real-world speedups despite doing mathematically identical work.</p>
<h4>Real world</h4><p>FlashAttention is a standard component in nearly every modern LLM training and inference stack — part of why context windows grew from a few thousand tokens to hundreds of thousands within a couple of years.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,43);
  const e0=ease(clamp(t/0.5,0,1));
  txt(ctx,'standard attention',W*0.28,H*0.16,{size:11.5,color:COLORS.rose,alpha:e0,weight:600});
  txt(ctx,'FlashAttention',W*0.72,H*0.16,{size:11.5,color:COLORS.purple,alpha:e0,weight:600});
  const gx=W*0.28, gy=H*0.42, n=8, cell=14;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const a=ease(clamp((t-0.4-(r*n+c)*0.01)/0.3,0,1));
    if(a<=0)continue;
    box(ctx,gx-n*cell/2+c*cell,gy-n*cell/2+r*cell,cell-1,cell-1,{fill:COLORS.rose+'55',stroke:'none',r:1});
  }
  const e1=ease(clamp((t-0.4)/0.8,0,1));
  txt(ctx,'full L\u00d7L matrix \u2192 slow memory',W*0.28,gy+n*cell/2+20,{size:9.5,color:'#888',alpha:e1});
  const e2=ease(clamp((t-0.4)/0.8,0,1));
  const fx=W*0.72, fy=H*0.42;
  const tileIdx=Math.floor((t*1.5)%4);
  const positions=[[-1,-1],[1,-1],[-1,1],[1,1]];
  if(e2>0){
    box(ctx,fx-n*cell/2,fy-n*cell/2,n*cell,n*cell,{fill:'#141420',stroke:'#444',alpha:e2,r:3});
    const pos=positions[tileIdx];
    box(ctx,fx+pos[0]*cell*1.5-cell*1.5,fy+pos[1]*cell*1.5-cell*1.5,cell*3,cell*3,{fill:COLORS.purple+'77',stroke:COLORS.purple,alpha:e2,r:2});
    txt(ctx,'small tiles \u2192 fast on-chip memory',fx,fy+n*cell/2+20,{size:9.5,color:'#888',alpha:e2});
  }
}});


S.push({chap:"9 \u00b7 Scaling & Systems", title:"Mixed Precision Training", sub:"Compute fast in low precision, accumulate in high precision", accent:COLORS.green,
panel:`
<div class="p-lead">Training entirely in 32-bit floats is accurate but slow and memory-hungry. Mixed precision runs most operations in 16-bit floats (much faster on modern GPUs) while keeping a master copy of weights in 32-bit for numerical stability.</div>
<ul class="p-bullets">
<li>Forward and backward passes: computed in FP16/BF16 — roughly 2× faster, half the memory</li>
<li>Master weights and gradient accumulation: kept in FP32 to avoid precision loss compounding over updates</li>
<li>Loss scaling: multiply the loss by a large constant before backprop to prevent small gradients underflowing to zero in FP16</li>
</ul>
<div class="formula-box"><div class="flabel">Loss scaling</div>
<div class="feq">scaled_loss = loss × S,&nbsp;&nbsp; gradients = backward(scaled_loss) / S</div>
<div class="fnote">S is a scale factor (often dynamic) chosen so gradients stay representable in FP16's limited range.</div></div>
<details class="why"><summary>Why not just train fully in FP32?</summary><div class="why-body">
<h4>Reasoning</h4><p>FP32 has more range and precision than most gradients actually need, and modern GPU hardware performs FP16/BF16 matrix multiplication multiple times faster — mixed precision spends full precision only where it matters (weight accumulation).</p>
<h4>Real world</h4><p>Essentially every large model is trained in mixed precision — training fully in FP32 at today's scale would be prohibitively slow and expensive.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,44);
  const cx=W/2;
  const e0=ease(clamp(t/0.5,0,1));
  txt(ctx,'forward/backward pass',W*0.32,H*0.18,{size:11,color:COLORS.green,alpha:e0});
  const e1=ease(clamp((t-0.3)/0.6,0,1));
  for(let i=0;i<5;i++){
    const a=ease(clamp((t-0.3-i*0.15)/0.4,0,1));
    if(a<=0)continue;
    box(ctx,W*0.18+i*36,H*0.28,26,26,{fill:COLORS.green+'55',stroke:COLORS.green,alpha:a,r:3});
  }
  txt(ctx,'FP16/BF16 \u2014 fast, half memory',W*0.32,H*0.42,{size:10,color:'#888',alpha:e1});
  const e2=ease(clamp((t-1.3)/0.6,0,1));
  if(e2>0){
    box(ctx,W*0.62,H*0.6,W*0.24,H*0.14,{fill:'#141420',stroke:'#888',alpha:e2,r:6});
    txt(ctx,'master weights (FP32)',W*0.74,H*0.67,{size:10,color:'#ccc',alpha:e2});
    arrow(ctx,W*0.32,H*0.28+13,W*0.74,H*0.6,{color:'#666',progress:ease(clamp((t-1.6)/0.5,0,1)),alpha:0.5});
    txt(ctx,'sync update',W*0.5,H*0.5,{size:9.5,color:'#666',alpha:ease(clamp((t-1.8)/0.5,0,1))});
  }
  const e3=ease(clamp((t-2.3)/0.5,0,1));
  if(e3>0)txt(ctx,'loss scaling keeps small FP16 gradients from vanishing',cx,H*0.86,{size:10.5,color:'#888',alpha:e3});
}});


S.push({chap:"9 \u00b7 Scaling & Systems", title:"Distributed Training: Splitting the Work", sub:"Data parallelism vs model parallelism", accent:COLORS.blue,
panel:`
<div class="p-lead">A model with hundreds of billions of parameters, trained on trillions of tokens, cannot fit or run on a single GPU. Distributed training splits the work across many GPUs — in two fundamentally different ways.</div>
<ul class="p-bullets">
<li>Data parallelism: every GPU holds a full copy of the model, processes a different chunk of the batch, then gradients are synced across GPUs</li>
<li>Model (tensor/pipeline) parallelism: the model itself is split across GPUs — necessary when a single model is too large to fit in one GPU's memory</li>
<li>Real training runs combine both, plus other strategies, across thousands of GPUs simultaneously</li>
</ul>
<div class="formula-box"><div class="flabel">Effective batch</div>
<div class="feq">global_batch = per_GPU_batch × number_of_GPUs</div>
<div class="fnote">Gradient averaging across GPUs must be done carefully to keep this mathematically equivalent to training on one giant batch.</div></div>
<details class="why"><summary>Why not just use one very large, very powerful GPU?</summary><div class="why-body">
<h4>Reasoning</h4><p>Even the largest single GPU has fixed memory and compute — frontier models need orders of magnitude more of both, so the only way to scale further is to divide the problem across many chips working in coordination.</p>
<h4>Real world</h4><p>This is why training a frontier LLM requires data-center-scale clusters of thousands of GPUs or TPUs, communicating constantly to keep every replica's weights in sync.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,45);
  txt(ctx,'data parallelism',W*0.28,H*0.16,{size:11.5,color:COLORS.blue,alpha:ease(clamp(t/0.5,0,1)),weight:600});
  txt(ctx,'model parallelism',W*0.72,H*0.16,{size:11.5,color:COLORS.amber,alpha:ease(clamp(t/0.5,0,1)),weight:600});
  for(let i=0;i<4;i++){
    const a=ease(clamp((t-0.3-i*0.2)/0.4,0,1));
    if(a<=0)continue;
    const x=W*0.16+i*W*0.08, y=H*0.36;
    box(ctx,x-16,y-14,32,28,{fill:COLORS.blue+'33',stroke:COLORS.blue,alpha:a,r:3});
    txt(ctx,'M',x,y,{size:9,color:COLORS.blue,alpha:a});
  }
  const e1=ease(clamp((t-1.3)/0.5,0,1));
  if(e1>0)txt(ctx,'full model copy each, different data',W*0.28,H*0.52,{size:9.5,color:'#888',alpha:e1});
  const slices=['L1-8','L9-16','L17-24','L25-32'];
  slices.forEach((s,i)=>{
    const a=ease(clamp((t-0.3-i*0.2)/0.4,0,1));
    if(a<=0)return;
    const x=W*0.6+i*W*0.08, y=H*0.36;
    box(ctx,x-16,y-14,32,28,{fill:COLORS.amber+'33',stroke:COLORS.amber,alpha:a,r:3});
    txt(ctx,s,x,y,{size:7.5,color:COLORS.amber,alpha:a});
  });
  const e2=ease(clamp((t-1.3)/0.5,0,1));
  if(e2>0)txt(ctx,'one model, split across GPUs',W*0.72,H*0.52,{size:9.5,color:'#888',alpha:e2});
}});


S.push({chap:"9 \u00b7 Scaling & Systems", title:"Speculative Decoding", sub:"A small model drafts, the big model checks", accent:COLORS.rose,
panel:`
<div class="p-lead">Generating text one token at a time with a huge model is slow because each step is a full forward pass. Speculative decoding speeds this up: a small, fast "draft" model guesses several tokens ahead, and the big model verifies them all in a single parallel pass.</div>
<ul class="p-bullets">
<li>Draft model quickly proposes, say, 4 candidate next tokens</li>
<li>The large model checks all 4 in one batched forward pass — much cheaper than 4 separate passes</li>
<li>Accepted tokens are kept; the first rejected token is corrected by the large model, and drafting resumes from there</li>
</ul>
<div class="formula-box"><div class="flabel">Speedup intuition</div>
<div class="feq">expected tokens per big-model pass ≈ 1 + (accepted draft tokens)</div>
<div class="fnote">When the draft model's guesses are frequently correct, one expensive pass can validate multiple tokens at once.</div></div>
<details class="why"><summary>Why does verifying in parallel save time?</summary><div class="why-body">
<h4>Reasoning</h4><p>A transformer's forward pass cost is dominated by loading its huge weights from memory, not the extra arithmetic of processing a few more tokens at once — checking 4 draft tokens together costs barely more than checking 1, making correct guesses essentially free.</p>
<h4>Real world</h4><p>Speculative decoding is a standard latency optimization in production LLM serving — it speeds up generation without changing the final output at all, since the big model still has final say on every token.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,46);
  const cx=W/2;
  const e0=ease(clamp(t/0.5,0,1));
  txt(ctx,'small draft model proposes 4 tokens',cx,H*0.14,{size:11.5,color:'#ccc',alpha:e0});
  const drafts=['the','cat','sat','down'];
  const gap=W*0.6/4, startX=cx-(gap*3)/2;
  drafts.forEach((d,i)=>{
    const a=ease(clamp((t-0.4-i*0.2)/0.4,0,1));
    if(a<=0)return;
    tokenBubble(ctx,startX+i*gap,H*0.3,d,COLORS.rose,a,0.9);
  });
  const e1=ease(clamp((t-1.4)/0.5,0,1));
  if(e1>0)txt(ctx,'large model verifies all 4 in one pass',cx,H*0.48,{size:11.5,color:'#ccc',alpha:e1});
  const results=['\u2713','\u2713','\u2713','\u2717'];
  const colors=[COLORS.green,COLORS.green,COLORS.green,COLORS.rose];
  results.forEach((r,i)=>{
    const a=ease(clamp((t-1.8-i*0.2)/0.4,0,1));
    if(a<=0)return;
    txt(ctx,r,startX+i*gap,H*0.6,{size:16,color:colors[i],weight:700,alpha:a});
  });
  const e2=ease(clamp((t-2.8)/0.5,0,1));
  if(e2>0)txt(ctx,'3 tokens accepted free; big model corrects the 4th',cx,H*0.76,{size:11,color:'#888',alpha:e2});
}});

S.push({chap:"10 \u00b7 Continual Learning & Safety", title:"Catastrophic Forgetting", sub:"Learning something new can erase something old", accent:COLORS.amber,
panel:`
<div class="p-lead">When a model is fine-tuned on a new task or domain, its weights shift to minimize the new loss — but those same weights previously encoded other skills and knowledge, which can silently degrade in the process.</div>
<ul class="p-bullets">
<li>Fine-tuning heavily on one narrow domain can measurably hurt performance on unrelated tasks</li>
<li>More pronounced with full fine-tuning; PEFT methods like LoRA reduce this since most of the original network stays frozen</li>
<li>Mitigations: mix in general-purpose data during fine-tuning, or use smaller learning rates</li>
</ul>
<div class="formula-box"><div class="flabel">Informal tradeoff</div>
<div class="feq">performance(new task) \u2191 often at the cost of performance(old tasks) \u2193</div>
<div class="fnote">Not a fixed law — the size of the drop depends on how much and how aggressively the weights are updated.</div></div>
<details class="why"><summary>Why does the model "forget" instead of just adding new knowledge?</summary><div class="why-body">
<h4>Reasoning</h4><p>Unlike a human that accumulates memories separately, all of a neural network's knowledge lives superimposed in the same weight matrices — a gradient update that improves the new task can overwrite the exact weight patterns that encoded old skills.</p>
<h4>Real world</h4><p>This is a major reason PEFT/LoRA is often preferred over full fine-tuning for task-specific customization — freezing the base model largely protects its original broad capabilities.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,47);
  const cx=W/2;
  const n=8;
  const gx=cx, gy=H*0.42, cell=26;
  const e=ease(clamp(t/0.8,0,1));
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const seedv=(r*7+c*13)%5;
    const col = seedv<2?COLORS.blue:(seedv<4?COLORS.green:COLORS.purple);
    const a=ease(clamp((t-(r*n+c)*0.008)/0.3,0,1));
    if(a<=0)continue;
    box(ctx,gx-n*cell/2+c*cell,gy-n*cell/2+r*cell,cell-2,cell-2,{fill:col+'55',stroke:'none',r:1});
  }
  const e2=ease(clamp((t-1.5)/0.8,0,1));
  if(e2>0){
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){
      const a2=ease(clamp((t-1.5-(r*4+c)*0.03)/0.3,0,1));
      if(a2<=0)continue;
      const hexA = Math.floor(a2*153).toString(16).padStart(2,'0');
      box(ctx,gx-n*cell/2+c*cell,gy-n*cell/2+r*cell,cell-2,cell-2,{fill:COLORS.amber+hexA,stroke:'none',r:1});
    }
    txt(ctx,'new task fine-tuning overwrites this region',gx,gy-n*cell/2-16,{size:10.5,color:COLORS.amber,alpha:e2});
  }
  const e3=ease(clamp((t-2.6)/0.5,0,1));
  if(e3>0)txt(ctx,'unrelated skills stored nearby can degrade too',cx,gy+n*cell/2+26,{size:10.5,color:'#888',alpha:e3});
}});


S.push({chap:"10 \u00b7 Continual Learning & Safety", title:"Constitutional AI: Principles, Not Just People", sub:"Scaling alignment beyond human labeling capacity", accent:COLORS.purple,
panel:`
<div class="p-lead">Human preference labeling (RLHF) is expensive and hard to scale, and even harder for hazardous topics you don't want to expose human raters to. Constitutional AI has the model critique and revise its own outputs against a written set of principles, then uses that self-generated preference data for training (RLAIF).</div>
<ul class="p-bullets">
<li>Write a small "constitution" — principles like "avoid harmful advice", "be helpful and honest"</li>
<li>The model generates a response, critiques its own response against the constitution, then revises it</li>
<li>These self-generated preference pairs train the model, reducing reliance on large volumes of human labels</li>
</ul>
<div class="formula-box"><div class="flabel">Self-supervised preference generation</div>
<div class="feq">(response, critique, revision) \u2192 preference pair \u2192 same DPO/RLHF pipeline</div>
<div class="fnote">The constitution acts as a reusable, transparent, inspectable ruleset instead of relying purely on implicit human intuition.</div></div>
<details class="why"><summary>Why let the model critique itself instead of always using humans?</summary><div class="why-body">
<h4>Reasoning</h4><p>For large-scale or sensitive content, human raters are costly, slow, and can even be put at risk reviewing certain material — a model that reliably applies written principles to itself, verified by spot-checking against human judgment, generates far more training signal at much lower cost.</p>
<h4>Real world</h4><p>Constitutional AI-style approaches are how some organizations align models for sensitive topics at scale, while keeping the guiding principles auditable and explicit.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,48);
  const cx=W/2;
  const e0=ease(clamp(t/0.5,0,1));
  box(ctx,cx-260,H*0.14,140,H*0.16,{fill:'#141420',stroke:'#888',alpha:e0,r:6});
  txt(ctx,'constitution\n(written principles)',cx-190,H*0.14+H*0.08,{size:9.5,color:'#ccc',alpha:e0});
  const steps=[{l:'draft response',c:COLORS.blue,x:0.3},{l:'self-critique\nvs constitution',c:COLORS.amber,x:0.5},{l:'revised response',c:COLORS.green,x:0.7}];
  steps.forEach((s,i)=>{
    const a=ease(clamp((t-0.5-i*0.5)/0.6,0,1));
    if(a<=0)return;
    const x=W*s.x, y=H*0.46;
    box(ctx,x-58,y-22,116,44,{fill:s.c+'18',stroke:s.c,alpha:a,r:6});
    s.l.split('\n').forEach((ln,li)=>txt(ctx,ln,x,y+(li-(s.l.split('\n').length-1)/2)*12,{size:9.5,color:s.c,alpha:a}));
    if(i>0){
      const ap=ease(clamp((t-0.5-i*0.5-0.2)/0.4,0,1));
      arrow(ctx,W*steps[i-1].x+60,y,x-60,y,{color:'#666',progress:ap});
    }
  });
  const e2=ease(clamp((t-2.4)/0.5,0,1));
  if(e2>0)txt(ctx,'revised pairs feed the same DPO/RLHF training loop',cx,H*0.72,{size:11,color:'#888',alpha:e2});
}});


S.push({chap:"11 \u00b7 Architecture Variants", title:"Encoder, Decoder, or Both?", sub:"Three transformer shapes for three kinds of tasks", accent:COLORS.blue,
panel:`
<div class="p-lead">Not every transformer generates text left-to-right. The original architecture had two halves — an encoder that reads a whole input at once, and a decoder that generates output one token at a time — and different tasks kept different halves.</div>
<ul class="p-bullets">
<li><b>Encoder-only</b> (e.g. BERT): sees the whole input at once (bidirectional attention) — great for understanding tasks like classification/search, can't generate text token-by-token</li>
<li><b>Decoder-only</b> (e.g. GPT, LLaMA, Claude): causal, generates one token at a time attending only to the past — the dominant architecture for modern general-purpose LLMs</li>
<li><b>Encoder-Decoder</b> (e.g. T5): encoder reads the input fully, decoder generates output while attending back to it — a natural fit for translation/summarization</li>
</ul>
<div class="formula-box"><div class="flabel">Attention direction</div>
<div class="feq">Encoder: full (bidirectional)&nbsp;&nbsp;&nbsp;&nbsp;Decoder: causal (left-to-right)</div>
<div class="fnote">The masking pattern in attention is literally the difference between these architectures.</div></div>
<details class="why"><summary>Why did decoder-only become the dominant choice?</summary><div class="why-body">
<h4>Reasoning</h4><p>A decoder-only model trains on one extremely simple, scalable objective — next-token prediction over almost any text — and the same causal architecture handles both understanding and generation, with no separate encoder pass needed.</p>
<h4>Real world</h4><p>GPT, LLaMA, and Claude-class models are all decoder-only, while BERT-style encoder-only models remain popular for embedding/search/classification tasks.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,49);
  const arches=[
    {l:'Encoder-only\n(BERT)',c:COLORS.teal,x:0.18,causal:false},
    {l:'Decoder-only\n(GPT/LLaMA)',c:COLORS.blue,x:0.5,causal:true},
    {l:'Encoder-Decoder\n(T5)',c:COLORS.purple,x:0.82,causal:false}
  ];
  arches.forEach((a,ai)=>{
    const appear=ease(clamp((t-ai*0.4)/0.5,0,1));
    if(appear<=0)return;
    const cx=W*a.x, cy=H*0.38;
    a.l.split('\n').forEach((ln,li)=>txt(ctx,ln,cx,H*0.14+li*14,{size:10.5,color:a.c,alpha:appear,weight:600}));
    const n=4, gap=26;
    const startX=cx-(gap*(n-1))/2;
    for(let i=0;i<n;i++){ tokenBubble(ctx,startX+i*gap,cy,'',a.c,appear*0.9,0.5); }
    const connAppear=ease(clamp((t-ai*0.4-0.3)/0.5,0,1));
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){
      if(i===j)continue;
      if(a.causal && j>i) continue;
      line(ctx,startX+i*gap,cy+10,startX+j*gap,cy+10,{color:a.c,alpha:0.1*connAppear});
    }
  });
  const e=ease(clamp((t-1.6)/0.6,0,1));
  if(e>0)txt(ctx,'same attention mechanism, different masking rules',W/2,H*0.62,{size:11,color:'#888',alpha:e});
}});


S.push({chap:"11 \u00b7 Architecture Variants", title:"Multi-Query & Grouped-Query Attention", sub:"Shrinking the KV cache without losing much quality", accent:COLORS.green,
panel:`
<div class="p-lead">Standard multi-head attention gives every head its own Key and Value projections — expressive, but expensive for the KV cache, since cache size scales with the number of KV heads. MQA and GQA reduce that cost by sharing K/V across heads.</div>
<ul class="p-bullets">
<li><b>Multi-Head Attention (MHA)</b>: every head has its own Q, K, V — most expressive, largest KV cache</li>
<li><b>Multi-Query Attention (MQA)</b>: all heads share a single K and V, only Q stays per-head — much smaller cache, some quality loss</li>
<li><b>Grouped-Query Attention (GQA)</b>: a middle ground — groups of heads share one K/V pair</li>
</ul>
<div class="formula-box"><div class="flabel">KV pairs needed</div>
<div class="feq">MHA: h pairs&nbsp;&nbsp;&nbsp;GQA: g &lt; h shared groups&nbsp;&nbsp;&nbsp;MQA: 1 pair</div>
<div class="fnote">g is tunable — g=1 recovers MQA, g=h recovers full MHA.</div></div>
<details class="why"><summary>Why does sharing K/V hurt quality less than you'd expect?</summary><div class="why-body">
<h4>Reasoning</h4><p>Query vectors stay fully separate per head — only "what's available to attend to" (K/V) is shared, so heads can still specialize in how they read the same shared context, recovering most of MHA's power at a fraction of the cache cost.</p>
<h4>Real world</h4><p>GQA is used in LLaMA 2/3 and many modern open models specifically because it lets long-context inference fit in far less GPU memory with minimal accuracy tradeoff.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,50);
  const cx=W/2;
  const rows=[
    {l:'MHA — 4 separate KV pairs',n:4,c:COLORS.rose,y:0.22},
    {l:'GQA — 2 shared groups',n:2,c:COLORS.amber,y:0.5},
    {l:'MQA — 1 shared pair',n:1,c:COLORS.green,y:0.78}
  ];
  rows.forEach((r,ri)=>{
    const appear=ease(clamp((t-ri*0.5)/0.5,0,1));
    if(appear<=0)return;
    txt(ctx,r.l,cx,H*r.y-30,{size:11,color:r.c,alpha:appear,weight:600});
    const heads=4;
    const gap=W*0.6/heads, startX=cx-(gap*(heads-1))/2;
    for(let i=0;i<heads;i++){
      const hx=startX+i*gap, hy=H*r.y;
      tokenBubble(ctx,hx,hy,'Q'+(i+1),COLORS.blue,appear,0.75);
      const kvGroup = r.n===4?i : (r.n===2? Math.floor(i/2) : 0);
      const kvX = r.n===4? hx : cx + (kvGroup-(r.n-1)/2)* (gap*2);
      arrow(ctx,hx,hy+14,kvX,hy+34,{color:r.c,progress:appear,alpha:0.5});
    }
    const kvCount=r.n;
    const kvGap=gap*2;
    const kvStart=cx-(kvGap*(kvCount-1))/2;
    for(let k=0;k<kvCount;k++){
      box(ctx,kvStart+k*kvGap-22,H*r.y+34,44,20,{fill:r.c+'33',stroke:r.c,alpha:appear,r:3});
      txt(ctx,'KV',kvStart+k*kvGap,H*r.y+44,{size:9,color:r.c,alpha:appear});
    }
  });
}});

S.push({chap:"11 \u00b7 Architecture Variants", title:"ALiBi: Position Without Learned Embeddings", sub:"A simpler way to handle very long sequences", accent:COLORS.amber,
panel:`
<div class="p-lead">Instead of adding a learned or sinusoidal positional vector to embeddings, ALiBi (Attention with Linear Biases) directly penalizes attention scores based on how far apart two tokens are — closer tokens get a smaller penalty, farther tokens a bigger one.</div>
<ul class="p-bullets">
<li>No positional embeddings added to the input at all — position lives entirely in the attention computation</li>
<li>The penalty grows linearly with distance, scaled by a fixed, per-head slope</li>
<li>Because the bias is a simple, unbounded linear function, models generalize surprisingly well to sequences longer than they were trained on</li>
</ul>
<div class="formula-box"><div class="flabel">Biased attention score</div>
<div class="feq">score(i,j) = Q<sub>i</sub>·K<sub>j</sub> − m · |i − j|</div>
<div class="fnote">m is a fixed, head-specific slope; larger distance subtracts more, discouraging attention to far-away tokens.</div></div>
<details class="why"><summary>Why does a linear penalty generalize to longer sequences so well?</summary><div class="why-body">
<h4>Reasoning</h4><p>Sinusoidal or learned positional encodings are tied to positions seen during training and can behave unpredictably beyond that range. A linear distance penalty is well-defined for any distance, however large, so extending to longer sequences is a smooth extrapolation.</p>
<h4>Real world</h4><p>ALiBi-style relative-position schemes are part of why some models trained on a few-thousand-token context still perform reasonably on inputs many times longer.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,51);
  const cx=W/2;
  const n=9;
  const gap=W*0.8/n, startX=cx-(gap*(n-1))/2, y=H*0.32;
  const qIdx=Math.floor(n/2);
  for(let i=0;i<n;i++){
    const appear=ease(clamp((t-i*0.08)/0.4,0,1));
    if(appear<=0)continue;
    tokenBubble(ctx,startX+i*gap,y,'t'+i,i===qIdx?COLORS.rose:COLORS.amber,appear,0.8);
  }
  const e2=ease(clamp((t-1.2)/0.8,0,1));
  if(e2>0){
    for(let i=0;i<n;i++){
      const dist=Math.abs(i-qIdx);
      const weight=Math.max(0,1-dist*0.22);
      const h=weight*70*e2;
      box(ctx,startX+i*gap-10,H*0.55+ (70*e2-h),20,h,{fill:COLORS.amber+'55',stroke:COLORS.amber,r:2});
    }
    txt(ctx,'attention weight falls off linearly with distance',cx,H*0.75,{size:11,color:COLORS.amber,alpha:e2});
  }
}});


S.push({chap:"11 \u00b7 Architecture Variants", title:"Sliding Window Attention", sub:"Trading full context for speed on very long inputs", accent:COLORS.rose,
panel:`
<div class="p-lead">Full self-attention costs grow quadratically with sequence length. Sliding window attention caps that cost by only letting each token attend to a fixed-size neighborhood around it, rather than the entire sequence.</div>
<ul class="p-bullets">
<li>Each token attends only to the previous w tokens (a local "window"), not all prior tokens</li>
<li>Stacking multiple layers still lets information propagate further — each layer's window effectively reaches a bit further than the last</li>
<li>Cuts attention cost from O(L²) down to O(L·w), a huge saving when w ≪ L</li>
</ul>
<div class="formula-box"><div class="flabel">Effective receptive field</div>
<div class="feq">receptive field after k layers ≈ k · w</div>
<div class="fnote">Information from far-away tokens still reaches a given position, just indirectly, layer by layer.</div></div>
<details class="why"><summary>Why not just always use full attention?</summary><div class="why-body">
<h4>Reasoning</h4><p>For very long documents, full attention's quadratic cost becomes prohibitive, while most locally relevant information sits close by anyway — sliding window trades a small amount of full-context capability for a large, often necessary, compute saving.</p>
<h4>Real world</h4><p>Mistral and several long-context-efficient models use sliding window attention (sometimes combined with occasional full-attention layers) to handle long documents affordably.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,52);
  const cx=W/2;
  const n=12;
  const gap=W*0.78/n, startX=cx-(gap*(n-1))/2, y=H*0.4;
  for(let i=0;i<n;i++){
    const appear=ease(clamp((t-i*0.04)/0.3,0,1));
    if(appear<=0)continue;
    tokenBubble(ctx,startX+i*gap,y,'',COLORS.rose,appear,0.55);
  }
  const e2=ease(clamp((t-0.8)/2.4,0,1));
  if(e2>0){
    const w=3;
    const centerF = e2*(n-1);
    const center=Math.round(centerF);
    const winStart=Math.max(0,center-w), winEnd=Math.min(n-1,center+w);
    const x0=startX+winStart*gap-16, x1=startX+winEnd*gap+16;
    box(ctx,x0,y-18,x1-x0,36,{fill:COLORS.rose+'18',stroke:COLORS.rose,r:8});
    txt(ctx,'window (size w)',(x0+x1)/2,y-32,{size:10,color:COLORS.rose});
  }
  const e3=ease(clamp((t-3.4)/0.6,0,1));
  if(e3>0)txt(ctx,'each token only sees its local neighborhood',cx,H*0.65,{size:11.5,color:'#888',alpha:e3});
}});


S.push({chap:"11 \u00b7 Architecture Variants", title:"State Space Models: An Alternative to Attention", sub:"Mamba and the return of recurrence", accent:COLORS.purple,
panel:`
<div class="p-lead">Attention compares every token to every other token — powerful but quadratic in cost. State space models like Mamba process tokens sequentially through a compact, continuously-updated "state", similar in spirit to older RNNs, but with an update rule designed to train efficiently and capture long-range dependencies.</div>
<ul class="p-bullets">
<li>Maintains a fixed-size hidden state updated as each token is processed — no need to look back at all previous tokens explicitly</li>
<li>Cost per new token is constant, unlike attention, which grows with sequence length</li>
<li>"Selective" state updates (Mamba's key innovation) let the model decide, per token, how much new information to let into the state</li>
</ul>
<div class="formula-box"><div class="flabel">State update (simplified)</div>
<div class="feq">state<sub>t</sub> = A · state<sub>t-1</sub> + B · input<sub>t</sub></div>
<div class="fnote">A and B are learned (and in Mamba, input-dependent) matrices controlling how much old state persists vs. new information enters.</div></div>
<details class="why"><summary>Why revisit recurrence after attention seemingly won?</summary><div class="why-body">
<h4>Reasoning</h4><p>Attention's quadratic cost becomes a real bottleneck at extremely long sequences, whereas a well-designed recurrent update processes each new token in constant time and memory — Mamba found an update rule expressive enough to match transformer-level quality while keeping that efficiency.</p>
<h4>Real world</h4><p>Mamba-based and hybrid attention/state-space models are an active research direction for handling very long documents, audio, and genomic sequences more cheaply than pure attention allows.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,53);
  const cx=W/2;
  const e0=ease(clamp(t/0.5,0,1));
  txt(ctx,'attention: all-to-all (expensive)',W*0.28,H*0.16,{size:10.5,color:COLORS.rose,alpha:e0});
  const n=5;
  const gap=W*0.4/n, startX=W*0.1;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const a=ease(clamp((t-(i*n+j)*0.02)/0.3,0,1));
    if(a<=0)continue;
    line(ctx,startX+i*gap,H*0.32,startX+j*gap,H*0.32,{color:COLORS.rose,alpha:0.08*a});
  }
  for(let i=0;i<n;i++){
    const a=ease(clamp((t-i*0.1)/0.3,0,1));
    tokenBubble(ctx,startX+i*gap,H*0.32,'',COLORS.rose,a,0.55);
  }
  const e1=ease(clamp((t-1.0)/0.5,0,1));
  txt(ctx,'SSM: sequential state (constant cost)',W*0.72,H*0.16,{size:10.5,color:COLORS.purple,alpha:e1});
  const startX2=W*0.55;
  let prevX=null;
  for(let i=0;i<n;i++){
    const a=ease(clamp((t-1.0-i*0.3)/0.4,0,1));
    if(a<=0)continue;
    const x=startX2+i*gap;
    box(ctx,x-16,H*0.32-14,32,28,{fill:COLORS.purple+'33',stroke:COLORS.purple,alpha:a,r:5});
    txt(ctx,'s'+i,x,H*0.32,{size:9,color:COLORS.purple,alpha:a});
    if(prevX!==null)arrow(ctx,prevX+16,H*0.32,x-16,H*0.32,{color:COLORS.purple,progress:a,alpha:0.6});
    prevX=x;
  }
  const e2=ease(clamp((t-2.6)/0.5,0,1));
  if(e2>0)txt(ctx,'each new token updates one compact state, then moves on',cx,H*0.56,{size:11,color:'#888',alpha:e2});
}});

S.push({chap:"12 \u00b7 Data & Training Stability", title:"Data Curation: Garbage In, Garbage Out", sub:"Why what you train on matters as much as how", accent:COLORS.teal,
panel:`
<div class="p-lead">Raw web-scraped text is full of duplicates, spam, boilerplate, and low-quality content. Careful filtering and deduplication before training meaningfully improves the resulting model, often more than adding raw data volume would.</div>
<ul class="p-bullets">
<li>Deduplication: near-identical documents/paragraphs are detected and removed — repeated content otherwise gets over-weighted</li>
<li>Quality filtering: heuristics and classifiers remove spam, boilerplate, and very low-quality text</li>
<li>Toxicity/PII filtering: reduces harmful or private content from ending up embedded in the model's weights</li>
</ul>
<div class="formula-box"><div class="flabel">Near-duplicate detection</div>
<div class="feq">similarity(doc_a, doc_b) via MinHash / n-gram overlap ≥ threshold → remove</div>
<div class="fnote">Exact-match deduplication misses near-duplicates; hashing-based similarity catches those cheaply at web scale.</div></div>
<details class="why"><summary>Why does removing data ever help, rather than just adding more?</summary><div class="why-body">
<h4>Reasoning</h4><p>Duplicated content gets disproportionate gradient signal relative to its actual informational value, pushing the model toward memorizing repeated passages instead of learning generalizable patterns — quality and diversity matter more than sheer token count.</p>
<h4>Real world</h4><p>Training on carefully deduplicated, filtered corpora has shown better downstream performance than training on much larger, noisier raw datasets — a big reason data pipelines get as much engineering investment as model architecture.</p></div></details>`,
draw(ctx,W,H,t){
  bg(ctx,W,H,t,54);
  const cx=W/2;
  const docs=[];
  for(let i=0;i<24;i++){
    const kind = i%6===0?'dup': (i%7===0?'bad':'good');
    docs.push(kind);
  }
  const cols=6, gw=W*0.7/cols, gh=H*0.09;
  const startX=cx-gw*cols/2, startY=H*0.18;
  docs.forEach((k,i)=>{
    const r=Math.floor(i/cols), c=i%cols;
    const appear=ease(clamp((t-i*0.04)/0.3,0,1));
    if(appear<=0)return;
    const x=startX+c*gw, y=startY+r*gh;
    const removed = (k!=='good') && t>1.5;
    const fadeOut = removed? ease(clamp((t-1.5-i*0.02)/0.5,0,1)) : 0;
    const col = k==='dup'?'#666':(k==='bad'?COLORS.rose:COLORS.green);
    box(ctx,x,y,gw-6,gh-6,{fill:col+'33',stroke:col,alpha:appear*(1-fadeOut*0.85),r:3});
  });
  const e2=ease(clamp((t-2.2)/0.6,0,1));
  if(e2>0)txt(ctx,'duplicates & low-quality docs filtered out before training',cx,H*0.86,{size:11.5,color:'#888',alpha:e2});
}});


S.push({chap:"12 \u00b7 Data & Training Stability", title:"Data Mixture: What Fraction of What?", sub:"Not all tokens are worth the same in training", accent:COLORS.teal,
panel:`
<div class="p-lead">A pretraining corpus blends many sources — web text, books, code, academic papers, dialogue — and the proportion of each source (the "mixture weights") measurably shapes what the model becomes good at.</div>
