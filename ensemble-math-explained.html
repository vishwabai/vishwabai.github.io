    const toXY=(x,y)=>[240+x*70, 320-y*45];
    const xs=[]; for(let x=-1.6;x<=1.6;x+=0.08) xs.push(x);
    const trueD = xs.map((x,i)=>{ const [px,py]=toXY(x,trueF(x)); return `${i===0?'M':'L'}${px},${py}`; }).join(' ');
    svg.appendChild(drawPath(path(trueD,{stroke:C.text,'stroke-width':2}),0.3,1.2));
    svg.appendChild(fadeIn(labelText(370,toXY(1.4,trueF(1.4))[1],'f(x)=eˣ',{'font-size':10,fill:C.text,'font-family':'IBM Plex Mono'}),1.6,0.4));
    const lineD = xs.map((x,i)=>{ const [px,py]=toXY(x, 1+x); return `${i===0?'M':'L'}${px},${py}`; }).join(' ');
    svg.appendChild(drawPath(path(lineD,{stroke:C.amber,'stroke-width':1.8,'stroke-dasharray':'5,3'}),2.0,1.0));
    svg.appendChild(fadeIn(labelText(120,toXY(-1.1,1-1.1)[1]-10,'1st order (line)',{'font-size':9,fill:C.amber,'font-family':'IBM Plex Mono'}),3.2,0.4));
    const paraD = xs.map((x,i)=>{ const [px,py]=toXY(x, 1+x+x*x/2); return `${i===0?'M':'L'}${px},${py}`; }).join(' ');
    svg.appendChild(drawPath(path(paraD,{stroke:C.gold,'stroke-width':1.8,'stroke-dasharray':'2,4'}),3.6,1.0));
    svg.appendChild(fadeIn(labelText(340,toXY(1.15,1+1.15+1.15*1.15/2)[1]-10,'2nd order (parabola)',{'font-size':9,fill:C.gold,'font-family':'IBM Plex Mono'}),4.7,0.4));
    svg.appendChild(popIn(circle(...toXY(0,1),5,C.rose),0.2,0.4));
    svg.appendChild(fadeIn(labelText(240,290,'a=0',{'font-size':9.5,fill:C.rose,'font-family':'IBM Plex Mono'}),0.5,0.3));
  },
  notes:{ title:'Formalizing the pattern', html:`
    <h4>The general (infinite) Taylor series</h4>
    <div class="eq" style="background:#0a0d10;border:1px solid #1a1d22;border-radius:6px;padding:10px;">$$f(x) = f(a) + f'(a)(x-a) + \\frac{f''(a)}{2!}(x-a)^2 + \\frac{f'''(a)}{3!}(x-a)^3 + \\cdots$$</div>
    <p>Each additional term uses one more derivative and captures one more layer of "how the curve bends." In machine learning we almost always stop at 2nd order (as XGBoost does) — the value, slope, and curvature — because that's already enough to build a good local approximation, and higher derivatives get expensive to compute.</p>
    <h4>Why "near a point" matters</h4>
    <p>Taylor approximations are only trustworthy close to $a$ — notice in the diagram how the line and parabola both drift away from the true curve $e^x$ as $x$ moves far from 0. In the XGBoost slides ahead, "$a$" will be the model's current prediction, and "$x$" will be the prediction after adding a small correction — so we're always approximating a <em>small step away</em> from where we currently are, exactly where Taylor approximations are most trustworthy.</p>
  `}
},
{
  code:'M-14', accent:C.gold,
  title:'XGBoost, Part 1 — Applying Taylor Expansion to the Loss',
  subtitle:'the exact same 2nd-order approximation from the last slide, aimed at a loss function instead of eˣ',
  caption:'Plain gradient boosting stops at 1st order (the slope). XGBoost keeps the 2nd-order curvature term too — that is its core innovation.',
  steps:[
    { label:'What we are approximating this time', eq:String.raw`$$L\big(y_i,\ F_{m-1}(x_i)+h(x_i)\big) \qquad \text{as a function of } h(x_i),\ \text{zoomed in near } h(x_i)=0$$`,
      expl:'We are asking: if we add a small correction $h(x_i)$ on top of the model&rsquo;s current prediction, how does the loss change? &ldquo;Near zero&rdquo; because early in the search, before we have chosen the new tree, the natural starting guess for its output is &ldquo;no change yet.&rdquo;' },
    { label:'Match each Taylor term to its ML name', eq:String.raw`$$L(y_i,F_{m-1}+h) \approx \underbrace{L(y_i,F_{m-1})}_{\textstyle f(a)} + \underbrace{g_i}_{\textstyle f'(a)}\, h(x_i) + \tfrac12 \underbrace{u_i}_{\textstyle f''(a)}\, h(x_i)^2$$`,
      expl:'Exactly the M-13 template — value, slope, curvature — just relabeled. $g_i$ is the <b>gradient</b> (the same quantity plain gradient boosting used). $u_i$ is new: the <b>curvature</b>, or Hessian. This one extra term is XGBoost&rsquo;s whole trick over plain gradient boosting.',
      glossary:[['g_i','&part;L/&part;F, evaluated at the current prediction — how loss changes with a tiny nudge'], ['u_i','&part;&sup2;L/&part;F&sup2;, evaluated at the current prediction — how the slope itself is changing']] },
    { label:'Sum over every point, then add a complexity penalty', eq:String.raw`$$\text{Obj} = \sum_{i=1}^n \Big[g_i\, h(x_i) + \tfrac12 u_i\, h(x_i)^2\Big] \;+\; \underbrace{\gamma T + \tfrac12\lambda\sum_j w_j^2}_{\textstyle \Omega(h),\ \text{complexity penalty}}$$`,
      expl:'Left part: the Taylor-approximated loss, summed across all training points. Right part &Omega;(h): a hand-added penalty — &gamma; charges a fee per leaf (T = number of leaves), &lambda; discourages any single leaf&rsquo;s output from getting too extreme. This whole expression is what the next two slides minimize.' },
  ],
  notes:{ title:'Why stop at 2nd order?', html:`
    <h4>1st order alone: plain gradient boosting</h4>
    <p>If you drop the $\\frac12 u_i h(x_i)^2$ term entirely, you're left with $\\sum_i g_i h(x_i)$ — minimized (very loosely) by just pointing $h$ in the negative-gradient direction, which is exactly the plain gradient boosting recipe from two slides ago. XGBoost's 2nd-order term is the precise mathematical upgrade on top of that.</p>
    <h4>Why not 3rd order, 4th order, ...?</h4>
    <p>Each additional order needs an additional derivative computed at every single training point, every single round — the cost compounds fast for limited benefit, since 2nd order already captures "how much to trust a large step" (via curvature) reasonably well. Diminishing returns kick in quickly.</p>
    <h4>What $g_i$ and $u_i$ actually are for squared error</h4>
    <p>For $L=\\frac12(y-F)^2$: $g_i = F_{m-1}(x_i)-y_i$ (the negative residual) and $u_i=1$ (constant curvature, the same for every point). Plugging $u_i=1$ into the formulas on the next two slides recovers a very simple, clean special case worth checking by hand.</p>
  `}
},
{
  code:'M-15', accent:C.gold,
  title:'XGBoost, Part 2 — Deriving the Optimal Leaf Value',
  subtitle:'the M-03 recipe, one more time, now on the objective from the last slide',
  caption:'This closed-form answer is why XGBoost never has to search or guess a leaf&rsquo;s output — it just computes it.',
  steps:[
    { label:'① Group points by which leaf they land in', eq:String.raw`$$\text{Obj} = \sum_{j=1}^T \left[\Big(\sum_{i\in I_j} g_i\Big) w_j + \tfrac12\Big(\sum_{i\in I_j} u_i + \lambda\Big) w_j^2\right] + \gamma T$$`,
      expl:'Every point landing in leaf j gets the exact same output $w_j$ — that is the definition of a leaf. So instead of one term per training point, we can collapse the sum into one term per leaf, adding up all the $g_i$ and $u_i$ that fall into it.' },
    { label:'② Simplify notation — this is now just a parabola in one variable', eq:String.raw`$$G_j = \sum_{i\in I_j} g_i, \qquad H_j = \sum_{i\in I_j} u_i \qquad\Longrightarrow\qquad \text{Obj}_j = G_j\, w_j + \tfrac12(H_j+\lambda)\,w_j^2$$`,
      expl:'Renaming the sums as $G_j$ and $H_j$ reveals the shape underneath: this is exactly $c_1 w + c_2 w^2$ &mdash; a parabola in the single variable $w_j$, no different in form from $f(w)=(w-3)^2$ back in the calculus warm-up.' },
    { label:'③ Apply the derivative = 0 recipe, one algebra line at a time', eq:String.raw`$$\begin{aligned}
\frac{d\,\text{Obj}_j}{dw_j} &= G_j + (H_j+\lambda)\,w_j \;=\; 0\\[6pt]
(H_j+\lambda)\,w_j &= -G_j\\[6pt]
w_j^\* &= -\frac{G_j}{H_j+\lambda}
\end{aligned}$$`,
      expl:'Line 1: differentiate $G_jw_j+\\tfrac12(H_j+\\lambda)w_j^2$ term by term (power rule: derivative of $cw^2$ is $2cw$, the $\\tfrac12$ cancels the 2), set to 0. Line 2: move $G_j$ to the other side. Line 3: divide. Same three moves as every other derivation in this deck &mdash; write, differentiate, solve.' },
    { label:'④ Sanity check with the squared-error special case (u=1)', eq:String.raw`$$H_j = |I_j| \ \ (\text{count of points in the leaf}) \quad\Longrightarrow\quad w_j^\* = -\frac{G_j}{|I_j|+\lambda} \approx \text{average residual in the leaf}$$`,
      expl:'With no regularization ($\\lambda=0$) this is exactly &ldquo;the leaf&rsquo;s output equals the average residual of the points inside it&rdquo; &mdash; matching the plain gradient boosting intuition from two sections ago. $\\lambda>0$ pulls that average gently toward zero, which is what &ldquo;regularization&rdquo; means here, concretely.' },
  ],
  diagramBuild(svg){
    svg.appendChild(fadeIn(labelText(240,26,'Obj(w) for one leaf',{'font-size':12,fill:C.dim,'font-family':'IBM Plex Mono'}),0,0.5));
    const G=6, H=4, lam=1;
    function obj(w){ return G*w + 0.5*(H+lam)*w*w; }
    const toXY=(w)=>[240+w*70, 300+obj(w)*10];
    const ws=[]; for(let w=-3;w<=1.4;w+=0.1) ws.push(w);
    const d=ws.map((w,i)=>`${i===0?'M':'L'}${toXY(w)[0]},${toXY(w)[1]}`).join(' ');
    svg.appendChild(drawPath(path(d,{stroke:C.gold,'stroke-width':2.2}),0.4,1.4));
    const wstar=-G/(H+lam);
    const [sx,sy]=toXY(wstar);
    svg.appendChild(fadeIn(line(sx,60,sx,sy,C.rose,{'stroke-width':1.3,'stroke-dasharray':'4,3'}),2.0,0.5));
    svg.appendChild(popIn(circle(sx,sy,6,C.rose),2.4,0.4));
    svg.appendChild(fadeIn(labelText(sx,sy+26,'w* = −G/(H+λ) = '+wstar.toFixed(2),{'font-size':10.5,fill:C.rose,'font-family':'IBM Plex Mono'}),2.8,0.5));
    svg.appendChild(fadeIn(labelText(240,340,'the minimum of the parabola — found by setting the slope to 0',{'font-size':10,fill:C.dim,'font-family':'IBM Plex Mono'}),3.3,0.5));
  },
  notes:{ title:'Worked numbers and a deeper look at regularization', html:`
    <h4>Worked numbers</h4>
    <p>A leaf collects 4 points with gradients $[2,3,-1,2]$: $G=6$. With $H=4,\\lambda=1$: $w^\\*=-6/5=-1.2$. Without regularization ($\\lambda=0$): $w^\\*=-6/4=-1.5$. Regularization pulled the leaf&rsquo;s output 20% closer to zero &mdash; visible in the diagram as the minimum shifting slightly right of where it would sit for $\\lambda=0$.</p>
    <h4>Why this is called "L2" regularization</h4>
    <p>The penalty term is $\\frac12\\lambda w_j^2$ &mdash; a squared penalty on the weight, structurally identical to L2/ridge regularization in linear regression. It grows faster for large $|w_j|$ than for small ones, so it disproportionately reins in the most extreme leaf outputs.</p>
    <h4>Second derivative check (why this is a minimum, not a maximum)</h4>
    <p>The second derivative of $\\text{Obj}_j$ with respect to $w_j$ is $H_j+\\lambda$, which is always positive (curvatures $u_i$ and $\\lambda$ are both non-negative) &mdash; confirming the parabola opens upward, so the flat point we found really is the minimum, not a maximum.</p>
  `}
},
{
  code:'M-16', accent:C.gold,
  title:'XGBoost, Part 3 — Deriving the Gain Formula',
  subtitle:'plug w* back in to get a leaf&rsquo;s best-possible score, then compare one leaf to two',
  caption:'This is the exact formula behind every split decision a trained XGBoost model has ever made.',
  steps:[
    { label:'① Plug w* back into the objective to get a leaf&rsquo;s best-possible score', eq:String.raw`$$\text{Obj}_j^\* = G_jw_j^\* + \tfrac12(H_j+\lambda)(w_j^\*)^2 = -\frac{G_j^2}{H_j+\lambda} + \tfrac12\frac{G_j^2}{H_j+\lambda} = -\tfrac12\,\frac{G_j^2}{H_j+\lambda}$$`,
      expl:'Substituting $w_j^\\*=-G_j/(H_j+\\lambda)$ into the formula from the last slide and simplifying (the two fractions combine since both have the same denominator). Since this is a loss, <b>more negative is better</b>.' },
    { label:'② Compare: score if we keep one leaf, vs. score if we split it into two', eq:String.raw`$$\text{score(no split)} = -\tfrac12\frac{(G_L+G_R)^2}{H_L+H_R+\lambda} \qquad\quad \text{score(split into L, R)} = -\tfrac12\frac{G_L^2}{H_L+\lambda} -\tfrac12\frac{G_R^2}{H_R+\lambda}$$`,
      expl:'If we split one leaf into a left child and a right child, each child gets its own optimal weight and its own score, computed with the exact ① formula &mdash; just using only the points that landed on that side.' },
    { label:'③ Gain = how much splitting actually helps, minus the toll for adding a leaf', eq:String.raw`$$\text{Gain} = \underbrace{\text{score(children)} - \text{score(no split)}}_{\text{improvement from splitting}} \;-\; \gamma \;=\; \tfrac12\left[\frac{G_L^2}{H_L+\lambda}+\frac{G_R^2}{H_R+\lambda}-\frac{(G_L+G_R)^2}{H_L+H_R+\lambda}\right]-\gamma$$`,
      expl:'The minus signs from ① and ② flip when we compute "improvement," turning this back into a quantity where <b>positive is good</b>. A split only happens if Gain &gt; 0 &mdash; the question &ldquo;is this split even worth it&rdquo; is now baked directly into one formula, not bolted on afterward as a separate pruning heuristic.' },
  ],
  notes:{ title:'Tracing the sign flip and a worked example', html:`
    <h4>Why the signs flip between step ① and step ③</h4>
    <p>$\\text{Gain}$ is defined as "how much better the children's combined score is than the parent's," i.e. $-(\\text{score(children)}) - (-(\\text{score(no split)}))$ flipped to read as an improvement — algebraically this is exactly $\\text{score(no split)} - \\text{score(children)}$ with the leading $-\\tfrac12$ factored out and the fractions swapping into the more familiar "children minus parent" order shown in step ③.</p>
    <h4>Worked numbers</h4>
    <p>$G_L=-4,H_L=6,\\ G_R=5,H_R=5,\\ \\lambda=1,\\gamma=1$: $\\text{Gain} = \\tfrac12\\big[\\tfrac{16}{7}+\\tfrac{25}{6}-\\tfrac{1}{12}\\big]-1 \\approx \\tfrac12[2.29+4.17-0.08]-1 \\approx 2.19$. Positive Gain &rarr; the split is kept. A near-even, low-information split typically yields a bracket term smaller than $\\gamma$, giving negative Gain &rarr; the split is rejected and that branch is pruned.</p>
    <h4>The big picture</h4>
    <p>You have now derived, from a single starting loss function and two applications of calculus, the entire mathematical engine behind one of the most widely used machine learning algorithms in the world. Nothing in XGBoost's objective is arbitrary &mdash; every piece traces back to these few lines of algebra.</p>
  `}
},
{
  code:'M-17', accent:C.blue,
  title:'Four Patterns You Now Recognize Everywhere',
  subtitle:'every "new" formula you meet from here on is very likely reusing one of these four moves',
  caption:'You did not just memorize formulas in this deck — you now have the tools to derive new ones yourself.',
  steps:[
    { label:'Pattern 1 — Sum &amp; average', eq:String.raw`$$\frac1n\sum_i(\cdot)$$`,
      expl:'Appeared in: the ensemble prediction formula, wisdom-of-crowds variance shrinkage, OOB error, feature importance, every &ldquo;combine B models&rdquo; step in this entire topic.' },
    { label:'Pattern 2 — Variance of a sum needs independence to add cleanly', eq:String.raw`$$\text{Var}(X+Y)=\text{Var}(X)+\text{Var}(Y)+2\,\text{Cov}(X,Y)$$`,
      expl:'Appeared in: the bias-variance decomposition, and the &rho;&sigma;&sup2; correlation floor &mdash; the precise reason Random Forest hides features at every split, and why stacking mixes structurally different algorithms.' },
    { label:'Pattern 3 — Set the derivative to zero to optimize', eq:String.raw`$$f'(x^\*)=0$$`,
      expl:'Appeared in: AdaBoost&rsquo;s &alpha;, and XGBoost&rsquo;s optimal leaf weight w*. Any time you see a clean, closed-form &ldquo;optimal&rdquo; formula anywhere in machine learning, this is very likely how it was found.' },
    { label:'Pattern 4 — Taylor expansion to approximate locally', eq:String.raw`$$f(x)\approx f(a)+f'(a)(x-a)+\tfrac12f''(a)(x-a)^2$$`,
      expl:'Appeared in: XGBoost&rsquo;s regularized objective. Gradient boosting&rsquo;s &ldquo;fit the negative gradient&rdquo; trick is quietly the 1st-order version of this exact same idea &mdash; XGBoost just kept one more term.' },
  ],
  diagramBuild(svg){
    const items=[
      {y:80,label:'Σ average',color:C.blue},
      {y:170,label:'Var(X+Y) needs independence',color:C.green},
      {y:260,label:"f'(x*)=0",color:C.amber},
      {y:350,label:'Taylor expansion',color:C.gold},
    ];
    svg.appendChild(fadeIn(labelText(240,26,'four tools, reused constantly',{'font-size':12,fill:C.dim,'font-family':'IBM Plex Mono'}),0,0.5));
    items.forEach((it,i)=>{
      const g=grp({transform:`translate(240,${it.y})`});
      g.appendChild(rect(-170,-22,340,44,'#12161b',{stroke:it.color,'stroke-width':1.8,rx:8}));
      const t=E('text',{x:0,y:6,'text-anchor':'middle','font-size':13,fill:it.color,'font-family':'IBM Plex Mono'}); t.textContent=it.label; g.appendChild(t);
      svg.appendChild(popIn(g,0.3+i*0.6,0.5));
      pulse(g, 1.0+i*0.6, 2.2);
    });
  },
  notes:{ title:'Where to go from here', html:`
    <h4>Read an ML paper&rsquo;s math section</h4>
    <p>Next time you open a paper introducing a new boosting variant, a new regularizer, or a new loss function, you will recognize these four moves doing most of the work &mdash; the paper's derivation is very likely: define a loss, maybe Taylor-expand it, take a derivative, set it to zero, solve.</p>
    <h4>Derive something yourself</h4>
    <p>Try deriving the optimal leaf weight for a different loss function (e.g. absolute error, or log-loss) using exactly the M-15 recipe. The algebra changes; the four-step recipe does not.</p>

  `}
},
];
