<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathematics & Beyond — Course</title>
<style>
  :root{ --bg:#08080a; --panelbg:#0d0d10; --gridax:#33343d; --line:#20212a; --faintgrid:#141519;
    --text:#dcdce2; --text2:#8b8c96; --faint:#5a5b64;
    --blue:#6d97c4; --amber:#c7a25b; --green:#7ea87e; --rose:#bd7f86; --purple:#9385bf; --teal:#6fa39b; --grey:#6b6c76; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:var(--bg); overflow:hidden;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text); -webkit-font-smoothing:antialiased;}
  #fit{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  #stage{width:1280px; height:720px; position:relative; transform-origin:center center; background:var(--bg); overflow:hidden;}
  svg{position:absolute; inset:0; width:1280px; height:720px;}
  .boardframe{position:absolute; left:48px; top:80px; width:772px; height:548px; border:1px solid #131418; border-radius:12px;}
  #panel{position:absolute; left:872px; top:56px; width:372px; height:608px; display:flex; flex-direction:column;}
  .kicker{font-size:13px; letter-spacing:.2em; color:var(--faint); text-transform:uppercase; font-weight:600;}
  .idea{font-size:27px; line-height:1.16; font-weight:600; margin-top:12px; letter-spacing:-.01em;}
  .theory{font-size:15px; line-height:1.55; color:var(--text2); margin-top:15px;}
  .theory b{color:var(--text); font-weight:600;}
  .theory .c-blue{color:var(--blue);} .theory .c-amber{color:var(--amber);} .theory .c-green{color:var(--green);}
  .theory .c-purple{color:var(--purple);} .theory .c-rose{color:var(--rose);} .theory .c-teal{color:var(--teal);}
  .mathbox{margin-top:15px; padding:11px 14px; background:#0b0b0e; border:1px solid var(--line); border-radius:8px;
    font-size:15.5px; color:var(--text); font-family:"Cambria Math","Georgia",serif; line-height:1.5;}
  .mathbox .mut{color:var(--text2);}
  .practice{margin-top:15px; font-size:13.5px; line-height:1.5; color:var(--text2);}
  .practice .chip{display:inline-block; font-size:10px; letter-spacing:.16em; color:var(--teal);
    border:1px solid #244a45; border-radius:4px; padding:2px 7px; margin-right:8px; vertical-align:1px; font-weight:700;}
  .spacer{flex:1;}
  .beat{border-top:1px solid var(--line); padding-top:12px; margin-top:12px;}
  .recap,.gap{font-size:13.5px; line-height:1.5; display:flex; gap:9px;}
  .recap{color:var(--text2);} .gap{color:var(--rose); margin-top:8px;}
  .recap .mk{color:var(--green); font-weight:700; white-space:nowrap;} .gap .mk{color:var(--rose); font-weight:700; white-space:nowrap;}
  .fill-ribbon{position:absolute; left:48px; top:22px; width:772px; font-size:13px; color:var(--faint); opacity:0; transition:opacity .5s;}
  .fill-ribbon b{color:var(--teal); font-weight:600;}
  #nav{position:absolute; left:48px; right:36px; bottom:22px; display:flex; align-items:center; gap:14px;}
  .btn{background:#111216; border:1px solid var(--line); color:var(--text2); font-family:inherit; font-size:13px;
    padding:8px 15px; border-radius:7px; cursor:pointer; transition:.15s; user-select:none;}
  .btn:hover{border-color:#33343d; color:var(--text);} .btn:active{transform:translateY(1px);} .btn.replay{color:var(--faint);}
  #dots{display:flex; gap:4px; flex:1; align-items:center; flex-wrap:wrap;}
  .dot{width:6px; height:6px; border-radius:50%; background:#26272f; cursor:pointer; transition:.2s;}
  .dot.on{background:var(--teal); transform:scale(1.3);}
  #count{font-size:12px; color:var(--faint); min-width:58px; text-align:right;}
  .hint{position:absolute; right:36px; top:24px; font-size:11px; color:#303139; letter-spacing:.08em;}
  .modtag{position:absolute; left:48px; top:44px; font-size:12px; letter-spacing:.14em; color:var(--faint); text-transform:uppercase;}

  #mapbtn{position:absolute; left:48px; top:24px; font-size:11px; letter-spacing:.12em; color:var(--text2);
    background:#111216; border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer;}
  #mapbtn:hover{color:var(--text); border-color:#33343d;}
  #overlay{position:absolute; inset:0; background:rgba(6,6,8,.97); z-index:20; display:none; padding:40px 60px; overflow:auto;}
  #overlay.on{display:block;}
  #overlay h1{font-size:22px; font-weight:600;} #overlay .sub{color:var(--text2); font-size:13px; margin-top:6px;}
  #bar{height:6px; background:#1a1b21; border-radius:3px; margin:16px 0 6px; overflow:hidden; max-width:720px;}
  #bar>div{height:100%; background:var(--teal);} #barlbl{font-size:12px; color:var(--faint); margin-bottom:24px;}
  .mcols{column-width:340px; column-gap:36px;}
  .mod{break-inside:avoid; margin-bottom:22px;}
  .mod .h{font-size:13px; letter-spacing:.06em; font-weight:600; color:var(--text); margin-bottom:8px;}
  .mod .h .cnt{color:var(--faint); font-weight:400; font-size:12px;}
  .mod.plan .h{color:var(--faint);}
  .mod .h .st{font-size:10px; letter-spacing:.14em; margin-left:8px; padding:1px 6px; border-radius:3px;}
  .mod .st.built{color:var(--teal); border:1px solid #244a45;} .mod .st.plan{color:var(--faint); border:1px solid var(--line);}
  .mod ul{list-style:none;} .mod li{font-size:12.5px; line-height:1.7; color:var(--text2); cursor:pointer;}
  .mod li:hover{color:var(--teal);} .mod.plan li{color:#40414a; cursor:default;}
  #closex{position:absolute; right:48px; top:30px; font-size:22px; color:var(--text2); cursor:pointer;}
  #closex:hover{color:var(--text);}
  .larow{max-width:720px; margin:2px 0 26px; padding:12px 14px; background:#0b0b0e; border:1px solid var(--line);
    border-radius:8px; display:flex; align-items:center; gap:12px;}
  .larow b{color:var(--text); font-weight:600; font-size:14px;} .larow span{color:var(--text2); font-size:12.5px; flex:1;}
  .larow a{color:var(--teal); font-size:12.5px; text-decoration:none; border:1px solid #244a45; padding:6px 12px; border-radius:6px;}

  #tocsearch{width:100%; max-width:720px; margin:2px 0 22px; padding:9px 13px; background:#0b0b0e;
    border:1px solid var(--line); border-radius:8px; color:var(--text); font-family:inherit; font-size:14px; outline:none;}
  #tocsearch:focus{border-color:#33343d;}
  #tocsearch::placeholder{color:var(--faint);}
</style>
</head>
<body>
<div id="fit"><div id="stage">
    <div class="boardframe"></div>
    <svg viewBox="0 0 1280 720"><defs id="defs"></defs><g id="drawLayer"></g><g id="labelLayer"></g></svg>
    <div class="modtag" id="modtag"></div>
    <button id="mapbtn">&#9776; COURSE MAP</button>
    <div class="fill-ribbon" id="fill"></div>
    <div id="panel"></div>
    <div class="hint">&#8592; &#8594; navigate &middot; R replay &middot; M map</div>
    <div id="nav"><button class="btn" id="prev">&#8592; Prev</button><button class="btn" id="next">Next &#8594;</button>
      <button class="btn replay" id="rep">&#8635; Replay</button><div id="dots"></div><div id="count"></div></div>
    <div id="overlay"><div id="closex">&times;</div>
      <h1>Mathematics &amp; Beyond &mdash; Course Map</h1>
      <div class="sub">One animated concept per slide &middot; RECAP &rarr; GAP &rarr; FILL throughout.</div>
      <div id="bar"><div id="barfill"></div></div><div id="barlbl"></div>
      <div class="larow"><b>Linear Algebra</b><span>Flagship grid-warp deck, 14 slides — separate file (different animation core).</span><a href="essence-of-linear-algebra.html" target="_blank">Open &#8594;</a></div>
      <input id="tocsearch" placeholder="Search 588 concepts — type, then Enter to jump…" autocomplete="off">
      <div id="toc" class="mcols"></div></div>
</div></div>
<script>

const SVG="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
const defs=$("defs"), drawLayer=$("drawLayer"), labelLayer=$("labelLayer"), panel=$("panel"), fill=$("fill"), modtag=$("modtag");
const B={X0:64,Y0:96,W:740,H:520}; B.cx=B.X0+B.W/2; B.cy=B.Y0+B.H/2;
const gx=f=>B.X0+f*B.W, gy=f=>B.Y0+f*B.H;
(function(){ const cols={blue:"#6d97c4",amber:"#c7a25b",green:"#7ea87e",rose:"#bd7f86",purple:"#9385bf",teal:"#6fa39b",grey:"#6b6c76"};
  for(const k in cols){ const m=document.createElementNS(SVG,"marker"); m.id="ah-"+k;
    m.setAttribute("viewBox","0 0 10 10"); m.setAttribute("refX","8"); m.setAttribute("refY","5");
    m.setAttribute("markerWidth","7"); m.setAttribute("markerHeight","7"); m.setAttribute("orient","auto-start-reverse");
    const p=document.createElementNS(SVG,"path"); p.setAttribute("d","M0,1 L9,5 L0,9 Z"); p.setAttribute("fill",cols[k]);
    m.appendChild(p); defs.appendChild(m);} })();
let _tw=new Set(), _tm=[];
function _loop(now){ for(const t of [..._tw]) t.tick(now); requestAnimationFrame(_loop); } requestAnimationFrame(_loop);
const easeIO=p=> p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const easeOut=p=> 1-Math.pow(1-p,3);
function tween({dur=800,ease=easeIO,upd,done}){ return new Promise(res=>{ const s=performance.now();
  const o={tick(n){ let p=Math.min(1,(n-s)/dur); upd&&upd(ease(p),p); if(p>=1){_tw.delete(o);done&&done();res();} }}; _tw.add(o); }); }
function wait(ms){ return new Promise(res=>{ const id=setTimeout(res,ms); _tm.push(id); }); }
function lerp(a,b,t){ return a+(b-a)*t; }
function el(tag,attrs={},parent=drawLayer){ const e=document.createElementNS(SVG,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]); parent.appendChild(e); return e; }
function fadeIn(node,dur=400){ node.setAttribute("opacity",0); return tween({dur,ease:easeOut,upd:e=>node.setAttribute("opacity",e)}); }
function clearScene(){ _tw.clear(); _tm.forEach(clearTimeout); _tm=[]; drawLayer.innerHTML=""; labelLayer.innerHTML=""; fill.style.opacity=0; }

const ART={};

ART.steps=async(a)=>{
  const size=a.size||23, lh=size*1.72, N=a.lines.length;
  const startY=B.cy-(N-1)*lh/2, x=a.align==="left"?B.X0+50:B.cx, anchor=a.align==="left"?"start":"middle";
  for(let i=0;i<N;i++){ const ln=a.lines[i];
    const t=el("text",{x,y:startY+i*lh,"text-anchor":anchor,"font-size":(ln.big?size*1.22:size),
      fill:ln.color?`var(--${ln.color})`:"var(--text)","font-family":'"Cambria Math",Georgia,serif',"font-weight":ln.big?600:400},labelLayer);
    t.textContent=ln.t; t.setAttribute("opacity",0);
    await tween({dur:300,ease:easeOut,upd:e=>t.setAttribute("opacity",e)});
    await wait(ln.pause!=null?ln.pause:280);
  } await wait(120);
};

ART.numberline=async(a)=>{
  const min=a.min,max=a.max,y=B.cy+(a.yOff||0), nx=v=>B.X0+(v-min)/(max-min)*B.W;
  const axis=el("line",{x1:B.X0,y1:y,x2:B.X0,y2:y,stroke:"var(--gridax)","stroke-width":2,"marker-end":"url(#ah-grey)","marker-start":"url(#ah-grey)"});
  await tween({dur:560,ease:easeOut,upd:e=>axis.setAttribute("x2",B.X0+e*B.W)});
  const step=a.step||1;
  for(let v=Math.ceil(min/step)*step; v<=max+1e-9; v+=step){ const x=nx(v);
    el("line",{x1:x,y1:y-6,x2:x,y2:y+6,stroke:"var(--faint)","stroke-width":1.3});
    const t=el("text",{x,y:y+26,"text-anchor":"middle","font-size":13,fill:"var(--text2)"},labelLayer); t.textContent=Math.round(v*100)/100; }
  await wait(100);
  if(a.points) for(const p of a.points){ const x=nx(p.v);
    const c=el("circle",{cx:x,cy:y,r:0,fill:`var(--${p.color||"green"})`});
    if(p.label){const t=el("text",{x,y:y-15,"text-anchor":"middle","font-size":14,fill:`var(--${p.color||"green"})`,"font-weight":600},labelLayer);t.textContent=p.label;t.setAttribute("opacity",0);fadeIn(t,300);}
    await tween({dur:230,ease:easeOut,upd:e=>c.setAttribute("r",6*e)}); }
  if(a.jumps) for(const j of a.jumps){ const x1=nx(j.from),x2=nx(j.to),mid=(x1+x2)/2,h=Math.min(72,26+Math.abs(x2-x1)*0.3);
    const path=el("path",{d:`M ${x1} ${y} Q ${mid} ${y-h} ${x2} ${y}`,fill:"none",stroke:`var(--${j.color||"blue"})`,"stroke-width":2.2,"marker-end":`url(#ah-${j.color||"blue"})`});
    let len=300; try{len=path.getTotalLength();}catch(e){} path.setAttribute("stroke-dasharray",len); path.setAttribute("stroke-dashoffset",len);
    let lt=null; if(j.label){lt=el("text",{x:mid,y:y-h-8,"text-anchor":"middle","font-size":13,fill:`var(--${j.color||"blue"})`},labelLayer);lt.textContent=j.label;lt.setAttribute("opacity",0);}
    await tween({dur:500,ease:easeIO,upd:e=>{path.setAttribute("stroke-dashoffset",len*(1-e)); if(lt)lt.setAttribute("opacity",e);}}); await wait(100); }
  await wait(120);
};

ART.plot=async(a)=>{
  const xmin=a.xmin!=null?a.xmin:-6, xmax=a.xmax!=null?a.xmax:6, ymin=a.ymin!=null?a.ymin:-6, ymax=a.ymax!=null?a.ymax:6;
  const sx=x=>B.X0+(x-xmin)/(xmax-xmin)*B.W, sy=y=>B.Y0+B.H-(y-ymin)/(ymax-ymin)*B.H;
  for(let g=Math.ceil(xmin);g<=xmax;g++){ const X=sx(g); el("line",{x1:X,y1:B.Y0,x2:X,y2:B.Y0+B.H,stroke:"var(--faintgrid)","stroke-width":1}); }
  for(let g=Math.ceil(ymin);g<=ymax;g++){ const Y=sy(g); el("line",{x1:B.X0,y1:Y,x2:B.X0+B.W,y2:Y,stroke:"var(--faintgrid)","stroke-width":1}); }
  if(ymin<=0&&ymax>=0){ const Y=sy(0); el("line",{x1:B.X0,y1:Y,x2:B.X0+B.W,y2:Y,stroke:"var(--gridax)","stroke-width":1.6,"marker-end":"url(#ah-grey)","marker-start":"url(#ah-grey)"}); }
  if(xmin<=0&&xmax>=0){ const X=sx(0); el("line",{x1:X,y1:B.Y0+B.H,x2:X,y2:B.Y0,stroke:"var(--gridax)","stroke-width":1.6,"marker-end":"url(#ah-grey)"}); }
  await wait(100);
  if(a.fns) for(const fn of a.fns){ const N=240, pad=(ymax-ymin)*0.12; let d="", pen=false;
    for(let i=0;i<=N;i++){ const x=xmin+(xmax-xmin)*i/N; let yv; try{yv=fn.f(x);}catch(e){yv=NaN;}
      if(!isFinite(yv)||yv<ymin-pad||yv>ymax+pad){ pen=false; continue; }
      const X=sx(x),Y=sy(yv); d+=(pen?` L ${X.toFixed(1)} ${Y.toFixed(1)}`:` M ${X.toFixed(1)} ${Y.toFixed(1)}`); pen=true; }
    const path=el("path",{d,fill:"none",stroke:`var(--${fn.color||"blue"})`,"stroke-width":fn.w||2.6,"stroke-linecap":"round","stroke-linejoin":"round"});
    let len=500; try{len=path.getTotalLength();}catch(e){} path.setAttribute("stroke-dasharray",len); path.setAttribute("stroke-dashoffset",len);
    await tween({dur:fn.dur||850,ease:easeOut,upd:e=>path.setAttribute("stroke-dashoffset",len*(1-e))});
    if(fn.label){ let lx=fn.lx!=null?fn.lx:xmax*0.7, ly=fn.f(lx); if(!isFinite(ly)||ly>ymax||ly<ymin) ly=(ymax+ymin)/2;
      const t=el("text",{x:sx(lx),y:sy(ly)-8,"text-anchor":"middle","font-size":15,fill:`var(--${fn.color||"blue"})`,"font-weight":600,"font-family":'"Cambria Math",Georgia,serif'},labelLayer);
      t.textContent=fn.label; t.setAttribute("opacity",0); fadeIn(t,300);} await wait(90); }
  await wait(120);
};

/* NEW: scene — moving objects, attached vectors, traced paths */
ART.scene=async(a)=>{
  if(a.ground){ const y0=gy(a.groundY||0.82); el("line",{x1:B.X0+8,y1:y0,x2:B.X0+B.W-8,y2:y0,stroke:"var(--gridax)","stroke-width":2});
    for(let hx=0;hx<24;hx++){ const xx=B.X0+14+hx*((B.W-28)/24); el("line",{x1:xx,y1:y0,x2:xx-8,y2:y0+9,stroke:"var(--line)","stroke-width":1}); } }
  if(a.statics) for(const s of a.statics){
    if(s.type==="label"){const t=el("text",{x:s.x,y:s.y,"text-anchor":s.anchor||"middle","font-size":s.size||14,fill:`var(--${s.color||"text2"})`,"font-weight":s.weight||400},labelLayer);t.textContent=s.t;}
    else if(s.type==="circleOutline"){el("circle",{cx:s.x,cy:s.y,r:s.r,fill:"none",stroke:`var(--${s.color||"line"})`,"stroke-width":1.4,"stroke-dasharray":s.dash||"4 5"});}
    else if(s.type==="dot"){el("circle",{cx:s.x,cy:s.y,r:s.r||4,fill:`var(--${s.color||"grey"})`});}
  }
  const objs=(a.objects||[]).map(o=>{ const g=el("circle",{r:o.r||15,fill:`var(--${o.color||"blue"})`,"fill-opacity":o.op!=null?o.op:0.9});
    const lab=o.label?el("text",{"text-anchor":"middle","font-size":13,fill:"var(--text)","font-weight":600},labelLayer):null;
    const tp=o.trace?el("path",{d:"",fill:"none",stroke:`var(--${o.traceColor||o.color||"teal"})`,"stroke-width":1.6,"stroke-dasharray":"2 5"}):null;
    if(o.label){lab.textContent=o.label;} return {o,g,lab,tp,pts:[]}; });
  const vecs=(a.vectors||[]).map(v=>({v, ln:el("line",{stroke:`var(--${v.color||"amber"})`,"stroke-width":3,"marker-end":`url(#ah-${v.color||"amber"})`}),
    lab:v.label?el("text",{"text-anchor":"middle","font-size":13,fill:`var(--${v.color||"amber"})`,"font-weight":600},labelLayer):null }));
  function frame(t){
    const pos=objs.map(ob=>ob.o.path(t));
    objs.forEach((ob,i)=>{ const p=pos[i]; ob.g.setAttribute("cx",p[0]); ob.g.setAttribute("cy",p[1]);
      if(ob.lab){ob.lab.setAttribute("x",p[0]);ob.lab.setAttribute("y",p[1]-((ob.o.r||15)+8));}
      if(ob.tp){ ob.pts.push(p); ob.tp.setAttribute("d", ob.pts.map((q,k)=>(k?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ")); } });
    for(const vc of vecs){ const p=pos[vc.v.obj||0]; const d=vc.v.vec(t);
      vc.ln.setAttribute("x1",p[0]);vc.ln.setAttribute("y1",p[1]);vc.ln.setAttribute("x2",p[0]+d[0]);vc.ln.setAttribute("y2",p[1]+d[1]);
      if(vc.lab){vc.lab.setAttribute("x",p[0]+d[0]/2+(vc.v.lx||0));vc.lab.setAttribute("y",p[1]+d[1]/2+(vc.v.ly||-8));} }
  }
  frame(0); await wait(a.pre!=null?a.pre:300);
  await tween({dur:a.duration||2600,ease:a.ease||(p=>p),upd:e=>frame(e)});
  await wait(a.hold!=null?a.hold:400);
};

/* ---------------- SPECS ---------------- */
const G=gy(0.8); // common ground baseline for objects (center)

ART.numberline=async(a)=>{
  const min=a.min,max=a.max,y=B.cy+(a.yOff||0), nx=v=>B.X0+(v-min)/(max-min)*B.W;
  const axis=el("line",{x1:B.X0,y1:y,x2:B.X0,y2:y,stroke:"var(--gridax)","stroke-width":2,"marker-end":"url(#ah-grey)","marker-start":"url(#ah-grey)"});
  await tween({dur:560,ease:easeOut,upd:e=>axis.setAttribute("x2",B.X0+e*B.W)});
  const step=a.step||1;
  for(let v=Math.ceil(min/step)*step; v<=max+1e-9; v+=step){ const x=nx(v);
    el("line",{x1:x,y1:y-6,x2:x,y2:y+6,stroke:"var(--faint)","stroke-width":1.3});
    const t=el("text",{x,y:y+26,"text-anchor":"middle","font-size":13,fill:"var(--text2)"},labelLayer); t.textContent=Math.round(v*100)/100; }
  await wait(100);
  if(a.intervals) for(const iv of a.intervals){ const x1=nx(iv.a), x2=nx(iv.b===Infinity?max:(iv.b===-Infinity?min:iv.b));
    const seg=el("line",{x1,y1:y-15,x2:x1,y2:y-15,stroke:`var(--${iv.color||"rose"})`,"stroke-width":4});
    await tween({dur:480,ease:easeOut,upd:e=>seg.setAttribute("x2",lerp(x1,x2,e))});
    el("circle",{cx:x1,cy:y-15,r:5,fill:iv.open?"var(--bg)":`var(--${iv.color||"rose"})`,stroke:`var(--${iv.color||"rose"})`,"stroke-width":2}); }
  if(a.points) for(const p of a.points){ const x=nx(p.v);
    const c=el("circle",{cx:x,cy:y,r:0,fill:`var(--${p.color||"green"})`});
    if(p.label){const t=el("text",{x,y:y-15,"text-anchor":"middle","font-size":14,fill:`var(--${p.color||"green"})`,"font-weight":600},labelLayer);
      t.textContent=p.label; t.setAttribute("opacity",0); fadeIn(t,300);}
    await tween({dur:230,ease:easeOut,upd:e=>c.setAttribute("r",6*e)}); }

{kicker:"M1.06 &middot; Foundations", idea:"Factors and multiples.",

{kicker:"M1.07 &middot; Foundations", idea:"Primes: the atoms.",

{kicker:"M1.08 &middot; Foundations", idea:"Every number, one prime recipe.",

{kicker:"M1.09 &middot; Foundations", idea:"GCD and LCM from primes.",

{kicker:"M1.10 &middot; Foundations", idea:"Fractions: parts of a whole.",
 theory:`A fraction <i>a/b</i> cuts a whole into <b>b</b> equal parts and takes <b>a</b> of them. The bar is literally division.`,
 math:`3/4 = three of four equal parts`,
 practice:`Probabilities, learning rates, and normalized weights are all fractions between 0 and 1.`,
 recap:`Fraction = numerator parts out of denominator pieces.`,

{kicker:"M1.11 &middot; Foundations", idea:"Equivalent fractions.",
 theory:`Multiply top and bottom by the same number and the <b>amount is unchanged</b> &mdash; just cut into more pieces. Reverse it to simplify.`,
 math:`1/2 = 2/4 = 3/6`,
 practice:`Simplifying to lowest terms keeps ratios readable and avoids overflow in code.`,
 recap:`Scaling numerator and denominator together preserves value.`,

{kicker:"M1.12 &middot; Foundations", idea:"Adding fractions.",
 theory:`Fractions only add when their pieces match. Rewrite both over a <b class="c-amber">common denominator</b>, then add the numerators.`,
 math:`1/3 + 1/6 = 2/6 + 1/6 = 1/2`,

{kicker:"M1.14 &middot; Foundations", idea:"Percentages: per hundred.",

{kicker:"M1.16 &middot; Foundations", idea:"Exponents: repeated multiplying.",
 theory:`An <b class="c-green">exponent</b> counts how many times a base multiplies itself. Small exponents, explosive growth &mdash; this is doubling.`,
 math:`2&#8309; = 2&middot;2&middot;2&middot;2&middot;2 = 32`,

{kicker:"M1.17 &middot; Foundations", idea:"Roots undo powers.",
 theory:`The <b class="c-teal">square root</b> asks "what side gives this area?"; the cube root asks the same for volume. Roots are the inverse of exponents.`,
 math:`&radic;9 = 3 &nbsp;(since 3&sup2; = 9)`,
 practice:`Vector norms (distance), standard deviation, and RMS error are all square roots.`,
 recap:`A root reverses a power &mdash; from area/volume back to the side.`,
 gap:`&radic;2 isn't any tidy fraction &mdash; does it ever fit the fraction pattern at all?`,
 fill:`The inverse of a power is a <b>root</b> &mdash; area back to side.`,

{kicker:"M1.18 &middot; Foundations", idea:"Rational vs irrational.",
 theory:`<b class="c-green">Rationals</b> are exact fractions a/b. <b class="c-rose">Irrationals</b> like &radic;2, &pi;, e never terminate or repeat &mdash; no fraction captures them.`,

 practice:`&pi; and e are irrational &mdash; every stored value is an approximation, a source of rounding error.`,
 recap:`Rational = exact fraction; irrational = non-repeating forever.`,

{kicker:"M1.19 &middot; Foundations", idea:"The real number hierarchy.",

{kicker:"M1.20 &middot; Foundations", idea:"Modular arithmetic wraps.",
 theory:`On a clock, numbers <b class="c-purple">wrap around</b> after the modulus. 9 + 8 isn't 17 &mdash; it's 5, because we loop back at 12.`,
 math:`9 + 8 &equiv; 5 (mod 12)`,

/* ===== MODULE 2 · ALGEBRA I ===== */
{kicker:"M2.01 &middot; Algebra I", idea:"A letter for an unknown number.",
 theory:`A <b class="c-blue">variable</b> is a placeholder standing for any value. It lets you state a rule once and apply it to every number at once.`,
 math:`x + 3 &nbsp;<span class="mut">(x can be anything)</span>`,
 practice:`Every parameter, weight, and hyperparameter in code is a named variable.`,
 recap:`A variable names an unknown or varying quantity.`,
 gap:`A lone letter is limited &mdash; how do we combine variables and numbers into statements?`,
 fill:`Give the unknown a name &mdash; a <b>variable</b> &mdash; and you can reason about it.`,
 art:{type:"steps",lines:[{t:"x",big:true,color:"blue"},{t:"x + 3",color:"text"},{t:"if x = 5  \u2192  8",color:"green"}]}},

{kicker:"M2.02 &middot; Algebra I", idea:"Expressions: recipes without an equals sign.",
 theory:`An <b>expression</b> combines variables, numbers, and operations into a value-recipe. Its pieces separated by + or &minus; are <b class="c-amber">terms</b>.`,
 math:`3x&sup2; &minus; 5x + 2 &nbsp;<span class="mut">(3 terms)</span>`,
 practice:`The right-hand side of any assignment is an expression evaluated at runtime.`,
 recap:`Expression = terms joined by operations, no equals sign.`,
 gap:`2x and 3x both count x's &mdash; can we merge them into one?`,
 fill:`Combine symbols and numbers into a recipe &mdash; an <b>expression</b>.`,
 art:{type:"steps",lines:[{t:"3x\u00B2 \u2212 5x + 2",big:true},{t:"term 1: 3x\u00B2",color:"amber"},{t:"term 2: \u22125x   \u00B7   term 3: +2",color:"amber"}]}},

{kicker:"M2.03 &middot; Algebra I", idea:"Combine what matches.",
 theory:`Terms with the <b>identical variable part</b> are "like" &mdash; add their coefficients. Unlike terms stay separate.`,
 math:`2x + 3x = 5x, &nbsp; 2x + 3y stays`,
 practice:`Simplifying like terms is the algebra behind summing gradients on one parameter.`,
 recap:`Add coefficients of like terms; leave unlike terms alone.`,
 gap:`What about a number multiplying a whole group in parentheses?`,
 fill:`Merge matching terms &mdash; 2x + 3x is just 5x.`,
 art:{type:"steps",lines:[{t:"2x + 3x + 4",big:true},{t:"= (2+3)x + 4",color:"text2"},{t:"= 5x + 4",color:"green"}]}},

{kicker:"M2.04 &middot; Algebra I", idea:"Multiply across a sum.",
 theory:`The <b class="c-teal">distributive law</b>: a(b + c) = ab + ac. Multiplication spreads over every term inside &mdash; the bridge between factored and expanded forms.`,
 math:`3(x + 4) = 3x + 12`,
 practice:`Expanding and its reverse, factoring, underlie polynomial and matrix manipulation.`,
 recap:`a(b+c) = ab + ac &mdash; multiply each inner term.`,
 gap:`With a rule written in x, how do we get an actual number out of it?`,
 fill:`Spread the multiplier over the group &mdash; the <b>distributive law</b>.`,
 art:{type:"steps",lines:[{t:"3(x + 4)",big:true},{t:"= 3\u00B7x + 3\u00B74",color:"teal"},{t:"= 3x + 12",color:"green"}]}},

{kicker:"M2.05 &middot; Algebra I", idea:"Plug in, compute.",
 theory:`<b>Substitution</b> replaces each variable with a value, turning an expression into a single number &mdash; a general rule producing a specific result.`,
 math:`3x + 12 &nbsp;at&nbsp; x = 5 &nbsp;&rarr;&nbsp; 27`,
 practice:`A forward pass is mass substitution &mdash; inputs plugged into the network's expression.`,
 recap:`Substitute values for variables, then evaluate.`,
 gap:`We can compute forward &mdash; but can we run it backward to find the unknown?`,
 fill:`Replace the variable with a value and evaluate &mdash; <b>substitution</b>.`,
 art:{type:"steps",lines:[{t:"3x + 12",big:true},{t:"x = 5 \u2192 3(5) + 12",color:"text2"},{t:"= 27",color:"green"}]}},

{kicker:"M2.06 &middot; Algebra I", idea:"Find the x that makes it true.",
 theory:`An <b>equation</b> asserts two expressions are equal. Solving means <b class="c-blue">isolating the variable</b> so its value is exposed.`,
 math:`2x + 3 = 11 &rarr; x = 4`,
 practice:`Solving for an unknown parameter given a constraint is the essence of calibration.`,
 recap:`An equation balances two sides; solving isolates the unknown.`,
 gap:`What exactly lets us move terms across the equals sign safely?`,
 fill:`An equation pins the unknown &mdash; solve to reveal it.`,
 art:{type:"steps",lines:[{t:"2x + 3 = 11",big:true},{t:"2x = 8",color:"text2"},{t:"x = 4",color:"green"}]}},

{kicker:"M2.07 &middot; Algebra I", idea:"Keep the scale level.",
 theory:`Whatever you do to one side, do to the other. <b class="c-amber">Inverse operations</b> (&minus;, &divide;) peel away what surrounds x while preserving equality.`,
 math:`2x + 3 = 11 &rarr; 2x = 8 &rarr; x = 4`,
 practice:`Every solver step is an inverse op on both sides &mdash; the logic of backprop's chain of undos.`,
 recap:`Apply inverse operations equally to both sides.`,
 gap:`Real problems arrive as sentences, not equations &mdash; how do we translate them?`,
 fill:`Balance both sides with inverse operations &mdash; equality is preserved.`,
 art:{type:"steps",lines:[{t:"2x + 3 = 11",big:true},{t:"\u2212 3 both sides:  2x = 8",color:"amber"},{t:"\u00F7 2 both sides:  x = 4",color:"green"}]}},

{kicker:"M2.08 &middot; Algebra I", idea:"Turn words into symbols.",
 theory:`Name the unknown, translate each phrase into algebra, then solve. <b>Modeling</b> is the real skill &mdash; the arithmetic is easy after.`,
 math:`"5 more than twice n is 17" &rarr; 2n + 5 = 17`,

{kicker:"M2.09 &middot; Algebra I", idea:"Ranges, not single points.",
 theory:`<b class="c-rose">Inequalities</b> (&lt;, &gt;, &le;, &ge;) describe a whole span of solutions. Solve like an equation &mdash; but flip the sign when multiplying/dividing by a negative.`,
 math:`2x &minus; 1 &gt; 5 &rarr; x &gt; 3`,
 practice:`Constraints (x &ge; 0, budgets, thresholds) in optimization are inequalities.`,

{kicker:"M2.11 &middot; Algebra I", idea:"Add exponents to multiply.",

{kicker:"M2.12 &middot; Algebra I", idea:"Big and small, compactly.",

{kicker:"M2.13 &middot; Algebra I", idea:"Sums of power terms.",
 theory:`A <b class="c-blue">polynomial</b> is a sum of terms a&#8345;x&#8319;. Its <b>degree</b> (highest power) controls its shape and how many roots it can have.`,

{kicker:"M2.14 &middot; Algebra I", idea:"Add termwise, multiply by distributing.",

{kicker:"IT.01 &middot; Information Theory", idea:"Information = surprise.",
 theory:`The rarer an event, the more <b class="c-teal">information</b> it carries. Shannon measured it as &minus;log p \u2014 a certain outcome tells you nothing; a 1-in-a-million one tells you a lot.`,
 math:`I(x) = &minus;log&#8322; p(x)  bits`,
 practice:`This single idea underpins compression, coding, and the loss that trains models.`,
 recap:`Information of an event = &minus;log of its probability.`,
 gap:`One event is easy \u2014 how do we measure the surprise of a whole distribution?`,
 fill:`Study information itself \u2014 rarity is <b>surprise</b>, &minus;log p.`,
 art:{type:"plot",xmin:0,xmax:1,ymin:0,ymax:6,fns:[{f:x=> x>0.02?-Math.log2(x):NaN,color:"teal",label:"\u2212log\u2082 p",lx:0.35}]}},

{kicker:"IT.02 &middot; Information Theory", idea:"Entropy.",
 theory:`<b class="c-blue">Entropy</b> is the average surprise of a source \u2014 its inherent uncertainty in bits. It peaks when outcomes are equally likely and vanishes when one is certain.`,
 math:`H = &minus;&Sigma; p log&#8322; p`,
 practice:`Entropy is the hard floor on how far data can be compressed.`,
 recap:`Entropy = average information (uncertainty), maxed at uniform.`,
 gap:`With two variables, how much uncertainty remains once we know one?`,
 fill:`Average the surprise over a source \u2014 its <b>entropy</b>.`,
 art:{type:"plot",xmin:0,xmax:1,ymin:0,ymax:1.15,fns:[{f:x=> (x>0.001&&x<0.999)? -(x*Math.log2(x)+(1-x)*Math.log2(1-x)) : 0,color:"blue",label:"H(p)",lx:0.5}],points:[{x:0.5,y:1,color:"teal",label:"max = 1 bit"}]}},

{kicker:"IT.03 &middot; Information Theory", idea:"Joint & conditional entropy.",
 theory:`<b class="c-teal">Joint entropy</b> H(X,Y) measures the uncertainty of a pair; <b class="c-amber">conditional entropy</b> H(Y|X) is what's left in Y once X is known.`,
 math:`H(X,Y) = H(X) + H(Y|X)`,
 practice:`Decision trees split on features that most reduce conditional entropy.`,
 recap:`Joint = pair uncertainty; conditional = remaining after knowing one.`,
 gap:`So how much does knowing X actually <i>reduce</i> uncertainty about Y?`,
 fill:`Uncertainty of a pair, and what remains once one is known \u2014 <b>joint & conditional entropy</b>.`,
 art:{type:"steps",lines:[{t:"H(X, Y) = H(X) + H(Y | X)",big:true,color:"teal"},{t:"H(Y | X): uncertainty in Y after learning X",color:"amber"},{t:"knowing X can only reduce (or keep) it",color:"text2"}]}},

{kicker:"IT.04 &middot; Information Theory", idea:"Mutual information.",
 theory:`<b class="c-green">Mutual information</b> is the uncertainty in Y removed by knowing X \u2014 the shared information between two variables. Zero exactly when they're independent.`,
 math:`I(X;Y) = H(Y) &minus; H(Y|X)`,
 practice:`Feature selection, representation learning, and clustering maximize mutual information.`,
 recap:`Mutual information = shared uncertainty reduced; 0 iff independent.`,
 gap:`How do we score how <i>wrong</i> a predicted distribution is versus the truth?`,
 fill:`The uncertainty one variable removes about another \u2014 <b>mutual information</b>.`,
 art:{type:"steps",lines:[{t:"I(X ; Y) = H(Y) \u2212 H(Y | X)",big:true,color:"green"},{t:"= information X and Y share",color:"teal"},{t:"I = 0  \u21D4  X, Y independent",color:"text2"}]}},

{kicker:"IT.05 &middot; Information Theory", idea:"KL divergence.",
 theory:`<b class="c-rose">KL divergence</b> measures how far a distribution q is from the truth p \u2014 the extra bits paid for using the wrong model. Always &ge; 0, and <b>asymmetric</b>.`,
 math:`D(p&#8214;q) = &Sigma; p log(p/q) &ge; 0`,
 practice:`Variational inference and model regularization (e.g. in VAEs) minimize KL.`,
 recap:`KL = extra bits from using q instead of p; &ge;0, not symmetric.`,
 gap:`What's the total cost \u2014 the source's own entropy plus that penalty?`,
 fill:`The extra bits for the wrong distribution \u2014 <b>KL divergence</b>.`,
 art:{type:"steps",lines:[{t:"D(p \u2016 q) = \u03A3 p log (p / q)",big:true,color:"rose"},{t:"\u2265 0, and = 0 only when q = p",color:"green"},{t:"asymmetric: D(p\u2016q) \u2260 D(q\u2016p)",color:"text2"}]}},

{kicker:"IT.06 &middot; Information Theory", idea:"Cross-entropy.",
 theory:`<b class="c-purple">Cross-entropy</b> is the total bits to encode p using model q: the source's own entropy plus the KL penalty. Minimizing it pushes q toward p.`,
 math:`H(p,q) = H(p) + D(p&#8214;q)`,
 practice:`Cross-entropy loss trains essentially every classifier and language model.`,
 recap:`Cross-entropy = entropy + KL; the standard training loss.`,
 gap:`If entropy is the compression floor, how do we actually reach it?`,
 fill:`Entropy plus the KL penalty \u2014 <b>cross-entropy</b>, the training loss.`,
 art:{type:"steps",lines:[{t:"H(p, q) = H(p) + D(p \u2016 q)",big:true,color:"purple"},{t:"minimize over q  \u2192  q approaches p",color:"green"},{t:"= the cross-entropy loss you train with",color:"teal"}]}},

{kicker:"P2.05 &middot; Waves", idea:"Simple harmonic motion.",

{kicker:"P2.06 &middot; Waves", idea:"Wave properties.",
 theory:`A traveling wave carries <b>energy, not matter</b>. Wavelength &lambda;, frequency f, and speed link as v = f&lambda;; amplitude sets its intensity.`,

{kicker:"P2.08 &middot; Waves", idea:"Standing waves & resonance.",

{kicker:"P2.09 &middot; Waves", idea:"Sound & the Doppler effect.",
 theory:`Sound is a <b>pressure wave</b> in a medium. A moving source bunches wavefronts ahead (higher pitch) and stretches them behind (lower) \u2014 the Doppler shift.`,

{kicker:"P2.14 &middot; Thermodynamics", idea:"Temperature & heat.",
 theory:`<b class="c-rose">Heat</b> is energy flowing from hot to cold; <b class="c-amber">temperature</b> measures the average kinetic energy of particles. They are related but not the same.`,

{kicker:"P2.15 &middot; Thermodynamics", idea:"Kinetic theory of gases.",
 theory:`A gas is countless molecules in random motion; pressure is their collisions on the walls. Temperature is literally their <b class="c-teal">mean kinetic energy</b> \u2014 with a spread of speeds.`,
 math:`&frac12;m&#8249;v&sup2;&#8250; = &#8531;/&#8322; k&#8342;T`,

{kicker:"P2.16 &middot; Thermodynamics", idea:"The laws of thermodynamics.",
 theory:`Four laws: (0) shared temperature defines equilibrium; (1) <b class="c-green">energy is conserved</b> (&Delta;U = Q &minus; W); (2) entropy never decreases; (3) absolute zero is unreachable.`,
 math:`&Delta;U = Q &minus; W`,

 recap:`0: equilibrium \u00B7 1: energy conserved \u00B7 2: entropy \u2191 \u00B7 3: 0 K unreachable.`,

{kicker:"P2.17 &middot; Thermodynamics", idea:"Entropy & time's arrow.",

 math:`S = k&#8342; ln W`,
 practice:`Why heat spreads, why perpetual motion fails, why eggs don't unscramble.`,
 recap:`Entropy = log(number of microstates); it tends to increase.`,
 gap:`If entropy always rises, can we still extract useful work from heat?`,
 fill:`Disorder dominates \u2014 rising <b>entropy</b> gives time its direction.`,
 art:{type:"steps",lines:[{t:"S = k\u1D2E ln W",big:true,color:"purple"},{t:"W = number of microscopic arrangements",color:"text2"},{t:"disorder is overwhelmingly more likely \u2192 S \u2191",color:"green"}]}},

{kicker:"P2.18 &middot; Thermodynamics", idea:"Heat engines.",

{kicker:"P2.19 &middot; Thermodynamics", idea:"Phase transitions.",

{kicker:"P2.20 &middot; Thermodynamics", idea:"Specific & latent heat.",
 theory:`<b class="c-blue">Specific heat</b> c sets how much energy raises a degree; <b class="c-teal">latent heat</b> L is the energy a phase change absorbs at constant temperature.`,

,
{kicker:"P3.01 &middot; Electromagnetism", idea:"Electric charge & field.",
 theory:`Charge comes in + and &minus;; likes repel, opposites attract. Each charge fills space with an <b class="c-blue">electric field</b> \u2014 the force per unit charge felt at every point.`,

{kicker:"P3.02 &middot; Electromagnetism", idea:"Coulomb & Gauss.",
 theory:`<b class="c-teal">Coulomb's law</b> gives the force between charges (&prop; 1/r&sup2;). <b>Gauss's law</b> restates it elegantly: the field flux through any closed surface counts the charge inside.`,
 math:`F = k q&#8321;q&#8322;/r&sup2;`,

{kicker:"P3.03 &middot; Electromagnetism", idea:"Potential & capacitance.",
 theory:`<b class="c-green">Electric potential</b> (voltage) is the potential energy per charge \u2014 the "height" of the electrical landscape. A <b>capacitor</b> stores charge and energy in a field.`,

{kicker:"P3.04 &middot; Electromagnetism", idea:"Current & Ohm's law.",

 math:`series: R&#8339;+R&#8340; &nbsp; parallel: (1/R&#8339;+1/R&#8340;)&#8315;&sup1;`,

{kicker:"P3.06 &middot; Electromagnetism", idea:"Magnetic fields.",

{kicker:"P3.08 &middot; Electromagnetism", idea:"Electromagnetic waves.",

{kicker:"P3.09 &middot; Quantum & Relativity", idea:"Special relativity.",

{kicker:"EE.02 &middot; Signals & Control", idea:"Linear time-invariant systems.",

{kicker:"EE.04 &middot; Signals & Control", idea:"Convolution.",
 theory:`The output of an LTI system is the input <b class="c-purple">convolved</b> with its impulse response \u2014 a sliding, weighted overlap. One operation captures the whole system.`,
 math:`y(t) = x(t) &lowast; h(t)`,
 practice:`It's the "conv" in convolutional networks and every digital filter.`,
 recap:`Output = input &lowast; impulse response (a sliding overlap).`,

{kicker:"EE.05 &middot; Signals & Control", idea:"Frequency response.",

{kicker:"M13.05 &middot; Analysis", idea:"Continuity (\u03B5\u2013\u03B4).",

{kicker:"DS.04 &middot; Data Science", idea:"Sampling bias.",

{kicker:"DS.05 &middot; Data Science", idea:"Sampling distribution & standard error.",

{kicker:"DS.06 &middot; Data Science", idea:"Confidence intervals.",

{kicker:"DS.07 &middot; Data Science", idea:"Hypothesis testing.",

{kicker:"DS.08 &middot; Data Science", idea:"p-values & p-hacking.",

{kicker:"DS.09 &middot; Data Science", idea:"Type I/II errors & power.",

 math:`\u03B1 (false +), \u03B2 (false \u2212), power = 1&minus;\u03B2`,

{kicker:"DS.10 &middot; Data Science", idea:"Correlation vs causation.",

{kicker:"DS.11 &middot; Data Science", idea:"A/B testing & experiments.",

{kicker:"DS.14 &middot; Data Science", idea:"Bayesian inference.",

{kicker:"DS.15 &middot; Data Science", idea:"Maximum likelihood.",

{kicker:"DS.17 &middot; Data Science", idea:"Multiple comparisons.",

function renderPanel(m){
  panel.innerHTML='<div class="kicker">'+m.kicker+'</div><div class="idea">'+m.idea+'</div><div class="theory">'+m.theory+'</div>'+
    (m.math?'<div class="mathbox">'+m.math+'</div>':'')+
    (m.practice?'<div class="practice"><span class="chip">IN PRACTICE</span>'+m.practice+'</div>':'')+
    '<div class="spacer"></div><div class="beat"><div class="recap"><span class="mk">&#10003; RECAP</span><span>'+m.recap+'</span></div>'+
    (m.gap?'<div class="gap"><span class="mk">? GAP</span><span>'+m.gap+'</span></div>':'')+'</div>';
}
let idx=-1; const dotsWrap=$("dots"), count=$("count");
SCENES.forEach((_,i)=>{ const d=document.createElement("div"); d.className="dot"; d.onclick=()=>go(i); dotsWrap.appendChild(d); });
function go(n){ n=Math.max(0,Math.min(SCENES.length-1,n)); if(n===idx) return;
  idx=n; clearScene(); const sc=SCENES[idx]; renderPanel(sc.meta);
  modtag.textContent=MODNAMES[sc.meta.kicker.split(".")[0]]||"";
  [...dotsWrap.children].forEach((d,i)=>d.classList.toggle("on",i===idx));
  count.textContent=(idx+1)+" / "+SCENES.length; sc.play(); }
function replay(){ const sc=SCENES[idx]; clearScene(); renderPanel(sc.meta); sc.play(); }
$("next").onclick=()=>go(idx+1); $("prev").onclick=()=>go(idx-1); $("rep").onclick=replay;

];
function buildTOC(){
  const toc=$("toc"); let html=""; const groups=[]; let cur=null;
  SCENES.forEach((s,i)=>{ const pf=s.meta.kicker.split(".")[0];
    if(!cur||cur.pf!==pf){ cur={pf,items:[]}; groups.push(cur);} cur.items.push({i,idea:s.meta.idea}); });
  for(const g of groups){ html+='<div class="mod"><div class="h">'+(MODNAMES[g.pf]||g.pf)+
    ' <span class="cnt">('+g.items.length+')</span><span class="st built">BUILT</span></div><ul>';
    for(const it of g.items) html+='<li data-i="'+it.i+'">'+it.idea+'</li>'; html+='</ul></div>'; }
  for(const p of PLANNED) html+='<div class="mod plan"><div class="h">'+p.n+' <span class="cnt">('+p.c+')</span><span class="st plan">PLANNED</span></div></div>';
  toc.innerHTML=html;
  toc.querySelectorAll('li[data-i]').forEach(li=>li.onclick=()=>{ go(+li.dataset.i); closeMap(); });
  const built=SCENES.length+14, total=607;
  $("barfill").style.width=(100*built/total).toFixed(1)+"%";
  $("barlbl").textContent=built+" / "+total+" concepts built  ("+(100*built/total).toFixed(0)+"%)  \u2014  "+PLANNED.reduce((a,b)=>a+b.c,0)+" still planned";
}
function openMap(){ const s=document.getElementById("tocsearch"); if(s){s.value="";s.dispatchEvent(new Event("input"));} $("overlay").classList.add("on"); } function closeMap(){ $("overlay").classList.remove("on"); }
$("mapbtn").onclick=openMap; $("closex").onclick=closeMap;
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeMap();
  else if(e.key.toLowerCase()==="m") $("overlay").classList.toggle("on");
  else if($("overlay").classList.contains("on")) return;
  else if(e.key==="ArrowRight"||e.key===" ")go(idx+1);

});
function fitStage(){ const k=Math.min(window.innerWidth/1280, window.innerHeight/720); $("stage").style.transform="scale("+k+")"; }

function wireSearch(){
  const inp=document.getElementById("tocsearch"); if(!inp) return;
  const mods=[...document.querySelectorAll("#toc .mod")];
  inp.addEventListener("input",()=>{
    const q=inp.value.trim().toLowerCase();
    for(const m of mods){
      const h=m.querySelector(".h"); const head=(h?h.textContent:"").toLowerCase();
      const lis=[...m.querySelectorAll("li")];
      if(!q){ m.style.display=""; lis.forEach(li=>li.style.display=""); continue; }
      let any=head.includes(q);
      for(const li of lis){ const hit=li.textContent.toLowerCase().includes(q)||head.includes(q); li.style.display=hit?"":"none"; if(hit) any=true; }
      m.style.display=any?"":"none";
    }
  });
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const first=[...document.querySelectorAll("#toc li[data-i]")].find(li=>li.style.display!=="none"); if(first){ go(+first.dataset.i); closeMap(); } } });
}
