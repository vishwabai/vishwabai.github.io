<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Operating Systems &amp; Concurrency — How Your Computer Really Runs</title>
<style>
  :root{
    --bg:#06090d;
    --panel:#0c131c;
    --panel2:#0f1826;
    --ink:#e8eef4;
    --muted:#8195a8;
    --dim:#4c5a68;
    --line:#1b2632;
    --blue:#5b9bd9;
    --amber:#dba05e;
    --teal:#4fb3a0;
    --rose:#c17a92;
    --violet:#9a8bd6;
    --green:#79b87a;
    --red:#c56a6a;
    --accent: var(--blue);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;}
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  #stage{
    width:1600px;height:900px;position:relative;background:
      radial-gradient(ellipse at 20% -10%, #0c1622 0%, transparent 55%),
      radial-gradient(ellipse at 100% 110%, #0a1420 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    box-shadow:0 0 0 1px #000;
    overflow:hidden;
    flex:none;
  }
  #mount{position:absolute;inset:0;}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:56px 84px 66px;}
  .eyebrow{font-size:20px;letter-spacing:5px;text-transform:uppercase;color:var(--accent);font-weight:600;opacity:.9;}
  .title{font-size:42px;font-weight:700;margin:8px 0 26px;letter-spacing:.2px;color:var(--ink);}
  .subtitle{font-size:20px;color:var(--muted);margin-top:-16px;margin-bottom:22px;font-weight:400;}
  .body{flex:1;position:relative;min-height:0;}
  .caption{font-size:16px;color:var(--dim);margin-top:14px;font-style:italic;}
  .reveal-item{opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease;}
  .reveal-item.show{opacity:1;transform:translateY(0);}
  .reveal-fast{transition-duration:.35s !important;}

  /* bullets */
  .bullets{list-style:none;margin:0;padding:0;height:100%;display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:1180px;}
  .bullets li{display:flex;align-items:flex-start;gap:18px;font-size:26px;line-height:1.4;}
  .bullets li .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:11px;box-shadow:0 0 10px color-mix(in srgb, var(--accent) 60%, transparent);}
  .bullets li .txt b{color:var(--ink);}
  .bullets li .txt{color:#cfdbe6;}
  .bullets li .sub{display:block;font-size:18px;color:var(--muted);margin-top:4px;font-weight:400;}

  /* cards */
  .cardgrid{display:grid;gap:22px;height:100%;align-content:center;}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:22px 24px;position:relative;overflow:hidden;}
  .card .ch{font-size:21px;font-weight:700;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:10px;}
  .card .cd{font-size:16.5px;color:var(--muted);line-height:1.45;}
  .card .cbar{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent);}

  /* compare table */
  table.cmp{width:100%;border-collapse:collapse;font-size:19px;}
  table.cmp th{text-align:left;color:var(--accent);font-size:17px;letter-spacing:1px;text-transform:uppercase;padding:10px 16px;border-bottom:2px solid var(--line);}
  table.cmp td{padding:14px 16px;border-bottom:1px solid var(--line);color:#d7e2ec;}
  table.cmp tr:first-child td{padding-top:20px;}
  table.cmp td:first-child{color:var(--ink);font-weight:600;}

  /* recap / gap / fill */
  .rgf{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;}
  .rgf .tag{font-size:18px;letter-spacing:6px;text-transform:uppercase;font-weight:700;padding:8px 22px;border-radius:999px;border:1px solid var(--line);}
  .rgf.recap .tag{color:var(--teal);border-color:color-mix(in srgb, var(--teal) 40%, var(--line));}
  .rgf.gap .tag{color:var(--amber);border-color:color-mix(in srgb, var(--amber) 40%, var(--line));}
  .rgf.fill .tag{color:var(--blue);border-color:color-mix(in srgb, var(--blue) 40%, var(--line));}
  .rgf .big{font-size:34px;max-width:1180px;line-height:1.45;color:var(--ink);}
  .rgf .q{font-size:30px;color:var(--amber);max-width:1100px;line-height:1.5;font-style:italic;}
  .rgf .small{font-size:19px;color:var(--muted);max-width:1000px;}
  .pulse{animation:pulseAnim 1.6s ease-in-out infinite;}
  @keyframes pulseAnim{0%,100%{opacity:.55;}50%{opacity:1;}}

  /* section divider */
  .section{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;}
  .section .kicker{font-size:22px;letter-spacing:8px;color:var(--muted);text-transform:uppercase;}
  .section .big{font-size:64px;font-weight:800;background:linear-gradient(90deg,var(--ink),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .section .sub{font-size:22px;color:var(--muted);max-width:900px;}
  .section .rule{width:120px;height:3px;background:var(--accent);border-radius:2px;}

  /* controls */
  #ui{position:absolute;left:0;right:0;bottom:0;height:0;}
  #controls{position:absolute;bottom:14px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px;pointer-events:none;z-index:20;}
  .navbtn{pointer-events:all;background:#0e1622cc;border:1px solid var(--line);color:var(--muted);font-size:15px;padding:9px 18px;border-radius:8px;cursor:pointer;transition:.2s;}
  .navbtn:hover{color:var(--ink);border-color:var(--accent);}
  #counter{pointer-events:all;color:var(--dim);font-size:14px;letter-spacing:1px;min-width:90px;text-align:center;}
  #progress{position:absolute;top:0;left:0;height:3px;background:var(--accent);transition:width .3s ease;z-index:21;}
  #progtrack{position:absolute;top:0;left:0;right:0;height:3px;background:var(--line);z-index:20;}
  .playbtn{pointer-events:all;position:absolute;right:0;bottom:0;background:#0e1622;border:1px solid var(--line);color:var(--accent);font-size:14px;padding:8px 16px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;z-index:15;}
  .playbtn:hover{border-color:var(--accent);}
  .clickzone{position:absolute;top:0;bottom:70px;width:50%;z-index:5;cursor:pointer;}
  #zoneL{left:0;} #zoneR{right:0;}
  code.f{background:#0e1622;border:1px solid var(--line);padding:2px 8px;border-radius:6px;color:var(--amber);font-family:Consolas,monospace;font-size:.92em;}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="progtrack"></div><div id="progress"></div>
    <div id="mount"></div>
    <div id="zoneL" class="clickzone"></div>
    <div id="zoneR" class="clickzone"></div>
    <div id="controls">
      <button class="navbtn" id="prevBtn">&larr; Prev</button>
      <span id="counter">1 / 1</span>
      <button class="navbtn" id="nextBtn">Next &rarr;</button>
    </div>
  </div>
</div>
<script>
const SVGNS = "http://www.w3.org/2000/svg";
function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for(const k in attrs){ if(k==='html'){e.innerHTML=attrs[k];} else if(k==='class'){e.className=attrs[k];} else e.setAttribute(k,attrs[k]); }
  kids.flat().forEach(k=>{ if(k==null)return; e.appendChild((k instanceof Node)?k:document.createTextNode(String(k))); });
  return e;
}
function s(tag, attrs={}, ...kids){
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs){ e.setAttribute(k, attrs[k]); }
  kids.flat().forEach(k=>{ if(k==null)return; e.appendChild((k instanceof Node)?k:document.createTextNode(String(k))); });
  return e;
}
function svgRoot(vb="0 0 1400 620"){ return s('svg',{viewBox:vb, width:'100%', height:'100%'}); }

function stagger(root, baseDelay=70){
  const items = root.querySelectorAll('.reveal-item');
  items.forEach((el,i)=>{ el.style.transitionDelay = (i*baseDelay)+'ms'; });
  requestAnimationFrame(()=>requestAnimationFrame(()=>items.forEach(el=>el.classList.add('show'))));
}

let _cancelSeq = null;
function playSequence(steps){
  if(_cancelSeq) _cancelSeq();
  let t=0; const timers=[];
  steps.forEach(st=>{ t+=st.delay; timers.push(setTimeout(st.fn, t)); });
  _cancelSeq = ()=>{ timers.forEach(clearTimeout); _cancelSeq=null; };
  return _cancelSeq;
}
function addPlayButton(container, label, onPlay){
  const btn = h('button',{class:'playbtn'}, '&#9654; '+label);
  btn.innerHTML = '&#9654;&nbsp; '+label;
  btn.onclick = (e)=>{ e.stopPropagation(); onPlay(); };
  container.appendChild(btn);
  return btn;
}

/* ---------- slide chrome ---------- */
function chrome(mount, accent, eyebrow, title, sub){
  mount.innerHTML='';
  const slide = h('div',{class:'slide'});
  slide.style.setProperty('--accent', accent);
  if(eyebrow) slide.appendChild(h('div',{class:'eyebrow reveal-item'}, eyebrow));
  if(title) slide.appendChild(h('div',{class:'title reveal-item'}, title));
  if(sub) slide.appendChild(h('div',{class:'subtitle reveal-item'}, sub));
  const body = h('div',{class:'body'});
  slide.appendChild(body);
  mount.appendChild(slide);
  return {slide, body};
}

/* ---------- generic layout builders ---------- */
function bulletsSlide(mount, accent, {eyebrow, title, sub, items, caption}){
  const {body} = chrome(mount, accent, eyebrow, title, sub);
  const ul = h('ul',{class:'bullets'});
  items.forEach(it=>{
    const li = h('li',{class:'reveal-item'});
    li.appendChild(h('span',{class:'dot'}));
    const txt = h('div',{class:'txt'});
    txt.innerHTML = it.h;
    if(it.d) txt.appendChild(h('span',{class:'sub', html: it.d}));
    li.appendChild(txt);
    ul.appendChild(li);
  });
  body.appendChild(ul);
  if(caption) mount.querySelector('.slide').appendChild(h('div',{class:'caption reveal-item'}, caption));
  stagger(mount);
}

function cardsSlide(mount, accent, {eyebrow, title, sub, cards, cols, caption}){
  const {body} = chrome(mount, accent, eyebrow, title, sub);
  const grid = h('div',{class:'cardgrid'});
  const n = cards.length;
  const c = cols || (n<=3?n:(n<=6?3:4));
  const rows = Math.ceil(n/c);
  grid.style.gridTemplateColumns = `repeat(${c}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  cards.forEach(cd=>{
    const card = h('div',{class:'card reveal-item'});
    card.appendChild(h('div',{class:'cbar', style:`background:${cd.color||accent}`}));
    card.appendChild(h('div',{class:'ch'}, cd.icon?cd.icon+' ':'', cd.h));
    card.appendChild(h('div',{class:'cd', html: cd.d}));
    grid.appendChild(card);
  });
  body.appendChild(grid);
  if(caption) mount.querySelector('.slide').appendChild(h('div',{class:'caption reveal-item'}, caption));
  stagger(mount);
}

function compareSlide(mount, accent, {eyebrow, title, sub, headers, rows, caption}){
  const {body} = chrome(mount, accent, eyebrow, title, sub);
  const wrap = h('div',{class:'reveal-item', style:'height:100%;display:flex;align-items:center;'});
  const table = h('table',{class:'cmp'});
  const thead = h('tr'); headers.forEach(hd=>thead.appendChild(h('th',{}, hd))); table.appendChild(h('thead',{},thead));
  const tbody = h('tbody');
  rows.forEach(r=>{ const tr=h('tr'); r.forEach(c=>{const td=h('td',{}); td.innerHTML=c; tr.appendChild(td);}); tbody.appendChild(tr); });
  table.appendChild(tbody);
  wrap.appendChild(table);
  body.appendChild(wrap);
  if(caption) mount.querySelector('.slide').appendChild(h('div',{class:'caption reveal-item'}, caption));
  stagger(mount);
}

function sectionSlide(mount, accent, {kicker, title, sub}){
  mount.innerHTML='';
  const slide = h('div',{class:'slide'}); slide.style.setProperty('--accent', accent);
  const sec = h('div',{class:'section'});
  sec.appendChild(h('div',{class:'kicker reveal-item'}, kicker));
  sec.appendChild(h('div',{class:'big reveal-item'}, title));
  sec.appendChild(h('div',{class:'rule reveal-item'}));
  if(sub) sec.appendChild(h('div',{class:'sub reveal-item'}, sub));
  slide.appendChild(sec);
  mount.appendChild(slide);
  stagger(mount, 140);
}

function rgfSlide(mount, accent, mode, {tag, big, q, small}){
  mount.innerHTML='';
  const slide = h('div',{class:'slide'}); slide.style.setProperty('--accent', accent);
  const box = h('div',{class:`rgf ${mode}`});
  box.appendChild(h('div',{class:'tag reveal-item'}, tag));
  if(big) box.appendChild(h('div',{class:'big reveal-item', html: big}));
  if(q) box.appendChild(h('div',{class:'q reveal-item pulse'}, q));
  if(small) box.appendChild(h('div',{class:'small reveal-item', html: small}));
  slide.appendChild(box);
  mount.appendChild(slide);
  stagger(mount, 160);
}

function titleSlide(mount, accent, {kicker, title, sub, foot}){
  mount.innerHTML='';
  const slide = h('div',{class:'slide'}); slide.style.setProperty('--accent', accent);
  const sec = h('div',{class:'section'});
  sec.appendChild(h('div',{class:'kicker reveal-item'}, kicker));
  sec.appendChild(h('div',{class:'big reveal-item', style:'font-size:56px;'}, title));
  sec.appendChild(h('div',{class:'rule reveal-item'}));
  if(sub) sec.appendChild(h('div',{class:'sub reveal-item'}, sub));
  if(foot) sec.appendChild(h('div',{class:'small reveal-item', style:'color:var(--dim);font-size:16px;margin-top:30px;'}, foot));
  slide.appendChild(sec);
  mount.appendChild(slide);
  stagger(mount, 160);
}

/* ---------- svg diagram primitives ---------- */
function arrowMarker(svg, color){
  const id = 'arrow-'+color.replace('#','')+'-'+Math.random().toString(36).slice(2,6);
  let defs = svg.querySelector('defs');
  if(!defs){ defs = s('defs'); svg.insertBefore(defs, svg.firstChild); }
  const m = s('marker',{id, viewBox:'0 0 10 10', refX:8, refY:5, markerWidth:6.5, markerHeight:6.5, orient:'auto-start-reverse'});
  m.appendChild(s('path',{d:'M0,0 L10,5 L0,10 z', fill:color}));
  defs.appendChild(m);
  return id;
}
function mkBox(x,y,w,h,label,color,sub){
  const g = s('g',{class:'reveal-item'});
  g.appendChild(s('rect',{x,y,width:w,height:h,rx:10,fill:'#0f1826',stroke:color,'stroke-width':2}));
  const ty = sub ? y+h/2-6 : y+h/2+6;
  const t = s('text',{x:x+w/2,y:ty,'text-anchor':'middle',fill:'#e8eef4','font-size':17,'font-weight':700});
  String(label).split('\n').forEach((ln,i)=> t.appendChild(s('tspan',{x:x+w/2, dy: i===0?0:18}, ln)) );
  g.appendChild(t);
  if(sub) g.appendChild(s('text',{x:x+w/2,y:y+h/2+16,'text-anchor':'middle',fill:'#8195a8','font-size':13}, sub));
  return g;
}
function mkCircle(cx,cy,r,label,color,sub){
  const g = s('g',{class:'reveal-item'});
  g.appendChild(s('circle',{cx,cy,r,fill:'#0f1826',stroke:color,'stroke-width':2.5}));
  g.appendChild(s('text',{x:cx,y:cy+(sub?0:6),'text-anchor':'middle',fill:'#e8eef4','font-size':16,'font-weight':700}, label));
  if(sub) g.appendChild(s('text',{x:cx,y:cy+16,'text-anchor':'middle',fill:'#8195a8','font-size':11}, sub));
  return g;
}
function mkLine(svg,x1,y1,x2,y2,color,opts={}){
  const id = opts.arrow?arrowMarker(svg,color):null;
  const attrs = {x1,y1,x2,y2,stroke:color,'stroke-width':opts.w||2.5,class:'reveal-item'};
  if(opts.dashed) attrs['stroke-dasharray']='6 5';
  if(id) attrs['marker-end']=`url(#${id})`;
  return s('line',attrs);
}
function mkCurve(svg,x1,y1,x2,y2,bend,color,opts={}){
  const id = opts.arrow?arrowMarker(svg,color):null;
  const mx=(x1+x2)/2, my=(y1+y2)/2 - bend;
  const attrs={d:`M${x1},${y1} Q${mx},${my} ${x2},${y2}`, fill:'none', stroke:color, 'stroke-width':opts.w||2.5, class:'reveal-item'};
  if(opts.dashed) attrs['stroke-dasharray']='6 5';
  if(id) attrs['marker-end']=`url(#${id})`;
  return s('path',attrs);
}
function mkLabel(x,y,text,color,size,weight){
  return s('text',{x,y,'text-anchor':'middle',fill:color||'#8195a8','font-size':size||14,'font-weight':weight||400,class:'reveal-item'}, text);
}
function mkToken(x,y,r,fill,label,tcolor){
  const g = s('g',{style:`transform:translate(${x}px,${y}px);transition:transform .9s cubic-bezier(.4,0,.2,1);`, class:'reveal-item'});
  g.appendChild(s('circle',{cx:0,cy:0,r,fill}));
  if(label) g.appendChild(s('text',{x:0,y:5,'text-anchor':'middle',fill:tcolor||'#06090d','font-size':13,'font-weight':800}, label));
  return g;
}
function moveToken(g,x,y,dur){ if(dur) g.style.transitionDuration=dur+'s'; g.style.transform = `translate(${x}px,${y}px)`; }
function setFill(el,color){ el.querySelector('circle,rect').setAttribute('fill',color); }
function diagramBody(mount, accent, opts, vb){
  const {body} = chrome(mount, accent, opts.eyebrow, opts.title, opts.sub);
  const svg = svgRoot(vb||"0 0 1400 620");
  body.appendChild(svg);
  if(opts.caption) mount.querySelector('.slide').appendChild(h('div',{class:'caption reveal-item'}, opts.caption));
  return {body, svg};
}

/* =========================================================
   DECK CONTENT — PART 1 : OPERATING SYSTEMS
   ========================================================= */
const BLUE=getComputedStyle(document.documentElement).getPropertyValue('--blue').trim()||'#5b9bd9';
const AMBER='#dba05e', TEAL='#4fb3a0', ROSE='#c17a92', VIOLET='#9a8bd6', GREEN='#79b87a', RED='#c56a6a';

const DECK = [];

DECK.push({render:(m)=>titleSlide(m,BLUE,{
  kicker:'A Feynman-style deep dive',
  title:'Operating Systems &amp; Concurrency',
  sub:'How a computer juggles thousands of things at once — and never drops one.',
  foot:'Part 1 · Operating System Concepts     —     Part 2 · Concurrency'
})});

DECK.push({render:(m)=>bulletsSlide(m,BLUE,{
  eyebrow:'The Big Idea', title:'What is an Operating System, really?',
  items:[
    {h:'Your CPU can run <b>one instruction stream at a time</b>, per core.', d:'Yet your laptop "runs" 200+ programs at once. That\'s an illusion — a very well-engineered one.'},
    {h:'The OS is a <b>resource illusionist</b>: it slices CPU time, memory, and devices into shares.', d:'Each program believes it owns the whole machine.'},
    {h:'Everything in this deck is really answering one question:', d:'"How do you give many things the appearance of happening together, safely, on hardware that can only do one thing at a time?"'}
  ],
  caption:'Feynman\'s rule: if you can\'t build the illusion from first principles, you don\'t understand it yet.'
})});

DECK.push({render:(m)=>rgfSlide(m,BLUE,'gap',{
  tag:'Gap',
  q:'A program is just instructions sitting on disk. What turns it into something the CPU can actually run — with its own memory, its own life story?',
  small:'We need a unit the OS can create, pause, resume, and destroy.'
})});

DECK.push({render:(m)=>diagramProcessAnatomy(m)});
function diagramProcessAnatomy(m){
  const {svg} = diagramBody(m,BLUE,{eyebrow:'Fill · Processes', title:'A Process = Program + Everything it needs to run',
    caption:'The OS keeps this bookkeeping in a Process Control Block (PCB): PID, state, registers, memory pointers, open files.'});
  const layers = [
    {label:'Stack', sub:'local vars, return addrs — grows down', color:ROSE, y:70, h:70},
    {label:'↕ free space', sub:'', color:'#233040', y:150, h:40, faint:true},
    {label:'Heap', sub:'malloc/new — grows up', color:VIOLET, y:200, h:70},
    {label:'Data', sub:'global / static variables', color:TEAL, y:280, h:55},
    {label:'Text (Code)', sub:'compiled instructions, read-only', color:BLUE, y:345, h:55},
  ];
  const bx=120,bw=330;
  layers.forEach(L=>{
    if(L.faint){ svg.appendChild(mkLabel(bx+bw/2, L.y+25, L.label, '#4c5a68', 13)); return; }
    svg.appendChild(mkBox(bx,L.y,bw,L.h,L.label,L.color,L.sub));
  });
  svg.appendChild(mkLabel(bx+bw/2, 55, 'Address space (per process, private)', '#8195a8', 13));

  const pcbx=560;
  svg.appendChild(mkBox(pcbx,70,340,330,'Process Control Block','#e8eef4'.replace('#e8eef4',AMBER)));
  const fields=['PID: 4127','State: RUNNING','Program Counter: 0x40110a','CPU registers (saved copy)','Memory pointers → address space','Open file table','Priority / scheduling info'];
  fields.forEach((f,i)=> svg.appendChild(mkLabel(pcbx+170, 120+i*36, f, '#cfdbe6', 15)) );

  const kx=1020;
  svg.appendChild(mkBox(kx,70,320,330,'Kernel view','#e8eef4'.replace('#e8eef4',TEAL)));
  ['Process table = array/list of PCBs','One entry per living process','OS schedules by picking a PCB','Isolation: each PCB → its own address space'].forEach((f,i)=>
    svg.appendChild(mkLabel(kx+160,130+i*70, wrapTspan(f), '#cfdbe6', 14.5)) );

  svg.appendChild(mkLine(svg,bx+bw+20,235,pcbx-15,235,'#33475b',{arrow:true,dashed:true}));
  svg.appendChild(mkLine(svg,pcbx+340+20,235,kx-15,235,'#33475b',{arrow:true,dashed:true}));
  stagger(m);
}
function wrapTspan(str){ return str; } // labels short enough; kept for future wrapping needs

DECK.push({render:(m)=>diagramProcessStates(m)});
function diagramProcessStates(m){
  const {svg} = diagramBody(m,BLUE,{eyebrow:'Processes', title:'The Five-State Life of a Process',
    caption:'Click Play to walk a process through a realistic life: it rarely runs for long before something interrupts it.'});
  const pos = { new:[130,300], ready:[430,150], running:[750,150], waiting:[750,420], term:[1080,300] };
  const labels = {new:'NEW\ncreated',ready:'READY\nwaiting for CPU',running:'RUNNING\non a core',waiting:'WAITING\nfor I/O / event',term:'TERMINATED\ndone'};
  const colors = {new:'#5b9bd9', ready:AMBER, running:GREEN, waiting:ROSE, term:'#4c5a68'};
  const nodes={};
  for(const k in pos){ const [x,y]=pos[k]; nodes[k]=mkCircle(x,y,72,labels[k],colors[k]); svg.appendChild(nodes[k]); }

function diagramGantt(m,title,caption,jobs,accent){
  const {svg} = diagramBody(m,accent,{eyebrow:'Scheduling Algorithms', title, caption});
  const total = jobs.reduce((a,j)=>Math.max(a,j.b+j.d),0);

  jobs.forEach((j,i)=>{
    const x=x0+j.b*scale, w2=j.d*scale;
    const g=s('rect',{x,y,width:w2,height:hgt,rx:8,fill:colors[i%colors.length],class:'reveal-item'});
    svg.appendChild(g);
    svg.appendChild(mkLabel(x+w2/2,y+hgt/2+7,`${j.n} (${j.d})`,'#06090d',16,700));
    svg.appendChild(mkLabel(x,y+hgt+26,String(j.b),'#8195a8',13));
  });
  svg.appendChild(mkLabel(x0+w, y+hgt+26, String(total), '#8195a8',13));
  svg.appendChild(mkLine(svg,x0,y+hgt+8,x0+w,y+hgt+8,'#33475b',{}));
  stagger(m);
}
function diagramGanttRR(m){
  const {svg} = diagramBody(m,AMBER,{eyebrow:'Scheduling Algorithms', title:'Round Robin — Time Slicing for Fairness',
    caption:'Quantum too small → wasted time on context switches. Too large → degrades toward FCFS. Practical OSes tune this (~1–10ms).'});
  const quantum=2; const jobs=[{n:'P1',rem:5},{n:'P2',rem:3},{n:'P3',rem:2}];
  const colors={'P1':BLUE,'P2':TEAL,'P3':ROSE};
  const x0=100,y=260,hgt=80,scale=42; let x=x0;
  const q=[...jobs]; let t=0;
  svg.appendChild(mkLabel(x0+500,220,'Each job gets a fixed quantum (2 units), then rotates to the back of the queue','#8195a8',15));
  let guard=0;
  while(q.some(j=>j.rem>0) && guard<20){
    guard++;
    const j = q.find(j=>j.rem>0);
    const run = Math.min(quantum, j.rem);
    svg.appendChild(s('rect',{x,y,width:run*scale,height:hgt,rx:6,fill:colors[j.n],class:'reveal-item'}));
    svg.appendChild(mkLabel(x+run*scale/2,y+hgt/2+6,j.n,'#06090d',15,700));
    x += run*scale; j.rem-=run;
    q.push(q.splice(q.indexOf(j),1)[0]);
  }
  svg.appendChild(mkLine(svg,x0,y+hgt+8,x,y+hgt+8,'#33475b',{}));
  stagger(m);
}

/* =========================================================
   ENGINE BOOTSTRAP — navigation, scaling, keyboard/click
   ========================================================= */
let idx = 0;
const mountEl = document.getElementById('mount');
const counterEl = document.getElementById('counter');
const progressEl = document.getElementById('progress');

function render(i){
  if(_cancelSeq) _cancelSeq();
  idx = Math.max(0, Math.min(DECK.length-1, i));
  DECK[idx].render(mountEl);
  counterEl.textContent = (idx+1)+' / '+DECK.length;
  progressEl.style.width = (100*(idx+1)/DECK.length)+'%';
}
function next(){ if(idx < DECK.length-1) render(idx+1); }
function prev(){ if(idx > 0) render(idx-1); }

document.getElementById('nextBtn').onclick = next;
document.getElementById('prevBtn').onclick = prev;
document.getElementById('zoneR').onclick = next;
document.getElementById('zoneL').onclick = prev;
window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.key==='Home'){ render(0); }
  else if(e.key==='End'){ render(DECK.length-1); }
});

function fitStage(){
  const stage = document.getElementById('stage');
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw/1600, vh/900);
  stage.style.transform = `scale(${scale})`;
  stage.style.transformOrigin = 'center center';
}
window.addEventListener('resize', fitStage);
fitStage();
render(0);
</script>
