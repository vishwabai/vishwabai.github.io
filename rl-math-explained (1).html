<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Math Behind RL — Built From First Principles</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#07070b;
    --teal:#5fd0c3;
    --amber:#e8a765;
    --blue:#6fa8dc;
    --pink:#e08a9c;
    --purple:#a98fd2;
    --green:#7cc48f;
    --text:#e9e8f0;
    --dim:#8b8a9a;
    --hair:#232230;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;background:var(--bg);color:var(--text);
    height:100%;overflow:hidden;
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #deck{position:relative;width:100vw;height:100vh;}
  #slide-container{position:absolute;inset:0;}
  canvas#scene{position:absolute;inset:0;width:100%;height:100%;display:block;}

  #overlay{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;}

  #headerBlock{
    padding:34px 60px 0 60px;
    background:linear-gradient(to bottom, rgba(7,7,11,0.92) 0%, rgba(7,7,11,0.55) 70%, rgba(7,7,11,0) 100%);
    padding-bottom:30px;
  }
  #eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:3px;text-transform:uppercase;
    color:var(--dim); margin-bottom:8px;
    opacity:0; transform:translateY(-6px);
    transition:opacity .5s ease, transform .5s ease;
  }
  #slideTitle{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:clamp(24px,3vw,40px);
    margin:0;
    letter-spacing:0.2px;
    opacity:0; transform:translateY(-8px);
    transition:opacity .55s ease .05s, transform .55s ease .05s;
  }
  #headerBlock.show #eyebrow, #headerBlock.show #slideTitle{opacity:1; transform:translateY(0);}

  #footerBlock{
    padding:0 60px 38px 60px;
    background:linear-gradient(to top, rgba(7,7,11,0.94) 0%, rgba(7,7,11,0.6) 65%, rgba(7,7,11,0) 100%);
    padding-top:36px;
  }
  #slideText{
    font-size:clamp(13.5px,1.15vw,17px);
    line-height:1.55;
    color:var(--text);
    max-width:820px;
    opacity:0; transform:translateY(8px);
    transition:opacity .5s ease .12s, transform .5s ease .12s;
  }
  #formula{
    margin-top:12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:clamp(12.5px,1.05vw,16px);
    color:var(--teal);
    letter-spacing:0.3px;
    padding:9px 15px;
    display:inline-block;
    border:1px solid var(--hair);
    border-radius:8px;
    background:rgba(95,208,195,0.045);
    opacity:0; transform:translateY(8px);
    transition:opacity .5s ease .2s, transform .5s ease .2s;
  }
  #formula:empty{display:none;}
  #footerBlock.show #slideText, #footerBlock.show #formula{opacity:1; transform:translateY(0);}

  #navBar{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:16px;
    background:rgba(14,14,20,0.75);
    border:1px solid var(--hair);
    padding:9px 16px; border-radius:30px;
    backdrop-filter:blur(8px);
    pointer-events:auto;
    z-index:20;
  }
  .navBtn{
    background:none;border:1px solid var(--hair); color:var(--text);
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; font-size:16px; transition:background .2s, border-color .2s, transform .15s;
  }
  .navBtn:hover{background:rgba(95,208,195,0.12); border-color:var(--teal); transform:scale(1.06);}
  .navBtn:active{transform:scale(0.94);}
  #counter{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--dim); min-width:58px; text-align:center;}
  #progressWrap{position:absolute; top:0; left:0; right:0; height:3px; background:rgba(255,255,255,0.05); z-index:20;}
  #progressBar{height:100%; width:0%; background:linear-gradient(90deg,var(--teal),var(--blue)); transition:width .4s ease;}
  #sectionTag{
    position:absolute; top:22px; right:28px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:2px;
    color:var(--dim); text-transform:uppercase;
    border:1px solid var(--hair); padding:6px 12px; border-radius:20px;
    background:rgba(255,255,255,0.02);
    z-index:15;
  }
  .kbd-hint{
    position:absolute; bottom:16px; right:24px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim);
    opacity:0.55; pointer-events:none; z-index:5;
  }
  @media (max-width:700px){
    #headerBlock{padding:24px 20px 22px 20px;}
    #footerBlock{padding:0 20px 82px 20px;}
    .kbd-hint{display:none;}
  }
</style>
</head>
<body>
<div id="deck">
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="sectionTag">Section</div>
  <div id="slide-container">
    <canvas id="scene"></canvas>
    <div id="overlay">
      <div id="headerBlock">
        <div id="eyebrow"></div>
        <h1 id="slideTitle"></h1>
      </div>
      <div id="footerBlock">
        <div id="slideText"></div>
        <div id="formula"></div>
      </div>
    </div>
  </div>
  <span class="kbd-hint">← → or space to advance · r to replay</span>
  <div id="navBar">
    <button class="navBtn" id="prevBtn" title="Previous">‹</button>
    <span id="counter">01 / 27</span>
    <button class="navBtn" id="replayBtn" title="Replay animation">↺</button>
    <button class="navBtn" id="nextBtn" title="Next">›</button>
  </div>
</div>

<script>
/* =========================================================
   CORE ANIMATION UTILITIES
========================================================= */
const TAU = Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOutCubic=t=>{t=clamp(t,0,1);return 1-Math.pow(1-t,3);};
const easeInCubic=t=>{t=clamp(t,0,1);return t*t*t;};
const easeInOutCubic=t=>{t=clamp(t,0,1);return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const easeOutBack=t=>{t=clamp(t,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const smoothstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const pulse=(t,period)=> (Math.sin((t/period)*TAU-Math.PI/2)+1)/2;
const segT=(t,start,dur)=> clamp((t-start)/dur,0,1);

function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function box(ctx,x,y,w,h,opt={}){
  const {fill='rgba(95,208,195,0.06)',stroke='#5fd0c3',lw=1.6,r=14,alpha=1,dashed=false}=opt;
  ctx.save();
  ctx.globalAlpha=alpha;
  if(dashed) ctx.setLineDash([5,5]);
  roundRect(ctx,x-w/2,y-h/2,w,h,r);
  ctx.fillStyle=fill; ctx.fill();
  ctx.lineWidth=lw; ctx.strokeStyle=stroke; ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function label(ctx,x,y,text,opt={}){
  const {size=17,color='#e9e8f0',align='center',baseline='middle',weight='500',font="'Inter',sans-serif",alpha=1}=opt;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  ctx.font=`${weight} ${size}px ${font}`;
  ctx.textAlign=align;
  ctx.textBaseline=baseline;
  ctx.fillText(text,x,y);
  ctx.restore();
}

function arrow(ctx,x1,y1,x2,y2,opt={}){
  const {color='#e9e8f0',lw=2,progress=1,dashed=false,headSize=8,alpha=1}=opt;
  const p=clamp(progress,0,1);
  const ex=lerp(x1,x2,p), ey=lerp(y1,y2,p);
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw;
  if(dashed) ctx.setLineDash([6,6]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.setLineDash([]);
  if(p>0.02){
    const ang=Math.atan2(ey-y1,ex-x1);
    ctx.beginPath();
    ctx.moveTo(ex,ey);
    ctx.lineTo(ex-headSize*Math.cos(ang-0.4), ey-headSize*Math.sin(ang-0.4));
    ctx.lineTo(ex-headSize*Math.cos(ang+0.4), ey-headSize*Math.sin(ang+0.4));
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  return {x:ex,y:ey};
}

function curvedArrow(ctx,x1,y1,x2,y2,curvature,opt={}){
  const {color='#e9e8f0',lw=2,progress=1,alpha=1,headSize=8}=opt;
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const dx=x2-x1, dy=y2-y1;
  const len=Math.hypot(dx,dy)||1;
  const nx=-dy/len, ny=dx/len;
  const cx=mx+nx*curvature, cy=my+ny*curvature;
  const p=clamp(progress,0,1);
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw;
  const steps=36;
  let lastX=x1,lastY=y1, tx=0,ty=0;
  ctx.beginPath(); ctx.moveTo(x1,y1);
  const n=Math.max(1,Math.round(steps*p));
  for(let i=1;i<=n;i++){
    const s=i/steps;
    const xx=(1-s)*(1-s)*x1+2*(1-s)*s*cx+s*s*x2;
    const yy=(1-s)*(1-s)*y1+2*(1-s)*s*cy+s*s*y2;
    ctx.lineTo(xx,yy);
    lastX=xx; lastY=yy;
    tx=2*(1-s)*(cx-x1)+2*s*(x2-cx);
    ty=2*(1-s)*(cy-y1)+2*s*(y2-cy);
  }
  ctx.stroke();
  if(p>0.05){
    const ang=Math.atan2(ty,tx);
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(lastX-headSize*Math.cos(ang-0.4), lastY-headSize*Math.sin(ang-0.4));
    ctx.lineTo(lastX-headSize*Math.cos(ang+0.4), lastY-headSize*Math.sin(ang+0.4));
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  return {x:lastX,y:lastY,cx,cy};
}

function dotOnLine(ctx,x1,y1,x2,y2,t,opt={}){
  const {color='#e8a765',r=5,alpha=1,glow=0}=opt;
  const x=lerp(x1,x2,t), y=lerp(y1,y2,t);
  ctx.save(); ctx.globalAlpha=alpha;
  if(glow){ ctx.shadowColor=color; ctx.shadowBlur=glow; }
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  ctx.restore();
  return {x,y};
}

function fadeAlpha(t,start,dur){ return smoothstep(segT(t,start,dur)); }

/* =========================================================
   FORMULA DECOMPOSITION HELPER
   Draws a formula as separately-colored inline parts (monospace),
   returns each part's center position so callers can draw leader
   lines + annotation callouts pointing at individual terms.
========================================================= */
function drawFormulaParts(ctx, cx, y, parts, opt={}){
  const {size=24, font="'IBM Plex Mono',monospace", weight='600', alpha=1} = opt;
  ctx.save();
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textBaseline='alphabetic';
  const widths = parts.map(p=>ctx.measureText(p.text).width);
  const total = widths.reduce((a,b)=>a+b,0);
  let x = cx - total/2;
  const positions=[];
  parts.forEach((p,i)=>{
    const a = (p.alpha===undefined?1:p.alpha) * alpha;
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color || '#e9e8f0';
    ctx.textAlign='left';
    ctx.fillText(p.text, x, y);
    positions.push({x: x+widths[i]/2, y, w:widths[i], alpha:a});
    x += widths[i];
  });
  ctx.restore();
  return positions;
}

// Draws a leader line from a formula-part position down (or up) to an annotation label.
function calloutBelow(ctx, part, note, opt={}){
  const {color='#e9e8f0', dropY=46, size=12.5, alpha=1, dashed=true, maxWidth=220} = opt;
  const a = alpha * (part.alpha===undefined?1:part.alpha);
  if(a<=0.01) return;
  ctx.save();
  ctx.globalAlpha=a*0.7;
  ctx.strokeStyle=color; ctx.lineWidth=1.3;
  if(dashed) ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.moveTo(part.x, part.y+8); ctx.lineTo(part.x, part.y+dropY-10); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(part.x, part.y+8, 2.6, 0, TAU); ctx.fillStyle=color; ctx.fill();
  ctx.restore();
  wrapLabel(ctx, part.x, part.y+dropY+4, note, {size, color, alpha:a, maxWidth});
}
function calloutAbove(ctx, part, note, opt={}){
  const {color='#e9e8f0', riseY=42, size=12.5, alpha=1, dashed=true, maxWidth=220} = opt;
  const a = alpha * (part.alpha===undefined?1:part.alpha);
  if(a<=0.01) return;
  ctx.save();
  ctx.globalAlpha=a*0.7;
  ctx.strokeStyle=color; ctx.lineWidth=1.3;
  if(dashed) ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.moveTo(part.x, part.y-part_h_fallback(part)); ctx.lineTo(part.x, part.y-riseY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  wrapLabel(ctx, part.x, part.y-riseY-10, note, {size, color, alpha:a, maxWidth, anchorBottom:true});
}
function part_h_fallback(part){ return 26; }

// simple word-wrapped, center-aligned small label (used by callouts)
function wrapLabel(ctx, x, y, text, opt={}){
  const {size=12.5, color='#e9e8f0', alpha=1, font="'Inter',sans-serif", weight='500', maxWidth=220, lineHeight=15, anchorBottom=false} = opt;
  ctx.save();
  ctx.font=`${weight} ${size}px ${font}`;
  ctx.textAlign='center';
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  const words=text.split(' ');
  const lines=[];
  let cur='';
  words.forEach(w=>{
    const test=cur? cur+' '+w : w;
    if(ctx.measureText(test).width>maxWidth && cur){ lines.push(cur); cur=w; }
    else cur=test;
  });
  if(cur) lines.push(cur);
  const startY = anchorBottom ? y - (lines.length-1)*lineHeight : y;
  lines.forEach((ln,i)=> ctx.fillText(ln, x, startY + i*lineHeight));
  ctx.restore();
}

/* =========================================================
   CANVAS + BACKGROUND
========================================================= */
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
let W=0,H=0;
let stars=[];
function makeStars(){
  stars=[];
  const n=Math.floor((window.innerWidth*window.innerHeight)/26000);
  for(let i=0;i<n;i++){
    stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.2+0.3,phase:Math.random()*10});
  }
}
function resize(){
  const dpr=window.devicePixelRatio||1;
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  makeStars();
}
window.addEventListener('resize',resize);
resize();

function drawBackground(t){
  ctx.fillStyle='#07070b';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  stars.forEach(s=>{
    const tw=0.35+0.5*pulse(t+s.phase,4);
    ctx.globalAlpha=tw*0.5;
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,TAU); ctx.fill();
  });
  ctx.restore();
  ctx.save();
  ctx.globalAlpha=0.05;
  ctx.strokeStyle='#5fd0c3';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,H*0.88); ctx.lineTo(W,H*0.88); ctx.stroke();
  ctx.restore();
}

function safeZone(){
  return {top:H*0.28, bottom:H*0.80, midY:H*0.53, cx:W/2};
}

/* =========================================================
   SLIDE 1 — TITLE
========================================================= */
function renderTitle(ctx,W,H,t){
  const cx=W/2, cy=H*0.56;
  for(let i=0;i<3;i++){
    const p=((t*0.12)+i/3)%1;
    const r=30+p*300;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU);
    ctx.strokeStyle=`rgba(95,208,195,${(1-p)*0.2})`;
    ctx.lineWidth=1.4; ctx.stroke();
  }
  const symbols=['\u03a3','\ud835\udd3c','\u2207','\u2202','\u03c0','\u03b3','\u03b8','\u03b4'];
  symbols.forEach((s,i)=>{
    const ang=t*0.12+i*(TAU/symbols.length);
    const r=215;
    const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r*0.48;
    const a=0.35+0.3*pulse(t+i,3);
    label(ctx,x,y,s,{size:22,color:`rgba(169,143,210,${a})`,weight:'700',font:"'IBM Plex Mono',monospace"});
  });
}

/* =========================================================
   SLIDE 2 — SUMMATION SIGMA
========================================================= */
function renderSigma(ctx,W,H,t){
  const {midY,top}=safeZone();
  const values=[2,5,3,4];
  const n=values.length;
  const startX=W*0.24, gap=100;

  const a0=smoothstep(segT(t,0,0.5));
  label(ctx,W/2,top+20,'adding up a list of numbers, one at a time',{size:13,color:'#8b8a9a',alpha:a0});

  values.forEach((v,i)=>{
    const a=smoothstep(segT(t,0.3+i*0.55,0.45));
    const x=startX+i*gap;
    box(ctx,x,midY-40,72,58,{stroke:'#6fa8dc',fill:'rgba(111,168,220,0.06)',alpha:a,r:10});
    label(ctx,x,midY-40,String(v),{size:20,color:'#9dc1e8',weight:'700',alpha:a,font:"'IBM Plex Mono',monospace"});
    label(ctx,x,midY-78,'v'+(i+1),{size:11,color:'#8b8a9a',alpha:a,font:"'IBM Plex Mono',monospace"});
  });

  const totalX=W*0.78;
  const aTotalBox=smoothstep(segT(t,0.9,0.5));
  box(ctx,totalX,midY-40,150,72,{stroke:'#e8a765',fill:'rgba(232,167,101,0.08)',alpha:aTotalBox,r:12});
  label(ctx,totalX,midY-58,'running total',{size:11,color:'#f0cda0',alpha:aTotalBox});

  let shown=0;
  for(let i=0;i<n;i++){ if(t>1.0+i*0.55+0.5) shown=i+1; }
  const sumSoFar = values.slice(0,shown).reduce((s,v)=>s+v,0);
  label(ctx,totalX,midY-25,String(sumSoFar),{size:24,color:'#f6c98a',weight:'700',font:"'IBM Plex Mono',monospace"});

  values.forEach((v,i)=>{
    const arriveT=1.0+i*0.55;
    const p=segT(t,arriveT-0.4,0.4);
    if(p>0 && p<1){
      dotOnLine(ctx,startX+i*gap,midY-6,totalX-60,midY-8,easeInOutCubic(p),{color:'#e8a765',r:5,glow:8});
    }
  });

  const t2=t-3.6;
  if(t2<0) return;
  const a2=smoothstep(segT(t2,0,0.6));
  label(ctx,W/2,midY+55,'we write this compactly as:',{size:12.5,color:'#8b8a9a',alpha:a2});
  const parts=[
    {text:'\u03a3', color:'#e8a765'},
    {text:'\u1d62 ', color:'#8b8a9a'},
    {text:'v\u1d62', color:'#6fa8dc'},
    {text:'  =  ', color:'#8b8a9a'},
    {text: String(values.reduce((s,v)=>s+v,0)), color:'#f6c98a'},
  ];
  const positions=drawFormulaParts(ctx, W/2, midY+95, parts, {alpha:a2, size:26});
  const a3=smoothstep(segT(t2,0.6,0.5));
  if(a3>0.05){
    calloutBelow(ctx, positions[0], '"sigma" means: add up', {color:'#e8a765',alpha:a3,dropY:34,size:12});
    calloutBelow(ctx, positions[1], 'for every i in our list', {color:'#8b8a9a',alpha:a3,dropY:34,size:12});
  }
}

/* =========================================================
   SLIDE 3 — EXPECTATION E[.]
========================================================= */
function renderExpectation(ctx,W,H,t){
  const {midY,top,bottom}=safeZone();
  const outcomes=[{v:10,p:0.2,color:'#e08a9c'},{v:20,p:0.5,color:'#6fa8dc'},{v:50,p:0.3,color:'#e8a765'}];
  const cx=W*0.32;

  const a0=smoothstep(segT(t,0,0.5));
  label(ctx,W/2,top+20,'a WEIGHTED average -- likely outcomes count more',{size:13,color:'#8b8a9a',alpha:a0});

  let y=midY-80;
  outcomes.forEach((o,i)=>{
    const a=smoothstep(segT(t,0.3+i*0.5,0.45));
    box(ctx,cx,y,220,54,{stroke:o.color,fill:o.color+'12',alpha:a,r:10});
    label(ctx,cx-70,y,'value = '+o.v,{size:13,color:o.color,alpha:a,font:"'IBM Plex Mono',monospace",align:'left'});
    label(ctx,cx+60,y,'p = '+o.p,{size:13,color:'#cfcfda',alpha:a,font:"'IBM Plex Mono',monospace",align:'left'});
    y+=72;
  });

  const t2=t-2.0;
  if(t2<0) return;
  const rx=W*0.72, ry=midY-8;

/* =========================================================
   SLIDE 4 — DERIVATIVE (slope / rate of change)
========================================================= */
function renderDerivative(ctx,W,H,t){
  const {midY,top,bottom}=safeZone();
  const cx=W*0.42, cy=midY+50;
  const scale=75;
  const f = x => x*x;

  const a0=smoothstep(segT(t,0,0.5));
  ctx.save(); ctx.globalAlpha=a0; ctx.beginPath();
  for(let px=-1.5; px<=1.5; px+=0.02){
    const x=cx+px*scale, y=cy-f(px)*scale*0.55;
    if(px===-1.5) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.strokeStyle='#6fa8dc'; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore();
  label(ctx,cx+1.5*scale+50,cy-f(1.5)*scale*0.55,'f(x) = x\u00b2',{size:13,color:'#9dc1e8',alpha:a0,font:"'IBM Plex Mono',monospace"});

  const t2=t-0.6; if(t2<0) return;
  const x0=0.55;
  const cyc=3.2;
  const p=(t2%cyc)/cyc;
  const h=lerp(0.9,0.03,easeInOutCubic(p));
  const x1=x0-h, x2=x0+h;
  const y1=f(x1), y2f=f(x2);
  const slope=(y2f-y1)/(2*h);

  const toScreen=(px,py)=>({x:cx+px*scale, y:cy-py*scale*0.55});
  const P1=toScreen(x1,y1), P2=toScreen(x2,y2f);
  const dx=P2.x-P1.x, dy=P2.y-P1.y, len=Math.hypot(dx,dy)||1;
  const ux=dx/len, uy=dy/len;
  const ext=140;

  ctx.save(); ctx.strokeStyle='#e8a765'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(P1.x-ux*ext,P1.y-uy*ext); ctx.lineTo(P2.x+ux*ext,P2.y+uy*ext); ctx.stroke(); ctx.restore();
  [P1,P2].forEach(P=>{ ctx.save(); ctx.fillStyle='#e8a765'; ctx.beginPath(); ctx.arc(P.x,P.y,4,0,TAU); ctx.fill(); ctx.restore(); });

  label(ctx,cx,top+20, p<0.15?'start with two points, far apart (a "secant" line)':'squeeze them together...',{size:12.5,color:'#f0cda0'});
  label(ctx,cx,bottom-16,`h = ${h.toFixed(3)}     slope \u2248 ${slope.toFixed(2)}`,{size:13,color:'#e9e8f0',font:"'IBM Plex Mono',monospace"});
  if(p>0.85){
    label(ctx,cx,bottom-40,'as h \u2192 0, the secant becomes the TANGENT -- the true slope at that point',{size:11.5,color:'#8b8a9a'});
  }
}

/* =========================================================
   SLIDE 12 — DERIVING THE BELLMAN EQUATION
========================================================= */
function renderBellmanDerivation(ctx,W,H,t){
  const {top}=safeZone();
  const cx=W*0.5;
  const lines=[
    {eq:'V(s) = \ud835\udd3c[ G\u209c | s\u209c=s ]', note:'start from the definition on the last slide', color:'#e9e8f0'},
    {eq:'= \ud835\udd3c[ r\u209c + \u03b3G\u209c\u208a\u2081 | s\u209c=s ]', note:'substitute the recursive form of G\u209c', color:'#9dc1e8'},
    {eq:'= \ud835\udd3c[r\u209c|s] + \u03b3\ud835\udd3c[G\u209c\u208a\u2081|s]', note:'expectation splits over a sum -- linearity', color:'#e8a765', key:true},
    {eq:'= \ud835\udd3c[r\u209c|s] + \u03b3\ud835\udd3c[V(s\u209c\u208a\u2081)|s]', note:'that inner piece IS, by definition, V(s\u209c\u208a\u2081)', color:'#5fd0c3'},
    {eq:'V(s) = \ud835\udd3c[ r + \u03b3V(s\u2032) ]', note:'the Bellman equation -- value defined in terms of itself', color:'#a98fd2'}
  ];
  const startY=top+56, gap=58;
  lines.forEach((ln,i)=>{
    const t0=i*1.15;
    const a=smoothstep(segT(t,t0,0.55));
    if(a<=0) return;
    const y=startY+i*gap;
    const dy=(1-a)*14;
    const active = t>=t0 && t<t0+1.7;
    if(ln.key){
      const glow=0.5+0.5*pulse(t,1.3);
      ctx.save(); ctx.globalAlpha=a*0.9;
      roundRect(ctx,cx-360,y-dy-24,720,46,10);
      ctx.strokeStyle=`rgba(232,167,101,${0.5+0.3*glow})`; ctx.lineWidth=1.6;
      ctx.fillStyle=`rgba(232,167,101,${0.06+0.05*glow})`; ctx.fill(); ctx.stroke();
      ctx.restore();
      label(ctx,cx-352,y-dy-24+13,'KEY STEP',{size:9.5,color:'#e8a765',weight:'700',align:'left',alpha:a,font:"'IBM Plex Mono',monospace"});
    } else if(active){
      const pulseA=0.10+0.09*pulse(t-t0,1.4);
      ctx.save(); ctx.globalAlpha=a*0.9;
      roundRect(ctx,cx-340,y-dy-24,680,44,10);
      ctx.fillStyle=`rgba(255,255,255,${pulseA})`; ctx.fill();
      ctx.restore();
    }
    const dim = (active||ln.key) ? 1 : 0.5;
    label(ctx,cx,y-dy,ln.eq,{size:15,color:ln.color,font:"'IBM Plex Mono',monospace",weight:'600',alpha:a*dim});
    label(ctx,cx,y-dy+20,ln.note,{size:10.5,color:'#8b8a9a',alpha:a*dim*0.95});
  });
}

    label(ctx,(positions[1]+positions[2])/2,midY-22,'r = 5',{size:12,color:'#f0cda0',font:"'IBM Plex Mono',monospace"});
    label(ctx,W/2,midY-52,'\u03b3 = 0.9',{size:12,color:'#8b8a9a',alpha:a1,font:"'IBM Plex Mono',monospace"});
  }

  const t2=t-0.9; if(t2<0) return;

  const t3=t2-0.9; if(t3<0) return;

  const t5=t4-0.9; if(t5<0) return;
  const b4=smoothstep(segT(t5,0,0.5));
  label(ctx,W/2,top+20,'solved backward from the terminal state, one step at a time',{size:13,color:'#e9e8f0',alpha:b4});

function renderSoftmax(ctx,W,H,t){
  const {midY,top,bottom}=safeZone();

  scores.forEach((s,i)=>{
    const a=smoothstep(segT(t,0.3+i*0.3,0.4));
    const x=W*0.28+i*140;
    box(ctx,x,midY-90,90,50,{stroke:colors[i],fill:colors[i]+'15',alpha:a,r:8});

  });

  const t2=t-1.4; if(t2<0) return;
  const a2=smoothstep(segT(t2,0,0.5));
  label(ctx,cx0,midY-30,'step 1: exponentiate -- everything becomes positive',{size:12,color:'#f0cda0',alpha:a2});
  const exps=scores.map(Math.exp);
  scores.forEach((s,i)=>{
    const x=W*0.28+i*140;

  });

  const t3=t2-1.4; if(t3<0) return;
  const a3=smoothstep(segT(t3,0,0.5));
  const sumExp=exps.reduce((a,b)=>a+b,0);

  scores.forEach((s,i)=>{
    const x=W*0.28+i*140;
    const a=smoothstep(segT(t3,0.2+i*0.2,0.4));
    const p=exps[i]/sumExp;
    label(ctx,x,midY+82,'p = '+p.toFixed(3),{size:13,color:colors[i],weight:'700',alpha:a,font:"'IBM Plex Mono',monospace"});

  const t4=t3-1.4; if(t4<0) return;
  const a4=smoothstep(segT(t4,0,0.5));
  const parts=[{text:'\u03c0(a\u1d62|s) = ',color:'#e9e8f0'},{text:'e^score(a\u1d62)',color:'#e8a765'},{text:' / ',color:'#8b8a9a'},{text:'\u03a3\u2c7c e^score(a\u2c7c)',color:'#6fa8dc'}];

/* =========================================================
   SLIDE 16 — GRADIENT ASCENT
========================================================= */
function renderGradientAscent(ctx,W,H,t){
  const {midY,top,bottom}=safeZone();
  const cx=W*0.5;
  const a0=smoothstep(segT(t,0,0.5));
  ctx.save(); ctx.globalAlpha=a0; ctx.beginPath();
  for(let px=-220; px<=220; px+=4){
    const nx=px/220;
    const y=midY+40 - (1-nx*nx)*110;
    if(px===-220) ctx.moveTo(cx+px,y); else ctx.lineTo(cx+px,y);
  }
  ctx.strokeStyle='#6fa8dc'; ctx.lineWidth=2.2; ctx.stroke(); ctx.restore();
  label(ctx,cx,midY-100,'J(\u03b8)  -- we want to reach the TOP',{size:12,color:'#9dc1e8',alpha:a0});

  const t2=t-0.6; if(t2<0) return;
  const cyc=3.4; const p=(t2%cyc)/cyc;
  const startX=-190;
  const px=lerp(startX,0,easeOutCubic(Math.min(p*1.3,1)));
  const nx=clamp(px,-220,220)/220;
  const py=midY+40-(1-nx*nx)*110;
  ctx.save(); ctx.fillStyle='#e8a765'; ctx.shadowColor='#e8a765'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(cx+px,py,7,0,TAU); ctx.fill(); ctx.restore();

  const slope=-2*nx;
  if(p<0.9){
    const dirx=Math.sign(slope)||1;
    arrow(ctx,cx+px,py,cx+px+dirx*50,py-Math.abs(slope)*20,{color:'#7cc48f',progress:1,lw:2});
  }

  const a2=smoothstep(segT(t2,0,0.5));
  label(ctx,W*0.5,top+20,'take small steps in the direction the gradient points -- straight uphill',{size:12.5,color:'#8b8a9a',alpha:a2});

  const a3=smoothstep(segT(t2,2.2,0.5));
  const parts=[{text:'\u03b8 \u2190 ',color:'#e9e8f0'},{text:'\u03b8',color:'#a98fd2'},{text:' + \u03b1\u00b7',color:'#8b8a9a'},{text:'\u2207',color:'#e8a765'},{text:'\u03b8',color:'#a98fd2'},{text:'J(\u03b8)',color:'#7cc48f'}];
  drawFormulaParts(ctx,W*0.5,bottom-24,parts,{alpha:a3,size:20});
}

  const t2=t-1.0; if(t2<0) return;
  const a2=smoothstep(segT(t2,0,0.6));
  label(ctx,cx,top+108,'quick proof this adds exactly ZERO to the gradient:',{size:12,color:'#8b8a9a',alpha:a2});

  const lines=[
    {eq:'\ud835\udd3c[\u2207log\u03c0(a|s)\u00b7b(s)] = \u03a3\u2090 \u03c0(a|s)\u00b7\u2207log\u03c0(a|s)\u00b7b(s)',note:'write the expectation out as a sum over actions', color:'#9dc1e8'},
    {eq:'= \u03a3\u2090 \u2207\u03c0(a|s)\u00b7b(s)',note:'the log-derivative trick again, IN REVERSE', color:'#e8a765'},
    {eq:'= b(s)\u00b7\u2207 \u03a3\u2090 \u03c0(a|s)',note:'b(s) doesn\u2019t depend on a -- pull it (and \u2207) outside the sum', color:'#5fd0c3'},

let slideIndex=0;
let t0=performance.now();
let rafId=null;

const headerBlock=document.getElementById('headerBlock');
const footerBlock=document.getElementById('footerBlock');
const eyebrowEl=document.getElementById('eyebrow');
const titleEl=document.getElementById('slideTitle');
const textEl=document.getElementById('slideText');
const formulaEl=document.getElementById('formula');
const counterEl=document.getElementById('counter');
const progressBar=document.getElementById('progressBar');
const sectionTag=document.getElementById('sectionTag');

function pad(n){ return n<10 ? '0'+n : ''+n; }

function goTo(i){
  slideIndex = clamp(i,0,slides.length-1);
  const s = slides[slideIndex];
  headerBlock.classList.remove('show');
  footerBlock.classList.remove('show');
  void headerBlock.offsetWidth;
  eyebrowEl.textContent = s.eyebrow;
  titleEl.textContent = s.title;
  textEl.textContent = s.text;
  formulaEl.innerHTML = s.formula;
  sectionTag.textContent = s.section;
  requestAnimationFrame(()=>{ headerBlock.classList.add('show'); footerBlock.classList.add('show'); });
  counterEl.textContent = pad(slideIndex+1)+' / '+pad(slides.length);
  progressBar.style.width = (100*(slideIndex+1)/slides.length)+'%';
  startClock();
}

function startClock(){
  t0=performance.now();
  cancelAnimationFrame(rafId);
  function loop(now){
    const t=(now-t0)/1000;
    drawBackground(t);
    slides[slideIndex].render(ctx,W,H,t);
    rafId=requestAnimationFrame(loop);
  }
  rafId=requestAnimationFrame(loop);
}

document.getElementById('nextBtn').addEventListener('click',()=>goTo(slideIndex+1));
document.getElementById('prevBtn').addEventListener('click',()=>goTo(slideIndex-1));
document.getElementById('replayBtn').addEventListener('click',()=>startClock());

window.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); goTo(slideIndex+1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); goTo(slideIndex-1); }
  else if(e.key==='r' || e.key==='R'){ startClock(); }
});

let touchStartX=null;
document.addEventListener('touchstart',e=>{ touchStartX=e.touches[0].clientX; });
document.addEventListener('touchend',e=>{
  if(touchStartX===null) return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(dx<-40) goTo(slideIndex+1);
  else if(dx>40) goTo(slideIndex-1);
  touchStartX=null;
});

goTo(0);
</script>
</body>
</html>
