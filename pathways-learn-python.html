<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathways — Learn Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PATHWAYS — design tokens
   Palette: ink (#1A1B26), parchment (#F0EAD6), trail-blue (#4B8BBE),
            waypoint-gold (#FFD43B), sage (#9FB8AD), clay (#C97D60)
   Type: Fraunces (display), Source Sans 3 (body), JetBrains Mono (code)
   ============================================================ */

:root{
  --ink: #1A1B26;
  --ink-soft: #242535;
  --ink-softer: #2E3043;
  --ink-line: #3A3C52;
  --parchment: #F0EAD6;
  --parchment-dim: #E5DEC8;
  --paper: #FAF7EE;
  --trail-blue: #5B9BD1;
  --trail-blue-dim: #3E6E97;
  --gold: #FFD43B;
  --gold-dim: #C9A82E;
  --sage: #9FB8AD;
  --clay: #C97D60;
  --text-bright: #F4F1E8;
  --text-mid: #B7B8C9;
  --text-dim: #7C7E96;

  --font-display: 'Fraunces', serif;
  --font-body: 'Source Sans 3', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --radius: 6px;
}

*{ box-sizing: border-box; }
html, body{
  margin:0; padding:0;
  background: var(--ink);
  color: var(--text-bright);
  font-family: var(--font-body);
  height: 100%;
  -webkit-font-smoothing: antialiased;
}
body{ overflow: hidden; }

::selection{ background: var(--gold); color: var(--ink); }

a{ color: var(--trail-blue); }

/* ---------------- Boot screen ---------------- */
.boot-screen{
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--ink);
  gap: 18px;
  z-index: 999;
  transition: opacity .5s ease;
}
.boot-mark{ color: var(--gold); width: 56px; height: 56px; animation: pulse 2s ease-in-out infinite; }
.boot-mark-svg{ width: 100%; height: 100%; }
@keyframes pulse{ 0%,100%{ opacity: .55; } 50%{ opacity: 1; } }
.boot-text{ font-family: var(--font-mono); font-size: 13px; color: var(--text-mid); letter-spacing: .02em; }
.boot-bar{ width: 220px; height: 3px; background: var(--ink-softer); border-radius: 2px; overflow: hidden; }
.boot-bar-fill{ width: 0%; height: 100%; background: var(--gold); transition: width .3s ease; }

/* ---------------- App shell ---------------- */
.app{ height: 100vh; display: flex; flex-direction: column; }

.topbar{
  height: 60px; flex: 0 0 auto;
  display: flex; align-items: center; gap: 24px;
  padding: 0 20px;
  background: var(--ink-soft);
  border-bottom: 1px solid var(--ink-line);
  z-index: 10;
}
.topbar-brand{ display: flex; align-items: baseline; gap: 8px; flex: 0 0 auto; }
.brand-mark{ width: 22px; height: 22px; color: var(--gold); align-self: center; }
.brand-name{ font-family: var(--font-display); font-size: 21px; font-weight: 600; color: var(--text-bright); }
.brand-sub{ font-family: var(--font-body); font-size: 12px; color: var(--text-dim); display: none; }
@media(min-width: 720px){ .brand-sub{ display: inline; } }

.topbar-trail{
  flex: 1 1 auto;
  display: flex; align-items: center; gap: 3px;
  overflow: hidden;
  padding: 0 8px;
}
.trail-seg{
  height: 4px; flex: 1 1 auto; min-width: 4px;
  background: var(--ink-line);
  border-radius: 2px;
  position: relative;
  cursor: pointer;
  transition: background .25s ease;
}
.trail-seg.done{ background: var(--sage); }
.trail-seg.current{ background: var(--gold); }
.trail-seg:hover{ background: var(--trail-blue); }

.menu-toggle{
  display: none;
  background: none; border: none; color: var(--text-bright);
  width: 34px; height: 34px; align-items: center; justify-content: center;
  border-radius: var(--radius); cursor: pointer; flex: 0 0 auto;
}
.menu-toggle:hover{ background: var(--ink-softer); }

.layout{ flex: 1 1 auto; display: flex; min-height: 0; }

/* ---------------- Sidebar ---------------- */
.sidebar{
  width: 270px; flex: 0 0 auto;
  background: var(--ink-soft);
  border-right: 1px solid var(--ink-line);
  overflow-y: auto;
}
.sidebar-scroll{ padding: 18px 0 40px; }

.sidebar-group-title{
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-dim); padding: 18px 20px 8px;
}
.sidebar-group-title:first-child{ padding-top: 4px; }

.sidebar-item{
  display: flex; align-items: center; gap: 10px;
  padding: 9px 20px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-mid);
  border-left: 2px solid transparent;
  transition: background .15s ease, color .15s ease;
}
.sidebar-item:hover{ background: var(--ink-softer); color: var(--text-bright); }
.sidebar-item.active{
  background: var(--ink-softer);
  color: var(--text-bright);
  border-left-color: var(--gold);
}
.sidebar-marker{
  width: 16px; height: 16px; flex: 0 0 auto;
  border-radius: 50%;
  border: 1.5px solid var(--ink-line);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: transparent;
}
.sidebar-item.done .sidebar-marker{ background: var(--sage); border-color: var(--sage); color: var(--ink); }
.sidebar-item.current .sidebar-marker{ border-color: var(--gold); }
.sidebar-item.current .sidebar-marker::after{ content:''; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

/* ---------------- Content ---------------- */
.content{
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 48px 56px 100px;
  max-width: 760px;
  scroll-behavior: smooth;
}

.topic-eyebrow{
  font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--gold-dim); margin-bottom: 10px;
}
.topic-title{
  font-family: var(--font-display); font-size: 38px; font-weight: 600; line-height: 1.15;
  color: var(--text-bright); margin: 0 0 6px;
}
.topic-dek{
  font-size: 16px; color: var(--text-mid); margin: 0 0 36px; max-width: 56ch; line-height: 1.55;
}

.section{ margin-bottom: 34px; }
.section h3{
  font-family: var(--font-display); font-size: 20px; font-weight: 600;
  color: var(--text-bright); margin: 0 0 12px;
}
.section p{ font-size: 15.5px; line-height: 1.7; color: #D8D9E5; margin: 0 0 14px; }
.section ul, .section ol{ font-size: 15.5px; line-height: 1.7; color: #D8D9E5; padding-left: 22px; margin: 0 0 14px;}
.section li{ margin-bottom: 6px; }
.section code.inline{
  font-family: var(--font-mono); font-size: 13.5px;
  background: var(--ink-softer); color: var(--gold);
  padding: 2px 6px; border-radius: 4px;
}

.callout{
  border-left: 3px solid var(--trail-blue);
  background: rgba(91,155,209,0.08);
  padding: 14px 18px; border-radius: 0 6px 6px 0;
  font-size: 14.5px; line-height: 1.6; color: #D8D9E5;
  margin: 0 0 14px;
}
.callout.warn{ border-left-color: var(--clay); background: rgba(201,125,96,0.08); }
.callout strong{ color: var(--text-bright); }

/* ---------------- Code blocks ---------------- */
.code-block{
  background: var(--paper);
  border-radius: var(--radius);
  overflow: hidden;
  margin: 0 0 16px;
  border: 1px solid #DDD4B8;
}
.code-block-head{
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px;
  background: var(--parchment-dim);
  border-bottom: 1px solid #DDD4B8;
}
.code-block-label{ font-family: var(--font-mono); font-size: 11.5px; color: #6B6347; letter-spacing: .03em; }
.code-run-btn{
  font-family: var(--font-mono); font-size: 12px; font-weight: 600;
  background: var(--ink); color: var(--gold);
  border: none; border-radius: 4px;
  padding: 5px 12px; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: transform .1s ease, background .15s ease;
}
.code-run-btn:hover{ background: var(--ink-softer); }
.code-run-btn:active{ transform: scale(0.96); }
.code-run-btn:disabled{ opacity: .5; cursor: wait; }
.code-block pre{
  margin: 0; padding: 14px 18px;
  font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6;
  color: #2B2A1F; overflow-x: auto; white-space: pre;
}
.code-block .tok-kw{ color: #B5566B; font-weight: 600; }
.code-block .tok-str{ color: #4F7A3D; }
.code-block .tok-com{ color: #9A8F6B; font-style: italic; }
.code-block .tok-num{ color: #A6651E; }
.code-block .tok-fn{ color: #2C6E8C; }

.code-result{
  border-top: 1px dashed #DDD4B8;
  background: #F5F0DF;
  padding: 10px 18px;
  font-family: var(--font-mono); font-size: 13px; color: #3A3624;
  white-space: pre-wrap;
  display: none;
}
.code-result.show{ display: block; }
.code-result.is-error{ color: #94392C; }

.code-block-unrunnable{ border-color: #D9C9A0; opacity: 0.96; }
.code-unrunnable-badge{
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .03em;
  color: #8A6B2E; background: rgba(201,168,46,0.18);
  border: 1px solid rgba(201,168,46,0.4);
  border-radius: 4px; padding: 4px 9px;
  cursor: help;
}

/* ---------------- Quiz ---------------- */
.quiz{
  background: var(--ink-soft);
  border: 1px solid var(--ink-line);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin: 0 0 16px;
}
.quiz-q{ font-size: 15px; color: var(--text-bright); margin: 0 0 12px; font-weight: 500; }
.quiz-opt{
  display: block; width: 100%; text-align: left;
  background: var(--ink-softer); color: var(--text-mid);
  border: 1px solid var(--ink-line); border-radius: 5px;
  padding: 10px 14px; margin-bottom: 8px;
  font-family: var(--font-mono); font-size: 13.5px;
  cursor: pointer; transition: all .15s ease;
}
.quiz-opt:hover{ border-color: var(--trail-blue); color: var(--text-bright); }
.quiz-opt.correct{ border-color: var(--sage); background: rgba(159,184,173,0.15); color: var(--text-bright); }
.quiz-opt.incorrect{ border-color: var(--clay); background: rgba(201,125,96,0.15); color: var(--text-bright); }
.quiz-feedback{ font-size: 13.5px; margin-top: 8px; color: var(--text-mid); display:none; }
.quiz-feedback.show{ display: block; }

/* ---------------- Exercise ---------------- */
.exercise{
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin: 0 0 16px;
  background: rgba(255,212,59,0.04);
}
.exercise-label{
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 8px;
}
.exercise p{ color: #D8D9E5; }
.exercise-editor{
  width: 100%; min-height: 100px;
  background: var(--paper); color: #2B2A1F;
  font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6;
  border: 1px solid #DDD4B8; border-radius: 5px;
  padding: 12px 14px; resize: vertical;
  margin-bottom: 10px;
}
.exercise-controls{ display: flex; gap: 10px; align-items: center; }
.exercise-hint-toggle{
  font-family: var(--font-mono); font-size: 12px; color: var(--trail-blue);
  background: none; border: none; cursor: pointer; padding: 6px 4px;
}
.exercise-hint{
  display:none; margin-top: 10px; font-size: 13.5px; color: var(--text-mid);
  border-left: 2px solid var(--trail-blue); padding-left: 12px;
}
.exercise-hint.show{ display: block; }

/* ---------------- Nav buttons at bottom ---------------- */
.topic-nav{
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--ink-line);
}
.nav-btn{
  font-family: var(--font-mono); font-size: 13px;
  background: var(--ink-soft); color: var(--text-bright);
  border: 1px solid var(--ink-line); border-radius: 5px;
  padding: 10px 16px; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  transition: border-color .15s ease;
}
.nav-btn:hover{ border-color: var(--trail-blue); }
.nav-btn:disabled{ opacity: .3; cursor: default; }
.nav-btn.complete{ border-color: var(--sage); color: var(--sage); }

/* ---------------- REPL panel ---------------- */
.repl-panel{
  width: 380px; flex: 0 0 auto;
  display: flex; flex-direction: column;
  background: var(--ink-soft);
  border-left: 1px solid var(--ink-line);
}
.repl-header{
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--ink-line);
  flex: 0 0 auto;
}
.repl-title{ font-family: var(--font-mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-mid); }
.repl-status{ font-family: var(--font-mono); font-size: 11px; color: var(--gold-dim); }
.repl-status.ready{ color: var(--sage); }
.repl-status.busy{ color: var(--clay); }
.repl-retry-link{
  font-family: var(--font-mono); font-size: 11px;
  background: none; border: 1px solid var(--clay); color: var(--clay);
  border-radius: 4px; padding: 3px 8px; cursor: pointer; margin-right: 8px;
}
.repl-retry-link:hover{ background: rgba(201,125,96,0.12); }

.repl-output{
  flex: 1 1 auto; overflow-y: auto;
  margin: 0; padding: 14px 16px;
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.65;
  color: var(--text-bright);
  white-space: pre-wrap; word-break: break-word;
}
.repl-hint{ color: var(--text-dim); font-style: italic; }
.repl-line-input{ color: var(--gold-dim); }
.repl-line-output{ color: var(--text-bright); }
.repl-line-error{ color: var(--clay); }
.repl-line-divider{ display:block; height:1px; background: var(--ink-line); margin: 10px 0; }

.repl-input-row{ flex: 0 0 auto; border-top: 1px solid var(--ink-line); padding: 12px 16px; }
.repl-input{
  width: 100%; min-height: 64px;
  background: var(--ink); color: var(--text-bright);
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5;
  border: 1px solid var(--ink-line); border-radius: 5px;
  padding: 10px 12px; resize: vertical;
  margin-bottom: 8px;
}
.repl-input:focus{ outline: none; border-color: var(--trail-blue); }
.repl-buttons{ display: flex; gap: 8px; }
.btn{
  font-family: var(--font-mono); font-size: 12px; font-weight: 600;
  border: none; border-radius: 4px; padding: 7px 14px; cursor: pointer;
}
.btn-run{ background: var(--gold); color: var(--ink); }
.btn-run:hover{ background: var(--gold-dim); }
.btn-run:disabled{ opacity: .5; cursor: wait; }
.btn-clear{ background: var(--ink-softer); color: var(--text-mid); }
.btn-clear:hover{ color: var(--text-bright); }

/* ---------------- Responsive ---------------- */
@media (max-width: 980px){
  .repl-panel{ width: 320px; }
  .content{ padding: 36px 32px 100px; }
}

@media (max-width: 760px){
  .menu-toggle{ display: flex; }
  #consoleToggle svg{ transform: scaleX(-1); }
  .sidebar{
    position: fixed; top: 60px; left: 0; bottom: 0; z-index: 20;
    transform: translateX(-100%);
    transition: transform .25s ease;
    box-shadow: 4px 0 24px rgba(0,0,0,0.4);
  }
  .sidebar.open{ transform: translateX(0); }
  .repl-panel{
    position: fixed; top: 60px; right: 0; bottom: 0; z-index: 20; width: 88%;
    max-width: 360px;
    transform: translateX(100%);
    transition: transform .25s ease;
    box-shadow: -4px 0 24px rgba(0,0,0,0.4);
  }
  .repl-panel.open{ transform: translateX(0); }
  .content{ padding: 28px 18px 100px; max-width: 100%; }
  .topic-title{ font-size: 28px; }
  .brand-sub{ display: none; }
}

/* scrollbars */
.sidebar::-webkit-scrollbar, .content::-webkit-scrollbar, .repl-output::-webkit-scrollbar{ width: 8px; }
.sidebar::-webkit-scrollbar-thumb, .content::-webkit-scrollbar-thumb, .repl-output::-webkit-scrollbar-thumb{
  background: var(--ink-line); border-radius: 4px;
}
.sidebar::-webkit-scrollbar-track, .content::-webkit-scrollbar-track, .repl-output::-webkit-scrollbar-track{ background: transparent; }

</style>
</head>
<body>

<div class="boot-screen" id="bootScreen">
  <div class="boot-mark">
    <svg viewBox="0 0 64 64" class="boot-mark-svg">
      <path d="M32 4 L58 18 L58 46 L32 60 L6 46 L6 18 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="4" fill="currentColor"/>
    </svg>
  </div>
  <p class="boot-text" id="bootText">Waking up the interpreter…</p>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootBarFill"></div></div>
</div>

<div class="app" id="app" hidden>

  <header class="topbar">
    <div class="topbar-brand">
      <svg viewBox="0 0 64 64" class="brand-mark">
        <path d="M32 4 L58 18 L58 46 L32 60 L6 46 L6 18 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="32" cy="32" r="4" fill="currentColor"/>
      </svg>
      <span class="brand-name">Pathways</span>
      <span class="brand-sub">a trail through Python</span>
    </div>
    <div class="topbar-trail" id="topbarTrail" aria-label="Course progress"></div>
    <button class="menu-toggle" id="consoleToggle" aria-label="Toggle console">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 17l5-5-5-5M12 19h8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle topic list">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-scroll" id="sidebarScroll"></div>
    </nav>

    <main class="content" id="content">
      <!-- Topic content injected here -->
    </main>

    <aside class="repl-panel" id="replPanel">
      <div class="repl-header">
        <span class="repl-title">Console</span>
        <button class="repl-retry-link" id="replRetryLink" hidden>retry runtime</button>
        <span class="repl-status" id="replStatus">starting…</span>
      </div>
      <pre class="repl-output" id="replOutput"><span class="repl-hint">Run any snippet on the left, or type your own code below and press Run.</span></pre>
      <div class="repl-input-row">
        <textarea class="repl-input" id="replInput" placeholder="print('hello, trail')" spellcheck="false"></textarea>
        <div class="repl-buttons">
          <button class="btn btn-run" id="replRunBtn">Run ▸</button>
          <button class="btn btn-clear" id="replClearBtn">Clear</button>
        </div>
      </div>
    </aside>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.29.4/full/pyodide.js"></script>
<script>
/* ============================================================
   CURRICULUM DATA
   Each topic: { id, group, title, dek, sections: [...] }
   Section types: text, code, callout, quiz, exercise
   ============================================================ */

const CURRICULUM = [

// ============ GROUP: FOUNDATIONS ============
{
  id: "intro",
  group: "Foundations",
  title: "Why Python, and how it runs",
  dek: "Before writing a line of code, a quick orientation to what Python is and how this trail works.",
  sections: [
    { type: "text", html: `<p>Python is a high-level, interpreted language designed to read almost like plain English. You don't compile it into machine code ahead of time — the interpreter reads your source line by line and executes it on the spot. That's why you can type a line into a console and see a result immediately.</p>
    <p>This course is built around that idea. Every gray code block on this page is editable and runnable using a real Python interpreter running in your browser (via Pyodide — actual CPython compiled to WebAssembly, not a simulation). The console on the right is yours to experiment in at any time.</p>` },
    { type: "callout", html: `<strong>How to use this trail:</strong> Read a section, run its example, then try the exercise before moving on. The progress bar at the top fills in as you complete topics. Nothing you do here is graded — the only goal is that the ideas stick.` },
    { type: "code", label: "your first line", code: `print("hello, trail")` },
    { type: "exercise", prompt: "Edit the console on the right (or the box below) to print your own name instead.", starter: `print("hello, trail")`, hint: "Just change the text inside the quotes — the print() function displays whatever string you give it." }
  ]
},

{
  id: "variables",
  group: "Foundations",
  title: "Variables & assignment",
  dek: "Naming values so you can use them again.",
  sections: [
    { type: "text", html: `<p>A variable is a name bound to a value. Python figures out the type of the value automatically — you never declare <code class="inline">int</code> or <code class="inline">string</code> up front the way some languages require.</p>` },
    { type: "code", label: "binding names to values", code: `name = "Ada"
age = 28
height_m = 1.68
is_programmer = True

print(name, age, height_m, is_programmer)` },
    { type: "text", html: `<p>Assignment is rebindable at any time — a variable just points to whatever was assigned most recently. Multiple names can be assigned in one line, and Python lets you swap values without a temporary variable.</p>` },
    { type: "code", label: "multiple assignment & swapping", code: `a, b = 3, 7
a, b = b, a
print(a, b)   # 7 3` },
    { type: "callout", html: `<strong>Naming rules:</strong> names can contain letters, digits, and underscores, but can't start with a digit. By convention, variables and functions use <code class="inline">snake_case</code>, not <code class="inline">camelCase</code>.` },

add_to_total(5)

class Cat(Animal):

    { type: "code", label: "using super()", code: `class Employee:

class Manager(Employee):

m = Manager("Devi", 95000, 6)
print(m.name, m.salary, m.team_size)` },
    { type: "text", html: `<p>Polymorphism means different classes can be used interchangeably if they implement the same method — calling <code class="inline">.speak()</code> on any Animal subclass works without the caller needing to know which exact type it is.</p>` },

for a in animals:

  title: "Exceptions & error handling",

    { type: "text", html: `<p>When something goes wrong, Python raises an exception, which stops execution unless it's caught. <code class="inline">try</code>/<code class="inline">except</code> lets you handle specific failure cases gracefully instead of crashing.</p>` },
    { type: "code", label: "try / except", code: `def safe_divide(a, b):

print(safe_divide(10, 2))
print(safe_divide(10, 0))` },
    { type: "text", html: `<p>Catch the most specific exception type you can — bare <code class="inline">except:</code> swallows everything, including typos and bugs you actually want to see. <code class="inline">else</code> runs if no exception occurred; <code class="inline">finally</code> always runs, exception or not.</p>` },
    { type: "code", label: "else and finally", code: `def parse_int(value):

    finally:

parse_int("42")
parse_int("abc")` },

def withdraw(balance, amount):

{
  id: "decorators",
  group: "Advanced",
  title: "Decorators",
  dek: "Functions that wrap other functions to add behavior.",
  sections: [
    { type: "text", html: `<p>A decorator takes a function and returns a new function that usually wraps the original with extra behavior — logging, timing, access control — without modifying the original function's code.</p>` },
    { type: "code", label: "writing a decorator", code: `def announce(func):
    def wrapper(*args, **kwargs):
        print(f"calling {func.__name__}")
        result = func(*args, **kwargs)
        print(f"{func.__name__} finished")
        return result
    return wrapper

@announce
def add(a, b):
    return a + b

print(add(3, 4))` },
    { type: "text", html: `<p>The <code class="inline">@announce</code> syntax is shorthand for <code class="inline">add = announce(add)</code>. Decorators are a direct application of closures — the wrapper function closes over <code class="inline">func</code>.</p>` },
    { type: "code", label: "a practical example: timing", code: `import time

def timed(func):
    def wrapper(*args, **kwargs):
        start = time.time()
        result = func(*args, **kwargs)
        elapsed = time.time() - start
        print(f"{func.__name__} took {elapsed:.6f}s")
        return result
    return wrapper

@timed
def slow_sum(n):
    return sum(range(n))

slow_sum(1_000_000)` },
    { type: "callout", html: `<strong>functools.wraps:</strong> in production code, decorators should use <code class="inline">@functools.wraps(func)</code> on the inner wrapper to preserve the original function's name and docstring — otherwise tools that inspect functions get confused.` },
    { type: "quiz", question: "What is @announce shorthand for, applied to 'def add(...)'?", options: ["announce() runs before add() automatically forever", "add = announce(add)", "It imports announce as a module", "It has no real effect, just documentation"], correctIndex: 1, feedback: "Decorator syntax is pure sugar for reassigning the function name to the result of calling the decorator on it." }
  ]
},

{
  id: "generators",
  group: "Advanced",
  title: "Generators & iterators",
  dek: "Producing values lazily, one at a time, without storing them all in memory.",
  sections: [
    { type: "text", html: `<p>A generator function uses <code class="inline">yield</code> instead of <code class="inline">return</code>. Calling it doesn't run the function immediately — it returns a generator object that produces values on demand, pausing and resuming state between each <code class="inline">yield</code>.</p>` },
    { type: "code", label: "a basic generator", code: `def countdown(n):
    while n > 0:
        yield n
        n -= 1

for value in countdown(5):
    print(value)` },
    { type: "text", html: `<p>The key advantage: generators don't build the whole sequence in memory upfront. For huge or infinite sequences, this matters enormously.</p>` },
    { type: "code", label: "memory efficiency, conceptually", code: `def squares_up_to(n):
    for i in range(n):
        yield i * i

# only one value exists in memory at a time as you iterate
gen = squares_up_to(5)
print(next(gen))
print(next(gen))
print(list(gen))   # exhausts the rest` },
    { type: "text", html: `<p>Generator expressions mirror list comprehensions but use parentheses, and are lazy — values are computed only as they're consumed.</p>` },
    { type: "code", label: "generator expressions", code: `nums = [1, 2, 3, 4, 5]
squares_gen = (n ** 2 for n in nums)   # not computed yet
print(sum(squares_gen))  # consumed here, one at a time` },
    { type: "callout", html: `<strong>Generators are single-use.</strong> Once exhausted (iterated to the end), they can't be restarted — you'd need to call the generator function again to get a fresh one.` },
    { type: "quiz", question: "What's the main advantage of a generator over building a full list?", options: ["Generators always run faster per-item", "Generators don't hold the entire sequence in memory at once", "Generators support more operations than lists", "There's no real difference for most code"], correctIndex: 1, feedback: "Generators compute values lazily, one at a time — crucial for very large or infinite sequences where building a full list would exhaust memory." }
  ]
},

{
  id: "typehints",
  group: "Advanced",
  title: "Type hints",
  dek: "Optional, static-ish annotations that document and catch bugs early.",
  sections: [
    { type: "text", html: `<p>Type hints annotate expected parameter and return types. Python doesn't enforce them at runtime — they're purely informational, used by editors and tools like <code class="inline">mypy</code> to catch mismatches before you even run the code.</p>` },
    { type: "code", label: "basic type hints", code: `def greet(name: str, times: int = 1) -> str:
    return f"hello, {name}! " * times

print(greet("Sam", times=2))
# this still runs even though it violates the hint:

    { type: "text", html: `<p>The <code class="inline">typing</code> module (and, in modern Python, built-in generics) lets you express more complex shapes: lists of a given type, optional values, and unions of multiple types.</p>` },
    { type: "code", label: "container & optional types", code: `from typing import Optional

def average(values: list[float]) -> float:
    return sum(values) / len(values)

def find_user(user_id: int) -> Optional[str]:
    users = {1: "Mara", 2: "Theo"}

print(average([1.0, 2.0, 3.0]))

    { type: "callout", html: `<strong>Why bother</strong> if Python doesn't enforce them? Type hints turn into living documentation, let editors autocomplete more accurately, and let static checkers catch real bugs (passing a string where a list was expected) before runtime — especially valuable as codebases grow.` },
    { type: "quiz", question: "What happens at runtime if you call a type-hinted function with the 'wrong' type?", options: ["Python raises a TypeError immediately", "Python runs it anyway — hints are not enforced at runtime", "It silently converts the value to the correct type", "It only fails in 'strict mode'"], correctIndex: 1, feedback: "Type hints are not enforced by the interpreter itself — they're checked by external tools (mypy, pyright) or your editor, not by Python at runtime." }
  ]

{
  id: "async",
  group: "Advanced",
  title: "Async & await",
  dek: "Concurrency for I/O-bound work, without threads.",
  sections: [
    { type: "text", html: `<p><code class="inline">async def</code> defines a coroutine — a function that can pause at <code class="inline">await</code> points, letting other coroutines run while it's waiting (typically on I/O like network requests or file access). This is concurrency, not parallelism: only one thing actually runs at a time, but waiting time gets reused productively.</p>` },
    { type: "code", label: "a basic coroutine", code: `import asyncio

async def say_after(delay, message):
    await asyncio.sleep(delay)
    print(message)

async def main():
    await say_after(1, "hello")
    await say_after(1, "world")

await main()  # top-level await works in this notebook-style console` },
    { type: "text", html: `<p>The real benefit shows up when multiple coroutines run concurrently with <code class="inline">asyncio.gather()</code>, rather than one after another.</p>` },
    { type: "code", label: "running concurrently", code: `import asyncio
import time

async def task(name, delay):
    await asyncio.sleep(delay)
    print(f"{name} done after {delay}s")

async def main():
    start = time.time()
    await asyncio.gather(
        task("A", 1),
        task("B", 1),
        task("C", 1),
    )
    print(f"total elapsed: {time.time() - start:.2f}s")

await main()` },
    { type: "callout", html: `<strong>Notice</strong> the gather() example finishes in roughly 1 second, not 3 — the three tasks' sleep periods overlap instead of stacking, because each yields control during its await.`, },
    { type: "callout", html: `<strong>When to reach for async:</strong> it shines for I/O-bound work — network calls, database queries, file access — where a program spends most of its time waiting. For CPU-bound work (heavy computation), async doesn't help; you'd want multiprocessing instead.`, cls: "warn" },
    { type: "quiz", question: "Why did the gather() example take ~1s total instead of ~3s?", options: ["asyncio secretly uses multiple CPU cores", "The three sleeps overlap because each task yields control during its await", "gather() only runs the first task", "It's a timing inaccuracy, it actually takes 3s"], correctIndex: 1, feedback: "While one coroutine is suspended at 'await asyncio.sleep(...)', the event loop runs the others — so all three sleeps proceed concurrently rather than sequentially." }
  ]
},

{
  id: "metaclasses",
  group: "Advanced",
  title: "Metaclasses",
  dek: "Classes that control how other classes are built.",
  sections: [
    { type: "text", html: `<p>Every class in Python is itself an instance of something — by default, <code class="inline">type</code>. A metaclass is the "class of a class," and it controls how classes get constructed, the same way a class controls how instances get constructed.</p>` },
    { type: "code", label: "everything is an instance of something", code: `class Dog:
    pass

d = Dog()
print(type(d))      # Dog
print(type(Dog))     # type — Dog is an instance of 'type'
print(type(type))    # type — even 'type' is its own metaclass` },
    { type: "text", html: `<p>You can define a custom metaclass by subclassing <code class="inline">type</code> and overriding <code class="inline">__new__</code> or <code class="inline">__init__</code>. This lets you inject behavior into every class that uses it — for example, automatically registering subclasses, or enforcing naming conventions.</p>` },
    { type: "code", label: "a custom metaclass", code: `class UpperAttrMeta(type):
    def __new__(mcs, name, bases, namespace):
        # rewrite all non-dunder attribute names to uppercase
        new_namespace = {
            (key.upper() if not key.startswith("__") else key): value
            for key, value in namespace.items()
        }
        return super().__new__(mcs, name, bases, new_namespace)

class Config(metaclass=UpperAttrMeta):
    timeout = 30
    retries = 3

print(Config.TIMEOUT, Config.RETRIES)
# print(Config.timeout)  # this would raise AttributeError now` },
    { type: "callout", html: `<strong>In practice:</strong> metaclasses are rare in everyday code — most "I need a metaclass" problems are better solved with decorators, <code class="inline">__init_subclass__</code>, or composition. They're foundational to how frameworks like Django's ORM and Python's own <code class="inline">ABCMeta</code> (abstract base classes) work under the hood, which is why understanding them is still valuable.`, cls: "warn" },
    { type: "quiz", question: "What is a metaclass, in one sentence?", options: ["A class with only static methods", "The class that a class is an instance of — it controls how classes themselves are constructed", "A synonym for 'abstract base class'", "A deprecated Python 2 feature"], correctIndex: 1, feedback: "Just as a class is a blueprint for instances, a metaclass (default: 'type') is the blueprint for classes themselves — it governs class creation." }
  ]
},

{
  id: "threading",
  group: "Concurrency & Parallelism",
  title: "Threading & the GIL",
  dek: "Running code 'at the same time' — and the global lock that complicates it.",
  sections: [
    { type: "callout", html: `<strong>A note on this topic:</strong> the code examples below are real, correct Python — but Python's <code class="inline">threading</code> module can't run inside this in-browser sandbox (the WebAssembly runtime that powers this page's console doesn't support OS threads). They're shown as reference code you can copy into a real Python installation, with the actual output included underneath each one.` },
    { type: "text", html: `<p>The <code class="inline">threading</code> module lets you run multiple pieces of Python "at once" within a single process. Each <code class="inline">Thread</code> object wraps a function to run independently; <code class="inline">.start()</code> kicks it off, and <code class="inline">.join()</code> blocks until it finishes.</p>` },
    { type: "code", label: "basic threading", unrunnable: true, code: `import threading
import time

def worker(name, delay):
    time.sleep(delay)
    print(f"{name} finished")

t1 = threading.Thread(target=worker, args=("Thread-A", 1))
t2 = threading.Thread(target=worker, args=("Thread-B", 1))

t1.start()
t2.start()
t1.join()
t2.join()
print("both threads done")`, expectedOutput: `Thread-A finished
Thread-B finished
both threads done

(total elapsed: about 1 second, not 2 — both sleeps overlapped)` },
    { type: "text", html: `<p>Here's the catch: CPython has a <strong>Global Interpreter Lock (GIL)</strong> — only one thread can execute Python bytecode at any instant, even on a multi-core machine. Threading still helps for I/O-bound work (network calls, file access, <code class="inline">time.sleep</code>) because a waiting thread releases the GIL, letting another thread run. It does <em>not</em> speed up CPU-bound work — number crunching, tight loops — because the threads take turns on a single core regardless of how many cores exist.</p>` },
    { type: "callout", html: `<strong>Rule of thumb:</strong> reach for threading when your bottleneck is <em>waiting</em> (network, disk, sleeping). Reach for multiprocessing (next topic) when your bottleneck is <em>computing</em>.`, cls: "warn" },
    { type: "code", label: "a race condition, and the fix", unrunnable: true, code: `import threading

counter = 0
lock = threading.Lock()

def increment_unsafe():
    global counter
    for _ in range(100_000):
        counter += 1   # not atomic! threads can interleave here

def increment_safe():
    global counter
    for _ in range(100_000):
        with lock:     # only one thread at a time inside this block
            counter += 1

threads = [threading.Thread(target=increment_safe) for _ in range(4)]
for t in threads: t.start()
for t in threads: t.join()
print(counter)`, expectedOutput: `400000

(the lock guarantees this exact, correct total every time.)` },
    { type: "text", html: `<p>A <code class="inline">Lock</code> ensures only one thread executes a critical section at a time, preventing the classic "lost update" race condition: two threads read the same value of <code class="inline">counter</code> before either writes back, so one increment is silently overwritten.</p>` },
    { type: "callout", html: `<strong>An honest caveat:</strong> if you swap in <code class="inline">increment_unsafe</code> above, the race condition is real and guaranteed to be <em>possible</em> — but it depends on the exact moment threads get interrupted mid-update, so it won't necessarily show up on every run, every machine, or every Python build. It's exactly this unpredictability that makes threading bugs so unpleasant to debug: code can pass every test run and still be wrong. Don't rely on a clean test run as proof a threaded function is race-free — reason about whether shared state is protected, rather than just observing outcomes.`, cls: "warn" },
    { type: "quiz", question: "Why doesn't adding more threads speed up a CPU-bound loop in CPython?", options: ["Threads always run sequentially regardless of code", "The GIL allows only one thread to execute Python bytecode at a time, so CPU-bound threads take turns rather than running in parallel", "CPU-bound code can't be threaded at all", "It's a bug that will eventually be fixed"], correctIndex: 1, feedback: "The GIL means CPU-bound threads compete for the same single execution lane — you get concurrency (interleaving) but not parallelism (simultaneous execution) for pure Python computation." },
    { type: "quiz", question: "What problem does threading.Lock() solve in the counter example?", options: ["It makes the loop run faster", "It prevents two threads from reading and writing counter at the same moment, avoiding lost updates", "It's required syntax for any threaded code", "It converts the function to run on multiple cores"], correctIndex: 1, feedback: "Without the lock, two threads can both read the same value of counter before either writes back the incremented result — one of the two increments is silently lost. The lock serializes access to that shared state." }
  ]
},

{
  id: "multiprocessing",
  group: "Concurrency & Parallelism",
  title: "Multiprocessing",
  dek: "Real parallelism, by using separate processes instead of threads.",
  sections: [
    { type: "callout", html: `<strong>Also reference-only here:</strong> like threading, the <code class="inline">multiprocessing</code> module can't spawn OS processes inside this browser sandbox. The code below is correct, runnable Python for a normal machine — shown with its real output.` },
    { type: "text", html: `<p>Since the GIL limits threads to one at a time, true CPU parallelism in Python means using separate <em>processes</em> instead — each with its own Python interpreter and its own memory space, and therefore its own GIL. <code class="inline">multiprocessing.Process</code> mirrors the Thread API closely.</p>` },
    { type: "code", label: "basic multiprocessing", unrunnable: true, code: `import multiprocessing
import time

def cpu_heavy(n):
    total = 0
    for i in range(n):
        total += i * i
    return total

if __name__ == "__main__":
    start = time.time()
    processes = [multiprocessing.Process(target=cpu_heavy, args=(20_000_000,)) for _ in range(4)]
    for p in processes: p.start()
    for p in processes: p.join()
    print(f"done in {time.time() - start:.2f}s using 4 processes")`, expectedOutput: `done in 0.61s using 4 processes

(the exact number depends entirely on your machine's core count and
speed — the point is that on a 4+ core machine, this finishes well
under 4x a single process's time, because the work genuinely overlaps
across cores. On a single-core machine, you'd see little to no speedup.)` },
    { type: "callout", html: `<strong>Why the 'if __name__ == "__main__"' guard?</strong> On some platforms, starting a new process re-imports your script from scratch. Without the guard, that re-import would try to spawn yet more processes recursively. This guard is effectively mandatory for multiprocessing code.` },
    { type: "text", html: `<p>Because each process has separate memory, you can't share variables directly the way threads can — passing data back out requires explicit tools like <code class="inline">multiprocessing.Queue</code> or, more conveniently, the higher-level <code class="inline">Pool</code> API, which distributes work and collects return values for you.</p>` },
    { type: "code", label: "Pool.map for parallel work", unrunnable: true, code: `from multiprocessing import Pool

def square(n):
    return n * n

if __name__ == "__main__":
    with Pool(processes=4) as pool:
        results = pool.map(square, range(10))
    print(results)`, expectedOutput: `[0, 1, 4, 9, 16, 25, 36, 49, 64, 81]` },
    { type: "text", html: `<p>In modern code, <code class="inline">concurrent.futures</code> provides a unified, simpler interface over both threads and processes — <code class="inline">ThreadPoolExecutor</code> and <code class="inline">ProcessPoolExecutor</code> share the same <code class="inline">.submit()</code>/<code class="inline">.map()</code> API, so switching between them is often a one-line change once your task is written as a plain function.</p>` },
    { type: "code", label: "concurrent.futures", unrunnable: true, code: `from concurrent.futures import ProcessPoolExecutor

def square(n):
    return n * n

if __name__ == "__main__":
    with ProcessPoolExecutor(max_workers=4) as executor:
        results = list(executor.map(square, range(10)))
    print(results)`, expectedOutput: `[0, 1, 4, 9, 16, 25, 36, 49, 64, 81]` },
    { type: "callout", html: `<strong>Choosing between them:</strong> threading for I/O-bound tasks (cheap to create, share memory easily, limited by the GIL for CPU work); multiprocessing for CPU-bound tasks (real parallelism, but heavier — each process has startup cost and its own memory, and data passed between processes must be picklable).`, cls: "warn" },
    { type: "quiz", question: "Why can multiprocessing achieve real parallel speedup for CPU-bound work, when threading cannot?", options: ["Processes run faster code than threads", "Each process has its own Python interpreter and its own GIL, so they can truly execute on separate cores simultaneously", "Multiprocessing doesn't use the CPU at all", "There's no real difference — it's a coincidence in benchmarks"], correctIndex: 1, feedback: "Threads share one interpreter and one GIL; processes each get their own, removing the single-lock bottleneck and enabling genuine simultaneous execution across cores." },
    { type: "quiz", question: "Why does multiprocessing code typically need 'if __name__ == \"__main__\":' around the process-creation logic?", options: ["It's just a style convention with no real effect", "It prevents child processes that re-import the script from recursively spawning more processes", "It's required by all Python scripts, not specific to multiprocessing", "It makes the code run faster"], correctIndex: 1, feedback: "On platforms that start new processes by re-importing the launching script, the guard ensures only the original process triggers process creation — without it, each spawned child would try to spawn its own children." }
  ]
},


{

  title: "SOLID principles",
  dek: "Five guidelines for code that stays easy to change as it grows.",
  sections: [
    { type: "text", html: `<p>SOLID is an acronym for five object-oriented design principles, popularized by Robert C. Martin. They're not laws — they're heuristics for keeping code flexible as requirements change. Each is easiest to understand through a violation and its fix.</p>` },
    { type: "text", html: `<h3>S — Single Responsibility Principle</h3><p>A class should have exactly one reason to change. Mixing unrelated responsibilities — say, formatting <em>and</em> persistence — means a change to one drags the other along for the ride.</p>` },
    { type: "code", label: "separating responsibilities", code: `class InvoicePrinter:
    def print_invoice(self, invoice):
        print(f"Invoice #{invoice['id']}: \${invoice['total']:.2f}")

class InvoiceRepository:
    def save(self, invoice):

invoice = {"id": 42, "total": 199.99}
InvoicePrinter().print_invoice(invoice)
InvoiceRepository().save(invoice)` },
    { type: "text", html: `<h3>O — Open/Closed Principle</h3><p>Code should be open to extension but closed to modification — you should be able to add new behavior without editing existing, tested code. Polymorphism is the usual mechanism: define a common interface, then add new subclasses instead of new <code class="inline">if</code> branches.</p>` },
    { type: "code", label: "extending via new classes, not new branches", code: `class Discount:

    def apply(self, price):

class FlatDiscount(Discount):
    def __init__(self, amount):
        self.amount = amount
    def apply(self, price):
        return max(0, price - self.amount)

def checkout(price, discount: Discount):
    return discount.apply(price)

print(checkout(100, PercentageDiscount(20)))
print(checkout(100, FlatDiscount(15)))` },
    { type: "callout", html: `<strong>Notice:</strong> adding a new discount type (say, "buy one get one") means writing a new class, not editing <code class="inline">checkout()</code>. The existing, already-tested function never has to change.` },
    { type: "text", html: `<h3>L — Liskov Substitution Principle</h3><p>Subclasses should be usable anywhere their parent class is expected, without surprising behavior. If a function works correctly with a base class, it should keep working when passed any subclass.</p>` },
    { type: "code", label: "substitutable subclasses", code: `class Bird:

class FlyingBird(Bird):

class Penguin(Bird):

describe_movement(FlyingBird())

    { type: "callout", html: `<strong>A classic violation:</strong> if <code class="inline">Penguin</code> inherited from a <code class="inline">FlyingBird</code> class and its <code class="inline">fly()</code> method raised an exception, any code that assumed "all FlyingBirds can fly()" would break when handed a Penguin — even though Penguin technically "is a" FlyingBird in the inheritance hierarchy. That's the principle being violated.`, cls: "warn" },
    { type: "text", html: `<h3>I — Interface Segregation Principle</h3><p>Prefer several small, specific interfaces over one large, general-purpose one. A class shouldn't be forced to implement methods it doesn't need just because they're bundled into a fat interface.</p>` },
    { type: "code", label: "splitting a fat interface", code: `from abc import ABC, abstractmethod

class Printable(ABC):

    def print_page(self): ...

class Scannable(ABC):

    def scan_page(self): ...

class SimplePrinter(Printable):           # only implements what it needs
    def print_page(self):
        return "printing"

class AllInOnePrinter(Printable, Scannable):  # opts into both
    def print_page(self):

print(SimplePrinter().print_page())
print(AllInOnePrinter().scan_page())` },
    { type: "text", html: `<h3>D — Dependency Inversion Principle</h3><p>High-level code should depend on abstractions, not concrete implementations. Instead of a class hard-coding which specific class it collaborates with, it should accept any object that satisfies an expected interface — making it trivial to swap implementations later (or in tests).</p>` },
    { type: "code", label: "depending on an abstraction", code: `from abc import ABC, abstractmethod

class NotificationSender(ABC):

OrderService(EmailSender()).place_order()
OrderService(SmsSender()).place_order()` },
    { type: "callout", html: `<strong>Why this matters in practice:</strong> <code class="inline">OrderService</code> never needs to change to support a new notification channel, and it's trivial to substitute a fake sender in a test — exactly the flexibility SOLID is designed to protect.` },
    { type: "quiz", question: "What does the Open/Closed Principle recommend when you need to add new behavior?", options: ["Add more if/elif branches to existing functions", "Extend via new classes/subclasses rather than modifying existing, tested code", "Rewrite the whole module from scratch", "Avoid adding new behavior entirely"], correctIndex: 1, feedback: "OCP favors extension (new code) over modification (changing existing code), typically achieved through polymorphism — new subclasses rather than new conditional branches." },
    { type: "quiz", question: "Dependency Inversion is most directly demonstrated by which pattern in the OrderService example?", options: ["OrderService imports EmailSender directly inside place_order()", "OrderService's constructor accepts any NotificationSender, regardless of the concrete class", "OrderService has no constructor", "OrderService inherits from EmailSender"], correctIndex: 1, feedback: "By depending on the NotificationSender abstraction (accepted as a constructor parameter) rather than a specific concrete sender class, OrderService can work with any current or future implementation." }
  ]

{

  title: "Common design patterns",
  dek: "Named, reusable solutions to recurring design problems.",
  sections: [
    { type: "text", html: `<p>Design patterns are well-known solution shapes for recurring problems — not specific to Python, but most have idiomatic Python expressions. Knowing their names also makes it much easier to talk about code design with other developers.</p>` },
    { type: "text", html: `<h3>Singleton</h3><p>Ensures a class has only one instance, and provides global access to it. Overriding <code class="inline">__new__</code> (rather than <code class="inline">__init__</code>) lets a class control instance creation itself.</p>` },
    { type: "code", label: "singleton via __new__", code: `class Singleton:
    _instance = None
    def __new__(cls):
        if cls._instance is None:
            cls._instance = super().__new__(cls)
        return cls._instance

a = Singleton()
b = Singleton()
print(a is b)` },
    { type: "callout", html: `<strong>Use sparingly:</strong> singletons introduce hidden global state, which can make testing harder — many problems people reach for a singleton to solve are better served by passing a single shared instance explicitly (dependency injection) instead.`, cls: "warn" },
    { type: "text", html: `<h3>Factory</h3><p>Centralizes object creation behind a function or method, so calling code doesn't need to know which concrete class to instantiate — useful when the right class to create depends on a runtime value.</p>` },
    { type: "code", label: "a simple factory function", code: `class Dog:
    def speak(self):
        return "Woof"

class Cat:
    def speak(self):
        return "Meow"

def animal_factory(kind):
    animals = {"dog": Dog, "cat": Cat}
    return animals[kind]()

pet = animal_factory("cat")
print(pet.speak())` },
    { type: "text", html: `<h3>Observer</h3><p>Lets objects (subscribers) register interest in events from another object (the publisher), which notifies all of them when something happens — the foundation of event-driven systems, GUI callbacks, and pub/sub messaging.</p>` },
    { type: "code", label: "publisher/subscriber", code: `class Publisher:
    def __init__(self):

    def subscribe(self, fn):

    def notify(self, event):

            fn(event)

def log_event(event):
    print(f"log: {event}")

def alert_event(event):
    print(f"alert: {event}")

pub = Publisher()
pub.subscribe(log_event)
pub.subscribe(alert_event)
pub.notify("server restarted")` },
    { type: "text", html: `<h3>Strategy</h3><p>Defines a family of interchangeable algorithms behind a common interface, letting the algorithm vary independently of the code that uses it. This is essentially the Open/Closed Principle applied to behavior, not just data.</p>` },
    { type: "code", label: "swappable sorting strategies", code: `class SortStrategy:
    def sort(self, data):
        raise NotImplementedError

class AscendingSort(SortStrategy):
    def sort(self, data):

class DescendingSort(SortStrategy):
    def sort(self, data):
        return sorted(data, reverse=True)

class Sorter:
    def __init__(self, strategy: SortStrategy):
        self.strategy = strategy

    def execute(self, data):

numbers = [5, 2, 8, 1]
print(Sorter(AscendingSort()).execute(numbers))
print(Sorter(DescendingSort()).execute(numbers))` },

class MilkDecorator:

    { type: "quiz", question: "What problem does the Strategy pattern solve?", options: ["It guarantees only one instance of a class exists", "It lets you swap out an algorithm's implementation at runtime without changing the code that uses it", "It centralizes object creation", "It adds logging to existing methods"], correctIndex: 1, feedback: "Strategy encapsulates interchangeable behaviors behind a shared interface — Sorter doesn't care which SortStrategy it holds, so new strategies can be added without touching Sorter itself." },
    { type: "quiz", question: "In the Decorator pattern example, why can SyrupDecorator wrap a MilkDecorator which wraps a Coffee?", options: ["Because they all inherit from a shared Beverage base class with no other requirement", "Because every decorator implements the same interface (cost/description) as the thing it wraps, so wrapping is composable to any depth", "It's a coincidence specific to coffee", "Because Python requires decorators to be nested this way"], correctIndex: 1, feedback: "Each decorator presents the same interface as a plain Coffee object, so from the outside a wrapped beverage looks just like an unwrapped one — that uniformity is what makes arbitrary stacking possible." }

</script>
<script>
/* ============================================================
   PATHWAYS — app logic
   ============================================================ */

(function(){
  "use strict";

  // ---------- State ----------
  const state = {
    currentIndex: 0,
    completed: new Set(),
    pyodide: null,
    pyodideReady: false,
    pyodideFailedPermanently: false,
  };

  // Progress is intentionally kept in memory only (resets on reload) — this
  // avoids relying on browser storage APIs that aren't supported for artifacts
  // in this environment.

  // ---------- DOM refs ----------
  const el = {
    bootScreen: document.getElementById("bootScreen"),
    bootText: document.getElementById("bootText"),
    bootBarFill: document.getElementById("bootBarFill"),
    app: document.getElementById("app"),
    sidebarScroll: document.getElementById("sidebarScroll"),
    content: document.getElementById("content"),
    topbarTrail: document.getElementById("topbarTrail"),
    sidebar: document.getElementById("sidebar"),
    menuToggle: document.getElementById("menuToggle"),
    consoleToggle: document.getElementById("consoleToggle"),
    replPanel: document.getElementById("replPanel"),
    replOutput: document.getElementById("replOutput"),
    replInput: document.getElementById("replInput"),
    replRunBtn: document.getElementById("replRunBtn"),
    replClearBtn: document.getElementById("replClearBtn"),
    replStatus: document.getElementById("replStatus"),
    replRetryLink: document.getElementById("replRetryLink"),
  };

  // ============================================================
  // Pyodide setup
  // ============================================================
  const MAX_AUTO_RETRIES = 2;
  const LOAD_TIMEOUT_MS = 45000;

  function withTimeout(promise, ms, label){
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} timed out after ${ms}ms`)), ms))
    ]);
  }

  async function initPyodide(attempt = 0){
    try{
      setBoot(attempt === 0 ? "Waking up the interpreter…" : `Retrying (attempt ${attempt + 1})…`, 10);
      state.pyodide = await withTimeout(loadPyodide(), LOAD_TIMEOUT_MS, "Pyodide load");
      setBoot("Loading the standard library…", 60);
      // Warm up commonly used modules so first run in each topic feels instant
      await withTimeout(state.pyodide.runPythonAsync(`
import sys, time, math, json, asyncio
`), LOAD_TIMEOUT_MS, "Standard library warm-up");
      setBoot("Ready.", 100);
      state.pyodideReady = true;
      el.replStatus.textContent = "ready";
      el.replStatus.classList.add("ready");
      setTimeout(hideBoot, 350);
    }catch(err){
      console.error("Pyodide init failed (attempt " + attempt + "):", err);
      if(attempt < MAX_AUTO_RETRIES){
        setBoot("Hit a snag — retrying…", 10);
        await new Promise(r => setTimeout(r, 600));
        return initPyodide(attempt + 1);
      }
      showBootFailure(err);
    }
  }

  function retryPyodideBoot(){
    state.pyodideFailedPermanently = false;
    el.replRetryLink.hidden = true;
    el.bootScreen.hidden = false;
    el.bootScreen.style.opacity = "1";
    el.bootText.textContent = "Waking up the interpreter…";
    setBoot("Waking up the interpreter…", 10);
    initPyodide(0);
  }

  function showBootFailure(err){
    el.replStatus.textContent = "unavailable";
    state.pyodideFailedPermanently = true;
    el.replRetryLink.hidden = false;
    const msg = (err && err.message) ? err.message : String(err);
    setBoot("Couldn't start the Python runtime in this browser tab.", 100);
    el.bootText.innerHTML = `
      Couldn't start the Python runtime in this browser tab.<br>
      <span style="font-size:11px; color:var(--text-dim); display:block; margin-top:8px;">${escapeHtmlText(msg)}</span>
      <button id="bootRetryBtn" style="margin-top:14px; font-family:var(--font-mono); font-size:12px; background:var(--gold); color:var(--ink); border:none; border-radius:4px; padding:8px 16px; cursor:pointer;">Try again</button>
      <button id="bootSkipBtn" style="margin-top:14px; margin-left:8px; font-family:var(--font-mono); font-size:12px; background:var(--ink-softer); color:var(--text-mid); border:none; border-radius:4px; padding:8px 16px; cursor:pointer;">Read lessons without running code</button>
    `;
    document.getElementById("bootRetryBtn").addEventListener("click", retryPyodideBoot);
    document.getElementById("bootSkipBtn").addEventListener("click", hideBoot);
  }

  function setBoot(text, pct){
    el.bootText.textContent = text;
    el.bootBarFill.style.width = pct + "%";
  }

  function hideBoot(){
    el.bootScreen.style.opacity = "0";
    setTimeout(() => {
      el.bootScreen.hidden = true;
      el.app.hidden = false;
    }, 400);
  }

  // Run python code, capturing stdout/stderr, returning {ok, output}
  // Calls are serialized via a simple queue so concurrent Run clicks
  // (e.g. a code block + the side console) never interleave output buffers.
  let runQueue = Promise.resolve();

  function runPython(code){
    const job = runQueue.then(() => runPythonNow(code));
    // Keep the queue alive even if this job rejects internally (it won't,
    // since runPythonNow catches its own errors) so later calls still run.
    runQueue = job.catch(() => {});
    return job;
  }

  async function runPythonNow(code){
    if(state.pyodideFailedPermanently){
      return { ok: false, output: "The Python runtime couldn't start in this browser tab. Use the \"Try again\" option, or check your network/browser settings." };
    }
    if(!state.pyodideReady){
      return { ok: false, output: "The Python runtime is still loading — try again in a moment." };
    }
    let capturedOut = "";
    state.pyodide.setStdout({ batched: (s) => { capturedOut += s + "\n"; } });
    state.pyodide.setStderr({ batched: (s) => { capturedOut += s + "\n"; } });
    try{
      await state.pyodide.runPythonAsync(code);
      return { ok: true, output: capturedOut };
    }catch(err){
      let msg = err && err.message ? err.message : String(err);
      // Trim pyodide's noisy traceback header for readability — keep the
      // exception type/message line plus a little context.
      const lines = msg.split("\n").filter(l => l.trim().length > 0);
      const lastFew = lines.slice(-4).join("\n");
      return { ok: false, output: (capturedOut + lastFew).trim() || msg };
    }finally{
      // Restore default stream behavior so nothing leaks between calls
      state.pyodide.setStdout({});
      state.pyodide.setStderr({});
    }
  }

  function escapeHtmlText(s){
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // ============================================================
  // Syntax highlighting (lightweight, regex-based)
  // ============================================================
  const PY_KEYWORDS = ["def","return","if","elif","else","for","while","in","not","and","or","is","import","from","as","class","try","except","finally","raise","with","yield","lambda","pass","break","continue","global","nonlocal","None","True","False","async","await","self","super"];

  function highlightPython(code){
    function escapeHtml(s){
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    const kwSet = new Set(PY_KEYWORDS);
    // Single combined pass: alternation order matters — strings and comments
    // first (so keywords/numbers inside them are never separately matched),
    // then numbers, then identifiers (checked against the keyword set inline).
    const master = /("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|#.*$|\b\d+\.?\d*\b|\b[a-zA-Z_]\w*\b)/gm;

    let out = "";
    let lastIndex = 0;
    let match;
    while((match = master.exec(code)) !== null){
      // Append the gap before this match (plain code: operators, punctuation, whitespace)
      out += escapeHtml(code.slice(lastIndex, match.index));
      const token = match[0];
      const isFollowedByParen = code[master.lastIndex] === "(";

      if(token.startsWith('"""') || token.startsWith("'''") || token.startsWith('"') || token.startsWith("'")){
        out += `<span class="tok-str">${escapeHtml(token)}</span>`;
      } else if(token.startsWith("#")){
        out += `<span class="tok-com">${escapeHtml(token)}</span>`;
      } else if(/^\d/.test(token)){
        out += `<span class="tok-num">${escapeHtml(token)}</span>`;
      } else if(kwSet.has(token)){
        out += `<span class="tok-kw">${escapeHtml(token)}</span>`;
      } else if(isFollowedByParen){
        out += `<span class="tok-fn">${escapeHtml(token)}</span>`;
      } else {
        out += escapeHtml(token);
      }
      lastIndex = master.lastIndex;
    }
    out += escapeHtml(code.slice(lastIndex));
    return out;
  }

  // ============================================================
  // Rendering: sidebar
  // ============================================================
  function renderSidebar(){
    const groups = {};
    CURRICULUM.forEach((topic, idx) => {
      if(!groups[topic.group]) groups[topic.group] = [];
      groups[topic.group].push({ ...topic, idx });
    });

    let html = "";
    Object.keys(groups).forEach(groupName => {
      html += `<div class="sidebar-group-title">${groupName}</div>`;
      groups[groupName].forEach(t => {
        const isActive = t.idx === state.currentIndex;
        const isDone = state.completed.has(t.id);
        html += `<div class="sidebar-item ${isActive ? "active current" : ""} ${isDone ? "done" : ""}" data-idx="${t.idx}">
          <span class="sidebar-marker">${isDone ? "✓" : ""}</span>
          <span>${t.title}</span>
        </div>`;
      });
    });
    el.sidebarScroll.innerHTML = html;

    el.sidebarScroll.querySelectorAll(".sidebar-item").forEach(item => {
      item.addEventListener("click", () => {
        goToTopic(parseInt(item.dataset.idx, 10));
        el.sidebar.classList.remove("open");
      });
    });
  }

  function renderTopbarTrail(){
    let html = "";
    CURRICULUM.forEach((t, idx) => {
      const isDone = state.completed.has(t.id);
      const isCurrent = idx === state.currentIndex;
      html += `<div class="trail-seg ${isDone ? "done" : ""} ${isCurrent ? "current" : ""}" data-idx="${idx}" title="${t.title}"></div>`;
    });
    el.topbarTrail.innerHTML = html;
    el.topbarTrail.querySelectorAll(".trail-seg").forEach(seg => {
      seg.addEventListener("click", () => goToTopic(parseInt(seg.dataset.idx, 10)));
    });
  }

  // ============================================================
  // Rendering: content sections
  // ============================================================
  let codeBlockCounter = 0;

  function renderSection(section){
    switch(section.type){
      case "text":
        return `<div class="section">${section.html}</div>`;

      case "callout":
        return `<div class="callout ${section.cls || ""}">${section.html}</div>`;

      case "code": {
        const blockId = `code-${codeBlockCounter++}`;
        const highlighted = highlightPython(section.code);
        if(section.unrunnable){
          const expected = section.expectedOutput ? escapeHtmlText(section.expectedOutput) : "";
          return `
            <div class="code-block code-block-unrunnable">
              <div class="code-block-head">
                <span class="code-block-label">${section.label || "example"} · reference only</span>
                <span class="code-unrunnable-badge" title="${escapeHtmlText(section.unrunnableReason || "Not runnable in this browser sandbox")}">not runnable here</span>
              </div>
              <pre><code>${highlighted}</code></pre>
              ${expected ? `<div class="code-result show">${expected}</div>` : ""}
            </div>`;
        }
        return `
          <div class="code-block" data-raw-code="${encodeURIComponent(section.code)}">
            <div class="code-block-head">
              <span class="code-block-label">${section.label || "example"}</span>
              <button class="code-run-btn" data-target="${blockId}">Run ▸</button>
            </div>
            <pre><code>${highlighted}</code></pre>
            <div class="code-result" id="${blockId}-result"></div>
          </div>`;
      }

      case "quiz": {
        const quizId = `quiz-${codeBlockCounter++}`;
        let optsHtml = section.options.map((opt, i) =>
          `<button class="quiz-opt" data-idx="${i}">${opt}</button>`
        ).join("");
        return `
          <div class="quiz" id="${quizId}" data-correct="${section.correctIndex}">
            <p class="quiz-q">${section.question.replace(/\n/g, "<br>")}</p>
            ${optsHtml}
            <div class="quiz-feedback">${section.feedback}</div>
          </div>`;
      }

      case "exercise": {
        const exId = `ex-${codeBlockCounter++}`;
        return `
          <div class="exercise">
            <div class="exercise-label">Try it yourself</div>
            <p>${section.prompt}</p>
            <textarea class="exercise-editor" id="${exId}-editor">${escapeHtmlText(section.starter || "")}</textarea>
            <div class="exercise-controls">
              <button class="code-run-btn" data-target="${exId}" style="position:static;">Run ▸</button>
              ${section.hint ? `<button class="exercise-hint-toggle" data-target="${exId}">Show hint</button>` : ""}
            </div>
            <div class="code-result" id="${exId}-result"></div>
            ${section.hint ? `<div class="exercise-hint" id="${exId}-hint">${section.hint}</div>` : ""}
          </div>`;
      }

      default:
        return "";
    }
  }

  function renderTopic(idx){
    const topic = CURRICULUM[idx];
    if(!topic) return;

    const sectionsHtml = topic.sections.map(renderSection).join("\n");

    const isFirst = idx === 0;
    const isLast = idx === CURRICULUM.length - 1;
    const isDone = state.completed.has(topic.id);

    el.content.innerHTML = `
      <div class="topic-eyebrow">${topic.group} · ${idx + 1} of ${CURRICULUM.length}</div>
      <h1 class="topic-title">${topic.title}</h1>
      <p class="topic-dek">${topic.dek}</p>
      ${sectionsHtml}
      <div class="topic-nav">
        <button class="nav-btn" id="prevBtn" ${isFirst ? "disabled" : ""}>◂ Previous</button>
        <button class="nav-btn ${isDone ? "complete" : ""}" id="completeBtn">${isDone ? "✓ Completed" : "Mark complete"}</button>
        <button class="nav-btn" id="nextBtn" ${isLast ? "disabled" : ""}>Next ▸</button>
      </div>
    `;
    el.content.scrollTop = 0;

    wireTopicInteractions(topic);
  }

  // ============================================================
  // Interaction wiring for a freshly rendered topic
  // ============================================================
  function wireTopicInteractions(topic){
    // Code run buttons (read-only example blocks)
    el.content.querySelectorAll(".code-block").forEach(block => {
      const btn = block.querySelector(".code-run-btn");
      if(!btn) return; // unrunnable reference block — nothing to wire
      const resultEl = block.querySelector(".code-result");
      const rawCode = decodeURIComponent(block.dataset.rawCode);
      btn.addEventListener("click", async () => {
        await executeAndShow(rawCode, btn, resultEl);
      });
    });

    // Exercises
    el.content.querySelectorAll(".exercise").forEach(ex => {
      const editor = ex.querySelector(".exercise-editor");
      const btn = ex.querySelector(".code-run-btn");
      const resultId = btn.dataset.target + "-result";
      const resultEl = ex.querySelector(`#${resultId}`);
      btn.addEventListener("click", async () => {
        await executeAndShow(editor.value, btn, resultEl);
      });
      const hintBtn = ex.querySelector(".exercise-hint-toggle");
      if(hintBtn){
        hintBtn.addEventListener("click", () => {
          const hintEl = ex.querySelector(".exercise-hint");
          hintEl.classList.toggle("show");
          hintBtn.textContent = hintEl.classList.contains("show") ? "Hide hint" : "Show hint";
        });
      }
    });

    // Quizzes
    el.content.querySelectorAll(".quiz").forEach(quiz => {
      const correctIdx = parseInt(quiz.dataset.correct, 10);
      const opts = quiz.querySelectorAll(".quiz-opt");
      const feedback = quiz.querySelector(".quiz-feedback");
      opts.forEach((opt, i) => {
        opt.addEventListener("click", () => {
          if(quiz.dataset.answered) return;
          quiz.dataset.answered = "true";
          opts.forEach((o, j) => {
            if(j === correctIdx) o.classList.add("correct");
            else if(j === i) o.classList.add("incorrect");
          });
          feedback.classList.add("show");
        });
      });
    });

    // Nav buttons
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const completeBtn = document.getElementById("completeBtn");
    if(prevBtn) prevBtn.addEventListener("click", () => goToTopic(state.currentIndex - 1));
    if(nextBtn) nextBtn.addEventListener("click", () => goToTopic(state.currentIndex + 1));
    if(completeBtn) completeBtn.addEventListener("click", () => {
      state.completed.add(topic.id);
      renderSidebar();
      renderTopbarTrail();
      completeBtn.textContent = "✓ Completed";
      completeBtn.classList.add("complete");
    });
  }

  async function executeAndShow(code, btn, resultEl){
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = "Running…";
    resultEl.classList.remove("is-error");
    resultEl.classList.add("show");
    resultEl.textContent = "running…";

    const { ok, output } = await runPython(code);
    resultEl.textContent = output.trim().length ? output : "(no output — code ran successfully)";
    if(!ok) resultEl.classList.add("is-error");

    btn.disabled = false;
    btn.textContent = originalText;

    // Also echo into the side console for continuity
    appendReplEntry(code, output, ok);
  }

  // ============================================================
  // Navigation
  // ============================================================
  function goToTopic(idx){
    if(idx < 0 || idx >= CURRICULUM.length) return;
    state.currentIndex = idx;
    renderTopic(idx);
    renderSidebar();
    renderTopbarTrail();
  }

  // ============================================================
  // REPL panel
  // ============================================================
  function appendReplEntry(code, output, ok){
    const hint = el.replOutput.querySelector(".repl-hint");
    if(hint) hint.remove();

    const divider = document.createElement("span");
    divider.className = "repl-line-divider";
    el.replOutput.appendChild(divider);

    const inputLine = document.createElement("div");
    inputLine.className = "repl-line-input";
    inputLine.textContent = code.split("\n").map((l, i) => (i === 0 ? ">>> " : "... ") + l).join("\n");
    el.replOutput.appendChild(inputLine);

    const outputLine = document.createElement("div");
    outputLine.className = ok ? "repl-line-output" : "repl-line-error";
    outputLine.textContent = output.trim().length ? output.trim() : "(no output)";
    el.replOutput.appendChild(outputLine);

    el.replOutput.scrollTop = el.replOutput.scrollHeight;
  }

  async function runReplInput(){
    const code = el.replInput.value;
    if(!code.trim()) return;
    el.replRunBtn.disabled = true;
    el.replStatus.textContent = "running…";
    el.replStatus.classList.add("busy");

    const { ok, output } = await runPython(code);
    appendReplEntry(code, output, ok);

    el.replRunBtn.disabled = false;
    el.replStatus.textContent = "ready";
    el.replStatus.classList.remove("busy");
  }

  el.replRunBtn.addEventListener("click", runReplInput);
  el.replInput.addEventListener("keydown", (e) => {
    if((e.metaKey || e.ctrlKey) && e.key === "Enter"){
      e.preventDefault();
      runReplInput();
    }
  });
  el.replClearBtn.addEventListener("click", () => {
    el.replOutput.innerHTML = `<span class="repl-hint">Run any snippet on the left, or type your own code below and press Run.</span>`;
  });
  el.replRetryLink.addEventListener("click", retryPyodideBoot);

  // ============================================================
  // Mobile menu / console toggles
  // ============================================================
  el.menuToggle.addEventListener("click", () => {
    el.replPanel.classList.remove("open");
    el.sidebar.classList.toggle("open");
  });
  el.consoleToggle.addEventListener("click", () => {
    el.sidebar.classList.remove("open");
    el.replPanel.classList.toggle("open");
  });

  // ============================================================
  // Boot
  // ============================================================
  renderSidebar();
  renderTopbarTrail();
  renderTopic(0);
  initPyodide();

})();

</script>
</body>
</html>
