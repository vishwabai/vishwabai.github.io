<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scaling Systems — an animated tour</title>
<style>
:root{
  --bg:#0b0d12;
  --panel:#12151c;
  --text:#eae7e1;
  --text-dim:#8b93a1;
  --blue:#6f9bc9;
  --amber:#d0a35f;
  --teal:#5fab97;
  --rose:#c07575;
  --violet:#9585b8;
  --line:#262b36;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#000;}
body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;gap:16px;padding:16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
#stage{
  width:min(94vw, 94vh * 16 / 9);
  aspect-ratio:16/9;
  background:var(--bg);
  position:relative;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 0 0 1px var(--line), 0 30px 80px -30px rgba(0,0,0,.8);
  display:flex;flex-direction:column;
  padding:clamp(14px,2.2vw,32px) clamp(20px,3.4vw,50px);
}
#conceptView{display:flex;flex-direction:column;flex:1;min-height:0;}
#simpleView{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;}
#stage.simple #conceptView{display:none;}
#stage.simple #simpleView{display:flex;}

.topbar{display:flex;justify-content:space-between;align-items:center;font-size:clamp(10px,1vw,13px);letter-spacing:.06em;color:var(--text-dim);flex:0 0 auto;}
.eyebrow{color:var(--blue);}
h1#slideTitle{margin:4px 0 0;font-size:clamp(19px,2.5vw,32px);font-weight:600;letter-spacing:-.01em;flex:0 0 auto;min-height:1.3em;color:var(--text);}
.narrative{flex:0 0 auto;min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:3px;}
.line{opacity:0;transform:translateY(6px);transition:opacity .55s ease,transform .55s ease;font-size:clamp(13px,1.3vw,17px);text-align:center;color:var(--text-dim);}
.line.show{opacity:1;transform:translateY(0);}
.line.gap{color:var(--amber);}
.content-row{flex:1 1 auto;display:flex;gap:clamp(12px,2.2vw,32px);min-height:0;align-items:stretch;margin-top:4px;}
.diagram-box{width:100%;transition:width .7s cubic-bezier(.4,0,.2,1);min-width:0;display:flex;align-items:center;justify-content:center;}
.diagram-box.compact{width:53%;}
.diagram-box svg{width:100%;height:100%;display:block;overflow:visible;}
.panel-box{width:0;opacity:0;overflow:hidden;transition:width .7s cubic-bezier(.4,0,.2,1),opacity .5s ease .1s;display:flex;flex-direction:column;justify-content:center;gap:9px;}
.panel-box.show{width:47%;opacity:1;overflow-y:auto;}
.panel-box h3{margin:6px 0 3px;font-size:clamp(10px,.95vw,11.5px);text-transform:uppercase;letter-spacing:.09em;color:var(--teal);font-weight:700;}
.panel-box h3:first-child{margin-top:0;}
.panel-box ul{margin:0 0 2px;padding-left:17px;}
.panel-box li{font-size:clamp(11.5px,1.15vw,14.5px);line-height:1.48;color:var(--text);margin-bottom:4px;opacity:0;transform:translateY(4px);transition:opacity .5s ease,transform .5s ease;}
.panel-box.show li{opacity:1;transform:translateY(0);}
.formula{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:clamp(11.5px,1.05vw,14px);background:#171b23;border:1px solid var(--line);border-radius:6px;padding:7px 11px;color:var(--amber);opacity:0;transform:translateY(4px);transition:opacity .5s ease,transform .5s ease;}
.panel-box.show .formula{opacity:1;transform:translateY(0);}
.fill-label{flex:0 0 auto;min-height:22px;text-align:center;font-size:clamp(12px,1.15vw,14.5px);color:var(--teal);opacity:0;transition:opacity .5s ease;font-weight:600;margin-top:2px;}
.fill-label.show{opacity:1;}

.simple-eyebrow{font-size:clamp(11px,1.1vw,14px);letter-spacing:.14em;text-transform:uppercase;color:var(--blue);opacity:0;transition:opacity .6s ease,transform .6s ease;transform:translateY(8px);}
.simple-eyebrow.show{opacity:1;transform:translateY(0);}
.simple-title{font-size:clamp(28px,4.6vw,58px);font-weight:700;letter-spacing:-.01em;line-height:1.05;opacity:0;transition:opacity .7s ease,transform .7s ease;transform:translateY(10px);max-width:88%;}
.simple-title.show{opacity:1;transform:translateY(0);}
.simple-sub{font-size:clamp(13px,1.4vw,19px);color:var(--text-dim);max-width:640px;opacity:0;transition:opacity .6s ease,transform .6s ease;transform:translateY(8px);}
.simple-sub.show{opacity:1;transform:translateY(0);}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:82%;}
.chip{border:1px solid var(--line);color:var(--text-dim);background:var(--panel);padding:6px 13px;border-radius:20px;font-size:clamp(11px,1.05vw,13px);opacity:0;transform:translateY(6px);transition:opacity .45s ease,transform .45s ease;}
.chip.show{opacity:1;transform:translateY(0);color:var(--text);border-color:var(--blue);}
.pillar{opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease;font-size:clamp(13px,1.25vw,17px);color:var(--text-dim);}
.pillar.show{opacity:1;transform:translateY(0);}
.pillar b{color:var(--teal);font-weight:600;}

.nav{display:flex;align-items:center;gap:14px;}
.nav button{background:var(--panel);border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.nav button:hover{background:#1a1f29;}
.nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
.nav button:disabled{opacity:.25;cursor:default;}
#dots{display:flex;gap:5px;flex-wrap:wrap;max-width:56vw;justify-content:center;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);cursor:pointer;transition:background .2s,transform .2s;border:none;padding:0;}
.dot.active{background:var(--blue);transform:scale(1.6);}
.dot.section{background:var(--amber);}
.hint{position:absolute;bottom:10px;right:16px;font-size:10px;color:var(--text-dim);opacity:.6;letter-spacing:.05em;}
@media (max-width:720px){
  .content-row{flex-direction:column;}
  .diagram-box.compact{width:100%;height:52%;}
  .panel-box.show{width:100%;height:48%;}
}
</style>
</head>
<body>
<div id="stage">
  <div id="conceptView">
    <div class="topbar"><span class="eyebrow" id="eyebrow">—</span><span id="counter">1 / 1</span></div>
    <h1 id="slideTitle"></h1>
    <div class="narrative">
      <div class="line recap" id="recapLine"></div>
      <div class="line gap" id="gapLine"></div>
    </div>
    <div class="content-row">
      <div class="diagram-box" id="diagramBox"></div>
      <div class="panel-box" id="panelBox"></div>
    </div>
    <div class="fill-label" id="fillLabel"></div>
  </div>
  <div id="simpleView"></div>
  <div class="hint">use ← → or space</div>
</div>
<div class="nav">
  <button id="prevBtn" aria-label="Previous">‹</button>
  <div id="dots"></div>
  <button id="nextBtn" aria-label="Next">›</button>
</div>

<script>
/* ============================= CORE UTIL ============================= */
const SVGNS='http://www.w3.org/2000/svg';
function se(tag,attrs={}){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function svgRoot(){return se('svg',{viewBox:'0 0 1000 560',preserveAspectRatio:'xMidYMid meet'});}
function txt(x,y,str,opts={}){const t=se('text',Object.assign({x,y,fill:'var(--text)','font-size':16,'text-anchor':'middle'},opts));t.textContent=str;return t;}
function makeBox(x,y,w,h,label,sub,color){
  color=color||'var(--blue)';
  const g=se('g',{});
  const rect=se('rect',{x,y,width:w,height:h,rx:10,fill:'#12151c',stroke:color,'stroke-width':2});
  g.appendChild(rect);
  const labelEl=txt(x+w/2,y+h/2+(sub!==undefined&&sub!==''?-4:6),label,{'font-size':16.5,fill:'var(--text)','font-weight':600});
  g.appendChild(labelEl);
  let subEl=null;
  if(sub!==undefined){subEl=txt(x+w/2,y+h/2+18,sub,{'font-size':11.5,fill:'var(--text-dim)'});g.appendChild(subEl);}
  return {g,rect,labelEl,subEl,x,y,w,h};
}
function dotNode(cx,cy,r,color,label){
  const g=se('g',{});
  g.appendChild(se('circle',{cx,cy,r,fill:color}));
  if(label){g.appendChild(txt(cx,cy+4,label,{'font-size':11,fill:'#0b0d12','font-weight':700}));}
  return g;
}
function token(x,y,color,label){
  color=color||'var(--amber)';
  const g=se('g',{transform:`translate(${x},${y})`});
  g.style.transition='transform .8s cubic-bezier(.4,0,.2,1)';
  g.appendChild(se('circle',{r:10,fill:color}));
  if(label){g.appendChild(txt(0,4,label,{'font-size':10,fill:'#0b0d12','font-weight':700}));}
  return g;
}
function moveTo(el,x,y){el.setAttribute('transform',`translate(${x},${y})`);}
function line(x1,y1,x2,y2,color,w,dash){
  const attrs={x1,y1,x2,y2,stroke:color||'var(--line)','stroke-width':w||2};
  if(dash)attrs['stroke-dasharray']=dash;
  return se('line',attrs);
}
function growLine(parent,x1,y1,x2,y2,color,dur){
  color=color||'var(--line)';dur=dur||550;
  const len=Math.hypot(x2-x1,y2-y1)||1;
  const l=se('line',{x1,y1,x2,y2,stroke:color,'stroke-width':2,'stroke-dasharray':len,'stroke-dashoffset':len});
  l.style.transition=`stroke-dashoffset ${dur}ms ease`;
  parent.appendChild(l);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{l.style.strokeDashoffset='0';}));
  return l;
}
function flash(el,color){
  if(!el)return;
  color=color||'var(--amber)';
  const orig=el.getAttribute('data-orig')||el.getAttribute('stroke')||'var(--blue)';
  el.setAttribute('data-orig',orig);
  el.setAttribute('stroke',color);
  const id=setTimeout(()=>el.setAttribute('stroke',orig),420);
  addTimer(id);
}
let timers=[];
function addTimer(id){timers.push(id);}
function clearAllTimers(){timers.forEach(id=>{clearTimeout(id);clearInterval(id);});timers=[];}
function wait(ms){return new Promise(res=>{const id=setTimeout(res,ms);addTimer(id);});}
function every(ms,fn){const id=setInterval(fn,ms);addTimer(id);return id;}
function nextFrame(){return new Promise(res=>requestAnimationFrame(()=>requestAnimationFrame(res)));}

/* ===================== GENERIC SEQUENCE DIAGRAM ===================== */
/* boxes: [{id,x,y,w,h,label,sub,color}]  steps: [{type:'send'|'broadcast',from,to|tos,label,color}] looped */
function sequenceDiagram(container,opts){
  const svg=svgRoot();container.appendChild(svg);
  const map={};
  opts.boxes.forEach(b=>{const m=makeBox(b.x,b.y,b.w,b.h,b.label,b.sub!==undefined?b.sub:'',b.color);svg.appendChild(m.g);map[b.id]=m;});
  function edgePoint(a,b){
    const acx=a.x+a.w/2, acy=a.y+a.h/2, bcx=b.x+b.w/2, bcy=b.y+b.h/2;
    if(Math.abs(acx-bcx)>=Math.abs(acy-bcy)){return [bcx>=acx?a.x+a.w:a.x, acy];}
    return [acx, bcy>=acy?a.y+a.h:a.y];
  }
  const drawn=new Set();
  function ensureLine(fromId,toId){
    const key=fromId+'>'+toId;
    if(drawn.has(key))return; drawn.add(key);
    const a=map[fromId],b=map[toId];
    const [x1,y1]=edgePoint(a,b); const [x2,y2]=edgePoint(b,a);
    growLine(svg,x1,y1,x2,y2,'var(--line)',400);
  }
  opts.steps.forEach(s=>{
    if(s.type==='broadcast'){s.tos.forEach(t=>ensureLine(s.from,t));}
    else ensureLine(s.from,s.to);
  });
  async function runStep(s,idx){
    if(s.type==='broadcast'){
      const a=map[s.from];
      flash(a.rect,s.color||'var(--amber)');
      const toks=s.tos.map(toId=>{
        const b=map[toId];const [x1,y1]=edgePoint(a,b);
        const tk=token(x1,y1,s.color||'var(--teal)',String(idx+1));svg.appendChild(tk);return {tk,b,toId};
      });
      await nextFrame();
      toks.forEach(({tk,b})=>{const [x2,y2]=edgePoint(b,a);moveTo(tk,x2,y2);});
      await wait(760);
      toks.forEach(({b})=>flash(b.rect,s.color||'var(--amber)'));
      await wait(300);
      toks.forEach(({tk})=>{tk.style.transition='opacity .35s';tk.style.opacity='0';const id=setTimeout(()=>tk.remove(),350);addTimer(id);});
      await wait(180);
      return;
    }
    const a=map[s.from],b=map[s.to];
    const [x1,y1]=edgePoint(a,b);
    const tk=token(x1,y1,s.color||'var(--teal)',String(idx+1));
    svg.appendChild(tk);
    flash(a.rect,s.color||'var(--amber)');
    await nextFrame();
    const [x2,y2]=edgePoint(b,a);
    moveTo(tk,x2,y2);
    let lbl=null;
    if(s.label){lbl=txt((x1+x2)/2,(y1+y2)/2-10,s.label,{'font-size':11,fill:'var(--text-dim)'});svg.appendChild(lbl);}
    await wait(740);
    flash(b.rect,s.color||'var(--amber)');
    await wait(260);
    if(lbl){lbl.remove();}
    tk.style.transition='opacity .35s';tk.style.opacity='0';
    const id=setTimeout(()=>tk.remove(),350);addTimer(id);
    await wait(160);
  }
  async function run(){for(let i=0;i<opts.steps.length;i++){await runStep(opts.steps[i],i);}}
  (async function loop(){await run();await wait(900);loop();})();
  return svg;
}

/* ============================ DIAGRAM LIB ============================ */
const DIAGRAMS={};

/* ---- Load balancing algorithms ---- */
DIAGRAMS.lb=function(container,mode){
  const svg=svgRoot();container.appendChild(svg);
  svg.appendChild(dotNode(65,280,15,'var(--violet)'));
  svg.appendChild(txt(65,317,'Client',{'font-size':12.5,fill:'var(--text-dim)'}));
  const lbSubMap={roundrobin:'cycles 1→2→3→4',weighted:'sends more to heavy',leastconn:'picks fewest busy',leastresponsetime:'picks fastest reply',iphash:'hash(client key)',random:'picks uniformly',powerof2:'2 picks, best wins'};
  const lb=makeBox(190,246,130,68,'LB',lbSubMap[mode]||'',  'var(--amber)');
  svg.appendChild(lb.g);
  growLine(svg,80,280,190,280,'var(--line)',400);
  const sy=[36,164,292,420];
  const initSub=mode==='weighted'?['weight 4','weight 1','weight 2','weight 1']
              :mode==='leastconn'?['conns 0','conns 0','conns 0','conns 0']
              :mode==='leastresponsetime'?['— ms','— ms','— ms','— ms']
              :mode==='powerof2'?['load 40','load 70','load 25','load 55']
              :['','','',''];
  const boxes=sy.map((y,i)=>{const b=makeBox(600,y,230,78,'Server '+(i+1),initSub[i],'var(--blue)');svg.appendChild(b.g);growLine(svg,320,280,600,y+39,'var(--line)',400);return b;});
  let rr=0,wi=0;
  const weights=[4,1,2,1];const wseq=[];weights.forEach((w,i)=>{for(let k=0;k<w;k++)wseq.push(i);});
  const conns=[0,0,0,0];
  const loads=mode==='powerof2'?[40,70,25,55]:[0,0,0,0];
  function releaseConn(i){const id=setTimeout(()=>{conns[i]=Math.max(0,conns[i]-1);if(boxes[i].subEl)boxes[i].subEl.textContent='conns '+conns[i];},1500+Math.random()*900);addTimer(id);}
  function pick(){
    if(mode==='roundrobin'){const i=rr%4;rr++;return i;}
    if(mode==='weighted'){const i=wseq[wi%wseq.length];wi++;return i;}
    if(mode==='leastconn'){let mi=0;for(let i=1;i<4;i++)if(conns[i]<conns[mi])mi=i;conns[mi]++;boxes[mi].subEl.textContent='conns '+conns[mi];releaseConn(mi);return mi;}
    if(mode==='leastresponsetime'){for(let i=0;i<4;i++)loads[i]=15+Math.random()*95;let mi=0;for(let i=1;i<4;i++)if(loads[i]<loads[mi])mi=i;boxes.forEach((b,i)=>b.subEl.textContent=Math.round(loads[i])+' ms');return mi;}
    if(mode==='iphash'){const ips=['192.168.1.4','10.0.0.9','172.16.2.1'];const ip=ips[rr%3];rr++;let h=0;for(const c of ip)h=(h*31+c.charCodeAt(0))>>>0;lb.subEl.textContent=ip;return h%4;}
    if(mode==='random'){return Math.floor(Math.random()*4);}
    if(mode==='powerof2'){const a=Math.floor(Math.random()*4);let b=Math.floor(Math.random()*4);while(b===a)b=Math.floor(Math.random()*4);const win=loads[a]<=loads[b]?a:b;loads[win]=Math.min(95,loads[win]+18);loads.forEach((l,i)=>{if(i!==win)loads[i]=Math.max(8,loads[i]-5);});boxes.forEach((bx,i)=>bx.subEl.textContent='load '+Math.round(loads[i])+(i===a||i===b?' •':''));return win;}
    return rr++%4;
  }
  function fire(){
    const tk=token(85,280,'var(--teal)');svg.appendChild(tk);
    requestAnimationFrame(()=>requestAnimationFrame(()=>moveTo(tk,255,280)));
    const id1=setTimeout(()=>{
      const idx=pick();
      moveTo(tk,710,sy[idx]+39);
      flash(boxes[idx].rect,'var(--teal)');
      const id2=setTimeout(()=>{tk.style.transition='opacity .35s';tk.style.opacity='0';const id3=setTimeout(()=>tk.remove(),350);addTimer(id3);},780);
      addTimer(id2);
    },650);
    addTimer(id1);
  }
  fire();every(1700,fire);
  return svg;
};

/* ---- Consistent hashing ring ---- */
DIAGRAMS.ring=function(container){
  const svg=svgRoot();container.appendChild(svg);
  const cx=500,cy=290,r=205;
  svg.appendChild(se('circle',{cx,cy,r,fill:'none',stroke:'var(--line)','stroke-width':2}));
  const servers=[{a:-100,id:'S1'},{a:-30,id:'S2'},{a:50,id:'S3'},{a:130,id:'S4'},{a:190,id:'S5'}];
  function pos(angleDeg,rad){const a=angleDeg*Math.PI/180;return [cx+rad*Math.cos(a),cy+rad*Math.sin(a)];}
  const sEls={};
  servers.forEach(s=>{const [x,y]=pos(s.a,r);const g=dotNode(x,y,15,'var(--blue)',s.id);svg.appendChild(g);sEls[s.id]={ang:s.a,g};});
  const keys=[{a:-115,id:'k1'},{a:-70,id:'k2'},{a:-8,id:'k3'},{a:70,id:'k4'},{a:110,id:'k5'},{a:170,id:'k6'}];
  function clockwiseOwner(angle,serverList){
    let best=null,bestDiff=999;
    serverList.forEach(s=>{let diff=s.a-angle;while(diff<0)diff+=360;if(diff<bestDiff){bestDiff=diff;best=s;}});
    return best;
  }
  const keyLines={};
  const activeServers=servers.slice();
  keys.forEach(k=>{
    const [kx,ky]=pos(k.a,r-52);
    const dotEl=dotNode(kx,ky,7,'var(--amber)');svg.appendChild(dotEl);
    const owner=clockwiseOwner(k.a,activeServers);
    const [ox,oy]=pos(owner.a,r);
    const l=growLine(svg,kx,ky,ox,oy,'var(--amber)',500);
    keyLines[k.id]={l,kx,ky,angle:k.a};
  });
  svg.appendChild(txt(cx,40,'keys travel clockwise to the next server',{'font-size':13,fill:'var(--text-dim)'}));
  async function addServer(){
    await wait(2600);
    const newAngle=15;
    const [nx,ny]=pos(newAngle,r);
    const ng=dotNode(nx,ny,15,'var(--rose)','S6');ng.style.opacity='0';ng.style.transition='opacity .6s';svg.appendChild(ng);
    await nextFrame();ng.style.opacity='1';
    activeServers.push({a:newAngle,id:'S6'});
    const lbl=txt(nx,ny-26,'new node joins',{'font-size':12,fill:'var(--rose)'});svg.appendChild(lbl);
    await wait(500);
    // remap only keys whose clockwise owner is now S6
    keys.forEach(k=>{
      const owner=clockwiseOwner(k.a,activeServers);
      if(owner.id==='S6'){
        const old=keyLines[k.id];
        old.l.style.transition='opacity .4s';old.l.style.opacity='0';
        const [ox,oy]=pos(newAngle,r);
        const nl=growLine(svg,old.kx,old.ky,ox,oy,'var(--rose)',600);
        keyLines[k.id].l=nl;
      }
    });
    await wait(2200);
    lbl.remove();
  }
  addServer();
  return svg;
};

/* ---- LB types ---- */
DIAGRAMS.l4l7=function(container){
  const svg=svgRoot();container.appendChild(svg);
  svg.appendChild(txt(250,36,'L4 — transport layer',{'font-size':13,fill:'var(--blue)','font-weight':700}));
  svg.appendChild(txt(750,36,'L7 — application layer',{'font-size':13,fill:'var(--teal)','font-weight':700}));
  const c1=makeBox(60,220,110,60,'Client','','var(--violet)');svg.appendChild(c1.g);
  const l1=makeBox(230,220,120,60,'L4 LB','sees IP:port only','var(--blue)');svg.appendChild(l1.g);
  const s1a=makeBox(410,150,120,55,'Server A','','var(--blue)');svg.appendChild(s1a.g);
  const s1b=makeBox(410,300,120,55,'Server B','','var(--blue)');svg.appendChild(s1b.g);
  growLine(svg,170,250,230,250,'var(--line)');
  growLine(svg,350,240,410,177,'var(--line)');
  growLine(svg,350,260,410,327,'var(--line)');

/* ---- Eviction policies ---- */
DIAGRAMS.eviction=function(container){
  const svg=svgRoot();container.appendChild(svg);
  const modes=['LRU','LFU','FIFO','MRU'];
  const modeLabel=txt(500,40,'LRU — evict Least Recently Used',{'font-size':15,fill:'var(--amber)','font-weight':700});svg.appendChild(modeLabel);
  const items=[
    {id:'A',recency:4,freq:2,arrival:1},
    {id:'B',recency:1,freq:5,arrival:2},
    {id:'C',recency:3,freq:1,arrival:3},
    {id:'D',recency:2,freq:3,arrival:4},
  ];
  const slotX=[130,340,550,760];
  const boxes=items.map((it,i)=>{
    const b=makeBox(slotX[i],200,170,110,it.id,`recency ${it.recency} · freq ${it.freq} · arr ${it.arrival}`,'var(--blue)');
    svg.appendChild(b.g);return b;
  });
  const incoming=makeBox(430,380,170,80,'incoming','new request','var(--amber)');svg.appendChild(incoming.g);
  function pickEvict(mode){
    if(mode==='LRU')return items.reduce((a,b)=>a.recency>b.recency?a:b); // higher recency number = staler
    if(mode==='LFU')return items.reduce((a,b)=>a.freq<b.freq?a:b);
    if(mode==='FIFO')return items.reduce((a,b)=>a.arrival<b.arrival?a:b);
    if(mode==='MRU')return items.reduce((a,b)=>a.recency<b.recency?a:b);
  }
  const letterPool=['E','F','G','H','I','J','K'];
  let mi=0,li=0,arrivalCounter=4;
  async function cycle(){
    const mode=modes[mi%modes.length];mi++;
    modeLabel.textContent=mode+' — evict '+({LRU:'Least Recently Used',LFU:'Least Frequently Used',FIFO:'oldest arrival',MRU:'Most Recently Used'})[mode];
    const victim=pickEvict(mode);
    const vi=items.indexOf(victim);
    flash(boxes[vi].rect,'var(--rose)');
    boxes[vi].g.style.transition='opacity .5s, transform .5s';
    boxes[vi].g.style.opacity='0.15';
    await wait(900);
    const newLetter=letterPool[li%letterPool.length];li++;
    arrivalCounter++;
    incoming.labelEl.textContent=newLetter;
    incoming.g.style.transition='transform .7s ease, opacity .3s';
    incoming.g.setAttribute('transform',`translate(${slotX[vi]-430},${200-380})`);
    await wait(750);
    const newMeta={id:newLetter,recency:0,freq:1,arrival:arrivalCounter};
    items[vi]=newMeta;
    boxes[vi].labelEl.textContent=newMeta.id;
    boxes[vi].subEl.textContent='just inserted (freshest)';
    boxes[vi].g.style.opacity='1';
    incoming.g.setAttribute('transform','translate(0,0)');
    incoming.g.style.opacity='0';
    await wait(300);
    incoming.g.style.opacity='1';
    incoming.labelEl.textContent='incoming';
    incoming.subEl.textContent='new request';
    await wait(1700);
    boxes[vi].subEl.textContent=`recency ${newMeta.recency} · freq ${newMeta.freq} · arr ${newMeta.arrival}`;
    await wait(500);
    cycle();
  }
  cycle();
  return svg;
};

/* ---- Failure modes: stampede / penetration / avalanche ---- */
DIAGRAMS.stampede=function(container){
  const svg=svgRoot();container.appendChild(svg);
  const cache=makeBox(400,80,200,70,'Cache','hot key just expired','var(--rose)');svg.appendChild(cache.g);
  const db=makeBox(400,420,200,70,'Database','','var(--blue)');svg.appendChild(db.g);
  const apps=[0,1,2,3,4].map(i=>makeBox(60+i*180,230,140,60,'Req '+(i+1),'','var(--violet)'));
  apps.forEach(a=>{svg.appendChild(a.g);growLine(svg,a.x+70,290,500,320,'var(--line)',350);});
  const lock=txt(500,360,'',{'font-size':13,fill:'var(--amber)','font-weight':700});svg.appendChild(lock);
  async function phase(withLock){
    lock.textContent=withLock?'single-flight lock: only one passes through':'';
    for(let i=0;i<apps.length;i++){
      const t=token(apps[i].x+70,290,'var(--rose)');svg.appendChild(t);
      const target = (withLock && i>0) ? [500,150] : [500,420];
      requestAnimationFrame(()=>requestAnimationFrame(()=>moveTo(t,...target)));
      const rid=setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';const r2=setTimeout(()=>t.remove(),300);addTimer(r2);},700);
      addTimer(rid);
      if(!withLock) flash(db.rect,'var(--rose)');
    }
    if(withLock){await wait(300);flash(db.rect,'var(--amber)');}
    await wait(1500);
  }
  async function loop(){await phase(false);await wait(700);await phase(true);await wait(1200);loop();}
  loop();
  return svg;
};
DIAGRAMS.penetration=function(container){
  const svg=svgRoot();container.appendChild(svg);
  const app=makeBox(60,250,140,60,'Requests','key does not exist','var(--violet)');svg.appendChild(app.g);
  const filter=makeBox(370,250,170,70,'Bloom filter','off at first','var(--rose)');svg.appendChild(filter.g);
  const cache=makeBox(370,120,170,60,'Cache','always miss','var(--teal)');svg.appendChild(cache.g);
  const db=makeBox(650,250,180,70,'Database','pounded repeatedly','var(--blue)');svg.appendChild(db.g);
  growLine(svg,200,280,370,280,'var(--line)');growLine(svg,540,280,650,280,'var(--line)');
  let filterOn=false;
  async function fire(){
    const t=token(200,280,'var(--rose)');svg.appendChild(t);await nextFrame();
    if(filterOn){
      moveTo(t,455,280);await wait(650);flash(filter.rect,'var(--teal)');
      const lbl=txt(455,240,'rejected early ✓',{'font-size':11,fill:'var(--teal)'});svg.appendChild(lbl);
      await wait(700);lbl.remove();
    } else {
      moveTo(t,650,280+35);await wait(700);flash(db.rect,'var(--rose)');
    }
    t.style.opacity='0';t.style.transition='opacity .3s';const r=setTimeout(()=>t.remove(),300);addTimer(r);
    await wait(500);
  }
  async function loop(){
    for(let i=0;i<3;i++) await fire();
    filterOn=true;filter.subEl.textContent='now filtering unknown keys';flash(filter.rect,'var(--amber)');
    await wait(700);
    for(let i=0;i<3;i++) await fire();
    await wait(900);
    filterOn=false;filter.subEl.textContent='off at first';
    await wait(600);loop();
  }
  loop();
  return svg;
};
DIAGRAMS.avalanche=function(container){
  const svg=svgRoot();container.appendChild(svg);
  const db=makeBox(400,420,200,70,'Database','','var(--blue)');svg.appendChild(db.g);
  const keys=[0,1,2,3,4].map(i=>makeBox(60+i*180,120,140,60,'key '+(i+1),'TTL','var(--teal)'));
  keys.forEach(k=>svg.appendChild(k.g));
  const bars=keys.map(k=>{const bg=se('rect',{x:k.x+10,y:k.y+45,width:120,height:8,rx:4,fill:'#1a1e27'});svg.appendChild(bg);const bar=se('rect',{x:k.x+10,y:k.y+45,width:120,height:8,rx:4,fill:'var(--teal)'});svg.appendChild(bar);return bar;});
  const note=txt(500,60,'same TTL for every key → all expire together',{'font-size':12.5,fill:'var(--text-dim)'});svg.appendChild(note);
  async function burst(jitter){
    bars.forEach((b,i)=>{b.style.transition='width 2200ms linear';b.style.width='120px';});
    await nextFrame();
    bars.forEach((b,i)=>{const delay=jitter?i*90:0;const id=setTimeout(()=>{b.style.width='0px';},delay);addTimer(id);});
    await wait(jitter?2600:2300);
    for(let i=0;i<keys.length;i++){
      const delay= jitter? i*160 : 0;
      const id=setTimeout(()=>{
        const t=token(keys[i].x+70,180,'var(--rose)');svg.appendChild(t);
        requestAnimationFrame(()=>requestAnimationFrame(()=>moveTo(t,500,420)));
        flash(db.rect,'var(--rose)');
        const r=setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';const r2=setTimeout(()=>t.remove(),300);addTimer(r2);},650);
        addTimer(r);
      },delay);
      addTimer(id);
    }
    await wait(jitter?1900:1200);
  }
  async function loop(){
    note.textContent='same TTL for every key → all expire together';
    await burst(false);
    await wait(900);
    note.textContent='jittered TTL → expirations spread out, load smoothed';
    await burst(true);
    await wait(1200);loop();
  }
  loop();
  return svg;
};

  const rows=[{label:'Synchronous',y:110,color:'var(--blue)'},{label:'Asynchronous',y:300,color:'var(--teal)'}];
  const client=[];const primary=[];const replica=[];
  rows.forEach(r=>{

    const p=makeBox(230,r.y,140,60,'Primary','','var(--amber)');svg.appendChild(p.g);primary.push(p);

    const ackLbl=txt(760,r.y+35,'',{'font-size':12,fill:r.color});svg.appendChild(ackLbl);
    client.push(ackLbl);
  });
  async function runRow(i,sync){
    const p=primary[i],rep=replica[i];
    const t=token(p.x+70,p.y-20,'var(--amber)','W');svg.appendChild(t);await nextFrame();moveTo(t,p.x+70,p.y+30);await wait(500);

    flash(rep.rect,'var(--blue)');

      await wait(500);

      client[i].textContent='responded immediately (faster, tiny data-loss risk)';

DIAGRAMS.delivery=function(container){
  const svg=svgRoot();container.appendChild(svg);
  const cols=[
    {x:40,title:'At-most-once',color:'var(--rose)',note:'fire & forget'},
    {x:370,title:'At-least-once',color:'var(--amber)',note:'retry on failure'},
    {x:700,title:'Exactly-once',color:'var(--teal)',note:'dedup / idempotent'},
  ];
  const state=cols.map(col=>{
    svg.appendChild(txt(col.x+130,34,col.title,{'font-size':13,fill:col.color,'font-weight':700}));
    svg.appendChild(txt(col.x+130,52,col.note,{'font-size':10.5,fill:'var(--text-dim)'}));
    const prod=makeBox(col.x+30,110,150,55,'Producer','','var(--violet)');svg.appendChild(prod.g);
    const cons=makeBox(col.x+30,320,150,55,'Consumer','','var(--blue)');svg.appendChild(cons.g);
    const log=txt(col.x+105,420,'',{'font-size':12,fill:col.color});svg.appendChild(log);
    return {prod,cons,log,col};
  });
  async function run(){
    // at most once: send once, drop on crash
    let t=token(state[0].prod.x+75,175,state[0].col.color);state[0].prod.g.parentNode.appendChild(t);
    await nextFrame();moveTo(t,state[0].prod.x+75,320);await wait(500);
    const crash=Math.random()<0.5;
    if(crash){state[0].log.textContent='message lost ✕';t.style.opacity='0';t.style.transition='opacity .3s';}
    else {state[0].log.textContent='delivered once';flash(state[0].cons.rect,state[0].col.color);}
    // at least once: retry -> duplicate
    let t2=token(state[1].prod.x+75,175,state[1].col.color);state[1].prod.g.parentNode.appendChild(t2);
    await nextFrame();moveTo(t2,state[1].prod.x+75,320);await wait(500);
    state[1].log.textContent='no ack → retry sent';
    let t2b=token(state[1].prod.x+75,175,state[1].col.color);state[1].prod.g.parentNode.appendChild(t2b);
    await nextFrame();moveTo(t2b,state[1].prod.x+75,320);await wait(500);
    flash(state[1].cons.rect,state[1].col.color);state[1].log.textContent='processed twice (needs idempotency)';
    // exactly once
    let t3=token(state[2].prod.x+75,175,state[2].col.color);state[2].prod.g.parentNode.appendChild(t3);
    await nextFrame();moveTo(t3,state[2].prod.x+75,320);await wait(500);
    state[2].log.textContent='dedup id check → apply once';flash(state[2].cons.rect,state[2].col.color);
    await wait(2200);
    [t,t2,t2b,t3].forEach(x=>{try{x.remove();}catch(e){}});
    state.forEach(s=>s.log.textContent='');
    await wait(700);run();
  }
  run();
  return svg;
};

DIAGRAMS.circuitbreaker=function(container){
  const svg=svgRoot();container.appendChild(svg);
  const app=makeBox(60,240,140,60,'App','','var(--violet)');svg.appendChild(app.g);
  const cb=makeBox(380,215,220,110,'Circuit Breaker','state: CLOSED','var(--amber)');svg.appendChild(cb.g);
  const svc=makeBox(760,240,180,60,'Downstream service','flaky','var(--rose)');svg.appendChild(svc.g);
  growLine(svg,200,270,380,270,'var(--line)');growLine(svg,600,270,760,270,'var(--line)');
  let state='CLOSED',failCount=0;
  async function step(){
    const t=token(200,270,'var(--teal)');svg.appendChild(t);await nextFrame();moveTo(t,470,270);await wait(550);
    if(state==='CLOSED'){
      flash(cb.rect,'var(--amber)');
      const fails=Math.random()<0.65;
      if(fails){moveTo(t,850,270);await wait(600);flash(svc.rect,'var(--rose)');failCount++;}
      else{failCount=0;flash(svc.rect,'var(--teal)');await wait(200);}
      t.style.opacity='0';t.style.transition='opacity .3s';const r=setTimeout(()=>t.remove(),300);addTimer(r);
      if(failCount>=3){state='OPEN';failCount=0;cb.subEl.textContent='state: OPEN — tripped';flash(cb.rect,'var(--rose)');}
    } else if(state==='OPEN'){
      cb.subEl.textContent='state: OPEN — rejecting instantly, no call made';
      flash(cb.rect,'var(--rose)');
      t.style.opacity='0';t.style.transition='opacity .3s';const r=setTimeout(()=>t.remove(),300);addTimer(r);
      await wait(500);
      state='HALF';cb.subEl.textContent='state: HALF-OPEN — testing one call';
    } else {
      flash(cb.rect,'var(--amber)');
      moveTo(t,850,270);await wait(600);
      const recovered=Math.random()<0.55;
      flash(svc.rect,recovered?'var(--teal)':'var(--rose)');
      t.style.opacity='0';t.style.transition='opacity .3s';const r=setTimeout(()=>t.remove(),300);addTimer(r);
      if(recovered){state='CLOSED';cb.subEl.textContent='state: CLOSED — recovered';}
      else{state='OPEN';cb.subEl.textContent='state: OPEN — still failing';}
    }
    await wait(750);step();
  }
  step();

};

  svg.appendChild(txt(chartX+chartW+34,thresholdY+4,'80%',{'font-size':10.5,fill:'var(--rose)'}));
  const poly=se('polyline',{points:'',fill:'none',stroke:'var(--teal)','stroke-width':2});svg.appendChild(poly);
  const pool=se('g',{});svg.appendChild(pool);
  function drawPool(n){pool.innerHTML='';for(let i=0;i<n;i++){const b=makeBox(60+i*95,300,80,90,'S'+(i+1),'','var(--teal)');pool.appendChild(b.g);}}
  let n=2;drawPool(n);

};

DIAGRAMS.gossip=function(container){
  const svg=svgRoot();container.appendChild(svg);
  const n=8;
  const positions=[];
  for(let i=0;i<n;i++){const a=i*(360/n)-90;positions.push({x:500+200*Math.cos(a*Math.PI/180),y:270+200*Math.sin(a*Math.PI/180)});}
  const nodes=positions.map((p,i)=>dotNode(p.x,p.y,18,'var(--blue)','N'+(i+1)));
  nodes.forEach(nd=>svg.appendChild(nd));
  let informed=new Set([0]);
  nodes[0].querySelector('circle').setAttribute('fill','var(--amber)');
  svg.appendChild(txt(500,50,'node 1 learns something new — gossips to random peers each round',{'font-size':12,fill:'var(--text-dim)'}));
  async function round(){
    const newlyInformed=[];
    informed.forEach(i=>{
      const peer=Math.floor(Math.random()*n);
      if(peer!==i){
        const l=growLine(svg,positions[i].x,positions[i].y,positions[peer].x,positions[peer].y,'var(--amber)',450);
        const rid=setTimeout(()=>l.remove(),1150);addTimer(rid);
        if(!informed.has(peer))newlyInformed.push(peer);
      }
    });
    await wait(650);
    newlyInformed.forEach(i=>{informed.add(i);nodes[i].querySelector('circle').setAttribute('fill','var(--amber)');});
    await wait(450);
    if(informed.size>=n){
      await wait(900);
      informed=new Set([0]);
      nodes.forEach((nd,i)=>nd.querySelector('circle').setAttribute('fill',i===0?'var(--amber)':'var(--blue)'));
    }
    round();
  }
  round();
  return svg;
};

  fill:'Place servers and keys on a ring — a key just walks clockwise to the next server.',
  diagram:()=>DIAGRAMS.ring(diagramBox),
  theory:['Servers and keys are hashed onto the same circular space (0…2^32−1).','A key belongs to the first server found going clockwise from its position.','Adding/removing one server only remaps the keys between it and its clockwise neighbor — roughly 1/N of all keys, not all of them.','Real systems add "virtual nodes" per server to smooth out uneven ring spacing.'],
  formula:'owner(key) = min{ s ∈ servers : hash(s) ≥ hash(key) }  (wrap around)',
  practical:['Distributed caches (Memcached, Redis Cluster) and CDN/edge routing.','Sharding a datastore where nodes are added or removed over time.']}),
C({id:'random',section:'Load Balancing',title:'Random',
  recap:'Deterministic schemes need state or a hash function.',
  gap:'What\'s the cheapest possible decision the LB could make?',
  fill:'Just pick uniformly at random — with enough requests it evens out.',
  diagram:()=>DIAGRAMS.lb(diagramBox,'random'),
  theory:['No state, no history, no coordination between LB instances required.','By the law of large numbers, load converges to roughly even across servers.','Individual requests can still get unlucky — a few consecutive picks can hit the same server.'],
  formula:'target = uniform_random(1 .. N)',
  practical:['Very large fleets where per-request tracking is expensive relative to the benefit.','A common building block inside client-side or multi-LB architectures.']}),
C({id:'powerof2',section:'Load Balancing',title:'Power of Two Choices',
  recap:'Random is cheap but its unlucky streaks hurt.',
  gap:'Can we keep it cheap but avoid the worst outcomes?',
  fill:'Sample two servers at random, and send the request to the less-loaded of the two.',
  diagram:()=>DIAGRAMS.lb(diagramBox,'powerof2'),
  theory:['Checking just 2 random candidates (instead of all N) dramatically reduces the worst-case load imbalance versus pure random.','This is the "power of two choices" result from queueing theory — going from 1 sample to 2 gives an exponential improvement; going from 2 to 3 gives much less.','Cheaper than tracking full global state, almost as balanced as always picking the true minimum.'],
  formula:'pick a,b uniformly ; target = argmin( load_a, load_b )',
  practical:['Used inside modern proxies/meshes (e.g. many service-mesh load balancers) as the default algorithm.','Great middle ground when full least-connections state is too costly to maintain.']}),
C({id:'l4l7',section:'Load Balancing',title:'L4 vs L7 Load Balancing',
  recap:'We\'ve covered how to pick a server.',
  gap:'But how much does the load balancer actually understand about the request?',
  fill:'L4 only sees packets (IP/port); L7 reads the full HTTP request to decide.',
  diagram:()=>DIAGRAMS.l4l7(diagramBox),
  theory:['Layer 4 (transport): routes based on IP address and TCP/UDP port — fast, protocol-agnostic, can\'t see paths or headers.','Layer 7 (application): terminates HTTP(S) and reads path, headers, cookies, even body — enables routing by URL, A/B testing, and content-based rules.','L7 costs more CPU (TLS termination, parsing) but unlocks far richer routing logic.'],
  formula:null,
  practical:['L4: raw TCP proxying, non-HTTP protocols, minimal-latency routing.','L7: API gateways, path-based microservice routing, canary releases by header.']}),
C({id:'reverseproxy',section:'Load Balancing',title:'Reverse Proxy',
  recap:'L7 balancers read the request before deciding.',
  gap:'What else can sit in front of your servers and do that?',
  fill:'A reverse proxy: one front door that terminates TLS, hides origins, and forwards.',
  diagram:()=>DIAGRAMS.reverseproxy(diagramBox),
  theory:['Sits between clients and origin servers, forwarding requests on their behalf.','Centralizes TLS termination, compression, request/response caching, and access logging.','Clients never see or connect to the real origin IPs — a security and flexibility win.'],
  formula:null,
  practical:['Nginx/HAProxy/Envoy in front of an app fleet.','API gateways, and hiding internal topology from the public internet.']}),
C({id:'servicelb',section:'Load Balancing',title:'Service Load Balancing',
  recap:'A reverse proxy is one dedicated hop in the middle.',
  gap:'In a mesh of microservices, does every call need that extra hop?',
  fill:'Server-side LB adds a tier; client-side LB lets the caller pick, using a service registry.',
  diagram:()=>DIAGRAMS.servicelb(diagramBox),
  theory:['Server-side: a dedicated LB tier (or L4/L7 proxy) sits between caller and callees — simple, but one more network hop and a shared bottleneck.','Client-side: each caller queries a service registry (like Eureka/Consul) for live instances and balances locally — no extra hop, but every client embeds LB logic.','Service meshes (Envoy sidecars) blend both: local proxy per instance, centrally configured.'],
  formula:null,
  practical:['Client-side LB inside large microservice fleets (Netflix Ribbon-style).','Server-side LB when clients must stay simple (e.g. browsers, external partners).']}),
C({id:'globallb',section:'Load Balancing',title:'Global (Geo) Load Balancing',
  recap:'So far, everything has lived in one datacenter.',
  gap:'What happens when your users — and your servers — are spread across the planet?',
  fill:'Route each user to the nearest healthy region using DNS or anycast.',
  diagram:()=>DIAGRAMS.globallb(diagramBox),
  theory:['A global server load balancer (GSLB) picks a region based on geography, latency probes, or network proximity (anycast).','Also handles failover — if a whole region goes down, traffic shifts to the next-nearest healthy one.','Trades perfect load evenness for dramatically lower latency per user.'],
  formula:null,
  practical:['Multi-region web apps and CDNs.','Disaster recovery: automatically failing over when a region has an outage.']}),
C({id:'dnslb',section:'Load Balancing',title:'DNS Load Balancing',
  recap:'Global LB needs some mechanism to steer users to a region.',
  gap:'What\'s the simplest possible way to do that steering?',
  fill:'DNS load balancing: return a different IP from a pool of A records.',
  diagram:()=>DIAGRAMS.dnslb(diagramBox),
  theory:['The DNS server holds multiple A/AAAA records for one hostname and rotates or geo-selects which it returns.','Once resolved, the client connects directly to that IP — DNS is out of the path after that.','Coarse-grained: DNS caching/TTLs mean changes propagate slowly, and DNS can\'t see server health in real time without extra tooling.'],
  formula:null,
  practical:['A cheap first layer of load distribution before a smarter L4/L7 tier.','Combined with health-checked DNS (Route 53 etc.) for basic regional failover.']}),

/* ---------------- CACHING ---------------- */
C({id:'cacheaside',section:'Caching',title:'Cache-Aside (Lazy Loading)',
  recap:'A database can only serve so many reads per second.',
  gap:'What if most of those reads are asking for the same few things?',
  fill:'Cache-aside: the app checks the cache first, and only goes to the DB on a miss.',
  diagram:()=>DIAGRAMS.cacheaside(diagramBox),
  theory:['The application, not the cache, owns the read logic: check cache → miss → read DB → populate cache.','Only requested data ever gets cached — no wasted space on data nobody reads.','If the app forgets to populate the cache, that key silently stays uncached forever.'],
  formula:null,
  practical:['The most common general-purpose caching pattern (e.g. Redis in front of Postgres/MySQL).','Good default for read-heavy, unpredictable access patterns.']}),
C({id:'readthrough',section:'Caching',title:'Read-Through',
  recap:'In cache-aside, the app itself talks to both cache and DB.',
  gap:'Can the cache take that responsibility off the app\'s hands?',
  fill:'Read-through: the cache loads missing data from the DB itself, transparently.',
  diagram:()=>DIAGRAMS.readthrough(diagramBox),
  theory:['The app only ever talks to the cache; the cache has a configured "loader" that fetches from the DB on miss.','Simplifies application code — one code path, no manual populate step.','Ties you to a caching layer that supports this loader pattern (e.g. many caching libraries, some managed caches).'],
  formula:null,
  practical:['Caching libraries/frameworks with a pluggable loader (e.g. Guava Cache, some ORM-level caches).','Systems where you want cache-miss logic centralized, not scattered across the app.']}),
C({id:'writethrough',section:'Caching',title:'Write-Through',
  recap:'We\'ve covered reads — cache-aside and read-through.',
  gap:'But what happens to the cache when the app writes new data?',
  fill:'Write-through: every write goes to the cache, which synchronously writes to the DB too.',
  diagram:()=>DIAGRAMS.writethrough(diagramBox),
  theory:['Write path goes app → cache → DB, and only acknowledges once the DB write succeeds.','Cache and DB are always consistent immediately after a write.','Every write pays the full DB latency — no write speedup, just read speedup later.'],
  formula:null,
  practical:['Systems where read-after-write consistency matters and writes aren\'t the bottleneck.','Often paired with cache-aside or read-through for the read side.']}),
C({id:'writebehind',section:'Caching',title:'Write-Behind (Write-Back)',
  recap:'Write-through makes every write wait for the DB.',
  gap:'What if we could acknowledge the write instantly and catch up later?',
  fill:'Write-behind: acknowledge from cache immediately, flush to the DB asynchronously.',
  diagram:()=>DIAGRAMS.writebehind(diagramBox),
  theory:['The write lands in cache and returns success right away; a background process batches and flushes to the DB.','Much lower write latency, and batching can reduce DB load significantly.','A crash before the flush can lose data — durability is weaker than write-through.'],
  formula:null,
  practical:['High write-throughput systems that can tolerate a small durability window (metrics, counters, activity feeds).','Batching writes to reduce database IOPS costs.']}),
C({id:'writearound',section:'Caching',title:'Write-Around',
  recap:'Write-through and write-behind both touch the cache on every write.',
  gap:'But what if most written data is never read again soon — why cache it at all?',
  fill:'Write-around: write straight to the DB, skip the cache, and only populate it on a later read.',
  diagram:()=>DIAGRAMS.writearound(diagramBox),
  theory:['Writes bypass the cache entirely; the next read for that key is a cache miss that populates it (like cache-aside).','Avoids filling the cache with data that\'s written once and rarely re-read soon after.','The first read after a write always pays a cache-miss penalty.'],
  formula:null,
  practical:['Write-heavy, rarely-re-read data — logs, audit trails, bulk imports.','Keeping the cache full of "hot," actually-requested data instead of write noise.']}),
C({id:'refreshahead',section:'Caching',title:'Refresh-Ahead',
  recap:'TTL-based caches eventually expire and force a slow, blocking miss.',
  gap:'Could the cache refresh itself before that miss ever happens?',
  fill:'Refresh-ahead: proactively reload a hot entry from the DB just before it expires.',
  diagram:()=>DIAGRAMS.refreshahead(diagramBox),
  theory:['The cache tracks access frequency and TTL; when a hot key crosses a threshold (e.g. 75% of TTL), it triggers an async reload.','Users almost never see a cold miss for frequently-accessed keys.','Wastes work refreshing keys that turn out not to be requested again soon — tuning the threshold matters.'],
  formula:'refresh_trigger_time = last_load_time + (TTL × threshold)',
  practical:['Very hot, latency-critical keys (leaderboards, pricing, config) that must never feel slow.','Combined with normal TTL for the cache\'s long tail of less-popular keys.']}),
C({id:'ttl',section:'Caching',title:'TTL — Time To Live',
  recap:'A cache entry that never expires eventually goes stale forever.',
  gap:'So how does a cache know when to just let go of a value?',
  fill:'Give every entry a TTL — a countdown after which it\'s automatically evicted.',
  diagram:()=>DIAGRAMS.ttl(diagramBox),
  theory:['Each key is stored with an expiry timestamp; once passed, reads treat it as a miss (lazy expiry) or a background sweep removes it (active expiry).','Bounds staleness — you know the maximum age of any value you\'ll ever read.','Picking TTL is a trade-off: too short → constant DB hits; too long → stale data lingers.'],
  formula:'expires_at = now() + TTL ; valid = (now() < expires_at)',
  practical:['Session tokens, rate-limit counters, API response caching.','Almost every cache pattern above assumes some TTL underneath it.']}),
C({id:'eviction',section:'Caching',title:'Cache Eviction (LRU · LFU · FIFO · MRU)',
  recap:'TTL handles time — but caches also have limited space.',
  gap:'When the cache is full and something new must come in, what gets kicked out?',
  fill:'An eviction policy decides — LRU, LFU, FIFO, and MRU each pick differently.',
  diagram:()=>DIAGRAMS.eviction(diagramBox),
  theory:['LRU (Least Recently Used): evict whatever hasn\'t been touched the longest — assumes recent access predicts future access.','LFU (Least Frequently Used): evict the lowest hit-count item — good for stable "popularity" distributions.','FIFO: evict in strict arrival order, ignoring usage entirely — simplest, cheapest to implement.','MRU (Most Recently Used): evict what was just used — useful for scan-once access patterns where recently-used items are least likely to be needed again.'],
  formula:null,
  practical:['LRU is the default in most caches (Redis, Memcached, CPU caches).','LFU suits catalogs with stable popularity (top products); MRU suits sequential table scans.']}),
C({id:'invalidation',section:'Caching',title:'Cache Invalidation',
  recap:'Eviction handles a full cache — but data can go bad before that.',
  gap:'"There are only two hard things in computer science…" — what\'s the other one?',
  fill:'Cache invalidation: explicitly clear or update stale entries the moment the source changes.',
  diagram:()=>DIAGRAMS.invalidation(diagramBox),
  theory:['Passive: just let TTL expire the entry eventually — simple, but stale for up to a full TTL window.','Active: on every write, explicitly delete or update the matching cache key(s) — fresher, but you must find every affected key.','Fan-out invalidation (tags, versioned keys) helps when one write affects many cached entries.'],
  formula:null,
  practical:['Deleting a cached user profile the moment that user updates their profile.','Cache-tagging systems that invalidate whole groups of keys after a bulk update.']}),
C({id:'stampede',section:'Caching',title:'Cache Stampede',
  recap:'We now know how entries expire.',
  gap:'What happens the instant a hugely popular key expires and 1000 requests arrive at once?',
  fill:'They all miss simultaneously and slam the database — a stampede. A lock fixes it: only one rebuilds.',
  diagram:()=>DIAGRAMS.stampede(diagramBox),
  theory:['Also called the "thundering herd" problem — many concurrent requests for the same expired key all fall through to the DB together.','Fix: single-flight / mutex locking — the first request rebuilds the value while others wait and reuse its result.','Alternative fix: serve a slightly-stale value while one background request refreshes it ("stale-while-revalidate").'],
  formula:null,
  practical:['Any viral/hot key: a trending post, a homepage config, a popular product page.','Distributed locks (Redis SETNX, etc.) implementing single-flight across multiple app servers.']}),
C({id:'penetration',section:'Caching',title:'Cache Penetration',
  recap:'Stampede is about a real key that just expired.',
  gap:'What if requests keep asking for a key that never existed in the first place?',
  fill:'Every request bypasses the cache and pounds the DB — fix it with a bloom filter or cached "null."',
  diagram:()=>DIAGRAMS.penetration(diagramBox),
  theory:['A cache can only cache values that exist — lookups for non-existent keys always "miss" and reach the DB, every single time.','Fix 1: cache the negative result too (a short-TTL "not found" marker).','Fix 2: a bloom filter in front of the cache rejects requests for keys that provably don\'t exist, before they ever reach the DB.'],
  formula:null,
  practical:['Defending against scraping/enumeration attacks probing random IDs.','Any lookup-by-ID API exposed publicly.']}),
C({id:'avalanche',section:'Caching',title:'Cache Avalanche',
  recap:'Stampede is one key; penetration is a missing key.',
  gap:'What if many different keys all expire at the exact same moment?',
  fill:'A mass expiry avalanche hits the DB all at once — fix it by jittering the TTLs.',
  diagram:()=>DIAGRAMS.avalanche(diagramBox),
  theory:['If many keys are set with the same fixed TTL (e.g. all cached at deploy time), they all expire together, causing a synchronized load spike.','Fix: add random jitter to each TTL (TTL ± random%) so expirations spread out over time.','Also mitigated by cache redundancy (multi-node) so one cache node failing doesn\'t take everything down at once.'],
  formula:'ttl_i = base_ttl + random(-jitter, +jitter)',
  practical:['Warming a cache in bulk after a deploy or cache-server restart.','Any batch-loaded dataset with a single shared expiry.']}),
C({id:'hotkey',section:'Caching',title:'Hot Keys',
  recap:'Avalanche is many keys expiring together.',
  gap:'What if it\'s the opposite — one single key getting a disproportionate share of ALL traffic?',
  fill:'A hot key overloads the one node that owns it — spread it out by replicating it locally.',
  diagram:()=>DIAGRAMS.hotkey(diagramBox),
  theory:['In a sharded/distributed cache, one key always maps to one node — a viral key concentrates all its traffic there, regardless of how many nodes exist.','Fix: replicate the hot key\'s value across multiple nodes, or add a local (in-process) cache layer in front to absorb reads before they even hit the distributed cache.','Detecting hot keys usually needs sampling/monitoring, since it\'s invisible in aggregate metrics.'],
  formula:null,
  practical:['Celebrity/viral content, trending topics, flash-sale product pages.','CDN edge caching is essentially "hot key" mitigation at global scale.']}),
C({id:'tiers',section:'Caching',title:'Cache Tiers — Local, Distributed, CDN',
  recap:'We\'ve covered how a single cache can fail under load.',
  gap:'What if one layer of caching isn\'t enough — can caches stack?',
  fill:'Yes: local (in-process) → distributed (shared) → CDN (edge) — each trading speed for scope.',
  diagram:()=>DIAGRAMS.tiers(diagramBox),
  theory:['Local cache: lives in the app process\'s memory — sub-millisecond, but not shared across instances and lost on restart.','Distributed cache: a shared service (Redis/Memcached cluster) — slightly slower, but consistent across all app instances.','CDN cache: caches static/HTTP responses at edge locations near the end user — highest scope, used before requests even reach your infrastructure.'],
  formula:null,
  practical:['Local: hot config/feature flags read on every request.','Distributed: session data, shared computed results.','CDN: images, JS bundles, and any cacheable HTTP GET response.']}),

/* ---------------- DATABASE SCALING ---------------- */
C({id:'readreplicas',section:'Database Scaling',title:'Read Replicas',
  recap:'One database server can only take so much traffic.',
  gap:'Most apps read far more than they write — can we offload just the reads?',
  fill:'Read replicas: copy the primary\'s data to extra servers dedicated to serving reads.',
  diagram:()=>DIAGRAMS.readreplicas(diagramBox),
  theory:['Writes always go to the primary; the primary asynchronously streams changes to one or more replicas.','Reads can be spread across replicas (often via round robin or least-connections) to multiply read capacity.','Replication lag means a replica read can momentarily return slightly stale data ("eventual consistency").'],
  formula:null,
  practical:['Analytics/reporting queries routed to a dedicated replica so they never slow down live traffic.','Scaling read-heavy APIs without resharding the whole dataset.']}),
C({id:'shardvpart',section:'Database Scaling',title:'Sharding vs Partitioning',
  recap:'Read replicas scale reads, but every replica still holds ALL the data.',
  gap:'What happens once the data itself is too big for any one machine?',
  fill:'Split it up: sharding spreads rows across separate servers; partitioning splits a table within one server.',
  diagram:()=>DIAGRAMS.shardvpart(diagramBox),
  theory:['Sharding (horizontal scaling): each shard is a separate database instance holding a subset of rows (by hash or range of a shard key) — scales storage and compute together.','Partitioning: splits one large table into smaller physical pieces inside the same database instance (e.g. by date range) — mainly helps query/maintenance performance, not raw capacity.','Sharding adds real complexity: cross-shard joins and transactions become hard or impossible.'],
  formula:'shard_id = hash(shard_key) mod num_shards',
  practical:['Sharding: multi-tenant SaaS split by customer_id; huge user tables split by user_id.','Partitioning: time-series tables partitioned by month for fast archival and pruning.']}),
C({id:'replication',section:'Database Scaling',title:'Replication — Sync vs Async',
  recap:'We\'ve used replication to build read replicas.',
  gap:'But when the primary writes, does it wait for the replica — or not?',
  fill:'Synchronous replication waits for the replica\'s ack; asynchronous doesn\'t.',
  diagram:()=>DIAGRAMS.replication(diagramBox),
  theory:['Synchronous: the primary only confirms a write after at least one replica has durably stored it — zero data loss on primary failure, but higher write latency.','Asynchronous: the primary confirms immediately and replicates in the background — fast writes, but a crash before replication can lose the most recent writes.','Semi-synchronous is a common middle ground: wait for at least one replica, not all.'],
  formula:null,
  practical:['Sync: financial ledgers and anything where losing the last write is unacceptable.','Async: most read-scaling replicas, where a tiny lag window is an acceptable trade for speed.']}),
C({id:'connpool',section:'Database Scaling',title:'Connection Pooling',
  recap:'Every write and read needs an open connection to the database.',
  gap:'What does it cost to open a brand-new connection for every single request?',
  fill:'A lot — so reuse a pool of pre-established connections instead.',
  diagram:()=>DIAGRAMS.connpool(diagramBox),
  theory:['Opening a DB connection means a TCP handshake plus (often) authentication — real, repeated latency and DB-side resource cost.','A connection pool keeps N connections open and hands them out ("checkout") and back ("checkin") as requests need them.','Pool size must be tuned: too small causes request queuing, too large can overwhelm the database\'s max-connections limit.'],
  formula:'wait_time ↑ as concurrent_requests → pool_size ; throughput capped near pool_size / avg_query_time',
  practical:['Nearly universal in production apps — PgBouncer, HikariCP, and ORM built-in pools.','Especially critical for serverless functions, where cold connections are expensive per invocation.']}),
C({id:'querycache',section:'Database Scaling',title:'Query Caching',
  recap:'Connection pooling makes it cheap to reach the DB.',
  gap:'But what if we could avoid reaching it at all for a repeated query?',
  fill:'Cache the query result itself, keyed by the SQL text (or an equivalent signature).',
  diagram:()=>DIAGRAMS.querycache(diagramBox),
  theory:['A layer (in the DB engine, an ORM, or an external cache) stores the result set keyed by the exact query + parameters.','Any write to a table involved in a cached query must invalidate that cache entry — the hard part of query caching.','Most effective for expensive, frequently-repeated, rarely-changing queries.'],
  formula:null,
  practical:['Dashboards and reports run by many users with identical filters.','ORMs with built-in query caching for read-mostly reference data.']}),
C({id:'matview',section:'Database Scaling',title:'Materialized Views',
  recap:'Query caching stores a result until something invalidates it.',
  gap:'What about a heavy JOIN/aggregate that\'s expensive every single time it runs?',
  fill:'Precompute it once into its own table — a materialized view — and refresh on a schedule.',
  diagram:()=>DIAGRAMS.matview(diagramBox),
  theory:['Unlike a normal view (just a stored query), a materialized view physically stores the computed result as a real table.','Reads become a simple, fast table scan instead of a live multi-table JOIN or aggregation.','Freshness is bounded by the refresh interval — it\'s not automatically up to date after every write.'],
  formula:null,
  practical:['Daily/hourly sales dashboards built from a heavy JOIN across orders, users, and items.','Search-ranking or leaderboard tables recomputed on a schedule.']}),
C({id:'denorm',section:'Database Scaling',title:'Denormalization',
  recap:'Materialized views precompute an aggregate result.',
  gap:'What if the JOIN itself, even a simple one, is on your hottest read path?',
  fill:'Denormalize: duplicate the data into one wide row so reads need zero JOINs.',
  diagram:()=>DIAGRAMS.denorm(diagramBox),
  theory:['Normalized schemas minimize duplication (each fact lives in one place) at the cost of JOINs to reassemble a full picture.','Denormalization copies related data directly onto the row you read most, trading storage and write complexity for read speed.','Writes now have to keep the duplicated copies in sync — a source of subtle bugs if done manually.'],
  formula:null,
  practical:['Storing a customer\'s name/address directly on an order row so displaying an order needs one query, not three.','Common in NoSQL and read-optimized reporting tables.']}),
C({id:'secidx',section:'Database Scaling',title:'Secondary Indexes',
  recap:'Denormalization avoids JOINs by duplicating data.',
  gap:'But what about just finding a row fast in the first place, by a non-primary-key column?',
  fill:'A secondary index — usually a B-tree — turns a full scan into a fast lookup.',
  diagram:()=>DIAGRAMS.secidx(diagramBox),
  theory:['Without an index, filtering by e.g. email means scanning every row — O(n).','A secondary index maintains a sorted structure (typically a B-tree) mapping the indexed column\'s values to row locations — lookups become O(log n).','Every index speeds up matching reads but slows down writes slightly (the index must be updated too) and uses extra storage.'],
  formula:'scan: O(n)   vs   B-tree index lookup: O(log n)',
  practical:['Indexing foreign keys and any column used in WHERE/JOIN/ORDER BY clauses.','Composite indexes for queries filtering on multiple columns together.']}),
C({id:'federation',section:'Database Scaling',title:'Database Federation',
  recap:'Sharding splits one entity type across many machines.',
  gap:'What if instead the split is by function — users here, orders there?',
  fill:'Federation: separate databases per functional domain, each independently scaled.',
  diagram:()=>DIAGRAMS.federation(diagramBox),
  theory:['Unlike sharding (same schema, different data subsets), federation splits by *responsibility*: a Users DB, an Orders DB, a Products DB, each with its own schema.','Each federated DB can be scaled, tuned, and even choose its own storage engine independently.','Cross-domain queries and transactions now require the application layer to coordinate — no single JOIN across federations.'],
  formula:null,
  practical:['Splitting a monolith\'s single giant database along domain boundaries before or during a microservices migration.','Isolating a noisy domain (e.g. analytics) so it can\'t starve the core transactional DB.']}),
C({id:'polyglot',section:'Database Scaling',title:'Polyglot Persistence',
  recap:'Federation splits by domain, but still often uses one DB technology.',
  gap:'What if different kinds of data just don\'t fit the same kind of database well?',
  fill:'Polyglot persistence: use the right storage engine for each job — relational, document, key-value, graph, search.',
  diagram:()=>DIAGRAMS.polyglot(diagramBox),
  theory:['Relational DBs excel at transactions and structured relationships; document stores suit flexible/evolving schemas; key-value stores are fastest for simple lookups (sessions, counters); graph DBs excel at deep relationship traversal; search indexes (Elasticsearch) excel at full-text queries.','Choosing per-workload avoids forcing every access pattern through one engine\'s strengths and weaknesses.','The cost is operational: more systems to run, monitor, back up, and keep skills for.'],
  formula:null,
  practical:['SQL for payments, Redis for sessions, Elasticsearch for product search, Neo4j for a recommendation graph — all in one app.','A common architecture at scale-out consumer companies.']}),
C({id:'cqrs',section:'Database Scaling',title:'CQRS',
  recap:'Polyglot persistence picks the best store per data type.',
  gap:'What if even the SAME data wants a different shape for writing vs. reading?',
  fill:'CQRS: separate the write model from the read model entirely, and sync between them.',
  diagram:()=>DIAGRAMS.cqrs(diagramBox),
  theory:['Command Query Responsibility Segregation splits an application\'s "write side" (commands, validated and normalized) from its "read side" (queries, denormalized and pre-shaped for display).','The read model is a projection, kept up to date asynchronously (often via events) after each write.','Adds real complexity and eventual consistency between the two sides — only worth it when read and write needs genuinely diverge.'],
  formula:null,
  practical:['Complex domains with rich business rules on write, but very different, high-volume read shapes (e-commerce catalogs, dashboards).','Pairs naturally with event sourcing for the write side.']}),
C({id:'eventsourcing',section:'Database Scaling',title:'Event Sourcing',
  recap:'CQRS separates the write model from the read model.',
  gap:'What if we stopped storing "current state" for writes altogether?',
  fill:'Event sourcing: store every change as an immutable event; current state is just a replay.',
  diagram:()=>DIAGRAMS.eventsourcing(diagramBox),
  theory:['Instead of overwriting a row, every state change is appended as an event to a log (Created, Updated, Shipped…).','Current state is derived by replaying events from the start (or from a periodic snapshot for speed).','Gives you a perfect audit trail and the ability to reconstruct state "as of" any point in time — at the cost of more complex reads and eventual snapshotting infrastructure.'],
  formula:'state = fold(events, initial_state, apply)',
  practical:['Financial ledgers, order lifecycles, anything requiring a full audit trail.','Often paired with CQRS: events feed the read-model projections.']}),
C({id:'dbperservice',section:'Database Scaling',title:'Database-per-Service',
  recap:'Federation and polyglot persistence both still let some things share a database.',
  gap:'In a microservices world, should any two services ever share one database directly?',
  fill:'No — database-per-service: each service owns its data exclusively, and others reach it only via API.',
  diagram:()=>DIAGRAMS.dbperservice(diagramBox),
  theory:['Each microservice has its own private database; no other service is allowed to query it directly.','Enforces true service boundaries — a service\'s internal schema can change freely without breaking others.','Cross-service queries and transactions now require API calls or asynchronous events instead of a JOIN — this is the price of independence.'],
  formula:null,
  practical:['Standard microservices architecture — Orders service owns orders_db, Payments service owns payments_db, etc.','Avoids the classic "shared database" anti-pattern that quietly re-couples services meant to be independent.']}),

/* ---------------- MESSAGING & ASYNC ---------------- */
C({id:'mq',section:'Messaging & Async',title:'Message Queues',
  recap:'A synchronous call makes the caller wait for the callee.',
  gap:'What if the caller shouldn\'t have to wait — or the callee is temporarily slower?',
  fill:'Put a queue between them: the producer drops a message and moves on; the consumer drains it at its own pace.',
  diagram:()=>DIAGRAMS.mq(diagramBox),
  theory:['A queue decouples producer and consumer in both time and speed — they never need to be online, or fast, at the same moment.','The queue itself acts as a buffer that absorbs bursts, smoothing a spiky producer rate into a steady consumer rate.','Typically FIFO (first-in, first-out) per queue, though this can vary by implementation.'],
  formula:null,
  practical:['Sending a welcome email after signup without making the user wait for SMTP.','Any background job: image processing, report generation, notifications.']}),
C({id:'pubsub',section:'Messaging & Async',title:'Pub/Sub',
  recap:'A basic queue delivers each message to one consumer.',
  gap:'What if many independent parts of the system all need to know about the same event?',
  fill:'Publish/Subscribe: every subscriber gets its own copy of every message.',
  diagram:()=>DIAGRAMS.pubsub(diagramBox),
  theory:['The publisher doesn\'t know or care who\'s listening — it just publishes to a topic.','Every subscriber to that topic receives an independent copy — this is broadcast, not competition for a single message.','Decouples producers from an ever-growing (or shrinking) set of interested consumers.'],
  formula:null,
  practical:['"User signed up" fanning out to email service, analytics, CRM sync, and welcome-bonus service simultaneously.','Real-time notifications and event-driven architectures.']}),
C({id:'kafka',section:'Messaging & Async',title:'Event Streams & Kafka',
  recap:'Pub/Sub broadcasts a message, then it\'s gone.',
  gap:'What if a new consumer joins later — shouldn\'t it see history, not just the future?',
  fill:'An event stream (like Kafka) is a durable, append-only log — consumers read at their own offset and pace.',
  diagram:()=>DIAGRAMS.kafka(diagramBox),
  theory:['Messages are appended to a persistent log and retained for a configured period (or forever), not deleted on consumption.','Each consumer tracks its own offset (read position), so a slow consumer and a fast consumer can coexist without interfering.','Streams are usually split into partitions for parallelism — more on that shortly.'],
  formula:null,
  practical:['Event-driven microservices, clickstream/analytics pipelines, CDC (change-data-capture) from a database.','Anywhere you need replayability — reprocessing history when a new consumer is added.']}),
C({id:'rabbitsqs',section:'Messaging & Async',title:'RabbitMQ-style vs SQS-style',
  recap:'A queue can be built in very different ways.',
  gap:'A smart broker that routes messages, or a dumb, simple pull-based queue — which is "better"?',
  fill:'Neither — RabbitMQ pushes with flexible routing rules; SQS-style pulls with simple visibility timeouts.',
  diagram:()=>DIAGRAMS.rabbitsqs(diagramBox),
  theory:['Broker-style (RabbitMQ): messages hit an exchange, which routes them to one or more queues based on rules/bindings — flexible fan-out and filtering logic.','Managed-queue-style (SQS): a simple, horizontally-scalable queue; consumers poll for messages and get a temporary "visibility timeout" lock while processing.','Broker-style gives more routing power; managed-queue-style trades that flexibility for operational simplicity and near-infinite scale.'],
  formula:null,
  practical:['RabbitMQ: complex routing topologies, RPC-style request/reply messaging.','SQS-style: simple, massively-scalable task queues with minimal operational overhead.']}),
C({id:'consumergroups',section:'Messaging & Async',title:'Consumer Groups',
  recap:'A stream can have many independent consumers.',
  gap:'But what if one consumer alone can\'t keep up with the volume?',
  fill:'Group consumers together: each partition is owned by exactly one member of the group, sharing the load.',
  diagram:()=>DIAGRAMS.consumergroups(diagramBox),
  theory:['A consumer group splits a topic\'s partitions among its members — each partition is read by exactly one consumer in the group at a time.','If a consumer dies, the group rebalances and its partitions are reassigned to the survivors — automatic failover with no message loss.','Two different consumer groups reading the same topic each get their own full copy of the stream — groups don\'t compete with each other.'],
  formula:null,
  practical:['Scaling out Kafka consumers horizontally for high-throughput topics.','Running multiple independent services (e.g. billing, analytics) off the same event stream, each as its own group.']}),
C({id:'partitiontopics',section:'Messaging & Async',title:'Partitioned Topics & Ordering',
  recap:'Partitioning is how a topic gets parallelism.',
  gap:'But if messages are spread across partitions, is order guaranteed at all?',
  fill:'Only within a partition — so route by key to keep related messages, and their order, together.',
  diagram:()=>DIAGRAMS.partitiontopics(diagramBox),
  theory:['A topic is split into N partitions; a message\'s key is hashed to pick its partition, so every message with the same key always lands in the same partition, in send order.','Ordering is guaranteed within a single partition, never globally across the whole topic.','More partitions = more parallel consumers = more throughput, but also more overhead and weaker global ordering.'],
  formula:'partition = hash(message_key) mod num_partitions',
  practical:['Keying events by user_id or order_id so each entity\'s history stays perfectly ordered.','Sizing partition count around your target consumer parallelism.']}),
C({id:'delivery',section:'Messaging & Async',title:'Delivery Semantics',
  recap:'Ordering is about sequence — but what about duplicates or drops?',
  gap:'When a consumer crashes mid-message, does the system lose it, duplicate it, or somehow do neither?',
  fill:'Three guarantees exist: at-most-once (can lose), at-least-once (can duplicate), exactly-once (neither — but hardest to build).',
  diagram:()=>DIAGRAMS.delivery(diagramBox),
  theory:['At-most-once: send and forget, no retry — simplest and fastest, but a failure means the message is just gone.','At-least-once: retry until acknowledged — guarantees delivery, but the same message can be processed more than once, so consumers must be idempotent.','Exactly-once: achieved via deduplication (idempotency keys) or transactional produce/consume — the strongest guarantee, at real cost in complexity and throughput.'],
  formula:null,
  practical:['At-most-once: metrics/telemetry pings where an occasional drop is fine.','At-least-once + idempotency keys: the pragmatic default for payments and order processing.','Exactly-once: financial transfers where duplicates are unacceptable and system supports it end-to-end.']}),
C({id:'competing',section:'Messaging & Async',title:'Competing Consumers',
  recap:'Pub/sub broadcasts a copy to every subscriber.',
  gap:'What if instead we want exactly one worker to handle each message, sharing the load?',
  fill:'Competing consumers: multiple workers pull from the same queue, and each message goes to exactly one of them.',
  diagram:()=>DIAGRAMS.competing(diagramBox),
  theory:['All consumers listen to the same single queue; the queue hands each message to whichever consumer is free, not to all of them.','This is the load-distribution counterpart to pub/sub\'s broadcast — same mechanism, opposite delivery semantics.','Scaling throughput is as simple as adding more consumer instances.'],
  formula:null,
  practical:['Image/video processing pipelines with a pool of worker instances.','Any embarrassingly-parallel background job spread across a worker fleet.']}),
C({id:'workqueues',section:'Messaging & Async',title:'Work Queues',
  recap:'Competing consumers share load across workers.',
  gap:'What does that actually look like for a real, fallible unit of work?',
  fill:'Work (task) queues: each job is acknowledged only after success, and requeued automatically on failure.',
  diagram:()=>DIAGRAMS.workqueues(diagramBox),
  theory:['A task is only removed from the queue once a worker explicitly acknowledges completion — if the worker crashes mid-task, it\'s automatically redelivered.','This ack/requeue cycle is what makes work queues resilient to individual worker failures.','Left unchecked, an always-failing task can loop forever — which is exactly why dead-letter queues exist.'],
  formula:null,
  practical:['Video transcoding, PDF generation, ETL jobs — anything modeled as discrete, retryable units of work.','Celery, Sidekiq, and similar background-job frameworks are built on this pattern.']}),
C({id:'fanoutin',section:'Messaging & Async',title:'Fan-out / Fan-in',
  recap:'One event can trigger several independent downstream tasks.',
  gap:'And once those parallel tasks finish, how does the system know they\'re all done?',
  fill:'Fan-out spreads one event into many parallel tasks; fan-in waits for them and merges the results.',
  diagram:()=>DIAGRAMS.fanoutin(diagramBox),
  theory:['Fan-out: one trigger message spawns N independent, parallel downstream operations — often via pub/sub or explicit dispatch.','Fan-in: a join step waits for some or all of those N results before proceeding (e.g. "wait for all," "wait for first").','Together they express parallel workflows without a heavyweight orchestrator, though a true saga/orchestrator is often used for complex cases.'],
  formula:null,
  practical:['"Place order" fanning out to charge card, reserve stock, and notify — then confirming only once all three succeed.','Scatter-gather search: query multiple backends in parallel, then merge results.']}),
C({id:'dlq',section:'Messaging & Async',title:'Dead-Letter Queues',
  recap:'Work queues retry a failed task automatically.',
  gap:'But what if a message keeps failing — forever? Does it just loop, blocking everything behind it?',
  fill:'After max retries, route it to a dead-letter queue instead — out of the way, ready for inspection.',
  diagram:()=>DIAGRAMS.dlq(diagramBox),
  theory:['A DLQ is a separate queue that receives messages which exceeded their retry limit, rather than being silently dropped or endlessly retried.','Keeps a single "poison message" from blocking or endlessly consuming resources on the main queue.','Messages in the DLQ can be inspected, fixed, and manually replayed once the root cause is understood.'],
  formula:null,
  practical:['Catching malformed events, bad payloads, or a downstream dependency that\'s been down too long.','A standard, expected part of any production queue/consumer setup.']}),
C({id:'retrydelayedpriority',section:'Messaging & Async',title:'Retry, Delayed & Priority Queues',
  recap:'We\'ve seen queues that just process messages as they arrive.',
  gap:'But what about messages that need to wait, retry with backoff, or jump the line?',
  fill:'Three specialized variants: retry queues delay-then-reattempt, delayed queues wait for a scheduled time, priority queues serve importance first.',
  diagram:()=>DIAGRAMS.retrydelayedpriority(diagramBox),
  theory:['Retry queue: a failed message is re-enqueued after a backoff delay (often exponential) instead of retrying immediately and hammering a struggling dependency.','Delayed queue: a message is deliberately invisible/undeliverable until a future scheduled time — used for "do this later," not "do this again."','Priority queue: messages carry a priority level; workers always drain higher-priority messages first, regardless of arrival order.'],
  formula:'retry: backoff = base × 2^attempt (exponential backoff)',
  practical:['Retry: calling a flaky third-party API with exponential backoff.','Delayed: "remind the user in 24 hours," scheduled reports.','Priority: VIP-customer requests processed ahead of the general queue.']}),

/* ---------------- RESILIENCY & INFRASTRUCTURE ---------------- */
C({id:'circuitbreaker',section:'Resiliency & Infrastructure',title:'Circuit Breaker',
  recap:'Retries and queues assume the thing you\'re calling will eventually work.',
  gap:'But what if a downstream service is just down — should you keep hammering it?',
  fill:'A circuit breaker trips OPEN after enough failures, failing fast instead of piling on.',
  diagram:()=>DIAGRAMS.circuitbreaker(diagramBox),
  theory:['CLOSED: calls pass through normally; failures are counted.','OPEN: once failures cross a threshold, calls are rejected instantly without touching the downstream service — protecting both caller and callee.','HALF-OPEN: after a cooldown, a trial call is let through; success closes the circuit again, failure reopens it.'],
  formula:'trip when failure_rate > threshold over a rolling window',
  practical:['Wrapping calls to any flaky third-party API or overloaded internal service.','Standard building block in resilience libraries (Hystrix, resilience4j, Polly).']}),
C({id:'ratelimiting',section:'Resiliency & Infrastructure',title:'Rate Limiting',
  recap:'A circuit breaker protects you from a service that\'s already struggling.',
  gap:'But what stops YOUR service from being the one that gets overwhelmed?',
  fill:'Rate limiting: cap how many requests a client can make, using a token bucket.',
  diagram:()=>DIAGRAMS.ratelimiting(diagramBox),
  theory:['A bucket holds tokens, refilled at a steady rate up to a capacity; each request consumes one token.','No tokens left → the request is rejected (HTTP 429) or queued, instead of overloading the system.','Leaky bucket is a close cousin: it smooths bursts into a constant output rate rather than just capping totals; sliding-window counters are a simpler alternative with less burst tolerance.'],
