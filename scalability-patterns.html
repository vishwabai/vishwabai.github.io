  formula:'tokens(t) = min(capacity, tokens(t-1) + refill_rate × Δt) ; allow if tokens ≥ 1',
  practical:['Public APIs enforcing per-user or per-API-key request caps.','Protecting a backend from a misbehaving or retrying client.']}),
C({id:'bulkhead',section:'Resiliency & Infrastructure',title:'Bulkhead Pattern',
  recap:'Rate limiting protects the whole service from too much traffic.',
  gap:'But what if just ONE slow dependency, inside your service, could still take everything else down with it?',
  fill:'Bulkheads: give each dependency its own isolated pool, like watertight compartments on a ship.',
  diagram:()=>DIAGRAMS.bulkhead(diagramBox),
  theory:['Named after ship design — a hull is divided into sealed compartments so one breach doesn\'t sink the whole vessel.','In software: separate thread/connection pools per downstream dependency, so a slow or hung dependency only exhausts its own pool.','Without bulkheads, a shared pool means one bad dependency can consume every worker/thread, starving requests to completely unrelated, healthy services.'],
  formula:null,
  practical:['Isolating calls to a flaky third-party payment provider from calls to your own fast internal DB.','Sizing each pool based on that dependency\'s expected latency and criticality.']}),
C({id:'backpressure',section:'Resiliency & Infrastructure',title:'Backpressure',
  recap:'A message queue buffers the gap between a fast producer and a slow consumer.',
  gap:'But what happens when that buffer itself starts filling up faster than it can drain?',
  fill:'Backpressure: signal upstream to slow down before the buffer overflows.',
  diagram:()=>DIAGRAMS.backpressure(diagramBox),
  theory:['Without backpressure, an unbounded buffer either grows until it runs out of memory, or a bounded one silently drops messages once full.','With backpressure, the consumer (or the buffer itself) signals the producer to slow down, pause, or apply its own rate limiting.','Reactive Streams and TCP flow control are both concrete implementations of exactly this idea.'],
  formula:null,
  practical:['Streaming data pipelines where a downstream processor is slower than the incoming event rate.','TCP itself — the receive window is backpressure at the network layer.']}),
C({id:'idempotency',section:'Resiliency & Infrastructure',title:'Idempotency Keys',
  recap:'At-least-once delivery guarantees a message arrives — possibly more than once.',
  gap:'So if a client retries a payment after a timeout, how do you avoid charging them twice?',
  fill:'Attach an idempotency key to the request — the server recognizes repeats and returns the same result, without redoing the side effect.',
  diagram:()=>DIAGRAMS.idempotency(diagramBox),
  theory:['The client generates a unique key per logical operation (not per HTTP attempt) and sends it with every retry of that same operation.','The server stores the result keyed by that ID; a repeat request with the same key returns the cached result instead of re-executing the side effect.','This is what actually makes "at-least-once + idempotency" behave like exactly-once from the caller\'s point of view.'],
  formula:null,
  practical:['Payment APIs (Stripe-style idempotency keys) — the textbook use case.','Any non-GET API call a client might need to safely retry after a timeout.']}),
C({id:'horizvvert',section:'Resiliency & Infrastructure',title:'Horizontal vs Vertical Scaling',
  recap:'We\'ve spent this whole deck adding more servers, more replicas, more partitions.',
  gap:'But couldn\'t you just... buy a bigger machine instead?',
  fill:'You can — vertical scaling — but it hits a ceiling. Horizontal scaling, adding more machines, doesn\'t.',
  diagram:()=>DIAGRAMS.horizvvert(diagramBox),
  theory:['Vertical scaling (scale up): give one machine more CPU/RAM/disk — simple, no architecture changes, but bounded by the biggest instance that exists, and it\'s a single point of failure.','Horizontal scaling (scale out): add more machines running the same workload — theoretically unbounded, and naturally resilient (one node dying doesn\'t take everything down) — but requires the workload to actually be distributable (stateless, or with the sharding/replication patterns covered earlier).','Almost everything else in this deck exists to make horizontal scaling possible for stateful things like databases and caches.'],
  formula:null,
  practical:['Vertical: a quick fix for a single struggling database before a proper sharding project.','Horizontal: the default target architecture for stateless application servers.']}),
C({id:'autoscaling',section:'Resiliency & Infrastructure',title:'Auto-scaling',
  recap:'Horizontal scaling means adding more machines.',
  gap:'But should a human be watching a dashboard 24/7 deciding when to add them?',
  fill:'Auto-scaling watches a metric and adds or removes instances automatically as load changes.',
  diagram:()=>DIAGRAMS.autoscaling(diagramBox),
  theory:['A policy defines a target metric (CPU, request rate, queue depth) and thresholds for scaling out and scaling in.','Scaling out is usually fast and aggressive (avoid user-facing slowdowns); scaling in is usually slower and more cautious (avoid flapping/thrashing).','Reactive auto-scaling responds after load rises; predictive auto-scaling uses historical patterns to pre-scale ahead of expected spikes (e.g. before a daily peak).'],
  formula:'add instance when metric > high_watermark ; remove when metric < low_watermark (with cooldown)',
  practical:['Cloud auto-scaling groups reacting to CPU or request-queue length.','Scaling Kubernetes pods via the Horizontal Pod Autoscaler.']}),
C({id:'healthcheck',section:'Resiliency & Infrastructure',title:'Health Checks & Failover',
  recap:'A load balancer picks a server using some algorithm.',
  gap:'But what if the algorithm picks a server that\'s actually dead?',
  fill:'Health checks continuously probe each server, and the LB routes only to the ones that answer.',
  diagram:()=>DIAGRAMS.healthcheck(diagramBox),
  theory:['The LB (or an external monitor) periodically pings each server — a lightweight endpoint, a TCP connect, or a deeper "can I reach my DB" check.','A server that fails enough consecutive checks is marked unhealthy and removed from rotation, without any human intervening.','It rejoins automatically once it passes checks again — this is what makes failover automatic instead of a 3am pager alert.'],
  formula:null,
  practical:['Every production load balancer (ALB, Nginx, Envoy) — this is table stakes, not optional.','Combined with auto-scaling: an unhealthy instance can be automatically terminated and replaced.']}),
C({id:'captheorem',section:'Resiliency & Infrastructure',title:'CAP Theorem',
  recap:'We\'ve replicated data across nodes for availability and speed.',
  gap:'But what happens to those replicas when the network between them breaks?',
  fill:'CAP theorem: during a network Partition, you must choose between Consistency and Availability — you can\'t have both.',
  diagram:()=>DIAGRAMS.captheorem(diagramBox),
  theory:['Consistency: every read sees the most recent write, everywhere.','Availability: every request gets a (non-error) response, even if it might not be the latest data.','Partition tolerance: the system keeps working despite network failures between nodes — since networks do fail, this isn\'t really optional, so the real choice in practice is CP vs AP during a partition.'],
  formula:null,
  practical:['CP systems (e.g. many configurations of ZooKeeper, HBase): banking/inventory where stale reads are dangerous.','AP systems (e.g. Cassandra, DynamoDB default mode): shopping carts, social feeds, where availability matters more than perfect freshness.']}),
C({id:'quorum',section:'Resiliency & Infrastructure',title:'Quorum Reads & Writes',
  recap:'CAP says you can\'t have perfect consistency AND perfect availability during a partition.',
  gap:'Is there a tunable middle ground, instead of an all-or-nothing choice?',
  fill:'Quorums: require enough nodes to agree on writes and reads that they\'re mathematically guaranteed to overlap.',
  diagram:()=>DIAGRAMS.quorum(diagramBox),
  theory:['With N replicas, a write succeeds once W of them acknowledge it, and a read queries R of them.','If W + R > N, every read quorum is guaranteed to overlap with every write quorum by at least one node — so a read can always see the latest acknowledged write.','Tuning W and R trades off latency, availability, and consistency: bigger W/R = stronger consistency but slower and less available; smaller = faster but weaker guarantees.'],
  formula:'strong consistency guaranteed when W + R > N',
  practical:['Cassandra and DynamoDB expose tunable consistency levels built on exactly this math.','Choosing R=1 (fast reads, might be stale) vs R=N (always fresh, slower) per use case.']}),
C({id:'apigateway',section:'Resiliency & Infrastructure',title:'API Gateway',
  recap:'A reverse proxy is one dedicated front door for one set of servers.',
  gap:'In a system made of dozens of microservices, should every client know about all of them?',
  fill:'An API gateway is the single entry point that handles auth, rate limiting, and routing to the right service.',
  diagram:()=>DIAGRAMS.apigateway(diagramBox),
  theory:['Clients talk to one gateway; the gateway routes each request to the right internal microservice.','Centralizes cross-cutting concerns — authentication, rate limiting, request logging, response caching — so individual services don\'t reimplement them.','Can also aggregate multiple backend calls into a single client-facing response, tailored per client type (mobile vs web).'],
  formula:null,
  practical:['Kong, AWS API Gateway, or a custom Envoy/Nginx layer in front of a microservices fleet.','A key piece of the "backend for frontend" (BFF) pattern.']}),
C({id:'servicemesh',section:'Resiliency & Infrastructure',title:'Service Mesh',
  recap:'An API gateway handles north-south traffic — clients calling in.',
  gap:'But what handles the east-west traffic — services calling each other, at scale, with retries and encryption?',
  fill:'A service mesh: a sidecar proxy next to every service instance, handling mTLS, retries, and telemetry transparently.',
  diagram:()=>DIAGRAMS.servicemesh(diagramBox),
  theory:['Each service instance gets a small proxy ("sidecar") that intercepts all its network traffic — the service code itself stays unaware.','The sidecar handles mutual TLS, retries with backoff, load balancing, and emits consistent telemetry (latency, error rates) for every service, uniformly.','A control plane configures every sidecar centrally — routing rules, security policy, and traffic-shaping (like canary weights) all get applied without touching application code.'],
  formula:null,
  practical:['Istio, Linkerd, and similar meshes in large Kubernetes-based microservice fleets.','Adding retries, circuit breaking, or mTLS to dozens of services without changing any of their code.']}),
C({id:'canarydeploy',section:'Resiliency & Infrastructure',title:'Canary & Blue-Green Deployments',
  recap:'A service mesh can shift traffic between versions using routing rules.',
  gap:'So when you ship a new version, should everyone get it at once?',
  fill:'No — send it to a small "canary" slice of traffic first, watch closely, then ramp up.',
  diagram:()=>DIAGRAMS.canarydeploy(diagramBox),
  theory:['Canary release: route a small percentage of live traffic to the new version; if error rates and latency stay healthy, gradually increase that percentage until it reaches 100%.','Blue-green deployment: run two full identical environments (old "blue," new "green"); switch all traffic over at once, keeping blue ready for an instant rollback.','Canary catches problems early with limited blast radius; blue-green gives an instant, clean rollback but needs double the infrastructure during the switch.'],
  formula:null,
  practical:['Rolling out a risky change to a payments or checkout flow behind a 5% canary first.','Feature flags are often used alongside canaries for even finer-grained control over who sees what.']}),
];

/* ---------------- OBSERVABILITY & COORDINATION ---------------- */
const OBS_CONCEPTS = [
C({id:'metrics',section:'Observability & Coordination',title:'Metrics — the RED / USE method',
  recap:'A health check tells a load balancer if one server is up.',
  gap:'But how do you know if the whole system is actually healthy — not just "not crashed"?',
  fill:'Metrics: continuously measure Rate, Errors, and Duration for every service.',
  diagram:()=>DIAGRAMS.metrics(diagramBox),
  theory:['RED (for request-driven services): Rate (requests/sec), Errors (failed requests/sec), Duration (latency distribution) — three numbers that describe almost any service\'s health.','USE (for resources): Utilization, Saturation, Errors — better suited to CPUs, disks, and queues.','Metrics are pre-aggregated numbers rather than raw events, which is what makes dashboards and alerts fast even across thousands of hosts.'],
  formula:null,
  practical:['Prometheus + Grafana dashboards built around the RED/USE methods.','The foundation every alert and SLO in this section sits on top of.']}),
C({id:'logging',section:'Observability & Coordination',title:'Structured Logging & Aggregation',
  recap:'Metrics tell you THAT something is wrong.',
  gap:'But when one specific request fails, how do you find out WHY?',
  fill:'Structured logs: emit machine-readable events, shipped to a central, searchable index.',
  diagram:()=>DIAGRAMS.logging(diagramBox),
  theory:['Plain-text logs scattered across servers are nearly unsearchable at scale; structured (JSON) logs with consistent fields let you filter and aggregate.','Centralized log aggregation (the ELK stack, Loki) ships every service\'s logs to one searchable place, so nobody SSHes into individual boxes to grep files.','Including a trace or request ID on every log line is what makes it possible to reconstruct one request\'s full journey later.'],
  formula:null,
  practical:['Debugging a single failed request across many services by its request ID.','Audit and compliance trails that need to be searchable, not just stored.']}),
C({id:'tracing',section:'Observability & Coordination',title:'Distributed Tracing',
  recap:'Logs tell the story from inside one service.',
  gap:'But a request often hops through five services — how do you see the whole journey?',
  fill:'Distributed tracing: propagate one trace ID through every hop, and stitch the spans into a timeline.',
  diagram:()=>DIAGRAMS.tracing(diagramBox),
  theory:['Each service call creates a "span" — a start time, duration, and metadata — tagged with a shared trace ID passed along in request headers.','Spans from every hop are assembled into a waterfall view, showing exactly where time was spent and which service caused a slowdown.','The tool of last resort for "why was THIS ONE request slow," when metrics only tell you an aggregate story.'],
  formula:null,
  practical:['Jaeger, Zipkin, or OpenTelemetry-based tracing across a microservices fleet.','Pinpointing which of five downstream calls is responsible for a slow endpoint.']}),
C({id:'slo',section:'Observability & Coordination',title:'SLIs, SLOs & Error Budgets',
  recap:'Tracing helps you debug one slow request.',
  gap:'But how do you decide, objectively, whether the system as a whole is "reliable enough"?',
  fill:'Define an SLI (what you measure), an SLO (the target), and an error budget (how much failure is acceptable).',
  diagram:()=>DIAGRAMS.slo(diagramBox),
  theory:['SLI (Service Level Indicator): a measured metric, e.g. "% of requests under 300ms."','SLO (Service Level Objective): the target for that SLI, e.g. "99.9% of requests succeed per 30 days."','Error budget: the allowed 0.1% of failure — once it\'s spent, teams pause risky launches and focus on reliability, turning "reliability" into a concrete, spendable number instead of a vague goal.'],
  formula:'error_budget = (1 − SLO) × total_requests',
  practical:['Google SRE\'s core practice for balancing feature velocity against reliability.','Deciding objectively when to say "no more risky deploys this month."']}),
C({id:'alerting',section:'Observability & Coordination',title:'Alerting on Symptoms',
  recap:'An SLO tells you your budget for failure.',
  gap:'So when something breaks, what should actually wake someone up at 3am?',
  fill:'Alert on symptoms users feel — latency, error rate — not on every internal cause.',
  diagram:()=>DIAGRAMS.alerting(diagramBox),
  theory:['Cause-based alerts (CPU high, disk almost full) fire constantly and often don\'t correlate with real user impact — a fast path to alert fatigue and ignored pages.','Symptom-based alerts (elevated user-facing error rate or latency, tied to the SLO) fire only when it actually matters.','Causes still matter — but as data to investigate during an incident, not as the trigger that pages someone.'],
  formula:null,
  practical:['Paging on "p99 latency above SLO threshold for 5 minutes," not on "CPU > 80%."','Dramatically reducing alert fatigue and on-call burnout.']}),
C({id:'leaderelection',section:'Observability & Coordination',title:'Leader Election',
  recap:'We now know how to see when things break.',
  gap:'In a cluster of identical nodes, who\'s actually in charge of making the final call?',
  fill:'Leader election: nodes vote, one becomes leader, and the cluster automatically re-elects if it dies.',
  diagram:()=>DIAGRAMS.leaderelection(diagramBox),
  theory:['Exactly one node is designated leader at a time, responsible for coordinating writes or decisions the rest of the cluster follows.','If the leader stops responding, the remaining nodes detect missed heartbeats and hold an election to pick a new one — automatically, with no human paged.','Guaranteeing exactly one leader at a time (no "split brain") is genuinely hard, which is why battle-tested algorithms exist instead of everyone rolling their own.'],
  formula:null,
  practical:['ZooKeeper, etcd, and Kubernetes all use leader election internally for coordination.','A primary database picking which node currently accepts writes.']}),
C({id:'consensus',section:'Observability & Coordination',title:'Consensus (Raft / Paxos)',
  recap:'Leader election picks who\'s in charge.',
  gap:'But how does the whole cluster agree on WHAT happened, even if messages get lost or nodes crash mid-vote?',
  fill:'Consensus algorithms like Raft: a proposal is only committed once a majority of nodes durably accept it.',
  diagram:()=>DIAGRAMS.consensus(diagramBox),
  theory:['The leader proposes a log entry and replicates it to followers; the entry is "committed" only once a majority — not all — have durably stored it, the same majority-overlap idea as quorums.','This tolerates up to (N−1)/2 node failures while still making forward progress and guaranteeing every committed entry survives.','Paxos solves the same problem and came first, but is notoriously hard to reason about; Raft was explicitly designed to be an understandable alternative.'],
  formula:'tolerates up to ⌊(N−1)/2⌋ node failures',
  practical:['etcd (built on Raft) backs Kubernetes\' entire cluster state.','Any system needing strongly-consistent replicated state despite node failures.']}),
C({id:'distlock',section:'Observability & Coordination',title:'Distributed Locks',
  recap:'Consensus lets a cluster agree on shared state.',
  gap:'But what if two separate app instances both try to do the same one-time job at once?',
  fill:'A distributed lock: only one instance can hold it at a time — everyone else waits or backs off.',
  diagram:()=>DIAGRAMS.distlock(diagramBox),
  theory:['A shared lock service (often built on Redis or ZooKeeper) lets a node atomically claim a lock that others can see and respect.','Locks need an expiry or lease — otherwise a crashed lock-holder can block everyone else forever.','Genuinely correct distributed locking is subtle: clock drift and network delays can let two nodes briefly both believe they hold the lock — lean on battle-tested libraries rather than hand-rolling one.'],
  formula:null,
  practical:['Ensuring only one instance of a scheduled job runs at a time across a fleet.','Coordinating exclusive access to a shared resource, like a batch file being processed.']}),
C({id:'crdt',section:'Observability & Coordination',title:'Conflict Resolution: CRDTs & LWW',
  recap:'CAP theorem said AP systems accept writes on both sides of a partition.',
  gap:'So when the partition heals and both sides changed the same value — whose write wins?',
  fill:'Last-Write-Wins picks one and discards the other; CRDTs mathematically merge both without losing anything.',
  diagram:()=>DIAGRAMS.crdt(diagramBox),
  theory:['Last-Write-Wins (LWW): compare timestamps, keep the newer write, silently discard the other — simple, but the data loss is real and invisible.','CRDTs (Conflict-free Replicated Data Types): data structures designed so concurrent updates always merge deterministically without conflict — e.g. a counter that just sums every replica\'s increments.','CRDTs only work for specific structures (counters, sets, sequences) with genuinely mergeable semantics — arbitrary data can\'t "just merge" safely.'],
  formula:null,
  practical:['LWW: simple key-value stores where losing an occasional stale write is acceptable (Cassandra by default).','CRDTs: collaborative editing (Figma-style multiplayer), distributed counters, shopping carts.']}),
C({id:'gossip',section:'Observability & Coordination',title:'Gossip Protocols',
  recap:'CRDTs merge conflicting data once nodes talk to each other.',
  gap:'But in a cluster of hundreds of nodes, how does information spread with no central coordinator?',
  fill:'Gossip: each node periodically shares what it knows with a few random peers — information spreads epidemically.',
  diagram:()=>DIAGRAMS.gossip(diagramBox),
  theory:['Each round, every informed node shares its state with one or a few randomly chosen peers; those peers do the same next round.','Information spreads exponentially — reaching the whole cluster in roughly O(log N) rounds — with no central bottleneck and no single point of failure.','Naturally tolerant of nodes joining, leaving, or failing, since no single node is depended on.'],
  formula:'expected rounds to full spread ≈ O(log N)',
  practical:['Cluster membership and failure detection in Cassandra, Consul, and similar systems.','Any system needing eventually-consistent state propagation without a central coordinator.']}),
C({id:'chaos',section:'Observability & Coordination',title:'Chaos Engineering',
  recap:'Gossip and consensus are designed to survive node failures.',
  gap:'But do you actually KNOW your system survives a failure — or just hope it does?',
  fill:'Chaos engineering: deliberately break things in a controlled way, and verify the system survives as designed.',
  diagram:()=>DIAGRAMS.chaos(diagramBox),
  theory:['Deliberately inject failures — kill a random instance, add network latency, take down a whole availability zone — while watching whether failover, retries, and circuit breakers actually behave as designed.','Popularized by Netflix\'s "Chaos Monkey," which randomly terminates production instances during business hours specifically because that\'s when engineers are around to notice and fix gaps.','The point isn\'t to cause outages — it\'s to find weaknesses in a controlled way, before an uncontrolled real failure finds them for you.'],
  formula:null,
  practical:['Regularly killing random instances to verify auto-scaling and health checks actually recover.','Simulating a full region outage to test disaster-recovery failover before you need it for real.']}),
C({id:'featureflags',section:'Observability & Coordination',title:'Feature Flags',
  recap:'Chaos engineering tests resilience to infrastructure failure.',
  gap:'What about the risk of shipping bad code in the first place — must every change go through a full deploy?',
  fill:'Feature flags: toggle behavior at runtime, for any subset of users, with no deploy required.',
  diagram:()=>DIAGRAMS.featureflags(diagramBox),
  theory:['Code paths are wrapped in a runtime check against a flag service, instead of being permanently on or off at deploy time.','Enables gradual rollouts, targeting specific user segments, A/B testing, and — critically — an instant kill switch if something goes wrong, without waiting for a rollback deploy.','Complements canary deployments: canaries de-risk the deployment itself, flags de-risk the feature\'s behavior independently of when the code shipped.'],
  formula:null,
  practical:['LaunchDarkly, Unleash, or a custom flag service gating a risky new checkout flow.','Instantly disabling a broken feature in production without an emergency deploy.']}),
];
CONCEPTS.push(...OBS_CONCEPTS);

/* ============================== SLIDES ================================= */
const SLIDES = [];
SLIDES.push({kind:'title'});
SLIDES.push({kind:'roadmap'});

const bySection = {};
CONCEPTS.forEach(c=>{(bySection[c.section]=bySection[c.section]||[]).push(c);});

const sectionMeta = {
  'Load Balancing': {recap:'A single server can only take so many requests before it falls over.', gap:'How do you spread traffic across many servers — and choose which one, every single time?', chips:['Round robin','Weighted','Least connections','Consistent hashing','L4/L7','Global LB']},
  'Caching': {recap:'Even a load-balanced fleet of servers still hammers one database.', gap:'How do you stop asking the database the same question over and over?', chips:['Cache-aside','Write-through','TTL & eviction','Stampede','Hot keys','Cache tiers']},
  'Database Scaling': {recap:'Caching buys time, but eventually the data itself outgrows one machine.', gap:'When a single database can\'t hold — or serve — everything anymore, what actually scales it?', chips:['Read replicas','Sharding','Replication','CQRS','Event sourcing','DB-per-service']},
  'Messaging & Async': {recap:'So far every request has waited, synchronously, for an answer.', gap:'What if the caller shouldn\'t have to wait at all — and the work can happen later?', chips:['Queues','Pub/Sub','Kafka','Delivery semantics','DLQ','Priority queues']},
  'Resiliency & Infrastructure': {recap:'We now know how to spread load, cache, scale data, and decouple work.', gap:'But what stops one failure from cascading into an outage — and how do all these moving pieces stay observable and safe to change?', chips:['Circuit breaker','Rate limiting','Bulkhead','CAP theorem','Quorum','API gateway','Canary deploys']},
  'Observability & Coordination': {recap:'We can now contain a single failure before it cascades.', gap:'But across a whole fleet of nodes, how do you even see what\'s happening — and how do they agree on anything at all?', chips:['Metrics','Tracing','SLOs','Leader election','Consensus','Gossip','Chaos engineering']},
};
const sectionOrder = ['Load Balancing','Caching','Database Scaling','Messaging & Async','Resiliency & Infrastructure','Observability & Coordination'];
sectionOrder.forEach((sec,i)=>{
  SLIDES.push({kind:'section', title:sec, index:i+1, total:sectionOrder.length, meta:sectionMeta[sec]});
  bySection[sec].forEach(c=>SLIDES.push({kind:'concept', data:c}));
});
SLIDES.push({kind:'summary'});

/* ============================== ENGINE =================================== */
const stage=document.getElementById('stage');
const conceptView=document.getElementById('conceptView');
const simpleView=document.getElementById('simpleView');
const eyebrowEl=document.getElementById('eyebrow');
const counterEl=document.getElementById('counter');
const titleEl=document.getElementById('slideTitle');
const recapEl=document.getElementById('recapLine');
const gapEl=document.getElementById('gapLine');
const diagramBox=document.getElementById('diagramBox');
const panelBox=document.getElementById('panelBox');
const fillLabelEl=document.getElementById('fillLabel');
const dotsEl=document.getElementById('dots');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');

let idx=0;
function buildDots(){
  dotsEl.innerHTML='';
  SLIDES.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='dot'+(s.kind==='section'?' section':'');
    b.addEventListener('click',()=>go(i));
    dotsEl.appendChild(b);
  });
}
function updateDots(){
  Array.from(dotsEl.children).forEach((d,i)=>d.classList.toggle('active',i===idx));
}
function staggerLis(container){
  const items=container.querySelectorAll('li, .formula');
  items.forEach((el,i)=>{el.style.transitionDelay=(i*70)+'ms';});
}
function buildPanel(c){
  panelBox.innerHTML='';
  const h1=document.createElement('h3');h1.textContent='Theory';panelBox.appendChild(h1);
  const ul1=document.createElement('ul');
  c.theory.forEach(t=>{const li=document.createElement('li');li.textContent=t;ul1.appendChild(li);});
  panelBox.appendChild(ul1);
  if(c.formula){
    const f=document.createElement('div');f.className='formula';f.textContent=c.formula;panelBox.appendChild(f);
  }
  const h2=document.createElement('h3');h2.textContent='Practical use';panelBox.appendChild(h2);
  const ul2=document.createElement('ul');
  c.practical.forEach(t=>{const li=document.createElement('li');li.textContent=t;ul2.appendChild(li);});
  panelBox.appendChild(ul2);
}

async function playConcept(c){
  eyebrowEl.textContent=c.section;
  titleEl.textContent=c.title;
  diagramBox.classList.remove('compact');
  panelBox.classList.remove('show');
  panelBox.innerHTML='';
  recapEl.classList.remove('show'); gapEl.classList.remove('show'); fillLabelEl.classList.remove('show');
  recapEl.textContent=c.recap; gapEl.textContent=c.gap; fillLabelEl.textContent='';
  diagramBox.innerHTML='';
  c.diagram();
  await nextFrame();
  recapEl.classList.add('show');
  await wait(1050);
  gapEl.classList.add('show');
  await wait(1550);
  await wait(2500);
  fillLabelEl.textContent=c.fill;
  fillLabelEl.classList.add('show');
  await wait(1300);
  diagramBox.classList.add('compact');
  buildPanel(c);
  await nextFrame();
  panelBox.classList.add('show');
  staggerLis(panelBox);
}

function simpleEl(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}

async function playTitle(){
  simpleView.innerHTML='';
  const eb=simpleEl('div','simple-eyebrow','An animated tour');
  const t=simpleEl('div','simple-title','Scaling Systems');
  const s=simpleEl('div','simple-sub','Load balancing, caching, database scaling, and asynchronous messaging — built up one gap, one answer at a time.');
  simpleView.append(eb,t,s);
  await nextFrame();
  eb.classList.add('show');await wait(300);
  t.classList.add('show');await wait(400);
  s.classList.add('show');
}
async function playRoadmap(){
  simpleView.innerHTML='';
  const eb=simpleEl('div','simple-eyebrow','The map');
  const t=simpleEl('div','simple-title','Six ideas, one thread');
  const wrap=simpleEl('div');wrap.style.cssText='display:flex;flex-direction:column;gap:9px;margin-top:6px;';
  const pillars=[
    ['Load Balancing','spread requests across many servers'],
    ['Caching','stop asking the database the same question twice'],
    ['Database Scaling','grow the data layer past one machine'],
    ['Messaging & Async','stop making callers wait for work to finish'],
    ['Resiliency & Infrastructure','stop one failure from becoming an outage'],
    ['Observability & Coordination','see what\'s happening, and let nodes agree on it'],
  ];
  const els=pillars.map(([a,b])=>{const p=simpleEl('div','pillar');p.innerHTML=`<b>${a}</b> — ${b}`;wrap.appendChild(p);return p;});
  simpleView.append(eb,t,wrap);
  await nextFrame();eb.classList.add('show');await wait(300);t.classList.add('show');await wait(400);
  for(const p of els){p.classList.add('show');await wait(220);}
}
async function playSection(s){
  simpleView.innerHTML='';
  const eb=simpleEl('div','simple-eyebrow',`Part ${s.index} of ${s.total}`);
  const t=simpleEl('div','simple-title',s.title);
  const r=simpleEl('div','line recap');r.style.cssText='opacity:0;transform:translateY(6px);transition:opacity .55s ease,transform .55s ease;max-width:640px;';r.textContent=s.meta.recap;
  const g=simpleEl('div','line gap');g.style.cssText='opacity:0;transform:translateY(6px);transition:opacity .55s ease,transform .55s ease;max-width:640px;color:var(--amber);';g.textContent=s.meta.gap;
  const chipRow=simpleEl('div','chip-row');
  const chipEls=s.meta.chips.map(txt=>{const c=simpleEl('div','chip',txt);chipRow.appendChild(c);return c;});
  simpleView.append(eb,t,r,g,chipRow);
  await nextFrame();
  eb.classList.add('show');await wait(280);
  t.classList.add('show');await wait(450);
  r.classList.add('show');await wait(900);
  g.classList.add('show');await wait(900);
  for(const c of chipEls){c.classList.add('show');await wait(110);}
}
async function playSummary(){
  simpleView.innerHTML='';
  const eb=simpleEl('div','simple-eyebrow','Recap');
  const t=simpleEl('div','simple-title','You can now reason about scale');
  const wrap=simpleEl('div');wrap.style.cssText='display:flex;flex-direction:column;gap:10px;margin-top:6px;';
  const lines=[
    ['Load Balancing','choose an algorithm by what you actually know — nothing, connections, latency, or identity.'],
    ['Caching','trade freshness for speed, and defend the database from stampedes, penetration, and avalanches.'],
    ['Database Scaling','replicate for reads, shard for size, and split by service so nobody shares a database.'],
    ['Messaging & Async','decouple callers from work, and pick delivery guarantees deliberately, not by accident.'],
    ['Resiliency & Infrastructure','contain failures before they cascade, and keep the whole system observable and safely changeable.'],
    ['Observability & Coordination','see what\'s actually happening across a fleet, and let distributed nodes agree despite failures.'],
  ];
  const els=lines.map(([a,b])=>{const p=simpleEl('div','pillar');p.innerHTML=`<b>${a}</b> — ${b}`;wrap.appendChild(p);return p;});
  const s=simpleEl('div','simple-sub','Every pattern here is a trade-off, not a silver bullet — the skill is knowing which gap you\'re actually trying to close.');
  simpleView.append(eb,t,wrap,s);
  await nextFrame();eb.classList.add('show');await wait(280);t.classList.add('show');await wait(420);
  for(const p of els){p.classList.add('show');await wait(220);}
  await wait(300);s.classList.add('show');
}

function render(){
  clearAllTimers();
  const s=SLIDES[idx];
  counterEl.textContent=(idx+1)+' / '+SLIDES.length;
  updateDots();
  prevBtn.disabled=idx===0;
  nextBtn.disabled=idx===SLIDES.length-1;
  if(s.kind==='concept'){
    stage.classList.remove('simple');
    playConcept(s.data);
  } else {
    stage.classList.add('simple');
    if(s.kind==='title')playTitle();
    else if(s.kind==='roadmap')playRoadmap();
    else if(s.kind==='section')playSection(s);
    else if(s.kind==='summary')playSummary();
  }
}
function go(i){
  if(i<0||i>=SLIDES.length)return;
  idx=i;render();
}
prevBtn.addEventListener('click',()=>go(idx-1));
nextBtn.addEventListener('click',()=>go(idx+1));
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(idx+1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(idx-1);}
});

buildDots();
render();
</script>
</body>
</html>
