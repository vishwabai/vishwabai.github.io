<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<title>Service-to-Service Patterns</title>
<style>
  :root{
    --bg:#07080a;
    --panel:#0d0f12;

<body>
<div id="app">
  <div id="stageWrap">
    <svg id="stageSvg" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"></path>
        </marker>
        <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="b"></feGaussianBlur>
          <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>

      <text id="tagLabel" x="1540" y="52" font-size="15" letter-spacing="3" text-anchor="end" font-weight="700"></text>
      <text id="titleText" x="800" y="118" font-size="40" text-anchor="middle" font-weight="700" fill="var(--text)"></text>
      <text id="subText" x="800" y="150" font-size="18" text-anchor="middle" fill="var(--muted)"></text>
      <g id="stage"></g>
      <text id="captionText" x="800" y="812" font-size="20" text-anchor="middle" fill="var(--muted)"></text>
      <text id="recapText" x="800" y="782" font-size="16" text-anchor="middle" fill="var(--dim)"></text>
      <!-- progress -->
      <rect x="60" y="866" width="1480" height="3" fill="#1c1f24"></rect>
      <rect id="progFill" x="60" y="866" width="0" height="3" fill="var(--blue)"></rect>
      <text id="counter" x="1540" y="890" font-size="13" text-anchor="end" fill="var(--dim)"></text>
      <text id="clickHint" x="60" y="890" font-size="13" fill="var(--dim)"></text>
    </svg>

  <div class="hint">click / → next &nbsp;·&nbsp; ← back &nbsp;·&nbsp; r replay</div>

<script>
const SVGNS = "http://www.w3.org/2000/svg";
function E(tag, attrs={}, ...kids){
  const n = document.createElementNS(SVGNS, tag);
  for(const k in attrs){
    if(k === "style" && typeof attrs[k] === "object"){
      Object.assign(n.style, attrs[k]);
    } else {
      n.setAttribute(k, attrs[k]);
    }
  }
  kids.flat().forEach(c=>{ if(c!=null) n.appendChild(c); });
  return n;
}
function T(str, x, y, attrs={}){
  const t = E("text", Object.assign({x,y}, attrs));
  t.textContent = str;
  return t;
}
function TSpan(lines, x, y, lh, attrs={}){
  const t = E("text", Object.assign({x,y}, attrs));
  lines.forEach((ln,i)=>{
    t.appendChild(E("tspan", {x, dy: i===0?0:lh}, document.createTextNode(ln)));
  });
  return t;
}

const stage = document.getElementById("stage");
let liveAnims = [];
function anim(el, keyframes, opts){
  const a = el.animate(keyframes, Object.assign({fill:"forwards", easing:"cubic-bezier(.22,.8,.28,1)"}, opts));
  liveAnims.push(a);
  return a;
}
function clearAnims(){ liveAnims.forEach(a=>{try{a.cancel();}catch(e){}}); liveAnims=[]; }

// ---------- reusable primitives ----------
// NOTE: every node()/box() is TWO nested <g>s: an outer one whose SVG
// `transform` ATTRIBUTE positions it in the scene, and an inner one that
// entrance-animations (fadeIn/popIn) target via the CSS `transform`
// PROPERTY. Browsers let a CSS transform property fully replace an
// element's transform attribute, so animating the outer group directly
// would silently reset it to translate(0,0) once the animation applied.
// Keeping position (attribute) and motion (CSS) on separate elements
// avoids that clobber.
function node(x,y,label,color,r=42,sub=""){
  const outer = E("g",{transform:`translate(${x},${y})`});
  const inner = E("g");
  inner.appendChild(E("circle",{r, fill:"#111318", stroke:color, "stroke-width":2.5}));
  const lines = label.split("\n");
  inner.appendChild(TSpan(lines, 0, lines.length>1? -2:5, 16, {"text-anchor":"middle", "font-size":14, fill:"var(--text)", "font-weight":600}));
  if(sub) inner.appendChild(T(sub, 0, r+18, {"text-anchor":"middle", "font-size":11.5, fill:"var(--muted)"}));
  outer.appendChild(inner);
  outer._inner = inner;
  return outer;
}
function box(x,y,w,h,label,color,opts={}){
  const outer = E("g",{transform:`translate(${x},${y})`});
  const inner = E("g");
  inner.appendChild(E("rect",{x:-w/2,y:-h/2,width:w,height:h,rx:opts.rx??10,fill:opts.fill??"#111318",stroke:color,"stroke-width":2}));
  if(label){
    const lines = Array.isArray(label)?label:[label];
    inner.appendChild(TSpan(lines, 0, lines.length>1? -4*(lines.length-1):5, 18, {"text-anchor":"middle","font-size":opts.fs??14,fill:opts.textColor??"var(--text)","font-weight":opts.fw??600}));
  }
  outer.appendChild(inner);
  outer._inner = inner;
  return outer;
}
function arrow(x1,y1,x2,y2,color="var(--grey)",opts={}){
  const l = E("line",{x1,y1,x2,y2,stroke:color,"stroke-width":opts.w??2.2,"marker-end":"url(#arrow)"});
  if(opts.dash) l.setAttribute("stroke-dasharray", opts.dash);
  return l;
}
function fadeIn(el, delay=0, dur=500, dy=14){
  const target = el._inner || el;
  target.style.opacity=0;
  stage.appendChild(el);
  anim(target, [{opacity:0, transform:`translate(0px, ${dy}px)`},{opacity:1, transform:"translate(0px,0px)"}], {delay, duration:dur});
  return el;
}
function fadeInAt(el, delay=0, dur=500){
  const target = el._inner || el;
  target.style.opacity=0;
  stage.appendChild(el);
  anim(target,[{opacity:0},{opacity:1}],{delay,duration:dur});
  return el;
}
function popIn(el, delay=0, dur=500){
  const target = el._inner || el;
  target.style.opacity=0; target.style.transformBox="fill-box"; target.style.transformOrigin="center";
  stage.appendChild(el);
  anim(target,[{opacity:0, transform:"scale(.7)"},{opacity:1, transform:"scale(1)"}],{delay,duration:dur});
  return el;
}
function drawLine(el, delay=0, dur=650){
  const len = el.getTotalLength ? el.getTotalLength() : 400;
  el.style.strokeDasharray = len;
  el.style.strokeDashoffset = len;
  stage.appendChild(el);
  anim(el, [{strokeDashoffset:len},{strokeDashoffset:0}], {delay,duration:dur, easing:"ease-in-out"});
  return el;
}
function moveTo(el, dx, dy, delay=0, dur=700){
  anim(el, [{transform:`translate(0px,0px)`},{transform:`translate(${dx}px,${dy}px)`}], {delay,duration:dur});
}
function pulse(el, delay=0, times=1){
  anim(el,[{filter:"drop-shadow(0 0 0px currentColor)"},{filter:"drop-shadow(0 0 8px currentColor)"},{filter:"drop-shadow(0 0 0px currentColor)"}],{delay,duration:900,iterations:times});
}
function pathLine(pts){
  const d = pts.map((p,i)=> (i===0?"M":"L")+p[0]+","+p[1]).join(" ");
  return E("path",{d, fill:"none"});
}

// ---------- slide-type helpers ----------
function statementSlide({tag, lines, color}){
  return ()=>{
    const t = TSpan(lines, 800, 380, 46, {"text-anchor":"middle","font-size":34,"font-weight":700,fill:"var(--text)"});
    popIn(t, 100, 650);
    if(tag){
      const badge = T(tag, 800, 300, {"text-anchor":"middle","font-size":15,"letter-spacing":4,"font-weight":800, fill:color||"var(--gold)"});
      fadeInAt(badge, 0, 400);
    }
  };
}
function recapGapSlide({recap, gap, color}){
  return ()=>{
    const r = T(recap, 800, 330, {"text-anchor":"middle","font-size":19, fill:"var(--muted)"});
    fadeIn(r, 100, 500, 10);
    const badge = T("GAP", 800, 400, {"text-anchor":"middle","font-size":14,"letter-spacing":4,"font-weight":800, fill:color||"var(--red)"});
    fadeInAt(badge, 550, 350);
    const g = TSpan(wrapText(gap, 40), 800, 460, 40, {"text-anchor":"middle","font-size":28,"font-weight":700, fill:"var(--text)"});
    popIn(g, 750, 600);
  };
}
function gapOnlySlide(text, color){
  return ()=>{
    const badge = T("GAP", 800, 340, {"text-anchor":"middle","font-size":14,"letter-spacing":4,"font-weight":800, fill:color||"var(--red)"});
    fadeInAt(badge, 100, 350);
    const g = TSpan(wrapText(text, 42), 800, 410, 42, {"text-anchor":"middle","font-size":29,"font-weight":700, fill:"var(--text)"});
    popIn(g, 280, 600);
  };
}
function wrapText(str, maxLen){
  const words = str.split(" ");
  const lines = []; let cur = "";
  words.forEach(w=>{
    if((cur+" "+w).trim().length > maxLen){ lines.push(cur.trim()); cur = w; }
    else cur = (cur+" "+w).trim();
  });
  if(cur) lines.push(cur.trim());
  return lines;
}
function tableSlide({rows, colX=[110,760], header, startY=230, rowH=78, delay0=200}){
  return ()=>{
    if(header){
      const h1=T(header[0], colX[0], startY-40, {"font-size":13,"letter-spacing":2, fill:"var(--dim)","font-weight":700});
      const h2=T(header[1], colX[1], startY-40, {"font-size":13,"letter-spacing":2, fill:"var(--dim)","font-weight":700});
      fadeInAt(h1,0,300); fadeInAt(h2,0,300);
      stage.appendChild(E("line",{x1:80,y1:startY-20,x2:1520,y2:startY-20,stroke:"#22262c","stroke-width":1.5}));
    }
    rows.forEach((row,i)=>{
      const y = startY + i*rowH;
      const g = E("g");
      g.appendChild(E("circle",{cx:colX[0]-30, cy:y-6, r:4, fill:row.color||"var(--blue)"}));
      g.appendChild(T(row.a, colX[0], y, {"font-size":19,"font-weight":700, fill:"var(--text)"}));
      g.appendChild(TSpan(wrapText(row.b, 62), colX[1], y-6, 20, {"font-size":15.5, fill:"var(--muted)"}));
      fadeIn(g, delay0 + i*160, 500, 16);
    });
  };
}

// ============================================================
// SLIDE CONTENT
// ============================================================
const SEC = {
  intro:"INTRO", gw:"API GATEWAY", bff:"BACKEND-FOR-FRONTEND", disc:"SERVICE DISCOVERY",
  mesh:"SERVICE MESH", side:"SIDECAR", amb:"AMBASSADOR", ad:"ADAPTER",
  agg:"AGGREGATOR", strang:"STRANGLER FIG", acl:"ANTI-CORRUPTION LAYER", close:"RECAP"
};

const slides = [];

// 1 — Title
slides.push({section:SEC.intro, title:"Service-to-Service Patterns", sub:"How microservices find, call, shield, and replace one another", build: ()=>{
  const big = T("Service-to-Service Patterns", 800, 420, {"text-anchor":"middle","font-size":50,"font-weight":800, fill:"var(--text)"});
  popIn(big, 150, 800);
  const sub = T("12 patterns, one throughline: each exists to answer a pain the last one couldn't fix.", 800, 470, {"text-anchor":"middle","font-size":18, fill:"var(--muted)"});
  fadeIn(sub, 700, 600, 10);
}});

// 2 — Chaos diagram
slides.push({section:SEC.intro, title:"Before any pattern", sub:"", build: ()=>{
  const client = node(220, 470, "Client", "var(--gold)", 40);
  fadeIn(client, 0);
  const services = ["Users","Orders","Inventory","Payments","Reviews","Shipping"];
  const positions = [[700,240],[950,220],[1200,270],[700,700],[950,720],[1200,670]];
  services.forEach((s,i)=>{
    const [x,y] = positions[i];
    const n = node(x,y,s,"var(--blue)",40);
    fadeIn(n, 300+i*90);
    const ln = arrow(262,470, x-44, y, "var(--dim)", {w:1.6});
    fadeInAt(ln, 300+i*90+120, 400);
  });
  const cap = T("Every client wires up auth, retries, and TLS — once per service, per language.", 800, 830, {"text-anchor":"middle","font-size":17, fill:"var(--muted)"});
  fadeIn(cap, 1500, 600, 8);
}});

// 3 — recap/gap -> gateway
slides.push({section:SEC.gw, title:"", sub:"", tag:"GAP", build: recapGapSlide({
  recap:"Every client talks to every service, directly.",
  gap:"But who checks auth, routes the request, and terminates TLS — do we copy that logic six times?",
  color:"var(--red)"
})});

// 4 — API gateway intro (FILL)
slides.push({section:SEC.gw, title:"API Gateway", sub:"A single front door for every request", tag:"FILL", build: ()=>{
  const client = node(200, 460, "Client", "var(--gold)", 40);
  fadeIn(client,0);
  const gw = box(560, 460, 190, 100, ["API","Gateway"], "var(--green)", {fw:800, fs:18});
  popIn(gw, 300, 550);
  const a1 = arrow(242,460, 462,460, "var(--grey)");
  fadeInAt(a1, 850, 350);
  const services = ["Users","Orders","Inventory","Payments"];
  services.forEach((s,i)=>{
    const y = 260 + i*140;
    const n = node(1050, y, s, "var(--blue)", 38);
    fadeIn(n, 1200 + i*120);
    const a = arrow(657,460, 1010, y, "var(--dim)", {w:1.6});
    fadeInAt(a, 1200+i*120+100, 350);
  });
  const labels = ["Routing","AuthN / AuthZ","Rate limiting","TLS termination"];
  labels.forEach((l,i)=>{
    const t = T("• "+l, 400, 640 + i*36, {"font-size":16, fill:"var(--muted)"});
    fadeIn(t, 2000 + i*160, 400, 6);
  });
}});

// 5 — gateway theory / tradeoff
slides.push({section:SEC.gw, title:"API Gateway — the request path", sub:"", build: ()=>{
  const client = node(230,300,"Client","var(--gold)",38);
  const gw = box(700,300,170,90,["Gateway"],"var(--green)",{fs:16,fw:800});
  const svc = node(1150,300,"Service A","var(--blue)",42);
  [client,gw,svc].forEach((n,i)=>fadeIn(n, i*200));
  const l1 = arrow(268,300,613,300,"var(--grey)"); fadeInAt(l1,650,300);
  const chk = T("auth ✓  route ✓  TLS ✓", 700, 250, {"text-anchor":"middle","font-size":13.5, fill:"var(--green)"});
  fadeInAt(chk, 950, 400);
  const l2 = arrow(787,300,1106,300,"var(--grey)"); fadeInAt(l2,1300,300);

  const div = E("line",{x1:80,y1:460,x2:1520,y2:460,stroke:"#22262c"});
  fadeInAt(div, 1750, 300);
  const warn = T("⚠ single point of failure", 800, 560, {"text-anchor":"middle","font-size":19,"font-weight":700, fill:"var(--red)"});
  fadeIn(warn, 2000, 500, 10);
  const fix = T("→ run N stateless gateway replicas behind a load balancer", 800, 610, {"text-anchor":"middle","font-size":16, fill:"var(--muted)"});
  fadeIn(fix, 2500, 500, 8);
}});

// 6 — gateway practical
slides.push({section:SEC.gw, title:"API Gateway — in practice", sub:"", build: tableSlide({
  header:["TOOL","USED FOR"],
  rows:[
    {a:"Kong / NGINX", b:"self-hosted gateway for public APIs; plugin-based auth & rate limiting", color:"var(--green)"},
    {a:"AWS API Gateway", b:"managed gateway for serverless / Lambda-backed APIs", color:"var(--blue)"},
    {a:"Envoy Gateway / Apigee", b:"large-scale, policy-heavy gateways for enterprise & partner APIs", color:"var(--orange)"},
  ]
})});

// 7 — recap/gap -> BFF
slides.push({section:SEC.bff, title:"", sub:"", build: recapGapSlide({
  recap:"One gateway now guards every service.",
  gap:"But mobile wants a lean payload, web wants the full page, a smart TV wants something else again — one response shape fits none of them well. Why?",
  color:"var(--red)"
})});

// 8 — BFF diagram
slides.push({section:SEC.bff, title:"Backend-for-Frontend (BFF)", sub:"One tailored layer per client experience", tag:"FILL", build: ()=>{
  const clients = [["Web",210],["Mobile",210+220],["TV",210+440]];
  const cliY=225, bffY = 375, svcY = 660;
  clients.forEach(([label,x],i)=>{
    const c = node(x, cliY, label, "var(--gold)", 34);
    fadeIn(c, i*150);
  });
  clients.forEach(([label,x],i)=>{
    const bffLabel = label==="Web"?"Web BFF":label==="Mobile"?"Mobile BFF":"TV BFF";
    const b = box(x, bffY, 150, 70, [bffLabel], "var(--purple)", {fs:14,fw:700});
    fadeIn(b, 500+i*150);
    const a = arrow(x, cliY+38, x, bffY-39, "var(--grey)"); fadeInAt(a, 900+i*150, 300);
  });
  const services = ["Users","Orders","Inventory"];
  services.forEach((s,i)=>{
    const x = 300 + i*400;
    const n = node(x, svcY, s, "var(--blue)", 40);
    fadeIn(n, 1500+i*150);
  });
  clients.forEach(([label,x])=>{
    services.forEach((s,j)=>{
      const sx = 300+j*400;
      const l = arrow(x, bffY+35, sx, svcY-44, "var(--dim)", {w:1.3});
      fadeInAt(l, 2000, 350);
    });
  });
  const note = T('Mobile BFF: merges 3 calls into 1 lean payload  ·  Web BFF: returns the full detail view', 800, 760, {"text-anchor":"middle","font-size":15, fill:"var(--muted)"});
  fadeIn(note, 2500, 500, 8);
}});

// 9 — BFF theory
slides.push({section:SEC.bff, title:"BFF — the rule", sub:"", build: ()=>{
  const rule = T("One BFF per client experience — owned by the frontend team that consumes it.", 800, 300, {"text-anchor":"middle","font-size":22,"font-weight":700, fill:"var(--text)"});
  fadeIn(rule, 100, 600, 10);
  const rule2 = T("Orchestration only. No business logic — that still lives in the backend services.", 800, 350, {"text-anchor":"middle","font-size":17, fill:"var(--muted)"});
  fadeIn(rule2, 700, 500, 8);

  const leftT = T("✓ tailored payloads, independent deploys", 420, 520, {"text-anchor":"middle","font-size":16, fill:"var(--green)"});
  const rightT = T("✗ orchestration logic duplicated per BFF", 1180, 520, {"text-anchor":"middle","font-size":16, fill:"var(--red)"});
  fadeIn(leftT, 1400, 500, 10);
  fadeIn(rightT, 1650, 500, 10);
  const div = E("line",{x1:800,y1:460,x2:800,y2:600,stroke:"#22262c"});
  fadeInAt(div, 1300, 300);
}});

// 10 — BFF practical
slides.push({section:SEC.bff, title:"BFF — in practice", sub:"", build: tableSlide({
  header:["ORIGIN","WHEN TO REACH FOR IT"],
  rows:[
    {a:"Netflix", b:"pioneered BFF — wildly different UIs across TVs, consoles, mobile, web", color:"var(--purple)"},

// 11 — recap/gap -> discovery
slides.push({section:SEC.disc, title:"", sub:"", build: recapGapSlide({
  recap:"Gateway + BFFs now know which services exist.",

// 12 — service registry diagram
slides.push({section:SEC.disc, title:"Service Discovery", sub:"A live, self-updating directory of who's healthy, right now", tag:"FILL", build: ()=>{
  const reg = box(800, 260, 260, 90, ["Service Registry"], "var(--green)", {fs:18,fw:800});
  popIn(reg, 0, 550);
  const inst = [["inv-1",400,480],["inv-2",650,480],["inv-3",900,480],["inv-4",1150,480]];
  inst.forEach(([label,x,y],i)=>{
    const n = node(x,y,label,"var(--blue)",36);
    fadeIn(n, 500+i*250);
    const a = arrow(x, y-38, 720+i*35, 300, "var(--dim)", {w:1.4,dash:"4 4"});

}});

// 13 — health check timeline / formula
slides.push({section:SEC.disc, title:"How fast does the registry notice?", sub:"", build: ()=>{
  const formula = T("detection time ≈ missed_beats × heartbeat_interval", 800, 260, {"text-anchor":"middle","font-size":24,"font-weight":700, fill:"var(--gold)"});
  popIn(formula, 100, 600);
  const example = T("e.g. 3 missed beats × 5s interval ≈ 15s until removal", 800, 310, {"text-anchor":"middle","font-size":16, fill:"var(--muted)"});
  fadeIn(example, 700, 500, 8);

  // timeline
  const y = 500;
  stage.appendChild(E("line",{x1:200,y1:y,x2:1400,y2:y,stroke:"#333"}));
  const beats = [200,470,740,1010,1280];

// 36 — strangler fig step 2-4 (shrink)
slides.push({section:SEC.strang, title:"Strangler Fig — shrinking the monolith", sub:"", build: ()=>{
  const facade = box(800, 220, 260, 70, ["Facade / Gateway"], "var(--green)", {fs:15,fw:800});
  fadeIn(facade,0);
  let monoW = 460, monoH=430;
  const mono = box(800, 560, monoW, monoH, ["Monolith"], "var(--orange)", {fs:20,fw:800, rx:14});
  fadeIn(mono, 250);

  const steps = [
    {label:"checkout-service", dy:-140, delay:900, shrink:110},
    {label:"users-service", dy:0, delay:2200, shrink:100},
    {label:"search-service", dy:140, delay:3500, shrink:90},
  ];
  steps.forEach((s,i)=>{
    const svc = node(1250, 220+ i*0 + 0, s.label, "var(--blue)", 0); // placeholder unused
  });
  // simpler: place new services stacked at right, animate monolith rect shrink via width attr changes
  const monoRect = mono.querySelector("rect");
  const monoText = mono.querySelector("text");
  let curW = monoW, curH = monoH;
  steps.forEach((s,i)=>{
    setTimeout(()=>{
      const svcNode = node(1280, 260+i*180, s.label, "var(--blue)", 42);
      fadeIn(svcNode, 0, 450);
      const route = arrow(930,220,1240,255+i*180,"var(--grey)",{w:1.8});
      fadeInAt(route, 250, 300);
      curW -= s.shrink; curH -= 60;
      anim(monoRect,[
        {width:monoRect.getAttribute("width"), height:monoRect.getAttribute("height"), x:monoRect.getAttribute("x"), y:monoRect.getAttribute("y")},
        {width:curW, height:curH, x:-curW/2, y:-curH/2}
      ],{duration:600, delay:400, fill:"forwards"});
      setTimeout(()=>{
        monoRect.setAttribute("width",curW); monoRect.setAttribute("height",curH);
        monoRect.setAttribute("x",-curW/2); monoRect.setAttribute("y",-curH/2);
      }, 400+600+s.delay*0);
    }, s.delay);
  });
  setTimeout(()=>{
    const done = T("each cut is low-risk — and reversible: route back to the monolith if the new service misbehaves", 800, 830, {"text-anchor":"middle","font-size":14.5, fill:"var(--muted)"});
    fadeIn(done, 0, 500, 6);
  }, 4800);
}});

slides.push({section:SEC.close, title:"", sub:"", build: statementSlide({
  tag:"", color:"var(--gold)",
  lines:["If you can't explain WHY a pattern exists —","as the answer to one specific pain —","you've memorized a name, not learned the idea."]
})});

// ============================================================
// ENGINE
// ============================================================
let idx = 0;
const titleEl = document.getElementById("titleText");
const subEl = document.getElementById("subText");
const capEl = document.getElementById("captionText");
const recapEl = document.getElementById("recapText");
const secEl = document.getElementById("sectionLabel");
const tagEl = document.getElementById("tagLabel");
const progFill = document.getElementById("progFill");
const counterEl = document.getElementById("counter");
const clickHintEl = document.getElementById("clickHint");

function render(i){
  clearAnims();
  stage.innerHTML = "";
  const s = slides[i];
  secEl.textContent = s.section || "";
  titleEl.textContent = s.title || "";
  subEl.textContent = s.sub || "";
  capEl.textContent = "";
  recapEl.textContent = "";
  tagEl.textContent = s.tag || "";
  tagEl.style.fill = s.tag==="GAP" ? "var(--red)" : s.tag==="FILL" ? "var(--green)" : "var(--muted)";
  progFill.setAttribute("width", (1480 * (i+1)/slides.length).toFixed(1));
  counterEl.textContent = (i+1) + " / " + slides.length;
  clickHintEl.textContent = "click → next";
  s.build();
}

function next(){ if(idx < slides.length-1){ idx++; render(idx);} }
function prev(){ if(idx > 0){ idx--; render(idx);} }
function replay(){ render(idx); }

document.getElementById("stageSvg").addEventListener("click", next);
window.addEventListener("keydown", (e)=>{
  if(e.key==="ArrowRight" || e.key===" "){ e.preventDefault(); next(); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); prev(); }
  else if(e.key.toLowerCase()==="r"){ replay(); }
});
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){ liveAnims.forEach(a=>{try{a.pause();}catch(e){}}); }
  else { liveAnims.forEach(a=>{try{a.play();}catch(e){}}); }
});

render(0);
</script>
</body>
