  {title:'The Normal Equation', family:'Linear Family', eq:'w = (XᵀX)⁻¹ Xᵀy',
   breakdown:[{t:'X',d:'matrix of inputs — one row per data point'},{t:'Xᵀ',d:'X transposed — rows and columns swapped'},{t:'(XᵀX)⁻¹',d:'invert a small features × features matrix'}],
   theory:'Because the least-squares cost is convex and differentiable, you can skip the iterative walk and solve for where the gradient is exactly zero — algebraically. That solution is w = (XᵀX)⁻¹Xᵀy: exact in one computation, no learning rate to tune, no risk of failing to converge. The catch is that inverting an n×n matrix costs roughly O(n³), fine for hundreds of features but painful for millions — which is exactly why gradient descent remains the workhorse at scale.',
   derivation:'This formula falls out of the same zero-derivative trick, generalized to matrix form for many features at once. Multiplying both sides of Xw=y by Xᵀ makes XᵀX square and (usually) invertible, even when X itself isn\'t — that\'s the algebraic reason the transpose appears twice.',
   practical:'Statistical software (R\'s lm(), Excel\'s LINEST, econometrics packages) computes this formula directly for small-to-medium datasets, where an exact one-step answer beats the overhead of iterative training.',
   bullets:['A closed-form shortcut, no iterating','Exact — solves the bowl in one step','Slow when there are many features'],
   render:renderNormalEq},
  {title:'Evaluation Metrics', family:'Foundation', eq:'R² = 1 − SSE / SST',
   breakdown:[{t:'SSE',d:'sum of squared errors — Σ(y−ŷ)², what\'s left unexplained'},{t:'SST',d:'total variance — Σ(y−ȳ)², spread around the mean'},{t:'R² = 1',d:'perfect fit;  R² = 0 → no better than guessing ȳ'}],
   theory:'A model is only as good as the metric used to judge it. MAE treats every unit of error equally; RMSE, because it squares errors before averaging, is dominated by the worst mistakes. R² reframes error in relative terms — the fraction of the target\'s variance the model explains — so it is comparable across problems with different units. No single metric tells the whole story; a model can score well overall and still fail badly on the cases that matter most.',
   derivation:'This ratio expresses \'what\'s left unexplained\' over \'what there was to explain in the first place\' — a way to score model quality on a universal 0-to-1 scale, instead of raw error units that depend on what\'s being measured (dollars, degrees, whatever).',
   practical:'R² is the number quoted in almost every scientific paper and finance report reporting a regression fit — \'this factor explains 62% of the variance in returns\' is literally R² = 0.62.',
   bullets:['MAE: average size of a miss','RMSE: punishes big misses harder','R²: fraction of variance explained'],
   render:renderMetrics},
  {title:'Multiple Linear Regression', family:'Linear Family', eq:'ŷ = b₀ + b₁x₁ + b₂x₂ + ... + bₙxₙ',
   breakdown:[{t:'b₀',d:'baseline — the prediction when every x is 0'},{t:'bⱼ',d:'effect of xⱼ alone, holding all other x\'s fixed'},{t:'n',d:'number of features — dimensions in the fit'}],
   theory:'Adding more predictors does not change the math, only the geometry: instead of a line through a 2D scatter, you fit a hyperplane through an (n+1)-dimensional cloud. Each coefficient bⱼ is the expected change in y from a one-unit increase in xⱼ, with every other feature held constant. That \'held constant\' clause is the whole value of the multivariable model — it isolates each feature\'s individual contribution instead of conflating them.',
   derivation:'This is the exact same normal-equation-derived formula from simple linear regression, just written for a vector of features instead of a single x. The matrix-calculus derivation is identical — only the number of columns in X grows from one to many.',
   practical:'Insurance premium models, salary prediction from experience/education/location, and clinical risk scores (blood pressure from age, weight, and diet) all use this structure directly.',
   bullets:['More inputs, more dimensions','A line becomes a plane / hyperplane','Same least-squares idea, more axes'],
   render:renderMultiple},
  {title:'Assumptions & Residual Diagnostics', family:'Foundation', eq:'residual = y − ŷ',
   breakdown:[{t:'E[residual]=0',d:'errors shouldn\'t trend up or down with x'},{t:'Var(residual)',d:'should stay roughly constant (homoscedastic)'},{t:'independence',d:'one point\'s error shouldn\'t predict the next one\'s'}],
   theory:'Linear regression\'s guarantees — unbiased estimates, valid confidence intervals, honest p-values — depend on assumptions about the residuals: linearity, constant variance, independence, and approximate normality for inference. None of these are visible in the fitted line itself; they only show up in a residual plot. A model can have a high R² and still violate every one of these assumptions, which is why residual diagnostics belong in every serious analysis.',
   derivation:'The proofs behind linear regression\'s confidence intervals and p-values (the Gauss–Markov theorem and the Central Limit Theorem) explicitly require these conditions on the residuals. If they\'re violated, the formulas for uncertainty still compute a number — it\'s just the wrong one, silently.',
   practical:'Quality-control engineers and clinical researchers routinely plot residuals before publishing a regression result, specifically to catch violations that would invalidate their reported confidence intervals.',
   bullets:['Linear regression assumes patternless residuals','Curves, funnels, or waves = a broken assumption','Always plot residuals before trusting the fit'],
   render:renderAssumptions},
  {title:'Multicollinearity', family:'Foundation', eq:'VIF = 1 / (1 − R²ⱼ)',
   breakdown:[{t:'R²ⱼ',d:'how well feature j is predicted by the other features'},{t:'VIF',d:'variance inflation factor — how much overlap inflates uncertainty'},{t:'VIF > 10',d:'a common rule-of-thumb warning threshold'}],
   theory:'When features carry overlapping information, the least-squares solution becomes numerically unstable — many different coefficient combinations fit the training data almost equally well, so small data changes can swing individual estimates wildly even as overall predictions stay reasonable. The Variance Inflation Factor asks how well a feature can be predicted from the others; a VIF above 10 is a common warning that its coefficient can no longer be trusted individually.',
   derivation:'VIF is derived by regressing feature j on every other feature and taking that sub-regression\'s own R². If the other features can predict xⱼ almost perfectly, R²ⱼ approaches 1 and 1/(1−R²ⱼ) blows up — algebraically capturing \'this feature carries almost no unique information of its own.\'',
   practical:'Data scientists run VIF checks before trusting individual coefficients in credit-scoring or medical-risk models, where a specific feature\'s weight needs to be defensible on its own, not just the model\'s overall accuracy.',
   bullets:['Features that overlap confuse the model','Coefficients swing wildly on small changes','High VIF: consider dropping or combining'],
   render:renderMulticollinearity},
  {title:'Feature Scaling', family:'Foundation', eq:'x′ = (x − mean) / std',
   breakdown:[{t:'mean',d:'shift so the feature is centered at 0'},{t:'std',d:'rescale so the spread becomes 1'},{t:'x′',d:'now every feature lives on the same footing'}],
   theory:'Features on very different scales distort the geometry that gradient descent and regularization operate on, turning a round cost bowl into a long, narrow valley and forcing a slow zigzag descent. Regularization is affected even more directly: an L2 penalty punishes a coefficient in proportion to its numeric size, so an unscaled feature can be penalized unfairly just because its natural units happen to be large. Standardizing to mean 0, std 1 puts every feature on equal footing.',
   derivation:'Subtracting the mean removes any arbitrary offset; dividing by the standard deviation rescales every feature to the same \'unit of spread,\' so no feature dominates purely because its raw numbers happen to be larger. This is literally converting every feature into a z-score.',
   practical:'Every practical ML pipeline — scikit-learn\'s StandardScaler, deep learning\'s batch normalization — performs this exact transform before training, almost without exception.',
   bullets:['Different scales stretch the cost bowl','Gradient descent then zigzags, wastes steps','Scaling also matters for regularization & SVR/KNN'],
   render:renderFeatureScaling},
  {title:'Polynomial Regression', family:'Linear Family', eq:'ŷ = b₀ + b₁x + b₂x² + ... + bₙxⁿ',
   breakdown:[{t:'x², x³...',d:'new features engineered from powers of x'},{t:'still linear',d:'linear in the coefficients b — just not in x'},{t:'n',d:'degree — how much curvature is allowed'}],
   theory:'Polynomial regression is still linear regression underneath — it is just fed engineered features x, x², x³, ... instead of x alone, so the same least-squares machinery and closed-form solution apply unchanged. Each added degree gives the curve one more bend to chase the training points with. Chase them too well, though, and the curve starts fitting noise instead of pattern, which is why degree is a hyperparameter to tune, not a free upgrade.',
   derivation:'Because x², x³, etc. are just new columns computed from x, this is mathematically identical to multiple linear regression: the model is linear in the b\'s, which is exactly what lets least-squares still apply, even though the resulting curve in x is not straight at all.',
   practical:'Modeling how a drug\'s effect changes with dosage, or how a physical process like projectile motion curves over time, often starts with a low-degree polynomial fit before moving to more complex models.',
   bullets:['Bend the line into a curve','Too simple → underfit','Too flexible → memorizes noise'],
   render:renderPoly},
  {title:'Train/Test Split & Learning Curves', family:'Foundation', eq:'error(train) ≠ error(unseen)',
   breakdown:[{t:'train error',d:'how well the model fits data it already saw'},{t:'test error',d:'how well it generalizes to new, unseen data'},{t:'growing gap',d:'train↓ but test↑ is the signature of overfitting'}],
   theory:'A model\'s error on its own training data is a biased, overly optimistic estimate of future performance — it has had the chance to memorize quirks specific to that sample. A held-out test set the model never trains on gives an honest read on generalization. As complexity grows, training error keeps falling while test error falls, bottoms out, and rises again; that turning point is where overfitting begins.',
   derivation:'This is less a formula than a provable phenomenon: a flexible enough model can always drive its own training error toward zero by memorizing the training set, so training error alone can never certify the model actually learned the underlying pattern rather than the specific sample.',
   practical:'Every ML competition (like Kaggle) and every production ML system enforces a strict train/validation/test split for exactly this reason — it\'s the field\'s core defense against shipping an overfit model.',
   bullets:['Hold out data the model never trains on','Training error always improves with complexity','Test error reveals the overfitting turn'],
   render:renderTrainTest},
  {title:'Ridge Regression (L2)', family:'Regularized', eq:'J = Σ(y−ŷ)² + λ Σ wⱼ²',
   breakdown:[{t:'λ',d:'penalty strength — 0 recovers plain regression'},{t:'Σwⱼ²',d:'sum of squared coefficients (the "L2 norm")'},{t:'tradeoff',d:'fit the data well vs. keep every weight small'}],
   theory:'Ridge adds a penalty proportional to the sum of squared coefficients, shrinking every coefficient toward zero in proportion to its size. Geometrically this constrains the solution to lie inside a circle (or hypersphere) around the origin; the fit gets pulled toward wherever that region first touches the unconstrained error contours. Because the L2 boundary is smooth and round, that contact point is essentially never exactly on an axis — ridge shrinks coefficients but almost never zeroes them out.',
   derivation:'Adding λΣwⱼ² to the loss changes what \'minimum\' means: the optimizer now trades off fitting the data against keeping weights small. That added quadratic term still has a closed-form solution: w = (XᵀX+λI)⁻¹Xᵀy, where the λI term is also exactly what fixes the invertibility problems multicollinearity can cause.',
   practical:'Genomics research (predicting a trait from thousands of correlated genetic markers) and any dataset with more features than data points relies on ridge specifically because plain least-squares becomes mathematically undefined there.',
   bullets:['Penalize large coefficients','λ shrinks every weight toward 0','Weights get small, rarely exactly 0'],
   render:renderRidge},
  {title:'Lasso Regression (L1)', family:'Regularized', eq:'J = Σ(y−ŷ)² + λ Σ |wⱼ|',
   breakdown:[{t:'Σ|wⱼ|',d:'sum of absolute coefficients (the "L1 norm")'},{t:'sharp corner',d:'L1\'s diamond shape makes exactly-0 a likely landing spot'},{t:'sparsity',d:'unimportant features get dropped outright'}],
   theory:'Lasso replaces the squared penalty with an absolute-value penalty, making the constraint region a diamond with sharp corners sitting exactly on the axes. Error contours are disproportionately likely to first touch that region at a corner, where one or more coefficients are exactly zero. That geometry is the mechanism behind Lasso\'s most useful property: it does not just shrink coefficients, it can eliminate irrelevant features entirely, acting as automatic feature selection.',
   derivation:'Absolute value, unlike squaring, has a non-differentiable kink exactly at zero — and it\'s that kink that gives the optimizer a genuine incentive to land exactly on zero rather than merely near it, unlike ridge\'s smooth penalty. There\'s no closed-form solution here; it requires iterative optimization such as coordinate descent.',
   practical:'Lasso is the go-to when you have hundreds of candidate features (say, thousands of possible marketing signals) and want the model itself to reveal which ones actually matter.',
   bullets:['Same idea, a sharper penalty','Some coefficients hit exactly 0','Doubles as feature selection'],
   render:renderLasso},
  {title:'The Regularization Path', family:'Regularized', eq:'wₗₐₛₛₒ(λ) = sign(w)·max(|w|−λ, 0)',
   breakdown:[{t:'soft-threshold',d:'shrink |w| by λ, then clip at 0 if it goes negative'},{t:'sign(w)',d:'keeps the shrunk value pointing the same direction'},{t:'ridge, instead',d:'w(λ) = w / (1+λ) — smooth, never exactly 0'}],
   theory:'Tracking every coefficient as λ sweeps from 0 upward reveals each penalty\'s personality. Lasso\'s soft-thresholding formula shows coefficients decreasing linearly and then locking at exactly zero once λ exceeds their magnitude — a sequence of sharp kinks. Ridge\'s formula, w/(1+λ), decays smoothly and asymptotically, always approaching zero but never arriving. The whole path is often computed cheaply in one pass, letting λ be chosen by cross-validation rather than retraining from scratch.',
   derivation:'For the idealized case of uncorrelated features, the Lasso and Ridge optimization problems can each be solved feature-by-feature in closed form — that\'s exactly the soft-thresholding and w/(1+λ) formulas shown here. Real datasets are rarely perfectly uncorrelated, but this idealized path is exactly how the intuition for shrinkage and sparsity is usually taught.',
   practical:'Software like glmnet computes this entire path efficiently in a single pass, letting practitioners pick λ visually or via cross-validation instead of retraining hundreds of separate models.',
   bullets:['Watch every coefficient as λ grows','Lasso: sharp kinks, hits zero one by one','Ridge: smooth decay, never quite zero'],
   render:renderRegPath},
  {title:'Elastic Net', family:'Regularized', eq:'J = Σ(y−ŷ)² + λ₁Σ|wⱼ| + λ₂Σwⱼ²',
   breakdown:[{t:'λ₁',d:'L1 strength — pushes toward sparsity'},{t:'λ₂',d:'L2 strength — keeps weights small and stable'},{t:'α',d:'mixing ratio that blends the two penalties'}],
   theory:'Elastic Net combines both penalties because Lasso has a known weakness: with highly correlated features, it tends to pick one arbitrarily and zero out the rest, which is unstable and can discard useful signal. Ridge handles correlated features gracefully but never produces true sparsity. Blending the two, controlled by a mixing ratio α, keeps correlated groups together while still zeroing out features that contribute nothing.',
   derivation:'This penalty is literally Lasso\'s penalty plus Ridge\'s penalty added together, so the resulting optimization inherits sparsity from the L1 term and stability from the L2 term. The mixing parameter α just interpolates between the two, recovering pure Lasso at α=1 and pure Ridge at α=0.',
   practical:'Genomic and text-based models — where features are both numerous and correlated in clusters, like related genes or synonymous words — frequently default to Elastic Net over either penalty alone.',
   bullets:['Blends Ridge and Lasso','α tunes the L1 / L2 mix','Good with correlated features'],
   render:renderElastic},
  {title:'Support Vector Regression', family:'Margin-based', eq:'|y − ŷ| ≤ ε  (else penalize)',
   breakdown:[{t:'ε',d:'tolerance — errors smaller than this cost nothing'},{t:'ξ',d:'slack — how far a point pokes outside the tube'},{t:'objective',d:'minimize ‖w‖² + C·Σξ — flat line, few violations'}],
   theory:'SVR only penalizes errors larger than a tolerance ε — anything closer counts as a perfect prediction and costs nothing. Points that do fall outside this ε-tube become \'support vectors,\' and the fitted line minimizes both its own steepness and the total slack those support vectors accumulate. The result ignores minor noise entirely and is defined by the handful of stubborn points just past the margin, rather than by every point in the data.',
   derivation:'The full SVR optimization minimizes ‖w‖²/2 + C·Σξᵢ subject to the ε-tube constraint. Minimizing ‖w‖² is the same \'prefer a flat, simple line\' preference as ridge regression, while the slack variables ξᵢ are only charged when a point pokes outside the ε margin — this dual structure is solved via quadratic programming, the same machinery behind classification SVMs.',
   practical:'SVR is popular in financial time-series prediction and other noisy-signal settings, where you explicitly don\'t want the model reacting to every small fluctuation inside a known noise band.',
   bullets:['Draw a tolerance tube of width ε','Points inside: free, no penalty','Only points outside shape the fit'],
   render:renderSVR},
  {title:'The Kernel Trick', family:'Margin-based', eq:'K(x,x′) = φ(x)·φ(x′)',
   breakdown:[{t:'φ(x)',d:'a mapping that lifts x into a higher dimension'},{t:'K(x,x′)',d:'their dot product up there — computed directly, cheaply'},{t:'RBF kernel',d:'K = exp(−‖x−x′‖² / 2σ²), a common bell-shaped choice'}],
   theory:'Some patterns are not linear in the original feature space but become linear from a higher-dimensional angle — mapping x to (x, x²) turns a parabola into a plane. The kernel trick makes this practical: instead of explicitly computing that mapping φ(x), you only ever need the dot product φ(x)·φ(x′), which many kernel functions compute directly and cheaply from x and x′ alone. This lets SVR fit highly nonlinear relationships using fundamentally linear machinery underneath.',
   derivation:'For many useful mappings φ, computing φ(x) explicitly would require infinite dimensions (as with the RBF kernel) — computationally impossible. But the SVR/SVM optimization never actually needs φ(x) itself, only dot products between mapped points, and clever kernel functions compute exactly that dot product using only the original x — that substitution is \'the trick.\'',
   practical:'Nonlinear SVR with an RBF kernel is a standard choice in bioinformatics and small-to-medium tabular datasets where the true relationship is visibly curved but its exact functional form is unknown.',
   bullets:['Lift data into a higher dimension','A flat fit up there = a curve back here','Never actually compute φ(x) — just K'],
   render:renderKernelTrick},
  {title:'Decision Tree Regressor', family:'Trees', eq:'ŷ = mean(y)  in that region',
   breakdown:[{t:'split rule',d:'x < t ?  go left  :  go right'},{t:'criterion',d:'pick t that shrinks variance in y the most'},{t:'leaf value',d:'average y of every point that lands there'}],
   theory:'A regression tree partitions the input space into rectangular regions by repeatedly asking threshold questions, choosing at each step the split that most reduces the variance of y within the resulting groups. Every point landing in a region gets that region\'s average y as its prediction. Trees assume nothing about the shape of the true function and can capture sharp, local structure a line never could — but grown deep enough, a single tree will carve out a region for nearly every training point, which is severe overfitting.',
   derivation:'The split-selection rule — minimize the combined variance of the two child groups — is derived from the same \'minimize squared error\' goal as linear regression. The difference is the search: instead of solving for continuous coefficients with calculus, it\'s a search over a discrete set of candidate thresholds, checked one at a time.',
   practical:'Decision trees are prized in banking and healthcare specifically because the \'if x < t\' logic is trivially explainable to a regulator or a doctor, unlike a black-box coefficient vector.',
   bullets:['Ask yes/no questions about x','Each split reduces variance most','Predict the region\'s average'],
   render:renderTree},
  {title:'Random Forest Regressor', family:'Tree Ensembles', eq:'ŷ = (1/T) Σₜ treeₜ(x)',
   breakdown:[{t:'T',d:'number of trees grown in the forest'},{t:'bootstrap',d:'each tree trains on a random resample of the data'},{t:'averaging',d:'cuts variance a lot, without adding much bias'}],
   theory:'A single deep tree overfits because it has too much freedom to chase individual points. Random Forest fights this with two sources of randomness: each tree trains on a bootstrap resample of the data, and each split only considers a random subset of features. Individually these trees are still noisy, but their errors are only weakly correlated with each other — averaging many of them keeps the low bias of deep trees while dramatically reducing variance.',
   derivation:'Averaging independent, unbiased-but-noisy estimators reduces variance in proportion to how correlated they are — a basic statistics result: Var(average) = Var(single)/T only when the estimators are uncorrelated. Bootstrapping and feature-subsampling are specifically engineered to decorrelate the trees so this variance reduction actually takes effect.',
   practical:'Random Forests are a default \'first strong model\' across finance, ecology, and marketing analytics because they need almost no tuning and rarely overfit catastrophically.',
   bullets:['Many trees on bootstrapped data','Each tree overfits differently','Averaging cancels their noise'],
   render:renderForest},
  {title:'Feature Importance', family:'Tree Ensembles', eq:'importance ∝ total error reduction',
   breakdown:[{t:'per split',d:'how much variance that one split removed'},{t:'summed',d:'added up across every split, in every tree'},{t:'normalized',d:'often rescaled so all importances sum to 1'}],
   theory:'Tree ensembles offer a built-in way to rank features: every time a feature is used for a split, that split reduces prediction error by some amount. Summing that reduction across every split, in every tree, and normalizing gives an importance score per feature with no separate model required. It is a major interpretability advantage, though correlated features tend to split the credit between them, understating each one\'s individual importance.',
   derivation:'This score is a direct byproduct of how trees are built: since every split is chosen specifically to reduce variance the most, tallying how much variance each feature\'s splits removed across the whole forest is a natural exhaust of training, not an extra calculation bolted on afterward.',
   practical:'Businesses use this to justify which factors to actually act on — a churn model revealing \'support ticket count\' as the top feature directly informs where to invest in customer service.',
   bullets:['Which inputs actually moved the needle?','Summed across every split, every tree','Great for explaining a "black box" ensemble'],
   render:renderFeatureImportance},
  {title:'Extra Trees Regressor', family:'Tree Ensembles', eq:'ŷ = (1/T) Σₜ treeₜ(x)',
   breakdown:[{t:'random t',d:'the split threshold is picked at random, not searched for'},{t:'random features',d:'often only a random subset is even considered'},{t:'payoff',d:'skipping the search makes training cheaper, adds diversity'}],
   theory:'Extremely Randomized Trees push Random Forest\'s randomness further: instead of searching for the best split threshold at each node, it picks the threshold randomly and only checks whether that random choice happens to help. Each individual tree is weaker, but the resulting trees are even less correlated with each other, and averaging many weak, decorrelated learners can match or beat averaging fewer, stronger, more-correlated ones — while training considerably faster.',
   derivation:'Skipping the optimal-split search trades a small amount of per-tree accuracy for a large reduction in correlation between trees — and by the same variance-reduction math as Random Forest, less correlation among ensemble members can outweigh each member being individually a bit weaker.',
   practical:'Extra Trees are common in large-scale or real-time systems where the cost of exhaustively searching every split across millions of rows is a genuine bottleneck.',
   bullets:['Splits chosen randomly, not optimally','Even more diversity between trees','Often faster, similarly accurate'],
   render:renderExtraTrees},
  {title:'Gradient Boosting Regressor', family:'Boosting', eq:'Fₘ(x) = Fₘ₋₁(x) + η · hₘ(x)',
   breakdown:[{t:'F₀',d:'the starting guess — usually just mean(y)'},{t:'hₘ',d:'a small tree fit to the current leftover residuals'},{t:'η',d:'learning rate — how much of hₘ actually gets added'}],
   theory:'Where Random Forest builds many independent trees and averages them, Gradient Boosting builds trees sequentially, each one trained specifically to predict the errors of everything built so far. Formally this is gradient descent taken in \'function space\' rather than parameter space: each tree is a step that most reduces the loss. Because each stage directly attacks the previous stage\'s mistakes, boosted ensembles often reach lower error than bagged ones, at the cost of being more sensitive to overfitting.',
   derivation:'This update rule is literally gradient descent performed in \'function space\': instead of nudging a parameter vector by the negative gradient of the loss, each new tree hₘ is fit to approximate the negative gradient of the loss with respect to the current predictions — which, for squared error, works out to simply the residuals.',
   practical:'Gradient boosting is a default choice for structured/tabular prediction in industry — credit scoring, click-through-rate prediction, and pricing engines lean on it heavily.',
   bullets:['Start with one simple guess','Each new tree fits the leftover error','Add them up, slowly improving'],
   render:renderGB},
  {title:'Learning Rate & Shrinkage', family:'Boosting', eq:'η ∈ (0, 1]',
   breakdown:[{t:'small η',d:'each tree adds a little — needs more trees to compensate'},{t:'large η',d:'each tree adds a lot — fewer trees, higher overshoot risk'},{t:'rule of thumb',d:'lower η + more trees ≈ better generalization'}],
   theory:'The learning rate η in boosting is a form of regularization, not just a speed knob. A tree fit exactly to the current residuals and added at full strength can overcorrect, especially with noisy data — the next tree then has to overcorrect the overcorrection, chasing noise instead of signal. Shrinking each tree\'s contribution forces the ensemble into many small, conservative corrections rather than a few large, aggressive ones, which empirically tends to generalize better given enough additional trees.',
   derivation:'Shrinking each step is mathematically the same idea as shrinking the step size in ordinary gradient descent — smaller steps trace a smoother path toward the minimum and are less likely to overshoot due to noisy gradient estimates from any one tree\'s imperfect fit.',
   practical:'Kaggle-winning boosted models almost always pair a small learning rate (often 0.01–0.1) with thousands of trees rather than a handful of aggressive ones, trading training time for reliability.',
   bullets:['High η: fast, few trees, risks overshoot','Low η: slow, many trees, steadier fit','Classic tradeoff: speed vs generalization'],
   render:renderLearningRate},
  {title:'AdaBoost Regressor', family:'Boosting', eq:'F(x) = Σₘ αₘ · hₘ(x)',
   breakdown:[{t:'wᵢ',d:'weight on point i — starts equal for every point'},{t:'errₘ',d:'weighted error of learner m on the current weights'},{t:'αₘ',d:'learner m\'s vote strength — bigger when errₘ is smaller'}],
   theory:'AdaBoost\'s central idea is adaptive reweighting: after each weak learner is fit, the points it got most wrong have their influence increased before the next learner trains, forcing that learner to focus where the ensemble is currently failing. Each learner also earns a vote weight based on its own accuracy. AdaBoost was one of the first boosting algorithms to work reliably in practice, though gradient boosting has since become the more common default for tabular regression.',
   derivation:'The weight-update formula and the vote-strength αₘ both come from an explicit derivation that minimizes an exponential loss function, one round at a time — choosing exactly the weighting that most reduces that loss at each step is what gives AdaBoost its name and its provable training-error guarantees.',
   practical:'AdaBoost remains popular in computer-vision pipelines (like classic face detection) and any setting needing a simple, fast, interpretable boosting method without a full gradient-boosting framework.',
   bullets:['Fit a weak learner first','Up-weight the points it missed most','Next learner focuses on those'],
   render:renderAdaBoost},
  {title:'XGBoost Regressor', family:'Boosting', eq:'J = Σ loss(y,ŷ) + Ω(tree)',
   breakdown:[{t:'Ω(tree)',d:'penalty on tree size — number of leaves & leaf weights'},{t:'2nd-order',d:'uses both gradient and curvature to pick each split'},{t:'gain',d:'a split survives only if it beats a minimum gain threshold'}],
   theory:'XGBoost is gradient boosting engineered for speed and generalization. It uses a second-order Taylor expansion of the loss at each step, considering both gradient and curvature when growing each tree, giving more precise splits than first-order boosting. It also bakes regularization directly into the tree-building objective — penalizing leaf count and leaf magnitude — so overfitting is discouraged during construction, not just through hyperparameters chosen beforehand.',
   derivation:'Expanding the loss function in a second-order Taylor series around the current prediction gives an approximate objective solvable in closed form for the optimal leaf value of any candidate tree structure — that\'s what lets XGBoost score potential splits extremely fast without literally retraining anything.',
   practical:'XGBoost dominated structured-data Kaggle competitions for years and remains standard in production fraud-detection and demand-forecasting systems where squeezing out extra accuracy has real dollar value.',
   bullets:['Gradient boosting, engineered for speed','Ω regularizes tree size & leaf values','Uses 2nd-order gradient info'],
   render:renderXGBoost},
  {title:'LightGBM Regressor', family:'Boosting', eq:'grow leaf-wise, not level-wise',
   breakdown:[{t:'level-wise',d:'every leaf at the current depth expands together'},{t:'leaf-wise',d:'only the single worst leaf expands next'},{t:'payoff',d:'fewer total splits needed for the same accuracy'}],
   theory:'Most tree-growing algorithms expand level by level, splitting every leaf at the current depth even ones that barely help. LightGBM grows leaf-wise instead: at every step it finds and splits whichever single leaf offers the greatest loss reduction, regardless of depth. This reaches a given accuracy with fewer total splits, but produces deeper, more asymmetric trees that need a max-depth limit — combined with histogram-based splitting, it trains dramatically faster on very large datasets.',
   derivation:'Choosing the split with the globally maximum loss reduction, rather than the best split at each fixed depth, is a greedy strategy that provably reaches lower total loss with fewer splits. The tradeoff is that \'fewer splits\' doesn\'t mean \'shallower tree\' — it means a lopsided one, which is why depth limits matter more here than in level-wise growth.',
   practical:'LightGBM is the go-to for very large tabular datasets — recommendation systems and ad-tech pipelines use it specifically for its training speed at scale.',
   bullets:['Expands the worst leaf first','Deeper, asymmetric trees','Much faster on large datasets'],
   render:renderLightGBM},
  {title:'CatBoost Regressor', family:'Boosting', eq:'category → ordered target statistic',
   breakdown:[{t:'target stat',d:'replace a category with an average of y for that category'},{t:'ordered',d:'only rows that came "before" it are used to compute that average'},{t:'why',d:'stops the true label from leaking into its own encoding'}],
   theory:'Naively encoding a categorical feature as the average target value for that category leaks information — that average was partly computed from the very row being predicted. CatBoost\'s \'ordered\' target statistics fix this by only computing each row\'s encoding from rows that came before it in a random ordering, mimicking how the model would behave seeing data one point at a time. That fix, plus native categorical support, removes much of the manual encoding work other boosting libraries require.',
   derivation:'The \'ordering\' constraint deliberately simulates an online-learning scenario — computing statistics only from \'past\' rows mathematically guarantees the encoding used for a row\'s prediction never depended on that row\'s own label, exactly the condition needed to avoid target leakage.',
   practical:'CatBoost is favored in industries with rich categorical data, like retail (product categories, store IDs), where manual encoding of categories would otherwise take significant feature-engineering effort.',
   bullets:['Handles categorical features natively','Encodes using target statistics','"Ordered" boosting avoids leakage'],
   render:renderCatBoost},
  {title:'Gaussian Process Regression', family:'Probabilistic', eq:'f(x) ~ GP( m(x), k(x,x\') )',
   breakdown:[{t:'m(x)',d:'the prior mean function — often just 0'},{t:'k(x,x′)',d:'covariance — how correlated f(x) and f(x′) are'},{t:'posterior',d:'the prior, conditioned on the points we\'ve already seen'}],
   theory:'Rather than committing to one function, a Gaussian Process defines a probability distribution over every function consistent with a chosen smoothness assumption. Before any data, this is the wide \'prior.\' Once data arrives, Bayes\' rule mechanically rules out every function that does not pass near the observed points, leaving a narrower \'posterior.\' A GP hands you not just a prediction but calibrated uncertainty at every input — naturally wide where data is sparse, narrow where it is dense.',
   derivation:'A Gaussian Process is defined so that any finite set of function values follows a multivariate Gaussian distribution, with the kernel matrix as its covariance. Conditioning a multivariate Gaussian on some of its variables (the observed points) has a known closed-form formula from probability theory — that formula is exactly what produces the posterior mean and its uncertainty band.',
   practical:'GPR is used in Bayesian optimization for tuning expensive-to-evaluate systems, like hyperparameter search or physical experiment design, precisely because it reports not just a prediction but how confident to be at each candidate point.',
   bullets:['A distribution over entire functions','Data rules out inconsistent curves','Uncertainty shrinks near known points'],
   render:renderGPR},
  {title:'Kernels of a Gaussian Process', family:'Probabilistic', eq:'k(x,x′) shapes the prior',
   breakdown:[{t:'RBF',d:'nearby points strongly correlated, far ones nearly independent'},{t:'periodic',d:'correlation repeats with distance — good for seasonality'},{t:'lengthscale',d:'controls how fast that correlation fades with distance'}],
   theory:'The kernel k(x,x′) is the single design choice that defines what \'plausible function\' means to a GP — how strongly the function\'s value at one point should correlate with its value at another. RBF assumes smooth, gently varying functions with a lengthscale controlling how fast correlation fades. Periodic assumes the function repeats after some interval. Linear recovers ordinary linear regression as a special case. Choosing a kernel is choosing what kind of world you believe the data lives in.',
   derivation:'Any valid kernel must produce a positive semi-definite covariance matrix for every possible set of input points — that constraint, via Mercer\'s theorem, is what separates a legitimate kernel from an arbitrary similarity function, and it\'s exactly what guarantees the resulting distribution over functions is well-defined.',
   practical:'Climate scientists use periodic kernels to model seasonal temperature cycles, while RBF kernels are the default in most black-box optimization software, such as tuning a manufacturing process.',
   bullets:['RBF: smooth, gently wandering functions','Periodic: repeating, seasonal patterns','Linear: trending, ever-widening functions'],
   render:renderGPRKernels},
  {title:'Bayesian Regression', family:'Probabilistic', eq:'p(w | D) ∝ p(D | w) · p(w)',
   breakdown:[{t:'p(w)',d:'the prior — belief about w before seeing any data'},{t:'p(D|w)',d:'the likelihood — how well w explains the data we have'},{t:'p(w|D)',d:'the posterior — the updated belief after seeing it'}],
   theory:'Ordinary least squares gives a single \'best\' set of coefficients and treats them as fixed. Bayesian regression treats the coefficients as uncertain quantities with a distribution: a prior belief (small coefficients more likely than huge ones) combines with how well each candidate explains the data, via Bayes\' rule, to produce a posterior distribution. The payoff is a full accounting of uncertainty, especially valuable with limited data, where \'the one best line\' can be dangerously overconfident.',
   derivation:'This is Bayes\' theorem applied directly to model parameters: posterior is proportional to likelihood times prior. For linear regression with a Gaussian prior and Gaussian noise, that combination happens to have a closed-form Gaussian posterior too — precisely why Bayesian linear regression is tractable while many more complex Bayesian models are not.',
   practical:'Bayesian regression shows up in scientific fields with small, expensive datasets — like clinical trials or physics experiments — where honestly representing uncertainty matters as much as the point estimate.',
   bullets:['Start with a belief about w','Update it as evidence arrives','Result: a distribution, not one line'],
   render:renderBayesian},
  {title:'K-Nearest Neighbors Regression', family:'Instance-based', eq:'ŷ = average of k nearest yᵢ',
   breakdown:[{t:'distance',d:'usually Euclidean: √Σ(xᵢ − x′ᵢ)²'},{t:'k',d:'small k = sensitive/noisy, large k = smooth/biased'},{t:'lazy learner',d:'no training step — all the work happens at prediction time'}],
   theory:'KNN makes no attempt to learn a global formula at all. Instead it defers every decision to prediction time: given a new point, find the k closest training points (typically by Euclidean distance) and predict the average of their y values. This \'lazy learning\' can capture arbitrarily complex relationships since it assumes nothing about their shape, but it must store the entire training set and compute distances to every point at prediction time, which scales poorly as data grows.',
   derivation:'There\'s no optimization or derivation here at all — that\'s the point. KNN is non-parametric: instead of assuming a functional form and solving for its best parameters, it directly estimates y from the empirical local average, relying on the assumption that nearby x\'s tend to have similar y\'s.',
   practical:'KNN is a natural fit for recommendation systems (\'users like you also liked...\') and simple imputation of missing values based on similar records.',
   bullets:['No formula is ever learned','Find the k closest points to x','Predict their average value'],
   render:renderKNN},
  {title:'The Curse of Dimensionality', family:'Instance-based', eq:'distance ↑  as  dimensions ↑',
   breakdown:[{t:'unit cube',d:'random points scattered through a d-dimensional box'},{t:'volume',d:'grows exponentially with d — points thin out fast'},{t:'consequence',d:'"nearest" and "farthest" neighbor distances start to converge'}],
   theory:'In one dimension, \'closest neighbor\' is intuitive. As dimensions are added, the volume of the space grows exponentially while the amount of data usually does not, so any fixed number of points becomes increasingly sparse. Strikingly, in high enough dimensions the distance to your nearest neighbor and to your farthest neighbor start to converge — \'near\' stops meaning anything distinctive, which is why every distance-based method degrades as dimensionality grows.',
   derivation:'This can be shown directly: for random points in a d-dimensional unit cube, the expected distance between two points grows roughly with √d, while the volume available for points to spread into grows exponentially — so fixed data becomes proportionally sparser, and \'nearest neighbor\' becomes a less meaningful concept as d increases.',
   practical:'This is exactly why practitioners run PCA or feature selection before applying KNN or clustering to high-dimensional data like gene-expression profiles or image pixels.',
   bullets:['In 1D, "near" means something','Add dimensions: everything drifts apart','KNN (and distance itself) loses its edge'],
   render:renderCurseOfDim},
  {title:'Correlation ≠ Causation', family:'Foundation', eq:'corr(A,B) ⇏ A causes B',
   breakdown:[{t:'corr(A,B)',d:'how much A and B move together, from −1 to 1'},{t:'confounder C',d:'a hidden cause driving both A and B at once'},{t:'causal claim',d:'needs an intervention or a designed experiment, not just data'}],
   theory:'Every method in this deck finds patterns of association: as x moves, how does y tend to move? None of them, alone, can say whether x causes y, y causes x, or an unseen confounder drives them both together. Two quantities can be highly correlated purely because they share a common cause, with no direct link between them. Answering a genuinely causal question typically needs a designed experiment or dedicated causal-inference techniques, not just a fitted regression.',
   derivation:'Correlation is a purely statistical, symmetric measure of co-movement computed from data alone — it carries no information about the direction or mechanism connecting two variables. Establishing causation formally requires either randomization (so confounders are balanced by design) or explicit causal assumptions built into a model, neither of which observational correlation alone can provide.',
   practical:'This distinction is why regulatory bodies like the FDA require randomized controlled trials, not just observational correlation, before approving a drug based on a claimed effect.',
   bullets:['A model finds patterns, not reasons','A hidden variable can drive both','Regression describes; it doesn\'t explain why'],
   render:renderCorrCausation},
  {title:'Choosing a Model', family:'Synthesis', eq:'error = bias² + variance + noise',
   breakdown:[{t:'bias',d:'systematic error from a model that\'s too simple'},{t:'variance',d:'error from a model too sensitive to its training set'},{t:'noise',d:'irreducible error — no model can remove this part'}],
   theory:'Every model in this deck sits somewhere on a spectrum from rigid-but-stable to flexible-but-erratic. Simple models have high bias but low variance, so they generalize predictably even if they miss subtle structure. Complex models have low bias but high variance, sensitive to the specific training sample. There is no universally best algorithm; the right choice depends on how much data you have, how noisy it is, and how much interpretability you are willing to trade for accuracy.',
   derivation:'This decomposition comes from algebraically expanding the expected squared error of a prediction — it can be proven that expected test error splits exactly into these three additive terms for any estimator, which is why \'more flexible\' isn\'t automatically \'better\': flexibility trades bias for variance, and the noise term is a hard floor no model can go below.',
   practical:'This tradeoff is the mental model practitioners use to choose between a simple, interpretable model and a complex ensemble when facing a real deadline and a fixed dataset size.',
   bullets:['Simple models: stable, may underfit','Flexible models: sharp, may overfit','Ensembles balance the two'],
   render:renderSummary},
  {title:'The Thread', family:'Closing', eq:'ŷ = f(x) + ε',
   breakdown:[{t:'f(x)',d:'the signal — the part we can hope to learn'},{t:'ε',d:'the noise — randomness no model can ever capture'},{t:'the goal',d:'get f̂ as close to f as the data allows, then stop'}],
   theory:'Strip away the differences in geometry, randomness, and optimization tricks, and every method in this deck does the same two things: propose a shape for f(x), and adjust that shape to make (y−ŷ)² small on the data it is allowed to see. The real skill in regression is not memorizing formulas — it is judging which shape of f is plausible for your problem, and resisting the temptation to fit the training data perfectly, since a perfect fit is almost always a sign of memorizing noise instead of signal.',
   derivation:'This equation is the underlying statistical model every method in this deck implicitly assumes: some true, learnable signal f(x), corrupted by unlearnable noise ε. Every algorithm\'s equation from the previous slides is really just a specific hypothesis about the shape of f, and a specific recipe for estimating it from data.',
   practical:'Understanding this framing is what lets a practitioner move fluidly between tools — recognizing that a churn model, a demand forecast, and a drug-response curve are all, underneath, the same basic problem wearing different clothes.',
   bullets:['Every method minimizes (y − ŷ)²','The difference is the shape of f','...and how it resists overfitting'],
   render:renderClosing},
];

/* ============================================================
   ENGINE / NAVIGATION
============================================================ */
let current = 0;
let slideStart = performance.now();

const elTitle = document.getElementById('slideTitle');
const elCounter = document.getElementById('counter');
const elEq = document.getElementById('eqText');
const elExplain = document.getElementById('explainList');
const elTheory = document.getElementById('theoryText');
const elBullets = document.getElementById('bulletList');
const elFamily = document.getElementById('familyTag');
const elEqCard = document.getElementById('eqCard');
const elExplainCard = document.getElementById('explainCard');
const elTheoryCard = document.getElementById('theoryCard');
const elBulletCard = document.getElementById('bulletCard');
const elWhyDetails = document.getElementById('whyDetails');
const elWhyDerivation = document.getElementById('whyDerivation');
const elWhyPractical = document.getElementById('whyPractical');
const elPrev = document.getElementById('prevBtn');
const elNext = document.getElementById('nextBtn');
const elDots = document.getElementById('dots');

function buildDots(){
  elDots.innerHTML='';
  slides.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='dot'+(i===current?' active':'');
    b.title=s.title;
    b.addEventListener('click',()=>goTo(i));
    elDots.appendChild(b);
  });
}
function updateDots(){
  [...elDots.children].forEach((d,i)=> d.classList.toggle('active', i===current));
}
function retrigger(el){
  el.classList.remove('in');
  void el.offsetWidth;
  el.classList.add('in');
}
function buildBreakdown(list){
  elExplain.innerHTML='';
  list.forEach(item=>{
    const li = document.createElement('li');
    const termSpan = document.createElement('span');
    termSpan.className='term';
    termSpan.textContent = item.t;
    li.appendChild(termSpan);
    li.appendChild(document.createTextNode(item.d));
    elExplain.appendChild(li);
  });
}
function updateUI(){
  const s = slides[current];
  elTitle.textContent = s.title;
  retrigger(elTitle);
  elCounter.textContent = String(current+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  elEq.textContent = s.eq;
  buildBreakdown(s.breakdown||[]);
  elTheory.textContent = s.theory||'';
  elBullets.innerHTML = s.bullets.map(b=>'<li>'+b+'</li>').join('');
  elFamily.innerHTML = 'Family: <span>'+s.family+'</span>';
  elWhyDerivation.textContent = s.derivation||'';
  elWhyPractical.textContent = s.practical||'';
  elWhyDetails.open = false;
  retrigger(elEqCard);
  retrigger(elExplainCard);
  retrigger(elTheoryCard);
  retrigger(elBulletCard);
  retrigger(elWhyDetails);
  elPrev.disabled = current===0;
  elNext.disabled = current===slides.length-1;
  updateDots();
}
function goTo(idx){
  idx = Math.max(0, Math.min(slides.length-1, idx));
  if(idx===current) return;
  current = idx;
  slideStart = performance.now();
  updateUI();
}
function next(){ if(current<slides.length-1) goTo(current+1); }
function prev(){ if(current>0) goTo(current-1); }

elPrev.addEventListener('click', prev);
elNext.addEventListener('click', next);
window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); prev(); }
});

function loop(now){
  const t = (now-slideStart)/1000;
  ctx.clearRect(0,0,W(),H());
  try{
    slides[current].render(ctx, W(), H(), t);
  }catch(err){
    console.error('render error on slide', current, err);
  }
  requestAnimationFrame(loop);
}

function init(){
  resize();
  buildDots();
  updateUI();
  requestAnimationFrame(loop);
}
init();
</script>
