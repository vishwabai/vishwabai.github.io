<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divide &amp; Conquer — Deep Dive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0f;
    --bg2:#0f0f18;
    --purple:#6c5ce7;
    --purple-dim:#4a3f9e;
    --light-purple:#a29bfe;
    --pink:#fd79a8;
    --green:#55efc4;
    --yellow:#ffeaa7;
    --red:#ff7675;
    --text:#e6e6f0;
    --muted:#7a7a8c;
    --line:#232333;
    --card:#12121c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
    font-family:'Inter',system-ui,sans-serif;color:var(--text);}
  .viewport{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}
  .stage{
    width:1280px;height:720px;position:relative;flex:none;
    background:radial-gradient(circle at 50% 0%, #101018 0%, #08080c 70%);
    transform-origin:center center;
    overflow:hidden;
    border-radius:4px;
  }
  .slide-content{position:absolute;inset:0;}
  .kicker{
    position:absolute;left:72px;top:40px;
    font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:3px;
    color:var(--purple);text-transform:uppercase;font-weight:500;
    opacity:0;animation:fadeUp .5s ease forwards;
  }
  .title{
    position:absolute;left:72px;top:64px;
    font-size:38px;font-weight:800;color:#fff;letter-spacing:-0.5px;
    opacity:0;animation:fadeUp .55s ease .08s forwards;
  }
  .subtitle{
    position:absolute;left:72px;top:112px;font-size:16px;color:var(--muted);
    font-weight:400;opacity:0;animation:fadeUp .55s ease .16s forwards;max-width:1000px;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes popIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
  .chrome{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;
    justify-content:space-between;padding:0 28px;z-index:50;font-family:'JetBrains Mono',monospace;}
  .chrome-left,.chrome-right{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px;}
  .navbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#0e0e16;
    color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;
    transition:.15s;user-select:none;}
  .navbtn:hover{border-color:var(--purple);color:var(--purple);}
  .navbtn.disabled{opacity:.25;pointer-events:none;}
  .progress-wrap{position:fixed;left:0;right:0;bottom:56px;height:3px;background:#161622;z-index:50;}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--purple),var(--pink));width:0%;transition:width .35s ease;}
  .replay-btn{position:absolute;right:44px;bottom:28px;font-family:'JetBrains Mono',monospace;font-size:11px;
    letter-spacing:1px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:7px 16px;
    cursor:pointer;background:#0e0e16;transition:.15s;}
  .replay-btn:hover{color:var(--purple);border-color:var(--purple);}

  /* generic components */
  .box{position:absolute;border:1.5px solid var(--line);border-radius:10px;background:var(--card);
    display:flex;align-items:center;justify-content:center;color:var(--text);font-size:14px;}
  .box.active{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple-dim);}
  .box.done{border-color:var(--green);}
  .box.pivot{border-color:var(--pink);}
  .arrow-label{position:absolute;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
    letter-spacing:1px;text-transform:uppercase;}
  .formula-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 28px;
    font-family:'JetBrains Mono',monospace;color:var(--light-purple);font-size:22px;text-align:center;}
  .formula-box .small{font-size:13px;color:var(--muted);margin-top:8px;font-family:'Inter',sans-serif;}
  .case-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    opacity:0;transform:translateY(12px);}
  .case-card h4{margin:0 0 6px;font-size:13px;color:var(--pink);font-family:'JetBrains Mono',monospace;}
  .case-card p{margin:0;font-size:13px;color:var(--text);line-height:1.5;}
  .case-card .ex{margin-top:8px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .app-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;opacity:0;}
  .app-card h4{margin:0 0 6px;font-size:14px;color:var(--green);}
  .app-card p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5;}
  .bars{position:absolute;display:flex;align-items:flex-end;}
  .bar{position:absolute;bottom:0;width:44px;border-radius:6px 6px 3px 3px;
    background:linear-gradient(180deg,var(--purple),var(--purple-dim));
    display:flex;align-items:flex-start;justify-content:center;color:#fff;font-size:13px;font-weight:600;
    font-family:'JetBrains Mono',monospace;padding-top:6px;transition:left .55s cubic-bezier(.4,0,.2,1),
    background .3s,transform .3s,height .3s;}
  .bar.compare{background:linear-gradient(180deg,var(--yellow),#cba135);color:#1a1a1a;}
  .bar.swap{background:linear-gradient(180deg,var(--pink),#c94f75);}
  .bar.pivotbar{background:linear-gradient(180deg,var(--red),#a13f3f);}
  .bar.sorted{background:linear-gradient(180deg,var(--green),#2fa88a);color:#0a0a0f;}
  .ptr{position:absolute;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--pink);
    text-align:center;transition:left .5s ease;}
  .ptr .tri{width:0;height:0;margin:0 auto 2px;border-left:6px solid transparent;border-right:6px solid transparent;
    border-bottom:8px solid var(--pink);}
  .recap-gap-fill{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .rgf-line{font-family:'JetBrains Mono',monospace;letter-spacing:2px;font-size:13px;color:var(--muted);
    text-transform:uppercase;opacity:0;margin-bottom:14px;}
  .rgf-text{font-size:26px;font-weight:600;max-width:920px;opacity:0;line-height:1.5;}
  .rgf-fill{font-size:34px;font-weight:800;color:var(--pink);opacity:0;margin-top:26px;}
  .qmark{font-size:64px;color:var(--purple);opacity:0;}
  table.summary{border-collapse:collapse;width:100%;font-size:13px;}
  table.summary th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;letter-spacing:1px;
    text-transform:uppercase;padding:8px 14px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;}
  table.summary td{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--text);}
  table.summary td.mono{font-family:'JetBrains Mono',monospace;color:var(--light-purple);}
  .quiz-opt{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 18px;
    cursor:pointer;font-size:14px;transition:.15s;}
  .quiz-opt:hover{border-color:var(--purple);}
  .quiz-opt.correct{border-color:var(--green);background:#0f1c17;}
  .quiz-opt.wrong{border-color:var(--red);background:#1c0f0f;}
  .mistake-card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--red);
    border-radius:8px;padding:14px 18px;opacity:0;}
  .mistake-card h4{margin:0 0 4px;font-size:14px;color:var(--red);}
  .mistake-card p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5;}
  .fadegroup > *{opacity:0;}
  ::selection{background:var(--purple);color:#fff;}
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <div class="slide-content" id="slideContent"></div>
  </div>
</div>

<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
<div class="chrome">
  <div class="chrome-left">
    <div class="navbtn" id="prevBtn">&#8592;</div>
    <span id="slideCounter">1 / 29</span>
  </div>
  <div class="chrome-left" id="sectionLabel" style="color:var(--purple);">FOUNDATIONS</div>
  <div class="chrome-right">
    <span>&#8592; &#8594; or space to navigate</span>
    <div class="navbtn" id="nextBtn">&#8594;</div>
  </div>
</div>

<script>
/* ============ helpers ============ */
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = (ms) => new Promise(r => setTimeout(r, REDUCED ? 0 : ms));
const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html!==undefined) e.innerHTML = html; return e; };
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs) => { const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; };
function pos(x,y,w,h){ return `left:${x}px;top:${y}px;` + (w!==undefined?`width:${w}px;`:'') + (h!==undefined?`height:${h}px;`:''); }
async function typeReveal(container, arr, delay=90){
  for(const node of arr){ node.style.animation = 'fadeUp .4s ease forwards'; await wait(delay); }
}

/* ============ generic recursion-tree component ============ */
// node: {label, sub?, children:[...]}. Renders inside a container of given width/height.
function buildTreeLayout(root, width, height, topPad=20, botPad=20){
  let leafIndex = 0;
  function depth(n){ return (n.children && n.children.length) ? 1 + Math.max(...n.children.map(depth)) : 0; }
  const maxDepth = depth(root);
  function assignLeaf(n){
    if(!n.children || !n.children.length){ n.leafIdx = leafIndex++; }
    else { n.children.forEach(assignLeaf); n.leafIdx = n.children.reduce((s,c)=>s+c.leafIdx,0)/n.children.length; }
  }
  assignLeaf(root);
  const totalLeaves = leafIndex || 1;
  function place(n, d){
    n.depth = d;
    n.px = (n.leafIdx + 0.5) / totalLeaves * width;
    n.py = topPad + (maxDepth ? d * ((height - topPad - botPad) / maxDepth) : 0);
    if(n.children) n.children.forEach(c => place(c, d+1));
  }
  place(root, 0);
  return { maxDepth, totalLeaves };
}
function flattenTree(root){
  const nodes = []; const edges = [];
  (function walk(n){ nodes.push(n); if(n.children) n.children.forEach(c=>{ edges.push([n,c]); walk(c); }); })(root);
  return { nodes, edges };
}
// Renders tree, reveals level-by-level top-down (split), returns {container, svg, boxEl(node)} for further (merge) animation
async function animateTreeSplit(host, root, width, height, boxW, boxH){
  host.innerHTML = '';
  const wrap = el('div'); wrap.style.cssText = `position:relative;width:${width}px;height:${height}px;`;
  const svg = svgEl('svg', {width, height, style:'position:absolute;left:0;top:0;'});
  wrap.appendChild(svg); host.appendChild(wrap);
  buildTreeLayout(root, width, height);
  const { nodes, edges } = flattenTree(root);
  const boxMap = new Map();
  nodes.forEach(n => {
    const b = el('div', 'box', `<div style="text-align:center;line-height:1.4;"><div style="font-family:'JetBrains Mono',monospace;font-size:${n.big?15:13}px;">${n.label}</div></div>`);
    b.style.cssText += pos(n.px - boxW/2, n.py - boxH/2, boxW, boxH);
    b.style.opacity = '0';
    wrap.appendChild(b);
    boxMap.set(n, b);
  });
  const lineMap = new Map();
  edges.forEach(([p,c]) => {
    const line = svgEl('line', {x1:p.px, y1:p.py+boxH/2, x2:p.px, y2:p.py+boxH/2, stroke:'#3a3a52', 'stroke-width':1.5});
    svg.appendChild(line); lineMap.set(c, {line, p, c});
  });
  // reveal by depth
  const byDepth = {};
  nodes.forEach(n => { (byDepth[n.depth] = byDepth[n.depth]||[]).push(n); });
  for(let d=0; d<=Math.max(...nodes.map(n=>n.depth)); d++){
    for(const n of byDepth[d]){
      boxMap.get(n).style.transition = 'opacity .35s ease, transform .35s ease';
      boxMap.get(n).style.opacity = '1';
      if(lineMap.has(n)){
        const {line,p,c} = lineMap.get(n);
        line.setAttribute('x2', c.px); line.setAttribute('y2', c.py - boxH/2);
        line.style.transition = 'all .35s ease';
      }
    }
    await wait(380);
  }
  return { wrap, svg, boxMap };
}
function setBoxContent(boxMap, node, html, cls){
  const b = boxMap.get(node);
  b.innerHTML = `<div style="text-align:center;line-height:1.4;"><div style="font-family:'JetBrains Mono',monospace;font-size:13px;">${html}</div></div>`;
  if(cls) b.classList.add(cls);
}

/* ============ bars component ============ */
function makeBars(host, values, opts={}){
  host.innerHTML = '';
  const n = values.length;
  const gap = opts.gap ?? 12;
  const barW = opts.barW ?? 48;
  const areaW = n*barW + (n-1)*gap;
  const baseX = opts.x ?? 0;
  const baseY = opts.y ?? 0;
  const maxH = opts.maxH ?? 220;
  const maxV = Math.max(...values);
  const wrap = el('div'); wrap.style.cssText = `position:absolute;left:${baseX}px;top:${baseY}px;width:${areaW}px;height:${maxH+30}px;`;
  host.appendChild(wrap);
  const barsEls = values.map((v,i) => {
    const h = 30 + (v/maxV) * (maxH-30);
    const b = el('div','bar', v);
    b.style.left = (i*(barW+gap))+'px';
    b.style.width = barW+'px';
    b.style.height = h+'px';
    wrap.appendChild(b);
    return b;
  });
  return {
    wrap, barsEls, barW, gap, areaW,
    order: values.map((_,i)=>i), // current visual slot per original index tracked externally via API below
  };
}

/* ============ SLIDE DATA PREP ============ */
const mergeArr = [8,3,7,1,9,2,6,4];
const quickArr = [6,2,8,3,9,1,7];
const sortedArr = [2,5,8,12,16,23,38,45,56,72,91];
const searchTarget = 23;

function mergeSortSteps(arr){
  // returns tree of {label(range as string), children, values}
  function build(a){
    const node = { values:a.slice(), label:a.join(',') };
    if(a.length<=1) return node;
    const mid = Math.floor(a.length/2);
    node.children = [build(a.slice(0,mid)), build(a.slice(mid))];
    return node;
  }
  return build(arr);
}
function mergeTwo(a,b){
  const out=[]; let i=0,j=0;
  while(i<a.length && j<b.length){ if(a[i]<=b[j]) out.push(a[i++]); else out.push(b[j++]); }
  while(i<a.length) out.push(a[i++]);
  while(j<b.length) out.push(b[j++]);
  return out;
}

/* ============ SLIDES ============ */
const SLIDES = [];

/* ---- 1. Title ---- */
SLIDES.push({section:'Foundations', build(root){
  root.appendChild(el('div','kicker','DSA SERIES · ALGORITHM DESIGN PARADIGMS'));
  const t = el('div',null,'Divide &amp; Conquer');
  t.style.cssText = 'position:absolute;left:72px;top:220px;font-size:76px;font-weight:800;color:#fff;letter-spacing:-2px;opacity:0;animation:fadeUp .7s ease .1s forwards;';
  root.appendChild(t);
  const s = el('div',null,'Break the problem. Solve the pieces. Stitch the answer back together.');
  s.style.cssText = 'position:absolute;left:72px;top:320px;font-size:19px;color:var(--muted);max-width:760px;opacity:0;animation:fadeUp .7s ease .3s forwards;';
  root.appendChild(s);
  const tags = ['Merge Sort','Quick Sort','Binary Search','Closest Pair','Strassen','Fast Exponentiation','Karatsuba'];
  const row = el('div'); row.style.cssText='position:absolute;left:72px;top:400px;display:flex;gap:10px;flex-wrap:wrap;max-width:1000px;';
  tags.forEach((tg,i)=>{
    const c = el('div',null,tg);
    c.style.cssText = `padding:8px 16px;border:1px solid var(--line);border-radius:20px;font-size:13px;color:var(--light-purple);font-family:'JetBrains Mono',monospace;opacity:0;animation:popIn .4s ease ${0.5+i*0.08}s forwards;`;
    row.appendChild(c);
  });
  root.appendChild(row);
}});

/* ---- 2. Prerequisites ---- */
SLIDES.push({section:'Foundations', build(root){
  root.appendChild(el('div','kicker','BEFORE WE START'));
  root.appendChild(el('div','title','Prerequisites'));
  root.appendChild(el('div','subtitle','Three ideas this entire topic leans on. If these feel shaky, everything below will feel like magic instead of logic.'));
  const items = [
    ['Recursion','A function that calls a smaller version of itself, and trusts that smaller call to work — the "leap of faith".'],
    ['Big-O notation','A way to describe how running time grows as input size n grows: O(1), O(log n), O(n), O(n log n), O(n²)…'],
    ['Recurrence relations','An equation like T(n) = 2T(n/2) + n that defines running time in terms of itself on smaller inputs.'],
  ];
  const startY = 190;
  items.forEach((it,i)=>{
    const card = el('div','app-card', `<h4 style="color:var(--light-purple)">${i+1}. ${it[0]}</h4><p>${it[1]}</p>`);
    card.style.cssText += pos(72, startY + i*130, 1080, 108);
    card.style.animation = `fadeUp .45s ease ${0.15+i*0.15}s forwards`;
    root.appendChild(card);
  });
}});

/* ---- 3. Core concept ---- */
SLIDES.push({section:'Foundations', build(root, ctx){
  root.appendChild(el('div','kicker','THE CORE IDEA'));
  root.appendChild(el('div','title','One pattern, seven algorithms'));
  root.appendChild(el('div','subtitle','Every algorithm in this deck is the same three-step dance, just wearing different clothes.'));
  const stageW=1130, stageH=430;
  const host = el('div'); host.style.cssText = pos(72,190,stageW,stageH)+'position:absolute;';
  root.appendChild(host);
  const boxes = [
    {x:565,y:20,w:260,h:60,label:'Problem (size n)'},
    {x:280,y:170,w:230,h:60,label:'Subproblem (n/2)'},
    {x:850,y:170,w:230,h:60,label:'Subproblem (n/2)'},
    {x:150,y:320,w:180,h:55,label:'Base case'},
    {x:410,y:320,w:180,h:55,label:'Base case'},
    {x:740,y:320,w:180,h:55,label:'Base case'},
    {x:980,y:320,w:180,h:55,label:'Base case'},
  ];
  const svg = svgEl('svg',{width:stageW,height:stageH,style:'position:absolute;left:0;top:0;'});
  host.appendChild(svg);
  const divideLabel = el('div','arrow-label','DIVIDE'); divideLabel.style.cssText+=pos(600,95); divideLabel.style.opacity=0;
  const combineLabel = el('div','arrow-label','COMBINE'); combineLabel.style.cssText+=pos(590,255); combineLabel.style.color='var(--pink)'; combineLabel.style.opacity=0;
  host.appendChild(divideLabel); host.appendChild(combineLabel);
  const boxEls = boxes.map(b=>{
    const d = el('div','box', b.label);
    d.style.cssText += pos(b.x,b.y,b.w,b.h); d.style.opacity=0;
    host.appendChild(d); return d;
  });
  const edges = [[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]];
  const lines = edges.map(([p,c])=>{
    const pb=boxes[p], cb=boxes[c];
    const line = svgEl('line',{x1:pb.x+pb.w/2,y1:pb.y+pb.h,x2:pb.x+pb.w/2,y2:pb.y+pb.h,stroke:'#3a3a52','stroke-width':1.5});
    svg.appendChild(line); return {line,pb,cb};
  });
  (async()=>{
    boxEls[0].style.transition='opacity .4s'; boxEls[0].style.opacity=1;
    await wait(500);
    divideLabel.style.transition='opacity .3s'; divideLabel.style.opacity=1;
    for(let i=1;i<=2;i++){ boxEls[i].style.transition='opacity .35s'; boxEls[i].style.opacity=1;
      const e = lines[i-1]; e.line.style.transition='all .35s'; e.line.setAttribute('x2',e.cb.x+e.cb.w/2); e.line.setAttribute('y2',e.cb.y);
      await wait(250);
    }
    await wait(300);
    for(let i=3;i<=6;i++){ boxEls[i].style.transition='opacity .35s'; boxEls[i].style.opacity=1;
      const e = lines[i-1]; e.line.style.transition='all .35s'; e.line.setAttribute('x2',e.cb.x+e.cb.w/2); e.line.setAttribute('y2',e.cb.y);
      await wait(180);
    }
    await wait(500);
    combineLabel.style.transition='opacity .3s'; combineLabel.style.opacity=1;
    boxEls.forEach(b=>{ b.style.transition='border-color .4s, box-shadow .4s'; b.classList.add('done'); });
  })();
}});

/* ---- 4. Master theorem ---- */
SLIDES.push({section:'Foundations', build(root){
  root.appendChild(el('div','kicker','THE FORMULA THAT RUNS THIS WHOLE TOPIC'));
  root.appendChild(el('div','title','The Master Theorem'));
  root.appendChild(el('div','subtitle','Solves recurrences of the shape T(n) = a·T(n/b) + f(n) without unrolling them by hand.'));
  const fb = el('div','formula-box','T(n) = a&middot;T(n/b) + f(n)<div class="small">a = subproblems created &nbsp;·&nbsp; n/b = size of each &nbsp;·&nbsp; f(n) = work to divide + combine</div>');
  fb.style.cssText += pos(280,185,720,100); fb.style.opacity=0; fb.style.animation='popIn .5s ease .1s forwards';
  root.appendChild(fb);
  const cases = [
    ['Case 1','f(n) grows slower than n^(log_b a)','T(n) = &Theta;(n^log_b a)','Binary Search: a=1,b=2 → &Theta;(log n)'],
    ['Case 2','f(n) grows at the same rate','T(n) = &Theta;(n^log_b a &middot; log n)','Merge Sort: a=2,b=2,f(n)=n → &Theta;(n log n)'],

/* ================= QUICK SORT ================= */
function quickSortFrames(arr){
  const frames = [];
  const a = arr.slice();
  function partition(lo,hi){
    const pivot = a[hi];
    let i = lo-1;
    frames.push({type:'pivot', arr:a.slice(), lo, hi, pivotIdx:hi});
    for(let j=lo;j<hi;j++){
      frames.push({type:'compare', arr:a.slice(), lo, hi, i, j, pivotIdx:hi});
      if(a[j] < pivot){
        i++;
        [a[i],a[j]] = [a[j],a[i]];
        frames.push({type:'swap', arr:a.slice(), lo, hi, i, j, pivotIdx:hi});
      }
    }
    [a[i+1],a[hi]] = [a[hi],a[i+1]];
    frames.push({type:'place', arr:a.slice(), lo, hi, pivotFinal:i+1});
    return i+1;
  }
  function qs(lo,hi){
    if(lo>=hi){ if(lo===hi) frames.push({type:'done1', arr:a.slice(), idx:lo}); return; }
    const p = partition(lo,hi);
    qs(lo,p-1); qs(p+1,hi);
  }
  qs(0,a.length-1);
  frames.push({type:'final', arr:a.slice()});
  return frames;
}

/* ================= CLOSEST PAIR ================= */
const closestPts = [[70,180],[160,60],[230,210],[300,40],[350,150],[420,230],[480,70],[560,190],[610,110],[670,20]];
function dist(a,b){ return Math.hypot(a[0]-b[0], a[1]-b[1]); }
function bruteClosest(pts){
  let best=Infinity, pair=null;
  for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
    const d = dist(pts[i],pts[j]); if(d<best){ best=d; pair=[pts[i],pts[j]]; }
  }
  return {best, pair};
}

  root.appendChild(c);
  (async()=>{
    l1.style.transition='opacity .4s'; l1.style.opacity=1; await wait(150);
    t1.style.transition='opacity .5s'; t1.style.opacity=1; await wait(700);
    l2.style.transition='opacity .4s'; l2.style.opacity=1; await wait(150);
    t2.style.transition='opacity .5s'; t2.style.opacity=1; await wait(900);
    fill.style.transition='opacity .5s'; fill.style.opacity=1;
  })();
}});

/* ============ ENGINE ============ */
let cur = 0;
const total = SLIDES.length;
const slideContent = document.getElementById('slideContent');
const progressBar = document.getElementById('progressBar');
const slideCounter = document.getElementById('slideCounter');
const sectionLabel = document.getElementById('sectionLabel');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function render(i){
  slideContent.innerHTML = '';
  const s = SLIDES[i];
  s.build(slideContent, {reduced: REDUCED});
  progressBar.style.width = ((i+1)/total*100)+'%';
  slideCounter.textContent = `${i+1} / ${total}`;
  sectionLabel.textContent = (s.section||'').toUpperCase();
  prevBtn.classList.toggle('disabled', i===0);
  nextBtn.classList.toggle('disabled', i===total-1);
}
function go(delta){
  const n = cur + delta;
  if(n<0 || n>=total) return;
  cur = n;
  render(cur);
}
prevBtn.addEventListener('click', ()=>go(-1));
nextBtn.addEventListener('click', ()=>go(1));
document.addEventListener('keydown', (e)=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); go(1); }
  else if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(-1); }
  else if(e.key==='Home'){ cur=0; render(cur); }
  else if(e.key==='End'){ cur=total-1; render(cur); }
});
let touchX=null;
document.addEventListener('touchstart', e=>{ touchX = e.touches[0].clientX; });
document.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(dx < -50) go(1); else if(dx > 50) go(-1);
  touchX = null;
});

/* scale-to-fit 16:9 */
const stage = document.getElementById('stage');
function fitStage(){
  const vw = window.innerWidth, vh = window.innerHeight - 60; // leave room for chrome
  const scale = Math.min(vw/1280, vh/720);
  stage.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitStage);
fitStage();

render(0);
</script>
