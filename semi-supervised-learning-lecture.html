<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semi-Supervised Learning — A Visual Lecture</title>
<style>
  :root{
    --bg:#0a0b0d;
    --bg2:#0e1012;
    --panel:#131417;
    --panel-edge:#232529;
    --ink:#e6e2d9;
    --dim:#8b8f92;
    --dim2:#5c6064;
    --blue:#6c93b0;
    --blue-soft:#3d5266;
    --ochre:#c99f5c;
    --ochre-soft:#6b5636;
    --rose:#b3706a;
    --sage:#7a9b83;
    --line:#24262b;
    --serif: Palatino Linotype, Book Antiqua, Georgia, "Times New Roman", serif;
    --sans: "Segoe UI", Helvetica Neue, Arial, sans-serif;
    --mono: SFMono-Regular, Consolas, "Courier New", monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:radial-gradient(ellipse at 50% -10%, #131519 0%, var(--bg) 55%, #060708 100%);
    color:var(--ink);
    font-family:var(--sans);
    overflow:hidden;
  }
  #app{
    height:100vh; width:100vw;
    display:flex; flex-direction:column;
    align-items:center;
    padding:18px 18px 14px;
  }
  .topbar{
    width:100%; max-width:1080px;
    display:flex; align-items:baseline; justify-content:space-between;
    padding:2px 6px 10px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .brand{
    font-family:var(--serif);
    font-size:15px;
    letter-spacing:0.08em;
    color:var(--dim);
    text-transform:uppercase;
  }
  .brand b{color:var(--ink); font-weight:600;}
  .progress-track{
    display:flex; gap:6px; align-items:center;
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--panel-edge);
    border:1px solid var(--line);
    cursor:pointer;
    transition:background .25s, transform .25s, border-color .25s;
  }
  .dot:hover{border-color:var(--dim);}
  .dot.active{background:var(--ochre); border-color:var(--ochre); transform:scale(1.3);}
  .dot.done{background:var(--dim2);}

  .stage-wrap{
    width:100%; max-width:1080px; flex:1;
    display:flex; flex-direction:column;
    min-height:0;
    padding-top:10px;
  }
  .head{
    flex-shrink:0;
    min-height:64px;
    padding:2px 4px 8px;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    color:var(--ochre);
    text-transform:uppercase;
    opacity:.85;
    margin-bottom:4px;
    height:14px;
  }
  h2.slide-title{
    font-family:var(--serif);
    font-weight:600;
    font-size:28px;
    margin:0 0 4px 0;
    color:var(--ink);
    letter-spacing:.01em;
  }
  p.slide-sub{
    font-family:var(--sans);
    font-size:14.5px;
    color:var(--dim);
    margin:0;
    max-width:800px;
    line-height:1.5;
  }
  .frame{
    flex:1;
    min-height:0;
    position:relative;
    border:1px solid var(--line);
    border-radius:6px;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0/100% 40px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/40px 100%,
      var(--bg2);
    background-blend-mode:overlay, overlay, normal;
    opacity:1;
    overflow:hidden;
  }
  .frame::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 40%, rgba(255,255,255,0.025) 0%, transparent 65%);
    pointer-events:none;
  }
  svg#scene{
    width:100%; height:100%;
    display:block;
  }
  .formula-bar{
    flex-shrink:0;
    min-height:44px;
    margin-top:10px;
    padding:9px 16px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--panel);
    font-family:var(--mono);
    font-size:14px;
    color:var(--blue);
    display:flex;
    align-items:center;
    gap:10px;
    visibility:hidden;
  }
  .formula-bar.show{visibility:visible;}
  .formula-bar .tag{
    font-family:var(--sans);
    font-size:10px;
    letter-spacing:.08em;
    color:var(--dim2);
    text-transform:uppercase;
    border:1px solid var(--line);
    border-radius:3px;
    padding:2px 6px;
    flex-shrink:0;
  }
  .formula-bar .ftext sub, .formula-bar .ftext sup{font-size:70%;}

  .controls{
    width:100%; max-width:1080px;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 4px 2px;
  }
  .navbtn{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    color:var(--ink);
    font-family:var(--sans);
    font-size:13px;
    letter-spacing:.03em;
    padding:9px 18px;
    border-radius:5px;
    cursor:pointer;
    display:flex; align-items:center; gap:8px;
    transition:border-color .2s, background .2s, transform .1s;
  }
  .navbtn:hover{border-color:var(--ochre); background:#16181b;}
  .navbtn:active{transform:translateY(1px);}
  .navbtn:disabled{opacity:.3; cursor:default; pointer-events:none;}
  .navbtn .arrow{font-size:15px; line-height:1;}
  .counter{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--dim);
    letter-spacing:.05em;
  }
  .counter b{color:var(--ink); font-weight:600;}
  .hint{
    font-family:var(--sans);
    font-size:11px;
    color:var(--dim2);
    text-align:center;
    flex:1;
  }

  /* SVG text defaults via classes (attrs also set inline for portability) */
  .lbl{font-family:var(--sans);}
  .lbl-serif{font-family:var(--serif);}
  .lbl-mono{font-family:var(--mono);}
  .flow{ animation: flowmove 1s linear infinite; }
  @keyframes flowmove{ to{ stroke-dashoffset:-20; } }
  @media (prefers-reduced-motion: reduce){ .flow{animation:none;} }

  @media (max-width:720px){
    h2.slide-title{font-size:21px;}
    p.slide-sub{font-size:12.5px;}
    .navbtn{padding:8px 12px; font-size:12px;}
    .hint{display:none;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><b>Semi-Supervised Learning</b> &nbsp;·&nbsp; a visual lecture</div>
    <div class="progress-track" id="dots"></div>
  </div>

  <div class="stage-wrap">
    <div class="head">
      <div class="eyebrow" id="eyebrow"></div>
      <h2 class="slide-title" id="slideTitle"></h2>
      <p class="slide-sub" id="slideSub"></p>
    </div>
    <div class="frame">
      <svg id="scene" viewBox="0 0 960 520" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="formula-bar" id="formulaBar">
      <span class="tag">math</span>
      <span class="ftext" id="formulaText"></span>
    </div>
  </div>

  <div class="controls">
    <button class="navbtn" id="prevBtn"><span class="arrow">‹</span> Back</button>
    <div class="hint" id="hint">Use ← → or Space to move through the lecture</div>
    <div class="counter" id="counter"></div>
    <button class="navbtn" id="nextBtn">Next <span class="arrow">›</span></button>
  </div>
</div>

<script>
/* ============================= ENGINE ============================= */
const NS = "http://www.w3.org/2000/svg";
const COL = {
  bg:"#0a0b0d", ink:"#e6e2d9", dim:"#8b8f92", dim2:"#5c6064",
  blue:"#6c93b0", blueSoft:"#3d5266", blueDim:"#3a4a56",
  ochre:"#c99f5c", ochreSoft:"#6b5636", ochreDim:"#5a4a32",
  rose:"#b3706a", roseSoft:"#5c3f3c",
  sage:"#7a9b83", sageSoft:"#3f4f45",
  gray:"#565a5f", grayLight:"#7d8186",
  line:"#2a2d31", panel:"#131417", panelEdge:"#232529"
};

function svgEl(tag, attrs){
  const e = document.createElementNS(NS, tag);
  if(attrs) for(const k in attrs) if(attrs[k]!==undefined) e.setAttribute(k, attrs[k]);
  return e;
}
function G(attrs){return svgEl("g",attrs);}
function C(cx,cy,r,fill,extra){return svgEl("circle",Object.assign({cx,cy,r,fill},extra||{}));}
function L(x1,y1,x2,y2,stroke,extra){return svgEl("line",Object.assign({x1,y1,x2,y2,stroke,"stroke-width":(extra&&extra.sw)||2},extra||{}));}
function P(d,attrs){return svgEl("path",Object.assign({d,fill:"none"},attrs||{}));}
function R(x,y,w,h,attrs){return svgEl("rect",Object.assign({x,y,width:w,height:h},attrs||{}));}
function T(x,y,str,attrs){
  const t = svgEl("text",Object.assign({x,y,fill:COL.ink,"font-family":"Segoe UI, Arial, sans-serif","font-size":15,"class":"lbl"},attrs||{}));
  t.textContent = str;
  return t;
}
function TSpans(x,y,lines,attrs){
  const t = svgEl("text",Object.assign({x,y,fill:COL.ink,"font-family":"Segoe UI, Arial, sans-serif","font-size":15,"class":"lbl"},attrs||{}));
  lines.forEach((ln,i)=>{
    const ts = svgEl("tspan",{x, dy: i===0?0:18});
    ts.textContent = ln;
    t.appendChild(ts);
  });
  return t;
}

function easeInOutCubic(t){return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;}
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function easeOutBack(t){const c1=1.4,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
function easeLinear(t){return t;}
function lerp(a,b,t){return a+(b-a)*t;}

function raf(cb){return requestAnimationFrame(cb);}
function wait(ms, token, getToken){
  return new Promise(res=>{
    setTimeout(()=>res(), ms);
  });
}
function tween(duration, onUpdate, easing){
  easing = easing || easeInOutCubic;
  return new Promise(resolve=>{
    const t0 = performance.now();
    function step(now){
      let p = Math.min(1, (now-t0)/duration);
      onUpdate(easing(p), p);
      if(p<1) raf(step); else resolve();
    }
    raf(step);
  });
}
function hexToRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(x=>{x=Math.max(0,Math.min(255,Math.round(x)));return x.toString(16).padStart(2,'0');}).join('');}
function blendHex(h1,h2,t){const a=hexToRgb(h1),b=hexToRgb(h2);return rgbToHex(lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t));}

/* fade helper */
function setOpacity(el,v){el.setAttribute("opacity",v);}
async function fadeIn(el, duration){
  el.setAttribute("opacity",0);
  await tween(duration||500,(e)=>setOpacity(el,e), easeOutCubic);
}
async function fadeOut(el, duration){
  await tween(duration||400,(e)=>setOpacity(el,1-e), easeOutCubic);
}
async function popIn(el, duration, scaleAttrCx, scaleAttrCy){
  // for circles: animate r from 0 to target
  const targetR = parseFloat(el.getAttribute("r"));
  el.setAttribute("r",0);
  el.setAttribute("opacity",0);
  await tween(duration||450,(e)=>{
    el.setAttribute("r", Math.max(0, targetR*e));
    el.setAttribute("opacity", Math.min(1,Math.max(0,e*1.4)));
  }, easeOutBack);
  el.setAttribute("r", targetR);
  el.setAttribute("opacity", 1);
}
function pathLength(pathEl){
  try{return pathEl.getTotalLength();}catch(e){return 500;}
}
async function drawPath(pathEl, duration){
  const len = pathLength(pathEl);
  pathEl.setAttribute("stroke-dasharray", len);
  pathEl.setAttribute("stroke-dashoffset", len);
  pathEl.setAttribute("opacity",1);
  await tween(duration||900,(e)=>{
    pathEl.setAttribute("stroke-dashoffset", len*(1-e));
  }, easeInOutCubic);
}
async function moveEl(el, x1,y1,x2,y2, duration, easing){
  await tween(duration||700,(e)=>{
    el.setAttribute("cx", lerp(x1,x2,e));
    el.setAttribute("cy", lerp(y1,y2,e));
  }, easing||easeInOutCubic);
}
async function moveAlongPath(el, pathD, duration, sizeAttr){
  const tmp = svgEl("path",{d:pathD});
  const len = tmp.getTotalLength();
  await tween(duration||900,(e)=>{
    const pt = tmp.getPointAtLength(len*e);
    el.setAttribute("cx", pt.x);
    el.setAttribute("cy", pt.y);
  }, easeInOutCubic);
}
async function colorTo(el, fromColor, toColor, duration){
  await tween(duration||600,(e)=>{
    el.setAttribute("fill", blendHex(fromColor,toColor,e));
  }, easeInOutCubic);
}
function arrowMarker(defs, id, color){
  const marker = svgEl("marker",{id, markerWidth:8, markerHeight:8, refX:6, refY:3, orient:"auto", markerUnits:"strokeWidth"});
  const p = svgEl("path",{d:"M0,0 L0,6 L7,3 z", fill:color});
  marker.appendChild(p);
  defs.appendChild(marker);
  return `url(#${id})`;
}

/* ---------- shared composite drawing helpers ---------- */
function makeArrow(svg, x1,y1,x2,y2, color, arrowUrl, extra){
  const p = P(`M${x1},${y1} L${x2},${y2}`, Object.assign({stroke:color,"stroke-width":1.6,"marker-end":arrowUrl,opacity:0},extra||{}));
  svg.appendChild(p);
  return p;
}
function makeCurveArrow(svg, d, color, arrowUrl, extra){
  const p = P(d, Object.assign({stroke:color,"stroke-width":1.6,"marker-end":arrowUrl,opacity:0},extra||{}));
  svg.appendChild(p);
  return p;
}
function box(svg, x,y,w,h, label, sub, colorEdge, attrs){
  const g = G({opacity:0});
  const r = R(x,y,w,h,Object.assign({rx:6,fill:COL.panel,stroke:colorEdge||COL.panelEdge,"stroke-width":1.3},attrs||{}));
  g.appendChild(r);
  const subLines = sub ? sub.split("\n") : [];
  const labelY = subLines.length ? y+h/2-4-(subLines.length>1?8:0) : y+h/2+5;
  if(label){
    const t = T(x+w/2,labelY, label, {"text-anchor":"middle","font-size":14.5, fill:COL.ink, "font-family":"Palatino Linotype, Georgia, serif"});
    g.appendChild(t);
  }
  if(subLines.length){
    const ts = TSpans(x+w/2, labelY+18, subLines, {"text-anchor":"middle","font-size":10.5, fill:COL.dim});
    g.appendChild(ts);
  }
  svg.appendChild(g);
  return g;
}
function miniBars(svg, x, y, w, h, values, colors, labels){
  // values: array 0..1 ; returns {group, rects} bottom-anchored bars in area (x,y,w,h)
  const g = G({});
  const n = values.length;
  const gap = 10;
  const bw = (w - gap*(n-1))/n;
  const rects = [];
  for(let i=0;i<n;i++){
    const bx = x + i*(bw+gap);
    const bh = Math.max(1, h*values[i]);
    const rct = R(bx, y+h-bh, bw, bh, {rx:2, fill:colors[i]||COL.blue, opacity:0.92});
    g.appendChild(rct);
    rects.push(rct);
    if(labels && labels[i]){
      g.appendChild(T(bx+bw/2, y+h+16, labels[i], {"text-anchor":"middle","font-size":10.5, fill:COL.dim}));
    }
  }
  const base = L(x-4, y+h, x+w+4, y+h, COL.line, {sw:1});
  g.insertBefore(base, g.firstChild);
  svg.appendChild(g);
  return {g, rects, x, y, w, h};
}
async function setBars(barsObj, values, duration){
  const {rects, y, h} = barsObj;
  const starts = rects.map(r=>parseFloat(r.getAttribute("height")));
  const startY = rects.map(r=>parseFloat(r.getAttribute("y")));
  await tween(duration||700, (e)=>{
    rects.forEach((r,i)=>{
      const targetH = Math.max(1, h*values[i]);
      const hh = lerp(starts[i], targetH, e);
      r.setAttribute("height", hh);
      r.setAttribute("y", y+h-hh);
    });
  }, easeInOutCubic);
}
function smallNode(svg, x,y, r, fill, extra){
  return C(x,y,r,fill,Object.assign({stroke:"#000","stroke-opacity":0.25,"stroke-width":1},extra||{}));
}
async function pulseLoop(el, tok, rBase, rDelta, duration, cycles){
  for(let i=0;i<cycles;i++){
    if(!isCurrent(tok)) return;
    await tween(duration, (e)=>{ el.setAttribute("r", rBase + rDelta*Math.sin(e*Math.PI)); }, easeInOutCubic);
  }
  if(isCurrent(tok)) el.setAttribute("r", rBase);
}
function flowPath(svg, d, color, extra){
  const p = P(d, Object.assign({stroke:color,"stroke-width":1.6,"stroke-dasharray":"3 7", "class":"flow", opacity:0},extra||{}));
  svg.appendChild(p);
  return p;
}
async function countUp(el, from, to, duration, suffix){
  await tween(duration, (e)=>{
    const v = Math.round(lerp(from,to,e));
    el.textContent = v + (suffix||"");
  }, easeOutCubic);
}
async function countUpFloat(el, from, to, duration, digits, prefix){
  await tween(duration, (e)=>{
    const v = lerp(from,to,e);
    el.textContent = (prefix||"") + v.toFixed(digits===undefined?2:digits);
  }, easeInOutCubic);
}
function bulletList(svg, x, y, lines, color, lineHeight, fontSize){
  const g = G({opacity:0});
  lines.forEach((ln,i)=>{
    const ty = y + i*(lineHeight||22);
    g.appendChild(C(x,ty-4,2.6,color||COL.sage,{}));
    g.appendChild(T(x+14,ty,ln,{"font-size":fontSize||12.5, fill:COL.ink}));
  });
  svg.appendChild(g);
  return g;
}
function entropyOf(p){
  // Shannon entropy in bits for a probability distribution array
  return -p.reduce((s,pi)=> pi>0 ? s+pi*Math.log2(pi) : s, 0);
}

/* ============================= SLIDE CONTROLLER ============================= */
let RUN_TOKEN = 0;
function isCurrent(tok){ return tok===RUN_TOKEN; }
async function guard(tok, promiseOrMs){
  if(typeof promiseOrMs === "number") await new Promise(r=>setTimeout(r,promiseOrMs));
  else await promiseOrMs;
  return isCurrent(tok);
}

const svg = document.getElementById("scene");
let defs;
function resetSceneDefs(){
  defs = svgEl("defs",{});
  svg.appendChild(defs);
  return {
    arrBlue: arrowMarker(defs,"arrBlue",COL.blue),
    arrOchre: arrowMarker(defs,"arrOchre",COL.ochre),
    arrDim: arrowMarker(defs,"arrDim",COL.dim),
    arrRose: arrowMarker(defs,"arrRose",COL.rose),
    arrSage: arrowMarker(defs,"arrSage",COL.sage),
    arrInk: arrowMarker(defs,"arrInk",COL.ink),
  };
}

/* ---------------- SLIDE 1 : TITLE ---------------- */
async function slide01(svg, tok){
  const A = resetSceneDefs();
  const cx=480, cy=250;
  // scattered field of quiet unlabeled dots drifting in from edges
  const pts = [];
  const rand = mulberry32(7);
  for(let i=0;i<38;i++){
    const ang = rand()*Math.PI*2;
    const rad = 210+rand()*220;
    const x = cx + Math.cos(ang)*rad*1.6;
    const y = cy + Math.sin(ang)*rad*0.62;
    pts.push({x,y});
  }
  const dots = pts.map(p=>{
    const c = C(p.x,p.y, 2.4, COL.gray, {opacity:0});
    svg.appendChild(c);
    return c;
  });
  dots.forEach((d,i)=>fadeIn(d, 900));
  if(!await guard(tok,300)) return;

  const title1 = T(cx,222,"Semi-Supervised Learning", {"text-anchor":"middle","font-size":34,"font-family":"Palatino Linotype, Georgia, serif", "font-weight":600, fill:COL.ink, opacity:0});
  svg.appendChild(title1);
  await fadeIn(title1, 900);
  if(!isCurrent(tok)) return;

  const sub = T(cx,258,"What can we learn from the answers we don't have?", {"text-anchor":"middle","font-size":15, fill:COL.dim, opacity:0});
  svg.appendChild(sub);
  await fadeIn(sub, 800);
  if(!isCurrent(tok)) return;

  await guard(tok,300);
  // two small labeled seeds glow gently near the title to foreshadow the theme
  const b = C(cx-150,320,5,COL.blue,{opacity:0});
  const o = C(cx+150,320,5,COL.ochre,{opacity:0});
  svg.appendChild(b); svg.appendChild(o);
  await Promise.all([popIn(b,600), popIn(o,600)]);
  if(!isCurrent(tok)) return;
  const capt = T(cx,360,"a handful of labels  ·  an ocean of unlabeled data", {"text-anchor":"middle","font-size":12.5, fill:COL.dim2, "font-family":"SFMono-Regular, Consolas, monospace", opacity:0});
  svg.appendChild(capt);
  await fadeIn(capt,700);
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

/* ---------------- SLIDE 2 : THE SETUP ---------------- */
async function slide02(svg, tok){
  const A = resetSceneDefs();
  // Left panel: labeled (few)
  const Lx=90, Ly=90, Lw=330, Lh=300;
  const Rx=540, Ry=90, Rw=330, Rh=300;
  const capL = T(Lx+Lw/2, Ly-24, "a few labeled examples", {"text-anchor":"middle","font-size":13, fill:COL.dim, opacity:0});
  const capR = T(Rx+Rw/2, Ry-24, "a lot of unlabeled examples", {"text-anchor":"middle","font-size":13, fill:COL.dim, opacity:0});
  svg.appendChild(capL); svg.appendChild(capR);
  const fL = R(Lx,Ly,Lw,Lh,{fill:"none",stroke:COL.line,"stroke-width":1,rx:8});
  const fR = R(Rx,Ry,Rw,Rh,{fill:"none",stroke:COL.line,"stroke-width":1,rx:8});
  svg.appendChild(fL); svg.appendChild(fR);
  await Promise.all([fadeIn(capL,600), fadeIn(capR,600)]);
  if(!isCurrent(tok)) return;

  const labeled = [
    {x:180,y:160,c:COL.blue},{x:230,y:220,c:COL.blue},{x:170,y:290,c:COL.blue},

  {x:235,y:245,c:COL.gray,   labeled:false},

  {x:770,y:160,c:COL.ochre,  labeled:true},
  {x:830,y:255,c:COL.gray,   labeled:false},
  {x:745,y:325,c:COL.gray,   labeled:false},
];
const GRAPH_EDGES = [[0,1],[0,2],[1,2],[2,3],[0,3],[3,4],[4,5],[5,6],[6,7],[7,8],[7,9],[8,9]];
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function buildAdj(nodes, edges){
  const adj = nodes.map(()=>[]);
  edges.forEach(([i,j])=>{
    const w = 1/(1+dist(nodes[i],nodes[j])/150);
    adj[i].push({j, w}); adj[j].push({j:i, w});
  });
  return adj;
}
function drawGraphBase(svg, nodes, edges){
  const edgeEls = edges.map(([i,j])=>{
    const w = 1/(1+dist(nodes[i],nodes[j])/150);
    const ln = L(nodes[i].x,nodes[i].y,nodes[j].x,nodes[j].y, COL.line, {sw:1+2.4*w, opacity:0});
    svg.appendChild(ln);
    return ln;
  });
  return edgeEls;
}
async function slide06(svg, tok){

  svg.appendChild(wLbl);

  await Promise.all(edgeEls.map((e,i)=>fadeIn(e,600)));
  if(!isCurrent(tok)) return;

  const nodeEls = nodes.map((n,i)=>{
    const r = n.labeled?9:5;
    const c = C(n.x,n.y,r,n.c,{opacity:0});
    svg.appendChild(c);
    return c;
  });
  for(const el of nodeEls){ popIn(el,350); await guard(tok,60); }
  if(!isCurrent(tok)) return;

  const lockRing0 = C(nodes[0].x,nodes[0].y,15,"none",{stroke:COL.blue,"stroke-width":1.3,"stroke-dasharray":"2 3", opacity:0});
  const lockRing7 = C(nodes[7].x,nodes[7].y,15,"none",{stroke:COL.ochre,"stroke-width":1.3,"stroke-dasharray":"2 3", opacity:0});
  svg.appendChild(lockRing0); svg.appendChild(lockRing7);
  await Promise.all([fadeIn(lockRing0,400), fadeIn(lockRing7,400)]);
  pulseLoop(lockRing0, tok, 15, 3, 900, 40);

  svg.appendChild(lockLbl);
  await fadeIn(lockLbl,500);
  if(!isCurrent(tok)) return;

  await guard(tok,400);
  const iterLbl = T(870,50,"", {"text-anchor":"end","font-size":13, fill:COL.sage, opacity:1, "font-family":"SFMono-Regular, Consolas, monospace"});
  svg.appendChild(iterLbl);

  let colors = nodes.map(n=>n.c);

      let rs=0,gs=0,bs=0,tw=0;

/* ============================= CONTROLLER ============================= */
let current = 0;
let lastNavAt = 0;
const dotsWrap = document.getElementById("dots");
SLIDES.forEach((s,i)=>{
  const d = document.createElement("div");
  d.className = "dot";
  d.title = s.title;
  d.addEventListener("click", ()=>goTo(i));
  dotsWrap.appendChild(d);
});
function renderDots(){
  [...dotsWrap.children].forEach((d,i)=>{
    d.classList.toggle("active", i===current);
    d.classList.toggle("done", i<current);
  });
}
function renderChrome(){
  const s = SLIDES[current];
  const num = String(current+1).padStart(2,'0');
  document.getElementById("eyebrow").textContent = `${num} · ${s.cat}`;
  document.getElementById("slideTitle").textContent = s.title;
  document.getElementById("slideSub").textContent = s.sub;
  const fb = document.getElementById("formulaBar");
  const ft = document.getElementById("formulaText");
  if(s.formula){
    fb.classList.add("show");
    ft.textContent = s.formula;
  } else {
    fb.classList.remove("show");
    ft.textContent = "";
  }
  document.getElementById("counter").innerHTML = `<b>${current+1}</b> / ${SLIDES.length}`;
  document.getElementById("prevBtn").disabled = current===0;
  document.getElementById("nextBtn").innerHTML = current===SLIDES.length-1 ? "Restart <span class=\"arrow\">↺</span>" : "Next <span class=\"arrow\">›</span>";
  renderDots();
}
function goTo(i){
  if(i<0 || i>=SLIDES.length) return;
  const now = performance.now();
  if(now - lastNavAt < 260) return; // debounce: let a slide's own clear finish before another swap
  lastNavAt = now;
  current = i;
  RUN_TOKEN++;
  const tok = RUN_TOKEN;
  svg.innerHTML = "";
  renderChrome();
  SLIDES[current].build(svg, tok);
}
document.getElementById("prevBtn").addEventListener("click", ()=>goTo(current-1));
document.getElementById("nextBtn").addEventListener("click", ()=>{
  if(current===SLIDES.length-1) goTo(0); else goTo(current+1);
});
window.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight" || e.key===" "){ e.preventDefault(); if(current<SLIDES.length-1) goTo(current+1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); goTo(current-1); }
});
goTo(0);
</script>
