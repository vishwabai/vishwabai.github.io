<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NumPy — Interactive Learning Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<style>
  :root {
    --bg:       #0d0f14;
    --surface:  #13161e;
    --panel:    #1a1e2a;
    --border:   #252a38;
    --accent:   #4f8ef7;
    --accent2:  #7c3aed;
    --green:    #22c55e;
    --amber:    #f59e0b;
    --red:      #ef4444;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --dim:      #94a3b8;
    --mono:     'JetBrains Mono', monospace;
    --sans:     'Inter', sans-serif;
    --display:  'Syne', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── LAYOUT ── */
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* SIDEBAR */
  .sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-logo {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }

  .logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #4f8ef722, #7c3aed22);
    border: 1px solid #4f8ef744;
    border-radius: 8px;
    padding: 6px 12px;
    margin-bottom: 10px;
  }

  .logo-badge .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .logo-badge span {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.08em;
  }

  .logo-title {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #e2e8f0, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.02em;
  }

  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
  }

  .sidebar-nav::-webkit-scrollbar { width: 4px; }
  .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
  .sidebar-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .nav-section-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    padding: 8px 10px 4px;
    margin-top: 4px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--dim);
    font-size: 12.5px;
    font-weight: 400;
    border: 1px solid transparent;
    margin-bottom: 1px;
  }

  .nav-item:hover { background: var(--panel); color: var(--text); }

  .nav-item.active {
    background: linear-gradient(135deg, #4f8ef715, #7c3aed15);
    border-color: #4f8ef733;
    color: #a5c8ff;
    font-weight: 500;
  }

  .nav-item .nav-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }

  .nav-item .nav-level {
    margin-left: auto;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .level-basic  { background: #22c55e22; color: #4ade80; }
  .level-mid    { background: #f59e0b22; color: #fbbf24; }
  .level-adv    { background: #ef444422; color: #f87171; }

  /* MAIN */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  /* TOP BAR */
  .topbar {
    height: 52px;
    min-height: 52px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    background: var(--surface);
  }

  .topbar-title {
    font-family: var(--display);
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    flex: 1;
  }

  .topbar-breadcrumb {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    transition: all 0.2s;
    white-space: nowrap;
  }

  .status-pill.ready { border-color: #22c55e44; color: #4ade80; background: #22c55e11; }
  .status-pill.loading { border-color: #f59e0b44; color: #fbbf24; background: #f59e0b11; }
  .status-pill .sd { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* CONTENT AREA */
  .content-area {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .lesson-view {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
  }

  .lesson-view::-webkit-scrollbar { width: 6px; }
  .lesson-view::-webkit-scrollbar-track { background: transparent; }
  .lesson-view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* LESSON CONTENT */
  .lesson-header {
    margin-bottom: 24px;
  }

  .lesson-eyebrow {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    font-family: var(--mono);
  }

  .lesson-title {
    font-family: var(--display);
    font-size: 28px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.15;
    margin-bottom: 10px;
  }

  .lesson-desc {
    font-size: 14px;
    color: var(--dim);
    max-width: 720px;
    line-height: 1.7;
  }

  .concept-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin: 20px 0;
  }

  .concept-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .concept-card h4 {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 4px;
    font-family: var(--mono);
  }

  .concept-card p {
    font-size: 12px;
    color: var(--dim);
    line-height: 1.5;
  }

  /* CODE BLOCK */
  .code-block {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin: 16px 0;
    position: relative;
  }

  .code-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: #1e2330;
    border-bottom: 1px solid var(--border);
  }

  .code-block-header .file-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .file-label .py-dot { color: #3b82f6; font-size: 14px; }

  .btn-run {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    transition: all 0.15s;
    font-family: var(--sans);
    letter-spacing: 0.02em;
  }

  .btn-run:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-run:active { transform: translateY(0); }
  .btn-run:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-run .run-icon { font-size: 10px; }

  .code-editor {
    width: 100%;
    padding: 16px 18px;
    background: transparent;
    border: none;
    outline: none;
    font-family: var(--mono);
    font-size: 13px;
    color: #c9d1d9;
    resize: vertical;
    min-height: 120px;
    line-height: 1.65;
    tab-size: 4;
  }

  .code-editor::placeholder { color: var(--muted); }

  .output-area {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.7;
    min-height: 40px;
    max-height: 260px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
    color: #a0c4a0;
    background: #0d1117;
    display: none;
  }

  .output-area.has-output { display: block; }
  .output-area.error { color: #f87171; }

  .output-label {
    display: none;
    padding: 5px 14px;
    background: #0d1117;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    letter-spacing: 0.05em;
  }

  .output-label.visible { display: block; }

  /* PROSE */
  .prose { max-width: 800px; }
  .prose h3 {
    font-family: var(--display);
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin: 22px 0 8px;
  }
  .prose p {
    color: var(--dim);
    font-size: 13.5px;
    line-height: 1.75;
    margin-bottom: 12px;
  }
  .prose code {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 3px;
    color: #79c0ff;
  }

  .info-box {
    border-left: 3px solid var(--accent);
    background: #4f8ef710;
    padding: 12px 16px;
    border-radius: 0 6px 6px 0;
    margin: 14px 0;
    font-size: 13px;
    color: var(--dim);
    line-height: 1.65;
  }

  .info-box.tip  { border-color: var(--green);  background: #22c55e10; }
  .info-box.warn { border-color: var(--amber);  background: #f59e0b10; }
  .info-box strong { color: var(--text); }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 28px 0;
  }

  /* NAV FOOTER */
  .lesson-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  .btn-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--dim);
    transition: all 0.15s;
    font-family: var(--sans);
  }

  .btn-nav:hover { border-color: var(--accent); color: var(--text); }
  .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

  .progress-bar {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 20px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .progress-label {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
    white-space: nowrap;
  }

  /* LOADING OVERLAY */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 16px;
  }

  .loading-spinner {
    width: 40px;
    height: 40px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  .loading-title {
    font-family: var(--display);
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #e2e8f0, #4f8ef7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* HIDDEN */
  .hidden { display: none !important; }

  /* ── SEARCH ── */
  .sidebar-search {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-search input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--text);
    font-family: var(--sans);
    outline: none;
    transition: border-color 0.15s;
  }
  .sidebar-search input:focus { border-color: var(--accent); }
  .sidebar-search input::placeholder { color: var(--muted); }

  /* ── SIDEBAR FOOTER ── */
  .sidebar-footer {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .xp-label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    font-family: var(--mono);
    color: var(--muted);
    margin-bottom: 5px;
  }
  .xp-label span:last-child { color: var(--amber); font-weight: 600; }
  .xp-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .xp-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--amber), #f97316);
    border-radius: 2px;
    transition: width 0.5s ease;
    width: 0%;
  }
  .completed-label {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    text-align: center;
  }

  /* ── TABS ── */
  .lesson-tabs {
    display: flex;
    gap: 2px;
    padding: 0 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .tab-btn {
    padding: 10px 18px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-family: var(--sans);
    transition: all 0.15s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── QUIZ ── */
  .quiz-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    margin: 20px 0;
  }
  .quiz-q {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .quiz-q code {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--border);
    padding: 1px 5px;
    border-radius: 3px;
    color: #79c0ff;
  }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; }
  .quiz-opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    font-size: 13px;
    color: var(--dim);
    background: var(--surface);
  }
  .quiz-opt:hover { border-color: var(--accent); color: var(--text); }
  .quiz-opt.correct { border-color: var(--green); background: #22c55e15; color: #4ade80; }
  .quiz-opt.wrong   { border-color: var(--red);   background: #ef444415; color: #f87171; }
  .quiz-opt.disabled { pointer-events: none; opacity: 0.6; }
  .quiz-opt.correct.disabled { opacity: 1; }
  .quiz-opt code {
    font-family: var(--mono);
    font-size: 11px;
    background: #ffffff10;
    padding: 1px 4px;
    border-radius: 3px;
  }
  .quiz-letter {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; font-family: var(--mono);
    flex-shrink: 0;
    margin-top: 1px;
  }
  .quiz-feedback {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }
  .quiz-feedback.show { display: block; }
  .quiz-feedback.ok  { background: #22c55e15; border: 1px solid #22c55e44; color: #4ade80; }
  .quiz-feedback.bad { background: #ef444415; border: 1px solid #ef444444; color: #f87171; }
  .quiz-score {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--muted);
    margin-bottom: 14px;
  }
  .score-pip { width: 8px; height: 8px; border-radius: 2px; background: var(--border); }
  .score-pip.done-ok  { background: var(--green); }
  .score-pip.done-bad { background: var(--red); }

  /* ── CHEATSHEET ── */
  .cheatsheet-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
    padding: 4px 0 20px;
  }
  .cs-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .cs-card-head {
    padding: 9px 14px;
    background: #1e2330;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    font-family: var(--mono);
    letter-spacing: 0.05em;
  }
  .cs-table { width: 100%; border-collapse: collapse; }
  .cs-table tr { border-bottom: 1px solid var(--border); }
  .cs-table tr:last-child { border-bottom: none; }
  .cs-table td {
    padding: 7px 14px;
    font-size: 12px;
    vertical-align: top;
  }
  .cs-table td:first-child {
    font-family: var(--mono);
    color: #79c0ff;
    white-space: nowrap;
    width: 50%;
    border-right: 1px solid var(--border);
  }
  .cs-table td:last-child { color: var(--dim); }

  /* ── COMPLETION BADGE ── */
  .completion-toast {
    position: fixed;
    top: 20px; right: 20px;
    background: var(--panel);
    border: 1px solid var(--green);
    border-radius: 10px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text);
    z-index: 200;
    transform: translateY(-80px);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 8px 32px #00000060;
  }
  .completion-toast.show { transform: translateY(0); opacity: 1; }
  .toast-icon { font-size: 20px; }

  /* ── NAV ITEM DONE ── */
  .nav-item .nav-done {
    margin-left: auto;
    color: var(--green);
    font-size: 11px;
    display: none;
  }
  .nav-item.done .nav-done { display: block; }
  .nav-item.done .nav-level { display: none; }

  /* ── RESET BTN ── */
  .btn-reset {
    padding: 5px 12px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    transition: all 0.15s;
    font-family: var(--sans);
  }
  .btn-reset:hover { border-color: var(--amber); color: var(--amber); }

  /* ── CHEATSHEET SEARCH ── */
  .cs-search {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .cs-search input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 12px;
    color: var(--text);
    font-family: var(--sans);
    outline: none;
  }
  .cs-search input:focus { border-color: var(--accent); }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-title">NumPy Lab</div>
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">Initialising Python runtime…</div>

// ═══════════════════════════════════════════════════════
//  PYODIDE INIT
// ═══════════════════════════════════════════════════════
async function initPyodide() {
  const txt = document.getElementById('loadingText');
  txt.textContent = 'Downloading Python runtime (~10 MB)…';
  pyodide = await loadPyodide();
  txt.textContent = 'Setting up NumPy environment…';
  await pyodide.loadPackage('numpy');
  pyodide.runPython(`import numpy as np; import sys, io`);
  pyReady = true;

  document.getElementById('loadingOverlay').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');

  const pill = document.getElementById('statusPill');
  pill.className = 'status-pill ready';
  document.getElementById('statusText').textContent = 'Python ready';

  buildSidebar();
  renderLesson(0);
}

// ═══════════════════════════════════════════════════════
//  SIDEBAR
// ═══════════════════════════════════════════════════════
function buildSidebar() {
  rebuildNav('');
}

function rebuildNav(filter) {
  const nav = document.getElementById('sidebarNav');
  let currentSection = '';
  let html = '';
  const q = filter.toLowerCase();
  LESSONS.forEach((l, i) => {
    if (q && !l.title.toLowerCase().includes(q) && !l.section.toLowerCase().includes(q)) return;
    if (l.section !== currentSection) {
      currentSection = l.section;
      html += `<div class="nav-section-label">${l.section}</div>`;
    }
    const lvl = l.level === 'basic' ? 'level-basic' : l.level === 'mid' ? 'level-mid' : 'level-adv';
    const lbl = l.level === 'basic' ? 'Basic' : l.level === 'mid' ? 'Inter.' : 'Adv.';
    const isDone = completedSet.has(i);
    html += `<div class="nav-item${i === currentLesson ? ' active' : ''}${isDone ? ' done' : ''}" id="nav-${i}" onclick="renderLesson(${i})">
      <span class="nav-icon">${l.icon}</span>
      <span>${l.title}</span>
      <span class="nav-level ${lvl}">${lbl}</span>
      <span class="nav-done">✓</span>
    </div>`;
  });
  nav.innerHTML = html || '<div style="padding:12px 14px;font-size:12px;color:var(--muted)">No results</div>';
  updateXP();
}

function filterNav(val) { rebuildNav(val); }

function updateXP() {
  const total = LESSONS.length;
  const done  = completedSet.size;
  xp = done * XP_PER_LESSON;
  document.getElementById('xpCount').textContent = xp;
  document.getElementById('xpFill').style.width  = (done / total * 100) + '%';
  document.getElementById('completedLabel').textContent = `${done} / ${total} completed`;
}

// ═══════════════════════════════════════════════════════
//  TAB SWITCHING
// ═══════════════════════════════════════════════════════
function switchTab(tab, btn) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('lessonView').classList.toggle('hidden', tab !== 'lesson');
  document.getElementById('quizView').classList.toggle('hidden', tab !== 'quiz');
  document.getElementById('cheatsheetView').classList.toggle('hidden', tab !== 'cheatsheet');
  if (tab === 'quiz')        renderQuiz(currentLesson);
  if (tab === 'cheatsheet')  renderCheatsheet();
}

// ═══════════════════════════════════════════════════════
//  RENDER LESSON
// ═══════════════════════════════════════════════════════
function renderLesson(idx) {
  if (idx < 0 || idx >= LESSONS.length) return;
  currentLesson = idx;
  const l = LESSONS[idx];

  // sidebar active
  document.querySelectorAll('.nav-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
  const activeEl = document.getElementById('nav-' + idx);
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

  // topbar
  document.getElementById('topbarTitle').textContent = l.title;
  document.getElementById('topbarBreadcrumb').textContent =
    `numpy > ${l.section.toLowerCase()} > ${l.id}`;

  // progress
  const pct = ((idx + 1) / LESSONS.length * 100).toFixed(0);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${idx+1} / ${LESSONS.length}`;

  // nav buttons
  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnNext').disabled = idx === LESSONS.length - 1;

  // lesson content
  const cid = `cell-${idx}`;
  const oid = `out-${idx}`;
  const lid = `outl-${idx}`;

  document.getElementById('lessonView').innerHTML = `
    <div class="lesson-header">
      <div class="lesson-eyebrow">${l.eyebrow}</div>
      <div class="lesson-title">${l.icon} ${l.title}</div>
      <div class="lesson-desc">${l.desc}</div>
    </div>
    ${l.content}
    <div class="divider"></div>
    <div class="code-block">
      <div class="code-block-header">
        <div class="file-label"><span class="py-dot">⬤</span> example.py — editable</div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn-reset" onclick="resetCode(${idx},'${cid}')">↺ Reset</button>
          <button class="btn-run" onclick="runCode('${cid}','${oid}','${lid}',${idx})" id="btn-${cid}">
            <span class="run-icon">▶</span> Run
          </button>
        </div>
      </div>
      <textarea class="code-editor" id="${cid}" spellcheck="false" rows="18">${l.code.trim()}</textarea>
      <div class="output-label" id="${lid}">── OUTPUT ──────────────────────────</div>
      <div class="output-area" id="${oid}"></div>
    </div>
  `;

  // re-render active tab content
  if (activeTab === 'quiz')       renderQuiz(idx);
  if (activeTab === 'cheatsheet') renderCheatsheet();

  document.getElementById('lessonView').scrollTop = 0;
}

function resetCode(idx, cid) {
  document.getElementById(cid).value = LESSONS[idx].code.trim();
}

// ═══════════════════════════════════════════════════════
//  QUIZ RENDERER
// ═══════════════════════════════════════════════════════
const quizState = {}; // keyed by lessonId + qIdx

function renderQuiz(idx) {
  const l   = LESSONS[idx];
  const qs  = QUIZZES[l.id] || [];
  const el  = document.getElementById('quizView');

  if (!qs.length) {
    el.innerHTML = `<div style="padding:40px 32px;color:var(--muted);font-size:14px">No quiz available for this lesson yet.</div>`;
    return;
  }

  const letters = ['A','B','C','D'];
  let html = `
    <div class="lesson-header">
      <div class="lesson-eyebrow">${l.eyebrow} — Quiz</div>
      <div class="lesson-title">🧠 ${l.title} Quiz</div>
      <div class="lesson-desc">Test your understanding. Select the best answer for each question.</div>
    </div>
  `;

  qs.forEach((q, qi) => {
    const key    = `${l.id}_${qi}`;
    const picked = quizState[key];
    const locked = picked !== undefined;

    // score pips
    const pips = qs.map((_,i) => {
      const k = `${l.id}_${i}`;
      const p = quizState[k];
      const cls = p === undefined ? '' : (p === qs[i].ans ? 'done-ok' : 'done-bad');
      return `<div class="score-pip ${cls}"></div>`;
    }).join('');

    html += `
      <div class="quiz-wrap" id="qwrap-${qi}">
        <div class="quiz-score">${pips}<span style="margin-left:4px">Q${qi+1} of ${qs.length}</span></div>
        <div class="quiz-q">Q${qi+1}. ${q.q}</div>
        <div class="quiz-options">
    `;

    q.opts.forEach((opt, oi) => {
      let cls = '';
      if (locked) {
        if (oi === q.ans)    cls = 'correct';
        else if (oi === picked && picked !== q.ans) cls = 'wrong';
        cls += ' disabled';
      }
      html += `
        <div class="quiz-opt ${cls}" onclick="answerQuiz('${l.id}',${qi},${oi},${q.ans})">
          <div class="quiz-letter">${letters[oi]}</div>
          <div>${opt}</div>
        </div>`;
    });

    const fbCls  = locked ? (picked === q.ans ? 'ok' : 'bad') : '';
    const fbIcon = picked === q.ans ? '✅' : '❌';
    const fbMsg  = locked ? `${fbIcon} ${q.exp}` : '';
    html += `
        </div>
        <div class="quiz-feedback ${locked ? 'show ' + fbCls : ''}">${fbMsg}</div>
      </div>
    `;
  });

  el.innerHTML = html;
  el.scrollTop = 0;
}

function answerQuiz(lessonId, qi, chosen, correct) {
  const key = `${lessonId}_${qi}`;
  if (quizState[key] !== undefined) return; // already answered
  quizState[key] = chosen;

  // Check if entire quiz for this lesson is done + all correct
  const qs  = QUIZZES[lessonId];
  const idx = LESSONS.findIndex(l => l.id === lessonId);
  const allDone    = qs.every((_,i) => quizState[`${lessonId}_${i}`] !== undefined);
  const allCorrect = qs.every((q,i) => quizState[`${lessonId}_${i}`] === q.ans);

  renderQuiz(idx);

  if (allDone && allCorrect && !completedSet.has(idx)) {
    completedSet.add(idx);
    rebuildNav(document.getElementById('searchInput')?.value || '');
    showToast(`🏆 ${LESSONS[idx].title} mastered! +${XP_PER_LESSON} XP`);
  } else if (allDone && !allCorrect) {
    showToast('Keep going — retry incorrect answers!');
  }
}

// ═══════════════════════════════════════════════════════
//  CHEATSHEET
// ═══════════════════════════════════════════════════════
function renderCheatsheet(filter) {
  const el  = document.getElementById('cheatsheetView');
  const q   = (filter || '').toLowerCase();
  let html  = `
    <div class="lesson-header">
      <div class="lesson-eyebrow">Quick Reference</div>
      <div class="lesson-title">📋 NumPy Cheat Sheet</div>
      <div class="lesson-desc">All the essential functions at a glance. Editable — click any cell to copy.</div>
    </div>
    <div class="cs-search">
      <input type="text" placeholder="Filter cheat sheet…" oninput="renderCheatsheet(this.value)" value="${filter||''}">
    </div>
    <div class="cheatsheet-grid">
  `;
  CHEATSHEET.forEach(section => {
    const rows = q ? section.rows.filter(r => r[0].toLowerCase().includes(q) || r[1].toLowerCase().includes(q)) : section.rows;
    if (!rows.length) return;
    html += `<div class="cs-card">
      <div class="cs-card-head">${section.title}</div>
      <table class="cs-table">`;
    rows.forEach(([code, desc]) => {
      html += `<tr onclick="copyToClipboard('${code.replace(/'/g,"\\'")}')" style="cursor:pointer" title="Click to copy">
        <td>${code}</td><td>${desc}</td>
      </tr>`;
    });
    html += `</table></div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => showToast('📋 Copied: ' + text, 1500));
}

// ═══════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════
let toastTimer;
function showToast(msg, duration = 3000) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

// ═══════════════════════════════════════════════════════
//  RUN CODE
// ═══════════════════════════════════════════════════════
async function runCode(cellId, outId, labelId, lessonIdx) {
  if (!pyReady) return;
  const code    = document.getElementById(cellId).value;
  const outEl   = document.getElementById(outId);
  const labelEl = document.getElementById(labelId);
  const btnEl   = document.getElementById('btn-' + cellId);

  btnEl.disabled = true;
  btnEl.innerHTML = '<span>⏳</span> Running…';
  outEl.className = 'output-area has-output';
  outEl.textContent = '';
  labelEl.className = 'output-label visible';

  const pill = document.getElementById('statusPill');
  pill.className = 'status-pill loading';
  document.getElementById('statusText').textContent = 'Running…';

  try {
    pyodide.runPython(`
import sys, io
_stdout_capture = io.StringIO()
sys.stdout = _stdout_capture
`);
    pyodide.runPython(code);
    pyodide.runPython(`sys.stdout = sys.__stdout__`);
    const output = pyodide.runPython(`_stdout_capture.getvalue()`);
    outEl.textContent = output || '(no output)';
    outEl.className   = 'output-area has-output';

    // Award XP on first successful run of a lesson (if no quiz defined)
    if (lessonIdx !== undefined && !QUIZZES[LESSONS[lessonIdx].id] && !completedSet.has(lessonIdx)) {
      completedSet.add(lessonIdx);
      rebuildNav(document.getElementById('searchInput')?.value || '');
      showToast(`✅ ${LESSONS[lessonIdx].title} completed! +${XP_PER_LESSON} XP`);
    }
  } catch (e) {
    try { pyodide.runPython(`sys.stdout = sys.__stdout__`); } catch(_) {}
    outEl.textContent = '⚠ ' + e.message;
    outEl.className   = 'output-area has-output error';
  }

  btnEl.disabled = false;
  btnEl.innerHTML = '<span class="run-icon">▶</span> Run';
  pill.className  = 'status-pill ready';
  document.getElementById('statusText').textContent = 'Python ready';
}

// ═══════════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════════
function navigate(dir) {
  renderLesson(currentLesson + dir);
}

// keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'ArrowLeft')  navigate(-1);
  if (e.key === '1') switchTab('lesson',     document.querySelector('.tab-btn:nth-child(1)'));
  if (e.key === '2') switchTab('quiz',       document.querySelector('.tab-btn:nth-child(2)'));
  if (e.key === '3') switchTab('cheatsheet', document.querySelector('.tab-btn:nth-child(3)'));
});

// ── BOOT ──
initPyodide();
</script>
