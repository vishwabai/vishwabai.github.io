<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytical Mechanics — a visual course</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:'Inter','Segoe UI',system-ui,sans-serif;}
  #c{display:block;width:100vw;height:100vh;cursor:pointer;}
  #hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    color:#7c8088;text-align:center;font-size:15px;letter-spacing:.3px;
    pointer-events:none;opacity:0;transition:opacity .6s;line-height:1.9;}
  #hint b{color:#c9cdd4;font-weight:600;}
  #hint.show{opacity:1;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<script>
"use strict";
/* ============================================================
   ANALYTICAL MECHANICS — Manim-style standalone deck
   Custom canvas math-layout engine + physics animations.
   ============================================================ */
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const VW=1280, VH=720;          // virtual 16:9 stage
let W=0,H=0,dpr=1;

/* ---------- palette (muted, low-glow) ---------- */
const C={
  bg:'#08080b', stage:'#0b0c10', ink:'#e6e7ea', dim:'#8b8f98',
  faint:'#3a3e47', grid:'#24272e',
  blue:'#6d9dc5', teal:'#4f9a94', gold:'#c7a94e', coral:'#c67c68',
  green:'#7fa35f', purple:'#9481b8', rose:'#bd7a97', slate:'#61707e'
};

/* ---------- easing / math utils ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3);
const eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eOutBack=t=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function appear(s,k,dur=.55){ if(s.step<k)return 0; if(s.step>k)return 1; return eOut(clamp(s.st/dur,0,1)); }
function av(s,k,from,to,dur=.55){ return lerp(from,to,appear(s,k,dur)); }

/* ---------- primitive drawing ---------- */
function line(x1,y1,x2,y2,col,w=2,alpha=1,dash){ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();}
function arrow(x1,y1,x2,y2,col,w=2.4,alpha=1,head=12){line(x1,y1,x2,y2,col,w,alpha);const a=Math.atan2(y2-y1,x2-x1);ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(a-.42),y2-head*Math.sin(a-.42));ctx.lineTo(x2-head*Math.cos(a+.42),y2-head*Math.sin(a+.42));ctx.closePath();ctx.fill();ctx.restore();}
function dot(x,y,r,col,alpha=1,glow=0){ctx.save();ctx.globalAlpha*=alpha;if(glow){ctx.shadowColor=col;ctx.shadowBlur=glow;}ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.restore();}
function ring(x,y,r,col,w=2,alpha=1){ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();ctx.restore();}
function arcp(cx,cy,r,a0,a1,col,w=2,alpha=1,dash,ccw=false){ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.arc(cx,cy,r,a0,a1,ccw);ctx.stroke();ctx.restore();}
function polyline(pts,col,w=2,alpha=1,dash){if(pts.length<2)return;ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineJoin='round';ctx.lineCap='round';if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();ctx.restore();}
function fillpath(pts,col,alpha=1){if(pts.length<2)return;ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill();ctx.restore();}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function box(x,y,w,h,r,fill,stroke,sw=1.2,alpha=1){ctx.save();ctx.globalAlpha*=alpha;rrect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.stroke();}ctx.restore();}

/* ---------- UI text (sans) ---------- */
function T(s,x,y,size,col,align='left',alpha=1,weight=400){ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.font=weight+' '+size+"px 'Inter','Segoe UI',system-ui,sans-serif";ctx.fillText(s,x,y);ctx.restore();}
function wrapLines(s,size,maxW,weight=400){ctx.font=weight+' '+size+"px 'Inter',sans-serif";const words=s.split(' ');let lines=[],cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}
function para(s,x,y,size,col,maxW,lh,align='left',alpha=1,weight=400){const ls=wrapLines(s,size,maxW,weight);ls.forEach((l,i)=>T(l,x,y+i*lh,size,col,align,alpha,weight));return ls.length*lh;}

/* ---------- math layout engine ---------- */
function setF(size,ital){ctx.font=(ital?'italic ':'')+size+"px 'Cambria Math','STIX Two Math','Georgia','Times New Roman',serif";}
const A={
  t:s=>({k:'t',s}), v:s=>({k:'v',s}), dot:(s,n=1)=>({k:'dot',s,n}),
  row:(...xs)=>({k:'row',xs:xs.flat()}),
  frac:(n,d)=>({k:'frac',n,d}),
  sup:(b,e)=>({k:'sup',b,e}), sub:(b,x)=>({k:'sub',b,x}),
  ss:(b,x,e)=>({k:'ss',b,x,e})
};
function mM(a,size){
  if(a.k==='t'||a.k==='v'||a.k==='dot'){setF(size,a.k!=='t');const w=ctx.measureText(a.s).width;let asc=size*.72;if(a.k==='dot')asc+=size*.16;return{w,a:asc,d:size*.24};}
  if(a.k==='row'){let w=0,as=0,ds=0;for(const it of a.xs){const m=mM(it,size);w+=m.w;as=Math.max(as,m.a);ds=Math.max(ds,m.d);}return{w,a:as,d:ds};}
  if(a.k==='frac'){const n=mM(a.n,size*.92),d=mM(a.d,size*.92);const bw=Math.max(n.w,d.w)+size*.34;const ax=size*.30,g=size*.14;return{w:bw,a:ax+g+n.a+n.d,d:-ax+g+d.a+d.d};}
  if(a.k==='sup'){const b=mM(a.b,size),e=mM(a.e,size*.7);const sh=size*.5;return{w:b.w+e.w,a:Math.max(b.a,sh+e.a),d:Math.max(b.d,e.d-sh)};}
  if(a.k==='sub'){const b=mM(a.b,size),e=mM(a.x,size*.7);const sh=size*.22;return{w:b.w+e.w,a:Math.max(b.a,e.a-sh),d:Math.max(b.d,sh+e.d)};}
  if(a.k==='ss'){const b=mM(a.b,size),sb=mM(a.x,size*.7),sp=mM(a.e,size*.7);const up=size*.5,dn=size*.22;return{w:b.w+Math.max(sb.w,sp.w),a:Math.max(b.a,up+sp.a),d:Math.max(b.d,dn+sb.d)};}
}
function mP(a,x,y,size,col){
  ctx.fillStyle=col;
  if(a.k==='t'||a.k==='v'){setF(size,a.k==='v');ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText(a.s,x,y);return ctx.measureText(a.s).width;}
  if(a.k==='dot'){setF(size,true);ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText(a.s,x,y);const w=ctx.measureText(a.s).width;const n=a.n||1,r=Math.max(1.4,size*.05);for(let i=0;i<n;i++){const dx=x+w/2+(i-(n-1)/2)*(r*2.6);ctx.beginPath();ctx.arc(dx,y-size*.74,r,0,7);ctx.fill();}return w;}
  if(a.k==='row'){let cx=x;for(const it of a.xs)cx+=mP(it,cx,y,size,col);return cx-x;}
  if(a.k==='frac'){const n=mM(a.n,size*.92),d=mM(a.d,size*.92);const bw=Math.max(n.w,d.w)+size*.34;const ax=size*.30,g=size*.14,by=y-ax;ctx.strokeStyle=col;ctx.lineWidth=Math.max(1.2,size*.045);ctx.beginPath();ctx.moveTo(x,by);ctx.lineTo(x+bw,by);ctx.stroke();mP(a.n,x+(bw-n.w)/2,by-g-n.d,size*.92,col);mP(a.d,x+(bw-d.w)/2,by+g+d.a,size*.92,col);return bw;}
  if(a.k==='sup'){const bw=mP(a.b,x,y,size,col);mP(a.e,x+bw,y-size*.5,size*.7,col);return bw+mM(a.e,size*.7).w;}
  if(a.k==='sub'){const bw=mP(a.b,x,y,size,col);mP(a.x,x+bw,y+size*.22,size*.7,col);return bw+mM(a.x,size*.7).w;}
  if(a.k==='ss'){const bw=mP(a.b,x,y,size,col);mP(a.e,x+bw,y-size*.5,size*.7,col);mP(a.x,x+bw,y+size*.22,size*.7,col);return bw+Math.max(mM(a.x,size*.7).w,mM(a.e,size*.7).w);}
}
// draw equation; anchor: y is vertical CENTER of the expression
function eq(a,x,cy,size,col,align='center',alpha=1){ctx.save();ctx.globalAlpha*=alpha;const m=mM(a,size);let ox=x;if(align==='center')ox=x-m.w/2;else if(align==='right')ox=x-m.w;const base=cy+(m.a-m.d)/2;mP(a,ox,base,size,col);ctx.restore();return m;}
function eqBox(a,cx,cy,size,col,alpha=1,padX=22,padY=16,bg='rgba(255,255,255,.035)',bd=null){const m=mM(a,size);const w=m.w+padX*2,h=m.a+m.d+padY*2;ctx.save();ctx.globalAlpha*=alpha;rrect(cx-w/2,cy-h/2,w,h,10);ctx.fillStyle=bg;ctx.fill();if(bd){ctx.strokeStyle=bd;ctx.lineWidth=1.2;ctx.stroke();}ctx.restore();eq(a,cx,cy,size,col,'center',alpha);return{w,h};}

/* ---------- RECAP / GAP / FILL kicker ---------- */
function kicker(kind,text,x,y,maxW,alpha){
  const map={RECAP:{c:C.slate},GAP:{c:C.gold},FILL:{c:C.teal}};
  const k=map[kind]; if(alpha<=0)return;
  ctx.save();ctx.globalAlpha*=alpha;
  T(kind,x,y,14,k.c,'left',1,700);
  ctx.restore();
  const tw=(()=>{ctx.font="700 14px 'Inter',sans-serif";return ctx.measureText(kind).width;})();
  para(text,x+tw+14,y,17,kind==='GAP'?C.ink:C.dim,maxW-tw-14,23,'left',alpha,kind==='GAP'?500:400);
}

/* ---------- reusable physics props ---------- */
function pendulum(px,py,L,ang,col,bobR=13,rodW=2.6,alpha=1){const bx=px+L*Math.sin(ang),by=py+L*Math.cos(ang);line(px,py,bx,by,col,rodW,alpha);dot(px,py,4,C.dim,alpha);dot(bx,by,bobR,col,alpha);return[bx,by];}
function spring(x1,y,x2,coils,amp,col,w=2,alpha=1){const pts=[[x1,y]];const seg=coils*2;const len=x2-x1,lead=len*.14;for(let i=0;i<=seg;i++){const t=i/seg;const xx=x1+lead+ (len-2*lead)*t;const yy=y+(i===0||i===seg?0:(i%2?amp:-amp));pts.push([xx,yy]);}pts.push([x2,y]);polyline(pts,col,w,alpha);}
function grid(x,y,w,h,step,col,alpha=.5){ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=col;ctx.lineWidth=1;for(let gx=x;gx<=x+w+.1;gx+=step){ctx.beginPath();ctx.moveTo(gx,y);ctx.lineTo(gx,y+h);ctx.stroke();}for(let gy=y;gy<=y+h+.1;gy+=step){ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+w,gy);ctx.stroke();}ctx.restore();}

/* ============================================================
   SLIDES
   ============================================================ */
const MX=72;
const slides=[];
const S=(tag,title,steps,draw)=>slides.push({tag,title,steps,draw});

/* ---- 0. TITLE ---- */
S('','',3,(s)=>{
  const cx=VW/2, cy=310;
  // swinging pendulum flourish
  const ang=0.6*Math.cos(s.t*1.4);
  const px=cx, py=150;
  const a0=appear(s,0,1);
  pendulum(px,py,150,ang,C.blue,14,2.6,a0*0.9);
  // faint phase swirl behind
  ctx.save();ctx.globalAlpha=0.25*a0;
  for(let i=0;i<5;i++){const rr=40+i*26;arcp(cx,cy+150,rr,0.6,0.6+4.6,C.slate,1);}
  ctx.restore();
  T('ANALYTICAL MECHANICS',cx,cy+130,58,C.ink,'center',appear(s,0,.8),700);
  T('the geometry of motion',cx,cy+172,24,C.blue,'center',appear(s,1,.8),400);
  para("From Newton's forces to action, symmetry, and phase space — the language behind robotics, spacecraft, and quantum mechanics.",cx,cy+220,18,C.dim,760,26,'center',appear(s,2,.8));
  if(appear(s,2,1)>.9){const b=0.5+0.5*Math.sin(s.t*2.2);T('press  →  to begin',cx,660,15,C.slate,'center',0.5+0.5*b);}
});

/* ---- 1. WHY NEWTON ISN'T ENOUGH ---- */
S('ACT I · THE SETUP','Why F = ma is the hard way',4,(s)=>{
  // bead on a curved wire, left panel
  const cx=360, cy=340;
  // wire (parabola-ish bowl)
  const pts=[];for(let i=-160;i<=160;i+=6){const x=cx+i;const y=cy+ i*i/380 -60;pts.push([x,y]);}
  polyline(pts,C.slate,3,appear(s,0));
  // bead position along wire
  const u=120*Math.sin(s.t*1.3);
  const bx=cx+u, by=cy+u*u/380-60;
  dot(bx,by,12,C.blue,appear(s,0));
  T('a bead on a wire',cx,180,18,C.dim,'center',appear(s,0));
  if(s.step>=1){const a=appear(s,1);
    // gravity + unknown normal force
    arrow(bx,by,bx,by+70,C.coral,2.6,a); T('mg',bx+14,by+58,16,C.coral,'left',a);
    // normal (perp to wire) — unknown
    const slope=2*u/380; const nx=-slope, ny=1; const nl=Math.hypot(nx,ny);
    arrow(bx,by,bx-nx/nl*64,by-ny/nl*64,C.gold,2.6,a); T('N = ?',bx-nx/nl*70-30,by-ny/nl*64,16,C.gold,'left',a);
  }
  // right panel: double pendulum tangle
  if(s.step>=2){const a=appear(s,2);const dx=900,dy=250;
    const t1=0.5*Math.cos(s.t*1.7), t2=0.9*Math.cos(s.t*2.3+1);
    const [x1,y1]=pendulum(dx,dy,110,t1,C.teal,11,2.4,a);
    const x2=x1+90*Math.sin(t2), y2=y1+90*Math.cos(t2);
    line(x1,y1,x2,y2,C.teal,2.4,a);dot(x2,y2,11,C.teal,a);dot(x1,y1,7,C.teal,a);
    T('now write ΣF = ma here…',dx,180,17,C.dim,'center',a);
    T('coupled, tangled, full of unknown link forces',dx,470,15,C.slate,'center',a);
  }
  kicker('RECAP','Newton gives ΣF = ma — but you must know every constraint force (N, tensions, joint reactions) even though you never asked about them.',MX,545,VW-2*MX,appear(s,1));
  kicker('GAP','We only care about motion along the allowed paths. Can we describe that motion without ever solving for the forces that merely enforce the path?',MX,600,VW-2*MX,appear(s,3));
});

/* ---- 2. GENERALIZED COORDINATES ---- */
S('ACT I · THE SETUP','Generalized coordinates',4,(s)=>{
  const px=380,py=210;
  // pendulum described two ways
  const ang=0.7*Math.cos(s.t*1.6);
  const [bx,by]=pendulum(px,py,180,ang,C.blue,13,2.6,appear(s,0));
  // step0: cartesian (x,y) with constraint
  if(s.step>=0){const a=appear(s,0);
    line(px,py,px,by,C.faint,1.4,a,[4,4]);line(px,by,bx,by,C.faint,1.4,a,[4,4]);
    T('(x, y)',bx+18,by+6,17,C.dim,'left',a);
    eq(A.row(A.sup(A.v('x'),A.t('2')),A.t(' + '),A.sup(A.v('y'),A.t('2')),A.t(' = '),A.sup(A.v('ℓ'),A.t('2'))), px, 470,22,C.dim,'center',a);
    T('2 numbers, but they are not free',px,505,15,C.slate,'center',a);
  }
  // step1: collapse to angle
  if(s.step>=1){const a=appear(s,1);
    arcp(px,py,46,Math.PI/2,Math.PI/2+ang,C.gold,2.5,a);
    eq(A.v('θ'),px+ (ang>0?36:-46), py+70,22,C.gold,'center',a);
  }
  // step2: the config space is a circle
  if(s.step>=2){const a=appear(s,2);const qcx=940,qcy=300;
    ring(qcx,qcy,110,C.slate,2,a);
    const qx=qcx+110*Math.sin(ang),qy=qcy-110*Math.cos(ang);
    dot(qx,qy,10,C.gold,a);
    T('configuration space',qcx,150,17,C.dim,'center',a);
    T('one dial: q = θ',qcx,450,17,C.gold,'center',a);
    eqBox(A.row(A.v('q'),A.t(' = ('),A.sub(A.v('q'),A.t('1')),A.t(', …, '),A.sub(A.v('q'),A.v('n')),A.t(')')),qcx,500,22,C.ink,a,20,14);
  }
  kicker('FILL','A generalized coordinate is any independent number that fixes the configuration. Choose the minimal set q₁…qₙ — the constraints are already built in, so no constraint forces appear.',MX,600,VW-2*MX,appear(s,3));
});

/* ---- 3. CONSTRAINTS ---- */
S('ACT I · THE SETUP','Constraints: holonomic vs. not',4,(s)=>{
  // left: holonomic — position relation
  const lx=340,ly=300;
  T('HOLONOMIC',lx,175,15,C.blue,'center',appear(s,0),700);
  para('a relation between positions',lx,200,15,C.dim,300,20,'center',appear(s,0));
  if(s.step>=0){const a=appear(s,0);
    const pts=[];for(let i=-140;i<=140;i+=6){const x=lx+i;const y=ly+70+40*Math.sin(i/50);pts.push([x,y]);}
    polyline(pts,C.slate,3,a);
    const u=120*Math.sin(s.t*1.2);const bx=lx+u,by=ly+70+40*Math.sin(u/50);dot(bx,by,11,C.blue,a);
    eqBox(A.row(A.v('f'),A.t('('),A.v('x'),A.t(', '),A.v('y'),A.t(', '),A.v('t'),A.t(') = 0')),lx,ly+180,20,C.ink,a,18,12);
    T('→ removes a whole coordinate',lx,ly+235,15,C.slate,'center',a);
  }
  // right: non-holonomic — rolling disk (velocity relation)
  const rx=950,ry=340;
  T('NON-HOLONOMIC',rx,175,15,C.coral,'center',appear(s,1),700);
  para('a relation that ties velocities',rx,200,15,C.dim,320,20,'center',appear(s,1));
  if(s.step>=1){const a=appear(s,1);
    const roll=s.t*1.4; const R=52; const cxx=rx+ (120*Math.sin(s.t*0.6)); 
    line(rx-160,ry+R,rx+160,ry+R,C.slate,2,a); // ground
    ring(cxx,ry,R,C.coral,2.4,a);
    // spoke
    line(cxx,ry, cxx+R*Math.cos(roll), ry+R*Math.sin(roll), C.coral,2,a);
    dot(cxx,ry,4,C.coral,a);
    eqBox(A.row(A.dot('x'),A.t(' = '),A.v('R'),A.dot('θ')),rx,ry+120,20,C.ink,a,18,12);
    T('roll-without-slip: a speed law,',rx,ry+165,15,C.slate,'center',a);
    T('not integrable to a position law',rx,ry+186,15,C.slate,'center',a);
  }
  line(VW/2,170,VW/2,470,C.grid,1,appear(s,1));
  kicker('RECAP','Holonomic constraints are position equations f(q,t)=0 — each one deletes a coordinate.',MX,560,VW-2*MX,appear(s,2));
  kicker('GAP','So how many independent dials are truly left after the constraints have had their say?',MX,610,VW-2*MX,appear(s,3));
});

/* ---- 4. DEGREES OF FREEDOM ---- */
S('ACT I · THE SETUP','Degrees of freedom = the count that matters',4,(s)=>{
  // N free particles
  const a0=appear(s,0);
  T('N free particles in 3D',320,190,17,C.dim,'center',a0);
  for(let i=0;i<4;i++){const x=200+i*80,y=260+18*Math.sin(s.t*2+i);dot(x,y,9,C.blue,a0);}
  eqBox(A.row(A.t('dof = '),A.t('3'),A.v('N')),320,340,22,C.ink,a0,18,12);
  // link them → rigid body
  if(s.step>=1){const a=appear(s,1);
    T('lock the distances → rigid body',960,190,17,C.dim,'center',a);
    const cx=960,cy=280,R=60;const verts=[];for(let i=0;i<3;i++){const th=s.t*0.7+i*2.094;verts.push([cx+R*Math.cos(th),cy+R*Math.sin(th)]);}
    for(let i=0;i<3;i++){for(let j=i+1;j<3;j++)line(verts[i][0],verts[i][1],verts[j][0],verts[j][1],C.teal,2,a);}
    verts.forEach(v=>dot(v[0],v[1],9,C.teal,a));

/* ============================================================
   ENGINE
   ============================================================ */
let cur=0, step=0, slideT=0, stepT=0, fade=1, last=performance.now();

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
}
window.addEventListener('resize',resize); resize();

function next(){const sl=slides[cur];if(step<sl.steps-1){step++;stepT=0;}else if(cur<slides.length-1){cur++;step=0;slideT=0;stepT=0;fade=0;}}
function prev(){if(step>0){step--;stepT=0;}else if(cur>0){cur--;step=slides[cur].steps-1;slideT=0;stepT=0;fade=0;}}
function restart(){cur=0;step=0;slideT=0;stepT=0;fade=0;}

window.addEventListener('keydown',e=>{
  if(['ArrowRight',' ','PageDown','ArrowDown','Enter'].includes(e.key)){next();e.preventDefault();}
  else if(['ArrowLeft','PageUp','ArrowUp','Backspace'].includes(e.key)){prev();e.preventDefault();}
  else if(e.key==='Home'){restart();}
  else if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
  hideHint();
});
canvas.addEventListener('click',e=>{ if(e.clientX < W*0.28) prev(); else next(); hideHint();});
// touch
let tx=0;canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(dx>40)prev();else next();hideHint();},{passive:true});

const hintEl=document.getElementById('hint');
hintEl.innerHTML="<b>Analytical Mechanics</b><br>a visual course<br><br>→ / Space &nbsp; advance &nbsp;·&nbsp; ← &nbsp; back &nbsp;·&nbsp; F &nbsp; fullscreen<br>click right / left · swipe";
setTimeout(()=>hintEl.classList.add('show'),400);
let hintGone=false;
function hideHint(){if(hintGone)return;hintGone=true;hintEl.classList.remove('show');}
setTimeout(hideHint,7000);

/* chrome: header + footer */
function chrome(sl){
  if(sl.tag){T(sl.tag,MX,64,15,C.dim,'left',1,700);}
  if(sl.title){T(sl.title,MX,104,32,C.ink,'left',1,600);line(MX,122,VW-MX,122,C.grid,1,0.8);}
  // footer progress dots for steps
  const n=sl.steps, gap=16, tot=(n-1)*gap, x0=VW/2-tot/2, y=690;
  for(let i=0;i<n;i++){const on=i<=step;dot(x0+i*gap,y,on?4:3,on?C.gold:C.faint,1);}
  // counter
  T((cur+1)+' / '+slides.length,VW-MX,y+5,14,C.dim,'right',1);
  // hint
  T('→ advance   ·   ← back',MX,y+5,13,C.slate,'left',1);
  // progress bar
  const prog=(cur+ (step)/(Math.max(1,sl.steps-1)))/slides.length;
  line(0,VH-2,VW,VH-2,C.grid,2,1);line(0,VH-2,VW*clamp(prog,0,1),VH-2,C.gold,2,1);
}

function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  slideT+=dt; stepT+=dt; if(fade<1)fade=Math.min(1,fade+dt/0.4);
  // clear full canvas black (letterbox)
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  // fit 16:9 stage
  const scale=Math.min(W/VW,H/VH), ox=(W-VW*scale)/2, oy=(H-VH*scale)/2;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy);
  ctx.save();ctx.beginPath();ctx.rect(0,0,VW,VH);ctx.clip();
  // stage background
  ctx.fillStyle=C.stage;ctx.fillRect(0,0,VW,VH);
  const sl=slides[cur];
  const s={t:slideT,step,st:stepT};
  ctx.save();ctx.globalAlpha=eOut(fade);
  try{ sl.draw(s); }catch(err){ T('render error: '+err.message,40,40,16,'#c67c68'); }
  ctx.restore();
  chrome(sl);
  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
