<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Math Behind Unsupervised Learning — First Principles</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0d; --panel:#12151a; --grid:#1c2026; --grid2:#242932;
    --text:#eef1f3; --dim:#8b93a1; --dim2:#565f6c;
    --blue:#6fa8dc; --amber:#d9a066; --rose:#c97b91; --green:#7fb88f; --violet:#9a8fc4; --red:#c9706f; --gray:#556070;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}
  #stageWrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:10px 10px 64px;}
  svg#stage{width:100%;height:100%;max-width:calc((100vh - 74px) * 16 / 9);max-height:calc(100vw * 9 / 16);display:block;background:
    radial-gradient(ellipse at 20% 10%, rgba(154,142,196,0.06), transparent 55%),
    radial-gradient(ellipse at 85% 90%, rgba(111,168,220,0.05), transparent 55%),
    var(--bg);
    border-radius:6px;}
  .brand{position:fixed;top:18px;left:24px;display:flex;align-items:center;gap:9px;color:var(--dim2);font-size:11px;letter-spacing:2.5px;font-weight:600;z-index:5;user-select:none;}
  .brand .dotwrap{width:14px;height:14px;position:relative;}
  .brand .dotwrap .p{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--violet);top:0;left:5px;animation:orbit 4s linear infinite;transform-origin:2px 7px;}
  @keyframes orbit{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  #chrome{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:18px;padding:0 26px;z-index:5;
    background:linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));}
  .navbtn{width:34px;height:34px;border-radius:50%;border:1px solid #2a2f38;background:#14171c;color:var(--dim);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s ease;flex:0 0 auto;}
  .navbtn:hover{border-color:var(--violet);color:var(--text);background:#171c22;}
  .navbtn svg{width:14px;height:14px;}
  .navbtn.replay svg{width:13px;height:13px;}
  #barTrack{flex:1;height:2px;background:var(--grid);border-radius:2px;position:relative;overflow:hidden;}
  #barFill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--violet),var(--blue));width:0%;transition:width .35s ease;}
  #counter{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim2);letter-spacing:1px;min-width:64px;text-align:right;}
  #slideLabel{font-family:'Inter',sans-serif;font-size:12px;color:var(--dim);min-width:220px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hint{position:fixed;top:18px;right:24px;font-size:11px;color:var(--dim2);letter-spacing:1px;z-index:5;font-family:'JetBrains Mono',monospace;}
  ::selection{background:rgba(154,142,196,.25);}
</style>
</head>
<body>
<div id="app">
  <div class="brand"><span class="dotwrap"><span class="p"></span></span>MATH FROM FIRST PRINCIPLES</div>
  <div class="hint" id="hint">← →  navigate  ·  R replay</div>
  <div id="stageWrap">
    <svg id="stage" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div id="chrome">
    <button class="navbtn" id="prevBtn" title="Previous (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="navbtn replay" id="replayBtn" title="Replay animation (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 .49-9.5L1 10"/></svg></button>
    <div id="slideLabel"></div>
    <div id="barTrack"><div id="barFill"></div></div>
    <div id="counter"></div>
    <button class="navbtn" id="nextBtn" title="Next (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
</div>

<script>
/* =========================================================================
   ENGINE  (same core used across the deck series)
   ========================================================================= */
const SVGNS = "http://www.w3.org/2000/svg";
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const C = {
  bg:'#0a0b0d', panel:'#12151a', grid:'#1c2026', grid2:'#242932',
  text:'#eef1f3', dim:'#8b93a1', dim2:'#5b6472',
  blue:'#6fa8dc', amber:'#d9a066', rose:'#c97b91', green:'#7fb88f', violet:'#9a8fc4', red:'#c9706f', gray:'#556070'
};
const PALETTE = [C.blue, C.amber, C.rose, C.green, C.violet, C.red];

function E(tag, attrs={}, parent){
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) if(attrs[k]!==undefined) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}
function clear(el){ while(el.firstChild) el.removeChild(el.firstChild); }

const Ease = {
  linear: t=>t,
  outCubic: t=>1-Math.pow(1-t,3),
  inCubic: t=>t*t*t,
  inOutCubic: t=> t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2,
  outQuad: t=>1-(1-t)*(1-t),
  outBack: t=>{const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
  outElastic: t=>{const c4=(2*Math.PI)/3.4; return t===0?0:t===1?1:Math.pow(2,-9*t)*Math.sin((t*10-0.75)*c4)+1;}
};

let CURRENT_TOKEN = 0;

function animate(opts){
  const {delay=0, easing=Ease.inOutCubic, onUpdate, onComplete} = opts;
  const duration = REDUCED ? 1 : (opts.duration || 700);
  const token = CURRENT_TOKEN;
  return new Promise(resolve=>{
    setTimeout(()=>{
      if(token!==CURRENT_TOKEN) return resolve();
      let start=null;
      function frame(ts){
        if(token!==CURRENT_TOKEN) return resolve();
        if(start===null) start=ts;
        const t=Math.min((ts-start)/duration,1);
        onUpdate(easing(t));
        if(t<1){ requestAnimationFrame(frame); } else { onComplete&&onComplete(); resolve(); }
      }
      requestAnimationFrame(frame);
    }, REDUCED?0:delay);
  });
}
function wait(ms){ return new Promise(resolve=> setTimeout(resolve, REDUCED?0:ms)); }

function tweenAttr(el, to, opts={}){
  const from={};
  for(const k in to) from[k]=parseFloat(el.getAttribute(k))||0;
  return animate({...opts, onUpdate:(t)=>{ for(const k in to) el.setAttribute(k, (from[k]+(to[k]-from[k])*t).toFixed(3)); }});
}
function fadeIn(el, opts={}){ el.setAttribute('opacity',0); return tweenAttr(el,{opacity:1}, opts); }
function fadeOut(el, opts={}){ return tweenAttr(el,{opacity:0}, opts); }

function riseInY(el, attrY, opts={}){
  const target = parseFloat(el.getAttribute(attrY));
  const dy = opts.dy ?? 14;
  el.setAttribute(attrY, target+dy);
  el.setAttribute('opacity',0);
  return animate({...opts, onUpdate:(t)=>{
    el.setAttribute(attrY, target+dy*(1-t));
    el.setAttribute('opacity', (opts.maxOpacity??1)*t);
  }});
}

function drawOn(el, opts={}){
  let len=140;
  try{ len = el.getTotalLength(); }catch(e){}
  el.setAttribute('stroke-dasharray', len);
  el.setAttribute('stroke-dashoffset', len);
  el.setAttribute('opacity', opts.opacity ?? 1);
  return tweenAttr(el, {'stroke-dashoffset':0}, opts);
}

function moveXY(el, ax, ay, x1, y1, opts={}){
  const x0=parseFloat(el.getAttribute(ax)), y0=parseFloat(el.getAttribute(ay));
  return animate({...opts, onUpdate:(t)=>{
    el.setAttribute(ax, (x0+(x1-x0)*t).toFixed(2));
    el.setAttribute(ay, (y0+(y1-y0)*t).toFixed(2));
  }});
}

function pseudo(n){ const x=Math.sin(n*12.9898)*43758.5453123; return x-Math.floor(x); }

function T(parent, x, y, str, opts={}){
  const t = E('text', {x, y, fill: opts.fill||C.text, 'font-family': opts.font||"'Inter',sans-serif",
    'font-size': opts.size||18, 'font-weight': opts.weight||400, 'letter-spacing': opts.ls||'0px',
    'text-anchor': opts.anchor||'start', 'font-style': opts.italic?'italic':'normal'}, parent);
  t.textContent = str;
  return t;
}

/* mathLine: builds a styled equation from parts; returns the <text> el with
   el.parts[i] = the tspan for parts[i], so callers can highlight a specific term. */
function mathLine(parent, x, y, parts, opts={}){
  const g = E('text', {x,y, fill:opts.fill||C.text, 'font-family':"'Fraunces',Georgia,serif", 'font-size':opts.size||24, 'font-style':'italic', 'text-anchor':opts.anchor||'start'}, parent);
  const tspans=[];
  parts.forEach(p=>{
    const ts = E('tspan', {}, g);
    ts.textContent = p.s;
    if(p.t==='sub'){ ts.setAttribute('baseline-shift','-28%'); ts.setAttribute('font-size','66%'); ts.setAttribute('font-style','italic'); }
    else if(p.t==='sup'){ ts.setAttribute('baseline-shift','42%'); ts.setAttribute('font-size','62%'); ts.setAttribute('font-style','italic'); }
    else if(p.t==='rm'){ ts.setAttribute('font-style','normal'); }
    else if(p.t==='dim'){ ts.setAttribute('fill',C.dim); ts.setAttribute('font-style','normal'); ts.setAttribute('font-family',"'Inter',sans-serif"); }
    if(p.fill) ts.setAttribute('fill', p.fill);
    tspans.push(ts);
  });
  g.parts = tspans;
  return g;
}

function boxHighlight(el, color, pad){
  pad = pad ?? 7;
  let b;
  try{ b = el.getBBox(); }catch(e){ b = {x:0,y:-14,width:20,height:18}; }
  const r = E('rect', {x:b.x-pad, y:b.y-pad, width:b.width+2*pad, height:b.height+2*pad, rx:7,
    fill:'none', stroke:color, 'stroke-width':2, opacity:0}, el.parentNode);
  return r;
}
async function flash(el, color, opts={}){
  const r = boxHighlight(el, color, opts.pad);
  await tweenAttr(r, {opacity:.9}, {duration:250});
  if(opts.hold!==0) await wait(opts.hold ?? 550);
  if(opts.keep) return r;
  await fadeOut(r, {duration:250});
  r.remove();
  return null;
}

async function header(g, kicker, title){
  const k = T(g, 90, 62, kicker.toUpperCase(), {fill:C.dim2, size:12.5, weight:600, ls:'2.6px'});
  const ti = T(g, 88, 108, title, {fill:C.text, size:36, weight:600, font:"'Fraunces',serif"});
  const rule = E('line', {x1:90,y1:130,x2:90,y2:130, stroke:C.violet, 'stroke-width':3, 'stroke-linecap':'round', opacity:.85}, g);
  fadeIn(k,{duration:380});
  await riseInY(ti,'y',{duration:520, dy:16, easing:Ease.outCubic});
  await tweenAttr(rule, {x2:154}, {duration:420, easing:Ease.outCubic});
}
function caption(g, x, y, str, opts={}){ return T(g, x, y, str, {fill:C.dim, size:15.5, ...opts}); }
function note(g, x, y, str, opts={}){ return T(g, x, y, str, {fill:C.dim2, size:13, italic:true, ...opts}); }
function footnote(g, x, y, str){
  const t = E('text', {x,y, fill:C.dim2, 'font-family':"'Inter',sans-serif",'font-size':13.5}, g);
  t.textContent = str; return t;
}
function stepTag(g, x, y, n, color){
  const grp = E('g', {opacity:0}, g);
  E('circle', {cx:x, cy:y-6, r:11, fill:'none', stroke:color, 'stroke-width':1.6}, grp);
  T(grp, x, y-1, String(n), {fill:color, size:12.5, weight:700, anchor:'middle', font:"'JetBrains Mono',monospace"});
  return grp;
}

/* shape helpers ---------------------------------------------------------- */
function dot(parent, x, y, r, color, opts={}){
  return E('circle', {cx:x, cy:y, r, fill:color, opacity:opts.opacity??0, stroke:opts.stroke||'none', 'stroke-width':opts.sw||0}, parent);
}
function ring(parent, x, y, r, color, opts={}){
  return E('circle', {cx:x, cy:y, r, fill:'none', stroke:color, 'stroke-width':opts.sw||1.4, opacity:opts.opacity??0, 'stroke-dasharray':opts.dash||''}, parent);
}
function panel(parent, x, y, w, h, opts={}){
  return E('rect', {x,y,width:w,height:h, rx:opts.rx??12, fill:opts.fill||C.panel, stroke:opts.stroke||C.grid, 'stroke-width':opts.sw||1, opacity:opts.opacity??0}, parent);
}
function arrow(parent, x1,y1,x2,y2, color, opts={}){
  const g = E('g', {opacity:opts.opacity??1}, parent);
  E('line', {x1,y1,x2,y2, stroke:color, 'stroke-width':opts.sw||1.8}, g);
  const ang = Math.atan2(y2-y1, x2-x1);
  const ah = 8;
  const p1 = [x2-ah*Math.cos(ang-0.4), y2-ah*Math.sin(ang-0.4)];
  const p2 = [x2-ah*Math.cos(ang+0.4), y2-ah*Math.sin(ang+0.4)];
  E('path', {d:`M ${x2} ${y2} L ${p1[0]} ${p1[1]} M ${x2} ${y2} L ${p2[0]} ${p2[1]}`, stroke:color, 'stroke-width':opts.sw||1.8, 'stroke-linecap':'round'}, g);
  return g;
}
function scatterBlob(cx, cy, n, spread, seed=0){
  const pts=[];
  for(let i=0;i<n;i++){
    const a = pseudo(i*1.37+seed)*Math.PI*2;
    const r = spread*Math.sqrt(pseudo(i*7.13+seed+1));
    pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r*0.82]);
  }
  return pts;
}
function mean(pts){ let sx=0,sy=0; pts.forEach(p=>{sx+=p[0];sy+=p[1];}); return [sx/pts.length, sy/pts.length]; }
function dist(a,b){ return Math.hypot(a[0]-b[0], a[1]-b[1]); }

/* =========================================================================
   SLIDES
   ========================================================================= */
const SLIDES = [];

/* ---------- 1. TITLE ---------- */
SLIDES.push({ label:"Title", async build(g){
  const eyebrow = T(g, 640, 210, "FOR BEGINNERS · EVERY FORMULA DERIVED, NOT JUST STATED", {fill:C.dim2, size:13, weight:600, ls:'2.6px', anchor:'middle'});
  fadeIn(eyebrow, {duration:500});

  const t1 = T(g, 640, 300, "The Math Behind", {fill:C.text, size:56, weight:600, font:"'Fraunces',serif", anchor:'middle'});
  const t2 = T(g, 640, 372, "Unsupervised Learning", {fill:C.violet, size:56, weight:600, font:"'Fraunces',serif", anchor:'middle', italic:true});
  await riseInY(t1,'y',{duration:600, dy:20, easing:Ease.outCubic});
  await riseInY(t2,'y',{duration:600, dy:20, easing:Ease.outCubic, delay:60});

  const sub = T(g, 640, 415, "Built from first principles — one algebra step at a time.", {fill:C.dim, size:17, anchor:'middle'});
  fadeIn(sub, {duration:600, delay:150});
  await wait(500);

  // small live demo: a parabola with a ball settling at the minimum — teaser for the whole deck's method
  const ax0=440, ax1=840, ay=560, amp=110;
  E('line', {x1:ax0, y1:ay, x2:ax1, y2:ay, stroke:C.grid2, 'stroke-width':1.2}, g);
  const N=60; let d='M '+ax0+' '+ay;
  for(let i=1;i<=N;i++){
    const t=i/N, x=ax0+t*(ax1-ax0);
    const xn=(t-0.5)*2;
    const y=ay-amp*(1-xn*xn);
    d+= ' L '+x+' '+y;
  }
  const curve = E('path', {d, fill:'none', stroke:C.violet, 'stroke-width':2, opacity:0}, g);
  await tweenAttr(curve, {opacity:.85}, {duration:300});
  await drawOn(curve, {duration:700, easing:Ease.outCubic});
  const ball = dot(g, ax0, ay, 7, C.amber, {opacity:1});
  const cx=(ax0+ax1)/2;
  await moveXY(ball, 'cx','cy', ax0+30, ay-14, {duration:1});
  await animate({duration:1100, easing:Ease.outElastic, onUpdate:(t)=>{
    const x = ax0+30 + (cx-30-ax0)*t;
    const xn = ((x-ax0)/(ax1-ax0)-0.5)*2;
    const y = ay-amp*(1-xn*xn);
    ball.setAttribute('cx', x); ball.setAttribute('cy', y);
  }});
  note(g, cx, ay+40, "minimum = where the slope is exactly zero — the idea behind almost everything ahead", {anchor:'middle', size:13});
}});

/* ---------- 2. WHAT IS A DATA POINT ---------- */
SLIDES.push({ label:"What is a data point?", async build(g){
  await header(g, "Building block 1", "What is a Data Point?");
  await wait(80);

  const ox=320, oy=520, scale=60;
  E('line', {x1:ox-40, y1:oy, x2:ox+360, y2:oy, stroke:C.grid2, 'stroke-width':1.2}, g);
  E('line', {x1:ox, y1:oy+40, x2:ox, y2:oy-320, stroke:C.grid2, 'stroke-width':1.2}, g);
  T(g, ox+368, oy+5, "x₁", {fill:C.dim2, size:14, italic:true});
  T(g, ox-14, oy-330, "x₂", {fill:C.dim2, size:14, italic:true});

  const px=3, py=4;
  const line = E('line', {x1:ox, y1:oy, x2:ox, y2:oy, stroke:C.blue, 'stroke-width':2.4, opacity:.95}, g);
  const head = E('path', {d:'M 0 0', fill:C.blue, opacity:0}, g);
  await animate({duration:700, easing:Ease.outCubic, onUpdate:(t)=>{
    const x = ox+px*scale*t, y = oy-py*scale*t;
    line.setAttribute('x2', x); line.setAttribute('y2', y);
  }});
  const ang = Math.atan2(-py, px);
  const hx=ox+px*scale, hy=oy-py*scale, ah=9;
  head.setAttribute('d', `M ${hx} ${hy} L ${hx-ah*Math.cos(ang-0.4)} ${hy-ah*Math.sin(ang-0.4)} L ${hx-ah*Math.cos(ang+0.4)} ${hy-ah*Math.sin(ang+0.4)} Z`);
  await fadeIn(head, {duration:200});

  const ptDot = dot(g, hx, hy, 5.5, C.blue, {opacity:1});
  const tag = T(g, hx+14, hy-6, "(3, 4)", {fill:C.blue, size:15, font:"'JetBrains Mono',monospace"});
  fadeIn(tag, {duration:300});
  await wait(400);

  const rows = [
    [90, 300, "A data point is just a list of numbers.", C.text],
    [90, 336, "In 2D, that list has 2 numbers: (x₁, x₂) — like the arrow you just saw.", C.dim],
    [90, 372, "In 100 dimensions, it's a list of 100 numbers. Same idea, more numbers.", C.dim],
    [90, 408, "Every formula in this deck works exactly the same way, however many numbers x has.", C.dim],
  ];
  for (const [x,y,str,fill] of rows){
    const t = T(g, x, y, str, {fill, size: fill===C.text?19:16});
    await riseInY(t, 'y', {duration:420, dy:14, easing:Ease.outCubic});
    await wait(150);
  }

  const eq = mathLine(g, 90, 500, [
    {t:'rm', s:'x = ('}, {s:'x'}, {t:'sub', s:'1'}, {t:'rm', s:', '}, {s:'x'}, {t:'sub', s:'2'}, {t:'rm', s:', … , '}, {s:'x'}, {t:'sub', s:'n'}, {t:'rm', s:')'}
  ], {size:26, fill:C.violet});
  await fadeIn(eq, {duration:500});
  note(g, 90, 528, "just a compact way to write 'a list of n numbers' — nothing more mysterious than that.");
}});

/* ---------- 3. PYTHAGOREAN THEOREM -> DISTANCE ---------- */
SLIDES.push({ label:"Pythagorean theorem → distance", async build(g){
  await header(g, "Building block 2", "Measuring Distance");
  await wait(80);

  const ax=180, ay=560, bx=460, by=560, cx=460, cy=320;
  // right triangle
  const l1 = E('line', {x1:ax,y1:ay,x2:ax,y2:ay, stroke:C.text, 'stroke-width':2}, g);
  const l2 = E('line', {x1:bx,y1:by,x2:bx,y2:by, stroke:C.text, 'stroke-width':2}, g);
  const l3 = E('line', {x1:ax,y1:ay,x2:ax,y2:ay, stroke:C.amber, 'stroke-width':2.4}, g);
  await tweenAttr(l1, {x2:bx,y2:by}, {duration:450});
  await tweenAttr(l2, {x2:cx,y2:cy}, {duration:450});
  await tweenAttr(l3, {x2:cx,y2:cy}, {duration:550});
  E('path', {d:`M ${bx-16} ${by} L ${bx-16} ${by-16} L ${bx} ${by-16}`, fill:'none', stroke:C.dim2, 'stroke-width':1.4}, g);
  T(g, (ax+bx)/2, ay+26, "a", {fill:C.dim, size:16, italic:true, anchor:'middle'});
  T(g, bx+16, (by+cy)/2, "b", {fill:C.dim, size:16, italic:true, anchor:'middle'});
  T(g, (ax+cx)/2-22, (ay+cy)/2-14, "c", {fill:C.amber, size:17, italic:true, anchor:'middle'});
  await wait(400);

  // squares on each side (classic visual proof motif)
  const sq1 = E('rect', {x:ax, y:ay, width:bx-ax, height:36, fill:C.blue, 'fill-opacity':0.18, stroke:C.blue, 'stroke-width':1.2, opacity:0}, g);
  const sq2 = E('rect', {x:bx, y:cy, width:36, height:by-cy, fill:C.rose, 'fill-opacity':0.18, stroke:C.rose, 'stroke-width':1.2, opacity:0}, g);
  await Promise.all([tweenAttr(sq1,{opacity:1},{duration:350}), tweenAttr(sq2,{opacity:1},{duration:350})]);
  await wait(500);

  caption(g, 700, 220, "Pythagorean theorem:", {size:14.5, fill:C.dim2});

/* ---------- 4. WHAT DOES MINIMIZE MEAN ---------- */
SLIDES.push({ label:"What does \"minimize\" mean?", async build(g){
  await header(g, "Building block 3", 'What Does "Minimize" Mean?');
  await wait(80);

  const ax0=140, ax1=760, ay=560, amp=280;
  E('line', {x1:ax0,y1:ay,x2:ax1,y2:ay, stroke:C.grid2, 'stroke-width':1.2}, g);
  function fx(xn){ return amp*xn*xn; }              // f(x) = (x-3)^2 in normalized coords
  function fpx(xn){ return 2*amp*xn/ ((ax1-ax0)/2); } // slope scaled to pixel space (approx, for visual tangent)
  const N=80; let d='M '+ax0+' '+(ay-amp);
  for(let i=0;i<=N;i++){
    const t=i/N, xn=(t-0.5)*2;
    const x=ax0+t*(ax1-ax0), y=ay-fx(xn)*0.0;
  }
  d=''; const pts=[];
  for(let i=0;i<=N;i++){
    const t=i/N, xn=(t-0.5)*2;
    const x=ax0+t*(ax1-ax0);
    const y=ay - (amp - fx(xn));
    pts.push([x,y]);
    d += (i===0?'M ':'L ')+x+' '+y;
  }
  const curve = E('path', {d, fill:'none', stroke:C.blue, 'stroke-width':2.2, opacity:0}, g);
  await tweenAttr(curve,{opacity:.9},{duration:300});
  await drawOn(curve, {duration:750, easing:Ease.outCubic});
  T(g, (ax0+ax1)/2, ay+34, "x", {fill:C.dim2, size:14, italic:true, anchor:'middle'});
  T(g, ax0-16, ay-amp-10, "f(x)", {fill:C.dim2, size:13, italic:true});

  const minX=(ax0+ax1)/2, minY=ay-amp;
  const ball = dot(g, ax0, ay, 7, C.amber, {opacity:1});
  const tangent = E('line', {x1:0,y1:0,x2:0,y2:0, stroke:C.rose, 'stroke-width':1.8, opacity:0}, g);

  const steps=40;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const xn=(t-0.5)*2;
    const x=ax0+t*(ax1-ax0);
    const y=ay-(amp-fx(xn));
    ball.setAttribute('cx',x); ball.setAttribute('cy',y);
    const slope = (2*amp*xn) / ((ax1-ax0)/2);         // d/dx of the parabola, in pixel terms
    const len=70;
    const norm = Math.sqrt(1+slope*slope);
    tangent.setAttribute('opacity', 0.9);
    tangent.setAttribute('x1', x-len/norm); tangent.setAttribute('y1', y+len*slope/norm);
    tangent.setAttribute('x2', x+len/norm); tangent.setAttribute('y2', y-len*slope/norm);
    await wait(18);
  }
  await flash(tangent, C.rose, {hold:700});
  note(g, minX, minY-70, "flat tangent = zero slope = the minimum", {anchor:'middle', size:13.5, fill:C.rose});
  await wait(300);

  const rows = [
    mathLine(g, 820, 210, [{s:'f'},{t:'rm',s:'('},{s:'x'},{t:'rm',s:') = ('},{s:'x'},{t:'rm',s:' − 3)²'}], {size:22}),
    mathLine(g, 820, 254, [{s:'f'},{t:'sup',s:"'"},{t:'rm',s:'('},{s:'x'},{t:'rm',s:') = 2('},{s:'x'},{t:'rm',s:' − 3)      '},{t:'dim',s:'← the slope, at any x'}], {size:20}),
    mathLine(g, 820, 298, [{t:'rm',s:'set slope = 0:   2('},{s:'x'},{t:'rm',s:' − 3) = 0'}], {size:20}),
    mathLine(g, 820, 342, [{t:'rm',s:'solve:   '},{s:'x'},{t:'rm',s:' = 3    '},{t:'dim',s:'← the minimum'}], {size:20, fill:C.amber}),
  ];
  for(const r of rows){ await fadeIn(r,{duration:400}); await wait(280); }
  await flash(rows[3], C.amber);

  caption(g, 820, 400, "This exact trick — take the slope, set it to zero, solve —", {size:14.5});
  caption(g, 820, 424, "is how we'll derive nearly every formula in this deck.", {size:14.5});
}});

/* ---------- 5. WHY THE MEAN MINIMIZES SQUARED ERROR ---------- */
SLIDES.push({ label:"Why the mean minimizes squared error", async build(g){
  await header(g, "Core derivation", "Why the Mean Minimizes Squared Error");
  await wait(80);

  const ax0=120, ax1=560, ay=270;
  E('line', {x1:ax0,y1:ay,x2:ax1,y2:ay, stroke:C.grid2, 'stroke-width':1.4}, g);
  const xs=[0.15,0.35,0.42,0.6,0.8];
  const pts = xs.map(f=> ax0+f*(ax1-ax0));
  const dots = pts.map(x=> dot(g, x, ay, 5, C.blue, {opacity:0}));
  await Promise.all(dots.map((d,i)=> tweenAttr(d,{opacity:1},{duration:300, delay:i*70})));
  const trueMean = pts.reduce((a,b)=>a+b,0)/pts.length;

  const slider = dot(g, ax0, ay, 8, C.amber, {opacity:1});
  T(g, ax0-2, ay+34, "μ", {fill:C.amber, size:15, italic:true, anchor:'middle', font:"'Fraunces',serif"});
  const muLabel = T(g, ax0, ay+34, "μ", {fill:C.amber, size:15, italic:true, anchor:'middle', font:"'Fraunces',serif"});

  // little cost curve below, built live as mu sweeps
  const cx0=120, cx1=560, cy0=420, ch=150;
  E('line', {x1:cx0,y1:cy0,x2:cx1,y2:cy0, stroke:C.grid2, 'stroke-width':1.2}, g);
  T(g, cx0-16, cy0-ch-10, "cost", {fill:C.dim2, size:12.5});
  T(g, (cx0+cx1)/2, cy0+28, "μ", {fill:C.dim2, size:13, italic:true, anchor:'middle'});
  const costPath = E('path', {d:'M '+cx0+' '+cy0, fill:'none', stroke:C.rose, 'stroke-width':2, opacity:.9}, g);
  function costAt(muPix){
    return pts.reduce((s,p)=> s + Math.pow((p-muPix)/40, 2), 0);
  }
  const maxCost = Math.max(...pts.map(p=>costAt(ax0)), costAt(ax1));
  let d='M '+cx0+' '+cy0;
  const steps=50;
  for(let i=0;i<=steps;i++){
    const t=i/steps, muPix = ax0+t*(ax1-ax0);
    const c = costAt(muPix);
    const y = cy0 - (c/maxCost)*ch;
    d += ' L '+ (cx0+t*(cx1-cx0)) +' '+y;
    slider.setAttribute('cx', muPix); slider.setAttribute('cy', ay); muLabel.setAttribute('x', muPix);
    costPath.setAttribute('d', d);
    await wait(14);
  }
  const meanPix = trueMean;
  const meanCostY = cy0 - (costAt(meanPix)/maxCost)*ch;
  const meanMarker = dot(g, cx0+((meanPix-ax0)/(ax1-ax0))*(cx1-cx0), meanCostY, 5, C.green, {opacity:0});
  await tweenAttr(meanMarker, {opacity:1}, {duration:300, easing:Ease.outBack});
  await moveXY(slider, 'cx','cy', meanPix, ay, {duration:500, easing:Ease.outCubic});
  muLabel.setAttribute('x', meanPix);
  note(g, (cx0+cx1)/2, cy0+50, "the cost curve bottoms out exactly at the average", {anchor:'middle', size:13});
  await wait(500);

  const steps2 = [
    mathLine(g, 660, 210, [{s:'f'},{t:'rm',s:'('},{s:'μ'},{t:'rm',s:') = Σ ('},{s:'x'},{t:'sub',s:'i'},{t:'rm',s:' − '},{s:'μ'},{t:'rm',s:')²      '},{t:'dim',s:'← total squared error'}], {size:19}),
    mathLine(g, 660, 254, [{s:'f'},{t:'sup',s:"'"},{t:'rm',s:'('},{s:'μ'},{t:'rm',s:') = −2 Σ ('},{s:'x'},{t:'sub',s:'i'},{t:'rm',s:' − '},{s:'μ'},{t:'rm',s:')      '},{t:'dim',s:'← differentiate each term'}], {size:19}),
    mathLine(g, 660, 298, [{t:'rm',s:'set to 0:   −2 Σ ('},{s:'x'},{t:'sub',s:'i'},{t:'rm',s:' − '},{s:'μ'},{t:'rm',s:') = 0'}], {size:19}),
    mathLine(g, 660, 342, [{t:'rm',s:'divide by −2:   Σ '},{s:'x'},{t:'sub',s:'i'},{t:'rm',s:' − '},{s:'n'},{s:'μ'},{t:'rm',s:' = 0'}], {size:19}),
    mathLine(g, 660, 386, [{t:'rm',s:'solve:   '},{s:'μ'},{t:'rm',s:' = (1/'},{s:'n'},{t:'rm',s:') Σ '},{s:'x'},{t:'sub',s:'i'},{t:'rm',s:'      '},{t:'dim',s:'← the average!'}], {size:20, fill:C.amber}),
  ];
  for(const s of steps2){ await fadeIn(s,{duration:400}); await wait(260); }
  await flash(steps2[4], C.amber, {hold:700});

  caption(g, 660, 440, "The number that minimizes total squared distance is exactly the mean.", {size:15});
  caption(g, 660, 464, "This is why K-Means moves each centroid to the average of its group.", {size:15});
}});

/* ---------- 16. BUILDING THE GAUSSIAN FORMULA ---------- */
SLIDES.push({ label:"Building the Gaussian formula from scratch", async build(g){
  await header(g, "Building it piece by piece", "The Gaussian Formula, From Scratch");
  await wait(80);

  const ax0=140, ax1=760, ay=560, unit=90;
  E('line', {x1:ax0,y1:ay,x2:ax1,y2:ay, stroke:C.grid2, 'stroke-width':1.2}, g);
  T(g, (ax0+ax1)/2, ay+30, "x", {fill:C.dim2, size:13, italic:true, anchor:'middle'});
  const cx=(ax0+ax1)/2;

  function curveFor(mu, sigma, h){
    const N=80; let d='';
    for(let i=0;i<=N;i++){
      const t=i/N, x=ax0+t*(ax1-ax0);
      const xv=(x-cx)/unit;
      const y=ay-h*Math.exp(-Math.pow(xv-mu,2)/(2*sigma*sigma));
      d += (i===0?'M ':'L ')+x+' '+y;
    }
    return d;
  }

  const path = E('path', {d:curveFor(0,1,0), fill:'none', stroke:C.blue, 'stroke-width':2.4, opacity:.95}, g);
  const stepLabel = T(g, cx, 210, "step 1:  y = e^(−x²)", {fill:C.blue, size:19, anchor:'middle', font:"'JetBrains Mono',monospace"});
  note(g, cx, 234, "squaring makes it symmetric & always positive — negative errors count the same as positive ones", {anchor:'middle', size:13});
  await animate({duration:800, easing:Ease.outCubic, onUpdate:(t)=>{ path.setAttribute('d', curveFor(0,1,180*t)); }});
  await wait(700);

  stepLabel.textContent = "step 2:  y = e^(−x²/2σ²)  — control the width";
  note(g, cx, 234, "σ (sigma) scales the spread — bigger σ = wider, flatter bump", {anchor:'middle', size:13});
  await animate({duration:1000, easing:Ease.inOutCubic, onUpdate:(t)=>{
    const sigma = 1 + Math.sin(t*Math.PI*2)*0.5;
    path.setAttribute('d', curveFor(0, Math.max(sigma,0.4), 180));
  }});
  path.setAttribute('d', curveFor(0,1,180));
  await wait(500);

  stepLabel.textContent = "step 3:  y = e^(−(x−μ)²/2σ²)  — slide the center";
  note(g, cx, 234, "μ (mu) shifts the whole bump left or right", {anchor:'middle', size:13});
  await animate({duration:900, easing:Ease.inOutCubic, onUpdate:(t)=>{
    const mu = Math.sin(t*Math.PI*2)*1.4;
    path.setAttribute('d', curveFor(mu,1,180));
  }});
  path.setAttribute('d', curveFor(0,1,180));
  await wait(500);

  stepLabel.textContent = "step 4:  divide by σ√2π  — force the area to equal 1";
  note(g, cx, 234, "without this, taller/narrower bumps would have different total areas", {anchor:'middle', size:13});
  await wait(600);
  await tweenAttr(path, {opacity:.35}, {duration:300});
  const path2 = E('path', {d:curveFor(0,1,155), fill:'none', stroke:C.amber, 'stroke-width':2.4, opacity:0}, g);
  await tweenAttr(path2, {opacity:1}, {duration:400});
  note(g, cx, 590, "normalized — now the shaded area underneath equals exactly 1", {anchor:'middle', size:13, fill:C.amber});
  await wait(600);

  const finalEq = mathLine(g, 850, 320, [
    {s:'f'},{t:'rm',s:'('},{s:'x'},{t:'rm',s:') = '},
  ], {size:22, fill:C.violet});
  const finalEq2 = mathLine(g, 850, 360, [
    {t:'rm',s:'1 / ('},{s:'σ'},{t:'rm',s:'√2π)  ·  exp(−('},{s:'x'},{t:'rm',s:'−'},{s:'μ'},{t:'rm',s:')² / 2'},{s:'σ'},{t:'sup',s:'2'},{t:'rm',s:')'}
  ], {size:19, fill:C.violet});
  await fadeIn(finalEq, {duration:400});
  await fadeIn(finalEq2, {duration:400});
  await flash(finalEq2, C.violet, {hold:600});
  footnote(g, 850, 420, "four pieces, four jobs: shape · width · center · valid area.");
}});

  await wait(500);

  caption(g, 90, 290, "Apply Bayes' theorem from the last slide, with A = \"cluster k\" and B = \"x\":", {size:15});
  await wait(400);

  const bayes = mathLine(g, 90, 340, [
    {s:'P'},{t:'rm',s:'('},{s:'k'},{t:'rm',s:'|'},{s:'x'},{t:'rm',s:') = P('},{s:'x'},{t:'rm',s:'|'},{s:'k'},{t:'rm',s:')·P('},{s:'k'},{t:'rm',s:') / P('},{s:'x'},{t:'rm',s:')'}

}});

/* =========================================================================
   PLAYER
   ========================================================================= */
const stage = document.getElementById('stage');
const mainG = E('g', {}, stage);
let idx = 0;

function updateChrome(){
  document.getElementById('counter').textContent = String(idx+1).padStart(2,'0') + ' / ' + SLIDES.length;
  document.getElementById('slideLabel').textContent = SLIDES[idx].label;
  document.getElementById('barFill').style.width = ((idx+1)/SLIDES.length*100) + '%';
  document.getElementById('prevBtn').style.opacity = idx===0 ? 0.35 : 1;
  document.getElementById('nextBtn').style.opacity = idx===SLIDES.length-1 ? 0.35 : 1;
}

function goTo(i, replay){
  if(i<0 || i>=SLIDES.length) return;
  if(i===idx && !replay) return;
  idx=i;
  CURRENT_TOKEN++;
  clear(mainG);
  updateChrome();
  Promise.resolve().then(()=> SLIDES[idx].build(mainG)).catch(err=> console.error(err));
}

document.getElementById('nextBtn').addEventListener('click', ()=> goTo(idx+1));
document.getElementById('prevBtn').addEventListener('click', ()=> goTo(idx-1));
document.getElementById('replayBtn').addEventListener('click', ()=> goTo(idx, true));

window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); goTo(idx+1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); goTo(idx-1); }
  else if(e.key==='r' || e.key==='R'){ goTo(idx, true); }
});

goTo(0, true);
</script>
