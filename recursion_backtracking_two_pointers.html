<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recursion, Backtracking & Two Pointers</title>
<style>
  :root{
    --bg:#0a0a0f;
    --blue:#4A90C4;
    --yellow:#D4C55A;
    --green:#6BAA75;
    --red:#C4605A;
    --gray:#8A8F98;
    --text:#EDEDED;
    --caption:#9AA0A8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  #deck-scaler{
    width:1600px; height:900px;
    background:var(--bg);
    position:absolute; top:50%; left:50%;
    transform-origin:center center;
  }
  .slide{ position:absolute; inset:0; display:none; }
  .slide.active{ display:block; }

  .zone-title{
    position:absolute; top:40px; left:80px; right:80px; height:80px;
    display:flex; align-items:center;
    color:var(--text); font-size:34px; font-weight:600; letter-spacing:.3px;
  }
  .zone-title .sub{ color:var(--gray); font-size:18px; font-weight:400; margin-left:16px; }
  .zone-stage{ position:absolute; top:140px; left:80px; right:80px; height:630px; }
  .zone-caption{
    position:absolute; top:790px; left:120px; right:120px; height:90px;
    display:flex; align-items:center; justify-content:center;
    color:var(--caption); font-size:20px; line-height:1.35; text-align:center;
    white-space:normal; overflow-wrap:break-word; overflow:visible;
  }
  .capline{ opacity:0; transition:opacity .4s ease; display:inline-block; }
  .capline.show{ opacity:1; }

  .stageWrap{ position:relative; width:100%; height:100%; }
  .stageSvg{ position:absolute; inset:0; }
  .ptrHost{ position:absolute; inset:0; }

  svg text{ font-family:'Helvetica Neue',Arial,sans-serif; }
  svg rect.arr-cell, svg rect.grid-cell{ transition:fill .4s ease, stroke .4s ease; }
  svg circle.tree-node{ transition:stroke .4s ease, fill .4s ease, opacity .4s ease; }
  svg line.tree-edge{ transition:stroke .4s ease, opacity .4s ease; }
  svg .draw-in{ stroke-dasharray:var(--len); stroke-dashoffset:var(--len); }
  svg .draw-in.go{ animation:drawShape 800ms cubic-bezier(.65,0,.35,1) forwards; }
  @keyframes drawShape{ to{ stroke-dashoffset:0; } }
  .fade-el{ opacity:0; transition:opacity .5s ease, transform .5s ease; transform:translateY(6px); }
  .fade-el.show{ opacity:1; transform:translateY(0); }
  .pulse{ animation:pulse .6s ease-in-out; }
  @keyframes pulse{ 0%{transform:scale(1);} 50%{transform:scale(1.12); filter:drop-shadow(0 0 4px currentColor);} 100%{transform:scale(1);} }

  .ptr{ position:absolute; width:76px; text-align:center; opacity:0;
        transition:left .55s cubic-bezier(.65,0,.35,1), top .55s cubic-bezier(.65,0,.35,1), opacity .3s ease;
        transform:translateX(-38px); }
  .ptr.show{ opacity:1; }
  .ptr .lbl{ font-size:15px; font-weight:700; }
  .ptr .tri{ margin:3px auto 0; width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent; border-top:14px solid; }

  .badge{ position:absolute; padding:7px 16px; border:1.5px solid var(--gray); border-radius:20px;
          color:var(--text); font-size:15px; opacity:0; transition:opacity .5s ease; white-space:nowrap; }
  .badge.show{ opacity:1; }
  .badge.use{ border-color:var(--green); color:var(--green); }
  .badge.O{ border-color:var(--yellow); color:var(--yellow); font-style:italic; }

  .codeblock{ position:absolute; font-family:'SFMono-Regular',Consolas,'Courier New',monospace; font-size:19px;
              color:var(--text); line-height:1.75; white-space:pre; opacity:0; transition:opacity .4s ease; }
  .codeblock.show{ opacity:1; }
  .kw{ color:var(--blue); }
  .cm{ color:var(--gray); font-style:italic; }
  .fn{ color:var(--yellow); }

  .formula{ font-family:Georgia,'Cambria',serif; font-style:italic; color:var(--yellow); font-size:30px;
            position:absolute; opacity:0; transition:opacity .5s ease; }
  .formula.show{ opacity:1; }

  .listItem{ position:absolute; color:var(--text); font-size:23px; opacity:0;
             transition:opacity .5s ease, transform .5s ease; transform:translateX(-14px); }
  .listItem.show{ opacity:1; transform:translateX(0); }
  .listItem .n{ color:var(--blue); font-weight:700; margin-right:10px; }

  #nav{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
        display:flex; align-items:center; gap:18px; z-index:10; }
  #nav button{ background:transparent; border:1.5px solid var(--gray); color:var(--text);
               width:40px; height:40px; border-radius:50%; font-size:18px; cursor:pointer;
               display:flex; align-items:center; justify-content:center;
               transition:border-color .2s, color .2s; }
  #nav button:hover{ border-color:var(--blue); color:var(--blue); }
  #dots{ display:flex; gap:6px; flex-wrap:wrap; max-width:420px; justify-content:center; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--gray); opacity:.5;
        transition:background .2s, opacity .2s, transform .2s; }
  .dot.on{ background:var(--blue); opacity:1; transform:scale(1.3); }
  #slideCounter{ color:var(--gray); font-size:13px; letter-spacing:.5px; min-width:56px; text-align:center; }
</style>
</head>
<body>
<div id="deck-scaler"><div id="slides"></div></div>

<div id="nav">
  <button id="prevBtn" aria-label="Previous">&lsaquo;</button>
  <div id="dots"></div>
  <span id="slideCounter">1 / 1</span>
  <button id="nextBtn" aria-label="Next">&rsaquo;</button>
</div>

<script>
/* ============================== GEOMETRY HELPERS ============================== */
const NS='http://www.w3.org/2000/svg';
function ns(tag){ return document.createElementNS(NS,tag); }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function beat(fn,ms){ if(fn) fn(); return wait(ms+150); }
function clearHost(el){ while(el && el.firstChild) el.removeChild(el.firstChild); }

function mkText(x,y,str,opts={}){
  const t=ns('text'); t.setAttribute('x',x); t.setAttribute('y',y);
  t.setAttribute('text-anchor',opts.anchor||'middle');
  t.setAttribute('fill',opts.fill||'var(--text)');
  t.setAttribute('font-size',opts.size||20);
  t.setAttribute('font-weight',opts.weight||400);
  if(opts.style) t.setAttribute('font-style',opts.style);
  if(opts.cls) t.setAttribute('class',opts.cls);
  t.textContent=str;
  return t;
}
function mkRect(x,y,w,h,opts={}){
  const r=ns('rect'); r.setAttribute('x',x); r.setAttribute('y',y);
  r.setAttribute('width',w); r.setAttribute('height',h);
  r.setAttribute('rx',opts.rx!==undefined?opts.rx:8);
  r.setAttribute('fill',opts.fill||'none');
  r.setAttribute('stroke',opts.stroke||'var(--blue)');
  r.setAttribute('stroke-width',opts.sw||2.5);
  if(opts.cls) r.setAttribute('class',opts.cls);
  return r;
}
function mkLine(x1,y1,x2,y2,opts={}){
  const l=ns('line'); l.setAttribute('x1',x1); l.setAttribute('y1',y1);
  l.setAttribute('x2',x2); l.setAttribute('y2',y2);
  l.setAttribute('stroke',opts.stroke||'var(--gray)');
  l.setAttribute('stroke-width',opts.sw||2);
  if(opts.cls) l.setAttribute('class',opts.cls);
  if(opts.dash) l.setAttribute('stroke-dasharray',opts.dash);
  return l;
}
function mkCircle(cx,cy,r,opts={}){
  const c=ns('circle'); c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',r);
  c.setAttribute('fill',opts.fill||'none');
  c.setAttribute('stroke',opts.stroke||'var(--blue)');
  c.setAttribute('stroke-width',opts.sw||2.5);
  if(opts.cls) c.setAttribute('class',opts.cls);
  return c;
}
function prepDraw(el){ const len=el.getTotalLength(); el.style.setProperty('--len',len); }

function drawArray(svg, values, o={}){
  const x0=o.x0!==undefined?o.x0:200, y=o.y!==undefined?o.y:300, cw=o.cw||90, ch=o.ch||90,
        gap=o.gap!==undefined?o.gap:16, color=o.color||'var(--blue)', fontSize=o.fontSize||28;
  const cells=[];
  values.forEach((v,i)=>{
    const x=x0+i*(cw+gap);
    const rect=mkRect(x,y,cw,ch,{stroke:color,cls:'arr-cell',fill:'rgba(255,255,255,0.02)'});
    svg.appendChild(rect);
    const t=mkText(x+cw/2,y+ch/2+9,String(v),{size:fontSize});
    svg.appendChild(t);
    if(o.showIndex!==false) svg.appendChild(mkText(x+cw/2,y+ch+26,String(i),{size:15,fill:'var(--gray)'}));
    cells.push({x,y,cw,ch,cx:x+cw/2,cy:y+ch/2,rect,textEl:t,val:v});
  });
  return cells;
}
function drawGrid(svg,rows,cols,o={}){
  const x0=o.x0!==undefined?o.x0:520, y0=o.y0!==undefined?o.y0:100, cell=o.cell||100, color=o.color||'var(--gray)';
  const cells=[];
  for(let r=0;r<rows;r++){
    const row=[];
    for(let c=0;c<cols;c++){
      const x=x0+c*cell, y=y0+r*cell;
      const rect=mkRect(x,y,cell,cell,{stroke:color,rx:4,cls:'grid-cell',fill:'rgba(255,255,255,0.02)'});
      svg.appendChild(rect);
      row.push({x,y,cw:cell,ch:cell,cx:x+cell/2,cy:y+cell/2,rect,textEl:null});
    }
    cells.push(row);
  }
  return cells;
}
function setCellText(svg,cellObj,str,opts={}){
  if(cellObj.textEl){ cellObj.textEl.textContent=str; if(opts.fill) cellObj.textEl.setAttribute('fill',opts.fill); return cellObj.textEl; }
  const t=mkText(cellObj.cx,cellObj.cy+9,str,opts);
  svg.appendChild(t); cellObj.textEl=t; return t;
}
function highlight(cellObj,{stroke,fill}={}){
  if(stroke) cellObj.rect.setAttribute('stroke',stroke);
  if(fill) cellObj.rect.setAttribute('fill',fill);
}

/* pointer tokens */
function addPtr(host,label,color){
  const el=document.createElement('div'); el.className='ptr';
  const lab=document.createElement('div'); lab.className='lbl'; lab.style.color=color; lab.textContent=label;
  const tri=document.createElement('div'); tri.className='tri'; tri.style.borderTopColor=color;
  el.appendChild(lab); el.appendChild(tri);
  host.appendChild(el);
  return el;
}
function placePtr(el,cellObj,level=0,below=false){
  const totalH=20+3+14;
  el.style.left=cellObj.cx+'px';
  if(!below) el.style.top=(cellObj.y-totalH-6-level*40)+'px';
  else el.style.top=(cellObj.y+cellObj.ch+10+level*40)+'px';
  requestAnimationFrame(()=>el.classList.add('show'));
}

function animateNumber(el,from,to,ms,decimals=0){
  const t0=performance.now();
  function step(t){
    const p=Math.min(1,(t-t0)/ms);
    const val=from+(to-from)*(1-Math.pow(1-p,3));
    el.textContent=val.toFixed(decimals);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* trees */
const TREE_R=24;
function layoutTree(node,x0,x1,y,yGap,depth=0){
  node.x=(x0+x1)/2; node.y=y; node.depth=depth;
  if(node.children&&node.children.length){
    const w=(x1-x0)/node.children.length;
    node.children.forEach((c,i)=>layoutTree(c,x0+i*w,x0+(i+1)*w,y+yGap,yGap,depth+1));
  }
}
function collectNodes(node,arr){ arr=arr||[]; arr.push(node); if(node.children) node.children.forEach(c=>collectNodes(c,arr)); return arr; }
function drawTreeEdges(svg,node){
  if(node.children) node.children.forEach(c=>{
    const line=mkLine(node.x,node.y+TREE_R,c.x,c.y-TREE_R,{stroke:'var(--gray)',cls:'tree-edge'});
    svg.appendChild(line); c._edge=line;
    drawTreeEdges(svg,c);
  });
}
function drawTreeNode(svg,node,opts){
  opts=opts||{};
  const circle=mkCircle(node.x,node.y,TREE_R,{stroke:node.color||'var(--blue)',fill:'var(--bg)',cls:'tree-node'});
  svg.appendChild(circle); node._circle=circle;
  const text=mkText(node.x,node.y+5,node.label,{size:opts.fontSize||13});
  svg.appendChild(text); node._text=text;
}
function drawTreeAll(svg,root,opts){
  drawTreeEdges(svg,root);
  collectNodes(root).forEach(n=>drawTreeNode(svg,n,opts));
}

/* caption narration */
function capEl(root){ return root.querySelector('.capline'); }
async function narrateSimple(root,text,ms){
  const c=capEl(root); c.textContent=text; c.style.color='var(--caption)';
  await beat(()=>c.classList.add('show'), ms||500);
}
async function narrateRGF(root,recap,gap,fill){
  const c=capEl(root);
  c.textContent=recap; c.style.color='var(--caption)'; c.classList.add('show');
  await wait(1500);
  c.classList.remove('show'); await wait(350);
  c.textContent=gap; c.style.color='var(--yellow)'; c.classList.add('show');
  await wait(2000);
  c.classList.remove('show'); await wait(350);
  c.textContent=fill; c.style.color='var(--green)'; c.classList.add('show');
  await wait(300);
}
function resetCap(root){ const c=capEl(root); c.classList.remove('show'); c.textContent=''; }

function svgOf(root){ return root.querySelector('.stageSvg'); }
function ptrOf(root){ return root.querySelector('.ptrHost'); }
function resetStage(root){ clearHost(svgOf(root)); clearHost(ptrOf(root)); resetCap(root); }

function addBadge(root,text,x,y,cls){
  const el=document.createElement('div'); el.className='badge'+(cls?(' '+cls):'');
  el.style.left=x+'px'; el.style.top=y+'px'; el.textContent=text;
  root.querySelector('.stageWrap').appendChild(el);
  return el;
}
function addCode(root,lines,x,y,size){
  const el=document.createElement('div'); el.className='codeblock';
  el.style.left=x+'px'; el.style.top=y+'px'; if(size) el.style.fontSize=size+'px';
  el.innerHTML=lines.join('\n');
  root.querySelector('.stageWrap').appendChild(el);
  return el;
}
function addFormula(root,text,x,y,size){
  const el=document.createElement('div'); el.className='formula';
  el.style.left=x+'px'; el.style.top=y+'px'; if(size) el.style.fontSize=size+'px';
  el.textContent=text;
  root.querySelector('.stageWrap').appendChild(el);
  return el;
}
function addList(root,items,x,y0,lineH){
  lineH=lineH||44;
  const els=items.map((s,i)=>{
    const el=document.createElement('div'); el.className='listItem';
    el.style.left=x+'px'; el.style.top=(y0+i*lineH)+'px';
    el.innerHTML=s;
    root.querySelector('.stageWrap').appendChild(el);
    return el;
  });
  return els;
}

/* ============================== SLIDE MARKUP ============================== */
const slideDefs = [
  {t:"Recursion, Backtracking &amp; Two Pointers", sub:"two ways to explore a problem space"},
  {t:"Roadmap"},
  {t:"A function that calls itself"},
  {t:"Two parts, every single time"},
  {t:"Recursion branches: the recursion tree"},
  {t:"But look closer\u2026 we're repeating work"},
  {t:"Divide, conquer, combine"},
  {t:"How fast? The Master Theorem"},
  {t:"Backtracking: recursion that can undo"},
  {t:"The three-step pattern"},
  {t:"State-space search &amp; constraint satisfaction"},
  {t:"Same skeleton, many costumes"},
  {t:"Classic Backtracking Problems"},
  {t:"N-Queens: no two queens attack"},
  {t:"Sudoku: fill, check, undo"},
  {t:"Subsets: include or exclude"},
  {t:"Permutations: order matters"},
  {t:"Combinations: choose k, order doesn't"},
  {t:"Combination Sum: reuse allowed"},
  {t:"Word Search: DFS on a grid"},
  {t:"Maze: find a path, or prove there isn't one"},
  {t:"Partitioning: every piece must be valid"},
  {t:"Recap: Recursion &amp; Backtracking"},
  {t:"A different kind of efficiency"},
  {t:"Opposite-direction pointers"},
  {t:"Same-direction pointers"},
  {t:"Fast &amp; slow: Floyd's tortoise and hare"},
  {t:"Partitioning: three regions, one pass"},
  {t:"Sliding window \u2014 a two-pointer subarray"},
  {t:"Common Two-Pointer Patterns"},
  {t:"Pair Sum: sorted array, target value"},
  {t:"Three Sum: fix one, two-pointer the rest"},
  {t:"Remove Duplicates: write &amp; read pointers"},
  {t:"Container With Most Water"},
  {t:"Linked-List Cycle Detection"},
  {t:"Recap: The Whole Deck"},
];
const container=document.getElementById('slides');
slideDefs.forEach((d,i)=>{
  const sec=document.createElement('section');
  sec.className='slide'; sec.dataset.slide=i;
  sec.innerHTML=`
    <div class="zone-title">${d.t}${d.sub?`<span class="sub">${d.sub}</span>`:''}</div>
    <div class="zone-stage"><div class="stageWrap">
      <svg class="stageSvg" viewBox="0 0 1440 630" width="100%" height="100%"></svg>
      <div class="ptrHost"></div>
    </div></div>
    <div class="zone-caption"><span class="capline"></span></div>`;
  container.appendChild(sec);
});

/* ============================== SCENES ============================== */
const scenes = {};

/* ---------- 0: Title ---------- */
scenes[0] = {
  enter: async (root) => {
    const svg=svgOf(root);
    // nested self-similar squares (recursion = self-similarity)
    const sizes=[420,300,190,110,55];
    const cx=560, cy=330;
    const rects=sizes.map((s,i)=>{
      const r=mkRect(cx-s/2,cy-s/2,s,s,{stroke:i%2? 'var(--blue)':'var(--green)', rx:14, cls:'draw-in'});
      svg.appendChild(r); return r;
    });
    for(const r of rects){ prepDraw(r); await beat(()=>r.classList.add('go'),500); }
    // arrow pair -> two pointers hint
    const l1=mkLine(1020,260,1180,260,{stroke:'var(--yellow)',sw:3,cls:'draw-in'});
    const l2=mkLine(1180,400,1020,400,{stroke:'var(--yellow)',sw:3,cls:'draw-in'});
    svg.appendChild(l1); svg.appendChild(l2);
    const tri1=mkText(1180,268,'\u25B6',{size:22,fill:'var(--yellow)'});
    const tri2=mkText(1020,392,'\u25C0',{size:22,fill:'var(--yellow)'});
    svg.appendChild(tri1); svg.appendChild(tri2);
    prepDraw(l1); prepDraw(l2);
    await beat(()=>{ l1.classList.add('go'); l2.classList.add('go'); },700);
    const lab=mkText(1100,340,'converge',{size:16,fill:'var(--gray)'});
    lab.classList.add('fade-el'); svg.appendChild(lab);
    await beat(()=>lab.classList.add('show'),400);
    await narrateSimple(root,"Break a big problem into smaller versions of itself \u2014 then explore it end to end.",500);
  },
  exit: (root)=> resetStage(root)
};

/* ---------- 1: Roadmap ---------- */
scenes[1] = {
  enter: async (root)=>{
    const svg=svgOf(root);
    svg.appendChild(mkRect(90,60,600,520,{stroke:'var(--blue)',rx:14}));
    svg.appendChild(mkRect(750,60,600,520,{stroke:'var(--green)',rx:14}));
    svg.appendChild(mkText(390,110,'Recursion & Backtracking',{size:23,weight:600}));
    svg.appendChild(mkText(1050,110,'Two Pointers',{size:23,weight:600}));
    const left=["Recursion trees","Divide & conquer","Backtracking template","State-space search & CSP","9 classic problems"];
    const right=["5 pointer patterns","Sliding window","Pair / Three Sum","Dedup & containers","Cycle detection"];
    const leftEls=addList(root,left.map((s,i)=>`<span class="n">${i+1}</span>${s}`),140,165,72);
    const rightEls=addList(root,right.map((s,i)=>`<span class="n">${i+1}</span>${s}`),800,165,72);
    for(const el of leftEls){ await beat(()=>el.classList.add('show'),260); }
    for(const el of rightEls){ await beat(()=>el.classList.add('show'),260); }
    await narrateSimple(root,"We'll build each idea from a concrete hook, then apply it to real problems.",500);
  },
  exit:(root)=> resetStage(root)
};

/* ---------- 2: factorial call stack ---------- */
scenes[2] = {
  enter: async (root)=>{
    const svg=svgOf(root);
    const n=4;
    const labels=[`factorial(${n})`,`factorial(${n-1})`,`factorial(${n-2})`,`factorial(${n-3})`,`factorial(0) = 1`];
    const boxW=560, boxH=64, xStep=52, yStep=100, x0=110, y0=40;
    const boxes=[], texts=[];
    for(let i=0;i<labels.length;i++){
      const x=x0+i*xStep, y=y0+i*yStep;
      const isBase=i===labels.length-1;
      const rect=mkRect(x,y,boxW,boxH,{stroke:isBase?'var(--green)':'var(--blue)',rx:8,cls:'fade-el'});
      svg.appendChild(rect);
      const t=mkText(x+24,y+boxH/2+8,labels[i],{anchor:'start',size:22,fill: isBase?'var(--green)':'var(--text)'});
      svg.appendChild(t);
      boxes.push(rect); texts.push(t);
      await beat(()=>{ rect.classList.add('show'); t.classList.add('show'); },380);
    }
    await beat(()=>{ boxes[boxes.length-1].classList.add('pulse'); },500);
    // unwind
    const results=[1,1,2,6,24];
    const mults=['','1 \u00d7 1 = 1','2 \u00d7 1 = 2','3 \u00d7 2 = 6','4 \u00d7 6 = 24'];
    for(let i=labels.length-2;i>=0;i--){
      await beat(()=>{
        texts[i].textContent=mults[i+1];
        boxes[i].setAttribute('stroke','var(--yellow)');
        boxes[i].classList.add('pulse');
      },550);
    }
    await beat(()=>{ boxes[0].setAttribute('stroke','var(--green)'); },200);
    await narrateSimple(root,"Every recursive call waits \u2014 until the base case finally gives it something to return.",500);
  },
  exit:(root)=> resetStage(root)
};

/* ---------- 3: base/recursive case ---------- */
scenes[3] = {
  enter: async (root)=>{
    const svg=svgOf(root);
    const f1=addFormula(root,"base case:  f(0) = 1",520,120,28);
    const f2=addFormula(root,"recursive case:  f(n) = n \u00d7 f(n \u2212 1)",380,220,28);
    await beat(()=>f1.classList.add('show'),500);
    await beat(()=>f2.classList.add('show'),500);
    // loop-back diagram
    const box=mkRect(560,330,320,110,{stroke:'var(--blue)',rx:10,cls:'draw-in'});
    svg.appendChild(box); prepDraw(box);
    const label=mkText(720,395,'f(n)',{size:26});
    label.classList.add('fade-el'); svg.appendChild(label);
    await beat(()=>box.classList.add('go'),700);
    await beat(()=>label.classList.add('show'),350);
    const loop=ns('path');

/* ---------- 4: fibonacci recursion tree ---------- */
function buildFibTree(n){
  if(n<=1) return {label:`fib(${n})`,color:'var(--green)',children:[]};
  const node={label:`fib(${n})`,color:'var(--blue)',children:[]};
  node.children=[buildFibTree(n-1),buildFibTree(n-2)];
  return node;
}

    const root5=buildFibTree(5);
    layoutTree(root5,60,1380,50,110);

    drawTreeEdges(svg,root5);
    all.forEach(n=>{ n._edge && (n._edge.style.opacity=0); });
    all.forEach(n=>drawTreeNode(svg,n,{fontSize:12}));
    all.forEach(n=>{ n._circle.style.opacity=0; n._text.style.opacity=0; });
    const counter=addBadge(root,'calls: 0',1180,50);
    let count=0;
    const byDepth={};
    all.forEach(n=>{ (byDepth[n.depth]=byDepth[n.depth]||[]).push(n); });
    const maxDepth=Math.max(...Object.keys(byDepth).map(Number));
    for(let d=0; d<=maxDepth; d++){
      const level=byDepth[d]||[];
      for(const n of level){
        if(n._edge) n._edge.style.opacity=1;
        n._circle.style.opacity=1; n._text.style.opacity=1;
        count++; counter.textContent='calls: '+count;
      }
      await wait(320);
    }
    await narrateSimple(root,"Each call spawns more calls \u2014 the tree's shape IS the algorithm's work.",500);
  },
  exit:(root)=>{ resetStage(root); }
};

/* ---------- 26: fast/slow Floyd ---------- */
function drawLinkedList(svg, n, cyclePoint){
  const y=340, gap=180, r=32, x0=200;
  const nodes=[];
  for(let i=0;i<n;i++){
    const x=x0+i*gap;
    const c=mkCircle(x,y,r,{stroke:'var(--blue)'});
    svg.appendChild(c);
    svg.appendChild(mkText(x,y+6,String(i),{size:18}));
    nodes.push({x,y,r,c});
  }
  for(let i=0;i<n-1;i++){
    svg.appendChild(mkLine(nodes[i].x+r,nodes[i].y,nodes[i+1].x-r,nodes[i+1].y,{stroke:'var(--gray)',sw:2}));
    const tri=mkText(nodes[i].x+r+ (gap-2*r)/2, nodes[i].y-10, '\u2192',{size:18,fill:'var(--gray)'});
    svg.appendChild(tri);
  }
  if(cyclePoint!==undefined){
    const from=nodes[n-1], to=nodes[cyclePoint];
    const path=ns('path');
    const midY=y+140;
    path.setAttribute('d',`M ${from.x},${from.y+r} C ${from.x},${midY} ${to.x},${midY} ${to.x},${to.y+r}`);
    path.setAttribute('fill','none'); path.setAttribute('stroke','var(--gray)'); path.setAttribute('stroke-width','2');
    svg.appendChild(path);
  }
  return nodes;
}

      await wait(400);
      if(cells[ri].val !== cells[wi].val){
        wi++;
        setCellText(svg,cells[wi],String(cells[ri].val),{});
        highlight(cells[wi],{stroke:'var(--blue)'});
        placePtr(w,cells[wi]);
        await wait(300);
      } else {
        highlight(cells[ri],{stroke:'var(--gray)',fill:'rgba(138,143,152,0.15)'});
      }
    }
    for(let i=wi+1;i<cells.length;i++) cells[i].rect.style.opacity=.25;
    const lbl=mkText(720,470,`new length = ${wi+1}`,{size:18,fill:'var(--yellow)'});
    lbl.classList.add('fade-el'); svg.appendChild(lbl);
    await beat(()=>lbl.classList.add('show'),400);
    await narrateSimple(root,"Overwrite in place \u2014 the array shrinks itself as 'read' finds new values.",500);
  },
  exit:(root)=> resetStage(root)
};

/* ---------- 33: container with most water ---------- */
scenes[33] = {
  enter: async (root)=>{
    const svg=svgOf(root);
    const heights=[3,7,2,6,8,4,5];
    const n=heights.length, x0=220, gap=140, baseY=560, unit=48;
    const bars=heights.map((h,i)=>{
      const x=x0+i*gap;
      const bh=h*unit;
      const r=mkRect(x-20,baseY-bh,40,bh,{stroke:'var(--blue)',rx:4});
      svg.appendChild(r);
      svg.appendChild(mkText(x,baseY+26,String(h),{size:16,fill:'var(--gray)'}));
      return {x,h,bh,r};
    });
    const ph=ptrOf(root);
    function fakeCell(b){ return {cx:b.x, y:baseY-b.bh-40, ch:0}; }
    const L=addPtr(ph,'L','var(--blue)'), R=addPtr(ph,'R','var(--green)');
    placePtr(L,fakeCell(bars[0])); placePtr(R,fakeCell(bars[n-1]));
    const status=addBadge(root,'',150,110); status.classList.add('show');
    const areaRect=mkRect(0,0,0,0,{stroke:'var(--yellow)',fill:'rgba(212,197,90,0.08)'});
    svg.insertBefore(areaRect,svg.firstChild);
    let li=0, ri=n-1, maxArea=0;
    while(li<ri){
      const h=Math.min(bars[li].h,bars[ri].h);
      const area=h*(ri-li);
      maxArea=Math.max(maxArea,area);
      areaRect.setAttribute('x',bars[li].x); areaRect.setAttribute('width',bars[ri].x-bars[li].x);
      areaRect.setAttribute('y',baseY-h*unit); areaRect.setAttribute('height',h*unit);
      status.textContent=`width=${ri-li} \u00d7 height=${h} = ${area}  (max so far: ${maxArea})`;
      await wait(650);
      if(bars[li].h < bars[ri].h){ li++; placePtr(L,fakeCell(bars[li])); } else { ri--; placePtr(R,fakeCell(bars[ri])); }
    }
    await narrateSimple(root,"Always move the shorter wall \u2014 moving the taller one can only shrink the area.",500);
  },
  exit:(root)=> resetStage(root)
};

/* ---------- 34: linked list cycle detection formalized ---------- */
scenes[34] = {
  enter: async (root)=>{
    const svg=svgOf(root);
    const nodes=drawLinkedList(svg,6,2);
    const ph=ptrOf(root);
    const slow=addPtr(ph,'slow','var(--blue)'), fast=addPtr(ph,'fast','var(--green)');
    function fakeCell(n){ return {cx:n.x, y:n.y-45, ch:90}; }
    placePtr(slow,fakeCell(nodes[0])); placePtr(fast,fakeCell(nodes[0]));
    await wait(500);
    const cyclePath=[0,1,2,3,4,5,2,3,4,5,2];
    for(let step=1; step<7; step++){
      const fastIdx = Math.min(step*2, cyclePath.length-1);
      const slowIdx = Math.min(step, cyclePath.length-1);
      placePtr(slow, fakeCell(nodes[cyclePath[slowIdx]]));
      placePtr(fast, fakeCell(nodes[cyclePath[fastIdx]]));
      await wait(500);
      if(cyclePath[slowIdx]===cyclePath[fastIdx] && step>1){
        nodes[cyclePath[slowIdx]].c.setAttribute('stroke','var(--yellow)');
        nodes[cyclePath[slowIdx]].c.classList.add('pulse');
        break;
      }
    }
    const f=addFormula(root,'time O(n), space O(1) \u2014 no hash set needed',780,560,20);
    await beat(()=>f.classList.add('show'),400);
    addBadge(root,'used in: cycle detection in graphs, resource-deadlock checks',150,120,'use').classList.add('show');
    await narrateSimple(root,"Floyd's algorithm: if a cycle exists, the fast pointer laps the slow one within it.",500);
  },
  exit:(root)=> resetStage(root)
};

/* ---------- 35: final recap ---------- */
scenes[35] = {
  enter: async (root)=>{
    const svg=svgOf(root);
    svg.appendChild(mkRect(90,60,600,540,{stroke:'var(--blue)',rx:14}));
    svg.appendChild(mkRect(750,60,600,540,{stroke:'var(--green)',rx:14}));
    svg.appendChild(mkText(390,110,'Recursion & Backtracking',{size:21,weight:600}));
    svg.appendChild(mkText(1050,110,'Two Pointers',{size:21,weight:600}));
    const left=["Recursion trees & D&C","Backtracking template","CSP framing","9 classic problems"];
    const right=["5 pointer patterns","Sliding window","Pair/Three Sum, dedup","Floyd's cycle detection"];
    const l=addList(root,left,140,170,90);
    const r=addList(root,right,800,170,90);
    for(let i=0;i<Math.max(l.length,r.length);i++){
      if(l[i]) l[i].classList.add('show');
      if(r[i]) r[i].classList.add('show');
      await wait(300);
    }
    await narrateSimple(root,"Recursion explores branching choice-spaces. Two pointers sweep linear structures in one pass \u2014 both trade brute force for structure.",700);
  },
  exit:(root)=> resetStage(root)
};

/* ============================== DECK CONTROLLER ============================== */
function fitScale(){
  const vw=(window.visualViewport && window.visualViewport.width) || window.innerWidth;
  const vh=(window.visualViewport && window.visualViewport.height) || window.innerHeight;
  const s=Math.min(vw/1600, vh/900);
  const scaler=document.getElementById('deck-scaler');
  scaler.style.transform=`translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize',fitScale);
window.addEventListener('orientationchange',fitScale);
if(window.visualViewport) window.visualViewport.addEventListener('resize',fitScale);
fitScale();

class SlideDeck{
  constructor(){
    this.slides=Array.from(document.querySelectorAll('.slide'));
    this.i=0;
    this.dotsEl=document.getElementById('dots');
    this.counterEl=document.getElementById('slideCounter');
    this.slides.forEach(()=>{ const d=document.createElement('div'); d.className='dot'; this.dotsEl.appendChild(d); });
    document.getElementById('nextBtn').onclick=()=>this.go(this.i+1);
    document.getElementById('prevBtn').onclick=()=>this.go(this.i-1);
    window.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight'||e.key===' ') this.go(this.i+1);
      if(e.key==='ArrowLeft') this.go(this.i-1);
    });
    this.show(0);
  }
  show(idx){
    this.slides.forEach((s,k)=>s.classList.toggle('active',k===idx));
    Array.from(this.dotsEl.children).forEach((d,k)=>d.classList.toggle('on',k===idx));
    this.counterEl.textContent=`${idx+1} / ${this.slides.length}`;
    const scene=scenes[idx];
    if(scene && scene.enter) scene.enter(this.slides[idx]);
  }
  go(idx){
    if(idx<0||idx>=this.slides.length) return;
    const prevScene=scenes[this.i];
    if(prevScene && prevScene.exit) prevScene.exit(this.slides[this.i]);
    this.i=idx;
    this.show(idx);
  }
}
new SlideDeck();
</script>
