<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P8.1 — Fluid Mechanics · A Feynman Walk</title>
<style>
  :root{ --bg:#07070b; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#000; overflow:hidden; font-family:Inter,system-ui,-apple-system,sans-serif; }
  #stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #wrap{ position:relative; aspect-ratio:16/9; width:min(100vw, 177.78vh); height:auto; max-height:100vh; background:var(--bg);
         box-shadow:0 0 60px rgba(0,0,0,.8); }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #ui{ position:absolute; left:0; right:0; bottom:0; height:6.5%; display:flex; align-items:center;
       justify-content:center; gap:14px; z-index:5; pointer-events:none; }
  .btn{ pointer-events:auto; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.14);
        color:#cfd3da; font-size:clamp(11px,1.35vh,16px); padding:.5em 1.1em; border-radius:999px; cursor:pointer;
        letter-spacing:.03em; transition:.18s; user-select:none; }
  .btn:hover{ background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.28); color:#fff; }
  .btn:disabled{ opacity:.25; cursor:default; }
  #dots{ display:flex; gap:5px; align-items:center; }
  .dot{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.16); transition:.25s; }
  .dot.on{ background:#7fa8d8; transform:scale(1.5); }
  #hint{ position:absolute; right:1.4%; top:2.4%; color:rgba(255,255,255,.28); font-size:clamp(9px,1.2vh,13px);
         z-index:5; letter-spacing:.04em; }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="cv" width="1280" height="720"></canvas>
    <div id="ui">
      <button class="btn" id="prev">‹ Prev</button>
      <div id="dots"></div>
      <button class="btn" id="next">Next ›</button>
      <button class="btn" id="replay">↻ Replay</button>
    </div>
    <div id="hint">← → to navigate</div>
  </div>
</div>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=1280,H=720;

/* ---------- palette (muted, low-glow) ---------- */
const BG='#07070b', INK='#e9e9ee', DIM='#828896', FAINT='#3a3e49';
const BLUE='#5f8fc4', TEAL='#4fb0a5', GOLD='#cf9f48', RED='#cc6b6b',
      GREEN='#7ba86b', VIOLET='#9a86c4', ROSE='#c77fa6';

/* ---------- math / easing ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t);};
const app=(t,s,d=0.6)=>ease((t-s)/d);            // appear 0->1 starting at s
const pulse=(T,sp=1)=>0.5+0.5*Math.sin(T*sp);

/* ---------- drawing helpers ---------- */
function txt(s,x,y,o={}){
  const {size=28,color=INK,align='center',baseline='middle',alpha=1,weight=400,italic=false,
         font='Inter,system-ui,sans-serif',ls=0}=o;
  if(alpha<=0)return;
  ctx.save();ctx.globalAlpha=clamp(alpha,0,1);ctx.fillStyle=color;
  ctx.font=`${italic?'italic ':''}${weight} ${size}px ${font}`;
  ctx.textAlign=align;ctx.textBaseline=baseline;
  if(ls){ // letter spacing
    let cx=x; const tot=[...s].reduce((a,c)=>a+ctx.measureText(c).width+ls,0)-ls;
    if(align==='center')cx=x-tot/2; if(align==='right')cx=x-tot;
    ctx.textAlign='left';
    for(const c of s){ctx.fillText(c,cx,y);cx+=ctx.measureText(c).width+ls;}
  } else ctx.fillText(s,x,y);
  ctx.restore();
}
function line(x1,y1,x2,y2,o={}){
  const {color=INK,w=2,alpha=1,dash=null,cap='round'}=o;
  if(alpha<=0)return;
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap=cap;
  if(dash)ctx.setLineDash(dash);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function arrow(x1,y1,x2,y2,o={}){
  const {color=INK,w=3,alpha=1,head=11}=o;
  if(alpha<=0)return;
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=w;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-head*Math.cos(a-0.42),y2-head*Math.sin(a-0.42));
  ctx.lineTo(x2-head*Math.cos(a+0.42),y2-head*Math.sin(a+0.42));
  ctx.closePath();ctx.fill();ctx.restore();
}
function circle(x,y,r,o={}){
  const {color=INK,alpha=1,fill=true,w=2}=o;if(alpha<=0)return;
  ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(x,y,r,0,7);
  if(fill){ctx.fillStyle=color;ctx.fill();}else{ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke();}ctx.restore();
}
function rrect(x,y,w,h,r,o={}){
  const {color=INK,alpha=1,fill=false,lw=2}=o;if(alpha<=0)return;
  ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  if(fill){ctx.fillStyle=color;ctx.fill();}else{ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.stroke();}ctx.restore();
}
function header(title,tag){
  txt('P8.1 · FLUID MECHANICS',34,40,{size:15,color:DIM,align:'left',weight:600,ls:2});
  if(tag)txt(tag,W-34,40,{size:14,color:tag.color||TEAL,align:'right',weight:600,ls:2});
  if(title)txt(title,W/2,74,{size:30,color:INK,weight:600});
}
function chip(label,x,y,col){
  ctx.save();ctx.font='700 14px Inter';const w=ctx.measureText(label).width+26;ctx.restore();
  rrect(x-w/2,y-15,w,30,15,{color:col,alpha:.16,fill:true});
  rrect(x-w/2,y-15,w,30,15,{color:col,alpha:.55,lw:1.4});
  txt(label,x,y,{size:14,color:col,weight:700,ls:2});
  return w;
}
// simple particle along polyline path fraction
function ptOnStreak(fn,f){return fn(clamp(f,0,1));}

/* ============================================================
   SLIDES  — each: {kind, draw(t,T)}   t=slide time, T=global
   ============================================================ */
const S=[];

/* 0 — TITLE */
S.push({draw(t,T){
  const a=app(t,0.1,1);
  // flowing background streamlines
  for(let i=0;i<7;i++){
    const y=170+i*55, ph=T*0.5+i;
    ctx.save();ctx.globalAlpha=.10+.05*Math.sin(ph);ctx.strokeStyle=BLUE;ctx.lineWidth=2;ctx.beginPath();
    for(let x=0;x<=W;x+=8){const yy=y+22*Math.sin(x*0.012+ph);x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy);}
    ctx.stroke();ctx.restore();
  }
  // moving particles
  for(let i=0;i<7;i++){const y=170+i*55,ph=T*0.5+i;const x=((T*120+i*180)%(W+40))-20;
    const yy=y+22*Math.sin(x*0.012+ph);circle(x,yy,3,{color:TEAL,alpha:.5});}
  txt('FLUID MECHANICS',W/2,315,{size:78,color:INK,weight:800,alpha:a,ls:2});
  txt('the physics of everything that flows',W/2,385,{size:26,color:GOLD,alpha:app(t,0.6,1),italic:true});
  txt('air over a wing · blood in an artery · oil in a pipeline · a storm on the map',
      W/2,440,{size:17,color:DIM,alpha:app(t,1.1,1)});
  txt('P8.1  ·  Applied / Engineering Physics — Tier 3',W/2,560,{size:15,color:FAINT,alpha:app(t,1.5,1),ls:3});
}});

/* 1 — WHAT IS A FLUID */
S.push({draw(t,T){
  header('What even IS a fluid?');
  // left: solid resists shear
  const sx=340,sy=380,sz=120;
  txt('SOLID',sx,220,{size:16,color:DIM,weight:700,ls:3,alpha:app(t,.2)});
  const shear=8*ease(app(t,.6,1.2)); // fixed tilt then hold
  ctx.save();ctx.globalAlpha=app(t,.3);ctx.strokeStyle=BLUE;ctx.lineWidth=2.5;ctx.beginPath();
  ctx.moveTo(sx-sz/2+shear,sy-sz/2);ctx.lineTo(sx+sz/2+shear,sy-sz/2);
  ctx.lineTo(sx+sz/2-shear,sy+sz/2);ctx.lineTo(sx-sz/2-shear,sy+sz/2);ctx.closePath();ctx.stroke();ctx.restore();
  arrow(sx-sz/2,sy-sz/2-16,sx+sz/2-6,sy-sz/2-16,{color:GOLD,alpha:app(t,.6),w:2.5});
  txt('push sideways → it strains a little, then STOPS.',sx,sy+110,{size:15,color:INK,alpha:app(t,1.3)});
  txt('it resists shear.',sx,sy+135,{size:15,color:BLUE,alpha:app(t,1.6),weight:600});
  // right: fluid keeps deforming
  const fx=940,fy=380;
  txt('FLUID',fx,220,{size:16,color:DIM,weight:700,ls:3,alpha:app(t,.2)});
  const nL=6, off=(T*40)%40;
  for(let i=0;i<nL;i++){
    const y=fy-sz/2+i*(sz/(nL-1));
    const slide=(off* (i/(nL-1))); // top layers slide more
    ctx.save();ctx.globalAlpha=.5*app(t,.9);ctx.strokeStyle=TEAL;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(fx-sz/2+slide-40,y);ctx.lineTo(fx+sz/2+slide-40,y);ctx.stroke();ctx.restore();
    // little particles
    circle(fx-sz/2+ ((T*60*(i/(nL-1)))%sz) -40 +slide%40, y,2.5,{color:TEAL,alpha:.55*app(t,.9)});
  }
  arrow(fx-sz/2-40,fy-sz/2-16,fx+sz/2-46,fy-sz/2-16,{color:GOLD,alpha:app(t,.6),w:2.5});
  txt('push sideways → it NEVER stops deforming.',fx,fy+110,{size:15,color:INK,alpha:app(t,1.3)});
  txt('it cannot resist shear — it flows.',fx,fy+135,{size:15,color:TEAL,alpha:app(t,1.6),weight:600});
  txt('That single fact — "no resistance to shear" — is the seed of this whole subject.',
      W/2,650,{size:18,color:GOLD,alpha:app(t,2.1),italic:true});
}});

/* 2 — PRESSURE & DEPTH */
S.push({draw(t,T){
  header('Fluid statics — pressure grows with depth');
  const x0=430,y0=180,w=250,h=380;
  // tank gradient
  const g=ctx.createLinearGradient(0,y0,0,y0+h);
  g.addColorStop(0,'rgba(95,143,196,.10)');g.addColorStop(1,'rgba(95,143,196,.34)');
  ctx.save();ctx.globalAlpha=app(t,.2);ctx.fillStyle=g;ctx.fillRect(x0,y0,w,h);ctx.restore();
  rrect(x0,y0,w,h,4,{color:BLUE,alpha:app(t,.2),lw:2});
  // depth marker sinking + growing pressure arrows
  const f=easeOut(app(t,.6,1.6));
  const dy=y0+ f*(h-30);
  line(x0,dy,x0+w,dy,{color:GOLD,alpha:app(t,.6)*.8,dash:[6,6]});
  const P=(dy-y0)/(h); // 0..1 depth
  for(let s=-1;s<=1;s+=2){ // arrows both walls point inward, length ~ depth
    const len=20+70*P;
    arrow(x0+(s<0?-len:w+len), dy, x0+(s<0?0:w), dy,{color:GOLD,alpha:app(t,.9),w:3});
  }
  txt('same depth ⇒ same pressure, in every direction',x0+w/2,dy-16,{size:13,color:DIM,alpha:app(t,1.2)});
  // equation panel
  const px=930;
  txt('P = P₀ + ρ g h',px,300,{size:40,color:INK,weight:700,alpha:app(t,1.4)});
  txt('ρ  density   ·   g  gravity   ·   h  depth',px,345,{size:16,color:DIM,alpha:app(t,1.7)});
  txt('Pressure doesn\u2019t care about container shape —',px,420,{size:16,color:INK,alpha:app(t,2.1),align:'center'});
  txt('only about how deep you are.',px,445,{size:16,color:BLUE,alpha:app(t,2.3),weight:600});
  chip('USE  ·  dam design · scuba limits · IV drips',px,540,ROSE);
  if(t>2.4)txt('But if pressure comes from a fluid pushing... can it push things UP?',
      W/2,655,{size:17,color:GOLD,italic:true,alpha:app(t,2.7)});
}});

/* 3 — BUOYANCY */
S.push({draw(t,T){
  header('Buoyancy — pressure difference becomes lift');
  const cx=560,cy=360+8*Math.sin(T*1.2)*ease(app(t,2.2));
  // water
  rrect(300,190,520,360,4,{color:BLUE,alpha:.14,fill:true});
  rrect(300,190,520,360,4,{color:BLUE,alpha:app(t,.15),lw:2});
  // block
  const bw=120,bh=100;
  rrect(cx-bw/2,cy-bh/2,bw,bh,6,{color:GOLD,alpha:app(t,.4)*.22,fill:true});
  rrect(cx-bw/2,cy-bh/2,bw,bh,6,{color:GOLD,alpha:app(t,.4),lw:2.5});
  // pressure arrows: bottom longer than top
  const a=app(t,.9,1.2);
  for(let i=-1;i<=1;i++){
    arrow(cx+i*35,cy-bh/2-42,cx+i*35,cy-bh/2-4,{color:TEAL,alpha:a*.8,w:2.5}); // top (small)
    arrow(cx+i*35,cy+bh/2+64,cx+i*35,cy+bh/2+4,{color:TEAL,alpha:a,w:3.4});     // bottom (big)
  }
  txt('deeper ⇒ bigger push',cx,cy+bh/2+88,{size:13,color:DIM,alpha:a});
  txt('shallower ⇒ smaller push',cx,cy-bh/2-58,{size:13,color:DIM,alpha:a});
  // net force
  arrow(cx,cy,cx,cy-140,{color:GREEN,alpha:app(t,1.9),w:5,head:16});
  txt('F',cx+22,cy-100,{size:22,color:GREEN,italic:true,alpha:app(t,2.0)});
  // panel
  txt('F_b = ρ_fluid · g · V',980,320,{size:32,color:INK,weight:700,alpha:app(t,2.2)});
  txt('“the weight of the fluid it pushes aside”',980,362,{size:16,color:GOLD,italic:true,alpha:app(t,2.4)});
  txt('— Archimedes, ~250 BC',980,388,{size:14,color:DIM,alpha:app(t,2.6)});
  chip('USE  ·  ships · submarines · hot-air balloons',980,470,ROSE);
}});

/* 4 — MANOMETRY */
S.push({draw(t,T){
  header('Manometry — reading pressure as a height');
  // U-tube
  const bx=640, top=210, bot=520, gap=150, r=40;
  ctx.save();ctx.globalAlpha=app(t,.2);ctx.strokeStyle=DIM;ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(bx-gap,top);ctx.lineTo(bx-gap,bot-r);
  ctx.arc(bx-gap+r,bot-r,r,Math.PI,Math.PI/2,true);
  ctx.lineTo(bx+gap-r,bot);
  ctx.arc(bx+gap-r,bot-r,r,Math.PI/2,0,true);
  ctx.lineTo(bx+gap,top);ctx.stroke();ctx.restore();
  // fluid levels — pressure pushes left down, right up
  const f=easeOut(app(t,.8,1.6));
  const dh=90*f;
  const lL=380+dh, lR=380-dh;
  const fluid=(yTop)=>{ctx.save();ctx.globalAlpha=app(t,.6);ctx.strokeStyle=TEAL;ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(bx-gap,Math.min(yTop,bot-r));ctx.lineTo(bx-gap,bot-r);
    ctx.arc(bx-gap+r,bot-r,r,Math.PI,Math.PI/2,true);ctx.lineTo(bx+gap-r,bot);
    ctx.arc(bx+gap-r,bot-r,r,Math.PI/2,0,true);ctx.lineTo(bx+gap,Math.max(lR,top));ctx.stroke();ctx.restore();};
  // draw both columns as fill
  ctx.save();ctx.globalAlpha=app(t,.55);ctx.strokeStyle=TEAL;ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(bx-gap,lL);ctx.lineTo(bx-gap,bot-r);
  ctx.arc(bx-gap+r,bot-r,r,Math.PI,Math.PI/2,true);ctx.lineTo(bx+gap-r,bot);
  ctx.arc(bx+gap-r,bot-r,r,Math.PI/2,0,true);ctx.lineTo(bx+gap,lR);ctx.stroke();ctx.restore();
  // pressure source arrow (left)
  arrow(bx-gap,top-46,bx-gap,top-8,{color:GOLD,alpha:app(t,.5),w:3.5});
  txt('unknown  P',bx-gap,top-62,{size:14,color:GOLD,alpha:app(t,.5)});
  txt('open',bx+gap,top-20,{size:13,color:DIM,alpha:app(t,.5)});
  // Δh bracket
  line(bx+gap+30,lR,bx+gap+30,lL,{color:INK,alpha:app(t,2.0)});
  line(bx+gap+24,lR,bx+gap+36,lR,{color:INK,alpha:app(t,2.0)});
  line(bx+gap+24,lL,bx+gap+36,lL,{color:INK,alpha:app(t,2.0)});
  txt('Δh',bx+gap+60,(lL+lR)/2,{size:22,color:INK,italic:true,alpha:app(t,2.0)});
  txt('ΔP = ρ g Δh',300,320,{size:30,color:INK,weight:700,alpha:app(t,2.2),align:'left'});
  txt('a hard-to-measure pressure',300,362,{size:15,color:DIM,alpha:app(t,2.4),align:'left'});
  txt('becomes an easy-to-read length.',300,384,{size:15,color:BLUE,alpha:app(t,2.5),align:'left',weight:600});
  chip('USE · blood pressure · gas gauges · HVAC balancing',330,470,ROSE);
}});

/* 5 — RECAP/GAP (statics -> motion) */
S.push({kind:'gap',draw(t,T){
  txt('RECAP',W/2,150,{size:15,color:TEAL,weight:800,ls:6,alpha:app(t,.1)});
  txt('Here\u2019s what we have so far.',W/2,196,{size:26,color:INK,alpha:app(t,.3)});
  // mini icon row
  const items=[['pressure',BLUE],['buoyancy',GOLD],['manometry',TEAL]];
  items.forEach((it,i)=>{const x=W/2-260+i*260; chip(it[0],x,260,it[1]);});
  txt('We can fully describe a fluid at REST.',W/2,330,{size:20,color:DIM,alpha:app(t,.9)});
  // GAP
  txt('BUT WE\u2019RE STILL MISSING SOMETHING',W/2,430,{size:16,color:RED,weight:800,ls:4,alpha:app(t,1.4)});
  const gp=app(t,1.8,1.2);
  txt('The name is “fluid mechanics.”',W/2,486,{size:24,color:INK,alpha:gp});
  txt('So far nothing has actually MOVED.',W/2,524,{size:24,color:INK,alpha:app(t,2.2)});
  const a=app(t,2.8);
  txt('What happens the instant a fluid begins to flow?',W/2,600,
      {size:26,color:GOLD,italic:true,weight:600,alpha:a*(0.7+0.3*pulse(T,2))});
}});

/* 6 — KINEMATICS / STREAMLINES (FILL) */
S.push({draw(t,T){
  header('Kinematics — the velocity field & streamlines',{color:GOLD});
  // flow around a cylinder using simple potential-ish deflection
  const cxc=560, cyc=370, R=55;
  const inflow=1;
  function vel(x,y){
    // uniform + doublet approx around cylinder
    const dx=x-cxc, dy=y-cyc, r2=dx*dx+dy*dy;
    let u=inflow, v=0;
    if(r2>1){ u += inflow*R*R*(dy*dy-dx*dx)/(r2*r2); v += -inflow*R*R*2*dx*dy/(r2*r2); }
    return [u,v];
  }
  // vector field
  const a0=app(t,.3);
  for(let x=180;x<W-260;x+=64)for(let y=150;y<560;y+=64){
    const dx=x-cxc,dy=y-cyc;if(dx*dx+dy*dy<(R+14)*(R+14))continue;
    const[u,v]=vel(x,y);const m=Math.hypot(u,v);const s=16/(m+.2)+6;
    arrow(x,y,x+u/m*18,y+v/m*18,{color:BLUE,alpha:.30*a0,w:1.6,head:5});
  }
  // cylinder
  circle(cxc,cyc,R,{color:'#0d0d14',alpha:app(t,.4),fill:true});
  circle(cxc,cyc,R,{color:INK,alpha:app(t,.4),fill:false,w:2});
  // tracer particles following field
  const N=26;
  for(let i=0;i<N;i++){
    let x=((T*140+i*820/N)%(W+120))-60; if(x<170)continue;
    let y=180+ (i%6)*62;
    // integrate a few steps for a streak
    ctx.save();ctx.globalAlpha=.7*app(t,.6);ctx.strokeStyle=TEAL;ctx.lineWidth=2.4;ctx.lineCap='round';ctx.beginPath();
    let px=x,py=y,drawn=false;
    for(let k=0;k<10;k++){const[u,v]=vel(px,py);const m=Math.hypot(u,v)||1;
      const nx=px-u/m*7, ny=py-v/m*7;
      const dd=px-cxc,de=py-cyc;if(dd*dd+de*de>R*R){k===0?ctx.moveTo(px,py):ctx.lineTo(px,py);drawn=true;}
      px=nx;py=ny;}
    ctx.stroke();ctx.restore();
    const dd=x-cxc,de=y-cyc;if(dd*dd+de*de>R*R)circle(x,y,3,{color:GOLD,alpha:.85*app(t,.6)});
  }
  // panel
  txt('velocity field  v(x, y, t)',990,300,{size:22,color:INK,weight:600,alpha:app(t,1.2)});
  txt('a streamline = the path a',990,350,{size:16,color:DIM,alpha:app(t,1.5)});
  txt('massless dot would trace.',990,372,{size:16,color:DIM,alpha:app(t,1.6)});
  txt('We stop tracking particles —',990,430,{size:16,color:GOLD,alpha:app(t,2.0)});
  txt('and describe the flow as a FIELD.',990,452,{size:16,color:GOLD,weight:600,alpha:app(t,2.1)});
  if(t>2.6)txt('If mass can\u2019t appear or vanish... what must the field obey?',
      W/2,655,{size:17,color:GOLD,italic:true,alpha:app(t,2.7)});
}});

/* 7 — CONTINUITY */
S.push({draw(t,T){

  // wake eddies
  for(let i=0;i<2;i++){const ex=bx+40+i*34, ey=by+(i%2?-16:16);

}});

/* 20 — DIMENSIONAL ANALYSIS & SIMILITUDE */
S.push({draw(t,T){
  header('Dimensional analysis — fewer numbers, same physics',{color:GOLD});
  // big plane + tiny model, same streamlines when Re matches
  function plane(cx,cy,s,a){
    ctx.save();ctx.globalAlpha=a;ctx.translate(cx,cy);ctx.scale(s,s);ctx.strokeStyle=INK;ctx.lineWidth=2/s;ctx.fillStyle='#12131b';
    ctx.beginPath();ctx.moveTo(-70,0);ctx.quadraticCurveTo(0,-14,70,0);ctx.quadraticCurveTo(0,14,-70,0);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-34,-30);ctx.lineTo(6,0);ctx.moveTo(-10,0);ctx.lineTo(-34,30);ctx.lineTo(6,0);ctx.stroke();
    ctx.restore();
  }
  function streaks(cx,cy,s,a,seed){
    for(let i=-2;i<=2;i++){const yy=cy+i*22*s;
      ctx.save();ctx.globalAlpha=.4*a;ctx.strokeStyle=TEAL;ctx.lineWidth=1.8;ctx.beginPath();
      for(let x=-120*s;x<=120*s;x+=6){const bump=Math.exp(-(((x)/(60*s))**2))*(16*s)*(i===0?0:1);
        ctx.lineTo(cx+x,yy-Math.sign(i)*bump);}ctx.stroke();ctx.restore();
      const dx=((T*120*s+i*40+seed)% (240*s))-120*s;const bump=Math.exp(-(((dx)/(60*s))**2))*(16*s)*(i===0?0:1);
      circle(cx+dx,yy-Math.sign(i)*bump,2.4*Math.max(s,.6),{color:GOLD,alpha:.8*a});}
  }
  streaks(420,300,1.0,app(t,.6),0);plane(420,300,1.0,app(t,.4));
  txt('real aircraft',420,400,{size:15,color:DIM,alpha:app(t,.8)});
  streaks(950,300,0.5,app(t,1.0),120);plane(950,300,0.5,app(t,.8));
  txt('scale model',950,370,{size:15,color:DIM,alpha:app(t,1.2)});
  // equality
  txt('=',685,300,{size:40,color:GREEN,alpha:app(t,1.5)});
  txt('SAME  Re, Ma  ⇒  SAME flow pattern',W/2,470,{size:22,color:INK,weight:600,alpha:app(t,1.8)});
  txt('Buckingham π theorem:',420,540,{size:17,color:GOLD,weight:600,alpha:app(t,2.2)});
  txt('n variables − k dimensions  →  (n−k) dimensionless groups',W/2,575,{size:18,color:INK,alpha:app(t,2.4)});
  txt('Match the dimensionless numbers, and a model on your desk mimics the real thing.',
      W/2,640,{size:16,color:GOLD,italic:true,alpha:app(t,2.8)});
  chip('USE · wind tunnels · ship-hull tanks · scaling lab experiments',W/2,682,ROSE);
}});

/* 21 — GAP (-> compressible) */
S.push({kind:'gap',draw(t,T){
  txt('RECAP',W/2,170,{size:15,color:TEAL,weight:800,ls:6,alpha:app(t,.1)});
  txt('One assumption has hidden in almost everything: density stays constant.',W/2,224,{size:21,color:INK,alpha:app(t,.3)});
  txt('BUT WE\u2019RE STILL MISSING SOMETHING',W/2,340,{size:16,color:RED,weight:800,ls:4,alpha:app(t,1.0)});

/* 22 — COMPRESSIBLE FLOW */
S.push({draw(t,T){
  header('Compressible flow — Mach, shocks & the magic nozzle',{color:GOLD});
  // converging-diverging nozzle
  const x0=260,x1=1000,yc=320;
  const th=(x0+x1)/2; // throat
  const prof=(x)=>{const f=(x-x0)/(x1-x0);
    // wide -> narrow at throat -> wide
    const w= x<th? lerp(90,30,ease((x-x0)/(th-x0))) : lerp(30,110,ease((x-th)/(x1-th)));
    return w;};
  ctx.save();ctx.globalAlpha=app(t,.3);ctx.strokeStyle=BLUE;ctx.lineWidth=2.5;
  ctx.beginPath();for(let x=x0;x<=x1;x+=5){const w=prof(x);x===x0?ctx.moveTo(x,yc-w):ctx.lineTo(x,yc-w);}ctx.stroke();
  ctx.beginPath();for(let x=x0;x<=x1;x+=5){const w=prof(x);x===x0?ctx.moveTo(x,yc+w):ctx.lineTo(x,yc+w);}ctx.stroke();ctx.restore();
  // particles: accelerate through throat, color by regime
  for(let r=-2;r<=2;r++)for(let i=0;i<8;i++){
    let x=x0+((T*180+i*230+r*20)%(x1-x0));const w=prof(x);
    const f=(x-x0)/(x1-x0); const M= x<th? lerp(0.3,1,ease((x-x0)/(th-x0))) : lerp(1,2.4,ease((x-th)/(x1-th)));
    const col= M<0.95?TEAL : (M<1.1?GOLD:RED);
    circle(x,yc+r/2.2*(w-6),2.6,{color:col,alpha:.75*app(t,.5)});
  }
  txt('subsonic  M<1',x0+110,yc+130,{size:14,color:TEAL,alpha:app(t,1.0)});
  txt('M = 1',th,yc-125,{size:15,color:GOLD,weight:700,alpha:app(t,1.2)});
  line(th,yc-100,th,yc+100,{color:GOLD,alpha:app(t,1.2)*.5,dash:[4,4]});
  txt('supersonic  M>1',x1-120,yc+150,{size:14,color:RED,alpha:app(t,1.4)});
  // shock line
  const sh=lerp(th,x1-140,0.6);
  line(sh,yc-100,sh+18,yc+100,{color:RED,alpha:app(t,2.0),w:3});
  txt('shock',sh+40,yc-90,{size:14,color:RED,weight:700,alpha:app(t,2.0)});
  txt('M = v / a   (a = speed of sound)',W/2,540,{size:26,color:INK,weight:700,alpha:app(t,1.8)});
  txt('Counter-intuitive: past Mach 1, WIDENING the pipe speeds the gas up further.',
      W/2,600,{size:16,color:GOLD,italic:true,alpha:app(t,2.4)});
  chip('USE · rocket & jet nozzles · supersonic jets · turbines',W/2,662,ROSE);
}});

/* ============================================================
   ENGINE
   ============================================================ */
let idx=0, start=performance.now();
const dotsEl=document.getElementById('dots');
S.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';dotsEl.appendChild(d);});
const dots=[...dotsEl.children];
function setDots(){dots.forEach((d,i)=>d.classList.toggle('on',i===idx));}
function go(n){idx=clamp(n,0,S.length-1);start=performance.now();setDots();
  document.getElementById('prev').disabled=idx===0;
  document.getElementById('next').disabled=idx===S.length-1;}
document.getElementById('next').onclick=()=>go(idx+1);
document.getElementById('prev').onclick=()=>go(idx-1);
document.getElementById('replay').onclick=()=>{start=performance.now();};
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')go(idx+1);
  else if(e.key==='ArrowLeft')go(idx-1);
  else if(e.key==='r'||e.key==='R')start=performance.now();
});
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();
  if((e.clientX-r.left)/r.width>0.5)go(idx+1);else go(idx-1);});

function frame(now){
  const t=(now-start)/1000, Tg=now/1000;
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  try{S[idx].draw(t,Tg);}catch(err){txt('…',W/2,H/2,{color:RED});}
  // slide transition fade-in from black
  const tr=clamp(1-t/0.4,0,1);
  if(tr>0){ctx.save();ctx.globalAlpha=tr;ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);ctx.restore();}
  requestAnimationFrame(frame);
}
setDots();go(0);requestAnimationFrame(frame);
</script>
