<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programming Fundamentals — Functions &amp; Execution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0d;
  --dot: rgba(255,255,255,.055);
  --panel:#131319;
  --panel2:#191a21;
  --line: rgba(255,255,255,.09);
  --line2: rgba(255,255,255,.15);
  --ink:#eae8e3;
  --ink-dim:#9b9aa6;
  --ink-faint:#6c6b76;
  --blue:#7fa6d6;
  --amber:#d3a663;
  --teal:#74b9ac;
  --rose:#c68894;
  --violet:#a595cf;
  --green:#84b892;
  --shadow: 0 1px 3px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{
  font-family:'Inter',sans-serif;color:var(--ink);
  background-color:var(--bg);
  background-image: radial-gradient(circle, var(--dot) 1.3px, transparent 1.3px);
  background-size: 26px 26px;
  overflow:hidden;
}
h1,h2,h3,.title,.eyebrow,.bignum{font-family:'Space Grotesk',sans-serif;}
code,pre,.mono,.code,.dcode{font-family:'JetBrains Mono',monospace;}

#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:92px;box-sizing:border-box;}
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;flex-shrink:0;}

.slide{
  position:absolute;inset:0;display:none;
  padding:0; overflow:hidden;
}
.slide.active{display:block;}

.eyebrow{
  position:absolute; left:64px; top:38px;
  font-size:13px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-faint); font-weight:600;
}
.title{
  position:absolute; left:64px; top:58px;
  font-size:34px; font-weight:600; color:var(--ink);
  margin:0; line-height:1.15; max-width:1000px;
}
.title .ul{
  display:block; height:3px; width:0; margin-top:10px;
  background: linear-gradient(90deg, var(--blue), transparent);
  transition: width .7s cubic-bezier(.2,.7,.2,1);
}
.title.drawn .ul{ width:120px; }

.bridge{
  position:absolute; left:64px; top:118px; width:1152px;
  display:flex; gap:22px; align-items:baseline; flex-wrap:wrap;
  font-size:14px;
}
.bridge .recap{ color:var(--ink-dim); }
.bridge .recap b{ color:var(--teal); font-weight:600; }
.bridge .gap{ color:var(--amber); font-style:italic; }

.content{
  position:absolute; left:64px; top:170px; width:1152px; height:415px;
}
.caption{
  position:absolute; left:64px; bottom:20px; width:1152px;
  font-size:14px; color:var(--ink-dim); border-top:1px solid var(--line); padding-top:12px;
}
.caption b{ color:var(--ink); font-weight:600; }

/* reveal system */
.rv{ opacity:0; transform:translateY(10px); transition:opacity .5s ease, transform .5s ease; }
.rv.in{ opacity:1; transform:translateY(0); }
.rv.pop{ transform:translateY(6px) scale(.9); }
.rv.pop.in{ transform:translateY(0) scale(1); }

/* grid layout for concept body */
.grid2{ display:flex; gap:40px; width:1152px; height:100%; }
.visual{
  width:560px; height:100%; position:relative;
  border:1px solid var(--line); border-radius:14px;
  background: rgba(255,255,255,.02);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.panel{ width:552px; height:100%; display:flex; flex-direction:column; gap:14px; overflow:hidden;}
.def{ font-size:16px; line-height:1.55; color:var(--ink); margin:0; }
.def b{ color:var(--blue); font-weight:600; }
.label{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; margin-bottom:6px;}
.example{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
.code{ font-size:13.5px; color:var(--green); white-space:pre-wrap; line-height:1.6; margin:0;}
.code .c1{color:var(--ink-faint);}
.code .kw{color:var(--violet);}
.code .st{color:var(--amber);}
.code .fn{color:var(--blue);}
.apply{ background:rgba(211,166,99,.06); border:1px solid rgba(211,166,99,.25); border-radius:10px; padding:12px 16px; font-size:13.5px; color:var(--ink-dim); }
.apply .tag{ color:var(--amber); font-weight:600; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.06em; margin-right:8px;}

/* nav */
#nav{
  position:fixed; left:0; right:0; bottom:0; height:92px;
  display:flex; align-items:center; justify-content:center; gap:18px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.6) 40%);
  z-index:50;
}
.navbtn{
  width:44px;height:44px;border-radius:50%; border:1px solid var(--line2);
  background:var(--panel2); color:var(--ink); font-size:18px; cursor:pointer;
  display:flex;align-items:center;justify-content:center; transition:.2s;
}
.navbtn:hover{ background:var(--panel); border-color:var(--blue); color:var(--blue); }
.navbtn:disabled{ opacity:.3; cursor:default; }
.navbtn:disabled:hover{ background:var(--panel2); border-color:var(--line2); color:var(--ink);}
#counter{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink-dim); min-width:70px; text-align:center;}
#progwrap{ position:fixed; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.06); z-index:51;}
#progbar{ height:100%; width:0%; background:linear-gradient(90deg,var(--blue),var(--teal)); transition:width .35s ease; }
#sectionlbl{ position:fixed; right:24px; bottom:32px; font-size:11px; letter-spacing:.08em; color:var(--ink-faint); font-family:'JetBrains Mono',monospace; z-index:50; text-transform:uppercase;}
#deckname{ position:fixed; left:24px; bottom:32px; font-size:12px; color:var(--ink-faint); font-family:'JetBrains Mono',monospace; letter-spacing:.05em; z-index:50;}
#collisionBadge{ position:fixed; right:24px; top:20px; font-family:'JetBrains Mono',monospace; font-size:12px; padding:6px 10px; border-radius:6px; z-index:200; display:none;}

/* small shape helpers reused across visuals */
.box{ border:1.4px solid var(--line2); border-radius:8px; background:rgba(255,255,255,.03); }
.pill{ border-radius:999px; padding:5px 14px; font-size:12.5px; font-family:'JetBrains Mono',monospace; border:1px solid var(--line2); }
.arrow{ color:var(--ink-faint); font-size:20px; }
.ring{ position:absolute; border:2px solid var(--blue); border-radius:14px; pointer-events:none; opacity:0; }
.ring.show{ animation: circ .9s cubic-bezier(.2,.7,.2,1); }
@keyframes circ{ 0%{opacity:0; transform:scale(.92);} 30%{opacity:1;} 100%{opacity:0; transform:scale(1.02);} }
.pulse.go{ animation: pulseA .6s ease; }
@keyframes pulseA{ 0%{transform:scale(1);} 40%{transform:scale(1.06); filter:brightness(1.25);} 100%{transform:scale(1);} }
.shake.go{ animation: shakeA .5s ease; }
@keyframes shakeA{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }
.flyin.go{ animation: flyinA .55s cubic-bezier(.2,.7,.2,1); }
@keyframes flyinA{ 0%{transform:translateX(26px); opacity:.3;} 100%{transform:translateX(0); opacity:1;} }
.spin{ animation: spinA 1.6s linear infinite; display:inline-block; }
@keyframes spinA{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

::selection{ background: rgba(127,166,214,.3);}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="deckname">PROGRAMMING FUNDAMENTALS · FUNCTIONS &amp; EXECUTION</div>
<div id="sectionlbl">Part I · Fundamentals</div>
<div id="progwrap"><div id="progbar"></div></div>
<div id="collisionBadge"></div>
<div id="nav">
  <button class="navbtn" id="prevBtn" title="Previous">&#8592;</button>
  <div id="counter">1 / 1</div>
  <button class="navbtn" id="nextBtn" title="Next">&#8594;</button>
</div>
<script>
window.__SLIDES__ = [];
const S = window.__SLIDES__;

/* ============ 0. TITLE ============ */
S.push({
eyebrow:'A FIRST-PRINCIPLES WALKTHROUGH',
title:'Programming Fundamentals<br>&amp; How Code Actually Runs',
body:`
<div style="width:1152px;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:22px;">
  <p class="rv" data-d="3" style="max-width:780px;font-size:18px;line-height:1.6;color:var(--ink-dim);margin:0;">
    Every language — Python, JavaScript, Rust, Go — is built from the same small set of ideas.
    Learn the ideas once, in plain language, and every new language becomes a change of accent, not a new language of thought.
  </p>
  <div class="rv" data-d="4" style="display:flex;gap:14px;flex-wrap:wrap;">
    <span class="pill" style="color:var(--blue);border-color:rgba(127,166,214,.4);">Part I · Fundamentals</span>
    <span class="pill" style="color:var(--amber);border-color:rgba(211,166,99,.4);">Part II · Functions &amp; Execution</span>
  </div>
  <div class="rv" data-d="5" style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-faint);">press &#8594; or space to begin</div>
</div>`,
caption:'The Feynman rule for this deck: if an idea needs jargon to explain, we replace the jargon with a picture first.'
});

/* ============ 1. HOOK ============ */
S.push({
eyebrow:'THE BIG PICTURE',
title:'A Program Is a Recipe.<br>The Computer Is a Very Literal Cook.',
body:`
<div class="grid2">
  <div class="visual">
    <div style="display:flex;flex-direction:column;gap:16px;align-items:center;">
      <div class="rv pop box" data-d="3" style="width:230px;padding:16px;text-align:center;">
        <div class="box" style="padding:16px 20px;"><div class="label">RECIPE</div><div style="font-size:14px;color:var(--ink-dim);">1. Crack 2 eggs<br>2. Whisk<br>3. Heat pan<br>4. Pour, wait 90s</div></div>
      </div>
      <div class="rv" data-d="4" style="font-size:26px;color:var(--ink-faint);">&#8595;</div>
      <div class="rv pop box" data-d="5" style="padding:16px 20px;"><div class="label" style="color:var(--blue);">PROGRAM</div><div class="code" style="font-size:13px;">eggs = 2<br>whisk(eggs)<br>heat(pan)<br>pour(); wait(90)</div></div>
    </div>
  </div>
  <div class="panel">
    <p class="def rv" data-d="4">A <b>program</b> is just an ordered list of exact instructions. "Some eggs" isn't good enough for a recipe read by a computer — it needs a <b>number</b>. That number needs somewhere to live while the recipe runs. That "somewhere" is a <b>variable</b>.</p>
    <div class="apply rv" data-d="6"><span class="tag">WHY IT MATTERS</span>Every bug you'll ever debug traces back to one of these fundamentals being slightly wrong — a variable holding the wrong value, a condition checking the wrong thing, a function called with the wrong argument.</div>
  </div>
</div>`,
recap:'',
gap:'but where does "2 eggs" actually live while the recipe is running — why do we need a name for it? &#8594;',
caption:'Next: the container that holds a value while your program runs — the variable.'
});

/* ============ 2. VARIABLES ============ */
S.push({
eyebrow:'PART I · FUNDAMENTALS',
title:'Variables — a Labeled Box for a Value',
gap:'',
recap:'a program is a list of exact steps.',
body:`
<div class="grid2">
  <div class="visual">
    <div style="display:flex;gap:34px;align-items:center;">
      <div style="text-align:center;">
        <div class="rv pop box" id="v-box" data-d="3" style="width:120px;height:90px;"></div>
        <div class="rv" data-d="4" style="margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-faint);">age</div>
      </div>
      <div class="rv" data-d="5" id="v-arrow" style="font-size:22px;color:var(--ink-faint);">&#8592;</div>
      <div class="rv pop" data-d="6" id="v-value" style="font-family:'JetBrains Mono',monospace;font-size:22px;color:var(--amber);">29</div>
    </div>
  </div>
  <div class="panel">
    <p class="def rv" data-d="4">A <b>variable</b> is a named box that holds a value, and the value can change later — that's what "vary" means. The name is how the rest of the program finds the box again.</p>
    <div class="example rv" data-d="5"><div class="label">EXAMPLE</div><pre class="code">age = 29
age = age + 1   <span class="c1">// box now holds 30</span></pre></div>
    <div class="apply rv" data-d="7"><span class="tag">USE IT</span>A shopping cart total, a game's score, the currently logged-in user — anything that needs to be remembered and can change is a variable.</div>
  </div>
</div>`,
caption:'RECAP — a variable is a named, re-writable box. GAP — what if we need a box that\'s never allowed to change? &#8594;'
});

/* ============ 3. CONSTANTS + LITERALS + PRIMITIVE TYPES ============ */
S.push({
eyebrow:'PART I · FUNDAMENTALS',
title:'Constants, Literals &amp; Primitive Types',
recap:'variables are re-writable named boxes.',
gap:'but not everything should be re-writable — and every box needs to know <i>what kind</i> of value it holds.',
body:`
<div class="grid2">
  <div class="visual">
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="rv pop box" id="c-box" data-d="3" style="padding:12px 18px;display:flex;align-items:center;gap:12px;position:relative;"><span class="pill" style="color:var(--rose);border-color:rgba(198,136,148,.4);">locked</span><span class="code">PI = 3.14159</span></div>
      <div class="rv" data-d="4" style="font-size:12px;color:var(--ink-faint);padding-left:6px;">a <b style="color:var(--ink)">constant</b> — the box is sealed after this line</div>
      <div class="rv" data-d="5" style="height:1px;background:var(--line);margin:4px 0;"></div>
      <div class="rv" data-d="6" style="display:flex;gap:10px;flex-wrap:wrap;">
        <span class="pill" style="color:var(--blue);">int → 29</span>
        <span class="pill" style="color:var(--amber);">float → 3.14</span>
        <span class="pill" style="color:var(--teal);">string → "hi"</span>
        <span class="pill" style="color:var(--violet);">bool → true</span>
      </div>
    </div>
  </div>
  <div class="panel">
    <p class="def rv" data-d="4">A <b>literal</b> is a value written directly in the code — <code>29</code> and <code>"hi"</code> are literals; they are what gets poured into the box. A <b>constant</b> is a box that, once filled, refuses to be re-filled — useful for values that must never accidentally change, like a tax rate.</p>
    <p class="def rv" data-d="5">A <b>primitive data type</b> is one of a handful of basic, built-in kinds of value every language ships with: whole numbers (int), decimals (float), text (string), true/false (boolean). Everything more complex is built by combining these.</p>
    <div class="apply rv" data-d="7"><span class="tag">USE IT</span><code>MAX_LOGIN_ATTEMPTS = 5</code> as a constant prevents a future teammate from accidentally changing a security rule three files away.</div>
  </div>
</div>`,
caption:'RECAP — constants lock a box; literals are raw values; primitives are the basic kinds of value. GAP — how does the language know a box holds a number vs text? &#8594;'
});

/* ============ 4. TYPE SYSTEMS: STATIC vs DYNAMIC ============ */
S.push({
eyebrow:'PART I · FUNDAMENTALS',
title:'Type Systems — When Does the Language Check?',
recap:'primitives are the basic kinds of value (int, float, string, bool).',
gap:'',
body:`
<div class="grid2">
  <div class="visual">
    <div style="display:flex;gap:26px;">
      <div style="text-align:center;">
        <div class="label" style="color:var(--blue);">STATIC</div>
        <div class="rv pop box" id="ts-static" data-d="3" style="width:220px;padding:14px;"><div class="code" style="font-size:12.5px;">int age = 29;<br><span style="color:var(--rose)">age = "old";</span></div><div class="rv" data-d="5" style="margin-top:8px;font-size:11.5px;color:var(--rose);">&#10007; rejected before running</div></div>
      </div>
      <div style="text-align:center;">
        <div class="label" style="color:var(--amber);">DYNAMIC</div>
        <div class="rv pop box" id="ts-dynamic" data-d="4" style="width:220px;padding:14px;"><div class="code" style="font-size:12.5px;">age = 29<br>age = "old"</div><div class="rv" data-d="6" style="margin-top:8px;font-size:11.5px;color:var(--green);">&#10003; runs fine, box just changes kind</div></div>
      </div>
    </div>
  </div>
  <div class="panel">
    <p class="def rv" data-d="4"><b>Static typing</b> (C, Java, Rust) checks every box's type <i>before</i> the program ever runs — like a spellchecker on the whole recipe first. <b>Dynamic typing</b> (Python, JavaScript, Ruby) checks types <i>while</i> the program runs, line by line — like a cook improvising and only noticing a mistake when they reach for the wrong ingredient.</p>
    <div class="apply rv" data-d="7"><span class="tag">USE IT</span>Static typing catches whole categories of bugs at compile time in large codebases; dynamic typing lets you prototype faster with less upfront ceremony. Most modern languages now offer optional static hints on top of dynamic typing (TypeScript, Python's type hints) — the best of both.</div>
  </div>
</div>`,
caption:'RECAP — static checks types before running; dynamic checks while running. GAP — okay, but once running, how strict is a language about mixing types? &#8594;'
});

/* ============ 5. STRONG vs WEAK + TYPE CONVERSION ============ */
S.push({
eyebrow:'PART I · FUNDAMENTALS',
title:'Strong vs. Weak Typing, and Type Conversion',
recap:'static checks types up front; dynamic checks as it goes.',
gap:'',
body:`
<div class="grid2">
  <div class="visual">
    <div style="display:flex;flex-direction:column;gap:18px;">
      <div class="rv pop box" id="w-box" data-d="3" style="padding:12px 16px;position:relative;"><div class="code" style="font-size:12.5px;"><span class="c1">// weak typing (JS)</span><br>"5" + 2 &nbsp;<span class="arrow">&#8594;</span>&nbsp; <span id="w-result" style="color:var(--amber);">"52"</span></div></div>
      <div class="rv pop box" id="s-box" data-d="4" style="padding:12px 16px;position:relative;"><div class="code" style="font-size:12.5px;"><span class="c1">// strong typing (Python)</span><br>"5" + 2 &nbsp;<span class="arrow">&#8594;</span>&nbsp; <span id="s-result" style="color:var(--rose);">TypeError</span></div></div>
      <div class="rv pop box" id="cv-box" data-d="5" style="padding:12px 16px;position:relative;"><div class="code" style="font-size:12.5px;"><span class="c1">// explicit conversion</span><br>int("5") + 2 &nbsp;<span class="arrow">&#8594;</span>&nbsp; <span id="cv-result" style="color:var(--green);">7</span></div></div>
    </div>
  </div>
  <div class="panel">
    <p class="def rv" data-d="4"><b>Strong typing</b> refuses to silently mix incompatible types — it forces you to be explicit. <b>Weak typing</b> quietly converts one type into another to make an operation "work," which is convenient but a frequent source of surprising bugs.</p>
    <p class="def rv" data-d="6"><b>Type conversion</b> is turning a value from one type into another — <i>implicit</i> when the language does it automatically, <i>explicit</i> (also called "casting") when you ask for it yourself with something like <code>int("5")</code>.</p>
    <div class="apply rv" data-d="7"><span class="tag">USE IT</span>Reading a number typed into a web form always arrives as text — you must explicitly convert it before doing math, or you'll silently glue strings together instead of adding numbers.</div>
  </div>
</div>`,
caption:'RECAP — strong typing forbids silent mixing; conversion changes a value\'s type on purpose. GAP — if the language checks types, does it always need to be told what type a box is? &#8594;'
});

/* ============ 6. TYPE INFERENCE ============ */
S.push({
eyebrow:'PART I · FUNDAMENTALS',
title:'Type Inference — the Language Guesses, Correctly',
recap:'conversion changes a value from one type to another.',
gap:'',
body:`
<div class="grid2">
  <div class="visual">
    <div style="display:flex;flex-direction:column;gap:14px;align-items:center;">
      <div class="rv pop box" id="ti-box" data-d="3" style="padding:14px 20px;position:relative;"><div class="code" id="ti-literal">let age = <span style="color:var(--amber)">29</span></div></div>
      <div class="rv" data-d="4" style="font-size:20px;color:var(--ink-faint);">&#8595; language looks at the literal</div>
      <div class="rv pop pill" id="ti-pill" data-d="5" style="padding:8px 18px;color:var(--blue);border-color:rgba(127,166,214,.4);">inferred: int</div>
    </div>
  </div>
  <div class="panel">
    <p class="def rv" data-d="4"><b>Type inference</b> is the language figuring out a box's type from context, without you writing it explicitly. You write <code>let age = 29</code>, and the compiler notices <code>29</code> is a whole number and silently records "age is an int" — you get static-typing safety with dynamic-typing brevity.</p>
    <div class="example rv" data-d="6"><div class="label">EXAMPLE — RUST</div><pre class="code">let age = 29;      <span class="c1">// inferred as i32</span>
let name = "Ada";  <span class="c1">// inferred as &amp;str</span></pre></div>
    <div class="apply rv" data-d="7"><span class="tag">USE IT</span>TypeScript, Rust, Swift, and Kotlin all lean on inference so you rarely write types for local variables, only for function boundaries — where being explicit protects everyone calling your code.</div>
  </div>
</div>`,
caption:'RECAP — inference lets the compiler deduce a type from the literal you wrote. GAP — now we have typed values sitting in boxes... how do we combine them into something new? &#8594;'
});

/* ============ 7. EXPRESSIONS vs STATEMENTS ============ */
S.push({
eyebrow:'PART I · FUNDAMENTALS',
title:'Expressions vs. Statements',
recap:'inference lets the language deduce a type from a literal.',
gap:'',
body:`
<div class="grid2">
  <div class="visual">
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div class="rv pop box" id="ex-box" data-d="3" style="padding:14px 18px;"><div class="label" style="color:var(--teal);">EXPRESSION</div><div class="code">3 + 4</div><div style="font-size:12px;color:var(--ink-faint);margin-top:6px;">produces a value: <b id="ex-value" style="color:var(--ink)">7</b></div></div>
      <div class="rv pop box" id="st-box" data-d="5" style="padding:14px 18px;"><div class="label" style="color:var(--amber);">STATEMENT</div><div class="code">total = <span id="st-slot" style="color:var(--ink-faint)">3 + 4</span></div><div style="font-size:12px;color:var(--ink-faint);margin-top:6px;">performs an action, produces nothing itself</div></div>
    </div>

/* event loop (index 33): a token travels queue -> loop -> stack, click-driven */
function makeEventLoopTour(){
  var step = 0;
  function els(){
    var el = document.querySelector('.slide.active');
    return {
      el: el, row: el.querySelector('#loop-row'), token: el.querySelector('#loop-token'),
      hub: el.querySelector('#loop-hub'), stackBox: el.querySelector('#es-stack'),
      queue: el.querySelector('#es-queue'), status: el.querySelector('#loop-status')
    };
  }
  function place(token, row, target){
    var tb = target.getBoundingClientRect(), rb = row.getBoundingClientRect();
    var scale = rb.width / row.offsetWidth;
    token.style.left = ((tb.left - rb.left)/scale + target.offsetWidth/2 - 8) + 'px';
    token.style.top = ((tb.top - rb.top)/scale + target.offsetHeight/2 - 8) + 'px';
  }
  return {
    canForward: function(){ return step < 2; },
    forward: function(){
      var c = els(); step++;
      if(step===1){
        place(c.token, c.row, c.hub);
        if(c.status) c.status.textContent = 'the loop notices the stack is empty and grabs the finished task';
        mnCircumscribe(c.hub, c.row);
      } else if(step===2){
        place(c.token, c.row, c.stackBox);
        if(c.status) c.status.textContent = 'the task moves onto the stack and runs — one turn of the loop, complete';
        mnIndicate(c.stackBox);
      }
    },
    canBack: function(){ return step > 0; },
    back: function(){
      var c = els(); step--;
      if(step===0){
        place(c.token, c.row, c.queue);
        if(c.status) c.status.textContent = 'rule: the loop only moves a queued task onto the stack once the stack is completely empty — click \u2192 to run one';
      } else if(step===1){
        place(c.token, c.row, c.hub);
        if(c.status) c.status.textContent = 'the loop notices the stack is empty and grabs the finished task';
      }
    }
  };
}

/* call stack (index 35): click-driven unwind, frames pop off one at a time */
function makeCallStackTour(){

    var el = document.querySelector('.slide.active');
    var f = el.querySelector(sel), st = el.querySelector('#cs-status');
    if(f){ f.style.transition = 'opacity .4s ease, transform .4s ease'; f.style.opacity = '0'; f.style.transform = 'translateY(-16px)'; }
    if(st) st.textContent = msg;
  }
  function restore(sel, msg){
    var el = document.querySelector('.slide.active');
    var f = el.querySelector(sel), st = el.querySelector('#cs-status');
    if(f){ f.style.opacity = '1'; f.style.transform = 'none'; }
    if(st) st.textContent = msg;
  }
  return {
    canForward: function(){ return step < 2; },
    forward: function(){
      step++;
      if(step===1) pop('#cs-upper', "upper() finishes and returns — its frame is popped off the top");
      else if(step===2) pop('#cs-greet', 'greet() finishes and returns — only main() is left running');
    },
    canBack: function(){ return step > 0; },
    back: function(){
      if(step===2) restore('#cs-greet', "upper() finishes and returns — its frame is popped off the top");
      else if(step===1) restore('#cs-upper', 'newest call on top \u00b7 LIFO: last in, first out \u2014 click \u2192 to watch it unwind');
      step--;

  };
}
S[35].onEnter = function(el){
  ['#cs-upper','#cs-greet'].forEach(function(sel){
    var f = el.querySelector(sel);
    if(f){ f.style.opacity = '1'; f.style.transform = 'none'; }
  });
  var st = el.querySelector('#cs-status');
  if(st) st.textContent = 'newest call on top \u00b7 LIFO: last in, first out \u2014 click \u2192 to watch it unwind';
  S[35].tour = makeCallStackTour();
};
</script>
<script>
const SLIDES = window.__SLIDES__;
</script>
<script>
/* ---------- stage fit (16:9, 1280x720 fixed coordinate stage) ---------- */
const stage = document.getElementById('stage');
function fitStage(){
  const vw = window.innerWidth, vh = window.innerHeight - 92;
  const scale = Math.min(vw/1280, vh/720) * 0.96;
  stage.style.transform = 'scale(' + scale + ')';
}
window.addEventListener('resize', fitStage);

/* ---------- reveal system: FadeIn(shift=UP*0.3) ---------- */
function revealIn(slideEl, stepMs){
  stepMs = stepMs || 110;
  const els = slideEl.querySelectorAll('.rv');
  els.forEach(el=>{
    const d = parseInt(el.getAttribute('data-d')||'0',10);
    el.classList.remove('in');
    void el.offsetWidth;
    setTimeout(()=>el.classList.add('in'), d*stepMs);
  });
}

/* ---------- primitive: write-on underline for titles ---------- */
function mnWriteTitle(slideEl){
  const t = slideEl.querySelector('.title');
  if(!t) return;
  t.classList.remove('drawn');
  void t.offsetWidth;
  setTimeout(()=>t.classList.add('drawn'), 260);
}

/* ---------- primitive: Indicate — pulse an element ---------- */
function mnIndicate(el){
  if(!el) return;
  el.classList.remove('pulse'); void el.offsetWidth;
  el.classList.add('pulse','go');
  setTimeout(()=>el.classList.remove('go'), 650);
}

/* ---------- primitive: Shake — wrong/rejected cue ---------- */
function mnShake(el){
  if(!el) return;
  el.classList.remove('shake'); void el.offsetWidth;
  el.classList.add('shake','go');
  setTimeout(()=>el.classList.remove('go'), 600);
}

/* ---------- universal auto-animate: sequential indicate/shake wave over a slide's visual elements ---------- */
/* ---------- primitive: Travel — a token physically moves from one element to another ---------- */
function mnTravel(host, fromEl, toEl, opts){
  opts = opts || {};
  if(!host || !fromEl || !toEl) return null;
  var token = document.createElement('div');
  token.className = 'travel-token';
  var dur = opts.duration || 700;
  token.style.position = 'absolute';
  token.style.zIndex = 6;
  token.style.transition = 'left '+(dur/1000)+'s cubic-bezier(.22,.7,.2,1), top '+(dur/1000)+'s cubic-bezier(.22,.7,.2,1), background .25s, transform .25s';
  if(opts.label){
    token.textContent = opts.label;
    token.style.padding = '3px 9px';
    token.style.borderRadius = '11px';
    token.style.fontFamily = "'JetBrains Mono',monospace";
    token.style.fontSize = '11.5px';
    token.style.fontWeight = '600';
    token.style.whiteSpace = 'nowrap';
    token.style.color = opts.textColor || '#0a0a0d';
    token.style.background = opts.color || 'var(--amber)';
  } else {
    var sz = opts.size || 14;
    token.style.width = sz+'px'; token.style.height = sz+'px';
    token.style.borderRadius = opts.square ? '4px' : '50%';
    token.style.background = opts.color || 'var(--amber)';
  }
  token.style.boxShadow = '0 0 0 3px '+(opts.glow || 'rgba(211,166,99,.18)');
  host.appendChild(token);
  function place(target, extra){
    var hb = host.getBoundingClientRect(), tb = target.getBoundingClientRect();
    var scale = hb.width / host.offsetWidth || 1;
    var w = token.offsetWidth, h = token.offsetHeight;
    var jx = (extra && extra.dx) || 0, jy = (extra && extra.dy) || 0;
    token.style.left = ((tb.left-hb.left)/scale + target.offsetWidth/2 - w/2 + jx) + 'px';
    token.style.top = ((tb.top-hb.top)/scale + target.offsetHeight/2 - h/2 + jy) + 'px';
  }
  place(fromEl, opts.fromOffset);
  token.style.opacity = '0';
  requestAnimationFrame(function(){
    token.style.transition = 'opacity .2s';
    token.style.opacity = '1';
    requestAnimationFrame(function(){
      token.style.transition = 'left '+(dur/1000)+'s cubic-bezier(.22,.7,.2,1), top '+(dur/1000)+'s cubic-bezier(.22,.7,.2,1), background .25s, transform .25s, opacity .2s';
      place(toEl, opts.toOffset);
    });
  });
  setTimeout(function(){
    if(opts.onArrive) opts.onArrive(token);
    if(opts.hold!==0){
      setTimeout(function(){
        token.style.opacity = '0';
        setTimeout(function(){ token.remove(); }, 250);
      }, opts.hold===undefined ? 500 : opts.hold);
    }
  }, dur + 40);
  return token;
}

/* ---------- primitive: Morph — content swap with a flip transition (a value visibly changing) ---------- */
function mnMorph(el, newHTML, opts){
  opts = opts || {};
  if(!el) return;
  el.style.transition = 'transform .28s ease, opacity .28s ease';
  el.style.transform = 'scaleX(.06)';
  el.style.opacity = '.15';
  setTimeout(function(){
    el.innerHTML = newHTML;
    if(opts.className) el.className = opts.className;
    if(opts.style) Object.keys(opts.style).forEach(function(k){ el.style[k] = opts.style[k]; });
    el.style.transform = 'scaleX(1)';
    el.style.opacity = '1';
    if(opts.onDone) opts.onDone();
  }, 290);
}

/* ---------- composite: two chips converge into a result (shows values combining) ---------- */
function mnConverge(host, targetEl, chipA, chipB, delay){
  setTimeout(function(){
    mnTravel(host, targetEl, targetEl, {label:chipA.label, color:chipA.color, textColor:chipA.textColor,
      fromOffset:{dx:-130,dy:chipA.dy||0}, toOffset:{dx:-8,dy:0}, duration:550, hold:100});
    mnTravel(host, targetEl, targetEl, {label:chipB.label, color:chipB.color, textColor:chipB.textColor,
      fromOffset:{dx:130,dy:chipB.dy||0}, toOffset:{dx:8,dy:0}, duration:550, hold:100,
      onArrive:function(){ mnIndicate(targetEl); }});
  }, delay);
}

/* ---------- composite: a value tries to enter, gets rejected — bounces off and the target shakes ---------- */
function mnRejectAttempt(host, targetEl, label, delay){
  setTimeout(function(){
    mnTravel(host, targetEl, targetEl, {label:label, color:'var(--rose)', textColor:'#0a0a0d',
      fromOffset:{dx:140,dy:-28}, toOffset:{dx:18,dy:-28}, duration:420, hold:0,
      onArrive:function(t){
        setTimeout(function(){
          mnShake(targetEl);
          t.style.transition = 'left .3s ease, opacity .3s ease';
          t.style.left = (parseFloat(t.style.left)+40)+'px';
          t.style.opacity = '0';
          setTimeout(function(){ t.remove(); }, 320);
        }, 60);
      }});
  }, delay);
}


function mnAutoAnimate(el){
  var container = el.querySelector('.visual') || el.querySelector('.content');
  if(!container) return;
  var targets = Array.prototype.slice.call(container.querySelectorAll('.box, .pill')).slice(0,8);
  targets.forEach(function(t,i){
    setTimeout(function(){
      var txt = (t.textContent||'');
      if(/TypeError|rejected|✗|&#10007;|not tail/i.test(txt)) mnShake(t);
      else mnIndicate(t);
    }, 700 + i*230);
  });
}

function mnCircumscribe(el, host){
  if(!el||!host) return;
  const hb = host.getBoundingClientRect(), eb = el.getBoundingClientRect();
  const sc = hb.width/host.offsetWidth || 1;
  const ring = document.createElement('div');
  ring.className = 'ring';
  ring.style.left = ((eb.left-hb.left)/sc - 8) + 'px';
  ring.style.top = ((eb.top-hb.top)/sc - 8) + 'px';
  ring.style.width = (eb.width/sc + 16) + 'px';
  ring.style.height = (eb.height/sc + 16) + 'px';
  host.appendChild(ring);
  requestAnimationFrame(()=>ring.classList.add('show'));
  setTimeout(()=>ring.remove(), 950);
}

/* ---------- primitive: typewriter ---------- */
function mnType(el, text, speed){
  speed = speed || 18;
  el.textContent='';
  let i=0;
  const iv = setInterval(()=>{
    el.textContent = text.slice(0,i);
    i++;
    if(i>text.length) clearInterval(iv);
  }, speed);
}

/* ---------- primitive: count-up number with ring ---------- */
function mnCountUp(el, target, duration, ringEl, circumference){
  duration = duration || 900;
  const t0 = performance.now();
  function step(now){
    const p = Math.min(1,(now-t0)/duration);
    const eased = 1 - Math.pow(1-p,3);
    el.textContent = Math.round(target*eased);
    if(ringEl && circumference){
      ringEl.style.strokeDashoffset = circumference*(1-eased);
    }
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- collision checker (press C) ---------- */
function mnCheckCollisions(opts){
  opts = opts||{};
  const slideEl = document.querySelector('.slide.active');
  if(!slideEl) return;
  const sel = '.title,.eyebrow,.caption,.bridge,[style*="left"]';
  const nodes = Array.from(slideEl.querySelectorAll(sel));
  const boxes = nodes.map(n=>({n, r:n.getBoundingClientRect()}))
    .filter(o=>o.r.width>0 && o.r.height>0);
  let collisions=0;
  const badge = document.getElementById('collisionBadge');
  slideEl.querySelectorAll('.ring.debug').forEach(r=>r.remove());
  for(let i=0;i<boxes.length;i++){
    for(let j=i+1;j<boxes.length;j++){
      const a=boxes[i], b=boxes[j];
      if(a.n.contains(b.n) || b.n.contains(a.n)) continue;
      const ra=a.r, rb=b.r;
      const overlap = !(ra.right<rb.left || rb.right<ra.left || ra.bottom<rb.top || rb.bottom<ra.top);
      if(overlap){
        collisions++;
        if(opts.highlight!==false){
          [a.n,b.n].forEach(n=>{ n.style.outline='2px dashed #c0645f'; });
        }
        console.log('Collision:', a.n, b.n);
      }
    }
  }
  if(badge){
    badge.style.display='block';
    if(collisions===0){ badge.textContent='no overlaps'; badge.style.background='rgba(116,185,172,.15)'; badge.style.color='#74b9ac'; badge.style.border='1px solid rgba(116,185,172,.4)';}
    else { badge.textContent=collisions+' overlaps'; badge.style.background='rgba(192,100,95,.15)'; badge.style.color='#c0645f'; badge.style.border='1px solid rgba(192,100,95,.4)';}
    setTimeout(()=>badge.style.display='none', 2200);
  }
  return collisions;
}

/* ---------- nav / render ---------- */
let cur = 0;
const tourState = {}; // per-slide step controllers, keyed by index

function renderSlide(idx){
  const s = SLIDES[idx];
  let inner = '';
  inner += `<div class="eyebrow rv" data-d="0">${s.eyebrow}</div>`;
  inner += `<h2 class="title rv" data-d="1">${s.title}<span class="ul"></span></h2>`;
  if(s.recap || s.gap){
    inner += `<div class="bridge rv" data-d="2">`;
    if(s.recap) inner += `<span class="recap">RECAP — <b>${s.recap}</b></span>`;
    if(s.gap) inner += `<span class="gap">${s.gap}</span>`;
    inner += `</div>`;
  }
  inner += `<div class="content">${s.body}</div>`;
  if(s.caption) inner += `<div class="caption rv" data-d="10">${s.caption}</div>`;
  return inner;
}

function goTo(idx, dir){
  if(idx<0||idx>=SLIDES.length) return;
  const old = document.querySelector('.slide.active');
  if(old) old.classList.remove('active');
  let el = document.getElementById('slide-'+idx);
  if(!el){
    el = document.createElement('section');
    el.className='slide';
    el.id='slide-'+idx;
    el.innerHTML = renderSlide(idx);
    stage.appendChild(el);
  }
  el.classList.add('active');
  cur = idx;
  revealIn(el, 100);
  mnWriteTitle(el);
  if(SLIDES[idx].onEnter) setTimeout(()=>SLIDES[idx].onEnter(el), 150);
  else setTimeout(()=>mnAutoAnimate(el), 150);
  document.getElementById('counter').textContent = (idx+1)+' / '+SLIDES.length;
  document.getElementById('prevBtn').disabled = idx===0;
  document.getElementById('nextBtn').disabled = idx===SLIDES.length-1;
  document.getElementById('progbar').style.width = (((idx+1)/SLIDES.length)*100)+'%';
  document.getElementById('sectionlbl').textContent = idx<21 ? 'Part I · Fundamentals' : 'Part II · Functions & Execution';
}

function next(){
  const s = SLIDES[cur];
  if(s.tour && s.tour.canForward && s.tour.canForward()){ s.tour.forward(); return; }
  goTo(cur+1,1);
}
function prev(){
  const s = SLIDES[cur];
  if(s.tour && s.tour.canBack && s.tour.canBack()){ s.tour.back(); return; }
  goTo(cur-1,-1);
}
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') next();
  else if(e.key==='ArrowLeft') prev();
  else if(e.key.toLowerCase()==='c') mnCheckCollisions();
});

fitStage();
goTo(0);
</script>
