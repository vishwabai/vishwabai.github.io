<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deep Learning — From a Single Neuron to Mixture of Experts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c;
  --ink:#eceef1;
  --sub:#9598a3;
  --dim:#5c5e68;
  --line:rgba(255,255,255,.14);
  --card:rgba(255,255,255,.035);
  --cardline:rgba(255,255,255,.10);
  --dot:rgba(255,255,255,.055);
  --blue:#6f9ceb;
  --teal:#52b3a4;
  --amber:#d3a25f;
  --rose:#c98198;
  --violet:#a08de0;
  --green:#7cb88f;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);height:100%;overflow:hidden;}
body{
  font-family:'Inter',sans-serif;color:var(--ink);
  background-color:var(--bg);
  background-image:radial-gradient(circle, var(--dot) 1.3px, transparent 1.3px);
  background-size:26px 26px;
}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}

#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:92px;box-sizing:border-box;}
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;flex-shrink:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.035), rgba(255,255,255,0) 60%);
  border:1px solid rgba(255,255,255,.06); border-radius:6px; overflow:hidden;}

.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .35s ease;}
.slide.active{opacity:1;pointer-events:auto;}

.eyebrow{position:absolute;left:64px;top:38px;font-family:'JetBrains Mono',monospace;font-size:12.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--blue);opacity:0;transform:translateY(8px);
  transition:opacity .5s ease,transform .5s ease;}
.title{position:absolute;left:64px;top:60px;font-family:'Space Grotesk',sans-serif;font-weight:600;
  font-size:32px;max-width:1100px;line-height:1.15;opacity:0;transform:translateY(8px);
  transition:opacity .5s ease .06s,transform .5s ease .06s;}
.slide.active .eyebrow, .slide.active .title{opacity:1;transform:translateY(0);}

.content{position:absolute;left:64px;right:64px;top:128px;bottom:66px;display:flex;gap:40px;}
.caption{position:absolute;left:64px;right:64px;bottom:16px;font-size:12.5px;color:var(--dim);
  border-top:1px solid var(--line);padding-top:10px;font-family:'JetBrains Mono',monospace;}
.section-tag{position:absolute;right:64px;top:40px;font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--dim);letter-spacing:.08em;}

/* reveal */
.rv{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s ease;}
.rv.in{opacity:1;transform:translateY(0);}
.rv.pop{transform:scale(.9) translateY(10px);}
.rv.pop.in{transform:scale(1) translateY(0);}

/* generic cumulative steps (up to 4) */
.st2,.st3,.st4{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease;}
.slide.show2 .st2{opacity:1;transform:none;}
.slide.show3 .st2{opacity:1;transform:none;}
.slide.show3 .st3{opacity:1;transform:none;}
.slide.show4 .st2{opacity:1;transform:none;}
.slide.show4 .st3{opacity:1;transform:none;}
.slide.show4 .st4{opacity:1;transform:none;}

/* concept slide layout */
.diagram-pane{flex:1.1;display:flex;align-items:center;justify-content:center;position:relative;min-width:0;}
.dsvg{width:100%;max-width:540px;height:auto;overflow:visible;}
.info-pane{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:0;}
.analogy{font-size:15.5px;color:var(--sub);font-style:italic;line-height:1.5;border-left:2px solid var(--cardline);padding-left:14px;}
.formula-card{background:var(--card);border:1px solid var(--cardline);border-radius:8px;padding:14px 16px;
  box-shadow:0 1px 3px rgba(0,0,0,.3);}
.f-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--dim);
  text-transform:uppercase;margin-bottom:6px;}
.f-body{font-family:'JetBrains Mono',monospace;font-size:14.5px;color:var(--ink);line-height:1.7;}
.f-body sub{font-size:10px;}
.f-body sup{font-size:10px;}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;}
.facts li{font-size:13.5px;color:var(--ink);padding-left:16px;position:relative;line-height:1.45;}
.facts li::before{content:'';position:absolute;left:0;top:7px;width:6px;height:1.5px;background:var(--blue);}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);border:1px solid var(--cardline);
  background:rgba(255,255,255,.02);border-radius:100px;padding:5px 11px;}

/* svg node/link */
.node{fill:rgba(255,255,255,.055);stroke:var(--blue);stroke-width:1.6;}
.nlabel{fill:var(--ink);font-family:'JetBrains Mono',monospace;font-size:12px;text-anchor:middle;}
.slabel{fill:var(--sub);font-family:'JetBrains Mono',monospace;font-size:10.5px;text-anchor:middle;}
.link{stroke:rgba(255,255,255,.22);stroke-width:1.2;fill:none;}
.arrow{stroke:var(--ink);stroke-width:1.6;fill:none;marker-end:url(#arrowhead);}

/* bridge slide */
.bridge-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:0 120px;}
.b-row{display:flex;align-items:flex-start;gap:20px;width:100%;max-width:920px;}
.b-tag{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.12em;color:var(--dim);
  border:1px solid var(--cardline);border-radius:5px;padding:4px 10px;flex-shrink:0;margin-top:2px;}
.b-text{font-size:19px;line-height:1.5;color:var(--sub);padding-top:3px;}
.gap-tag{color:var(--amber);border-color:rgba(211,162,95,.4);}
.gap-text{color:var(--ink);font-weight:500;}
.gap .gap-text::after{content:'';}
.fill-card{border:1px solid;border-radius:10px;padding:20px 24px;background:var(--card);flex:1;
  box-shadow:0 1px 3px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.25);}
.fill-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;}
.fill-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:24px;margin-bottom:6px;}
.fill-line{font-size:14.5px;color:var(--sub);line-height:1.5;}
.pulse-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:9px;
  animation:pulsedot 1.4s ease-in-out infinite;}
@keyframes pulsedot{0%,100%{opacity:.35;transform:scale(.85);}50%{opacity:1;transform:scale(1.15);}}

/* title slide */
.hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;}
.hero .kicker{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.18em;color:var(--blue);text-transform:uppercase;}
.hero h1{font-size:52px;margin:0;line-height:1.15;max-width:920px;font-weight:600;}
.hero .sub{font-size:16.5px;color:var(--sub);max-width:640px;line-height:1.55;}
.hero .startline{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--dim);margin-top:14px;}
.route{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:920px;margin-top:6px;}
.route span{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim);border:1px solid var(--cardline);
  border-radius:100px;padding:4px 10px;}

/* recap / closing */
.recap-grid{position:absolute;left:64px;right:64px;top:128px;bottom:66px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.recap-col{display:flex;flex-direction:column;gap:10px;}
.recap-head{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px;}
.recap-item{background:var(--card);border:1px solid var(--cardline);border-radius:8px;padding:10px 13px;}
.recap-item .ri-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin-bottom:3px;}
.recap-item .ri-line{font-size:12px;color:var(--sub);line-height:1.4;}

/* diagram specific */
.gridcell{fill:rgba(255,255,255,.04);stroke:rgba(255,255,255,.12);stroke-width:1;}
.gridcell.hot{fill:rgba(111,156,235,.30);}
.filterbox{fill:rgba(211,162,95,.10);stroke:var(--amber);stroke-width:2;transition:x .6s ease,y .6s ease;}
.outcell{fill:rgba(255,255,255,.035);stroke:rgba(255,255,255,.15);stroke-width:1;transition:fill .3s ease,stroke .3s ease;}
.outcell.active{fill:rgba(211,162,95,.35);stroke:var(--amber);}
.tokbox{fill:rgba(255,255,255,.05);stroke:var(--cardline);stroke-width:1.4;transition:stroke .3s ease;}
.tokbox.query{stroke:var(--violet);}
.attline{stroke:var(--violet);fill:none;transition:opacity .4s ease,stroke-width .4s ease;}
.expbox{fill:rgba(255,255,255,.05);stroke:var(--cardline);stroke-width:1.4;transition:fill .35s ease,stroke .35s ease,opacity .35s ease;}
.expbox.active{fill:rgba(124,184,143,.28);stroke:var(--green);}
.gatediamond{fill:rgba(255,255,255,.06);stroke:var(--green);stroke-width:1.6;}
.ghost{opacity:.35;}
.tstack rect{transition:opacity .3s ease;}
.wave{fill:none;stroke-width:1.6;}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;height:92px;display:flex;align-items:center;justify-content:center;
  gap:16px;background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0));z-index:50;}
#nav button{font-family:'JetBrains Mono',monospace;font-size:13px;background:rgba(255,255,255,.04);
  color:var(--ink);border:1px solid var(--cardline);border-radius:8px;padding:10px 18px;cursor:pointer;
  transition:background .2s ease,border-color .2s ease;}
#nav button:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.25);}
#nav button:disabled{opacity:.3;cursor:default;}
#nav button:disabled:hover{background:rgba(255,255,255,.04);}
#navcount{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);min-width:70px;text-align:center;}
#navtitle{position:absolute;left:24px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--dim);}

#collbadge{position:fixed;top:14px;right:14px;font-family:'JetBrains Mono',monospace;font-size:12px;
  padding:6px 12px;border-radius:6px;z-index:100;display:none;}
</style>
</head>
<body>

<div id="viewport"><div id="stage"></div></div>

<div id="nav">
  <div id="navtitle">Deep Learning · Foundations to Frontier</div>
  <button id="prevBtn">← Prev</button>
  <span id="navcount">1 / 1</span>
  <button id="nextBtn">Next →</button>
</div>
<div id="collbadge"></div>

<script>
/* =========================================================
   SVG DIAGRAM BUILDERS
   ========================================================= */
const DEFS = `<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="var(--ink)"/>
  </marker>
</defs>`;

function svgWrap(inner, vb){ return `<svg viewBox="0 0 ${vb||'560 420'}" class="dsvg">${DEFS}${inner}</svg>`; }

function perceptronSVG(){
  const xs=[90,210,330], labels=['x₁','x₂','x₃'], w=['w₁','w₂','w₃'];
  let s='';
  xs.forEach((y,i)=>{
    s+=`<line x1="70" y1="${y}" x2="280" y2="210" class="link"/>`;
    s+=`<text x="${(70+280)/2 - 6*(i-1)}" y="${(y+210)/2 - 8}" class="slabel">${w[i]}</text>`;
  });
  xs.forEach((y,i)=>{
    s+=`<circle cx="70" cy="${y}" r="20" class="node"/><text x="70" y="${y+5}" class="nlabel">${labels[i]}</text>`;
  });
  s+=`<circle cx="280" cy="210" r="34" class="node" style="stroke:var(--amber)"/>`;
  s+=`<text x="280" y="206" class="nlabel">Σ</text><text x="280" y="222" class="slabel">step</text>`;
  s+=`<line x1="314" y1="210" x2="470" y2="210" class="arrow"/>`;
  s+=`<text x="490" y="215" class="nlabel">y</text>`;
  s+=`<text x="70" y="380" class="slabel">inputs</text><text x="280" y="380" class="slabel">neuron</text><text x="480" y="380" class="slabel">output</text>`;
  return svgWrap(s);
}

function mlpSVG(){
  const inX=80, hidX=280, outX=480;
  const inY=[110,210,310], hidY=[60,160,260,360], outY=[150,270];
  let links='';
  inY.forEach(y1=>hidY.forEach(y2=>{ links+=`<line x1="${inX}" y1="${y1}" x2="${hidX}" y2="${y2}" class="link"/>`; }));
  hidY.forEach(y1=>outY.forEach(y2=>{ links+=`<line x1="${hidX}" y1="${y1}" x2="${outX}" y2="${y2}" class="link"/>`; }));
  let nodes='';
  inY.forEach(y=>nodes+=`<circle cx="${inX}" cy="${y}" r="15" class="node"/>`);
  hidY.forEach(y=>nodes+=`<circle cx="${hidX}" cy="${y}" r="15" class="node" style="stroke:var(--amber)"/>`);
  outY.forEach(y=>nodes+=`<circle cx="${outX}" cy="${y}" r="15" class="node" style="stroke:var(--teal)"/>`);
  const labels=`<text x="${inX}" y="400" class="slabel">input</text>
    <text x="${hidX}" y="400" class="slabel">hidden (σ)</text>
    <text x="${outX}" y="400" class="slabel">output (ŷ)</text>`;
  return svgWrap(links+nodes+labels);
}

function cnnSVG(){
  const g0=20, cs=38, n=6;
  let cells='';
  const hotset=new Set(['1-1','1-2','2-1','2-2','2-3','3-2','3-3']);
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const hot = hotset.has(r+'-'+c) ? ' hot':'';
    cells+=`<rect x="${g0+c*cs}" y="${g0+r*cs}" width="${cs-3}" height="${cs-3}" class="gridcell${hot}"/>`;
  }
  const filter=`<rect id="cnnFilter" x="${g0}" y="${g0}" width="${cs*3-3}" height="${cs*3-3}" rx="4" class="filterbox"/>`;
  const arrow=`<line x1="270" y1="130" x2="330" y2="130" class="arrow"/><text x="300" y="118" class="slabel">conv</text>`;
  const og=340, ocs=32, on=4;
  let out='';
  for(let r=0;r<on;r++)for(let c=0;c<on;c++){
    out+=`<rect id="cnnOut-${r}-${c}" x="${og+c*ocs}" y="${g0+56+r*ocs}" width="${ocs-3}" height="${ocs-3}" class="outcell"/>`;
  }
  const lbl=`<text x="${g0+n*cs/2-18}" y="270" class="slabel">6×6 input</text>
    <text x="${og+on*ocs/2-10}" y="270" class="slabel">4×4 feature map</text>
    <text x="150" y="315" class="slabel">3×3 filter slides step by step →</text>`;
  return svgWrap(cells+filter+arrow+out+lbl);
}

function rnnSVG(){
  let s='';
  const xs=[80,220,360,500], y=200;
  for(let i=0;i<4;i++){
    s+=`<g class="st${i+1}">`;
    if(i>0) s+=`<line x1="${xs[i-1]+34}" y1="${y}" x2="${xs[i]-34}" y2="${y}" class="arrow"/>`;
    s+=`<rect x="${xs[i]-32}" y="${y-32}" width="64" height="64" rx="8" class="node"/>`;
    s+=`<text x="${xs[i]}" y="${y+5}" class="nlabel">h${'₁₂₃₄'[i]}</text>`;
    s+=`<line x1="${xs[i]}" y1="${y+32}" x2="${xs[i]}" y2="${y+80}" class="arrow"/>`;
    s+=`<text x="${xs[i]}" y="${y+100}" class="slabel">x${'₁₂₃₄'[i]}</text>`;
    s+=`</g>`;
  }
  s+=`<text x="290" y="90" class="slabel">hidden state passed forward, step by step</text>`;
  return svgWrap(s);
}

function lstmSVG(){
  let s='';
  // cell state highway
  s+=`<line x1="40" y1="70" x2="520" y2="70" class="link" style="stroke:var(--teal);stroke-width:2"/>`;
  s+=`<text x="40" y="55" class="slabel" style="text-anchor:start">cell state Cₜ (protected highway)</text>`;
  s+=`<g class="st1"><rect x="60" y="150" width="110" height="60" rx="8" class="node"/><text x="115" y="184" class="nlabel">forget f</text><text x="115" y="230" class="slabel">σ</text></g>`;
  s+=`<g class="st2"><rect x="205" y="150" width="110" height="60" rx="8" class="node" style="stroke:var(--amber)"/><text x="260" y="184" class="nlabel">input i</text><text x="260" y="230" class="slabel">σ</text></g>`;
  s+=`<g class="st3"><rect x="350" y="150" width="110" height="60" rx="8" class="node" style="stroke:var(--violet)"/><text x="405" y="184" class="nlabel">C̃ candidate</text><text x="405" y="230" class="slabel">tanh</text></g>`;
  s+=`<g class="st4"><rect x="205" y="280" width="110" height="60" rx="8" class="node" style="stroke:var(--rose)"/><text x="260" y="314" class="nlabel">output o</text><text x="260" y="360" class="slabel">σ → hₜ</text></g>`;
  return svgWrap(s);
}

function gruSVG(){
  let s='';
  s+=`<g class="st1"><rect x="90" y="150" width="140" height="64" rx="8" class="node"/><text x="160" y="185" class="nlabel">reset r</text><text x="160" y="232" class="slabel">σ — how much past to forget</text></g>`;
  s+=`<g class="st2"><rect x="330" y="150" width="140" height="64" rx="8" class="node" style="stroke:var(--amber)"/><text x="400" y="185" class="nlabel">update z</text><text x="400" y="232" class="slabel">σ — blend old vs new</text></g>`;
  s+=`<g class="st3"><line x1="90" y1="290" x2="470" y2="290" class="link" style="stroke:var(--teal);stroke-width:2"/><text x="280" y="270" class="slabel">hₜ = (1−z)⊙hₜ₋₁ + z⊙h̃ₜ</text></g>`;
  return svgWrap(s);
}

function attentionSVG(){
  const toks=['The','cat','sat','on','mat'];
  const xs=[60,168,276,384,468];
  const y=230;
  let boxes='', lines='';
  toks.forEach((t,i)=>{
    boxes+=`<rect id="attn-box-${i}" x="${xs[i]-34}" y="${y-24}" width="68" height="48" rx="7" class="tokbox"/>`;
    boxes+=`<text x="${xs[i]}" y="${y+5}" class="nlabel">${t}</text>`;
    const midx=(xs[i]+xs[2])/2, topy = y-24-30-Math.abs(i-2)*8;
    lines+=`<path id="attn-l-${i}" d="M${xs[2]},${y-24} Q${midx},${topy} ${xs[i]},${y-24}" class="attline" opacity="0.15" stroke-width="1.5"/>`;
  });
  const lbl=`<text x="270" y="90" class="slabel" id="attn-qlabel">query = "sat" looks at every word directly</text>`;
  return svgWrap(lines+boxes+lbl);
}

function embedSVG(){
  const pts=[
    {x:120,y:280,l:'man'},{x:150,y:150,l:'king'},
    {x:340,y:300,l:'woman'},{x:372,y:170,l:'queen'},
    {x:440,y:90,l:'cat'},{x:480,y:60,l:'dog'}
  ];
  let s='<line x1="20" y1="360" x2="20" y2="20" class="link"/><line x1="20" y1="360" x2="530" y2="360" class="link"/>';
  s+=`<line x1="150" y1="150" x2="372" y2="170" class="arrow" style="stroke:var(--violet)"/>`;
  s+=`<line x1="120" y1="280" x2="340" y2="300" class="arrow" style="stroke:var(--violet)" opacity="0.55"/>`;
  pts.forEach(p=>{
    s+=`<circle cx="${p.x}" cy="${p.y}" r="6" fill="var(--amber)"/>`;
    s+=`<text x="${p.x+12}" y="${p.y+4}" class="slabel" style="text-anchor:start">${p.l}</text>`;
  });
  s+=`<text x="270" y="400" class="slabel">meaning-space: similar words sit near each other</text>`;
  return svgWrap(s);
}

function posencSVG(){
  let s='';
  const freqs=[0.9,0.55,0.32,0.18];
  const colors=['var(--blue)','var(--teal)','var(--amber)','var(--violet)'];
  freqs.forEach((f,i)=>{
    let d='';
    for(let x=0;x<=520;x+=8){
      const yy = 70 + i*80 + Math.sin(x*f/40)*26;
      d += (x===0?'M':'L')+x+','+yy+' ';
    }
    s+=`<path d="M20,${70+i*80} ${d}" class="wave" style="stroke:${colors[i]}" transform="translate(0,0)"/>`;
    s+=`<text x="545" y="${70+i*80+5}" class="slabel">dim ${i}</text>`;
  });
  s+=`<text x="270" y="20" class="slabel">position signature: each dim a different wave frequency</text>`;
  for(let p=0;p<5;p++){
    s+=`<text x="${40+p*110}" y="400" class="slabel">pos ${p}</text>`;
  }
  return svgWrap(s);
}

function normSVG(){
  const raw=[0.9,0.2,0.7,0.05,0.55,0.35,0.85,0.15];
  const norm=[0.5,0.45,0.55,0.4,0.6,0.48,0.52,0.42];
  let s='';
  const bw=24, gap=10, startx=40;
  raw.forEach((v,i)=>{
    const h=v*140;

function encoderSVG(){

function moeSVG(){

    s+=`<text x="${x+bw/2}" y="${y+bh/2+5}" class="nlabel">E${idx+1}</text>`;
  }
  s+=`<polygon points="270,240 300,270 270,300 240,270" class="gatediamond"/>`;
  s+=`<text x="270" y="274" class="nlabel">gate</text>`;
  s+=`<line x1="270" y1="300" x2="270" y2="340" class="arrow"/>`;

}

/* =========================================================
   RENDER + NAV CONTROLLER
   ========================================================= */
const stage = document.getElementById('stage');
stage.innerHTML = SLIDES.join('');
const slideEls = Array.from(document.querySelectorAll('.slide'));
let cur = 0;
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const navcount = document.getElementById('navcount');

function revealIn(container, stepMs){
  stepMs = stepMs || 100;
  const els = container.querySelectorAll('.rv');
  els.forEach((el,i)=>{
    const d = parseInt(el.getAttribute('data-d')||i+1);
    setTimeout(()=>{ el.classList.add('in'); }, d*stepMs);
  });
}
function resetReveal(container){
  container.querySelectorAll('.rv').forEach(el=>el.classList.remove('in'));
}

/* custom per-slide step effects (motion beyond simple cumulative reveal) */
const STEP_FX = {
  cnn: function(slide, step){
    const positions = [
      {x:20,y:20, out:[0,0]},
      {x:20+38,y:20+38, out:[1,1]},
      {x:20+38*3,y:20+38*3, out:[3,3]}
    ];
    const p = positions[Math.min(step-1,2)];
    const filter = slide.querySelector('#cnnFilter');
    if(filter){ filter.setAttribute('x', p.x); filter.setAttribute('y', p.y); }
    slide.querySelectorAll('.outcell').forEach(c=>c.classList.remove('active'));
    const target = slide.querySelector('#cnnOut-'+p.out[0]+'-'+p.out[1]);
    if(target) target.classList.add('active');
  },
  attention: function(slide, step){
    const weightSets = [
      [0.5,0.2,0.1,0.1,0.1],
      [0.15,0.4,0.25,0.1,0.1],
      [0.1,0.35,0.3,0.15,0.1]
    ];
    const queryIdx = [0,1,2];
    const w = weightSets[Math.min(step-1,2)];
    const qi = queryIdx[Math.min(step-1,2)];
    slide.querySelectorAll('.tokbox').forEach(b=>b.classList.remove('query'));
    const qbox = slide.querySelector('#attn-box-'+qi);
    if(qbox) qbox.classList.add('query');
    for(let i=0;i<5;i++){
      const line = slide.querySelector('#attn-l-'+i);
      if(!line) continue;
      line.setAttribute('opacity', 0.15 + w[i]*0.75);
      line.setAttribute('stroke-width', 1 + w[i]*6);
    }
    const qlabel = slide.querySelector('#attn-qlabel');
    const words = ['The','cat','sat'];
    if(qlabel) qlabel.textContent = 'query = "'+words[Math.min(step-1,2)]+'" looks at every word directly';
  },
  moe: function(slide, step){
    const routes = [
      {tok:'"Hello"', experts:[1,4]},
      {tok:'"world"', experts:[0,6]},
      {tok:'"!"', experts:[2,7]}
    ];
    const r = routes[Math.min(step-1,2)];
    slide.querySelectorAll('.expbox').forEach(e=>e.classList.remove('active'));
    r.experts.forEach(idx=>{
      const box = slide.querySelector('#moe-exp-'+idx);
      if(box) box.classList.add('active');
    });
    const tokEl = slide.querySelector('#moe-token');
    if(tokEl) tokEl.textContent = r.tok;
  }
};

function applyStepFX(slide){
  const id = slide.dataset.id;
  const step = parseInt(slide.dataset.step||'1');
  if(STEP_FX[id]) STEP_FX[id](slide, step);
}

function goTo(i){
  if(i<0 || i>=slideEls.length) return;
  slideEls[cur].classList.remove('active','show2','show3','show4');
  slideEls[cur].dataset.step = '1';
  resetReveal(slideEls[cur]);
  cur = i;
  const s = slideEls[cur];
  s.dataset.step = '1';
  s.classList.add('active');
  resetReveal(s);
  revealIn(s);
  applyStepFX(s);
  updateNav();
}

function forward(){
  const s = slideEls[cur];
  const maxStep = parseInt(s.dataset.steps||'1');
  const step = parseInt(s.dataset.step||'1');
  if(step < maxStep){
    const ns = step+1;
    s.dataset.step = ns;
    s.classList.add('show'+ns);
    applyStepFX(s);
    updateNav();
    return;
  }
  goTo(cur+1);
}
function backward(){
  const s = slideEls[cur];
  const step = parseInt(s.dataset.step||'1');
  if(step > 1){
    s.classList.remove('show'+step);
    s.dataset.step = step-1;
    applyStepFX(s);
    updateNav();
    return;
  }
  goTo(cur-1);
}

function updateNav(){
  navcount.textContent = (cur+1)+' / '+slideEls.length;
  prevBtn.disabled = (cur===0 && parseInt(slideEls[cur].dataset.step||'1')===1);
  nextBtn.disabled = (cur===slideEls.length-1 && parseInt(slideEls[cur].dataset.step||'1')>=parseInt(slideEls[cur].dataset.steps||'1'));
}

prevBtn.addEventListener('click', backward);
nextBtn.addEventListener('click', forward);
window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key===' '){ forward(); e.preventDefault(); }
  else if(e.key==='ArrowLeft'){ backward(); e.preventDefault(); }
  else if(e.key.toLowerCase()==='c'){ mnCheckCollisions(); }
});

function fitStage(){
  const vw = window.innerWidth, vh = window.innerHeight - 92;
  const scale = Math.min(vw/1280, vh/720) * 0.96;
  stage.style.transform = 'scale(' + scale + ')';
}
window.addEventListener('resize', fitStage);
fitStage();

slideEls[0].classList.add('active');
revealIn(slideEls[0]);
updateNav();

/* collision detector dev tool */
function mnCheckCollisions(opts){
  opts = opts || {};
  const active = document.querySelector('.slide.active');
  if(!active) return;
  const scale = parseFloat((stage.style.transform.match(/scale\\(([\\d.]+)\\)/)||[0,1])[1]);
  const stageRect = stage.getBoundingClientRect();
  const nodes = active.querySelectorAll('[style*="left"], .eyebrow, .title, .caption, .chip, .recap-item');
  const boxes = [];
  nodes.forEach(n=>{
    const r = n.getBoundingClientRect();
    if(r.width===0||r.height===0) return;
    boxes.push({el:n, x:(r.left-stageRect.left)/scale, y:(r.top-stageRect.top)/scale, w:r.width/scale, h:r.height/scale});
  });
  let collisions = 0;
  const offenders = [];
  for(let i=0;i<boxes.length;i++){
    for(let j=i+1;j<boxes.length;j++){
      const a=boxes[i], b=boxes[j];
      if(a.el.contains(b.el) || b.el.contains(a.el)) continue;
      const overlap = !(a.x+a.w < b.x || b.x+b.w < a.x || a.y+a.h < b.y || b.y+b.h < a.y);
      if(overlap){ collisions++; offenders.push([a.el,b.el]); }
    }
  }
  const badge = document.getElementById('collbadge');
  badge.style.display='block';
  if(collisions===0){
    badge.style.background='rgba(124,184,143,.15)'; badge.style.color='var(--green)'; badge.style.border='1px solid var(--green)';
    badge.textContent='no overlaps';
  } else {
    badge.style.background='rgba(201,129,152,.15)'; badge.style.color='var(--rose)'; badge.style.border='1px solid var(--rose)';
    badge.textContent=collisions+' overlaps';
    console.log('Collisions:', offenders);
  }
  if(opts.highlight!==false){
    offenders.forEach(pair=>pair.forEach(el=>{ el.style.outline='1px dashed var(--rose)'; }));
  }
}
</script>
