<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermodynamics & Statistical Mechanics — an animated walkthrough</title>
<style>
  :root{
    --bg:#06080c;
    --ink:#e9e9ee;
    --dim:#8a8f9c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden;
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink)}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
  canvas{display:block;background:var(--bg)}
  /* nav chrome */
  #bar{position:fixed;left:0;right:0;bottom:14px;display:flex;gap:10px;align-items:center;
    justify-content:center;z-index:10;pointer-events:none}
  .btn{pointer-events:auto;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);
    color:var(--ink);border-radius:9px;padding:8px 14px;font-size:13px;letter-spacing:.02em;
    cursor:pointer;transition:background .15s,border-color .15s;user-select:none;
    backdrop-filter:blur(4px)}
  .btn:hover{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.28)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid #6b9bd1;outline-offset:2px}
  #hint{position:fixed;right:16px;top:14px;font-size:11px;color:var(--dim);z-index:10;
    letter-spacing:.06em;text-transform:uppercase}
  #menuBtn{position:fixed;left:16px;top:14px;z-index:11}
  #menu{position:fixed;inset:0;background:rgba(4,6,10,.94);z-index:20;display:none;
    padding:46px 40px;overflow:auto}
  #menu.open{display:block}
  #menu h2{font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.16em;margin-bottom:18px}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 18px;max-width:1100px;margin:0 auto}
  .mitem{font-size:13px;color:#c7ccd6;padding:7px 10px;border-radius:6px;cursor:pointer;
    border-left:2px solid transparent;display:flex;gap:9px}
  .mitem:hover{background:rgba(255,255,255,.05);border-left-color:#6b9bd1}
  .mitem .n{color:#5b6270;min-width:26px;text-align:right;font-variant-numeric:tabular-nums}
  .mitem.head{color:#d6a95c;font-weight:600;letter-spacing:.04em;margin-top:12px;cursor:default}
  .mitem.head:hover{background:none;border-left-color:transparent}
  @media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1280" height="720"></canvas></div>

<button id="menuBtn" class="btn" title="Slide index">☰ Contents</button>
<div id="hint">← → or Space · R replay · Click = next</div>
<div id="bar">
  <button class="btn" id="prev">‹ Prev</button>
  <button class="btn" id="replay">⟳ Replay</button>
  <button class="btn" id="next">Next ›</button>
</div>
<div id="menu"><h2>Thermodynamics &amp; Statistical Mechanics — contents</h2><div class="mgrid" id="mgrid"></div></div>

<script>
"use strict";
/* ============================================================
   ENGINE  ·  1280×720 internal, letterboxed to fit 16:9
   ============================================================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1280, H = 720;

function fit(){
  const s = Math.min(innerWidth/W, innerHeight/H);
  cv.style.width  = (W*s)+'px';
  cv.style.height = (H*s)+'px';
}
addEventListener('resize', fit); fit();

/* ---- palette: colors encode physics ---- */
const C = {
  bg:'#06080c', ink:'#e9e9ee', dim:'#8a8f9c', faint:'#5a6070',
  grid:'#1b2029', panel:'#0e131b',
  blue:'#6b9bd1',   // cold / order
  teal:'#57b0a3',   // flow / neutral quantity
  amber:'#d6a95c',  // heat / question
  red:'#cf6a5c',    // hot
  green:'#7fb069',  // work / go
  purple:'#9b8cc4', // entropy / probability
  slate:'#78889c'
};
const FMATH = "'Georgia','Cambria','Times New Roman',serif";
const FUI    = "'Inter','Segoe UI',system-ui,sans-serif";

/* ---- math helpers ---- */
const clamp01 = x => x<0?0:x>1?1:x;
const lerp = (a,b,t)=>a+(b-a)*t;
const smooth = t => { t=clamp01(t); return t*t*(3-2*t); };
const easeOut = t => { t=clamp01(t); return 1-Math.pow(1-t,3); };
const easeInOut = t => { t=clamp01(t); return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; };
/** eased 0..1 progress of an element starting at `start`, lasting `dur` */
const app = (t,start,dur=0.7)=> smooth((t-start)/dur);
const TAU = Math.PI*2;

/* ---- drawing helpers ---- */
function txt(s,x,y,o={}){
  ctx.save();
  ctx.font = `${o.weight||400} ${o.italic?'italic ':''}${o.size||24}px ${o.font||FUI}`;
  ctx.fillStyle = o.color||C.ink;
  ctx.globalAlpha = o.alpha??1;
  ctx.textAlign = o.align||'left';
  ctx.textBaseline = o.baseline||'alphabetic';
  if(o.shadow){ctx.shadowColor=o.shadow;ctx.shadowBlur=o.shadowBlur||8;}
  ctx.fillText(s,x,y);
  ctx.restore();
}
function ln(x1,y1,x2,y2,o={}){
  ctx.save();
  ctx.strokeStyle=o.color||C.ink; ctx.lineWidth=o.w||2;
  ctx.globalAlpha=o.alpha??1; ctx.lineCap=o.cap||'round';
  if(o.dash) ctx.setLineDash(o.dash);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.restore();
}
function arrow(x1,y1,x2,y2,o={}){
  const col=o.color||C.ink, w=o.w||2.4, head=o.head||10;
  ln(x1,y1,x2,y2,{color:col,w,alpha:o.alpha,dash:o.dash});
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.save(); ctx.globalAlpha=o.alpha??1; ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-head*Math.cos(a-.42), y2-head*Math.sin(a-.42));
  ctx.lineTo(x2-head*Math.cos(a+.42), y2-head*Math.sin(a+.42));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function circ(x,y,r,o={}){
  ctx.save(); ctx.globalAlpha=o.alpha??1;
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(o.fill){ctx.fillStyle=o.fill;ctx.fill();}
  if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=o.w||2;ctx.stroke();}
  ctx.restore();
}
function rrect(x,y,w,h,r,o={}){
  ctx.save(); ctx.globalAlpha=o.alpha??1;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  if(o.fill){ctx.fillStyle=o.fill;ctx.fill();}
  if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=o.w||2;ctx.stroke();}
  ctx.restore();
}
function poly(pts,o={}){
  ctx.save(); ctx.globalAlpha=o.alpha??1;
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  if(o.close)ctx.closePath();
  if(o.fill){ctx.fillStyle=o.fill;ctx.fill();}
  if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=o.w||2;ctx.setLineDash(o.dash||[]);ctx.stroke();}
  ctx.restore();
}
/* formula renderer: segs = [{s,kind,color,it}] kind: base|sub|sup ; returns width */
function measF(segs,size){
  let w=0;
  for(const g of segs){
    const sz = g.kind==='base'||!g.kind ? size : size*0.62;
    ctx.font=`italic ${sz}px ${FMATH}`; w+=ctx.measureText(g.s).width;
  }
  return w;
}
function formula(segs,x,y,size,o={}){
  let cx=x; const align=o.align||'left';
  if(align!=='left'){ const tw=measF(segs,size); cx = align==='center'? x-tw/2 : x-tw; }
  ctx.save(); ctx.globalAlpha=o.alpha??1; ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  for(const g of segs){
    const sz=g.kind==='base'||!g.kind?size:size*0.62;
    const dy=g.kind==='sub'?size*0.26:g.kind==='sup'?-size*0.42:0;
    ctx.font=`${(g.it===false)?'':'italic '}${sz}px ${FMATH}`;
    ctx.fillStyle=g.color||o.color||C.ink;
    ctx.fillText(g.s,cx,y+dy); cx+=ctx.measureText(g.s).width;
  }
  ctx.restore(); return cx-x;
}
/* quick multiline caption block, left aligned, dim */
function caption(lines,x,y,o={}){
  const lh=o.lh||26, size=o.size||18;
  lines.forEach((L,i)=> txt(L,x,y+i*lh,{size,color:o.color||C.dim,align:o.align||'left',alpha:o.alpha,font:o.font||FUI,weight:o.weight}));
}

/* ---- reusable scenes ---- */
function makeGas(n,x,y,w,h,spd,r){
  const ps=[];
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU;
    ps.push({x:x+r+Math.random()*(w-2*r), y:y+r+Math.random()*(h-2*r),
      vx:Math.cos(a), vy:Math.sin(a), flash:0});
  }
  return {ps,x,y,w,h,spd,r};
}
function updGas(g,dt){
  for(const p of g.ps){
    p.x+=p.vx*g.spd*dt; p.y+=p.vy*g.spd*dt;
    if(p.x<g.x+g.r){p.x=g.x+g.r;p.vx=Math.abs(p.vx);p.flash=1;}
    if(p.x>g.x+g.w-g.r){p.x=g.x+g.w-g.r;p.vx=-Math.abs(p.vx);p.flash=1;}
    if(p.y<g.y+g.r){p.y=g.y+g.r;p.vy=Math.abs(p.vy);p.flash=1;}
    if(p.y>g.y+g.h-g.r){p.y=g.y+g.h-g.r;p.vy=-Math.abs(p.vy);p.flash=1;}
    p.flash=Math.max(0,p.flash-dt*3);
  }
}
function drawGas(g,col){
  for(const p of g.ps){
    if(p.flash>0) circ(p.x,p.y,g.r+4,{stroke:col,w:1.5,alpha:p.flash*0.5});
    circ(p.x,p.y,g.r,{fill:col,alpha:0.9});
  }
}
function reservoir(x,y,w,h,col,label,alpha=1){
  rrect(x,y,w,h,8,{fill:col+'22',stroke:col,w:2,alpha});
  txt(label,x+w/2,y+h/2+6,{size:18,color:col,align:'center',alpha});
}

/* ============================================================
   SLIDES
   ============================================================ */
const P = { // pillar tags
  intro:'Overview', p1:'P3.1 · Temperature & Heat', p2:'P3.2 · Kinetic Theory',
  p3:'P3.3 · Laws of Thermodynamics', p4:'P3.4 · Cycles & Engines',
  p5:'P3.5 · Thermodynamic Potentials', p6:'P3.6 · Statistical Mechanics',
  app:'Applications', bridge:'Bridge'
};

const slides = [];
const S = (o)=>slides.push(o);

/* ---------- 0 · TITLE ---------- */
S({ pillar:P.intro, title:'', menu:'Title',
  init(s){ s.gas=makeGas(90,0,0,W,H,55,3.2); },
  update(s,dt){ updGas(s.gas,dt); },
  draw(ctx,s,t){
    // faint drifting particles that "cool" into the title
    const settle = smooth(t/3);
    for(const p of s.gas.ps){
      circ(p.x,p.y,3.2,{fill:C.slate,alpha:0.10*(1-settle)});
    }
    txt('THE PHYSICS OF HEAT, ENERGY & PROBABILITY',W/2,250,{size:15,color:C.amber,align:'center',alpha:app(t,.3,.8),weight:600});
    txt('Thermodynamics',W/2,332,{size:58,color:C.ink,align:'center',alpha:app(t,.6,.9),weight:700});
    txt('& Statistical Mechanics',W/2,398,{size:42,color:C.blue,align:'center',alpha:app(t,1.0,.9),weight:400,font:FMATH,italic:true});
    // the throughline
    const a=app(t,1.8,1);
    txt('microscopic jiggling',420,500,{size:20,color:C.dim,align:'center',alpha:a,italic:true,font:FMATH});
    arrow(560,495,720,495,{color:C.teal,alpha:a,w:2.2});
    txt('the laws of energy',860,500,{size:20,color:C.dim,align:'center',alpha:a,italic:true,font:FMATH});
    txt('Feynman: "If all of science were destroyed... the atomic hypothesis — that things are made of',W/2,590,{size:15,color:C.faint,align:'center',alpha:app(t,2.6,1)});
    txt('atoms in perpetual motion — carries the most information in the fewest words."',W/2,613,{size:15,color:C.faint,align:'center',alpha:app(t,2.9,1)});
  }
});

/* ---------- 1 · ROADMAP ---------- */
S({ pillar:P.intro, title:'The six pillars — and the one idea beneath them', menu:'Roadmap',
  draw(ctx,s,t){
    const items=[
      ['P3.1','Temperature & Heat','what "hot" means',C.red],
      ['P3.2','Kinetic Theory','gas = bouncing atoms',C.teal],
      ['P3.3','The Three (+2) Laws','energy & entropy rules',C.amber],
      ['P3.4','Cycles & Engines','turning heat into work',C.green],
      ['P3.5','Potentials','the "useful energy" toolkit',C.blue],
      ['P3.6','Statistical Mechanics','laws from counting states',C.purple],
    ];
    const x0=170,y0=180,cw=430,ch=118,gx=470,gy=140;
    items.forEach((it,i)=>{
      const col=i%2, row=(i/2)|0;
      const x=x0+col*gx, y=y0+row*gy;
      const a=app(t,0.2+i*0.28,0.7);
      rrect(x,y,cw,ch,10,{stroke:it[3],w:1.6,fill:it[3]+'14',alpha:a});
      txt(it[0],x+22,y+40,{size:15,color:it[3],alpha:a,weight:700});
      txt(it[1],x+22,y+72,{size:24,color:C.ink,alpha:a,weight:600});
      txt(it[2],x+22,y+98,{size:15,color:C.dim,alpha:a});
    });
    const a=app(t,2.2,1);
    txt('One thread runs through all of it:  atoms move  →  we can only track averages  →  those averages obey exact laws.',
      W/2,678,{size:17,color:C.amber,align:'center',alpha:a,italic:true,font:FMATH});
  }
});

/* ================= P3.1 TEMPERATURE & HEAT ================= */

/* 2 · what is temperature */
S({ pillar:P.p1, title:'Temperature is not "heat" — it is average jiggle', menu:'What is temperature',
  init(s){ s.g=makeGas(46,150,180,470,380,40,5); },
  update(s,dt,t){ s.g.spd=lerp(22,150,smooth((Math.sin(t*0.5)+1)/2)); updGas(s.g,dt); },
  draw(ctx,s,t){
    rrect(150,180,470,380,10,{stroke:C.grid,w:2,fill:C.panel});
    drawGas(s.g,C.red);
    // KE meter + thermometer
    const speed=(s.g.spd-22)/128; // 0..1
    txt('avg kinetic energy',770,215,{size:16,color:C.dim,align:'left'});
    rrect(770,230,260,26,6,{stroke:C.grid,w:1.5});
    rrect(772,232,256*speed,22,5,{fill:C.amber});
    // thermometer
    const tx=1165, tby=560, tlen=330;
    ln(tx,tby-tlen,tx,tby,{color:C.grid,w:14,cap:'round'});
    ln(tx,tby-tlen*speed,tx,tby,{color:C.red,w:14,cap:'round'});
    circ(tx,tby+12,20,{fill:C.red});
    txt('T',tx+34,tby-tlen+8,{size:26,color:C.red,italic:true,font:FMATH});
    // formula
    formula([{s:'⟨ '},{s:'½'},{s:'mv'},{s:'²',kind:'sup'},{s:' ⟩ = '},{s:'³⁄₂'},{s:' k'},{s:'B',kind:'sub'},{s:'T'}],
      770,340,30,{align:'left'});
    caption([
      'Temperature ∝ the *average* translational',
      'kinetic energy of the particles.',
      '',
      'Heat is different: heat is energy *in transit*',
      'from hot to cold. You never "have heat" —',
      'you have internal energy; heat is a flow.'
    ],770,390,{lh:27,size:17});
    txt('Watch the box heat up and cool down as ⟨v⟩ rises and falls.',W/2,640,{size:15,color:C.faint,align:'center',alpha:app(t,1.5,1)});
  }
});

/* 3 · thermal expansion */
S({ pillar:P.p1, title:'Thermal expansion — hotter atoms need more room', menu:'Thermal expansion',
  draw(ctx,s,t){
    const heat=smooth((Math.sin(t*0.6)+1)/2);         // 0..1
    const spacing=lerp(34,50,heat), amp=lerp(1.5,6,heat);
    const rows=5, cols=11, x0=210, y0=250;
    const width=(cols-1)*spacing;
    // lattice of atoms on springs
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const jx=Math.sin(t*6+r*1.3+c*0.9)*amp, jy=Math.cos(t*5+c*1.1+r)*amp;
      const x=x0+c*spacing+jx, y=y0+r*spacing+jy;
      if(c<cols-1){const nx=x0+(c+1)*spacing+Math.sin(t*6+r*1.3+(c+1)*0.9)*amp; ln(x,y,nx,y0+r*spacing,{color:C.grid,w:1.2});}
      if(r<rows-1) ln(x,y,x0+c*spacing,y0+(r+1)*spacing,{color:C.grid,w:1.2});
      circ(x,y,7,{fill:`rgb(${Math.round(lerp(107,207,heat))},${Math.round(lerp(155,106,heat))},${Math.round(lerp(209,92,heat))})`});
    }
    // length bracket
    const ly=y0+(rows-1)*spacing+55;
    ln(x0,ly,x0+width,ly,{color:C.amber,w:2});
    ln(x0,ly-8,x0,ly+8,{color:C.amber,w:2}); ln(x0+width,ly-8,x0+width,ly+8,{color:C.amber,w:2});
    txt('L(T)',x0+width/2,ly+30,{size:20,color:C.amber,align:'center',italic:true,font:FMATH});
    // formula + text
    formula([{s:'ΔL = α L'},{s:'0',kind:'sub'},{s:' ΔT'}],820,300,30);
    caption([
      'Bonds behave like springs with an *asymmetric*',
      'well — squeezing costs more than stretching.',
      'So as jiggle grows, the *average* separation',
      'grows too. The solid literally swells.',
      '',
      'α = coefficient of linear expansion.'
    ],820,346,{lh:27,size:17});
    txt('Practical: rail gaps, bridge expansion joints, bimetallic thermostats, why hot glass cracks.',
      W/2,650,{size:15,color:C.faint,align:'center'});
  }
});

/* 4 · heat capacity */
S({ pillar:P.p1, title:'Heat capacity — same heat in, different warm-up', menu:'Heat capacity',
  init(s){ s.pk=[]; },
  update(s,dt,t){
    if(t<6 && Math.random()<dt*4){ s.pk.push({x:250+Math.random()*10,y:120,side:0,life:0}); s.pk.push({x:790+Math.random()*10,y:120,side:1,life:0}); }
    for(const p of s.pk){ p.life+=dt; }
    s.pk=s.pk.filter(p=>p.life<1.4);
  },
  draw(ctx,s,t){
    const heat=clamp01(t/6);
    function beaker(x,label,c,rise){
      rrect(x,240,220,300,10,{stroke:C.grid,w:2,fill:C.panel});
      const lv=lerp(60,270,rise);
      rrect(x+8,240+300-lv-8,204,lv,6,{fill:c+'55'});
      txt(label,x+110,220,{size:18,color:C.ink,align:'center'});
      // thermometer readout
      txt('ΔT',x+110,575,{size:18,color:c,align:'center',italic:true,font:FMATH});
      txt(rise<0.5?'big rise':'small rise',x+110,600,{size:15,color:C.dim,align:'center'});
    }
    beaker(140,'low C  (metal)',C.red, heat);           // rises fast
    beaker(680,'high C  (water)',C.blue, heat*0.42);    // rises slow
    // falling heat packets (equal to both)
    for(const p of s.pk){ const y=lerp(120,235,easeOut(p.life/1.0)); circ(p.x,y,6,{fill:C.amber,alpha:1-clamp01((p.life-0.9)/0.5)}); }
    txt('equal heat Q →',W/2,150,{size:16,color:C.amber,align:'center'});
    formula([{s:'Q = m c ΔT'}],960,300,30,{align:'center'});
    caption([
      'Pour the *same* Q into both.',
      '',
      'Metal (small c) leaps up in temperature.',
      'Water (large c) barely warms.',
      '',
      'c = specific heat = energy to raise 1 kg by 1 K.',
      'Water\'s huge c is why oceans buffer climate',
      'and why coolant is water-based.'
    ],850,346,{lh:26,size:16});
  }
});

/* 5 · latent heat / heating curve */
S({ pillar:P.p1, title:'Phase changes hide heat — the plateaus of latent heat', menu:'Latent heat',
  draw(ctx,s,t){
    const ox=180,oy=560,w=700,h=360;
    // axes
    arrow(ox,oy,ox+w+20,oy,{color:C.dim,w:1.6}); arrow(ox,oy,ox,oy-h-10,{color:C.dim,w:1.6});
    txt('heat added  →',ox+w/2,oy+34,{size:15,color:C.dim,align:'center'});
    txt('T',ox-30,oy-h/2,{size:18,color:C.dim,align:'center',italic:true,font:FMATH});
    // piecewise curve: rise, plateau(melt), rise, plateau(boil), rise
    const pts=[[0,.9],[.15,.62],[.35,.62],[.5,.4],[.62,.4],[.85,.4] ,[.62,.4],[.62,.4]];
    // build explicit path in data space (x frac, y frac from top)
    const path=[[0,.92],[.14,.62],[.36,.62],[.5,.42],[.74,.42],[.9,.14]];
    const prog=easeInOut(clamp01(t/4));
    // draw with reveal
    const total=path.length-1;
    for(let i=0;i<total;i++){
      const seg=i/total, segEnd=(i+1)/total;
      if(prog<=seg) break;
      const local=clamp01((prog-seg)/(segEnd-seg));
      const a=[ox+path[i][0]*w, oy-h+path[i][1]*h];
      const b=[ox+path[i+1][0]*w, oy-h+path[i+1][1]*h];
      const flat=(path[i][1]===path[i+1][1]);
      ln(a[0],a[1],lerp(a[0],b[0],local),lerp(a[1],b[1],local),{color:flat?C.amber:C.red,w:3.5});
    }

/* 10 · mean free path */
S({ pillar:P.p2, title:'Mean free path — how far before the next bump', menu:'Mean free path',
  init(s){ s.g=makeGas(34,180,190,470,370,110,6); s.hero={x:250,y:300,vx:1,vy:0.4,trail:[]}; },
  update(s,dt){

    if(h.x<186||h.x>644){h.vx*=-1;bump=true;} if(h.y<196||h.y>554){h.vy*=-1;bump=true;}
    // collide with field particles
    for(const p of s.g.ps){ const dx=p.x-h.x,dy=p.y-h.y; if(dx*dx+dy*dy<200){ const a=Math.atan2(dy,dx)+Math.PI+(Math.random()-.5); h.vx=Math.cos(a);h.vy=Math.sin(a); bump=true; break; } }
    if(bump) h.trail.push({x:h.x,y:h.y});
    if(h.trail.length>18) h.trail.shift();
  },

      'ricochets — over and over. The average straight',
      'run between hits is the mean free path λ.',
      '',
      'σ = collision cross-section, n = density.',
      'Denser gas → shorter λ. At room pressure λ ≈ 70 nm;',
      'in deep vacuum it can be kilometers.',
      '',

/* 15 · processes on PV */
S({ pillar:P.p3, title:'Four ways to change a gas — read them on a P–V map', menu:'Thermodynamic processes',
  draw(ctx,s,t){
    const ox=170,oy=580,w=470,h=420;
    arrow(ox,oy,ox+w+20,oy,{color:C.dim,w:1.6}); arrow(ox,oy,ox,oy-h-10,{color:C.dim,w:1.6});
    txt('V',ox+w+10,oy+28,{size:18,color:C.dim,italic:true,font:FMATH}); txt('P',ox-24,oy-h,{size:18,color:C.dim,italic:true,font:FMATH});
    const X=v=>ox+v*w, Y=p=>oy-p*h;
    const start=[0.25,0.75];
    const procs=[
      ['Isochoric  (V fixed)', C.blue,  t0=>[[0.25,0.75],[0.25,0.3]]],
      ['Isobaric  (P fixed)',  C.green, t0=>[[0.25,0.75],[0.8,0.75]]],
      ['Isothermal  (T fixed)',C.amber, null],
      ['Adiabatic  (Q = 0)',   C.red,   null],
    ];
    // draw each with staggered reveal
    procs.forEach((pr,i)=>{
      const rev=easeOut(app(t,0.4+i*0.7,0.9));
      ctx.save(); ctx.strokeStyle=pr[1]; ctx.lineWidth=3; ctx.beginPath();
      if(i<2){ const seg=pr[2](); const a=[X(seg[0][0]),Y(seg[0][1])],b=[X(seg[1][0]),Y(seg[1][1])];
        ctx.moveTo(a[0],a[1]); ctx.lineTo(lerp(a[0],b[0],rev),lerp(a[1],b[1],rev)); }
      else { // curves from start point
        const k=(i===2)?1:1.4; // adiabatic steeper
        const v0=0.25,p0=0.75, c=p0*Math.pow(v0,k);
        let first=true;
        for(let v=v0; v<=v0+(0.55)*rev+0.001; v+=0.01){ const p=c/Math.pow(v,k); const x=X(v),y=Y(p); if(first){ctx.moveTo(x,y);first=false;} else ctx.lineTo(x,y); }
      }
      ctx.stroke(); ctx.restore();
    });
    circ(X(start[0]),Y(start[1]),6,{fill:C.ink});
    // legend
    let ly=200; procs.forEach((pr,i)=>{ const a=app(t,0.4+i*0.7,.6);

    caption([
      'Same gas, four different "recipes" for changing',
      'it. The *path* matters: work done = area under',
      'the curve, and it differs for each route even',
      'between the same two states.',
      '',
      'Isothermal: heat swaps to hold T. Adiabatic:',
      'insulated, so pushing out cools it (why spray',
      'cans get cold, why mountain air is chilly).'
    ],760,420,{lh:26,size:16});
  }
});

/* 18 · third law */
S({ pillar:P.p3, title:'Third Law — you can approach absolute zero, never touch it', menu:'Third law',
  draw(ctx,s,t){
    const ox=200,oy=560,w=560,h=380;
    arrow(ox,oy,ox+w+20,oy,{color:C.dim,w:1.6}); arrow(ox,oy,ox,oy-h-10,{color:C.dim,w:1.6});
    txt('T  →',ox+w/2,oy+30,{size:15,color:C.dim,align:'center'}); txt('0',ox-4,oy+26,{size:14,color:C.dim,align:'center'});
    txt('S',ox-24,oy-h,{size:18,color:C.dim,italic:true,font:FMATH});
    // entropy curve flattening to a floor at T→0
    const rev=easeOut(clamp01(t/2.2));
    ctx.save();ctx.strokeStyle=C.purple;ctx.lineWidth=3;ctx.beginPath();
    for(let u=0;u<=rev;u+=0.01){ const T=u; const x=ox+T*w; const S=Math.sqrt(T)*0.9; const y=oy-S*h; u?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.stroke();ctx.restore();
    // staircase of cooling steps that get smaller (never reach 0)
    let cx=ox+w*0.9, step=w*0.42; const a=app(t,2.4,1);
    for(let i=0;i<7;i++){ const nx=cx-step; ln(cx,oy-Math.sqrt((cx-ox)/w)*h*0.9, nx, oy-Math.sqrt((nx-ox)/w)*h*0.9,{color:C.blue,w:2,alpha:a}); cx=nx; step*=0.55; }

    formula([{s:'S → S'},{s:'0',kind:'sub'},{s:'  as  T → 0'}],860,270,28);
    caption([
      'As a perfect crystal cools, its entropy heads to',
      'a fixed floor (zero for a unique ground state).',
      '',
      'Getting there would take infinitely many steps —',
      'so absolute zero is unreachable in finite time.',
      '',
      'Modern labs reach billionths of a kelvin, where',
      'exotic quantum matter (BECs, superconductors)',
      'appears — but never a true 0 K.'

  }
});

/* 21 · Carnot cycle */
S({ pillar:P.p4, title:'The Carnot cycle — the theoretical best, traced out', menu:'Carnot cycle',
  draw(ctx,s,t){
    const ox=170,oy=580,w=470,h=430;
    arrow(ox,oy,ox+w+20,oy,{color:C.dim,w:1.6}); arrow(ox,oy,ox,oy-h-10,{color:C.dim,w:1.6});
    txt('V',ox+w+8,oy+26,{size:16,color:C.dim,italic:true,font:FMATH}); txt('P',ox-22,oy-h,{size:16,color:C.dim,italic:true,font:FMATH});
    const X=v=>ox+(v-0.2)/1.0*w, Y=p=>oy-(p-0.15)/1.05*h;
    // four state points
    const A=[0.35,1.05],B=[0.6,0.62],Cc=[0.95,0.32],D=[0.55,0.52];
    // isotherm/adiabat curves approximated by segments through control pts
    const segs=[[A,B,C.amber,'isothermal expansion · absorb Q_h'],
                [B,Cc,C.red,'adiabatic expansion · cools'],
                [Cc,D,C.blue,'isothermal compression · reject Q_c'],
                [D,A,C.green,'adiabatic compression · heats']];
    const prog=(t*0.28)%1;
    const which=Math.floor(prog*4);
    segs.forEach((sg,i)=>{
      const done=i<which?1: i===which? (prog*4-which):0;
      if(done<=0) return;
      ctx.save();ctx.strokeStyle=sg[2];ctx.lineWidth=3.4;ctx.beginPath();
      // quadratic-ish via midpoint bow
      const a=[X(sg[0][0]),Y(sg[0][1])], b=[X(sg[1][0]),Y(sg[1][1])];
      const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2 + (i%2? 24:-24);
      for(let u=0;u<=done;u+=0.02){ const x=(1-u)*(1-u)*a[0]+2*(1-u)*u*mx+u*u*b[0]; const y=(1-u)*(1-u)*a[1]+2*(1-u)*u*my+u*u*b[1]; u?ctx.lineTo(x,y):ctx.moveTo(x,y);}
      ctx.stroke();ctx.restore();
    });
    [A,B,Cc,D].forEach((pt,i)=>{ circ(X(pt[0]),Y(pt[1]),5,{fill:C.ink}); txt(['A','B','C','D'][i],X(pt[0])+10,Y(pt[1])-8,{size:15,color:C.dim}); });
    // current leg label
    txt(segs[which][3],ox+w/2,oy-h-8,{size:16,color:segs[which][2],align:'center'});
    caption([
      'Four reversible strokes:',
      '',
      '1  Absorb Q_h at constant T_h (expand)',
      '2  Coast adiabatically — cool to T_c',
      '3  Reject Q_c at constant T_c (compress)',
      '4  Coast adiabatically — heat back to T_h',
      '',
      'The enclosed loop area = net work per cycle.',
      'No real engine beats a Carnot engine running',
      'between the same two temperatures.'
    ],760,240,{lh:25,size:16});
  }
});

/* 27 · Legendre transform intuition */
S({ pillar:P.p5, title:'How they\'re related — trade a variable for its "price"', menu:'Legendre transform',
  draw(ctx,s,t){
    const ox=200,oy=560,w=520,h=380;
    arrow(ox,oy,ox+w+20,oy,{color:C.dim,w:1.6}); arrow(ox,oy,ox,oy-h-10,{color:C.dim,w:1.6});
    txt('V',ox+w+8,oy+26,{size:16,color:C.dim,italic:true,font:FMATH}); txt('U',ox-22,oy-h,{size:16,color:C.dim,italic:true,font:FMATH});
    // curve U(V)
    const f=v=>0.2+1.1*(v-0.5)*(v-0.5);
    ctx.save();ctx.strokeStyle=C.teal;ctx.lineWidth=3;ctx.beginPath();
    for(let v=0.05;v<=0.95;v+=0.01){ const x=ox+v*w,y=oy-f(v)*h; v<0.06?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke();ctx.restore();
    // moving tangent line (slope = −P): shows swapping V for slope
    const v0=lerp(0.2,0.8,(Math.sin(t*0.6)+1)/2);
    const slope=2*1.1*(v0-0.5), y0=f(v0);
    const tx=v=> y0+slope*(v-v0);
    ln(ox+0.05*w,oy-tx(0.05)*h, ox+0.95*w, oy-tx(0.95)*h,{color:C.amber,w:2,dash:[6,6]});
    circ(ox+v0*w,oy-y0*h,6,{fill:C.amber});
    txt('slope = −P',ox+v0*w+14,oy-y0*h-12,{size:15,color:C.amber,italic:true,font:FMATH});
    formula([{s:'F = U − '},{s:'∂U/∂V'},{s:'· V'}],780,250,24);
    caption([
      'Sometimes you don\'t control V — you control the',
      '*pressure* pushing on it. A Legendre transform',
      'rewrites U(V) into a new function of the slope',
      '(the pressure) instead.',
      '',
      'That single trick generates H, F, and G from U.',
      'Same physics, re-expressed in the variables you',
      'can actually hold fixed on the lab bench.'
    ],780,300,{lh:25,size:16});
  }
});

S({ pillar:P.p5, title:'Real gases misbehave — the van der Waals fix', menu:'Real gases',

    arrow(ox,oy,ox+w+20,oy,{color:C.dim,w:1.6}); arrow(ox,oy,ox,oy-h-10,{color:C.dim,w:1.6});

    // ideal hyperbola (dim)
    ctx.save();ctx.strokeStyle=C.dim;ctx.lineWidth=1.6;ctx.setLineDash([5,5]);ctx.beginPath();
    for(let v=0.12;v<=0.95;v+=0.01){ const p=0.14/v; const x=ox+v*w,y=oy-p*h; v<0.13?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke();ctx.restore();

    txt('van der Waals',ox+0.5*w,oy-0.72*h,{size:14,color:C.teal});
    formula([{s:'( P + a/V'},{s:'²',kind:'sup'},{s:' )( V − b ) = RT'}],790,260,24);

/* 37 · Ising / phase transition */
S({ pillar:P.p6, title:'Order from cooling — the Ising model & phase transitions', menu:'Ising model',
  init(s){ s.grid=[]; const N=16; s.N=N; for(let i=0;i<N*N;i++) s.grid.push(Math.random()<.5?1:-1); s.acc=0;},
  update(s,dt,t){
    const T=lerp(2.6,0.6,smooth(clamp01((t-0.5)/6)));  // cool down
    s.T=T; s.acc+=dt;
    // a few Metropolis-ish sweeps
    const N=s.N; let iters=300;
    while(iters-->0){ const i=(Math.random()*N)|0, j=(Math.random()*N)|0, k=i*N+j;
      let sum=0; if(i>0)sum+=s.grid[(i-1)*N+j]; if(i<N-1)sum+=s.grid[(i+1)*N+j]; if(j>0)sum+=s.grid[i*N+j-1]; if(j<N-1)sum+=s.grid[i*N+j+1];
      const dE=2*s.grid[k]*sum; if(dE<=0||Math.random()<Math.exp(-dE/T)) s.grid[k]*=-1;
    }
  },
  draw(ctx,s,t){
    const N=s.N, ox=200,oy=210, cell=22;
    let mag=0;
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){ const v=s.grid[i*N+j]; mag+=v;
      rrect(ox+j*cell,oy+i*cell,cell-2,cell-2,3,{fill:v>0?C.blue:C.red}); }
    mag=Math.abs(mag)/(N*N);
    // temperature + magnetization gauges
    txt('temperature  T',760,220,{size:16,color:C.dim}); rrect(760,235,300,20,5,{stroke:C.grid,w:1.4}); rrect(762,237,296*clamp01((s.T-0.5)/2.2),16,4,{fill:C.amber});
    txt('order  |M|',760,300,{size:16,color:C.dim}); rrect(760,315,300,20,5,{stroke:C.grid,w:1.4}); rrect(762,317,296*mag,16,4,{fill:C.green});
    txt(s.T>1.4?'above T_c : disordered':'below T_c : ordered',760,375,{size:18,color:s.T>1.4?C.red:C.green,italic:true,font:FMATH});
    caption([
      'Each cell is a tiny magnet nudged to align with',
      'its neighbours, fought by thermal noise.',
      '',
      'Cool past the critical temperature T_c and — with',
      'no outside field — the whole grid spontaneously',
      'picks a direction. Order emerges from nowhere.',
      '',
      'This "phase transition" template explains magnets,',
      'superconductors, boiling, even flocking & opinion',
      'dynamics. Collective behaviour ≠ sum of parts.'
    ],760,410,{lh:24,size:15});
  }
});

function wrapText(str,cx,y,maxw,lh,o){
  ctx.save(); ctx.font=`${o.italic?'italic ':''}${o.size}px ${o.font||FUI}`;
  const words=str.split(' '); let line='',lines=[];
  for(const w of words){ const test=line?line+' '+w:w; if(ctx.measureText(test).width>maxw){lines.push(line);line=w;} else line=test; }
  if(line)lines.push(line); ctx.restore();
  lines.forEach((L,i)=>txt(L,cx,y+i*lh,o));
}

function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  const t=(now-slideStart)/1000;
  const sl=slides[idx];
  // background
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  // subtle vignette
  const g=ctx.createRadialGradient(W/2,H/2,200,W/2,H/2,820);
  g.addColorStop(0,'rgba(255,255,255,0.015)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  try{
    if(sl.update) sl.update(st,dt,t);
    // chrome: pillar + title
    if(!sl.bridge){
      txt(sl.pillar.toUpperCase(),64,54,{size:13,color:C.amber,weight:700});
      if(sl.title) txt(sl.title,64,90,{size:26,color:C.ink,weight:600});
      ln(64,104,1216,104,{color:C.grid,w:1});
    }
    if(sl.bridge) drawBridge(sl,t); else sl.draw(ctx,st,t);
  }catch(e){
    txt('⚠ slide error: '+e.message,W/2,H/2,{size:16,color:C.red,align:'center'});
    if(!frame._logged){console.error(e);frame._logged=true;}
  }

  // footer progress
  const pw=1152, px=64, py=690;
  ln(px,py,px+pw,py,{color:C.grid,w:3});
  ln(px,py,px+pw*(idx+1)/slides.length,py,{color:C.amber,w:3});
  txt((idx+1)+' / '+slides.length,1216,684,{size:13,color:C.dim,align:'right'});

  // fade-in from black on slide entry
  const fade=1-clamp01(t/0.4);
  if(fade>0){ ctx.fillStyle=C.bg; ctx.globalAlpha=fade; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }

  requestAnimationFrame(frame);
}

function goto(i){
  idx=(i+slides.length)%slides.length;
  st={}; if(slides[idx].init) slides[idx].init(st);
  slideStart=performance.now(); last=performance.now();
  frame._logged=false;
}
const next=()=>goto(idx+1), prev=()=>goto(idx-1), replay=()=>goto(idx);

document.getElementById('next').onclick=e=>{e.stopPropagation();next();};
document.getElementById('prev').onclick=e=>{e.stopPropagation();prev();};
document.getElementById('replay').onclick=e=>{e.stopPropagation();replay();};
cv.parentElement.addEventListener('click',()=>next());
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='r'||e.key==='R'){replay();}
  else if(e.key==='Escape'){menu.classList.remove('open');}
});

});
document.getElementById('menuBtn').onclick=()=>menu.classList.toggle('open');
menu.addEventListener('click',e=>{if(e.target===menu)menu.classList.remove('open');});

goto(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
