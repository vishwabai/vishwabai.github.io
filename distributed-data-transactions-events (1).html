<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Distributed Data, Transactions &amp; Events</title>
<style>
  :root{
    --bg:#07090a;
    --panel:#0d1315;
    --grid:#1a2124;
    --text:#e8ecec;
    --muted:#8a9598;
    --teal:#4fb3a6;
    --amber:#c9a24d;
    --rose:#c96a6a;
    --violet:#8f7fc9;
    --blue:#5b8fc9;
    --green:#79b57a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#000;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #app{
    width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:#000;
  }
  #stage{
    position:relative;
    width:min(96vw, 170.6vh);
    height:min(96vh, 54vw);
    aspect-ratio:16/9;
    background:radial-gradient(ellipse at 30% 0%, #0b1012 0%, var(--bg) 55%);
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 0 0 1px #16191a, 0 30px 80px rgba(0,0,0,.6);
  }
  #deck{position:absolute;inset:0;}
  .slide{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    padding:44px 64px 70px 64px;
    opacity:0;
    animation:slideIn .35s ease forwards;
  }
  @keyframes slideIn{from{opacity:0;}to{opacity:1;}}
  .slide.leaving{animation:slideOut .15s ease forwards;}
  @keyframes slideOut{from{opacity:1;}to{opacity:0;}}

  .eyebrow{
    font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--section,var(--teal));font-weight:600;
  }
  .title{
    font-size:30px;font-weight:650;color:var(--text);
    margin:8px 0 0 0;letter-spacing:-.01em;
  }
  .subtitle{
    font-size:15.5px;color:var(--muted);margin:8px 0 0 0;max-width:900px;line-height:1.5;
  }
  .fade-up{opacity:0;transform:translateY(10px);animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
  .pop{opacity:0;transform:scale(.55);transform-box:fill-box;transform-origin:center;
       animation:popIn .5s cubic-bezier(.25,.9,.3,1.25) forwards;}
  @keyframes popIn{to{opacity:1;transform:scale(1);}}
  .pulse{animation:pulseSoft 2s ease-in-out infinite;}
  @keyframes pulseSoft{0%,100%{opacity:.5;}50%{opacity:1;}}
  .bob{animation:bobY 2.6s ease-in-out infinite;}
  @keyframes bobY{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}

  .canvas-wrap{flex:1;position:relative;margin-top:14px;min-height:0;}
  svg.diagram{width:100%;height:100%;display:block;overflow:visible;}
  .node{fill:var(--panel);stroke:var(--teal);stroke-width:2;}
  .node.amber{stroke:var(--amber);} .node.rose{stroke:var(--rose);}
  .node.violet{stroke:var(--violet);} .node.blue{stroke:var(--blue);}
  .node.green{stroke:var(--green);}
  .node.dim{stroke:var(--muted);opacity:.45;}
  .node.filled-teal{fill:var(--teal);fill-opacity:.18;}
  .node.filled-amber{fill:var(--amber);fill-opacity:.18;}
  .node.filled-rose{fill:var(--rose);fill-opacity:.18;}
  .node-label{fill:var(--text);font-size:13px;text-anchor:middle;font-family:inherit;}
  .lbl{fill:var(--muted);font-size:12.5px;text-anchor:middle;}
  .lbl.left{text-anchor:start;} .lbl.right{text-anchor:end;}
  .lbl-strong{fill:var(--text);font-size:14px;text-anchor:middle;font-weight:600;}
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;}
  .edge{stroke:var(--grid);stroke-width:1.6;fill:none;}
  .edge.teal{stroke:var(--teal);} .edge.amber{stroke:var(--amber);}
  .edge.rose{stroke:var(--rose);} .edge.violet{stroke:var(--violet);}
  .edge.dashed{stroke-dasharray:5 5;}
  .box{fill:var(--panel);stroke:var(--grid);stroke-width:1.6;rx:8;}
  .box.teal{stroke:var(--teal);} .box.amber{stroke:var(--amber);}
  .box.rose{stroke:var(--rose);} .box.violet{stroke:var(--violet);}
  .box.blue{stroke:var(--blue);}
  .bubble{fill:var(--panel);stroke:var(--grid);stroke-width:1.6;}
  .bubble.teal{stroke:var(--teal);} .bubble.amber{stroke:var(--amber);}
  .bubble.violet{stroke:var(--violet);} .bubble.rose{stroke:var(--rose);}
  .arrowhead{fill:var(--muted);}
  marker.teal-head path{fill:var(--teal);}

  .formula-box{
    margin-top:14px;display:inline-block;padding:9px 16px;border-radius:6px;
    background:rgba(255,255,255,.03);border:1px solid var(--grid);
    color:var(--amber);font-size:14.5px;letter-spacing:.01em;
  }
  .note-box{
    margin-top:12px;font-size:13.5px;color:var(--muted);max-width:900px;
  }

  .chip{
    display:inline-flex;flex-direction:column;gap:2px;
    padding:10px 14px;border-radius:8px;background:var(--panel);
    border:1px solid var(--grid);font-size:13px;
  }
  .chip b{color:var(--text);font-size:13.5px;}
  .chip span{color:var(--muted);font-size:12px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;}

  /* GAP / cliffhanger slides */
  .gapslide{align-items:center;justify-content:center;text-align:center;}
  .recap-chip{
    color:var(--section,var(--teal));font-size:14.5px;letter-spacing:.02em;
    padding:6px 14px;border:1px solid var(--grid);border-radius:20px;
  }
  .qmark-wrap{margin-top:26px;width:130px;height:130px;}
  .qcircle{fill:none;stroke:var(--section,var(--amber));stroke-width:2.2;}
  .qtext{fill:var(--section,var(--amber));font-size:64px;text-anchor:middle;font-weight:600;}
  .gap-q{
    color:var(--text);font-size:23px;font-weight:600;margin-top:22px;
    max-width:820px;line-height:1.45;
  }
  .gap-q em{color:var(--amber);font-style:normal;}
  .hint{margin-top:26px;color:var(--muted);font-size:12.5px;letter-spacing:.05em;}

  /* nav */
  .nav-bar{
    position:absolute;bottom:0;left:0;right:0;height:56px;
    display:flex;align-items:center;gap:14px;padding:0 22px;
    background:linear-gradient(to top, rgba(0,0,0,.55), transparent);
    z-index:5;
  }
  .nav-btn{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--grid);
    background:rgba(255,255,255,.03);color:var(--text);font-size:15px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .nav-btn:hover{background:rgba(255,255,255,.08);border-color:#2a3336;}
  .progress-track{flex:1;height:3px;background:var(--grid);border-radius:2px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:var(--teal);transition:width .3s ease;}
  .counter{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:56px;text-align:right;}
  .section-dot{width:6px;height:6px;border-radius:50%;background:var(--grid);}
  .section-dot.on{background:var(--teal);}
  .section-dots{display:flex;gap:5px;margin-right:4px;}

  .title-hero{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;height:100%;
  }
  .title-hero .eyebrow{color:var(--muted);}
  .title-hero h1{font-size:44px;font-weight:700;margin:14px 0 0 0;letter-spacing:-.01em;}
  .title-hero p{font-size:16px;color:var(--muted);margin-top:14px;max-width:640px;line-height:1.55;}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="deck"></div>
    <div class="nav-bar">
      <button class="nav-btn" id="prevBtn">&#8249;</button>
      <div class="section-dots" id="sectionDots"></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="counter" id="counter">1 / 1</div>
      <button class="nav-btn" id="nextBtn">&#8250;</button>
    </div>
  </div>
</div>

<script>
/* ============================= SVG helpers ============================= */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function txt(x,y,str,cls){
  const t = el('text',{x:x,y:y,class:cls||'lbl'});
  t.textContent = str;
  return t;
}
function grp(cls){ return el('g', cls?{class:cls}:null); }
function line(x1,y1,x2,y2,cls){ return el('line',{x1:x1,y1:y1,x2:x2,y2:y2,class:'edge '+(cls||'')}); }
function pathEl(d,cls){ return el('path',{d:d,class:'edge '+(cls||'')}); }
function circ(x,y,r,cls){ return el('circle',{cx:x,cy:y,r:r,class:'node '+(cls||'')}); }
function rect(x,y,w,h,cls,rx){ return el('rect',{x:x,y:y,width:w,height:h,rx:rx||8,class:'box '+(cls||'')}); }
function ring(cx,cy,r,n,start){
  start = (start===undefined)?-90:start;
  const pts=[];
  for(let i=0;i<n;i++){
    const a = (start + i*360/n) * Math.PI/180;
    pts.push({x: cx + r*Math.cos(a), y: cy + r*Math.sin(a)});
  }
  return pts;
}
function delayIt(node,i,base){ node.style.animationDelay = ((i||0)*(base||0.12)).toFixed(2)+'s'; return node; }
function addDefs(svg){
  const defs = el('defs');
  const marker = el('marker',{id:'arrow',viewBox:'0 0 10 10',refX:'8.5',refY:'5',markerWidth:'6.5',markerHeight:'6.5',orient:'auto-start-reverse'});
  const mp = el('path',{d:'M0,0 L10,5 L0,10 z',class:'arrowhead'});
  marker.appendChild(mp); defs.appendChild(marker);

  const markerT = el('marker',{id:'arrowTeal',viewBox:'0 0 10 10',refX:'8.5',refY:'5',markerWidth:'6.5',markerHeight:'6.5',orient:'auto-start-reverse'});
  const mpt = el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--teal)'});
  markerT.appendChild(mpt); defs.appendChild(markerT);

  const markerA = el('marker',{id:'arrowAmber',viewBox:'0 0 10 10',refX:'8.5',refY:'5',markerWidth:'6.5',markerHeight:'6.5',orient:'auto-start-reverse'});
  const mpa = el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--amber)'});
  markerA.appendChild(mpa); defs.appendChild(markerA);

  const markerR = el('marker',{id:'arrowRose',viewBox:'0 0 10 10',refX:'8.5',refY:'5',markerWidth:'6.5',markerHeight:'6.5',orient:'auto-start-reverse'});
  const mpr = el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--rose)'});
  markerR.appendChild(mpr); defs.appendChild(markerR);

  svg.appendChild(defs);
}
function arrow(x1,y1,x2,y2,cls,markerId){
  return el('line',{x1:x1,y1:y1,x2:x2,y2:y2,class:'edge '+(cls||''),'marker-end':'url(#'+(markerId||'arrow')+')'});
}
function curve(x1,y1,x2,y2,bend,cls,markerId){
  const mx=(x1+x2)/2, my=(y1+y2)/2 - (bend||40);
  const d = 'M '+x1+' '+y1+' Q '+mx+' '+my+' '+x2+' '+y2;
  const attrs = {d:d, class:'edge '+(cls||'')};
  if(markerId) attrs['marker-end']='url(#'+markerId+')';
  return el('path', attrs);
}

/* ============================= slide scaffolding ============================= */
const SECTION_VAR = {A:'var(--teal)', B:'var(--amber)', C:'var(--violet)'};
function canvas(root, vb){
  const wrap = document.createElement('div'); wrap.className='canvas-wrap';
  const svg = el('svg',{viewBox: vb||'0 0 1200 560', class:'diagram'});
  addDefs(svg);
  wrap.appendChild(svg);
  root.appendChild(wrap);
  return svg;
}
function header(root, cfg){
  if(cfg.section) root.style.setProperty('--section', SECTION_VAR[cfg.section]);
  const e1 = document.createElement('div'); e1.className='eyebrow fade-up'; e1.textContent = cfg.eyebrow;
  root.appendChild(e1);
  const h = document.createElement('h2'); h.className='title fade-up'; h.style.animationDelay='.07s'; h.textContent = cfg.title;
  root.appendChild(h);
  if(cfg.sub){
    const p = document.createElement('p'); p.className='subtitle fade-up'; p.style.animationDelay='.14s'; p.textContent = cfg.sub;
    root.appendChild(p);
  }
}
function formulaBox(root, str, delay){
  const d = document.createElement('div'); d.className='formula-box mono fade-up';
  d.style.animationDelay=(delay||0.32)+'s'; d.textContent = str;
  root.appendChild(d);
  return d;
}
function noteBox(root, str, delay){
  const d = document.createElement('div'); d.className='note-box fade-up';
  d.style.animationDelay=(delay||0.32)+'s'; d.textContent = str;
  root.appendChild(d);
  return d;
}
function chipRow(root, items, delay){
  const wrap = document.createElement('div'); wrap.className='chip-row fade-up';
  wrap.style.animationDelay=(delay||0.3)+'s';
  items.forEach(function(it, i){
    const c = document.createElement('div'); c.className='chip fade-up';
    c.style.animationDelay=((delay||0.3)+ i*0.08)+'s';
    const b = document.createElement('b'); b.textContent = it.t;
    const s = document.createElement('span'); s.textContent = it.d;
    c.appendChild(b); c.appendChild(s);
    wrap.appendChild(c);
  });
  root.appendChild(wrap);
}
function gapSlide(root, cfg){
  root.classList.add('gapslide');
  root.style.setProperty('--section', SECTION_VAR[cfg.section]);
  const chip = document.createElement('div'); chip.className='recap-chip fade-up';
  chip.textContent = 'RECAP — ' + cfg.recap;
  root.appendChild(chip);

  const qwrap = document.createElement('div'); qwrap.className='qmark-wrap pop';
  const svg = el('svg',{viewBox:'0 0 200 200'});
  svg.style.width='100%'; svg.style.height='100%'; svg.style.overflow='visible';
  const c = el('circle',{cx:100,cy:100,r:66,class:'qcircle pulse'});
  svg.appendChild(c);
  svg.appendChild(txt(100,124,'?','qtext'));
  qwrap.appendChild(svg);
  root.appendChild(qwrap);

  const q = document.createElement('div'); q.className='gap-q fade-up'; q.style.animationDelay='.22s';
  q.textContent = cfg.gap;
  root.appendChild(q);

  const hint = document.createElement('div'); hint.className='hint pulse';
  hint.textContent = 'keep going \u2192';
  root.appendChild(hint);
}

/* ============================= deck engine ============================= */
const slides = [];
function addSlide(section, fn){ fn.section = section; slides.push(fn); }

let current = -1;
const timers = [];
function clearTimers(){ timers.forEach(function(id){ clearInterval(id); clearTimeout(id); }); timers.length = 0; }
const deckEl = document.getElementById('deck');

function prepDraw(root){
  const els = root.querySelectorAll('.draw');
  els.forEach(function(p, i){
    let len = 120;
    try { len = p.getTotalLength(); } catch(e){}
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.style.transition = 'none';
    void p.getBoundingClientRect();
    p.style.transition = 'stroke-dashoffset 0.9s ease ' + (i*0.1).toFixed(2) + 's';
    requestAnimationFrame(function(){ p.style.strokeDashoffset = 0; });
  });
}

const SECTIONS = ['A','A','A','A','A','A','A','A','A','A','A','A','A','A','A','A','A','A','A','A','A','A','A','A','A','A','A','A','A'];
function showSlide(i){
  i = Math.max(0, Math.min(slides.length-1, i));
  if(i === current) return;
  clearTimers();
  current = i;
  deckEl.innerHTML = '';
  const root = document.createElement('section');
  root.className = 'slide';
  deckEl.appendChild(root);
  slides[i](root, timers);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ prepDraw(root); }); });
  updateChrome();
}
function updateChrome(){
  document.getElementById('counter').textContent = (current+1) + ' / ' + slides.length;
  document.getElementById('progressFill').style.width = (((current+1)/slides.length)*100).toFixed(1) + '%';
  const dotsWrap = document.getElementById('sectionDots');
  const sec = slides[current].section;
  const order = ['A','B','C'];
  dotsWrap.innerHTML = '';
  order.forEach(function(s){
    const d = document.createElement('div');
    d.className = 'section-dot' + (s===sec ? ' on' : '');
    dotsWrap.appendChild(d);
  });
}

/* ===================================================================== */
/*                                 SLIDE 0                                */
/* ===================================================================== */
addSlide('A', function(root){
  root.classList.add('title-hero');
  root.style.setProperty('--section','var(--teal)');
  const e = document.createElement('div'); e.className='eyebrow fade-up'; e.textContent='SYSTEM DESIGN \u00b7 DISTRIBUTED PATTERNS';
  root.appendChild(e);
  const h = document.createElement('h1'); h.className='fade-up'; h.style.animationDelay='.08s';
  h.textContent = 'Distributed Data, Transactions & Events';
  root.appendChild(h);
  const p = document.createElement('p'); p.className='fade-up'; p.style.animationDelay='.16s';
  p.textContent = "What happens after replicas disagree, a write spans five services, and everyone downstream needs to find out \u2014 without asking.";
  root.appendChild(p);

  const wrap = document.createElement('div'); wrap.style.marginTop='34px'; wrap.style.width='560px'; wrap.style.height='190px';
  root.appendChild(wrap);
  const svg = el('svg',{viewBox:'0 0 560 190'}); svg.style.width='100%'; svg.style.height='100%'; svg.style.overflow='visible';
  wrap.appendChild(svg);
  const pts = [{x:100,y:150,l:'Data',c:'teal'},{x:460,y:150,l:'Events',c:'violet'},{x:280,y:30,l:'Transactions',c:'amber'}];
  svg.appendChild(el('line',Object.assign({x1:pts[0].x,y1:pts[0].y,x2:pts[1].x,y2:pts[1].y},{class:'edge pulse'})));
  svg.appendChild(el('line',Object.assign({x1:pts[0].x,y1:pts[0].y,x2:pts[2].x,y2:pts[2].y},{class:'edge pulse'})));
  svg.appendChild(el('line',Object.assign({x1:pts[1].x,y1:pts[1].y,x2:pts[2].x,y2:pts[2].y},{class:'edge pulse'})));
  pts.forEach(function(p2,i){
    const g = grp('pop'); delayIt(g,i,0.15);
    g.appendChild(circ(p2.x,p2.y,34,p2.c));
    g.appendChild(txt(p2.x,p2.y+50,p2.l,'lbl-strong'));
    svg.appendChild(g);
  });
});

/* ===================================================================== */
addSlide('A', function(root){
  gapSlide(root,{
    section:'A',
    recap:'replicating data across nodes means no single failure loses it.',
    gap:"but replicas drift out of sync \u2014 when two of them disagree, "+"how many need to agree before you trust the answer?"
  });
});

/* ===================================================================== */
addSlide('A', function(root){
  header(root,{section:'A', eyebrow:'DISTRIBUTED DATA \u00b7 QUORUMS',
    title:'Quorums: Agreement by the Numbers',
    sub:"Feynman's question: if I keep N copies of a fact, how many of them do I actually need to check before I believe the answer?"});
  const svg = canvas(root);
  const pts = ring(360,290,150,5);
  const wpts = ring(840,290,150,5);
  // left: write set W
  svg.appendChild(txt(360,110,'writes reach W = 3 of N = 5','lbl-strong'));
  pts.forEach(function(p,i){
    const inW = i<3;
    const g = grp('pop'); delayIt(g,i,0.1);
    g.appendChild(circ(p.x,p.y,28, inW ? 'amber filled-amber' : 'dim'));
    g.appendChild(txt(p.x,p.y+5,'N'+(i+1),'node-label'));
    svg.appendChild(g);
  });
  // right: read set R
  svg.appendChild(txt(840,110,'reads check R = 3 of N = 5','lbl-strong'));
  const readIdx = [1,2,3];
  wpts.forEach(function(p,i){
    const inR = readIdx.indexOf(i) !== -1;
    const g = grp('pop'); delayIt(g,i,0.1+0.5);
    g.appendChild(circ(p.x,p.y,28, inR ? 'teal filled-teal' : 'dim'));
    g.appendChild(txt(p.x,p.y+5,'N'+(i+1),'node-label'));
    svg.appendChild(g);
  });
  // overlap emphasis text
  const overlap = grp('pop'); delayIt(overlap,0,1.3);
  overlap.appendChild(txt(600,300,'W + R > N','lbl-strong'));
  overlap.appendChild(txt(600,326,'guarantees they always','lbl'));
  overlap.appendChild(txt(600,346,'share at least one node','lbl'));
  svg.appendChild(overlap);
  formulaBox(root,'R + W > N  \u2192  every read set overlaps every write set by \u2265 1 replica', 1.5);
});

/* ===================================================================== */
addSlide('A', function(root){
  header(root,{section:'A', eyebrow:'DISTRIBUTED DATA \u00b7 QUORUMS',
    title:'Quorum Reads',
    sub:"A read doesn't trust one replica \u2014 it asks R of them and returns the freshest reply."});
  const svg = canvas(root);
  const client = {x:140,y:280};
  const nodes = [{x:560,y:120,l:'N1',v:'v3 (t=10)'},{x:560,y:280,l:'N2',v:'v3 (t=10)'},{x:560,y:440,l:'N3',v:'v4 (t=14)'}];
  const cg = grp('pop'); cg.appendChild(rect(client.x-55,client.y-30,110,60,'blue')); cg.appendChild(txt(client.x,client.y+6,'client','lbl-strong'));
  svg.appendChild(cg);
  const askIdx = [1,2]; // asks N2, N3 (R=2)
  nodes.forEach(function(n,i){
    const asked = askIdx.indexOf(i)!==-1;
    const g = grp('pop'); delayIt(g,i,0.15);
    g.appendChild(circ(n.x,n.y,30, asked ? 'teal filled-teal':'dim'));
    g.appendChild(txt(n.x,n.y+5,n.l,'node-label'));
    g.appendChild(txt(n.x,n.y+52,n.v, asked ? 'lbl-strong':'lbl'));
    svg.appendChild(g);
    if(asked){
      const a = arrow(client.x+55,client.y-10+i*8,n.x-34,n.y,'teal draw','arrowTeal');
      delayIt(a,i,0.4); svg.appendChild(a);
    }
  });
  const winner = grp('pop'); delayIt(winner,0,1.3);
  winner.appendChild(txt(860,280,'freshest timestamp wins:','lbl'));

addSlide('C', function(root){
  header(root,{section:'C', eyebrow:'EVENT-DRIVEN \u00b7 DELIVERY',
    title:'Event Replay',
    sub:'Because the log is never deleted after reading, you can rewind a consumer\u2019s offset and rebuild state, backfill a new service, or recover from a bug.'});
  const svg = canvas(root, '0 0 1200 420');
  const y = 200;
  for(let k=0;k<8;k++){
    const g = grp('pop'); delayIt(g,k,0.05);
    g.appendChild(rect(80+k*130,y-24,110,48,'violet'));
    g.appendChild(txt(80+k*130+55,y+6,'e'+k,'lbl'));
    svg.appendChild(g);
  }
  const ptr = el('polygon',{points:'','class':'node amber filled-amber'});
  svg.appendChild(ptr);
  const label = txt(0,0,'','lbl-strong'); label.id='replayLabel';
  svg.appendChild(label);
  const positions = [7,2,7];
  let idx = 0;
  function place(){
    const k = positions[idx];
    const cx = 80+k*130+55;
    ptr.setAttribute('points', (cx-12)+','+(y-50)+' '+(cx+12)+','+(y-50)+' '+cx+','+(y-30));
    label.setAttribute('x',cx); label.setAttribute('y',y-60);
    label.textContent = idx===1 ? 'rewind to offset 2' : (idx===0 ? 'reading live (offset 7)' : 're-processing forward again');
    idx = (idx+1)%positions.length;
  }
  place();
  const id = setInterval(place, 1400);
  timers.push(id);
  noteBox(root,'Replay works because the log is immutable and ordered \u2014 the same mechanism event sourcing relies on to rebuild state.', 1.2);
});

addSlide('C', function(root){
  header(root,{section:'C', eyebrow:'EVENT-DRIVEN \u00b7 FAILURE HANDLING',
    title:'Dead-Letter Processing',
    sub:"A message that keeps failing shouldn't be retried forever, blocking everything behind it. After N attempts, set it aside."});
  const svg = canvas(root);
  const q = {x:180,y:280};
  svg.appendChild(rect(q.x-90,q.y-40,180,80,'violet'));
  svg.appendChild(txt(q.x,q.y+6,'main queue','lbl-strong'));
  const handler = {x:520,y:280};
  const hg = grp('pop'); delayIt(hg,0,0.3);
  hg.appendChild(rect(handler.x-100,handler.y-40,200,80,'amber'));
  hg.appendChild(txt(handler.x,handler.y-2,'handler','lbl-strong'));
  const retryLbl = txt(handler.x,handler.y+22,'attempt 1','lbl'); retryLbl.id='retryLbl';
  hg.appendChild(retryLbl);
  svg.appendChild(hg);
  svg.appendChild(arrow(q.x+90,q.y,handler.x-100,handler.y,'edge draw','arrow'));
  const loop = el('path',{d:'M '+(handler.x+90)+' '+(handler.y-25)+' Q '+(handler.x+170)+' '+(handler.y-95)+' '+(handler.x+10)+' '+(handler.y-42), class:'edge rose draw', 'marker-end':'url(#arrowRose)'});
  svg.appendChild(loop);
  svg.appendChild(txt(handler.x+150,handler.y-100,'retry','lbl'));
  const dlq = {x:920,y:280};
  const dg = grp('pop'); delayIt(dg,0,0.3);
  dg.appendChild(rect(dlq.x-100,dlq.y-40,200,80,'rose'));
  dg.appendChild(txt(dlq.x,dlq.y+6,'dead-letter queue','lbl-strong'));
  svg.appendChild(dg);
  const dArrow = arrow(handler.x+100,handler.y,dlq.x-100,dlq.y,'rose draw','arrowRose');
  svg.appendChild(dArrow);
  let attempt = 1;
  function step(){
    attempt = attempt>=3 ? 1 : attempt+1;
    document.getElementById('retryLbl').textContent = attempt<=3 ? ('attempt '+attempt) : 'sent to DLQ';
  }
  const id = setInterval(step, 1000);
  timers.push(id);
  const note = grp('pop'); delayIt(note,0,1.0);
  note.appendChild(txt(520,420,'after 3 failed attempts \u2192 routed to DLQ, main queue keeps flowing','lbl'));
  svg.appendChild(note);
});
