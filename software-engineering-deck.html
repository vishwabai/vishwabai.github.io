<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testing Patterns — a visual deep dive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a10;
    --panel:#111319;
    --panel-2:#15171f;
    --line:#262933;
    --ink:#e9e8e4;
    --muted:#868b96;
    --dim:#4d515c;
    --teal:#5fb3ac;
    --amber:#d9a25b;
    --rose:#c9776f;
    --violet:#8b83c9;
    --blue:#6f9fc9;
    --green:#7fae6f;
    --red:#b6594f;
    --sans:'IBM Plex Sans', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:#000;
    height:100%;
    overflow:hidden;
    font-family:var(--sans);
    color:var(--ink);
  }
  .frame{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, #0c0d13 0%, #000 78%);
  }
  .stage-wrap{
    position:relative;
    width:100%;
    max-width:min(94vw, 177.78vh);
    aspect-ratio:16/9;
    max-height:88vh;
  }
  .stage{
    position:relative;
    width:100%; height:100%;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 40px 100px -30px rgba(0,0,0,.9);
  }
  .slide{
    position:absolute; inset:0;
    display:none;
    opacity:0;
  }
  .slide.active{ display:block; opacity:1; }
  .slide svg{ width:100%; height:100%; display:block; }

  /* ---- reveal system ---- */
  .rv{ opacity:0; transform:translateY(10px); transition:opacity .55s cubic-bezier(.2,.7,.3,1), transform .55s cubic-bezier(.2,.7,.3,1); }
  .rv.show{ opacity:1; transform:translateY(0); }
  .rv-l{ opacity:0; transform:translateX(-14px); transition:opacity .55s ease, transform .55s ease; }
  .rv-l.show{ opacity:1; transform:translateX(0); }
  .rv-r{ opacity:0; transform:translateX(14px); transition:opacity .55s ease, transform .55s ease; }
  .rv-r.show{ opacity:1; transform:translateX(0); }
  .rv-s{ opacity:0; transform:scale(.85); transition:opacity .5s ease, transform .5s cubic-bezier(.3,1.4,.4,1); transform-box:fill-box; transform-origin:center; }
  .rv-s.show{ opacity:1; transform:scale(1); }
  .draw{ transition:stroke-dashoffset 1s cubic-bezier(.3,.6,.2,1); }
  .grow-w{ width:0; transition:width 1s cubic-bezier(.3,.6,.2,1); }
  .grow-w.show{ }
  .grow-h{ transition:height 1s cubic-bezier(.3,.6,.2,1), y 1s cubic-bezier(.3,.6,.2,1); }
  .bar{ transition:height 1s cubic-bezier(.3,.6,.2,1), y 1s cubic-bezier(.3,.6,.2,1); }
  .pulse{ animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.45} }
  .drift{ animation:drift 5s ease-in-out infinite; }
  @keyframes drift{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  .spin-slow{ animation:spin 14s linear infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes spin{ to{ transform:rotate(360deg) } }

  text{ font-family:var(--sans); }
  .mono{ font-family:var(--mono); }
  .tag{ font-size:16px; fill:var(--dim); letter-spacing:.02em; }
  .h1{ font-size:46px; font-weight:600; fill:var(--ink); }
  .h2{ font-size:26px; font-weight:500; fill:var(--muted); }
  .lbl{ font-size:20px; font-weight:500; fill:var(--ink); }
  .lbl-sm{ font-size:16px; fill:var(--muted); }
  .body-t{ font-size:19px; fill:var(--muted); }
  .code{ font-family:var(--mono); font-size:17px; fill:#a9b0bb; }
  .kicker{ font-size:15px; fill:var(--dim); letter-spacing:.03em; }

  .rule{ stroke:var(--line); stroke-width:1.5; }

  /* ---- chrome ---- */
  .chrome{
    position:fixed; inset:0; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  .navzone{
    position:absolute; top:0; bottom:0; width:14%;
    pointer-events:auto; cursor:pointer;
    display:flex; align-items:center;
    opacity:0; transition:opacity .25s ease;
  }
  .stage-wrap:hover .navzone{ opacity:1; }
  .navzone.prev{ left:calc(50% - min(47vw, 88.89vh)); justify-content:flex-start; }
  .navzone.next{ right:calc(50% - min(47vw, 88.89vh)); justify-content:flex-end; }
  .navbtn{
    width:44px; height:44px; margin:0 10px;
    border-radius:50%;
    background:rgba(20,21,27,.85);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink);
  }
  .navbtn svg{ width:18px; height:18px; }

  .hud{
    position:fixed; left:0; right:0; bottom:18px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    pointer-events:none;
  }
  .dots{ display:flex; gap:7px; pointer-events:auto; }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--dim); cursor:pointer;
    transition:background .3s ease, transform .3s ease;
  }
  .dot.on{ background:var(--teal); transform:scale(1.35); }
  .counter{
    font-family:var(--mono); font-size:12px; color:var(--dim);
    letter-spacing:.05em;
  }
  .hint{
    position:fixed; top:18px; right:22px;
    font-family:var(--mono); font-size:11px; color:var(--dim);
    letter-spacing:.03em; opacity:.7;
  }

  /* footer RECAP/GAP band shared styling (drawn inside svg, these are just for legend) */
  .recap-tag{ fill:var(--teal); font-size:15px; font-weight:600; letter-spacing:.04em; }
  .gap-tag{ fill:var(--amber); font-size:15px; font-weight:600; letter-spacing:.04em; }
  .fill-tag{ fill:var(--rose); font-size:15px; font-weight:600; letter-spacing:.04em; }
  .recap-t{ fill:var(--muted); font-size:18px; }
  .gap-t{ fill:#e3c896; font-size:19px; font-style:italic; }
</style>
</head>
<body>
<div class="frame">
  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <!-- ============ SLIDE 1 — TITLE ============ -->
      <section class="slide" id="s1">
        <svg viewBox="0 0 1600 900">
          <line class="rule" x1="80" y1="820" x2="1520" y2="820"/>
          <g class="rv" style="transition-delay:.05s">
            <text x="80" y="120" class="kicker mono">SOFTWARE ENGINEERING</text>
          </g>
          <g class="rv" style="transition-delay:.2s">
            <text x="78" y="220" style="font-size:74px; font-weight:700; fill:#f2f1ee;">From a commit</text>
          </g>
          <g class="rv" style="transition-delay:.32s">
            <text x="78" y="300" style="font-size:74px; font-weight:700; fill:#f2f1ee;">to a proof it works</text>
          </g>
          <g class="rv" style="transition-delay:.5s">
            <text x="80" y="345" class="h2">version control · code review · CI/CD · every testing pattern that follows</text>
          </g>

          <!-- Feynman-esque hook: an assumption box getting hit -->
          <g class="rv-s" style="transition-delay:.7s">
            <rect x="120" y="440" width="280" height="110" rx="6" fill="none" stroke="#3a3e48" stroke-width="1.5"/>
            <text x="260" y="485" text-anchor="middle" class="lbl">your code</text>
            <text x="260" y="515" text-anchor="middle" class="lbl-sm mono">"it works on my machine"</text>
          </g>
          <g class="rv-s" style="transition-delay:.95s">
            <circle cx="600" cy="495" r="46" fill="none" stroke="#5fb3ac" stroke-width="2"/>
            <text x="600" y="503" text-anchor="middle" class="lbl mono" style="fill:#5fb3ac;">test</text>
          </g>
          <line class="rv" style="transition-delay:1.15s" x1="404" y1="495" x2="548" y2="495" stroke="#7d828d" stroke-width="2" marker-end="url(#arrow)"/>

          <g class="rv-s" style="transition-delay:1.35s">
            <rect x="700" y="440" width="330" height="110" rx="6" fill="none" stroke="#4a3238" stroke-width="1.5"/>
            <text x="865" y="485" text-anchor="middle" class="lbl">reality</text>
            <text x="865" y="515" text-anchor="middle" class="lbl-sm mono" style="fill:#c9776f;">every input you didn't imagine</text>
          </g>
          <line class="rv" style="transition-delay:1.55s" x1="646" y1="495" x2="695" y2="495" stroke="#5fb3ac" stroke-width="2" marker-end="url(#arrowTeal)"/>

          <g class="rv" style="transition-delay:1.8s">
            <text x="1120" y="470" class="body-t" style="font-size:19px;">every practice in this deck exists</text>
            <text x="1120" y="497" class="body-t" style="font-size:19px;">to close that gap a little more —</text>
            <text x="1120" y="524" class="body-t" style="font-size:19px;">from how code is shared, to how</text>
            <text x="1120" y="551" class="body-t" style="font-size:19px;">it's proven correct under fire.</text>
          </g>

          <g class="rv" style="transition-delay:2s">
            <text x="80" y="860" class="lbl-sm mono">01 / 31</text>
            <text x="1520" y="860" text-anchor="end" class="lbl-sm mono">a Feynman-style walkthrough · git → review → CI/CD → testing patterns</text>
          </g>
        </svg>
      </section>

      <!-- ============ SLIDE 2 — VERSION CONTROL & GIT ============ -->
      <section class="slide" id="svc1">
        <svg viewBox="0 0 1600 900">
          <g class="rv" style="transition-delay:0s"><text x="80" y="80" class="tag mono">02 · FOUNDATIONS</text></g>
          <g class="rv" style="transition-delay:.08s"><text x="80" y="140" class="h1">Version Control &amp; Git</text></g>
          <g class="rv" style="transition-delay:.2s"><text x="80" y="178" class="h2">a running history of snapshots, so change is never a leap of faith</text></g>
          <line class="rule" x1="80" y1="210" x2="1520" y2="210"/>

          <g class="rv" style="transition-delay:.3s">
            <text x="80" y="255" class="body-t" style="font-size:18px;">before: <tspan style="fill:#c9776f;">final_v2_ACTUALLY_final.zip</tspan> emailed between people.</text>
            <text x="80" y="280" class="body-t" style="font-size:18px;">after: every change is a timestamped, attributable, reversible snapshot.</text>
          </g>

          <!-- commit chain -->
          <g class="rv" style="transition-delay:.5s">
            <line x1="150" y1="420" x2="1250" y2="420" stroke="#3a3e48" stroke-width="1.5"/>
          </g>
          <g class="rv-s" style="transition-delay:.65s">
            <circle cx="220" cy="420" r="10" fill="#5fb3ac"/>
            <text x="220" y="380" text-anchor="middle" class="lbl-sm mono" style="font-size:12px;">a1c9e2f</text>
            <text x="220" y="455" text-anchor="middle" class="body-t" style="font-size:14px;">init project</text>
          </g>
          <g class="rv-s" style="transition-delay:.8s">
            <circle cx="520" cy="420" r="10" fill="#5fb3ac"/>
            <text x="520" y="380" text-anchor="middle" class="lbl-sm mono" style="font-size:12px;">7bd410a</text>
            <text x="520" y="455" text-anchor="middle" class="body-t" style="font-size:14px;">add login form</text>
          </g>
          <g class="rv-s" style="transition-delay:.95s">
            <circle cx="820" cy="420" r="10" fill="#5fb3ac"/>
            <text x="820" y="380" text-anchor="middle" class="lbl-sm mono" style="font-size:12px;">e02f88c</text>
            <text x="820" y="455" text-anchor="middle" class="body-t" style="font-size:14px;">fix validation bug</text>
          </g>
          <g class="rv-s" style="transition-delay:1.1s">
            <circle cx="1120" cy="420" r="11" fill="none" stroke="#d9a25b" stroke-width="2.5"/>
            <text x="1120" y="380" text-anchor="middle" class="lbl-sm mono" style="font-size:12px; fill:#d9a25b;">HEAD → main</text>
            <text x="1120" y="455" text-anchor="middle" class="body-t" style="font-size:14px;">(you are here)</text>
          </g>

          <g class="rv" style="transition-delay:1.3s">
            <rect x="1000" y="240" width="450" height="150" rx="6" fill="#141620" stroke="#262933"/>
            <text x="1020" y="272" class="lbl-sm" style="fill:#8a8f98;">the core idea</text>
            <text x="1020" y="304" class="body-t" style="font-size:16px;">each commit is content-addressed —</text>
            <text x="1020" y="326" class="body-t" style="font-size:16px;">its ID is a hash of its contents + parent.</text>
            <text x="1020" y="348" class="body-t" style="font-size:16px;">change one byte, the whole chain of</text>
            <text x="1020" y="370" class="body-t" style="font-size:16px;">IDs after it changes too — tamper-evident.</text>
          </g>

          <g class="rv" style="transition-delay:1.55s">
            <rect x="150" y="520" width="900" height="180" rx="6" fill="#141620" stroke="#262933"/>
            <text x="170" y="552" class="lbl-sm" style="fill:#8a8f98;">practical commands you'll actually type</text>
            <text x="170" y="584" class="code">git commit -m "message"   git log --oneline   git diff</text>
            <text x="170" y="612" class="code">git checkout &lt;hash&gt;        git blame file.py   git bisect</text>
            <text x="170" y="644" class="body-t" style="font-size:16px; fill:#697080;"><tspan style="fill:#5fb3ac;">git bisect</tspan> is underrated: binary-searches your history</text>
            <text x="170" y="668" class="body-t" style="font-size:16px; fill:#697080;">to find the exact commit that introduced a regression.</text>
          </g>

          <g class="rv" style="transition-delay:1.8s">
            <text x="80" y="800" class="recap-tag mono">RECAP</text>
            <text x="80" y="826" class="recap-t">git gives every change a permanent, provable place in history.</text>
          </g>
          <g class="rv" style="transition-delay:2s">
            <rect x="900" y="775" width="540" height="65" rx="6" fill="#141620" stroke="#262933"/>
            <text x="920" y="800" class="gap-tag mono">GAP</text>
            <text x="920" y="825" class="gap-t" style="font-size:16px;">but real teams write in parallel — how do many people edit at once?</text>
          </g>
        </svg>
      </section>

      <!-- ============ SLIDE 3 — BRANCHING ============ -->
      <section class="slide" id="svc2">
        <svg viewBox="0 0 1600 900">
          <g class="rv" style="transition-delay:0s"><text x="80" y="80" class="fill-tag mono">FILL</text></g>
          <g class="rv" style="transition-delay:.08s"><text x="80" y="140" class="h1">Branching</text></g>
          <g class="rv" style="transition-delay:.2s"><text x="80" y="178" class="h2">a branch is just a movable label pointing at a commit — cheap to create, safe to abandon</text></g>
          <line class="rule" x1="80" y1="210" x2="1520" y2="210"/>

          <!-- main line -->
          <line class="rv" style="transition-delay:.3s" x1="150" y1="380" x2="1450" y2="380" stroke="#3a3e48" stroke-width="1.5"/>
          <g class="rv-s" style="transition-delay:.45s"><circle cx="220" cy="380" r="9" fill="#5fb3ac"/></g>
          <g class="rv-s" style="transition-delay:.55s"><circle cx="420" cy="380" r="9" fill="#5fb3ac"/></g>
          <g class="rv" style="transition-delay:.6s"><text x="420" y="345" text-anchor="middle" class="lbl-sm mono" style="fill:#d9a25b; font-size:13px;">main</text></g>
          <g class="rv-s" style="transition-delay:.7s"><circle cx="920" cy="380" r="9" fill="#5fb3ac"/></g>
          <g class="rv-s" style="transition-delay:.8s"><circle cx="1300" cy="380" r="9" fill="none" stroke="#d9a25b" stroke-width="2.5"/></g>
          <g class="rv" style="transition-delay:.85s"><text x="1300" y="345" text-anchor="middle" class="lbl-sm mono" style="fill:#d9a25b; font-size:13px;">main (later)</text></g>

          <!-- branch diverging from commit 420 -->
          <path class="rv draw" style="transition-delay:1s" d="M420,380 C500,380 520,540 620,540" stroke="#5fb3ac" stroke-width="1.8" fill="none" stroke-dasharray="240" stroke-dashoffset="240" data-dash="240"/>
          <g class="rv-s" style="transition-delay:1.3s"><circle cx="680" cy="540" r="9" fill="#5fb3ac"/></g>
          <g class="rv-s" style="transition-delay:1.4s"><circle cx="900" cy="540" r="9" fill="#5fb3ac"/></g>
          <g class="rv-s" style="transition-delay:1.5s"><circle cx="1130" cy="540" r="9" fill="none" stroke="#5c8a9c" stroke-width="2.5"/></g>
          <line class="rv draw" style="transition-delay:1.15s" x1="450" y1="540" x2="1130" y2="540" stroke="#3a3e48" stroke-width="1.5" stroke-dasharray="680" stroke-dashoffset="680" data-dash="680"/>
          <g class="rv" style="transition-delay:1.6s"><text x="1130" y="505" text-anchor="middle" class="lbl-sm mono" style="fill:#5c8a9c; font-size:13px;">feature/checkout-v2</text></g>

          <!-- meanwhile main kept moving independently -->
          <g class="rv" style="transition-delay:1.8s">
            <text x="920" y="345" text-anchor="middle" class="lbl-sm mono" style="fill:#697080; font-size:12px;">(main kept shipping too)</text>
          </g>

          <g class="rv" style="transition-delay:2s">
            <rect x="150" y="610" width="1300" height="150" rx="6" fill="#141620" stroke="#262933"/>
            <text x="170" y="642" class="lbl-sm" style="fill:#8a8f98;">why this matters in practice</text>
            <text x="170" y="674" class="body-t" style="font-size:17px;">branches let a risky feature, an experiment, or a hotfix develop in isolation —</text>
            <text x="170" y="698" class="body-t" style="font-size:17px;">nobody else's work is blocked, and nothing merges into <tspan style="fill:#d9a25b;">main</tspan> until it's ready.</text>
            <text x="170" y="722" class="body-t" style="font-size:17px; fill:#697080;">convention: short-lived branches, one per feature/fix, deleted after merge.</text>
          </g>

          <g class="rv" style="transition-delay:2.25s">
            <text x="80" y="800" class="recap-tag mono">RECAP</text>
            <text x="80" y="826" class="recap-t">branches let history diverge safely, so parallel work never collides.</text>
          </g>
          <g class="rv" style="transition-delay:2.45s">
            <rect x="900" y="775" width="540" height="65" rx="6" fill="#141620" stroke="#262933"/>
            <text x="920" y="800" class="gap-tag mono">GAP</text>
            <text x="920" y="825" class="gap-t" style="font-size:16px;">diverged work has to come back — how do two histories become one?</text>
          </g>
        </svg>
      </section>

      <!-- ============ SLIDE 4 — MERGING ============ -->
      <section class="slide" id="svc3">
        <svg viewBox="0 0 1600 900">
          <g class="rv" style="transition-delay:0s"><text x="80" y="80" class="fill-tag mono">FILL</text></g>
          <g class="rv" style="transition-delay:.08s"><text x="80" y="140" class="h1">Merging</text></g>
          <g class="rv" style="transition-delay:.2s"><text x="80" y="178" class="h2">weave two histories into one — automatically, unless the same lines changed differently</text></g>
          <line class="rule" x1="80" y1="210" x2="1520" y2="210"/>

          <line class="rv" style="transition-delay:.3s" x1="150" y1="340" x2="1000" y2="340" stroke="#3a3e48" stroke-width="1.5"/>
          <g class="rv-s" style="transition-delay:.4s"><circle cx="220" cy="340" r="9" fill="#5fb3ac"/></g>
          <g class="rv-s" style="transition-delay:.5s"><circle cx="420" cy="340" r="9" fill="#5fb3ac"/></g>
          <g class="rv" style="transition-delay:.55s"><text x="420" y="305" text-anchor="middle" class="lbl-sm mono" style="fill:#d9a25b; font-size:12px;">main</text></g>

          <path class="rv draw" style="transition-delay:.7s" d="M420,340 C500,340 520,480 620,480" stroke="#5c8a9c" stroke-width="1.8" fill="none" stroke-dasharray="240" stroke-dashoffset="240" data-dash="240"/>
          <g class="rv-s" style="transition-delay:1s"><circle cx="680" cy="480" r="9" fill="#5c8a9c"/></g>
          <g class="rv-s" style="transition-delay:1.1s"><circle cx="850" cy="480" r="9" fill="#5c8a9c"/></g>
          <line class="rv draw" style="transition-delay:.85s" x1="450" y1="480" x2="850" y2="480" stroke="#3a3e48" stroke-width="1.5" stroke-dasharray="400" stroke-dashoffset="400" data-dash="400"/>
          <g class="rv" style="transition-delay:1.2s"><text x="850" y="445" text-anchor="middle" class="lbl-sm mono" style="fill:#5c8a9c; font-size:12px;">feature</text></g>

          <!-- both converge into merge commit -->
          <path class="rv draw" style="transition-delay:1.35s" d="M420,340 C600,340 900,340 1020,395" stroke="#7d828d" stroke-width="1.5" fill="none" stroke-dasharray="700" stroke-dashoffset="700" data-dash="700"/>
          <path class="rv draw" style="transition-delay:1.35s" d="M850,480 C950,480 990,430 1020,395" stroke="#7d828d" stroke-width="1.5" fill="none" stroke-dasharray="180" stroke-dashoffset="180" data-dash="180"/>
          <g class="rv-s" style="transition-delay:1.6s">
            <path d="M1020,375 L1050,395 L1020,415 L990,395 Z" fill="#141620" stroke="#7fae6f" stroke-width="2.5"/>
          </g>
          <g class="rv" style="transition-delay:1.75s"><text x="1020" y="440" text-anchor="middle" class="lbl-sm mono" style="fill:#7fae6f; font-size:12px;">merge commit</text><text x="1020" y="460" text-anchor="middle" class="lbl-sm mono" style="fill:#697080; font-size:11px;">two parents</text></g>

          <!-- conflict example -->
          <g class="rv" style="transition-delay:2s">
            <rect x="1100" y="270" width="400" height="220" rx="6" fill="#141620" stroke="#c9776f" stroke-width="1.5"/>
            <text x="1120" y="300" class="lbl-sm" style="fill:#c9776f;">when it can't auto-merge</text>

<script>
(function(){
  var stage = document.getElementById('stage');
  var slides = Array.prototype.slice.call(stage.querySelectorAll('.slide'));
  var total = slides.length;
  var idx = 0;

  // build progress dots
  var dotsEl = document.getElementById('dots');
  slides.forEach(function(_, i){
    var d = document.createElement('div');
    d.className = 'dot';
    d.addEventListener('click', function(){ goTo(i); });
    dotsEl.appendChild(d);
  });
  var dots = Array.prototype.slice.call(dotsEl.children);
  var counterEl = document.getElementById('counter');

  function pad(n){ return n < 10 ? '0'+n : ''+n; }

  function prepDashed(root){
    // set stroke-dasharray/offset for any .draw path/line using data-dash, if not already inline
    root.querySelectorAll('.draw').forEach(function(el){
      var len = el.getAttribute('data-dash');
      if(len){
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      } else if (el.tagName === 'path' || el.tagName === 'line') {
        try{
          var l = el.getTotalLength ? el.getTotalLength() : 0;
          if(l){ el.style.strokeDasharray = l; el.style.strokeDashoffset = l; }
        }catch(e){}
      }
    });
  }

  function resetSlide(root){
    root.querySelectorAll('.rv, .rv-l, .rv-r, .rv-s').forEach(function(el){
      el.classList.remove('show');
    });
    root.querySelectorAll('.draw').forEach(function(el){
      el.classList.remove('show');
      var len = el.getAttribute('data-dash');
      if(len){ el.style.strokeDashoffset = len; }
    });
    root.querySelectorAll('.bar').forEach(function(el){
      el.style.height = '0px';
      el.style.y = '700px';
    });
  }

  function playSlide(root){
    prepDashed(root);
    // force reflow so the reset state is committed before we animate
    void root.offsetWidth;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        root.querySelectorAll('.rv, .rv-l, .rv-r, .rv-s, .draw').forEach(function(el){
          el.classList.add('show');
        });
        root.querySelectorAll('.bar').forEach(function(el){
          var h = parseFloat(el.getAttribute('data-h')) || 0;
          el.style.height = h + 'px';
          el.style.y = (700 - h) + 'px';
        });
      });
    });
  }

  function render(){
    slides.forEach(function(s, i){
      if(i === idx){
        s.classList.add('active');
      } else {
        s.classList.remove('active');
      }
    });
    dots.forEach(function(d, i){ d.classList.toggle('on', i === idx); });
    counterEl.textContent = pad(idx+1) + ' / ' + pad(total);

    var active = slides[idx];
    resetSlide(active);
    playSlide(active);
  }

  function goTo(i){
    if(i < 0) i = 0;
    if(i >= total) i = total - 1;
    if(i === idx) return;
    idx = i;
    render();
  }
  function next(){ if(idx < total-1) goTo(idx+1); }
  function prev(){ if(idx > 0) goTo(idx-1); }

  document.getElementById('nextZone').addEventListener('click', next);
  document.getElementById('prevZone').addEventListener('click', prev);

  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); next(); }
    else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); prev(); }
    else if(e.key === 'Home'){ goTo(0); }
    else if(e.key === 'End'){ goTo(total-1); }
  });

  // basic swipe support for touch
  var touchStartX = null;
  stage.addEventListener('touchstart', function(e){ touchStartX = e.changedTouches[0].clientX; });
  stage.addEventListener('touchend', function(e){
    if(touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if(dx < -40) next();
    else if(dx > 40) prev();
    touchStartX = null;
  });

  render();
})();
</script>
