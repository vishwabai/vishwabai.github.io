<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Systems Fundamentals: Memory, Low-Level Concepts &amp; Error Handling</title>
<style>
  :root{
    --bg:#0b0b0d;
    --panel:#111114;
    --grid:#1c1c20;
    --stack:#6f9bd6;
    --heap:#d69a63;
    --statc:#6fbf8b;
    --danger:#d1706f;
    --ptr:#b28fd1;
    --text:#e8e8ea;
    --muted:#8d8d94;
    --dim:#4b4b52;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;font-family:'Segoe UI',ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif;}
  #stage-wrap{
    width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000;
  }
  #stage{
    position:relative;
    width:1600px;height:900px;
    background:var(--bg);
    transform-origin:center center;
    box-shadow:0 0 0 1px #1a1a1e;
    overflow:hidden;
  }
  svg{width:100%;height:100%;display:block;}
  .title-text{fill:var(--text);font-size:40px;font-weight:600;}
  .sub-text{fill:var(--muted);font-size:20px;font-weight:400;}
  .caption-text{fill:var(--muted);font-size:19px;}
  .label-14{font-size:14px;fill:var(--text);}
  .label-18{font-size:18px;fill:var(--text);}
  .label-24{font-size:24px;fill:var(--text);}
  .mono{font-family:'Consolas','SFMono-Regular',Menlo,monospace;}
  .kicker{fill:var(--muted);font-size:16px;letter-spacing:2px;text-transform:uppercase;}
  #hud{position:absolute;inset:0;pointer-events:none;}
  .navbtn{
    position:absolute; top:50%; transform:translateY(-50%);
    width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12);
    color:#ddd; font-size:22px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; pointer-events:all; user-select:none; transition:background .15s;
  }
  .navbtn:hover{background:rgba(255,255,255,0.1);}
  #prevBtn{left:-70px;} #nextBtn{right:-70px;}
  #dots{
    position:absolute; bottom:-42px; left:0; right:0;
    display:flex; justify-content:center; gap:6px; pointer-events:all;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#333;cursor:pointer;transition:background .2s, width .2s;}
  .dot.active{background:#e8e8ea;width:18px;border-radius:4px;}
  #slideNum{position:absolute; top:-38px; left:0; color:#666; font-size:14px; font-family:monospace;}
  #hint{position:absolute; top:-38px; right:0; color:#555; font-size:13px; font-family:monospace;}
  .predict-box{
    fill:rgba(255,255,255,0.03); stroke:rgba(255,255,255,0.15); stroke-width:1;
  }
  .clickable{cursor:pointer;}
  .arrow-head{fill:none;}
</style>
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <svg id="mainsvg" viewBox="0 0 1600 900">
      <defs>
        <marker id="arrowPtr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z"></path>
        </marker>
        <clipPath id="mainClip"><rect x="60" y="130" width="1480" height="650"></rect></clipPath>
      </defs>
      <g id="zoneTitle"></g>
      <g id="zoneMain" clip-path="url(#mainClip)"></g>
      <g id="zoneCaption"></g>
    </svg>
    <div id="hud">
      <div id="slideNum"></div>
      <div id="hint">&larr; &rarr; navigate &middot; space next &middot; r replay</div>
      <div class="navbtn" id="prevBtn">&#8592;</div>
      <div class="navbtn" id="nextBtn">&#8594;</div>
      <div id="dots"></div>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
const NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById('stage');
const zoneTitle = document.getElementById('zoneTitle');
const zoneMain = document.getElementById('zoneMain');
const zoneCaption = document.getElementById('zoneCaption');

/* ---------- responsive scaling ---------- */
function fitStage(){
  const wrap = document.getElementById('stage-wrap');
  const scale = Math.min(wrap.clientWidth/1600, wrap.clientHeight/900) * 0.94;
  stage.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitStage);
fitStage();

/* ---------- tiny svg helper ---------- */
function se(tag, attrs, ...kids){
  const el = document.createElementNS(NS, tag);
  if(attrs) for(const k in attrs){
    if(k==='text') el.textContent = attrs[k];
    else el.setAttribute(k, attrs[k]);
  }
  for(const kid of kids){
    if(kid==null) continue;
    if(typeof kid === 'string') el.appendChild(document.createTextNode(kid));
    else el.appendChild(kid);
  }
  return el;
}
function txt(x,y,str,cls,attrs){
  const t = se('text', Object.assign({x,y,class:cls||'label-18'}, attrs||{}));
  t.textContent = str;
  return t;
}
function tspanLine(el, x, dy, str, attrs){
  const t = se('tspan', Object.assign({x, dy},attrs||{}));
  t.textContent = str;
  el.appendChild(t);
  return t;
}

/* ---------- timer / raf bookkeeping (cleared on slide change) ---------- */
let timers = [], rafs = [];
function clearAll(){ timers.forEach(clearTimeout); timers=[]; rafs.forEach(cancelAnimationFrame); rafs=[]; }
function after(ms, fn){ const id=setTimeout(fn, Math.max(0,ms)); timers.push(id); return id; }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function raf(fn){ const id=requestAnimationFrame(fn); rafs.push(id); return id; }

function fadeUp(el, delay=0, dur=500, dy=14){
  el.style.opacity=0; el.style.transform=`translateY(${dy}px)`;
  after(delay, ()=>{
    const t0=performance.now();
    function step(now){
      const p=Math.min(1,(now-t0)/dur), e=easeOutCubic(p);
      el.style.opacity=e; el.style.transform=`translateY(${dy*(1-e)}px)`;
      if(p<1) raf(step);
    }
    raf(step);
  });
}
function fadeOnly(el, delay=0, dur=400, targetOp=1){
  el.style.opacity=0;
  after(delay, ()=>{
    const t0=performance.now();
    function step(now){
      const p=Math.min(1,(now-t0)/dur);
      el.style.opacity = targetOp*easeOutCubic(p);
      if(p<1) raf(step);
    }
    raf(step);
  });
}
function tweenAttrs(el, props, dur=600, delay=0, easing=easeInOutCubic, onDone){
  after(delay, ()=>{
    const start={};
    for(const k in props) start[k]=parseFloat(el.getAttribute(k))||0;
    const t0=performance.now();
    function step(now){
      const p=Math.min(1,(now-t0)/dur), e=easing(p);
      for(const k in props) el.setAttribute(k, start[k]+(props[k]-start[k])*e);
      if(p<1) raf(step); else if(onDone) onDone();
    }
    raf(step);
  });
}
function moveGroup(el, x0,y0,x1,y1, dur=700, delay=0, easing=easeInOutCubic, onDone){
  el.setAttribute('transform',`translate(${x0},${y0})`);
  after(delay, ()=>{
    const t0=performance.now();
    function step(now){
      const p=Math.min(1,(now-t0)/dur), e=easing(p);
      el.setAttribute('transform',`translate(${x0+(x1-x0)*e},${y0+(y1-y0)*e})`);
      if(p<1) raf(step); else if(onDone) onDone();
    }
    raf(step);
  });
}
function drawPath(el, dur=600, delay=0){
  let len=100; try{ len = el.getTotalLength(); }catch(e){}
  el.style.strokeDasharray = len;
  el.style.strokeDashoffset = len;
  el.style.opacity = 1;
  after(delay, ()=>{
    const t0=performance.now();
    function step(now){
      const p=Math.min(1,(now-t0)/dur);
      el.style.strokeDashoffset = len*(1-easeOutCubic(p));
      if(p<1) raf(step);
    }
    raf(step);
  });
}
function growRect(el, targetAttr, targetVal, dur=600, delay=0){
  tweenAttrs(el, {[targetAttr]:targetVal}, dur, delay, easeOutCubic);
}
function pulse(el, delay=0, times=2){
  after(delay, ()=>{
    let n=0;
    const base = el.getAttribute('stroke-width') || 2;
    function step(){
      if(n>=times*2) { el.setAttribute('stroke-width', base); return; }
      el.setAttribute('stroke-width', n%2===0 ? (parseFloat(base)+2) : base);
      n++; after(160, step);
    }
    step();
  });
}

/* ---------- reusable visual components ---------- */
function box(x,y,w,h,color,opts){
  opts = opts||{};
  return se('rect', Object.assign({x,y,width:w,height:h, rx:opts.rx!==undefined?opts.rx:6,
    fill:opts.fill!==undefined?opts.fill:'rgba(255,255,255,0.03)',
    stroke:color, 'stroke-width':opts.sw||1.6}, opts.attrs||{}));
}
function labeledBox(x,y,w,h,color,label,sub,opts){
  opts=opts||{};
  const g = se('g',{});
  g.appendChild(box(x,y,w,h,color,opts));
  const t1 = txt(x+w/2, y+h/2+(sub?-4:6), label, 'label-18', {'text-anchor':'middle'});
  g.appendChild(t1);
  if(sub){ g.appendChild(txt(x+w/2, y+h/2+18, sub, 'label-14', {'text-anchor':'middle', fill:'var(--muted)'})); }
  return g;
}
function arrow(x1,y1,x2,y2,color,opts){
  opts=opts||{};
  return se('path',{d:`M${x1},${y1} L${x2},${y2}`, stroke:color||'var(--ptr)',
    'stroke-width':opts.sw||2, fill:'none', 'marker-end':'url(#arrowPtr)'});
}
function curveArrow(x1,y1,x2,y2,bend,color){
  const mx=(x1+x2)/2, my=(y1+y2)/2 - bend;
  return se('path',{d:`M${x1},${y1} Q${mx},${my} ${x2},${y2}`, stroke:color||'var(--ptr)',
    'stroke-width':2, fill:'none', 'marker-end':'url(#arrowPtr)'});
}
function addrTag(x,y,hex,color){
  return txt(x,y,hex,'label-14 mono',{fill:color||'var(--muted)'});
}
function sectionKicker(str,x,y){ return txt(x,y,str,'kicker'); }

/* ---------- small explanatory icon glyphs ----------
   Used to give "practical application" / summary cards a genuine visual
   hook instead of a plain colored text box. Each returns a <g> that
   animates itself in (paths draw, dots fade) starting at `delay`. */
function icon(type, cx, cy, color, delay){
  delay = delay||0;
  const g = se('g',{});
  function addPath(d, dur, dd){
    const p = se('path',{d, stroke:color, 'stroke-width':2, fill:'none', 'stroke-linecap':'round','stroke-linejoin':'round'});
    g.appendChild(p); drawPath(p,dur,delay+dd); return p;
  }
  function addDot(r, dx, dy, dd, fillColor){
    const c = se('circle',{cx:cx+dx,cy:cy+dy,r, fill:fillColor||color});
    c.style.opacity=0; g.appendChild(c); fadeOnly(c,delay+dd,300,1); return c;
  }
  const s=16;
  if(type==='stack'){
    addPath(`M${cx-s},${cy+10} L${cx+s},${cy+10}`,250,0);
    addPath(`M${cx-s},${cy} L${cx+s},${cy}`,250,150);
    const top = addPath(`M${cx-s},${cy-10} L${cx+s},${cy-10}`,250,300);
    after(delay+700, ()=>{
      const t0=performance.now();
      function step(now){
        const p=Math.min(1,(now-t0)/450);
        top.setAttribute('transform', `rotate(${26*p} ${cx-s} ${cy-10}) translate(${5*p},${9*p})`);
        top.style.opacity = 1-0.35*p;
        if(p<1) raf(step);
      }
      raf(step);
    });
  } else if(type==='lock'){
    const body = se('rect',{x:cx-14,y:cy-2,width:28,height:20,rx:3, stroke:color,'stroke-width':2, fill:'none'});
    body.style.opacity=0; g.appendChild(body); fadeOnly(body,delay,300,1);
    const shackle = se('path',{d:`M${cx-9},${cy-2} L${cx-9},${cy-12} A9,9 0 0 1 ${cx+9},${cy-12} L${cx+9},${cy-2}`, stroke:color,'stroke-width':2, fill:'none'});
    g.appendChild(shackle); drawPath(shackle,350,delay+280);
    addDot(2.4,0,8,720);
  } else if(type==='search'){
    const lens = se('circle',{cx:cx-4,cy:cy-4,r:11, stroke:color,'stroke-width':2, fill:'none'});
    lens.style.opacity=0; g.appendChild(lens); fadeOnly(lens,delay,320,1);
    addPath(`M${cx+4},${cy+4} L${cx+14},${cy+14}`,220,340);
    after(delay+620, ()=>{
      addPath(`M${cx-8},${cy-8} L${cx},${cy}`,180,0);
      addPath(`M${cx},${cy-8} L${cx-8},${cy}`,180,90);
    });
  } else if(type==='pause'){
    [-9,3].forEach((dx,i)=>{
      const b = se('rect',{x:cx+dx,y:cy-12,width:6,height:24,rx:1.5, fill:color});
      b.style.opacity=0; g.appendChild(b);
      after(delay+i*160, ()=>{
        const t0=performance.now();
        function step(now){ const p=Math.min(1,(now-t0)/350); b.style.opacity=p; if(p<1) raf(step); }
        raf(step);
      });
    });
  } else if(type==='grid'){
    const cells=[[-12,-12],[0,-12],[12,-12],[-12,0],[0,0],[12,0]];
    cells.forEach((c,i)=>{
      const on = i===2||i===4;
      const r = se('rect',{x:cx+c[0]-5,y:cy+c[1]-5,width:10,height:10,rx:2, stroke:color,'stroke-width':1.6, fill: on?color:'none', 'fill-opacity': on?0.4:0});
      r.style.opacity=0; g.appendChild(r);
      after(delay+i*90, ()=>{
        const t0=performance.now();
        function step(now){ const p=Math.min(1,(now-t0)/260); r.style.opacity=p; if(p<1) raf(step); }
        raf(step);
      });
    });
  } else if(type==='swap'){
    addPath(`M${cx-14},${cy-5} L${cx+8},${cy-5}`,240,0);
    addPath(`M${cx+3},${cy-9} L${cx+8},${cy-5} L${cx+3},${cy-1}`,180,220);
    addPath(`M${cx+14},${cy+5} L${cx-8},${cy+5}`,240,420);
    addPath(`M${cx-3},${cy+1} L${cx-8},${cy+5} L${cx-3},${cy+9}`,180,640);
  } else if(type==='fork'){
    addPath(`M${cx},${cy-14} L${cx},${cy-2}`,220,0);
    addPath(`M${cx},${cy-2} L${cx-12},${cy+14}`,280,280);
    addPath(`M${cx},${cy-2} L${cx+12},${cy+14}`,280,280);
    addDot(3,-12,16,680,'var(--statc)');
    addDot(3,12,16,680,'var(--danger)');
  } else if(type==='tuple'){
    addPath(`M${cx-16},${cy-10} Q${cx-20},${cy} ${cx-16},${cy+10}`,300,0);
    addDot(3,-4,0,340); addDot(3,4,0,440);
    addPath(`M${cx+16},${cy-10} Q${cx+20},${cy} ${cx+16},${cy+10}`,300,560);
  } else if(type==='loop'){
    const arc = addPath(`M${cx-10},${cy-8} A12,12 0 1 1 ${cx-10.5},${cy+7.5}`,480,0);
    addPath(`M${cx-16},${cy+2} L${cx-10.5},${cy+7.5} L${cx-4},${cy+3}`,220,480);
  } else if(type==='breakcircuit'){
    addPath(`M${cx-16},${cy} L${cx-4},${cy}`,180,0);
    addPath(`M${cx+4},${cy} L${cx+16},${cy}`,180,480);
    after(delay+240, ()=>{
      addPath(`M${cx-4},${cy} L${cx},${cy-8}`,140,0);
      addPath(`M${cx},${cy-8} L${cx+4},${cy}`,140,90);
    });
  } else if(type==='heartbeat'){
    addPath(`M${cx-16},${cy} L${cx-6},${cy} L${cx-2},${cy-12} L${cx+2},${cy+12} L${cx+6},${cy} L${cx+16},${cy}`,600,0);
  } else if(type==='eye'){
    addPath(`M${cx-16},${cy} Q${cx},${cy-12} ${cx+16},${cy} Q${cx},${cy+12} ${cx-16},${cy} Z`,450,0);
    addDot(4,0,0,520);
  }
  return g;
}

/* generate a pseudo hex address, stable per call site */
function hexAddr(n){ return '0x' + n.toString(16).toUpperCase().padStart(6,'0'); }

/* ---------- slide scaffolding ---------- */
function setTitle(main, kicker){
  zoneTitle.innerHTML='';
  if(kicker) zoneTitle.appendChild(sectionKicker(kicker,80,58));
  const t = txt(80, kicker?96:80, main, 'title-text');
  zoneTitle.appendChild(t);
  fadeUp(t,0,450,10);
}
function setCaption(str){
  zoneCaption.innerHTML='';
  if(!str) return;
  const t = txt(80,838,str,'caption-text');
  zoneCaption.appendChild(t);
  fadeUp(t,50,450,8);
}
function clearMain(){ zoneMain.innerHTML=''; }

/* generic "predict pause" helper: shows a question + click-to-reveal glow button,
   then calls revealFn() which continues the timeline. Used for cliffhanger GAP slides
   and true predict-before-you-see-it moments. */
function predictGate(x,y,question,onReveal){
  const g = se('g',{});
  const w=1000;
  const bg = box(x-40,y-45,w,110,'var(--dim)',{fill:'rgba(255,255,255,0.025)', 'stroke-dasharray':'4,4'});
  g.appendChild(bg);
  const qt = txt(x-20,y-6,'', 'label-24');
  qt.style.fontStyle='italic';
  g.appendChild(qt);
  const words = question.split(' ');
  // wrap manually
  let line='', lines=[];
  words.forEach(w2=>{ if((line+w2).length>62){lines.push(line);line=w2+' ';} else line+=w2+' '; });
  lines.push(line);
  lines.forEach((ln,i)=>tspanLine(qt, x-20, i===0?0:26, ln.trim()));
  qt.setAttribute('y', y - 8 - (lines.length-1)*13);

  const btn = se('g',{class:'clickable'});
  const bw=190,bh=42;
  const bx = x-20, by = y+34;
  btn.appendChild(box(bx,by,bw,bh,'var(--ptr)',{fill:'rgba(178,143,209,0.10)', rx:21}));
  btn.appendChild(txt(bx+bw/2, by+27, 'Click to reveal &#9656;', 'label-14', {'text-anchor':'middle', fill:'#d8c8ea'}));
  btn.lastChild.textContent = 'Click to reveal ▸';
  g.appendChild(btn);
  fadeUp(g,0,500,10);
  btn.addEventListener('click', ()=>{
    btn.style.pointerEvents='none';
    fadeOnly(btn,0,300,0);
    onReveal();
  });
  return g;
}

/* ================================================================
   SLIDE DEFINITIONS (combined: Memory & Low-Level, then Error Handling)
   ================================================================ */
const slides = [];

/* 0 ---------------- TITLE ---------------- */
slides.push({
  kicker:'A Feynman-style walkthrough',
  title:'Memory & Low-Level Concepts',
  caption:'How your program actually lives inside a computer.',
  build(main){
    const cx=800, cy=430;
    const ring = se('circle',{cx,cy,r:4,fill:'none',stroke:'var(--stack)','stroke-width':2});
    main.appendChild(ring);
    tweenAttrs(ring,{r:170},1400,200,easeOutCubic);
    ring.style.opacity=0.55;
    const chip = box(cx-90,cy-55,180,110,'var(--ptr)',{rx:10});
    main.appendChild(chip);
    fadeUp(chip,500,600,20);
    const lbl = txt(cx,cy-10,'CPU', 'title-text',{'text-anchor':'middle'});
    main.appendChild(lbl); fadeUp(lbl,700,500,10);
    const lbl2 = txt(cx,cy+28,'reading & writing bytes','sub-text',{'text-anchor':'middle'});
    main.appendChild(lbl2); fadeUp(lbl2,850,500,10);
    const dots=[[-330,-140,'var(--stack)','stack'],[330,-140,'var(--heap)','heap'],[-330,150,'var(--statc)','static'],[330,150,'var(--danger)','pitfalls']];
    dots.forEach(([dx,dy,c,name],i)=>{
      const px=cx+dx, py=cy+dy;
      const d = se('circle',{cx:px,cy:py,r:8,fill:c});
      main.appendChild(d); fadeUp(d,1000+i*120,400,10);
      const t = txt(px, py + (dy<0?-20:32), name, 'label-18',{'text-anchor':'middle'});
      main.appendChild(t); fadeUp(t,1050+i*120,400,8);
      const ln = arrow(cx+dx*0.28, cy+dy*0.28, px-Math.sign(dx)*16, py, c, {sw:1.4});
      main.appendChild(ln); ln.style.opacity=0; fadeOnly(ln,1000+i*120,400,0.6);
    });
  }
});

/* 1 ---------------- HOOK ---------------- */
slides.push({
  kicker:'The question everything starts from',
  title:'Where does a variable actually live?',
  caption:'Not a metaphor — a real address in physical RAM.',
  build(main){
    const t1 = txt(120,260,'int x = 5;','label-24 mono',{fill:'var(--text)'});
    main.appendChild(t1); fadeUp(t1,100,500,14);
    const box1 = box(120,300,220,90,'var(--dim)',{fill:'rgba(255,255,255,0.03)'});
    main.appendChild(box1); fadeUp(box1,500,500,14);
    const q = txt(230,352,'?','title-text',{'text-anchor':'middle', fill:'var(--muted)'});
    main.appendChild(q); fadeUp(q,700,500,10);
    // three candidate regions
    const regions=[
      {x:900,y:190,w:280,h:140,c:'var(--stack)',label:'Stack',sub:'fast, automatic'},
      {x:900,y:360,w:280,h:140,c:'var(--heap)',label:'Heap',sub:'flexible, manual'},
      {x:900,y:530,w:280,h:140,c:'var(--statc)',label:'Static / Global',sub:'fixed for life of program'},
    ];
    const regionEls=[];
    regions.forEach((r,i)=>{
      const g = labeledBox(r.x,r.y,r.w,r.h,r.c,r.label,r.sub);
      main.appendChild(g); fadeUp(g,900+i*180,500,16); regionEls.push(g);
    });
    /* a small traveling probe visits each candidate in turn, showing that
       the SAME variable declaration could genuinely land in any of them */
    const probe = se('circle',{cx:230,cy:345,r:8,fill:'var(--ptr)'});
    probe.style.opacity=0;
    main.appendChild(probe);
    after(1600, ()=>{
      fadeOnly(probe,0,300,1);
      const targets = regions.map(r=>[r.x+40, r.y+r.h/2]);
      let t=200;
      targets.forEach((pt,i)=>{
        tweenAttrs(probe,{cx:pt[0],cy:pt[1]},500,t,easeInOutCubic, ()=>{

/* 24 ---------------- OBSERVABILITY ---------------- */
slides.push({
  kicker:'Beyond logging alone',
  title:'Observability',
  caption:'Logs, metrics, and traces together — three lenses that zoom from symptom to root cause.',
  build(main){
    /* a literal drill-down: metric symptom -> trace showing where -> log
       showing why, using a crash-zoom into the same focal spot each time */
    const fx=780, fy=400;
    const sceneG = se('g',{});
    main.appendChild(sceneG);

    function crashZoomOut(g, dur, onDone){
      const t0=performance.now();
      function step(now){
        const p=Math.min(1,(now-t0)/dur);
        const s=1+p*9;
        g.setAttribute('transform', `translate(${fx},${fy}) scale(${s}) translate(${-fx},${-fy})`);
        g.style.opacity = String(1-p);
        if(p<1) raf(step); else onDone && onDone();
      }
      raf(step);
    }
    function crashZoomIn(g, dur){
      g.setAttribute('transform', `translate(${fx},${fy}) scale(0.12) translate(${-fx},${-fy})`);
      g.style.opacity='1';
      const t0=performance.now();
      function step(now){
        const p=Math.min(1,(now-t0)/dur);
        const s=0.12+(1-0.12)*easeOutCubic(p);
        g.setAttribute('transform', `translate(${fx},${fy}) scale(${s}) translate(${-fx},${-fy})`);
        if(p<1) raf(step);
      }
      raf(step);
    }

    function sceneMetric(){
      sceneG.innerHTML=''; sceneG.setAttribute('transform',''); sceneG.style.opacity='1';
      const kicker = txt(150,200,'METRIC: the symptom, aggregated across everything','label-14',{fill:'var(--heap)'});
      sceneG.appendChild(kicker); fadeUp(kicker,0,400,8);
      const wide = box(150,230,1260,300,'var(--heap)',{fill:'rgba(214,154,99,0.05)'});
      sceneG.appendChild(wide); fadeUp(wide,100,450,14);
      const lbl = txt(780,290,'payments platform \u2014 error rate over time','label-18',{'text-anchor':'middle',fill:'var(--muted)'});
      sceneG.appendChild(lbl); fadeUp(lbl,300,400,8);
      const dot = se('circle',{cx:fx,cy:fy,r:9,fill:'var(--danger)'});
      dot.style.opacity=0; sceneG.appendChild(dot);
      after(900, ()=>{ fadeOnly(dot,0,300,1); pulse(dot,200,4); });
      const metricLbl = txt(fx+24,fy+6,'','label-18',{fill:'var(--danger)'});
      tspanLine(metricLbl,fx+24,0,'error rate spikes to 12%');
      metricLbl.style.opacity=0;
      sceneG.appendChild(metricLbl);
      after(1200, ()=>fadeOnly(metricLbl,0,350,1));
    }
    function sceneTrace(){
      sceneG.innerHTML=''; sceneG.style.opacity='1';
      const kicker = txt(150,200,'TRACE: one request\u2019s path across every service','label-14',{fill:'var(--ptr)'});
      sceneG.appendChild(kicker); fadeUp(kicker,0,400,8);
      const names=['api-gateway','checkout-svc','card-processor'];
      const positions=[300,780,1260];
      names.forEach((n,i)=>{
        const isFail = i===2;
        const g = labeledBox(positions[i]-110,fy-45,220,90,isFail?'var(--danger)':'var(--ptr)',n,'',{fill:isFail?'rgba(209,112,111,0.16)':'rgba(178,143,209,0.1)'});
        sceneG.appendChild(g); fadeUp(g,150+i*250,450,14);
        if(i>0){
          const ar = arrow(positions[i-1]+110,fy,positions[i]-110,fy, i===2?'var(--danger)':'var(--muted)');
          sceneG.appendChild(ar); ar.style.opacity=0; drawPath(ar,300,400+i*250);
        }
      });
      after(1300, ()=>{
        const lbl = txt(1260,fy+90,'stalls here, every time','label-14',{'text-anchor':'middle', fill:'var(--danger)'});
        sceneG.appendChild(lbl); fadeUp(lbl,0,400,8);
      });
    }
    function sceneLog(){
      sceneG.innerHTML=''; sceneG.style.opacity='1';
      const kicker = txt(150,200,'LOG: the exact line that explains it','label-14',{fill:'var(--stack)'});
      sceneG.appendChild(kicker); fadeUp(kicker,0,400,8);
      const box1 = box(fx-420,fy-110,840,260,'var(--stack)',{fill:'rgba(111,155,214,0.06)'});
      sceneG.appendChild(box1); fadeUp(box1,100,450,14);
      const fields=['service: card-processor','level: ERROR','message: "connection pool exhausted"','active_connections: 100 / 100'];
      fields.forEach((f,i)=>{
        const t = txt(fx-390,fy-60+i*46,f,'label-18 mono',{fill:i===2?'var(--danger)':'var(--text)'});
        sceneG.appendChild(t); fadeUp(t,400+i*220,400,10);
      });
    }

    sceneMetric();
    after(2200, ()=> crashZoomOut(sceneG,550, ()=>{ sceneTrace(); crashZoomIn(sceneG,500); }));
    after(4200, ()=> crashZoomOut(sceneG,550, ()=>{ sceneLog(); crashZoomIn(sceneG,500); }));

    after(6200, ()=>{
      const note = txt(150,700,'metric said something is wrong \u2192 trace said where \u2192 log said exactly why.','label-18',{fill:'var(--muted)'});
      main.appendChild(note); fadeUp(note,0,500,10);
    });

/* ================================================================
   NAVIGATION / RENDER ENGINE
   ================================================================ */
let cur = 0;
function renderDots(){
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML='';
  slides.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className='dot'+(i===cur?' active':'');
    d.addEventListener('click', ()=>gotoSlide(i));
    dotsEl.appendChild(d);
  });
}
function gotoSlide(i){
  if(i<0 || i>=slides.length) return;
  clearAll();
  cur=i;
  clearMain();
  const s = slides[cur];
  setTitle(s.title, s.kicker);
  setCaption(s.caption);
  s.build(zoneMain);
  renderDots();
  document.getElementById('slideNum').textContent = `${cur+1} / ${slides.length}`;
}
document.getElementById('prevBtn').addEventListener('click', ()=>gotoSlide(cur-1));
document.getElementById('nextBtn').addEventListener('click', ()=>gotoSlide(cur+1));
window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key===' ') { e.preventDefault(); gotoSlide(cur+1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); gotoSlide(cur-1); }
  else if(e.key==='r' || e.key==='R'){ gotoSlide(cur); }
});
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) clearAll();
});

gotoSlide(0);
})();
</script>
