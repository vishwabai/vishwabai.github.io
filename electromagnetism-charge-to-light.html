<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electromagnetism — From a Single Charge to Light</title>
<style>
  :root{
    --bg:#05060a; --ink:#dcdce0; --dim:#7f818c;
    --pos:#d16a6a; --neg:#6a90cf; --efield:#4fa394; --bfield:#9b83c7;
    --metal:#9aa0a8; --gold:#c99a4b; --green:#82b07d; --amber:#d0a24f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink)}
  .wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .stage{position:relative;aspect-ratio:16/9;width:min(100vw,177.78vh);
    height:min(56.25vw,100vh);background:var(--bg);overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.8)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---- overlay text zones (fixed → never overlap the canvas figure) ---- */
  .layer{position:absolute;inset:0;pointer-events:none}
  .tag{position:absolute;top:3.2%;left:3.2%;font-size:1.35vh;letter-spacing:.18em;
    text-transform:uppercase;color:var(--dim);font-weight:600}
  .counter{position:absolute;top:3.2%;right:3.2%;font-size:1.3vh;color:var(--dim);
    letter-spacing:.1em;font-variant-numeric:tabular-nums}
  .title{position:absolute;top:6.5%;left:0;right:0;text-align:center;
    font-family:Georgia,"Times New Roman",serif;font-size:3.9vh;font-weight:600;
    letter-spacing:.01em;color:var(--ink);padding:0 6%}
  .subtitle{position:absolute;top:15.5%;left:0;right:0;text-align:center;
    font-size:1.7vh;color:var(--dim);letter-spacing:.03em;padding:0 12%}
  .caption{position:absolute;bottom:6.2%;left:0;right:0;text-align:center;
    font-size:1.95vh;color:var(--ink);padding:0 9%;line-height:1.5}
  .caption .k{color:var(--gold)} .caption em{color:var(--efield);font-style:normal}

  /* bridge (recap / gap / fill) centered content */
  .bridge{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2.6vh;padding:0 12%;text-align:center}
  .bridge div{opacity:0}
  .recap{font-size:2.1vh;color:var(--dim);animation:rise .7s ease-out .15s forwards}
  .recap b{color:var(--ink);font-weight:600}
  .gap{font-family:Georgia,serif;font-size:3.4vh;color:var(--gold);font-weight:600;
    line-height:1.35;animation:rise .7s ease-out 1.5s forwards}
  .fill{font-size:2.1vh;color:var(--green);letter-spacing:.02em;
    animation:rise .7s ease-out 3.0s forwards}
  .fill b{font-weight:600}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* section divider slide */
  .sect{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:0 8%}
  .sect .num{font-family:Georgia,serif;font-size:2.2vh;color:var(--gold);
    letter-spacing:.3em;margin-bottom:1.4vh;opacity:0;animation:rise .6s ease-out .1s forwards}
  .sect .big{font-family:Georgia,serif;font-size:5.4vh;font-weight:600;
    opacity:0;animation:rise .7s ease-out .35s forwards}
  .sect .lead{font-size:1.9vh;color:var(--dim);margin-top:2vh;max-width:70%;
    line-height:1.55;opacity:0;animation:rise .7s ease-out .7s forwards}
  .herowrap{position:absolute;top:14%;left:0;right:0;text-align:center;padding:0 8%}
  .herowrap .big{font-family:Georgia,serif;font-size:5.2vh;font-weight:600;opacity:0;
    animation:rise .7s ease-out .2s forwards}
  .herowrap .lead{font-size:1.9vh;color:var(--dim);margin:2vh auto 0;max-width:60%;
    line-height:1.55;opacity:0;animation:rise .7s ease-out .7s forwards}

  /* nav */
  .nav{position:absolute;bottom:2.8%;right:3.2%;display:flex;gap:1.2vh;pointer-events:auto}
  .nav button{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);
    color:var(--ink);width:4.6vh;height:4.6vh;border-radius:50%;cursor:pointer;
    font-size:2vh;display:grid;place-items:center;transition:.2s;font-family:serif}
  .nav button:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
  .nav button:disabled{opacity:.25;cursor:default}
  .bar{position:absolute;bottom:0;left:0;height:3px;background:var(--gold);
    transition:width .4s ease;opacity:.8}
  .hint{position:absolute;bottom:3%;left:3.2%;font-size:1.2vh;color:var(--dim);
    letter-spacing:.05em;pointer-events:none}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important}}
</style>
</head>
<body>
<div class="wrap"><div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="layer" id="overlay"></div>
  <div class="bar" id="bar"></div>
  <div class="hint">← / →  ·  space to advance</div>
  <div class="nav">
    <button id="prev" title="Previous">‹</button>
    <button id="next" title="Next">›</button>
  </div>
</div></div>

<script>
/* ============================================================= ENGINE ==== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const overlay=document.getElementById('overlay');
const W=1600,H=900;                       // virtual coordinate space
const DPR=Math.min(window.devicePixelRatio||1,2);
function fit(){ cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();

const C={bg:'#05060a',ink:'#dcdce0',dim:'#7f818c',pos:'#d16a6a',neg:'#6a90cf',
  efield:'#4fa394',bfield:'#9b83c7',metal:'#9aa0a8',gold:'#c99a4b',
  green:'#82b07d',amber:'#d0a24f',faint:'rgba(220,220,224,.10)'};

/* ---- math helpers ---- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeO=t=>1-Math.pow(1-t,3);
/* staged reveal: progress of segment [s,s+d] at time t, eased */
function seg(t,s,d,ease=easeIO){return ease(clamp((t-s)/d,0,1));}
const TAU=Math.PI*2;

/* ---- drawing primitives (all take ctx-space 1600x900) ---- */
function setFont(sz,{serif=false,weight=400,italic=false}={}){
  ctx.font=`${italic?'italic ':''}${weight} ${sz}px ${serif?'Georgia, serif':'"Segoe UI",system-ui,sans-serif'}`;}
function text(str,x,y,o={}){
  const {size=22,color=C.ink,align='center',baseline='middle',serif=false,
    italic=false,weight=400,alpha=1}=o;
  ctx.save();ctx.globalAlpha=alpha;setFont(size,{serif,weight,italic});
  ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline=baseline;
  ctx.fillText(str,x,y);ctx.restore();}
function line(x1,y1,x2,y2,o={}){
  const{color=C.ink,width=2,alpha=1,dash=null,cap='round'}=o;
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;
  ctx.lineCap=cap;if(dash)ctx.setLineDash(dash);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();}
function arrow(x1,y1,x2,y2,o={}){
  const{color=C.ink,width=2.5,head=12,alpha=1,prog=1,dash=null}=o;
  const ex=lerp(x1,x2,prog),ey=lerp(y1,y2,prog);
  if(prog<=0.001)return;
  line(x1,y1,ex,ey,{color,width,alpha,dash});
  const a=Math.atan2(ey-y1,ex-x1);const h=head;
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;
  ctx.beginPath();ctx.moveTo(ex,ey);
  ctx.lineTo(ex-h*Math.cos(a-.4),ey-h*Math.sin(a-.4));
  ctx.lineTo(ex-h*Math.cos(a+.4),ey-h*Math.sin(a+.4));
  ctx.closePath();ctx.fill();ctx.restore();}
function ring(x,y,r,o={}){
  const{color=C.ink,width=2,alpha=1,dash=null,prog=1}=o;
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;
  if(dash)ctx.setLineDash(dash);ctx.beginPath();
  ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2+TAU*prog);ctx.stroke();ctx.restore();}
function disc(x,y,r,color,alpha=1){ctx.save();ctx.globalAlpha=alpha;
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();}
function charge(x,y,sign,o={}){
  const{r=20,alpha=1,glow=true,label=null}=o;
  const col=sign>0?C.pos:C.neg;
  ctx.save();ctx.globalAlpha=alpha;
  if(glow){ctx.shadowColor=col;ctx.shadowBlur=14;}
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.restore();
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle='#0a0a0e';ctx.lineWidth=r*0.18;
  ctx.lineCap='round';const s=r*0.5;
  ctx.beginPath();ctx.moveTo(x-s,y);ctx.lineTo(x+s,y);
  if(sign>0){ctx.moveTo(x,y-s);ctx.lineTo(x,y+s);}ctx.stroke();ctx.restore();
  if(label)text(label,x,y+r+18,{size:19,italic:true,serif:true,color:col,alpha});}
/* short field arrow for vector fields */
function fieldArrow(x,y,ang,len,color,alpha){
  const x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len;
  arrow(x,y,x2,y2,{color,width:1.8,head:6,alpha});}
/* sample a vector field fn(x,y)->{fx,fy}; draw normalized-ish arrows */
function vecField(fn,x0,y0,x1,y1,step,color,scale=1,alpha=.85){
  for(let x=x0;x<=x1;x+=step)for(let y=y0;y<=y1;y+=step){
    const v=fn(x,y);if(!v)continue;const m=Math.hypot(v.fx,v.fy);if(m<1e-6)continue;
    const L=clamp(scale*Math.pow(m,.5),4,step*0.62);
    fieldArrow(x-Math.cos(Math.atan2(v.fy,v.fx))*L/2,
               y-Math.sin(Math.atan2(v.fy,v.fx))*L/2,
               Math.atan2(v.fy,v.fx),L,color,alpha*clamp(m*40,.25,1));}}
/* sine wave polyline */
function wave(x0,y0,x1,amp,k,phase,o={}){
  const{color=C.efield,width=2.5,alpha=1,steps=140,fn=Math.sin}=o;
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;
  ctx.lineJoin='round';ctx.beginPath();
  for(let i=0;i<=steps;i++){const x=lerp(x0,x1,i/steps);
    const y=y0-amp*fn(k*(x-x0)-phase);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  ctx.stroke();ctx.restore();}
function dot(x,y,r,color,alpha=1){disc(x,y,r,color,alpha);}
function label(str,x,y,color=C.dim,size=18,align='center'){
  text(str,x,y,{size,color,align,italic:true,serif:true});}

/* small circuit kit */
function wirePath(pts,o={}){const{color=C.metal,width=3,alpha=1}=o;
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;
  ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.stroke();ctx.restore();}
function resistor(x,y,w,horiz=true,color=C.metal){
  const n=6,seg=w/n;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=3;
  ctx.lineJoin='round';ctx.beginPath();
  if(horiz){ctx.moveTo(x,y);for(let i=0;i<n;i++){const sx=x+i*seg;
    ctx.lineTo(sx+seg/2,y+(i%2?10:-10));ctx.lineTo(sx+seg,y);}}
  ctx.stroke();ctx.restore();}
function capSym(x,y,gap=14,len=34,color=C.metal){
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=3;
  line(x-gap/2,y-len/2,x-gap/2,y+len/2,{color,width:3});
  line(x+gap/2,y-len/2,x+gap/2,y+len/2,{color,width:3});ctx.restore();}
function battery(x,y,color=C.metal){
  line(x-6,y-22,x-6,y+22,{color,width:3});
  line(x+6,y-12,x+6,y+12,{color,width:5});}
function coil(x,y,w,loops=4,color=C.metal){
  const r=w/(loops*2);ctx.save();ctx.strokeStyle=color;ctx.lineWidth=3;
  ctx.beginPath();for(let i=0;i<loops;i++){const cx=x+r+i*2*r;
    ctx.arc(cx,y,r,Math.PI,0,false);}ctx.stroke();ctx.restore();}

/* ============================================================ SLIDES ===== */
const slides=[];
function addSlide(cfg){slides.push(cfg);}

/* ---------- INTRO ---------- */
addSlide({kind:'title',
  title:'Electromagnetism',
  lead:'From a single charge to light — built one gap at a time.',
  render(t){
    const cx=500,cy=605;
    for(let i=0;i<16;i++){const a=i/16*TAU;const p=seg(t,.2+i*.03,1.2);
      const r1=42,r2=200;
      arrow(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1,
            cx+Math.cos(a)*lerp(r1,r2,p),cy+Math.sin(a)*lerp(r1,r2,p),
            {color:C.efield,width:1.5,head:7,alpha:.45*p});}
    charge(cx,cy,+1,{r:34});
    text('a charge',cx,cy+130,{size:19,italic:true,serif:true,color:C.dim,alpha:seg(t,.6,1)});
    const p2=seg(t,1.4,1.6);
    if(p2>0){line(cx+230,cy,980,cy,{color:C.dim,width:1.4,alpha:.28*p2,dash:[5,9]});
      wave(1000,cy,1440,52,.034,t*3,{color:C.efield,width:2.4,alpha:.8*p2});
      wave(1000,cy,1440,30,.034,t*3,{color:C.bfield,width:2,alpha:.5*p2,fn:x=>Math.sin(x)});
      text('light',1215,cy+95,{size:19,italic:true,serif:true,color:C.dim,alpha:.7*p2});}
  }});

addSlide({kind:'concept',tag:'The whole story',title:'One thread, five ideas',
  takeaway:'Each idea appears to <em>fill a gap</em> the last one opened. Follow the thread.',
  render(t){
    const ys=460,xs=[240,480,760,1040,1330],
      nm=['charge','field','current','magnetism','light'],
      cl=[C.pos,C.efield,C.amber,C.bfield,C.ink];
    line(xs[0],ys,xs[4],ys,{color:C.faint,width:3});
    const pr=seg(t,.2,2.4);
    line(xs[0],ys,lerp(xs[0],xs[4],pr),ys,{color:C.gold,width:3,alpha:.6});
    const pulse=lerp(xs[0],xs[4],(t*.18)%1);disc(pulse,ys,6,C.gold,.8);
    xs.forEach((x,i)=>{const p=seg(t,.2+i*.42,.5);
      disc(x,ys,9+5*p,cl[i],.9*p+.1);ring(x,ys,20,{color:cl[i],alpha:.4*p,width:1.5});
      text(nm[i],x,ys-52,{size:20,serif:true,color:cl[i],alpha:p});
      text('P4.'+(i+1),x,ys+50,{size:14,color:C.dim,alpha:.6*p});});
  }});

/* ---------- P4.1 SECTION ---------- */
addSlide({kind:'section',num:'P 4 . 1',big:'Electrostatics',
  lead:'Charges that sit still — and the invisible landscape they build around themselves.',
  render(t){const cx=800,cy=700;
    for(let i=0;i<10;i++){const a=i/10*TAU+t*.1;
      arrow(cx,cy,cx+Math.cos(a)*80,cy+Math.sin(a)*80,{color:C.efield,width:1,head:5,alpha:.16});}
    charge(cx,cy,+1,{r:16,glow:true});}});

/* ---------- Coulomb's law ---------- */
addSlide({kind:'concept',tag:'P4.1 · Electrostatics',title:"Coulomb's Law",
  subtitle:'Two charges push or pull along the line joining them.',
  takeaway:'Force <em>F = k q₁q₂ / r²</em> — double the gap, quarter the force. The <em>1/r²</em> is everything.',
  render(t){
    const y=430,x1=560; const r=lerp(150,330,(Math.sin(t*.9)+1)/2);
    const x2=x1+r;
    const F=9000/(r*r); // arbitrary scaled 1/r^2
    charge(x1,y,+1,{r:24,label:'q₁'});charge(x2,y,+1,{r:24,label:'q₂'});
    // distance marker
    line(x1,y+60,x2,y+60,{color:C.dim,width:1.2,dash:[4,6],alpha:.6});
    line(x1,y+52,x1,y+68,{color:C.dim,width:1.2,alpha:.6});
    line(x2,y+52,x2,y+68,{color:C.dim,width:1.2,alpha:.6});
    label('r',(x1+x2)/2,y+82,C.dim,20);
    // repulsion arrows, length ∝ 1/r^2
    arrow(x1,y,x1-F,y,{color:C.gold,width:3,head:12});
    arrow(x2,y,x2+F,y,{color:C.gold,width:3,head:12});
    text('F',x2+F+22,y-4,{size:20,italic:true,serif:true,color:C.gold});
    // ghost: 2r → F/4
    const gx=x1+2*r;
    if(2*r<820){disc(gx,y,6,C.dim,.35);
      arrow(gx,y,gx+F/4,y,{color:C.dim,width:2,head:8,alpha:.5});
      text('2r → F/4',gx+40,y+34,{size:16,color:C.dim,alpha:.55,align:'left'});}
    text('F = k q₁q₂ / r²',800,700,{size:26,serif:true,italic:true,color:C.ink,alpha:seg(t,.4,1)});
  }});

/* ---------- Electric field ---------- */
addSlide({kind:'concept',tag:'P4.1 · Electrostatics',title:'The Electric Field',
  subtitle:'Stop tracking every pair. Let the charge paint the whole space.',
  takeaway:'<em>E = F/q</em> lives at every point, whether or not a test charge is there to feel it.',
  render(t){
    const cx=640,cy=440;
    for(let i=0;i<14;i++){const a=i/14*TAU;const p=seg(t,.1+i*.02,1);
      arrow(cx+Math.cos(a)*40,cy+Math.sin(a)*40,
            cx+Math.cos(a)*lerp(40,190,p),cy+Math.sin(a)*lerp(40,190,p),
            {color:C.efield,width:1.6,head:7,alpha:.5*p});}
    charge(cx,cy,+1,{r:26,label:'Q'});
    // test charge orbiting, feels qE outward
    const p2=seg(t,1.2,1);
    if(p2>0){const ang=t*.7;const R=230;
      const tx=cx+Math.cos(ang)*R,ty=cy+Math.sin(ang)*R;
      charge(tx,ty,+1,{r:13,label:null,glow:false,alpha:p2});
      arrow(tx,ty,tx+Math.cos(ang)*46,ty+Math.sin(ang)*46,{color:C.gold,width:2.4,head:9,alpha:p2});
      text('q',tx+Math.cos(ang)*22,ty+Math.sin(ang)*22-16,{size:16,italic:true,serif:true,color:C.neg,alpha:p2});
      text('F = qE',tx+Math.cos(ang)*70,ty+Math.sin(ang)*70,{size:17,serif:true,italic:true,color:C.gold,alpha:p2,align:'left'});}
    text('E = F / q',1120,440,{size:26,serif:true,italic:true,color:C.efield,alpha:seg(t,.5,1)});
  }});

/* bridge → Gauss */
addSlide({kind:'bridge',
  recap:'We can now draw the field as arrows filling all of space.',
  gap:'But summing the field from a whole <i>cloud</i> of charge is brutal — is there a shortcut when the shape is symmetric?',
  fill:'Gauss\u2019s law — let the field <b>count the charge</b> for you.'});

/* ---------- Gauss's law ---------- */
addSlide({kind:'concept',tag:'P4.1 · Electrostatics',title:"Gauss's Law",
  subtitle:'The flux poking out of any closed surface only counts what is inside.',
  takeaway:'∮ <em>E·dA = Q/ε₀</em>  ·  locally  <em>∇·E = ρ/ε₀</em>. Symmetry turns a hard integral into one line.',
  render(t){
    const cx=560,cy=440,R=170;
    charge(cx,cy,+1,{r:22,label:'Q'});
    // field lines through surface
    const n=16;let cross=0;
    for(let i=0;i<n;i++){const a=i/n*TAU;const p=seg(t,.1,1);
      arrow(cx+Math.cos(a)*30,cy+Math.sin(a)*30,
            cx+Math.cos(a)*lerp(30,250,p),cy+Math.sin(a)*lerp(30,250,p),
            {color:C.efield,width:1.4,head:6,alpha:.4*p});
      if(p>=.99)cross++;}
    // gaussian sphere draws in
    ring(cx,cy,R,{color:C.gold,width:2.5,dash:[7,7],prog:seg(t,.4,1.2),alpha:.85});
    text('closed surface',cx,cy-R-22,{size:15,color:C.gold,alpha:seg(t,.9,.6)});
    // deformed (blob) surface = same flux
    const p3=seg(t,1.8,1.2);
    if(p3>0){ctx.save();ctx.globalAlpha=.5*p3;ctx.strokeStyle=C.gold;ctx.lineWidth=2;
      ctx.setLineDash([4,6]);ctx.beginPath();
      for(let k=0;k<=60;k++){const a=k/60*TAU;
        const rr=R+40+30*Math.sin(a*3+1);
        const x=cx+Math.cos(a)*rr*.0+ (940)+Math.cos(a)*(rr);
        const y=cy+Math.sin(a)*rr;k?ctx.lineTo(x,y):ctx.moveTo(x,y);}
      ctx.stroke();ctx.restore();
      charge(940,cy,+1,{r:16,alpha:p3});
      text('same charge inside  →  same flux',940,cy+230,{size:17,color:C.dim,alpha:p3});}
    text('∮ E·dA = Q/ε₀',300,750,{size:23,serif:true,italic:true,color:C.efield,alpha:seg(t,.6,1),align:'left'});
    text('∇·E = ρ/ε₀',1000,750,{size:23,serif:true,italic:true,color:C.gold,alpha:seg(t,1.2,1),align:'left'});
  }});

/* bridge → potential */
addSlide({kind:'bridge',
  recap:'Flux through any closed surface counts the enclosed charge — hard problems collapse under symmetry.',
  gap:'But the field is a <i>vector</i> — three numbers at every point. Isn\u2019t there one simpler number holding the same information?',
  fill:'Electric potential — a single <b>scalar hill</b> the field rolls down.'});

/* ---------- Potential ---------- */
addSlide({kind:'concept',tag:'P4.1 · Electrostatics',title:'Potential & Energy',
  subtitle:'One scalar V per point. The field is just its downhill slope.',
  takeaway:'<em>E = −∇V</em>, energy <em>U = qV</em>. Equipotentials (rings) always cross field lines at right angles.',
  render(t){
    const cx=560,cy=460;
    // equipotential rings (⟂ to field)
    for(let i=1;i<=5;i++){const rr=i*44;const p=seg(t,.2+i*.12,.8);
      ring(cx,cy,rr,{color:C.neg,width:1.4,alpha:.5*p,dash:[3,7]});}
    // field lines radial
    for(let i=0;i<12;i++){const a=i/12*TAU;const p=seg(t,.5,1);
      arrow(cx+Math.cos(a)*28,cy+Math.sin(a)*28,cx+Math.cos(a)*lerp(28,240,p),
            cy+Math.sin(a)*lerp(28,240,p),{color:C.efield,width:1.3,head:6,alpha:.35*p});}
    charge(cx,cy,+1,{r:22,label:'Q'});
    // a test charge sliding DOWN the potential (outward), speeding up
    const p2=seg(t,1.2,1);
    if(p2>0){const ph=(t*.5)%1;const rr=lerp(50,250,easeO(ph));
      const ax=cx+Math.cos(-0.6)*rr,ay=cy+Math.sin(-0.6)*rr;
      charge(ax,ay,+1,{r:12,glow:false,alpha:p2});
      arrow(ax,ay,ax+Math.cos(-.6)*40,ay+Math.sin(-.6)*40,{color:C.gold,width:2.2,head:8,alpha:p2});}
    label('equipotential',cx,cy+250,C.neg,16);
    text('E = −∇V',1120,400,{size:25,serif:true,italic:true,color:C.efield,alpha:seg(t,.6,1)});
    text('U = qV',1120,470,{size:25,serif:true,italic:true,color:C.gold,alpha:seg(t,1,1)});
  }});

addSlide({kind:'concept',tag:'P4.1 · Electrostatics',title:'Conductors & Images',
  subtitle:'Inside a conductor E = 0. Outside, the boundary reshapes the whole field.',
  takeaway:'A charge near a plane induces surface charge — replaceable by a mirror <em>image −q</em>. Solve <em>∇²V=−ρ/ε₀</em> with boundary conditions.',
  render(t){
    const gx=800; // grounded plane at x=gx
    line(gx,220,gx,700,{color:C.metal,width:4});
    for(let y=230;y<700;y+=26)line(gx,y,gx+16,y+16,{color:C.metal,width:1.2,alpha:.5});

    // induced negative surface charges
    const p1=seg(t,.3,1);

  }});

addSlide({kind:'concept',tag:'P4.2 · Currents',title:'EMF, Power & Kirchhoff',
  subtitle:'A battery pumps charge uphill; resistors bleed the energy back out as heat.',
  takeaway:'Loop rule: voltages around a loop sum to 0. Junction rule: current in = current out. Heat <em>P = I²R</em>.',
  render(t){
    const L=520,R=1060,T=300,B=620;
    wirePath([[L,T],[R,T],[R,B],[L,B],[L,T]],{color:C.metal,width:3});
    // battery on left side
    battery(L,(T+B)/2);text('EMF',L-58,(T+B)/2,{size:16,serif:true,italic:true,color:C.gold});
    // resistor on top, glowing = dissipating
    const glow=.5+.5*Math.sin(t*4);
    ctx.save();ctx.shadowColor=C.amber;ctx.shadowBlur=8*glow;
    resistor(720,T,140,true,C.amber);ctx.restore();
    text('R   P=I²R',790,T-28,{size:16,serif:true,italic:true,color:C.amber,align:'left'});
    // junction branch (a second resistor down-right) for Kirchhoff
    wirePath([[R,(T+B)/2],[R+150,(T+B)/2]],{color:C.metal,width:3});
    disc(R,(T+B)/2,6,C.efield,seg(t,.6,.6));
    text('junction: I₁ = I₂ + I₃',R+30,(T+B)/2-30,{size:15,color:C.efield,align:'left',alpha:seg(t,.6,1)});
    line(R+150,(T+B)/2,R+150,(T+B)/2-120,{color:C.metal,width:3});
    line(R+150,(T+B)/2-120,R,(T+B)/2-120,{color:C.metal,width:3,dash:[4,6]});
    // flowing charge dots clockwise
    const per=2*((R-L)+(B-T));const N=16;
    for(let i=0;i<N;i++){let d=((t*180+i*per/N)%per);let x,y;
      if(d<R-L){x=L+d;y=T;} else if(d<R-L+B-T){x=R;y=T+(d-(R-L));}
      else if(d<2*(R-L)+B-T){x=R-(d-(R-L+B-T));y=B;}
      else{x=L;y=B-(d-(2*(R-L)+B-T));}
      disc(x,y,5,C.amber,.85);}
  }});

addSlide({kind:'concept',tag:'P4.2 · Currents',title:'RC Transient',
  subtitle:'Close the switch and the capacitor charges — fast at first, then crawling.',
  takeaway:'<em>V(t) = V₀(1 − e^{−t/RC})</em>. One time-constant <em>τ = RC</em> gets you 63% of the way.',
  render(t){
    const L=340,T=300,B=560,R=760;
    // circuit
    battery(L,(T+B)/2);wirePath([[L,T],[430,T]],{color:C.metal,width:3});
    resistor(430,T,120,true,C.metal);text('R',490,T-22,{size:16,serif:true,italic:true,color:C.metal});
    wirePath([[550,T],[R,T],[R,(T+B)/2-18]],{color:C.metal,width:3});
    capSym(R,(T+B)/2);text('C',R+34,(T+B)/2,{size:16,serif:true,italic:true,color:C.metal});
    wirePath([[R,(T+B)/2+18],[R,B],[L,B]],{color:C.metal,width:3});
    line(L,T,L,(T+B)/2-22,{color:C.metal,width:3});line(L,(T+B)/2+22,L,B,{color:C.metal,width:3});
    // charge accumulating on plates
    const q=1-Math.exp(-(t%6)/1.6);
    for(let i=0;i<Math.round(q*6);i++){disc(R-7,(T+B)/2-16+i*6,3,C.pos,.8);
      disc(R+7,(T+B)/2-16+i*6,3,C.neg,.8);}
    // charging curve plot
    const ax=940,ay0=560,ax1=1420,ay1=300;
    line(ax,ay0,ax1,ay0,{color:C.dim,width:1.5});line(ax,ay0,ax,ay1,{color:C.dim,width:1.5});
    label('t',ax1-6,ay0+22,C.dim,16);label('V',ax-22,ay1+6,C.dim,16);
    ctx.save();ctx.strokeStyle=C.gold;ctx.lineWidth=2.5;ctx.beginPath();
    const T0=(t%6);
    for(let i=0;i<=100;i++){const tt=i/100*5;if(tt>T0*0.9+0.1)break;
      const x=ax+(tt/5)*(ax1-ax);const v=1-Math.exp(-tt/1.6);
      const y=ay0-v*(ay0-ay1);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.stroke();ctx.restore();
    // tau marker
    const xt=ax+(1.6/5)*(ax1-ax);line(xt,ay0,xt,ay0-0.63*(ay0-ay1),{color:C.efield,width:1,dash:[3,4],alpha:.6});

    text('V(t)=V₀(1−e^{−t/RC})',1150,730,{size:20,serif:true,italic:true,color:C.gold,alpha:seg(t,.4,1)});
  }});

addSlide({kind:'concept',tag:'P4.5 · Maxwell',title:'Making Waves: Radiation',
  subtitle:'A charge that accelerates kinks its own field lines — and the kink flies off as radiation.',
  takeaway:'An oscillating dipole antenna broadcasts EM waves; guides & lines carry them with low loss. Radiation ∝ acceleration².',
  render(t){
    const cx=560,cy=440;
    // oscillating dipole charge
    const disp=60*Math.sin(t*3);
    charge(cx,cy-disp,+1,{r:14,glow:false});charge(cx,cy+disp,-1,{r:14,glow:false});
    line(cx,cy-disp,cx,cy+disp,{color:C.amber,width:2,alpha:.5});
    // expanding wavefronts (donut nulls along axis)
    for(let i=0;i<5;i++){const rr=((t*130+i*90)%450);const al=clamp(1-rr/450,0,1)*.6;
      ctx.save();ctx.globalAlpha=al;ctx.strokeStyle=C.efield;ctx.lineWidth=2;ctx.beginPath();
      for(let k=0;k<=80;k++){const a=k/80*TAU;const lobe=Math.abs(Math.sin(a)); // dipole pattern
        const r2=rr*(0.3+0.7*lobe);
        const x=cx+Math.cos(a)*r2,y=cy+Math.sin(a)*r2;k?ctx.lineTo(x,y):ctx.moveTo(x,y);}
      ctx.closePath();ctx.stroke();ctx.restore();}
    text('oscillating dipole',cx,cy+230,{size:15,color:C.dim});
    // right: waveguide (bouncing ray in a pipe)
    const gx0=1050,gx1=1420,gy0=340,gy1=560;
    line(gx0,gy0,gx1,gy0,{color:C.metal,width:3});line(gx0,gy1,gx1,gy1,{color:C.metal,width:3});
    ctx.save();ctx.strokeStyle=C.gold;ctx.lineWidth=2;ctx.globalAlpha=.8;ctx.beginPath();
    let gx=gx0,up=true,gy=(gy0+gy1)/2;ctx.moveTo(gx,gy);
    const per=90;for(let x=gx0;x<=gx1;x+=6){const ph=((x-gx0+t*140)%(2*per))/per;
      const yy=gy0+20+(gy1-gy0-40)*(ph<1?ph:2-ph);ctx.lineTo(x,yy);}
    ctx.stroke();ctx.restore();
    text('waveguide mode',(gx0+gx1)/2,gy1+30,{size:15,color:C.dim});
  }});

/* ============================================================= BOOT ====== */
function esc(s){return s==null?'':s;}
function bridgeMotif(t){
  const y=205;line(220,y,1380,y,{color:C.faint,width:2});
  const pulse=220+((t*150)%1160);disc(pulse,y,4,C.gold,.45);
  ring(800,y,40,{color:C.gold,width:1.4,alpha:.12+.08*Math.sin(t*3)});
  text('?',800,y,{size:32,serif:true,color:C.gold,alpha:.12+.06*Math.sin(t*3)});
  for(let i=0;i<26;i++){const x=(i*63+t*18)%1600;const yy=300+((i*151)%460);
    disc(x,yy,1.4,C.dim,.09);}
}
function applyOverlay(s,i,n){
  const counter=`<div class="counter">${String(i+1).padStart(2,'0')} / ${n}</div>`;
  let html='';
  if(s.kind==='title'||s.kind==='end'){
    html=`<div class="herowrap">
      <div class="big">${esc(s.title)}</div>
      <div class="lead">${esc(s.lead)}</div></div>${counter}`;
  } else if(s.kind==='section'){
    html=`<div class="tag">Section</div>${counter}
      <div class="sect"><div class="num">${esc(s.num)}</div>
      <div class="big">${esc(s.big)}</div>
      <div class="lead">${esc(s.lead)}</div></div>`;
  } else if(s.kind==='bridge'){
    html=`<div class="tag">Recap · Gap · Fill</div>${counter}
      <div class="bridge">
        <div class="recap"><b>Here's what we have:</b> ${esc(s.recap)}</div>
        <div class="gap">${esc(s.gap)}</div>
        <div class="fill">The answer: <b>${esc(s.fill)}</b></div>
      </div>`;
  } else { // concept
    html=`<div class="tag">${esc(s.tag)}</div>${counter}
      <div class="title">${esc(s.title)}</div>
      ${s.subtitle?`<div class="subtitle">${esc(s.subtitle)}</div>`:''}
      ${s.takeaway?`<div class="caption">${esc(s.takeaway)}</div>`:''}`;
  }
  overlay.innerHTML=html;
}
let cur=0, t0=performance.now();
const bar=document.getElementById('bar');
const prevB=document.getElementById('prev'), nextB=document.getElementById('next');
function goTo(i){cur=clamp(i,0,slides.length-1);t0=performance.now();
  applyOverlay(slides[cur],cur,slides.length);
  bar.style.width=((cur+1)/slides.length*100)+'%';
  prevB.disabled=cur===0;nextB.disabled=cur===slides.length-1;}
function loop(now){const t=(now-t0)/1000;
  ctx.clearRect(0,0,W,H);ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  const s=slides[cur];
  if(s.kind==='bridge')bridgeMotif(t);
  if(s.render)s.render(t);
  requestAnimationFrame(loop);}
prevB.onclick=()=>goTo(cur-1);nextB.onclick=()=>goTo(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();goTo(cur+1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();goTo(cur-1);}});
goTo(0);requestAnimationFrame(loop);
</script>
