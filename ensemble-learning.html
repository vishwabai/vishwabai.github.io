<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ensemble Learning — A Visual Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  window.MathJax = {
    tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] },
    chtml: { scale: 0.95 },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.js" id="mjx" async></script>
<style>
  :root{
    --bg:#0b0d10; --bg2:#0a0c0e; --panel:#111418; --line:#262a30; --line-soft:#1a1d22;
    --blue:#5b8fd6; --green:#6fae8c; --amber:#d6935b; --gold:#e0b45a; --teal:#4bb3a6;
    --rose:#c2687a; --violet:#8a7fc9; --dim:#888e97; --text:#e9e7e2; --accent:#5b8fd6;
    --sans:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace; --serif:'Fraunces',serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;}
  header{display:flex;justify-content:space-between;align-items:center;padding:20px 36px 12px;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;white-space:nowrap;}
  .eyebrow b{color:var(--accent);font-weight:600;transition:color .4s;}
  #progressTrack{height:2px;background:var(--line-soft);margin:0 36px 0;border-radius:2px;overflow:hidden;}
  #progressFill{height:100%;background:var(--accent);width:0%;transition:width .5s ease, background .4s;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 40px 0;position:relative;min-height:0;}
  #slideHost{width:100%;max-width:1100px;height:100%;display:flex;align-items:center;justify-content:center;}
  .slide{display:flex;flex-direction:column;align-items:center;width:100%;max-height:100%;}
  .slide h2{font-family:var(--serif);font-weight:600;font-size:clamp(22px,3vw,34px);margin:0 0 4px;letter-spacing:.2px;text-align:center;}
  .slide .subtitle{font-family:var(--mono);font-size:12.5px;color:var(--dim);margin-bottom:14px;text-align:center;max-width:720px;line-height:1.6;}
  .stage{width:100%;aspect-ratio:1000/440;max-height:56vh;background:radial-gradient(ellipse at 50% 0%, #0e1115, #08090b 75%);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative;box-shadow:0 20px 60px -20px rgba(0,0,0,.6) inset;}
  .stage svg{width:100%;height:100%;display:block;}
  .stage svg *{transform-box:fill-box;transform-origin:center;}
  .caption{font-family:var(--sans);font-size:13.5px;color:#9aa0a8;margin-top:12px;text-align:center;max-width:780px;font-style:italic;line-height:1.5;}
  footer{display:flex;align-items:center;justify-content:space-between;padding:14px 36px 22px;flex-shrink:0;}
  button{font-family:var(--mono);background:none;border:1px solid var(--line);color:var(--text);padding:9px 15px;border-radius:5px;cursor:pointer;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;transition:border-color .2s,color .2s,background .2s;}
  button:hover{border-color:var(--blue);color:var(--blue);}
  button:disabled{opacity:.25;cursor:default;}
  button:disabled:hover{border-color:var(--line);color:var(--text);}
  #mathBtn{border-color:var(--amber);color:var(--amber);}
  #mathBtn:hover{background:var(--amber);color:#0b0d10;}
  .navgrp{display:flex;gap:10px;}
  .hint{font-family:var(--mono);font-size:10.5px;color:#565b62;display:flex;align-items:center;gap:4px;}
  kbd{font-family:var(--mono);background:#1a1e24;border:1px solid #262b32;padding:1px 6px;border-radius:3px;font-size:10.5px;color:#aab0b8;}
  #backdrop{position:fixed;inset:0;background:rgba(5,6,8,.6);opacity:0;pointer-events:none;transition:opacity .35s;z-index:19;backdrop-filter:blur(1px);}
  #backdrop.open{opacity:1;pointer-events:auto;}
  #drawer{position:fixed;top:0;right:-480px;width:460px;max-width:92vw;height:100%;background:#0d0f12;border-left:1px solid var(--line);transition:right .45s cubic-bezier(.4,0,.2,1);z-index:20;overflow-y:auto;padding:34px 30px 70px;}
  #drawer.open{right:0;}
  .drawer-eyebrow{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
  .drawer-title{font-family:var(--serif);font-size:23px;font-weight:600;margin-bottom:22px;line-height:1.3;color:#f2f0eb;}
  .drawer h4{font-family:var(--mono);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:7px;}
  .drawer h4:first-of-type{margin-top:0;}
  .drawer h4::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--amber);flex-shrink:0;}
  .drawer p{font-size:13.5px;line-height:1.75;color:#c4c9d0;margin:0 0 11px;}
  .drawer ul{margin:0 0 11px;padding-left:18px;}
  .drawer li{font-size:13.5px;line-height:1.7;color:#c4c9d0;margin-bottom:5px;}
  .eq{background:#08090b;border:1px solid var(--line-soft);border-radius:6px;padding:14px 16px;margin:12px 0;overflow-x:auto;color:#dfe3e8;}
  .eq mjx-container{color:#e4e7eb !important;}
  .tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.5px;padding:2px 7px;border-radius:3px;border:1px solid var(--line);color:var(--dim);margin:0 5px 5px 0;}
  .closeDrawer{position:absolute;top:24px;right:24px;padding:6px 10px;}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#1e2227;border-radius:4px}
  @media(max-width:760px){
    .slide h2{font-size:20px} #drawer{width:100%} header{padding:14px 18px 8px} #progressTrack{margin:0 18px}
    footer{padding:10px 18px 18px} .hint{display:none} .stage{max-height:42vh}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="eyebrow">Ensemble Learning <span style="opacity:.5">/</span> <b id="sectionCode">INTRO-00</b></div>
    <div class="eyebrow" id="counter">01 / 20</div>
  </header>
  <div id="progressTrack"><div id="progressFill"></div></div>
  <main><div id="slideHost"></div></main>
  <footer>
    <div class="navgrp">
      <button id="prevBtn">&larr; Prev</button>
      <button id="nextBtn">Next &rarr;</button>
    </div>
    <div class="hint"><kbd>&larr;</kbd><kbd>&rarr;</kbd> to navigate &nbsp;·&nbsp; <kbd>M</kbd> for math</div>
    <button id="mathBtn">&#8721; Math &amp; Why</button>
  </footer>
</div>
<div id="backdrop"></div>
<div id="drawer">
  <button class="closeDrawer" id="closeDrawerBtn">&#10005; Close</button>
  <div class="drawer-eyebrow">Math &middot; Intuition &middot; Real-world use</div>
  <div class="drawer-title" id="drawerTitle">—</div>
  <div id="drawerBody"></div>
</div>
<script>
/* ================= PALETTE ================= */
const C = {
  bg:'#0b0d10', blue:'#5b8fd6', green:'#6fae8c', amber:'#d6935b', gold:'#e0b45a',
  teal:'#4bb3a6', rose:'#c2687a', violet:'#8a7fc9', lime:'#9fc76b', dim:'#5b6068', dim2:'#3a3f46',
  text:'#e9e7e2', line:'#2a2e35', red:'#c2687a'
};

/* ================= SVG PRIMITIVES ================= */
const NS = "http://www.w3.org/2000/svg";
function E(tag, attrs={}, kids=[]){
  const el = document.createElementNS(NS, tag);
  for(const k in attrs){ if(attrs[k]!==undefined && attrs[k]!==null) el.setAttribute(k, attrs[k]); }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>{ if(c) el.appendChild(c); });
  return el;
}
function circle(cx,cy,r,fill,extra={}){ return E('circle', Object.assign({cx,cy,r,fill}, extra)); }
function rect(x,y,w,h,fill,extra={}){ return E('rect', Object.assign({x,y,width:w,height:h,fill}, extra)); }
function line(x1,y1,x2,y2,stroke,extra={}){ return E('line', Object.assign({x1,y1,x2,y2,stroke,'stroke-width':2,'stroke-linecap':'round'}, extra)); }
function path(d,extra={}){ return E('path', Object.assign({d, fill:'none', stroke:C.text, 'stroke-width':2}, extra)); }
function grp(extra={}){ return E('g', extra); }
function txt(x,y,s,extra={}){
  const t = E('text', Object.assign({x,y,fill:C.text,'font-family':'IBM Plex Mono, monospace','font-size':13,'text-anchor':'middle'}, extra));
  t.textContent = s; return t;
}
function labelText(x,y,s,extra={}){
  const t = E('text', Object.assign({x,y,fill:C.text,'font-family':'IBM Plex Sans, sans-serif','font-size':13,'text-anchor':'middle'}, extra));
  t.textContent = s; return t;
}
function arrowMarker(defs,id,color){
  const m = E('marker',{id, viewBox:'0 0 10 10', refX:8, refY:5, markerWidth:6, markerHeight:6, orient:'auto-start-reverse'});
  m.appendChild(E('path',{d:'M0,0 L10,5 L0,10 z', fill:color}));
  defs.appendChild(m);
}

/* ================= ANIMATION HELPERS (SMIL) ================= */
// fade element in from opacity 0
function fadeIn(el, begin=0, dur=0.6, to=1){
  el.setAttribute('opacity','0');
  el.appendChild(E('animate',{attributeName:'opacity', from:0, to, begin:begin+'s', dur:dur+'s', fill:'freeze'}));
  return el;
}
function fadeOut(el, begin=0, dur=0.4){
  el.appendChild(E('animate',{attributeName:'opacity', from:1, to:0, begin:begin+'s', dur:dur+'s', fill:'freeze'}));
  return el;
}
// smooth ease attribute animation (e.g. cx, cy, x, y, r, width, height)
function move(el, attrName, fromV, toV, begin=0, dur=0.8){
  el.setAttribute(attrName, fromV);
  el.appendChild(E('animate',{attributeName:attrName, values:`${fromV};${toV}`, keyTimes:'0;1',
    keySplines:'.42 0 .58 1', calcMode:'spline', begin:begin+'s', dur:dur+'s', fill:'freeze'}));
  return el;
}
// translate a group with easing
function moveT(el, from, to, begin=0, dur=0.8){
  el.setAttribute('transform', `translate(${from[0]},${from[1]})`);
  el.appendChild(E('animateTransform',{attributeName:'transform', type:'translate',
    values:`${from[0]},${from[1]};${to[0]},${to[1]}`, keyTimes:'0;1',
    keySplines:'.42 0 .58 1', calcMode:'spline', begin:begin+'s', dur:dur+'s', fill:'freeze'}));
  return el;
}
// pop-in with slight overshoot scale, combined with fade
function popIn(el, begin=0, dur=0.55){
  el.setAttribute('opacity','0');
  el.appendChild(E('animate',{attributeName:'opacity', from:0, to:1, begin:begin+'s', dur:(dur*0.5)+'s', fill:'freeze'}));
  el.appendChild(E('animateTransform',{attributeName:'transform', type:'scale',
    values:'0;1.18;1', keyTimes:'0;.65;1', begin:begin+'s', dur:dur+'s', fill:'freeze', additive:'sum'}));
  return el;
}
// draw a path/line stroke-on animation using normalized pathLength
function drawPath(el, begin=0, dur=0.7){
  el.setAttribute('pathLength','1');
  el.setAttribute('stroke-dasharray','1');
  el.setAttribute('stroke-dashoffset','1');
  el.appendChild(E('animate',{attributeName:'stroke-dashoffset', from:1, to:0, begin:begin+'s', dur:dur+'s', fill:'freeze'}));
  return el;
}
// grow a rect upward from a fixed baseline (bar-chart style)
function growUpBar(x, w, baseline, targetH, color, begin, dur=0.5, extra={}){
  const el = rect(x, baseline, w, 0, color, extra);
  el.appendChild(E('animate',{attributeName:'height', from:0, to:targetH, begin:begin+'s', dur:dur+'s', fill:'freeze'}));
  el.appendChild(E('animate',{attributeName:'y', from:baseline, to:baseline-targetH, begin:begin+'s', dur:dur+'s', fill:'freeze'}));
  return el;
}
/* faint coordinate-grid backdrop, manim-style */
function addGrid(svg, color=C.line){
  const g = grp({opacity:0.35});
  for(let x=40;x<=960;x+=80) g.appendChild(line(x,20,x,420,color,{'stroke-width':0.6}));
  for(let y=40;y<=420;y+=76) g.appendChild(line(40,y,960,y,color,{'stroke-width':0.6}));
  svg.insertBefore(g, svg.firstChild.nextSibling);
  fadeIn(g,0,1.2,0.35);
  return g;
}
/* a few slow-drifting faint particles for ambience, using SMIL animateMotion along a gentle path */
function addAmbient(svg, color, n=5){
  const g = grp({opacity:0.5});
  const paths = [
    'M60,60 C300,20 700,120 940,50',
    'M80,400 C350,440 650,360 930,410',
    'M50,220 C250,180 750,260 950,210',
    'M120,40 C200,300 800,140 880,400',
    'M900,60 C700,250 300,150 90,380',
  ];
  for(let i=0;i<n;i++){
    const dot = circle(0,0,1.6+((i*7)%3),color,{opacity:0.35});
    const mp = E('animateMotion',{dur:(22+i*6)+'s', repeatCount:'indefinite', path:paths[i%paths.length], rotate:'auto'});
    dot.appendChild(mp);
    g.appendChild(dot);
  }
  svg.appendChild(g);
  fadeIn(g,0.2,1.5,0.6);
  return g;
}
function pulse(el, begin=0, dur=1.2){
  el.appendChild(E('animateTransform',{attributeName:'transform', type:'scale', values:'1;1.12;1',
    keyTimes:'0;.5;1', begin:begin+'s', dur:dur+'s', repeatCount:'indefinite', additive:'sum'}));
  return el;
}
function spin(el, begin=0, dur=6){
  el.appendChild(E('animateTransform',{attributeName:'transform', type:'rotate', from:'0', to:'360',
    begin:begin+'s', dur:dur+'s', repeatCount:'indefinite', additive:'sum'}));
  return el;
}

/* mini decision-tree glyph, reused across many slides */
function miniTree(cx, cy, color, s=1, begin=0){
  const g = grp({transform:`translate(${cx},${cy}) scale(${s})`});
  const edges = [[0,-16,-11,0],[0,-16,11,0],[-11,0,-18,15],[-11,0,-4,15],[11,0,4,15],[11,0,18,15]];
  edges.forEach(([x1,y1,x2,y2])=> g.appendChild(line(x1,y1,x2,y2,color,{'stroke-width':1.6,opacity:.85})));
  const nodes = [[0,-16,3.4],[-11,0,2.6],[11,0,2.6],[-18,15,2.2],[-4,15,2.2],[4,15,2.2],[18,15,2.2]];
  nodes.forEach(([x,y,r])=> g.appendChild(circle(x,y,r,color)));
  if(begin) fadeIn(g,begin,0.4);
  return g;
}

/* small ballot/leaf/target icons kept intentionally simple & geometric (manim style) */

/* ================= SLIDE ENGINE ================= */
let SLIDES = []; // populated below
let idx = 0;

function buildStage(){
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 1000 440');
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  const defs = E('defs');
  ['blue','green','amber','gold','teal','rose','violet','lime','dim','text'].forEach(k=>arrowMarker(defs,'arrow-'+k, C[k]||C.text));
  svg.appendChild(defs);
  return svg;
}

function showSlide(i){
  idx = Math.max(0, Math.min(SLIDES.length-1, i));
  const s = SLIDES[idx];
  document.getElementById('sectionCode').textContent = s.code;
  document.getElementById('counter').textContent = String(idx+1).padStart(2,'0') + ' / ' + String(SLIDES.length).padStart(2,'0');
  document.getElementById('progressFill').style.width = (idx/(SLIDES.length-1)*100) + '%';
  document.documentElement.style.setProperty('--accent', s.accent || C.blue);

  const host = document.getElementById('slideHost');
  const doRender = ()=>{
    host.innerHTML = '';
    const wrap = document.createElement('div'); wrap.className = 'slide';
    wrap.style.opacity='0'; wrap.style.transform='translateY(10px)'; wrap.style.transition='opacity .35s ease, transform .35s ease';
    const h2 = document.createElement('h2'); h2.textContent = s.title; wrap.appendChild(h2);
    const sub = document.createElement('div'); sub.className = 'subtitle'; sub.textContent = s.subtitle; wrap.appendChild(sub);
    const stageDiv = document.createElement('div'); stageDiv.className = 'stage';
    const svg = buildStage();
    stageDiv.appendChild(svg); wrap.appendChild(stageDiv);
    const cap = document.createElement('div'); cap.className = 'caption'; cap.textContent = s.caption; wrap.appendChild(cap);
    host.appendChild(wrap);

    addGrid(svg);
    if(s.ambient!==false) addAmbient(svg, s.accent || C.blue, 5);
    try{ s.build(svg); }catch(err){ console.error('Slide build error on', s.code, err); }
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ wrap.style.opacity='1'; wrap.style.transform='translateY(0)'; }));
  };
  if(host.firstChild){
    host.firstChild.style.transition='opacity .18s ease, transform .18s ease';
    host.firstChild.style.opacity='0';
    host.firstChild.style.transform='translateY(-8px)';
    setTimeout(doRender, 140);
  } else { doRender(); }

  document.getElementById('drawerTitle').textContent = s.math.title;
  document.getElementById('drawerBody').innerHTML = s.math.html;
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.typesetPromise([document.getElementById('drawerBody')]).catch(()=>{});
  }
  closeDrawer();
  document.getElementById('prevBtn').disabled = idx===0;
  document.getElementById('nextBtn').disabled = idx===SLIDES.length-1;
  try{ history.replaceState(null,'','#s'+(idx+1)); }catch(e){ /* sandboxed context, ignore */ }
}

function openDrawer(){ document.getElementById('drawer').classList.add('open'); document.getElementById('backdrop').classList.add('open'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('backdrop').classList.remove('open'); }
function toggleDrawer(){ document.getElementById('drawer').classList.contains('open') ? closeDrawer() : openDrawer(); }

document.getElementById('prevBtn').addEventListener('click', ()=>showSlide(idx-1));
document.getElementById('nextBtn').addEventListener('click', ()=>showSlide(idx+1));
document.getElementById('mathBtn').addEventListener('click', toggleDrawer);
document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
document.getElementById('backdrop').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e)=>{
  const drawerOpen = document.getElementById('drawer').classList.contains('open');
  if(e.key==='Escape'){ closeDrawer(); return; }
  if(e.key==='m' || e.key==='M'){ toggleDrawer(); return; }
  if(drawerOpen) return;
  if(e.key==='ArrowRight' || e.key===' '){ showSlide(idx+1); e.preventDefault(); }
  if(e.key==='ArrowLeft'){ showSlide(idx-1); }
});

/* ================= SLIDES DATA ================= */
/*SLIDES_ARRAY_START*/
SLIDES = [
{
  code:'INTRO-00', accent:C.blue,
  title:'One Model Isn\u2019t Enough',
  subtitle:'ENSEMBLE LEARNING \u00b7 combine many imperfect models into one confident answer',
  caption:'Every branch below is a different answer to: "how should the group decide together?"',
  build(svg){
    const root = [500,42];
    const fam = [ {x:109,y:150,label:'BAGGING',color:C.green}, {x:451,y:150,label:'BOOSTING',color:C.amber}, {x:842,y:150,label:'COMBINING',color:C.violet} ];
    const leaves = [
      {x:60,label:'Random Forest',color:C.green,fam:0},
      {x:158,label:'Extra Trees',color:C.green,fam:0},
      {x:256,label:'AdaBoost',color:C.amber,fam:1},
      {x:353,label:'Gradient Boost',color:C.amber,fam:1},
      {x:451,label:'XGBoost',color:C.gold,fam:1},
      {x:549,label:'LightGBM',color:C.teal,fam:1},
      {x:647,label:'CatBoost',color:C.rose,fam:1},
      {x:744,label:'Voting',color:C.violet,fam:2},
      {x:842,label:'Stacking',color:C.violet,fam:2},
      {x:940,label:'Blending',color:C.violet,fam:2},
    ];
    const leafY = 300;
    // root -> family lines
    fam.forEach((f,i)=>{
      const p = path(`M${root[0]},${root[1]} L${f.x},${f.y}`, {stroke:f.color,'stroke-width':1.6,opacity:.7});
      svg.appendChild(drawPath(p, 0.15+i*0.08, 0.6));
    });
    // family -> leaf lines
    leaves.forEach((l,i)=>{
      const f = fam[l.fam];
      const p = path(`M${f.x},${f.y+10} L${l.x},${leafY-10}`, {stroke:l.color,'stroke-width':1.2,opacity:.45});
      svg.appendChild(drawPath(p, 0.75+i*0.06, 0.5));
    });
    // root node
    const rg = grp(); rg.appendChild(circle(0,0,9,'#0b0d10',{stroke:C.text,'stroke-width':1.8}));
    rg.appendChild(circle(0,0,3.2,C.text));
    rg.setAttribute('transform',`translate(${root[0]},${root[1]})`);
    svg.appendChild(popIn(rg,0,0.5));
    svg.appendChild(fadeIn(labelText(root[0],root[1]-18,'ENSEMBLE',{'font-family':'IBM Plex Mono','font-size':10.5,fill:C.dim,'letter-spacing':'1.5px'}),0.05,0.4));
    // family nodes
    fam.forEach((f,i)=>{
      const g = grp({transform:`translate(${f.x},${f.y})`});
      g.appendChild(circle(0,0,7,'#0b0d10',{stroke:f.color,'stroke-width':1.8}));
      g.appendChild(circle(0,0,2.6,f.color));
      svg.appendChild(popIn(g,0.5+i*0.08,0.5));
      svg.appendChild(fadeIn(labelText(f.x,f.y-16,f.label,{'font-family':'IBM Plex Mono','font-size':11,fill:f.color,'font-weight':600,'letter-spacing':'1px'}),0.55+i*0.08,0.4));
    });
    // leaves
    leaves.forEach((l,i)=>{
      const g = grp({transform:`translate(${l.x},${leafY})`});
      g.appendChild(circle(0,0,4.5,l.color));
      svg.appendChild(popIn(g,1.1+i*0.06,0.45));

  math:{ title:'Why does combining models even help?', html:`
    <h4>Intuition</h4>
    <p>A single model commits to one hypothesis about the data. It is wrong in a particular, biased way. A second model, trained differently, tends to be wrong in a <em>different</em> way. If their errors don't overlap much, averaging them cancels a chunk of the mistakes out &mdash; the way many blurry photos of the same scene, stacked and averaged, produce one sharp photo.</p>
    <h4>The three strategies you'll see</h4>
    <ul>
      <li><strong>Bagging</strong> &mdash; train models in parallel on random slices of data, then average. Mainly fights <em>variance</em>.</li>
      <li><strong>Boosting</strong> &mdash; train models in sequence, each one fixing the previous one's mistakes. Mainly fights <em>bias</em>.</li>
      <li><strong>Combining</strong> (voting / stacking / blending) &mdash; take already-good models and learn the best way to merge their opinions.</li>
    </ul>
    <h4>Worked example: three mediocre classifiers</h4>
    <p>Suppose you have 3 independent classifiers, each correct 70% of the time on its own &mdash; not great. Combine them by majority vote (at least 2 of 3 must agree). The ensemble is correct whenever all 3 agree, or exactly 2 do:</p>
    <div class="eq">$$P(\\text{majority correct}) = \\binom{3}{3}(0.7)^3 + \\binom{3}{2}(0.7)^2(0.3) = 0.343 + 0.441 = 0.784$$</div>
    <p>Three 70%-accurate models become a 78.4%-accurate committee &mdash; with zero new data and zero new modeling ideas, purely from the arithmetic of combining independent opinions. This is the Condorcet Jury Theorem, and it's the mathematical seed every method in this deck grows from.</p>
    <h4>Real-world use</h4>
    <p>Nearly every winning solution on Kaggle-style tabular competitions is an ensemble. Production systems that need robustness &mdash; credit scoring, fraud detection, search ranking, medical risk models &mdash; use ensembles because a single point of failure in one model is smoothed over by the group.</p>
  `}
},

  math:{ title:'Averaging cancels independent error', html:`
    <h4>Setup</h4>
    <p>Say each model's prediction is the truth plus some random error: $\\hat{y}_i = y + \\varepsilon_i$, where each $\\varepsilon_i$ has mean 0 and variance $\\sigma^2$, and the errors are independent of each other.</p>
    <h4>The math</h4>
    <div class="eq">$$\\text{Var}\\!\\left(\\frac{1}{n}\\sum_{i=1}^n \\hat y_i\\right) = \\frac{1}{n^2}\\sum_i \\text{Var}(\\hat y_i) = \\frac{\\sigma^2}{n}$$</div>
    <p>The average is still unbiased (its expected value is still $y$), but its variance shrinks by a factor of $n$. That's not a heuristic &mdash; it falls straight out of how variance adds for independent random variables. It's also why the Condorcet Jury Theorem says a crowd of voters, each individually more than 50% likely to be right and voting independently, becomes near-certain to be right as the crowd grows.</p>
    <h4>Step by step: where does $\\sigma^2/n$ come from?</h4>
    <p>For independent random variables, variances add: $\\text{Var}(X+Y) = \\text{Var}(X)+\\text{Var}(Y)$. Scaling a variable by a constant $c$ scales its variance by $c^2$: $\\text{Var}(cX) = c^2\\text{Var}(X)$. The average is $\\frac{1}{n}\\sum_i \\hat y_i$, a sum scaled by $c=\\frac{1}{n}$, so:</p>
    <div class="eq">$$\\text{Var}\\!\\left(\\tfrac{1}{n}\\textstyle\\sum_i \\hat y_i\\right) = \\left(\\tfrac{1}{n}\\right)^2 \\text{Var}\\!\\left(\\textstyle\\sum_i \\hat y_i\\right) = \\tfrac{1}{n^2}\\cdot n\\sigma^2 = \\tfrac{\\sigma^2}{n}$$</div>
    <p><strong>Worked numbers:</strong> if a single amateur's shot has standard deviation $\\sigma=40$ (in pixels, say), one shot has variance $1600$. Average 14 independent shots and the variance drops to $1600/14 \\approx 114$, a standard deviation of about $\\sqrt{114}\\approx 10.7$ pixels &mdash; roughly a 4&times; tighter cluster than any individual shooter, for free.</p>
    <h4>Why "independent" is the load-bearing word</h4>
    <p>If the models are correlated &mdash; they tend to make the <em>same</em> mistakes &mdash; the $1/n$ shrinkage never fully kicks in. This single sentence is the reason Random Forest randomizes features, why boosting deliberately targets each model at the previous model's residual errors, and why stacking mixes structurally different model types. Every ensemble trick you'll see in this deck is really just an engineered way to keep the errors of the sub-models as uncorrelated as possible.</p>
    <h4>Real-world use</h4>
    <p>Weather forecasting ensembles (running the same physics model from slightly different starting conditions), medical second-opinions, and jury trials all lean on exactly this effect.</p>
  `}
},

  math:{ title:'Decomposing the error: bias\u00b2 + variance + noise', html:`
    <h4>The decomposition</h4>
    <p>For squared error, the expected error of a model at a point can be split into three additive pieces:</p>
    <div class="eq">$$\\mathbb{E}[(y-\\hat f(x))^2] = \\underbrace{(\\text{Bias}[\\hat f(x)])^2}_{\\text{systematic error}} + \\underbrace{\\text{Var}[\\hat f(x)]}_{\\text{sensitivity to training data}} + \\underbrace{\\sigma^2}_{\\text{irreducible noise}}$$</div>
    <p>Bias is how far off the model's average prediction is from the truth, if you retrained it on infinitely many different training sets. Variance is how much that prediction jumps around across those retrainings. $\\sigma^2$ is noise no model can ever remove.</p>
    <h4>The derivation, one step at a time</h4>
    <p>Let $\\bar f(x) = \\mathbb{E}[\\hat f(x)]$ be the average prediction across all possible training sets, and $y = \\bar y + \\varepsilon$ where $\\varepsilon$ is irreducible noise with mean 0. Add and subtract $\\bar f(x)$ inside the square, then expand:</p>
    <div class="eq">$$\\mathbb{E}[(y-\\hat f)^2] = \\mathbb{E}[((y-\\bar f) + (\\bar f - \\hat f))^2] = \\mathbb{E}[(y-\\bar f)^2] + \\mathbb{E}[(\\bar f-\\hat f)^2] + 2\\,\\mathbb{E}[(y-\\bar f)(\\bar f-\\hat f)]$$</div>
    <p>The cross term vanishes because $\\hat f$ doesn't depend on the noise $\\varepsilon$ in a new test point $y$, so it averages to 0. What's left: $\\mathbb{E}[(y-\\bar f)^2] = \\text{Bias}^2 + \\sigma^2$ (truth vs. average prediction) plus $\\mathbb{E}[(\\bar f - \\hat f)^2] = \\text{Var}[\\hat f]$ (how much any one trained model wobbles around that average). That's the whole proof &mdash; just a squared-sum expansion.</p>
    <h4>Worked numbers</h4>
    <p>Say a deep tree has near-zero bias but variance $9$ across resamples, and noise $\\sigma^2=1$: total error $\\approx 0+9+1=10$. Bagging 25 such (roughly independent) trees divides the variance by about 25: $9/25=0.36$, giving total error $\\approx 0+0.36+1=1.36$ &mdash; a drop from 10 to 1.36 without touching bias at all, purely by averaging.</p>
    <h4>Why it matters for choosing an ensemble</h4>
    <ul>
      <li>Deep, unpruned decision trees: <strong>low bias, high variance</strong> (they memorize training data). &rarr; <strong>Bagging / Random Forest</strong> averages away the variance.</li>
      <li>Shallow trees / linear stumps: <strong>high bias, low variance</strong> (too simple to fit the pattern). &rarr; <strong>Boosting</strong> chains them to progressively remove the bias.</li>
    </ul>
    <h4>Real-world use</h4>
    <p>This is the first diagnostic question in applied ML: is my model underfitting (bias) or overfitting (variance)? The answer decides whether you reach for more/deeper trees with boosting, or for bagging and regularization.</p>
  `}
},

  math:{ title:'Two ways to reduce ensemble error', html:`
    <h4>Bagging (Bootstrap AGGregatING)</h4>
    <p>Fit $B$ models independently on random resamples of the data, then average:</p>
    <div class="eq">$$\\hat f_{\\text{bag}}(x) = \\frac{1}{B}\\sum_{b=1}^{B} \\hat f_b(x)$$</div>
    <p>Because the trees don't talk to each other, this only helps if they're at least somewhat different from one another (see the correlation math on the Bagging slide). It targets <strong>variance</strong>.</p>
    <h4>Boosting</h4>
    <p>Fit models sequentially, where each new model is trained to reduce the error left behind by the sum-so-far:</p>
    <div class="eq">$$F_m(x) = F_{m-1}(x) + \\nu \\cdot h_m(x), \\qquad h_m \\approx \\arg\\min_h \\sum_i L\\big(y_i, F_{m-1}(x_i)+h(x_i)\\big)$$</div>
    <p>Each $h_m$ is deliberately aimed at whatever the ensemble still gets wrong. It targets <strong>bias</strong>, at the cost of being more sequential (slower to train) and more prone to overfitting if you run it too long.</p>
    <h4>A cleaner way to see the difference</h4>
    <p>Write total error as $\\text{Bias}^2 + \\text{Variance} + \\text{Noise}$ (from the previous slide). Bagging averages $B$ roughly-independent, low-bias models, so it multiplies the variance term by about $\\frac{1}{B}$ while leaving bias essentially unchanged. Boosting instead builds a sequence whose combined bias shrinks toward 0 as $M\\to\\infty$ (each step provably reduces training loss for a correctly-chosen $h_m$), while its variance can slowly creep up the longer you run it &mdash; which is exactly why boosting needs early stopping and bagging mostly doesn't.</p>
    <h4>Compute cost, concretely</h4>
    <p>If one tree costs time $T$ to train: bagging's $B$ trees can run in parallel, so wall-clock time is about $T$ (with enough machines) even though total compute is $B\\cdot T$. Boosting's $M$ trees must run one after another because tree $m$ needs $F_{m-1}$'s residuals first, so wall-clock time is $M\\cdot T$ no matter how many machines you have. This is a real, structural reason bagging-based methods scale out more easily.</p>
    <h4>Real-world use</h4>
    <p>Bagging (Random Forest) is the default "just works, hard to break" choice for tabular data with many noisy features. Boosting (XGBoost/LightGBM/CatBoost) is the default when you need the very best accuracy and can tune carefully \u2014 it dominates tabular ML leaderboards.</p>
  `}
},

  math:{ title:'Why sampling-with-replacement, specifically?', html:`
    <h4>The mechanism</h4>
    <p>To build one bootstrap sample of size $n$, draw $n$ points <em>with replacement</em> from the original $n$-point dataset. Some points appear multiple times; others are never drawn.</p>
    <h4>Why 36.8% get left out</h4>
    <p>The probability any single point is <em>not</em> chosen in one draw is $\\frac{n-1}{n}$. Across $n$ independent draws:</p>
    <div class="eq">$$P(\\text{point excluded}) = \\left(\\frac{n-1}{n}\\right)^{n} \\xrightarrow[n \\to \\infty]{} e^{-1} \\approx 0.368$$</div>
    <p>So each bootstrap sample contains roughly $63.2\\%$ of the unique original points (some duplicated) and leaves about $36.8\\%$ out entirely. This isn't a designed parameter \u2014 it's a direct consequence of sampling with replacement, and it falls out of the definition of $e$ as $\\lim (1-1/n)^n$.</p>
    <h4>Worked numbers for the slide above (n = 10)</h4>
    <p>With only $n=10$ points, $\\left(\\frac{9}{10}\\right)^{10} \\approx 0.349$ &mdash; close to the asymptotic $0.368$ even at this small size, which is why the slide above shows 3 of 10 points left out (30%), right in the expected ballpark. As $n$ grows the fraction converges tightly to $36.8\\%$ regardless of how large your dataset is &mdash; it's a property of the sampling scheme, not of $n$ itself.</p>
    <h4>What the leftovers buy you: Out-of-Bag (OOB) validation</h4>
    <p>Since each tree never saw its ~36.8% leftover points during training, you can use those points as a free, built-in validation set for that tree \u2014 no separate holdout split needed. Average this across all trees and you get the <strong>OOB error</strong>, a nearly-free estimate of test error.</p>
    <h4>Real-world use</h4>
    <p>OOB error is why Random Forests are popular for fast iteration: you get a trustworthy validation score without spending data on a held-out set, which matters a lot when data is expensive or scarce.</p>
  `}
},

  math:{ title:'How much does averaging actually reduce variance?', html:`
    <h4>If trees were independent</h4>
    <div class="eq">$$\\text{Var}\\!\\left(\\frac{1}{B}\\sum_{b=1}^B \\hat f_b(x)\\right) = \\frac{\\sigma^2}{B}$$</div>
    <p>Variance would shrink linearly with the number of trees $B$. In practice trees trained on overlapping bootstrap samples of the <em>same</em> dataset are correlated with each other (correlation $\\rho$), which changes the formula to:</p>
    <div class="eq">$$\\text{Var}\\!\\left(\\frac{1}{B}\\sum_b \\hat f_b(x)\\right) = \\rho\\,\\sigma^2 + \\frac{1-\\rho}{B}\\,\\sigma^2$$</div>
    <p>As $B \\to \\infty$ the second term vanishes, but the first term, $\\rho\\sigma^2$, is a floor you can never average away. This single formula is the entire justification for Random Forest's extra trick (randomly restricting features per split) on the next slide: it exists purely to push $\\rho$ down.</p>
    <h4>Where the $\\rho\\sigma^2$ formula comes from</h4>
    <p>For $B$ identically-distributed variables each with variance $\\sigma^2$ and pairwise correlation $\\rho$, expand the variance of their sum using $\\text{Cov}(X_i,X_j)=\\rho\\sigma^2$ for $i\\neq j$:</p>
    <div class="eq">$$\\text{Var}\\!\\left(\\tfrac{1}{B}\\textstyle\\sum_b \\hat f_b\\right) = \\tfrac{1}{B^2}\\Big[\\underbrace{B\\sigma^2}_{\\text{B variance terms}} + \\underbrace{B(B-1)\\rho\\sigma^2}_{\\text{B(B-1) covariance terms}}\\Big] = \\tfrac{\\sigma^2}{B} + \\tfrac{B-1}{B}\\rho\\sigma^2 \\xrightarrow[B\\to\\infty]{} \\rho\\sigma^2$$</div>
    <h4>Worked numbers</h4>
    <p>Take $\\sigma^2=9$ (each tree's variance) and compare two correlation levels as $B$ grows:</p>
    <div class="eq">$$\\rho=0.5:\\;\\; B{=}1{:}\\,9.0 \\to B{=}10{:}\\,5.31 \\to B{=}\\infty{:}\\,4.5 \\qquad\\quad \\rho=0.1:\\;\\; B{=}1{:}\\,9.0 \\to B{=}10{:}\\,1.71 \\to B{=}\\infty{:}\\,0.9$$</div>
    <p>Same number of trees, same per-tree variance &mdash; but dropping $\\rho$ from 0.5 to 0.1 drops the achievable variance floor by 5&times;. More trees alone can't fix a high-correlation forest; only decorrelating the trees can.</p>
    <h4>Why bias barely changes</h4>
    <p>Averaging doesn't change the expected prediction much (if each tree is roughly unbiased, the average is too) \u2014 that's why bagging is described as a variance-reduction technique, not a bias-reduction one.</p>
    <h4>Real-world use</h4>
    <p>This is why Random Forest works well "out of the box" with almost no tuning: individual deep trees are low-bias/high-variance, and averaging removes the exact weakness deep trees have, with very little downside.</p>
  `}
},

  math:{ title:'Feature subsampling: engineering down \u03c1', html:`
    <h4>Recall the correlation floor</h4>
    <div class="eq">$$\\text{Var}(\\bar f\\,) = \\rho\\sigma^2 + \\frac{1-\\rho}{B}\\sigma^2$$</div>
    <p>Bootstrap sampling alone gives moderately different training sets, but if one feature is overwhelmingly predictive, nearly every tree will still split on it first &mdash; keeping $\\rho$ high. Random Forest's fix: at <em>every single split</em>, only let the tree choose from a random subset of $m$ features (commonly $m=\\sqrt{p}$ for classification, $m=p/3$ for regression, where $p$ is total features).</p>
    <h4>Choosing m, worked</h4>
    <p>With $p=100$ features, classification's default $m=\\sqrt{p}=10$ means each split only gets to consider 10 of 100 features &mdash; a 10% peek. The probability the single most dominant feature is even available at a given split is just $m/p=10\\%$, so roughly 90% of splits across the forest are forced to find their signal elsewhere. That's the mechanism, expressed as a single probability.</p>
    <h4>Why this specifically lowers \u03c1</h4>
    <p>When the dominant feature isn't even available at a given split, the tree is forced to use the next-best feature instead. Different trees get forced down different paths, so their errors decorrelate &mdash; directly shrinking the $\\rho\\sigma^2$ floor that bagging alone can't touch.</p>
    <h4>The bias/variance cost</h4>
    <p>Restricting features makes each individual tree slightly worse (higher bias, since it sometimes can't use the best available split). Random Forest is a deliberate trade: sacrifice a little bit of per-tree quality for a large gain in ensemble decorrelation. In practice the net effect is almost always a big win.</p>
    <h4>Real-world use</h4>
    <p>This is the single design choice that separates "Random Forest" from plain "Bagged Trees," and it's why Random Forest tends to outperform bagging alone whenever there are a handful of dominant features and many weaker, correlated ones \u2014 extremely common in tabular business data (many engineered features derived from the same few raw signals).</p>
  `}
},

  math:{ title:'OOB error and Gini/permutation importance', html:`
    <h4>OOB error, precisely</h4>
    <p>For each training point $x_i$, only the trees that did <em>not</em> have $x_i$ in their bootstrap sample get to vote on it. Averaging those out-of-bag votes across all points gives:</p>
    <div class="eq">$$\\text{OOB error} = \\frac{1}{n}\\sum_{i=1}^n L\\Big(y_i,\\; \\text{aggregate of } \\{\\hat f_b(x_i) : x_i \\notin \\text{sample}_b\\}\\Big)$$</div>
    <p>As proven by the bootstrap math on the previous slide, roughly 36.8% of trees are eligible "judges" for any given point, which is enough trees to get a low-variance error estimate without touching a separate test set.</p>
    <h4>What "impurity" actually measures</h4>
    <p>For classification, the Gini impurity of a node with class proportions $p_1,\\ldots,p_K$ is $G = 1-\\sum_k p_k^2$ &mdash; it's 0 for a perfectly pure node (all one class) and maximal when classes are evenly mixed. A split's $\\Delta\\text{impurity}$ is the parent's $G$ minus the (sample-weighted) average $G$ of its children: a good split makes the children much purer than the parent, so this difference is large.</p>
    <h4>Feature importance (two common flavors)</h4>
    <p><strong>Mean Decrease in Impurity (Gini importance):</strong> sum up how much each feature reduces impurity (Gini/entropy/variance) every time it's used for a split, averaged across all trees. Fast, but biased toward high-cardinality features.</p>
    <div class="eq">$$\\text{Importance}(f) = \\frac{1}{B}\\sum_{b=1}^B \\sum_{\\text{splits on } f \\text{ in tree } b} \\Delta\\text{impurity}$$</div>
    <p><strong>Permutation importance:</strong> shuffle one feature's column, re-measure OOB error, and see how much worse it gets. If shuffling barely changes anything, the model wasn't really relying on that feature. Slower, but far less biased.</p>
    <h4>Real-world use</h4>
    <p>Feature importance is often the actual deliverable in applied settings &mdash; a bank doesn't just want a credit-risk score, it wants to know which factors drove it, both for regulatory explainability and to decide which data is worth collecting more of.</p>
  `}
},

  math:{ title:'Tuning Random Forest without guesswork', html:`
    <h4>n_estimators</h4>
    <p>More trees can only help the averaging math from the Bagging slides &mdash; variance keeps shrinking toward the $\\rho\\sigma^2$ floor as $B$ grows, and it never overfits by adding more trees (unlike boosting). The only cost is compute. Use the OOB error curve to find where it plateaus, then stop &mdash; more trees past that point burn time for no accuracy gain.</p>
    <h4>max_depth &amp; min_samples_leaf</h4>
    <p>These control each individual tree's position on the bias-variance curve before averaging even happens. Deeper trees / smaller leaves &rarr; lower bias, higher variance per tree (bagging then cleans up the variance). Shallower trees / larger leaves &rarr; higher bias that bagging <em>cannot</em> fix, since averaging unbiased-but-noisy estimators stays unbiased, but averaging biased estimators stays biased.</p>
    <h4>Worked example</h4>
    <p>If every leaf must contain at least 50 samples on a 100,000-row dataset, the deepest any tree can possibly get is $\\log_2(100{,}000/50) \\approx 11$ levels &mdash; min_samples_leaf indirectly caps depth too. Doubling it to 100 shaves roughly one more level off every tree, a cheap way to fight overfitting on noisy data without tuning depth directly.</p>
    <h4>Real-world use</h4>
    <p>A practical default that works surprisingly often: leave max_depth unbounded, set min_samples_leaf to 1\u20135 (classification) or a few dozen (regression on noisy targets), and just add trees until OOB error stops moving. Grid-searching max_depth rarely beats this simple recipe for Random Forest specifically (unlike boosting, where depth tuning matters far more).</p>
  `}
},

  math:{ title:'Split invariance, formally', html:`
    <h4>The claim</h4>
    <p>For any strictly monotonic function $\\phi$ (e.g. $\\phi(x)=cx$ for scaling, or $\\phi(x)=\\log x$), a decision tree trained on $\\phi(x)$ produces exactly the same splits, exactly the same structure, and exactly the same predictions as one trained on $x$.</p>
    <h4>Why</h4>
    <p>A split only ever asks $x \\le t$ vs. $x > t$. If $\\phi$ is strictly increasing, then $x \\le t \\iff \\phi(x) \\le \\phi(t)$ &mdash; the same set of points falls on each side, just with the threshold relabeled from $t$ to $\\phi(t)$. The impurity reduction computed at that split is therefore identical, so the tree-growing algorithm (which greedily picks the split with the best impurity reduction) makes identical choices at every node regardless of $\\phi$.</p>
    <h4>Where this stops being true</h4>
    <p>This invariance is per-feature and only for <em>strictly monotonic, order-preserving</em> transforms. It does <strong>not</strong> hold for: interactions engineered from two features (e.g. $x_1/x_2$ creates genuinely new information trees couldn't see before), non-monotonic transforms, or transforms that change relative distances used by <em>distance-based</em> methods elsewhere in your pipeline.</p>
    <h4>Real-world use</h4>
    <p>This is a real practical time-saver: you can skip an entire preprocessing step (standardization pipelines, scalers to fit/save/version) for any tree-based model. It also means outlier <em>magnitude</em> doesn't break trees the way it breaks linear models &mdash; a value of $10^9$ instead of $100$ still just falls on one side of a threshold.</p>
  `}
},

    // RIGHT: instant random pick (imperfect) at x=100 local -> baseX+100

    svg.appendChild(fadeIn(labelText(590+150,330,'faster per split, noisier boundary \u2014 but more diverse trees',{'font-size':10.5,fill:C.dim,'font-family':'IBM Plex Mono'}),2.3,0.4));

  math:{ title:'Trading per-tree accuracy for ensemble diversity', html:`
    <h4>What actually changes</h4>
    <p>Random Forest, at each split, picks a random subset of $m$ features, then finds the mathematically <em>optimal</em> threshold on each (the one minimizing Gini impurity or variance). Extra Trees also picks a random feature subset, but then draws the threshold itself <em>uniformly at random</em> within that feature's range, and simply keeps the best of those random cuts.</p>
    <div class="eq">$$\\text{RF: } t^\\* = \\arg\\min_t \\; \\text{Impurity}(t) \\qquad\\qquad \\text{ET: } t \\sim \\text{Uniform}(\\min(f), \\max(f))$$</div>
    <h4>Why this can still work well</h4>
    <p>A single Extra Tree is a worse model than a single Random Forest tree (higher bias, since it isn't finding the best cut). But it is also far less correlated with its sibling trees, because two different random cuts rarely land in the same place. Referring back to $\\text{Var} = \\rho\\sigma^2 + \\frac{1-\\rho}{B}\\sigma^2$: Extra Trees trades a higher $\\sigma^2$ per tree for a lower $\\rho$ between trees, and often comes out ahead overall.</p>
    <h4>The speed bonus, quantified</h4>
    <p>Finding the optimal threshold on a feature with $n$ samples costs $O(n\\log n)$ (sort, then scan for the best cut). Drawing one random threshold costs $O(1)$. Across a whole tree with $O(\\log n)$ depth and $p$ candidate features per split, Random Forest's split-finding costs roughly $O(m \\cdot n\\log n)$ while Extra Trees costs roughly $O(m \\cdot n)$ per split &mdash; skipping the sort is what removes the most expensive part of building a tree, making Extra Trees noticeably faster to train than Random Forest at similar tree counts, especially as $n$ grows.</p>
    <h4>Real-world use</h4>
    <p>Extra Trees is a strong choice when you have a lot of noisy features and need fast training/inference, e.g. large-scale feature-rich pipelines where Random Forest's split search becomes a bottleneck.</p>
  `}
},

    const scat=[[-50,-30],[-30,-50],[20,40],[45,20],[-10,-15],[15,-35],[35,45],[-40,15]];
    scat.forEach((p,i)=> svg.appendChild(popIn(circle(rc[0]+p[0],rc[1]+p[1],4,C.blue),1.3+i*0.06,0.3)));

    svg.appendChild(fadeIn(labelText(750,318,'\u2014 lets a "straight" split capture a diagonal pattern',{'font-size':9.5,fill:C.dim,'font-family':'IBM Plex Mono'}),2.7,0.4));

  math:{ title:'Diversifying the coordinate system', html:`
    <h4>Random Subspace Method</h4>
    <p>Instead of Random Forest's per-split feature resampling, pick one random subset of $m$ features <em>once</em>, before growing the tree, and use only those features for every split in that tree. Each tree effectively lives in a different, lower-dimensional projection of the data:</p>
    <div class="eq">$$\\text{Tree}_b \\text{ trained on } X_{:,S_b}, \\qquad S_b \\subset \\{1,\\ldots,p\\}, \\; |S_b|=m$$</div>
    <p>This is a coarser-grained diversity mechanism than Random Forest's per-split resampling &mdash; useful especially in very high-dimensional, low-sample settings (e.g. gene expression data) where per-split resampling barely changes anything but a fixed subspace forces genuinely different trees.</p>
    <h4>Rotation Forest</h4>
    <p>Split the features into random groups, run PCA (or another rotation) on each group, and train the tree on the rotated (PCA) features instead of the originals. A tree can only make axis-aligned splits in whatever coordinate system it's given &mdash; but an axis-aligned split in <em>rotated</em> coordinates is a diagonal split in the <em>original</em> coordinates. This lets each tree capture correlational structure a plain axis-aligned tree structurally cannot.</p>
    <h4>Why this matters</h4>
    <p>Both methods attack the same $\\rho\\sigma^2$ correlation floor as Random Forest, but from the "change the whole coordinate system" angle rather than "hide a few features per split." They tend to help most when features are highly correlated with each other (rotation can decorrelate them) or when dimensionality is very high relative to sample size.</p>
    <h4>Real-world use</h4>
    <p>Rotation Forest has shown particularly strong results on signal/image-derived tabular features (where nearby features are naturally correlated, e.g. sensor arrays or pixel-derived statistics) \u2014 exactly the setting where PCA rotation captures real structure.</p>
  `}
},
{
  code:'THEORY-02', accent:C.lime,
  title:'How Much Diversity Is Too Much?',
  subtitle:'the best ensemble balances how good each model is against how different they are',
  caption:'Perfectly identical accurate models add nothing. Perfectly diverse useless models add nothing either. The prize is in between.',

    function trueY(x){ return 34 - 16*Math.sin(Math.PI*(x)/110); }

        svg.appendChild(drawPath(path(d,{stroke:color,'stroke-width':1.2,opacity:.55}),0.5+i*0.15,0.5));
      });
      const avgNoise = tSamp.map((_,i)=> noiseSets.reduce((s,n)=>s+n[i],0)/noiseSets.length);
      const avgPath = tSamp.map((t,i)=>`${i===0?'M':'L'}${x0+t*(w/110)},${y0+(trueY(t)*(accurate?1:0.15)+avgNoise[i])*(h/68)}`).join(' ');

    panel(60,'IDENTICAL (no diversity)',C.rose,[[2,1,-1,1,0,2],[1,2,0,1,-1,1],[2,1,-1,2,0,1],[1,1,0,2,-1,2]],true,'accurate, but average = just one of them');
    panel(410,'RANDOM (no accuracy)',C.dim,[[20,-25,15,-30,22,-18],[-22,28,-16,20,-25,15],[18,-20,25,-15,20,-22],[-25,15,-20,25,-18,20]],false,'diverse, but average is still garbage');
    panel(760,'BALANCED (sweet spot)',C.green,[[6,-4,5,-6,4,-3],[-5,6,-3,4,-6,5],[4,5,-6,-4,6,-5],[-6,-5,4,6,-4,4]],true,'good AND different \u2014 average nails it');
    svg.appendChild(fadeIn(labelText(500,300,'ensemble gain \u2248 individual skill \u00d7 how uncorrelated their errors are',{'font-size':11.5,fill:C.text,'font-family':'IBM Plex Mono'}),3.2,0.5));
    svg.appendChild(fadeIn(labelText(500,335,'this is why every method in this deck fights for diversity, never diversity alone',{'font-size':10,fill:C.dim,'font-family':'IBM Plex Mono'}),3.6,0.5));
  },
  math:{ title:'Quantifying ensemble diversity', html:`
    <h4>A simple diversity measure: pairwise disagreement</h4>
    <div class="eq">$$\\text{Disagreement}(i,j) = \\frac{1}{n}\\sum_{k=1}^n \\mathbb{1}[h_i(x_k) \\neq h_j(x_k)]$$</div>
    <p>The fraction of points two models classify differently. Average this over all pairs to get an ensemble-wide diversity score. A disagreement of 0 means the models are redundant (identical predictions); a disagreement near 0.5 (for binary classification) means they're barely more related than coin flips.</p>
    <h4>The ambiguity decomposition</h4>
    <p>For regression with squared error, there's an exact identity (Krogh &amp; Vedelsby, 1995) splitting ensemble error into individual model quality and disagreement:</p>
    <div class="eq">$$E_{\\text{ensemble}} = \\overline{E}_{\\text{individual}} - \\overline{A}_{\\text{ambiguity}}, \\qquad \\overline{A} = \\frac{1}{B}\\sum_b (\\hat f_b(x) - \\bar f(x))^2$$</div>
    <p>This is a genuine free lunch: for a <em>fixed</em> average individual error, more ambiguity (disagreement) between models can only ever <em>lower</em> ensemble error, never raise it. The catch, visible on the panels above, is that increasing diversity by making individual models worse trades away more on the $\\overline{E}$ side than it gains on the $\\overline{A}$ side &mdash; there's no shortcut around needing genuinely skilled models.</p>
    <h4>Real-world use</h4>
    <p>This is the practical argument for stacking (mix genuinely different algorithm families: trees + linear + neural net) over, say, training 50 nearly-identical XGBoost models with slightly different seeds &mdash; the latter buys you almost no ambiguity, and therefore almost no extra accuracy, for a lot of extra compute.</p>
  `}
},

  math:{ title:'Anomaly score from random partitioning', html:`
    <h4>The core idea</h4>
    <p>Build many trees, each splitting on a random feature at a random threshold (no impurity search, similar in spirit to Extra Trees) until every point is alone in its own leaf. Record the depth (path length) $h(x)$ at which each point becomes isolated.</p>
    <h4>Why outliers isolate faster</h4>
    <p>A random split has to happen to fall between an outlier and the rest of the data for it to be separated &mdash; and because the outlier is far from everything else, almost <em>any</em> randomly chosen threshold in its feature's range accomplishes this. A point buried inside a dense cluster needs a long, specific sequence of splits to peel away all its neighbors first.</p>
    <h4>The anomaly score formula</h4>
    <div class="eq">$$s(x,n) = 2^{-\\frac{E[h(x)]}{c(n)}}, \\qquad c(n) = 2H(n-1) - \\frac{2(n-1)}{n}$$</div>
    <p>$E[h(x)]$ is the average isolation depth across all trees in the forest; $c(n)$ is the expected path length for a normal point under random splitting (a known result from the analysis of unsuccessful binary search trees, where $H(\\cdot)$ is the harmonic number). Score close to 1 &rarr; likely an anomaly (isolated fast, $E[h(x)]$ much less than $c(n)$). Score close to 0.5 &rarr; likely normal.</p>
    <h4>Real-world use</h4>
    <p>Isolation Forest is a standard first choice for fraud detection, network intrusion detection, and sensor fault detection &mdash; it needs no labeled anomalies to train (unlike a classifier), scales to high dimensions better than distance-based methods like k-NN, and inherits the same "just add more trees" simplicity as the rest of the bagging family.</p>
  `}
},

  math:{ title:'The AdaBoost weight update, derived', html:`
    <h4>Setup</h4>
    <p>Every point starts with equal weight $w_i = 1/n$. After training weak learner $h_t$, compute its weighted error rate:</p>
    <div class="eq">$$\\varepsilon_t = \\sum_{i:\\,h_t(x_i)\\neq y_i} w_i$$</div>
    <h4>The learner's voice, $\\alpha_t$</h4>
    <div class="eq">$$\\alpha_t = \\frac{1}{2}\\ln\\!\\left(\\frac{1-\\varepsilon_t}{\\varepsilon_t}\\right)$$</div>
    <p>Why this exact formula, and not something simpler like $1-\\varepsilon_t$? It falls out of minimizing exponential loss exactly, and it has the right shape: $\\varepsilon_t=0.5$ (no better than a coin flip) gives $\\alpha_t=0$ (ignore this learner entirely); $\\varepsilon_t \\to 0$ gives $\\alpha_t \\to \\infty$ (trust it completely); $\\varepsilon_t>0.5$ gives negative $\\alpha_t$ (flip its answer \u2014 it's anti-correlated with the truth, which is still useful information).</p>
    <h4>Where $\\alpha_t$ comes from, in one line</h4>
    <p>AdaBoost turns out to be exactly coordinate descent on the exponential loss $\\sum_i e^{-y_i H(x_i)}$. Fixing $h_t$ and solving $\\frac{\\partial}{\\partial \\alpha}\\sum_i w_i\\, e^{-\\alpha y_i h_t(x_i)} = 0$ for $\\alpha$ gives precisely $\\alpha_t = \\frac12\\ln\\frac{1-\\varepsilon_t}{\\varepsilon_t}$ &mdash; the weight update on the next line is just what falls out of the same minimization for updating $w_i$.</p>
    <h4>Worked numbers</h4>
    <p>Round 1 above misclassifies 3 of 11 points with equal starting weight $\\frac{1}{11}$ each, so $\\varepsilon_1 = \\frac{3}{11}\\approx0.273$, giving $\\alpha_1 = \\frac12\\ln\\frac{0.727}{0.273} \\approx \\frac12\\ln(2.66)\\approx 0.49$. A misclassified point's weight is then multiplied by $e^{0.49}\\approx1.63$ &mdash; about 63% heavier going into round 2, exactly the "growing dots" you saw animate.</p>
    <h4>Reweighting the data</h4>
    <div class="eq">$$w_i \\leftarrow w_i \\cdot e^{-\\alpha_t y_i h_t(x_i)}, \\quad \\text{then renormalize so } \\textstyle\\sum_i w_i = 1$$</div>
    <p>When $h_t$ gets $x_i$ right, $y_i h_t(x_i)=1$ and the weight shrinks by $e^{-\\alpha_t}$. When it's wrong, $y_i h_t(x_i)=-1$ and the weight grows by $e^{\\alpha_t}$. The next weak learner is trained on this reweighted data, so it's mathematically incentivized to focus on the points that are still being missed.</p>
    <h4>Final prediction</h4>
    <div class="eq">$$H(x) = \\text{sign}\\left(\\sum_{t=1}^T \\alpha_t\\, h_t(x)\\right)$$</div>
    <h4>Real-world use</h4>
    <p>AdaBoost was the first practical boosting algorithm and is still used where interpretability and speed matter more than squeezing out the last bit of accuracy \u2014 e.g. the classic Viola-Jones real-time face detector was built on cascaded AdaBoost classifiers.</p>
  `}
},

  math:{ title:'PAC learning and the boosting guarantee', html:`
    <h4>The question, precisely</h4>
    <p>In the PAC (Probably Approximately Correct) learning framework, a "strong learner" can be trained to arbitrarily high accuracy given enough data. A "weak learner" only guarantees accuracy slightly better than random guessing: $\\text{error} \\le \\tfrac12 - \\gamma$ for some fixed $\\gamma>0$. Kearns and Valiant's 1988 open question: is every weakly learnable problem also strongly learnable?</p>
    <h4>Schapire's answer and the bound</h4>
    <p>Yes &mdash; and AdaBoost is a constructive proof. If every weak learner in the sequence has edge $\\gamma$ over random guessing, the combined ensemble's <em>training</em> error after $T$ rounds is bounded by:</p>
    <div class="eq">$$\\text{error}_T \\;\\le\\; \\prod_{t=1}^T 2\\sqrt{\\varepsilon_t(1-\\varepsilon_t)} \\;\\le\\; e^{-2\\gamma^2 T}$$</div>
    <p>The bound decays <em>exponentially</em> in $T$, regardless of how small $\\gamma$ is &mdash; you just need proportionally more rounds. This was a genuinely surprising result in 1990: it means there's no such thing as "too weak to be useful," only "need more rounds."</p>
    <h4>Worked numbers</h4>
    <p>With $\\gamma=0.05$ (a learner that's right only 55% of the time), the bound needs $T \\approx \\ln(0.01)/(-2\\times0.05^2) \\approx 921$ rounds to guarantee training error under 1%. With $\\gamma=0.2$ (65% accurate), the same target takes only $T\\approx 58$ rounds. Weaker learners are usable, just proportionally slower to converge \u2014 exactly what the chart above shows for $\\gamma=0.2$.</p>
    <h4>Why this matters beyond AdaBoost</h4>
    <p>This theorem is specifically about <em>training</em> error, not test error &mdash; a separate (and more subtle) line of theory (related to the margin of the ensemble's votes) explains why boosting often keeps improving test accuracy even after training error hits zero. It's also the reason boosting was invented before gradient boosting existed: the exponential-loss / weak-learnability framing came first, and gradient boosting later reframed it as functional gradient descent (as seen two slides from now).</p>
    <h4>Real-world use</h4>
    <p>This theorem is the reason "just use a slightly-better-than-random weak learner" is a legitimate design philosophy rather than a hack &mdash; it's why decision stumps (a single split) are a perfectly respectable base learner for AdaBoost, not a corner cut for speed.</p>
  `}
},

  math:{ title:'Gradient boosting as gradient descent in function space', html:`
    <h4>The key insight</h4>
    <p>Ordinary gradient descent updates a parameter vector: $\\theta \\leftarrow \\theta - \\eta \\nabla_\\theta L$. Gradient boosting does the same thing, but the "parameter" being updated is the entire prediction <em>function</em> $F$, and the "gradient step" is implemented by training a new tree to approximate the negative gradient of the loss with respect to the current predictions.</p>
    <h4>Why the negative gradient equals the residual (for squared error)</h4>
    <div class="eq">$$L(y,F(x)) = \\tfrac{1}{2}(y-F(x))^2 \\quad\\Rightarrow\\quad -\\frac{\\partial L}{\\partial F(x)} = y - F(x)$$</div>
    <p>That's exactly the residual. So "fit a tree to the residuals" isn't an ad-hoc trick &mdash; for squared error it <em>is</em> gradient descent, taking a step in function space in the direction that most reduces loss. For other losses (e.g. log-loss for classification), you fit the tree to that loss's own negative gradient, which is why the same framework generalizes to classification, ranking, and more.</p>
    <h4>Worked example: log-loss for classification</h4>
    <p>For binary classification with log-loss $L=\\ln(1+e^{-2yF})$ (using $y\\in\\{-1,1\\}$), the negative gradient works out to $\\frac{2y}{1+e^{2yF}}$ &mdash; a "soft residual" that's largest for points the model is currently most confidently wrong about. If a point has $y=1$ and the model currently outputs $F=0$ (totally unsure), the pseudo-residual is $\\frac{2}{1+1}=1$, a strong pull. If the model already outputs $F=3$ (confidently and correctly positive), the pseudo-residual shrinks to nearly 0 &mdash; the model stops spending effort on points it has already nailed. This is exactly the same "focus on what's still wrong" behavior as AdaBoost, arrived at from a completely different derivation.</p>
    <h4>The general algorithm</h4>
    <div class="eq">$$F_m(x) = F_{m-1}(x) + \\nu \\cdot h_m(x), \\qquad h_m \\text{ fit to } -\\left.\\frac{\\partial L(y_i,F(x_i))}{\\partial F(x_i)}\\right|_{F=F_{m-1}}$$</div>
    <h4>Real-world use</h4>
    <p>This "fit to the gradient" framing is the reason gradient boosting works for regression, classification, ranking (search engines), and even survival analysis &mdash; you just swap the loss function, and the same tree-fitting machinery works because it's always chasing <em>some</em> gradient.</p>
  `}
},

    for(let i=0;i<n;i++){ const x=560+i*(360/(n-1)); const y=150+130*Math.pow(0.72,i); rightPts.push([x,y]); }
    const rightD = rightPts.map((p,i)=>`${i===0?'M':'L'}${p[0]},${p[1]}`).join(' ');
    svg.appendChild(drawPath(path(rightD,{stroke:C.green,'stroke-width':2}),1.0,2.0));
    rightPts.forEach((p,i)=> svg.appendChild(popIn(circle(p[0],p[1],3.6,C.green),1.1+i*0.13,0.25)));
    svg.appendChild(fadeIn(labelText(740,330,'smooth, reliable convergence \u2014 more trees needed',{'font-size':10,fill:C.green,'font-family':'IBM Plex Mono'}),3.4,0.4));
    svg.appendChild(fadeIn(labelText(500,395,'F_m(x) = F_{m-1}(x) + \u03bd \u00b7 tree_m(x)     \u2014 typical \u03bd \u2248 0.01\u20130.3',{'font-size':11.5,fill:C.dim,'font-family':'IBM Plex Mono'}),4.0,0.5));
  },
  math:{ title:'Why shrink the step at all?', html:`
    <h4>The formula</h4>
    <div class="eq">$$F_m(x) = F_{m-1}(x) + \\nu \\cdot h_m(x), \\qquad 0 < \\nu \\le 1$$</div>
    <p>Without shrinkage ($\\nu=1$), each tree fully commits to closing the current residual gap. That sounds efficient, but each individual tree is fit on a finite, noisy sample &mdash; some of what it's "correcting" is real signal, some is just noise in that particular residual. Fully committing bakes the noise in permanently.</p>
    <h4>The regularization view</h4>
    <p>Shrinkage is mathematically similar to regularization in linear models: it deliberately underfits each individual step so that the sum of many steps generalizes better than any single big step would. This is sometimes called the "learning rate / number of trees" trade-off:</p>
    <div class="eq">$$\\text{small } \\nu \\;\\Rightarrow\\; \\text{need larger } M \\text{ (more trees) to reach the same training fit, but test error keeps improving longer}$$</div>
    <h4>Worked numbers</h4>
    <p>Starting error 100, one $\\nu=1$ tree that captures 60% of the residual takes you straight to $100\\times0.4=40$ in a single (risky) step. The same tree type at $\\nu=0.1$ only takes you to $100\\times(1-0.06)=94$ per step, but repeated: after 10 steps you're at $100\\times0.94^{10}\\approx54$; after 30 steps, $100\\times0.94^{30}\\approx15$. Slower per step, but each step is honest, and you can stop the moment validation error turns upward &mdash; something you can't undo after one big $\\nu=1$ leap.</p>
    <h4>Practical tuning</h4>
    <p>The standard recipe: pick a small learning rate (0.01\u20130.1), then use early stopping on a validation set to choose how many trees $M$ to actually keep, rather than fixing $M$ in advance. This gets both the regularization benefit of small steps and an automatic stop before overfitting.</p>
    <h4>Real-world use</h4>
    <p>Virtually every production gradient boosting model (XGBoost, LightGBM, CatBoost) is trained with a small learning rate plus early stopping &mdash; it is the single most impactful hyperparameter pair for controlling overfitting in these models.</p>
  `}
},
{
  code:'TUNE-03', accent:C.amber,
  title:'Early Stopping \u2014 Knowing When to Stop',
  subtitle:'training error always keeps improving; validation error tells the truth',
  caption:'Training error monotonically drops toward zero \u2014 that\u2019s memorization, not learning. Validation error quietly turns upward the moment the model starts overfitting.',
  build(svg){
    svg.appendChild(fadeIn(line(120,300,900,300,C.line,{'stroke-width':1.3}),0,0.3));
    svg.appendChild(fadeIn(line(120,70,120,300,C.line,{'stroke-width':1.3}),0,0.3));
    svg.appendChild(fadeIn(labelText(510,325,'boosting rounds \u2192',{'font-size':10,fill:C.dim,'font-family':'IBM Plex Mono'}),0.2,0.3));
    svg.appendChild(fadeIn(labelText(500,40,'loss',{'font-size':10.5,fill:C.dim,'font-family':'IBM Plex Mono'}),0.1,0.3));
    const N=40;
    function trainY(T){ return 300 - (100*Math.exp(-0.08*T))*2.1; }
    function valRaw(T){ return 25+55*Math.exp(-0.09*T)+Math.max(0,T-15)*Math.max(0,T-15)*0.06; }
    let minT=0, minV=Infinity;
    for(let T=0;T<=N;T++){ const v=valRaw(T); if(v<minV){minV=v;minT=T;} }
    const trainPts=[], valPts=[];
    for(let T=0;T<=N;T++){ const x=120+T*(780/N); trainPts.push([x,trainY(T)]); valPts.push([x,300-valRaw(T)*2.1]); }
    const overX = 120+minT*(780/N);
    svg.appendChild(fadeIn(rect(overX,70,900-overX,230,C.rose,{opacity:.06}),1.2,0.6));
    const trainD = trainPts.map((p,i)=>`${i===0?'M':'L'}${p[0]},${p[1]}`).join(' ');
    const valD = valPts.map((p,i)=>`${i===0?'M':'L'}${p[0]},${p[1]}`).join(' ');
    svg.appendChild(drawPath(path(trainD,{stroke:C.blue,'stroke-width':2.2}),0.4,1.4));
    svg.appendChild(drawPath(path(valD,{stroke:C.rose,'stroke-width':2.2}),0.4,1.4));
    svg.appendChild(fadeIn(labelText(850,trainY(N)-10,'train loss',{'font-size':10,fill:C.blue,'font-family':'IBM Plex Mono','text-anchor':'end'}),1.9,0.4));
    svg.appendChild(fadeIn(labelText(850,300-valRaw(N)*2.1-14,'validation loss',{'font-size':10,fill:C.rose,'font-family':'IBM Plex Mono','text-anchor':'end'}),1.9,0.4));
    const stopLn = line(overX,70,overX,300,C.gold,{'stroke-width':1.8,'stroke-dasharray':'5,4'});
    svg.appendChild(fadeIn(stopLn,2.2,0.5));
    svg.appendChild(popIn(circle(overX,300-minV*2.1,5,C.gold),2.5,0.4));
    svg.appendChild(fadeIn(labelText(overX,340,'early stopping point',{'font-size':10,fill:C.gold,'font-family':'IBM Plex Mono'}),2.7,0.4));
    svg.appendChild(fadeIn(labelText((overX+900)/2,90,'overfitting zone',{'font-size':10.5,fill:C.rose,'font-family':'IBM Plex Mono'}),2.9,0.4));
    svg.appendChild(fadeIn(labelText((overX+900)/2,106,'train keeps dropping, val creeps back up',{'font-size':9,fill:C.rose,'font-family':'IBM Plex Mono'}),3.0,0.4));
  },
  math:{ title:'The early stopping rule, precisely', html:`
    <h4>The mechanism</h4>
    <p>After each boosting round, evaluate loss on a held-out validation set (never used for training). If validation loss hasn't improved for a set number of rounds (the "patience," e.g. 50), stop and roll the model back to the round with the best validation score.</p>
    <div class="eq">$$M^\\* = \\arg\\min_{m} \\; L_{\\text{val}}(F_m), \\qquad \\text{stop if } m - M^\\* > \\text{patience}$$</div>
    <h4>Why training loss is the wrong signal</h4>
    <p>Every additional tree, by construction, reduces training loss (gradient boosting is a descent method on the training objective) &mdash; so training loss alone can never tell you to stop. It measures how well the model fits data it has already memorized, not how well it generalizes to new data.</p>
    <h4>Why validation loss eventually rises</h4>
    <p>Early rounds fit real, generalizable signal shared between train and validation sets. Later rounds increasingly fit training-set-specific noise (a direct consequence of chasing ever-smaller residuals, some of which are just noise by round 30). That noise doesn't exist in the validation set, so fitting it makes validation loss worse even as training loss keeps dropping &mdash; exactly the diverging curves above.</p>
    <h4>Real-world use</h4>
    <p>Early stopping is effectively a free hyperparameter search over "number of trees" that costs one training run instead of a grid search &mdash; it's on by default in virtually every production XGBoost/LightGBM/CatBoost pipeline, almost always paired with a small learning rate (previous slide) for the smoothest, most reliable stopping point.</p>
  `}
},
{

  title:'Missing Values \u2014 Learn the Default Direction',

    svg.appendChild(fadeIn(labelText(L[0],L[1]+24,'try: missing \u2192 LEFT',{'font-size':9.5,fill:C.dim,'font-family':'IBM Plex Mono'}),2.1,0.3));
    svg.appendChild(fadeIn(labelText(R[0],R[1]+24,'try: missing \u2192 RIGHT',{'font-size':9.5,fill:C.dim,'font-family':'IBM Plex Mono'}),2.1,0.3));
    svg.appendChild(fadeIn(labelText(L[0],L[1]+44,'gain = 2.1',{'font-size':10,fill:C.dim,'font-family':'IBM Plex Mono'}),2.6,0.4));
    const winLbl=labelText(R[0],R[1]+44,'gain = 3.6  \u2713 winner',{'font-size':10,fill:C.gold,'font-family':'IBM Plex Mono','font-weight':600});

    incoming.filter(inc=>inc.c===C.dim).forEach((inc,i)=>{

        const dot=circle(inc.x+(k-1)*14,118,4,C.gold,{opacity:0});
        svg.appendChild(fadeIn(dot,3.6,0.3));

    svg.appendChild(fadeIn(labelText(500,300,'this learned rule is baked into the tree \u2014 no imputation step, ever',{'font-size':10.5,fill:C.dim,'font-family':'IBM Plex Mono'}),4.6,0.5));
  },
  math:{ title:'Sparsity-aware split finding', html:`
    <h4>The algorithm</h4>
    <p>For each candidate split, XGBoost computes the gain (from the XGB-02 slide's formula) twice: once assuming all missing values go left, once assuming they all go right. Whichever direction yields higher gain becomes that node's learned "default direction" for missing data:</p>
    <div class="eq">$$\\text{Gain}_{\\text{left-default}} = \\tfrac12\\!\\left[\\tfrac{(G_L+G_{\\text{miss}})^2}{H_L+H_{\\text{miss}}+\\lambda}+\\tfrac{G_R^2}{H_R+\\lambda}-\\tfrac{G^2}{H+\\lambda}\\right]\\!-\\gamma, \\quad \\text{similarly for right-default}$$</div>
    <p>Because both sums can be computed from the same pre-aggregated $G,H$ statistics used for the normal gain formula, this costs almost no extra compute &mdash; it's a small twist on split-finding that's already happening.</p>
    <h4>Why this beats manual imputation</h4>
    <p>Mean/median imputation assumes missingness carries no information and forces every missing value through the same fixed number, discarding any actual pattern (e.g. "income is missing" might itself be predictive of something). Learning the direction lets missing values be treated as their own implicit category whenever that's what the data supports, without you ever having to guess a fill value or build a separate "was missing" indicator feature.</p>
    <h4>Real-world use</h4>
    <p>This is one of XGBoost's most practically convenient features: real-world tabular data (especially forms, surveys, and merged datasets) is often riddled with missing values, and being able to feed them in directly \u2014 no imputer, no extra pipeline step \u2014 removes an entire category of preprocessing bugs and leakage risks.</p>
  `}
},
{
  code:'XGB-01', accent:C.gold,
  title:'XGBoost \u2014 A Regularized Objective',
  subtitle:'don\u2019t just minimize error \u2014 minimize error plus a penalty for complexity',
  caption:'XGBoost approximates the loss with a 2nd-order (curvature-aware) expansion, then adds a penalty that pulls every leaf weight toward zero.',
  build(svg){
    const wToX = w => 500 + w*45;
    const L = w => 0.15*(w-3)*(w-3);
    const Om = w => 0.08*w*w;
    const J = w => L(w)+Om(w);
    const toY = v => 280 - 18*v;
    svg.appendChild(fadeIn(line(wToX(-5),280,wToX(9),280,C.line,{'stroke-width':1.3}),0.1,0.4));
    svg.appendChild(fadeIn(labelText(wToX(9)+10,285,'leaf weight w \u2192',{'font-size':10,fill:C.dim,'font-family':'IBM Plex Mono','text-anchor':'start'}),0.2,0.4));
    const ws = Array.from({length:41},(_,i)=>-5+i*0.35);
    const dL = ws.map((w,i)=>`${i===0?'M':'L'}${wToX(w)},${toY(L(w))}`).join(' ');

    const pt = grp({transform:`translate(${wToX(w0)},${toY(L(w0))})`});

    svg.appendChild(fadeIn(labelText(wToX(w0),toY(L(w0))-16,'current guess',{'font-size':9.5,fill:C.amber,'font-family':'IBM Plex Mono'}),1.9,0.3));

    const tanD = `M${wToX(w0-1.4)},${toY(L(w0)-slope*1.4)} L${wToX(w0+1.4)},${toY(L(w0)+slope*1.4)}`;

    svg.appendChild(fadeIn(labelText(wToX(9)-10,toY(J(9))-14,'L(w) + \u03a9(w)  \u2014  with penalty',{'font-size':10.5,fill:C.rose,'font-family':'IBM Plex Mono','text-anchor':'end'}),4.3,0.4));
    // minima markers
    const minL=3, minJ=1.957;
    [ {w:minL,c:C.blue,lbl:'min of L alone'}, {w:minJ,c:C.rose,lbl:'min of L + \u03a9  \u2014 pulled toward 0'} ].forEach((m,i)=>{
      const x=wToX(m.w);
      svg.appendChild(fadeIn(line(x,280,x,toY(L(m.w))-6+ (i===1? (toY(J(m.w))-toY(L(m.w))) : 0),m.c,{'stroke-width':1.2,'stroke-dasharray':'3,3'}),4.6+i*0.3,0.4));
      svg.appendChild(fadeIn(labelText(x, i===0? 305 : 322, m.lbl,{'font-size':9.5,fill:m.c,'font-family':'IBM Plex Mono'}),4.9+i*0.3,0.4));
    });
  },
  math:{ title:'The XGBoost objective, term by term', html:`
    <h4>Second-order Taylor expansion</h4>
    <p>Instead of only using the slope (gradient) to decide the next tree, like plain gradient boosting, XGBoost also uses the curvature (second derivative / Hessian), giving a much better local approximation of the loss around the current prediction:</p>
    <div class="eq">$$L(y_i, F_{m-1}(x_i)+h(x_i)) \\approx L(y_i,F_{m-1}(x_i)) + g_i h(x_i) + \\tfrac{1}{2} u_i h(x_i)^2$$</div>
    <p>where $g_i = \\partial L/\\partial F$ (gradient) and $u_i = \\partial^2 L/\\partial F^2$ (Hessian) at each point. This is exactly a 2nd-order Taylor series &mdash; the same tool used to approximate any smooth function locally with a parabola.</p>
    <h4>The regularization term</h4>
    <div class="eq">$$\\Omega(h) = \\gamma T + \\tfrac{1}{2}\\lambda \\sum_{j=1}^{T} w_j^2$$</div>
    <p>$T$ is the number of leaves in the new tree, $w_j$ is each leaf's output value. $\\gamma$ penalizes having too many leaves (structural complexity); $\\lambda$ penalizes leaves with extreme output values (like L2 regularization in linear models). Adding this to the loss is what pulls the optimal leaf weight toward zero, visible on the graph as the minimum shifting left.</p>
    <h4>Why bother with curvature at all?</h4>
    <p>Using only the gradient (plain gradient boosting) assumes the loss is locally flat-ish. Using the Hessian too lets XGBoost take an appropriately-sized step automatically \u2014 large steps where the loss is flat, small careful steps where it's sharply curved &mdash; which is both faster to converge and more numerically stable.</p>
    <h4>Worked numbers</h4>
    <p>For squared error, $g_i = F(x_i)-y_i$ and $u_i=1$ (constant curvature) for every point. Say a leaf collects 4 points with $g$-values $[2,3,-1,2]$: $G=\\sum g_i = 6$, $H=\\sum u_i=4$. With $\\lambda=1$: optimal leaf weight $w^\\* = -G/(H+\\lambda) = -6/5 = -1.2$. Without regularization ($\\lambda=0$) it would have been $-6/4=-1.5$ &mdash; regularization pulled the leaf's output 20% closer to zero, exactly the damping visible as the shifted minimum on the graph above.</p>
    <h4>Real-world use</h4>
    <p>This regularized, curvature-aware objective is a large part of why XGBoost became the dominant tool in Kaggle competitions circa 2015\u20132018: it converges faster and overfits less than plain gradient boosting, out of the box.</p>
  `}
},
{
  code:'XGB-02', accent:C.gold,
  title:'XGBoost \u2014 Gain-Scored Splits &amp; Pruning',
  subtitle:'every candidate split is scored; splits that don\u2019t earn their keep get cut',

    const A1=[210,270], A2=[390,270];

    svg.appendChild(fadeIn(labelText(A[0],220,'gain = 4.2 > \u03b3  \u2192  split',{'font-size':10.5,fill:C.green,'font-family':'IBM Plex Mono'}),1.3,0.4));
    // Node B: negative gain -> prune
    const B1=[620,270], B2=[790,270];
    const bLines=[B1,B2].map((p,i)=>{
      const ln=path(`M${B[0]},${B[1]+8} L${p[0]},${p[1]-10}`,{stroke:C.rose,'stroke-width':1.6,'stroke-dasharray':'4,3',opacity:.7});
      svg.appendChild(fadeIn(ln,1.6+i*0.15,0.3));
      return ln;
    });
    svg.appendChild(fadeIn(labelText(B[0],220,'gain = \u22120.6 < \u03b3  \u2192  prune',{'font-size':10.5,fill:C.rose,'font-family':'IBM Plex Mono'}),1.3,0.4));
    const scissors = grp({transform:`translate(${B[0]},225)`});
    scissors.appendChild(line(-8,-8,8,8,C.rose,{'stroke-width':2.2}));
    scissors.appendChild(line(-8,8,8,-8,C.rose,{'stroke-width':2.2}));
    svg.appendChild(popIn(scissors,2.6,0.4));
    bLines.forEach(ln=>fadeOut(ln,2.9,0.4));
    svg.appendChild(fadeIn(labelText(B[0],B[1]+38,'stays a leaf',{'font-size':10,fill:C.rose,'font-family':'IBM Plex Mono'}),3.1,0.4));
    svg.appendChild(fadeIn(labelText(500,395,'Gain = \u00bd[ scoreLeft + scoreRight \u2212 scoreParent ] \u2212 \u03b3',{'font-size':11.5,fill:C.dim,'font-family':'IBM Plex Mono'}),3.6,0.5));
  },
  math:{ title:'The exact gain formula behind every split', html:`
    <h4>Per-leaf optimal weight</h4>
    <p>From the 2nd-order Taylor objective on the previous slide, minimizing over $w_j$ for a fixed tree structure gives a closed-form optimal weight for leaf $j$ (with $G_j=\\sum g_i$, $H_j=\\sum u_i$ summed over points landing in that leaf):</p>
    <div class="eq">$$w_j^\\* = -\\frac{G_j}{H_j+\\lambda}, \\qquad \\text{score}(j) = -\\tfrac{1}{2}\\frac{G_j^2}{H_j+\\lambda}$$</div>
    <h4>The split gain formula</h4>
    <div class="eq">$$\\text{Gain} = \\tfrac{1}{2}\\left[\\frac{G_L^2}{H_L+\\lambda} + \\frac{G_R^2}{H_R+\\lambda} - \\frac{(G_L+G_R)^2}{H_L+H_R+\\lambda}\\right] - \\gamma$$</div>
    <p>The first two fractions score the two children if you split; the third scores the parent as-is. The difference is how much the split actually helps. Subtracting $\\gamma$ charges a fixed "toll" for adding a leaf. If the toll isn't worth it, Gain is negative and the split is rejected.</p>
    <h4>Worked numbers (matching node A / node B above)</h4>
    <p>Suppose node A's left/right children would have $G_L=-4,H_L=6$ and $G_R=5,H_R=5$, with $\\lambda=1,\\gamma=1$: $\\text{Gain} = \\tfrac12[\\tfrac{16}{7}+\\tfrac{25}{6}-\\tfrac{1}{12}]-1 \\approx \\tfrac12[2.29+4.17-0.08]-1\\approx 3.19-1=2.19$ &mdash; wait, using slightly different sample sums than the animation's illustrative "4.2", the sign is what matters: positive Gain, so <strong>split</strong>. For node B, a near-even split contributes almost nothing beyond what the parent already captured, so the bracket term is smaller than $\\gamma$, making Gain negative &mdash; <strong>prune</strong>. The exact numbers differ split to split, but the decision rule is always this same subtraction.</p>
    <h4>Why this beats greedy impurity-only splitting</h4>
    <p>Classic decision trees (and even plain gradient boosting trees) usually split greedily on impurity reduction and prune afterward with a separate heuristic. XGBoost bakes the "is this split even worth it" question directly into one formula derived from the actual objective being optimized, including the regularization &mdash; so the tree naturally stays no more complex than the data justifies.</p>
    <h4>Real-world use</h4>
    <p>This gain-and-prune-together approach makes XGBoost markedly more resistant to overfitting on small or noisy datasets than naive tree-growing, which is a big reason it remains a strong default even next to newer boosting libraries.</p>
  `}
},
