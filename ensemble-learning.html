  math:{ title:'Four regularizers, four different mechanisms', html:`
    <h4>L1 (alpha) vs L2 (lambda), formally</h4>
    <div class="eq">$$\\Omega_{L1}(w) = \\alpha\\sum_j |w_j|, \\qquad \\Omega_{L2}(w) = \\tfrac12\\lambda\\sum_j w_j^2$$</div>
    <p>L2's penalty grows quadratically, so it punishes large weights hard but barely touches small ones &mdash; the result is every weight shrinks a little (as seen in the XGB-01 slide's shifted minimum), but rarely hits exactly zero. L1's penalty grows linearly, and its derivative is a constant $\\pm\\alpha$ regardless of how small $w$ already is &mdash; this constant "pull toward zero" can fully cancel a leaf's optimal weight, driving it to exactly 0. That's why L1 induces sparsity (effectively removing some splits' contribution) and L2 induces smooth shrinkage.</p>
    <h4>subsample &amp; colsample_bytree</h4>
    <p>These import bagging's core trick directly into boosting: each tree trains on a random ~50-80% of rows and/or columns, exactly like a bootstrap sample in Random Forest. Because boosting trees are already correlated by design (each one is fit to the last one's residuals), this extra randomness pushes down that correlation, giving some of bagging's variance-reduction benefit on top of boosting's bias-reduction.</p>
    <h4>Why combine them instead of using one</h4>
    <p>Each regularizer targets a different failure mode: L1/L2 constrain how extreme any single leaf's output can be; row/column subsampling constrain how much any single tree can specialize to quirks in the training set. A model overfitting because of a few dominant, over-weighted leaves needs L1/L2; a model overfitting because trees keep rediscovering the same narrow pattern needs subsampling. Using all four at moderate strength usually generalizes better than maxing out just one.</p>
    <h4>Real-world use</h4>
    <p>A common, effective starting recipe: subsample=0.8, colsample_bytree=0.8, lambda=1 (L2 on by default), alpha=0 (add L1 only if you specifically want feature sparsity/selection) \u2014 then tune learning rate and number of trees via early stopping as the primary levers.</p>
  `}
},

  math:{ title:'Enforcing monotonicity inside tree growth', html:`
    <h4>The constraint</h4>
    <p>Require $\\frac{\\partial \\hat y}{\\partial x_j} \\ge 0$ (or $\\le 0$) everywhere, for a chosen feature $j$. In a tree ensemble this is enforced structurally: whenever a split is made on a constrained feature, every leaf on the "higher $x_j$" side is forced to have a value $\\ge$ every leaf on the "lower $x_j$" side (or the split is rejected and the algorithm tries the next-best split).</p>
    <h4>Why unconstrained trees can violate monotonicity</h4>
    <p>A tree only ever asks "does this training data support a better split here?" &mdash; if a small, noisy pocket of the training data happens to have lower outcomes at slightly higher $x_j$ (pure sampling luck), an unconstrained tree will happily carve out a leaf that reflects that noise, producing a locally decreasing prediction even though the true underlying relationship is increasing.</p>
    <h4>Why this matters beyond aesthetics</h4>
    <p>In regulated domains (credit, insurance, healthcare), a model that predicts <em>lower</em> risk for a <em>larger</em> loan in some narrow band isn't just embarrassing &mdash; it can be a compliance and fairness problem, and it undermines trust even when the average accuracy is fine. Monotonic constraints let you inject known domain knowledge ("risk should never decrease with debt-to-income ratio") directly into model structure, rather than hoping the training data never contains a misleading pocket.</p>
    <h4>Real-world use</h4>
    <p>Supported natively in XGBoost, LightGBM, and CatBoost via a simple per-feature constraint list. Common uses: risk scores that must increase with debt, insurance premiums that must increase with claim history, and pricing models that must respect "more of a good thing is never worse."</p>
  `}
},

  math:{ title:'Leaf-wise growth, histograms, and GOSS', html:`
    <h4>Leaf-wise vs. level-wise</h4>
    <p>Level-wise growth (used by default in XGBoost and Random Forest) expands every leaf at the current depth before going deeper, keeping the tree balanced. Leaf-wise growth always expands the single leaf with the largest loss reduction, regardless of depth:</p>
    <div class="eq">$$\\text{leaf}^\\* = \\arg\\max_{\\ell \\in \\text{current leaves}} \\text{Gain}(\\ell)$$</div>
    <p>For a fixed leaf budget, leaf-wise growth reaches lower training loss than level-wise, because it never "wastes" a split on a leaf that barely helps just to keep the tree symmetric. The trade-off: leaf-wise trees can grow deep and narrow, which increases overfitting risk on small datasets \u2014 controlled with <code>max_depth</code> and <code>min_data_in_leaf</code>.</p>
    <h4>Histogram binning</h4>
    <p>Finding the exact best split threshold normally means sorting every unique feature value: $O(n \\log n)$ per feature per split. LightGBM instead buckets continuous values into a fixed number of bins (e.g. 255) up front, and only searches at bin boundaries \u2014 turning split-finding into an $O(\\text{bins})$ operation, independent of $n$.</p>
    <h4>Worked numbers</h4>
    <p>At $n=10{,}000{,}000$ rows, exact sorting costs on the order of $n\\log_2 n \\approx 2.3\\times10^8$ comparisons per feature per split. Histogram binning with 255 bins costs on the order of $n$ to build the histogram once ($10^7$) plus 255 to scan it &mdash; the scan itself is over 40,000&times; cheaper, and it's the scan that's repeated at every single split in every tree.</p>
    <h4>GOSS, precisely</h4>
    <p>Keep the top $a\\%$ of points by gradient magnitude, then randomly sample $b\\%$ of the rest. To keep the gradient sum (and hence the split-gain estimate) unbiased, the sampled small-gradient points are reweighted by a constant factor $\\frac{1-a}{b}$ when computing information gain:</p>
    <div class="eq">$$\\widetilde{\\text{Gain}}(\\text{split}) \\;\\propto\\; \\sum_{i \\in \\text{top}} g_i \\;+\\; \\frac{1-a}{b}\\sum_{i \\in \\text{sampled rest}} g_i$$</div>
    <p>With typical settings ($a=20\\%, b=10\\%$), GOSS trains on only 30% of the data volume per split while its gain estimate stays close to using 100% \u2014 points with large gradient magnitude are "under-trained" (the model is still very wrong about them) and matter most for choosing the next split.</p>
    <h4>Real-world use</h4>
    <p>These three tricks together are why LightGBM is typically many times faster than XGBoost on large tabular datasets (millions of rows) while reaching comparable or better accuracy \u2014 it's the common choice when training time or memory is the bottleneck.</p>
  `}
},

      svg.appendChild(move(bar,'width',2,120*v,3.2+i*0.1,0.5));

    svg.appendChild(fadeIn(labelText(220,368,'powerful, but leaks without care (next slide)',{'font-size':8.5,fill:C.dim,'font-family':'IBM Plex Mono'}),3.8,0.4));
    // Native handling
    quad(720,300,'NATIVE SPLIT (CatBoost/LightGBM)',C.teal);

  math:{ title:'Choosing a categorical encoding', html:`
    <h4>One-hot: safe but expensive</h4>
    <p>Creates $K$ binary columns for $K$ categories. Mathematically clean (no false ordering, no leakage), but a tree can only carve out one category at a time via a single binary column, so recovering a pattern like "categories A, C, and F behave similarly" takes several splits instead of one. At high cardinality (thousands of categories, e.g. zip codes) it also blows up the feature count and the splits become statistically noisy (few examples per resulting column).</p>
    <h4>Label encoding: cheap but dangerous for non-tree models</h4>
    <p>Maps each category to an arbitrary integer. Trees can partially cope (a sequence of splits can carve out arbitrary subsets), but it's fragile: the same tree structure quality now depends on whether the arbitrary integer ordering happens to group similar categories near each other, which it usually doesn't.</p>
    <h4>Target encoding: powerful but leaky (see next slide)</h4>
    <p>Replaces a category with a statistic of the target (usually the mean) computed from training examples of that category. Directly gives the tree the most useful possible single number, but naive versions leak the target into the feature &mdash; the entire subject of the very next slide.</p>
    <h4>Native categorical handling: best of both</h4>
    <p>CatBoost and LightGBM can split directly on subsets of categories (e.g. $\\{\\text{NYC}, \\text{SF}\\} \\text{ vs. } \\{\\text{LA}, \\text{Chicago}\\}$) using efficient greedy or statistics-based grouping, without one-hot's dimensionality blowup or label encoding's false ordering. This is usually the best default when your chosen library supports it.</p>
    <h4>Real-world use</h4>
    <p>Rule of thumb: low-cardinality (under ~10 categories) &rarr; one-hot is fine anywhere. High-cardinality (hundreds/thousands, e.g. product ID, zip code) &rarr; native handling (CatBoost/LightGBM) or careful target encoding; plain one-hot and label encoding both struggle at this scale.</p>
  `}
},
{
  code:'CAT-01', accent:C.rose,
  title:'CatBoost \u2014 Never Peek at the Future',
  subtitle:'ordered boosting turns categories into numbers without leaking information',
  caption:'Encoding a category using the whole dataset\u2019s average target quietly leaks the answer into the training data. CatBoost encodes each point using only points that came "before" it in a random order.',
  build(svg){
    const cats=['A','B','A','C','B','A','C','B'];
    const colorMap={A:C.blue,B:C.amber,C:C.green};
    const xs=cats.map((_,i)=>110+i*100);
    function panel(y,title,color,ordered){
      svg.appendChild(fadeIn(labelText(500,y-40,title,{'font-size':11,fill:color,'font-family':'IBM Plex Mono','font-weight':600}),ordered?0.1:2.6,0.4));
      svg.appendChild(fadeIn(line(90,y,830,y,C.line,{'stroke-width':1.3}),ordered?0.15:2.65,0.3));
      xs.forEach((x,i)=>{
        const g=grp({transform:`translate(${x},${y})`});
        g.appendChild(circle(0,0,10,'#12161b',{stroke:colorMap[cats[i]],'stroke-width':2}));
        const t=E('text',{x:0,y:4,'text-anchor':'middle','font-size':10,fill:colorMap[cats[i]],'font-family':'IBM Plex Mono'}); t.textContent=cats[i]; g.appendChild(t);
        svg.appendChild(popIn(g,(ordered?0.3:2.8)+i*0.15,0.3));
      });
      xs.forEach((x,i)=>{
        for(let j=0;j<xs.length;j++){
          if(j===i || cats[j]!==cats[i]) continue;
          if(ordered && j>i) continue; // ordered: only look back
          const leak = !ordered && j>i;
          const midx=(xs[j]+x)/2, midy = y - (ordered?38:-38);
          const d=`M${xs[j]},${y-(ordered?10:-10)} Q${midx},${midy} ${x},${y-(ordered?10:-10)}`;
          const ln=path(d,{stroke: leak?C.rose:colorMap[cats[i]], 'stroke-width':1.2, opacity:leak?0.85:0.5, 'stroke-dasharray': leak?'3,3':'none'});
          svg.appendChild(drawPath(ln,(ordered?0.9:3.2)+i*0.15,0.35));
        }
      });
    }
    panel(140,'ORDERED (CatBoost) \u2014 each point uses only earlier points',C.rose,true);
    panel(320,'NAIVE target encoding \u2014 uses every point, including future ones',C.dim,false);
    svg.appendChild(fadeIn(labelText(500,395,'dashed red arcs = information leaking backward from the future \u2192 overfits',{'font-size':10,fill:C.rose,'font-family':'IBM Plex Mono'}),4.1,0.5));
  },
  math:{ title:'Target statistics and the leakage they cause', html:`
    <h4>The naive approach</h4>
    <p>A common way to turn a category into a number is to replace it with the average target value for that category:</p>
    <div class="eq">$$\\hat x_i = \\frac{\\sum_{j:\\,c_j = c_i} y_j}{\\#\\{j:\\,c_j=c_i\\}}$$</div>
    <p>The problem: this sum includes $y_i$ itself and every other training point, so the encoded feature already "knows" a piece of its own target. The model can learn to exploit that leak, giving great training accuracy and much worse real-world accuracy.</p>
    <h4>Ordered target statistics</h4>
    <p>CatBoost picks a random permutation $\\sigma$ of the training data, and encodes each point using only points that come before it in that order:</p>
    <div class="eq">$$\\hat x_i = \\frac{\\sum_{j:\\,\\sigma(j)<\\sigma(i),\\, c_j=c_i} y_j + a\\cdot P}{\\#\\{j:\\,\\sigma(j)<\\sigma(i),\\,c_j=c_i\\} + a}$$</div>
    <p>($a$ and $P$ are a smoothing prior for categories with few or no prior examples.) This mirrors exactly how the feature would be computed at real prediction time \u2014 you'd never have future outcomes available &mdash; so training and inference conditions match.</p>
    <h4>Worked numbers (matching the animation)</h4>
    <p>Category "A" appears at positions 1, 3, and 6 in the random order, with targets $y=1,0,1$ respectively (using $a=1, P=0.5$ as a mild prior). Point 1 (first "A" ever seen) has no prior "A" history, so $\\hat x_1 = \\frac{0\\cdot1 + 1\\times0.5}{0+1}=0.5$ &mdash; just the prior. Point 3 has seen point 1's outcome: $\\hat x_3 = \\frac{1 + 0.5}{1+1}=0.75$. Point 6 has seen points 1 and 3: $\\hat x_6 = \\frac{1+0+0.5}{2+1}=0.5$. Every encoding only ever looks backward &mdash; exactly the arcs drawn in the top panel above.</p>
    <h4>Ordered boosting goes further</h4>
    <p>CatBoost applies the same "never peek ahead" principle to the boosting process itself: the residual used to train each tree is computed using a model that never saw that particular point, which further reduces a subtle bias called <em>prediction shift</em> that standard gradient boosting has.</p>
    <h4>Real-world use</h4>
    <p>CatBoost's ordered encoding removes the need for manual target-encoding tricks (a common source of subtle bugs in real pipelines), and it excels specifically on datasets with many high-cardinality categorical columns \u2014 e.g. user IDs, product SKUs, zip codes &mdash; where naive encoding would leak badly.</p>
  `}
},

    scatter(500,15,2,true,false);
    svg.appendChild(fadeIn(labelText(500,340,'misclassifying a rose point now costs ~19\u00d7 more',{'font-size':9,fill:C.amber,'font-family':'IBM Plex Mono'}),2.8,0.4));
    svg.appendChild(fadeIn(labelText(820,28,'FIX 2: resample (SMOTE)',{'font-size':10.5,fill:C.green,'font-family':'IBM Plex Mono','font-weight':600}),2.2,0.4));
    scatter(820,15,2,false,true);

  math:{ title:'Fixing imbalance without fooling yourself', html:`
    <h4>Why plain accuracy lies</h4>
    <p>With a 95:5 class split, predicting the majority class every time scores 95% accuracy while having zero true positives on the class you actually care about. The fix starts with the metric: use precision, recall, F1, or PR-AUC (not accuracy or even ROC-AUC, which can also look deceptively good under severe imbalance) to actually see what's happening.</p>
    <h4>class_weight / scale_pos_weight</h4>
    <p>Multiply the loss contribution of minority-class errors by a factor, commonly the inverse class ratio:</p>
    <div class="eq">$$w_{\\text{minority}} = \\frac{n_{\\text{majority}}}{n_{\\text{minority}}}, \\qquad L_{\\text{weighted}} = \\sum_i w_{y_i}\\, L(y_i,\\hat y_i)$$</div>
    <p>This directly changes what the training objective rewards: at a 95:5 split, a minority mistake now costs 19&times; a majority mistake, which pushes every split and every leaf value in the ensemble toward respecting the rare class rather than ignoring it.</p>
    <h4>Resampling: SMOTE and friends</h4>
    <p>Oversampling duplicates (or synthesizes, via SMOTE's linear interpolation between nearby minority points) minority examples; undersampling drops majority examples. Both rebalance the class ratio the model actually trains on. SMOTE specifically generates a new point along the line segment between a minority point and one of its nearest minority neighbors, adding density without exact duplication (which would otherwise just cause the model to overfit those specific repeated points).</p>
    <h4>Real-world use</h4>
    <p>Fraud detection, rare disease diagnosis, and industrial defect detection are the canonical use cases. In practice: start with class_weight (free, no data modification, works with every algorithm in this deck), evaluate with PR-AUC/F1, and only add resampling if class_weight alone isn't enough &mdash; resampling changes the data distribution the model sees, which carries its own risk of overfitting to synthesized points.</p>
  `}
},
{
  code:'ALGO-02', accent:C.gold,
  title:'LambdaMART \u2014 Boosting for "Which Comes First?"',
  subtitle:'gradient boosting adapted to optimize rank order, not individual predicted scores',
  caption:'A search engine doesn\u2019t care about a document\u2019s exact predicted relevance score \u2014 only whether the best result ends up first.',
  build(svg){
    const docs=[{n:'Doc A',v:40,c:C.dim},{n:'Doc B',v:90,c:C.green},{n:'Doc C',v:20,c:C.dim},{n:'Doc D',v:70,c:C.blue},{n:'Doc E',v:55,c:C.amber}];
    const order0=[0,1,2,3,4];

    const rowY=i=>75+i*62;
    const groups=order0.map((di,i)=>{
      const d=docs[di];
      const g=grp({transform:`translate(500,${rowY(i)})`});
      g.appendChild(rect(-220,-20,440,40,'#12161b',{stroke:C.line,'stroke-width':1.3,rx:5}));
      const t=E('text',{x:-195,y:5,'font-size':11,fill:C.text,'font-family':'IBM Plex Mono'}); t.textContent=d.n; g.appendChild(t);
      g.appendChild(rect(-90,-8,140,16,'none',{stroke:C.line,'stroke-width':1,rx:8}));
      const bar=rect(-90,-8,2,16,d.c,{rx:8});
      g.appendChild(bar);

      svg.appendChild(move(bar,'width',2,140*d.v/100,0.5+i*0.1,0.6));
      const relLbl=E('text',{x:60,y:5,'font-size':10,fill:d.c,'font-family':'IBM Plex Mono'}); relLbl.textContent='relevance '+d.v; g.appendChild(relLbl);
      return g;
    });
    svg.appendChild(fadeIn(labelText(500,335,'after several LambdaMART rounds \u2014 pairwise-swap gradients reorder the list',{'font-size':10.5,fill:C.gold,'font-family':'IBM Plex Mono'}),1.9,0.5));
    order0.forEach((di,i)=>{
      const targetRank = order1.indexOf(di);
      const dy = rowY(targetRank) - rowY(i);
      groups[i].appendChild(E('animateTransform',{attributeName:'transform', type:'translate', values:`500,${rowY(i)};500,${rowY(targetRank)}`, keyTimes:'0;1', keySplines:'.42 0 .58 1', calcMode:'spline', begin:'2.4s', dur:'1.3s', fill:'freeze'}));
    });
    svg.appendChild(fadeIn(labelText(500,375,'most relevant document floats to the top \u2014 that\u2019s the entire objective',{'font-size':10,fill:C.dim,'font-family':'IBM Plex Mono'}),3.9,0.5));
  },
  math:{ title:'Optimizing rank order directly', html:`
    <h4>Why squared error is the wrong loss for ranking</h4>
    <p>Predicting relevance scores $[0.91, 0.89, 0.12]$ for 3 documents has almost the same squared error as predicting $[0.89, 0.91, 0.12]$ &mdash; but the second version has swapped the top 2 results, which matters enormously to a user and barely registers in squared-error terms. Ranking needs a loss that cares about <em>order</em>, not absolute values.</p>
    <h4>The Lambda gradient</h4>
    <p>LambdaMART (gradient boosted trees + the LambdaRank gradient) defines a pseudo-gradient directly on pairs of documents, sized by how much swapping that pair would change a ranking quality metric like NDCG:</p>
    <div class="eq">$$\\lambda_{ij} = \\frac{\\partial L}{\\partial s_i} \\;\\propto\\; \\big|\\Delta\\text{NDCG}_{ij}\\big| \\cdot \\sigma\\big(s_j - s_i\\big), \\quad \\text{summed over all pairs } j \\text{ for document } i$$</div>
    <p>$|\\Delta\\text{NDCG}_{ij}|$ is how much the ranking metric would change if documents $i$ and $j$ swapped positions &mdash; large for a high-relevance document sitting below a low-relevance one near the top of the list, small for two low-relevance documents swapping far down the list where nobody scrolls. These pairwise lambdas are summed per document into an overall pseudo-residual, and a regression tree is fit to it &mdash; exactly the "fit a tree to the (pseudo) gradient" machinery from the Gradient Boosting slides, just with a ranking-shaped gradient instead of a residual.</p>
    <h4>Real-world use</h4>
    <p>LambdaMART (and its descendants inside XGBoost's and LightGBM's ranking objectives) powers the "learning to rank" layer of most modern search engines and recommendation systems &mdash; taking a candidate set of results/items and ordering them, after a separate retrieval stage has already narrowed down the candidates.</p>
  `}
},
{
  code:'VOTE-01', accent:C.violet,
  title:'Voting Classifier \u2014 Let Already-Trained Models Decide Together',
  subtitle:'no retraining, no residuals \u2014 just combine finished opinions',
  caption:'Hard voting counts ballots. Soft voting averages confidence \u2014 and can catch cases where the majority is barely more sure than the minority.',
  build(svg){

    svg.appendChild(fadeIn(labelText(250,335,'2 votes A, 1 vote B',{'font-size':10.5,fill:C.dim,'font-family':'IBM Plex Mono'}),2.8,0.4));
    svg.appendChild(fadeIn(labelText(250,360,'\u2192 predict A',{'font-size':13,fill:C.violet,'font-family':'IBM Plex Mono','font-weight':600}),3.1,0.4));
    // SOFT VOTING
    svg.appendChild(fadeIn(labelText(750,225,'SOFT VOTING \u2014 average the probabilities',{'font-size':10.5,fill:C.text,'font-family':'IBM Plex Mono'}),1.9,0.4));
    models.forEach((m,i)=>{
      const y=260+i*28;
      svg.appendChild(fadeIn(labelText(600,y+4,m.name,{'font-size':9.5,fill:m.color,'font-family':'IBM Plex Mono','text-anchor':'start'}),2.1+i*0.15,0.3));
      svg.appendChild(fadeIn(rect(670,y-7,220,14,'none',{stroke:C.line,'stroke-width':1,rx:7}),2.1+i*0.15,0.3));
      svg.appendChild(move(rect(670,y-7,2,14,m.color,{rx:7}),'width',2,220*m.pA,2.3+i*0.15,0.5));
      svg.appendChild(fadeIn(labelText(902,y+4,'P(A)='+m.pA.toFixed(2),{'font-size':9,fill:m.color,'font-family':'IBM Plex Mono','text-anchor':'start'}),2.6+i*0.15,0.3));
    });
    svg.appendChild(fadeIn(labelText(750,368,'average P(A) = (0.80+0.45+0.70)/3 = 0.65',{'font-size':10.5,fill:C.dim,'font-family':'IBM Plex Mono'}),3.4,0.4));
    svg.appendChild(fadeIn(labelText(750,392,'\u2192 predict A, with 65% confidence',{'font-size':13,fill:C.violet,'font-family':'IBM Plex Mono','font-weight':600}),3.7,0.4));
  },
  math:{ title:'Two ways to combine finished models', html:`
    <h4>Hard voting</h4>
    <div class="eq">$$\\hat y = \\text{mode}\\{h_1(x), h_2(x), \\ldots, h_K(x)\\}$$</div>
    <p>Simple majority rule. Every model gets one equal vote, regardless of how confident it was. Easy to reason about, works even when models only output class labels (no probabilities available).</p>
    <h4>Soft voting</h4>
    <div class="eq">$$\\hat y = \\arg\\max_c \\; \\frac{1}{K}\\sum_{k=1}^K P_k(y=c \\mid x)$$</div>
    <p>Averages predicted probabilities instead of final labels. This uses strictly more information than hard voting &mdash; a model that's 51% sure and a model that's 99% sure both just count as "one vote" under hard voting, but soft voting correctly weighs the confident one more. Given calibrated probabilities, soft voting is provably at least as good as hard voting in expectation.</p>
    <h4>Where they actually disagree</h4>
    <p>Suppose $P_1(A)=0.52, P_2(A)=0.51, P_3(A)=0.05$ (so $P_3(B)=0.95$). Hard voting: 2 votes for A, 1 for B &rarr; predicts A. Soft voting: average $P(A) = (0.52+0.51+0.05)/3 \\approx 0.36$ &rarr; predicts B, because model 3 is <em>extremely</em> confident B is right while models 1 and 2 are barely more than coin flips on A. This is the case where soft voting's extra information changes the outcome, not just the confidence.</p>
    <h4>Weighted variants</h4>
    <p>Both forms generalize to weighted votes, $\\hat y = \\arg\\max_c \\sum_k \\beta_k P_k(y=c\\mid x)$, where $\\beta_k$ reflects how much you trust model $k$ (e.g. its validation accuracy) &mdash; a simple stepping stone toward the learned weighting that Stacking does automatically.</p>
    <h4>Real-world use</h4>
    <p>Voting is the cheapest possible ensemble: no extra training beyond the base models. It's common in production when you already maintain several independently-built models (e.g. different teams' fraud models) and want a fast, low-risk way to combine them.</p>
  `}
},
{
  code:'STACK-01', accent:C.violet,

  math:{ title:'Why cross-validated predictions, specifically?', html:`
    <h4>The naive (broken) version</h4>
    <p>If you trained base models on the full training set and then trained a meta-learner directly on their predictions <em>for that same training set</em>, the meta-learner would be learning from predictions that are unrealistically accurate (the base models have already memorized parts of that data). It would learn to over-trust the base models, then fail at real prediction time.</p>
    <h4>The fix: out-of-fold predictions</h4>
    <p>Split training data into $K$ folds. For each fold $k$, train every base model on the other $K-1$ folds and predict on fold $k$. Stitching these predictions back together gives, for every training point, a prediction from a model that never saw it &mdash; exactly mimicking real-world generalization.</p>
    <div class="eq">$$z_i = \\big(h_1^{(-k(i))}(x_i),\\, h_2^{(-k(i))}(x_i),\\, \\ldots,\\, h_K^{(-k(i))}(x_i)\\big)$$</div>
    <p>These out-of-fold prediction vectors $z_i$ become the input features to the meta-learner, trained against the true labels $y_i$:</p>
    <div class="eq">$$\\hat y = g(z), \\qquad g \\text{ is typically a simple model (logistic/linear regression)}$$</div>
    <h4>Why a simple meta-learner</h4>
    <p>The meta-learner only has a handful of input features (one per base model), and complex models overfit fast on so few features. A simple, regularized model tends to generalize the combination rule better than a complex one.</p>
    <h4>Worked example</h4>
    <p>Say the meta-learner is logistic regression on 3 base models' out-of-fold probabilities, and it learns $\\hat y = \\sigma(0.1 + 1.8\\,z_1 + 0.3\\,z_2 + 2.4\\,z_3)$. The large weight on $z_3$ says the meta-learner has discovered model 3 is unusually reliable and should dominate the blend; the small weight on $z_2$ says model 2 adds little beyond what 1 and 3 already cover \u2014 possibly because it's redundant with them. This is exactly the kind of nuanced, learned weighting that a flat average (Voting) can never express, because it only has one number (the coefficient) per model instead of "1/K each."</p>
    <h4>Real-world use</h4>
    <p>Stacking is the standard endgame in serious ML competitions: take your best 5\u201320 diverse models (different algorithms, different feature sets) and let a meta-learner find the optimal blend, usually squeezing out a final few percent of accuracy beyond any single model or simple voting.</p>
  `}
},
{
  code:'ALGO-03', accent:C.violet,

    });
    svg.appendChild(fadeIn(labelText(500,140,'LEVEL 2 \u2014 final meta-learner',{'font-size':10,fill:C.dim,'font-family':'IBM Plex Mono'}),2.2,0.4));
    metas.forEach((m,mi)=>{

  math:{ title:'How deep should a stack go?', html:`
    <h4>The recursive idea</h4>
    <p>Each level's output is trained the same cross-validated, out-of-fold way as single-level stacking (STACK-01), just using the <em>previous level's</em> out-of-fold predictions as its input instead of raw features:</p>
    <div class="eq">$$z^{(1)}_i = h^{(0)}(x_i), \\qquad z^{(2)}_i = h^{(1)}(z^{(1)}_i), \\qquad \\hat y = h^{(2)}(z^{(2)})$$</div>
    <p>Every level must still use out-of-fold predictions internally &mdash; skip that at any level and you reintroduce exactly the leakage problem the Stacking slide warned about, just one level deeper.</p>
    <h4>Diminishing (and eventually negative) returns</h4>
    <p>Each added level costs another full round of cross-validated training (multiplying compute), while typically buying a shrinking accuracy improvement &mdash; level 1 might add 1\u20132% over the best single model, level 2 might add another 0.1\u20130.3%, and level 3+ often adds noise instead of signal, since the meta-features are getting further and further from the original data and each level compounds a small amount of overfitting risk.</p>
    <h4>Why use multiple level-1 meta-learners at all</h4>
    <p>Different level-1 meta-learners (using different subsets of base models, different feature sets, or different meta-learner algorithms) act like base models one level up: they're diverse "opinions about the opinions," and the Diversity-Accuracy math from earlier in the deck applies recursively &mdash; the final meta-learner benefits from level-1 outputs disagreeing with each other for good reasons, same as any other ensemble layer.</p>
    <h4>Real-world use</h4>
    <p>Winning solutions in high-stakes ML competitions (the Netflix Prize is the most famous historical example) commonly used 2\u20133 level stacks. In production, 2 levels is usually the practical ceiling &mdash; beyond that, the compute and maintenance cost rarely justifies the marginal accuracy gain outside of competitions where every fraction of a percent is worth chasing.</p>
  `}
},

    function gauge(y,label,bVal,sVal){

  math:{ title:'Blending vs. Stacking, quantified', html:`
    <h4>The trade-off in one line</h4>
    <p>Both fit a meta-learner on honest, unseen predictions from base models. Stacking gets those honest predictions for <em>every</em> training point via $K$-fold cross-validation (K training runs per base model). Blending gets them for only the holdout slice, via a single split (1 training run per base model).</p>
    <h4>Why blending is faster</h4>
    <p>If training a base model takes time $T$, stacking costs roughly $K \\cdot T$ per base model (one fit per fold) versus blending's $T$ (one fit, period). For expensive models or many base learners, this difference is significant.</p>
    <h4>Why blending is less data-efficient</h4>
    <p>The holdout slice (commonly 10\u201320% of data) never contributes to training the base models, and the base-model training slice never contributes meta-features. Stacking's cross-validation reuses every point for both roles at different times, extracting more signal from the same amount of data \u2014 at the cost of more compute.</p>
    <h4>Worked numbers</h4>
    <p>3 base models, each taking $T=10$ minutes to train, with 5-fold stacking versus an 80/20 blend: stacking costs $3\\times5\\times10=150$ minutes of training; blending costs $3\\times10=30$ minutes &mdash; 5&times; faster. But blending's meta-learner only ever sees the 20% holdout (e.g. 20,000 rows out of 100,000), while stacking's meta-learner effectively sees honest predictions for all 100,000 &mdash; 5&times; more meta-training data. Neither number is "right"; it's a direct trade of compute for data efficiency.</p>
    <h4>Real-world use</h4>
    <p>Blending is common in fast iteration cycles and Kaggle competitions with large datasets and tight compute/time budgets, where the data-efficiency loss barely matters. Stacking is preferred when data is scarce and every point counts, or when squeezing out maximum accuracy is worth the extra training time.</p>
  `}
},
{
  code:'ALGO-05', accent:C.violet,

  math:{ title:'Ensembling one network instead of many', html:`
    <h4>Snapshot ensembles</h4>
    <p>Train one network with a cyclically-varying learning rate (high, then annealed low, repeated several times). Each time the learning rate bottoms out, the network has settled into a different local minimum of the loss surface; save that snapshot before the next cycle kicks it back out. Average the predictions of all saved snapshots at inference time:</p>
    <div class="eq">$$\\hat y = \\frac{1}{K}\\sum_{k=1}^K f_{\\theta_k}(x)$$</div>
    <p>This gets much of the benefit of training $K$ separate networks, for roughly the cost of training one &mdash; the different minima found along the cyclic schedule tend to make different mistakes, exactly the diversity this whole deck has been chasing.</p>
    <h4>Dropout as an implicit ensemble</h4>
    <p>Randomly zeroing out a fraction $p$ of neurons on every forward pass during training means each pass effectively trains a different, randomly thinned sub-network sharing the same weights. At inference, using the full network with weights scaled by $(1-p)$ approximates averaging over all $2^n$ possible thinned sub-networks &mdash; an ensemble of exponentially many models that never has to be stored or run separately.</p>
    <h4>Deep ensembles</h4>
    <p>The straightforward version: train several full networks independently from different random initializations. Simple, embarrassingly parallel, and empirically one of the strongest known methods for both accuracy and predictive uncertainty estimation in deep learning &mdash; the variance across the independently-initialized networks' predictions is itself a useful signal for "how unsure is the model here."</p>
    <h4>Real-world use</h4>
    <p>Deep ensembles are the standard tool for uncertainty-aware deep learning in safety-critical applications (autonomous driving perception, medical imaging); snapshot ensembles and dropout-based approximations are used when the compute budget can't afford training multiple full networks from scratch.</p>
  `}
},
{

    svg.appendChild(fadeIn(labelText(x0,y+90,'base rate \u2192 add/subtract each feature\u2019s SHAP value \u2192 final prediction, exactly',{'font-size':10.5,fill:C.dim,'font-family':'IBM Plex Mono'}),4.2,0.5));

  math:{ title:'Shapley values, derived from game theory', html:`
    <h4>The question SHAP answers</h4>
    <p>Treat the features as "players" cooperating to produce a prediction (the "payout"). How should credit for the final prediction be fairly split among the features? Shapley values (Nobel-prize-winning game theory, 1953) give the unique answer satisfying a small set of fairness axioms.</p>
    <h4>The formula</h4>
    <div class="eq">$$\\phi_j = \\sum_{S \\subseteq F \\setminus \\{j\\}} \\frac{|S|!\\,(|F|-|S|-1)!}{|F|!} \\Big[v(S \\cup \\{j\\}) - v(S)\\Big]$$</div>
    <p>For every possible subset $S$ of the other features, measure how much adding feature $j$ to that subset changes the model's output ($v$ is the model's prediction given only the features in a subset are "known," the rest averaged out), then average that marginal contribution over every possible subset and every possible order of arrival. This averaging over all orderings is exactly what guarantees fairness: no feature's credit depends on an arbitrary choice of which order you consider features in.</p>
    <h4>Why "exact" additivity is the killer feature</h4>
    <div class="eq">$$f(x) = \\phi_0 + \\sum_{j=1}^p \\phi_j, \\qquad \\phi_0 = \\mathbb{E}[f(x)] \\text{ (the base rate)}$$</div>
    <p>The SHAP values for one prediction add up <em>exactly</em> to that prediction, no residual left over &mdash; visible directly in the waterfall above, where the bars stack precisely onto the final value. TreeSHAP, the algorithm used for tree ensembles specifically, computes this efficiently in polynomial time by exploiting tree structure, rather than the naively exponential $2^{|F|}$ brute-force computation the formula above suggests.</p>
    <h4>Real-world use</h4>
    <p>SHAP is the standard tool for explaining individual predictions from tree ensembles in regulated industries (why was <em>this</em> loan application denied, why was <em>this</em> transaction flagged) where a global feature-importance ranking isn't a specific enough answer.</p>
  `}
},

  math:{ title:'Averaging out the rest of the world', html:`
    <h4>The formula</h4>
    <div class="eq">$$\\text{PDP}_j(v) = \\frac{1}{n}\\sum_{i=1}^n f(v, x_i^{(-j)})$$</div>
    <p>For a chosen value $v$ of feature $j$, replace <em>every</em> training row's feature $j$ with $v$ while keeping all other features $x_i^{(-j)}$ at their real, original values, run the model on all $n$ modified rows, and average the predictions. Repeat for a grid of $v$ values across feature $j$'s range to trace the full curve.</p>
    <h4>Why this differs from just "predict vs. feature j in the raw data"</h4>
    <p>Plotting raw predictions against feature $j$ conflates $j$'s effect with every other feature that happens to be correlated with $j$ in the dataset (e.g. age correlates with years of employment). The PDP's trick of forcing every row to share the same $j$ value while keeping everything else as-observed isolates feature $j$'s marginal effect, averaged over the real joint distribution of everything else.</p>
    <h4>The main caveat</h4>
    <p>PDPs assume feature $j$ can be freely varied independent of the other features. If $j$ is strongly correlated with another feature (e.g. "square footage" and "number of rooms"), some of the synthetic rows the PDP creates (large square footage, but forced to keep an original row's tiny room count) describe combinations that never occur in reality \u2014 the model's response there is extrapolation, not a measured effect. ICE (Individual Conditional Expectation) plots, which show the per-row curves instead of just the average, help spot when this is happening.</p>
    <h4>Real-world use</h4>
    <p>PDPs are the standard way to sanity-check that a tree ensemble has learned a sensible, monotonic-where-expected relationship (tying directly back to the Monotonic Constraints slide) before shipping a model into a regulated or high-stakes setting.</p>
  `}
},
{
  code:'CAL-01', accent:C.blue,
  title:'Probability Calibration \u2014 Does "80% Confident" Mean 80%?',

  caption:'Take every prediction where the model said "70% confident." In a well-calibrated model, close to 70% of those should actually turn out positive.',
  build(svg){
    function toXY(p,a){ return [200+p*500, 380-a*320]; }
    svg.appendChild(fadeIn(line(200,380,700,380,C.line,{'stroke-width':1.3}),0,0.3));
    svg.appendChild(fadeIn(line(200,60,200,380,C.line,{'stroke-width':1.3}),0,0.3));
    svg.appendChild(fadeIn(labelText(450,405,'predicted probability',{'font-size':10.5,fill:C.dim,'font-family':'IBM Plex Mono'}),0.1,0.3));
    svg.appendChild(fadeIn(labelText(175,220,'actual fraction positive',{'font-size':10.5,fill:C.dim,'font-family':'IBM Plex Mono','text-anchor':'end'}),0.1,0.3));

    svg.appendChild(fadeIn(labelText(d2[0]-10,d2[1]+16,'perfect calibration',{'font-size':9,fill:C.dim,'font-family':'IBM Plex Mono','text-anchor':'end'}),0.4,0.3));
    const preds=[0.1,0.3,0.5,0.7,0.9];
    const rawActual=[0.22,0.38,0.5,0.62,0.78];
    const dots=preds.map((p,i)=>{
      const [x,y]=toXY(p,rawActual[i]);
      const c=circle(x,y,6,C.rose);
      svg.appendChild(popIn(c,0.6+i*0.15,0.35));
      return c;
    });
    const rawD=preds.map((p,i)=>{ const [x,y]=toXY(p,rawActual[i]); return `${i===0?'M':'L'}${x},${y}`; }).join(' ');
    svg.appendChild(drawPath(path(rawD,{stroke:C.rose,'stroke-width':1.8,opacity:.7}),1.4,0.7));
    svg.appendChild(fadeIn(labelText(650,toXY(0.9,0.78)[1]-16,'raw ensemble',{'font-size':9.5,fill:C.rose,'font-family':'IBM Plex Mono'}),2.2,0.4));
    svg.appendChild(fadeIn(labelText(400,60,'Platt scaling / isotonic regression \u2192',{'font-size':10,fill:C.green,'font-family':'IBM Plex Mono'}),2.8,0.4));
    preds.forEach((p,i)=>{
      const [tx,ty]=toXY(p,p);
      svg.appendChild(move(dots[i],'cx',dots[i].getAttribute('cx'),tx,3.2+i*0.1,0.8));
      svg.appendChild(move(dots[i],'cy',dots[i].getAttribute('cy'),ty,3.2+i*0.1,0.8));
    });
    svg.appendChild(fadeIn(labelText(650,toXY(0.9,0.9)[1]-16,'calibrated',{'font-size':9.5,fill:C.green,'font-family':'IBM Plex Mono'}),4.2,0.4));

  math:{ title:'Why tree ensembles need a calibration step', html:`
    <h4>Why raw ensemble "probabilities" often aren't real probabilities</h4>
    <p>A Random Forest's "probability" is typically just the fraction of trees voting for a class \u2014 a vote count, not a quantity derived from optimizing a probabilistic loss. Averaging many trees' votes tends to pull predictions toward the middle of the range (few ensembles confidently output 0.98 or 0.02), producing exactly the compressed, "less extreme than reality" pattern in the raw curve above.</p>
    <h4>Platt scaling</h4>
    <p>Fit a simple 1D logistic regression from the ensemble's raw output score $s$ to the true label, on a held-out calibration set:</p>
    <div class="eq">$$P(y=1\\mid s) = \\frac{1}{1+e^{-(A\\cdot s + B)}}$$</div>
    <p>Only 2 parameters ($A,B$) to fit, so it works even with a fairly small calibration set, but it assumes the miscalibration has this specific sigmoid shape.</p>
    <h4>Isotonic regression</h4>
    <p>Fits an arbitrary non-decreasing (monotonic) step function mapping raw scores to calibrated probabilities, without assuming any particular shape. More flexible than Platt scaling, but needs more calibration data to avoid overfitting the calibration mapping itself.</p>
    <h4>Real-world use</h4>
    <p>Calibration matters whenever you use the probability value itself, not just the ranking it implies \u2014 e.g. deciding a loan interest rate from predicted default probability, sizing a bet from a win probability, or setting a risk threshold shared across models. If you only ever take the arg-max class or rank-order items (search ranking, top-k recommendations), miscalibration often doesn't matter at all &mdash; the order is still correct even if the raw numbers aren't.</p>
  `}
},

      svg.appendChild(fadeIn(trainBar,t,0.01));

    svg.appendChild(fadeIn(labelText(500,395,'train window only ever grows forward; test point is always strictly later in time',{'font-size':9.5,fill:C.green,'font-family':'IBM Plex Mono'}),6.2,0.5));

  math:{ title:'Cross-validation that respects time', html:`
    <h4>Why random K-fold breaks on time series</h4>
    <p>Standard K-fold assumes rows are exchangeable (no meaningful order). Time series rows are explicitly ordered and often autocorrelated (today's value is informative about tomorrow's). Randomly assigning rows to folds routinely puts a "future" row in the training fold and an "earlier" row in the test fold \u2014 the model can then partially learn the test period's own trend/seasonality from training data that technically comes from later in time, inflating the validation score in a way that never holds up in production.</p>
    <h4>Walk-forward (expanding or rolling window) validation</h4>
    <div class="eq">$$\\text{Fold}_k:\\; \\text{train on } [1, t_k], \\quad \\text{test on } (t_k, t_k+h]$$</div>
    <p>Each fold's test set is strictly after its train set in time, exactly mimicking the real deployment situation: at any point in production, you only ever have the past to train on and must predict the not-yet-observed future. Sliding $t_k$ forward across several folds gives multiple validation estimates while always respecting this ordering.</p>
    <h4>How this connects to ensembles specifically</h4>
    <p>Bagging's bootstrap sampling (draws with replacement from the whole dataset) and stacking's K-fold out-of-fold predictions both implicitly assume exchangeability too \u2014 applying either naively to time series data can leak future information into a base model's training the same way naive K-fold does. Time-series-safe ensembling typically restricts bootstrap samples and out-of-fold splits to respect chronological order (block bootstrap, walk-forward stacking).</p>
    <h4>Real-world use</h4>
    <p>Any forecasting problem \u2014 demand forecasting, financial time series, sensor-based predictive maintenance \u2014 needs walk-forward validation as a hard requirement, not an optional best practice. A model that "cross-validates" beautifully with random K-fold on time series data is a common, expensive way to ship a broken model to production.</p>
  `}
},

  math:{ title:'Making a trained ensemble cheap to serve', html:`
    <h4>Tree pruning / ensemble selection</h4>
    <p>Not every tree in a large forest or boosted ensemble contributes equally. Greedily test removing (or greedily select, building up from empty) trees using a validation set, keeping only the subset that preserves most of the accuracy:</p>
    <div class="eq">$$S^\\* = \\arg\\min_{S \\subseteq \\{1,\\ldots,B\\}} L_{\\text{val}}\\!\\left(\\tfrac{1}{|S|}\\textstyle\\sum_{b\\in S} \\hat f_b\\right) \\quad \\text{subject to } |S| \\le k$$</div>
    <p>Often 20\u201340% of trees can be dropped with negligible accuracy loss, directly cutting inference time and memory proportionally.</p>
    <h4>Quantization</h4>
    <p>Store split thresholds and leaf values as 8 or 16-bit integers/fixed-point numbers instead of 32-bit floats. Trees only ever compare a feature value to a threshold and read off a leaf value \u2014 operations that tolerate reduced numeric precision far better than, say, the accumulated matrix multiplications inside a deep neural network, so accuracy loss from quantizing tree ensembles is typically minimal.</p>
    <h4>Knowledge distillation</h4>
    <p>Train a single small model (a shallow tree, or even a tiny neural net) to predict the <em>big ensemble's output</em> (soft probabilities, not just the hard label) on a large set of unlabeled or training data:</p>
    <div class="eq">$$\\text{student} = \\arg\\min_g \\sum_i L\\big(g(x_i),\\, f_{\\text{ensemble}}(x_i)\\big)$$</div>
    <p>The ensemble's smoothed, averaged output is a richer training signal than the original hard labels (it encodes some of the ensemble's learned uncertainty and decision boundary shape), which is why a distilled single model often outperforms a same-sized model trained on the raw labels directly.</p>
    <h4>Real-world use</h4>
    <p>Latency-critical serving (real-time bidding, on-device inference, high-throughput APIs) commonly combines all three: prune to the smallest tree count that holds accuracy, quantize what remains, and consider distillation when even a pruned, quantized forest is still too slow or too large to deploy.</p>
  `}
},

  math:{ title:'A closing decision framework', html:`
    <h4>If you want a safe, low-maintenance default</h4>
    <p>Random Forest. Hard to badly misconfigure, resistant to overfitting, gives you feature importance and OOB error for free. Rarely the single most accurate option, but rarely embarrassing either.</p>
    <h4>If you want maximum tabular accuracy and can tune</h4>
    <p>Gradient boosting family (XGBoost / LightGBM / CatBoost). Consistently wins accuracy-focused tabular competitions. Needs more care with learning rate, tree depth, and early stopping to avoid overfitting.</p>
    <h4>If training speed or data size is the bottleneck</h4>
    <p>LightGBM (histogram binning + GOSS + leaf-wise growth) or Extra Trees (skips split search entirely).</p>
    <h4>If your data is full of high-cardinality categorical columns</h4>
    <p>CatBoost \u2014 its ordered target statistics handle this natively, without manual encoding.</p>
    <h4>If you already have several good, independently-built models</h4>
    <p>Start with Voting (free, no retraining). If you have the data and compute budget to spare, move to Stacking for the extra few percent. Use Blending instead of Stacking when you need a faster iteration loop and can afford to sacrifice a holdout slice.</p>
    <h4>The unifying formula</h4>
    <p>Every method in this deck is a special case of one expression:</p>
    <div class="eq">$$\\hat y(x) = \\sum_{k=1}^K \\beta_k \\, h_k(x)$$</div>
    <p>The methods differ only in <em>how $h_k$ and $\\beta_k$ are chosen</em>: Bagging/Random Forest/Extra Trees fit each $h_k$ independently on resampled data with equal $\\beta_k=1/K$. AdaBoost/Gradient Boosting/XGBoost/LightGBM/CatBoost fit each $h_k$ sequentially to correct the running sum, with $\\beta_k$ either derived from each learner's error ($\\alpha_t$ in AdaBoost) or folded into a fixed learning rate $\\nu$. Voting fixes $h_k$ to be already-trained, unrelated models with fixed or manually-set $\\beta_k$. Stacking and Blending also fix $h_k$ to pre-trained models, but <em>learn</em> $\\beta_k$ (and even nonlinear combinations of $h_k$) from data via a meta-learner. Once you see this common skeleton, "which ensemble method should I use" becomes "how much control do I want over $h_k$ vs. $\\beta_k$, and how much compute can I spend getting there."</p>
    <h4>The one universal truth</h4>
    <p>Every method in this deck is ultimately doing the same thing from the very first slide: reducing correlated error by combining multiple imperfect views of the data. The differences are all about <em>how</em> they keep those views usefully different from each other \u2014 and that's the question worth asking of any new ensemble method you meet in the wild.</p>
  `}
},
