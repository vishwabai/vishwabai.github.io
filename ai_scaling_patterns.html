<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI System Scaling Patterns</title>
<style>
  :root{
    --bg:#06080b;
    --panel:#0b0f14;
    --ink:#e9edf2;
    --dim:#7a8494;
    --dim2:#4d5561;
    --line:#232a33;
    --serving:#5b9bd5;
    --batching:#d9a441;
    --caching:#7fb08f;
    --parallel:#b07fae;
    --infra:#5bc0be;
    --retrieval:#d5715b;
    --gateway:#d97fb0;
    --neutral:#8a94a3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',Roboto,system-ui,sans-serif;}
  #stage-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer;}
  #stage{width:1600px;height:900px;background:var(--bg);position:relative;transform-origin:center center;box-shadow:0 0 120px rgba(0,0,0,.9);border-radius:6px;overflow:hidden;}
  svg{width:100%;height:100%;display:block;}
  text{fill:var(--ink);font-family:'Segoe UI',Roboto,system-ui,sans-serif;}
  .mono{font-family:'Cascadia Code','SFMono-Regular',Consolas,monospace;}
  .dim{fill:var(--dim);}
  .dim2{fill:var(--dim2);}
  #ui{position:absolute;inset:0;pointer-events:none;z-index:5;}
  .prog-track{position:absolute;left:0;bottom:0;height:4px;width:100%;background:#14181e;}
  .prog-fill{height:100%;background:var(--serving);transition:width .35s ease;}
  .hint{position:absolute;bottom:12px;right:22px;color:var(--dim2);font-size:12px;font-family:'Cascadia Code',Consolas,monospace;letter-spacing:.03em;}
  .counter{position:absolute;bottom:12px;left:22px;color:var(--dim2);font-size:12px;font-family:'Cascadia Code',Consolas,monospace;}
  body.paused svg *{animation-play-state:paused !important;}
  @keyframes pulseOpac{0%,100%{opacity:.35;}50%{opacity:1;}}
  @keyframes dashFlow{to{stroke-dashoffset:-24;}}
  @keyframes softGlow{0%,100%{opacity:.55;}50%{opacity:1;}}
</style>
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <svg id="svgroot" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 Z" fill="context-fill"/>
        </marker>
        <linearGradient id="fadeR" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0%" stop-color="#000" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <rect id="bgrect" x="0" y="0" width="1600" height="900" fill="var(--bg)"/>
      <g id="layer"></g>
    </svg>
    <div id="ui">
      <div class="prog-track"><div class="prog-fill" id="progfill" style="width:0%"></div></div>
      <div class="hint" id="hintText">click / → next &nbsp; ← back &nbsp; r replay</div>
      <div class="counter" id="counterText">1 / 1</div>
    </div>
  </div>
</div>

<script>
const NS = "http://www.w3.org/2000/svg";
const layer = document.getElementById('layer');
let activeAnims = [];

function el(tag, attrs={}, parent=null){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function grp(attrs={}, parent=layer){ return el('g', attrs, parent); }

function txt(x,y,str,opts={}){
  const attrs = {
    x, y,
    'text-anchor': opts.anchor||'start',
    'font-size': opts.size||24,
    'font-weight': opts.weight||400,
    fill: opts.color||'var(--ink)'
  };
  if(opts.mono) attrs['font-family'] = "'Cascadia Code',Consolas,monospace";
  if(opts.opacity!==undefined) attrs['opacity']=opts.opacity;
  const t = el('text', attrs, opts.parent||layer);
  const lines = Array.isArray(str)?str:[str];
  lines.forEach((line,i)=>{
    const ts = el('tspan',{x, dy: i===0?0:(opts.lh||1.35)+'em'},t);
    ts.textContent = line;
  });
  return t;
}

function rect(x,y,w,h,opts={}){
  return el('rect', Object.assign({
    x,y,width:w,height:h,
    rx: opts.rx!==undefined?opts.rx:10,
    fill: opts.fill||'none',
    stroke: opts.stroke||'var(--line)',
    'stroke-width': opts.sw||1.5,
    opacity: opts.opacity!==undefined?opts.opacity:1
  }, opts.attrs||{}), opts.parent||layer);
}

function box(x,y,w,h,label,opts={}){
  const g = grp({}, opts.parent||layer);
  rect(x,y,w,h,{fill:opts.fill||'rgba(255,255,255,0.03)', stroke:opts.color||'var(--line)', sw:opts.sw||1.6, rx:opts.rx!==undefined?opts.rx:12, parent:g});
  if(label!==undefined && label!==null){
    txt(x+w/2, y+h/2 + (opts.sublabel? -6:6), label, {anchor:'middle', size:opts.size||18, weight:opts.weight||600, color:opts.labelColor||'var(--ink)', parent:g, mono:opts.mono});
  }
  if(opts.sublabel){
    txt(x+w/2, y+h/2+18, opts.sublabel, {anchor:'middle', size:14, color:'var(--dim)', parent:g});
  }
  return g;
}

function connector(x1,y1,x2,y2,opts={}){
  const g = grp({}, opts.parent||layer);
  const line = el('path', {
    d:`M${x1},${y1} L${x2},${y2}`,
    fill:'none', stroke:opts.color||'var(--dim)', 'stroke-width':opts.sw||2,
    'marker-end': opts.noHead?null:'url(#arrowhead)',
    'stroke-dasharray': opts.dashed?'6,5':null
  }, g);
  if(opts.color) line.style.color = opts.color;
  return {g, line};
}

function pill(x,y,text,opts={}){
  const w = opts.w || (text.length*7.5+28);
  const g = grp({}, opts.parent||layer);
  rect(x,y,w,opts.h||26,{rx:13,fill:opts.fill||'rgba(255,255,255,0.05)',stroke:opts.color||'var(--dim2)',sw:1.2,parent:g});
  txt(x+w/2,y+(opts.h||26)/2+5,text,{anchor:'middle',size:12.5,weight:600,color:opts.color||'var(--dim)',parent:g});
  return g;
}

// ---------- entrance animations (Web Animations API, replay-friendly) ----------
function anim(elem, keyframes, opts={}){
  const a = elem.animate(keyframes, Object.assign({duration:500, delay:0, fill:'both', easing:'cubic-bezier(.22,.8,.25,1)'}, opts));
  activeAnims.push(a);
  return a;
}
function fadeUp(elem, delay=0, dur=520, dist=18){
  return anim(elem, [{opacity:0, transform:`translateY(${dist}px)`},{opacity:1, transform:'translateY(0)'}], {delay,duration:dur});
}
function fadeIn(elem, delay=0, dur=450){
  return anim(elem, [{opacity:0},{opacity:1}], {delay,duration:dur});
}
function popIn(elem, delay=0, dur=460){
  return anim(elem, [{opacity:0, transform:'scale(.82)'},{opacity:1, transform:'scale(1)'}], {delay,duration:dur, easing:'cubic-bezier(.34,1.56,.64,1)'});
}
function slideX(elem, fromDx, delay=0, dur=560){
  return anim(elem, [{opacity:0, transform:`translateX(${fromDx}px)`},{opacity:1, transform:'translateX(0)'}], {delay,duration:dur});
}
function growW(elem, fromScale=0, delay=0, dur=600, originAttr='0% 50%'){
  elem.style.transformBox='fill-box';
  elem.style.transformOrigin=originAttr;
  return anim(elem, [{transform:`scaleX(${fromScale})`,opacity:.4},{transform:'scaleX(1)',opacity:1}], {delay,duration:dur});
}
function drawLine(elem, delay=0, dur=650){
  let len=140;
  try{ len = elem.getTotalLength(); }catch(e){}
  elem.style.strokeDasharray = len;
  elem.style.strokeDashoffset = len;
  return anim(elem, [{strokeDashoffset:len},{strokeDashoffset:0}], {delay,duration:dur,easing:'ease-in-out'});
}
function moveAlong(elem, pathData, delay=0, dur=1400, loop=false){
  elem.style.offsetPath = `path('${pathData}')`;
  elem.style.offsetRotate = '0deg';
  return anim(elem, [{offsetDistance:'0%',opacity:0},{offsetDistance:'2%',opacity:1},{offsetDistance:'98%',opacity:1},{offsetDistance:'100%',opacity:0}], {delay,duration:dur, iterations: loop?Infinity:1, easing:'linear'});
}
function pulse(elem, delay=0){
  return anim(elem, [{opacity:.4},{opacity:1},{opacity:.4}], {delay,duration:1600,iterations:Infinity,easing:'ease-in-out'});
}

// ---------- shared layout helpers ----------
const SECTIONS = {
  serving:  {label:'1 · SERVING FUNDAMENTALS', color:'var(--serving)'},
  batching: {label:'2 · BATCHING',              color:'var(--batching)'},
  caching:  {label:'3 · CACHING LAYERS',        color:'var(--caching)'},
  parallel: {label:'4 · PARALLELISM & COMPRESSION', color:'var(--parallel)'},
  infra:    {label:'5 · DISTRIBUTED INFRA',     color:'var(--infra)'},
  retrieval:{label:'6 · RETRIEVAL SCALING',     color:'var(--retrieval)'},
  gateway:  {label:'7 · GATEWAY & ROUTING',     color:'var(--gateway)'},
};

function sectionTag(key, g){
  if(!key) return;
  const s = SECTIONS[key];
  const p = pill(56, 36, s.label, {color:s.color, parent:g, h:28});
  fadeIn(p, 0, 300);
}
function slideTitle(g, main, sub, color){
  const t = txt(800, 108, main, {anchor:'middle', size:38, weight:700, parent:g});
  fadeUp(t, 60, 550, 14);
  if(sub){
    const s = txt(800, 142, sub, {anchor:'middle', size:17, color:'var(--dim)', parent:g});
    fadeUp(s, 160, 500, 10);
    if(color){ const bar = rect(760,158,80,3,{rx:2,fill:color,stroke:'none',parent:g}); growW(bar,0,320,500); }
  }
  return t;
}
function noteBox(x,y,w,lines,opts={}){
  const g = grp({}, opts.parent||layer);
  const h = opts.h || (lines.length*22+30);
  rect(x,y,w,h,{fill:'rgba(255,255,255,0.035)', stroke:opts.color||'var(--dim2)', sw:1.3, rx:10, parent:g});
  const t = txt(x+18,y+26,lines,{size:opts.size||14.5, color:opts.textColor||'var(--dim)', mono:opts.mono, lh:opts.lh||1.55, parent:g});
  fadeUp(g, opts.delay||0, 500, 12);
  return g;
}
function formulaBox(x,y,w,lines,opts={}){
  const g = grp({}, opts.parent||layer);
  const h = opts.h || (lines.length*24+34);
  rect(x,y,w,h,{fill:'rgba(255,255,255,0.045)', stroke:opts.color||'var(--neutral)', sw:1.4, rx:10, parent:g});
  txt(x+16,y+18,'FORMULA',{size:11,weight:700,color:opts.color||'var(--neutral)',parent:g});
  txt(x+18,y+42,lines,{size:opts.size||15.5, color:'var(--ink)', mono:true, lh:1.5, parent:g});
  fadeUp(g, opts.delay||0, 520, 14);
  return g;
}
function bulletList(x,y,items,opts={}){
  const gap = opts.gap||34;
  let cy = y;
  items.forEach((it,i)=>{
    const g = grp({}, opts.parent||layer);
    const lines = opts.wrap ? wrapText(it, opts.wrap) : [it];
    el('circle',{cx:x+4,cy:cy-5,r:3.5,fill:opts.color||'var(--dim)'},g);
    txt(x+18,cy,lines,{size:opts.size||17,color:opts.textColor||'var(--ink)',parent:g,lh:1.3});
    fadeUp(g,(opts.delay||0)+i*(opts.stagger||110), 460, 12);
    cy += gap + (lines.length-1)*(opts.size||17)*1.3;
  });
}
function progressPillars(g, activeKey, x, y){
  const order = ['serving','batching','caching','parallel','infra','retrieval','gateway'];
  const w=205, gapx=8, h=60;
  order.forEach((k,i)=>{
    const s = SECTIONS[k];
    const px = x + i*(w+gapx);
    const isActive = k===activeKey;
    const color = isActive? s.color : 'var(--line)';
    const labelColor = isActive? s.color : 'var(--dim2)';
    const bg = grp({}, g);
    rect(px,y,w,h,{fill: isActive? 'rgba(255,255,255,0.06)':'rgba(255,255,255,0.02)', stroke:color, sw:1.6, rx:9, parent:bg});
    const lines = wrapText(s.label.split(' · ')[1], 15);
    const ty = lines.length>1 ? y+h/2-8 : y+h/2+5;
    txt(px+w/2, ty, lines, {anchor:'middle', size:11.5, weight:700, color:labelColor, lh:1.25, parent:bg});
    popIn(bg, i*90, 420);
    if(isActive) pulse(bg.querySelector('rect'), i*90+420);
  });
}

// ---------- bridge slide: RECAP -> GAP -> FILL ----------
function bridgeSlide(g, opts){
  rect(0,0,1600,900,{fill:'var(--bg)',stroke:'none',rx:0,parent:g});
  pill(700,100,'STOCKTAKE',{color:'var(--dim2)',parent:g,h:26});

  let y = 190;
  const recapLines = wrapText(opts.recap, 62);
  const recap = txt(800, y, recapLines, {anchor:'middle', size:22, weight:600, lh:1.4, parent:g});
  fadeUp(recap, 200, 550, 16);
  y += (recapLines.length-1)*22*1.4 + 80;

  const gapLabel = txt(800, y, 'BUT —', {anchor:'middle', size:13, weight:700, color:'var(--dim2)', parent:g, opacity:0});
  fadeIn(gapLabel, 1300, 300);
  y += 55;

  const gapLines = wrapText(opts.gap, 48);
  const gapQ = txt(800, y, gapLines, {anchor:'middle', size:27, weight:700, color:'var(--ink)', lh:1.4, parent:g, opacity:0});
  fadeUp(gapQ, 1450, 650, 20);
  y += (gapLines.length-1)*27*1.4 + 60;

  const qmark = txt(800, y, '?', {anchor:'middle', size:30, weight:700, color:opts.color||'var(--neutral)', parent:g, opacity:0});
  fadeIn(qmark,1900,400);
  pulse(qmark, 2300);
  y += 65;

  const fillLines = wrapText(opts.fill, 42);
  const boxH = 44 + fillLines.length*28;
  const boxY = Math.min(y, 900-boxH-30);
  const fillWrap = grp({opacity:0}, g);
  fadeUp(fillWrap, 2900, 600, 18);
  rect(430,boxY,740,boxH,{rx:14, fill:'rgba(255,255,255,0.045)', stroke:opts.color||'var(--neutral)', sw:1.8, parent:fillWrap});
  txt(800,boxY+26,'NEXT →', {anchor:'middle', size:12, weight:700, color:opts.color||'var(--neutral)', parent:fillWrap});
  txt(800,boxY+54,fillLines, {anchor:'middle', size:19, weight:700, color:'var(--ink)', lh:1.3, parent:fillWrap});
}
function wrapText(str, maxLen){
  const words = str.split(' ');
  const lines=[]; let cur='';
  words.forEach(w=>{
    if((cur+' '+w).trim().length>maxLen){ lines.push(cur.trim()); cur=w; }
    else cur = (cur+' '+w).trim();
  });
  if(cur) lines.push(cur.trim());
  return lines;
}

// ---------- slide registry ----------
const slides = [];
function S(sectionKey, build){ slides.push({sectionKey, build}); }

// ===================== INTRO =====================
S(null, g=>{
  for(let i=0;i<40;i++){
    const x=Math.random()*1600, y=Math.random()*900;
    const d=el('circle',{cx:x,cy:y,r:Math.random()*1.4+.4,fill:'#3a4552',opacity:.5},g);
    pulse(d, Math.random()*2000);
  }
  const t1=txt(800,380,'AI SYSTEM SCALING PATTERNS',{anchor:'middle',size:46,weight:800,parent:g});
  popIn(t1,300,700);
  const t2=txt(800,432,'from one request to a trillion tokens',{anchor:'middle',size:19,color:'var(--dim)',parent:g});
  fadeUp(t2,900,500,12);
  const line=rect(650,470,300,2,{fill:'var(--neutral)',stroke:'none',rx:1,parent:g});
  growW(line,0,1250,600,'50% 50%');
  const t3=txt(800,520,'32 techniques · 7 pillars · one system',{anchor:'middle',size:14,color:'var(--dim2)',parent:g});
  fadeIn(t3,1700,500);
});

S(null, g=>{
  slideTitle(g,'The Question Underneath Everything','a Feynman-style way to think about scale',null);
  const b1=box(140,260,620,220,null,{fill:'rgba(255,255,255,.03)',color:'var(--serving)',rx:16});
  txt(160,300,'"A model answers ONE question',{size:22,weight:600,parent:g});
  txt(160,332,'in 200 milliseconds.',{size:22,weight:600,parent:g});
  txt(160,384,'How does it answer 200,000',{size:22,weight:700,color:'var(--serving)',parent:g});
  txt(160,416,'questions in that same window —',{size:22,weight:700,color:'var(--serving)',parent:g});
  txt(160,448,'without buying 200,000 GPUs?"',{size:22,weight:700,color:'var(--serving)',parent:g});
  fadeUp(b1,300,600,16);
  [t=>t].forEach(()=>{});
  const items=['Not one trick — a stack of patterns, each solving a specific failure of the layer below it.','Every pattern exists because something upstream got expensive, slow, or full.','We will build the stack bottom-up: serve → batch → cache → shrink/split → orchestrate → retrieve → route.'];
  bulletList(820,300,items,{delay:900,stagger:260,gap:70,color:'var(--serving)',wrap:34});
});

S(null, g=>{
  slideTitle(g,'The Seven Pillars','the roadmap for this deck',null);
  progressPillars(g,'serving',80,220);
  const descs=[
    ['Serving','wrap the model as a service'],
    ['Batching','pack many requests into one pass'],
    ['Caching','never recompute what you already know'],
    ['Parallelism','split a model too big for one GPU'],
    ['Infra','orchestrate many GPUs as one machine'],
    ['Retrieval','scale the knowledge outside the model'],
    ['Gateway','route, protect, and pay for it all'],
  ];
  descs.forEach((d,i)=>{
    const x=80+i*213;
    const t=txt(x+102.5,332,wrapText(d[1],17),{anchor:'middle',size:12.5,color:'var(--dim)',lh:1.35,parent:g});
    fadeUp(t, 700+i*90, 420, 10);
  });
  const arrow=connector(150,420,1450,420,{color:'var(--dim2)',sw:1.5,dashed:true,parent:g});
  drawLine(arrow.line,1600,900);
  const cap=txt(800,470,'each pillar starts because the previous one ran out of road',{anchor:'middle',size:15,color:'var(--dim2)',parent:g,opacity:0});
  fadeIn(cap,2500,500);
});

// ===================== SECTION 1: SERVING =====================
S(null, g=>{
  rect(0,0,1600,900,{fill:'var(--bg)',stroke:'none',parent:g});
  const t=txt(800,430,'PART 1',{anchor:'middle',size:16,weight:700,color:'var(--serving)',parent:g});
  fadeIn(t,200,400);
  const t2=txt(800,490,'Serving Fundamentals',{anchor:'middle',size:44,weight:800,parent:g});
  popIn(t2,450,650);
  const t3=txt(800,536,'turning a trained model into a callable service',{anchor:'middle',size:16,color:'var(--dim)',parent:g});
  fadeUp(t3,950,450,10);
});

S('serving', g=>{
  slideTitle(g,'What Is "Model Serving"?','wrapping weights so the world can call them',SECTIONS.serving.color);
  box(120,220,260,120,'model.weights',{color:'var(--dim2)',fill:'rgba(255,255,255,.03)',sublabel:'GBs on disk',parent:g});
  const c1=connector(380,280,560,280,{color:SECTIONS.serving.color,parent:g});
  const sb=box(560,190,340,180,'SERVING LAYER',{color:SECTIONS.serving.color,fill:'rgba(91,155,213,.08)',sublabel:'load · run forward pass · format output',parent:g});
  popIn(sb,700,550);
  const c2=connector(900,280,1120,280,{color:SECTIONS.serving.color,parent:g});
  box(1120,220,300,120,'HTTP / gRPC API',{color:'var(--dim2)',fill:'rgba(255,255,255,.03)',sublabel:'/v1/completions',parent:g});
  [c1,c2].forEach((c,i)=>drawLine(c.line, 400+i*500, 500));
  noteBox(180,470,1240,[
    'Serving = everything between a checkpoint file and an answer: loading weights onto a device, running the forward pass,',
    'tokenizing / detokenizing, and exposing it behind a stable interface.  Frameworks like vLLM, TensorRT-LLM, Triton and',
    'TorchServe all live in this layer — they differ in HOW they do steps 2–5 below, which is the rest of this deck.'
  ],{color:SECTIONS.serving.color,delay:1400,h:110});
});

S('serving', g=>{
  slideTitle(g,'Two Very Different Jobs','online vs. batch inference',SECTIONS.serving.color);
  const L=box(110,200,650,320,null,{color:SECTIONS.serving.color,fill:'rgba(91,155,213,.06)',rx:16});
  txt(140,240,'ONLINE INFERENCE',{size:20,weight:700,color:SECTIONS.serving.color,parent:g});
  bulletList(140,280,['one user, one request, right now','optimizes LATENCY (P50 / P99 ms)','chat, search, autocomplete'],{delay:600,color:SECTIONS.serving.color,gap:40});
  const dot=el('circle',{cx:660,cy:250,r:6,fill:SECTIONS.serving.color},g); pulse(dot,1200);

  const R=box(840,200,650,320,null,{color:'var(--dim2)',fill:'rgba(255,255,255,.03)',rx:16});
  txt(870,240,'BATCH INFERENCE',{size:20,weight:700,color:'var(--dim2)',parent:g});
  bulletList(870,280,['millions of items, no one waiting','optimizes THROUGHPUT (items / sec)','nightly embeddings, offline scoring'],{delay:900,color:'var(--dim2)',gap:40});
  [L,R].forEach((b,i)=>fadeUp(b,200+i*150,550,16));

  formulaBox(110,560,1380,['latency_SLA(online)  ≪  latency(batch)          throughput(batch)  ≫  throughput(online)','→ same model, opposite optimization target → usually two different serving configs'],{color:SECTIONS.serving.color,delay:1500,h:90});
});

S('serving', g=>{
  slideTitle(g,'The Middle Ground: Async Inference','submit now, collect later',SECTIONS.serving.color);
  const stages=[['Client',120],['Queue',430],['Worker Pool',740],['Result Store',1060],['Webhook / Poll',1330]];
  stages.forEach((s,i)=>{
    const bx=box(s[1],250,220,110,s[0],{color:i===2?SECTIONS.serving.color:'var(--dim2)',fill:i===2?'rgba(91,155,213,.1)':'rgba(255,255,255,.03)',parent:g});
    popIn(bx, i*260, 500);
  });
  for(let i=0;i<4;i++){
    const x1=120+ (i===0?220:0) + (i>0? [430,740,1060][i-1]+220-120:0);
  }
  const xs=[340,650,960,1280];
  const conns=[[340,305,430,305],[650,305,740,305],[960,305,1060,305],[1280,305,1330,305]];
  conns.forEach((c,i)=>{ const cc=connector(c[0],c[1],c[2],c[3],{color:SECTIONS.serving.color,parent:g}); drawLine(cc.line, 260+i*260, 400); });
  const pk=el('circle',{r:7,fill:SECTIONS.serving.color},g);
  moveAlong(pk,'M 120 400 L 1450 400',600,2600,false);
  txt(120,440,'ticket: job_id=8f21…',{size:13,color:'var(--dim)',mono:true,parent:g,opacity:0});
  noteBox(150,520,1300,[
    'Client gets a job_id back immediately — no open connection waiting on GPU time.',

S('batching', g=>{
  slideTitle(g,'Continuous (In-Flight) Batching','free a slot the instant a sequence finishes — refill immediately',SECTIONS.batching.color);
  const rows=4, cols=14, cellW=76, cellH=44, x0=180, y0=210;
  // simulate finishing times per row and a new arrival taking the slot
  const finishAt=[6,10,14,8];
  const newSeqStart=[7,11,-1,9];
  for(let r=0;r<rows;r++){
    txt(x0-40,y0+r*(cellH+14)+28,'slot '+(r+1),{size:12,color:'var(--dim)',anchor:'end',parent:g});
    for(let c=0;c<cols;c++){
      let color, delayMs;
      if(c<finishAt[r]){ color=SECTIONS.batching.color; }
      else if(newSeqStart[r]>=0 && c>=newSeqStart[r]){ color='var(--caching)'; }
      else { color=null; }
      if(color){
        const cell=rect(x0+c*cellW,y0+r*(cellH+14),cellW-6,cellH,{fill:color+'2b'.replace('2b',''),stroke:color,sw:1.3,rx:5,parent:g});
        cell.setAttribute('fill', color==='var(--caching)'?'rgba(127,176,143,.18)':'rgba(217,164,65,.18)');
        popIn(cell, 300+c*45+r*30, 260);
      }
    }
  }
  txt(x0, y0-26,'time steps →',{size:13,color:'var(--dim)',parent:g});
  pill(1290,208,'req A finishes',{color:SECTIONS.batching.color,parent:g,h:24});
  pill(1290,244,'req B slots in',{color:'var(--caching)',parent:g,h:24});
  noteBox(180,470,1240,[
    'Scheduling happens every ITERATION, not every batch: the moment one sequence emits its end token, its row is',
    'free and the scheduler slots in a new request — no waiting for the whole batch to drain (popularized by Orca,',
    'now the default engine loop in vLLM, TGI and TensorRT-LLM). This is what turns idle "empty seats" into throughput.'
  ],{color:SECTIONS.batching.color,delay:2100,h:105});
});

// ---------- engine ----------
let idx = 0;
function render(i){
  layer.innerHTML='';
  activeAnims = [];
  const s = slides[i];
  sectionTag(s.sectionKey, layer);
  s.build(layer);
  document.getElementById('progfill').style.width = ((i+1)/slides.length*100)+'%';
  document.getElementById('counterText').textContent = (i+1)+' / '+slides.length;
}
function next(){ if(idx<slides.length-1){ idx++; render(idx); } }
function prev(){ if(idx>0){ idx--; render(idx); } }
function replay(){ render(idx); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.key.toLowerCase()==='r'){ replay(); }
  else if(e.key==='Home'){ idx=0; render(idx); }
  else if(e.key==='End'){ idx=slides.length-1; render(idx); }
});
document.getElementById('stage-wrap').addEventListener('click', ()=>{ next(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ activeAnims.forEach(a=>{ try{a.pause();}catch(e){} }); document.body.classList.add('paused'); }
  else { activeAnims.forEach(a=>{ try{a.play();}catch(e){} }); document.body.classList.remove('paused'); }
});
function fitStage(){
  const stage = document.getElementById('stage');
  const scale = Math.min(window.innerWidth/1600, window.innerHeight/900);
  stage.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitStage);
fitStage();
render(0);
</script>
