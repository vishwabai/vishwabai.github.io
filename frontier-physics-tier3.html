<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Frontier Physics · Tier 3 — an animated deck</title>
<style>
  :root{
    --bg:#07070b; --ink:#e7e9ee; --dim:#8b93a3; --faint:#454b58;
    --blue:#5b8fb0; --teal:#5fae95; --sand:#d3ac6b; --clay:#c77b6b;
    --plum:#9a7fb0; --green:#79a86b;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; background:#000; overflow:hidden; font-family:"Segoe UI",Inter,system-ui,-apple-system,sans-serif; color:var(--ink)}
  .wrap{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(1200px 700px at 50% 40%, #0c0d13 0%, #000 75%)}
  .stage{
    position:relative;
    width:min(100vw, 177.78vh);
    height:min(56.25vw, 100vh);
    background:var(--bg);
    box-shadow:0 0 0 1px #14161d, 0 30px 80px rgba(0,0,0,.6);
    overflow:hidden;
  }
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  .hud{position:absolute; inset:0; pointer-events:none}
  .section-label{
    position:absolute; left:3.2%; top:5%;
    font-size:1.05vh; letter-spacing:.34em; text-transform:uppercase;
    color:var(--dim); font-weight:600;
  }
  .section-label .accent{display:inline-block; width:2.4vh; height:1px; background:currentColor; vertical-align:middle; margin-right:1vh; opacity:.6}
  .title{
    position:absolute; left:3.2%; right:3.2%; top:8.4%;
    font-size:3.2vh; font-weight:600; letter-spacing:.01em; line-height:1.1;
  }
  .subtitle{position:absolute; left:3.2%; right:3.2%; top:14.4%; font-size:1.55vh; color:var(--dim); font-weight:400}
  /* narration band */
  .narration{
    position:absolute; left:3.2%; right:3.2%; bottom:6.4%;
    min-height:8vh;
    display:flex; align-items:flex-end; gap:1.6vh;
  }
  .chip{
    flex:0 0 auto; font-size:1.15vh; letter-spacing:.22em; text-transform:uppercase; font-weight:700;
    padding:.55vh 1vh; border:1px solid currentColor; border-radius:3px; opacity:.9;
    margin-bottom:.2vh;
  }
  .k-recap{color:var(--teal)} .k-gap{color:var(--clay)} .k-fill{color:var(--blue)}
  .k-note{color:var(--dim)} .k-apply{color:var(--green)} .k-idea{color:var(--sand)} .k-plum{color:var(--plum)}
  .ntext{font-size:2.05vh; line-height:1.32; font-weight:400; color:var(--ink); max-width:88%}
  .ntext .q{color:var(--clay); font-weight:600}
  .ntext b{color:var(--sand); font-weight:600}
  .nblock{transition:opacity .5s ease, transform .5s ease}
  .nblock.hidden{opacity:0; transform:translateY(8px)}
  /* controls */
  .controls{position:absolute; right:2.4%; bottom:2%; display:flex; align-items:center; gap:1.1vh; pointer-events:auto}
  .btn{
    -webkit-appearance:none; appearance:none; cursor:pointer;
    background:#11131a; color:var(--ink); border:1px solid #262a34; border-radius:5px;
    font-size:1.4vh; padding:.85vh 1.5vh; letter-spacing:.02em; font-family:inherit;
    transition:background .15s, border-color .15s, opacity .15s;
  }
  .btn:hover{background:#181b24; border-color:#39404d}
  .btn:disabled{opacity:.32; cursor:default}
  .btn.primary{border-color:#39505f; color:#cfe2ec}
  .counter{position:absolute; left:2.6%; bottom:2.4%; font-size:1.35vh; color:var(--dim); letter-spacing:.05em; pointer-events:none}
  .progress{position:absolute; left:0; top:0; height:2px; background:linear-gradient(90deg,var(--blue),var(--teal)); width:0%; transition:width .35s ease}
  .dots{position:absolute; left:50%; bottom:2.4%; transform:translateX(-50%); display:flex; gap:.7vh; pointer-events:none}
  .dot{width:.7vh; height:.7vh; border-radius:50%; background:#2a2f3a; transition:background .3s, transform .3s}
  .dot.on{background:var(--blue); transform:scale(1.25)}
  .dot.sec{background:#4a4030}
  .hint{position:absolute; right:2.6%; top:5%; font-size:1.15vh; color:var(--faint); letter-spacing:.12em; text-transform:uppercase}
  .flash{animation:fl .5s ease}
  @keyframes fl{from{opacity:.25}to{opacity:1}}
  .kbd{display:inline-block; border:1px solid #333a46; border-bottom-width:2px; border-radius:4px; padding:0 .6vh; font-size:1.05vh; color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="hud">
      <div class="progress" id="prog"></div>
      <div class="section-label" id="sec"><span class="accent"></span><span id="sect"></span></div>
      <div class="title" id="title"></div>
      <div class="subtitle" id="subtitle"></div>
      <div class="hint">click / <span class="kbd">→</span> next · <span class="kbd">R</span> replay</div>
      <div class="narration">
        <div class="nblock hidden" id="nblock">
          <div style="display:flex; align-items:flex-end; gap:1.6vh">
            <span class="chip k-note" id="chip">NOTE</span>
            <span class="ntext" id="ntext"></span>
          </div>
        </div>
      </div>
      <div class="counter" id="counter"></div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="controls">
      <button class="btn" id="prev">‹ Prev</button>
      <button class="btn" id="replay">↻ Replay</button>
      <button class="btn primary" id="next">Next ›</button>
    </div>
  </div>
</div>
<script>
/* =========================================================================
   FRONTIER PHYSICS · TIER 3 — standalone animated deck (no dependencies)
   Engine: canvas 2D, timeline-per-slide, RECAP→GAP→FILL narration beats.
   ========================================================================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1280, H = 720;                 // logical resolution (16:9)
function resize(){
  const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize(); addEventListener('resize', resize);

/* ---- palette (muted, non-glowing) ---- */
const C = {
  bg:'#07070b', ink:'#e7e9ee', dim:'#8b93a3', faint:'#525866',
  blue:'#5b8fb0', teal:'#5fae95', sand:'#d3ac6b', clay:'#c77b6b',
  plum:'#9a7fb0', green:'#79a86b', grid:'#191d26', line:'#333a46'
};

/* ---- math + easing ---- */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=x=>{x=clamp(x,0,1); return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const easeOut=x=>{x=clamp(x,0,1); return 1-Math.pow(1-x,3);};
const seg=(t,start,dur)=>ease(clamp((t-start)/dur,0,1));       // build-in 0..1
const segL=(t,start,dur)=>clamp((t-start)/dur,0,1);            // linear 0..1
const TAU=Math.PI*2;

/* ---- primitive draw helpers ---- */
function line(x1,y1,x2,y2,color,w=1.5,alpha=1,dash=null){
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=w;
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrow(x1,y1,x2,y2,color,w=2,alpha=1,head=9){
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=w;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-head*Math.cos(a-0.4), y2-head*Math.sin(a-0.4));
  ctx.lineTo(x2-head*Math.cos(a+0.4), y2-head*Math.sin(a+0.4));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function dot(x,y,r,color,alpha=1){ ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); ctx.restore(); }
function ring(x,y,r,color,w=2,alpha=1){ ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=w; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke(); ctx.restore(); }
function rrect(x,y,w,h,r,{stroke,fill,alpha=1,lw=1.5}={}){
  ctx.save(); ctx.globalAlpha=alpha; ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke();}
  ctx.restore();
}
function label(x,y,text,{color=C.ink,size=16,align='center',baseline='middle',alpha=1,weight=400,italic=false,font='sans'}={}){
  ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=color;
  const fam = font==='serif' ? 'Georgia, "Times New Roman", serif' : '"Segoe UI", Inter, system-ui, sans-serif';
  ctx.font=`${italic?'italic ':''}${weight} ${size}px ${fam}`;
  ctx.textAlign=align; ctx.textBaseline=baseline; ctx.fillText(text,x,y); ctx.restore();
}
function glowDot(x,y,r,color,alpha=1){ // very subtle, restrained glow
  ctx.save(); ctx.globalAlpha=alpha*0.35; ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(x,y,r*2.4,0,TAU); ctx.fill();
  ctx.globalAlpha=alpha; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); ctx.restore();
}
// hex -> rgba
function rgba(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

/* ---- slide registry ---- */
const SLIDES=[];
function addSlide(o){ SLIDES.push(o); }

/* ---- shared scene helpers ---- */
function person(x,y,s,color,alpha=1){
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=s*0.14;
  ctx.beginPath(); ctx.arc(x,y-s*0.75,s*0.2,0,TAU); ctx.fill();               // head
  ctx.beginPath(); ctx.moveTo(x,y-s*0.55); ctx.lineTo(x,y-s*0.1); ctx.stroke();// torso
  ctx.beginPath(); ctx.moveTo(x-s*0.22,y-s*0.4); ctx.lineTo(x+s*0.22,y-s*0.4); ctx.stroke(); // arms
  ctx.beginPath(); ctx.moveTo(x,y-s*0.1); ctx.lineTo(x-s*0.18,y+s*0.28);
  ctx.moveTo(x,y-s*0.1); ctx.lineTo(x+s*0.18,y+s*0.28); ctx.stroke();          // legs
  ctx.restore();
}
// sinusoidal wave polyline helper
function wave(x0,x1,yc,amp,k,phase,color,w=2,alpha=1,steps=120){
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=w; ctx.beginPath();
  for(let i=0;i<=steps;i++){ const x=lerp(x0,x1,i/steps); const y=yc-amp*Math.sin(k*(x-x0)+phase); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.stroke(); ctx.restore();
}

/* =====================================================================
   0 · COVER
   ===================================================================== */
addSlide({
  cover:true,
  enter(){ this.st={stars:Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,s:Math.random()*.3+.05}))}; },
  draw(t){
    // drifting starfield
    for(const s of this.st.stars){ s.x-=s.s; if(s.x<0)s.x=W; dot(s.x,s.y,s.r,'#5a6270', 0.5+0.4*Math.sin(t+ s.y)); }
    // faint curved grid dip forming
    const cx=W/2, cy=430, sp=54, prog=seg(t,0.3,2.2);
    ctx.save(); ctx.globalAlpha=0.5*prog;
    for(let gv=-4;gv<=4;gv++){ ctx.strokeStyle=C.grid; ctx.lineWidth=1; ctx.beginPath();
      for(let gu=-9;gu<=9;gu++){ const r=Math.hypot(gu,gv); const d=42/(r*0.5+1.1);
        const sx=cx+gu*sp, sy=cy+gv*sp*0.42+d; gu===-9?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);} ctx.stroke(); }
    for(let gu=-9;gu<=9;gu+=1){ ctx.strokeStyle=C.grid; ctx.beginPath();
      for(let gv=-4;gv<=4;gv++){ const r=Math.hypot(gu,gv); const d=42/(r*0.5+1.1);
        const sx=cx+gu*sp, sy=cy+gv*sp*0.42+d; gv===-4?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);} ctx.stroke(); }
    ctx.restore();
    // title
    label(W/2,250,'FRONTIER PHYSICS', {size:64,weight:600,color:C.ink,alpha:seg(t,0.4,1.2),font:'serif',align:'center'});
    label(W/2,305,'T I E R   3', {size:22,weight:600,color:C.sand,alpha:seg(t,0.9,1),align:'center'});
    line(W/2-230,335,W/2+230,335,C.line,1,seg(t,1.1,1));
    label(W/2,362,'General Relativity · Quantum Fields · Condensed Matter · Nuclei · Chaos', {size:16,color:C.dim,alpha:seg(t,1.4,1.2),align:'center'});
    label(W/2,640,'one language underneath it all: symmetry, fields, and the geometry of change', {size:15,color:C.faint,italic:true,alpha:seg(t,2.2,1.4),align:'center'});
  },
  beats:[{at:0.2,k:'idea',t:'Five frontiers of physics — each one is really a story about <b>how a field responds to a change.</b> We build them one gap at a time.'}]
});

/* =====================================================================
   I · GENERAL RELATIVITY — section cover
   ===================================================================== */
addSlide({
  section:'I · General Relativity', title:'What is gravity, really?',
  subtitle:'Newton gave us a force. Einstein gave us a shape.',
  enter(){},
  draw(t){
    const cx=W/2, cy=380;
    // an apple falling next to a bending grid — teaser
    const grid=seg(t,0.4,1.6);
    ctx.save(); ctx.globalAlpha=0.55*grid;
    for(let gv=-3;gv<=3;gv++){ ctx.strokeStyle=C.grid; ctx.beginPath();
      for(let gu=-8;gu<=8;gu++){ const r=Math.hypot(gu,gv); const d=60/(r*0.55+1); const sx=cx+gu*48, sy=cy+gv*48*0.42+d; gu===-8?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);} ctx.stroke(); }
    ctx.restore();
    dot(cx,cy+10,14,C.sand,0.4+0.5*grid);
    label(cx,cy+40,'mass', {size:13,color:C.dim,alpha:grid});
    label(W/2,560,'"A person falling off a roof feels no gravity."  — the thought that started it all',{size:16,italic:true,color:C.faint,alpha:seg(t,1.6,1.4)});
  },
  beats:[
    {at:0.3,k:'gap',t:'Newton\u2019s law predicts orbits beautifully \u2014 <span class="q">but why does gravity pull every object with the exact same acceleration, regardless of mass?</span>'},
    {at:5,k:'note',t:'That single coincidence is the crack we pry open. Follow it and gravity stops being a force at all.'}
  ]
});

/* ---- Equivalence principle ---- */
addSlide({
  section:'I · General Relativity', title:'The Equivalence Principle',
  subtitle:'Standing on Earth vs. accelerating in a rocket — can any experiment tell them apart?',
  enter(){},
  draw(t){
    const pw=300, ph=310, top=200;
    const lx=300, rx=980;
    const tt=(t%3.0);
    const drop=y0=>{ const tau=clamp(tt,0,1.55); return y0 + 0.5*380*tau*tau; };
    // ---- LEFT: rocket in space ----
    rrect(lx-pw/2, top, pw, ph, 8, {stroke:C.line, lw:1.5, alpha:seg(t,0.2,0.8)});
    label(lx,top-16,'DEEP SPACE · engine on', {size:13,color:C.dim,alpha:seg(t,0.3,0.8),letterSpacing:2});
    person(lx-70, top+250, 66, C.blue, seg(t,0.5,0.8));
    // ball
    const by=Math.min(drop(top+70), top+250);
    dot(lx+40, by, 9, C.sand, seg(t,0.9,0.6));
    // acceleration arrow (rocket pushes floor up)
    arrow(lx+120, top+250, lx+120, top+250-90*seg(t,1.2,1), C.clay, 3, seg(t,1.2,1));
    label(lx+150, top+205,'a', {size:20,color:C.clay,italic:true,font:'serif',alpha:seg(t,1.4,1)});
    // flame
    const fl=6+4*Math.sin(t*20);
    ctx.save(); ctx.globalAlpha=seg(t,0.5,1); ctx.fillStyle=C.clay;
    ctx.beginPath(); ctx.moveTo(lx-14,top+ph); ctx.lineTo(lx+14,top+ph); ctx.lineTo(lx,top+ph+22+fl); ctx.closePath(); ctx.fill(); ctx.restore();

    // ---- RIGHT: room on Earth ----
    rrect(rx-pw/2, top, pw, ph, 8, {stroke:C.line, lw:1.5, alpha:seg(t,0.2,0.8)});
    label(rx,top-16,'ON EARTH · at rest', {size:13,color:C.dim,alpha:seg(t,0.3,0.8)});
    person(rx-70, top+250, 66, C.teal, seg(t,0.5,0.8));
    dot(rx+40, Math.min(drop(top+70),top+250), 9, C.sand, seg(t,0.9,0.6));
    arrow(rx+120, top+250, rx+120, top+250-90*seg(t,1.2,1), C.clay, 3, seg(t,1.2,1));
    label(rx+150, top+205,'g', {size:20,color:C.clay,italic:true,font:'serif',alpha:seg(t,1.4,1)});
    // ground hatching
    ctx.save(); ctx.globalAlpha=seg(t,0.4,1); ctx.strokeStyle=C.faint;
    for(let i=0;i<12;i++){ line(rx-pw/2+i*26, top+ph, rx-pw/2+i*26+14, top+ph+14, C.faint,1); } ctx.restore();

    // equality
    label(W/2, top+120,'\u2261', {size:60,color:C.sand,alpha:seg(t,2.2,1),font:'serif'});
    label(W/2, top+180,'identical', {size:14,color:C.dim,alpha:seg(t,2.4,1)});
  },
  beats:[
    {at:0.2,k:'recap',t:'The clue: gravity accelerates <b>everything</b> the same way \u2014 feather and hammer alike.'},
    {at:3.2,k:'gap',t:'So drop a ball in a windowless box. <span class="q">Is the box sitting on a planet, or accelerating through empty space?</span>'},
    {at:6.5,k:'fill',t:'No local experiment can tell. <b>Gravity and acceleration are the same thing.</b> That\u2019s the Equivalence Principle.'},
    {at:10,k:'apply',t:'Consequence: gravity bends light and slows clocks \u2014 because it\u2019s just geometry of the frame. Verified to 15 decimal places.'}
  ]
});

/* ---- Spacetime curvature ---- */
addSlide({
  section:'I · General Relativity', title:'Matter Curves Spacetime',
  subtitle:'The rubber-sheet: a mass dips the grid, and free motion follows the dip.',
  enter(){},
  draw(t){
    const cx=W/2, cy=400, sp=58, prog=seg(t,0.3,1.8);
    const proj=(u,v)=>{ const r=Math.hypot(u,v); const d=95/(r*0.5+0.9); return {x:cx+u*sp, y:cy+v*sp*0.42+d, d}; };
    // grid rows/cols
    ctx.save(); ctx.globalAlpha=0.85*prog;
    for(let gv=-4;gv<=4;gv++){ ctx.strokeStyle=C.grid; ctx.lineWidth=1.2; ctx.beginPath();
      for(let gu=-9;gu<=9;gu++){ const p=proj(gu,gv); gu===-9?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);} ctx.stroke(); }
    for(let gu=-9;gu<=9;gu++){ ctx.strokeStyle=C.grid; ctx.beginPath();
      for(let gv=-4;gv<=4;gv++){ const p=proj(gu,gv); gv===-4?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);} ctx.stroke(); }
    ctx.restore();
    // central mass
    const m=proj(0,0); glowDot(m.x,m.y+4,17,C.sand,prog); label(m.x,m.y+38,'M',{size:16,color:C.dim,italic:true,font:'serif',alpha:prog});
    // orbiting test body (geodesic)
    const orbP=seg(t,1.8,1);
    if(orbP>0){ const th=t*1.15; const rr=3.0+0.35*Math.sin(t*1.3); const p=proj(rr*Math.cos(th), rr*Math.sin(th));
      // trail
      ctx.save(); ctx.globalAlpha=0.5*orbP; ctx.strokeStyle=C.blue; ctx.lineWidth=1.4; ctx.beginPath();
      for(let a=0;a<TAU;a+=0.08){ const q=proj(rr*Math.cos(th-a), rr*Math.sin(th-a)); a===0?ctx.moveTo(q.x,q.y):ctx.lineTo(q.x,q.y);} ctx.stroke(); ctx.restore();
      dot(p.x,p.y-4,7,C.blue,orbP);
    }
    label(W/2,585,'no string, no pull \u2014 the ball just rolls straight, and \u201cstraight\u201d is now curved',{size:15,italic:true,color:C.faint,alpha:seg(t,3,1.4)});
  },
  beats:[
    {at:0.2,k:'recap',t:'We turned gravity into geometry. Now picture spacetime as a flexible <b>grid</b>.'},
    {at:3,k:'gap',t:'A mass sits on it. <span class="q">If there\u2019s no force, why does a passing planet curve toward it?</span>'},
    {at:6.5,k:'fill',t:'Because the grid itself is dented. The planet travels the <b>straightest possible line</b> \u2014 which, on a curved sheet, loops into an orbit.'},
    {at:10,k:'apply',t:'GPS depends on this: satellite clocks run ~38 \u00b5s/day fast. Ignore curvature and your position drifts ~10 km/day.'}
  ]
});

/* ---- Geodesics ---- */
addSlide({
  section:'I · General Relativity', title:'Geodesics: \u201cStraight\u201d on a Curved World',
  subtitle:'Two travelers never turn — yet on a sphere they collide. Curvature made visible.',
  enter(){},
  draw(t){
    // LEFT: flat plane, parallels stay parallel
    const lx=340, ly=380;
    label(lx,200,'FLAT SPACE',{size:14,color:C.dim,alpha:seg(t,0.3,0.8)});
    ctx.save(); ctx.globalAlpha=0.5*seg(t,0.3,1); ctx.strokeStyle=C.grid;
    for(let i=-3;i<=3;i++){ line(lx-160,ly+i*30,lx+160,ly+i*30,C.grid,1); line(lx+i*45,ly-100,lx+i*45,ly+100,C.grid,1);} ctx.restore();
    const p=segL(t,1,4);
    arrow(lx-90,ly+40,lx-90,ly+40-160*p,C.teal,2.5,seg(t,1,0.5));

/* ---- Bloch's theorem ---- */
addSlide({
  section:'III · Condensed Matter', title:'Bloch\u2019s Theorem',
  subtitle:'In a perfect lattice, electrons flow as free waves \u2014 they do not scatter at all.',
  enter(){},
  draw(t){
    const x0=180, x1=1100, d=84, baseY=500;

    ctx.save(); ctx.globalAlpha=0.5*seg(t,0.3,1); ctx.strokeStyle=C.grid; ctx.lineWidth=1.4; ctx.beginPath();
    for(let x=x0;x<=x1;x+=3){ let v=0; for(const c of cores) v+=Math.exp(-Math.pow((x-c)/22,2)); const y=baseY - 18*v; x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke(); ctx.restore();
    for(const c of cores){ dot(c,baseY,6,C.sand,seg(t,0.4,1)); }
    label(x1+4,baseY,'ions',{size:13,color:C.dim,align:'left',alpha:seg(t,0.4,1)});
    // Bloch wave psi = e^{ikx} u(x): carrier * periodic envelope
    const yc=320, w=seg(t,1.2,1.2);
    ctx.save(); ctx.globalAlpha=w; ctx.strokeStyle=C.blue; ctx.lineWidth=2.4; ctx.beginPath();
    for(let x=x0;x<=x1;x+=2){ const u=0.55+0.45*Math.cos(TAU*(x-x0)/d);           // lattice-periodic part

    if(w>0.5){ ctx.save(); ctx.globalAlpha=0.3*(w-0.5)*2; ctx.fillStyle=C.blue;

    label(W/2,246,'free travelling wave  \u00d7  something with the lattice\u2019s period',{size:14,color:C.dim,alpha:seg(t,2.8,1)});
    label(W/2,585,'the grid isn\u2019t an obstacle \u2014 it\u2019s the medium. Resistance comes only when the grid is imperfect.',{size:15,italic:true,color:C.faint,alpha:seg(t,4,1.4)});
  },

    {at:6,k:'note',t:'So a perfect crystal has <b>zero</b> resistance. Real resistance = defects, impurities, and vibrations breaking the perfection.'},

addSlide({

  enter(){

    this.st={bx,by,bw,bh,nuclei,neutrons:[{x:bx+6,y:by+bh/2,vx:150,vy:20}],flashes:[],rods:[bx+bw*0.42,bx+bw*0.68],resetAt:0};

      for(const n of s.neutrons){ n.x+=n.vx*dt; n.y+=n.vy*dt;

    label(bx+bw+30, by+78,'rods hold k \u2248 1',{size:13,color:C.teal,align:'left',alpha:seg(t,1,1)});

    label(bx+bw+30, by+140,'pull rods out \u2192 k > 1',{size:13,color:C.clay,align:'left',alpha:seg(t,2,1)});
    label(bx+bw+30, by+162,'\u2192 exponential runaway',{size:12,color:C.faint,align:'left',alpha:seg(t,2.2,1)});
    label(W/2,555,'a reactor is not a slow bomb \u2014 it is a fast reaction held on a knife-edge by absorption',{size:15,italic:true,color:C.faint,alpha:seg(t,4,1.4)});

      const den=(2*m1+m2-m2*Math.cos(2*th1-2*th2));
      const a1=(-g*(2*m1+m2)*Math.sin(th1) - m2*g*Math.sin(th1-2*th2) - 2*Math.sin(d)*m2*(w2*w2*l2 + w1*w1*l1*Math.cos(d)))/(l1*den);

    const stepOne=(s,h)=>{ const [a1,a2]=accel(s); s.w1+=a1*h; s.w2+=a2*h; s.th1+=s.w1*h; s.th2+=s.w2*h; };

      for(let i=0;i<s.trail.length;i++){ ctx.globalAlpha=i/s.trail.length*0.6; const p=s.trail[i]; i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); } ctx.stroke(); ctx.restore();
      line(pv.x,pv.y,x1,y1,col,2.4); line(x1,y1,x2,y2,col,2.4);
      dot(x1,y1,6,col); dot(x2,y2,8,col); return {x2,y2}; };
    const b=draw(this.st.B,C.clay,rgba(C.clay,0.5));
    const a=draw(this.st.A,C.blue,rgba(C.blue,0.5));
    dot(pv.x,pv.y,5,C.dim);
    const sep=Math.hypot(a.x2-b.x2,a.y2-b.y2);
    label(W/2,560,'they were one system a moment ago \u2014 now their tips are worlds apart',{size:15,italic:true,color:C.faint,alpha:seg(t,4,1.4)});
    // separation readout
    label(190,300,'tip separation',{size:12,color:C.dim,align:'left'}); rrect(190,314,150,10,3,{stroke:C.line,lw:1});
    rrect(190,314,clamp(sep/240,0,1)*150,10,3,{fill:rgba(C.sand,0.85)});
  },
  beats:[
    {at:0.2,k:'recap',t:'A double pendulum obeys Newton exactly \u2014 no randomness anywhere.'},
    {at:3,k:'fill',t:'Two copies start 0.001 rad apart. For a moment they move as one\u2026 then <b>diverge completely</b>. That\u2019s <b>sensitive dependence on initial conditions</b>.'},
    {at:6.5,k:'note',t:'Errors grow exponentially (the Lyapunov rate). Predict far enough ahead and any measurement error swamps the answer.'},
    {at:9,k:'gap',t:'<span class="q">If the motion is this wild, is there any hidden order at all \u2014 or is it pure noise?</span>'}
  ]
});

/* ---- Lorenz attractor ---- */
addSlide({
  section:'V · Chaos & Complexity', title:'Order Inside the Chaos',
  subtitle:'Plot the motion in phase space and a shape appears \u2014 a strange attractor.',
  enter(){ this.st={A:{x:0.1,y:0,z:0,pts:[]}, B:{x:0.1+1e-3,y:0,z:0,pts:[]}}; },
  draw(t,dt){
    const sig=10, rho=28, beta=8/3, h=0.006;
    const map=(x,z)=>({x:W/2 + x*10, y:430-(z-25)*6.0});
    const step=(s)=>{ for(let k=0;k<7;k++){ const dx=sig*(s.y-s.x), dy=s.x*(rho-s.z)-s.y, dz=s.x*s.y-beta*s.z;
      s.x+=dx*h; s.y+=dy*h; s.z+=dz*h; const p=map(s.x,s.z); s.pts.push(p); if(s.pts.length>2600)s.pts.shift(); } };
    if(t>0.3){ step(this.st.A); step(this.st.B); }
    const drawTrail=(s,col)=>{ ctx.save(); ctx.lineWidth=1.3; ctx.strokeStyle=col; ctx.beginPath();
      for(let i=1;i<s.pts.length;i++){ ctx.globalAlpha=Math.min(0.7, i/s.pts.length*0.9); ctx.moveTo(s.pts[i-1].x,s.pts[i-1].y); ctx.lineTo(s.pts[i].x,s.pts[i].y);} ctx.stroke(); ctx.restore();
      const h2=s.pts[s.pts.length-1]; if(h2) dot(h2.x,h2.y,4,col,1); };
    drawTrail(this.st.B, rgba(C.clay,0.8));
    drawTrail(this.st.A, rgba(C.blue,0.8));
    label(W/2,210,'the Lorenz system \u00b7 a stripped-down weather model',{size:14,color:C.dim,alpha:seg(t,0.4,1)});
    label(W/2,560,'never repeats, never escapes \u2014 confined forever to two butterfly wings',{size:15,italic:true,color:C.faint,alpha:seg(t,3,1.4)});
  },
  beats:[
    {at:0.2,k:'recap',t:'The path looks like noise in time. So change the view: plot position vs. velocity \u2014 <b>phase space</b>.'},
    {at:3,k:'fill',t:'A structure emerges: a <b>strange attractor</b>. The system wanders forever but is trapped on this fractal surface \u2014 order and chaos at once.'},
    {at:6.5,k:'note',t:'Two nearby starts (blue, red) trace the <i>same</i> shape yet never sync. Bounded, deterministic, unpredictable.'},
    {at:9,k:'gap',t:'<span class="q">Is chaos an accident, or does every system slide into it the same way?</span>'}
  ]
});

/* ---- Bifurcation / route to chaos ---- */
addSlide({
  section:'V · Chaos & Complexity', title:'The Route to Chaos',
  subtitle:'One knob, turned slowly: order doubles, and doubles, and shatters. Always the same way.',
  enter(){
    const plotX=280,plotY=250,plotW=760,plotH=280;
    const off=document.createElement('canvas'); off.width=plotW; off.height=plotH; const o=off.getContext('2d');
    o.fillStyle='rgba(91,143,176,0.55)';
    for(let c=0;c<plotW;c++){ const r=2.8+(c/plotW)*1.2; let x=0.5;
      for(let i=0;i<250;i++) x=r*x*(1-x);
      for(let i=0;i<140;i++){ x=r*x*(1-x); const y=(1-x)*plotH; o.fillRect(c, y, 1, 1); } }
    this.st={off,plotX,plotY,plotW,plotH};
  },
  draw(t){
    const {off,plotX,plotY,plotW,plotH}=this.st;
    // axes
    arrow(plotX-4,plotY+plotH,plotX-4,plotY-6,C.faint,1.3,seg(t,0.2,1),6); label(plotX-22,plotY+6,'x',{size:14,color:C.dim,italic:true,font:'serif',alpha:seg(t,0.2,1)});
    arrow(plotX-4,plotY+plotH,plotX+plotW+20,plotY+plotH,C.faint,1.3,seg(t,0.2,1),6); label(plotX+plotW+14,plotY+plotH+18,'r \u2192',{size:13,color:C.dim,alpha:seg(t,0.2,1)});
    // reveal sweep
    const rev=ease(clamp((t-0.5)/5,0,1))*plotW;
    if(rev>1){ ctx.drawImage(off, 0,0, rev,plotH, plotX,plotY, rev,plotH); }
    if(rev<plotW && t>0.5) line(plotX+rev,plotY,plotX+rev,plotY+plotH,C.teal,1.4,0.7);
    // guide markers
    const rx=r=>plotX+((r-2.8)/1.2)*plotW;
    const mark=(r,txt,at)=>{ const a=seg(t,at,1); if(rx(r)<plotX+rev+4){ line(rx(r),plotY,rx(r),plotY+plotH,C.faint,1,0.35*a,[3,4]); label(rx(r),plotY-8,txt,{size:11,color:C.dim,alpha:a}); } };
    mark(3.0,'period 2',2.5); mark(3.449,'4',3.5); mark(3.5699,'chaos',4.2);
    label(rx(2.85),plotY+plotH+22,'steady',{size:11,color:C.faint,align:'left',alpha:seg(t,1.5,1)});
    label(W/2,568,'this cascade appears in dripping taps, heartbeats, populations \u2014 with the same universal constant (4.669\u2026)',{size:14,italic:true,color:C.faint,alpha:seg(t,5.5,1.4)});
  },
  beats:[
    {at:0.2,k:'recap',t:'Take the simplest possible feedback: next = r \u00b7 x \u00b7 (1\u2212x). One knob, r.'},
    {at:2.4,k:'fill',t:'Low r \u2192 one steady value. Turn it up: the answer splits in two, then four, then eight \u2014 <b>period doubling</b> \u2014 then dissolves into chaos.'},
    {at:6,k:'note',t:'Feigenbaum found the doublings shrink by a fixed ratio, <b>4.669\u2026</b>, in <i>every</i> such system. Chaos has universal laws.'},
    {at:9,k:'apply',t:'Used to model turbulence, cardiac arrhythmia, lasers, ecosystems, and market swings \u2014 anywhere feedback meets nonlinearity.'}
  ]
});

/* =====================================================================
   RUNNER · chrome, navigation, narration, loop
   ===================================================================== */
const stage=document.getElementById('stage');
const elSect=document.getElementById('sect'), elSec=document.getElementById('sec');
const elTitle=document.getElementById('title'), elSub=document.getElementById('subtitle');
const elProg=document.getElementById('prog'), elCounter=document.getElementById('counter'), elDots=document.getElementById('dots');
const nblock=document.getElementById('nblock'), chip=document.getElementById('chip'), ntext=document.getElementById('ntext');
const btnPrev=document.getElementById('prev'), btnNext=document.getElementById('next'), btnReplay=document.getElementById('replay');

let idx=0, tStart=performance.now(), last=tStart, lastBeat=-1, switchAt=0;

// build dots
SLIDES.forEach((s,i)=>{ const d=document.createElement('div'); d.className='dot'+(s.cover?' sec':''); elDots.appendChild(d); });
const dots=[...elDots.children];

function chrome(){
  const s=SLIDES[idx];
  elSec.style.opacity = s.cover?0:1;
  elSect.textContent = s.section||'';
  elTitle.textContent = s.cover?'':(s.title||'');
  elSub.textContent = s.cover?'':(s.subtitle||'');
  elCounter.textContent = (idx+1)+' / '+SLIDES.length;
  elProg.style.width = ((idx+1)/SLIDES.length*100)+'%';
  dots.forEach((d,i)=>d.classList.toggle('on', i===idx));
  btnPrev.disabled = idx===0;
  btnNext.textContent = idx===SLIDES.length-1 ? 'Fin' : 'Next \u203a';
}
function show(i){
  idx=clamp(i,0,SLIDES.length-1);
  const s=SLIDES[idx];
  if(s.enter) try{ s.enter(); }catch(e){ console.error('enter',e); }
  tStart=performance.now(); last=tStart; lastBeat=-1;
  nblock.classList.add('hidden');
  chrome();
  stage.classList.remove('flash'); void stage.offsetWidth; stage.classList.add('flash');
}
function updateNarration(s,t){
  const beats=s.beats||[];
  let cur=-1;
  for(let i=0;i<beats.length;i++){ if(t>=beats[i].at) cur=i; }
  if(cur!==lastBeat){
    lastBeat=cur; switchAt=performance.now();
    if(cur>=0){ const b=beats[cur]; chip.className='chip k-'+b.k; chip.textContent=(b.k||'note').toUpperCase(); ntext.innerHTML=b.t; nblock.classList.add('hidden'); }
    else nblock.classList.add('hidden');
  }
  if(cur>=0 && performance.now()-switchAt>70) nblock.classList.remove('hidden');
}
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  const t=(now-tStart)/1000;
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  const s=SLIDES[idx];
  try{ s.draw(t,dt); }catch(e){ console.error('draw',e); }
  updateNarration(s,t);
  requestAnimationFrame(frame);
}
// navigation
const next=()=>show(idx+1), prev=()=>show(idx-1), replay=()=>show(idx);
btnNext.addEventListener('click',e=>{e.stopPropagation(); next();});
btnPrev.addEventListener('click',e=>{e.stopPropagation(); prev();});
btnReplay.addEventListener('click',e=>{e.stopPropagation(); replay();});
stage.addEventListener('click',()=>next());
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); prev(); }
  else if(e.key==='r'||e.key==='R'){ replay(); }
});

show(0);
requestAnimationFrame(frame);
</script>
