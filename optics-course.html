<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optics — from rays to lasers</title>
<style>
  :root{
    --bg:#04050a; --ink:#e7e9ee; --dim:#8a90a0; --faint:#3a3f4c;
    --blue:#6c9ce0; --teal:#54b9ad; --amber:#d6a54e; --green:#7cbf86;
    --coral:#d97a72; --violet:#a58bd4; --yellow:#e4cf7a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}
  canvas{background:var(--bg);display:block;box-shadow:0 0 60px rgba(0,0,0,.6);}
  #bar{height:50px;display:flex;align-items:center;gap:14px;padding:0 16px;
    background:#07080e;border-top:1px solid #14161f;user-select:none;font-size:13px;color:var(--dim);}
  #bar button{background:#12141d;color:var(--ink);border:1px solid #232734;border-radius:7px;
    padding:7px 14px;font-size:13px;cursor:pointer;transition:.15s;}
  #bar button:hover{background:#1b1e2a;border-color:#33384a;}
  #bar button:disabled{opacity:.35;cursor:default;}
  #tocBtn{font-size:16px;padding:6px 12px;}
  #meta{flex:1;text-align:center;letter-spacing:.3px;}
  #meta b{color:var(--ink);font-weight:600;}
  #prog{height:3px;background:#12141d;border-radius:2px;flex:0 0 220px;overflow:hidden;}
  #progf{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .25s;}
  #toc{position:fixed;inset:0;background:rgba(2,3,6,.92);backdrop-filter:blur(4px);
    display:none;padding:40px 6vw;overflow:auto;z-index:20;}
  #toc h2{font-weight:600;font-size:15px;letter-spacing:2px;color:var(--dim);margin:22px 0 10px;text-transform:uppercase;}
  #toc .grp{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;}
  #toc .it{background:#0c0e16;border:1px solid #1a1d28;border-radius:8px;padding:11px 13px;cursor:pointer;font-size:14px;transition:.15s;}
  #toc .it:hover{background:#141726;border-color:#2a2f40;}
  #toc .it small{display:block;color:var(--dim);font-size:11px;margin-top:2px;}
  #toc .close{position:absolute;top:24px;right:6vw;font-size:26px;color:var(--dim);cursor:pointer;}
  #hint{position:absolute;top:22px;left:50%;transform:translateX(-50%);color:#4b5163;font-size:12px;letter-spacing:.5px;transition:opacity 1s;}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="bar">
    <button id="tocBtn" title="Contents">☰</button>
    <button id="prev">◀ Prev</button>
    <div id="meta"></div>
    <div id="prog"><div id="progf"></div></div>
    <button id="next">Next ▶</button>
  </div>
</div>
<div id="toc"><span class="close" id="tocClose">✕</span><div id="tocBody"></div></div>
<div id="hint">→ / Space  ·  advance   |   ←  back   |   ☰  contents</div>

<script>
"use strict";
/* ============================ ENGINE ============================ */
const W=1600,H=900;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){
  const barH=50, availW=window.innerWidth, availH=window.innerHeight-barH;
  let w=availW, h=w*H/W;
  if(h>availH){h=availH;w=h*W/H;}
  cv.style.width=w+'px'; cv.style.height=h+'px';
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',fit); fit();

const C=getComputedStyle(document.documentElement);
const col={
  bg:'#04050a', ink:'#e7e9ee', dim:'#8a90a0', faint:'#3a3f4c', grid:'#1b1f2b',
  blue:'#6c9ce0', teal:'#54b9ad', amber:'#d6a54e', green:'#7cbf86',
  coral:'#d97a72', violet:'#a58bd4', yellow:'#e4cf7a', glass:'#12283a'
};

/* layout bands */
const SX=130, SR=1470, SW=SR-SX, SY=150, SB=716, CX=800, CY=(SY+SB)/2;

/* timing */
let SI=0, BI=0, beatStart=performance.now(), T=0, BT=0;
const clamp01=x=>x<0?0:x>1?1:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const E=t=>{t=clamp01(t); return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}; // easeInOutCubic
const EO=t=>{t=clamp01(t); return 1-Math.pow(1-t,3);};                 // easeOutCubic
const seg=(s,d)=>E(clamp01((BT-s)/d));      // eased sub-animation
const segL=(s,d)=>clamp01((BT-s)/d);        // linear sub-animation
const segO=(s,d)=>EO(clamp01((BT-s)/d));
const TAU=Math.PI*2;

/* ---------- primitives ---------- */
function line(x1,y1,x2,y2,c,w=2,a=1,dash=null){
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';
  if(dash)ctx.setLineDash(dash);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function ray(x1,y1,x2,y2,c,w=2.4,a=1,head=13){
  line(x1,y1,x2,y2,c,w,a);
  const an=Math.atan2(y2-y1,x2-x1);
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-head*Math.cos(an-.42),y2-head*Math.sin(an-.42));
  ctx.lineTo(x2-head*Math.cos(an+.42),y2-head*Math.sin(an+.42));
  ctx.closePath();ctx.fill();ctx.restore();
}
// growing ray: draws from p1 toward p2 by progress p, arrowhead at tip
function grow(x1,y1,x2,y2,p,c,w=2.4,a=1){
  p=clamp01(p); if(p<=0)return;
  ray(x1,y1,lerp(x1,x2,p),lerp(y1,y2,p),c,w,a);
}
function dot(x,y,r,c,a=1){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();}
function ring(x,y,r,c,w=2,a=1){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();ctx.restore();}
function photon(x,y,r,c){ // subtle glow, muted
  ctx.save();ctx.globalAlpha=.22;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r*2.6,0,TAU);ctx.fill();
  ctx.globalAlpha=1;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();
}
function txt(s,x,y,size=24,c=col.ink,align='center',baseline='middle',weight=400,a=1){
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle=c;ctx.textAlign=align;ctx.textBaseline=baseline;
  ctx.font=`${weight} ${size}px -apple-system,"Segoe UI",Roboto,sans-serif`;
  ctx.fillText(s,x,y);ctx.restore();
}
function mono(s,x,y,size=24,c=col.ink,align='center',a=1,weight=500){
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle=c;ctx.textAlign=align;ctx.textBaseline='middle';
  ctx.font=`${weight} ${size}px "SF Mono",ui-monospace,Menlo,Consolas,monospace`;
  ctx.fillText(s,x,y);ctx.restore();
}
function dashedNormal(x,y1,y2,a=1){line(x,y1,x,y2,col.dim,1.4,.7*a,[6,6]);}
function angleArc(px,py,a1,a2,r,c,a=1,w=2){
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=c;ctx.lineWidth=w;
  ctx.beginPath();ctx.arc(px,py,r,Math.min(a1,a2),Math.max(a1,a2));ctx.stroke();ctx.restore();
}
// horizontal sine wave from x0..x1 centred at y0
function sineH(x0,y0,x1,amp,k,phase,c,w=2.4,a=1,step=4){
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();
  let first=true;
  for(let x=x0;x<=x1;x+=step){const y=y0-amp*Math.sin(k*(x-x0)-phase);if(first){ctx.moveTo(x,y);first=false;}else ctx.lineTo(x,y);}
  ctx.stroke();ctx.restore();
}
function panel(x,y,w,h,r=10,fill='#0a0c14',stroke='#1c2130',a=1){
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}
// muted spectrum colour for wavelength fraction 0..1 (violet->red)
function spectral(t){
  const stops=[[0,'#7d5bd0'],[.2,'#5b74d0'],[.4,'#54b9ad'],[.6,'#7cbf86'],[.75,'#d6c54e'],[.9,'#d68b4e'],[1,'#d0655f']];
  t=clamp01(t);for(let i=0;i<stops.length-1;i++){if(t<=stops[i+1][0]){const a=stops[i],b=stops[i+1];const f=(t-a[0])/(b[0]-a[0]);return mix(a[1],b[1],f);}}return stops[stops.length-1][1];
}
function mix(c1,c2,f){const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(c1),b=p(c2);const r=Math.round(lerp(a[0],b[0],f)),g=Math.round(lerp(a[1],b[1],f)),bl=Math.round(lerp(a[2],b[2],f));
  return `rgb(${r},${g},${bl})`;}
function fadeIn(x){return clamp01(x);}
function pop(s,d){ // scale/opacity pop-in progress
  const p=segO(s,d);return p;
}

/* ---------- title & caption rendering ---------- */
const tierColor={GEOMETRIC:col.blue,WAVE:col.teal,MODERN:col.violet,MAP:col.amber};
function header(){
  const sc=scenes[SI];
  txt(sc.tier,SX,64,15,tierColor[sc.tier]||col.dim,'left','middle',700,.9);
  ctx.save();ctx.globalAlpha=.9;ctx.fillStyle=tierColor[sc.tier]||col.dim;
  const tw=ctx.measureText?0:0;ctx.restore();
  txt(sc.title,SX,98,30,col.ink,'left','middle',600);
  txt(`${SI+1} / ${scenes.length}`,SR,64,15,col.dim,'right','middle',500);
  line(SX,120,SR,120,col.grid,1,1);
}
const kindTag={T:['CONCEPT',col.teal],R:['RECAP',col.blue],G:['GAP',col.amber],F:['FILL',col.green]};
function wrapText(s,maxw,size,weight){
  ctx.font=`${weight} ${size}px -apple-system,"Segoe UI",Roboto,sans-serif`;
  const words=s.split(' ');const lines=[];let cur='';
  for(const w of words){const test=cur?cur+' '+w:w;if(ctx.measureText(test).width>maxw&&cur){lines.push(cur);cur=w;}else cur=test;}
  if(cur)lines.push(cur);return lines;
}
function caption(){
  const b=scenes[SI].beats[BI];
  const appear=EO(clamp01(BT/0.5));
  line(SX,742,SR,742,col.grid,1,1);
  const [lab,lc]=kindTag[b.k]||['',col.dim];
  ctx.save();ctx.globalAlpha=appear;
  // tag
  ctx.font='700 13px -apple-system,"Segoe UI",sans-serif';
  const padw=ctx.measureText(lab).width+18;
  ctx.fillStyle=lc; ctx.globalAlpha=.16*appear;
  roundRect(SX,760,padw,24,6);ctx.fill();
  ctx.globalAlpha=appear;ctx.fillStyle=lc;ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(lab,SX+9,772);
  ctx.restore();
  // text
  const size=b.k==='G'?27:25;const weight=b.k==='G'?600:400;
  const tc=b.k==='G'?col.amber:(b.k==='F'?col.green:col.ink);
  const lines=wrapText(b.t,SW,size,weight);
  let y=808;
  for(const ln of lines){txt(ln,SX,y,size,tc,'left','middle',weight,appear);y+=size+8;}
  if(b.s){const l2=wrapText(b.s,SW,20,400);for(const ln of l2){txt(ln,SX,y+2,20,col.dim,'left','middle',400,appear);y+=27;}}
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* small helper: label a point */
function tag(x,y,s,c=col.dim,size=17,align='center',a=1){txt(s,x,y,size,c,align,'middle',500,a);}

/* extra drawing helpers used by scenes */
function objArrow(x,baseY,h,c,a=1,w=3){ ray(x,baseY,x,baseY-h,c,w,a,13); }
function convLens(x,cy,halfH,bulge,c=col.teal,a=1){
  ctx.save();ctx.strokeStyle=c;ctx.lineWidth=2.4;ctx.globalAlpha=.9*a;
  ctx.beginPath();ctx.moveTo(x,cy-halfH);ctx.quadraticCurveTo(x+bulge,cy,x,cy+halfH);
  ctx.quadraticCurveTo(x-bulge,cy,x,cy-halfH);ctx.closePath();
  ctx.fillStyle='rgba(84,185,173,.09)';ctx.globalAlpha=a;ctx.fill();ctx.globalAlpha=.9*a;ctx.stroke();ctx.restore();
}
function concaveLens(x,cy,halfH,c=col.teal,a=1){
  ctx.save();ctx.strokeStyle=c;ctx.lineWidth=2.4;ctx.globalAlpha=.9*a;const b=16;
  ctx.beginPath();ctx.moveTo(x-b,cy-halfH);ctx.lineTo(x+b,cy-halfH);
  ctx.quadraticCurveTo(x-b*.4,cy,x+b,cy+halfH);ctx.lineTo(x-b,cy+halfH);
  ctx.quadraticCurveTo(x+b*.4,cy,x-b,cy-halfH);ctx.closePath();
  ctx.fillStyle='rgba(84,185,173,.07)';ctx.globalAlpha=a;ctx.fill();ctx.globalAlpha=.9*a;ctx.stroke();ctx.restore();
}
function hatch(x1,y,x2,dir,c,a=1){ // hatched surface (dir=+1 below,-1 above)
  line(x1,y,x2,y,c,2,a);
  ctx.save();ctx.globalAlpha=.5*a;ctx.strokeStyle=c;ctx.lineWidth=1.3;
  for(let x=x1+8;x<x2;x+=18){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-12,y+dir*12);ctx.stroke();}ctx.restore();
}
function marchWave(px,py,ux,uy,count,spacing,len,phase,c,a=1){
  const perpx=-uy,perpy=ux;
  for(let i=0;i<count;i++){const d=(i+(phase%1))*spacing;const cx2=px+ux*d,cy2=py+uy*d;
    const f=1-i/count; line(cx2-perpx*len,cy2-perpy*len,cx2+perpx*len,cy2+perpy*len,c,2,a*f);}
}
const R2=(a)=>a*Math.PI/180;

/* ============================ SCENES ============================ */
const scenes=[

/* 0 — TITLE ------------------------------------------------------ */
{tier:'MAP',title:'A journey through Optics',
 beats:[
  {k:'T',t:'Light — the fastest, most useful messenger we have. We will follow one idea and let each answer expose the next question.'},
  {k:'T',t:'Three tiers, one thread: treat light as a ray, then as a wave, then engineer it as a beam of photons.'}
 ],
 draw(){
  txt('OPTICS',CX,300,86,col.ink,'center','middle',700, EO(clamp01(BT/.8)));
  txt('from rays to lasers',CX,362,28,col.teal,'center','middle',400,EO(clamp01((BT-.2)/.8)));
  // travelling photon underline
  const p=segL(.4,1.6), x1=CX-260,x2=CX+260;
  line(x1,400,lerp(x1,x2,p),400,col.amber,2,.8);
  if(p<1)photon(lerp(x1,x2,p),400,4,col.amber);
  txt('“What I cannot create, I do not understand.”  — R. Feynman',CX,470,18,col.dim,'center','middle',400,EO(clamp01((BT-1.2)/1)));
  if(BI>=1){
   const cards=[['GEOMETRIC','rays · lenses · mirrors',col.blue],
               ['WAVE','interference · diffraction',col.teal],
               ['MODERN','lasers · fibre · Fourier',col.violet]];
   const cw=300,gap=40,tot=cards.length*cw+(cards.length-1)*gap,x0=CX-tot/2;
   cards.forEach((cd,i)=>{const p2=pop(i*.15,.5);const x=x0+i*(cw+gap);const y=560-6*p2;
     ctx.save();ctx.globalAlpha=p2;panel(x,y,cw,120,12,'#0a0d16',cd[2]==col.blue?'#20364f':cd[2]==col.teal?'#1c3f3a':'#332947');
     txt(cd[0],x+cw/2,y+42,22,cd[2],'center','middle',700);
     txt(cd[1],x+cw/2,y+80,17,col.dim,'center','middle',400);ctx.restore();});
  }
 }},

/* 1 — RAY MODEL -------------------------------------------------- */
{tier:'GEOMETRIC',title:'The ray — light as a straight path',
 beats:[
  {k:'T',t:'A glowing point sprays light in every direction. Each thin pencil of light is a RAY — the path energy takes.'},
  {k:'T',t:'In a uniform medium a ray is dead straight. That single fact — plus what happens at boundaries — is all of geometric optics.'},
  {k:'G',t:'A ray alone is boring: it just goes straight forever. Every rich effect is born where it meets matter. So — what can a boundary DO to a ray?'}
 ],
 draw(){
  const s={x:SX+150,y:CY}, n=11, len=760;
  dot(s.x,s.y,7,col.yellow,EO(clamp01(BT/.3)));
  ring(s.x,s.y,7+6*Math.sin(T*3),col.yellow,1.4,.25);
  if(BI===0){
   for(let i=0;i<n;i++){const a=lerp(-1.0,1.0,i/(n-1));const p=segO(i*0.03,.7);
     grow(s.x,s.y,s.x+Math.cos(a)*len,s.y+Math.sin(a)*len,p,col.blue,2,.75);}
   tag(s.x,s.y-40,'point source',col.dim);
  } else {
   // one straight ray highlighted, rest faint
   for(let i=0;i<n;i++){const a=lerp(-1.0,1.0,i/(n-1));
     if(Math.abs(a)<.05){continue;}
     line(s.x,s.y,s.x+Math.cos(a)*len,s.y+Math.sin(a)*len,col.faint,1.4,.5);}
   const ex=s.x+len, ey=s.y;
   line(s.x,s.y,ex,ey,col.blue,3,1);
   const ph=segL(0,1.4);
   if(BI===1&&ph<1)photon(lerp(s.x,ex,ph),ey,5,col.amber);
   tag((s.x+ex)/2,ey-26,'a single ray — perfectly straight',col.dim,18);
   if(BI===2){
     // wall / boundary at right
     hatch(1180,SY+60,1180,0,col.dim,.9); // vertical? draw vertical boundary
     line(1180,SY+70,1180,SB-70,col.coral,2,.9);
     for(let i=0;i<4;i++){const yy=SY+140+i*110;line(1180,yy-6,1180,yy+6,col.coral,2,.5);}
     txt('boundary?',1230,CY,22,col.coral,'left','middle',600,EO(clamp01(BT/.5)));
     tag(1230,CY+34,'mirror · water · glass · slit',col.dim,16,'left');
   }
  }
 }},

/* 2 — REFLECTION ------------------------------------------------- */
{tier:'GEOMETRIC',title:'Reflection — the bounce',
 beats:[
  {k:'T',t:'The simplest thing a boundary can do: throw the ray back. A mirror.'},
  {k:'T',t:'Angle of incidence equals angle of reflection — both measured from the normal (the line ⟂ to the surface).'},
  {k:'T',t:'Smooth surface → rays stay ordered (specular). Rough surface → rays scatter every way (diffuse) — why you see this page from any angle but your face only in a mirror.'},
  {k:'G',t:'Bouncing is only half the story. What if the boundary is water or glass, and light passes INTO it? Does it keep going straight?'}
 ],
 draw(){
  const my=560, P={x:CX,y:my}, L=300, th=R2(35);
  hatch(SX+40,my,SR-40,1,col.dim,.9);
  if(BI<3||BI===3){
    dashedNormal(P.x,P.y-260,P.y+30);
    const inS={x:P.x-Math.sin(th)*L,y:P.y-Math.cos(th)*L};
    const rE={x:P.x+Math.sin(th)*L,y:P.y-Math.cos(th)*L};
    // incoming
    grow(inS.x,inS.y,P.x,P.y,BI===0?seg(0,.9):1,col.blue,3);
    const pin=segL(0,.9);
    if(BI===0&&pin<1)photon(lerp(inS.x,P.x,pin),lerp(inS.y,P.y,pin),5,col.amber);
    if(BI>=1){
      const pr=BI===1?seg(0,.9):1;
      grow(P.x,P.y,rE.x,rE.y,pr,col.teal,3);
      // angle arcs
      angleArc(P.x,P.y,-Math.PI/2-th,-Math.PI/2,34,col.blue,.9);
      angleArc(P.x,P.y,-Math.PI/2,-Math.PI/2+th,44,col.teal,.9);
      tag(P.x-46,P.y-72,'θᵢ',col.blue,20,'center');
      tag(P.x+52,P.y-84,'θᵣ',col.teal,20,'center');
      txt('θᵢ  =  θᵣ',CX,SY+40,30,col.ink,'center','middle',600,EO(clamp01((BT)/.5)));
    }
    tag(P.x+8,P.y-250,'normal',col.dim,16,'left');
    if(BI===3){
      txt('…into the glass?',1210,300,24,col.amber,'left','middle',600,EO(clamp01(BT/.5)));
      line(P.x,P.y,P.x+Math.sin(R2(24))*260,P.y+Math.cos(R2(24))*160,col.amber,2,.5*EO(clamp01(BT/.6)),[7,7]);
    }
  }
  if(BI===2){
    // diffuse illustration on the right
    ctx.save();
    const bx1=1120,bx2=1400,by=560;
    // rough surface
    ctx.strokeStyle=col.dim;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx1,by);
    for(let x=bx1;x<=bx2;x+=14){ctx.lineTo(x,by-6-8*Math.abs(Math.sin(x)));}ctx.stroke();ctx.restore();
    // parallel incoming, scattered outgoing

  ctx.save();ctx.fillStyle=col.green;ctx.globalAlpha=.9;ctx.fillRect(SR-210,SY+170-I*70,100,I*70);ctx.restore();
  ctx.strokeStyle=col.faint;ctx.strokeRect(SR-210,SY+100,100,70);
  txt('brightness',SR-160,SY+186,14,col.dim);
 }},

/* 19 — BREWSTER & BIREFRINGENCE --------------------------------- */
{tier:'MODERN',title:'Brewster’s angle & birefringence',
 beats:[
  {k:'T',t:'Hit glass at Brewster’s angle (tan θB = n₂/n₁) and the reflected ray comes out FULLY polarized — parallel to the surface. That’s glare.'},
  {k:'T',t:'Polarized sunglasses are simply an analyzer crossed to that glare, so reflections off water and roads vanish.'},
  {k:'T',t:'Birefringent crystals (calcite) have two refractive indices — one ray splits into two, each polarized differently. A double image from one dot.'}
 ],
 draw(){
  if(BI<2){
    const iy=CY+40,P={x:CX,y:iy},L=280,thB=R2(56);
    ctx.save();ctx.globalAlpha=.4;ctx.fillStyle=col.glass;ctx.fillRect(SX+40,iy,SR-SX-80,SB-iy);ctx.restore();
    line(SX+40,iy,SR-40,iy,col.dim,1.6,.8);dashedNormal(P.x,iy-220,iy+40);
    const inS={x:P.x-Math.sin(thB)*L,y:P.y-Math.cos(thB)*L};
    grow(inS.x,inS.y,P.x,P.y,1,col.blue,3);
    // reflected (polarized)
    const rE={x:P.x+Math.sin(thB)*L,y:P.y-Math.cos(thB)*L};
    grow(P.x,P.y,rE.x,rE.y,seg(0,.9),col.teal,3);
    // dots along reflected = polarization out of plane
    for(let d=0.3;d<1;d+=0.18){dot(lerp(P.x,rE.x,d),lerp(P.y,rE.y,d),3.5,col.violet,seg(.4,.6));}
    tag(rE.x,rE.y-24,'reflected = fully polarized',col.teal,16);
    // refracted
    const th2=Math.atan(1/1.5);const rF={x:P.x+Math.sin(th2)*L,y:P.y+Math.cos(th2)*L};
    grow(P.x,P.y,rF.x,rF.y,1,col.dim,2,.6);
    tag(P.x-70,P.y-70,'θB',col.blue,18);
    panel(SX+70,SY+30,300,70,10);txt('tan θB = n₂ / n₁',SX+220,SY+65,22,col.ink,'center','middle',600);
    if(BI===1)txt('sunglasses cross out this glare',CX,SB-6,20,col.dim,'center','middle',400);
  } else {
    // birefringence: one ray -> two
    const cx0=CX-40;
    panel(cx0-90,CY-120,180,240,10,'rgba(165,139,212,.06)',col.violet);tag(cx0,CY-140,'calcite',col.violet,15);
    grow(SX+120,CY,cx0-90,CY,1,col.blue,3);tag(SX+120,CY-24,'one ray in',col.blue,15,'left');
    grow(cx0-90,CY,cx0+90,CY-40,seg(0,.8),col.teal,2.6,.9);
    grow(cx0-90,CY,cx0+90,CY+40,seg(.2,.8),col.amber,2.6,.9);
    grow(cx0+90,CY-40,SR-140,CY-40,seg(.5,.7),col.teal,2.6,.9);
    grow(cx0+90,CY+40,SR-140,CY+40,seg(.6,.7),col.amber,2.6,.9);
    tag(SR-150,CY-64,'ordinary',col.teal,15,'left');tag(SR-150,CY+64,'extraordinary',col.amber,15,'left');
    txt('LCD screens · stress photoelasticity · 3D glasses',CX,SB-6,20,col.dim,'center','middle',400);
  }
 }},

/* 20 — LASER ---------------------------------------------------- */
{tier:'MODERN',title:'The laser — light, engineered',
 beats:[
  {k:'R',t:'Recap: we can steer light (rays), read it (interference) and filter its direction (polarization).'},
  {k:'G',t:'But natural light is a mess — many colours, random phases, spreading everywhere. Can we build light that is one colour, one phase, one direction?'},
  {k:'F',t:'Three atom–photon moves. Absorption: photon lifts an electron. Spontaneous: it drops, emitting a random photon. Stimulated: a passing photon triggers an identical TWIN — same phase, colour, direction.'},
  {k:'T',t:'Pump most atoms up (population inversion) and trap light between mirrors: one photon breeds an avalanche of clones in one mode. That coherent flood is a LASER.'}
 ],
 draw(){
  if(BI<2){
    if(BI===1)txt('one colour · one phase · one direction — possible?',CX,CY,24,col.amber,'center','middle',600,EO(clamp01(BT/.5)));
    else txt('we can steer, read, and filter light',CX,CY,22,col.dim,'center','middle',400);
    return;
  }
  if(BI===2){
    const boxes=[['Absorption',CX-440],['Spontaneous',CX],['Stimulated',CX+440]];
    boxes.forEach((b,i)=>{const x=b[1];tag(x,SY+70,b[0],col.teal,18);
      const ay=CY; // atom
      ring(x,ay,26,col.dim,2,.8);dot(x,ay-14+ (i===0?0:0),3,col.dim,0);
      if(i===0){ // photon in, electron up
        const p=segL(0,1);photon(lerp(x-160,x,p%1),ay,4,col.amber);
        dot(x,ay+12,4,col.blue);if(p>1){}
        ring(x,ay,14,col.blue,1.5,.6);
        tag(x,ay+70,'photon → electron up',col.dim,14);
      } else if(i===1){ // random out
        const p=segL(0,1.2)%1;const ang=2.0;photon(x+Math.cos(ang)*p*160,ay+Math.sin(ang)*p*160,4,col.coral);
        tag(x,ay+70,'random photon out',col.dim,14);
      } else { // stimulated: 1 in -> 2 out identical
        const p=segL(0,1.4)%1;
        if(p<.5)photon(lerp(x-160,x,p*2),ay,4,col.amber);
        else {photon(lerp(x,x+180,(p-.5)*2),ay-8,4,col.green);photon(lerp(x,x+180,(p-.5)*2),ay+8,4,col.green);}
        tag(x,ay+70,'two identical photons',col.green,14);
      }
    });
    return;
  }
  // cavity
  const y=CY, x1=SX+180, x2=SR-180;
  line(x1,y-90,x1,y+90,col.violet,5,.9);line(x2,y-90,x2,y+90,col.violet,5,.6);
  tag(x1,y+112,'full mirror',col.violet,14);tag(x2,y+112,'partial mirror',col.violet,14);
  // gain atoms
  for(let i=0;i<8;i++){const ax=lerp(x1+40,x2-40,i/7);ring(ax,y-40+((i*29)%80)-40,10,col.dim,1.4,.5);}
  // avalanche photons
  for(let i=0;i<7;i++){const px=x1+((T*260+i*90)%(x2-x1));photon(px,y,4,col.green);}
  // output beam
  const bp=segL(.3,1);
  line(x2,y,lerp(x2,SR-60,bp),y,col.green,4,.9);
  tag(SR-70,y-22,'coherent beam',col.green,16,'right');
  txt('population inversion + cavity → one dominant mode',CX,SB-6,20,col.dim,'center','middle',400);
 }},

/* 21 — GAUSSIAN BEAMS ------------------------------------------- */
{tier:'MODERN',title:'Gaussian beams — a real beam has shape',
 beats:[
  {k:'T',t:'A laser beam is not a pencil line. Its intensity is a Gaussian bell that narrows to a tiny WAIST w₀, then opens back up.'},
  {k:'T',t:'Divergence θ ≈ λ/(π w₀): focus tighter and it spreads faster. The Rayleigh range is your usable depth of focus — you can’t beat diffraction.'},
  {k:'T',t:'This shapes real tools: cutting & welding, laser pointers, optical tweezers gripping single cells, and the spot size that limits a Blu-ray.'}
 ],
 draw(){
  const y=CY, x0=SX+80, x1=SR-80, w0=26, zR=220;
  const wz=z=>w0*Math.sqrt(1+Math.pow(z/zR,2));
  ctx.save();ctx.globalAlpha=.14;ctx.fillStyle=col.violet;ctx.beginPath();
  ctx.moveTo(x0,y-wz(x0-CX));for(let x=x0;x<=x1;x+=6)ctx.lineTo(x,y-wz(x-CX));
  for(let x=x1;x>=x0;x-=6)ctx.lineTo(x,y+wz(x-CX));ctx.closePath();ctx.fill();ctx.restore();
  ctx.strokeStyle=col.violet;ctx.lineWidth=2.4;ctx.globalAlpha=.9;
  ctx.beginPath();for(let x=x0;x<=x1;x+=6){const yy=y-wz(x-CX);x===x0?ctx.moveTo(x,yy):ctx.lineTo(x,yy);}ctx.stroke();
  ctx.beginPath();for(let x=x0;x<=x1;x+=6){const yy=y+wz(x-CX);x===x0?ctx.moveTo(x,yy):ctx.lineTo(x,yy);}ctx.stroke();ctx.globalAlpha=1;
  line(CX,y-w0,CX,y+w0,col.amber,3,.9);tag(CX,y+w0+26,'waist w₀',col.amber,16);
  // gaussian cross-sections
  [x0+120,CX,x1-120].forEach(xc=>{const w=wz(xc-CX);ctx.save();ctx.strokeStyle=col.teal;ctx.lineWidth=1.6;ctx.globalAlpha=.5;ctx.beginPath();
    for(let yy=-w*1.6;yy<=w*1.6;yy+=3){const g=Math.exp(-(yy*yy)/(w*w));ctx.lineTo(xc+g*40,y+yy);}ctx.stroke();ctx.restore();});
  if(BI>=1){panel(SX+70,SY+30,320,70,10);txt('θ ≈ λ / (π w₀)',SX+230,SY+65,22,col.ink,'center','middle',600);}
  if(BI===2)txt('cutting · pointers · optical tweezers · Blu-ray',CX,SB-6,20,col.dim,'center','middle',400);
 }},

/* 22 — FIBRE OPTICS --------------------------------------------- */
{tier:'MODERN',title:'Fibre optics — cashing in total internal reflection',
 beats:[
  {k:'F',t:'Remember trapping light past the critical angle? A glass fibre with a higher-index CORE does exactly that — light bounces down it by total internal reflection.'},
  {k:'T',t:'Step-index fibre guides pulses for kilometres with tiny loss. Single-mode fibre keeps one clean path so pulses stay crisp — each pulse is one bit.'},
  {k:'T',t:'This is the physical internet: undersea cables, data centres, plus endoscopes and fibre sensors. A whole civilisation running on TIR.'}
 ],
 draw(){
  const y=CY, x0=SX+120, x1=SR-120, h=44;
  // cladding
  ctx.save();ctx.globalAlpha=.25;ctx.fillStyle=col.violet;ctx.fillRect(x0,y-h-26,x1-x0,26);ctx.fillRect(x0,y+h,x1-x0,26);ctx.restore();
  ctx.save();ctx.globalAlpha=.12;ctx.fillStyle=col.teal;ctx.fillRect(x0,y-h,x1-x0,2*h);ctx.restore();
  line(x0,y-h,x1,y-h,col.teal,1.6,.7);line(x0,y+h,x1,y+h,col.teal,1.6,.7);
  tag(x0+10,y-h-38,'cladding (low n)',col.violet,14,'left');tag(x0+10,y,'core (high n)',col.teal,14,'left');
  // zigzag TIR path
  const period=150; ctx.save();ctx.strokeStyle=col.amber;ctx.lineWidth=2.6;ctx.globalAlpha=.9;ctx.beginPath();
  let px=x0,py=y+h,up=true;ctx.moveTo(px,py);
  while(px<x1){px+=period/2;py=up?y-h:y+h;up=!up;ctx.lineTo(Math.min(px,x1),py);}ctx.stroke();ctx.restore();
  // data pulses travelling
  if(BI>=1){const seg2=(x1-x0);for(let i=0;i<4;i++){const t=((T*220+i*140)%seg2);const px2=x0+t;
    // find y on zigzag
    const k2=Math.floor(t/(period/2));const frac=(t%(period/2))/(period/2);const ya=(k2%2===0)?lerp(y+h,y-h,frac):lerp(y-h,y+h,frac);
    photon(px2,ya,4,col.green);}}
  if(BI===2)txt('undersea cables · data centres · endoscopes · sensors',CX,SB-6,20,col.dim,'center','middle',400);
  else txt('total internal reflection guides the light',CX,SB-6,20,col.dim,'center','middle',400);
 }},

/* 23 — FOURIER OPTICS ------------------------------------------- */
{tier:'MODERN',title:'Fourier optics — images as spatial frequencies',
 beats:[
  {k:'T',t:'Deep idea: any image is a SUM of sinusoidal gratings. Coarse gratings carry big shapes; fine gratings carry sharp edges and detail.'},
  {k:'T',t:'A lens sorts these frequencies automatically — at its focal (Fourier) plane, low frequencies sit near the axis, high ones out at the edge.'},
  {k:'T',t:'So you can EDIT light: block the high frequencies → blur; block the low → keep only edges. Spatial filtering powers microscopy, lithography, optical computing.'}
 ],
 draw(){
  if(BI===0){
    // build a square-wave-ish profile from N sine terms
    const N=Math.round(lerp(1,9,segL(0,2.4)));
    const x0=SX+120,x1=SR-120,y=CY,amp=110;
    // target
    ctx.save();ctx.strokeStyle=col.faint;ctx.lineWidth=1.6;ctx.setLineDash([5,5]);ctx.beginPath();
    for(let x=x0;x<=x1;x+=4){const s=Math.sin((x-x0)*0.012)>0?1:-1;ctx.lineTo(x,y-s*amp*0.7);}ctx.stroke();ctx.restore();
    ctx.save();ctx.strokeStyle=col.teal;ctx.lineWidth=2.8;ctx.beginPath();
    for(let x=x0;x<=x1;x+=2){let v=0;for(let n=1;n<=N;n+=2){v+=Math.sin(n*(x-x0)*0.012)/n;}ctx.lineTo(x,y-v*amp);}ctx.stroke();ctx.restore();
    txt(N+' spatial frequencies',CX,SY+50,22,col.teal,'center','middle',600);
    txt('few terms = blur · many terms = sharp detail',CX,SB-6,20,col.dim,'center','middle',400);
  } else if(BI===1){
    const lx=CX,ax=CY;line(SX+60,ax,SR-60,ax,col.faint,1.2,.7,[4,6]);
    convLens(lx,ax,170,26,col.teal);
    // input gratings -> focal plane dots
    for(let i=0;i<5;i++){const dy=(i-2)*70;grow(SX+80,ax+dy,lx,ax+dy,seg(0,.8),col.blue,2,.7);
      const fx=lx+220,fy=ax+(i-2)*40;grow(lx,ax+dy,fx,fy,seg(.4,.8),col.teal,2,.8);dot(fx,fy,4,i===2?col.amber:col.violet,seg(.6,.4));}
    line(lx+220,ax-150,lx+220,ax+150,col.dim,2,.6);tag(lx+220,ax-170,'Fourier plane',col.dim,16);
    tag(lx+220,ax+8,'low freq',col.amber,13,'left');tag(lx+220,ax-130,'high freq',col.violet,13,'left');
  } else {
    txt('block high freq → blur    |    block low freq → edges',CX,CY-40,22,col.ink,'center','middle',500);
    // two mini demos
    for(let s=0;s<2;s++){const cx0=s?CX+260:CX-260;const blurred=s===0;
      for(let i=0;i<40;i++){const a=Math.random?0:0;} // no random
      ctx.save();ctx.translate(cx0,CY+80);
      if(blurred){ctx.globalAlpha=.5;ctx.fillStyle=col.teal;ctx.beginPath();ctx.arc(0,0,50,0,TAU);ctx.fill();tag(0,90,'low-pass → blur',col.dim,15);}
      else{ctx.globalAlpha=.9;ctx.strokeStyle=col.teal;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,50,0,TAU);ctx.stroke();tag(0,90,'high-pass → edges',col.dim,15);}
      ctx.restore();}
    txt('microscopy · lithography · optical computing',CX,SB-6,20,col.dim,'center','middle',400);
  }
 }},

/* ============================ ENGINE LOOP ============================ */
const startT=performance.now();
const meta=document.getElementById('meta');
const progf=document.getElementById('progf');
let totalBeats=0; scenes.forEach(s=>totalBeats+=s.beats.length);
function globalBeatIndex(){let n=0;for(let i=0;i<SI;i++)n+=scenes[i].beats.length;return n+BI;}
function updateBar(){
  const s=scenes[SI];
  meta.innerHTML=`<b>${s.title}</b> &nbsp;·&nbsp; ${tagName(s.beats[BI].k)} &nbsp;·&nbsp; beat ${BI+1}/${s.beats.length}`;
  progf.style.width=((globalBeatIndex()+1)/totalBeats*100)+'%';
  document.getElementById('prev').disabled=(SI===0&&BI===0);
  document.getElementById('next').disabled=(SI===scenes.length-1&&BI===scenes[SI].beats.length-1);
}
function tagName(k){return {T:'concept',R:'recap',G:'gap',F:'fill'}[k]||'';}
function frame(){
  T=(performance.now()-startT)/1000;
  BT=(performance.now()-beatStart)/1000;
  ctx.fillStyle=col.bg;ctx.fillRect(0,0,W,H);
  header();
  try{scenes[SI].draw();}catch(e){/* keep animating */}
  caption();
  updateBar();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============================ NAVIGATION ============================ */
function resetBeat(){beatStart=performance.now();}
function next(){const s=scenes[SI];if(BI<s.beats.length-1){BI++;}else if(SI<scenes.length-1){SI++;BI=0;}resetBeat();hideHint();}
function prev(){if(BI>0){BI--;}else if(SI>0){SI--;BI=scenes[SI].beats.length-1;}resetBeat();hideHint();}
function goto(i){SI=i;BI=0;resetBeat();closeTOC();hideHint();}
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();(e.clientX-r.left)<r.width*0.28?prev():next();});
window.addEventListener('keydown',e=>{
  if(['ArrowRight',' ','Spacebar','ArrowDown','PageDown'].includes(e.key)){e.preventDefault();next();}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==='Home'){SI=0;BI=0;resetBeat();}
  else if(e.key==='t'||e.key==='T'){toggleTOC();}
});
let hintGone=false;function hideHint(){if(hintGone)return;hintGone=true;const h=document.getElementById('hint');h.style.opacity=0;setTimeout(()=>h.remove(),1000);}

/* ============================ TABLE OF CONTENTS ============================ */
const toc=document.getElementById('toc'),tocBody=document.getElementById('tocBody');
function buildTOC(){
  const groups={GEOMETRIC:['Tier 1–2 · Geometric optics',[]],WAVE:['Tier 1–2 · Wave optics',[]],MODERN:['Tier 2 · Modern & applied',[]],MAP:['Overview',[]]};
  scenes.forEach((s,i)=>{(groups[s.tier][1]).push([i,s.title,s.beats.length]);});
  let html='';
  ['MAP','GEOMETRIC','WAVE','MODERN'].forEach(g=>{if(!groups[g][1].length)return;
    html+=`<h2>${groups[g][0]}</h2><div class="grp">`;
    groups[g][1].forEach(it=>{html+=`<div class="it" data-i="${it[0]}">${it[0]+1}. ${it[1]}<small>${it[2]} beat${it[2]>1?'s':''}</small></div>`;});
    html+='</div>';});
  tocBody.innerHTML=html;
  tocBody.querySelectorAll('.it').forEach(el=>el.onclick=()=>goto(+el.dataset.i));
}
function toggleTOC(){toc.style.display=toc.style.display==='block'?'none':'block';}
function closeTOC(){toc.style.display='none';}
document.getElementById('tocBtn').onclick=toggleTOC;
document.getElementById('tocClose').onclick=closeTOC;
toc.addEventListener('click',e=>{if(e.target===toc)closeTOC();});
buildTOC();
