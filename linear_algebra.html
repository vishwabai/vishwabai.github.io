<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linear Algebra — A Visual Lecture</title>
<style>
  :root{
    --bg:#08090b;
    --panel:#0e1013;
    --ink:#eae8e2;
    --dim:#7a808a;
    --dim2:#4c5158;
    --grid:#1d2027;
    --axis:#3a3f48;
    --blue:#5b8fc7;
    --gold:#c7a352;
    --red:#b96b56;
    --green:#6ea87c;
    --purple:#9082b0;
    --teal:#5aa39b;
    --line:#22252b;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  .stage{
    height:100vh; width:100vw;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:18px;
  }
  .frame{
    width:min(96vw, 1120px);
    aspect-ratio: 960/540;
    background:radial-gradient(ellipse at 50% 0%, #0c0d10 0%, #060708 75%);
    border:1px solid #1a1c21;
    border-radius:10px;
    position:relative;
    overflow:hidden;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.02);
  }
  .topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 22px 0 22px;
    z-index:5;
    pointer-events:none;
  }
  .eyebrow{
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--dim); font-weight:600;
  }
  .eyebrow b{ color:var(--ink); font-weight:600; }
  .slidecount{
    font-size:11px; color:var(--dim2); letter-spacing:0.08em; font-variant-numeric: tabular-nums;
  }
  svg#stage-svg{
    width:100%; height:100%; display:block;
  }
  .caption-wrap{
    width:min(96vw, 1120px);
    min-height:44px;
    display:flex; align-items:flex-start; justify-content:center;
    text-align:center;
    padding:0 20px;
  }
  .caption{
    font-size:16px; color:#c7c9cf; line-height:1.5; max-width:760px;
    transition:opacity .25s ease;
    font-weight:400;
  }
  .caption b{ color:var(--ink); font-weight:600; }
  .caption.fade{ opacity:0; }
  .controls{
    display:flex; align-items:center; gap:16px;
  }
  .navbtn{
    width:38px; height:38px; border-radius:50%;
    background:#121419; border:1px solid #23262d;
    color:var(--ink); font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .15s, transform .1s, border-color .15s;
    user-select:none;
  }
  .navbtn:hover{ background:#181b21; border-color:#33373f; }
  .navbtn:active{ transform:scale(0.92); }
  .navbtn.small{ width:auto; height:32px; padding:0 12px; border-radius:16px; font-size:12px; letter-spacing:.04em; gap:6px; color:var(--dim); }
  .navbtn.small:hover{ color:var(--ink); }
  .dots{ display:flex; gap:6px; align-items:center; }
  .dot{
    width:6px; height:6px; border-radius:50%; background:#2a2d34;
    cursor:pointer; transition: background .2s, transform .2s;
  }
  .dot:hover{ background:#484d57; }
  .dot.active{ background:var(--blue); transform:scale(1.5); }
  .hint{
    position:absolute; bottom:16px; right:20px;
    font-size:10.5px; color:#40444c; letter-spacing:.05em;
    z-index:5; pointer-events:none;
  }
  text{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; user-select:none; }
  .mono{ font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace; }
  .serif{ font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif; }

  .overlay{
    position:fixed; inset:0; background:rgba(4,5,6,0.72);
    display:flex; align-items:center; justify-content:center;
    z-index:50; opacity:0; pointer-events:none;
    transition:opacity .22s ease;
    padding:24px;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{
    width:min(94vw, 680px); max-height:82vh;
    background:linear-gradient(180deg,#121419,#0d0f13);
    border:1px solid #262a32; border-radius:14px;
    box-shadow:0 40px 100px -30px rgba(0,0,0,0.9);
    display:flex; flex-direction:column;
    transform:translateY(10px) scale(0.98);
    transition:transform .22s ease;
  }
  .overlay.open .drawer{ transform:translateY(0) scale(1); }
  .drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px; border-bottom:1px solid #1e2127;
  }
  .drawer-eyebrow{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim2); font-weight:600; margin-bottom:4px; }
  .drawer-title{ font-size:20px; font-weight:700; font-family:Georgia,'Iowan Old Style',serif; color:var(--ink); }
  .drawer-close{
    width:32px; height:32px; border-radius:50%; border:1px solid #262a32; background:#181b21;
    color:var(--dim); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .drawer-close:hover{ color:var(--ink); background:#1e2128; }
  .drawer-body{ padding:20px 22px 26px 22px; overflow-y:auto; }
  .dd-section{ margin-bottom:20px; }
  .dd-section:last-child{ margin-bottom:0; }
  .dd-label{
    font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:700;
    margin-bottom:9px; display:flex; align-items:center; gap:7px;
  }
  .dd-label.why{ color:var(--gold); }
  .dd-label.how{ color:var(--blue); }
  .dd-label.uses{ color:var(--green); }
  .dd-label.sub{ color:var(--purple); }
  .dd-why{ font-size:14px; line-height:1.65; color:#cfd1d7; }
  .dd-list{ margin:0; padding:0; list-style:none; }
  .dd-list.how li{ counter-increment:step; }
  .dd-list.how{ counter-reset:step; }
  .dd-list.how li::before{ content:counter(step); }
  .dd-list li{
    font-size:13.5px; line-height:1.55; color:#b8bac0;
    padding:6px 0 6px 26px; position:relative; border-bottom:1px solid #1a1c22;
  }
  .dd-list li:last-child{ border-bottom:none; }
  .dd-list.sub li::before, .dd-list.uses li::before{ content:'\2022'; }
  .dd-list li::before{
    position:absolute; left:2px; top:6px; font-size:11.5px; font-weight:700; width:16px; text-align:center;
  }
  .dd-list.sub li::before{ color:var(--purple); }
  .dd-list.how li::before{ color:var(--blue); }
  .dd-list.uses li::before{ color:var(--green); }
  .deepdive-btn{
    display:flex; align-items:center; gap:6px;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="frame">
    <div class="topbar">
      <div class="eyebrow" id="eyebrow">Linear Algebra</div>
      <div class="slidecount" id="slidecount">1 / 18</div>
    </div>
    <svg id="stage-svg" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="hint">← → to navigate&nbsp;&nbsp;·&nbsp;&nbsp;R to replay</div>
  </div>
  <div class="caption-wrap"><div class="caption" id="caption"></div></div>
  <div class="controls">
    <button class="navbtn" id="prevBtn" aria-label="previous">‹</button>
    <div class="dots" id="dots"></div>
    <button class="navbtn" id="nextBtn" aria-label="next">›</button>
    <button class="navbtn small deepdive-btn" id="deepDiveBtn">📖 deep dive</button>
    <button class="navbtn small" id="replayBtn">↻ replay</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <div>
        <div class="drawer-eyebrow">Deep dive</div>
        <div class="drawer-title" id="drawerTitle">Topic</div>
      </div>
      <button class="drawer-close" id="closeDrawer">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ===================== constants ===================== */
const NS = "http://www.w3.org/2000/svg";
const LEFT_W = 660;     // clipped diagram region
const PANEL_X = 700;    // right-hand text panel start
const CX = 330, CY = 300, S = 46;
const COL = {
  blue:'#5b8fc7', gold:'#c7a352', red:'#b96b56', green:'#6ea87c',
  purple:'#9082b0', teal:'#5aa39b', ink:'#eae8e2', dim:'#7a808a', grid:'#1d2027', axis:'#3a3f48'
};

/* ===================== tiny svg helpers ===================== */
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function setA(e, attrs){ for(const k in attrs) e.setAttribute(k, attrs[k]); }
function toX(x){ return CX + x*S; }
function toY(y){ return CY - y*S; }
function lerp(a,b,t){ return a + (b-a)*t; }

/* ===================== easing ===================== */
function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function easeOutBack(t){ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
function easeOutElastic(t){ const c4=(2*Math.PI)/3; return t===0?0:t===1?1:Math.pow(2,-9*t)*Math.sin((t*9-0.75)*c4)+1; }
function linear(t){ return t; }

/* ===================== tween engine (cancellable) ===================== */
function tween(duration, fn, easing, token){
  easing = easing || easeInOutCubic;
  return new Promise((resolve)=>{
    if(token && token.cancelled){ resolve(); return; }
    const start = performance.now();
    function frame(now){
      if(token && token.cancelled){ resolve(); return; }
      let t = Math.min(1, (now-start)/duration);
      fn(easing(t), t);
      if(t<1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });
}
function wait(ms, token){
  return new Promise((resolve)=>{
    if(token && token.cancelled){ resolve(); return; }
    let done=false;
    const id = setTimeout(()=>{ if(!done){done=true; resolve();} }, ms);
    if(token){
      const check = setInterval(()=>{
        if(token.cancelled && !done){ done=true; clearTimeout(id); clearInterval(check); resolve(); }
        if(done) clearInterval(check);
      }, 40);
    }
  });
}

/* ===================== caption ===================== */
function caption(text, dur){
  dur = dur===undefined ? 260 : dur;
  return new Promise((resolve)=>{
    const c = document.getElementById('caption');
    c.classList.add('fade');
    setTimeout(()=>{
      c.innerHTML = text;
      c.classList.remove('fade');
      resolve();
    }, dur);
  });
}

/* ===================== drawing primitives ===================== */
function clipLeft(svg){
  const defs = el('defs', {}, svg);
  const cp = el('clipPath', {id:'leftClip'}, defs);
  el('rect', {x:0,y:0,width:LEFT_W,height:540}, cp);
  return defs;
}

function makeGrid(svg, opts){
  opts = opts || {};
  const range = opts.range || 9;
  const color = opts.color || COL.grid;
  const g = el('g', {'clip-path':'url(#leftClip)'}, svg);
  const lines = [];
  for(let i=-range; i<=range; i++){
    const lv = el('line', {stroke:color, 'stroke-width':1}, g);
    lines.push({e:lv, type:'v', k:i});
    const lh = el('line', {stroke:color, 'stroke-width':1}, g);
    lines.push({e:lh, type:'h', k:i});
  }
  function apply(M){
    const a=M[0], b=M[1], c=M[2], d=M[3];
    for(const ln of lines){
      let x1,y1,x2,y2;
      if(ln.type==='v'){ x1=ln.k; y1=-range; x2=ln.k; y2=range; }
      else { x1=-range; y1=ln.k; x2=range; y2=ln.k; }
      const tx1=a*x1+b*y1, ty1=c*x1+d*y1;
      const tx2=a*x2+b*y2, ty2=c*x2+d*y2;
      setA(ln.e, {x1:toX(tx1), y1:toY(ty1), x2:toX(tx2), y2:toY(ty2)});
    }
  }
  apply([1,0,0,1]);
  return {g, apply};
}

function makeAxes(svg, range){
  range = range || 9;
  const g = el('g', {'clip-path':'url(#leftClip)'}, svg);
  el('line', {x1:toX(-range),y1:toY(0),x2:toX(range),y2:toY(0), stroke:COL.axis, 'stroke-width':1.4}, g);
  el('line', {x1:toX(0),y1:toY(-range),x2:toX(0),y2:toY(range), stroke:COL.axis, 'stroke-width':1.4}, g);
  return g;
}

function makeVector(svg, color, x0, y0, opts){
  opts = opts || {};
  const w = opts.width || 3;
  const g = el('g', {opacity: opts.opacity===undefined?1:opts.opacity}, svg);
  const line = el('line', {stroke:color, 'stroke-width':w, 'stroke-linecap':'round'}, g);
  const head = el('polygon', {fill:color}, g);
  let label = null;
  if(opts.label){
    label = el('text', {fill:color, 'font-size':opts.labelSize||15, 'font-weight':600}, g);
    label.textContent = opts.label;
  }
  function update(x,y){
    const ox = opts.origin ? toX(opts.origin[0]) : toX(0);
    const oy = opts.origin ? toY(opts.origin[1]) : toY(0);
    const X = opts.origin ? toX(opts.origin[0]+x) : toX(x);
    const Y = opts.origin ? toY(opts.origin[1]+y) : toY(y);
    setA(line, {x1:ox, y1:oy, x2:X, y2:Y});
    const ang = Math.atan2(Y-oy, X-ox);
    const hs = opts.headSize || 8.5;
    const p1 = [X,Y];
    const p2 = [X-hs*Math.cos(ang-0.42), Y-hs*Math.sin(ang-0.42)];
    const p3 = [X-hs*Math.cos(ang+0.42), Y-hs*Math.sin(ang+0.42)];
    head.setAttribute('points', p1.join(',')+' '+p2.join(',')+' '+p3.join(','));
    if(label){
      const len = Math.hypot(X-ox, Y-oy) || 1;
      const nx = (X-ox)/len, ny=(Y-oy)/len;
      label.setAttribute('x', X + nx*14 + ny*8);
      label.setAttribute('y', Y + ny*14 - nx*8);
    }
  }
  update(x0===undefined?0:x0, y0===undefined?0:y0);
  return {g, line, head, update};
}

function textEl(svg, x, y, str, opts){
  opts = opts || {};
  const t = el('text', {
    x:x, y:y, fill: opts.fill || COL.ink, 'font-size': opts.size || 15,
    'font-weight': opts.weight || 400, 'text-anchor': opts.anchor || 'start',
    opacity: opts.opacity===undefined?1:opts.opacity,
    class: opts.mono ? 'mono' : (opts.serif ? 'serif':'')
  }, svg);
  t.textContent = str;
  return t;
}

function fadeEl(target, from, to, dur, token){
  return tween(dur, (e)=>{ target.setAttribute('opacity', lerp(from,to,e)); }, easeOutCubic, token);
}

function theoryPanel(svg, x, y, title, bullets, opts){
  opts = opts || {};
  const g = el('g', {opacity:0}, svg);
  const label = el('text', {x, y, fill:COL.dim2, 'font-size':10.5, 'letter-spacing':'0.12em', 'font-weight':600}, g);
  label.textContent = (title || 'key ideas').toUpperCase();
  el('line', {x1:x, y1:y+11, x2:x+220, y2:y+11, stroke:'#20232a', 'stroke-width':1}, g);
  const lineH = opts.lineH || 25;
  bullets.forEach((b, i)=>{
    const ty = y + 36 + i*lineH;
    el('circle', {cx:x+3, cy:ty-4.5, r:2, fill:COL.dim2}, g);
    const t = el('text', {x:x+14, y:ty, fill:COL.dim, 'font-size':opts.size || 12.5}, g);
    t.textContent = b;
  });
  return g;
}

function mathPanel(svg, x, y, lines, opts){
  opts = opts || {};
  const g = el('g', {opacity:0}, svg);
  const label = el('text', {x, y, fill:COL.dim2, 'font-size':10.5, 'letter-spacing':'0.12em', 'font-weight':600}, g);
  label.textContent = (opts.title || 'the math').toUpperCase();
  const lineH = opts.lineH || 24;
  lines.forEach((ln, i)=>{
    const t = el('text', {x, y: y+22+i*lineH, fill: opts.color || COL.ink, 'font-size': opts.size || 14.5, class:'mono'}, g);
    t.textContent = ln;
  });
  return g;
}

function drawMatrixBox(svg, x, y, rows, opts){
  // rows: array of arrays of strings/numbers
  opts = opts || {};
  const cw = opts.cw || 46, ch = opts.ch || 34;
  const nr = rows.length, nc = rows[0].length;
  const w = nc*cw, h = nr*ch;
  const g = el('g', {opacity: opts.opacity===undefined?1:opts.opacity}, svg);
  const bx = x, by = y;
  // brackets
  const bw = 8;
  el('path', {d:`M ${bx+bw} ${by} L ${bx} ${by} L ${bx} ${by+h} L ${bx+bw} ${by+h}`,
      stroke:COL.dim, 'stroke-width':1.6, fill:'none'}, g);
  el('path', {d:`M ${bx+w-bw} ${by} L ${bx+w} ${by} L ${bx+w} ${by+h} L ${bx+w-bw} ${by+h}`,
      stroke:COL.dim, 'stroke-width':1.6, fill:'none'}, g);
  const cells = [];
  for(let r=0;r<nr;r++){
    const rowCells=[];
    for(let c=0;c<nc;c++){
      const cxp = bx + c*cw + cw/2;
      const cyp = by + r*ch + ch/2 + 5;
      const cellColor = (opts.colColors && opts.colColors[c]) ? opts.colColors[c] : COL.ink;
      const t = el('text', {x:cxp, y:cyp, fill:cellColor, 'font-size':opts.fs||16,
        'text-anchor':'middle', class:'mono', 'font-weight':600}, g);
      t.textContent = rows[r][c];
      rowCells.push(t);
    }
    cells.push(rowCells);
  }
  return {g, cells, w, h};
}

/* ===================== reusable linear-transform scene ===================== */
function buildLinearScene(svg, opts){
  opts = opts || {};
  const range = opts.range || 9;
  const grid = makeGrid(svg, {range});
  makeAxes(svg, range);
  let square = null;
  if(opts.showSquare){
    square = el('polygon', {points:'', fill:'rgba(144,130,176,0.22)', stroke:COL.purple, 'stroke-width':1.6, 'clip-path':'url(#leftClip)'}, svg);
  }
  const iHat = makeVector(svg, COL.blue, 1, 0, {label:'î', width:3.4});
  const jHat = makeVector(svg, COL.gold, 0, 1, {label:'ĵ', width:3.4});
  let curM = [1,0,0,1];
  function applyAll(M){
    grid.apply(M);
    iHat.update(M[0], M[2]);
    jHat.update(M[1], M[3]);
    if(square){
      const pts = [[0,0],[1,0],[1,1],[0,1]].map(([x,y])=>{
        const tx=M[0]*x+M[1]*y, ty=M[2]*x+M[3]*y;
        return toX(tx)+','+toY(ty);
      });
      square.setAttribute('points', pts.join(' '));
    }
    if(opts.onApply) opts.onApply(M);
  }
  applyAll(curM);
  async function animateTo(M, duration, token, easing){
    const from = curM.slice();
    await tween(duration||1100, (e)=>{
      const cur = [0,1,2,3].map(k=>lerp(from[k], M[k], e));
      applyAll(cur);
    }, easing||easeInOutCubic, token);
    curM = M.slice();
  }
  return {grid, iHat, jHat, square, applyAll, animateTo, get current(){return curM;}};
}

/* ===================== slide chrome / title card ===================== */
async function bigTitle(svg, title, sub, token){
  const t = textEl(svg, 480, 250, title, {size:44, weight:700, anchor:'middle', serif:true, opacity:0});
  const s = sub ? textEl(svg, 480, 288, sub, {size:15, weight:400, anchor:'middle', fill:COL.dim, opacity:0}) : null;
  await tween(500, e=>{ t.setAttribute('opacity', e); if(s) s.setAttribute('opacity', e*0.9); }, easeOutCubic, token);
  await wait(600, token);
  return {t, s};
}
async function shrinkTitleToCorner(t, s, token){
  const start = {x:480, y:250, size:44};
  await tween(650, (e)=>{
    const x = lerp(480, 46, e);
    const y = lerp(250, 44, e);
    const size = lerp(44, 20, e);
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('font-size', size);
    t.setAttribute('text-anchor', lerp(0,1,e) > 0.5 ? 'start':'middle');
    if(s) s.setAttribute('opacity', 1-e);
  }, easeInOutCubic, token);
  t.setAttribute('text-anchor','start');
  if(s) s.remove();
}

/* ===================== SLIDES ===================== */
const SLIDES = [];

/* ---- 0: Title ---- */
SLIDES.push({
  name:'Welcome',
  async play(ctx){
    const {svg, token} = ctx;
    clipLeft(svg);
    const g = makeGrid(svg, {range:9, color:'#161920'});
    makeAxes(svg, 9);
    await caption('A visual tour of the mathematics behind machine learning.', 10);
    const title = textEl(svg, 480, 235, 'Linear Algebra', {size:54, weight:700, anchor:'middle', serif:true, opacity:0});
    const sub = textEl(svg, 480, 275, 'the geometry of transformation', {size:16, anchor:'middle', fill:COL.dim, opacity:0});
    await tween(700, e=>{ title.setAttribute('opacity',e); sub.setAttribute('opacity', e*0.9); }, easeOutCubic, token);
    await wait(300, token);
    // demonstrate a gentle shear as ambient motion
    let M=[1,0,0,1];
    await tween(1600, e=>{
      const k = Math.sin(e*Math.PI)*0.35;
      g.apply([1,k*0.6,k*0.3,1]);
    }, easeInOutCubic, token);
    g.apply([1,0,0,1]);
    await wait(200, token);

  why:'A scalar is the simplest object — a single quantity with no direction. We need scalars because every vector and matrix is ultimately built from them: coordinates, weights, and transformation factors are all scalars. The "field" a vector space is built over (usually ℝ) is defined by which scalars are allowed.',
  how:['Identify the quantity: is it just a size or count?','Check it has no direction or components','Use it to scale a vector: c·v'],
  uses:['Temperature, mass, price — anything with only magnitude','The learning rate in gradient descent is a scalar','A neuron\u2019s bias term is a scalar'] },
/* 2 Vectors */
{ subtopics:['Position vectors','Displacement vectors','Feature vectors (ML)'],
  why:'We need a way to describe a quantity with both size and direction — like velocity or force. Listing n numbers (v₁,...,vₙ) captures both: the entries tell you how far to move along each basis direction, and together they define one arrow in n-dimensional space.',
  how:['Write the vector as a tuple of n numbers','Draw it as an arrow from the origin','Add/scale using the vector operations'],
  uses:['A pixel\u2019s RGB color is a 3D vector','A word embedding is a 300+ dimension vector','A robot arm\u2019s pose is a vector in joint-space'] },
/* 3 Vector Operations */
{ subtopics:['Commutativity of addition','Associativity','Distributive laws'],
  why:'Addition and scalar multiplication are defined component-wise so that combining vectors matches combining the physical quantities they represent — two displacements one after another should add to the total displacement. This is the unique rule consistent with the tip-to-tail picture.',
  how:['To add: add matching components, (a+b)ᵢ=aᵢ+bᵢ','To scale: multiply every component by c','Combine both for any linear combination c₁a+c₂b'],
  uses:['Averaging feature vectors (mean pooling in ML)','Physics: combining forces or velocities','Image blending as a weighted sum of pixel vectors'] },
/* 4 Norm & Length */
{ subtopics:['L2 norm (Euclidean)','L1 norm (Manhattan)','Unit vectors'],
  why:'We define the norm from the Pythagorean theorem because along perpendicular axes, straight-line distance decomposes into right-angle legs. Generalizing a²+b²=c² to n dimensions gives ‖v‖=√(v₁²+...+vₙ²) — matching physical distance in any dimension.',
  how:['Square every component','Sum the squares','Take the square root'],
  uses:['Measuring distance between points (k-NN)','Normalizing vectors for cosine similarity','L2 regularization (weight penalty) in ML models'] },
/* 5 Matrices */
{ subtopics:['Square vs rectangular','Sparse matrices','Block matrices'],
  why:'A matrix is a grid because it must describe how EACH of n input directions maps to an output — that needs n output vectors (columns), each living in m-dimensional output space, giving an m×n grid. This is exactly what matrix-vector multiplication requires.',
  how:['Decide size: m rows (outputs) × n cols (inputs)','Fill aᵢⱼ with input j\u2019s effect on output i','Read columns as where each basis vector lands'],
  uses:['An image is literally a matrix of pixel values','Adjacency matrices represent graphs/networks','Weight matrices connect neural network layers'] },
/* 6 Transpose */
{ subtopics:['Symmetric matrices','Transpose of a product','Conjugate transpose'],
  why:'Flipping rows and columns reverses the "roles" of inputs and outputs. The rule (AB)ᵀ=BᵀAᵀ falls out of the index-swap definition directly: transposing a product must reverse multiplication order to keep the indices matching.',
  how:['Swap aᵢⱼ with aⱼᵢ for every entry','Dimensions swap: n×m from m×n','Verify (Aᵀ)ᵀ = A'],
  uses:['Computing AᵀA for least squares/normal equations','Symmetric matrices (A=Aᵀ) model covariance/energy','Transposing weights during backpropagation'] },
/* 7 Tensors */
{ subtopics:['Rank vs dimension','Tensor contraction','Tensors in deep learning'],
  why:'As data gets richer, one or two indices aren\u2019t enough — a color video needs (time, height, width, channel), four indices. Rather than invent new math, we generalize the same index structure indefinitely, so matrix rules extend naturally to any number of dimensions.',
  how:['Count how many independent indices the data needs','That count is the tensor\u2019s rank (order)','Operations generalize matrix rules index-by-index'],
  uses:['A batch of color images is a rank-4 tensor','PyTorch/TensorFlow tensors are the core data structure','Physics: stress tensors, curvature tensors'] },
/* 8 Matrix Multiplication */
{ subtopics:['Associativity, not commutativity','Composition of transformations','Block matrix multiplication'],
  why:'Matrix multiplication is defined as (AB)v=A(Bv) specifically so multiplying matrices corresponds to composing their transformations. If "first B then A" must be a single matrix, entries must combine via row-dot-column — any other rule would break composition.',
  how:['Take the dot product of row i of A with column j of B','That gives entry (i,j) of the result','Repeat for every row/column pair'],
  uses:['Stacking neural network layers','3D graphics: combining rotation, scale, translation','Markov chains: transition matrices compose over time'] },
/* 9 Identity */
{ subtopics:['Kronecker delta','Identity as neutral element','Permutation matrices'],
  why:'We need a matrix meaning "do nothing," so matrix multiplication has a neutral element — like 1 for multiplication. Since columns show where basis vectors land, "do nothing" means î stays at (1,0,...), ĵ stays at (0,1,...): exactly the diagonal-of-ones matrix.',
  how:['Put 1 on every diagonal entry (i=j)','Put 0 everywhere else','Confirm I·v = v for any v'],
  uses:['Regularization baseline: A + λI','Represents "no transformation" in graphics pipelines','Identity/skip connections in ResNets'] },
/* 10 Inverse */
{ subtopics:['Singular vs invertible','Pseudo-inverse (non-square)','Adjugate formula'],
  why:'We want an operation reversing a transformation, like division reverses multiplication. An inverse exists only if the map preserves all information (rank-deficient maps can\u2019t be undone). The 2×2 formula comes directly from solving AA⁻¹=I algebraically.',
  how:['Compute det(A); if 0, no inverse exists','For 2×2: swap diagonal, negate off-diagonal, divide by det','Larger matrices: Gaussian elimination or adjugate'],
  uses:['Solving Ax=b directly: x=A⁻¹b','Camera calibration & 3D reconstruction','Kalman filters use matrix inverses to update estimates'] },
/* 11 Linear Systems */
{ subtopics:['Consistent vs inconsistent','Homogeneous systems','Gaussian elimination'],
  why:'A linear system is just Ax=b written out — each equation is a linear combination of unknowns set equal to a constant, so stacking m equations naturally becomes matrix-vector multiplication. Solving means inverting: which input x maps to the known output b?',
  how:['Write equations as rows of A, constants as b','Use elimination or A⁻¹ to isolate x','Check by substituting the solution back'],
  uses:['Circuit analysis (Kirchhoff\u2019s laws)','Structural engineering force-balance equations','Economic equilibrium models'] },
/* 12 Rank */
{ subtopics:['Row rank = column rank','Rank and invertibility','Low-rank approximation'],
  why:'Rank measures how much of the output space a transformation can reach — the dimension of the column space, since that\u2019s the set of all possible outputs Av. Dependent columns mean some output directions are unreachable, and rank drops accordingly.',
  how:['Row-reduce the matrix to echelon form','Count the non-zero pivot rows','That count is the rank'],
  uses:['Recommender systems assume low-rank user-item matrices','Detecting redundant features/multicollinearity','Image compression via low-rank approximation'] },
/* 13 Null/Column Space */
{ subtopics:['Kernel (null space)','Image (column space)','Rank-nullity theorem'],
  why:'Every map has inputs it destroys (sends to 0) and outputs it can reach. Null space = {x : Ax=0} captures "directions of no consequence." Rank-nullity (dim null + dim col = n) follows because every input dimension is either absorbed into the null space or contributes a new output dimension.',
  how:['Solve Ax=0 to find the null space basis','Pivot columns of A span the column space','Verify dim(null) + rank(A) = number of columns'],
  uses:['Detecting unidentifiable parameters in statistics','Robotics: null space of Jacobian = redundant motion','Signal processing: undetectable signal directions'] },
/* 14 Determinant */
{ subtopics:['Cofactor expansion','Determinant & eigenvalues','Determinant as volume'],
  why:'det=ad-bc equals the signed area of the parallelogram formed by the columns — derivable directly from the area formula. This makes it the natural measure of how a transform scales area/volume, with sign showing whether orientation flips.',
  how:['2×2: multiply diagonal, subtract anti-diagonal','Larger: expand along a row/column (cofactors)','Zero determinant means space collapses'],
  uses:['Checking if a system has a unique solution','Computing volumes in physics/graphics','Jacobians for change of variables in calculus'] },
/* 15 Trace */
{ subtopics:['Trace & eigenvalues','Trace as linear functional','Trace in matrix calculus'],
  why:'Trace equals the sum of eigenvalues because of how the characteristic polynomial factors: det(A-λI) expands to λⁿ-tr(A)λⁿ⁻¹+..., and matching coefficients shows the eigenvalues\u2019 sum must equal tr(A) — the simplest basis-independent summary of a matrix.',
  how:['Add the diagonal entries a₁₁+a₂₂+...+aₙₙ','Equivalently, sum all eigenvalues','Use tr(AB)=tr(BA) to simplify expressions'],
  uses:['Matrix norms (Frobenius norm uses trace)','Physics: trace of stress/inertia tensors','Trace regularization in ML loss functions'] },
/* 16 Eigenvalues */
{ subtopics:['Characteristic polynomial','Algebraic vs geometric multiplicity','Complex eigenvalues'],
  why:'We seek directions where Av is just a scaled v (Av=λv) because these are the transform\u2019s "natural axes." Rearranging gives (A-λI)v=0, which has a nonzero solution only when A-λI is singular — det(A-λI)=0 is exactly the characteristic equation.',
  how:['Set up det(A - λI) = 0','Solve the resulting polynomial for λ','For each λ, solve (A-λI)v=0 for v'],
  uses:['Google PageRank: dominant eigenvector of link matrix','Vibration analysis: eigenvalues = resonant frequencies','PCA: eigenvectors of covariance = principal directions'] },
/* 17 Diagonalization */
{ subtopics:['Eigenbasis','Matrix powers','Defective matrices'],
  why:'Describing a transform using its own eigenvectors as coordinate axes leaves nothing to do but scale each axis independently — no mixing. That\u2019s exactly a diagonal matrix, so A=QDQ⁻¹ is "change to eigenbasis, scale, change back."',
  how:['Find all eigenvalues and eigenvectors of A','Put eigenvectors as columns of Q, eigenvalues in D','Verify A = Q D Q⁻¹'],
  uses:['Fast Aᵏ computation (population growth, Markov chains)','Solving linear systems of differential equations','Simplifying repeated matrix ops in simulations'] },
/* 18 Symmetric */
{ subtopics:['Positive definite matrices','Quadratic forms','Spectral decomposition'],
  why:'Symmetric matrices arise whenever a quantity is measured "both ways" the same (covariance of x,y = covariance of y,x). The spectral theorem guarantees real eigenvalues and orthogonal eigenvectors precisely because symmetry forces the characteristic roots real and the eigenvectors orthogonal.',
  how:['Check A = Aᵀ entry by entry','Eigen-decompose: guaranteed real λ, orthogonal v','Write A = QΛQᵀ using orthonormal Q'],
  uses:['Covariance/correlation matrices in statistics','Hessian matrices in optimization (convexity checks)','Graph Laplacians in spectral clustering'] },
/* 19 Orthogonality */
{ subtopics:['Dot product geometry','Orthogonal complement','Orthogonal projections'],
  why:'a·b=Σaᵢbᵢ is defined so it matches ‖a‖‖b‖cos(θ): expand ‖a-b‖²=‖a‖²+‖b‖²-2a·b and compare to the law of cosines c²=a²+b²-2ab·cos(θ) — they must be the same quantity. Since cos(90°)=0, perpendicular vectors have zero dot product.',
  how:['Multiply matching components aᵢ·bᵢ','Sum all the products','Zero result means the vectors are perpendicular'],
  uses:['Cosine similarity in NLP/search','Orthogonal frequencies don\u2019t interfere (signal processing)','Physics: work = force · displacement'] },
/* 20 Orthogonal Matrices */
{ subtopics:['Rotation matrices','Reflection matrices','Preserving inner products'],
  why:'We want transforms that don\u2019t distort shapes. QᵀQ=I means every pair of columns has zero dot product (perpendicular) and unit length — exactly the conditions to preserve every vector\u2019s length and every angle between vectors.',
  how:['Check columns are unit length: ‖qᵢ‖=1','Check columns are mutually perpendicular','Confirm QᵀQ = I'],
  uses:['3D rotations in graphics/robotics','QR decomposition for stable numerical solving','Preserving distances in orthogonal transforms'] },
/* 21 Gram-Schmidt */
{ subtopics:['QR decomposition','Orthonormalization','Numerical stability'],
  why:'Given independent vectors, we want a perpendicular version spanning the same space, since orthogonal directions have no cross-terms. Subtracting b\u2019s projection onto a removes exactly the overlapping part, guaranteeing what\u2019s left is perpendicular by definition of projection.',
  how:['Keep the first vector as-is','Subtract its projection from the next vector','Repeat for each vector, then normalize all'],
  uses:['Building orthonormal bases for numerical algorithms','QR decomposition for stable least-squares solving','Constructing orthogonal basis functions in DSP'] },
/* 22 Basis */
{ subtopics:['Standard basis','Minimal spanning set','Basis and dimension'],
  why:'We want the smallest set of "building block" vectors that reconstructs any vector via combination — fewer, and some vectors become unreachable; more, and it\u2019s redundant. This minimal, complete set is what makes coordinates well-defined and unique.',
  how:['Choose vectors that are linearly independent','Confirm they span the whole space','Any vector\u2019s coordinates are then unique'],
  uses:['Efficient feature representations in ML','Fourier/wavelet bases for signal compression','RGB/HSV are different bases for color'] },
/* 23 Independence & Span */
{ subtopics:['Testing independence','Spanning sets','Redundant vectors'],
  why:'Independence is defined as "no nontrivial combination gives zero" because that guarantees every vector in the span has a UNIQUE representation — a nonzero combination equaling zero would let you add it to any representation and get another valid one.',
  how:['Set c₁v₁+...+cₙvₙ = 0','Solve for the constants cᵢ','If only c=0 works, they\u2019re independent'],
  uses:['Feature selection: removing dependent features','Detecting multicollinearity in regression','Compressed sensing relies on sparse independence'] },
/* 24 Vector Spaces */
{ subtopics:['Vector space axioms','Subspaces','Function spaces'],
  why:'We formalize "vector space" with closure axioms (addition/scaling stay inside) because that\u2019s the minimal structure needed for all vector arithmetic to make sense — any space obeying these rules, even polynomials or functions, behaves just like arrows in ℝⁿ.',
  how:['Check a zero vector exists','Check closure under addition','Check closure under scalar multiplication'],
  uses:['Function spaces in Fourier analysis/quantum mechanics','Polynomial spaces in numerical approximation','State spaces in control theory & RL'] },
/* 25 Change of Basis */
{ subtopics:['Basis matrices','Coordinate transformation','Similarity transforms'],
  why:'A vector is fixed, but its coordinate LIST depends on the basis — like measuring distance in miles vs km. [v]_B=P⁻¹v works because P (built from new basis vectors) converts new coordinates into standard ones, so P⁻¹ reverses that.',
  how:['Build P with new basis vectors as columns','Compute P⁻¹','Multiply: [v]_B = P⁻¹v'],
  uses:['Eigenbasis coordinates simplify computation','Robotics: converting between coordinate frames','Graphics: object/world/camera space transforms'] },
/* 26 Projection */
{ subtopics:['Orthogonal projection','Projection matrices','Least squares connection'],
  why:'We want the closest point to b along a\u2019s direction. Geometry shows the closest point is where the leftover error (b-p) is perpendicular to a — solving (b-ta)·a=0 for t gives exactly t=(a·b)/(a·a).',
  how:['Compute a·b and a·a','Divide: t = a·b / a·a','Multiply: p = t·a'],
  uses:['Least squares regression (project onto column space)','Graphics: shadows and lighting calculations','Recommenders: projecting onto latent factors'] },
/* 27 Least Squares */
{ subtopics:['Normal equations','Residuals','Overdetermined systems'],
  why:'When Ax=b has no exact solution, we minimize ‖Ax-b‖² instead. Setting its derivative to zero leads directly to AᵀAx=Aᵀb — meaning the residual (Ax-b) must be orthogonal to every column of A, otherwise x could be adjusted to reduce error further.',
  how:['Form AᵀA and Aᵀb','Solve the normal equations for x','Or use QR/SVD for a numerically stable solve'],
  uses:['Linear regression is literally least squares','Curve fitting in scientific data analysis','GPS positioning via noisy-measurement triangulation'] },
/* 28 SVD */
{ subtopics:['Singular values','Low-rank approximation','SVD vs eigendecomposition'],
  why:'Not every matrix has eigenvectors — but every matrix can be built from rotate → stretch → rotate. This works because AᵀA is always symmetric positive semi-definite, so it always has orthogonal eigenvectors (V) and non-negative eigenvalues (σ²), which become SVD\u2019s pieces.',
  how:['Compute AᵀA\u2019s eigenvectors → V, singular values σ','Compute AV to get U\u2019s directions (normalize)','Assemble M = U Σ Vᵀ'],
  uses:['Recommender systems (matrix factorization)','Image compression (keep top singular values)','Latent semantic analysis in NLP'] },
/* 29 Covariance */
{ subtopics:['Variance vs covariance','Positive semi-definiteness','Correlation matrix'],
  why:'To describe multi-dimensional spread, we need each dimension\u2019s variance AND how dimensions move together. Σ=(1/n)Σxᵢxᵢᵀ works because each outer product captures pairwise coordinate products, and averaging gives the expected co-movement.',
  how:['Center the data (subtract the mean)','Compute xᵢxᵢᵀ for each point','Average all the outer products'],
  uses:['Portfolio risk modeling in finance','Anomaly detection (Mahalanobis distance)','Feeds directly into PCA'] },
/* 30 PCA */
{ subtopics:['Explained variance','Dimensionality reduction','Whitening'],
  why:'We want the direction where projected data spreads out most (retains most information). Maximizing Var(wᵀx) subject to ‖w‖=1 via Lagrange multipliers gives exactly Σw=λw — so the best direction is an eigenvector of the covariance matrix.',
  how:['Compute the covariance matrix of centered data','Find its eigenvectors and eigenvalues','Project data onto the top-k eigenvectors'],
  uses:['Compressing high-dimensional data (genomics, images)','Visualizing data in 2D/3D','Noise reduction before ML models'] },
/* 31 Closing */
{ subtopics:['Numerical linear algebra','Applications in deep learning','Optimization & calculus connections'],
  why:'This tour covered the core vocabulary and intuition of linear algebra. The next step is applying these ideas to real data and models, where efficient computation (numerical linear algebra) and calculus-based optimization take over.',
  how:['Implement these operations in NumPy/PyTorch','Apply them to a real dataset','Connect to calculus via gradients & derivatives'],
  uses:['Build a linear regression from scratch','Run PCA on a real dataset','Study backpropagation as chained matrix derivatives'] }
];

/* ===================== controller ===================== */
let currentToken = null;
let currentIndex = 0;

function buildDots(){
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  SLIDES.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (i===currentIndex?' active':'');
    d.addEventListener('click', ()=> renderSlide(i));
    dots.appendChild(d);
  });
}
function updateChrome(i){
  document.getElementById('eyebrow').innerHTML = 'Linear Algebra &nbsp;·&nbsp; <b>' + SLIDES[i].name + '</b>';
  document.getElementById('slidecount').textContent = (i+1) + ' / ' + SLIDES.length;
  const dots = document.querySelectorAll('.dot');
  dots.forEach((d,idx)=> d.classList.toggle('active', idx===i));
}

async function renderSlide(i){
  if(i<0 || i>=SLIDES.length) return;
  if(currentToken) currentToken.cancelled = true;
  const token = {cancelled:false};
  currentToken = token;
  currentIndex = i;
  const svg = document.getElementById('stage-svg');
  svg.innerHTML = '';
  const c = document.getElementById('caption');
  c.classList.add('fade');
  c.textContent = '';
  updateChrome(i);
  const ctx = {svg, token};
  try{ await SLIDES[i].play(ctx); }catch(err){ console.error(err); }
}

document.getElementById('prevBtn').addEventListener('click', ()=> renderSlide(currentIndex-1));
document.getElementById('nextBtn').addEventListener('click', ()=> renderSlide(currentIndex+1));
document.getElementById('replayBtn').addEventListener('click', ()=> renderSlide(currentIndex));

/* ---- deep dive drawer ---- */
const overlayEl = document.getElementById('overlay');
const drawerTitleEl = document.getElementById('drawerTitle');
const drawerBodyEl = document.getElementById('drawerBody');

function renderDrawer(i){
  const d = DEEPDIVE[i] || {};
  drawerTitleEl.textContent = SLIDES[i].name;
  let html = '';
  if(d.subtopics && d.subtopics.length){
    html += '<div class="dd-section"><div class="dd-label sub">Related subtopics</div><ul class="dd-list sub">'
      + d.subtopics.map(s=>'<li>'+s+'</li>').join('') + '</ul></div>';
  }
  if(d.why){
    html += '<div class="dd-section"><div class="dd-label why">Why this equation</div><p class="dd-why">'+d.why+'</p></div>';
  }
  if(d.how && d.how.length){
    html += '<div class="dd-section"><div class="dd-label how">How to calculate it</div><ul class="dd-list how">'
      + d.how.map(s=>'<li>'+s+'</li>').join('') + '</ul></div>';
  }
  if(d.uses && d.uses.length){
    html += '<div class="dd-section"><div class="dd-label uses">Real-world uses</div><ul class="dd-list uses">'
      + d.uses.map(s=>'<li>'+s+'</li>').join('') + '</ul></div>';
  }
  drawerBodyEl.innerHTML = html;
}
function openDrawer(){ renderDrawer(currentIndex); overlayEl.classList.add('open'); }
function closeDrawer(){ overlayEl.classList.remove('open'); }

document.getElementById('deepDiveBtn').addEventListener('click', openDrawer);
document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
overlayEl.addEventListener('click', (e)=>{ if(e.target===overlayEl) closeDrawer(); });

document.addEventListener('keydown', (e)=>{
  if(overlayEl.classList.contains('open')){
    if(e.key==='Escape'){ closeDrawer(); }
    return;
  }
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); renderSlide(currentIndex+1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); renderSlide(currentIndex-1); }
  else if(e.key==='r' || e.key==='R'){ renderSlide(currentIndex); }
});

buildDots();
renderSlide(0);

})();
</script>
