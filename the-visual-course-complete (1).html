<style>

 canvas{ display:block; background:var(--bg); }

 #bar{ position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; gap:14px; z-index:6;

 .nav{ width:36px; height:36px; border-radius:50%; cursor:pointer; border:1px solid rgba(255,255,255,.14); background:transparent;
   color:#cfd3da; font-size:17px; display:flex; align-items:center; justify-content:center; transition:.15s; }
 .nav:hover{ background:rgba(255,255,255,.08); color:#fff; } .nav:disabled{ opacity:.28; cursor:default; }
 #track{ width:300px; height:4px; border-radius:3px; background:rgba(255,255,255,.14); overflow:hidden; }
 #fill{ height:100%; width:0%; background:#d6a15b; transition:width .25s,background .25s; }
 #count{ color:#7a808a; font-size:12px; min-width:64px; text-align:center; font-variant-numeric:tabular-nums; letter-spacing:.5px; }
 #menuBtn{ position:fixed; left:18px; top:16px; z-index:7; cursor:pointer; padding:8px 14px; border-radius:10px;
   border:1px solid rgba(255,255,255,.12); background:rgba(18,20,26,.7); color:#cfd3da; font-size:13px; backdrop-filter:blur(6px); }
 #menuBtn:hover{ background:rgba(255,255,255,.09); color:#fff; }
 #menu{ position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:rgba(4,5,7,.72); backdrop-filter:blur(3px); }
 #menu.show{ display:flex; }
 #menuInner{ width:min(600px,88vw); max-height:86vh; overflow:auto; background:#0d0f14; border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:22px; }
 #menuInner h2{ color:#e7e8ea; font-size:17px; font-weight:600; margin-bottom:4px; }

 .chapItem{ display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; cursor:pointer;
   padding:12px 15px; margin-bottom:8px; border-radius:10px; border:1px solid rgba(255,255,255,.07);
   background:#101319; color:#cfd3da; font-size:14.5px; transition:.15s; }
 .chapItem:hover{ background:#161a22; border-color:rgba(255,255,255,.16); }
 .chapItem.on{ border-color:#d6a15b; color:#fff; }
 .chapItem .ct{ color:#6b7079; font-size:12px; font-variant-numeric:tabular-nums; }

 #infoBtn{ position:fixed; left:132px; top:16px; z-index:7; cursor:pointer; padding:8px 14px; border-radius:10px;
   border:1px solid rgba(255,255,255,.12); background:rgba(18,20,26,.7); color:#cfd3da; font-size:13px; backdrop-filter:blur(6px); }
 #infoBtn:hover,#infoBtn.on{ background:rgba(214,161,91,.16); color:#e8c893; border-color:rgba(214,161,91,.4); }
 #info{ position:fixed; left:50%; bottom:120px; transform:translateX(-50%) translateY(14px); width:min(880px,92vw);
   z-index:6; opacity:0; pointer-events:none; transition:.28s; display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;
   padding:18px 20px; border-radius:16px; background:rgba(13,15,20,.92); border:1px solid rgba(255,255,255,.08); backdrop-filter:blur(10px); }
 #info.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
 #info .ib{ min-width:0; }
 #info .il{ display:block; font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase; color:#6b7079; margin-bottom:6px; font-weight:700; }
 #info p{ color:#d7dae0; font-size:14px; line-height:1.42; }
 #info p.fml{ font-family:'Cambria Math','Georgia',serif; font-size:16px; color:#e8c893; }
 #hint{ position:fixed; left:50%; bottom:104px; transform:translateX(-50%); color:#4c515a; font-size:12px; z-index:5; transition:opacity .6s; pointer-events:none; }
</style></head>
<body>
 <div id="stage"><canvas id="c"></canvas></div>
 <button id="menuBtn">☰ chapters</button>
 <button id="infoBtn">ⓘ theory</button>
 <div id="hint">← → or Space · press I for theory · M for chapters · Home / End to jump</div>
 <div id="chap"></div>
 <div id="bar"><button class="nav" id="prev">‹</button><div id="track"><div id="fill"></div></div><span id="count"></span><button class="nav" id="next">›</button></div>
 <div id="info"><div class="ib"><span class="il">Theory</span><p id="infoT"></p></div><div class="ib"><span class="il">Formula</span><p id="infoF" class="fml"></p></div><div class="ib"><span class="il">Application</span><p id="infoA"></p></div></div>
 <div id="menu"><div id="menuInner"><h2>The Visual Course</h2>
   <p>Twenty-two chapters · the derivative → the research frontier → modern AI engineering.</p>
   <div id="menuList"></div></div></div>
<script>
"use strict";
/* ===== DECK 1: The Derivative ===== */
const DECK_1=(function(){

"use strict";
/* ============================================================
   MINI ENGINE  — no dependencies, virtual 1280x720 (16:9)
   ============================================================ */
const VW=1280, VH=720;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let dpr=1;
const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const UIFONT="'Segoe UI',system-ui,-apple-system,sans-serif";
const MATHFONT="'Cambria Math','Georgia','Times New Roman',serif";

// muted palette (semantic roles, no glow)
const C={
  bg:'#08090c', ink:'#e7e8ea', dim:'#868c96', faint:'#3b414b',
  grid:'#171a20',
  blue:'#6f9bcc',   // input / time / x
  amber:'#d6a15b',  // the function / output
  green:'#79b087',  // accumulation / "zero slope" payoff
  red:'#cb6f6f',    // gotcha
  violet:'#9d8ec9'  // special / higher structure
};

function resize(){
  const w=window.innerWidth, h=window.innerHeight, R=16/9;
  let cw,ch;
  if(w/h>R){ ch=h; cw=h*R; } else { cw=w; ch=w/R; }
  canvas.style.width=cw+'px'; canvas.style.height=ch+'px';
  dpr=Math.min(2, window.devicePixelRatio||1);
  canvas.width=Math.round(VW*dpr); canvas.height=Math.round(VH*dpr);
}
window.addEventListener('resize',resize); resize();

/* ---------- math + easing ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeInOut=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const deriv=(f,x,h=1e-3)=>(f(x+h)-f(x-h))/(2*h);

/* ---------- draw primitives (all respect ctx.globalAlpha) ---------- */
function line(x1,y1,x2,y2,color,w=2,alpha=1,dash=null){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=w;
  ctx.lineCap='round'; if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function circle(x,y,r,color,o={}){
  const {fill=true,alpha=1,w=2}=o;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.beginPath(); ctx.arc(x,y,r,0,7);
  if(fill){ ctx.fillStyle=color; ctx.fill(); } else { ctx.strokeStyle=color; ctx.lineWidth=w; ctx.stroke(); }
  ctx.restore();
}
function ell(x,y,rx,ry,color,fill,alpha=1,w=2){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.beginPath(); ctx.ellipse(x,y,Math.abs(rx),Math.abs(ry),0,0,7);
  if(fill){ ctx.fillStyle=color; ctx.fill(); } else { ctx.strokeStyle=color; ctx.lineWidth=w; ctx.stroke(); }
  ctx.restore();
}
function arrow(x1,y1,x2,y2,color,w=2,alpha=1,head=9){
  line(x1,y1,x2,y2,color,w,alpha);
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-head*Math.cos(a-0.42),y2-head*Math.sin(a-0.42));
  ctx.lineTo(x2-head*Math.cos(a+0.42),y2-head*Math.sin(a+0.42));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function txt(s,x,y,size,color,o={}){
  const {align='left',baseline='alphabetic',weight=400,alpha=1,italic=false,font=UIFONT}=o;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=color;
  ctx.textAlign=align; ctx.textBaseline=baseline;
  ctx.font=(italic?'italic ':'')+weight+' '+size+'px '+font;
  ctx.fillText(s,x,y); ctx.restore();
}
// colored formula runs: parts=[{t,c,it}]
function measureParts(parts,size){
  let w=0;
  for(const p of parts){ ctx.font=(p.it?'italic ':'')+size+'px '+(p.it?MATHFONT:UIFONT); w+=ctx.measureText(p.t).width; }
  return w;
}
function formula(parts,x,y,size,align='left',alpha=1){
  const w=measureParts(parts,size);
  let cx=align==='center'?x-w/2:align==='right'?x-w:x;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.textBaseline='middle';
  for(const p of parts){
    ctx.font=(p.it?'italic ':'')+size+'px '+(p.it?MATHFONT:UIFONT);
    ctx.fillStyle=p.c||C.ink; ctx.textAlign='left';
    ctx.fillText(p.t,cx,y); cx+=ctx.measureText(p.t).width;
  }
  ctx.restore();
}
function roundRectPath(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function pill(cx,cy,text,size,fg,alpha=1,bg='#0d0f14'){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.font='600 '+size+'px '+UIFONT;
  const w=ctx.measureText(text).width, padX=15, h=size+16, rw=w+2*padX;
  roundRectPath(cx-rw/2,cy-h/2,rw,h,h/2);
  ctx.fillStyle=bg; ctx.fill(); ctx.strokeStyle=fg; ctx.lineWidth=1.4; ctx.stroke();
  ctx.fillStyle=fg; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text,cx,cy+1); ctx.restore();
}

/* ---------- plot helpers ---------- */
function P(ox,oy,ux,uy){ return {X:u=>ox+u*ux, Y:v=>oy-v*uy, ox,oy,ux,uy}; }
function axes(p,xr,yr,alpha=1){
  arrow(p.X(xr[0]),p.Y(0),p.X(xr[1]),p.Y(0),C.faint,1.5,alpha,8);
  arrow(p.X(0),p.Y(yr[0]),p.X(0),p.Y(yr[1]),C.faint,1.5,alpha,8);
}
function plot(p,f,xa,xb,color,w,frac=1,alpha=1,samples=260){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=w;
  ctx.lineJoin='round'; ctx.lineCap='round'; ctx.beginPath();
  const end=Math.max(1,Math.floor(samples*frac));
  for(let i=0;i<=end;i++){
    const x=xa+(xb-xa)*i/samples, px=p.X(x), py=p.Y(f(x));
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.stroke(); ctx.restore();
}
function tangent(p,f,x0,halfU,color,w=2,alpha=1){
  const m=deriv(f,x0), y0=f(x0);
  line(p.X(x0-halfU),p.Y(y0-m*halfU), p.X(x0+halfU),p.Y(y0+m*halfU), color,w,alpha);
}
function clipStage(fn){
  ctx.save(); ctx.beginPath(); ctx.rect(58,100,1164,548); ctx.clip(); fn(); ctx.restore();
}

/* ---------- slide chrome ---------- */
function head(title,phase){
  txt(title,80,64,30,C.ink,{weight:600});
  line(80,90,1200,90,C.grid,1);
  if(phase){
    const col = phase==='RECAP'?C.dim : phase==='GAP'?C.amber : C.green;
    // small marker dot + label, not all-caps eyebrow chrome overuse: it's a genuine phase state
    circle(1176,58,5,col);
    txt(phase,1166,64,17,col,{align:'right',weight:700});
  }
}
function cap(s,alpha=1){ txt(s,640,668,21,C.dim,{align:'center',alpha}); }

/* ---------- navigation / clocks ---------- */
let idx=0, step=0, slideClock=0, stepClock=0, last=performance.now();
let SS={}; // per-slide scratch state
let dt=0;

function rev(at){ if(step>at)return 1; if(step<at)return 0; return RM?1:easeOut(clamp(stepClock/0.7,0,1)); }
function revd(at,dur){ if(step>at)return 1; if(step<at)return 0; return RM?1:easeOut(clamp(stepClock/dur,0,1)); }

function setStep(n){ step=n; stepClock=0; }
function enterSlide(n,at=0){ idx=n; slideClock=0; SS={}; setStep(at); updateUI(); }
function next(){ const S=slides[idx];
  if(step<S.steps-1) setStep(step+1);
  else if(idx<slides.length-1) enterSlide(idx+1,0);
  updateUI();
}
function prev(){
  if(step>0) setStep(step-1);
  else if(idx>0) enterSlide(idx-1, slides[idx-1].steps-1);
  updateUI();
}

/* ============================================================
   SLIDES
   ============================================================ */
const slides=[];

/* -- S0 : title ------------------------------------------------ */
slides.push({ steps:1, render(){
  const p=P(210,470,64,58), f=x=>Math.sin(x*0.9)*1.05;
  clipStage(()=>{
    plot(p,f,0,13.2,C.faint,2,1,0.55);
    const T=13.2, tt = RM?6.0:(slideClock*1.05)%T;
    tangent(p,f,tt,1.5,C.amber,2,0.85);
    circle(p.X(tt),p.Y(f(tt)),6,C.amber);
  });
  txt('The Derivative',640,300,64,C.ink,{align:'center',weight:700});
  txt('the mathematics of change',640,350,25,C.dim,{align:'center'});
  txt('seeing change up close',640,600,17,C.faint,{align:'center',italic:true});
  const pulse=0.5+0.5*Math.sin(slideClock*2);
  txt('press  →  or  Space',640,660,14,C.faint,{align:'center',alpha:0.35+0.5*pulse});
}});

/* -- S1 : rate of a straight line (foundation / RECAP) --------- */
slides.push({ steps:3, render(){
  head('A rate is a slope', step>=2?'RECAP':null);
  const p=P(250,592,88,66), f=x=>0.9*x;
  clipStage(()=>{
    axes(p,[0,6.4],[0,5.4]);
    txt('position',236,244,14,C.dim,{align:'right'});
    txt('time',p.X(6.4)+6,p.Y(0)+5,14,C.dim);
    plot(p,f,0,6,C.blue,3,rev(0));
    if(step>=1){
      const a=revd(1,0.8), x1=1.2, x2=4.4;
      line(p.X(x1),p.Y(f(x1)), p.X(x1+(x2-x1)*a),p.Y(f(x1)), C.dim,2,1,[6,5]);
      line(p.X(x2),p.Y(f(x1)), p.X(x2),p.Y(f(x1)+(f(x2)-f(x1))*a), C.amber,2,1,[6,5]);
      circle(p.X(x1),p.Y(f(x1)),5,C.ink,{alpha:a});
      circle(p.X(x2),p.Y(f(x2)),5,C.ink,{alpha:a});
      txt('Δt',p.X((x1+x2)/2),p.Y(f(x1))+24,20,C.dim,{align:'center',italic:true,alpha:a});
      txt('Δx',p.X(x2)+24,p.Y((f(x1)+f(x2))/2),20,C.amber,{align:'center',baseline:'middle',italic:true,alpha:a});
    }
  });
  if(step>=2){
    formula([{t:'slope = ',c:C.dim},{t:'Δx',c:C.amber,it:true},{t:' / ',c:C.dim},
      {t:'Δt',c:C.blue,it:true},{t:'  = 0.9',c:C.ink}], 900,320,28,'left',rev(2));
    txt('same everywhere',900,360,17,C.faint,{alpha:rev(2)});
  }
  const c=['A ball moving at a steady speed traces a straight line.',
           'Slope = rise over run — how much output per step of input.',
           'A straight line has one slope everywhere; its rate never changes.'][step];
  cap(c);
}});

/* -- S2 : the curve (GAP) -------------------------------------- */
slides.push({ steps:3, render(){
  head('But real motion bends', step>=1?'GAP':null);
  const p=P(250,592,74,54), f=x=>0.14*x*x;
  clipStage(()=>{
    axes(p,[0,7.2],[0,6]);
    plot(p,f,0,6.9,C.blue,3,rev(0));
    if(step>=1){
      const a=rev(1);
      tangent(p,f,1.6,1.0,C.faint,2,a); circle(p.X(1.6),p.Y(f(1.6)),4,C.dim,{alpha:a});
      tangent(p,f,5.0,1.0,C.faint,2,a); circle(p.X(5.0),p.Y(f(5.0)),4,C.dim,{alpha:a});
      const px=3.4, pulse=0.5+0.5*Math.sin(slideClock*4);
      circle(p.X(px),p.Y(f(px)),7,C.amber,{alpha:a});
      circle(p.X(px),p.Y(f(px)),7+9*pulse,C.amber,{fill:false,alpha:a*0.4*(1-pulse)});
      txt('here?',p.X(px)+16,p.Y(f(px))-14,20,C.amber,{alpha:a});
    }
  });
  if(step>=2) txt('a different steepness at every point',640,150,22,C.ink,{align:'center',alpha:rev(2)});
  const c=['Now the ball speeds up — the path curves.',
           'Near the start it is gentle; later it is steep. One number cannot describe all of it.',
           'So what is the slope at a single instant? — this is the whole problem.'][step];
  cap(c);
}});

/* -- S3 : secant -> tangent (FILL: the limit) ------------------ */
slides.push({ steps:4, render(){
  head('Shrink the gap to zero','FILL');
  const p=P(232,600,66,46), f=x=>0.14*x*x, x0=4.2;
  let h;
  if(step===0) h=2.6; else if(step===1) h=lerp(2.6,0.06,easeInOut(clamp(stepClock/3,0,1))); else h=0.06;
  const x1=x0+h, m=(f(x1)-f(x0))/h;
  clipStage(()=>{
    axes(p,[0,8.2],[0,8.6]);
    plot(p,f,0,7.7,C.blue,3,1);
    const col = step>=2?C.amber:C.violet, span=2.4;
    line(p.X(x0-span),p.Y(f(x0)-m*span), p.X(x0+span),p.Y(f(x0)+m*span), col,3);
    circle(p.X(x0),p.Y(f(x0)),5,C.ink);
    if(step<2){
      circle(p.X(x1),p.Y(f(x1)),5,C.ink);
      line(p.X(x0),p.Y(f(x0)), p.X(x1),p.Y(f(x0)), C.faint,1.5,0.7,[4,4]);
      txt('h = '+h.toFixed(2), p.X(x0+h/2), p.Y(f(x0))+22, 17, C.dim,{align:'center'});
    }
  });
  txt('slope',110,150,16,C.dim);
  txt(m.toFixed(3), 110,182,30, step>=2?C.amber:C.violet, {weight:600});
  if(step>=2){
    formula([{t:'f ′(x)',c:C.amber,it:true},{t:' = ',c:C.dim},{t:'lim',c:C.dim},
      {t:' h→0  ',c:C.blue,it:true},{t:'[ f(x+h) − f(x) ]',c:C.ink,it:true},
      {t:' / ',c:C.dim},{t:'h',c:C.blue,it:true}], 700,150,25,'center',rev(2));
  }
  if(step>=3) txt('at x = 4.2 the exact slope is 1.176',640,206,20,C.green,{align:'center',alpha:rev(3)});
  const c=['A secant line cuts the curve at two points, a gap h apart.',
           'Slide the second point in — watch the slope settle on one value…',
           '…the secant becomes the tangent. That limit is the derivative.',
           'One instant, one exact slope. The impossible question now has an answer.'][step];
  cap(c);
}});

/* -- S4 : local linearity (Feynman zoom) ----------------------- */
slides.push({ steps:3, render(){
  head('Up close, every smooth curve is straight', null);
  const x0=1.15, f=x=>Math.sin(x), y0=f(x0), m=Math.cos(x0);
  const zTarget = step===0?1 : step===1?6 : 26;
  SS.Z = (SS.Z==null)?1:SS.Z;
  SS.Z += (zTarget-SS.Z)*(RM?1:Math.min(1,dt*3.0));
  const ux=150*SS.Z, uy=150*SS.Z, cx=640, cy=380;
  const pp={X:u=>cx+(u-x0)*ux, Y:v=>cy-(v-y0)*uy};
  clipStage(()=>{
    // scaling grid — spacing fixed in math units so lines spread as we zoom
    const gu=0.5;
    for(let k=-10;k<=10;k++){ const gx=pp.X(x0+k*gu); if(gx>60&&gx<1220) line(gx,100,gx,648,C.grid,1); }
    for(let k=-10;k<=10;k++){ const gy=pp.Y(y0+k*gu); if(gy>100&&gy<648) line(60,gy,1220,gy,C.grid,1); }
    line(pp.X(x0-6),pp.Y(y0+m*(-6)), pp.X(x0+6),pp.Y(y0+m*6), C.faint,1.5,0.85);
    const halfU=520/ux;
    plot(pp,f,x0-halfU,x0+halfU,C.amber,3,1,1,300);
    circle(pp.X(x0),pp.Y(y0),6,C.ink);
  });
  txt('zoom  ×'+SS.Z.toFixed(0),1200,150,20,C.dim,{align:'right'});
  if(step>=2) txt('this straight line is the derivative',640,150,22,C.ink,{align:'center',alpha:rev(2)});
  const c=['A gentle sine curve, one point marked.',
           'Zoom in — the bend flattens out.',
           'Zoom further — curve and its tangent become one. The derivative is that line’s slope.'][step];
  cap(c);
}});

/* -- S5 : slope of every point = a new curve ------------------- */
slides.push({ steps:3, render(){
  head('Every slope, plotted, becomes a new curve', null);
  const T=4*Math.PI, ox=170, ux=(1108-170)/T;
  const top=P(ox,238,ux,68), bot=P(ox,528,ux,68);

function initParts(n,x0,x1,y0,y1,vm){const a=[];for(let i=0;i<n;i++)a.push({x:lerp(x0,x1,Math.random()),y:lerp(y0,y1,Math.random()),vx:(Math.random()*2-1)*vm,vy:(Math.random()*2-1)*vm});return a;}
function stepParts(a,x0,x1,y0,y1,dt){a.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<x0){p.x=x0;p.vx*=-1;}if(p.x>x1){p.x=x1;p.vx*=-1;}if(p.y<y0){p.y=y0;p.vy*=-1;}if(p.y>y1){p.y=y1;p.vy*=-1;}});}

function tok(cx,cy,text,col,a=1){ctx.save();ctx.globalAlpha*=a;ctx.font='600 15px '+UIFONT;const w=ctx.measureText(text).width,pad=10,rw=Math.max(38,w+2*pad),h=34;roundRectPath(cx-rw/2,cy-h/2,rw,h,6);ctx.fillStyle='#101319';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=1.4;ctx.stroke();ctx.fillStyle=C.ink;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,cx,cy);ctx.restore();return rw;}
function arc(x1,y1,x2,y2,w,color,a){ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo((x1+x2)/2,Math.min(y1,y2)-70,x2,y2);ctx.stroke();ctx.restore();}
function layer(x,ys,col,r=15){return ys.map(y=>{node(x,y,r,null,col);return[x,y];});}
function connect(A,B,col,a=.4){A.forEach(p=>B.forEach(q=>line(p[0],p[1],q[0],q[1],col,1,a)));}

/* ===== nav / clocks ===== */
let idx=0,step=0,slideClock=0,stepClock=0,last=performance.now(),SS={},dt=0;
function rev(at){if(step>at)return 1;if(step<at)return 0;return RM?1:easeOut(clamp(stepClock/0.7,0,1));}
function revd(at,d){if(step>at)return 1;if(step<at)return 0;return RM?1:easeOut(clamp(stepClock/d,0,1));}
function setStep(n){step=n;stepClock=0;}
function enterSlide(n,at=0){idx=n;slideClock=0;SS={};setStep(at);updateUI();}
function next(){const S=slides[idx];if(step<S.steps-1)setStep(step+1);else if(idx<slides.length-1)enterSlide(idx+1,0);updateUI();}
function prev(){if(step>0)setStep(step-1);else if(idx>0)enterSlide(idx-1,slides[idx-1].steps-1);updateUI();}


/* extra helpers */
function tangent(p,f,x0,hu,color,w,a){w=w||2;a=(a==null?1:a);const m=(f(x0+1e-3)-f(x0-1e-3))/2e-3,y0=f(x0);line(p.X(x0-hu),p.Y(y0-m*hu),p.X(x0+hu),p.Y(y0+m*hu),color,w,a);}
function tile(cx,cy,w,h,label,fg){roundRectPath(cx-w/2,cy-h/2,w,h,6);ctx.save();ctx.fillStyle='#0d0f14';ctx.fill();ctx.strokeStyle=fg;ctx.lineWidth=1.4;ctx.stroke();ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='600 15px '+UIFONT;ctx.fillText(label,cx,cy);ctx.restore();}
function initParts(n,x0,x1,y0,y1,vm){const a=[];for(let i=0;i<n;i++)a.push({x:lerp(x0,x1,Math.random()),y:lerp(y0,y1,Math.random()),vx:(Math.random()*2-1)*vm,vy:(Math.random()*2-1)*vm});return a;}
function stepParts(a,x0,x1,y0,y1,dt){a.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<x0){p.x=x0;p.vx*=-1;}if(p.x>x1){p.x=x1;p.vx*=-1;}if(p.y<y0){p.y=y0;p.vy*=-1;}if(p.y>y1){p.y=y1;p.vy*=-1;}});}
function network(nodes,edges,active,pathE){edges.forEach(e=>{const on=pathE&&pathE.has(e.id);line(nodes[e.a].x,nodes[e.a].y,nodes[e.b].x,nodes[e.b].y,on?C.amber:C.grid,on?3:1.5,.9);if(e.w!=null)txt(e.w,(nodes[e.a].x+nodes[e.b].x)/2,(nodes[e.a].y+nodes[e.b].y)/2-6,13,C.dim,{align:'center'});});nodes.forEach((n,i)=>{const on=active&&active.has(i);circle(n.x,n.y,15,on?C.blue:'#0d0f14');circle(n.x,n.y,15,C.blue,{fill:false,w:2});txt(n.l!=null?n.l:i,n.x,n.y,14,on?C.bg:C.ink,{align:'center',baseline:'middle',weight:600});});}

/* ===== CH6 Computing/LLMs (177-222) ===== */
{t:'From switching electrons to reasoning in language — the computing stack.',f:'bit → model',a:'All of software and AI.'},
{t:'CS foundations: how computation is organized and fundamentally bounded.',f:'O(·)',a:'Efficient, feasible software.'},
{t:'Each data structure trades speed on one operation for cost on another.',f:'array O(1), tree O(log n)',a:'Databases, graphics, search.'},
{t:'Big-O describes how running time grows with input size, ignoring constants.',f:'O(n), O(n log n), O(n²)',a:'Judging algorithm feasibility.'},
{t:'Divide-and-conquer splits a problem, solves the pieces, and merges the results.',f:'T(n)=2T(n/2)+n',a:'Mergesort, FFT, quicksort.'},
{t:'Dynamic programming caches subproblem answers, turning exponential work into linear.',f:'F(n)=F(n−1)+F(n−2)',a:'Routing, sequence alignment.'},
{t:'A Turing machine defines computability; no program decides whether all programs halt.',f:'halting: undecidable',a:'Limits of computation.'},
{t:'P versus NP asks whether every quickly-checkable problem is quickly solvable.',f:'P =? NP',a:'Cryptography, optimization.'},
{t:'Systems: the machine underneath — speed, memory, and parallelism.',f:'latency vs bandwidth',a:'Performance engineering.'},
{t:'Memory forms a pyramid, each level larger but far slower than the one above.',f:'reg<L1<RAM<disk',a:'Cache-aware performance.'},
{t:'CPUs favour few strong cores; GPUs and TPUs favour massive parallelism.',f:'SIMD, matmul array',a:'Graphics, deep learning.'},
{t:'Two threads updating shared state can interleave and lose an update — a race.',f:'read-modify-write',a:'Concurrency bugs, locks.'},
{t:'Machine learning fits a function from examples that must generalize to new data.',f:'y=f(x;θ)',a:'Prediction, classification.'},
{t:'A model learns the pattern behind data, not the individual points.',f:'ŷ=f(x)',a:'Forecasting, recognition.'},
{t:'Beyond a point, added complexity fits noise and test error climbs — overfitting.',f:'err_test↑',a:'Model selection, regularization.'},
{t:'A decision tree splits feature space by questions; a forest averages many.',f:'majority vote',a:'Tabular data, ranking.'},
{t:'An SVM picks the boundary with the widest margin; a kernel lifts tangled data.',f:'max margin',a:'Classification, bioinformatics.'},
{t:'k-means groups unlabeled points around moving centers.',f:'min Σ‖x−μ‖²',a:'Segmentation, discovery.'},
{t:'Momentum and Adam smooth and adapt gradient steps to train deep nets.',f:'θ←θ−η∇L',a:'Training neural networks.'},
{t:'Deep learning stacks simple units into powerful, trainable functions.',f:'σ(Wx+b)',a:'Vision, speech, language.'},
{t:'A neuron takes a weighted sum of inputs and passes it through a nonlinearity.',f:'y=φ(Σwᵢxᵢ+b)',a:'Building block of all nets.'},
{t:'A wide enough network can approximate any continuous function; depth makes it efficient.',f:'universal approximation',a:'Function fitting, control.'},
{t:'Backpropagation is the chain rule at scale, telling each weight how to change.',f:'∂L/∂w',a:'Training all deep networks.'},
{t:'A nonlinear activation is what lets stacked layers exceed a single linear map.',f:'ReLU(x)=max(0,x)',a:'Depth, expressive power.'},
{t:'A convolution slides a shared filter over an image to build feature maps.',f:'(f*g)',a:'Computer vision.'},
{t:'RNNs carry memory along a sequence, but gradients vanish over long spans.',f:'hₜ=f(hₜ₋₁,xₜ)',a:'Sequences — the gap attention fills.'},
{t:'Embeddings place tokens as vectors so meaning becomes geometry and arithmetic.',f:'king−man+woman≈queen',a:'What LLMs reason over.'},
{t:'The transformer architecture powers modern language models.',f:'attention + FFN',a:'ChatGPT, translation, code.'},
{t:'A tokenizer splits text into sub-word pieces mapped to integer ids.',f:'text→ids→vectors',a:'LLM input processing.'},
{t:'Attention weighs how much each token should attend to every other.',f:'softmax(QKᵀ/√d)V',a:'The core of transformers.'},
{t:'Multiple attention heads learn different relationships in parallel.',f:'concat(head₁…head_h)',a:'Syntax, reference, position.'},
{t:'A transformer block is attention plus a feed-forward net, with residuals and norm.',f:'x+FFN(x+Attn(x))',a:'Stacked N times in every LLM.'},
{t:'Positional encodings stamp order onto tokens attention otherwise treats as a set.',f:'PE=sin/cos(pos)',a:'Word order, sequence meaning.'},
{t:'Pretraining predicts the next token over vast text, learning language itself.',f:'max Σ log P(xₜ|x_<ₜ)',a:'Foundation models.'},
{t:'Loss falls predictably as a power law in compute, data, and model size.',f:'L∝C^{−α}',a:'Guiding investment in scale.'},
{t:'Fine-tuning then RLHF turn a raw predictor into a helpful, aligned assistant.',f:'reward model + RL',a:'Chat assistants.'},
{t:'From a few examples in the prompt, the model infers the task with no weight change.',f:'few-shot prompt',a:'Prompting, adaptation.'},
{t:'Generation is token-by-token; a KV cache avoids recompute, sampling adds control.',f:'top-p, temperature',a:'Text generation.'},
{t:'A router sends each token to a few experts, giving huge models at modest cost.',f:'top-k of N experts',a:'Largest frontier models.'},
{t:'Reliability: making powerful models honest, safe, and trustworthy.',f:'align(objective)',a:'Deployable, safe AI.'},
{t:'Optimizing a measurable proxy can drift away from what we truly want.',f:'proxy ≠ goal',a:'The alignment problem.'},
{t:'A fluent but false answer stated with high confidence is a hallucination.',f:'confidence ≠ accuracy',a:'Grounding, calibration.'},
{t:'Interpretability traces which neurons and circuits compute which concepts.',f:'features, circuits',a:'Trust, debugging, safety.'},
{t:'Benchmarks, human ratings, and adversarial red-teaming stress-test a model.',f:'eval + red-team',a:'Release safety.'},
{t:'Tools and retrieval turn a text predictor into an agent that acts and cites sources.',f:'LLM + tools + RAG',a:'Autonomous assistants.'},

/* ===== CH7 Algorithms & DS (223-247) ===== */
{t:'Algorithms and data structures are the craft of organizing computation efficiently.',f:'O(time), O(space)',a:'All software.'},
{t:'All data is bits: each position is a power of two, summed to a number.',f:'Σ bᵢ2ⁱ',a:'Every representation.'},
{t:'Two′s complement stores negatives; arithmetic wraps around, causing overflow.',f:'−x=~x+1',a:'Integer overflow bugs.'},
{t:'A float packs sign, exponent, and mantissa — binary scientific notation.',f:'(−1)ˢ·1.m·2ᵉ',a:'Why 0.1+0.2≠0.3.'},
{t:'Arrays give O(1) indexing; linked lists give O(1) insertion but no random access.',f:'array vs pointers',a:'Choosing the right container.'},
{t:'A stack is last-in-first-out; a queue is first-in-first-out.',f:'LIFO vs FIFO',a:'Recursion, scheduling, traversal.'},
{t:'A hash function maps keys to slots for O(1) average lookup; collisions are chained.',f:'index=h(key) mod m',a:'Dictionaries, caches, indexing.'},
{t:'Balanced trees use rotations to keep depth logarithmic, guaranteeing fast search.',f:'height=O(log n)',a:'Databases, sorted maps.'},
{t:'A B-tree fattens each node to hold many keys, minimizing slow disk reads.',f:'height=O(log_b n)',a:'Database indexes.'},
{t:'A heap keeps every parent above its children, so the extreme is always at the root.',f:'insert/pop O(log n)',a:'Priority queues, Dijkstra.'},
{t:'A trie branches by character, so words sharing a prefix share a path.',f:'lookup O(len)',a:'Autocomplete, spell-check.'},
{t:'Union-find merges sets and answers connectivity in near-constant time.',f:'α(n) amortized',a:'Kruskal, network connectivity.'},
{t:'Quicksort partitions around a pivot and recurses, averaging n log n.',f:'avg O(n log n)',a:'Standard library sorting.'},
{t:'Mergesort and heapsort guarantee n log n with no bad-pivot risk.',f:'O(n log n) worst',a:'Stable and in-place sorting.'},
{t:'Radix and counting sort avoid comparisons, sorting short-key data in linear time.',f:'O(n·k)',a:'Integer and string sorting.'},
{t:'Binary search halves a sorted range each step, keeping the target within [lo,hi].',f:'O(log n)',a:'Lookup, root-finding.'},
{t:'BFS explores level by level with a queue; DFS plunges deep with a stack.',f:'O(V+E)',a:'Routing, connectivity, search.'},
{t:'A topological sort orders a DAG so every dependency comes before its dependents.',f:'DAG ordering',a:'Build systems, scheduling.'},
{t:'A minimum spanning tree connects all nodes at least total edge cost.',f:'min Σ w(e)',a:'Network design, clustering.'},
{t:'Dijkstra suits non-negative weights, Bellman-Ford handles negatives, A* adds a heuristic.',f:'d[v]=min(d[u]+w)',a:'GPS, game AI, networks.'},
{t:'A greedy algorithm takes the locally best choice, optimal only for certain problems.',f:'local ⇒ global?',a:'Coin change, scheduling.'},
{t:'Backtracking tries choices and undoes dead ends, searching a tree of possibilities.',f:'try, fail, undo',a:'Sudoku, N-queens, constraints.'},
{t:'KMP precomputes safe jumps so text is scanned once, never re-read.',f:'O(n+m)',a:'grep, DNA search.'},
{t:'A rare expensive operation, averaged over many cheap ones, stays cheap — amortized.',f:'avg O(1)',a:'Dynamic arrays, hash tables.'},
{t:'NP-complete problems reduce to one another; solving one fast solves them all.',f:'SAT-complete',a:'Optimization, scheduling, crypto.'},
/* ===== CH8 Systems/Net/Sec (248-272) ===== */
{t:'Systems, networks, and security: the machinery that runs the modern world.',f:'process, packet, key',a:'All deployed software.'},
{t:'A process has isolated memory; threads inside it share memory and need locks.',f:'shared state + locks',a:'Concurrency, servers.'},
{t:'The scheduler rotates programs through the CPU in tiny slices, faking simultaneity.',f:'time-slice',a:'Multitasking operating systems.'},
{t:'Virtual memory maps each process′s private pages onto scattered physical frames and disk.',f:'virtual→physical',a:'Isolation, memory beyond RAM.'},
{t:'A circular wait on locks means no process can proceed — deadlock.',f:'circular wait',a:'OS design, databases.'},
{t:'A file system adds names and inodes pointing to a file′s scattered disk blocks.',f:'inode→blocks',a:'Storage, persistence.'},
{t:'The network stack wraps a message in headers, layer by layer, and unwraps at the far end.',f:'app/TCP/IP/link',a:'All internet traffic.'},
{t:'Packets carry a destination IP; routers forward them hop by hop toward it.',f:'longest-prefix match',a:'Internet routing.'},
{t:'TCP handshakes a connection, then numbers and acknowledges every byte for reliability.',f:'SYN, SYN-ACK, ACK',a:'Web, email, file transfer.'},
{t:'TCP ramps its send rate until loss, then backs off — a fair sawtooth.',f:'AIMD',a:'Sharing bandwidth.'},
{t:'DNS resolves human names to IP addresses through a cached hierarchy.',f:'name→IP',a:'Every web request.'},
{t:'HTTP is a stateless request-response: a verb, a resource, a status, and data.',f:'GET /path → 200',a:'Web APIs, REST services.'},
{t:'ACID guarantees a transaction is all-or-nothing, valid, isolated, and durable.',f:'A,C,I,D',a:'Banking, databases.'},
{t:'An index is a sorted B-tree that turns table scans into log-time lookups.',f:'O(log n)',a:'Fast database queries.'},
{t:'Under a network partition you can keep only consistency or availability, not both.',f:'C, A, P: pick 2',a:'Distributed databases.'},
{t:'Replication copies data for safety and reads; sharding splits it for capacity.',f:'copies vs partitions',a:'Scaling storage.'},
{t:'Consensus commits a change only once a majority of nodes agree, surviving crashes.',f:'majority quorum',a:'Distributed databases, ledgers.'},
{t:'MapReduce processes shards in parallel, then reduces partial results to an answer.',f:'map → shuffle → reduce',a:'Large-scale analytics.'},
{t:'Caches, CDNs, and load balancers keep answers close and spread traffic.',f:'hit vs miss',a:'Fast web at scale.'},
{t:'Symmetric crypto shares one key; public-key crypto uses a public lock and private unlock.',f:'E_pub, D_priv',a:'Secure communication.'},
{t:'A hash is a one-way fingerprint; signing its hash proves authenticity.',f:'sign=E_priv(H(m))',a:'Integrity, digital signatures.'},
{t:'TLS proves identity by certificate, then agrees a symmetric key for fast encryption.',f:'certificate + key exchange',a:'HTTPS, secure web.'},
{t:'Hashing records into a tree makes any tampering change the root — Merkle trees.',f:'root=H(H(a)+H(b))',a:'Blockchains, Git, verification.'},
{t:'A zero-knowledge proof convinces a verifier you know a secret while revealing nothing.',f:'challenge-response',a:'Private cryptocurrencies.'},
{t:'Security stacks independent layers so breaching one still leaves the next — defense in depth.',f:'assume breach',a:'System and network security.'},
/* ===== CH9 ML & DL II (273-297) ===== */
{t:'The models and mathematics that make machine learning actually work.',f:'min L(θ)',a:'Applied ML systems.'},
{t:'A loss quantifies wrongness; its gradient drives every weight update.',f:'MSE, cross-entropy',a:'Training any model.'},
{t:'Softmax exponentiates and normalizes logits into a probability distribution.',f:'e^{zᵢ}/Σe^{zⱼ}',a:'Classifier output layer.'},
{t:'Logistic regression fits a boundary and squashes distance to a probability.',f:'σ(wᵀx+b)',a:'Baseline classification.'},
{t:'Naive Bayes multiplies per-feature likelihoods, assuming independence.',f:'P(c)ΠP(xᵢ|c)',a:'Spam filtering, text.'},
{t:'k-NN classifies a point by a vote among its nearest labelled neighbours.',f:'vote(k nearest)',a:'Simple classification.'},
{t:'Total error splits into bias from being too simple and variance from being too flexible.',f:'err=bias²+var+noise',a:'Model selection.'},
{t:'A penalty on weight size trades a little fit for much better generalization.',f:'L+λ‖w‖',a:'Preventing overfitting.'},
{t:'A random forest averages many trees on random subsets, cancelling their errors.',f:'mean of trees',a:'Robust tabular models.'},
{t:'Boosting fits each new model to the previous ones′ residuals.',f:'F+η(y−F)',a:'XGBoost, competitions.'},
{t:'Bayesian inference updates a prior into a posterior, carrying uncertainty forward.',f:'posterior ∝ likelihood·prior',a:'Small-data, calibrated ML.'},
{t:'A Gaussian process predicts a distribution over functions with calibrated error bars.',f:'f∼GP(m,k)',a:'Uncertain, low-data settings.'},
{t:'EM alternates guessing hidden labels and refitting, to learn mixture models.',f:'E-step, M-step',a:'Clustering, latent models.'},
{t:'Normalization recentres and rescales activations, keeping gradients healthy.',f:'(x−μ)/σ',a:'Training deep networks.'},
{t:'Scaled initialization keeps signal variance steady through depth.',f:'Var(W)=1/n',a:'Deep network training.'},
{t:'Warming up then decaying the learning rate explores early and settles late.',f:'η(t) schedule',a:'Transformer training.'},
{t:'An autoencoder compresses input through a bottleneck, then reconstructs it.',f:'x→z→x̂',a:'Denoising, anomaly detection.'},
{t:'A VAE makes the latent space smooth, so sampling it generates new examples.',f:'z∼N(0,I)',a:'Generative modeling.'},
{t:'A generator and discriminator train in opposition until fakes look real.',f:'min_G max_D',a:'Image synthesis.'},
{t:'A diffusion model learns to remove noise step by step, generating from scratch.',f:'xₜ→xₜ₋₁',a:'Image and video generation.'},
{t:'A graph neural net updates each node from its neighbours via message passing.',f:'hᵥ←Σ_{u∈N(v)} m',a:'Molecules, social graphs.'},
{t:'Reinforcement learning values actions by reward plus best discounted future.',f:'Q(s,a)=r+γ max Q(s′,a′)',a:'Games, robotics, control.'},
{t:'Policy gradients push probability toward actions that earned reward; PPO stabilizes it.',f:'∇J=E[∇log π · A]',a:'RLHF, robotics, games.'},
{t:'Self-supervision invents a task from raw data — predict the hidden part.',f:'predict masked',a:'Pretraining without labels.'},
{t:'Past the interpolation peak, error falls again — the double-descent regime.',f:'err↓ past peak',a:'Why huge models generalize.'},

{t:'drawing conclusions from data under uncertainty',f:'—',a:'Statistics & Data Science'},
{t:'Mean and variance summarize where data sits and how much it varies.',f:'μ=Σx/n,  σ²=Σ(x−μ)²/n',a:'Every data analysis.'},

const starts=[]; let acc=0; for(const d of DECKS){starts.push(acc);acc+=d.api.count;} const TOTAL=acc;
function locate(g){for(let i=DECKS.length-1;i>=0;i--){if(g>=starts[i])return[i,g-starts[i]];}return[0,g];}
let gi=0, st=0, tSlide=0, tStep=0, dtG=0, last=performance.now(), curSS={};
const RMx=(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)||false;
const clampM=(v,a,b)=>Math.max(a,Math.min(b,v)); const eoM=t=>1-Math.pow(1-t,3);
function stepsHere(){const L=locate(gi);return DECKS[L[0]].api.steps[L[1]];}
function nextM(){if(st<stepsHere()-1){st++;tStep=0;}else if(gi<TOTAL-1){gi++;st=0;tSlide=0;tStep=0;curSS={};}upd();}
function prevM(){if(st>0){st--;tStep=0;}else if(gi>0){gi--;st=stepsHere()-1;tSlide=0;tStep=0;curSS={};}upd();}
function goSlide(g){gi=clampM(g,0,TOTAL-1);st=0;tSlide=0;tStep=0;curSS={};upd();}
function frameM(now){dtG=Math.min(.05,(now-last)/1000);last=now;tSlide+=dtG;tStep+=dtG;
  const L=locate(gi);const alpha=RMx?1:eoM(clampM(tSlide/.5,0,1));
  DECKS[L[0]].api.render(L[1],{step:st,stepClock:tStep,slideClock:tSlide,dt:dtG,SS:curSS,alpha:alpha});
  requestAnimationFrame(frameM);}
const fillEl=document.getElementById('fill'),countEl=document.getElementById('count'),chapEl=document.getElementById('chap'),
 prevB=document.getElementById('prev'),nextB=document.getElementById('next'),menuBtn=document.getElementById('menuBtn'),
 menuEl=document.getElementById('menu'),menuList=document.getElementById('menuList');
function upd(){const L=locate(gi);fillEl.style.width=((gi+1)/TOTAL*100)+'%';countEl.textContent=(gi+1)+' / '+TOTAL;
 chapEl.textContent=DECKS[L[0]].name;chapEl.style.color=DECKS[L[0]].color;fillEl.style.background=DECKS[L[0]].color;
 prevB.disabled=(gi===0&&st===0);nextB.disabled=(gi===TOTAL-1&&st===stepsHere()-1);
 [...menuList.children].forEach((c,i)=>c.classList.toggle('on',i===L[0]));renderInfo();}
DECKS.forEach((d,i)=>{const b=document.createElement('button');b.className='chapItem';
 b.innerHTML='<span>'+(i+1)+' · '+d.name+'</span><span class="ct">'+d.api.count+'</span>';
 b.onclick=()=>{goSlide(starts[i]);closeMenu();};menuList.appendChild(b);});
function openMenu(){menuEl.classList.add('show');} function closeMenu(){menuEl.classList.remove('show');}
menuBtn.onclick=()=>{menuEl.classList.contains('show')?closeMenu():openMenu();};
menuEl.onclick=(e)=>{if(e.target===menuEl)closeMenu();};

/* ---- info panel ---- */
const infoEl=document.getElementById('info'),infoBtn=document.getElementById('infoBtn'),
 infoT=document.getElementById('infoT'),infoF=document.getElementById('infoF'),infoA=document.getElementById('infoA');
function renderInfo(){var d=INFO[gi]||{t:'',f:'',a:''};infoT.textContent=d.t||'—';infoF.textContent=d.f||'—';infoA.textContent=d.a||'—';}
function toggleInfo(){infoEl.classList.toggle('show');infoBtn.classList.toggle('on',infoEl.classList.contains('show'));}
infoBtn.onclick=toggleInfo;
prevB.onclick=prevM;nextB.onclick=nextM;
addEventListener('keydown',e=>{
 if(menuEl.classList.contains('show')&&e.key==='Escape'){closeMenu();return;}
 if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();nextM();}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prevM();}
 else if(e.key==='Home'){goSlide(0);} else if(e.key==='End'){goSlide(TOTAL-1);}
 else if(e.key==='m'||e.key==='M'){menuEl.classList.contains('show')?closeMenu():openMenu();}
 else if(e.key==='i'||e.key==='I'){toggleInfo();}});
let hid=false;const hint=document.getElementById('hint');const hideHint=()=>{if(!hid){hid=true;if(hint)hint.style.opacity=0;}};
setTimeout(hideHint,7000);addEventListener('keydown',hideHint,{once:true});
upd();requestAnimationFrame(frameM);
