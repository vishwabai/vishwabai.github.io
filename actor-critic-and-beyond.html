<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actor–Critic & Beyond — A Visual Derivation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#07070b;
    --bg2:#0b0b12;
    --teal:#5fd0c3;
    --amber:#e8a765;
    --blue:#6fa8dc;
    --pink:#e08a9c;
    --purple:#a98fd2;
    --green:#7cc48f;
    --text:#e9e8f0;
    --dim:#8b8a9a;
    --hair:#232230;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;background:var(--bg);color:var(--text);
    height:100%;overflow:hidden;
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #deck{position:relative;width:100vw;height:100vh;}
  #slide-container{position:absolute;inset:0;}
  canvas#scene{position:absolute;inset:0;width:100%;height:100%;display:block;}

  #overlay{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;}

  #headerBlock{
    padding:38px 64px 0 64px;
    background:linear-gradient(to bottom, rgba(7,7,11,0.92) 0%, rgba(7,7,11,0.55) 70%, rgba(7,7,11,0) 100%);
    padding-bottom:34px;
  }
  #eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;letter-spacing:3px;text-transform:uppercase;
    color:var(--dim); margin-bottom:10px;
    opacity:0; transform:translateY(-6px);
    transition:opacity .5s ease, transform .5s ease;
  }
  #slideTitle{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:clamp(26px,3.4vw,44px);
    margin:0;
    letter-spacing:0.2px;
    opacity:0; transform:translateY(-8px);
    transition:opacity .55s ease .05s, transform .55s ease .05s;
  }
  #headerBlock.show #eyebrow, #headerBlock.show #slideTitle{opacity:1; transform:translateY(0);}

  #footerBlock{
    padding:0 64px 40px 64px;
    background:linear-gradient(to top, rgba(7,7,11,0.94) 0%, rgba(7,7,11,0.6) 65%, rgba(7,7,11,0) 100%);
    padding-top:40px;
  }
  #slideText{
    font-size:clamp(14px,1.25vw,18px);
    line-height:1.55;
    color:var(--text);
    max-width:760px;
    opacity:0; transform:translateY(8px);
    transition:opacity .5s ease .12s, transform .5s ease .12s;
  }
  #formula{
    margin-top:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:clamp(13px,1.15vw,17px);
    color:var(--teal);
    letter-spacing:0.3px;
    padding:10px 16px;
    display:inline-block;
    border:1px solid var(--hair);
    border-radius:8px;
    background:rgba(95,208,195,0.045);
    opacity:0; transform:translateY(8px);
    transition:opacity .5s ease .2s, transform .5s ease .2s;
  }
  #formula:empty{display:none;}
  #footerBlock.show #slideText, #footerBlock.show #formula{opacity:1; transform:translateY(0);}
  #formula sub{font-size:0.72em;}
  #formula sup{font-size:0.72em;}

  #controls{
    position:absolute; left:0; right:0; bottom:0;
    height:0px;
  }
  #navBar{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:16px;
    background:rgba(14,14,20,0.75);
    border:1px solid var(--hair);
    padding:9px 16px; border-radius:30px;
    backdrop-filter:blur(8px);
    pointer-events:auto;
    z-index:20;
  }
  .navBtn{
    background:none;border:1px solid var(--hair); color:var(--text);
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; font-size:16px; transition:background .2s, border-color .2s, transform .15s;
  }
  .navBtn:hover{background:rgba(95,208,195,0.12); border-color:var(--teal); transform:scale(1.06);}
  .navBtn:active{transform:scale(0.94);}
  #counter{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--dim); min-width:58px; text-align:center;}
  #progressWrap{
    position:absolute; top:0; left:0; right:0; height:3px; background:rgba(255,255,255,0.05); z-index:20;
  }
  #progressBar{height:100%; width:0%; background:linear-gradient(90deg,var(--teal),var(--blue)); transition:width .4s ease;}

  #sectionTag{
    position:absolute; top:22px; right:28px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:2px;
    color:var(--dim); text-transform:uppercase;
    border:1px solid var(--hair); padding:6px 12px; border-radius:20px;
    background:rgba(255,255,255,0.02);
    z-index:15;
  }
  .kbd-hint{
    position:absolute; bottom:16px; right:24px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim);
    opacity:0.55; pointer-events:none; z-index:5;
  }
  @media (max-width:700px){
    #headerBlock{padding:26px 22px 24px 22px;}
    #footerBlock{padding:0 22px 84px 22px;}
    .kbd-hint{display:none;}
  }
</style>
</head>
<body>
<div id="deck">
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="sectionTag">Section</div>
  <div id="slide-container">
    <canvas id="scene"></canvas>
    <div id="overlay">
      <div id="headerBlock">
        <div id="eyebrow"></div>
        <h1 id="slideTitle"></h1>
      </div>
      <div id="footerBlock">
        <div id="slideText"></div>
        <div id="formula"></div>
      </div>
    </div>
  </div>
  <span class="kbd-hint">← → or space to advance · r to replay</span>
  <div id="navBar">
    <button class="navBtn" id="prevBtn" title="Previous">‹</button>
    <span id="counter">01 / 21</span>
    <button class="navBtn" id="replayBtn" title="Replay animation">↺</button>
    <button class="navBtn" id="nextBtn" title="Next">›</button>
  </div>
</div>

<script>
/* =========================================================
   CORE ANIMATION UTILITIES  (manim-inspired, canvas 2D)
========================================================= */
const TAU = Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOutCubic=t=>{t=clamp(t,0,1);return 1-Math.pow(1-t,3);};
const easeInCubic=t=>{t=clamp(t,0,1);return t*t*t;};
const easeInOutCubic=t=>{t=clamp(t,0,1);return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const easeOutBack=t=>{t=clamp(t,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const smoothstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const pulse=(t,period)=> (Math.sin((t/period)*TAU-Math.PI/2)+1)/2;
const segT=(t,start,dur)=> clamp((t-start)/dur,0,1); // local progress of a timed segment

function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function box(ctx,x,y,w,h,opt={}){
  const {fill='rgba(95,208,195,0.06)',stroke='#5fd0c3',lw=1.6,r=14,alpha=1,dashed=false}=opt;
  ctx.save();
  ctx.globalAlpha=alpha;
  if(dashed) ctx.setLineDash([5,5]);
  roundRect(ctx,x-w/2,y-h/2,w,h,r);
  ctx.fillStyle=fill; ctx.fill();
  ctx.lineWidth=lw; ctx.strokeStyle=stroke; ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function label(ctx,x,y,text,opt={}){
  const {size=17,color='#e9e8f0',align='center',baseline='middle',weight='500',font="'Inter',sans-serif",alpha=1,spacing=0}=opt;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  ctx.font=`${weight} ${size}px ${font}`;
  ctx.textAlign=align;
  ctx.textBaseline=baseline;
  if(spacing){
    // manual letter spacing
    let total=0;
    for(const ch of text) total+=ctx.measureText(ch).width+spacing;
    let sx = align==='center'? x-total/2 : (align==='right'? x-total : x);
    for(const ch of text){ ctx.textAlign='left'; ctx.fillText(ch,sx,y); sx+=ctx.measureText(ch).width+spacing; }
  } else {
    ctx.fillText(text,x,y);
  }
  ctx.restore();
}

function arrow(ctx,x1,y1,x2,y2,opt={}){
  const {color='#e9e8f0',lw=2,progress=1,dashed=false,headSize=8,alpha=1}=opt;
  const p=clamp(progress,0,1);
  const ex=lerp(x1,x2,p), ey=lerp(y1,y2,p);
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw;
  if(dashed) ctx.setLineDash([6,6]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.setLineDash([]);
  if(p>0.02){
    const ang=Math.atan2(ey-y1,ex-x1);
    ctx.beginPath();
    ctx.moveTo(ex,ey);
    ctx.lineTo(ex-headSize*Math.cos(ang-0.4), ey-headSize*Math.sin(ang-0.4));
    ctx.lineTo(ex-headSize*Math.cos(ang+0.4), ey-headSize*Math.sin(ang+0.4));
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  return {x:ex,y:ey};
}

// quadratic curved arrow; returns control point (for reuse) and end point
function curvedArrow(ctx,x1,y1,x2,y2,curvature,opt={}){
  const {color='#e9e8f0',lw=2,progress=1,alpha=1,headSize=8}=opt;
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const dx=x2-x1, dy=y2-y1;
  const len=Math.hypot(dx,dy)||1;
  const nx=-dy/len, ny=dx/len;
  const cx=mx+nx*curvature, cy=my+ny*curvature;
  const p=clamp(progress,0,1);
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw;
  const steps=36;
  let lastX=x1,lastY=y1, tx=0,ty=0;
  ctx.beginPath(); ctx.moveTo(x1,y1);
  const n=Math.max(1,Math.round(steps*p));
  for(let i=1;i<=n;i++){
    const s=i/steps;
    const xx=(1-s)*(1-s)*x1+2*(1-s)*s*cx+s*s*x2;
    const yy=(1-s)*(1-s)*y1+2*(1-s)*s*cy+s*s*y2;
    ctx.lineTo(xx,yy);
    lastX=xx; lastY=yy;
    tx=2*(1-s)*(cx-x1)+2*s*(x2-cx);
    ty=2*(1-s)*(cy-y1)+2*s*(y2-cy);
  }
  ctx.stroke();
  if(p>0.05){
    const ang=Math.atan2(ty,tx);
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(lastX-headSize*Math.cos(ang-0.4), lastY-headSize*Math.sin(ang-0.4));
    ctx.lineTo(lastX-headSize*Math.cos(ang+0.4), lastY-headSize*Math.sin(ang+0.4));
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  return {x:lastX,y:lastY,cx,cy};
}

function dotOnLine(ctx,x1,y1,x2,y2,t,opt={}){
  const {color='#e8a765',r=5,alpha=1,glow=0}=opt;
  const x=lerp(x1,x2,t), y=lerp(y1,y2,t);
  ctx.save(); ctx.globalAlpha=alpha;
  if(glow){ ctx.shadowColor=color; ctx.shadowBlur=glow; }
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  ctx.restore();
  return {x,y};
}

function dotOnQuad(x1,y1,cx,cy,x2,y2,t){
  const s=t;
  const x=(1-s)*(1-s)*x1+2*(1-s)*s*cx+s*s*x2;
  const y=(1-s)*(1-s)*y1+2*(1-s)*s*cy+s*s*y2;
  return {x,y};
}

function miniNet(ctx,cx,cy,scale=1,color='#6fa8dc',activity=0){
  const layers=[2,3,2];
  const layerGap=24*scale, nodeGap=16*scale;
  const positions=[];
  layers.forEach((n,li)=>{
    const x=cx+(li-1)*layerGap; const arr=[];
    for(let i=0;i<n;i++) arr.push({x,y:cy+(i-(n-1)/2)*nodeGap});
    positions.push(arr);
  });
  ctx.save();
  for(let li=0;li<positions.length-1;li++){
    positions[li].forEach(p1=>positions[li+1].forEach(p2=>{
      ctx.strokeStyle=`rgba(255,255,255,${0.07+0.18*activity})`;
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
    }));
  }
  positions.flat().forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,3*scale,0,TAU);
    ctx.fillStyle=color; ctx.fill();
  });
  ctx.restore();
}

function fadeAlpha(t,start,dur){ return smoothstep(segT(t,start,dur)); }

/* =========================================================
   CANVAS + BACKGROUND
========================================================= */
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
let W=0,H=0;
let stars=[];
function makeStars(){
  stars=[];
  const n=Math.floor((window.innerWidth*window.innerHeight)/26000);
  for(let i=0;i<n;i++){
    stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.2+0.3,phase:Math.random()*10});
  }
}
function resize(){
  const dpr=window.devicePixelRatio||1;
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  makeStars();
}
window.addEventListener('resize',resize);
resize();

function drawBackground(t){
  ctx.fillStyle='#07070b';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  stars.forEach(s=>{
    const tw=0.35+0.5*pulse(t+s.phase,4);
    ctx.globalAlpha=tw*0.5;
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,TAU); ctx.fill();
  });
  ctx.restore();
  // faint horizon line grid for spatial grounding
  ctx.save();
  ctx.globalAlpha=0.05;
  ctx.strokeStyle='#5fd0c3';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,H*0.88); ctx.lineTo(W,H*0.88); ctx.stroke();
  ctx.restore();
}

/* geometry helpers common across slides */
function safeZone(){
  return {top:H*0.30, bottom:H*0.80, midY:H*0.545, cx:W/2};
}

/* =========================================================
   SLIDE 0 — TITLE
========================================================= */
function renderTitle(ctx,W,H,t){
  const cx=W/2, cy=H*0.56;
  for(let i=0;i<3;i++){
    const p=((t*0.12)+i/3)%1;
    const r=30+p*320;
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,TAU);
    ctx.strokeStyle=`rgba(95,208,195,${(1-p)*0.22})`;
    ctx.lineWidth=1.4;
    ctx.stroke();
  }
  miniNet(ctx,cx,cy,3.4,'#6fa8dc', pulse(t,2.4));
  const words=['ACTOR','CRITIC','PLAN','IMAGINE','COORDINATE'];
  words.forEach((w,i)=>{
    const ang = t*0.15 + i*(TAU/words.length);
    const r = 210;
    const x = cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r*0.45;
    const a = 0.35+0.25*pulse(t+i,3);
    label(ctx,x,y,w,{size:12,color:'rgba(139,138,154,'+a+')',weight:'600',font:"'IBM Plex Mono',monospace",spacing:2});
  });
}

/* =========================================================
   SLIDE 1 — THE RL LOOP
========================================================= */
function renderLoop(ctx,W,H,t){
  const {midY,cx}=safeZone();
  const ax=W*0.28, ex=W*0.72;
  const topY=midY-46, botY=midY+46;

  const introA = smoothstep(segT(t,0,0.6));
  box(ctx,ax,midY,190,116,{stroke:'#5fd0c3',fill:'rgba(95,208,195,0.06)',alpha:introA});
  label(ctx,ax,midY-14,'AGENT',{size:19,color:'#5fd0c3',weight:'700',alpha:introA,spacing:1});
  label(ctx,ax,midY+16,'policy π(a|s)',{size:13.5,color:'#a9e2da',font:"'IBM Plex Mono',monospace",alpha:introA});

  const introB = smoothstep(segT(t,0.15,0.6));
  box(ctx,ex,midY,190,116,{stroke:'#e8a765',fill:'rgba(232,167,101,0.06)',alpha:introB});
  label(ctx,ex,midY-14,'ENVIRONMENT',{size:17.5,color:'#e8a765',weight:'700',alpha:introB,spacing:1});
  label(ctx,ex,midY+16,'dynamics p(s′|s,a)',{size:13.5,color:'#f0cda0',font:"'IBM Plex Mono',monospace",alpha:introB});

  if(t<0.9) return;
  const lt = t-0.9;
  const cycle=4.2; const p = (lt%cycle)/cycle;
  const x1=ax+95, x2=ex-95;
  if(p<0.48){
    const q=easeInOutCubic(p/0.48);
    arrow(ctx,x1,topY,x2,topY,{color:'#5fd0c3',progress:1,lw:1.6});
    label(ctx,(x1+x2)/2,topY-16,'action  aₜ',{size:13,color:'#a9e2da',font:"'IBM Plex Mono',monospace"});
    dotOnLine(ctx,x1,topY,x2,topY,q,{color:'#5fd0c3',glow:10});
  } else if(p<0.5){
    // brief pause / impact pulse on env box
  } else {
    const q=easeInOutCubic((p-0.5)/0.48);
    arrow(ctx,x2,botY,x1,botY,{color:'#e8a765',progress:1,lw:1.6});
    label(ctx,(x1+x2)/2,botY+22,'state sₜ₊₁, reward rₜ₊₁',{size:13,color:'#f0cda0',font:"'IBM Plex Mono',monospace"});
    dotOnLine(ctx,x2,botY,x1,botY,q,{color:'#e8a765',glow:10});
  }
}

/* =========================================================
   SLIDE 2 — ACTOR-CRITIC CORE IDEA
========================================================= */
function renderActorCriticCore(ctx,W,H,t){
  const {midY}=safeZone();
  const sx=W*0.14, mx=W*0.45, ex=W*0.80;
  const actorY=midY-72, criticY=midY+72;

  const inState = smoothstep(segT(t,0,0.5));
  box(ctx,sx,midY,120,70,{stroke:'#8b8a9a',fill:'rgba(255,255,255,0.03)',alpha:inState});
  label(ctx,sx,midY-4,'state',{size:14,color:'#cfcfda',alpha:inState});
  label(ctx,sx,midY+16,'s',{size:15,color:'#cfcfda',font:"'IBM Plex Mono',monospace",alpha:inState});

  const inActor = smoothstep(segT(t,0.5,0.6));
  box(ctx,mx,actorY,190,92,{stroke:'#5fd0c3',fill:'rgba(95,208,195,0.06)',alpha:inActor});
  label(ctx,mx,actorY-12,'ACTOR',{size:17,color:'#5fd0c3',weight:'700',alpha:inActor,spacing:1});
  label(ctx,mx,actorY+14,'πθ(a|s)  — chooses',{size:12.5,color:'#a9e2da',font:"'IBM Plex Mono',monospace",alpha:inActor});

  const inCritic = smoothstep(segT(t,0.7,0.6));
  box(ctx,mx,criticY,190,92,{stroke:'#e08a9c',fill:'rgba(224,138,156,0.06)',alpha:inCritic});
  label(ctx,mx,criticY-12,'CRITIC',{size:17,color:'#e08a9c',weight:'700',alpha:inCritic,spacing:1});
  label(ctx,mx,criticY+14,'Vw(s)  — evaluates',{size:12.5,color:'#f0bcc8',font:"'IBM Plex Mono',monospace",alpha:inCritic});

  const inEnv = smoothstep(segT(t,0.95,0.5));
  box(ctx,ex,midY,140,84,{stroke:'#e8a765',fill:'rgba(232,167,101,0.06)',alpha:inEnv});
  label(ctx,ex,midY-4,'ENV',{size:15,color:'#e8a765',weight:'700',alpha:inEnv,spacing:1});
  label(ctx,ex,midY+16,'r, s′',{size:13,color:'#f0cda0',font:"'IBM Plex Mono',monospace",alpha:inEnv});

  if(inState>0.9){
    arrow(ctx,sx+62,midY-8,mx-97,actorY+4,{color:'#8b8a9a',alpha:inActor*0.9,lw:1.3});
    arrow(ctx,sx+62,midY+8,mx-97,criticY-4,{color:'#8b8a9a',alpha:inCritic*0.9,lw:1.3});
  }

  const t2 = t-1.5;
  if(t2<0) return;
  const introArrow2 = smoothstep(segT(t2,0,0.5));
  arrow(ctx,mx+97,actorY,ex-72,midY-18,{color:'#5fd0c3',progress:introArrow2,lw:1.8});
  label(ctx,mx+150,actorY-20,'action a',{size:12.5,color:'#a9e2da',font:"'IBM Plex Mono',monospace",alpha:introArrow2});

  const t3=t2-0.6;
  if(t3<0) return;
  const introArrow3=smoothstep(segT(t3,0,0.5));
  arrow(ctx,ex-72,midY+18,mx+97,criticY,{color:'#e8a765',progress:introArrow3,lw:1.8,dashed:true});
  label(ctx,mx+150,criticY+22,'reward r',{size:12.5,color:'#f0cda0',font:"'IBM Plex Mono',monospace",alpha:introArrow3});

  const t4=t3-0.7;
  if(t4<0) return;
  curvedArrow(ctx,mx-40,criticY-38,mx-40,actorY+38,-70,{color:'#e08a9c',progress:smoothstep(segT(t4,0,0.7)),lw:2});

/* =========================================================
   SLIDE 3 — A2C (synchronous)
========================================================= */
function renderA2C(ctx,W,H,t){
  const {midY}=safeZone();
  const wx=W*0.19, sx=W*0.50, nx=W*0.80;
  const n=4;
  const ys=[]; for(let i=0;i<n;i++) ys.push(midY+(i-(n-1)/2)*60);

  ys.forEach((y,i)=>{
    const a=smoothstep(segT(t,i*0.08,0.45));
    box(ctx,wx,y,132,44,{stroke:'#5fd0c3',fill:'rgba(95,208,195,0.06)',alpha:a,r:9});
    label(ctx,wx,y,'env '+(i+1),{size:12.5,color:'#a9e2da',alpha:a,font:"'IBM Plex Mono',monospace"});
  });

  const introSync=smoothstep(segT(t,0.5,0.4));
  ctx.save(); ctx.globalAlpha=introSync*0.7; ctx.strokeStyle='#8b8a9a'; ctx.setLineDash([5,6]); ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(sx,midY-150); ctx.lineTo(sx,midY+150); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  label(ctx,sx,midY-170,'SYNC BARRIER',{size:11.5,color:'#8b8a9a',alpha:introSync,spacing:2,font:"'IBM Plex Mono',monospace"});

  const introNet=smoothstep(segT(t,0.7,0.5));
  box(ctx,nx,midY,170,110,{stroke:'#6fa8dc',fill:'rgba(111,168,220,0.06)',alpha:introNet,r:12});
  label(ctx,nx,midY-30,'GLOBAL',{size:15,color:'#6fa8dc',weight:'700',alpha:introNet,spacing:1});
  label(ctx,nx,midY-12,'NETWORK',{size:15,color:'#6fa8dc',weight:'700',alpha:introNet,spacing:1});

  const t2=t-1.3;
  if(t2<0){ if(introNet>0.9) miniNet(ctx,nx,midY+30,1.6,'#6fa8dc',0); return; }
  const cycle=3.2;
  const p=(t2%cycle)/cycle;
  let netPulse=0;
  if(p<0.45){
    const q=easeInOutCubic(p/0.45);
    ys.forEach(y=>{
      arrow(ctx,wx+68,y,sx-14,y,{color:'#5fd0c3',progress:1,lw:1.3,alpha:0.35});
      dotOnLine(ctx,wx+68,y,sx-14,y,q,{color:'#5fd0c3',r:4.5,glow:8});
    });
  } else if(p<0.55){
    const flash=1-((p-0.45)/0.1);
    ctx.save(); ctx.globalAlpha=flash*0.8; ctx.strokeStyle='#e9e8f0'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(sx,midY-150); ctx.lineTo(sx,midY+150); ctx.stroke(); ctx.restore();
  } else if(p<0.85){
    const q=easeInOutCubic((p-0.55)/0.3);
    arrow(ctx,sx+14,midY,nx-90,midY,{color:'#f6c98a',progress:1,lw:2});
    dotOnLine(ctx,sx+14,midY,nx-90,midY,q,{color:'#e8a765',r:6,glow:12});
    label(ctx,(sx+nx)/2-6,midY-24,'mean advantage  Â',{size:12,color:'#f0cda0',font:"'IBM Plex Mono',monospace"});
    if(q>0.95) netPulse=1;
  } else {
    netPulse = 1-((p-0.85)/0.15);
  }
  miniNet(ctx,nx,midY+30,1.6+0.4*netPulse,'#6fa8dc',netPulse);
}

/* =========================================================

/* =========================================================
   SLIDE 5 — PPO (clipped surrogate objective)
========================================================= */
function renderPPO(ctx,W,H,t){
  const {midY}=safeZone();
  const baseline=midY+90;
  const x0=W*0.20, x1=W*0.80;
  const eps=0.2, cap=1+eps;
  const rMax=1.9;
  const mapX = r => x0 + (r/rMax)*(x1-x0);
  const H_UNIT=95;
  const curveY = r => baseline - Math.min(r,cap)*H_UNIT;

  const a1=smoothstep(segT(t,0,0.5));
  ctx.save(); ctx.globalAlpha=a1*0.6;
  ctx.strokeStyle='#8b8a9a'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(x0-10,baseline); ctx.lineTo(x1+10,baseline); ctx.stroke();
  ctx.restore();
  label(ctx,W/2,baseline+30,'probability ratio  r(θ) = πθ(a|s) / π_old(a|s)',{size:12.5,color:'#8b8a9a',alpha:a1,font:"'IBM Plex Mono',monospace"});

  [1-eps,1,1+eps].forEach((r,i)=>{
    const x=mapX(r);
    ctx.save(); ctx.globalAlpha=a1*0.55; ctx.strokeStyle='#5fd0c3'; ctx.setLineDash([3,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,baseline+6); ctx.lineTo(x,baseline-H_UNIT*cap-16); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    const txt = i===0?'1−ε': i===1?'1':'1+ε';
    label(ctx,x,baseline+18,txt,{size:11.5,color:'#5fd0c3',alpha:a1,font:"'IBM Plex Mono',monospace"});
  });

  const t2=t-0.6;
  if(t2<0) return;
  const a2=smoothstep(segT(t2,0,0.7));
  ctx.save(); ctx.globalAlpha=a2; ctx.beginPath();
  for(let r=0; r<=rMax; r+=0.02){
    const x=mapX(r), y=curveY(r);
    if(r===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.strokeStyle='#e8a765'; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
  label(ctx,mapX(rMax)+40,curveY(cap),'clipped flat',{size:11.5,color:'#f0cda0',alpha:a2,align:'left'});

  const t3=t2-0.6;
  if(t3<0) return;
  const cyc=4.0;
  const p=(t3%cyc)/cyc;
  const r = 0.15 + (rMax-0.15) * (0.5+0.5*Math.sin(p*TAU-Math.PI/2));
  const bx=mapX(r), by=curveY(r);
  const clipped = r>cap;
  ctx.save();
  ctx.fillStyle = clipped ? '#e8a765' : '#5fd0c3';
  ctx.shadowColor= ctx.fillStyle; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(bx,by,7,0,TAU); ctx.fill();
  ctx.restore();
  label(ctx,bx, by-22, clipped? 'gradient ≈ 0 (blocked)':'learning normally', {size:12, color: clipped?'#f0cda0':'#a9e2da', font:"'IBM Plex Mono',monospace"});
}

/* =========================================================
   SLIDE 6 — TRPO (trust region)
========================================================= */
function renderTRPO(ctx,W,H,t){
  const {midY}=safeZone();
  const cx=W*0.40, cy=midY;
  const R=115;

  const c1=smoothstep(segT(t,0,0.5));
  ctx.save(); ctx.globalAlpha=c1;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,TAU);
  ctx.strokeStyle='#6fa8dc'; ctx.lineWidth=1.8; ctx.stroke();
  ctx.fillStyle='rgba(111,168,220,0.05)'; ctx.fill();
  ctx.restore();
  label(ctx,cx,cy-R-24,'trust region:  KL(π_old ‖ πθ) ≤ δ',{size:12.5,color:'#9dc1e8',alpha:c1,font:"'IBM Plex Mono',monospace"});

  ctx.save(); ctx.globalAlpha=c1; ctx.fillStyle='#e9e8f0';
  ctx.beginPath(); ctx.arc(cx,cy,4,0,TAU); ctx.fill(); ctx.restore();
  label(ctx,cx,cy+24,'θ_old',{size:12.5,color:'#e9e8f0',alpha:c1,font:"'IBM Plex Mono',monospace"});

  const angle = -0.62 + 0.1*Math.sin(t*0.4);
  const desiredLen=190;
  const dx=Math.cos(angle), dy=Math.sin(angle);

  const t2=t-0.6;
  if(t2<0) return;
  const growP = smoothstep(segT(t2,0,0.8));
  const len = desiredLen*growP;
  const ex=cx+dx*len, ey=cy+dy*len;
  const beyond = len>R;
  arrow(ctx,cx,cy,ex,ey,{color: beyond?'#8b8a9a':'#e8a765', progress:1, lw:1.6, dashed:beyond, alpha:0.9});
  if(growP>=0.98){
    label(ctx,cx+dx*(desiredLen+70),cy+dy*(desiredLen+70),'unconstrained step — too far',{size:11,color:'#8b8a9a'});
  }

  const t3=t2-1.0;
  if(t3<0) return;
  const clipP=smoothstep(segT(t3,0,0.6));
  const bx=cx+dx*R*clipP, by=cy+dy*R*clipP;
  arrow(ctx,cx,cy,bx,by,{color:'#e8a765',progress:1,lw:3});
  if(clipP>0.9){
    ctx.save(); ctx.fillStyle='#e8a765'; ctx.beginPath(); ctx.arc(cx+dx*R,cy+dy*R,5,0,TAU); ctx.fill(); ctx.restore();
    label(ctx,cx+dx*R+(dx>0?20:-20), cy+dy*R-16,'θ_new',{size:12.5,color:'#f6c98a',align:dx>0?'left':'right',font:"'IBM Plex Mono',monospace"});
  }
}

/* =========================================================
   SLIDE 9 — SAC (maximum entropy)
========================================================= */
function renderSAC(ctx,W,H,t){
  const {midY}=safeZone();
  const cx=W*0.5, baseY=midY+80;

  const a1=smoothstep(segT(t,0,0.5));
  ctx.save(); ctx.globalAlpha=a1*0.5;
  ctx.strokeStyle='#8b8a9a'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(cx-260,baseY); ctx.lineTo(cx+260,baseY); ctx.stroke();
  ctx.restore();
  label(ctx,cx,baseY+26,'action a',{size:12.5,color:'#8b8a9a',alpha:a1});

  const t2=t-0.4;
  if(t2<0) return;
  const grow=smoothstep(segT(t2,0,0.8));
  const sigma=(26+18*Math.sin(t2*0.7))*grow+4;
  const peak=115*grow;

  ctx.save(); ctx.globalAlpha=grow;
  ctx.beginPath();
  for(let x=-260;x<=260;x+=4){
    const y=baseY-peak*Math.exp(-(x*x)/(2*sigma*sigma));
    if(x===-260) ctx.moveTo(cx+x,y); else ctx.lineTo(cx+x,y);
  }
  ctx.strokeStyle='#a98fd2'; ctx.lineWidth=2.2; ctx.stroke();
  ctx.lineTo(cx+260,baseY); ctx.lineTo(cx-260,baseY); ctx.closePath();
  ctx.fillStyle='rgba(169,143,210,0.08)'; ctx.fill();
  ctx.restore();

  label(ctx,cx,baseY-peak-24,'π(a|s) stays wide  →  keeps exploring',{size:12.5,color:'#cdb8ea',alpha:grow,font:"'IBM Plex Mono',monospace"});

  const t3=t2-1.0;
  if(t3>0){
    const bAlpha=smoothstep(segT(t3,0,0.5));
    label(ctx,cx,baseY+56,'reward objective  +  α · entropy bonus',{size:12.5,color:'#e8a765',alpha:bAlpha,font:"'IBM Plex Mono',monospace"});
  }
}

/* =========================================================
   SLIDE 2b — MATH FOUNDATIONS (derivation, Feynman-style)
========================================================= */
function renderMathFoundations(ctx,W,H,t){
  const {top}=safeZone();
  const cx=W*0.5;
  const lines=[
    {eq:'J(θ) = 𝔼 [ Σₜ γᵗ rₜ ]', note:'the objective: expected discounted return', color:'#e9e8f0'},
    {eq:'∇θJ(θ) = 𝔼[ ∇θ log πθ(a|s) · Qπ(s,a) ]', note:'policy-gradient theorem — push up log-probability, weighted by Q', color:'#5fd0c3'},
    {eq:'Aπ(s,a) = Qπ(s,a) − V(s)', note:'subtract a baseline V(s) → same gradient, far less variance', color:'#e08a9c'},
    {eq:'δ = r + γV(s′) − V(s)   ≈  Aπ(s,a)', note:'the critic estimates advantage with one number: the TD-error', color:'#e8a765'},
    {eq:'∇θJ(θ) ≈ 𝔼[ ∇θ log πθ(a|s) · δ ]', note:'the actor–critic gradient — everything below builds on this', color:'#a98fd2'}
  ];
  const startY=top+58, gap=58;
  lines.forEach((ln,i)=>{
    const t0=i*1.05;
    const a=smoothstep(segT(t,t0,0.55));
    if(a<=0) return;
    const y=startY+i*gap;
    const dy=(1-a)*14;
    const active = t>=t0 && t<t0+1.55;
    if(active){
      const pulseA=0.10+0.09*pulse(t-t0,1.4);
      ctx.save(); ctx.globalAlpha=a*0.9;
      roundRect(ctx,cx-340,y-dy-24,680,44,10);
      ctx.fillStyle=`rgba(255,255,255,${pulseA})`; ctx.fill();
      ctx.restore();
    }
    const dim = active?1:0.5;
    label(ctx,cx,y-dy,ln.eq,{size:16.5,color:ln.color,font:"'IBM Plex Mono',monospace",weight:'600',alpha:a*dim});
    label(ctx,cx,y-dy+20,ln.note,{size:11,color:'#8b8a9a',alpha:a*dim*0.95});
  });
}

/* =========================================================

/* =========================================================
   SLIDE 12 — MONTE CARLO TREE SEARCH
========================================================= */
function renderMCTS(ctx,W,H,t){
  const {top,bottom}=safeZone();
  const cx=W*0.5;
  const topY=top+55, botY=bottom-35, midY=(topY+botY)/2;
  const pos=[
    {x:cx,y:topY},
    {x:cx-200,y:midY},{x:cx-67,y:midY},{x:cx+67,y:midY},{x:cx+200,y:midY},
    {x:cx-67,y:botY}
  ];
  const parents=[-1,0,0,0,0,2];

  const revealed = t<0.6 ? 1 : clamp(Math.floor((t-0.6)/3.6)+2,1,6);
  const activeIdx = clamp(revealed-1,1,5);
  const tphase = t>0.6 ? ((t-0.6)%3.6) : -1;

  for(let i=1;i<revealed;i++){
    if(i===activeIdx && tphase>=0 && tphase<2.6) continue;
    const p=pos[i], pp=pos[parents[i]];
    ctx.save(); ctx.globalAlpha=0.5; ctx.strokeStyle='#6fa8dc'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(pp.x,pp.y); ctx.lineTo(p.x,p.y); ctx.stroke(); ctx.restore();
  }

  function drawNode(i,alpha,glow){
    const p=pos[i];
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.beginPath(); ctx.arc(p.x,p.y,22,0,TAU);
    ctx.fillStyle='rgba(111,168,220,0.10)'; ctx.fill();
    ctx.lineWidth = glow? 2.6:1.6;
    ctx.strokeStyle = glow? '#e8a765':'#6fa8dc';
    if(glow){ ctx.shadowColor='#e8a765'; ctx.shadowBlur=10; }
    ctx.stroke();
    ctx.restore();
  }

  for(let i=0;i<revealed;i++){
    if(i===activeIdx && tphase>=0 && tphase<2.6) continue;
    drawNode(i,1,false);
    label(ctx,pos[i].x,pos[i].y,'n'+i,{size:11,color:'#cfe2f5',font:"'IBM Plex Mono',monospace"});
  }
  if(tphase<0) return;

  const pp = pos[parents[activeIdx]] || pos[0];
  const p = pos[activeIdx];

  if(tphase<0.8){
    const q=easeInOutCubic(tphase/0.8);
    arrow(ctx,pp.x,pp.y,lerp(pp.x,p.x,q),lerp(pp.y,p.y,q),{color:'#e8a765',progress:1,lw:2.4});
    label(ctx,cx,top+16,'SELECTION — follow UCB to a promising leaf',{size:12.5,color:'#f0cda0',font:"'IBM Plex Mono',monospace"});
  } else if(tphase<1.4){
    const q=easeOutBack(segT(tphase,0.8,0.5));
    arrow(ctx,pp.x,pp.y,p.x,p.y,{color:'#6fa8dc',progress:1,lw:1.6,alpha:0.6});
    drawNode(activeIdx,q,true);
    label(ctx,cx,top+16,'EXPANSION — add a new child node',{size:12.5,color:'#9dc1e8',font:"'IBM Plex Mono',monospace"});
  } else if(tphase<2.0){
    drawNode(activeIdx,1,true);
    const q=easeOutCubic(segT(tphase,1.4,0.5));
    const simX=p.x, simY=p.y+70*q;
    arrow(ctx,p.x,p.y,simX,simY,{color:'#a98fd2',progress:1,lw:1.6,dashed:true});
    if(q>0.7) label(ctx,simX,simY+16,'rollout → reward',{size:11,color:'#cdb8ea'});
    label(ctx,cx,top+16,'SIMULATION — random rollout estimates the value',{size:12.5,color:'#cdb8ea',font:"'IBM Plex Mono',monospace"});
  } else {
    drawNode(activeIdx,1,true);
    const q=easeInOutCubic(segT(tphase,2.0,0.6));
    let cur=activeIdx; const chain=[activeIdx];
    while(parents[cur]!==-1){ cur=parents[cur]; chain.push(cur); }
    const seg=(chain.length-1)*q;
    for(let k=0;k<chain.length-1;k++){
      const from=pos[chain[k]], to=pos[chain[k+1]];
      const local=clamp(seg-k,0,1);
      if(local>0) dotOnLine(ctx,from.x,from.y,to.x,to.y,local,{color:'#e08a9c',r:5,glow:8});
    }
    label(ctx,cx,top+16,'BACKPROPAGATION — carry the value back up the path',{size:12.5,color:'#f0bcc8',font:"'IBM Plex Mono',monospace"});
  }
  label(ctx,cx,bottom-14,'UCB(s,a) = Q(s,a) + c·√( ln N(s) / N(s,a) )',{size:12,color:'#8b8a9a',font:"'IBM Plex Mono',monospace"});
}

  const a1=smoothstep(segT(t,0,0.5));
  positions.forEach((x,i)=>{
    const term=i===2;
    ctx.save(); ctx.globalAlpha=a1;
    ctx.beginPath(); ctx.arc(x,midY,28,0,TAU);
    ctx.strokeStyle= term? '#8b8a9a':'#6fa8dc';
    ctx.fillStyle= term? 'rgba(255,255,255,0.04)':'rgba(111,168,220,0.08)';
    ctx.lineWidth=1.8; ctx.fill(); ctx.stroke();
    ctx.restore();
    label(ctx,x,midY-6,'s'+i,{size:13,color:'#e9e8f0',alpha:a1,font:"'IBM Plex Mono',monospace"});

  if(a1>0.9){
    arrow(ctx,positions[0]+30,midY,positions[1]-30,midY,{color:'#e8a765',progress:1,lw:1.6});
    label(ctx,(positions[0]+positions[1])/2,midY-22,'r = 3',{size:12,color:'#f0cda0',font:"'IBM Plex Mono',monospace"});
    arrow(ctx,positions[1]+30,midY,positions[2]-30,midY,{color:'#e8a765',progress:1,lw:1.6});
    label(ctx,(positions[1]+positions[2])/2,midY-22,'r = 5',{size:12,color:'#f0cda0',font:"'IBM Plex Mono',monospace"});
    label(ctx,W/2,midY-52,'γ = 0.9',{size:12,color:'#8b8a9a',alpha:a1,font:"'IBM Plex Mono',monospace"});
  }

  const t2=t-0.9; if(t2<0) return;
  const b1=smoothstep(segT(t2,0,0.5));
  label(ctx,positions[2],midY+52,'V(s2) = 0   (terminal — nothing left to earn)',{size:12.5,color:'#8b8a9a',alpha:b1,font:"'IBM Plex Mono',monospace"});

  const t3=t2-0.9; if(t3<0) return;
  const b2=smoothstep(segT(t3,0,0.6));

}

/* =========================================================
   SLIDE 2c — POLICY GRADIENT: WHY THE MATH WORKS
========================================================= */
function renderPGDerivation(ctx,W,H,t){
  const {top}=safeZone();
  const cx=W*0.5;
  const lines=[
    {eq:'J(θ) = 𝔼[ R(τ) ] = ∫ πθ(τ) R(τ) dτ', note:'expected return, written as an integral over trajectories', color:'#e9e8f0'},
    {eq:'∇θJ(θ) = ∫ ∇θπθ(τ) · R(τ) dτ', note:'differentiate under the integral sign', color:'#9dc1e8'},
    {eq:'∇θπθ(τ) = πθ(τ) · ∇θ log πθ(τ)', note:'log-derivative trick:  ∇θ log f = ∇θf / f', color:'#e8a765', key:true},
    {eq:'∇θJ(θ) = 𝔼[ ∇θ log πθ(τ) · R(τ) ]', note:'now it is an expectation — we can estimate it from samples', color:'#5fd0c3'},
    {eq:'∇θ log πθ(τ) = Σₜ ∇θ log πθ(aₜ|sₜ)', note:'trajectory probability factorizes over timesteps', color:'#a98fd2'}
  ];
  const startY=top+56, gap=58;
  lines.forEach((ln,i)=>{
    const t0=i*1.15;
    const a=smoothstep(segT(t,t0,0.55));
    if(a<=0) return;
    const y=startY+i*gap;
    const dy=(1-a)*14;
    const active = t>=t0 && t<t0+1.7;
    if(ln.key){
      const glow=0.5+0.5*pulse(t,1.3);
      ctx.save(); ctx.globalAlpha=a*0.9;
      roundRect(ctx,cx-360,y-dy-24,720,46,10);
      ctx.strokeStyle=`rgba(232,167,101,${0.5+0.3*glow})`; ctx.lineWidth=1.6;
      ctx.fillStyle=`rgba(232,167,101,${0.06+0.05*glow})`; ctx.fill(); ctx.stroke();
      ctx.restore();
      label(ctx,cx-352,y-dy-24+13,'KEY TRICK',{size:9.5,color:'#e8a765',weight:'700',align:'left',alpha:a,spacing:1.5,font:"'IBM Plex Mono',monospace"});
    } else if(active){
      const pulseA=0.10+0.09*pulse(t-t0,1.4);
      ctx.save(); ctx.globalAlpha=a*0.9;
      roundRect(ctx,cx-340,y-dy-24,680,44,10);
      ctx.fillStyle=`rgba(255,255,255,${pulseA})`; ctx.fill();
      ctx.restore();
    }
    const dim = (active||ln.key) ? 1 : 0.5;
    label(ctx,cx,y-dy,ln.eq,{size:16,color:ln.color,font:"'IBM Plex Mono',monospace",weight:'600',alpha:a*dim});
    label(ctx,cx,y-dy+20,ln.note,{size:11,color:'#8b8a9a',alpha:a*dim*0.95});
  });
}

function renderBiasVariance(ctx,W,H,t){

  function board(cx,color,spread,bias,alpha){
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.beginPath(); ctx.arc(cx,midY,70,0,TAU); ctx.strokeStyle='#8b8a9a'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,midY,40,0,TAU); ctx.stroke();

      const r=spread*(0.3+0.7*((i*37)%10)/10);
      const dx=Math.cos(ang)*r + bias, dy=Math.sin(ang)*r*0.6;
      ctx.save(); ctx.globalAlpha=alpha*0.85; ctx.fillStyle=color;
      ctx.beginPath(); ctx.arc(cx+dx,midY+dy,3.4,0,TAU); ctx.fill(); ctx.restore();
    }

  const a1=smoothstep(segT(t,0,0.6));

  label(ctx,lx,midY+114,"G\u209c = \u03a3 \u03b3\u1d4fr\u209c\u208a\u2096  (waits for full episode)",{size:10,color:'#8b8a9a',alpha:a1,font:"'IBM Plex Mono',monospace"});

  const a2=smoothstep(segT(t,0.5,0.6));

  const a3=smoothstep(segT(t,1.3,0.6));

function renderGAE(ctx,W,H,t){
  const {midY,top}=safeZone();
  const x0=W*0.22, x1=W*0.78, baseline=midY;
  const a1=smoothstep(segT(t,0,0.5));
  ctx.save(); ctx.globalAlpha=a1*0.6; ctx.strokeStyle='#8b8a9a'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(x0,baseline); ctx.lineTo(x1,baseline); ctx.stroke(); ctx.restore();

  label(ctx,x1,baseline+26,'\u03bb=1',{size:12,color:'#5fd0c3',alpha:a1,font:"'IBM Plex Mono',monospace"});
  label(ctx,(x0+x1)/2,baseline+26,'GAE(\u03bb)',{size:12,color:'#cdb8ea',alpha:a1,font:"'IBM Plex Mono',monospace"});

  const t2=t-0.6; if(t2<0) return;
  const cyc=3.4; const p=(t2%cyc)/cyc;

  label(ctx,x,baseline-70,lam<0.5?'more bias, less variance':'less bias, more variance',{size:12,color: lam<0.5?'#f0cda0':'#a9e2da'});

  ctx.save(); ctx.fillStyle='rgba(232,167,101,0.4)'; ctx.fillRect(x-40,baseline-30-biasH,14,biasH); ctx.restore();
  ctx.save(); ctx.fillStyle='rgba(95,208,195,0.4)'; ctx.fillRect(x+26,baseline-30-varH,14,varH); ctx.restore();
  label(ctx,x-33,baseline-38-biasH,'bias',{size:9.5,color:'#f0cda0'});
  label(ctx,x+33,baseline-38-varH,'var',{size:9.5,color:'#a9e2da'});

  const a4=smoothstep(segT(t,1.4,0.6));
  label(ctx,W/2,top+20,"A\u1d33\u1d2c\u1d31(\u03bb) = \u03a3\u2097 (\u03b3\u03bb)\u02e1 \u00b7 \u03b4\u209c\u208a\u2097",{size:13,color:'#e9e8f0',alpha:a4,font:"'IBM Plex Mono',monospace"});
}

function renderImportanceSampling(ctx,W,H,t){
  const {midY,top}=safeZone();
  const cx=W*0.5, baseY=midY+70;

  ctx.beginPath(); ctx.moveTo(cx-260,baseY); ctx.lineTo(cx+260,baseY); ctx.stroke(); ctx.restore();

  function bell(cx2,sigma,peak,color){
    ctx.save(); ctx.globalAlpha=a1; ctx.beginPath();
    for(let x=-200;x<=200;x+=4){
      const y=baseY-peak*Math.exp(-((x-(cx2-cx))*(x-(cx2-cx)))/(2*sigma*sigma));
      if(x===-200) ctx.moveTo(cx+x,y); else ctx.lineTo(cx+x,y);
    }
    ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
  }
  bell(cx-60,50,100,'#6fa8dc');
  bell(cx+50,55,90,'#e08a9c');
  label(ctx,cx-60,baseY-115,'q (behavior)',{size:11.5,color:'#9dc1e8',alpha:a1});

  const t2=t-0.8; if(t2<0) return;
  const a2=smoothstep(segT(t2,0,0.6));

  const a3=smoothstep(segT(t,1.6,0.6));
  label(ctx,cx,top+20,"\ud835\udd3c\u2093\u007e\u209a[f(x)] = \ud835\udd3c\u2093\u007e\u2071[ (p(x)/q(x)) \u00b7 f(x) ]",{size:13,color:'#e9e8f0',alpha:a3,font:"'IBM Plex Mono',monospace"});
}

function renderEligibility(ctx,W,H,t){
  const {midY,top}=safeZone();
  const n=6;
  const xs=[]; for(let i=0;i<n;i++) xs.push(W*0.16+i*(W*0.68)/(n-1));
  const y=midY;
  const cyc=4.2; const p=(t%cyc)/cyc;
  const headIdx=Math.floor(p*n);
  const headProg=(p*n)%1;

  for(let i=0;i<n;i++){
    const age=headIdx-i+(i===headIdx?headProg:0);
    const trace = i<=headIdx ? Math.pow(0.75,age) : 0;
    const a=smoothstep(segT(t,0,0.4));
    ctx.save(); ctx.globalAlpha=a;
    ctx.beginPath(); ctx.arc(xs[i],y,16,0,TAU);
    ctx.fillStyle = i<=headIdx? 'rgba(232,167,101,'+(0.15+0.5*trace)+')' : 'rgba(255,255,255,0.03)';
    ctx.strokeStyle = i<=headIdx? '#e8a765':'#8b8a9a';
    ctx.lineWidth=1.4; ctx.fill(); ctx.stroke();
    ctx.restore();
    if(i<=headIdx) label(ctx,xs[i],y+32,'e='+trace.toFixed(2),{size:9.5,color:'#f0cda0',alpha:a,font:"'IBM Plex Mono',monospace"});
  }
  for(let i=0;i<n-1;i++) arrow(ctx,xs[i]+18,y,xs[i+1]-18,y,{color:'#8b8a9a',progress:1,lw:1,alpha:0.3});

  const headX=lerp(xs[Math.min(headIdx,n-1)], xs[Math.min(headIdx+1,n-1)], headProg);
  dotOnLine(ctx,headX,y,headX,y,0,{color:'#5fd0c3',r:6,glow:10});
  if(headIdx>=n-1){
    label(ctx,xs[n-1],y-40,'reward! updates flow back along the trail',{size:11.5,color:'#5fd0c3'});
  }
  label(ctx,W/2,top+20,"e\u209c(s) = \u03b3\u03bb\u00b7e\u209c\u208b\u2081(s) + 1[s=s\u209c]     V(s) \u2190 V(s)+\u03b1\u03b4\u209ce\u209c(s)",{size:12,color:'#e9e8f0',font:"'IBM Plex Mono',monospace"});
}

    if(i===0) ctx.moveTo(x,yv); else ctx.lineTo(x,yv);
  }
  ctx.strokeStyle='#e08a9c'; ctx.lineWidth=2; ctx.stroke(); ctx.restore();

  label(ctx,gx+95,gy0+140,'unseen (OOD)',{size:10,color:'#e08a9c',alpha:a2});
  label(ctx,gx,gy0-30,'Q\u03b8(s,a) overestimates actions never in the data',{size:11.5,color:'#f0bcc8',alpha:a2});

  const a3=smoothstep(segT(t,1.4,0.6));

  label(ctx,W/2,top+20,"L = L_TD + \u03b2\u00b7( \ud835\udd3c\u2090\u007e\u03c0[Q(s,a)] \u2212 \ud835\udd3c\u2090\u007edata[Q(s,a)] )",{size:12,color:'#e9e8f0',alpha:a4,font:"'IBM Plex Mono',monospace"});

function renderRewardHacking(ctx,W,H,t){
  const {midY,top,bottom}=safeZone();
  const cx=W*0.42, cy=midY, R=70;
  const a1=smoothstep(segT(t,0,0.5));
  ctx.save(); ctx.globalAlpha=a1*0.4; ctx.strokeStyle='#e8a765'; ctx.setLineDash([3,5]); ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,TAU); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  label(ctx,cx,cy-R-16,'regenerating bonus',{size:11,color:'#f0cda0',alpha:a1});

  const cyc=2.2; const p=(t%cyc)/cyc;
  const ang=p*TAU;
  const bx=cx+Math.cos(ang)*R, by=cy+Math.sin(ang)*R;
  if(a1>0.9){
    ctx.save(); ctx.fillStyle='#e8a765'; ctx.shadowColor='#e8a765'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(bx,by,6,0,TAU); ctx.fill(); ctx.restore();
    const score=Math.floor(t*40)%9999;
    label(ctx,cx,cy,'score: '+score,{size:12,color:'#e9e8f0'});
  }

  const a2=smoothstep(segT(t,0.6,0.5));
  const finishX=W*0.78;
  ctx.save(); ctx.globalAlpha=a2*0.5; ctx.strokeStyle='#8b8a9a'; ctx.setLineDash([4,4]); ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(finishX,cy-60); ctx.lineTo(finishX,cy+60); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  label(ctx,finishX,cy-76,'finish line (unused)',{size:10.5,color:'#8b8a9a',alpha:a2});

  const a3=smoothstep(segT(t,1.2,0.6));
  label(ctx,W/2,top+20,'"when a measure becomes the target, it stops being a good measure"',{size:12,color:'#8b8a9a',alpha:a3});
  const a4=smoothstep(segT(t,1.8,0.6));
  label(ctx,W/2,bottom-16,"max\u03b8 \ud835\udd3c[R_proxy(\u03c4)]  \u2260  max\u03b8 \ud835\udd3c[R_true(\u03c4)]  in general",{size:12.5,color:'#e9e8f0',alpha:a4,font:"'IBM Plex Mono',monospace"});
}

function renderHierarchical(ctx,W,H,t){
  const {midY,top}=safeZone();

  const a1=smoothstep(segT(t,0,0.5));

  const opts=[{x:W*0.22,name:'o1: reach door'},{x:W*0.5,name:'o2: pick up key'},{x:W*0.78,name:'o3: unlock'}];
  const cyc=4.5; const p=(t%cyc)/cyc;
  const activeOpt=Math.floor(p*3)%3;
  opts.forEach((o,i)=>{
    const a=smoothstep(segT(t,0.4+i*0.2,0.5));
    const active=i===activeOpt && t>1.5;
    box(ctx,o.x,midY+30,180,56,{stroke: active?'#e8a765':'#5fd0c3', fill: active?'rgba(232,167,101,0.1)':'rgba(95,208,195,0.05)', alpha:a, r:10});
    label(ctx,o.x,midY+30,o.name,{size:10.5,color: active?'#f0cda0':'#a9e2da',alpha:a,font:"'IBM Plex Mono',monospace"});
    if(a1>0.9 && a>0.9) arrow(ctx,cx,mgrY+34,o.x,midY-2,{color:'#8b8a9a',progress:1,lw:1.2,alpha: active?0.8:0.25});
    if(active){
      for(let k=0;k<3;k++){

}

function renderPOMDP(ctx,W,H,t){
  const {midY,top,bottom}=safeZone();
  const sx=W*0.28, ox=W*0.28, bx=W*0.68;
  const a1=smoothstep(segT(t,0,0.5));
  box(ctx,sx,midY-90,140,60,{stroke:'#8b8a9a',fill:'rgba(255,255,255,0.02)',alpha:a1,r:10,dashed:true});
  label(ctx,sx,midY-90,'true state s (hidden)',{size:10.5,color:'#8b8a9a',alpha:a1});

  const a2=smoothstep(segT(t,0.4,0.5));
  box(ctx,ox,midY,120,60,{stroke:'#6fa8dc',fill:'rgba(111,168,220,0.06)',alpha:a2,r:10});
  label(ctx,ox,midY,'observation o',{size:11.5,color:'#9dc1e8',alpha:a2,font:"'IBM Plex Mono',monospace"});
  if(a1>0.9 && a2>0.9) arrow(ctx,sx,midY-58,ox,midY-32,{color:'#8b8a9a',progress:1,lw:1.3,alpha:0.5,dashed:true});

  const n=4;
  const t2=t-1.0;
  for(let i=0;i<n;i++){

    ctx.strokeRect(bxi-bw/2, midY+30-bh, bw, bh);

  }
  label(ctx,bx,midY+50,'belief  b(s)',{size:11.5,color:'#a9e2da',alpha:smoothstep(segT(t2,0,0.5))});
  label(ctx,bx,top+50,'sharpens as more observations arrive',{size:11,color:'#8b8a9a',alpha:smoothstep(segT(t2,1.2,0.6))});

  const a3=smoothstep(segT(t,2.2,0.6));
  label(ctx,W/2,bottom-16,"b'(s') \u221d O(o|s') \u00b7 \u03a3\u209b P(s'|s,a) b(s)",{size:12.5,color:'#e9e8f0',alpha:a3,font:"'IBM Plex Mono',monospace"});
}

    formula:'', render:renderCuriosity },

  { section:'Advanced Topics', eyebrow:'HER', title:'Hindsight Experience Replay',
    text:'In goal-conditioned tasks with sparse rewards, almost every trajectory "fails." HER\'s trick: relabel the goal after the fact. A trajectory that missed its target g still definitely reached wherever it ended up — treat that as the goal it was "trying" for, and it becomes a perfectly good positive example, free of charge.',
    formula:'', render:renderHER },

  { section:'Advanced Topics', eyebrow:'Offline RL', title:'Learning without ever touching the world',
    text:'Sometimes real interaction is expensive or dangerous — so learn entirely from a fixed, previously logged dataset. The danger: the learned Q-function can wildly overestimate actions it never saw in the data, since nothing constrains it there. The fix is conservatism — explicitly penalize Q-values for unfamiliar, out-of-distribution actions.',
    formula:'', render:renderOfflineRL },

  { section:'Advanced Topics', eyebrow:'A Cautionary Tale', title:'Reward hacking',
    text:'An agent optimizes exactly what you told it to — which is rarely exactly what you meant. In one famous case, a boat-racing agent discovered it could loop forever through a regenerating bonus, racking up score infinitely, and never once crossed the finish line. The proxy reward was maximized perfectly; the actual goal was ignored entirely.',
    formula:'', render:renderRewardHacking },

  { section:'Advanced Topics', eyebrow:'RLHF', title:'Reinforcement Learning from Human Feedback',
    text:'How do you specify a reward function for "be a helpful assistant"? You don\'t — you learn one. Humans compare pairs of model outputs; a reward model learns to predict those preferences; the policy is then fine-tuned with PPO to maximize that learned reward, with a KL penalty keeping it from drifting too far from the original model.',
    formula:'', render:renderRLHF },

  { section:'Advanced Topics', eyebrow:'Hierarchical RL', title:'Options: actions that take actions',
    text:'Flat, single-step actions struggle with long-horizon tasks. The options framework lets a high-level "manager" policy choose among temporally-extended sub-policies — each one running for many primitive steps before handing control back — turning a long, hard problem into a short sequence of easier ones.',
    formula:'', render:renderHierarchical },

  { section:'Advanced Topics', eyebrow:'POMDP', title:'When you can\'t see the true state',
    text:'Real sensors are noisy and incomplete — the agent sees an observation o, never the true state s directly. The principled fix is a belief: a full probability distribution over what the state might be, updated with Bayes\' rule as each new observation arrives, sharpening over time as evidence accumulates.',
    formula:'', render:renderPOMDP },

  { section:'Epilogue', eyebrow:'Recap', title:'One idea, many disguises',
    text:'Actor-critic methods differ in how carefully they take a step. Model-based methods differ in how they plan ahead. Multi-agent methods differ in how they share credit. Underneath all of it: predict, act, and learn from the gap between the two.',
    formula:'', render:renderSummary }
];

/* =========================================================
   ENGINE + NAVIGATION
========================================================= */
let slideIndex=0;
let t0=performance.now();
let rafId=null;

const headerBlock=document.getElementById('headerBlock');
const footerBlock=document.getElementById('footerBlock');
const eyebrowEl=document.getElementById('eyebrow');
const titleEl=document.getElementById('slideTitle');
const textEl=document.getElementById('slideText');
const formulaEl=document.getElementById('formula');
const counterEl=document.getElementById('counter');
const progressBar=document.getElementById('progressBar');
const sectionTag=document.getElementById('sectionTag');

function pad(n){ return n<10 ? '0'+n : ''+n; }

function goTo(i){
  slideIndex = clamp(i,0,slides.length-1);
  const s = slides[slideIndex];
  headerBlock.classList.remove('show');
  footerBlock.classList.remove('show');
  void headerBlock.offsetWidth; // restart CSS transition
  eyebrowEl.textContent = s.eyebrow;
  titleEl.textContent = s.title;
  textEl.textContent = s.text;
  formulaEl.innerHTML = s.formula;
  sectionTag.textContent = s.section;
  requestAnimationFrame(()=>{ headerBlock.classList.add('show'); footerBlock.classList.add('show'); });
  counterEl.textContent = pad(slideIndex+1)+' / '+pad(slides.length);
  progressBar.style.width = (100*(slideIndex+1)/slides.length)+'%';
  startClock();
}

function startClock(){
  t0=performance.now();
  cancelAnimationFrame(rafId);
  function loop(now){
    const t=(now-t0)/1000;
    drawBackground(t);
    slides[slideIndex].render(ctx,W,H,t);
    rafId=requestAnimationFrame(loop);
  }
  rafId=requestAnimationFrame(loop);
}

document.getElementById('nextBtn').addEventListener('click',()=>goTo(slideIndex+1));
document.getElementById('prevBtn').addEventListener('click',()=>goTo(slideIndex-1));
document.getElementById('replayBtn').addEventListener('click',()=>startClock());

window.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); goTo(slideIndex+1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); goTo(slideIndex-1); }
  else if(e.key==='r' || e.key==='R'){ startClock(); }
});

let touchStartX=null;
document.addEventListener('touchstart',e=>{ touchStartX=e.touches[0].clientX; });
document.addEventListener('touchend',e=>{
  if(touchStartX===null) return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(dx<-40) goTo(slideIndex+1);
  else if(dx>40) goTo(slideIndex-1);
  touchStartX=null;
});

goTo(0);
</script>
