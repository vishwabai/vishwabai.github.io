<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering Mathematics & Physics — A Visual Course</title>
<style>
  :root{
    --bg:#0b0b0f; --panel:#101017; --line:#24242c; --axis:#3a3a46;
    --ink:#dcdce2; --dim:#8b8b96; --faint:#5c5c66;
    --blue:#6ea8d8; --yel:#d6b25c; --grn:#7bb972; --red:#cf7b6b;
    --pur:#ab8fc7; --cyan:#5fb4ac;
    --recap:#7f7f8a; --gap:#d6b25c; --fill:#7bb972;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:var(--ink);font-family:var(--sans);overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px}
  #deck{position:relative;width:min(100%, calc((100vh - 28px) * 16/9));
    height:min(calc(100vh - 28px), calc(100vw * 9/16));
    aspect-ratio:16/9;background:var(--bg);border:1px solid var(--line);
    border-radius:6px;overflow:hidden;display:grid;grid-template-rows:9.5% 1fr 15%;}
  header{display:flex;align-items:center;gap:1.1%;padding:0 2.2%;border-bottom:1px solid var(--line)}
  .badge{font-size:clamp(8px,0.95vw,15px);letter-spacing:.14em;color:var(--bg);background:var(--blue);
    padding:.25em .7em;border-radius:3px;font-weight:600;white-space:nowrap}
  .htxt{flex:1;min-width:0}
  header h1{font-family:var(--serif);font-weight:400;font-size:clamp(12px,1.7vw,28px);color:var(--ink);
    line-height:1.04;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header h1 .sub{color:var(--dim);font-size:.62em;font-style:italic;margin-left:.4em}
  .counter{text-align:right;white-space:nowrap}
  .chapname{font-size:clamp(8px,0.9vw,13px);color:var(--blue);letter-spacing:.04em;
    max-width:20vw;overflow:hidden;text-overflow:ellipsis}
  .cnum{font-family:var(--serif);color:var(--faint);font-size:clamp(9px,1.0vw,15px)}
  main{display:grid;grid-template-columns:63% 37%;min-height:0}
  #stageWrap{position:relative;min-width:0;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  aside{border-left:1px solid var(--line);padding:2.4% 2.2% 1.6%;display:flex;flex-direction:column;gap:4%;min-height:0;overflow:hidden}
  .blk .lab{font-size:clamp(7.5px,0.85vw,12px);letter-spacing:.16em;color:var(--faint);margin-bottom:.5em;font-weight:600}
  .theory .lab{color:var(--blue)} .apply .lab{color:var(--cyan)}
  .blk p{font-size:clamp(9px,1.12vw,17px);line-height:1.5;color:var(--ink);margin-bottom:.45em}
  .blk .m{font-family:var(--serif);color:var(--yel);font-style:italic}
  .blk ul{list-style:none;display:flex;flex-direction:column;gap:.35em}
  .blk li{font-size:clamp(8.5px,1.02vw,15.5px);line-height:1.35;color:var(--dim);padding-left:.9em;position:relative}
  .blk li::before{content:'';position:absolute;left:0;top:.55em;width:.32em;height:.32em;border-radius:50%;background:var(--cyan);opacity:.7}
  footer{border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 2.2%;gap:2%}
  .rail{display:flex;flex-direction:column;gap:.28em;min-width:0;padding:1% 0}
  .railrow{display:flex;align-items:baseline;gap:.6em;font-size:clamp(8.5px,1.08vw,16px);line-height:1.25}
  .rk{font-size:clamp(7px,0.82vw,11.5px);letter-spacing:.13em;font-weight:700;white-space:nowrap;padding:.12em .5em;border-radius:3px}
  .rk.recap{color:var(--recap);border:1px solid var(--recap)}
  .rk.gap{color:var(--bg);background:var(--gap)}
  .rk.fill{color:var(--bg);background:var(--fill)}
  .rt{color:var(--dim);overflow:hidden;text-overflow:ellipsis}
  .railrow.gap .rt,.railrow.fill .rt{color:var(--ink)}
  .nav{display:flex;align-items:center;gap:.5em}
  .nav button{background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:4px;
    padding:.5em .8em;cursor:pointer;font-size:clamp(9px,1vw,15px);transition:.15s;white-space:nowrap}
  .nav button:hover{color:var(--ink);border-color:var(--axis)}
  .nav .prim{background:var(--blue);color:var(--bg);border-color:var(--blue);font-weight:600}
  .nav .icon{padding:.5em .65em}
  /* ---------- menu overlay ---------- */
  #menu{position:absolute;inset:0;background:rgba(8,8,12,0.97);z-index:20;display:none;flex-direction:column;padding:3% 4%}
  #menu.open{display:flex}
  #menu h2{font-family:var(--serif);font-weight:400;font-size:clamp(16px,2.4vw,36px);margin-bottom:.1em}
  #menu .msub{color:var(--dim);font-size:clamp(9px,1.1vw,15px);margin-bottom:2.4%}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2%;overflow:auto;padding-right:1%}
  .card{border:1px solid var(--line);border-radius:6px;padding:3.5% 4%;cursor:pointer;transition:.15s;background:var(--panel)}
  .card:hover{border-color:var(--blue);background:#12141c}
  .card .cn{font-family:var(--serif);color:var(--faint);font-size:clamp(11px,1.4vw,20px)}
  .card .ct{font-size:clamp(11px,1.25vw,18px);color:var(--ink);margin:.3em 0;line-height:1.15}
  .card .cc{font-size:clamp(8px,0.95vw,13px);color:var(--cyan)}
  #menu .close{position:absolute;top:2.6%;right:3%;background:transparent;border:1px solid var(--line);
    color:var(--dim);border-radius:4px;padding:.4em .8em;cursor:pointer}
  #menu .close:hover{color:var(--ink)}
  .hint{position:absolute;bottom:calc(15% + 6px);left:50%;transform:translateX(-50%);color:var(--faint);
    font-size:clamp(8px,0.9vw,13px);pointer-events:none;opacity:0;transition:opacity .4s}
  #deck:hover .hint{opacity:.5}
</style>
</head>
<body>
<div id="wrap">
  <div id="deck" tabindex="0">
    <header>
      <span class="badge" id="badge">FOURIER</span>
      <div class="htxt"><h1 id="title">Title</h1></div>
      <div class="counter"><div class="chapname" id="chapname">Chapter</div><div class="cnum" id="counter">1 · 1/1</div></div>
    </header>
    <main>
      <div id="stageWrap"><canvas id="cv"></canvas></div>
      <aside>
        <div class="blk theory"><div class="lab">THEORY</div><div id="theory"></div></div>
        <div class="blk apply"><div class="lab">IN PRACTICE</div><ul id="apply"></ul></div>
      </aside>
    </main>
    <footer>
      <div class="rail" id="rail"></div>
      <div class="nav">
        <button id="menuBtn" title="Course contents (M)">☰ Contents</button>
        <button class="icon" id="replay" title="Replay (R)">↻</button>
        <button class="icon" id="prev" title="Previous (←)">‹</button>
        <button class="prim" id="next" title="Next (→ / Space)">Next ›</button>
      </div>
    </footer>
    <div id="menu">
      <button class="close" id="menuClose">✕ Close</button>
      <h2>Engineering Mathematics &amp; Physics</h2>
      <div class="msub">A visual course — pick a chapter, or press → to flow straight through.</div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="hint">← → move · R replay · M contents</div>
  </div>
</div>

<script>
"use strict";
/* master chrome constants (each chapter carries its own copies internally) */
const C={bg:'#0b0b0f',ink:'#dcdce2',dim:'#8b8b96',faint:'#5c5c66',line:'#24242c',axis:'#3a3a46',
  blue:'#6ea8d8',yel:'#d6b25c',grn:'#7bb972',red:'#cf7b6b',pur:'#ab8fc7',cyan:'#5fb4ac'};
const TAU=Math.PI*2;
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===== CHAPTERS (injected) ===== */
const CHAPTERS=[
{title:"Fundamental Theorem of Calculus",badge:"CALCULUS",slides:(function(){

"use strict";
/* ============================================================
   Manim-style engine — no dependencies. Fixed 16:9, DPR-crisp.
   Every draw() gets CSS-pixel width/height, so layout is
   deterministic and cannot overlap the HTML panels.
============================================================ */
const C = {
  bg:'#0b0b0f', ink:'#dcdce2', dim:'#8b8b96', faint:'#5c5c66',
  line:'#24242c', axis:'#3a3a46',
  blue:'#6ea8d8', yel:'#d6b25c', grn:'#7bb972', red:'#cf7b6b',
  pur:'#ab8fc7', cyan:'#5fb4ac'
};
const TAU = Math.PI*2;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- tiny drawing helpers ---------- */
function font(ctx,size,{weight='400',fam='sans'}={}){
  const f = fam==='serif' ? "Georgia,'Times New Roman',serif"
                          : "-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
  ctx.font = `${weight} ${size}px ${f}`;
}
function text(ctx,s,x,y,o={}){
  font(ctx,o.size||16,{weight:o.weight,fam:o.fam});
  ctx.fillStyle=o.color||C.ink; ctx.textAlign=o.align||'left';
  ctx.textBaseline=o.baseline||'alphabetic';
  if(o.alpha!=null){ctx.save();ctx.globalAlpha=o.alpha;ctx.fillText(s,x,y);ctx.restore();}
  else ctx.fillText(s,x,y);
}
function line(ctx,x1,y1,x2,y2,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash); if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function dot(ctx,x,y,r,color,alpha){
  ctx.save();if(alpha!=null)ctx.globalAlpha=alpha;ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();
}
function ring(ctx,x,y,r,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.arc(x,y,r,o.a0||0,o.a1||TAU);ctx.stroke();ctx.restore();
}
function arrow(ctx,x1,y1,x2,y2,o={}){
  const col=o.color||C.ink,w=o.w||2,h=o.head||8;
  line(ctx,x1,y1,x2,y2,{color:col,w,alpha:o.alpha});
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.save();if(o.alpha!=null)ctx.globalAlpha=o.alpha;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-h*Math.cos(a-0.4),y2-h*Math.sin(a-0.4));
  ctx.lineTo(x2-h*Math.cos(a+0.4),y2-h*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();ctx.restore();
}
function pathXY(ctx,pts,o={}){
  if(pts.length<2)return;
  ctx.save();ctx.strokeStyle=o.color||C.blue;ctx.lineWidth=o.w||2;
  ctx.lineJoin='round';ctx.lineCap='round';
  if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();ctx.restore();
}
// easing
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// staged progress: returns 0..1 for a sub-window [a,b] of prog p
const stage=(p,a,b)=>clamp((p-a)/(b-a),0,1);

/* make a graph mapper inside a rect */
function graph(w,h,xd,yd,pad){
  const p=Object.assign({l:54,r:24,t:24,b:40},pad||{});
  const A={x:p.l,y:p.t,w:w-p.l-p.r,h:h-p.t-p.b};
  const gx=x=>A.x+(x-xd[0])/(xd[1]-xd[0])*A.w;
  const gy=y=>A.y+A.h-(y-yd[0])/(yd[1]-yd[0])*A.h;
  return {A,gx,gy,xd,yd};
}
function axes(ctx,G,o={}){
  const {A,gx,gy,xd,yd}=G;
  // zero lines if in range
  if(yd[0]<0&&yd[1]>0) line(ctx,A.x,gy(0),A.x+A.w,gy(0),{color:C.axis,w:1});
  else line(ctx,A.x,A.y+A.h,A.x+A.w,A.y+A.h,{color:C.axis,w:1});
  if(xd[0]<=0&&xd[1]>=0) line(ctx,gx(0),A.y,gx(0),A.y+A.h,{color:C.axis,w:1});
  else line(ctx,A.x,A.y,A.x,A.y+A.h,{color:C.axis,w:1});
  if(o.xlabel) text(ctx,o.xlabel,A.x+A.w,gy(yd[0]<0&&yd[1]>0?0:yd[0])+18,{color:C.faint,size:13,align:'right'});
  if(o.ylabel) text(ctx,o.ylabel,gx(0)+6,A.y+4,{color:C.faint,size:13,fam:'serif'});
}

/* ============================================================
   Fundamental Theorem of Calculus — shared math.
   The derivative (instantaneous slope) and the integral
   (accumulated area) are inverse operations. That is the FTC.
============================================================ */
function fpos(x){return 1.05 + 0.6*Math.sin(1.05*x);}      // positive fn for area work
function fparab(x){return 0.18*x*x;}                        // for tangent/derivative work
function dparab(x){return 0.36*x;}
function integ(f,a,b,n){let s=0,dx=(b-a)/n;for(let i=0;i<n;i++)s+=f(a+(i+0.5)*dx)*dx;return s;}
function accum(f,a,x){return integ(f,a,x,Math.max(2,Math.round((x-a)*40)));}

/* ============================================================
   SLIDES
============================================================ */
const SLIDES=[
/* 0 COVER */
{
  badge:'CALCULUS', title:'Slope and area are the same secret',
  subtitle:'a visual course',
  theory:`<p>Two questions run through all of calculus: <span class="m">how fast is this
    changing?</span> (a slope) and <span class="m">how much has accumulated?</span> (an area).</p>
    <p>The Fundamental Theorem says these are <span class="m">inverse</span> operations —
    two views of one relationship.</p>`,
  apply:['Motion: speed ⇄ distance','Physics: force ⇄ work','Data: rate ⇄ total'],
  rail:[['recap','13 single-idea slides — the picture, the theory, and where it is used.']],
  loop:true,
  draw({ctx,w,h,t}){
    const G=graph(w,h,[0,6.2],[0,2],{l:52,r:24,t:40,b:46});
    axes(ctx,G,{xlabel:'x'});
    const xp=0.3+((t*0.5)%1)*5.6;
    // area fill up to xp
    ctx.save();ctx.fillStyle=C.blue;ctx.globalAlpha=.16;ctx.beginPath();ctx.moveTo(G.gx(0),G.gy(0));
    for(let x=0;x<=xp;x+=0.03)ctx.lineTo(G.gx(x),G.gy(fpos(x)));ctx.lineTo(G.gx(xp),G.gy(0));ctx.closePath();ctx.fill();ctx.restore();
    // curve
    const cp=[];for(let x=0;x<=6.2;x+=0.02)cp.push([G.gx(x),G.gy(fpos(x))]);pathXY(ctx,cp,{color:C.ink,w:2.4});
    // tangent at xp
    const slope=0.6*1.05*Math.cos(1.05*xp), y0=fpos(xp);
    const dx=1.1; line(ctx,G.gx(xp-dx),G.gy(y0-slope*dx),G.gx(xp+dx),G.gy(y0+slope*dx),{color:C.yel,w:2});
    dot(ctx,G.gx(xp),G.gy(y0),4,C.yel);
    text(ctx,'slope = rate',G.gx(xp)+8,G.gy(y0)-10,{color:C.yel,size:12});
    text(ctx,'area = total',G.gx(xp*0.5),G.gy(0.25),{color:C.blue,size:12,align:'center'});
  }
},
/* 1 HOOK */
{
  badge:'THE QUESTION', title:'How fast, exactly right now?',
  subtitle:'Feynman: the instant',
  theory:`<p>A car covers 100 km in 2 hours: 50 km/h on <span class="m">average</span>. But its
    speedometer never reads the average — it reads the speed <span class="m">at this instant</span>.</p>
    <p>Average speed needs a stretch of time. "Speed right now" seems to need
    <span class="m">no</span> time at all — a paradox to dissolve.</p>`,
  apply:['Every rate: velocity, current, growth','Marginal cost in economics','Sensitivity of a model'],
  rail:[
    ['recap','Average change is easy; instantaneous change is the puzzle.'],
    ['gap','Speed over zero seconds looks like 0/0 — so how can an instant have a speed at all?']
  ],
  loop:true,
  draw({ctx,w,h,t}){
    const y=h*0.30, x0=w*0.08, x1=w*0.62;
    line(ctx,x0,y,x1,y,{color:C.axis,w:1});
    const s=u=>u + 0.25*Math.sin(u*3); // position along track 0..1 of param
    const u=(t*0.28)%1; const px=x0+(x1-x0)*s(u)/(1+0.25);
    dot(ctx,px,y,6,C.yel);
    for(let k=0;k<=10;k++){const gx=x0+(x1-x0)*k/10;line(ctx,gx,y-4,gx,y+4,{color:C.faint,w:1});}
    text(ctx,'the car',px,y-14,{color:C.dim,size:12,align:'center'});
    // position-time graph below
    const G=graph(w,h,[0,1],[0,1.3],{l:52,r:w*0.42,t:h*0.44,b:46});
    axes(ctx,G,{xlabel:'time',ylabel:'distance'});
    const pts=[];for(let x=0;x<=1;x+=0.01)pts.push([G.gx(x),G.gy(s(x))]);pathXY(ctx,pts,{color:C.blue,w:2.2});
    dot(ctx,G.gx(u),G.gy(s(u)),4,C.yel);
    // average secant from 0 to u
    line(ctx,G.gx(0),G.gy(s(0)),G.gx(u),G.gy(s(u)),{color:C.red,w:1.5,dash:[4,4]});
    text(ctx,'average = secant slope',G.gx(0.05),G.gy(1.2),{color:C.red,size:12});
    text(ctx,'"now" = ?',w*0.5,h*0.5,{color:C.faint,size:14,align:'center'});
  }
},
/* 2 LIMITS secant->tangent */
{
  badge:'THE FIX', title:'Shrink the interval to a point',
  subtitle:'',
  theory:`<p>Measure average speed over a smaller and smaller window. As the window
    <span class="m">→ 0</span>, the secant line pivots into the <span class="m">tangent</span>.</p>
    <p>That limiting slope is the <span class="m">derivative</span> — a well-defined number, no
    division by zero required.</p>`,
  apply:['Numerical differentiation','Tolerances & error bounds','Defining "instant" rigorously'],
  rail:[
    ['fill','A limit turns 0/0 into the exact tangent slope.'],
    ['recap','The derivative is the slope the secants approach.']
  ],
  loop:false,
  draw({ctx,w,h,prog}){
    const G=graph(w,h,[0,5],[0,4.6],{l:52,r:24,t:40,b:46});
    axes(ctx,G,{xlabel:'x'});
    const cp=[];for(let x=0;x<=5;x+=0.02)cp.push([G.gx(x),G.gy(fparab(x))]);pathXY(ctx,cp,{color:C.ink,w:2.2});
    const a=3, h2=1.6*(1-easeIO(prog))+0.02;
    const P=[G.gx(a),G.gy(fparab(a))], Q=[G.gx(a+h2),G.gy(fparab(a+h2))];
    const m=(fparab(a+h2)-fparab(a))/h2;
    // secant extended
    line(ctx,G.gx(a-1.4),G.gy(fparab(a)-m*1.4),G.gx(a+2),G.gy(fparab(a)+m*2),{color:C.yel,w:2});
    dot(ctx,P[0],P[1],4,C.blue); dot(ctx,Q[0],Q[1],4,C.grn);
    text(ctx,'P',P[0]-12,P[1]+4,{color:C.blue,size:12}); text(ctx,'Q',Q[0]+6,Q[1],{color:C.grn,size:12});
    line(ctx,Q[0],P[1],Q[0],Q[1],{color:C.faint,w:1,dash:[3,3]}); line(ctx,P[0],P[1],Q[0],P[1],{color:C.faint,w:1,dash:[3,3]});
    text(ctx,'Δx = '+h2.toFixed(2),(P[0]+Q[0])/2,P[1]+16,{color:C.faint,size:11,align:'center'});
    text(ctx,'slope → '+m.toFixed(2)+'   (true '+dparab(a).toFixed(2)+')',G.A.x+6,G.A.y+14,{color:C.dim,size:13});
  }
},
/* 3 DERIVATIVE fn */
{
  badge:'THE DERIVATIVE', title:'A slope at every point is a new function',
  subtitle:'',
  theory:`<p>Do that limit at every x and you get <span class="m">f '(x)</span> — the slope
    function. Where f rises steeply, f ' is large; at a peak, f ' = 0.</p>
    <p>For <span class="m">f(x)=0.18x²</span>, the derivative is the straight line
    <span class="m">0.36x</span>.</p>`,
  apply:['Optimization: set f\u2032 = 0','Physics: v = ds/dt','ML: gradients of a loss'],
  rail:[
    ['recap','The derivative packages every tangent slope into one curve.'],
    ['gap','It reads out instantaneous rate. Could we run the machine backwards — rate to total?']
  ],
  loop:true,
  draw({ctx,w,h,t}){
    const G=graph(w,h,[-4,4],[-1,3],{l:52,r:24,t:40,b:46});
    axes(ctx,G,{xlabel:'x'});
    const f=x=>0.18*x*x, df=x=>0.36*x;
    const cp=[];for(let x=-4;x<=4;x+=0.02)cp.push([G.gx(x),G.gy(f(x))]);pathXY(ctx,cp,{color:C.blue,w:2.2});
    const dp=[];for(let x=-4;x<=4;x+=0.02)dp.push([G.gx(x),G.gy(df(x))]);pathXY(ctx,dp,{color:C.grn,w:1.8,dash:[5,4]});
    const xp=Math.sin(t*0.7)*3.4;

{title:"Taylor Series",badge:"TAYLOR",slides:(function(){

function font(ctx,size,{weight='400',fam='sans'}={}){

function ring(ctx,x,y,r,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.arc(x,y,r,o.a0||0,o.a1||TAU);ctx.stroke();ctx.restore();
}
function arrow(ctx,x1,y1,x2,y2,o={}){
  const col=o.color||C.ink,w=o.w||2,h=o.head||8;
  line(ctx,x1,y1,x2,y2,{color:col,w,alpha:o.alpha});
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.save();if(o.alpha!=null)ctx.globalAlpha=o.alpha;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-h*Math.cos(a-0.4),y2-h*Math.sin(a-0.4));
  ctx.lineTo(x2-h*Math.cos(a+0.4),y2-h*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();ctx.restore();
}
function pathXY(ctx,pts,o={}){
  if(pts.length<2)return;
  ctx.save();ctx.strokeStyle=o.color||C.blue;ctx.lineWidth=o.w||2;
  ctx.lineJoin='round';ctx.lineCap='round';
  if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();ctx.restore();
}
// easing
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// staged progress: returns 0..1 for a sub-window [a,b] of prog p
const stage=(p,a,b)=>clamp((p-a)/(b-a),0,1);

/* make a graph mapper inside a rect */
function graph(w,h,xd,yd,pad){
  const p=Object.assign({l:54,r:24,t:24,b:40},pad||{});
  const A={x:p.l,y:p.t,w:w-p.l-p.r,h:h-p.t-p.b};
  const gx=x=>A.x+(x-xd[0])/(xd[1]-xd[0])*A.w;
  const gy=y=>A.y+A.h-(y-yd[0])/(yd[1]-yd[0])*A.h;
  return {A,gx,gy,xd,yd};
}
function axes(ctx,G,o={}){
  const {A,gx,gy,xd,yd}=G;
  // zero lines if in range
  if(yd[0]<0&&yd[1]>0) line(ctx,A.x,gy(0),A.x+A.w,gy(0),{color:C.axis,w:1});
  else line(ctx,A.x,A.y+A.h,A.x+A.w,A.y+A.h,{color:C.axis,w:1});
  if(xd[0]<=0&&xd[1]>=0) line(ctx,gx(0),A.y,gx(0),A.y+A.h,{color:C.axis,w:1});
  else line(ctx,A.x,A.y,A.x,A.y+A.h,{color:C.axis,w:1});
  if(o.xlabel) text(ctx,o.xlabel,A.x+A.w,gy(yd[0]<0&&yd[1]>0?0:yd[0])+18,{color:C.faint,size:13,align:'right'});
  if(o.ylabel) text(ctx,o.ylabel,gx(0)+6,A.y+4,{color:C.faint,size:13,fam:'serif'});
}

/* ============================================================
   Taylor Series — shared math.
   Rebuild any smooth function near a point as a polynomial:
   match value, then slope, then curvature, then higher wiggles.
============================================================ */
function fact(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
// Maclaurin partial sums
function taylorSin(x,K){let s=0;for(let k=0;k<=K;k++)s+=Math.pow(-1,k)*Math.pow(x,2*k+1)/fact(2*k+1);return s;}
function taylorCos(x,K){let s=0;for(let k=0;k<=K;k++)s+=Math.pow(-1,k)*Math.pow(x,2*k)/fact(2*k);return s;}
function taylorExp(x,K){let s=0;for(let k=0;k<=K;k++)s+=Math.pow(x,k)/fact(k);return s;}
function taylorGeo(x,K){let s=0;for(let k=0;k<=K;k++)s+=Math.pow(x,k);return s;} // 1/(1-x)
// Taylor of sin around point a, up to order N
function taylorSinAt(x,a,N){
  const d=[Math.sin,Math.cos,x=>-Math.sin(x),x=>-Math.cos(x)];
  let s=0;for(let n=0;n<=N;n++)s+=d[n%4](a)*Math.pow(x-a,n)/fact(n);return s;}

{title:"Fourier — Hidden Frequencies",badge:"FOURIER",slides:(function(){

"use strict";
/* ============================================================
   Manim-style engine — no dependencies. Fixed 16:9, DPR-crisp.
   Every draw() gets CSS-pixel width/height, so layout is
   deterministic and cannot overlap the HTML panels.
============================================================ */
const C = {
  bg:'#0b0b0f', ink:'#dcdce2', dim:'#8b8b96', faint:'#5c5c66',
  line:'#24242c', axis:'#3a3a46',
  blue:'#6ea8d8', yel:'#d6b25c', grn:'#7bb972', red:'#cf7b6b',
  pur:'#ab8fc7', cyan:'#5fb4ac'
};
const TAU = Math.PI*2;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- tiny drawing helpers ---------- */
function font(ctx,size,{weight='400',fam='sans'}={}){
  const f = fam==='serif' ? "Georgia,'Times New Roman',serif"
                          : "-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
  ctx.font = `${weight} ${size}px ${f}`;
}
function text(ctx,s,x,y,o={}){
  font(ctx,o.size||16,{weight:o.weight,fam:o.fam});
  ctx.fillStyle=o.color||C.ink; ctx.textAlign=o.align||'left';
  ctx.textBaseline=o.baseline||'alphabetic';
  if(o.alpha!=null){ctx.save();ctx.globalAlpha=o.alpha;ctx.fillText(s,x,y);ctx.restore();}
  else ctx.fillText(s,x,y);
}
function line(ctx,x1,y1,x2,y2,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash); if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function dot(ctx,x,y,r,color,alpha){
  ctx.save();if(alpha!=null)ctx.globalAlpha=alpha;ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();
}
function ring(ctx,x,y,r,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.arc(x,y,r,o.a0||0,o.a1||TAU);ctx.stroke();ctx.restore();
}
function arrow(ctx,x1,y1,x2,y2,o={}){
  const col=o.color||C.ink,w=o.w||2,h=o.head||8;
  line(ctx,x1,y1,x2,y2,{color:col,w,alpha:o.alpha});
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.save();if(o.alpha!=null)ctx.globalAlpha=o.alpha;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-h*Math.cos(a-0.4),y2-h*Math.sin(a-0.4));
  ctx.lineTo(x2-h*Math.cos(a+0.4),y2-h*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();ctx.restore();
}
function pathXY(ctx,pts,o={}){
  if(pts.length<2)return;
  ctx.save();ctx.strokeStyle=o.color||C.blue;ctx.lineWidth=o.w||2;
  ctx.lineJoin='round';ctx.lineCap='round';
  if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();ctx.restore();
}
// easing
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// staged progress: returns 0..1 for a sub-window [a,b] of prog p
const stage=(p,a,b)=>clamp((p-a)/(b-a),0,1);

/* make a graph mapper inside a rect */
function graph(w,h,xd,yd,pad){
  const p=Object.assign({l:54,r:24,t:24,b:40},pad||{});
  const A={x:p.l,y:p.t,w:w-p.l-p.r,h:h-p.t-p.b};
  const gx=x=>A.x+(x-xd[0])/(xd[1]-xd[0])*A.w;
  const gy=y=>A.y+A.h-(y-yd[0])/(yd[1]-yd[0])*A.h;
  return {A,gx,gy,xd,yd};
}
function axes(ctx,G,o={}){
  const {A,gx,gy,xd,yd}=G;
  // zero lines if in range
  if(yd[0]<0&&yd[1]>0) line(ctx,A.x,gy(0),A.x+A.w,gy(0),{color:C.axis,w:1});
  else line(ctx,A.x,A.y+A.h,A.x+A.w,A.y+A.h,{color:C.axis,w:1});
  if(xd[0]<=0&&xd[1]>=0) line(ctx,gx(0),A.y,gx(0),A.y+A.h,{color:C.axis,w:1});
  else line(ctx,A.x,A.y,A.x,A.y+A.h,{color:C.axis,w:1});
  if(o.xlabel) text(ctx,o.xlabel,A.x+A.w,gy(yd[0]<0&&yd[1]>0?0:yd[0])+18,{color:C.faint,size:13,align:'right'});
  if(o.ylabel) text(ctx,o.ylabel,gx(0)+6,A.y+4,{color:C.faint,size:13,fam:'serif'});
}

============================================================ */

function com(f){let re=0,im=0;for(let i=0;i<=NS;i++){const ang=-TAU*f*TS[i];re+=GS[i]*Math.cos(ang);im+=GS[i]*Math.sin(ang);}return[re/(NS+1),im/(NS+1)];}
function comMag(f){const[r,i]=com(f);return Math.hypot(r,i);}

/* 5 — THE WINDING TRICK ----------------------------------- */
{
  badge:'THE KEY TRICK', title:'Wind the signal around a circle',

  theory:`<p>Take the wave and <span class="m">wrap it around a spool</span> at some test

  apply:['This IS how a tuner finds pitch','Lock-in amplifiers use it','Correlation = matched filtering'],

  loop:false,
  draw({ctx,w,h,prog}){
    // left: winding circle plot ; right: signal being consumed

},

{

{

{title:"Vector Calculus — Green, Stokes, Gauss",badge:"VECTOR CALC",slides:(function(){

function line(ctx,x1,y1,x2,y2,o={}){ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;

function arrow(ctx,x1,y1,x2,y2,o={}){const col=o.color||C.ink,w=o.w||2,h=o.head||8;
  line(ctx,x1,y1,x2,y2,{color:col,w,alpha:o.alpha});
  const a=Math.atan2(y2-y1,x2-x1);ctx.save();if(o.alpha!=null)ctx.globalAlpha=o.alpha;ctx.fillStyle=col;

function pathXY(ctx,pts,o={}){if(pts.length<2)return;ctx.save();ctx.strokeStyle=o.color||C.blue;ctx.lineWidth=o.w||2;
  ctx.lineJoin='round';ctx.lineCap='round';if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;

  ctx.stroke();ctx.restore();}
// curved arrow arc (for curl / circulation)
function arcArrow(ctx,cx,cy,r,a0,a1,o={}){const col=o.color||C.yel,w=o.w||2;
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.arc(cx,cy,r,a0,a1,a1<a0);ctx.stroke();

const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const stage=(p,a,b)=>clamp((p-a)/(b-a),0,1);

/* ---------- vector-field helpers ---------- */
// centred map: math [-half,half] -> pixels within a square area
function fmap(w,h,half,cxpx,cypx,frac){
  const cx=cxpx!=null?cxpx:w*0.32, cy=cypx!=null?cypx:h*0.5;
  const s=(Math.min(w*0.6,h)* (frac||0.42))/half;
  return {cx,cy,s,X:x=>cx+x*s,Y:y=>cy-y*s};
}
function drawField(ctx,M,half,F,o={}){
  const nx=o.nx||11, ny=o.ny||9, col=o.color||C.blue;
  const step=(2*half)/(nx-1), cell=step*M.s, maxL=(o.maxLen||cell*0.46);
  for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){
    const x=-half+i*step, y=-half+ (j*(2*half)/(ny-1));
    const[fx,fy]=F(x,y); const mag=Math.hypot(fx,fy)||1e-6;
    const L=Math.min(maxL, mag*(o.scale||M.s*0.30));
    const ux=fx/mag, uy=fy/mag;
    const px=M.X(x), py=M.Y(y);
    const ex=px+ux*L, ey=py-uy*L;
    const al=o.alpha!=null?o.alpha:clamp(0.25+mag*0.18,0.2,0.9);
    arrow(ctx,px,py,ex,ey,{color:col,w:1.4,head:5,alpha:al});
  }
}

/* blob region (disk of cells) for the cancellation theorems */
function blob(w,h,cxpx,cypx,cs,R){
  const cells=[],set=new Set();
  for(let i=-R;i<=R;i++)for(let j=-R;j<=R;j++){ if(i*i+j*j<=R*R+0.5){cells.push([i,j]);set.add(i+','+j);} }
  const ox=cxpx-cs/2, oy=cypx-cs/2;
  const px=(i)=>ox+i*cs, py=(j)=>oy+j*cs;
  // boundary edges: side of a cell whose neighbour is absent
  const bedges=[];
  for(const[i,j] of cells){
    if(!set.has((i-1)+','+j)) bedges.push([px(i),py(j),px(i),py(j+1)]);      // left
    if(!set.has((i+1)+','+j)) bedges.push([px(i+1),py(j),px(i+1),py(j+1)]);  // right
    if(!set.has(i+','+(j-1))) bedges.push([px(i),py(j),px(i+1),py(j)]);      // top
    if(!set.has(i+','+(j+1))) bedges.push([px(i),py(j+1),px(i+1),py(j+1)]);  // bottom
  }
  return {cells,set,cs,ox,oy,px,py,bedges,cx:cxpx,cy:cypx,R:R*cs};
}

   An ODE is an equation for an unknown FUNCTION via its
   derivatives. Solving = finding the curve whose slope obeys
   the rule everywhere.
============================================================ */
// logistic slope field  y' = r y (1 - y)
function odeField(x,y){return 1.1*y*(1-y);}
function logistic(x,x0){const r=1.1;return 1/(1+Math.exp(-r*(x-x0)));}
// damped oscillator solution for the three regimes
function damped(t,gamma,w0){
  if(gamma<w0){const wd=Math.sqrt(w0*w0-gamma*gamma);return Math.exp(-gamma*t)*Math.cos(wd*t);}
  if(Math.abs(gamma-w0)<1e-6){return (1+w0*t)*Math.exp(-w0*t);}
  const r1=-gamma+Math.sqrt(gamma*gamma-w0*w0), r2=-gamma-Math.sqrt(gamma*gamma-w0*w0);
  const A=r2/(r2-r1), B=-r1/(r2-r1); return A*Math.exp(r1*t)+B*Math.exp(r2*t);

// driven oscillator steady amplitude (resonance curve)
function resonanceAmp(w,w0,gamma){return 1/Math.sqrt(Math.pow(w0*w0-w*w,2)+Math.pow(2*gamma*w,2));}

{title:"Partial Differential Equations",badge:"PDEs",slides:(function(){

const C = {

  pur:'#ab8fc7', cyan:'#5fb4ac'

const TAU = Math.PI*2;

/* ---------- tiny drawing helpers ---------- */
function font(ctx,size,{weight='400',fam='sans'}={}){
  const f = fam==='serif' ? "Georgia,'Times New Roman',serif"
                          : "-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
  ctx.font = `${weight} ${size}px ${f}`;
}
function text(ctx,s,x,y,o={}){
  font(ctx,o.size||16,{weight:o.weight,fam:o.fam});
  ctx.fillStyle=o.color||C.ink; ctx.textAlign=o.align||'left';
  ctx.textBaseline=o.baseline||'alphabetic';
  if(o.alpha!=null){ctx.save();ctx.globalAlpha=o.alpha;ctx.fillText(s,x,y);ctx.restore();}
  else ctx.fillText(s,x,y);
}
function line(ctx,x1,y1,x2,y2,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash); if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function dot(ctx,x,y,r,color,alpha){
  ctx.save();if(alpha!=null)ctx.globalAlpha=alpha;ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();
}
function ring(ctx,x,y,r,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.arc(x,y,r,o.a0||0,o.a1||TAU);ctx.stroke();ctx.restore();
}
function arrow(ctx,x1,y1,x2,y2,o={}){
  const col=o.color||C.ink,w=o.w||2,h=o.head||8;
  line(ctx,x1,y1,x2,y2,{color:col,w,alpha:o.alpha});
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.save();if(o.alpha!=null)ctx.globalAlpha=o.alpha;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-h*Math.cos(a-0.4),y2-h*Math.sin(a-0.4));
  ctx.lineTo(x2-h*Math.cos(a+0.4),y2-h*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();ctx.restore();
}
function pathXY(ctx,pts,o={}){
  if(pts.length<2)return;
  ctx.save();ctx.strokeStyle=o.color||C.blue;ctx.lineWidth=o.w||2;
  ctx.lineJoin='round';ctx.lineCap='round';
  if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();ctx.restore();
}
// easing
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// staged progress: returns 0..1 for a sub-window [a,b] of prog p
const stage=(p,a,b)=>clamp((p-a)/(b-a),0,1);

/* make a graph mapper inside a rect */
function graph(w,h,xd,yd,pad){
  const p=Object.assign({l:54,r:24,t:24,b:40},pad||{});
  const A={x:p.l,y:p.t,w:w-p.l-p.r,h:h-p.t-p.b};
  const gx=x=>A.x+(x-xd[0])/(xd[1]-xd[0])*A.w;
  const gy=y=>A.y+A.h-(y-yd[0])/(yd[1]-yd[0])*A.h;
  return {A,gx,gy,xd,yd};
}
function axes(ctx,G,o={}){
  const {A,gx,gy,xd,yd}=G;
  // zero lines if in range
  if(yd[0]<0&&yd[1]>0) line(ctx,A.x,gy(0),A.x+A.w,gy(0),{color:C.axis,w:1});
  else line(ctx,A.x,A.y+A.h,A.x+A.w,A.y+A.h,{color:C.axis,w:1});
  if(xd[0]<=0&&xd[1]>=0) line(ctx,gx(0),A.y,gx(0),A.y+A.h,{color:C.axis,w:1});
  else line(ctx,A.x,A.y,A.x,A.y+A.h,{color:C.axis,w:1});
  if(o.xlabel) text(ctx,o.xlabel,A.x+A.w,gy(yd[0]<0&&yd[1]>0?0:yd[0])+18,{color:C.faint,size:13,align:'right'});
  if(o.ylabel) text(ctx,o.ylabel,gx(0)+6,A.y+4,{color:C.faint,size:13,fam:'serif'});
}

============================================================ */

function pulse(x){return Math.exp(-(x*x)*6);}
function stringMode(x,n){return Math.sin(n*Math.PI*x);}

{title:"Complex Analysis & Residues",badge:"COMPLEX",slides:(function(){

"use strict";
/* ============================================================
   Manim-style engine — no dependencies. Fixed 16:9, DPR-crisp.
   Every draw() gets CSS-pixel width/height, so layout is
   deterministic and cannot overlap the HTML panels.
============================================================ */
const C = {
  bg:'#0b0b0f', ink:'#dcdce2', dim:'#8b8b96', faint:'#5c5c66',
  line:'#24242c', axis:'#3a3a46',
  blue:'#6ea8d8', yel:'#d6b25c', grn:'#7bb972', red:'#cf7b6b',
  pur:'#ab8fc7', cyan:'#5fb4ac'
};
const TAU = Math.PI*2;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- tiny drawing helpers ---------- */
function font(ctx,size,{weight='400',fam='sans'}={}){
  const f = fam==='serif' ? "Georgia,'Times New Roman',serif"
                          : "-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
  ctx.font = `${weight} ${size}px ${f}`;
}
function text(ctx,s,x,y,o={}){
  font(ctx,o.size||16,{weight:o.weight,fam:o.fam});
  ctx.fillStyle=o.color||C.ink; ctx.textAlign=o.align||'left';
  ctx.textBaseline=o.baseline||'alphabetic';
  if(o.alpha!=null){ctx.save();ctx.globalAlpha=o.alpha;ctx.fillText(s,x,y);ctx.restore();}
  else ctx.fillText(s,x,y);
}
function line(ctx,x1,y1,x2,y2,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash); if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function dot(ctx,x,y,r,color,alpha){
  ctx.save();if(alpha!=null)ctx.globalAlpha=alpha;ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();
}
function ring(ctx,x,y,r,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;

}
function arrow(ctx,x1,y1,x2,y2,o={}){
  const col=o.color||C.ink,w=o.w||2,h=o.head||8;
  line(ctx,x1,y1,x2,y2,{color:col,w,alpha:o.alpha});
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.save();if(o.alpha!=null)ctx.globalAlpha=o.alpha;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-h*Math.cos(a-0.4),y2-h*Math.sin(a-0.4));
  ctx.lineTo(x2-h*Math.cos(a+0.4),y2-h*Math.sin(a+0.4));

}
function pathXY(ctx,pts,o={}){
  if(pts.length<2)return;

// easing
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// staged progress: returns 0..1 for a sub-window [a,b] of prog p

/* make a graph mapper inside a rect */
function graph(w,h,xd,yd,pad){
  const p=Object.assign({l:54,r:24,t:24,b:40},pad||{});
  const A={x:p.l,y:p.t,w:w-p.l-p.r,h:h-p.t-p.b};

function axes(ctx,G,o={}){

{title:"The Laplace Transform",badge:"LAPLACE",slides:(function(){

/* ============================================================

const C = {

const TAU = Math.PI*2;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- tiny drawing helpers ---------- */
function font(ctx,size,{weight='400',fam='sans'}={}){
  const f = fam==='serif' ? "Georgia,'Times New Roman',serif"
                          : "-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";

}
function text(ctx,s,x,y,o={}){
  font(ctx,o.size||16,{weight:o.weight,fam:o.fam});
  ctx.fillStyle=o.color||C.ink; ctx.textAlign=o.align||'left';
  ctx.textBaseline=o.baseline||'alphabetic';
  if(o.alpha!=null){ctx.save();ctx.globalAlpha=o.alpha;ctx.fillText(s,x,y);ctx.restore();}
  else ctx.fillText(s,x,y);
}
function line(ctx,x1,y1,x2,y2,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash); if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function dot(ctx,x,y,r,color,alpha){
  ctx.save();if(alpha!=null)ctx.globalAlpha=alpha;ctx.fillStyle=color;

function ring(ctx,x,y,r,o={}){

{title:"Central Limit Theorem",badge:"CENTRAL LIMIT",slides:(function(){

"use strict";
/* ============================================================
   Manim-style engine — no dependencies. Fixed 16:9, DPR-crisp.
   Every draw() gets CSS-pixel width/height, so layout is
   deterministic and cannot overlap the HTML panels.
============================================================ */
const C = {
  bg:'#0b0b0f', ink:'#dcdce2', dim:'#8b8b96', faint:'#5c5c66',
  line:'#24242c', axis:'#3a3a46',
  blue:'#6ea8d8', yel:'#d6b25c', grn:'#7bb972', red:'#cf7b6b',
  pur:'#ab8fc7', cyan:'#5fb4ac'
};
const TAU = Math.PI*2;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- tiny drawing helpers ---------- */
function font(ctx,size,{weight='400',fam='sans'}={}){
  const f = fam==='serif' ? "Georgia,'Times New Roman',serif"
                          : "-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
  ctx.font = `${weight} ${size}px ${f}`;
}
function text(ctx,s,x,y,o={}){
  font(ctx,o.size||16,{weight:o.weight,fam:o.fam});
  ctx.fillStyle=o.color||C.ink; ctx.textAlign=o.align||'left';
  ctx.textBaseline=o.baseline||'alphabetic';
  if(o.alpha!=null){ctx.save();ctx.globalAlpha=o.alpha;ctx.fillText(s,x,y);ctx.restore();}
  else ctx.fillText(s,x,y);
}
function line(ctx,x1,y1,x2,y2,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash); if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function dot(ctx,x,y,r,color,alpha){
  ctx.save();if(alpha!=null)ctx.globalAlpha=alpha;ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();
}
function ring(ctx,x,y,r,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.arc(x,y,r,o.a0||0,o.a1||TAU);ctx.stroke();ctx.restore();
}
function arrow(ctx,x1,y1,x2,y2,o={}){
  const col=o.color||C.ink,w=o.w||2,h=o.head||8;
  line(ctx,x1,y1,x2,y2,{color:col,w,alpha:o.alpha});
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.save();if(o.alpha!=null)ctx.globalAlpha=o.alpha;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-h*Math.cos(a-0.4),y2-h*Math.sin(a-0.4));
  ctx.lineTo(x2-h*Math.cos(a+0.4),y2-h*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();ctx.restore();
}
function pathXY(ctx,pts,o={}){
  if(pts.length<2)return;
  ctx.save();ctx.strokeStyle=o.color||C.blue;ctx.lineWidth=o.w||2;
  ctx.lineJoin='round';ctx.lineCap='round';
  if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();ctx.restore();
}
// easing
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// staged progress: returns 0..1 for a sub-window [a,b] of prog p
const stage=(p,a,b)=>clamp((p-a)/(b-a),0,1);

/* make a graph mapper inside a rect */
function graph(w,h,xd,yd,pad){
  const p=Object.assign({l:54,r:24,t:24,b:40},pad||{});
  const A={x:p.l,y:p.t,w:w-p.l-p.r,h:h-p.t-p.b};
  const gx=x=>A.x+(x-xd[0])/(xd[1]-xd[0])*A.w;
  const gy=y=>A.y+A.h-(y-yd[0])/(yd[1]-yd[0])*A.h;
  return {A,gx,gy,xd,yd};
}
function axes(ctx,G,o={}){
  const {A,gx,gy,xd,yd}=G;
  // zero lines if in range

  if(xd[0]<=0&&xd[1]>=0) line(ctx,gx(0),A.y,gx(0),A.y+A.h,{color:C.axis,w:1});
  else line(ctx,A.x,A.y,A.x,A.y+A.h,{color:C.axis,w:1});
  if(o.xlabel) text(ctx,o.xlabel,A.x+A.w,gy(yd[0]<0&&yd[1]>0?0:yd[0])+18,{color:C.faint,size:13,align:'right'});
  if(o.ylabel) text(ctx,o.ylabel,gx(0)+6,A.y+4,{color:C.faint,size:13,fam:'serif'});
}

/* ============================================================
   Central Limit Theorem — shared math.
   Adding independent random variables = CONVOLVING their
   distributions. Repeated convolution smooths any shape into
   a Gaussian. (Recall from the Fourier deck: convolution in
   one domain is multiplication in the other.)
============================================================ */
function normalize(a){let s=0;for(const v of a)s+=v;return a.map(v=>v/s);}
function conv(a,b){const r=new Array(a.length+b.length-1).fill(0);
  for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)r[i+j]+=a[i]*b[j];return r;}
function selfConv(p,n){let r=[1];for(let k=0;k<n;k++)r=conv(r,p);return r;} // dist of n-fold sum
function stats(p){let m=0;for(let k=0;k<p.length;k++)m+=k*p[k];
  let v=0;for(let k=0;k<p.length;k++)v+=(k-m)*(k-m)*p[k];return{m,v,sd:Math.sqrt(v)};}
function gauss(x,mu,sd){return Math.exp(-((x-mu)*(x-mu))/(2*sd*sd))/(sd*Math.sqrt(TAU));}
function arrMax(a){let m=0;for(const v of a)if(v>m)m=v;return m;}
// a deliberately skewed base distribution on values 0..3 (so convergence is visible)
const BASE=normalize([0.60,0.25,0.10,0.05]);
const BSTAT=stats(BASE);
// characteristic-function (real part) of BASE, phi(t)=E[cos(tX)]
function phiBase(t){let s=0;for(let k=0;k<BASE.length;k++)s+=BASE[k]*Math.cos(k*t);return s;}
// binomial(n,1/2) for the Galton board
function binom(n){const r=[];let c=1;for(let k=0;k<=n;k++){r.push(c);c=c*(n-k)/(k+1);}
  const s=Math.pow(2,n);return r.map(v=>v/s);}
// small seeded PRNG (mulberry32)
function rng32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}

/* 4 — ADDING = CONVOLVING -------------------------------- */
{
  badge:'THE MECHANISM', title:'Adding random variables = convolving',
  subtitle:'the rule',
  theory:`<p>To get the distribution of <span class="m">X + Y</span>, flip one distribution and
    <span class="m">slide</span> it across the other; the overlap area at each shift is the
    new probability.</p>
    <p>That sliding overlap is <span class="m">convolution</span> — the same operation the
    Fourier deck turned into simple multiplication.</p>`,
  apply:['Signal + noise = convolution','Blur = convolving with a kernel','Combining tolerances in design'],
  rail:[
    ['fill','The combine rule is convolution: slide, overlap, accumulate.'],
    ['gap','If summing always convolves, what shape does convolving over and over drive us toward?']
  ],
  loop:false,
  draw({ctx,w,h,prog}){
    // f = box on [1,3], g = box on [1,3]; f*g = triangle on [2,6]
    const G=graph(w,h,[0,8],[0,1.15],{l:48,r:24,t:h*0.10,b:h*0.55});
    axes(ctx,G,{xlabel:'value'});
    const box=(x,a,b)=>(x>=a&&x<=b)?1:0;
    // f fixed
    const fpts=[];for(let x=0;x<=8;x+=0.02)fpts.push([G.gx(x),G.gy(box(x,1,3)*0.9)]);
    pathXY(ctx,fpts,{color:C.blue,w:2});
    text(ctx,'f (of X)',G.gx(2),G.gy(0.9)-8,{color:C.blue,size:12,align:'center'});
    // g flipped + shifted by s
    const s=1+easeIO(prog)*5;  // shift 1..6
    const gAt=x=>box(s-x,1,3)*0.9;   // g(s - x)
    const gpts=[];for(let x=0;x<=8;x+=0.02)gpts.push([G.gx(x),G.gy(gAt(x))]);
    pathXY(ctx,gpts,{color:C.grn,w:2});
    text(ctx,'g flipped & shifted',G.gx(s),G.gy(0.9)+16,{color:C.grn,size:12,align:'center'});
    // overlap shading
    ctx.save();ctx.fillStyle=C.yel;ctx.globalAlpha=.28;ctx.beginPath();
    let started=false;for(let x=0;x<=8;x+=0.02){const ov=Math.min(box(x,1,3),box(s-x,1,3))*0.9;
      const px=G.gx(x),py=G.gy(ov); if(!started){ctx.moveTo(px,G.gy(0));started=true;} ctx.lineTo(px,py);}
    ctx.lineTo(G.gx(8),G.gy(0));ctx.closePath();ctx.fill();ctx.restore();
    // output triangle building
    const Go=graph(w,h,[0,8],[0,1.15],{l:48,r:24,t:h*0.56,b:44});
    axes(ctx,Go,{xlabel:'value of X + Y'});
    const tri=x=>{const v=(x>=2&&x<=6)?(2-Math.abs(x-4))/2:0;return Math.max(0,v);};
    const opts=[];for(let x=0;x<=Math.min(8,s+3);x+=0.02)opts.push([Go.gx(x),Go.gy(tri(x)*0.95)]);
    pathXY(ctx,opts,{color:C.pur,w:2.4});
    dot(ctx,Go.gx(s),Go.gy(tri(s)*0.95),3.5,C.yel);
    text(ctx,'(f ∗ g): overlap vs shift',Go.A.x+6,Go.A.y+14,{color:C.dim,size:13});
  }
},

/* 6 — THE THEOREM ---------------------------------------- */
{
  badge:'THE THEOREM', title:'The Central Limit Theorem',
  subtitle:'standardize and converge',
  theory:`<p>For n independent samples of mean μ and spread σ, the standardized sum</p>
    <p><span class="m">(S<sub>n</sub> − nμ) / (σ√n) → N(0, 1)</span></p>
    <p>converges to the standard bell, whatever the original distribution — as long as σ is
    finite.</p>`,
  apply:['Confidence intervals','Hypothesis tests (z, t)','Error bars on any average'],
  rail:[
    ['fill','The limit is the standard normal N(0,1) — the one universal shape.'],
    ['recap','Any finite-variance source, summed and rescaled, becomes the same bell.']
  ],
  loop:false,
  draw({ctx,w,h,prog}){
    const n=1+Math.floor(easeIO(prog)*29);   // 1..30
    const p=selfConv(BASE,n); const mu=n*BSTAT.m, sd=BSTAT.sd*Math.sqrt(n);
    const G=graph(w,h,[-4,4],[0,0.52],{l:52,r:24,t:40,b:46});
    axes(ctx,G,{xlabel:'standardized value  z'});
    // standardized bars: density = pmf * sd
    const bw=Math.max(1.5,(G.A.w/(p.length))*0.9);
    for(let k=0;k<p.length;k++){const z=(k-mu)/sd; if(z<-4||z>4)continue;

      ctx.fillStyle=C.blue;ctx.globalAlpha=.8;ctx.fillRect(x-bw/2,y,bw,G.gy(0)-y);ctx.globalAlpha=1;}
    // standard normal overlay
    const gp=[];for(let z=-4;z<=4;z+=0.02)gp.push([G.gx(z),G.gy(gauss(z,0,1))]);

  }
},

/* 9 — WHY GAUSSIAN (Fourier link) ------------------------ */
{
  badge:'THE PROOF-IDEA', title:'Why that curve? Ask the Fourier transform',
  subtitle:'the fixed point',
  theory:`<p>The characteristic function <span class="m">φ(t)=E[e<sup>itX</sup>]</span> is just the
    distribution's Fourier transform. Summing n copies <span class="m">multiplies</span> them:
    φ(t)<sup>n</sup>.</p>
    <p>Near t = 0, <span class="m">φ(t) ≈ 1 − σ²t²/2</span>, so φ<sup>n</sup> → a Gaussian's
    transform. Transform back and you get the bell — the only fixed point.</p>`,
  apply:['Proves CLT cleanly','Same trick: moment generating fns','Convolution ↔ multiplication'],
  rail:[
    ['fill','In the Fourier world, summing is multiplying — and only the Gaussian survives it.'],
    ['recap','The transform explains WHY the bell, not just that it appears.']
  ],
  loop:false,
  draw({ctx,w,h,prog}){
    const n=1+Math.floor(easeIO(prog)*11);   // 1..12
    // |phi(t)|^n narrows to a gaussian-shaped bump around 0
    const G=graph(w,h,[-3,3],[0,1.05],{l:52,r:24,t:40,b:46});
    axes(ctx,G,{xlabel:'t   (frequency)'});
    const pn=[];for(let t=-3;t<=3;t+=0.01){const v=Math.pow(Math.abs(phiBase(t)),n);pn.push([G.gx(t),G.gy(v)]);}
    pathXY(ctx,pn,{color:C.grn,w:2.2});
    // parabola/gaussian approximation e^{-n sigma^2 t^2/2}

    pathXY(ctx,ap,{color:C.yel,w:1.6,dash:[5,4]});
    text(ctx,'|φ(t)|^n',G.gx(0.4),G.gy(0.9),{color:C.grn,size:13});
    text(ctx,'Gaussian approx',G.gx(1.2),G.gy(0.5),{color:C.yel,size:12});
    text(ctx,'n = '+n,G.A.x+6,G.A.y+14,{color:C.dim,size:13});
    text(ctx,'a narrow transform ⇄ a wide bell in value-space',w*0.5,h-22,{color:C.faint,size:13,align:'center'});
  }
},

{title:"Gradient Descent & Optimization",badge:"OPTIMIZATION",slides:(function(){

"use strict";
/* ============================================================
   Manim-style engine — no dependencies. Fixed 16:9, DPR-crisp.
   Every draw() gets CSS-pixel width/height, so layout is
   deterministic and cannot overlap the HTML panels.
============================================================ */
const C = {
  bg:'#0b0b0f', ink:'#dcdce2', dim:'#8b8b96', faint:'#5c5c66',
  line:'#24242c', axis:'#3a3a46',
  blue:'#6ea8d8', yel:'#d6b25c', grn:'#7bb972', red:'#cf7b6b',
  pur:'#ab8fc7', cyan:'#5fb4ac'
};
const TAU = Math.PI*2;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- tiny drawing helpers ---------- */
function font(ctx,size,{weight='400',fam='sans'}={}){
  const f = fam==='serif' ? "Georgia,'Times New Roman',serif"
                          : "-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
  ctx.font = `${weight} ${size}px ${f}`;
}
function text(ctx,s,x,y,o={}){
  font(ctx,o.size||16,{weight:o.weight,fam:o.fam});
  ctx.fillStyle=o.color||C.ink; ctx.textAlign=o.align||'left';
  ctx.textBaseline=o.baseline||'alphabetic';
  if(o.alpha!=null){ctx.save();ctx.globalAlpha=o.alpha;ctx.fillText(s,x,y);ctx.restore();}
  else ctx.fillText(s,x,y);
}
function line(ctx,x1,y1,x2,y2,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash); if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function dot(ctx,x,y,r,color,alpha){
  ctx.save();if(alpha!=null)ctx.globalAlpha=alpha;ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();
}
function ring(ctx,x,y,r,o={}){
  ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.arc(x,y,r,o.a0||0,o.a1||TAU);ctx.stroke();ctx.restore();
}
function arrow(ctx,x1,y1,x2,y2,o={}){
  const col=o.color||C.ink,w=o.w||2,h=o.head||8;
  line(ctx,x1,y1,x2,y2,{color:col,w,alpha:o.alpha});
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.save();if(o.alpha!=null)ctx.globalAlpha=o.alpha;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-h*Math.cos(a-0.4),y2-h*Math.sin(a-0.4));
  ctx.lineTo(x2-h*Math.cos(a+0.4),y2-h*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();ctx.restore();
}
function pathXY(ctx,pts,o={}){
  if(pts.length<2)return;
  ctx.save();ctx.strokeStyle=o.color||C.blue;ctx.lineWidth=o.w||2;
  ctx.lineJoin='round';ctx.lineCap='round';
  if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();ctx.restore();
}
// easing
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// staged progress: returns 0..1 for a sub-window [a,b] of prog p
const stage=(p,a,b)=>clamp((p-a)/(b-a),0,1);

/* make a graph mapper inside a rect */
function graph(w,h,xd,yd,pad){
  const p=Object.assign({l:54,r:24,t:24,b:40},pad||{});
  const A={x:p.l,y:p.t,w:w-p.l-p.r,h:h-p.t-p.b};
  const gx=x=>A.x+(x-xd[0])/(xd[1]-xd[0])*A.w;
  const gy=y=>A.y+A.h-(y-yd[0])/(yd[1]-yd[0])*A.h;
  return {A,gx,gy,xd,yd};
}
function axes(ctx,G,o={}){
  const {A,gx,gy,xd,yd}=G;
  // zero lines if in range
  if(yd[0]<0&&yd[1]>0) line(ctx,A.x,gy(0),A.x+A.w,gy(0),{color:C.axis,w:1});
  else line(ctx,A.x,A.y+A.h,A.x+A.w,A.y+A.h,{color:C.axis,w:1});
  if(xd[0]<=0&&xd[1]>=0) line(ctx,gx(0),A.y,gx(0),A.y+A.h,{color:C.axis,w:1});
  else line(ctx,A.x,A.y,A.x,A.y+A.h,{color:C.axis,w:1});
  if(o.xlabel) text(ctx,o.xlabel,A.x+A.w,gy(yd[0]<0&&yd[1]>0?0:yd[0])+18,{color:C.faint,size:13,align:'right'});
  if(o.ylabel) text(ctx,o.ylabel,gx(0)+6,A.y+4,{color:C.faint,size:13,fam:'serif'});
}

/* ============================================================
   Gradient Descent & Optimization — shared math.
   Learning = minimizing a loss. Follow the slope downhill.
============================================================ */
// 1D loss with a couple of wiggles (non-convex)
function loss1(x){return 0.12*x*x + 0.9*Math.sin(1.2*x) + 1.4;}
function dloss1(x){return 0.24*x + 1.08*Math.cos(1.2*x);}
// convex bowl
function bowl(x){return 0.25*x*x+0.5;}
function dbowl(x){return 0.5*x;}
// 2D loss surface (for contour): elongated valley (ravine)
function loss2(x,y){return 0.06*x*x + 0.9*y*y + 0.2*Math.sin(0.8*x);}
function grad2(x,y){return [0.12*x + 0.16*Math.cos(0.8*x), 1.8*y];}
// run gradient descent on 1D from x0
function gd1(x0,lr,steps,df){const xs=[x0];let x=x0;for(let i=0;i<steps;i++){x=x-lr*df(x);xs.push(x);}return xs;}

/* 4 gradient in 2D */
{

function dot(ctx,x,y,r,color,alpha){ctx.save();if(alpha!=null)ctx.globalAlpha=alpha;ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();}
function ring(ctx,x,y,r,o={}){ctx.save();ctx.strokeStyle=o.color||C.axis;ctx.lineWidth=o.w||1;
  if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.arc(x,y,r,o.a0||0,o.a1||TAU);ctx.stroke();ctx.restore();}
function arrow(ctx,x1,y1,x2,y2,o={}){const col=o.color||C.ink,w=o.w||2,h=o.head||8;
  line(ctx,x1,y1,x2,y2,{color:col,w,alpha:o.alpha});
  const a=Math.atan2(y2-y1,x2-x1);ctx.save();if(o.alpha!=null)ctx.globalAlpha=o.alpha;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-h*Math.cos(a-0.4),y2-h*Math.sin(a-0.4));
  ctx.lineTo(x2-h*Math.cos(a+0.4),y2-h*Math.sin(a+0.4));ctx.closePath();ctx.fill();ctx.restore();}
function pathXY(ctx,pts,o={}){if(pts.length<2)return;ctx.save();ctx.strokeStyle=o.color||C.blue;ctx.lineWidth=o.w||2;
  ctx.lineJoin='round';ctx.lineCap='round';if(o.dash)ctx.setLineDash(o.dash);if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();ctx.restore();}
function arcArrow(ctx,cx,cy,r,a0,a1,o={}){const col=o.color||C.yel,w=o.w||2;
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.beginPath();ctx.arc(cx,cy,r,a0,a1,a1<a0);ctx.stroke();
  const ex=cx+r*Math.cos(a1),ey=cy+r*Math.sin(a1);const dir=(a1<a0?-1:1);
  const ta=a1+dir*Math.PI/2;ctx.fillStyle=col;const h=o.head||7;
  ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-h*Math.cos(ta-0.4),ey-h*Math.sin(ta-0.4));
  ctx.lineTo(ex-h*Math.cos(ta+0.4),ey-h*Math.sin(ta+0.4));ctx.closePath();ctx.fill();ctx.restore();}
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const stage=(p,a,b)=>clamp((p-a)/(b-a),0,1);

/* ---------- EM wave (pseudo-3D): E vertical, B skewed into page ---------- */
function drawEMwave(ctx,x0,x1,cy,amp,phase,o={}){
  const eCol=o.eColor||C.blue,bCol=o.bColor||C.red,cyc=o.cycles||2.2;
  const k=cyc*TAU/(x1-x0);
  const N=140; const skx=0.62, sky=0.30; // B depth direction on screen
  // propagation axis
  arrow(ctx,x0-10,cy,x1+14,cy,{color:C.axis,w:1.4,head:8});
  // E curve + stems
  const eP=[],bP=[];
  for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N;const ang=k*(x-x0)-phase;
    const E=amp*Math.sin(ang), B=amp*Math.sin(ang);
    eP.push([x,cy-E]); bP.push([x+B*skx, cy - B*sky]);}
  // B first (behind)
  if(o.showB!==false){
    for(let i=0;i<=N;i+=10){const x=x0+(x1-x0)*i/N;const B=amp*Math.sin(k*(x-x0)-phase);
      line(ctx,x,cy,x+B*skx,cy-B*sky,{color:bCol,w:1,alpha:.45});}
    pathXY(ctx,bP,{color:bCol,w:2,alpha:.9});
  }
  // E in front
  if(o.showE!==false){
    for(let i=0;i<=N;i+=10){const x=x0+(x1-x0)*i/N;const E=amp*Math.sin(k*(x-x0)-phase);
      line(ctx,x,cy,x,cy-E,{color:eCol,w:1,alpha:.5});}
    pathXY(ctx,eP,{color:eCol,w:2.6});
  }
  if(o.labels!==false){
    text(ctx,'E',x0-4,cy-amp-8,{color:eCol,size:15,fam:'serif'});
    text(ctx,'B',x0+amp*skx+6,cy-amp*sky-6,{color:bCol,size:15,fam:'serif'});
    arrow(ctx,x1-30,cy+amp+30,x1+6,cy+amp+30,{color:C.yel,w:2,head:7});
    text(ctx,'c',x1-46,cy+amp+35,{color:C.yel,size:14,fam:'serif'});
  }
}

    // wave whose wavelength shrinks left->right, marker sweeping
    const sweep=reduceMotion?0.5:(0.5+0.5*Math.sin(t*0.5));
    const cy=h*0.34, amp=Math.min(h*0.14,64);
    const pts=[];for(let i=0;i<=240;i++){const u=i/240;const x=x0+u*(x1-x0);
      const localf=2+u*24; const ph=reduceMotion?0:t*3;
      pts.push([x, cy - amp*Math.sin(u*localf*3 - ph)]);}
    pathXY(ctx,pts,{color:C.blue,w:2});
    const mx=x0+sweep*(x1-x0); line(ctx,mx,cy-amp-6,mx,y,{color:C.yel,w:1.2,dash:[4,4],alpha:.7});
    const bi=Math.min(bands.length-1,Math.floor(sweep*bands.length));
    text(ctx,bands[bi][0],mx,cy-amp-12,{color:C.yel,size:13,align:'center'});
  }
},

      text(ctx,titles[idx],x+12,y+22,{color:C.dim,size:13});
      const ix=x+16,iy=y+34,iw=cw-32,ih=chh-50,cx=ix+iw/2,cy=iy+ih/2;
      if(idx===0){for(let k=1;k<=4;k++){const r=(k/4)*Math.min(iw,ih)*0.45*((t*0.4+k*0.2)%1+0.1);

        line(ctx,cx,cy-ih*0.3,cx,cy+ih*0.3,{color:C.grn,w:2.5});dot(ctx,cx,cy,3,C.yel);}
      else if(idx===1){const rx=ix+iw*0.12,dx=ix+iw*0.88;
        line(ctx,rx,cy+ih*0.2,rx,cy-ih*0.2,{color:C.grn,w:2.5});
        ctx.save();ctx.strokeStyle=C.blue;ctx.lineWidth=2;ctx.beginPath();
        for(let i=0;i<=60;i++){const u=i/60;const xx=rx+u*(dx-rx);const yy=cy - Math.sin(u*20-t*4)*ih*0.16*Math.min(1,u*3);
          i===0?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy);}ctx.stroke();ctx.restore();
        ctx.save();ctx.strokeStyle=C.dim;ctx.lineWidth=2;ctx.strokeRect(dx-6,cy-ih*0.18,12,ih*0.36);ctx.restore();}
      else if(idx===2){line(ctx,ix,cy,ix+iw,cy,{color:C.line,w:1,dash:[4,4]});
        arrow(ctx,ix+iw*0.1,cy-ih*0.32,cx,cy,{color:C.blue,w:2,head:6});
        arrow(ctx,cx,cy,ix+iw*0.8,cy+ih*0.34,{color:C.blue,w:2,head:6});
        ctx.save();ctx.fillStyle=C.cyan;ctx.globalAlpha=.12;ctx.fillRect(ix,cy,iw,ih*0.5);ctx.restore();
        text(ctx,'bends into glass',ix+2,iy+ih-2,{color:C.faint,size:11});}
      else {ctx.save();ctx.fillStyle=C.blue;ctx.globalAlpha=.2;ctx.fillRect(cx-iw*0.18,cy-ih*0.05,iw*0.36,ih*0.4);ctx.restore();
        for(let k=0;k<4;k++){const yy=iy+(k*0.14+((t*0.5)%1)*0.14)*ih;
          arrow(ctx,cx-iw*0.28,yy-8,cx-iw*0.1,yy+6,{color:C.yel,w:1.4,head:5,alpha:.8});}
        text(ctx,'photon → current',ix,iy+ih-2,{color:C.faint,size:11});}
    });

},

{

/* flatten */
const ALL=[]; const chapStart=[];
CHAPTERS.forEach((ch,ci)=>{chapStart.push(ALL.length);
  ch.slides.forEach((s,si)=>{s._ci=ci;s._si=si;s._chap=ch.title;s._cn=ch.slides.length;ALL.push(s);});});

/* ===== engine ===== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), stageWrap=document.getElementById('stageWrap');
let W=0,H=0,dpr=1;
function resize(){const r=stageWrap.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);
  W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
new ResizeObserver(resize).observe(stageWrap);window.addEventListener('resize',resize);

const el=id=>document.getElementById(id);
let k=0,start=performance.now();
function loadSlide(i){
  k=(i+ALL.length)%ALL.length; const s=ALL[k];
  el('badge').textContent=s.badge||CHAPTERS[s._ci].badge||'';
  el('title').innerHTML=s.title+(s.subtitle?` <span class="sub">${s.subtitle}</span>`:'');
  el('theory').innerHTML=s.theory||'';
  el('apply').innerHTML=(s.apply||[]).map(a=>`<li>${a}</li>`).join('');
  el('rail').innerHTML=(s.rail||[]).map(r=>{const kind=r[0];
    const kl={recap:'SO FAR',gap:'BUT…',fill:'FILLS THE GAP'}[kind]||kind.toUpperCase();
    return `<div class="railrow ${kind}"><span class="rk ${kind}">${kl}</span><span class="rt">${r[1]}</span></div>`;}).join('');
  el('chapname').textContent=(s._ci+1)+'. '+s._chap;
  el('counter').textContent='slide '+(s._si+1)+'/'+s._cn+'  ·  '+(k+1)+'/'+ALL.length;
  start=performance.now(); closeMenu();
}
function frame(now){const s=ALL[k];const dur=s.duration||2600;const elapsed=now-start;
  const prog=reduceMotion?1:Math.max(0,Math.min(1,elapsed/dur));const t=elapsed/1000;
  ctx.clearRect(0,0,W,H);
  try{s.draw({ctx,w:W,h:H,prog,t});}catch(e){}
  requestAnimationFrame(frame);}

/* menu */
function buildMenu(){const g=el('grid');g.innerHTML=CHAPTERS.map((ch,ci)=>
  `<div class="card" data-i="${chapStart[ci]}"><div class="cn">${ci+1}</div><div class="ct">${ch.title}</div><div class="cc">${ch.slides.length} slides</div></div>`).join('');
  g.querySelectorAll('.card').forEach(c=>c.onclick=()=>loadSlide(+c.dataset.i));}
function openMenu(){el('menu').classList.add('open');}
function closeMenu(){el('menu').classList.remove('open');}

el('next').onclick=()=>loadSlide(k+1);
el('prev').onclick=()=>loadSlide(k-1);
el('replay').onclick=()=>{start=performance.now();};
el('menuBtn').onclick=openMenu; el('menuClose').onclick=closeMenu;
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();loadSlide(k+1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();loadSlide(k-1);}
  else if(e.key.toLowerCase()==='r'){start=performance.now();}
  else if(e.key.toLowerCase()==='m'){el('menu').classList.contains('open')?closeMenu():openMenu();}
  else if(e.key==='Escape'){closeMenu();}
});
resize(); buildMenu(); loadSlide(0); openMenu(); requestAnimationFrame(frame);
el('deck').focus();
</script>
