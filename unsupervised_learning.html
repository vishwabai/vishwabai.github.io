const THEORY = [
/*0 Title*/ {kicker:"FIELD OVERVIEW", title:"Unsupervised Learning", def:"A branch of machine learning where the algorithm is given data with no labels or target answers, and must discover structure — groups, axes, rules, or densities — entirely on its own.", points:["No 'right answer' is given during training — success is measured by how useful or coherent the discovered structure is.","Six major families: clustering, dimensionality reduction, association rules, anomaly detection, density estimation, topic modeling.","Often used as an exploratory first step before supervised learning, or as the whole solution when labels don't exist."], use:"Exploratory data analysis, customer segmentation, compressing data, flagging fraud, recommender systems — any setting where labeling data is too expensive or simply impossible.", warn:"Harder to evaluate objectively than supervised learning — there's no ground truth to check against, so results need domain judgement."},
/*1 Core idea*/ {kicker:"SUPERVISED VS UNSUPERVISED", title:"No Teacher, Just Data", def:"Supervised learning fits a model to match a known answer key. Unsupervised learning has no answer key — it just looks for whatever pattern is already sitting in the data.", points:["Supervised: minimizes error against known labels (e.g. 'cat' vs 'dog').","Unsupervised: minimizes some internal criterion — compactness, density, reconstruction error — with no labels at all.","The same raw data can often be explored both ways, depending on whether labels happen to exist."], use:"Situations where labeling every example is impractical: millions of transactions, raw sensor logs, unstructured text.", warn:"Because there's no 'correct' grouping to check against, two reasonable analyses can find genuinely different valid structure in the same data."},
/*2 Clustering big idea*/ {kicker:"CLUSTERING FUNDAMENTALS", title:"Group by Closeness", def:"Clustering assumes that points which are 'close' to each other (by some distance measure) probably belong together, and points that are far apart probably don't.", points:["Requires choosing a distance/similarity metric before anything else — that choice quietly decides what 'similar' even means.","Different clustering families make different geometric assumptions: round blobs (K-Means), chains of density (DBSCAN), nested structure (Hierarchical).","There is no universally 'best' clustering algorithm — the right choice depends on the expected shape of the clusters."], use:"Customer segmentation, image color quantization, grouping similar documents, biological taxonomy from gene expression.", warn:"An unscaled feature (income in dollars next to age in years) can dominate the distance calculation and silently ruin the clustering."},
/*3 Math distance*/ {kicker:"GEOMETRY OF SIMILARITY", title:"Distance Metrics", def:"A distance metric turns 'how similar are two points' into a single number, so an algorithm can compare and rank similarity mathematically.", points:["Euclidean distance is the default — it matches physical, geometric intuition.","Manhattan distance is more robust when features sit on a grid-like or count-based scale.","Cosine distance cares only about direction, not magnitude — crucial in sparse, high-dimensional settings like text."], use:"Euclidean for continuous physical measurements; Manhattan for high-dimensional counts/grids; Cosine for text embeddings and any 'shape not size' comparison.", warn:"Different metrics can produce genuinely different clusters from the same data — always ask which notion of 'closeness' actually matches your problem."},
/*4 K-Means*/ {kicker:"PARTITIONING", title:"K-Means", def:"K-Means splits data into K groups by repeatedly assigning each point to its nearest centroid, then moving each centroid to the average of its group.", points:["You must choose K (the number of clusters) in advance.","Really just two alternating steps — assign, then update — known as Lloyd's algorithm.","Each iteration can only decrease (or hold) the total within-cluster distance, so it always converges — just not always to the best possible solution."], use:"Fast, simple segmentation of large, roughly round/blob-shaped clusters — customer segments, image compression, vector quantization.", warn:"Sensitive to the random starting centroids and to outliers; struggles badly with non-spherical clusters."},
/*5 Math K-Means obj*/ {kicker:"OPTIMIZATION", title:"The K-Means Objective", def:"K-Means is secretly an optimization problem: find the K centroids minimizing the total squared distance from every point to its assigned centroid.", points:["This total is called the 'inertia' or within-cluster sum of squares (WCSS).","Assigning to the nearest centroid, and moving centroids to the mean, are each individually optimal — but together only guarantee a local optimum.","Running K-Means multiple times (or using k-means++ initialization) reduces the risk of a bad local minimum."], use:"Use inertia as the y-axis of an elbow plot to help pick K.", warn:"Inertia always decreases as K increases, even meaninglessly — it can't be used alone to choose K without looking for a 'bend'."},
/*6 MB & Medoids*/ {kicker:"K-MEANS VARIANTS", title:"Faster and Tougher K-Means", def:"Two practical tweaks on K-Means: one trades a little accuracy for a lot of speed, the other trades a little speed for a lot of robustness.", points:["Mini-Batch K-Means updates centroids using small random samples instead of the full dataset each round.","K-Medoids forces the cluster center to be an actual data point (a medoid), not an average.","Because K-Medoids uses real points, it can work with any distance metric — not just Euclidean."], use:"Mini-Batch K-Means for huge or streaming datasets; K-Medoids for smaller datasets with outliers or non-Euclidean distances.", warn:"Mini-Batch trades cluster quality for speed; K-Medoids is much slower per-iteration since testing candidate medoids is expensive."},
/*7 Agglomerative*/ {kicker:"HIERARCHICAL · BOTTOM-UP", title:"Agglomerative Clustering", def:"Starts with every point as its own cluster, then repeatedly merges the two closest clusters until one giant cluster remains — recording the merge order as a tree.", points:["The dendrogram lets you inspect clustering at every granularity at once.","No need to choose K upfront — cut the dendrogram at the height giving the number of clusters you want.","The definition of 'closest cluster' (linkage) changes the shape of clusters you get."], use:"Small-to-medium datasets where you want nested structure — biological taxonomies, organizational hierarchies, document topic trees.", warn:"Naively O(n²) or worse in time/memory; once a merge happens, it can never be undone."},
/*8 Divisive*/ {kicker:"HIERARCHICAL · TOP-DOWN", title:"Divisive Clustering", def:"The mirror image of agglomerative clustering: start with everything in one cluster, then repeatedly split the least-cohesive cluster into two.", points:["At each step it must consider many possible ways to split a cluster — far more expensive than merging the closest pair.","In principle can produce more balanced, globally-informed splits than agglomerative's greedy merging.","Rarely implemented in mainstream libraries because of its cost."], use:"Mostly a teaching concept and specialized research use; agglomerative is used almost everywhere in practice instead.", warn:"Cost grows very fast with dataset size — checking every possible split is intractable, so practical versions use heuristics."},
/*9 DBSCAN*/ {kicker:"DENSITY-BASED", title:"DBSCAN", def:"Defines clusters as dense regions of points separated by sparser regions — instead of by distance to a center.", points:["Two parameters: ε (how close counts as 'nearby') and minPts (how many nearby points make an area 'dense').","Points are core (dense neighborhood), border (near a core point but not dense itself), or noise (neither).","Because clusters grow by chaining nearby dense points, DBSCAN naturally finds arbitrarily shaped clusters."], use:"Spatial data and any dataset where clusters are irregular shapes (like the classic 'two moons' problem).", warn:"Struggles when clusters have very different densities — one ε can't be right for both a tight and a loose cluster at once."},
/*10 HDBSCAN/OPTICS*/ {kicker:"DBSCAN FAMILY", title:"Handling Varying Density", def:"Both methods generalize DBSCAN to avoid picking one fixed ε that has to work everywhere in the dataset.", points:["HDBSCAN runs DBSCAN conceptually across every possible ε and keeps only clusters that stay stable across a range of scales.","OPTICS orders points by 'reachability distance', producing a plot where valleys reveal clusters at whatever density they occur.","Both trade a bit more computation for a lot more flexibility versus vanilla DBSCAN."], use:"Real-world spatial or sensor data where cluster density genuinely varies across the dataset.", warn:"More hyperparameters and harder to explain than plain DBSCAN, though usually more robust in practice."},
/*11 Mean Shift*/ {kicker:"MODE-SEEKING", title:"Mean Shift", def:"Treats the data as samples from an unknown density, and finds clusters by having every point climb uphill toward the nearest peak (mode) of that density.", points:["No need to specify the number of clusters — it falls out naturally as however many density peaks exist.","The 'bandwidth' parameter controls how wide the density-estimation kernel is.","Every point that climbs to the same peak is assigned to the same cluster."], use:"Image segmentation and computer vision tasks where cluster count truly isn't known in advance.", warn:"Expensive on large datasets — every point iteratively searches for its peak; very sensitive to the bandwidth choice."},
/*12 GMM*/ {kicker:"PROBABILISTIC", title:"Gaussian Mixture Model", def:"Assumes the data was generated by a mix of several overlapping Gaussian (bell-curve) distributions, and tries to recover each one's parameters.", points:["Produces 'soft' cluster assignments — a probability of belonging to each cluster, not just one hard label.","Fit using Expectation-Maximization (EM): alternately estimate soft assignments (E-step), then update each Gaussian's parameters (M-step).","K-Means is a special case of GMM where every cluster is forced to be a perfectly round, equally-sized blob."], use:"When clusters are elliptical rather than round, or when you need a confidence for each assignment, not just a hard label.", warn:"More parameters to fit than K-Means, so it needs more data and can overfit; still sensitive to initialization and choice of K."},
/*13 Math Gaussian*/ {kicker:"PROBABILITY DENSITY", title:"The Gaussian, Unpacked", def:"The Gaussian formula converts a raw distance from the mean into a probability density — the taller the curve at a point, the more 'expected' that point is.", points:["μ shifts the curve left/right; σ stretches or squeezes its width.","The squared exponent term makes the curve fall off fast and symmetrically away from the mean.","The 1/(σ√2π) constant exists purely so the total area under the curve equals exactly 1."], use:"Same shape underlies GMM, Elliptic Envelope, Kalman filters, and the 'normal approximation' used across statistics.", warn:"Assumes the underlying data really is bell-shaped; skewed or multi-modal data will be modeled poorly by a single Gaussian."},
/*14 Spectral*/ {kicker:"GRAPH-BASED", title:"Spectral Clustering", def:"Converts clustering into a graph-cutting problem: build a similarity graph between points, then find the cut that separates it into the least-connected pieces.", points:["Uses the eigenvectors of the graph Laplacian to re-embed data into a space where clusters become simple to separate.","After that embedding, a plain algorithm like K-Means runs on the transformed coordinates.","Can find clusters of essentially any shape, because it never assumes blobs — only graph connectivity."], use:"Non-convex cluster shapes (rings, moons, spirals) that defeat K-Means and GMM outright.", warn:"Requires an eigendecomposition of an n×n matrix — expensive and memory-heavy for large datasets."},
/*15 BIRCH etc*/ {kicker:"SCALABLE & ALTERNATIVE METHODS", title:"BIRCH, Affinity Propagation, Fuzzy C-Means", def:"Three more clustering approaches, each solving a different practical pain point: scale, choosing K, and hard-vs-soft assignment.", points:["BIRCH incrementally summarizes huge datasets into a compact tree of 'clustering features' before doing any real clustering.","Affinity Propagation lets data points 'vote' for the best representative among themselves, discovering K automatically.","Fuzzy C-Means is K-Means with soft, percentage-based memberships instead of hard assignments."], use:"BIRCH for streaming/memory-constrained huge datasets; Affinity Propagation when K is unknown; Fuzzy C-Means when partial membership is meaningful.", warn:"Affinity Propagation is O(n²) memory and slow to converge; BIRCH is order-sensitive; Fuzzy C-Means still needs K chosen in advance."},
/*16 Recap map*/ {kicker:"SYNTHESIS", title:"Choosing a Clustering Family", def:"Every clustering algorithm is really a bet on the shape of your clusters and how much you know in advance — this map groups them by that bet.", points:["Partitioning methods assume round, evenly-sized blobs and need K chosen upfront.","Density methods assume clusters are separated by sparse regions and can be any shape.","Hierarchical and graph-based methods trade speed for flexibility and interpretability."], use:"A first filter: think about your data's likely shape and whether K is known before picking an algorithm to try.", warn:"In practice, try 2–3 candidates and compare with a metric like silhouette score — theory narrows the field, it rarely picks a single winner."},
/*17 Choosing K*/ {kicker:"MODEL SELECTION", title:"How Many Clusters?", def:"Since most clustering methods can't tell you the 'right' K on their own, we use secondary diagnostics computed after clustering at several K values.", points:["The elbow method looks at where adding more clusters stops meaningfully reducing error.","The silhouette score directly measures how well-separated and cohesive the clusters are, per point.","Neither is perfect alone — many practitioners look at both, plus domain knowledge."], use:"Any time a clustering algorithm (K-Means, GMM) requires you to specify K in advance.", warn:"Elbow plots can have an ambiguous or missing 'bend'; silhouette score is expensive (O(n²)) on very large datasets."},
/*18 Math silhouette*/ {kicker:"CLUSTER QUALITY METRIC", title:"Reading the Silhouette Score", def:"For every point, this score compares 'how close is it to its own cluster' against 'how close is it to the nearest other cluster' — squeezed into one number from −1 to 1.", points:["a(i): the point's average distance to its own cluster — smaller is tighter, more cohesive.","b(i): its average distance to the nearest neighboring cluster — bigger means better separated.","Averaging s(i) over every point gives one overall quality number for a whole clustering."], use:"Comparing different values of K, or entirely different clustering algorithms, on the same dataset.", warn:"A high silhouette score doesn't guarantee the clusters are meaningful to a human — it only measures geometric compactness and separation."},
/*19 Curse*/ {kicker:"WHY DIMENSIONS HURT", title:"The Curse of Dimensionality", def:"As you add more features (dimensions), the volume of the space grows exponentially — the same number of data points become exponentially sparser.", points:["In high dimensions, the distance between the closest and farthest neighbor of a point shrinks toward zero, relatively.","Distance-based methods (K-Means, KNN, DBSCAN) all quietly rely on distances being meaningful, so they degrade in high dimensions.","This is the core motivation for the entire field of dimensionality reduction."], use:"A reason to reduce dimensionality before applying distance-based clustering or anomaly detection to high-dimensional data.", warn:"There's no fixed 'too many dimensions' threshold — it depends on how much data you have and how correlated the features are."},
/*20 Dim reduction big idea*/ {kicker:"DIMENSIONALITY REDUCTION", title:"Fewer Numbers, Same Story", def:"Real-world data with many features often lies near a much simpler, lower-dimensional shape — dimensionality reduction finds and describes that shape directly.", points:["Two strategies: feature extraction (build new, fewer combined features) and feature selection (drop the least useful raw features).","Linear methods (PCA, SVD) assume the simpler shape is a flat plane; nonlinear methods (t-SNE, Isomap, LLE) allow a curved manifold.","Reduces storage, speeds up downstream algorithms, fights the curse of dimensionality, enables visualization."], use:"Compressing data, visualizing high-dimensional data in 2D/3D, removing redundant/correlated features before modeling.", warn:"Reduction always loses some information — the goal is to lose as little useful information as possible, not to lose none."},
/*21 PCA*/ {kicker:"LINEAR REDUCTION", title:"Principal Component Analysis", def:"Finds the directions along which the data varies most, and re-expresses the data using those directions as new axes — dropping the ones that barely vary.", points:["PC1 is the single direction of maximum variance in the whole dataset.","Each subsequent component is next-best, constrained perpendicular (uncorrelated) to all previous ones.","Purely linear — it can only 'see' straight-line relationships between features."], use:"Compressing correlated numeric features, noise reduction, visualization, and preprocessing before clustering or regression.", warn:"Sensitive to feature scale — always standardize first, or a large-magnitude feature dominates the variance calculation for no good reason."},
/*22 PCA variance*/ {kicker:"MODEL SELECTION FOR PCA", title:"How Many Components?", def:"Each principal component explains a certain percentage of the dataset's total variance — this lets you trade off compression against information loss.", points:["A scree plot shows the variance explained by each component, usually dropping off sharply after the first few.","The cumulative variance curve tells you exactly how much information you'd keep at each cutoff.","A common rule of thumb: keep enough components to reach 90–95% cumulative explained variance."], use:"Deciding exactly how aggressively to compress a dataset before feeding it into a downstream model.", warn:"Chasing 99%+ variance often keeps noisy, low-value components — the goal is a good trade-off, not maximum retained variance."},
/*23 Math eigenvectors*/ {kicker:"LINEAR ALGEBRA", title:"Why Eigenvectors?", def:"The eigenvectors of the covariance matrix are exactly the directions where the data's spread is 'pure' — moving along one never mixes into another direction.", points:["The covariance matrix captures how every pair of features moves together.","An eigenvector of that matrix is a direction the matrix only stretches, never rotates.","Its eigenvalue is exactly how much variance lies along that direction — exactly what PCA wants to rank by."], use:"This exact eigen-decomposition is what every PCA implementation computes under the hood (often via SVD for numerical stability).", warn:"Assumes the covariance matrix is well-defined — needs enough data relative to the number of features, or the estimate becomes unstable."},
/*24 PCA variants*/ {kicker:"PCA FAMILY", title:"Beyond Plain PCA", def:"Three adaptations of PCA for situations plain PCA can't handle well: nonlinearity, streaming data, and interpretability.", points:["Kernel PCA implicitly maps data into a higher-dimensional space where a straight PCA line becomes possible again.","Incremental PCA updates its components a batch at a time, without holding the full dataset in memory.","Sparse PCA forces most loadings to zero, so each component depends on only a few original features."], use:"Kernel PCA for curved/nonlinear data; Incremental PCA for streaming pipelines; Sparse PCA when components must be explainable via a handful of features.", warn:"Kernel PCA's kernel choice is another hyperparameter to tune; Sparse PCA's optimization is non-convex and sensitive to its sparsity penalty."},
/*25 tSNE/UMAP*/ {kicker:"MANIFOLD VISUALIZATION", title:"t-SNE & UMAP", def:"Both build a low-dimensional layout by trying to preserve which points were 'neighbors' in the original high-dimensional space, rather than exact distances.", points:["t-SNE converts high-D distances into neighbor probabilities, then finds a 2D layout matching those probabilities as closely as possible.","UMAP is conceptually similar but grounded in topology, runs faster, and tends to preserve more global structure.","Both are primarily visualization tools — output axes and inter-cluster distances usually aren't independently meaningful."], use:"Visually exploring high-dimensional data (word embeddings, single-cell genomics, image features) to spot clusters by eye.", warn:"Cluster sizes and gaps in a t-SNE/UMAP plot are often visually misleading — don't over-interpret them quantitatively."},
/*26 Isomap*/ {kicker:"MANIFOLD LEARNING", title:"Isomap", def:"An extension of MDS that measures distance along the curved data manifold, instead of cutting straight through empty space.", points:["Builds a neighborhood graph, then computes distance between any two points as the shortest path through that graph.","This 'geodesic' distance respects the true shape of a curved manifold, unlike straight-line distance.","Finally applies classical MDS to lay the data out in low dimensions using these geodesic distances."], use:"Data known to lie on a smooth, well-sampled curved manifold — classic 'swiss roll' style visualization problems.", warn:"A single mistaken 'shortcut' edge in the neighborhood graph can badly distort geodesic distances for many points at once."},
/*27 LLE*/ {kicker:"MANIFOLD LEARNING", title:"Locally Linear Embedding", def:"Assumes that, locally, every point can be approximated as a weighted combination of its nearest neighbors — and that relationship should survive dimensionality reduction.", points:["Step 1: find each point's k nearest neighbors and solve for weights that best reconstruct it from them.","Step 2: find low-dimensional coordinates that can be reconstructed by neighbors using those exact same weights.","Because it only uses local relationships, it can 'unfold' a curved manifold without any global distance calculation."], use:"Similar territory to Isomap — often preferred when only local structure matters, not global distances.", warn:"Very sensitive to the neighborhood size k, and to noise, since each point depends entirely on a small local neighborhood."},
/*28 MDS*/ {kicker:"MANIFOLD LEARNING", title:"Multidimensional Scaling", def:"Given only a table of pairwise distances (not even original coordinates), MDS finds a low-dimensional layout reproducing those distances as faithfully as possible.", points:["Classical MDS solves this directly via eigen-decomposition of the (double-centered) distance matrix.","Non-metric MDS only preserves the rank order of distances, not their exact values.","Because it works from a distance matrix, MDS is compatible with any distance metric — even ones with no obvious coordinate space."], use:"When you have similarity/dissimilarity judgments (survey data, DNA distance, perceptual similarity) but not raw feature vectors.", warn:"Computing the full pairwise distance matrix, and its eigen-decomposition, gets expensive fast as the number of points grows."},
/*29 SVD & FA*/ {kicker:"MATRIX DECOMPOSITION", title:"SVD & Factor Analysis", def:"Both decompose a data matrix into simpler pieces that reveal its underlying structure — SVD does it purely geometrically, Factor Analysis does it as a statistical model.", points:["SVD works on any matrix at all — a general-purpose tool underlying PCA, recommender systems, and image compression.","Truncated SVD keeps only the largest singular values, giving the best possible low-rank approximation of the matrix.","Factor Analysis explicitly separates 'shared' variance (factors) from feature-specific noise — an assumption SVD/PCA don't make."], use:"SVD/Truncated SVD for compression, recommenders, and text (LSA); Factor Analysis when modeling per-feature measurement noise matters.", warn:"Factor Analysis fits are less numerically stable and 'factors' require more statistical care to interpret than PCA components."},
/*30 Apriori*/ {kicker:"ASSOCIATION RULE MINING", title:"Apriori", def:"Finds sets of items that frequently appear together in transactions, by growing candidate itemsets one item at a time and pruning early with a simple but powerful rule.", points:["The Apriori property: if an itemset is frequent, every subset must also be frequent — this prunes huge portions of the search space instantly.","The algorithm alternates between generating slightly larger candidate itemsets and scanning the data to count them.","Produces rules like 'if a customer buys bread and butter, they're also likely to buy milk'."], use:"Market basket analysis, recommendations ('customers who bought X also bought Y'), co-occurrence pattern mining.", warn:"Repeatedly re-scanning the full dataset for every itemset size makes it slow on large or high-cardinality datasets."},
/*31 Math SVD geometry*/ {kicker:"GEOMETRIC INTUITION", title:"SVD as Geometry", def:"Any matrix transformation, no matter how complicated, can always be broken into exactly three simple geometric moves: rotate, stretch, rotate again.", points:["Vᵀ rotates the input space to align with the 'natural' axes of the transformation.","Σ stretches or shrinks along those aligned axes — by exactly the singular values.","U then rotates the stretched result into its final orientation in the output space."], use:"This decomposition underlies PCA, image compression, recommender systems, noise reduction, and robust least-squares solving.", warn:"Computing a full SVD is expensive for very large matrices; truncated/randomized SVD variants exist specifically to speed this up."},
/*32 FP-Growth*/ {kicker:"ASSOCIATION RULE MINING", title:"FP-Growth", def:"Mines the exact same frequent itemsets as Apriori, but compresses the whole dataset into a single tree first — so it never needs to re-scan the raw data.", points:["Items are frequency-sorted, then inserted into a shared prefix tree (FP-tree), merging identical prefixes to save space.","Frequent itemsets are extracted by recursively walking the tree from each item, using small 'conditional' sub-trees.","Typically an order of magnitude faster than Apriori, especially on dense datasets."], use:"Large-scale market basket or log-pattern mining where Apriori's repeated full-database scans become a bottleneck.", warn:"The FP-tree can still become large if the dataset has very little shared structure between transactions."},
/*33 ECLAT*/ {kicker:"ASSOCIATION RULE MINING", title:"ECLAT", def:"Flips the data layout: instead of 'basket → items', it stores 'item → list of baskets containing it' — turning itemset counting into fast set intersections.", points:["Support of an itemset is just the size of the intersection of its items' basket-ID lists.","Uses depth-first search, which tends to use less memory than Apriori's breadth-first candidate generation.","Works especially well when the vertical ID lists (or their differences, 'diffsets') fit comfortably in memory."], use:"Mid-sized transactional datasets where a fast, memory-resident, depth-first alternative to Apriori/FP-Growth is preferred.", warn:"Basket-ID lists can get very large for extremely common items, reducing the memory benefit."},
/*34 Math support/conf/lift*/ {kicker:"RULE QUALITY METRICS", title:"Support, Confidence, Lift", def:"Three numbers that together decide whether a discovered rule ('A implies B') is common, reliable, and actually meaningful rather than coincidental.", points:["Support: how often the itemset appears at all — filters out rare, statistically unreliable patterns.","Confidence: given A happened, how often B also happened — misleading alone if B is just popular on its own.","Lift corrects for that: lift > 1 means A and B genuinely co-occur more than random chance would predict."], use:"Filtering thousands of candidate rules down to the handful that are both common and genuinely meaningful.", warn:"High confidence with lift ≈ 1 usually just means B is popular overall — always check lift, not confidence alone."},
/*35 Isolation Forest*/ {kicker:"ANOMALY DETECTION", title:"Isolation Forest", def:"Instead of modeling what 'normal' looks like, it directly measures how easy each point is to isolate with random cuts — anomalies isolate almost immediately.", points:["Builds many random binary trees, each splitting the data on a random feature at a random threshold.","A point's anomaly score is based on the average number of splits (path length) needed to isolate it across all trees.","Because it never computes distances, it scales well to high-dimensional data where distance-based methods struggle."], use:"Fraud detection, sensor/log anomaly detection, and any high-dimensional setting needing a fast, scalable outlier detector.", warn:"Can struggle with 'local' anomalies that are only unusual relative to a nearby cluster, not the dataset as a whole."},
/*36 One-Class SVM*/ {kicker:"ANOMALY DETECTION", title:"One-Class SVM", def:"Learns a single tight boundary that wraps around the bulk of the 'normal' data — anything falling outside it is flagged as an anomaly.", points:["Uses the same kernel trick as standard SVMs, so the boundary can be a complex, curved shape.","The ν (nu) parameter trades off how tightly the boundary wraps the data against how many points it may treat as outliers.","Doesn't need any anomalous examples to train on — only 'normal' data."], use:"Novelty/outlier detection when only normal examples are available — common in manufacturing QC and intrusion detection.", warn:"Doesn't scale gracefully to very large datasets; the right kernel/parameters are tricky to tune without labeled anomalies to validate against."},
/*37 LOF*/ {kicker:"ANOMALY DETECTION", title:"Local Outlier Factor", def:"Flags a point as anomalous not by comparing it to the whole dataset, but by comparing its local density to the local density of its own neighbors.", points:["Computes each point's 'local reachability density' — roughly, how packed-in its neighborhood is.","The LOF score is the ratio of a point's density to the average density of its neighbors.","A ratio near 1 means the point fits its neighborhood; well above 1 means it's noticeably sparser than its surroundings."], use:"Datasets with clusters of varying density, where a globally-sparse threshold would miss local outliers.", warn:"Naively O(n²) to compute; results are also sensitive to the chosen neighborhood size."},
/*38 Elliptic Envelope*/ {kicker:"ANOMALY DETECTION", title:"Elliptic Envelope", def:"Assumes normal data roughly follows a single Gaussian blob, robustly fits an ellipse to it (ignoring likely outliers while fitting), then flags anything too far outside.", points:["Uses the Minimum Covariance Determinant (MCD) estimator, specifically designed not to be fooled by the outliers it's detecting.","'Too far outside' is measured in Mahalanobis distance, not plain Euclidean distance.","Simple, fast, and interpretable — but only as good as its single-Gaussian assumption."], use:"Low-dimensional, roughly unimodal, roughly Gaussian data — a fast baseline anomaly detector.", warn:"Breaks down on multi-modal data (several separate normal clusters) or heavily non-Gaussian distributions."},
/*39 Math Mahalanobis*/ {kicker:"STATISTICAL DISTANCE", title:"Mahalanobis Distance", def:"A version of distance that accounts for how the data is actually spread out — 'far' in a rarely-varying direction counts for more than 'far' in a commonly-varying one.", points:["Rescales every direction by the inverse covariance matrix, making the data's natural spread the new 'unit circle'.","Reduces to ordinary Euclidean distance if features are uncorrelated with equal variance.","Its squared value follows a known chi-squared distribution under a Gaussian assumption, giving a principled cutoff for 'too far'."], use:"Any outlier/novelty method assuming roughly Gaussian data (Elliptic Envelope, some GMM-based scoring) uses this instead of Euclidean distance.", warn:"Requires a well-estimated covariance matrix — unstable with too few data points relative to the number of features."},
/*40 KDE*/ {kicker:"DENSITY ESTIMATION", title:"Kernel Density Estimation", def:"Estimates the underlying probability density of data by placing a small 'bump' (kernel) on every data point and summing them into one smooth curve.", points:["The kernel shape (usually Gaussian) matters much less than the bandwidth — how wide each bump is.","Too small a bandwidth gives a spiky, overfit density; too large blurs everything together.","Unlike GMM, KDE makes no assumption about how many 'bumps' the true density has — it's fully nonparametric."], use:"Visualizing distribution shape, smooth histograms, and as a building block in anomaly detection (low density = unusual).", warn:"Suffers badly from the curse of dimensionality — it becomes unreliable well before 10–20 dimensions."},
/*41 LDA topics*/ {kicker:"TOPIC MODELING", title:"Latent Dirichlet Allocation", def:"A generative probabilistic model assuming every document is a mixture of topics, and every topic is a mixture of words — then it works backwards from the words to infer both mixtures.", points:["Uses Dirichlet priors, which naturally encourage each document/topic to be dominated by just a few topics/words.","Inference is done via iterative algorithms like variational inference or Gibbs sampling — there's no closed-form answer.","The number of topics, K, is a hyperparameter chosen before fitting, much like K in K-Means."], use:"Discovering themes in large text corpora — news archives, research papers, customer reviews — without manual labeling.", warn:"Treats documents as a 'bag of words' with no word order, and needs reasonably large, well-preprocessed corpora."},
/*42 LSA*/ {kicker:"TOPIC MODELING", title:"Latent Semantic Analysis", def:"Applies plain SVD directly to a term-document matrix of word counts, treating 'topics' simply as the top directions of variance in word usage.", points:["Purely linear-algebraic — no probability model, no iterative fitting, just one SVD computation.","Because SVD allows negative values, resulting 'topics' can be harder to read as intuitive word lists than LDA's or NMF's.","Very fast and deterministic — the same input always gives exactly the same output."], use:"Quick synonym-aware document similarity and search when speed matters more than interpretability.", warn:"Largely superseded by NMF, LDA, or modern embeddings for tasks where topics themselves need to be human-readable."},
/*43 NMF*/ {kicker:"TOPIC MODELING", title:"Non-negative Matrix Factorization", def:"Factorizes the term-document matrix the same way LSA does, but adds one crucial constraint: every number in the factors must be zero or positive.", points:["This non-negativity forces a 'parts-based' representation — topics can only add words together, never cancel them out.","Solved with iterative multiplicative update rules rather than a single clean SVD step.","Resulting topics tend to read as clean, intuitive word lists, which is why NMF is popular for human-facing summaries."], use:"Topic modeling and feature extraction where interpretability matters — also used for parts-based image features.", warn:"Non-convex optimization — different initializations can converge to different solutions; K is still a hyperparameter."},
/*44 Closing*/ {kicker:"SYNTHESIS", title:"Putting It All Together", def:"Every technique in this deck answers one of six questions about unlabeled data: how is it grouped, how can it be compressed, what patterns co-occur, what's unusual, how is it distributed, or what themes does it contain.", points:["Start from the question you're actually asking, not the algorithm you already know — that narrows the field immediately.","Most families have a 'default first try' (K-Means, PCA, Apriori, Isolation Forest, KDE, LDA/NMF) and several specialized variants.","Because there's no ground truth in unsupervised learning, always validate against domain knowledge, visualization, and multiple metrics."], use:"As a mental map for picking the right first algorithm to try on a brand-new, unlabeled dataset.", warn:"No single algorithm here is strictly 'best' — the right one always depends on your data's shape, size, and your actual question."},
];

const MATH = [
/*0*/ {eq:"min  Loss( structure , data )", why:"There is no single equation for 'unsupervised learning' — instead, every family below picks its own definition of hidden structure and its own loss to minimize.", how:"Read this as a template: clustering plugs in cluster assignments and distance; dimensionality reduction plugs in a low-D representation and reconstruction error; and so on.", use:"This is why comparing 'which unsupervised algorithm is best' is meaningless without first fixing the objective you actually care about."},
/*1*/ {eq:"supervised: min Σ L(f(xᵢ), yᵢ)     unsupervised: min Σ L(xᵢ, structure)", why:"Writing both objectives side by side makes the real difference obvious: the right-hand term yᵢ (the label) simply doesn't exist in the unsupervised version.", how:"If you have trustworthy yᵢ values, you're in the left world; if you only have xᵢ, you're in the right world — that alone decides which family of techniques applies.", use:"A quick first check on any new dataset: do I actually have reliable labels, or am I about to convince myself some proxy label is good enough?"},
/*2*/ {eq:"argmin (assignment)  Σᵢ Σ_{j∈cluster(i)} dist(xᵢ, xⱼ)", why:"This is the shared skeleton underneath every clustering method — keep points assigned to the same group close to each other, on average.", how:"Every specific algorithm (K-Means, DBSCAN, hierarchical...) is this same idea with a different, cheaper-to-compute stand-in for 'distance to everyone else in my group'.", use:"K-Means replaces the inner sum with distance-to-one-centroid; that swap is exactly what makes K-Means fast enough to run on millions of points."},
/*3*/ {eq:"d_E = √Σ(xᵢ−yᵢ)²      d_M = Σ|xᵢ−yᵢ|      d_C = 1 − (x·y)/(‖x‖‖y‖)", why:"These three formulas formalize 'closeness' — a prerequisite for literally every distance-based method in this deck (K-Means, DBSCAN, hierarchical, LOF...).", how:"Euclidean measures a straight ruler distance; Manhattan sums per-axis steps like city-block travel; Cosine measures the angle between two vectors, ignoring their length entirely.", use:"Search engines, recommender systems, and clustering pipelines each pick whichever metric matches their features' natural geometry (e.g. cosine for word/document vectors)."},
/*4*/ {eq:"J = Σₖ Σ_{x∈Cₖ} ‖x − μₖ‖²", why:"K-Means needs one single number to know whether one arrangement of centroids is better than another — this is that number.", how:"Outer sum over every cluster, inner sum over every point inside that cluster, plus the squared distance of that point from its own centroid.", use:"This is scikit-learn's `.inertia_` — used directly to build an elbow plot for choosing K."},
/*5*/ {eq:"J = Σₖ Σ_{x∈Cₖ} ‖x − μₖ‖²   (same objective, examined via Lloyd's algorithm)", why:"Lloyd's algorithm — assign, then update — is provably a fast way to locally minimize this exact function; that's why K-Means works with such a simple two-step loop.", how:"Notice J only decreases (or stays flat) every single iteration, never increases — that's exactly why the algorithm is mathematically guaranteed to converge.", use:"The J value plotted across K is the standard elbow chart; the drop in J from one iteration to the next is what a convergence check monitors."},
/*6*/ {eq:"Mini-Batch:  μₖ ← μₖ + η·(x − μₖ),  η = 1/(points assigned so far)     K-Medoids:  minimize Σᵢ dist(xᵢ, m_{k(i)})", why:"Mini-batch replaces the exact mean update with a cheap running-average nudge; K-Medoids replaces 'mean' with 'the real point minimizing total distance to the group' so outliers can't drag it.", how:"η shrinks over time so each new mini-batch has less influence on the centroid — exactly like a learning-rate decay in gradient descent.", use:"Mini-Batch K-Means is what scikit-learn's `MiniBatchKMeans` and most large-scale clustering pipelines use in production."},
/*7*/ {eq:"single: min d(a,b)   complete: max d(a,b)   average: mean d(a,b)   Ward: min increase in within-cluster variance", why:"The choice of linkage is the objective function of hierarchical clustering — it defines exactly what 'closest cluster' means at every merge step.", how:"Single linkage can chain together long, thin clusters; complete linkage forces tight, compact clusters; Ward tends to produce the most balanced, K-Means-like clusters.", use:"Ward linkage is the most common general-purpose default; single linkage is useful for detecting elongated, chain-like structures."},
/*8*/ {eq:"argmax over all splits (A,B) of a cluster:  separation(A,B) − cohesion loss", why:"Divisive clustering must search over an exponential number of possible splits at every step — this is exactly why it's rarely implemented exactly as written.", how:"In practice, a cheap proxy is used instead (e.g. run 2-means on the cluster) rather than literally checking every possible way to split it.", use:"Mostly theoretical, and in some specialized recursive-bisection text-clustering tools."},
/*9*/ {eq:"N_ε(x) = { y : dist(x,y) ≤ ε }        x is core if |N_ε(x)| ≥ minPts", why:"This pair of definitions is the entire algorithm — cluster growth and noise labeling both follow mechanically from just these two rules.", how:"A cluster is the union of every point reachable through a chain of overlapping ε-neighborhoods, anchored by at least one core point.", use:"These same ε / minPts definitions reappear, generalized across every scale at once, inside HDBSCAN."},
/*10*/ {eq:"reachability-dist(x) = max( core-dist(x), dist(x, nearest processed point) )", why:"This single quantity lets OPTICS order all points into a plot where valleys correspond to clusters at whatever density they naturally occur, without fixing one global ε.", how:"HDBSCAN builds a hierarchy of these reachability relationships across every scale, then automatically keeps whichever clusters stay stable the longest.", use:"OPTICS reachability plots are a diagnostic analysts read before even choosing a clustering algorithm, to estimate how many density levels exist."},
/*11*/ {eq:"m(x) = ( Σᵢ K(xᵢ−x)·xᵢ ) / ( Σᵢ K(xᵢ−x) )      then shift:  x ← m(x)", why:"m(x) is the weighted average of nearby points — literally the local center of mass of the density — so repeatedly moving toward it walks uphill toward a density peak.", how:"K is a kernel (usually Gaussian) weighting nearby points more heavily than far ones; iterating this formula is exactly the hill-climbing seen in the animation.", use:"The same mean-shift vector powers object tracking in computer vision (e.g. the classic CamShift algorithm)."},
/*12*/ {eq:"γᵢₖ = πₖ N(xᵢ|μₖ,Σₖ) / Σⱼ πⱼ N(xᵢ|μⱼ,Σⱼ)", why:"γᵢₖ is literally 'what fraction of point i's probability mass came from cluster k' — that fraction becomes its soft membership weight during the E-step.", how:"Numerator: how well cluster k alone explains this point. Denominator: how well every cluster together explains it. The ratio is a proper probability that sums to 1 across k.", use:"These responsibilities are exactly what `.predict_proba()` returns on a fitted Gaussian Mixture Model."},
/*13*/ {eq:"f(x) = 1/(σ√2π) · exp( −(x−μ)² / 2σ² )", why:"Derived from requiring a symmetric, bell-shaped curve with area exactly 1 that matches an observed mean and variance — and the Central Limit Theorem is why so much real-world data ends up looking exactly like this.", how:"Read it as: take the distance from the mean (x−μ), square and scale it by the spread, flip it negative, then exponentiate so it decays instead of grows as you move away from μ.", use:"The same formula underlies GMM, Elliptic Envelope, Kalman filters, control charts, and the 68-95-99.7 rule used across statistics."},
/*14*/ {eq:"L = D − W       solve  Lv = λv,  keep the eigenvectors of the smallest λ's", why:"The smallest eigenvectors of the Laplacian correspond to the 'smoothest' ways to split the graph — mathematically, the cuts separating the fewest, weakest connections.", how:"Each point gets new coordinates from its position in this eigenvector space; clusters tangled in the original space often become simple, separable blobs here.", use:"The same graph-Laplacian eigen-trick underlies image segmentation and community detection in social networks."},
/*15*/ {eq:"CF = (N, LS, SS)   —   count, linear sum, squared sum", why:"BIRCH never stores raw points, only these three numbers per sub-cluster — enough to exactly compute mean, variance, and merge two sub-clusters, without ever revisiting the original data.", how:"N is how many points; LS is their coordinate sum (gives the mean); SS is the sum of squares (gives the variance) — classic 'sufficient statistics'.", use:"This CF-tree trick is why BIRCH can cluster datasets far too large to fit in memory, in a single pass."},
/*16*/ {eq:"objective(family) = argmin / argmax over a structure-specific criterion", why:"Every algorithm on this map is ultimately a different choice of what to optimize and what shape of structure to allow — grouping by objective is more useful than grouping by name.", how:"Compare the underlying objective across families to see which assumptions two algorithms actually share, even if their names sound unrelated.", use:"A fast way to guess which algorithm's assumptions match a new dataset, before writing any code."},
/*17*/ {eq:"silhouette(K) = (1/n) Σᵢ s(i)        elbow: K* ≈ argmax_K curvature(WCSS(K))", why:"Neither curve alone is guaranteed to have one obvious best K — these are heuristics for extracting a recommendation out of an otherwise noisy, monotonic curve.", how:"Look for where WCSS's rate of decrease sharply slows (the 'elbow'), and cross-check against where the average silhouette score peaks.", use:"scikit-learn's `silhouette_score()` and plotting `.inertia_` across K is the standard practical implementation of exactly this."},
/*18*/ {eq:"s(i) = ( b(i) − a(i) ) / max( a(i), b(i) )", why:"Subtracting cohesion from separation and normalizing by the larger of the two squeezes an unbounded distance comparison into a clean, comparable −1 to 1 range.", how:"a(i) small and b(i) large → s(i) near +1 (great fit). a(i) ≈ b(i) → s(i) near 0 (borderline). a(i) > b(i) → s(i) negative (probably the wrong cluster).", use:"Averaging s(i) across a whole dataset gives the single number typically reported as 'the silhouette score' for a clustering."},
/*19*/ {eq:"lim_{d→∞}  (dist_max − dist_min) / dist_min → 0", why:"This is a proven mathematical fact about how volume behaves as dimension grows — not just approximate intuition.", how:"As more independent random coordinates are added, the variance in total squared distance shrinks relative to its mean, so all pairwise distances start to look almost equal.", use:"This exact result is the formal justification cited whenever someone says 'reduce dimensionality before using KNN/K-Means on this dataset.'"},
/*20*/ {eq:"X ≈ f(Z),   Z ∈ ℝᵏ,   k ≪ d", why:"This is the shared assumption behind every dimensionality reduction method in this deck: the true 'story' of the data (Z) needs far fewer numbers than the raw features (X) suggest.", how:"f can be linear (PCA/SVD — a matrix multiply) or nonlinear (t-SNE/UMAP/Isomap — a more complex, often only implicit, mapping).", use:"Compression, visualization, feature engineering, and speeding up any algorithm that scales badly with the number of features."},
/*21*/ {eq:"maximize  Var(w·X)   subject to  ‖w‖ = 1", why:"Maximizing variance turns out to be mathematically identical to minimizing the total squared reconstruction error if you later project back to the original space.", how:"Read it as: try every possible unit-length direction w, and keep the one where the data, viewed along it, is most spread out.", use:"This exact optimization, solved via eigen-decomposition of the covariance matrix, is what every PCA library call computes."},
/*22*/ {eq:"explained_ratioₖ = λₖ / Σⱼλⱼ        cumulativeₖ = Σ_{i≤k} λᵢ / Σⱼλⱼ", why:"Since total variance is fixed once the data is fixed, this ratio is simply 'what fraction of the whole pie does this component represent' — a natural, unit-free number.", how:"Sort eigenvalues largest to smallest first; components already come out ordered by how much variance they capture, so cumulating them is a running total.", use:"scikit-learn exposes this directly as `.explained_variance_ratio_`, usually plotted as a scree plot."},
/*23*/ {eq:"Cov(X) v = λ v", why:"Directions that the covariance matrix only stretches (never rotates) are exactly the directions along which the data's spread is 'pure' and independent of any other direction — precisely what PCA needs to rank.", how:"Cov(X) describes how features move together; v is a candidate direction; λ measures how much variance ends up along that direction once you find it.", use:"Solved via eigen-decomposition (or, more numerically stably, via SVD) in every real PCA implementation."},
/*24*/ {eq:"Kernel PCA:  K(xᵢ,xⱼ) = φ(xᵢ)·φ(xⱼ)   (φ never computed explicitly)      Sparse PCA:  PCA objective + λ‖w‖₁", why:"The kernel trick lets Kernel PCA behave as if it computed PCA in a huge, even infinite-dimensional, feature space using only pairwise kernel evaluations; Sparse PCA's extra penalty term pushes most loadings to exactly zero.", how:"In Kernel PCA, K(xᵢ,xⱼ) silently replaces every dot product in the PCA math. In Sparse PCA, increasing λ trades some captured variance for a simpler, more interpretable component.", use:"The kernel trick — same idea, same formula shape — also underlies SVMs and Gaussian Processes."},
/*25*/ {eq:"minimize  KL(P‖Q) = Σ pᵢⱼ log(pᵢⱼ / qᵢⱼ)", why:"Turns 'preserve neighbors' into a concrete optimization: define a probability pᵢⱼ of being neighbors in high-D, a probability qᵢⱼ in low-D, then minimize how different those two distributions are.", how:"qᵢⱼ uses a heavy-tailed Student-t distribution instead of Gaussian, specifically to leave enough room in 2D for moderately distant points — this is what prevents everything crushing into one blob.", use:"This KL-divergence-minimization pattern recurs across ML wherever one distribution needs to mimic another (variational autoencoders, knowledge distillation)."},
/*26*/ {eq:"d_geo(xᵢ,xⱼ) = shortest path in the k-NN graph, edge weights = local Euclidean distance", why:"Ordinary MDS just needs a distance matrix as input — Isomap's only real contribution is computing a better distance matrix (geodesic, not straight-line) before handing it to classical MDS.", how:"This is exactly Dijkstra's shortest-path algorithm run on a k-nearest-neighbor graph, with edge weights equal to raw Euclidean distance between connected points.", use:"Graph shortest-path distance as a stand-in for 'true' distance also appears throughout network science and routing."},
/*27*/ {eq:"step 1: min Σᵢ‖xᵢ − Σⱼwᵢⱼxⱼ‖²   (Σⱼwᵢⱼ=1)     step 2: min Σᵢ‖yᵢ − Σⱼwᵢⱼyⱼ‖²  over y", why:"Step 1 finds the best local linear description of each point using its neighbors; step 2 finds low-D coordinates that make that exact same description still true — this is the leap that 'unfolds' the manifold.", how:"Step 1 is solved with simple linear least-squares per point; step 2 is solved via an eigen-decomposition, similar in spirit to spectral clustering's Laplacian eigenproblem.", use:"This 'fit locally, then embed globally' two-stage pattern also appears in modern graph and network embedding methods."},
/*28*/ {eq:"minimize  stress = Σ_{i<j} ( dᵢⱼ − ‖yᵢ − yⱼ‖ )²", why:"'Stress' is simply the total squared mismatch between the real, given distances and the distances in a proposed low-D layout — minimizing it directly optimizes for geometric faithfulness.", how:"Classical MDS solves this in closed form via eigen-decomposition; iterative versions nudge points a little at a time (like a spring relaxing) to gradually reduce stress.", use:"The same stress-minimization idea, generalized, is the mathematical basis of force-directed graph layout algorithms used to draw network diagrams."},
/*29*/ {eq:"X = UΣVᵀ  (SVD)          X = ΛF + ε,  ε ~ N(0,ψ)  (Factor Analysis)", why:"SVD is an exact algebraic identity true for any matrix; Factor Analysis is instead a probabilistic model of how the data was generated, including per-feature noise ψ, so it must be fit rather than simply computed.", how:"In Factor Analysis, loadings Λ map a few shared factors F onto every observed feature, while ψᵢ absorbs whatever variance is unique to feature i alone.", use:"SVD's exactness makes it the numerically preferred way to actually compute PCA in most libraries, even though PCA is usually explained via the covariance matrix."},
/*30*/ {eq:"if X ⊆ Y and Y is frequent, then X is frequent   (used in reverse to prune)", why:"This one monotonicity property lets Apriori skip checking the vast majority of possible itemsets — without it you'd have to test every one of the 2ⁿ possible subsets of items.", how:"Candidates are only built by extending itemsets that survived the previous round's frequency check; infrequent itemsets are pruned immediately and never extended further.", use:"This exact anti-monotonicity pruning idea is reused, in different disguises, inside both FP-Growth and ECLAT."},
/*31*/ {eq:"X = UΣVᵀ", why:"Every matrix, however complex, factors uniquely into an orthogonal rotation, a diagonal stretch, and another orthogonal rotation — geometry, not algebra, is the real content here.", how:"Trace it right to left: Vᵀ rotates first, Σ stretches next, U rotates last — exactly the three-step animation.", use:"This decomposition underlies PCA, image compression, recommender systems, noise reduction, and robust least-squares solving."},
/*32*/ {eq:"no closed-form equation — build the FP-tree once (O(n)), then recurse over conditional pattern bases", why:"There's no single formula here because FP-Growth's advantage is entirely about data structure and search strategy, not a different mathematical objective than Apriori's.", how:"For each item, collect every tree path reaching it (its conditional pattern base), then treat that as a smaller mining sub-problem, recursively.", use:"This recursive divide-and-conquer pattern — mine a compressed structure, then recurse into smaller sub-problems — is a common speed-up strategy across data mining generally."},
/*33*/ {eq:"support(X) = |TID(X)| / N       TID(X∪{i}) = TID(X) ∩ TID({i})", why:"Since support is purely about how many baskets contain an itemset, and basket-ID sets combine by intersection when adding an item, counting becomes pure set arithmetic — no re-reading of transactions needed.", how:"TID(X) is the list of basket IDs containing itemset X; intersecting two TID lists directly gives you the TID list (and hence the support) of their combined itemset.", use:"Vertical/TID-list representations like this also power extremely fast filtering inside bitmap-indexed databases."},
/*34*/ {eq:"support(A)=count(A)/N     confidence(A→B)=support(A∪B)/support(A)     lift(A→B)=confidence(A→B)/support(B)", why:"Confidence alone is misleading whenever B is simply popular on its own; dividing by support(B) — giving lift — corrects for that baseline popularity.", how:"Support filters for 'common enough to matter'; confidence measures 'reliable enough to act on'; lift measures 'actually related, not just coincidentally frequent'.", use:"Recommendation engines typically rank candidate rules by lift (or a similar corrected metric), not raw confidence, to avoid always recommending best-sellers."},
/*35*/ {eq:"s(x,n) = 2^(−E(h(x))/c(n)),     c(n) = 2H(n−1) − 2(n−1)/n", why:"E(h(x)) is the average path length needed to isolate x across all trees; c(n) is the expected path length for a normal point, used purely to normalize the score into a clean 0–1 range.", how:"Short average path length → score near 1 (anomaly). Path length near c(n) → score near 0.5 (normal). Much longer than average → score near 0 (deeply embedded, extremely normal).", use:"scikit-learn's `IsolationForest.decision_function()` returns a value derived directly from this exact formula."},
/*36*/ {eq:"minimize (1/2)‖w‖² + (1/νn)Σξᵢ − ρ,   subject to  w·φ(xᵢ) ≥ ρ − ξᵢ", why:"This asks for the hyperplane, in kernel feature space, as far from the origin as possible (maximizing ρ) while still keeping most points on the correct side — ν directly controls the allowed violation fraction.", how:"ξᵢ are 'slack' variables letting a small, ν-controlled fraction of points sit on the wrong side without breaking the optimization; φ(x) is the (often implicit) kernel feature mapping.", use:"Exactly the same margin-maximization machinery as a standard two-class SVM, just applied against the origin instead of against a second class."},
/*37*/ {eq:"LOF_k(x) = ( Σ_{y∈N_k(x)} lrd(y)/lrd(x) ) / |N_k(x)|", why:"Dividing x's own local density by the average local density of its neighbors directly answers 'is this point in a normal or unusually sparse spot relative to its neighborhood' — sensitive to local, not just global, outliers.", how:"lrd (local reachability density) is roughly the inverse of the average distance to a point's neighbors — dense neighborhoods have high lrd, sparse ones have low lrd.", use:"scikit-learn's `LocalOutlierFactor.negative_outlier_factor_` is a direct (negated) implementation of this exact ratio."},
/*38*/ {eq:"D²(x) = (x−μ̂)ᵀ Σ̂⁻¹ (x−μ̂),   flag if D² > χ²_{d,1−α}", why:"Since D² follows a known chi-squared distribution when the data really is Gaussian, this gives a statistically principled cutoff — not an arbitrary threshold — for how far is 'too far'.", how:"μ̂ and Σ̂ come from the robust MCD estimator (not the ordinary sample mean/covariance), so the outliers being detected can't influence the very boundary meant to catch them.", use:"This same chi-squared cutoff logic underlies statistical process-control charts used in manufacturing quality assurance."},
/*39*/ {eq:"D(x) = √( (x−μ)ᵀ Σ⁻¹ (x−μ) )", why:"Ordinary distance treats every direction as equally likely; multiplying by the inverse covariance rescales each direction by how much the data actually varies along it, before measuring distance.", how:"If Σ is the identity matrix (uncorrelated, equal-variance features), this collapses to plain Euclidean distance — Mahalanobis is a strict generalization, not a different idea.", use:"Any anomaly-detection method assuming roughly Gaussian data leans on this exact distance instead of Euclidean distance."},
/*40*/ {eq:"f̂(x) = (1/nh) Σᵢ K( (x−xᵢ)/h )", why:"Each term is a tiny, normalized 'bump' of probability centered on one data point; summing and averaging all n of them builds a density estimate without ever assuming a fixed number of clusters or a fixed shape.", how:"h (bandwidth) rescales how wide each bump is before summing — it's the single most important tuning parameter, far more than which kernel K you choose.", use:"The same weighted-local-average pattern reappears, generalized, in kernel regression and in Mean Shift's climbing formula earlier in this deck."},
/*41*/ {eq:"θ_d~Dir(α),  φ_k~Dir(β),  z_{d,n}~Cat(θ_d),  w_{d,n}~Cat(φ_{z})", why:"Writing down this exact generative story is what lets us mathematically work backwards — via Bayesian inference — from the observed words to the most probable hidden topic mixtures.", how:"Read top to bottom: pick a topic mixture θ_d for a document, then for every word slot pick a topic z from that mixture, then pick an actual word from that topic's word distribution φ.", use:"This 'Dirichlet prior over a categorical distribution' pattern is a standard building block across Bayesian machine learning generally, not unique to text."},
/*42*/ {eq:"X ≈ U_kΣ_kV_kᵀ   (the same SVD, applied to a term-document matrix)", why:"There's no new math here — LSA's entire contribution is choosing what matrix to run SVD on (word counts, often TF-IDF weighted) and how to interpret the resulting U/V.", how:"Rows of U_k give each word a topic-vector; rows of V_k give each document a topic-vector; similar vectors mean semantically similar words or documents.", use:"Cosine similarity between rows of V_k is the classic way LSA measures document similarity — reusing the exact metric from the distance-metrics slide."},
/*43*/ {eq:"minimize ‖X − WH‖²_F     subject to  W ≥ 0, H ≥ 0", why:"Adding the non-negativity constraint forces the factorization to build documents/topics purely by adding non-negative parts together, never cancelling — this is exactly what makes NMF's topics read as clean, additive word lists.", how:"Solved iteratively via multiplicative update rules that are mathematically guaranteed to never push a value below zero, unlike a naive gradient step.", use:"The same non-negative, parts-based factorization is used for extracting interpretable facial features from images in classic computer vision research."},
/*44*/ {eq:"argmin Σ loss( data , simplified structure )   — one shape, many families", why:"Seeing every technique in this deck as 'minimize a mismatch between raw data and some proposed simpler structure' is the single unifying idea that makes 45 seemingly different algorithms feel like variations on one theme.", how:"For any new algorithm you meet, ask: what's its structure (clusters? axes? rules? a boundary? a density? topics?) and what's its mismatch (distance? variance? support? path length? density ratio? KL-divergence?).", use:"This is exactly the kind of first-principles thinking Feynman championed — reduce something complex to the simplest form that still explains it."},
];

/* =========================================================================
   PLAYER
   ========================================================================= */
const stage = document.getElementById('stage');
const mainG = E('g', {}, stage);
const stageWrapEl = document.getElementById('stageWrap');
const theoryPanel = document.getElementById('theoryPanel');
const theoryToggle = document.getElementById('theoryToggle');
const theoryInnerEl = document.getElementById('theoryInner');
let idx = 0;
let panelOpen = true;

function fitStage(){
  const w = Math.max(stageWrapEl.clientWidth - 20, 40);
  const h = Math.max(stageWrapEl.clientHeight - 20, 40);
  let sw, sh;
  if(w/h > 16/9){ sh = h; sw = h*16/9; } else { sw = w; sh = w*9/16; }
  stage.style.width = sw+'px';
  stage.style.height = sh+'px';
}
window.addEventListener('resize', fitStage);
if(window.ResizeObserver) new ResizeObserver(fitStage).observe(stageWrapEl);

function setPanel(open){
  panelOpen = open;
  theoryPanel.classList.toggle('collapsed', !open);
  theoryToggle.classList.toggle('open', open);
  let n=0; const id=setInterval(()=>{ fitStage(); n++; if(n>16) clearInterval(id); }, 20);
}
theoryToggle.addEventListener('click', ()=> setPanel(!panelOpen));

function setTab(tab){
  const isTheory = tab==='theory';
  document.getElementById('tabTheoryBtn').classList.toggle('active', isTheory);
  document.getElementById('tabMathBtn').classList.toggle('active', !isTheory);
  document.getElementById('paneTheory').style.display = isTheory? '' : 'none';
  document.getElementById('paneMath').style.display = isTheory? 'none' : '';
  theoryInnerEl.scrollTop = 0;
}
document.getElementById('tabTheoryBtn').addEventListener('click', ()=> setTab('theory'));
document.getElementById('tabMathBtn').addEventListener('click', ()=> setTab('math'));

function renderPanel(i){
  const th = THEORY[i] || THEORY[THEORY.length-1];
  const mt = MATH[i] || MATH[MATH.length-1];
  document.getElementById('thKicker').textContent = th.kicker;
  document.getElementById('thTitle').textContent = th.title;
  document.getElementById('thDef').textContent = th.def;
  const ul = document.getElementById('thPoints'); ul.innerHTML='';
  th.points.forEach(p=>{ const li=document.createElement('li'); li.textContent=p; ul.appendChild(li); });
  document.getElementById('thUse').textContent = th.use;
  document.getElementById('thWarn').textContent = th.warn;

  document.getElementById('mEq').textContent = mt.eq;
  document.getElementById('mWhy').textContent = mt.why;
  document.getElementById('mHow').textContent = mt.how;
  document.getElementById('mUse').textContent = mt.use;
}

function updateChrome(){
  document.getElementById('counter').textContent = String(idx+1).padStart(2,'0') + ' / ' + SLIDES.length;
  document.getElementById('slideLabel').textContent = SLIDES[idx].label;
  document.getElementById('barFill').style.width = ((idx+1)/SLIDES.length*100) + '%';
  document.getElementById('prevBtn').style.opacity = idx===0 ? 0.35 : 1;
  document.getElementById('nextBtn').style.opacity = idx===SLIDES.length-1 ? 0.35 : 1;
  renderPanel(idx);
}

function goTo(i, replay){
  if(i<0 || i>=SLIDES.length) return;
  if(i===idx && !replay) return;
  idx=i;
  CURRENT_TOKEN++;
  clear(mainG);
  updateChrome();
  Promise.resolve().then(()=> SLIDES[idx].build(mainG)).catch(err=> console.error(err));
}

document.getElementById('nextBtn').addEventListener('click', ()=> goTo(idx+1));
document.getElementById('prevBtn').addEventListener('click', ()=> goTo(idx-1));
document.getElementById('replayBtn').addEventListener('click', ()=> goTo(idx, true));

window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); goTo(idx+1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); goTo(idx-1); }
  else if(e.key==='r' || e.key==='R'){ goTo(idx, true); }
  else if(e.key==='t' || e.key==='T'){ setPanel(!panelOpen); }
});

fitStage();
goTo(0, true);
</script>
