<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unsupervised Learning — a visual walkthrough</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0d; --panel:#12151a; --panel2:#161a20; --grid:#1c2026; --grid2:#22262d;
    --text:#eef1f3; --dim:#8b93a1; --dim2:#565f6c;
    --blue:#6fa8dc; --amber:#d9a066; --rose:#c97b91; --green:#7fb88f; --violet:#9a8fc4; --red:#c9706f; --gray:#556070;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}
  #main{flex:1;display:flex;flex-direction:row;min-height:0;min-width:0;}
  #stageWrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-width:0;min-height:0;}
  svg#stage{display:block;background:
    radial-gradient(ellipse at 20% 10%, rgba(111,168,220,0.05), transparent 55%),
    radial-gradient(ellipse at 85% 90%, rgba(154,142,196,0.05), transparent 55%),
    var(--bg);
    border-radius:6px;}
  #theoryPanel{width:368px;flex:0 0 368px;min-height:0;border-left:1px solid #1a1e24;background:#0d0f13;
    transition:flex-basis .32s cubic-bezier(.4,0,.2,1), width .32s cubic-bezier(.4,0,.2,1), opacity .25s ease;
    overflow:hidden;display:flex;flex-direction:column;}
  #theoryPanel.collapsed{width:0;flex-basis:0;border-left-color:transparent;opacity:0;}
  #tabRow{display:flex;flex:0 0 auto;gap:20px;padding:18px 26px 0;border-bottom:1px solid #1a1e24;}
  .tabBtn{background:transparent;border:none;color:var(--dim2);font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    letter-spacing:.6px;padding:6px 2px 12px;cursor:pointer;position:relative;transition:color .2s ease;}
  .tabBtn.active{color:var(--text);}
  .tabBtn.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--blue),var(--violet));border-radius:2px;}
  .tabBtn:not(.active):hover{color:var(--dim);}
  #theoryInner{width:368px;flex:1;min-height:0;overflow-y:auto;padding:22px 26px 24px;}
  #theoryInner::-webkit-scrollbar{width:6px;}
  #theoryInner::-webkit-scrollbar-thumb{background:#242a33;border-radius:3px;}
  .thKicker{font-size:11px;letter-spacing:2px;color:var(--dim2);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
  .thKicker .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex:0 0 auto;}
  #thTitle{font-family:'Fraunces',serif;font-weight:600;font-size:21px;color:var(--text);margin:0 0 14px;line-height:1.25;}
  #thDef{font-size:14.5px;line-height:1.6;color:#c4cad3;margin:0 0 20px;padding-bottom:20px;border-bottom:1px solid #1a1e24;}
  .thLabel{font-size:11px;letter-spacing:1.5px;color:var(--dim2);font-weight:600;margin:0 0 10px;}
  #thPoints{list-style:none;margin:0 0 22px;padding:0;display:flex;flex-direction:column;gap:10px;}
  #thPoints li{font-size:13.5px;line-height:1.55;color:var(--dim);padding-left:16px;position:relative;}
  #thPoints li::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:1px;background:var(--violet);transform:rotate(45deg);}
  .thBlock{border-radius:10px;padding:13px 15px;margin-bottom:12px;font-size:13px;line-height:1.55;}
  .thBlock.use{background:rgba(127,184,143,.08);border:1px solid rgba(127,184,143,.22);color:#a9c9b3;}
  .thBlock.warn{background:rgba(201,112,111,.08);border:1px solid rgba(201,112,111,.22);color:#d3a5a4;}
  .thBlock b{color:inherit;font-weight:600;display:block;font-size:10.5px;letter-spacing:1.3px;margin-bottom:5px;opacity:.85;text-transform:uppercase;}
  .mEqBox{background:#12151a;border:1px solid #1e232b;border-radius:10px;padding:20px 16px;margin-bottom:20px;
    font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:18px;color:var(--violet);text-align:center;line-height:1.55;}
  .mText{font-size:13.5px;line-height:1.62;color:var(--dim);margin:0 0 18px;}
  .mNote{font-size:12px;line-height:1.6;color:var(--dim2);font-style:italic;margin:0 0 18px;}
  #theoryToggle.open svg{transform:rotate(180deg);}
  #theoryToggle svg{transition:transform .25s ease;}
  .brand{position:fixed;top:18px;left:24px;display:flex;align-items:center;gap:9px;color:var(--dim2);font-size:11px;letter-spacing:2.5px;font-weight:600;z-index:5;user-select:none;}
  .brand .dotwrap{width:14px;height:14px;position:relative;}
  .brand .dotwrap .ring{position:absolute;inset:0;border-radius:50%;}
  .brand .dotwrap .p{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--blue);top:0;left:5px;animation:orbit 4s linear infinite;transform-origin:2px 7px;}
  @keyframes orbit{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  #chrome{flex:0 0 64px;display:flex;align-items:center;gap:18px;padding:0 26px;z-index:5;
    background:linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.15));border-top:1px solid #16191e;}
  .navbtn{width:34px;height:34px;border-radius:50%;border:1px solid #2a2f38;background:#14171c;color:var(--dim);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s ease;flex:0 0 auto;}
  .navbtn:hover{border-color:var(--blue);color:var(--text);background:#171c22;}
  .navbtn svg{width:14px;height:14px;}
  .navbtn.replay svg{width:13px;height:13px;}
  #barTrack{flex:1;height:2px;background:var(--grid);border-radius:2px;position:relative;overflow:hidden;}
  #barFill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--blue),var(--violet));width:0%;transition:width .35s ease;}
  #counter{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim2);letter-spacing:1px;min-width:64px;text-align:right;}
  #slideLabel{font-family:'Inter',sans-serif;font-size:12px;color:var(--dim);min-width:180px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hint{position:fixed;top:18px;right:24px;font-size:11px;color:var(--dim2);letter-spacing:1px;z-index:5;font-family:'JetBrains Mono',monospace;}
  ::selection{background:rgba(111,168,220,.25);}
</style>
</head>
<body>
<div id="app">
  <div class="brand"><span class="dotwrap"><span class="p"></span></span>UNSUPERVISED LEARNING</div>
  <div class="hint" id="hint">← →  navigate  ·  T  theory</div>
  <div id="main">
    <div id="stageWrap">
      <svg id="stage" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="theoryPanel">
      <div id="tabRow">
        <button class="tabBtn active" data-tab="theory" id="tabTheoryBtn">THEORY</button>
        <button class="tabBtn" data-tab="math" id="tabMathBtn">MATH</button>
      </div>
      <div id="theoryInner">
        <div id="paneTheory" class="pane">
          <div class="thKicker"><span class="dot"></span><span id="thKicker">CONCEPT</span></div>
          <h3 id="thTitle"></h3>
          <p id="thDef"></p>
          <div class="thLabel">KEY POINTS</div>
          <ul id="thPoints"></ul>
          <div class="thBlock use"><b>Best for</b><span id="thUse"></span></div>
          <div class="thBlock warn"><b>Watch out for</b><span id="thWarn"></span></div>
        </div>
        <div id="paneMath" class="pane" style="display:none">
          <div class="thKicker"><span class="dot" style="background:var(--amber)"></span><span>THE EQUATION</span></div>
          <div id="mEq" class="mEqBox"></div>
          <div class="thLabel">WHY THIS FORMULA EXISTS</div>
          <p id="mWhy" class="mText"></p>
          <div class="thLabel">HOW TO REASON ABOUT IT</div>
          <p id="mHow" class="mText"></p>
          <div class="thBlock use"><b>Real-world use</b><span id="mUse"></span></div>
        </div>
      </div>
    </div>
  </div>
  <div id="chrome">
    <button class="navbtn" id="prevBtn" title="Previous (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="navbtn replay" id="replayBtn" title="Replay animation (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 .49-9.5L1 10"/></svg></button>
    <div id="slideLabel"></div>
    <div id="barTrack"><div id="barFill"></div></div>
    <div id="counter"></div>
    <button class="navbtn" id="nextBtn" title="Next (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="navbtn open" id="theoryToggle" title="Toggle theory panel (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
</div>

<script>
/* =========================================================================
   ENGINE
   ========================================================================= */
const SVGNS = "http://www.w3.org/2000/svg";
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const C = {
  bg:'#0a0b0d', panel:'#12151a', grid:'#1c2026', grid2:'#242932',
  text:'#eef1f3', dim:'#8b93a1', dim2:'#5b6472',
  blue:'#6fa8dc', amber:'#d9a066', rose:'#c97b91', green:'#7fb88f', violet:'#9a8fc4', red:'#c9706f', gray:'#556070'
};
const PALETTE = [C.blue, C.amber, C.rose, C.green, C.violet, C.red];

function E(tag, attrs={}, parent){
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) if(attrs[k]!==undefined) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}
function clear(el){ while(el.firstChild) el.removeChild(el.firstChild); }

const Ease = {
  linear: t=>t,
  outCubic: t=>1-Math.pow(1-t,3),
  inCubic: t=>t*t*t,
  inOutCubic: t=> t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2,
  outQuad: t=>1-(1-t)*(1-t),
  outBack: t=>{const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
  outElastic: t=>{const c4=(2*Math.PI)/3.4; return t===0?0:t===1?1:Math.pow(2,-9*t)*Math.sin((t*10-0.75)*c4)+1;}
};

let CURRENT_TOKEN = 0;

function animate(opts){
  const {delay=0, easing=Ease.inOutCubic, onUpdate, onComplete} = opts;
  const duration = REDUCED ? 1 : (opts.duration || 700);
  const token = CURRENT_TOKEN;
  return new Promise(resolve=>{
    setTimeout(()=>{
      if(token!==CURRENT_TOKEN) return resolve();
      let start=null;
      function frame(ts){
        if(token!==CURRENT_TOKEN) return resolve();
        if(start===null) start=ts;
        const t=Math.min((ts-start)/duration,1);
        onUpdate(easing(t));
        if(t<1){ requestAnimationFrame(frame); } else { onComplete&&onComplete(); resolve(); }
      }
      requestAnimationFrame(frame);
    }, REDUCED?0:delay);
  });
}
function wait(ms){
  const token=CURRENT_TOKEN;
  return new Promise(resolve=> setTimeout(resolve, REDUCED?0:ms));
}
function active(){ return true; } // legacy no-op guard hook

function tweenAttr(el, to, opts={}){
  const from={};
  for(const k in to) from[k]=parseFloat(el.getAttribute(k))||0;
  return animate({...opts, onUpdate:(t)=>{ for(const k in to) el.setAttribute(k, (from[k]+(to[k]-from[k])*t).toFixed(3)); }});
}
function fadeIn(el, opts={}){ el.setAttribute('opacity',0); return tweenAttr(el,{opacity:1}, opts); }
function fadeOut(el, opts={}){ return tweenAttr(el,{opacity:0}, opts); }

function riseInY(el, attrY, opts={}){
  const target = parseFloat(el.getAttribute(attrY));
  const dy = opts.dy ?? 14;
  el.setAttribute(attrY, target+dy);
  el.setAttribute('opacity',0);
  return animate({...opts, onUpdate:(t)=>{
    el.setAttribute(attrY, target+dy*(1-t));
    el.setAttribute('opacity', (opts.maxOpacity??1)*t);
  }});
}

function drawOn(el, opts={}){
  let len=140;
  try{ len = el.getTotalLength(); }catch(e){}
  el.setAttribute('stroke-dasharray', len);
  el.setAttribute('stroke-dashoffset', len);
  el.setAttribute('opacity', opts.opacity ?? 1);
  return tweenAttr(el, {'stroke-dashoffset':0}, opts);
}

function moveXY(el, ax, ay, x1, y1, opts={}){
  const x0=parseFloat(el.getAttribute(ax)), y0=parseFloat(el.getAttribute(ay));
  return animate({...opts, onUpdate:(t)=>{
    el.setAttribute(ax, (x0+(x1-x0)*t).toFixed(2));
    el.setAttribute(ay, (y0+(y1-y0)*t).toFixed(2));
  }});
}

function pseudo(n){ const x=Math.sin(n*12.9898)*43758.5453123; return x-Math.floor(x); }

function T(parent, x, y, str, opts={}){
  const t = E('text', {x, y, fill: opts.fill||C.text, 'font-family': opts.font||"'Inter',sans-serif",
    'font-size': opts.size||18, 'font-weight': opts.weight||400, 'letter-spacing': opts.ls||'0px',
    'text-anchor': opts.anchor||'start', 'font-style': opts.italic?'italic':'normal'}, parent);
  t.textContent = str;
  return t;
}
function mathLine(parent, x, y, parts, opts={}){
  const g = E('text', {x,y, fill:opts.fill||C.violet, 'font-family':"'Fraunces',Georgia,serif", 'font-size':opts.size||23, 'font-style':'italic', 'text-anchor':opts.anchor||'start'}, parent);
  parts.forEach(p=>{
    const ts = E('tspan', {}, g);
    ts.textContent = p.s;
    if(p.t==='sub'){ ts.setAttribute('baseline-shift','-28%'); ts.setAttribute('font-size','68%'); ts.setAttribute('font-style','italic'); }
    else if(p.t==='sup'){ ts.setAttribute('baseline-shift','42%'); ts.setAttribute('font-size','62%'); ts.setAttribute('font-style','italic'); }
    else if(p.t==='rm'){ ts.setAttribute('font-style','normal'); }
    else if(p.t==='dim'){ ts.setAttribute('fill',C.dim); ts.setAttribute('font-style','normal'); ts.setAttribute('font-family',"'Inter',sans-serif"); }
    if(p.fill) ts.setAttribute('fill', p.fill);
  });
  return g;
}
function termRow(g, x, y, snippetParts, explanation, color, opts={}){
  const snip = mathLine(g, x, y, snippetParts, {size:opts.size||21, fill:color});
  snip.setAttribute('opacity',0);
  const txt = T(g, x+(opts.gap||190), y, explanation, {fill:C.dim, size:14});
  txt.setAttribute('opacity',0);
  return {snip, txt};
}
async function revealRows(rows, stagger=150){
  for(const r of rows){
    fadeIn(r.snip, {duration:300});
    await fadeIn(r.txt, {duration:300});
    await wait(stagger);
  }
}

async function header(g, kicker, title){
  const k = T(g, 90, 62, kicker.toUpperCase(), {fill:C.dim2, size:12.5, weight:600, ls:'2.6px'});
  const ti = T(g, 88, 108, title, {fill:C.text, size:38, weight:600, font:"'Fraunces',serif"});
  const rule = E('line', {x1:90,y1:130,x2:90,y2:130, stroke:C.blue, 'stroke-width':3, 'stroke-linecap':'round', opacity:.85}, g);
  fadeIn(k,{duration:380});
  await riseInY(ti,'y',{duration:520, dy:16, easing:Ease.outCubic});
  await tweenAttr(rule, {x2:154}, {duration:420, easing:Ease.outCubic});
}
function caption(g, x, y, str, opts={}){
  const t = T(g, x, y, str, {fill:C.dim, size:15.5, ...opts});
  return t;
}
function footnote(g, x, y, str, w){
  const t = E('text', {x,y, fill:C.dim2, 'font-family':"'Inter',sans-serif",'font-size':13.5}, g);
  t.textContent = str;
  return t;
}

/* shape helpers ---------------------------------------------------------- */
function dot(parent, x, y, r, color, opts={}){
  return E('circle', {cx:x, cy:y, r, fill:color, opacity:opts.opacity??0, stroke:opts.stroke||'none', 'stroke-width':opts.sw||0}, parent);
}
function ring(parent, x, y, r, color, opts={}){
  return E('circle', {cx:x, cy:y, r, fill:'none', stroke:color, 'stroke-width':opts.sw||1.4, opacity:opts.opacity??0, 'stroke-dasharray':opts.dash||''}, parent);
}
function diamondPath(x,y,size){ return `M ${x} ${y-size} L ${x+size} ${y} L ${x} ${y+size} L ${x-size} ${y} Z`; }
function diamond(parent, x, y, size, color){
  return E('path', {d:diamondPath(x,y,size), fill:color, stroke:'#050607', 'stroke-width':1.3, opacity:0}, parent);
}
function moveDiamond(el, x0,y0,x1,y1,size,opts){
  return animate({...opts, onUpdate:(t)=>{
    const x=x0+(x1-x0)*t, y=y0+(y1-y0)*t;
    el.setAttribute('d', diamondPath(x,y,size));
  }});
}
function xMark(parent, x, y, s, color, opts={}){
  const g = E('g', {opacity:opts.opacity??0}, parent);
  E('line', {x1:x-s,y1:y-s,x2:x+s,y2:y+s, stroke:color, 'stroke-width':1.6, 'stroke-linecap':'round'}, g);
  E('line', {x1:x-s,y1:y+s,x2:x+s,y2:y-s, stroke:color, 'stroke-width':1.6, 'stroke-linecap':'round'}, g);
  return g;
}
function panel(parent, x, y, w, h, opts={}){
  return E('rect', {x,y,width:w,height:h, rx:opts.rx??12, fill:opts.fill||C.panel, stroke:opts.stroke||C.grid, 'stroke-width':opts.sw||1, opacity:opts.opacity??0}, parent);
}
function legendDot(parent, x, y, color, label){
  const g = E('g', {opacity:0}, parent);
  E('circle', {cx:x, cy:y, r:5, fill:color}, g);
  T(g, x+13, y+4.5, label, {fill:C.dim, size:13.5});
  return g;
}
function scatterBlob(cx, cy, n, spread, seed=0){
  const pts=[];
  for(let i=0;i<n;i++){
    const a = pseudo(i*1.37+seed)*Math.PI*2;
    const r = spread*Math.sqrt(pseudo(i*7.13+seed+1));
    pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r*0.82]);
  }
  return pts;
}
function mean(pts){
  let sx=0,sy=0; pts.forEach(p=>{sx+=p[0];sy+=p[1];});
  return [sx/pts.length, sy/pts.length];
}
function dist(a,b){ return Math.hypot(a[0]-b[0], a[1]-b[1]); }

/* =========================================================================
   SLIDES
   ========================================================================= */
const SLIDES = [];

/* ---------- 1. TITLE ---------- */
SLIDES.push({ label:"Title", async build(g){
  const pts = scatterBlob(640, 470, 46, 210, 11);
  const dots = pts.map((p,i)=>dot(g,p[0],p[1], 3.4, C.gray, {opacity:0}));
  dots.forEach((d,i)=> fadeIn(d, {duration:500, delay:i*10}));
  await wait(300);

  const eyebrow = T(g, 640, 210, "SCIKIT-LEARN TAXONOMY · A FEYNMAN-STYLE WALKTHROUGH", {fill:C.dim2, size:13, weight:600, ls:'3px', anchor:'middle'});
  fadeIn(eyebrow, {duration:500});

  const title1 = T(g, 640, 300, "Unsupervised", {fill:C.text, size:70, weight:600, font:"'Fraunces',serif", anchor:'middle'});
  const title2 = T(g, 640, 372, "Learning", {fill:C.blue, size:70, weight:600, font:"'Fraunces',serif", anchor:'middle', italic:true});
  await riseInY(title1, 'y', {duration:650, dy:22, easing:Ease.outCubic});
  await riseInY(title2, 'y', {duration:650, dy:22, easing:Ease.outCubic, delay:60});

  const sub = T(g, 640, 415, "Finding structure in data — without ever being told the answer.", {fill:C.dim, size:17, anchor:'middle'});
  fadeIn(sub, {duration:600, delay:150});

  await wait(400);
  // organize the scatter into three colored clusters as a teaser
  const centers = [[430,560],[700,540],[880,610]];
  const assign = pts.map(p=>{
    let bi=0, bd=1e9;
    centers.forEach((c,i)=>{ const d=dist(p,c); if(d<bd){bd=d;bi=i;} });
    return bi;
  });
  const proms=[];
  dots.forEach((d,i)=>{
    const col = PALETTE[assign[i]];
    proms.push(animate({duration:700, delay:i*14, easing:Ease.outCubic, onUpdate:(t)=>{
      d.setAttribute('fill', t>0.5?col:C.gray);
      d.setAttribute('r', 3.4 + t*1.1);
    }}));
  });
  await Promise.all(proms);
  const tag = T(g, 640, 660, "clustering · dimensionality reduction · association rules · anomaly & density estimation · topic modeling", {fill:C.dim2, size:12.5, anchor:'middle', ls:'.3px'});
  fadeIn(tag, {duration:600});
}});

/* ---------- 2. WHAT IS UNSUPERVISED LEARNING ---------- */
SLIDES.push({ label:"The core idea", async build(g){
  await header(g, "The core idea", "No teacher. Just data.");
  await wait(100);

  const midX = 640;
  T(g, 300, 190, "SUPERVISED", {fill:C.dim2, size:13, weight:600, ls:'2px', anchor:'middle'});
  T(g, 980, 190, "UNSUPERVISED", {fill:C.dim2, size:13, weight:600, ls:'2px', anchor:'middle'});
  const vs = T(g, midX, 400, "vs", {fill:C.dim2, size:22, italic:true, anchor:'middle', font:"'Fraunces',serif"});

SLIDES.push({ label:"Hierarchical — Agglomerative", async build(g){
  await header(g, "Hierarchical · Bottom-up", "Agglomerative Clustering");
  await wait(80);

  const baseY = 600, top = 220, leftX = 140, rightX = 620;
  const n = 7;
  let xs = []; for(let i=0;i<n;i++) xs.push(leftX + i*(rightX-leftX)/(n-1));
  const leafDots = xs.map((x,i)=> dot(g, x, baseY, 5, C.blue, {opacity:0}));
  leafDots.forEach((d,i)=> fadeIn(d,{duration:350, delay:i*60}));
  await wait(400);

  // simple synthetic hierarchical merge order (index pairs with heights)
  const merges = [
    {a:0,b:1,h:40}, {a:5,b:6,h:55}, {a:2,b:3,h:70}, {a:'m0',b:2==2?null:null}
  ];
  // Build clusters programmatically: nodes with position + height, merge nearest pairs by x-distance for a natural look
  let nodes = xs.map((x,i)=> ({x, y:baseY, h:0, members:[i]}));
  const order = [];
  while(nodes.length>1){
    let bi=0,bj=1,bd=1e9;
    for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
      const d = Math.abs(nodes[i].x-nodes[j].x);
      if(d<bd){bd=d;bi=i;bj=j;}
    }
    order.push([bi,bj]);
    const A=nodes[bi], B=nodes[bj];
    const newH = Math.max(A.h,B.h) + 55 + pseudo(nodes.length*7)*12;
    const newNode = {x:(A.x+B.x)/2, y: baseY-newH, h:newH, members:A.members.concat(B.members), a:A, b:B};
    nodes = nodes.filter((_,idx)=> idx!==bi && idx!==bj);
    nodes.push(newNode);
  }
  const root = nodes[0];

  async function drawMerge(node){
    if(node.members.length===1) return {x:node.x, y:baseY};
    const pa = await drawMerge(node.a);
    const pb = await drawMerge(node.b);
    const y = Math.max(top, baseY - node.h);
    const lv = E('line', {x1:pa.x, y1:pa.y, x2:pa.x, y2:y, stroke:C.dim2, 'stroke-width':1.6}, g);
    const rv = E('line', {x1:pb.x, y1:pb.y, x2:pb.x, y2:y, stroke:C.dim2, 'stroke-width':1.6}, g);
    const hz = E('line', {x1:pa.x, y1:y, x2:pb.x, y2:y, stroke:C.dim2, 'stroke-width':1.6}, g);
    await Promise.all([drawOn(lv,{duration:400}), drawOn(rv,{duration:400})]);
    await drawOn(hz,{duration:300});
    return {x:(pa.x+pb.x)/2, y};
  }
  await drawMerge(root);

  caption(g, 90, 660, "Merge the two closest clusters. Repeat. Height = distance at merge.", {size:14.5});
  const linkages = ["single","complete","average","ward"];
  T(g, 760, 250, "linkage rules:", {fill:C.dim2, size:12.5});
  linkages.forEach((l,i)=> T(g, 760, 275+i*24, "· "+l, {fill:C.dim, size:13.5}));
}});

SLIDES.push({ label:"Principal Component Analysis", async build(g){
  await header(g, "Dim. reduction · Linear", "Principal Component Analysis");
  await wait(80);
  const cx=380, cy=380;
  // elongated correlated cloud along ~30deg
  const theta = -0.5;
  const raw = scatterBlob(0,0,34,1,17).map((p,i)=>{
    const sx = p[0]*2.6, sy = p[1]*0.9;
    const rx = sx*Math.cos(theta)-sy*Math.sin(theta), ry = sx*Math.sin(theta)+sy*Math.cos(theta);
    return [cx+rx, cy+ry];
  });
  const dots = raw.map(p=> dot(g,p[0],p[1],4.4,C.gray));
  dots.forEach((d,i)=> fadeIn(d,{duration:350, delay:i*10}));
  await wait(400);

  // spread meter
  const meterX=760, meterY0=560, meterH=200;
  E('line',{x1:meterX,y1:meterY0,x2:meterX,y2:meterY0-meterH,stroke:C.grid2,'stroke-width':1.2},g);
  T(g, meterX, meterY0+22, "spread along the line", {fill:C.dim2, size:12.5, anchor:'middle'});
  const meterBar = E('rect',{x:meterX-14,y:meterY0,width:28,height:0, fill:C.dim, opacity:.85},g);

  const line = E('line',{x1:cx,y1:cy,x2:cx,y2:cy,stroke:C.blue,'stroke-width':2, opacity:.9},g);
  const L=170;
  let bestAngle=0, bestVar=-1;
  const angles=[]; for(let a=0;a<180;a+=15) angles.push(a*Math.PI/180);
  for(const a of angles){
    const x1=cx+Math.cos(a)*L, y1=cy+Math.sin(a)*L, x2=cx-Math.cos(a)*L, y2=cy-Math.sin(a)*L;
    await tweenAttr(line, {x1,y1,x2,y2}, {duration:130});
    const ux=Math.cos(a), uy=Math.sin(a);
    const projs = raw.map(p=> (p[0]-cx)*ux + (p[1]-cy)*uy);
    const m = projs.reduce((s,v)=>s+v,0)/projs.length;
    const varr = projs.reduce((s,v)=>s+(v-m)*(v-m),0)/projs.length;
    if(varr>bestVar){ bestVar=varr; bestAngle=a; }
    await tweenAttr(meterBar, {height: Math.min(180, varr*0.05), y: meterY0-Math.min(180,varr*0.05)}, {duration:100});
  }
  const bx1=cx+Math.cos(bestAngle)*L, by1=cy+Math.sin(bestAngle)*L, bx2=cx-Math.cos(bestAngle)*L, by2=cy-Math.sin(bestAngle)*L;

  line.setAttribute('stroke-width',3);

  const perpAngle = bestAngle+Math.PI/2;

  await tweenAttr(line2,{opacity:.85},{duration:250});
  await tweenAttr(line2,{x1:cx+Math.cos(perpAngle)*70,y1:cy+Math.sin(perpAngle)*70,x2:cx-Math.cos(perpAngle)*70,y2:cy-Math.sin(perpAngle)*70},{duration:400});
  T(g, cx+Math.cos(perpAngle)*70+10, cy+Math.sin(perpAngle)*70, "PC2", {fill:C.rose, size:13});
  await wait(500);

  // project points onto PC1, collapse to 1D
  const ux=Math.cos(bestAngle), uy=Math.sin(bestAngle);
  const axisY = 660;
  await Promise.all(dots.map((d,i)=>{
    const p=raw[i];
    const t = (p[0]-cx)*ux + (p[1]-cy)*uy;
    const fx = cx+ux*t, fy = cy+uy*t;
    return animate({duration:700, delay:i*8, easing:Ease.inOutCubic, onUpdate:(tt)=>{
      d.setAttribute('cx', p[0]+(fx-p[0])*tt);
      d.setAttribute('cy', p[1]+(fy-p[1])*tt);
      d.setAttribute('fill', C.blue);

}});

SLIDES.push({ label:"FP-Growth", async build(g){

  await tweenAttr(root,{opacity:1},{duration:300,easing:Ease.outBack});
  T(g, rootX, rootY-16, "root", {fill:C.dim2, size:12, anchor:'middle'});

  const nodes = {
    bread: {x:rootX-120, y:390, col:C.amber, count:3, parent:'root'},
    milk: {x:rootX-120, y:470, col:C.blue, count:3, parent:'bread'},

SLIDES.push({ label:"Anomaly Detection — Isolation Forest", async build(g){

  }
  scenePanel(90, 190, "Anomaly — isolated in 2 cuts", C.red);
  scenePanel(90+boxW+40, 190, "Normal point — needs many cuts", C.green);

  // left scene: dense cluster + one outlier
  const l0x=90, l0y=190;
  const cluster = scatterBlob(l0x+180, l0y+250, 22, 90, 5);
  const outlier = [l0x+400, l0y+80];
  const cdots = cluster.map(p=> dot(g,p[0],p[1],3.8,C.dim,{opacity:0}));
  const odot = dot(g, outlier[0], outlier[1], 5, C.red, {opacity:0});

  await wait(400);
  const cutsL = [
    {x1:l0x+330,y1:l0y+66,x2:l0x+330,y2:l0y+380},
    {x1:l0x+330,y1:l0y+150,x2:l0x+452,y2:l0y+150},
  ];
  for(const c of cutsL){
    const ln = E('line',{...c, stroke:C.red,'stroke-width':1.6,'stroke-dasharray':'5,4', opacity:0},g);
    await tweenAttr(ln,{opacity:.85},{duration:250});
    await drawOn(ln,{duration:400});
  }
  T(g, outlier[0], outlier[1]-16, "isolated!", {fill:C.red, size:12.5, anchor:'middle'});

  // right scene: point inside dense cluster, many cuts needed
  const r0x=90+boxW+40, r0y=190;
  const cluster2 = scatterBlob(r0x+235, r0y+250, 26, 130, 61);
  const target = cluster2[10];
  const cdots2 = cluster2.map((p,i)=> dot(g,p[0],p[1], i===10?5:3.8, i===10?C.green:C.dim,{opacity:0}));
  await Promise.all(cdots2.map((d,i)=> tweenAttr(d,{opacity:.85},{duration:20,delay:i*10})));
  await wait(400);
  let box=[r0x+30,r0y+70,r0x+440,r0y+380];
  for(let i=0;i<5;i++){
    const vertical = i%2===0;
    let cutPos;
    if(vertical){ cutPos = (box[0]+box[2])/2 + (target[0]>(box[0]+box[2])/2? 40:-40); }
    else { cutPos = (box[1]+box[3])/2 + (target[1]>(box[1]+box[3])/2? 40:-40); }
    const ln = E('line',{
      x1: vertical?cutPos:box[0], y1: vertical?box[1]:cutPos,

    await tweenAttr(ln,{opacity:.7},{duration:180});
    await drawOn(ln,{duration:260});
    if(vertical){ if(target[0]>cutPos) box[0]=cutPos; else box[2]=cutPos; }
    else { if(target[1]>cutPos) box[1]=cutPos; else box[3]=cutPos; }
  }

  footnote(g, 90, 672, "Related methods: One-Class SVM (learns a boundary), Local Outlier Factor (compares local density), Elliptic Envelope (fits a robust Gaussian).");

/* ---------- 22. KDE ---------- */
SLIDES.push({ label:"Density Estimation — KDE", async build(g){
  await header(g, "Density estimation", "Kernel Density Estimation");
  await wait(80);
  const axY=560, axX0=120, axX1=1160;
  E('line',{x1:axX0,y1:axY,x2:axX1,y2:axY,stroke:C.grid2,'stroke-width':1.4},g);
  const xs=[0.08,0.14,0.22,0.34,0.36,0.4,0.55,0.6,0.63,0.8,0.86];
  const pts = xs.map(f=> axX0+f*(axX1-axX0));
  const ticks = pts.map(x=> dot(g,x,axY,4,C.dim,{opacity:0}));
  await Promise.all(ticks.map((d,i)=> tweenAttr(d,{opacity:1},{duration:250,delay:i*70})));
  caption(g, axX0, axY+36, "data points on a line", {size:13.5});
  await wait(400);

  const bw=46, kh=90;
  function bump(x0, w, h){
    const N=24; let d=`M ${x0-w} ${axY} `;
    for(let i=0;i<=N;i++){
      const t=i/N, xx=x0-w+t*2*w;
      const yy = axY - h*Math.exp(-Math.pow((xx-x0)/(w*0.42),2));
      d+=`L ${xx} ${yy} `;
    }
    d += `L ${x0+w} ${axY} Z`;
    return d;
  }
  const kernelPaths = pts.map(x=> E('path',{d:bump(x,bw,kh), fill:C.blue, 'fill-opacity':0.10, stroke:C.blue, 'stroke-width':1, opacity:0}, g));
  await Promise.all(kernelPaths.map((p,i)=> tweenAttr(p,{opacity:1},{duration:280, delay:i*90})));
  caption(g, axX0, axY+58, "...place a small bell curve (kernel) on each one", {size:13.5});
  await wait(600);

  // sum into smooth density curve
  const N=140;
  let d = '';
  for(let i=0;i<=N;i++){
    const xx = axX0 + i/N*(axX1-axX0);
    let yy=0;
    pts.forEach(px=>{ yy += kh*Math.exp(-Math.pow((xx-px)/(bw*0.42),2)); });
    yy = Math.min(yy, 260);
    d += (i===0?'M ':'L ') + xx + ' ' + (axY-yy) + ' ';
  }
  const sumCurve = E('path',{d, fill:'none', stroke:C.amber, 'stroke-width':2.6, opacity:0}, g);
  await tweenAttr(sumCurve,{opacity:1},{duration:200});
  await drawOn(sumCurve,{duration:900, easing:Ease.outCubic});
  await Promise.all(kernelPaths.map(p=> tweenAttr(p,{'fill-opacity':0.03,'opacity':.35},{duration:400})));

  T(g, axX1-40, 240, "density estimate", {fill:C.amber, size:13.5, anchor:'end'});
  mathLine(g, 90, 660, [{s:'f'},{t:'rm',s:'('},{s:'x'},{t:'rm',s:') = '},{t:'rm', s:'(1/nh) Σ K(('},{s:'x'},{t:'rm',s:' − '},{s:'x'},{t:'sub',s:'i'},{t:'rm',s:')/h)'}], {size:19});
  caption(g, 90, 682, "bandwidth h too small → spiky. too large → blurs every bump together.", {size:13});
}});
