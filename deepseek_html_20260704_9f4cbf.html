<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Learning Explorer — Interactive Neural Network Education</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async>
    </script>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #14141f;
            --surface2: #1a1a2e;
            --surface3: #1f1f35;
            --glass: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(30, 30, 55, 0.85);
            --text: #e0e0e8;
            --text2: #b0b0c0;
            --text3: #808095;
            --accent: #6c5ce7;
            --accent2: #a29bfe;
            --accent3: #4834d4;
            --green: #00d2a0;
            --red: #ff6b6b;
            --orange: #ffa94d;
            --blue: #4dabf7;
            --yellow: #ffd43b;
            --pink: #f06595;
            --cyan: #22b8cf;
            --grad1: linear-gradient(135deg, #6c5ce7, #a29bfe);
            --grad2: linear-gradient(135deg, #00d2a0, #22b8cf);
            --radius: 14px;
            --radius-sm: 8px;
            --radius-lg: 20px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --font: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            --mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            font-size: 15px;
            scroll-behavior: smooth;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        /* ─── SIDEBAR ──────────────────────────── */
        #sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            z-index: 100;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            padding: 16px 0;
            transition: var(--transition);
        }
        #sidebar .logo {
            padding: 10px 20px 20px;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: var(--grad1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #sidebar .logo span {
            font-size: 0.7rem;
            display: block;
            -webkit-text-fill-color: var(--text3);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        #sidebar nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 0 8px;
        }
        #sidebar nav .nav-group {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text3);
            padding: 16px 12px 6px;
            font-weight: 600;
        }
        #sidebar nav button {
            all: unset;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.88rem;
            color: var(--text2);
            transition: var(--transition);
            position: relative;
            font-weight: 500;
            letter-spacing: -0.01em;
        }
        #sidebar nav button:hover {
            background: var(--surface2);
            color: var(--text);
        }
        #sidebar nav button.active {
            background: var(--surface3);
            color: #fff;
            box-shadow: inset 3px 0 0 var(--accent);
            font-weight: 600;
        }
        #sidebar nav button .mod-num {
            font-size: 0.65rem;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--surface3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
        }
        #sidebar nav button.active .mod-num {
            background: var(--accent);
            color: #fff;
        }
        /* ─── MAIN ──────────────────────────── */
        #main {
            flex: 1;
            padding: 24px 28px;
            overflow-y: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        #main .module-header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        #main .module-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        #main .module-header .badge {
            background: var(--accent);
            color: #fff;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        #module-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
            animation: fadeIn 0.35s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* ─── CARDS ──────────────────────────── */
        .card {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card.glass {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .card h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -0.01em;
            color: var(--text);
        }
        .card h3 .icon {
            margin-right: 6px;
        }
        .row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .row>* {
            flex: 1;
            min-width: 240px;
        }
        /* ─── CONTROLS ──────────────────────────── */
        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            color: var(--text2);
            font-weight: 500;
            margin-bottom: 4px;
            letter-spacing: -0.01em;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--surface3);
            outline: none;
            margin: 4px 0 12px;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(108, 92, 231, 0.4);
            transition: var(--transition);
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 16px rgba(108, 92, 231, 0.6);
        }
        select {
            background: var(--surface3);
            color: var(--text);
            border: 1px solid var(--glass-border);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
        }
        select:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }
        button.btn {
            background: var(--grad1);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            letter-spacing: -0.01em;
            font-family: var(--font);
            white-space: nowrap;
        }
        button.btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4);
        }
        button.btn:active {
            transform: scale(0.97);
        }
        button.btn.outline {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent2);
        }
        button.btn.small {
            padding: 6px 12px;
            font-size: 0.75rem;
        }
        button.btn.green {
            background: var(--grad2);
        }
        button.btn.red {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
        }
        /* ─── VALUE DISPLAY ──────────────────── */
        .value-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            margin: 8px 0;
        }
        .value-item {
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            text-align: center;
            border: 1px solid var(--glass-border);
        }
        .value-item .val-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text3);
        }
        .value-item .val-num {
            font-size: 1.3rem;
            font-weight: 700;
            font-family: var(--mono);
            color: var(--accent2);
            letter-spacing: -0.02em;
        }
        /* ─── GRAPH CONTAINER ────────────────── */
        .graph-container {
            width: 100%;
            min-height: 300px;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--glass-border);
        }
        .graph-container canvas {
            width: 100%;
            height: 100%;
        }
        /* ─── NEURON VISUAL ──────────────────── */
        .neuron-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;
            font-family: var(--mono);
            font-size: 0.9rem;
        }
        .neuron-visual .node {
            background: var(--surface3);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.3);
            transition: var(--transition);
        }
        .neuron-visual .arrow {
            font-size: 1.4rem;
            color: var(--accent2);
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }
        .neuron-visual .formula-box {
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            font-size: 0.85rem;
            border: 1px dashed var(--accent);
        }
        /* ─── TOOLTIP ────────────────────────── */
        .tooltip-trigger {
            border-bottom: 1px dotted var(--accent2);
            cursor: help;
            color: var(--accent2);
        }
        /* ─── LAYER STACK ────────────────────── */
        .layer-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 10px;
        }
        .layer-stack .layer-box {
            background: var(--surface2);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            font-family: var(--mono);
            font-size: 0.8rem;
            text-align: center;
            min-width: 120px;
            transition: var(--transition);
        }
        .layer-stack .layer-box.highlight {
            border-color: var(--accent);
            box-shadow: 0 0 16px rgba(108, 92, 231, 0.4);
            background: var(--surface3);
        }
        .layer-stack .down-arrow {
            font-size: 1.2rem;
            color: var(--accent2);
        }
        /* ─── RESPONSIVE ─────────────────────── */
        @media (max-width: 768px) {
            #sidebar {
                width: 200px;
                min-width: 200px;
                font-size: 0.75rem;
            }
            #sidebar nav button {
                padding: 8px 10px;
                font-size: 0.75rem;
                gap: 6px;
            }
            #main {
                padding: 14px;
            }
            .row {
                flex-direction: column;
            }
        }
        @media (max-width: 500px) {
            body {
                flex-direction: column;
            }
            #sidebar {
                width: 100%;
                min-width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                overflow-x: auto;
                padding: 8px;
                gap: 4px;
                flex-wrap: wrap;
            }
            #sidebar .logo {
                display: none;
            }
            #sidebar nav {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 4px;
            }
            #sidebar nav .nav-group {
                display: none;
            }
            #sidebar nav button {
                font-size: 0.7rem;
                padding: 6px 8px;
                white-space: nowrap;
            }
            #main {
                height: auto;
                overflow-y: visible;
            }
        }
        /* ─── CANVAS NEURON GRID ─────────────── */
        canvas.neuron-canvas {
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--glass-border);
        }
        /* ─── DECISION BOUNDARY ──────────────── */
        #decision-canvas {
            border-radius: var(--radius);
            cursor: crosshair;
            background: #0d0d1a;
            border: 1px solid var(--glass-border);
        }
        /* ─── ANIMATED DOT ───────────────────── */
        .dot-pulse {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            animation: dotPulse 1s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(108, 92, 231, 0.7);
            }
            50% {
                box-shadow: 0 0 0 14px rgba(108, 92, 231, 0);
            }
        }
        /* ─── EXPLANATION PANEL ──────────────── */
        .explanation {
            background: var(--surface2);
            border-left: 3px solid var(--accent);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 12px 16px;
            font-size: 0.82rem;
            color: var(--text2);
            line-height: 1.6;
            margin: 8px 0;
        }
        .explanation strong {
            color: var(--accent2);
        }
        /* ─── TAB GROUP ──────────────────────── */
        .tab-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .tab-group button {
            all: unset;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text2);
            background: var(--surface2);
            transition: var(--transition);
            letter-spacing: -0.01em;
        }
        .tab-group button.active {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        .tab-group button:hover:not(.active) {
            background: var(--surface3);
            color: var(--text);
        }
        /* scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--surface3);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- ═══════════ SIDEBAR ═══════════ -->
    <aside id="sidebar">
        <div class="logo">Deep Learning Explorer<span>Interactive Education</span></div>
        <nav id="nav">
            <div class="nav-group">Foundations</div>
            <button data-module="0" class="active"><span class="mod-num">1</span> Single Neuron</button>
            <button data-module="1"><span class="mod-num">2</span> Learning</button>
            <button data-module="2"><span class="mod-num">3</span> Activation Explorer</button>
            <div class="nav-group">Deep Insights</div>
            <button data-module="3"><span class="mod-num">4</span> Linear Layers Fail</button>
            <button data-module="4"><span class="mod-num">5</span> Activation ON</button>
            <button data-module="5"><span class="mod-num">6</span> Universal Approx</button>
            <div class="nav-group">Network Internals</div>
            <button data-module="6"><span class="mod-num">7</span> Neuron Inspector</button>
            <button data-module="7"><span class="mod-num">8</span> Forward Prop</button>
            <button data-module="8"><span class="mod-num">9</span> Backpropagation</button>
            <div class="nav-group">Compare & Explore</div>
            <button data-module="9"><span class="mod-num">10</span> Activation Compare</button>
            <button data-module="10"><span class="mod-num">11</span> Loss Landscape</button>
            <button data-module="11"><span class="mod-num">12</span> Decision Boundary</button>
            <div class="nav-group">Create & Build</div>
            <button data-module="12"><span class="mod-num">13</span> Draw & Learn</button>
            <button data-module="13"><span class="mod-num">14</span> Network Builder</button>
            <button data-module="14"><span class="mod-num">15</span> UAT Visualization</button>
        </nav>
    </aside>

    <!-- ═══════════ MAIN ═══════════ -->
    <main id="main">
        <div class="module-header">
            <h1 id="module-title">Single Neuron Explorer</h1>
            <span class="badge" id="module-badge">Module 1</span>
        </div>
        <div id="module-content"></div>
    </main>

    <script>
        // ═══════════════════════════════════════════
        // DEEP LEARNING EXPLORER — COMPLETE APPLICATION
        // ═══════════════════════════════════════════

        // ─── UTILITY FUNCTIONS ─────────────────────
        const $ = (sel, ctx = document) => ctx.querySelector(sel);
        const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
        const rand = (lo, hi) => lo + Math.random() * (hi - lo);
        const randInt = (lo, hi) => Math.floor(rand(lo, hi + 1));

        // ─── ACTIVATION FUNCTIONS ──────────────────
        const Activations = {
            linear: { fn: x => x, dfn: x => 1, name: 'Linear', eq: 'f(x)=x' },
            relu: { fn: x => Math.max(0, x), dfn: x => x > 0 ? 1 : 0, name: 'ReLU', eq: 'f(x)=\\max(0,x)' },
            sigmoid: { fn: x => 1 / (1 + Math.exp(-x)), dfn: x => { const s = 1 / (1 + Math.exp(-x)); return s * (
                        1 - s); }, name: 'Sigmoid', eq: 'f(x)=\\frac{1}{1+e^{-x}}' },
            tanh: { fn: x => Math.tanh(x), dfn: x => { const t = Math.tanh(x); return 1 - t * t; }, name: 'Tanh',
                eq: 'f(x)=\\tanh(x)' },
            leaky_relu: { fn: x => x > 0 ? x : 0.01 * x, dfn: x => x > 0 ? 1 : 0.01, name: 'Leaky ReLU',
                eq: 'f(x)=\\max(0.01x,x)' },
            gelu: {
                fn: x => 0.5 * x * (1 + Math.tanh(Math.sqrt(2 / Math.PI) * (x + 0.044715 * x ** 3))),
                dfn: x => {
                    const c = Math.sqrt(2 / Math.PI);
                    const x3 = x ** 3;
                    const inner = c * (x + 0.044715 * x3);
                    const tanh_inner = Math.tanh(inner);
                    const sech2 = 1 - tanh_inner ** 2;
                    return 0.5 * (1 + tanh_inner) + 0.5 * x * sech2 * c * (1 + 3 * 0.044715 * x ** 2);
                },
                name: 'GELU',
                eq: 'f(x)=x\\Phi(x)'
            },
            swish: { fn: x => x / (1 + Math.exp(-x)), dfn: x => { const s = 1 / (1 + Math.exp(-x)); return s + x * s * (
                        1 - s); }, name: 'Swish', eq: 'f(x)=x\\cdot\\sigma(x)' },
            elu: { fn: x => x > 0 ? x : Math.exp(x) - 1, dfn: x => x > 0 ? 1 : Math.exp(x), name: 'ELU',
                eq: 'f(x)=\\max(0,x)+\\min(0,e^x-1)' },
        };

        // ─── NEURAL NETWORK CLASS ──────────────────
        class NeuralNetwork {
            constructor(layerSizes, activations) {
                this.layerSizes = layerSizes;
                this.activations = activations; // array of activation keys
                this.weights = [];
                this.biases = [];
                this._initParams();
            }
            _initParams() {
                this.weights = [];
                this.biases = [];
                for (let i = 0; i < this.layerSizes.length - 1; i++) {
                    const w = [];
                    const b = [];
                    for (let j = 0; j < this.layerSizes[i + 1]; j++) {
                        const row = [];
                        for (let k = 0; k < this.layerSizes[i]; k++) {
                            row.push(rand(-1, 1) * 0.5);
                        }
                        w.push(row);
                        b.push(rand(-0.3, 0.3));
                    }
                    this.weights.push(w);
                    this.biases.push(b);
                }
            }
            forward(input, returnAll = false) {
                let current = [...input];
                const allLayerOutputs = [current];
                const allPreActivations = [];
                for (let i = 0; i < this.weights.length; i++) {
                    const W = this.weights[i];
                    const b = this.biases[i];
                    const actKey = this.activations[i] || 'linear';
                    const act = Activations[actKey];
                    const next = [];
                    const preAct = [];
                    for (let j = 0; j < W.length; j++) {
                        let sum = b[j];
                        for (let k = 0; k < W[j].length; k++) {
                            sum += W[j][k] * current[k];
                        }
                        preAct.push(sum);
                        next.push(act.fn(sum));
                    }
                    allPreActivations.push(preAct);
                    allLayerOutputs.push(next);
                    current = next;
                }
                if (returnAll) return { output: current, layerOutputs: allLayerOutputs,
                    preActivations: allPreActivations };
                return current;
            }
            getFlatParams() {
                const params = [];
                for (const W of this.weights)
                    for (const row of W)
                        for (const v of row) params.push(v);
                for (const b of this.biases)
                    for (const v of b) params.push(v);
                return params;
            }
            setFlatParams(flat) {
                let idx = 0;
                for (const W of this.weights)
                    for (const row of W)
                        for (let k = 0; k < row.length; k++) row[k] = flat[idx++];
                for (const b of this.biases)
                    for (let j = 0; j < b.length; j++) b[j] = flat[idx++];
            }
            numParams() { return this.getFlatParams().length; }
            computeLoss(dataPoints) {
                let total = 0;
                for (const pt of dataPoints) {
                    const pred = this.forward([pt.x])[0];
                    total += (pred - pt.y) ** 2;
                }
                return total / dataPoints.length;
            }
            computeGradients(dataPoints) {
                const eps = 1e-6;
                const orig = this.getFlatParams();
                const grads = new Array(orig.length).fill(0);
                const baseLoss = this.computeLoss(dataPoints);
                for (let i = 0; i < orig.length; i++) {
                    const perturbed = [...orig];
                    perturbed[i] += eps;
                    this.setFlatParams(perturbed);
                    const newLoss = this.computeLoss(dataPoints);
                    grads[i] = (newLoss - baseLoss) / eps;
                }
                this.setFlatParams(orig);
                return grads;
            }
            trainStep(dataPoints, lr) {
                const grads = this.computeGradients(dataPoints);
                const params = this.getFlatParams();
                for (let i = 0; i < params.length; i++) params[i] -= lr * grads[i];
                this.setFlatParams(params);
                return { loss: this.computeLoss(dataPoints), grads, params: [...params] };
            }
        }

        // ─── MODULE 5: UNIVERSAL APPROXIMATION ──────
        function renderModule5() {
            const R = new ModuleRenderer();
            R.clear();
            R.title('Universal Approximation Theorem');
            R.badge('Module 6');

            const targetFns = {
                line: x => x,
                quadratic: x => x ** 2,
                absolute: x => Math.abs(x),
                sine: x => Math.sin(x * 2),
                cosine: x => Math.cos(x * 2),
                exponential: x => Math.exp(x) - 1,
                step: x => x > 0 ? 1 : -1,
            };

            const generateData = () => {
                const pts = [];
                const fn = targetFns[AppState.m6_targetFn] || targetFns['sine'];
                for (let i = -20; i <= 20; i++) {
                    const x = i / 10;
                    pts.push({ x, y: fn(x) });
                }
                AppState.m6_dataPoints = pts;
            };

            const buildAndTrain = () => {
                const sizes = [1];
                for (let i = 0; i < AppState.m6_hiddenLayers; i++) sizes.push(AppState.m6_neurons);
                sizes.push(1);
                const activations = Array(sizes.length - 1).fill('relu');
                activations[activations.length - 1] = 'linear';
                const nn = new NeuralNetwork(sizes, activations);
                // Train a bit
                const data = AppState.m6_dataPoints;
                for (let epoch = 0; epoch < 200; epoch++) {
                    nn.trainStep(data, 0.02);
                }
                AppState.m6_nn = nn;
                updateM6Plot();
            };

            const updateM6Plot = () => {
                const container = document.getElementById('m6-plot');
                if (!container || !AppState.m6_nn) return;
                const xs = [];
                const ysTarget = [];
                const ysPred = [];
                const fn = targetFns[AppState.m6_targetFn];
                const nn = AppState.m6_nn;
                for (let i = -30; i <= 30; i++) {
                    const x = i / 10;
                    xs.push(x);
                    ysTarget.push(fn(x));
                    ysPred.push(nn.forward([x])[0]);
                }
                const loss = nn.computeLoss(AppState.m6_dataPoints);
                const traceTarget = { x: xs, y: ysTarget, mode: 'lines', type: 'scatter', name: 'Target',
                    line: { color: '#ff6b6b', width: 3 } };
                const tracePred = { x: xs, y: ysPred, mode: 'lines', type: 'scatter', name: 'Prediction',
                    line: { color: '#a29bfe', width: 2.5 } };
                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: { color: '#b0b0c0' },
                    xaxis: { range: [-3, 3], gridcolor: '#2a2a3a' },
                    yaxis: { range: [-3, 3], gridcolor: '#2a2a3a' },
                    margin: { l: 50, r: 20, t: 30, b: 40 },
                    showlegend: true,
                    title: `Loss: ${loss.toFixed(5)}`,
                };
                Plotly.react(container, [traceTarget, tracePred], layout, { responsive: true });
                const lossEl = document.getElementById('m6-loss');
                if (lossEl) lossEl.textContent = loss.toFixed(5);
            };

            generateData();
            const html = `
            <div class="row">
              <div class="card" style="flex:2;">
                <div id="m6-plot" style="min-height:400px;"></div>
              </div>
              <div class="card" style="flex:1;">
                <h3>🎯 Target Function</h3>
                <select id="m6-target">
                  ${Object.keys(targetFns).map(k=>`<option value="${k}" ${k===AppState.m6_targetFn?'selected':''}>${k}</option>`).join('')}
                </select>
                <label>Neurons per hidden layer: <span id="lbl-m6-neurons">${AppState.m6_neurons}</span></label>
                <input type="range" id="m6-neurons" min="1" max="100" value="${AppState.m6_neurons}" step="1">
                <label>Hidden layers: <span id="lbl-m6-hlayers">${AppState.m6_hiddenLayers}</span></label>
                <input type="range" id="m6-hlayers" min="1" max="5" value="${AppState.m6_hiddenLayers}" step="1">
                <button class="btn green" id="m6-train" style="margin-top:12px;width:100%;">🚀 Train Network</button>
                <p style="margin-top:8px;">Loss: <strong id="m6-loss" style="color:#ff6b6b;">—</strong></p>
              </div>
            </div>
            ${R.explanation('The <strong>Universal Approximation Theorem</strong> states that a neural network with at least one hidden layer and nonlinear activation can approximate <strong>any continuous function</strong> on a compact domain, given enough neurons. Watch the prediction improve as you increase neurons!')}
          `;
            R.container.innerHTML = html;
            document.getElementById('m6-target').addEventListener('change', (e) => {
                AppState.m6_targetFn = e.target.value;
                generateData();
                buildAndTrain();
            });
            document.getElementById('m6-neurons').addEventListener('input', (e) => {
                AppState.m6_neurons = parseInt(e.target.value);
                document.getElementById('lbl-m6-neurons').textContent = AppState.m6_neurons;
            });
            document.getElementById('m6-hlayers').addEventListener('input', (e) => {
                AppState.m6_hiddenLayers = parseInt(e.target.value);
                document.getElementById('lbl-m6-hlayers').textContent = AppState.m6_hiddenLayers;
            });
            document.getElementById('m6-train').addEventListener('click', buildAndTrain);
            setTimeout(buildAndTrain, 400);
        }

        // ─── MODULE 7: FORWARD PROPAGATION ──────────
        function renderModule7() {
            const R = new ModuleRenderer();
            R.clear();
            R.title('Forward Propagation Animation');
            R.badge('Module 8');
            if (!AppState.m5_nn) AppState.m5_nn = new NeuralNetwork([1, 4, 4, 1], ['relu', 'relu', 'linear']);
            const nn = AppState.m5_nn;
            const canvasId = 'm8-canvas';
            const html = `
            <div class="card">
              <h3>▶️ Animate Values Flowing Forward</h3>
              <button class="btn green" id="m8-animate">▶ Play Animation</button>
              <button class="btn outline" id="m8-step">⏭ Step Forward</button>
              <label>Input x: <span id="lbl-m8-input">1.0</span></label>
              <input type="range" id="m8-input" min="-3" max="3" step="0.1" value="1.0">
            </div>
            <div class="card">
              <canvas id="${canvasId}" width="700" height="400" style="width:100%;border-radius:8px;background:#0d0d1a;"></canvas>
            </div>
            ${R.explanation('Watch values flow from input through each layer. Each neuron computes <strong>wx+b</strong> then applies the activation function. Numbers propagate forward layer by layer.')}
          `;
            R.container.innerHTML = html;
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            let animStep = -1;
            const allResults = [];

            const drawNetwork = (highlightLayer = -1) => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const layerSizes = [1, ...nn.layerSizes.slice(1)];
                const layerXs = layerSizes.map((_, i) => 80 + i * (560 / (layerSizes.length - 1)));
                // Draw connections
                for (let l = 0; l < layerSizes.length - 1; l++) {
                    for (let j = 0; j < layerSizes[l]; j++) {
                        for (let k = 0; k < layerSizes[l + 1]; k++) {
                            const x1 = layerXs[l];
                            const y1 = 60 + j * (280 / Math.max(layerSizes[l] - 1, 1));
                            const x2 = layerXs[l + 1];
                            const y2 = 60 + k * (280 / Math.max(layerSizes[l + 1] - 1, 1));
                            ctx.strokeStyle = highlightLayer === l ? '#a29bfe' : '#333';
                            ctx.lineWidth = highlightLayer === l ? 2 : 0.8;
                            ctx.beginPath();
                            ctx.moveTo(x1, y1);
                            ctx.lineTo(x2, y2);
                            ctx.stroke();
                            if (highlightLayer === l && allResults[l]) {
                                const val = allResults[l][k] || 0;
                                const mx = (x1 + x2) / 2;
                                const my = (y1 + y2) / 2;
                                ctx.fillStyle = '#ffd43b';
                                ctx.font = 'bold 10px monospace';
                                ctx.fillText(val.toFixed(2), mx - 15, my - 5);
                            }
                        }
                    }
                }
                // Draw neurons
                for (let l = 0; l < layerSizes.length; l++) {
                    for (let j = 0; j < layerSizes[l]; j++) {
                        const x = layerXs[l];
                        const y = 60 + j * (280 / Math.max(layerSizes[l] - 1, 1));
                        ctx.fillStyle = highlightLayer >= l ? '#6c5ce7' : '#1a1a2e';
                        ctx.strokeStyle = highlightLayer === l ? '#fff' : '#555';
                        ctx.lineWidth = highlightLayer === l ? 3 : 1.5;
                        ctx.beginPath();
                        ctx.arc(x, y, 18, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 10px monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText(l === 0 ? 'x' : `n${l},${j+1}`, x, y + 4);
                        if (highlightLayer >= l && allResults[l]) {
                            ctx.fillText(allResults[l][j]?.toFixed(2) || '', x, y - 22);
                        }
                    }
                }
            };

            const runAnimation = () => {
                const inputVal = parseFloat(document.getElementById('m8-input')?.value || 1);
                const result = nn.forward([inputVal], true);
                allResults.length = 0;
                allResults.push(...result.layerOutputs);
                animStep = 0;
                drawNetwork(-1);
                const interval = setInterval(() => {
                    if (animStep >= allResults.length) { clearInterval(interval);
                        animStep = -1;
                        drawNetwork(-1); return; }
                    drawNetwork(animStep);
                    animStep++;
                }, 600);
            };

            document.getElementById('m8-animate').addEventListener('click', runAnimation);
            document.getElementById('m8-step').addEventListener('click', () => {
                const inputVal = parseFloat(document.getElementById('m8-input')?.value || 1);
                const result = nn.forward([inputVal], true);
                allResults.length = 0;
                allResults.push(...result.layerOutputs);
                if (animStep < 0 || animStep >= allResults.length) animStep = 0;
                drawNetwork(animStep);
                animStep++;
            });
            document.getElementById('m8-input').addEventListener('input', (e) => {
                document.getElementById('lbl-m8-input').textContent = e.target.value;
                const result = nn.forward([parseFloat(e.target.value)], true);
                allResults.length = 0;
                allResults.push(...result.layerOutputs);
                animStep = allResults.length;
                drawNetwork(allResults.length - 1);
            });
            setTimeout(() => drawNetwork(-1), 200);
        }

        // ─── MODULE 8: BACKPROPAGATION ──────────────
        function renderModule8() {
            const R = new ModuleRenderer();
            R.clear();
            R.title('Backpropagation');
            R.badge('Module 9');
            if (!AppState.m2_nn) AppState.m2_nn = new NeuralNetwork([1, 1], ['linear']);
            const nn = AppState.m2_nn;
            const html = `
            <div class="card">
              <h3>📉 Gradient Descent Step</h3>
              <p style="font-family:var(--mono);font-size:0.8rem;">Loss = MSE(ŷ, y) = (ŷ−y)²</p>
              <p style="font-family:var(--mono);font-size:0.8rem;">∂Loss/∂w = 2(ŷ−y)·x &nbsp;&nbsp;|&nbsp;&nbsp; ∂Loss/∂b = 2(ŷ−y)</p>
              <p style="font-family:var(--mono);font-size:0.8rem;">w ← w − η·∂Loss/∂w &nbsp;&nbsp;|&nbsp;&nbsp; b ← b − η·∂Loss/∂b</p>
              <button class="btn green" id="m9-step">🔄 One Gradient Step</button>
              <button class="btn outline" id="m9-auto">▶ Auto (10 steps)</button>
            </div>

              ${R.valueDisplay([
                {label:'Weight', id:'m9-w', value:nn.weights[0][0][0].toFixed(4)},
                {label:'Bias', id:'m9-b', value:nn.biases[0][0].toFixed(4)},
                {label:'Loss', id:'m9-loss', value:nn.computeLoss(AppState.m2_dataPoints).toFixed(6)},
                {label:'∂Loss/∂w', id:'m9-gw', value:'—'},
                {label:'∂Loss/∂b', id:'m9-gb', value:'—'},
              ])}
            </div>
            ${R.explanation('<strong>Chain Rule in action:</strong> Gradients flow <strong>backward</strong> from the loss through each operation. Each weight is updated proportional to its contribution to the error. This is the heart of deep learning.')}
          `;
            R.container.innerHTML = html;

            const updateInfo = () => {
                const grads = nn.computeGradients(AppState.m2_dataPoints);
                const byId = (id) => document.getElementById(id);
                if (byId('m9-w')) byId('m9-w').textContent = nn.weights[0][0][0].toFixed(4);
                if (byId('m9-b')) byId('m9-b').textContent = nn.biases[0][0].toFixed(4);
                if (byId('m9-loss')) byId('m9-loss').textContent = nn.computeLoss(AppState.m2_dataPoints).toFixed(6);
                if (byId('m9-gw')) byId('m9-gw').textContent = grads[0].toFixed(6);
                if (byId('m9-gb')) byId('m9-gb').textContent = grads[1].toFixed(6);
            };

            document.getElementById('m9-step').addEventListener('click', () => {
                nn.trainStep(AppState.m2_dataPoints, AppState.m2_lr);
                updateInfo();
            });
            document.getElementById('m9-auto').addEventListener('click', () => {
                for (let i = 0; i < 10; i++) nn.trainStep(AppState.m2_dataPoints, AppState.m2_lr);
                updateInfo();
            });
            setTimeout(updateInfo, 200);
        }

        // ─── MODULE 10: LOSS LANDSCAPE ──────────────
        function renderModule10() {
            const R = new ModuleRenderer();
            R.clear();
            R.title('Loss Landscape');
            R.badge('Module 11');
            const html = `
            <div class="card">
              <h3>🏔️ 3D Loss Surface</h3>
              <div id="m11-plot" style="min-height:450px;"></div>
              <p style="font-size:0.8rem;color:var(--text2);">Loss = (w−1.5)² + (b+0.5)² + 2·sin(3w)·cos(2b) — a toy loss surface</p>
            </div>
            <div class="card">
              <label>Current w: <span id="lbl-m11-w">0.0</span> | Current b: <span id="lbl-m11-b">0.0</span></label>
              <button class="btn green" id="m11-step">⬇ Gradient Step</button>
              <label>Learning Rate: <span id="lbl-m11-lr">0.05</span></label>
              <input type="range" id="m11-lr" min="0.01" max="0.3" step="0.01" value="0.05">
            </div>
          `;
            R.container.innerHTML = html;
            let w = 2.5,
                b = -1.8;
            const lossFn = (ww, bb) => (ww - 1.5) ** 2 + (bb + 0.5) ** 2 + 2 * Math.sin(3 * ww) * Math.cos(2 * bb);

            const updateSurface = () => {
                const container = document.getElementById('m11-plot');
                if (!container) return;
                const wVals = [],
                    bVals = [],
                    zVals = [];
                const n = 40;
                for (let i = 0; i < n; i++) wVals.push(-3 + (i / (n - 1)) * 6);
                for (let j = 0; j < n; j++) bVals.push(-3 + (j / (n - 1)) * 6);
                for (let i = 0; i < n; i++) {
                    const row = [];
                    for (let j = 0; j < n; j++) row.push(lossFn(wVals[i], bVals[j]));
                    zVals.push(row);
                }
                const trace = {
                    type: 'surface',
                    x: bVals,
                    y: wVals,
                    z: zVals,
                    colorscale: 'Viridis',
                    contours: { z: { show: true, usecolormap: true, project: { z: true } } },
                };
                const tracePoint = {
                    type: 'scatter3d',
                    mode: 'markers',
                    x: [b],
                    y: [w],
                    z: [lossFn(w, b)],
                    marker: { color: '#ff6b6b', size: 8 },
                };
                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    scene: {
                        xaxis: { title: 'bias b', gridcolor: '#333' },
                        yaxis: { title: 'weight w', gridcolor: '#333' },
                        zaxis: { title: 'Loss', gridcolor: '#333' },
                        bgcolor: 'rgba(0,0,0,0)',
                    },
                    margin: { l: 0, r: 0, t: 20, b: 0 },
                    font: { color: '#b0b0c0', size: 10 },
                };
                Plotly.react(container, [trace, tracePoint], layout, { responsive: true });
                document.getElementById('lbl-m11-w').textContent = w.toFixed(3);
                document.getElementById('lbl-m11-b').textContent = b.toFixed(3);
            };

            document.getElementById('m11-step').addEventListener('click', () => {
                const lr = parseFloat(document.getElementById('m11-lr').value);
                const eps = 1e-6;
                const gradW = (lossFn(w + eps, b) - lossFn(w - eps, b)) / (2 * eps);
                const gradB = (lossFn(w, b + eps) - lossFn(w, b - eps)) / (2 * eps);
                w -= lr * gradW;
                b -= lr * gradB;
                updateSurface();
            });
            document.getElementById('m11-lr').addEventListener('input', (e) => {
                document.getElementById('lbl-m11-lr').textContent = e.target.value;
            });
            setTimeout(updateSurface, 500);
        }

        // ─── MODULE 11: DECISION BOUNDARY ────────────
        function renderModule11() {
            const R = new ModuleRenderer();
            R.clear();
            R.title('Decision Boundary Explorer');
            R.badge('Module 12');

            const datasets = {
                xor: () => [{ x: 0, y: 0, label: 0 }, { x: 1, y: 1, label: 0 }, { x: 0, y: 1, label: 1 }, { x: 1, y: 0,
                    label: 1 }],
                moons: () => {
                    const pts = [];
                    for (let i = 0; i < 60; i++) {
                        const angle = rand(0, Math.PI);
                        const r = 0.6 + rand(-0.1, 0.1);
                        pts.push({ x: 0.5 + r * Math.cos(angle), y: 0.5 + r * Math.sin(angle), label: 0 });
                        pts.push({ x: 0.5 + r * Math.cos(angle + Math.PI), y: 0.2 + r * Math.sin(angle + Math.PI),
                            label: 1 });
                    }
                    return pts;
                },
                circles: () => {
                    const pts = [];
                    for (let i = 0; i < 50; i++) {
                        const a = rand(0, Math.PI * 2);
                        const r = rand(0, 0.3);
                        pts.push({ x: 0.5 + r * Math.cos(a), y: 0.5 + r * Math.sin(a), label: 0 });
                        const r2 = rand(0.4, 0.7);
                        pts.push({ x: 0.5 + r2 * Math.cos(a), y: 0.5 + r2 * Math.sin(a), label: 1 });
                    }
                    return pts;
                },
                gaussian: () => {
                    const pts = [];
                    for (let i = 0; i < 50; i++) {
                        pts.push({ x: rand(0.2, 0.45), y: rand(0.3, 0.7), label: 0 });
                        pts.push({ x: rand(0.55, 0.8), y: rand(0.3, 0.7), label: 1 });
                    }
                    return pts;
                },
                spiral: () => {
                    const pts = [];
                    for (let i = 0; i < 50; i++) {
                        const t = (i / 49) * Math.PI * 3;
                        const r = t / (Math.PI * 3);
                        pts.push({ x: 0.5 + 0.35 * r * Math.cos(t), y: 0.5 + 0.35 * r * Math.sin(t), label: 0 });
                        pts.push({ x: 0.5 + 0.35 * r * Math.cos(t + Math.PI), y: 0.5 + 0.35 * r * Math.sin(t + Math
                            .PI), label: 1 });
                    }
                    return pts;
                },
            };

            const html = `
            <div class="row">
              <div class="card" style="flex:2;">
                <canvas id="decision-canvas" width="500" height="500" style="width:100%;max-width:500px;"></canvas>
              </div>
              <div class="card" style="flex:1;">
                <h3>📊 Dataset</h3>
                <select id="m12-dataset">
                  ${Object.keys(datasets).map(k=>`<option value="${k}" ${k===AppState.m12_dataset?'selected':''}>${k}</option>`).join('')}
                </select>
                <button class="btn green" id="m12-train" style="margin-top:8px;width:100%;">🚀 Train</button>
                <button class="btn outline" id="m12-reset" style="width:100%;">↺ Reset</button>
                <p style="margin-top:8px;font-size:0.75rem;">Loss: <strong id="m12-loss">—</strong></p>
              </div>
            </div>
            ${R.explanation('The <strong>decision boundary</strong> is the line (or curve) where the network changes its prediction from one class to another. Nonlinear activations allow <strong>curved boundaries</strong>.')}
          `;
            R.container.innerHTML = html;

            const canvas = document.getElementById('decision-canvas');
            const ctx = canvas.getContext('2d');
            let currentPoints = [];
            let nn12 = null;

            const drawDecision = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // Draw decision boundary
                if (nn12) {
                    const imageData = ctx.createImageData(canvas.width, canvas.height);
                    for (let px = 0; px < canvas.width; px++) {
                        for (let py = 0; py < canvas.height; py++) {
                            const x = px / canvas.width;
                            const y = 1 - py / canvas.height;
                            const pred = nn12.forward([x, y])[0];
                            const idx = (py * canvas.width + px) * 4;
                            const val = clamp(pred, 0, 1);
                            imageData.data[idx] = Math.round(val * 180 + 30);
                            imageData.data[idx + 1] = Math.round((1 - val) * 100 + 40);
                            imageData.data[idx + 2] = Math.round(val * 60 + (1 - val) * 180);
                            imageData.data[idx + 3] = 200;
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                }
                // Draw points
                for (const pt of currentPoints) {
                    ctx.fillStyle = pt.label === 1 ? '#ff6b6b' : '#4dabf7';
                    ctx.beginPath();
                    ctx.arc(pt.x * canvas.width, (1 - pt.y) * canvas.height, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            };

            const trainM12 = () => {
                nn12 = new NeuralNetwork([2, 8, 8, 1], ['relu', 'relu', 'sigmoid']);
                const pts = currentPoints;
                for (let epoch = 0; epoch < 300; epoch++) {
                    nn12.trainStep(pts, 0.05);
                }
                const loss = nn12.computeLoss(pts);
                document.getElementById('m12-loss').textContent = loss.toFixed(5);
                drawDecision();
            };

            const loadDataset = (name) => {
                currentPoints = datasets[name]();
                nn12 = null;
                drawDecision();
                document.getElementById('m12-loss').textContent = '—';
            };

            document.getElementById('m12-dataset').addEventListener('change', (e) => {
                AppState.m12_dataset = e.target.value;
                loadDataset(e.target.value);
            });
            document.getElementById('m12-train').addEventListener('click', trainM12);
            document.getElementById('m12-reset').addEventListener('click', () => loadDataset(AppState.m12_dataset));
            loadDataset(AppState.m12_dataset);
        }

        // ─── MODULE 14: UAT VISUALIZATION ────────────
        function renderModule14() {
            const R = new ModuleRenderer();
            R.clear();
            R.title('Universal Approximation Visualization');
            R.badge('Module 15');
            const html = `
            <div class="card">
              <h3>🌈 Each Neuron Contributes a Nonlinear Piece</h3>
              <div id="m15-plot" style="min-height:450px;"></div>
              <button class="btn green" id="m15-randomize">🎲 New Random Network</button>

            </div>
            ${R.explanation('<strong>This is the heart of deep learning:</strong> Many nonlinear neurons, each contributing a <strong>colored piece</strong>, sum together to approximate complex functions. The <strong>Universal Approximation Theorem</strong> guarantees this works for any continuous function.')}
          `;
            R.container.innerHTML = html;

            const updateM15 = () => {
                const nNeurons = parseInt(document.getElementById('m15-neurons')?.value || 8);
                document.getElementById('lbl-m15-neurons').textContent = nNeurons;
                const nn = new NeuralNetwork([1, nNeurons, 1], ['relu', 'linear']);
                const container = document.getElementById('m15-plot');
                if (!container) return;
                const xs = [];
                for (let i = -30; i <= 30; i++) xs.push(i / 10);
                const traces = [];
                const colors = ['#ff6b6b', '#ffa94d', '#ffd43b', '#00d2a0', '#4dabf7', '#a29bfe', '#f06595',
                    '#22b8cf', '#ff8787', '#74c0fc'
                ];
                // Get individual neuron contributions
                const hiddenOuts = [];
                for (const x of xs) {
                    const res = nn.forward([x], true);
                    hiddenOuts.push(res.layerOutputs[1]); // hidden layer outputs
                }
                // Each hidden neuron's contribution (multiplied by output weight)
                for (let j = 0; j < nNeurons; j++) {
                    const contribs = hiddenOuts.map((ho, i) => ho[j] * nn.weights[1][0][j]);
                    traces.push({
                        x: xs,
                        y: contribs,
                        mode: 'lines',
                        type: 'scatter',
                        name: `Neuron ${j+1}`,
                        line: { color: colors[j % colors.length], width: 1.5, opacity: 0.7 },
                    });
                }
                // Final output
                const finalOuts = xs.map(x => nn.forward([x])[0]);
                traces.push({
                    x: xs,
                    y: finalOuts,
                    mode: 'lines',
                    type: 'scatter',
                    name: 'Final Output (Sum)',
                    line: { color: '#fff', width: 3.5 },
                });
                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: { color: '#b0b0c0', size: 10 },
                    xaxis: { range: [-3, 3], gridcolor: '#2a2a3a', title: 'x' },
                    yaxis: { range: [-4, 4], gridcolor: '#2a2a3a', title: 'y' },
                    margin: { l: 50, r: 20, t: 30, b: 40 },
                    showlegend: nNeurons <= 15,
                    legend: { font: { size: 8 } },
                };
                Plotly.react(container, traces, layout, { responsive: true });
            };

            document.getElementById('m15-randomize').addEventListener('click', updateM15);
            document.getElementById('m15-neurons').addEventListener('input', updateM15);
            setTimeout(updateM15, 400);
        }

            renderModule8, // Backpropagation
            renderModule9, // Activation Comparison
            renderModule10, // Loss Landscape
            renderModule11, // Decision Boundary
            renderModule12, // Draw & Learn
            renderModule13, // Network Builder
            renderModule14, // UAT Visualization
        ];

        function navigateToModule(index) {
            AppState.currentModule = index;
            // Update sidebar
            $$('#nav button').forEach(b => b.classList.remove('active'));
            const btn = document.querySelector(`#nav button[data-module="${index}"]`);
            if (btn) btn.classList.add('active');
            // Render
            if (moduleRenderers[index]) {
                moduleRenderers[index]();
            }
            // Scroll to top
            document.getElementById('main').scrollTop = 0;
        }

        // ─── INIT ────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            // Bind navigation
            $$('#nav button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const modIdx = parseInt(btn.dataset.module);
                    navigateToModule(modIdx);
                });
            });
            // Start with module 0
            navigateToModule(0);
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey || e.metaKey || e.target.tagName === 'INPUT' || e.target.tagName ===
                    'SELECT') return;
                const num = parseInt(e.key);
                if (num >= 1 && num <= 9 && moduleRenderers[num - 1]) {
                    navigateToModule(num - 1);
                }
                if (e.key === 'ArrowRight' && AppState.currentModule < moduleRenderers.length - 1) {
                    navigateToModule(AppState.currentModule + 1);
                }
                if (e.key === 'ArrowLeft' && AppState.currentModule > 0) {
                    navigateToModule(AppState.currentModule - 1);
                }
            });
            console.log('🧠 Deep Learning Explorer — Ready');
            console.log('  Navigate: sidebar clicks | keys 1-9 | Arrow keys');
            console.log('  All 15 modules loaded and interactive.');
            console.log('  Plotly.js + MathJax + Vanilla JS — no frameworks.');
        });
    </script>
</body>
</html>
